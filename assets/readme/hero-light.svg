<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 284" role="img" aria-label="365 Days of AI Mastery: nine standalone courses, 365 of 365 days complete, one lesson and one runnable lab every day.">
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .b{font-size:11.5px;font-weight:700}.xs{font-size:9.5px;letter-spacing:.06em}
    .cap{font-size:10px;font-weight:700;letter-spacing:.18em}
    @keyframes arc{from{stroke-dashoffset:389.6}to{stroke-dashoffset:0.0}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes glow{0%,100%{opacity:.18}50%{opacity:.4}}
    .arc{animation:arc 2.4s cubic-bezier(.22,.9,.3,1) both}
    .ticks{animation:spin 60s linear infinite;transform-origin:0 0}
    .vrow{animation:pulse 4.2s ease-in-out infinite}.v1{animation-delay:1.4s}.v2{animation-delay:2.8s}
    .fill{animation:grow 1.6s ease-out both;transform-origin:left center}
    .f1{animation-delay:.2s}.f2{animation-delay:.4s}.f3{animation-delay:.6s}
    .glow{animation:glow 4.4s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}
      .arc{stroke-dashoffset:0.0}.fill{transform:none}}
  </style>
  <defs><radialGradient id="g-light">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity=".34"/>
    <stop offset="60%" stop-color="#38bdf8" stop-opacity=".10"/>
    <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></radialGradient></defs>
  <rect width="880" height="284" rx="18" fill="#fbfcff"/>
  <circle class="glow" cx="440" cy="142" r="120" fill="url(#g-light)"/>
  <text x="24"  y="36" class="mono cap" fill="#5a6b8c">NINE COURSES</text>
  <text x="386" y="36" class="mono cap" fill="#38bdf8">ONE YEAR</text>
  <text x="600" y="36" class="mono cap" fill="#22c55e">EVERY DAY</text>
  
    <g class="row">
      <rect x="24" y="66" width="248" height="34" rx="9" fill="#ffffff" stroke="#dfe6f5"/>
      <text x="38" y="81" class="mono b" fill="#0f1729">Computing Foundations</text>
      <rect x="38" y="88" width="212" height="4" rx="2" fill="#dfe6f5"/>
      <rect class="fill f0" x="38" y="88" width="212" height="4" rx="2" fill="#22c55e"/>
      <text x="256" y="81" text-anchor="end" class="mono xs" fill="#22c55e">42/42</text>
    </g>
    <g class="row">
      <rect x="24" y="110" width="248" height="34" rx="9" fill="#ffffff" stroke="#dfe6f5"/>
      <text x="38" y="125" class="mono b" fill="#0f1729">Programming with Python</text>
      <rect x="38" y="132" width="212" height="4" rx="2" fill="#dfe6f5"/>
      <rect class="fill f1" x="38" y="132" width="212" height="4" rx="2" fill="#22c55e"/>
      <text x="256" y="125" text-anchor="end" class="mono xs" fill="#22c55e">56/56</text>
    </g>
    <g class="row">
      <rect x="24" y="154" width="248" height="34" rx="9" fill="#ffffff" stroke="#dfe6f5"/>
      <text x="38" y="169" class="mono b" fill="#0f1729">Math, Statistics, and Data</text>
      <rect x="38" y="176" width="212" height="4" rx="2" fill="#dfe6f5"/>
      <rect class="fill f2" x="38" y="176" width="212" height="4" rx="2" fill="#22c55e"/>
      <text x="256" y="169" text-anchor="end" class="mono xs" fill="#22c55e">42/42</text>
    </g>
    <g class="row">
      <rect x="24" y="198" width="248" height="34" rx="9" fill="#ffffff" stroke="#dfe6f5"/>
      <text x="38" y="213" class="mono b" fill="#0f1729">Machine Learning</text>
      <rect x="38" y="220" width="212" height="4" rx="2" fill="#dfe6f5"/>
      <rect class="fill f3" x="38" y="220" width="212" height="4" rx="2" fill="#22c55e"/>
      <text x="256" y="213" text-anchor="end" class="mono xs" fill="#22c55e">56/56</text>
    </g>
  <g transform="translate(440 146)">
    <g class="ticks" opacity=".5">
      <circle r="75" fill="none" stroke="#dfe6f5" stroke-width="6" stroke-dasharray="1 7.28"/>
    </g>
    <circle r="62" fill="none" stroke="#dfe6f5" stroke-width="9"/>
    <circle class="arc" r="62" fill="none" stroke="#1d4ed8" stroke-width="9" stroke-linecap="round"
            stroke-dasharray="389.6" transform="rotate(-90)"/>
    <text y="-2" text-anchor="middle" class="sans" font-size="30" font-weight="800" fill="#0f1729">365</text>
    <text y="20" text-anchor="middle" class="mono xs" fill="#5a6b8c">OF 365 DAYS</text>
  </g>
  <text x="440" y="248" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#0f1729">365 Days of AI Mastery</text>
  <text x="440" y="264" text-anchor="middle" class="mono xs" fill="#5a6b8c">HOW A COMPUTER WORKS · TO SHIPPING PRODUCTION AI</text>
  
    <g class="vrow v0">
      <rect x="600" y="84" width="248" height="34" rx="9" fill="#ffffff" stroke="#dfe6f5"/>
      <circle cx="618" cy="101" r="4.5" fill="#38bdf8"/>
      <text x="632" y="98" class="mono b" fill="#38bdf8">one lesson</text>
      <text x="632" y="111" class="mono xs" fill="#5a6b8c">written to be read once</text>
    </g>
    <g class="vrow v1">
      <rect x="600" y="128" width="248" height="34" rx="9" fill="#ffffff" stroke="#dfe6f5"/>
      <circle cx="618" cy="145" r="4.5" fill="#22c55e"/>
      <text x="632" y="142" class="mono b" fill="#22c55e">one lab</text>
      <text x="632" y="155" class="mono xs" fill="#5a6b8c">that actually runs</text>
    </g>
    <g class="vrow v2">
      <rect x="600" y="172" width="248" height="34" rx="9" fill="#ffffff" stroke="#dfe6f5"/>
      <circle cx="618" cy="189" r="4.5" fill="#f59e0b"/>
      <text x="632" y="186" class="mono b" fill="#f59e0b">one output</text>
      <text x="632" y="199" class="mono xs" fill="#5a6b8c">captured from a real run</text>
    </g>
</svg>