<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">365 Days of AI Mastery — one year, nine courses, every day</title>
  <desc id="heroDesc">Banner for the 365 Days of AI Mastery course repository: a year-long path from how a computer works to shipping production AI systems, delivered as nine standalone courses with one lesson and one hands-on lab every day.</desc>

  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220" />
      <stop offset="55%" stop-color="#0f1a2e" />
      <stop offset="100%" stop-color="#111c33" />
    </linearGradient>
    <linearGradient id="heroRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="heroAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <pattern id="heroGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.55" />
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="url(#heroBg)" />
  <rect width="1280" height="360" fill="url(#heroGrid)" />
  <rect width="1280" height="5" fill="url(#heroRule)" />

  <g transform="translate(72, 96)">
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" letter-spacing="3.5" fill="#7dd3fc">ONE YEAR · NINE COURSES · EVERY DAY</text>
    <text x="0" y="72" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="62" font-weight="800" fill="#f8fafc">365 Days of AI Mastery</text>
    <text x="0" y="118" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="600" fill="url(#heroAccent)">From how a computer works to shipping production AI systems.</text>
    <text x="0" y="158" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#94a3b8">One substantial lesson and one hands-on lab every single day. No prerequisites</text>
    <text x="0" y="182" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#94a3b8">beyond curiosity, and every lab runs on free and open-source tools.</text>
  </g>

  <g transform="translate(72, 300)" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">
    <g>
      <rect x="0" y="-20" width="122" height="30" rx="15" fill="#1e293b" stroke="#334155" />
      <text x="61" y="0" text-anchor="middle" fill="#7dd3fc">365 lessons</text>
    </g>
    <g transform="translate(134,0)">
      <rect x="0" y="-20" width="112" height="30" rx="15" fill="#1e293b" stroke="#334155" />
      <text x="56" y="0" text-anchor="middle" fill="#c4b5fd">365 labs</text>
    </g>
    <g transform="translate(258,0)">
      <rect x="0" y="-20" width="128" height="30" rx="15" fill="#1e293b" stroke="#334155" />
      <text x="64" y="0" text-anchor="middle" fill="#86efac">52 projects</text>
    </g>
    <g transform="translate(398,0)">
      <rect x="0" y="-20" width="150" height="30" rx="15" fill="#1e293b" stroke="#334155" />
      <text x="75" y="0" text-anchor="middle" fill="#fbbf24">9 courses</text>
    </g>
    <g transform="translate(560,0)">
      <rect x="0" y="-20" width="196" height="30" rx="15" fill="#1e293b" stroke="#334155" />
      <text x="98" y="0" text-anchor="middle" fill="#f0abfc">free and open source</text>
    </g>
  </g>

  <g transform="translate(1010, 168)" opacity="0.95">
    <circle cx="0" cy="0" r="104" fill="none" stroke="#1e40af" stroke-width="2" opacity="0.6" />
    <circle cx="0" cy="0" r="78" fill="none" stroke="#4338ca" stroke-width="2" opacity="0.5" />
    <circle cx="0" cy="0" r="52" fill="none" stroke="#7c3aed" stroke-width="2" opacity="0.45" />
    <text x="0" y="-6" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="46" font-weight="800" fill="#f8fafc">365</text>
    <text x="0" y="24" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" letter-spacing="2" fill="#93c5fd">DAYS</text>
    <circle cx="0" cy="-104" r="7" fill="#38bdf8" />
    <circle cx="74" cy="74" r="7" fill="#a855f7" />
    <circle cx="-74" cy="74" r="7" fill="#34d399" />
  </g>
</svg>
