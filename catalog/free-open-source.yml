title: Free & Open-Source Stack
description: >-
  A fully free and open-source path through the course: every required tool, library, and model
  here can be used without paying anything, so no learner is blocked by cost. Licensing details
  are checked against official sources and stamped with a last_verified date.
entries:
  - name: Python
    url: https://www.python.org
    category: Programming language
    license: PSF License
    pricing: Free
    notes: The course's primary language, fully free and open source.
    last_verified: '2026-07-12'
  - name: Ollama
    url: https://ollama.com
    category: Local LLM runner
    license: MIT
    pricing: Free
    notes: Lets learners run open-weight LLMs on their own machine instead of paying for API access.
    last_verified: '2026-07-12'
  - name: llama.cpp
    url: https://github.com/ggml-org/llama.cpp
    category: LLM inference
    license: MIT
    pricing: Free
    notes: Quantized local inference engine that runs open models on modest consumer hardware.
    last_verified: '2026-07-12'
  - name: Jupyter
    url: https://jupyter.org
    category: Notebooks
    license: BSD-3-Clause
    pricing: Free
    notes: Free notebook environment for all data analysis and machine learning coursework.
    last_verified: '2026-07-12'
  - name: SQLite
    url: https://sqlite.org
    category: Database
    license: Public domain
    pricing: Free
    notes: Zero-configuration embedded database used for the SQL weeks and course data pipelines.
    last_verified: '2026-07-12'
  - name: PostgreSQL
    url: https://www.postgresql.org
    category: Database
    license: PostgreSQL License
    pricing: Free
    notes: Full-featured open-source relational database for learners who want a server-grade option.
    last_verified: '2026-07-12'
  - name: Code - OSS (VS Code open-source build)
    url: https://github.com/microsoft/vscode
    category: Code editor
    license: MIT
    pricing: Free
    notes: The MIT-licensed open-source codebase that Visual Studio Code is built from.
    last_verified: '2026-07-12'
  - name: Git
    url: https://git-scm.com
    category: Version control
    license: GPL-2.0
    pricing: Free
    notes: Free, open-source version control used for every project in the course.
    last_verified: '2026-07-12'
  - name: scikit-learn
    url: https://scikit-learn.org
    category: Machine learning
    license: BSD-3-Clause
    pricing: Free
    notes: Open-source library covering the entire classical machine learning section.
    last_verified: '2026-07-12'
  - name: PyTorch
    url: https://pytorch.org
    category: Deep learning
    license: BSD-3-Clause
    pricing: Free
    notes: Open-source deep learning framework for all neural network training in the course.
    last_verified: '2026-07-12'
  - name: Hugging Face open models
    url: https://huggingface.co/models
    category: Model hub
    license: Varies by model (check each model card)
    pricing: Free to download and run locally
    notes: Thousands of freely downloadable models covering text, vision, speech, and embeddings.
    last_verified: '2026-07-12'
  - name: Whisper
    url: https://github.com/openai/whisper
    category: Speech-to-text
    license: MIT
    pricing: Free
    notes: Open-source speech recognition that keeps the multimodal project weeks cost-free.
    last_verified: '2026-07-12'
  - name: DuckDB
    url: https://duckdb.org
    category: Database / analytics
    license: MIT
    pricing: Free
    notes: In-process analytical database that is a fast, free option for the data analysis weeks.
    last_verified: '2026-07-12'
  - name: Docker Engine
    url: https://docs.docker.com/engine/
    category: Containers
    license: Apache-2.0
    pricing: Free
    notes: The open-source container runtime is free; note that Docker Desktop (the GUI app) is proprietary and requires a paid subscription for larger organizations.
    last_verified: '2026-07-12'
  - name: MLflow
    url: https://mlflow.org
    category: Experiment tracking
    license: Apache-2.0
    pricing: Free
    notes: Open-source experiment tracking that can be self-hosted as a free alternative to paid services.
    last_verified: '2026-07-12'
