title: Libraries & Frameworks
description: >-
  The Python libraries and frameworks the course builds with, spanning data analysis, classical
  machine learning, deep learning, web services, and LLM tooling. Entries are checked against
  each project's official site or repository, with last_verified recording the review date.
entries:
  - name: NumPy
    url: https://numpy.org
    category: Numerical computing
    license: BSD-3-Clause
    pricing: Free
    notes: Array and linear algebra library underpinning the math and neural-networks-from-scratch weeks.
    last_verified: '2026-07-12'
  - name: pandas
    url: https://pandas.pydata.org
    category: Data analysis
    license: BSD-3-Clause
    pricing: Free
    notes: DataFrame library used throughout the data wrangling and exploratory analysis weeks.
    last_verified: '2026-07-12'
  - name: Matplotlib
    url: https://matplotlib.org
    category: Visualization
    license: Matplotlib license (BSD-compatible)
    pricing: Free
    notes: Core plotting library taught in the data visualization week and used across the course.
    last_verified: '2026-07-12'
  - name: scikit-learn
    url: https://scikit-learn.org
    category: Machine learning
    license: BSD-3-Clause
    pricing: Free
    notes: The course's primary library for classical machine learning models, pipelines, and evaluation.
    last_verified: '2026-07-12'
  - name: PyTorch
    url: https://pytorch.org
    category: Deep learning
    license: BSD-3-Clause
    pricing: Free
    notes: Deep learning framework used for all neural network training in the deep learning section.
    last_verified: '2026-07-12'
  - name: Hugging Face Transformers
    url: https://github.com/huggingface/transformers
    category: Deep learning / NLP
    license: Apache-2.0
    pricing: Free
    notes: Library for loading and fine-tuning pretrained transformer models, used in the transformers week.
    last_verified: '2026-07-12'
  - name: FastAPI
    url: https://fastapi.tiangolo.com
    category: Web framework
    license: MIT
    pricing: Free
    notes: Async Python web framework used to serve models and build AI application backends.
    last_verified: '2026-07-12'
  - name: Flask
    url: https://flask.palletsprojects.com
    category: Web framework
    license: BSD-3-Clause
    pricing: Free
    notes: Lightweight Python web framework covered as an alternative for small web services.
    last_verified: '2026-07-12'
  - name: pytest
    url: https://docs.pytest.org
    category: Testing
    license: MIT
    pricing: Free
    notes: The course's test framework, introduced in the testing and code quality week.
    last_verified: '2026-07-12'
  - name: pydantic
    url: https://docs.pydantic.dev
    category: Data validation
    license: MIT
    pricing: Free
    notes: Validation library used for data pipelines and API schemas from the databases section onward.
    last_verified: '2026-07-12'
  - name: SQLAlchemy
    url: https://www.sqlalchemy.org
    category: Database / ORM
    license: MIT
    pricing: Free
    notes: SQL toolkit and ORM used in the data formats and pipelines week.
    last_verified: '2026-07-12'
  - name: LangChain
    url: https://www.langchain.com
    category: LLM framework
    license: MIT
    pricing: Free (open-source library); paid hosted products available
    notes: LLM application framework discussed in the agent frameworks lesson as one option among several.
    last_verified: '2026-07-12'
  - name: Anthropic Python SDK
    url: https://github.com/anthropics/anthropic-sdk-python
    category: LLM SDK
    license: MIT
    pricing: Free (API usage billed separately)
    notes: Official Python client for the Claude API, used from the LLM APIs week onward.
    last_verified: '2026-07-12'
  - name: Model Context Protocol Python SDK
    url: https://github.com/modelcontextprotocol/python-sdk
    category: LLM SDK
    license: MIT
    pricing: Free
    notes: Official SDK for building MCP servers and clients, used in the Model Context Protocol week.
    last_verified: '2026-07-12'
  - name: vLLM
    url: https://github.com/vllm-project/vllm
    category: LLM inference
    license: Apache-2.0
    pricing: Free
    notes: High-throughput inference engine covered in the serving-open-models lessons.
    last_verified: '2026-07-12'
  - name: llama.cpp
    url: https://github.com/ggml-org/llama.cpp
    category: LLM inference
    license: MIT
    pricing: Free
    notes: C/C++ engine for quantized local LLM inference, taught in the customizing-and-running-models week.
    last_verified: '2026-07-12'
