title: Developer & AI Tools
description: >-
  The developer and AI tools used across the 365 Days of AI course, from version control and
  editors to local model runners and experiment tracking. Each entry is checked against the
  tool's official site, and the last_verified date records when it was last reviewed.
entries:
  - name: Git
    url: https://git-scm.com
    category: Version control
    license: GPL-2.0
    pricing: Free
    notes: Distributed version control system used from Week 5 onward for every project in the course.
    last_verified: '2026-07-12'
  - name: GitHub
    url: https://github.com
    category: Code hosting
    license: Proprietary
    pricing: Free tier + paid plans
    notes: Hosting platform for repositories, pull requests, and code review used throughout the course.
    last_verified: '2026-07-12'
  - name: Visual Studio Code
    url: https://code.visualstudio.com
    category: Code editor
    license: Proprietary (built on MIT-licensed Code - OSS)
    pricing: Free
    notes: The course's default code editor, covered in the editor and tooling week.
    last_verified: '2026-07-12'
  - name: Claude Code
    url: https://claude.com/claude-code
    category: AI coding agent
    license: Proprietary
    pricing: Included with paid Claude plans or usage-based API pricing
    notes: Anthropic's terminal-based AI coding agent, used in the AI coding agents week and beyond.
    last_verified: '2026-07-12'
  - name: Docker
    url: https://www.docker.com
    category: Containers
    license: Apache-2.0 (Engine); Proprietary (Desktop)
    pricing: Free for personal use; paid subscription required for larger organizations using Docker Desktop
    notes: Container platform used to package and deploy course applications in the deployment section.
    last_verified: '2026-07-12'
  - name: Jupyter
    url: https://jupyter.org
    category: Notebooks
    license: BSD-3-Clause
    pricing: Free
    notes: Interactive notebook environment used for data analysis and machine learning work.
    last_verified: '2026-07-12'
  - name: Ollama
    url: https://ollama.com
    category: Local LLM runner
    license: MIT
    pricing: Free
    notes: Runs open-weight language models locally, used in the local models week.
    last_verified: '2026-07-12'
  - name: curl
    url: https://curl.se
    category: HTTP client
    license: curl license (MIT-style)
    pricing: Free
    notes: Command-line tool for making HTTP requests, used throughout the networking and API weeks.
    last_verified: '2026-07-12'
  - name: Homebrew
    url: https://brew.sh
    category: Package manager
    license: BSD-2-Clause
    pricing: Free
    notes: macOS/Linux package manager used to install course tooling, covered in the command-line week.
    last_verified: '2026-07-12'
  - name: Python
    url: https://www.python.org
    category: Programming language
    license: PSF License
    pricing: Free
    notes: The course's primary programming language, taught from Week 7 onward.
    last_verified: '2026-07-12'
  - name: Node.js
    url: https://nodejs.org
    category: JavaScript runtime
    license: MIT
    pricing: Free
    notes: JavaScript runtime used for course site tooling and some full-stack application work.
    last_verified: '2026-07-12'
  - name: SQLite
    url: https://sqlite.org
    category: Database
    license: Public domain
    pricing: Free
    notes: Embedded relational database used in the SQL and data-pipeline weeks.
    last_verified: '2026-07-12'
  - name: Postman
    url: https://www.postman.com
    category: API client
    license: Proprietary
    pricing: Free tier + paid plans
    notes: GUI client for exploring and testing web APIs, used alongside curl in the API weeks.
    last_verified: '2026-07-12'
  - name: uv
    url: https://github.com/astral-sh/uv
    category: Python tooling
    license: MIT or Apache-2.0
    pricing: Free
    notes: Fast Python package and environment manager from Astral, used for Python project setup.
    last_verified: '2026-07-12'
  - name: GitHub Actions
    url: https://github.com/features/actions
    category: CI/CD
    license: Proprietary
    pricing: Free for public repositories; free tier + usage-based pricing for private repositories
    notes: CI/CD platform used in the automation and deployment weeks to build, test, and ship projects.
    last_verified: '2026-07-12'
  - name: Hugging Face Hub
    url: https://huggingface.co
    category: Model hub
    license: Proprietary platform (open-source client libraries)
    pricing: Free tier + paid plans
    notes: Hosting hub for open models, datasets, and demos used throughout the deep learning and LLM sections.
    last_verified: '2026-07-12'
  - name: Weights & Biases
    url: https://wandb.ai
    category: Experiment tracking
    license: Proprietary
    pricing: Free tier + paid plans
    notes: Experiment tracking service used in the training-at-scale week to log and compare runs.
    last_verified: '2026-07-12'
  - name: iTerm2
    url: https://iterm2.com
    category: Terminal emulator
    license: GPL-2.0
    pricing: Free
    notes: macOS terminal emulator recommended for the command-line weeks; any modern terminal works.
    last_verified: '2026-07-12'
