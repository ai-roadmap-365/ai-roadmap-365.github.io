title: AI Model Families
description: >-
  The AI model families referenced in the course, with qualitative notes on how each is accessed
  and licensed. The course avoids quoting benchmark numbers or prices, which change quickly;
  entries are re-checked against official sources and stamped with a last_verified date.
entries:
  - name: Claude (Anthropic)
    url: https://www.anthropic.com/claude
    category: Frontier LLM (API)
    license: Proprietary
    pricing: Free tier in the Claude apps; subscription plans and usage-based API pricing
    notes: Anthropic's frontier model family and the course's primary API model for LLM and agent work.
    last_verified: '2026-07-12'
  - name: GPT family (OpenAI)
    url: https://openai.com
    category: Frontier LLM (API)
    license: Proprietary
    pricing: Free tier in ChatGPT; subscription plans and usage-based API pricing
    notes: OpenAI's model family, covered in the model landscape week and used for comparison studies.
    last_verified: '2026-07-12'
  - name: Gemini (Google)
    url: https://gemini.google.com
    category: Frontier LLM (API)
    license: Proprietary
    pricing: Free tier; subscription plans and usage-based API pricing
    notes: Google's frontier model family, discussed in the model landscape and multimodal lessons.
    last_verified: '2026-07-12'
  - name: Llama (Meta)
    url: https://www.llama.com
    category: Open-weights LLM
    license: Open weights (Llama Community License)
    pricing: Free to download and run locally; also available via hosted providers
    notes: Meta's open-weights model family, used for local inference and fine-tuning exercises.
    last_verified: '2026-07-12'
  - name: Mistral
    url: https://mistral.ai
    category: Open-weights LLM + API
    license: Apache-2.0 for some models; proprietary for others
    pricing: Open models free to run locally; usage-based API pricing for hosted models
    notes: French AI lab whose open models are options for the local-model and fine-tuning weeks.
    last_verified: '2026-07-12'
  - name: Qwen (Alibaba)
    url: https://github.com/QwenLM
    category: Open-weights LLM
    license: Apache-2.0 for most open releases; varies by model
    pricing: Free to download and run locally; also available via hosted APIs
    notes: Alibaba's open-weights model family, a common choice for local inference in the course.
    last_verified: '2026-07-12'
  - name: DeepSeek
    url: https://www.deepseek.com
    category: Open-weights LLM
    license: MIT for DeepSeek-R1; varies by model
    pricing: Free to download and run locally; usage-based API pricing for hosted access
    notes: Chinese AI lab known for open-weights reasoning models, discussed in the model landscape week.
    last_verified: '2026-07-12'
  - name: Whisper (OpenAI)
    url: https://github.com/openai/whisper
    category: Speech-to-text
    license: MIT
    pricing: Free (open source); hosted API versions billed per usage
    notes: Open-source speech recognition model used in the speech and multimodal project weeks.
    last_verified: '2026-07-12'
  - name: Stable Diffusion (Stability AI)
    url: https://stability.ai
    category: Image generation
    license: Open weights (custom license; varies by version)
    pricing: Free to run locally; hosted API pricing available
    notes: Open-weights diffusion model family covered in the image generation lessons.
    last_verified: '2026-07-12'
  - name: FLUX (Black Forest Labs)
    url: https://github.com/black-forest-labs/flux
    category: Image generation
    license: Apache-2.0 for FLUX.1 [schnell]; custom non-commercial license for other variants
    pricing: Some variants free to run locally; hosted API pricing available
    notes: Diffusion-transformer image models from Black Forest Labs, discussed in generative media lessons.
    last_verified: '2026-07-12'
  - name: BERT (Google)
    url: https://github.com/google-research/bert
    category: Encoder LM
    license: Apache-2.0
    pricing: Free
    notes: The landmark encoder transformer studied in the transformers week as the archetype of encoder models.
    last_verified: '2026-07-12'
  - name: all-MiniLM (sentence-transformers)
    url: https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2
    category: Embeddings
    license: Apache-2.0
    pricing: Free
    notes: Compact open embedding model used for the semantic search and RAG projects.
    last_verified: '2026-07-12'
