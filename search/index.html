      // Progressive enhancement only: the theme falls back to dark and every
      // .reveal element is visible by default (the hidden start state exists
      // only inside a prefers-reduced-motion: no-preference query).
      (() => {
        const toggle = document.getElementById('theme');
        if (toggle) {
          toggle.addEventListener('click', () => {
            const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
            document.documentElement.dataset.theme = next;
            try {
              localStorage.setItem('theme', next);
            } catch {
              /* private mode */
            }
          });
        }

        const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
        const items = document.querySelectorAll('.reveal');
        if (items.length && !reduced && 'IntersectionObserver' in window) {
          const io = new IntersectionObserver(
            (entries) => {
              entries.forEach((entry, i) => {
                if (!entry.isIntersecting) return;
                entry.target.style.transitionDelay = `${Math.min(i * 50, 240)}ms`;
                entry.target.classList.add('is-in');
                io.unobserve(entry.target);
              });
            },
            { rootMargin: '0px 0px -8% 0px', threshold: 0.06 },
          );
          items.forEach((el) => io.observe(el));
        } else {
          items.forEach((el) => el.classList.add('is-in'));

      })();
