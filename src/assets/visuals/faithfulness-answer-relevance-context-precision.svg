<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" aria-labelledby="faithfulness-answer-relevance-context-precision-title faithfulness-answer-relevance-context-precision-desc">
  <title id="faithfulness-answer-relevance-context-precision-title">Faithfulness Relevance and Precision Breakdown</title>
  <desc id="faithfulness-answer-relevance-context-precision-desc">Runtime dataflow illustrating query expansion, hybrid retrieval, and grounded synthesis.</desc>
  <style>
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .box { fill: #1e293b; stroke: #38bdf8; }
      .accent { fill: #38bdf8; }
      .text-main { fill: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
      .text-sub { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; }
      .flow-line { stroke: #38bdf8; stroke-dasharray: 6; animation: dash 20s linear infinite; }
    }
    @media (prefers-color-scheme: light) {
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #0284c7; }
      .accent { fill: #0284c7; }
      .text-main { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; }
      .text-sub { fill: #64748b; font-family: system-ui, -apple-system, sans-serif; }
      .flow-line { stroke: #0284c7; stroke-dasharray: 6; animation: dash 20s linear infinite; }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow-line { animation: none; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -120; }
    }
  </style>
  <rect width="900" height="480" class="bg" rx="12"/>
  <text x="450" y="45" class="text-main" font-size="20" font-weight="bold" text-anchor="middle">Faithfulness Relevance and Precision Breakdown</text>
  <text x="450" y="72" class="text-sub" font-size="13" text-anchor="middle">Runtime dataflow illustrating query expansion, hybrid retrieval, and grounded synthesis.</text>

  <rect x="50" y="120" width="220" height="280" class="box" stroke-width="2" rx="8"/>
  <text x="160" y="160" class="accent" font-size="16" font-weight="bold" text-anchor="middle">Input &amp; Retrieval</text>
  <text x="160" y="200" class="text-main" font-size="13" text-anchor="middle">Query Preprocessing</text>
  <text x="160" y="235" class="text-sub" font-size="12" text-anchor="middle">Dense Vector / Sparse BM25</text>
  <text x="160" y="270" class="text-sub" font-size="12" text-anchor="middle">ANN Index Filtering</text>
  <text x="160" y="305" class="text-sub" font-size="12" text-anchor="middle">Candidate Top-K Pool</text>
  <text x="160" y="340" class="text-main" font-size="12" text-anchor="middle">Latency: 5-15ms</text>

  <path d="M 270 260 L 340 260" class="flow-line" stroke-width="2" fill="none"/>
  <polygon points="340,260 330,255 330,265" class="accent"/>

  <rect x="340" y="120" width="220" height="280" class="box" stroke-width="2" rx="8"/>
  <text x="450" y="160" class="accent" font-size="16" font-weight="bold" text-anchor="middle">Ranking &amp; Synthesis</text>
  <text x="450" y="200" class="text-main" font-size="13" text-anchor="middle">Cross-Encoder Re-Rank</text>
  <text x="450" y="235" class="text-sub" font-size="12" text-anchor="middle">Context Window Assembly</text>
  <text x="450" y="270" class="text-sub" font-size="12" text-anchor="middle">Source Citation Tagging</text>
  <text x="450" y="305" class="text-sub" font-size="12" text-anchor="middle">System Prompt Packaging</text>
  <text x="450" y="340" class="text-main" font-size="12" text-anchor="middle">Precision Gain: +35%</text>

  <path d="M 560 260 L 630 260" class="flow-line" stroke-width="2" fill="none"/>
  <polygon points="630,260 620,255 620,265" class="accent"/>

  <rect x="630" y="120" width="220" height="280" class="box" stroke-width="2" rx="8"/>
  <text x="740" y="160" class="accent" font-size="16" font-weight="bold" text-anchor="middle">Generation &amp; Eval</text>
  <text x="740" y="200" class="text-main" font-size="13" text-anchor="middle">LLM Inference Engine</text>
  <text x="740" y="235" class="text-sub" font-size="12" text-anchor="middle">Streaming Token Output</text>
  <text x="740" y="270" class="text-sub" font-size="12" text-anchor="middle">Inline [1] Grounding</text>
  <text x="740" y="305" class="text-sub" font-size="12" text-anchor="middle">RAG Triad Quality Gate</text>
  <text x="740" y="340" class="text-main" font-size="12" text-anchor="middle">Faithfulness &gt; 95%</text>
</svg>
