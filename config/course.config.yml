# Central link and repository configuration.
# This is the ONLY place repository and site URLs are defined.
# All lesson, lab, and site links are generated from this file plus lesson
# metadata (see src/lib/links.ts and scripts/lib/links.mjs).
#
# The published course. All lesson, lab and site links derive from this
# file, so changing a URL here regenerates every link in the course.
#
# `public_url`, `public_name` and `public_branch` are retained aliases of
# `url`, `name` and `branch` so existing link helpers keep working.

repository:
  mode: public
  owner: ai-roadmap-365
  name: ai-roadmap-365.github.io
  url: https://github.com/ai-roadmap-365/ai-roadmap-365.github.io
  branch: main
  public_name: ai-roadmap-365.github.io
  public_url: https://github.com/ai-roadmap-365/ai-roadmap-365.github.io
  public_branch: main
  site_branch: site
  # Extra public repositories that must receive the SAME projected tree.
  # `ai-roadmap-365/ai-roadmap-365` is the old public repo. It is kept alive
  # only because conference submissions link to
  # github.com/sandeepbazar/ai-roadmap-365, which GitHub 301-redirects here —
  # deleting it would break links already printed in submissions. Because it
  # is a second copy it would silently rot, so `release:public` pushes to it
  # too and it can never drift from the canonical site repo (A39).
  mirrors:
    - ai-roadmap-365/ai-roadmap-365

# Git identity for every commit this project makes, in EITHER repository.
# Deliberately explicit: it must never be derived from repository.owner, which
# is an organization name and not a person (A24, A38).
committer:
  name: sandeepbazar
  email: 5602033+sandeepbazar@users.noreply.github.com


website:
  local_base_url: http://localhost:4321
  public_base_url: https://ai-roadmap-365.github.io
  base_path: ''
  port: 4321

course:
  title: 365 Days of AI Mastery
  slug: ai-roadmap
  days: 365
  weeks: 52
  language: en
  author: Sandeep Bazar

# The LinkedIn 365-day challenge. scripts/generate-social.mjs reads this to
# build one ready-to-paste post per day plus its share card.
social:
  challenge_name: 365 Days of AI
  challenge_tagline: One year. Nine courses. Every day.
  hashtags: [AI, 365DaysOfAI, LearningInPublic, Python, MachineLearning]
  author_handle: sandeepbazar
