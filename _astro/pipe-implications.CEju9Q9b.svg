<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are organisational.">
  <title>Four consequences of a pipeline</title>
  <style>
    .pipe-implications-bg   { fill: #f8fafc; }
    .pipe-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipe-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipe-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipe-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipe-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipe-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pipe-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pipe-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pipe-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pipe-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pipe-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pipe-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pipe-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pipe-implications-stage { opacity: 1; }

    .pipe-implications-s0 { animation-delay: 0.00s; }
    .pipe-implications-e0 { animation-delay: 0.00s; }
    .pipe-implications-s1 { animation-delay: 1.28s; }
    .pipe-implications-e1 { animation-delay: 1.28s; }
    .pipe-implications-s2 { animation-delay: 2.56s; }
    .pipe-implications-e2 { animation-delay: 2.56s; }
    .pipe-implications-s3 { animation-delay: 3.84s; }
    .pipe-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .pipe-implications-conn  { animation: pipe-implications-trace 6.4s ease-in-out infinite; }
      .pipe-implications-stage { animation: pipe-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes pipe-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pipe-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pipe-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pipe-implications-stage { animation: pipe-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pipe-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pipe-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pipe-implications-bg" width="980" height="322"/>
  <text class="pipe-implications-h1"  x="30" y="40">Four consequences of a pipeline</text>
  <text class="pipe-implications-sub" x="30" y="64">Two are organisational.</text>
  <g class="pipe-implications-stage pipe-implications-s0">
    <rect class="pipe-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="pipe-implications-step" x="44" y="142">01</text>
    <text class="pipe-implications-name" x="70" y="142">Results can be trusted because they can be checked</text>
    <text class="pipe-implications-desc" x="44" y="166">By anyone, not just the author.</text>
  </g>
  <line class="pipe-implications-line pipe-implications-conn pipe-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#pipe-implications-tip)"/>
  <g class="pipe-implications-stage pipe-implications-s1">
    <rect class="pipe-implications-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="pipe-implications-step" x="280" y="142">02</text>
    <text class="pipe-implications-name" x="306" y="142">And changes to the source surface as failures</text>
    <text class="pipe-implications-desc" x="280" y="166">Rather than as wrong numbers.</text>
  </g>
  <line class="pipe-implications-line pipe-implications-conn pipe-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#pipe-implications-tip)"/>
  <g class="pipe-implications-stage pipe-implications-s2">
    <rect class="pipe-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="pipe-implications-step" x="516" y="142">03</text>
    <text class="pipe-implications-name" x="542" y="142">While a new colleague can rerun everything</text>
    <text class="pipe-implications-desc" x="516" y="166">Which manual processes never</text>
    <text class="pipe-implications-desc" x="516" y="182">allow.</text>
  </g>
  <line class="pipe-implications-line pipe-implications-conn pipe-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#pipe-implications-tip)"/>
  <g class="pipe-implications-stage pipe-implications-s3">
    <rect class="pipe-implications-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="pipe-implications-step" x="752" y="142">04</text>
    <text class="pipe-implications-name" x="778" y="142">At the cost of more effort up front</text>
    <text class="pipe-implications-desc" x="752" y="166">Which repays after the second</text>
    <text class="pipe-implications-desc" x="752" y="182">run.</text>
  </g>
  <text class="pipe-implications-sub" x="30" y="304">Repaying after the second run is roughly accurate, and almost every analysis is run more than twice once someone asks a follow-up question.</text>
</svg>
