<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="100%" height="100%" role="img" aria-label="Four Situations, One Loop showing a first deploy, node failure, manual deletion and a rolling update handled identically">
  <title>Four Situations, One Loop</title>
  <defs>
    <style>
      .d333b-bg { fill: #f8fafc; }
      .d333b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; }
      .d333b-same { fill: #dcfce7; stroke: #22c55e; stroke-width: 2px; }
      .d333b-note { fill: #fef9c3; stroke: #eab308; stroke-width: 2px; }
      .d333b-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d333b-h { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .d333b-t { font-family: system-ui, sans-serif; font-size: 13px; fill: #334155; }
      .d333b-m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #0f172a; }
      .d333b-s { font-family: system-ui, sans-serif; font-size: 12px; fill: #64748b; }
    </style>
  </defs>
  <rect class="d333b-bg" width="900" height="430" />
  <text class="d333b-title" x="30" y="36">Four Situations, One Loop</text>
  <text class="d333b-s" x="30" y="58">Measured by the day 333 lab. Two of these are the same situation.</text>

  <rect class="d333b-card" x="30" y="80" width="200" height="120" rx="8" />
  <text class="d333b-h" x="46" y="106">1. first deploy</text>
  <text class="d333b-m" x="46" y="132">create x3</text>
  <text class="d333b-s" x="46" y="158">converges in 2 steps</text>
  <text class="d333b-s" x="46" y="178">(run, then become ready)</text>

  <rect class="d333b-same" x="248" y="80" width="200" height="120" rx="8" />
  <text class="d333b-h" x="264" y="106">2. a node dies</text>
  <text class="d333b-m" x="264" y="132">delete api-001</text>
  <text class="d333b-m" x="264" y="152">create api-004</text>
  <text class="d333b-s" x="264" y="178">2 of 3 replicas present</text>

  <rect class="d333b-same" x="466" y="80" width="200" height="120" rx="8" />
  <text class="d333b-h" x="482" y="106">3. manual delete</text>
  <text class="d333b-m" x="482" y="132">create api-005</text>
  <text class="d333b-s" x="482" y="178">2 of 3 replicas present</text>

  <rect class="d333b-card" x="684" y="80" width="186" height="120" rx="8" />
  <text class="d333b-h" x="700" y="106">4. rolling update</text>
  <text class="d333b-m" x="700" y="132">replace within</text>
  <text class="d333b-m" x="700" y="152">the budget</text>
  <text class="d333b-s" x="700" y="178">5 steps to complete</text>

  <rect class="d333b-same" x="248" y="212" width="418" height="42" rx="6" />
  <text class="d333b-t" x="266" y="238">Same reason string, same action. The loop has no notion of cause.</text>

  <rect class="d333b-note" x="30" y="272" width="840" height="70" rx="8" />
  <text class="d333b-h" x="48" y="298">The rollout step worth reading</text>
  <text class="d333b-m" x="48" y="322">step 2: 0 action(s) — and the rollout is NOT finished</text>
  <text class="d333b-s" x="480" y="322">the budget is spent; waiting for readiness</text>

  <rect class="d333b-card" x="30" y="356" width="840" height="56" rx="6" />
  <text class="d333b-h" x="48" y="380">serving during rollout: [2, 4, 2, 3]   minimum 2</text>
  <text class="d333b-s" x="48" y="400">replicas 3, maxUnavailable 1 → floor of 2. Fully used, never exceeded. maxSurge 1 allows the 4.</text>
</svg>
