<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" font-family="system-ui, sans-serif">
  <title>How a 64-bit float stores a number as sign, exponent, and mantissa, and why one tenth cannot be exact</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">A float (IEEE 754 double): 64 bits in three fields</text>

  <!-- Formula -->
  <text x="380" y="66" text-anchor="middle" font-size="15" fill="#1a202c">value = (-1)^sign  x  1.mantissa  x  2^(exponent - 1023)</text>

  <!-- Sign field -->
  <rect x="40" y="90" width="70" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="75" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">sign</text>
  <text x="75" y="138" text-anchor="middle" font-size="14" fill="#1a202c">1 bit</text>

  <!-- Exponent field -->
  <rect x="120" y="90" width="230" height="60" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="235" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">exponent</text>
  <text x="235" y="138" text-anchor="middle" font-size="14" fill="#1a202c">11 bits  (the scale)</text>

  <!-- Mantissa field -->
  <rect x="360" y="90" width="360" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="540" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">mantissa (fraction)</text>
  <text x="540" y="138" text-anchor="middle" font-size="14" fill="#1a202c">52 bits  (the precision)</text>

  <text x="380" y="176" text-anchor="middle" font-size="14" fill="#1a202c">1 + 11 + 52 = 64 bits total. More mantissa bits = more precision; more exponent bits = wider range.</text>

  <!-- Divider -->
  <line x1="40" y1="196" x2="720" y2="196" stroke="#94a3b8" stroke-width="1"/>

  <!-- Why 0.1 cannot be exact -->
  <text x="380" y="224" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">Why one tenth cannot be exact</text>

  <text x="60" y="252" font-size="14" fill="#1a202c">In base 10 you cannot write 1/3 with finitely many digits: 0.3333... never ends.</text>
  <text x="60" y="274" font-size="14" fill="#1a202c">A float stores digits in base 2, and in base 2 it is 1/10 that never ends:</text>

  <rect x="60" y="288" width="640" height="40" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="380" y="313" text-anchor="middle" font-size="14" fill="#1a202c">0.1 (base 10)  =  0.0001100110011001100110011... (base 2, repeating forever)</text>

  <text x="60" y="352" font-size="14" fill="#1a202c">With only 52 mantissa bits, Python must round to the nearest storable value, so it keeps:</text>

  <rect x="60" y="366" width="640" height="40" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="380" y="391" text-anchor="middle" font-size="13" fill="#1a202c">0.1000000000000000055511151231257827021181583404541015625  (a hair too big)</text>

  <text x="380" y="436" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">That tiny leftover is why 0.1 + 0.2 does not land exactly on 0.3.</text>
  <text x="380" y="457" text-anchor="middle" font-size="13" fill="#1a202c">(This is the same binary story from Day 4 — data as bit patterns — applied to fractions.)</text>
</svg>
