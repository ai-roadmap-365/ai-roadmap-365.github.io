<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Not the most familiar one.">
  <title>The right tool</title>
  <style>
    .toolbox-bg   { fill: #f8fafc; }
    .toolbox-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toolbox-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toolbox-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toolbox-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toolbox-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toolbox-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .toolbox-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .toolbox-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .toolbox-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .toolbox-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .toolbox-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .toolbox-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .toolbox-row { opacity: 1; }
    .toolbox-r0 { animation-delay: 0.00s; }
    .toolbox-r1 { animation-delay: 0.45s; }
    .toolbox-r2 { animation-delay: 0.90s; }
    .toolbox-r3 { animation-delay: 1.35s; }
    .toolbox-r4 { animation-delay: 1.80s; }
    .toolbox-row { animation: toolbox-reveal 7.3s ease-in-out infinite; }
    @keyframes toolbox-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="toolbox-bg" width="980" height="390"/>
  <text class="toolbox-h1"  x="30" y="40">The right tool</text>
  <text class="toolbox-sub" x="30" y="64">Not the most familiar one.</text>
  <rect class="toolbox-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="toolbox-name" x="46" y="122">One tool for everything</text>
  <text class="toolbox-desc" x="46" y="142">Familiar.</text>
  <text class="toolbox-desc toolbox-row toolbox-r0" x="46" y="182">Reach for the same thing every time</text>
  <text class="toolbox-desc toolbox-row toolbox-r1" x="46" y="216">Works, more or less</text>
  <text class="toolbox-desc toolbox-row toolbox-r2" x="46" y="250">Some jobs take far longer than needed</text>
  <text class="toolbox-desc toolbox-row toolbox-r3" x="46" y="284">No thought required</text>
  <text class="toolbox-desc toolbox-row toolbox-r4" x="46" y="318">This is using a list for everything</text>
  <rect class="toolbox-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="toolbox-name" x="526" y="122">The right tool</text>
  <text class="toolbox-desc" x="526" y="142">Chosen.</text>
  <text class="toolbox-desc toolbox-row toolbox-r0" x="526" y="182">Match the tool to the job</text>
  <text class="toolbox-desc toolbox-row toolbox-r1" x="526" y="216">Each job takes about as long as it should</text>
  <text class="toolbox-desc toolbox-row toolbox-r2" x="526" y="250">The awkward jobs become easy</text>
  <text class="toolbox-desc toolbox-row toolbox-r3" x="526" y="284">A moment's thought each time</text>
  <text class="toolbox-desc toolbox-row toolbox-r4" x="526" y="318">This is choosing the container</text>
  <text class="toolbox-sub" x="30" y="372">The cost of the left column is invisible until the data grows, which is exactly when it becomes expensive to fix.</text>
</svg>
