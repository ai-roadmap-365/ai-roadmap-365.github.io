<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four points.">
  <title>Two interfaces, one library</title>
  <style>
    .mpl-interfaces-bg   { fill: #f8fafc; }
    .mpl-interfaces-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mpl-interfaces-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mpl-interfaces-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mpl-interfaces-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mpl-interfaces-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mpl-interfaces-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mpl-interfaces-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mpl-interfaces-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mpl-interfaces-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mpl-interfaces-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mpl-interfaces-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mpl-interfaces-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .mpl-interfaces-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .mpl-interfaces-stage { opacity: 1; }

    .mpl-interfaces-s0 { animation-delay: 0.00s; }
    .mpl-interfaces-e0 { animation-delay: 0.00s; }
    .mpl-interfaces-s1 { animation-delay: 1.28s; }
    .mpl-interfaces-e1 { animation-delay: 1.28s; }
    .mpl-interfaces-s2 { animation-delay: 2.56s; }
    .mpl-interfaces-e2 { animation-delay: 2.56s; }
    .mpl-interfaces-s3 { animation-delay: 3.84s; }
    .mpl-interfaces-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .mpl-interfaces-conn  { animation: mpl-interfaces-trace 6.4s ease-in-out infinite; }
      .mpl-interfaces-stage { animation: mpl-interfaces-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes mpl-interfaces-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes mpl-interfaces-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .mpl-interfaces-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .mpl-interfaces-stage { animation: mpl-interfaces-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes mpl-interfaces-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="mpl-interfaces-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="mpl-interfaces-bg" width="980" height="322"/>
  <text class="mpl-interfaces-h1"  x="30" y="40">Two interfaces, one library</text>
  <text class="mpl-interfaces-sub" x="30" y="64">Four points.</text>
  <g class="mpl-interfaces-stage mpl-interfaces-s0">
    <rect class="mpl-interfaces-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="mpl-interfaces-step" x="44" y="142">01</text>
    <text class="mpl-interfaces-name" x="70" y="142">An implicit interface acting on a current figure</text>
    <text class="mpl-interfaces-desc" x="44" y="166">Short, and stateful.</text>
  </g>
  <line class="mpl-interfaces-line mpl-interfaces-conn mpl-interfaces-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#mpl-interfaces-tip)"/>
  <g class="mpl-interfaces-stage mpl-interfaces-s1">
    <rect class="mpl-interfaces-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="mpl-interfaces-step" x="280" y="142">02</text>
    <text class="mpl-interfaces-name" x="306" y="142">An explicit interface acting on named objects</text>
    <text class="mpl-interfaces-desc" x="280" y="166">Longer, and unambiguous.</text>
  </g>
  <line class="mpl-interfaces-line mpl-interfaces-conn mpl-interfaces-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#mpl-interfaces-tip)"/>
  <g class="mpl-interfaces-stage mpl-interfaces-s2">
    <rect class="mpl-interfaces-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="mpl-interfaces-step" x="516" y="142">03</text>
    <text class="mpl-interfaces-name" x="542" y="142">Mixing the two is where confusion comes from</text>
    <text class="mpl-interfaces-desc" x="516" y="166">State changes under you.</text>
  </g>
  <line class="mpl-interfaces-line mpl-interfaces-conn mpl-interfaces-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#mpl-interfaces-tip)"/>
  <g class="mpl-interfaces-stage mpl-interfaces-s3">
    <rect class="mpl-interfaces-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="mpl-interfaces-step" x="752" y="142">04</text>
    <text class="mpl-interfaces-name" x="778" y="142">So use the explicit one for anything reused</text>
    <text class="mpl-interfaces-desc" x="752" y="166">And the implicit only for quick</text>
    <text class="mpl-interfaces-desc" x="752" y="182">looks.</text>
  </g>
  <text class="mpl-interfaces-sub" x="30" y="304">Almost every confusing plotting bug traces back to state: a command applied to whichever figure happened to be current rather than the one intended.</text>
</svg>
