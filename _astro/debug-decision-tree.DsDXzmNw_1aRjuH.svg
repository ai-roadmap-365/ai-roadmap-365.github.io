<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" font-family="system-ui, sans-serif">
  <title>A troubleshooting decision tree for a failed request: from DNS to connection to TLS to status code to body, with the tool to use at each step</title>
  <rect x="0" y="0" width="760" height="620" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">"The request failed" — where did it stop?</text>

  <!-- Gate 1: DNS -->
  <rect x="250" y="56" width="260" height="58" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Did the hostname resolve?</text>
  <text x="380" y="101" text-anchor="middle" font-size="14" fill="#1a202c">curl -v  (read the * lines)</text>

  <!-- No branch 1 -->
  <line x1="510" y1="85" x2="620" y2="85" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="628,85 614,78 614,92" fill="#1d4ed8"/>
  <rect x="628" y="60" width="120" height="50" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5" rx="6"/>
  <text x="688" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">No: DNS</text>
  <text x="688" y="98" text-anchor="middle" font-size="14" fill="#1a202c">check the name</text>

  <line x1="380" y1="114" x2="380" y2="138" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="380,146 373,132 387,132" fill="#1d4ed8"/>
  <text x="398" y="134" font-size="13" fill="#1a202c">yes</text>

  <!-- Gate 2: Connect -->
  <rect x="250" y="146" width="260" height="58" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Did the connection open?</text>
  <text x="380" y="191" text-anchor="middle" font-size="14" fill="#1a202c">curl -v  ("Connected to ...")</text>

  <line x1="510" y1="175" x2="620" y2="175" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="628,175 614,168 614,182" fill="#1d4ed8"/>
  <rect x="628" y="150" width="120" height="50" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5" rx="6"/>
  <text x="688" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">No: TCP</text>
  <text x="688" y="188" text-anchor="middle" font-size="14" fill="#1a202c">down / firewall</text>

  <line x1="380" y1="204" x2="380" y2="228" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="380,236 373,222 387,222" fill="#1d4ed8"/>
  <text x="398" y="224" font-size="13" fill="#1a202c">yes</text>

  <!-- Gate 3: TLS -->
  <rect x="250" y="236" width="260" height="58" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="260" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Did TLS verify?</text>
  <text x="380" y="281" text-anchor="middle" font-size="14" fill="#1a202c">curl -v  ("verify ok")</text>

  <line x1="510" y1="265" x2="620" y2="265" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="628,265 614,258 614,272" fill="#1d4ed8"/>
  <rect x="628" y="240" width="120" height="50" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5" rx="6"/>
  <text x="688" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">No: TLS</text>
  <text x="688" y="278" text-anchor="middle" font-size="14" fill="#1a202c">bad certificate</text>

  <line x1="380" y1="294" x2="380" y2="318" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="380,326 373,312 387,312" fill="#1d4ed8"/>
  <text x="398" y="314" font-size="13" fill="#1a202c">yes</text>

  <!-- Gate 4: Status -->
  <rect x="250" y="326" width="260" height="58" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="350" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">What is the status code?</text>
  <text x="380" y="371" text-anchor="middle" font-size="14" fill="#1a202c">curl -I  or  -w "%{http_code}"</text>

  <!-- 4xx branch -->
  <line x1="510" y1="355" x2="620" y2="355" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="628,355 614,348 614,362" fill="#1d4ed8"/>
  <rect x="628" y="326" width="120" height="58" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" rx="6"/>
  <text x="688" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">4xx</text>
  <text x="688" y="366" text-anchor="middle" font-size="14" fill="#1a202c">your request:</text>
  <text x="688" y="381" text-anchor="middle" font-size="13" fill="#1a202c">URL/auth/body</text>

  <!-- 5xx branch -->
  <line x1="250" y1="355" x2="140" y2="355" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="132,355 146,348 146,362" fill="#1d4ed8"/>
  <rect x="12" y="326" width="120" height="58" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" rx="6"/>
  <text x="72" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">5xx</text>
  <text x="72" y="366" text-anchor="middle" font-size="14" fill="#1a202c">server failed a</text>
  <text x="72" y="381" text-anchor="middle" font-size="13" fill="#1a202c">valid request</text>

  <line x1="380" y1="384" x2="380" y2="408" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="380,416 373,402 387,402" fill="#1d4ed8"/>
  <text x="398" y="404" font-size="13" fill="#1a202c">2xx</text>

  <!-- Gate 5: Body -->
  <rect x="250" y="416" width="260" height="58" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="440" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Is the body what you expect?</text>
  <text x="380" y="461" text-anchor="middle" font-size="14" fill="#1a202c">read the response / Preview</text>

  <line x1="510" y1="445" x2="620" y2="445" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="628,445 614,438 614,452" fill="#1d4ed8"/>
  <rect x="628" y="420" width="120" height="50" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" rx="6"/>
  <text x="688" y="440" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">No: parse</text>
  <text x="688" y="458" text-anchor="middle" font-size="14" fill="#1a202c">malformed body</text>

  <line x1="380" y1="474" x2="380" y2="498" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="380,506 373,492 387,492" fill="#1d4ed8"/>
  <text x="398" y="494" font-size="13" fill="#1a202c">yes</text>

  <!-- Success -->
  <rect x="270" y="506" width="220" height="52" fill="#dcfce7" stroke="#15803d" stroke-width="2" rx="8"/>
  <text x="380" y="530" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">Success</text>
  <text x="380" y="550" text-anchor="middle" font-size="14" fill="#1a202c">the request worked end to end</text>

  <text x="380" y="592" text-anchor="middle" font-size="14" fill="#1a202c">Walk the gates top to bottom; the first "no" is where the request — and your investigation — stopped.</text>
</svg>
