<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are security; one is context.">
  <title>Three tool-level hazards</title>
  <style>
    .tool-hazards-bg   { fill: #f8fafc; }
    .tool-hazards-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-hazards-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-hazards-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-hazards-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-hazards-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-hazards-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tool-hazards-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tool-hazards-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tool-hazards-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tool-hazards-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tool-hazards-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tool-hazards-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tool-hazards-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tool-hazards-stage { opacity: 1; }

    .tool-hazards-s0 { animation-delay: 0.00s; }
    .tool-hazards-e0 { animation-delay: 0.00s; }
    .tool-hazards-s1 { animation-delay: 1.50s; }
    .tool-hazards-e1 { animation-delay: 1.50s; }
    .tool-hazards-s2 { animation-delay: 3.00s; }
    .tool-hazards-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .tool-hazards-conn  { animation: tool-hazards-trace 6s ease-in-out infinite; }
      .tool-hazards-stage { animation: tool-hazards-arrive 6s ease-in-out infinite; }
    }
    @keyframes tool-hazards-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tool-hazards-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tool-hazards-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tool-hazards-stage { animation: tool-hazards-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tool-hazards-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tool-hazards-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tool-hazards-bg" width="980" height="322"/>
  <text class="tool-hazards-h1"  x="30" y="40">Three tool-level hazards</text>
  <text class="tool-hazards-sub" x="30" y="64">Two are security; one is context.</text>
  <g class="tool-hazards-stage tool-hazards-s0">
    <rect class="tool-hazards-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="tool-hazards-step" x="44" y="142">01</text>
    <text class="tool-hazards-name" x="70" y="142">Generic tools escalate privilege</text>
    <text class="tool-hazards-desc" x="44" y="166">run_raw_sql with write access is arbitrary</text>
    <text class="tool-hazards-desc" x="44" y="182">execution. Expose get_order_by_id instead.</text>
    <text class="tool-hazards-edge" x="44" y="242">least privilege</text>
  </g>
  <line class="tool-hazards-line tool-hazards-conn tool-hazards-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#tool-hazards-tip)"/>
  <g class="tool-hazards-stage tool-hazards-s1">
    <rect class="tool-hazards-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="tool-hazards-step" x="359" y="142">02</text>
    <text class="tool-hazards-name" x="385" y="142">Unbounded output overflows context</text>
    <text class="tool-hazards-desc" x="359" y="166">A 10 MB extract ends the trajectory. Cap at a</text>
    <text class="tool-hazards-desc" x="359" y="182">few thousand characters.</text>
  </g>
  <line class="tool-hazards-line tool-hazards-conn tool-hazards-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#tool-hazards-tip)"/>
  <g class="tool-hazards-stage tool-hazards-s2">
    <rect class="tool-hazards-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="tool-hazards-step" x="674" y="142">03</text>
    <text class="tool-hazards-name" x="700" y="142">And every extra token is billed again</text>
    <text class="tool-hazards-desc" x="674" y="166">On every subsequent step, because the</text>
    <text class="tool-hazards-desc" x="674" y="182">scratchpad carries it forward.</text>
    <text class="tool-hazards-edge" x="674" y="242">compounding</text>
  </g>
  <text class="tool-hazards-sub" x="30" y="304">The third point is what makes output size a design decision rather than a formatting one: a verbose return is paid for once when it arrives and again in every remaining step of the loop.</text>
</svg>
