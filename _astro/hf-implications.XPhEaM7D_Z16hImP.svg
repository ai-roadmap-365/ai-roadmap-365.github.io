<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are cautionary.">
  <title>Four consequences of the ecosystem</title>
  <style>
    .hf-implications-bg   { fill: #f8fafc; }
    .hf-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hf-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hf-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hf-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hf-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hf-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hf-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hf-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hf-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hf-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hf-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hf-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .hf-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .hf-implications-stage { opacity: 1; }

    .hf-implications-s0 { animation-delay: 0.00s; }
    .hf-implications-e0 { animation-delay: 0.00s; }
    .hf-implications-s1 { animation-delay: 1.28s; }
    .hf-implications-e1 { animation-delay: 1.28s; }
    .hf-implications-s2 { animation-delay: 2.56s; }
    .hf-implications-e2 { animation-delay: 2.56s; }
    .hf-implications-s3 { animation-delay: 3.84s; }
    .hf-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .hf-implications-conn  { animation: hf-implications-trace 6.4s ease-in-out infinite; }
      .hf-implications-stage { animation: hf-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes hf-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes hf-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .hf-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .hf-implications-stage { animation: hf-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes hf-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="hf-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="hf-implications-bg" width="980" height="322"/>
  <text class="hf-implications-h1"  x="30" y="40">Four consequences of the ecosystem</text>
  <text class="hf-implications-sub" x="30" y="64">Two are cautionary.</text>
  <g class="hf-implications-stage hf-implications-s0">
    <rect class="hf-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="hf-implications-step" x="44" y="142">01</text>
    <text class="hf-implications-name" x="70" y="142">Reproducibility improved enormously</text>
    <text class="hf-implications-desc" x="44" y="166">A checkpoint identifier plus a</text>
    <text class="hf-implications-desc" x="44" y="182">config is a shareable</text>
    <text class="hf-implications-desc" x="44" y="198">experiment.</text>
  </g>
  <line class="hf-implications-line hf-implications-conn hf-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#hf-implications-tip)"/>
  <g class="hf-implications-stage hf-implications-s1">
    <rect class="hf-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="hf-implications-step" x="280" y="142">02</text>
    <text class="hf-implications-name" x="306" y="142">But checkpoints are untrusted input</text>
    <text class="hf-implications-desc" x="280" y="166">From strangers. Format and</text>
    <text class="hf-implications-desc" x="280" y="182">provenance both matter.</text>
  </g>
  <line class="hf-implications-line hf-implications-conn hf-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#hf-implications-tip)"/>
  <g class="hf-implications-stage hf-implications-s2">
    <rect class="hf-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="hf-implications-step" x="516" y="142">03</text>
    <text class="hf-implications-name" x="542" y="142">Pin versions</text>
    <text class="hf-implications-desc" x="516" y="166">Library and checkpoint. Both</text>
    <text class="hf-implications-desc" x="516" y="182">move, and results move with</text>
    <text class="hf-implications-desc" x="516" y="198">them.</text>
  </g>
  <line class="hf-implications-line hf-implications-conn hf-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#hf-implications-tip)"/>
  <g class="hf-implications-stage hf-implications-s3">
    <rect class="hf-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="hf-implications-step" x="752" y="142">04</text>
    <text class="hf-implications-name" x="778" y="142">And check the licence</text>
    <text class="hf-implications-desc" x="752" y="166">Some weights are research-only,</text>
    <text class="hf-implications-desc" x="752" y="182">whatever the download says.</text>
  </g>
  <text class="hf-implications-sub" x="30" y="304">The licensing point is routinely missed and occasionally expensive: a permissively licensed library does not make the weights it downloads permissively licensed.</text>
</svg>
