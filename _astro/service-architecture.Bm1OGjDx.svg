<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Six components.">
  <title>The complete service</title>
  <style>
    .service-architecture-bg   { fill: #f8fafc; }
    .service-architecture-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .service-architecture-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .service-architecture-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .service-architecture-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .service-architecture-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .service-architecture-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .service-architecture-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .service-architecture-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .service-architecture-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .service-architecture-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .service-architecture-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .service-architecture-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .service-architecture-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .service-architecture-stage { opacity: 1; }

    .service-architecture-s0 { animation-delay: 0.00s; }
    .service-architecture-e0 { animation-delay: 0.00s; }
    .service-architecture-s1 { animation-delay: 1.37s; }
    .service-architecture-e1 { animation-delay: 1.37s; }
    .service-architecture-s2 { animation-delay: 2.74s; }
    .service-architecture-e2 { animation-delay: 2.74s; }
    .service-architecture-s3 { animation-delay: 4.11s; }
    .service-architecture-e3 { animation-delay: 4.11s; }
    .service-architecture-s4 { animation-delay: 5.49s; }
    .service-architecture-e4 { animation-delay: 5.49s; }
    .service-architecture-s5 { animation-delay: 6.86s; }
    .service-architecture-e5 { animation-delay: 6.86s; }
    @media (prefers-reduced-motion: no-preference) {
      .service-architecture-conn  { animation: service-architecture-trace 9.600000000000001s ease-in-out infinite; }
      .service-architecture-stage { animation: service-architecture-arrive 9.600000000000001s ease-in-out infinite; }
    }
    @keyframes service-architecture-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes service-architecture-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .service-architecture-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .service-architecture-stage { animation: service-architecture-settle 9.600000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes service-architecture-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="service-architecture-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="service-architecture-bg" width="980" height="322"/>
  <text class="service-architecture-h1"  x="30" y="40">The complete service</text>
  <text class="service-architecture-sub" x="30" y="64">Six components.</text>
  <g class="service-architecture-stage service-architecture-s0">
    <rect class="service-architecture-box" x="30" y="118" width="131" height="104" rx="10"/>
    <text class="service-architecture-step" x="44" y="142">01</text>
    <text class="service-architecture-name" x="70" y="142">Data ingestion and validation</text>
    <text class="service-architecture-desc" x="44" y="166">Which fails loudly</text>
    <text class="service-architecture-desc" x="44" y="182">on a schema change.</text>
  </g>
  <line class="service-architecture-line service-architecture-conn service-architecture-e0" x1="163" y1="170" x2="185" y2="170" marker-end="url(#service-architecture-tip)"/>
  <g class="service-architecture-stage service-architecture-s1">
    <rect class="service-architecture-box" x="187" y="118" width="131" height="104" rx="10"/>
    <text class="service-architecture-step" x="201" y="142">02</text>
    <text class="service-architecture-name" x="227" y="142">A training pipeline</text>
    <text class="service-architecture-desc" x="201" y="166">Reproducible,</text>
    <text class="service-architecture-desc" x="201" y="182">versioned, and</text>
    <text class="service-architecture-desc" x="201" y="198">re-runnable.</text>
  </g>
  <line class="service-architecture-line service-architecture-conn service-architecture-e1" x1="320" y1="170" x2="342" y2="170" marker-end="url(#service-architecture-tip)"/>
  <g class="service-architecture-stage service-architecture-s2">
    <rect class="service-architecture-good" x="344" y="118" width="131" height="104" rx="10"/>
    <text class="service-architecture-step" x="358" y="142">03</text>
    <text class="service-architecture-name" x="384" y="142">A registry holding versioned artefacts</text>
    <text class="service-architecture-desc" x="358" y="166">With their</text>
    <text class="service-architecture-desc" x="358" y="182">evaluation records</text>
    <text class="service-architecture-desc" x="358" y="198">attached.</text>
  </g>
  <line class="service-architecture-line service-architecture-conn service-architecture-e2" x1="477" y1="170" x2="499" y2="170" marker-end="url(#service-architecture-tip)"/>
  <g class="service-architecture-stage service-architecture-s3">
    <rect class="service-architecture-box" x="501" y="118" width="131" height="104" rx="10"/>
    <text class="service-architecture-step" x="515" y="142">04</text>
    <text class="service-architecture-name" x="541" y="142">A serving layer with a stable contract</text>
    <text class="service-architecture-desc" x="515" y="166">Validation,</text>
    <text class="service-architecture-desc" x="515" y="182">fallback,</text>
    <text class="service-architecture-desc" x="515" y="198">observability.</text>
  </g>
  <line class="service-architecture-line service-architecture-conn service-architecture-e3" x1="634" y1="170" x2="656" y2="170" marker-end="url(#service-architecture-tip)"/>
  <g class="service-architecture-stage service-architecture-s4">
    <rect class="service-architecture-warn" x="658" y="118" width="131" height="104" rx="10"/>
    <text class="service-architecture-step" x="672" y="142">05</text>
    <text class="service-architecture-name" x="698" y="142">Monitoring on inputs, predictions and outcomes</text>
    <text class="service-architecture-desc" x="672" y="166">With owned</text>
    <text class="service-architecture-desc" x="672" y="182">thresholds.</text>
  </g>
  <line class="service-architecture-line service-architecture-conn service-architecture-e4" x1="791" y1="170" x2="813" y2="170" marker-end="url(#service-architecture-tip)"/>
  <g class="service-architecture-stage service-architecture-s5">
    <rect class="service-architecture-box" x="815" y="118" width="131" height="104" rx="10"/>
    <text class="service-architecture-step" x="829" y="142">06</text>
    <text class="service-architecture-name" x="855" y="142">And a retraining path back to the start</text>
    <text class="service-architecture-desc" x="829" y="166">Which closes the</text>
    <text class="service-architecture-desc" x="829" y="182">loop.</text>
    <text class="service-architecture-edge" x="829" y="242">a cycle</text>
  </g>
  <text class="service-architecture-sub" x="30" y="304">The loop closing is what makes this a service rather than a deployment: the retraining path is designed in, not improvised when quality falls.</text>
</svg>
