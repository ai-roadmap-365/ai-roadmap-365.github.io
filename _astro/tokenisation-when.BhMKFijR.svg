<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when to accept the default.">
  <title>When to think about tokenisation</title>
  <style>
    .tokenisation-when-bg   { fill: #f8fafc; }
    .tokenisation-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tokenisation-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tokenisation-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tokenisation-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tokenisation-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tokenisation-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tokenisation-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tokenisation-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tokenisation-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tokenisation-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tokenisation-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tokenisation-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tokenisation-when-row { opacity: 1; }
    .tokenisation-when-r0 { animation-delay: 0.00s; }
    .tokenisation-when-r1 { animation-delay: 0.45s; }
    .tokenisation-when-r2 { animation-delay: 0.90s; }
    .tokenisation-when-r3 { animation-delay: 1.35s; }
    .tokenisation-when-r4 { animation-delay: 1.80s; }
    .tokenisation-when-row { animation: tokenisation-when-reveal 7.3s ease-in-out infinite; }
    @keyframes tokenisation-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tokenisation-when-bg" width="980" height="390"/>
  <text class="tokenisation-when-h1"  x="30" y="40">When to think about tokenisation</text>
  <text class="tokenisation-when-sub" x="30" y="64">And when to accept the default.</text>
  <rect class="tokenisation-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tokenisation-when-name" x="46" y="122">It matters</text>
  <text class="tokenisation-when-desc" x="46" y="142">Domain and language.</text>
  <text class="tokenisation-when-desc tokenisation-when-row tokenisation-when-r0" x="46" y="182">Non-English, especially under-represented languages</text>
  <text class="tokenisation-when-desc tokenisation-when-row tokenisation-when-r1" x="46" y="216">Code, chemistry, or other symbol-heavy text</text>
  <text class="tokenisation-when-desc tokenisation-when-row tokenisation-when-r2" x="46" y="250">Long documents against a context limit</text>
  <text class="tokenisation-when-desc tokenisation-when-row tokenisation-when-r3" x="46" y="284">Cost-sensitive high-volume workloads</text>
  <text class="tokenisation-when-desc tokenisation-when-row tokenisation-when-r4" x="46" y="318">Anywhere character-level tasks appear</text>
  <rect class="tokenisation-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tokenisation-when-name" x="526" y="122">Accept the default</text>
  <text class="tokenisation-when-desc" x="526" y="142">English prose, general use.</text>
  <text class="tokenisation-when-desc tokenisation-when-row tokenisation-when-r0" x="526" y="182">Standard English text</text>
  <text class="tokenisation-when-desc tokenisation-when-row tokenisation-when-r1" x="526" y="216">Using a pretrained model as intended</text>
  <text class="tokenisation-when-desc tokenisation-when-row tokenisation-when-r2" x="526" y="250">The tokeniser ships with the model</text>
  <text class="tokenisation-when-desc tokenisation-when-row tokenisation-when-r3" x="526" y="284">Changing it means retraining</text>
  <text class="tokenisation-when-desc tokenisation-when-row tokenisation-when-r4" x="526" y="318">So there is nothing to decide</text>
  <text class="tokenisation-when-sub" x="30" y="372">The right-hand column is the common case and worth stating plainly: for a pretrained model the tokeniser is not a choice, and using anything else is not an option.</text>
</svg>
