<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A correction in the middle.">
  <title>Four steps in scaling research</title>
  <style>
    .scaling-history-bg   { fill: #f8fafc; }
    .scaling-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scaling-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scaling-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scaling-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scaling-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scaling-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scaling-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .scaling-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .scaling-history-stage { opacity: 1; }

    .scaling-history-s0 { animation-delay: 0.00s; }
    .scaling-history-e0 { animation-delay: 0.00s; }
    .scaling-history-s1 { animation-delay: 1.28s; }
    .scaling-history-e1 { animation-delay: 1.28s; }
    .scaling-history-s2 { animation-delay: 2.56s; }
    .scaling-history-e2 { animation-delay: 2.56s; }
    .scaling-history-s3 { animation-delay: 3.84s; }
    .scaling-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .scaling-history-conn  { animation: scaling-history-trace 6.4s ease-in-out infinite; }
      .scaling-history-stage { animation: scaling-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes scaling-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes scaling-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .scaling-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .scaling-history-stage { animation: scaling-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes scaling-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="scaling-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="scaling-history-bg" width="980" height="322"/>
  <text class="scaling-history-h1"  x="30" y="40">Four steps in scaling research</text>
  <text class="scaling-history-sub" x="30" y="64">A correction in the middle.</text>
  <g class="scaling-history-stage scaling-history-s0">
    <rect class="scaling-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="scaling-history-step" x="44" y="142">01</text>
    <text class="scaling-history-name" x="70" y="142">Loss found to follow power laws</text>
    <text class="scaling-history-desc" x="44" y="166">Smoothly, across many orders of</text>
    <text class="scaling-history-desc" x="44" y="182">magnitude.</text>
  </g>
  <line class="scaling-history-line scaling-history-conn scaling-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#scaling-history-tip)"/>
  <g class="scaling-history-stage scaling-history-s1">
    <rect class="scaling-history-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="scaling-history-step" x="280" y="142">02</text>
    <text class="scaling-history-name" x="306" y="142">Which was read as: grow the model</text>
    <text class="scaling-history-desc" x="280" y="166">Producing very large,</text>
    <text class="scaling-history-desc" x="280" y="182">data-starved models.</text>
  </g>
  <line class="scaling-history-line scaling-history-conn scaling-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#scaling-history-tip)"/>
  <g class="scaling-history-stage scaling-history-s2">
    <rect class="scaling-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="scaling-history-step" x="516" y="142">03</text>
    <text class="scaling-history-name" x="542" y="142">Then corrected</text>
    <text class="scaling-history-desc" x="516" y="166">Data and parameters should scale</text>
    <text class="scaling-history-desc" x="516" y="182">together.</text>
  </g>
  <line class="scaling-history-line scaling-history-conn scaling-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#scaling-history-tip)"/>
  <g class="scaling-history-stage scaling-history-s3">
    <rect class="scaling-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="scaling-history-step" x="752" y="142">04</text>
    <text class="scaling-history-name" x="778" y="142">And corrected again for serving</text>
    <text class="scaling-history-desc" x="752" y="166">Train small models far past the</text>
    <text class="scaling-history-desc" x="752" y="182">optimum.</text>
  </g>
  <text class="scaling-history-sub" x="30" y="304">Two corrections in four years is a reminder of how young this is: the numbers everyone now quotes as settled were wrong twice within recent memory.</text>
</svg>
