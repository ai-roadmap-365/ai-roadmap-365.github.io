<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Connections, not requests.">
  <title>What bounds a streaming gateway</title>
  <style>
    .sse-scale-bg   { fill: #f8fafc; }
    .sse-scale-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sse-scale-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sse-scale-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sse-scale-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sse-scale-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sse-scale-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sse-scale-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sse-scale-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sse-scale-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sse-scale-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sse-scale-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sse-scale-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .sse-scale-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .sse-scale-stage { opacity: 1; }

    .sse-scale-s0 { animation-delay: 0.00s; }
    .sse-scale-e0 { animation-delay: 0.00s; }
    .sse-scale-s1 { animation-delay: 1.28s; }
    .sse-scale-e1 { animation-delay: 1.28s; }
    .sse-scale-s2 { animation-delay: 2.56s; }
    .sse-scale-e2 { animation-delay: 2.56s; }
    .sse-scale-s3 { animation-delay: 3.84s; }
    .sse-scale-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .sse-scale-conn  { animation: sse-scale-trace 6.4s ease-in-out infinite; }
      .sse-scale-stage { animation: sse-scale-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes sse-scale-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes sse-scale-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .sse-scale-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .sse-scale-stage { animation: sse-scale-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes sse-scale-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="sse-scale-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="sse-scale-bg" width="980" height="322"/>
  <text class="sse-scale-h1"  x="30" y="40">What bounds a streaming gateway</text>
  <text class="sse-scale-sub" x="30" y="64">Connections, not requests.</text>
  <g class="sse-scale-stage sse-scale-s0">
    <rect class="sse-scale-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="sse-scale-step" x="44" y="142">01</text>
    <text class="sse-scale-name" x="70" y="142">Concurrency is open connections</text>
    <text class="sse-scale-desc" x="44" y="166">Not requests per second. A</text>
    <text class="sse-scale-desc" x="44" y="182">different capacity model</text>
    <text class="sse-scale-desc" x="44" y="198">entirely.</text>
    <text class="sse-scale-edge" x="44" y="242">connections</text>
  </g>
  <line class="sse-scale-line sse-scale-conn sse-scale-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#sse-scale-tip)"/>
  <g class="sse-scale-stage sse-scale-s1">
    <rect class="sse-scale-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="sse-scale-step" x="280" y="142">02</text>
    <text class="sse-scale-name" x="306" y="142">Memory per stream is small</text>
    <text class="sse-scale-desc" x="280" y="166">If you stream. It is the</text>
    <text class="sse-scale-desc" x="280" y="182">buffering that costs.</text>
  </g>
  <line class="sse-scale-line sse-scale-conn sse-scale-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#sse-scale-tip)"/>
  <g class="sse-scale-stage sse-scale-s2">
    <rect class="sse-scale-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="sse-scale-step" x="516" y="142">03</text>
    <text class="sse-scale-name" x="542" y="142">File descriptors are finite</text>
    <text class="sse-scale-desc" x="516" y="166">Raise the limit deliberately,</text>
    <text class="sse-scale-desc" x="516" y="182">and know what it is.</text>
  </g>
  <line class="sse-scale-line sse-scale-conn sse-scale-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#sse-scale-tip)"/>
  <g class="sse-scale-stage sse-scale-s3">
    <rect class="sse-scale-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="sse-scale-step" x="752" y="142">04</text>
    <text class="sse-scale-name" x="778" y="142">Load balancers must keep alive</text>
    <text class="sse-scale-desc" x="752" y="166">Idle timeouts and buffering both</text>
    <text class="sse-scale-desc" x="752" y="182">break streaming.</text>
  </g>
  <text class="sse-scale-sub" x="30" y="304">Sizing a streaming service by requests per second is the mistake that produces a capacity plan bearing no relation to what happens: a thousand slow streams is a very different load from a thousand fast requests.</text>
</svg>
