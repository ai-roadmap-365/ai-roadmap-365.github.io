<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Flat against nested.">
  <title>A printed form, or a filled folder</title>
  <style>
    .forms-envelopes-bg   { fill: #f8fafc; }
    .forms-envelopes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forms-envelopes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forms-envelopes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forms-envelopes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forms-envelopes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forms-envelopes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .forms-envelopes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .forms-envelopes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .forms-envelopes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .forms-envelopes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .forms-envelopes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .forms-envelopes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .forms-envelopes-row { opacity: 1; }
    .forms-envelopes-r0 { animation-delay: 0.00s; }
    .forms-envelopes-r1 { animation-delay: 0.45s; }
    .forms-envelopes-r2 { animation-delay: 0.90s; }
    .forms-envelopes-r3 { animation-delay: 1.35s; }
    .forms-envelopes-r4 { animation-delay: 1.80s; }
    .forms-envelopes-row { animation: forms-envelopes-reveal 7.3s ease-in-out infinite; }
    @keyframes forms-envelopes-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="forms-envelopes-bg" width="980" height="390"/>
  <text class="forms-envelopes-h1"  x="30" y="40">A printed form, or a filled folder</text>
  <text class="forms-envelopes-sub" x="30" y="64">Flat against nested.</text>
  <rect class="forms-envelopes-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="forms-envelopes-name" x="46" y="122">A form</text>
  <text class="forms-envelopes-desc" x="46" y="142">Fixed fields.</text>
  <text class="forms-envelopes-desc forms-envelopes-row forms-envelopes-r0" x="46" y="182">Same boxes on every copy</text>
  <text class="forms-envelopes-desc forms-envelopes-row forms-envelopes-r1" x="46" y="216">Easy to stack and compare</text>
  <text class="forms-envelopes-desc forms-envelopes-row forms-envelopes-r2" x="46" y="250">Cannot hold a sub-form</text>
  <text class="forms-envelopes-desc forms-envelopes-row forms-envelopes-r3" x="46" y="284">One line per person</text>
  <text class="forms-envelopes-desc forms-envelopes-row forms-envelopes-r4" x="46" y="318">This is tabular data</text>
  <rect class="forms-envelopes-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="forms-envelopes-name" x="526" y="122">A folder</text>
  <text class="forms-envelopes-desc" x="526" y="142">Nested contents.</text>
  <text class="forms-envelopes-desc forms-envelopes-row forms-envelopes-r0" x="526" y="182">Documents within documents</text>
  <text class="forms-envelopes-desc forms-envelopes-row forms-envelopes-r1" x="526" y="216">Each one different in shape</text>
  <text class="forms-envelopes-desc forms-envelopes-row forms-envelopes-r2" x="526" y="250">Holds arbitrary structure</text>
  <text class="forms-envelopes-desc forms-envelopes-row forms-envelopes-r3" x="526" y="284">Harder to compare across people</text>
  <text class="forms-envelopes-desc forms-envelopes-row forms-envelopes-r4" x="526" y="318">This is nested data</text>
  <text class="forms-envelopes-sub" x="30" y="372">Trying to flatten a folder onto a form is exactly what happens when nested data is forced into a table, and it is where most of the awkwardness comes from.</text>
</svg>
