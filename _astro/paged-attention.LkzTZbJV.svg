<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Operating-system memory management, applied.">
  <title>Paging the KV cache</title>
  <style>
    .paged-attention-bg   { fill: #f8fafc; }
    .paged-attention-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .paged-attention-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .paged-attention-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .paged-attention-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .paged-attention-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .paged-attention-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .paged-attention-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .paged-attention-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .paged-attention-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .paged-attention-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .paged-attention-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .paged-attention-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .paged-attention-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .paged-attention-stage { opacity: 1; }

    .paged-attention-s0 { animation-delay: 0.00s; }
    .paged-attention-e0 { animation-delay: 0.00s; }
    .paged-attention-s1 { animation-delay: 1.28s; }
    .paged-attention-e1 { animation-delay: 1.28s; }
    .paged-attention-s2 { animation-delay: 2.56s; }
    .paged-attention-e2 { animation-delay: 2.56s; }
    .paged-attention-s3 { animation-delay: 3.84s; }
    .paged-attention-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .paged-attention-conn  { animation: paged-attention-trace 6.4s ease-in-out infinite; }
      .paged-attention-stage { animation: paged-attention-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes paged-attention-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes paged-attention-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .paged-attention-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .paged-attention-stage { animation: paged-attention-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes paged-attention-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="paged-attention-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="paged-attention-bg" width="980" height="322"/>
  <text class="paged-attention-h1"  x="30" y="40">Paging the KV cache</text>
  <text class="paged-attention-sub" x="30" y="64">Operating-system memory management, applied.</text>
  <g class="paged-attention-stage paged-attention-s0">
    <rect class="paged-attention-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="paged-attention-step" x="44" y="142">01</text>
    <text class="paged-attention-name" x="70" y="142">Naive allocation reserves the maximum length</text>
    <text class="paged-attention-desc" x="44" y="166">Per request, whether used or</text>
    <text class="paged-attention-desc" x="44" y="182">not.</text>
  </g>
  <line class="paged-attention-line paged-attention-conn paged-attention-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#paged-attention-tip)"/>
  <g class="paged-attention-stage paged-attention-s1">
    <rect class="paged-attention-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="paged-attention-step" x="280" y="142">02</text>
    <text class="paged-attention-name" x="306" y="142">Which wastes most of the memory</text>
    <text class="paged-attention-desc" x="280" y="166">A short request holds capacity</text>
    <text class="paged-attention-desc" x="280" y="182">for a long one.</text>
  </g>
  <line class="paged-attention-line paged-attention-conn paged-attention-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#paged-attention-tip)"/>
  <g class="paged-attention-stage paged-attention-s2">
    <rect class="paged-attention-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="paged-attention-step" x="516" y="142">03</text>
    <text class="paged-attention-name" x="542" y="142">Allocate in fixed blocks instead</text>
    <text class="paged-attention-desc" x="516" y="166">With a per-sequence block table.</text>
    <text class="paged-attention-desc" x="516" y="182">Fragmentation bounded by one</text>
    <text class="paged-attention-desc" x="516" y="198">block.</text>
  </g>
  <line class="paged-attention-line paged-attention-conn paged-attention-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#paged-attention-tip)"/>
  <g class="paged-attention-stage paged-attention-s3">
    <rect class="paged-attention-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="paged-attention-step" x="752" y="142">04</text>
    <text class="paged-attention-name" x="778" y="142">And blocks can be shared</text>
    <text class="paged-attention-desc" x="752" y="166">Two requests with the same</text>
    <text class="paged-attention-desc" x="752" y="182">prefix share physical memory.</text>
  </g>
  <text class="paged-attention-sub" x="30" y="304">This is Day 003's virtual memory applied to attention state, including copy-on-write, and it produced several-fold improvements in serving concurrency without touching the model.</text>
</svg>
