<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By data structure and budget.">
  <title>Which validation when</title>
  <style>
    .cv-when-bg   { fill: #f8fafc; }
    .cv-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cv-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cv-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cv-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cv-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cv-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cv-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cv-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cv-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cv-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cv-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cv-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cv-when-row { opacity: 1; }
    .cv-when-r0 { animation-delay: 0.00s; }
    .cv-when-r1 { animation-delay: 0.45s; }
    .cv-when-r2 { animation-delay: 0.90s; }
    .cv-when-r3 { animation-delay: 1.35s; }
    .cv-when-r4 { animation-delay: 1.80s; }
    .cv-when-row { animation: cv-when-reveal 7.3s ease-in-out infinite; }
    @keyframes cv-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cv-when-bg" width="980" height="390"/>
  <text class="cv-when-h1"  x="30" y="40">Which validation when</text>
  <text class="cv-when-sub" x="30" y="64">By data structure and budget.</text>
  <rect class="cv-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cv-when-name" x="46" y="122">The situation</text>
  <text class="cv-when-desc" x="46" y="142">What you have.</text>
  <text class="cv-when-desc cv-when-row cv-when-r0" x="46" y="182">Small dataset, independent rows</text>
  <text class="cv-when-desc cv-when-row cv-when-r1" x="46" y="216">Large dataset, training is expensive</text>
  <text class="cv-when-desc cv-when-row cv-when-r2" x="46" y="250">Repeated measurements per entity</text>
  <text class="cv-when-desc cv-when-row cv-when-r3" x="46" y="284">Anything time-ordered</text>
  <text class="cv-when-desc cv-when-row cv-when-r4" x="46" y="318">Reporting a tuned model's performance</text>
  <rect class="cv-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cv-when-name" x="526" y="122">The approach</text>
  <text class="cv-when-desc" x="526" y="142">What to use.</text>
  <text class="cv-when-desc cv-when-row cv-when-r0" x="526" y="182">Ten-fold, stratified</text>
  <text class="cv-when-desc cv-when-row cv-when-r1" x="526" y="216">A single large holdout is adequate</text>
  <text class="cv-when-desc cv-when-row cv-when-r2" x="526" y="250">Group k-fold, always</text>
  <text class="cv-when-desc cv-when-row cv-when-r3" x="526" y="284">Expanding window with a gap</text>
  <text class="cv-when-desc cv-when-row cv-when-r4" x="526" y="318">Nested, or a locked test set</text>
  <text class="cv-when-sub" x="30" y="372">The second row is worth stating: on a large enough dataset a single holdout is statistically adequate, and cross-validation is then just expense.</text>
</svg>
