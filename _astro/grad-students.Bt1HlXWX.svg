<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Index cards, and a professor.">
  <title>A literature review team</title>
  <style>
    .grad-students-bg   { fill: #f8fafc; }
    .grad-students-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grad-students-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grad-students-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grad-students-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grad-students-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grad-students-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .grad-students-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .grad-students-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .grad-students-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .grad-students-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .grad-students-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .grad-students-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .grad-students-row { opacity: 1; }
    .grad-students-r0 { animation-delay: 0.00s; }
    .grad-students-r1 { animation-delay: 0.45s; }
    .grad-students-r2 { animation-delay: 0.90s; }
    .grad-students-r3 { animation-delay: 1.35s; }
    .grad-students-r4 { animation-delay: 1.80s; }
    .grad-students-row { animation: grad-students-reveal 7.3s ease-in-out infinite; }
    @keyframes grad-students-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="grad-students-bg" width="980" height="390"/>
  <text class="grad-students-h1"  x="30" y="40">A literature review team</text>
  <text class="grad-students-sub" x="30" y="64">Index cards, and a professor.</text>
  <rect class="grad-students-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="grad-students-name" x="46" y="122">A team</text>
  <text class="grad-students-desc" x="46" y="142">Divided by theme.</text>
  <text class="grad-students-desc grad-students-row grad-students-r0" x="46" y="182">One reads theoretical foundations</text>
  <text class="grad-students-desc grad-students-row grad-students-r1" x="46" y="216">One reviews experimental data</text>
  <text class="grad-students-desc grad-students-row grad-students-r2" x="46" y="250">One audits commercial implementations</text>
  <text class="grad-students-desc grad-students-row grad-students-r3" x="46" y="284">Index cards pooled into one store</text>
  <text class="grad-students-desc grad-students-row grad-students-r4" x="46" y="318">A professor organises and footnotes</text>
  <rect class="grad-students-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="grad-students-name" x="526" y="122">One reader</text>
  <text class="grad-students-desc" x="526" y="142">Same hours, less coverage.</text>
  <text class="grad-students-desc grad-students-row grad-students-r0" x="526" y="182">Reads what they find first</text>
  <text class="grad-students-desc grad-students-row grad-students-r1" x="526" y="216">Depth in one area, gaps elsewhere</text>
  <text class="grad-students-desc grad-students-row grad-students-r2" x="526" y="250">No independent cross-check</text>
  <text class="grad-students-desc grad-students-row grad-students-r3" x="526" y="284">Notes and synthesis in one head</text>
  <text class="grad-students-desc grad-students-row grad-students-r4" x="526" y="318">Attribution decays with time</text>
  <text class="grad-students-sub" x="30" y="372">The index cards are the note store and the professor is the synthesis pass, and the separation matters for the same reason: whoever writes the prose should be reading structured facts rather than remembering articles.</text>
</svg>
