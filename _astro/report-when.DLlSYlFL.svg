<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Scaled to consequence.">
  <title>How much documentation</title>
  <style>
    .report-when-bg   { fill: #f8fafc; }
    .report-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .report-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .report-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .report-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .report-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .report-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .report-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .report-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .report-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .report-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .report-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .report-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .report-when-row { opacity: 1; }
    .report-when-r0 { animation-delay: 0.00s; }
    .report-when-r1 { animation-delay: 0.45s; }
    .report-when-r2 { animation-delay: 0.90s; }
    .report-when-r3 { animation-delay: 1.35s; }
    .report-when-r4 { animation-delay: 1.80s; }
    .report-when-row { animation: report-when-reveal 7.3s ease-in-out infinite; }
    @keyframes report-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="report-when-bg" width="980" height="390"/>
  <text class="report-when-h1"  x="30" y="40">How much documentation</text>
  <text class="report-when-sub" x="30" y="64">Scaled to consequence.</text>
  <rect class="report-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="report-when-name" x="46" y="122">Full model card</text>
  <text class="report-when-desc" x="46" y="142">Four cases.</text>
  <text class="report-when-desc report-when-row report-when-r0" x="46" y="182">Decisions affecting people</text>
  <text class="report-when-desc report-when-row report-when-r1" x="46" y="216">Regulated sectors</text>
  <text class="report-when-desc report-when-row report-when-r2" x="46" y="250">Anything a third party consumes</text>
  <text class="report-when-desc report-when-row report-when-r3" x="46" y="284">Where the model outlives its authors</text>
  <text class="report-when-desc report-when-row report-when-r4" x="46" y="318">Where performance may be contested</text>
  <rect class="report-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="report-when-name" x="526" y="122">Lighter record</text>
  <text class="report-when-desc" x="526" y="142">Also four.</text>
  <text class="report-when-desc report-when-row report-when-r0" x="526" y="182">Internal exploratory work</text>
  <text class="report-when-desc report-when-row report-when-r1" x="526" y="216">Prototypes not deployed</text>
  <text class="report-when-desc report-when-row report-when-r2" x="526" y="250">Where one person owns it end to end</text>
  <text class="report-when-desc report-when-row report-when-r3" x="526" y="284">Short-lived analysis</text>
  <text class="report-when-desc report-when-row report-when-r4" x="526" y="318">But record the evaluation regardless</text>
  <text class="report-when-sub" x="30" y="372">The floor in every case is the evaluation record: what it scored, on what data, at what operating point — which takes minutes and answers most later questions.</text>
</svg>
