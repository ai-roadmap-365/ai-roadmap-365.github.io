<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when to move on.">
  <title>When to reproduce a paper</title>
  <style>
    .repro-when-bg   { fill: #f8fafc; }
    .repro-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .repro-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .repro-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .repro-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .repro-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .repro-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .repro-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .repro-when-row { opacity: 1; }
    .repro-when-r0 { animation-delay: 0.00s; }
    .repro-when-r1 { animation-delay: 0.45s; }
    .repro-when-r2 { animation-delay: 0.90s; }
    .repro-when-r3 { animation-delay: 1.35s; }
    .repro-when-r4 { animation-delay: 1.80s; }
    .repro-when-row { animation: repro-when-reveal 7.3s ease-in-out infinite; }
    @keyframes repro-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="repro-when-bg" width="980" height="390"/>
  <text class="repro-when-h1"  x="30" y="40">When to reproduce a paper</text>
  <text class="repro-when-sub" x="30" y="64">And when to move on.</text>
  <rect class="repro-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="repro-when-name" x="46" y="122">Reproduce</text>
  <text class="repro-when-desc" x="46" y="142">Four good reasons.</text>
  <text class="repro-when-desc repro-when-row repro-when-r0" x="46" y="182">You are about to build on the result</text>
  <text class="repro-when-desc repro-when-row repro-when-r1" x="46" y="216">The claim is surprising and load-bearing</text>
  <text class="repro-when-desc repro-when-row repro-when-r2" x="46" y="250">You are learning the area deliberately</text>
  <text class="repro-when-desc repro-when-row repro-when-r3" x="46" y="284">A production decision depends on it</text>
  <text class="repro-when-desc repro-when-row repro-when-r4" x="46" y="318">And the compute is affordable</text>
  <rect class="repro-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="repro-when-name" x="526" y="122">Do not</text>
  <text class="repro-when-desc" x="526" y="142">Use it directly.</text>
  <text class="repro-when-desc repro-when-row repro-when-r0" x="526" y="182">Official code exists and is trusted</text>
  <text class="repro-when-desc repro-when-row repro-when-r1" x="526" y="216">The result is long established</text>
  <text class="repro-when-desc repro-when-row repro-when-r2" x="526" y="250">The compute cost is prohibitive</text>
  <text class="repro-when-desc repro-when-row repro-when-r3" x="526" y="284">You only need the method, not the number</text>
  <text class="repro-when-desc repro-when-row repro-when-r4" x="526" y="318">Where a smaller-scale check would answer it</text>
  <text class="repro-when-sub" x="30" y="372">A reduced-scale reproduction is the underused middle option: matching the trend at a tenth of the size answers most questions at a small fraction of the cost.</text>
</svg>
