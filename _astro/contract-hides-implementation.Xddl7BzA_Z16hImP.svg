<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The provider gains freedom; you gain stability.">
  <title>What the boundary buys both sides</title>
  <style>
    .contract-hides-implementation-bg   { fill: #f8fafc; }
    .contract-hides-implementation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .contract-hides-implementation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .contract-hides-implementation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .contract-hides-implementation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .contract-hides-implementation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .contract-hides-implementation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .contract-hides-implementation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .contract-hides-implementation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .contract-hides-implementation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .contract-hides-implementation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .contract-hides-implementation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .contract-hides-implementation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .contract-hides-implementation-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .contract-hides-implementation-stage { opacity: 1; }

    .contract-hides-implementation-s0 { animation-delay: 0.00s; }
    .contract-hides-implementation-e0 { animation-delay: 0.00s; }
    .contract-hides-implementation-s1 { animation-delay: 1.28s; }
    .contract-hides-implementation-e1 { animation-delay: 1.28s; }
    .contract-hides-implementation-s2 { animation-delay: 2.56s; }
    .contract-hides-implementation-e2 { animation-delay: 2.56s; }
    .contract-hides-implementation-s3 { animation-delay: 3.84s; }
    .contract-hides-implementation-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .contract-hides-implementation-conn  { animation: contract-hides-implementation-trace 6.4s ease-in-out infinite; }
      .contract-hides-implementation-stage { animation: contract-hides-implementation-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes contract-hides-implementation-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes contract-hides-implementation-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .contract-hides-implementation-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .contract-hides-implementation-stage { animation: contract-hides-implementation-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes contract-hides-implementation-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="contract-hides-implementation-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="contract-hides-implementation-bg" width="980" height="322"/>
  <text class="contract-hides-implementation-h1"  x="30" y="40">What the boundary buys both sides</text>
  <text class="contract-hides-implementation-sub" x="30" y="64">The provider gains freedom; you gain stability.</text>
  <g class="contract-hides-implementation-stage contract-hides-implementation-s0">
    <rect class="contract-hides-implementation-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="contract-hides-implementation-step" x="44" y="142">01</text>
    <text class="contract-hides-implementation-name" x="70" y="142">You depend on the shape</text>
    <text class="contract-hides-implementation-desc" x="44" y="166">Request in, response out.</text>
    <text class="contract-hides-implementation-desc" x="44" y="182">Nothing about how it happens.</text>
  </g>
  <line class="contract-hides-implementation-line contract-hides-implementation-conn contract-hides-implementation-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#contract-hides-implementation-tip)"/>
  <g class="contract-hides-implementation-stage contract-hides-implementation-s1">
    <rect class="contract-hides-implementation-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="contract-hides-implementation-step" x="280" y="142">02</text>
    <text class="contract-hides-implementation-name" x="306" y="142">They can rewrite everything</text>
    <text class="contract-hides-implementation-desc" x="280" y="166">New language, new database, new</text>
    <text class="contract-hides-implementation-desc" x="280" y="182">servers. You never notice.</text>
    <text class="contract-hides-implementation-edge" x="280" y="242">freedom</text>
  </g>
  <line class="contract-hides-implementation-line contract-hides-implementation-conn contract-hides-implementation-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#contract-hides-implementation-tip)"/>
  <g class="contract-hides-implementation-stage contract-hides-implementation-s2">
    <rect class="contract-hides-implementation-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="contract-hides-implementation-step" x="516" y="142">03</text>
    <text class="contract-hides-implementation-name" x="542" y="142">A version number is the promise</text>
    <text class="contract-hides-implementation-desc" x="516" y="166">/v1/ says: this shape will not</text>
    <text class="contract-hides-implementation-desc" x="516" y="182">change under you.</text>
    <text class="contract-hides-implementation-edge" x="516" y="242">stability</text>
  </g>
  <line class="contract-hides-implementation-line contract-hides-implementation-conn contract-hides-implementation-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#contract-hides-implementation-tip)"/>
  <g class="contract-hides-implementation-stage contract-hides-implementation-s3">
    <rect class="contract-hides-implementation-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="contract-hides-implementation-step" x="752" y="142">04</text>
    <text class="contract-hides-implementation-name" x="778" y="142">And you can leave</text>
    <text class="contract-hides-implementation-desc" x="752" y="166">A similar contract elsewhere is</text>
    <text class="contract-hides-implementation-desc" x="752" y="182">a change of endpoint, not a</text>
    <text class="contract-hides-implementation-desc" x="752" y="198">rewrite.</text>
  </g>
  <text class="contract-hides-implementation-sub" x="30" y="304">This is why a breaking change to a public API is treated so seriously: it is not a bug, it is a promise withdrawn.</text>
</svg>
