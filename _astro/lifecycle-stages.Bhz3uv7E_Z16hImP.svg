<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Modelling is one of them.">
  <title>The six stages</title>
  <style>
    .lifecycle-stages-bg   { fill: #f8fafc; }
    .lifecycle-stages-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lifecycle-stages-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lifecycle-stages-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lifecycle-stages-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lifecycle-stages-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lifecycle-stages-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lifecycle-stages-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .lifecycle-stages-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .lifecycle-stages-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .lifecycle-stages-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .lifecycle-stages-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .lifecycle-stages-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .lifecycle-stages-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .lifecycle-stages-stage { opacity: 1; }

    .lifecycle-stages-s0 { animation-delay: 0.00s; }
    .lifecycle-stages-e0 { animation-delay: 0.00s; }
    .lifecycle-stages-s1 { animation-delay: 1.37s; }
    .lifecycle-stages-e1 { animation-delay: 1.37s; }
    .lifecycle-stages-s2 { animation-delay: 2.74s; }
    .lifecycle-stages-e2 { animation-delay: 2.74s; }
    .lifecycle-stages-s3 { animation-delay: 4.11s; }
    .lifecycle-stages-e3 { animation-delay: 4.11s; }
    .lifecycle-stages-s4 { animation-delay: 5.49s; }
    .lifecycle-stages-e4 { animation-delay: 5.49s; }
    .lifecycle-stages-s5 { animation-delay: 6.86s; }
    .lifecycle-stages-e5 { animation-delay: 6.86s; }
    @media (prefers-reduced-motion: no-preference) {
      .lifecycle-stages-conn  { animation: lifecycle-stages-trace 9.600000000000001s ease-in-out infinite; }
      .lifecycle-stages-stage { animation: lifecycle-stages-arrive 9.600000000000001s ease-in-out infinite; }
    }
    @keyframes lifecycle-stages-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes lifecycle-stages-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .lifecycle-stages-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .lifecycle-stages-stage { animation: lifecycle-stages-settle 9.600000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes lifecycle-stages-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="lifecycle-stages-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="lifecycle-stages-bg" width="980" height="322"/>
  <text class="lifecycle-stages-h1"  x="30" y="40">The six stages</text>
  <text class="lifecycle-stages-sub" x="30" y="64">Modelling is one of them.</text>
  <g class="lifecycle-stages-stage lifecycle-stages-s0">
    <rect class="lifecycle-stages-box" x="30" y="118" width="131" height="104" rx="10"/>
    <text class="lifecycle-stages-step" x="44" y="142">01</text>
    <text class="lifecycle-stages-name" x="70" y="142">Frame the problem</text>
    <text class="lifecycle-stages-desc" x="44" y="166">What decision, what</text>
    <text class="lifecycle-stages-desc" x="44" y="182">value, what would</text>
    <text class="lifecycle-stages-desc" x="44" y="198">success mean.</text>
  </g>
  <line class="lifecycle-stages-line lifecycle-stages-conn lifecycle-stages-e0" x1="163" y1="170" x2="185" y2="170" marker-end="url(#lifecycle-stages-tip)"/>
  <g class="lifecycle-stages-stage lifecycle-stages-s1">
    <rect class="lifecycle-stages-warn" x="187" y="118" width="131" height="104" rx="10"/>
    <text class="lifecycle-stages-step" x="201" y="142">02</text>
    <text class="lifecycle-stages-name" x="227" y="142">Get and understand the data</text>
    <text class="lifecycle-stages-desc" x="201" y="166">Usually the longest</text>
    <text class="lifecycle-stages-desc" x="201" y="182">stage.</text>
  </g>
  <line class="lifecycle-stages-line lifecycle-stages-conn lifecycle-stages-e1" x1="320" y1="170" x2="342" y2="170" marker-end="url(#lifecycle-stages-tip)"/>
  <g class="lifecycle-stages-stage lifecycle-stages-s2">
    <rect class="lifecycle-stages-box" x="344" y="118" width="131" height="104" rx="10"/>
    <text class="lifecycle-stages-step" x="358" y="142">03</text>
    <text class="lifecycle-stages-name" x="384" y="142">Model</text>
    <text class="lifecycle-stages-desc" x="358" y="166">The shortest stage,</text>
    <text class="lifecycle-stages-desc" x="358" y="182">and the one everyone</text>
    <text class="lifecycle-stages-desc" x="358" y="198">plans for.</text>
  </g>
  <line class="lifecycle-stages-line lifecycle-stages-conn lifecycle-stages-e2" x1="477" y1="170" x2="499" y2="170" marker-end="url(#lifecycle-stages-tip)"/>
  <g class="lifecycle-stages-stage lifecycle-stages-s3">
    <rect class="lifecycle-stages-box" x="501" y="118" width="131" height="104" rx="10"/>
    <text class="lifecycle-stages-step" x="515" y="142">04</text>
    <text class="lifecycle-stages-name" x="541" y="142">Evaluate against the baseline</text>
    <text class="lifecycle-stages-desc" x="515" y="166">With the gates from</text>
    <text class="lifecycle-stages-desc" x="515" y="182">earlier in this</text>
    <text class="lifecycle-stages-desc" x="515" y="198">course.</text>
  </g>
  <line class="lifecycle-stages-line lifecycle-stages-conn lifecycle-stages-e3" x1="634" y1="170" x2="656" y2="170" marker-end="url(#lifecycle-stages-tip)"/>
  <g class="lifecycle-stages-stage lifecycle-stages-s4">
    <rect class="lifecycle-stages-good" x="658" y="118" width="131" height="104" rx="10"/>
    <text class="lifecycle-stages-step" x="672" y="142">05</text>
    <text class="lifecycle-stages-name" x="698" y="142">Deploy</text>
    <text class="lifecycle-stages-desc" x="672" y="166">Which is where most</text>
    <text class="lifecycle-stages-desc" x="672" y="182">projects stop, and</text>
    <text class="lifecycle-stages-desc" x="672" y="198">should not.</text>
  </g>
  <line class="lifecycle-stages-line lifecycle-stages-conn lifecycle-stages-e4" x1="791" y1="170" x2="813" y2="170" marker-end="url(#lifecycle-stages-tip)"/>
  <g class="lifecycle-stages-stage lifecycle-stages-s5">
    <rect class="lifecycle-stages-box" x="815" y="118" width="131" height="104" rx="10"/>
    <text class="lifecycle-stages-step" x="829" y="142">06</text>
    <text class="lifecycle-stages-name" x="855" y="142">Then monitor, and retrain</text>
    <text class="lifecycle-stages-desc" x="829" y="166">Which continues for</text>
    <text class="lifecycle-stages-desc" x="829" y="182">the model's whole</text>
    <text class="lifecycle-stages-desc" x="829" y="198">life.</text>
    <text class="lifecycle-stages-edge" x="829" y="242">ongoing</text>
  </g>
  <text class="lifecycle-stages-sub" x="30" y="304">Modelling being the shortest stage is the observation that reframes the whole discipline, and it is why the surrounding stages decide whether a project succeeds.</text>
</svg>
