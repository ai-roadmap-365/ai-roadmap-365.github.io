<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when it does not.">
  <title>When the choice matters</title>
  <style>
    .activation-when-bg   { fill: #f8fafc; }
    .activation-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .activation-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .activation-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .activation-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .activation-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .activation-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .activation-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .activation-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .activation-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .activation-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .activation-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .activation-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .activation-when-row { opacity: 1; }
    .activation-when-r0 { animation-delay: 0.00s; }
    .activation-when-r1 { animation-delay: 0.45s; }
    .activation-when-r2 { animation-delay: 0.90s; }
    .activation-when-r3 { animation-delay: 1.35s; }
    .activation-when-r4 { animation-delay: 1.80s; }
    .activation-when-row { animation: activation-when-reveal 7.3s ease-in-out infinite; }
    @keyframes activation-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="activation-when-bg" width="980" height="390"/>
  <text class="activation-when-h1"  x="30" y="40">When the choice matters</text>
  <text class="activation-when-sub" x="30" y="64">And when it does not.</text>
  <rect class="activation-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="activation-when-name" x="46" y="122">It matters</text>
  <text class="activation-when-desc" x="46" y="142">Depth and scale.</text>
  <text class="activation-when-desc activation-when-row activation-when-r0" x="46" y="182">Deep networks — vanishing gradients compound</text>
  <text class="activation-when-desc activation-when-row activation-when-r1" x="46" y="216">Transformers at scale</text>
  <text class="activation-when-desc activation-when-row activation-when-r2" x="46" y="250">Networks that train unstably</text>
  <text class="activation-when-desc activation-when-row activation-when-r3" x="46" y="284">Where a unit dying costs capacity</text>
  <text class="activation-when-desc activation-when-row activation-when-r4" x="46" y="318">Where compute per activation is significant</text>
  <rect class="activation-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="activation-when-name" x="526" y="122">It matters less</text>
  <text class="activation-when-desc" x="526" y="142">Shallow and small.</text>
  <text class="activation-when-desc activation-when-row activation-when-r0" x="526" y="182">Two or three layers</text>
  <text class="activation-when-desc activation-when-row activation-when-r1" x="526" y="216">Any reasonable non-linearity works</text>
  <text class="activation-when-desc activation-when-row activation-when-r2" x="526" y="250">The difference is within run-to-run noise</text>
  <text class="activation-when-desc activation-when-row activation-when-r3" x="526" y="284">Spend the effort on data instead</text>
  <text class="activation-when-desc activation-when-row activation-when-r4" x="526" y="318">But never use none</text>
  <text class="activation-when-sub" x="30" y="372">"Never use none" is the one absolute here: an activation choice can be suboptimal, and its absence turns a deep network into a linear model with an expensive parameter count.</text>
</svg>
