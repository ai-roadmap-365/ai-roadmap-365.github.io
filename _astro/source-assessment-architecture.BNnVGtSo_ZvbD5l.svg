<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 760" role="img" aria-labelledby="d134a-title d134a-desc" width="1220" height="760">
  <title id="d134a-title">A candidate dataset passing through six assessment gates before it is trusted</title>
  <desc id="d134a-desc">A candidate dataset enters on the left and passes through six gates in sequence: provenance, data dictionary, granularity, coverage, licence, and checksum. Each gate shows what failing it costs later. A dataset that clears all six reaches "ready for analysis" on the right; one that fails any gate is marked as needing more work before use.</desc>
  <style>
    .d134a-bg    { fill: #f8fafc; }
    .d134a-lead  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 25px; font-weight: 700; fill: #1d4ed8; }
    .d134a-note  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #1a202c; }
    .d134a-h     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; fill: #1a202c; }
    .d134a-t     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1a202c; }
    .d134a-cost  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13.5px; fill: #b91c1c; }
    .d134a-tag   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; }
    .d134a-src   { fill: #e2e8f0; stroke: #64748b; stroke-width: 2; }
    .d134a-gate  { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.5; }
    .d134a-badge { fill: #1d4ed8; }
    .d134a-ready { fill: #dcfce7; stroke: #16a34a; stroke-width: 2.5; }
    .d134a-wire  { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
  </style>

  <rect class="d134a-bg" x="0" y="0" width="1220" height="760" />
  <text class="d134a-lead" x="40" y="42">Six gates stand between a dataset you found and a dataset you can trust.</text>
  <text class="d134a-note" x="40" y="66">Read the dictionary before the data. A failure at any gate is invisible in the numbers themselves.</text>

  <defs>
    <marker id="d134a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
  </defs>

  <!-- Source -->
  <rect class="d134a-src" x="30" y="110" width="130" height="90" rx="8" />
  <text class="d134a-h" x="95" y="148" text-anchor="middle">Candidate</text>
  <text class="d134a-t" x="95" y="168" text-anchor="middle">dataset</text>

  <line class="d134a-wire" x1="160" y1="155" x2="195" y2="155" marker-end="url(#d134a-arrow)" />

  <!-- Gate 1: Provenance -->
  <g>
    <rect class="d134a-gate" x="195" y="105" width="150" height="100" rx="8" />
    <circle class="d134a-badge" cx="212" cy="122" r="12" />
    <text class="d134a-tag" x="212" y="127" text-anchor="middle">1</text>
    <text class="d134a-h" x="270" y="140" text-anchor="middle">Provenance</text>
    <text class="d134a-t" x="270" y="160" text-anchor="middle">Who published it,</text>
    <text class="d134a-t" x="270" y="176" text-anchor="middle">and when?</text>
    <text class="d134a-cost" x="270" y="235">Fails: cannot cite it,</text>
    <text class="d134a-cost" x="270" y="251">cannot re-fetch it.</text>
  </g>
  <line class="d134a-wire" x1="345" y1="155" x2="380" y2="155" marker-end="url(#d134a-arrow)" />

  <!-- Gate 2: Dictionary -->
  <g>
    <rect class="d134a-gate" x="380" y="105" width="150" height="100" rx="8" />
    <circle class="d134a-badge" cx="397" cy="122" r="12" />
    <text class="d134a-tag" x="397" y="127" text-anchor="middle">2</text>
    <text class="d134a-h" x="455" y="140" text-anchor="middle">Dictionary</text>
    <text class="d134a-t" x="455" y="160" text-anchor="middle">Does a codebook</text>
    <text class="d134a-t" x="455" y="176" text-anchor="middle">define each column?</text>
    <text class="d134a-cost" x="455" y="235">Fails: two same-named</text>
    <text class="d134a-cost" x="455" y="251">columns get joined wrong.</text>
  </g>
  <line class="d134a-wire" x1="530" y1="155" x2="565" y2="155" marker-end="url(#d134a-arrow)" />

  <!-- Gate 3: Granularity -->
  <g>
    <rect class="d134a-gate" x="565" y="105" width="150" height="100" rx="8" />
    <circle class="d134a-badge" cx="582" cy="122" r="12" />
    <text class="d134a-tag" x="582" y="127" text-anchor="middle">3</text>
    <text class="d134a-h" x="640" y="140" text-anchor="middle">Granularity</text>
    <text class="d134a-t" x="640" y="160" text-anchor="middle">Per row, what is</text>
    <text class="d134a-t" x="640" y="176" text-anchor="middle">actually being counted?</text>
    <text class="d134a-cost" x="640" y="235">Fails: aggregates that look</text>
    <text class="d134a-cost" x="640" y="251">precise, are not comparable.</text>
  </g>
  <line class="d134a-wire" x1="715" y1="155" x2="750" y2="155" marker-end="url(#d134a-arrow)" />

  <!-- Gate 4: Coverage -->
  <g>
    <rect class="d134a-gate" x="750" y="105" width="150" height="100" rx="8" />
    <circle class="d134a-badge" cx="767" cy="122" r="12" />
    <text class="d134a-tag" x="767" y="127" text-anchor="middle">4</text>
    <text class="d134a-h" x="825" y="140" text-anchor="middle">Coverage</text>
    <text class="d134a-t" x="825" y="160" text-anchor="middle">Does every region or</text>
    <text class="d134a-t" x="825" y="176" text-anchor="middle">group claimed appear?</text>
    <text class="d134a-cost" x="825" y="235">Fails: a "national" result</text>
    <text class="d134a-cost" x="825" y="251">that quietly excludes some.</text>
  </g>
  <line class="d134a-wire" x1="900" y1="155" x2="935" y2="155" marker-end="url(#d134a-arrow)" />

  <!-- Gate 5: Licence -->
  <g>
    <rect class="d134a-gate" x="935" y="105" width="140" height="100" rx="8" />
    <circle class="d134a-badge" cx="952" cy="122" r="12" />
    <text class="d134a-tag" x="952" y="127" text-anchor="middle">5</text>
    <text class="d134a-h" x="1005" y="140" text-anchor="middle">Licence</text>
    <text class="d134a-t" x="1005" y="160" text-anchor="middle">May you analyse it?</text>
    <text class="d134a-t" x="1005" y="176" text-anchor="middle">Republish it?</text>
    <text class="d134a-cost" x="1005" y="235">Fails: a report you cannot</text>
    <text class="d134a-cost" x="1005" y="251">legally publish.</text>
  </g>

  <!-- Gate 6 continues below, arrow bends down -->
  <line class="d134a-wire" x1="1075" y1="205" x2="1075" y2="235" />
  <line class="d134a-wire" x1="1075" y1="235" x2="1005" y2="235" />
  <line class="d134a-wire" x1="1005" y1="235" x2="1005" y2="360" marker-end="url(#d134a-arrow)" />

  <g>
    <rect class="d134a-gate" x="930" y="360" width="150" height="100" rx="8" />
    <circle class="d134a-badge" cx="947" cy="377" r="12" />
    <text class="d134a-tag" x="947" y="382" text-anchor="middle">6</text>
    <text class="d134a-h" x="1005" y="395" text-anchor="middle">Checksum</text>
    <text class="d134a-t" x="1005" y="415" text-anchor="middle">Is what you downloaded</text>
    <text class="d134a-t" x="1005" y="431" text-anchor="middle">what you think it is?</text>
    <text class="d134a-cost" x="1005" y="490">Fails: "downloaded from X"</text>
    <text class="d134a-cost" x="1005" y="506">is a claim, not a proof.</text>
  </g>

  <line class="d134a-wire" x1="930" y1="410" x2="895" y2="410" marker-end="url(#d134a-arrow)" />

  <g>
    <rect class="d134a-ready" x="700" y="365" width="180" height="90" rx="8" />
    <text class="d134a-h" x="790" y="400" text-anchor="middle">Ready for</text>
    <text class="d134a-h" x="790" y="420" text-anchor="middle">analysis</text>
    <text class="d134a-t" x="790" y="440" text-anchor="middle">All six gates cleared</text>
  </g>

  <text class="d134a-note" x="40" y="610">A source that fails any gate is not disqualified — it needs a stated caveat, not a silent join.</text>
  <text class="d134a-note" x="40" y="632">The two "unemployment_rate" columns in this day's opening story pass every gate except one: the dictionary.</text>
  <text class="d134a-note" x="40" y="654">Gate 2 is the one people skip, because gates 3-6 are checked against the data and gate 2 is checked against the prose.</text>
</svg>
