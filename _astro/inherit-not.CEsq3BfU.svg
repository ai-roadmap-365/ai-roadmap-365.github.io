<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things inheritance is not</title>
  <style>
    .inherit-not-bg   { fill: #f8fafc; }
    .inherit-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inherit-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inherit-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inherit-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inherit-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inherit-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .inherit-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .inherit-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .inherit-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .inherit-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .inherit-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .inherit-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .inherit-not-row { opacity: 1; }
    .inherit-not-r0 { animation-delay: 0.00s; }
    .inherit-not-r1 { animation-delay: 0.45s; }
    .inherit-not-r2 { animation-delay: 0.90s; }
    .inherit-not-r3 { animation-delay: 1.35s; }
    .inherit-not-r4 { animation-delay: 1.80s; }
    .inherit-not-row { animation: inherit-not-reveal 7.3s ease-in-out infinite; }
    @keyframes inherit-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="inherit-not-bg" width="980" height="390"/>
  <text class="inherit-not-h1"  x="30" y="40">Four things inheritance is not</text>
  <text class="inherit-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="inherit-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="inherit-not-name" x="46" y="122">The misconception</text>
  <text class="inherit-not-desc" x="46" y="142">Commonly held.</text>
  <text class="inherit-not-desc inherit-not-row inherit-not-r0" x="46" y="182">Inheritance is for code reuse</text>
  <text class="inherit-not-desc inherit-not-row inherit-not-r1" x="46" y="216">Deeper hierarchies are better designed</text>
  <text class="inherit-not-desc inherit-not-row inherit-not-r2" x="46" y="250">Multiple inheritance is unpredictable</text>
  <text class="inherit-not-desc inherit-not-row inherit-not-r3" x="46" y="284">A subclass can freely narrow behaviour</text>
  <text class="inherit-not-desc inherit-not-row inherit-not-r4" x="46" y="318">Duck typing means no interface</text>
  <rect class="inherit-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="inherit-not-name" x="526" y="122">What is true</text>
  <text class="inherit-not-desc" x="526" y="142">Actually.</text>
  <text class="inherit-not-desc inherit-not-row inherit-not-r0" x="526" y="182">Composition reuses better; inheritance is for is-a</text>
  <text class="inherit-not-desc inherit-not-row inherit-not-r1" x="526" y="216">Depth makes behaviour hard to locate</text>
  <text class="inherit-not-desc inherit-not-row inherit-not-r2" x="526" y="250">The resolution order is deterministic</text>
  <text class="inherit-not-desc inherit-not-row inherit-not-r3" x="526" y="284">Narrowing breaks substitutability</text>
  <text class="inherit-not-desc inherit-not-row inherit-not-r4" x="526" y="318">The interface is implicit, not absent</text>
  <text class="inherit-not-sub" x="30" y="372">Using inheritance for reuse rather than for a genuine is-a relationship is the root of most fragile hierarchies, and composition does the reuse job better.</text>
</svg>
