<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things a cleaning pipeline is not</title>
  <style>
    .pipe-not-bg   { fill: #f8fafc; }
    .pipe-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipe-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipe-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipe-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipe-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipe-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pipe-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pipe-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pipe-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pipe-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pipe-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pipe-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pipe-not-row { opacity: 1; }
    .pipe-not-r0 { animation-delay: 0.00s; }
    .pipe-not-r1 { animation-delay: 0.45s; }
    .pipe-not-r2 { animation-delay: 0.90s; }
    .pipe-not-r3 { animation-delay: 1.35s; }
    .pipe-not-r4 { animation-delay: 1.80s; }
    .pipe-not-row { animation: pipe-not-reveal 7.3s ease-in-out infinite; }
    @keyframes pipe-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="pipe-not-bg" width="980" height="390"/>
  <text class="pipe-not-h1"  x="30" y="40">Four things a cleaning pipeline is not</text>
  <text class="pipe-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="pipe-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="pipe-not-name" x="46" y="122">The misconception</text>
  <text class="pipe-not-desc" x="46" y="142">Commonly held.</text>
  <text class="pipe-not-desc pipe-not-row pipe-not-r0" x="46" y="182">A notebook is a pipeline</text>
  <text class="pipe-not-desc pipe-not-row pipe-not-r1" x="46" y="216">It runs correctly if it ran once</text>
  <text class="pipe-not-desc pipe-not-row pipe-not-r2" x="46" y="250">Cleaned data should be edited in place</text>
  <text class="pipe-not-desc pipe-not-row pipe-not-r3" x="46" y="284">Reproducible means it produces the same numbers</text>
  <text class="pipe-not-desc pipe-not-row pipe-not-r4" x="46" y="318">Documentation can come later</text>
  <rect class="pipe-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="pipe-not-name" x="526" y="122">What is true</text>
  <text class="pipe-not-desc" x="526" y="142">Actually.</text>
  <text class="pipe-not-desc pipe-not-row pipe-not-r0" x="526" y="182">Notebooks run out of order; scripts do not</text>
  <text class="pipe-not-desc pipe-not-row pipe-not-r1" x="526" y="216">Sources change; assertions catch it</text>
  <text class="pipe-not-desc pipe-not-row pipe-not-r2" x="526" y="250">Regenerate it from raw</text>
  <text class="pipe-not-desc pipe-not-row pipe-not-r3" x="526" y="284">It means anyone can rerun and get them</text>
  <text class="pipe-not-desc pipe-not-row pipe-not-r4" x="526" y="318">The decisions are forgotten within weeks</text>
  <text class="pipe-not-sub" x="30" y="372">Notebooks running out of order is a genuine reproducibility hazard, and it is why a cleaning pipeline belongs in a script even when exploration happens in a notebook.</text>
</svg>
