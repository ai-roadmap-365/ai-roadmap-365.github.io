<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One bounds a single access. The other bounds a stream.">
  <title>The pair people mix up most</title>
  <style>
    .latency-versus-bandwidth-bg   { fill: #f8fafc; }
    .latency-versus-bandwidth-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-versus-bandwidth-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-versus-bandwidth-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-versus-bandwidth-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-versus-bandwidth-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-versus-bandwidth-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .latency-versus-bandwidth-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .latency-versus-bandwidth-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .latency-versus-bandwidth-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .latency-versus-bandwidth-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .latency-versus-bandwidth-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .latency-versus-bandwidth-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .latency-versus-bandwidth-row { opacity: 1; }
    .latency-versus-bandwidth-r0 { animation-delay: 0.00s; }
    .latency-versus-bandwidth-r1 { animation-delay: 0.45s; }
    .latency-versus-bandwidth-r2 { animation-delay: 0.90s; }
    .latency-versus-bandwidth-r3 { animation-delay: 1.35s; }
    .latency-versus-bandwidth-r4 { animation-delay: 1.80s; }
    .latency-versus-bandwidth-row { animation: latency-versus-bandwidth-reveal 7.3s ease-in-out infinite; }
    @keyframes latency-versus-bandwidth-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="latency-versus-bandwidth-bg" width="980" height="390"/>
  <text class="latency-versus-bandwidth-h1"  x="30" y="40">The pair people mix up most</text>
  <text class="latency-versus-bandwidth-sub" x="30" y="64">One bounds a single access. The other bounds a stream.</text>
  <rect class="latency-versus-bandwidth-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="latency-versus-bandwidth-name" x="46" y="122">Latency</text>
  <text class="latency-versus-bandwidth-desc" x="46" y="142">How long ONE access takes</text>
  <text class="latency-versus-bandwidth-desc latency-versus-bandwidth-row latency-versus-bandwidth-r0" x="46" y="182">About 100 ns for a RAM read</text>
  <text class="latency-versus-bandwidth-desc latency-versus-bandwidth-row latency-versus-bandwidth-r1" x="46" y="216">Does not improve by asking for more at once</text>
  <text class="latency-versus-bandwidth-desc latency-versus-bandwidth-row latency-versus-bandwidth-r2" x="46" y="250">Bounds a random access</text>
  <text class="latency-versus-bandwidth-desc latency-versus-bandwidth-row latency-versus-bandwidth-r3" x="46" y="284">Hidden by caches and prefetching</text>
  <text class="latency-versus-bandwidth-desc latency-versus-bandwidth-row latency-versus-bandwidth-r4" x="46" y="318">The reason a linked list is slow</text>
  <rect class="latency-versus-bandwidth-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="latency-versus-bandwidth-name" x="526" y="122">Bandwidth</text>
  <text class="latency-versus-bandwidth-desc" x="526" y="142">Bytes per second once flowing</text>
  <text class="latency-versus-bandwidth-desc latency-versus-bandwidth-row latency-versus-bandwidth-r0" x="526" y="182">About 400 GB/s on a modern accelerator</text>
  <text class="latency-versus-bandwidth-desc latency-versus-bandwidth-row latency-versus-bandwidth-r1" x="526" y="216">Improves with wider buses and stacked memory</text>
  <text class="latency-versus-bandwidth-desc latency-versus-bandwidth-row latency-versus-bandwidth-r2" x="526" y="250">Bounds a stream, like reading every weight</text>
  <text class="latency-versus-bandwidth-desc latency-versus-bandwidth-row latency-versus-bandwidth-r3" x="526" y="284">Not helped by caching if you read everything</text>
  <text class="latency-versus-bandwidth-desc latency-versus-bandwidth-row latency-versus-bandwidth-r4" x="526" y="318">The reason token generation has a ceiling</text>
  <text class="latency-versus-bandwidth-sub" x="30" y="372">A model's SIZE is bounded by capacity, its SPEED usually by bandwidth, and one random access by latency.</text>
</svg>
