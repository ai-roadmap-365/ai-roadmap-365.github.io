<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One is permanent; one has a date.">
  <title>A tier is not a trial</title>
  <style>
    .tier-versus-trial-bg   { fill: #f8fafc; }
    .tier-versus-trial-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tier-versus-trial-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tier-versus-trial-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tier-versus-trial-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tier-versus-trial-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tier-versus-trial-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tier-versus-trial-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tier-versus-trial-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tier-versus-trial-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tier-versus-trial-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tier-versus-trial-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tier-versus-trial-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tier-versus-trial-row { opacity: 1; }
    .tier-versus-trial-r0 { animation-delay: 0.00s; }
    .tier-versus-trial-r1 { animation-delay: 0.45s; }
    .tier-versus-trial-r2 { animation-delay: 0.90s; }
    .tier-versus-trial-r3 { animation-delay: 1.35s; }
    .tier-versus-trial-r4 { animation-delay: 1.80s; }
    .tier-versus-trial-row { animation: tier-versus-trial-reveal 7.3s ease-in-out infinite; }
    @keyframes tier-versus-trial-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tier-versus-trial-bg" width="980" height="390"/>
  <text class="tier-versus-trial-h1"  x="30" y="40">A tier is not a trial</text>
  <text class="tier-versus-trial-sub" x="30" y="64">One is permanent; one has a date.</text>
  <rect class="tier-versus-trial-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tier-versus-trial-name" x="46" y="122">Free tier</text>
  <text class="tier-versus-trial-desc" x="46" y="142">A permanent allowance.</text>
  <text class="tier-versus-trial-desc tier-versus-trial-row tier-versus-trial-r0" x="46" y="182">Renews each month</text>
  <text class="tier-versus-trial-desc tier-versus-trial-row tier-versus-trial-r1" x="46" y="216">Ends on a dimension, not a date</text>
  <text class="tier-versus-trial-desc tier-versus-trial-row tier-versus-trial-r2" x="46" y="250">Computable headroom</text>
  <text class="tier-versus-trial-desc tier-versus-trial-row tier-versus-trial-r3" x="46" y="284">Safe to build on</text>
  <text class="tier-versus-trial-desc tier-versus-trial-row tier-versus-trial-r4" x="46" y="318">Just find the binding constraint</text>
  <rect class="tier-versus-trial-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tier-versus-trial-name" x="526" y="122">Free trial</text>
  <text class="tier-versus-trial-desc" x="526" y="142">Credit with an expiry.</text>
  <text class="tier-versus-trial-desc tier-versus-trial-row tier-versus-trial-r0" x="526" y="182">A fixed amount, once</text>
  <text class="tier-versus-trial-desc tier-versus-trial-row tier-versus-trial-r1" x="526" y="216">Ends on a date you did not choose</text>
  <text class="tier-versus-trial-desc tier-versus-trial-row tier-versus-trial-r2" x="526" y="250">Nothing to compute — it just stops</text>
  <text class="tier-versus-trial-desc tier-versus-trial-row tier-versus-trial-r3" x="526" y="284">Building on it produces a surprise bill</text>
  <text class="tier-versus-trial-desc tier-versus-trial-row tier-versus-trial-r4" x="526" y="318">And usually on a Monday</text>
  <text class="tier-versus-trial-sub" x="30" y="372">Reserved, on-demand and spot pricing all change where the crossover falls and none of them changes egress, which is why the egress line is the one worth reading first on any comparison.</text>
</svg>
