<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>What the fit statistic misses</title>
  <style>
    .r2-cannot-notice-bg   { fill: #f8fafc; }
    .r2-cannot-notice-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .r2-cannot-notice-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .r2-cannot-notice-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .r2-cannot-notice-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .r2-cannot-notice-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .r2-cannot-notice-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .r2-cannot-notice-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .r2-cannot-notice-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .r2-cannot-notice-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .r2-cannot-notice-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .r2-cannot-notice-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .r2-cannot-notice-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .r2-cannot-notice-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .r2-cannot-notice-stage { opacity: 1; }

    .r2-cannot-notice-s0 { animation-delay: 0.00s; }
    .r2-cannot-notice-e0 { animation-delay: 0.00s; }
    .r2-cannot-notice-s1 { animation-delay: 1.28s; }
    .r2-cannot-notice-e1 { animation-delay: 1.28s; }
    .r2-cannot-notice-s2 { animation-delay: 2.56s; }
    .r2-cannot-notice-e2 { animation-delay: 2.56s; }
    .r2-cannot-notice-s3 { animation-delay: 3.84s; }
    .r2-cannot-notice-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .r2-cannot-notice-conn  { animation: r2-cannot-notice-trace 6.4s ease-in-out infinite; }
      .r2-cannot-notice-stage { animation: r2-cannot-notice-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes r2-cannot-notice-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes r2-cannot-notice-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .r2-cannot-notice-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .r2-cannot-notice-stage { animation: r2-cannot-notice-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes r2-cannot-notice-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="r2-cannot-notice-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="r2-cannot-notice-bg" width="980" height="322"/>
  <text class="r2-cannot-notice-h1"  x="30" y="40">What the fit statistic misses</text>
  <text class="r2-cannot-notice-sub" x="30" y="64">Four steps.</text>
  <g class="r2-cannot-notice-stage r2-cannot-notice-s0">
    <rect class="r2-cannot-notice-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="r2-cannot-notice-step" x="44" y="142">01</text>
    <text class="r2-cannot-notice-name" x="70" y="142">It measures how much variance the fit explains</text>
    <text class="r2-cannot-notice-desc" x="44" y="166">Which collinearity does not</text>
    <text class="r2-cannot-notice-desc" x="44" y="182">reduce.</text>
  </g>
  <line class="r2-cannot-notice-line r2-cannot-notice-conn r2-cannot-notice-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#r2-cannot-notice-tip)"/>
  <g class="r2-cannot-notice-stage r2-cannot-notice-s1">
    <rect class="r2-cannot-notice-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="r2-cannot-notice-step" x="280" y="142">02</text>
    <text class="r2-cannot-notice-name" x="306" y="142">Redundant predictors explain the same variance</text>
    <text class="r2-cannot-notice-desc" x="280" y="166">Just divided differently between</text>
    <text class="r2-cannot-notice-desc" x="280" y="182">them.</text>
  </g>
  <line class="r2-cannot-notice-line r2-cannot-notice-conn r2-cannot-notice-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#r2-cannot-notice-tip)"/>
  <g class="r2-cannot-notice-stage r2-cannot-notice-s2">
    <rect class="r2-cannot-notice-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="r2-cannot-notice-step" x="516" y="142">03</text>
    <text class="r2-cannot-notice-name" x="542" y="142">So the statistic is unchanged, or improves</text>
    <text class="r2-cannot-notice-desc" x="516" y="166">While the coefficients become</text>
    <text class="r2-cannot-notice-desc" x="516" y="182">meaningless.</text>
  </g>
  <line class="r2-cannot-notice-line r2-cannot-notice-conn r2-cannot-notice-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#r2-cannot-notice-tip)"/>
  <g class="r2-cannot-notice-stage r2-cannot-notice-s3">
    <rect class="r2-cannot-notice-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="r2-cannot-notice-step" x="752" y="142">04</text>
    <text class="r2-cannot-notice-name" x="778" y="142">Which is why it is a bad diagnostic here</text>
    <text class="r2-cannot-notice-desc" x="752" y="166">Use the inflation factor</text>
    <text class="r2-cannot-notice-desc" x="752" y="182">instead.</text>
  </g>
  <text class="r2-cannot-notice-sub" x="30" y="304">A metric that is unmoved by the problem you have is worse than no metric, because it provides reassurance where none is warranted.</text>
</svg>
