<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" font-family="system-ui, sans-serif">
  <title>Three processes taking turns on one CPU core: time slices, preemption, blocking, and context switches on a timeline</title>
  <rect x="0" y="0" width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">One core, three processes: time slices and context switches</text>

  <!-- Row labels -->
  <text x="95" y="105" text-anchor="end" font-size="15" font-weight="bold" fill="#1a202c">Process A</text>
  <text x="95" y="165" text-anchor="end" font-size="15" font-weight="bold" fill="#1a202c">Process B</text>
  <text x="95" y="225" text-anchor="end" font-size="15" font-weight="bold" fill="#1a202c">Process C</text>

  <!-- Row guide lines -->
  <line x1="110" y1="100" x2="730" y2="100" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="110" y1="160" x2="730" y2="160" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="110" y1="220" x2="730" y2="220" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Slices: A runs -->
  <rect x="110" y="80" width="120" height="40" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="170" y="105" text-anchor="middle" font-size="14" fill="#1a202c">running</text>
  <!-- context switch -->
  <rect x="230" y="70" width="10" height="180" fill="#1d4ed8"/>
  <!-- B runs, blocks early -->
  <rect x="240" y="140" width="70" height="40" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="275" y="165" text-anchor="middle" font-size="14" fill="#1a202c">runs</text>
  <text x="330" y="128" text-anchor="start" font-size="14" fill="#1d4ed8" font-weight="bold">B blocks on a disk read</text>
  <line x1="325" y1="133" x2="313" y2="150" stroke="#1d4ed8" stroke-width="2"/>
  <!-- context switch -->
  <rect x="310" y="70" width="10" height="180" fill="#1d4ed8"/>
  <!-- C runs full slice -->
  <rect x="320" y="200" width="120" height="40" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="380" y="225" text-anchor="middle" font-size="14" fill="#1a202c">running</text>
  <!-- context switch -->
  <rect x="440" y="70" width="10" height="180" fill="#1d4ed8"/>
  <!-- A runs again -->
  <rect x="450" y="80" width="120" height="40" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="510" y="105" text-anchor="middle" font-size="14" fill="#1a202c">running</text>
  <!-- context switch -->
  <rect x="570" y="70" width="10" height="180" fill="#1d4ed8"/>
  <!-- B resumes after I/O -->
  <rect x="580" y="140" width="120" height="40" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="640" y="165" text-anchor="middle" font-size="14" fill="#1a202c">running</text>

  <!-- B waiting stretch -->
  <line x1="310" y1="160" x2="580" y2="160" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="445" y="185" text-anchor="middle" font-size="14" fill="#1d4ed8">waiting for I/O — uses no CPU at all</text>

  <!-- Time axis -->
  <line x1="110" y1="270" x2="730" y2="270" stroke="#1a202c" stroke-width="2"/>
  <polygon points="740,270 726,263 726,277" fill="#1a202c"/>
  <text x="420" y="294" text-anchor="middle" font-size="15" fill="#1a202c">time — each slice is only a few milliseconds</text>

  <!-- Legend -->
  <rect x="110" y="318" width="26" height="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="144" y="332" text-anchor="start" font-size="14" fill="#1a202c">time slice on the core</text>
  <rect x="330" y="318" width="10" height="18" fill="#1d4ed8"/>
  <text x="348" y="332" text-anchor="start" font-size="14" fill="#1a202c">context switch (pure overhead)</text>
  <line x1="590" y1="327" x2="626" y2="327" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="634" y="332" text-anchor="start" font-size="14" fill="#1a202c">blocked / waiting</text>

  <text x="380" y="372" text-anchor="middle" font-size="14" fill="#1a202c">Only one process executes at any instant; fast turns create the illusion that all three run at once.</text>
</svg>
