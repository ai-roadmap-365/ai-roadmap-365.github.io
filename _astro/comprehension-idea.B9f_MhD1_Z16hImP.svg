<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four parts.">
  <title>What a comprehension is</title>
  <style>
    .comprehension-idea-bg   { fill: #f8fafc; }
    .comprehension-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .comprehension-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .comprehension-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .comprehension-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .comprehension-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .comprehension-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .comprehension-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .comprehension-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .comprehension-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .comprehension-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .comprehension-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .comprehension-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .comprehension-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .comprehension-idea-stage { opacity: 1; }

    .comprehension-idea-s0 { animation-delay: 0.00s; }
    .comprehension-idea-e0 { animation-delay: 0.00s; }
    .comprehension-idea-s1 { animation-delay: 1.28s; }
    .comprehension-idea-e1 { animation-delay: 1.28s; }
    .comprehension-idea-s2 { animation-delay: 2.56s; }
    .comprehension-idea-e2 { animation-delay: 2.56s; }
    .comprehension-idea-s3 { animation-delay: 3.84s; }
    .comprehension-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .comprehension-idea-conn  { animation: comprehension-idea-trace 6.4s ease-in-out infinite; }
      .comprehension-idea-stage { animation: comprehension-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes comprehension-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes comprehension-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .comprehension-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .comprehension-idea-stage { animation: comprehension-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes comprehension-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="comprehension-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="comprehension-idea-bg" width="980" height="322"/>
  <text class="comprehension-idea-h1"  x="30" y="40">What a comprehension is</text>
  <text class="comprehension-idea-sub" x="30" y="64">Four parts.</text>
  <g class="comprehension-idea-stage comprehension-idea-s0">
    <rect class="comprehension-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="comprehension-idea-step" x="44" y="142">01</text>
    <text class="comprehension-idea-name" x="70" y="142">An output expression</text>
    <text class="comprehension-idea-desc" x="44" y="166">What to produce from each item.</text>
  </g>
  <line class="comprehension-idea-line comprehension-idea-conn comprehension-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#comprehension-idea-tip)"/>
  <g class="comprehension-idea-stage comprehension-idea-s1">
    <rect class="comprehension-idea-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="comprehension-idea-step" x="280" y="142">02</text>
    <text class="comprehension-idea-name" x="306" y="142">An iteration clause</text>
    <text class="comprehension-idea-desc" x="280" y="166">Where the items come from.</text>
  </g>
  <line class="comprehension-idea-line comprehension-idea-conn comprehension-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#comprehension-idea-tip)"/>
  <g class="comprehension-idea-stage comprehension-idea-s2">
    <rect class="comprehension-idea-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="comprehension-idea-step" x="516" y="142">03</text>
    <text class="comprehension-idea-name" x="542" y="142">An optional filter</text>
    <text class="comprehension-idea-desc" x="516" y="166">Which items to keep.</text>
  </g>
  <line class="comprehension-idea-line comprehension-idea-conn comprehension-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#comprehension-idea-tip)"/>
  <g class="comprehension-idea-stage comprehension-idea-s3">
    <rect class="comprehension-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="comprehension-idea-step" x="752" y="142">04</text>
    <text class="comprehension-idea-name" x="778" y="142">Producing a new collection in one expression</text>
    <text class="comprehension-idea-desc" x="752" y="166">Which reads as the intent rather</text>
    <text class="comprehension-idea-desc" x="752" y="182">than the mechanism.</text>
    <text class="comprehension-idea-edge" x="752" y="242">one line</text>
  </g>
  <text class="comprehension-idea-sub" x="30" y="304">Reading as intent rather than mechanism is the whole argument: a comprehension says what is being built, and the equivalent loop says how.</text>
</svg>
