<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="MCP Client Multi Server Orchestration Architecture">
  <title>MCP Client Multi Server Orchestration Architecture</title>
  <defs>
    <style>
      .d299a-bg { fill: #f8fafc; }
      .d299a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d299a-host { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d299a-srv { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d299a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d299a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d299a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
      .d299a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
      .d299a-pipe { stroke: #3b82f6; stroke-width: 2px; stroke-dasharray: 4,4; fill: none; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d299a-bg" />
  
  <text x="40" y="40" class="d299a-title">MCP Client: Multi-Server Orchestration Architecture</text>
  <text x="40" y="65" class="d299a-subtitle">MCP Client Multi Server Orchestration Architecture diagram showing LLM Core, Unified Tool Registry, and multi-server stdio connections to Database, Git, and Web servers</text>
  
  <!-- Host Client Core -->
  <rect x="40" y="100" width="360" height="300" class="d299a-host" />
  <text x="60" y="130" class="d299a-header" fill="#1d4ed8">Autonomous MCP Client (Host)</text>
  <text x="60" y="160" class="d299a-text" font-weight="600">Unified Tool Registry (Aggregated):</text>
  <text x="60" y="180" class="d299a-text">• `sql_query` --&gt; Server 1 (Postgres)</text>
  <text x="60" y="200" class="d299a-text">• `git_commit` --&gt; Server 2 (Git)</text>
  <text x="60" y="220" class="d299a-text">• `web_search` --&gt; Server 3 (Brave)</text>
  <text x="60" y="250" class="d299a-text" font-weight="600">ReAct Reasoning Engine:</text>
  <text x="60" y="270" class="d299a-text">• Formats unified JSON schema for LLM</text>
  <text x="60" y="290" class="d299a-text">• Intercepts model tool calls</text>
  <text x="60" y="310" class="d299a-text">• Dispatches JSON-RPC to target pipe</text>
  <text x="60" y="330" class="d299a-text">• Injects observation into conversation</text>
  
  <!-- Server 1 -->
  <rect x="480" y="100" width="380" height="85" class="d299a-srv" />
  <text x="500" y="125" class="d299a-header" fill="#15803d">MCP Server 1: PostgreSQL (stdio)</text>
  <text x="500" y="145" class="d299a-text">Exposes: `sql_query`, `list_tables` | PID: 58101</text>
  <text x="500" y="165" class="d299a-text">URI Resources: `postgres://analytics/schema`</text>
  
  <!-- Server 2 -->
  <rect x="480" y="205" width="380" height="85" class="d299a-srv" />
  <text x="500" y="230" class="d299a-header" fill="#15803d">MCP Server 2: Git / Filesystem (stdio)</text>
  <text x="500" y="250" class="d299a-text">Exposes: `git_commit`, `read_file` | PID: 58102</text>
  <text x="500" y="270" class="d299a-text">URI Resources: `file:///workspace/repo`</text>
  
  <!-- Server 3 -->
  <rect x="480" y="310" width="380" height="85" class="d299a-srv" />
  <text x="500" y="335" class="d299a-header" fill="#15803d">MCP Server 3: Web Search (stdio)</text>
  <text x="500" y="355" class="d299a-text">Exposes: `brave_web_search` | PID: 58103</text>
  <text x="500" y="375" class="d299a-text">URI Resources: `search://cached-results`</text>
  
  <!-- Connecting Pipes -->
  <path d="M 400 180 L 480 140" class="d299a-pipe" />
  <path d="M 400 250 L 480 250" class="d299a-pipe" />
  <path d="M 400 320 L 480 350" class="d299a-pipe" />
</svg>