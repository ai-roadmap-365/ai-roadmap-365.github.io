<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Chosen by document type.">
  <title>Which chunking strategy</title>
  <style>
    .chunk-when-bg   { fill: #f8fafc; }
    .chunk-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunk-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunk-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunk-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunk-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunk-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chunk-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .chunk-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .chunk-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .chunk-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .chunk-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .chunk-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chunk-when-row { opacity: 1; }
    .chunk-when-r0 { animation-delay: 0.00s; }
    .chunk-when-r1 { animation-delay: 0.45s; }
    .chunk-when-r2 { animation-delay: 0.90s; }
    .chunk-when-r3 { animation-delay: 1.35s; }
    .chunk-when-r4 { animation-delay: 1.80s; }
    .chunk-when-row { animation: chunk-when-reveal 7.3s ease-in-out infinite; }
    @keyframes chunk-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="chunk-when-bg" width="980" height="390"/>
  <text class="chunk-when-h1"  x="30" y="40">Which chunking strategy</text>
  <text class="chunk-when-sub" x="30" y="64">Chosen by document type.</text>
  <rect class="chunk-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="chunk-when-name" x="46" y="122">Structure-aware</text>
  <text class="chunk-when-desc" x="46" y="142">Most documents.</text>
  <text class="chunk-when-desc chunk-when-row chunk-when-r0" x="46" y="182">Anything with headings</text>
  <text class="chunk-when-desc chunk-when-row chunk-when-r1" x="46" y="216">Code and configuration</text>
  <text class="chunk-when-desc chunk-when-row chunk-when-r2" x="46" y="250">Tables and structured records</text>
  <text class="chunk-when-desc chunk-when-row chunk-when-r3" x="46" y="284">Legal and technical documents</text>
  <text class="chunk-when-desc chunk-when-row chunk-when-r4" x="46" y="318">Where sections are meaningful units</text>
  <rect class="chunk-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="chunk-when-name" x="526" y="122">Fixed size with overlap</text>
  <text class="chunk-when-desc" x="526" y="142">Narrow cases.</text>
  <text class="chunk-when-desc chunk-when-row chunk-when-r0" x="526" y="182">Transcripts and unstructured prose</text>
  <text class="chunk-when-desc chunk-when-row chunk-when-r1" x="526" y="216">Text with no reliable markup</text>
  <text class="chunk-when-desc chunk-when-row chunk-when-r2" x="526" y="250">Where structure parsing is unreliable</text>
  <text class="chunk-when-desc chunk-when-row chunk-when-r3" x="526" y="284">As a fallback within a pipeline</text>
  <text class="chunk-when-desc chunk-when-row chunk-when-r4" x="526" y="318">And always with overlap</text>
  <text class="chunk-when-sub" x="30" y="372">Fixed-size splitting is best treated as the fallback rather than the default, which is the reverse of how most tutorials present it.</text>
</svg>
