<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The details are where it leaks.">
  <title>Four steps, and two details</title>
  <style>
    .privacy-procedure-bg   { fill: #f8fafc; }
    .privacy-procedure-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-procedure-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-procedure-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-procedure-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-procedure-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-procedure-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .privacy-procedure-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .privacy-procedure-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .privacy-procedure-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .privacy-procedure-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .privacy-procedure-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .privacy-procedure-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .privacy-procedure-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .privacy-procedure-stage { opacity: 1; }

    .privacy-procedure-s0 { animation-delay: 0.00s; }
    .privacy-procedure-e0 { animation-delay: 0.00s; }
    .privacy-procedure-s1 { animation-delay: 1.37s; }
    .privacy-procedure-e1 { animation-delay: 1.37s; }
    .privacy-procedure-s2 { animation-delay: 2.74s; }
    .privacy-procedure-e2 { animation-delay: 2.74s; }
    .privacy-procedure-s3 { animation-delay: 4.11s; }
    .privacy-procedure-e3 { animation-delay: 4.11s; }
    .privacy-procedure-s4 { animation-delay: 5.49s; }
    .privacy-procedure-e4 { animation-delay: 5.49s; }
    .privacy-procedure-s5 { animation-delay: 6.86s; }
    .privacy-procedure-e5 { animation-delay: 6.86s; }
    @media (prefers-reduced-motion: no-preference) {
      .privacy-procedure-conn  { animation: privacy-procedure-trace 9.600000000000001s ease-in-out infinite; }
      .privacy-procedure-stage { animation: privacy-procedure-arrive 9.600000000000001s ease-in-out infinite; }
    }
    @keyframes privacy-procedure-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes privacy-procedure-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .privacy-procedure-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .privacy-procedure-stage { animation: privacy-procedure-settle 9.600000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes privacy-procedure-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="privacy-procedure-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="privacy-procedure-bg" width="980" height="322"/>
  <text class="privacy-procedure-h1"  x="30" y="40">Four steps, and two details</text>
  <text class="privacy-procedure-sub" x="30" y="64">The details are where it leaks.</text>
  <g class="privacy-procedure-stage privacy-procedure-s0">
    <rect class="privacy-procedure-box" x="30" y="118" width="131" height="104" rx="10"/>
    <text class="privacy-procedure-step" x="44" y="142">01</text>
    <text class="privacy-procedure-name" x="70" y="142">Minimise first</text>
    <text class="privacy-procedure-desc" x="44" y="166">Ask what purpose</text>
    <text class="privacy-procedure-desc" x="44" y="182">requires each field.</text>
    <text class="privacy-procedure-desc" x="44" y="198">The cheapest</text>
  </g>
  <line class="privacy-procedure-line privacy-procedure-conn privacy-procedure-e0" x1="163" y1="170" x2="185" y2="170" marker-end="url(#privacy-procedure-tip)"/>
  <g class="privacy-procedure-stage privacy-procedure-s1">
    <rect class="privacy-procedure-box" x="187" y="118" width="131" height="104" rx="10"/>
    <text class="privacy-procedure-step" x="201" y="142">02</text>
    <text class="privacy-procedure-name" x="227" y="142">Pseudonymise at the boundary</text>
    <text class="privacy-procedure-desc" x="201" y="166">Stable salted</text>
    <text class="privacy-procedure-desc" x="201" y="182">tokens, before</text>
    <text class="privacy-procedure-desc" x="201" y="198">anything is stored,</text>
  </g>
  <line class="privacy-procedure-line privacy-procedure-conn privacy-procedure-e1" x1="320" y1="170" x2="342" y2="170" marker-end="url(#privacy-procedure-tip)"/>
  <g class="privacy-procedure-stage privacy-procedure-s2">
    <rect class="privacy-procedure-warn" x="344" y="118" width="131" height="104" rx="10"/>
    <text class="privacy-procedure-step" x="358" y="142">03</text>
    <text class="privacy-procedure-name" x="384" y="142">Order patterns longest first</text>
    <text class="privacy-procedure-desc" x="358" y="166">A card number</text>
    <text class="privacy-procedure-desc" x="358" y="182">matched by a phone</text>
    <text class="privacy-procedure-desc" x="358" y="198">pattern leaves the</text>
  </g>
  <line class="privacy-procedure-line privacy-procedure-conn privacy-procedure-e2" x1="477" y1="170" x2="499" y2="170" marker-end="url(#privacy-procedure-tip)"/>
  <g class="privacy-procedure-stage privacy-procedure-s3">
    <rect class="privacy-procedure-box" x="501" y="118" width="131" height="104" rx="10"/>
    <text class="privacy-procedure-step" x="515" y="142">04</text>
    <text class="privacy-procedure-name" x="541" y="142">Mind the boundaries</text>
    <text class="privacy-procedure-desc" x="515" y="166">A word boundary</text>
    <text class="privacy-procedure-desc" x="515" y="182">cannot match before</text>
    <text class="privacy-procedure-desc" x="515" y="198">a plus sign; the</text>
  </g>
  <line class="privacy-procedure-line privacy-procedure-conn privacy-procedure-e3" x1="634" y1="170" x2="656" y2="170" marker-end="url(#privacy-procedure-tip)"/>
  <g class="privacy-procedure-stage privacy-procedure-s4">
    <rect class="privacy-procedure-box" x="658" y="118" width="131" height="104" rx="10"/>
    <text class="privacy-procedure-step" x="672" y="142">05</text>
    <text class="privacy-procedure-name" x="698" y="142">Record the flow</text>
    <text class="privacy-procedure-desc" x="672" y="166">Store and subject,</text>
    <text class="privacy-procedure-desc" x="672" y="182">on every write. Six</text>
    <text class="privacy-procedure-desc" x="672" y="198">lines that answer</text>
  </g>
  <line class="privacy-procedure-line privacy-procedure-conn privacy-procedure-e4" x1="791" y1="170" x2="813" y2="170" marker-end="url(#privacy-procedure-tip)"/>
  <g class="privacy-procedure-stage privacy-procedure-s5">
    <rect class="privacy-procedure-good" x="815" y="118" width="131" height="104" rx="10"/>
    <text class="privacy-procedure-step" x="829" y="142">06</text>
    <text class="privacy-procedure-name" x="855" y="142">Erase, then read back</text>
    <text class="privacy-procedure-desc" x="829" y="166">Report COMPLETE or</text>
    <text class="privacy-procedure-desc" x="829" y="182">INCOMPLETE, and name</text>
    <text class="privacy-procedure-desc" x="829" y="198">the stores that</text>
  </g>
  <text class="privacy-procedure-sub" x="30" y="304">Both implementation details produce a redaction that reports success and leaks anyway, which is the worst available outcome: the control ran, logged a pass, and left the identifier in the text.</text>
</svg>
