<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Less typing, more deciding.">
  <title>What the engineer does now</title>
  <style>
    .role-shift-bg   { fill: #f8fafc; }
    .role-shift-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .role-shift-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .role-shift-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .role-shift-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .role-shift-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .role-shift-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .role-shift-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .role-shift-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .role-shift-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .role-shift-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .role-shift-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .role-shift-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .role-shift-row { opacity: 1; }
    .role-shift-r0 { animation-delay: 0.00s; }
    .role-shift-r1 { animation-delay: 0.45s; }
    .role-shift-r2 { animation-delay: 0.90s; }
    .role-shift-r3 { animation-delay: 1.35s; }
    .role-shift-r4 { animation-delay: 1.80s; }
    .role-shift-row { animation: role-shift-reveal 7.3s ease-in-out infinite; }
    @keyframes role-shift-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="role-shift-bg" width="980" height="390"/>
  <text class="role-shift-h1"  x="30" y="40">What the engineer does now</text>
  <text class="role-shift-sub" x="30" y="64">Less typing, more deciding.</text>
  <rect class="role-shift-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="role-shift-name" x="46" y="122">Before</text>
  <text class="role-shift-desc" x="46" y="142">Construction.</text>
  <text class="role-shift-desc role-shift-row role-shift-r0" x="46" y="182">Typing loops and boilerplate</text>
  <text class="role-shift-desc role-shift-row role-shift-r1" x="46" y="216">Manual refactoring</text>
  <text class="role-shift-desc role-shift-row role-shift-r2" x="46" y="250">Dependency debugging</text>
  <text class="role-shift-desc role-shift-row role-shift-r3" x="46" y="284">Writing glue code</text>
  <text class="role-shift-desc role-shift-row role-shift-r4" x="46" y="318">Most of the day</text>
  <rect class="role-shift-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="role-shift-name" x="526" y="122">Now</text>
  <text class="role-shift-desc" x="526" y="142">Architecture and verification.</text>
  <text class="role-shift-desc role-shift-row role-shift-r0" x="526" y="182">Defining system boundaries</text>
  <text class="role-shift-desc role-shift-row role-shift-r1" x="526" y="216">Writing formal specifications</text>
  <text class="role-shift-desc role-shift-row role-shift-r2" x="526" y="250">Auditing security invariants</text>
  <text class="role-shift-desc role-shift-row role-shift-r3" x="526" y="284">Directing and reviewing agents</text>
  <text class="role-shift-desc role-shift-row role-shift-r4" x="526" y="318">And deciding what correct means</text>
  <text class="role-shift-sub" x="30" y="372">The right-hand column is harder, not easier: specifying precisely what a system must do has always been the difficult part, and the agent removes the part that was merely laborious.</text>
</svg>
