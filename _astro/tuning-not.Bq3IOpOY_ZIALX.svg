<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What tuning is not</title>
  <style>
    .tuning-not-bg   { fill: #f8fafc; }
    .tuning-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tuning-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tuning-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tuning-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tuning-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tuning-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tuning-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tuning-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tuning-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tuning-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tuning-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tuning-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tuning-not-row { opacity: 1; }
    .tuning-not-r0 { animation-delay: 0.00s; }
    .tuning-not-r1 { animation-delay: 0.45s; }
    .tuning-not-r2 { animation-delay: 0.90s; }
    .tuning-not-r3 { animation-delay: 1.35s; }
    .tuning-not-r4 { animation-delay: 1.80s; }
    .tuning-not-row { animation: tuning-not-reveal 7.3s ease-in-out infinite; }
    @keyframes tuning-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tuning-not-bg" width="980" height="390"/>
  <text class="tuning-not-h1"  x="30" y="40">What tuning is not</text>
  <text class="tuning-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="tuning-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tuning-not-name" x="46" y="122">The misconception</text>
  <text class="tuning-not-desc" x="46" y="142">Commonly held.</text>
  <text class="tuning-not-desc tuning-not-row tuning-not-r0" x="46" y="182">More tuning always helps</text>
  <text class="tuning-not-desc tuning-not-row tuning-not-r1" x="46" y="216">Tune every parameter available</text>
  <text class="tuning-not-desc tuning-not-row tuning-not-r2" x="46" y="250">The validation score is what you will get</text>
  <text class="tuning-not-desc tuning-not-row tuning-not-r3" x="46" y="284">Grid search is the thorough option</text>
  <text class="tuning-not-desc tuning-not-row tuning-not-r4" x="46" y="318">Tuning can fix a weak feature set</text>
  <rect class="tuning-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tuning-not-name" x="526" y="122">What is true</text>
  <text class="tuning-not-desc" x="526" y="142">Actually.</text>
  <text class="tuning-not-desc tuning-not-row tuning-not-r0" x="526" y="182">Gains flatten quickly after the first few</text>
  <text class="tuning-not-desc tuning-not-row tuning-not-r1" x="526" y="216">Five parameters carry most of the gain</text>
  <text class="tuning-not-desc tuning-not-row tuning-not-r2" x="526" y="250">Tuned scores are optimistically biased</text>
  <text class="tuning-not-desc tuning-not-row tuning-not-r3" x="526" y="284">Random search beats it per unit budget</text>
  <text class="tuning-not-desc tuning-not-row tuning-not-r4" x="526" y="318">Better features beat better parameters, usually</text>
  <text class="tuning-not-sub" x="30" y="372">The optimistic bias is the one with consequences: selecting the best of two hundred configurations on a validation set overfits that set, which is why a held-out test set is still required.</text>
</svg>
