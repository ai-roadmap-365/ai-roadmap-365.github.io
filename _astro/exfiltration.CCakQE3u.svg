<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A complete attack in four steps.">
  <title>Data exfiltration through rendering</title>
  <style>
    .exfiltration-bg   { fill: #f8fafc; }
    .exfiltration-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exfiltration-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exfiltration-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exfiltration-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exfiltration-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exfiltration-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exfiltration-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .exfiltration-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .exfiltration-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .exfiltration-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .exfiltration-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .exfiltration-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .exfiltration-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .exfiltration-stage { opacity: 1; }

    .exfiltration-s0 { animation-delay: 0.00s; }
    .exfiltration-e0 { animation-delay: 0.00s; }
    .exfiltration-s1 { animation-delay: 1.28s; }
    .exfiltration-e1 { animation-delay: 1.28s; }
    .exfiltration-s2 { animation-delay: 2.56s; }
    .exfiltration-e2 { animation-delay: 2.56s; }
    .exfiltration-s3 { animation-delay: 3.84s; }
    .exfiltration-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .exfiltration-conn  { animation: exfiltration-trace 6.4s ease-in-out infinite; }
      .exfiltration-stage { animation: exfiltration-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes exfiltration-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes exfiltration-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .exfiltration-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .exfiltration-stage { animation: exfiltration-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes exfiltration-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="exfiltration-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="exfiltration-bg" width="980" height="322"/>
  <text class="exfiltration-h1"  x="30" y="40">Data exfiltration through rendering</text>
  <text class="exfiltration-sub" x="30" y="64">A complete attack in four steps.</text>
  <g class="exfiltration-stage exfiltration-s0">
    <rect class="exfiltration-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="exfiltration-step" x="44" y="142">01</text>
    <text class="exfiltration-name" x="70" y="142">Injected text instructs the model to summarise the conversation</text>
    <text class="exfiltration-desc" x="44" y="166">And encode it into a URL.</text>
  </g>
  <line class="exfiltration-line exfiltration-conn exfiltration-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#exfiltration-tip)"/>
  <g class="exfiltration-stage exfiltration-s1">
    <rect class="exfiltration-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="exfiltration-step" x="280" y="142">02</text>
    <text class="exfiltration-name" x="306" y="142">Which it embeds as an image reference</text>
    <text class="exfiltration-desc" x="280" y="166">In its own output.</text>
  </g>
  <line class="exfiltration-line exfiltration-conn exfiltration-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#exfiltration-tip)"/>
  <g class="exfiltration-stage exfiltration-s2">
    <rect class="exfiltration-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="exfiltration-step" x="516" y="142">03</text>
    <text class="exfiltration-name" x="542" y="142">The interface renders the image</text>
    <text class="exfiltration-desc" x="516" y="166">Fetching that URL, and sending</text>
    <text class="exfiltration-desc" x="516" y="182">the data with it.</text>
  </g>
  <line class="exfiltration-line exfiltration-conn exfiltration-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#exfiltration-tip)"/>
  <g class="exfiltration-stage exfiltration-s3">
    <rect class="exfiltration-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="exfiltration-step" x="752" y="142">04</text>
    <text class="exfiltration-name" x="778" y="142">Restrict outbound image domains</text>
    <text class="exfiltration-desc" x="752" y="166">And never auto-render remote</text>
    <text class="exfiltration-desc" x="752" y="182">content in model output.</text>
  </g>
  <text class="exfiltration-sub" x="30" y="304">This is worth studying as a complete attack chain: nothing in it requires the model to be broken, only for the interface around it to render what the model produced.</text>
</svg>
