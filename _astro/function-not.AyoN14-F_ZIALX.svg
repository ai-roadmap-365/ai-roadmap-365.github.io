<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things functions are not</title>
  <style>
    .function-not-bg   { fill: #f8fafc; }
    .function-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .function-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .function-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .function-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .function-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .function-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .function-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .function-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .function-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .function-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .function-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .function-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .function-not-row { opacity: 1; }
    .function-not-r0 { animation-delay: 0.00s; }
    .function-not-r1 { animation-delay: 0.45s; }
    .function-not-r2 { animation-delay: 0.90s; }
    .function-not-r3 { animation-delay: 1.35s; }
    .function-not-r4 { animation-delay: 1.80s; }
    .function-not-row { animation: function-not-reveal 7.3s ease-in-out infinite; }
    @keyframes function-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="function-not-bg" width="980" height="390"/>
  <text class="function-not-h1"  x="30" y="40">Four things functions are not</text>
  <text class="function-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="function-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="function-not-name" x="46" y="122">The misconception</text>
  <text class="function-not-desc" x="46" y="142">Commonly held.</text>
  <text class="function-not-desc function-not-row function-not-r0" x="46" y="182">Arguments are copied</text>
  <text class="function-not-desc function-not-row function-not-r1" x="46" y="216">Default arguments are fresh each call</text>
  <text class="function-not-desc function-not-row function-not-r2" x="46" y="250">A function must return something</text>
  <text class="function-not-desc function-not-row function-not-r3" x="46" y="284">More arguments make it more flexible</text>
  <text class="function-not-desc function-not-row function-not-r4" x="46" y="318">Length is the measure of a good function</text>
  <rect class="function-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="function-not-name" x="526" y="122">What is true</text>
  <text class="function-not-desc" x="526" y="142">Actually.</text>
  <text class="function-not-desc function-not-row function-not-r0" x="526" y="182">References are passed; mutation is visible</text>
  <text class="function-not-desc function-not-row function-not-r1" x="526" y="216">They are created once, at definition</text>
  <text class="function-not-desc function-not-row function-not-r2" x="526" y="250">It returns None if it does not say</text>
  <text class="function-not-desc function-not-row function-not-r3" x="526" y="284">Many arguments usually signal a missing type</text>
  <text class="function-not-desc function-not-row function-not-r4" x="526" y="318">Doing one thing is the measure</text>
  <text class="function-not-sub" x="30" y="372">The fourth row is a useful design signal: a function with seven parameters is usually one parameter object waiting to be named.</text>
</svg>
