<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two formats, two shapes.">
  <title>Tabular against nested</title>
  <style>
    .csv-json-bg   { fill: #f8fafc; }
    .csv-json-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .csv-json-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .csv-json-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .csv-json-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .csv-json-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .csv-json-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .csv-json-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .csv-json-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .csv-json-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .csv-json-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .csv-json-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .csv-json-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .csv-json-row { opacity: 1; }
    .csv-json-r0 { animation-delay: 0.00s; }
    .csv-json-r1 { animation-delay: 0.45s; }
    .csv-json-r2 { animation-delay: 0.90s; }
    .csv-json-r3 { animation-delay: 1.35s; }
    .csv-json-r4 { animation-delay: 1.80s; }
    .csv-json-row { animation: csv-json-reveal 7.3s ease-in-out infinite; }
    @keyframes csv-json-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="csv-json-bg" width="980" height="390"/>
  <text class="csv-json-h1"  x="30" y="40">Tabular against nested</text>
  <text class="csv-json-sub" x="30" y="64">Two formats, two shapes.</text>
  <rect class="csv-json-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="csv-json-name" x="46" y="122">Comma-separated</text>
  <text class="csv-json-desc" x="46" y="142">Flat and tabular.</text>
  <text class="csv-json-desc csv-json-row csv-json-r0" x="46" y="182">Rows and columns, uniformly</text>
  <text class="csv-json-desc csv-json-row csv-json-r1" x="46" y="216">No types: everything is text</text>
  <text class="csv-json-desc csv-json-row csv-json-r2" x="46" y="250">Compact, and streams naturally</text>
  <text class="csv-json-desc csv-json-row csv-json-r3" x="46" y="284">Human-editable in a spreadsheet</text>
  <text class="csv-json-desc csv-json-row csv-json-r4" x="46" y="318">Cannot express nesting</text>
  <rect class="csv-json-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="csv-json-name" x="526" y="122">JSON</text>
  <text class="csv-json-desc" x="526" y="142">Nested and typed.</text>
  <text class="csv-json-desc csv-json-row csv-json-r0" x="526" y="182">Arbitrary nesting</text>
  <text class="csv-json-desc csv-json-row csv-json-r1" x="526" y="216">Types are carried</text>
  <text class="csv-json-desc csv-json-row csv-json-r2" x="526" y="250">More verbose</text>
  <text class="csv-json-desc csv-json-row csv-json-r3" x="526" y="284">Human-readable, less editable</text>
  <text class="csv-json-desc csv-json-row csv-json-r4" x="526" y="318">Cannot stream unless line-delimited</text>
  <text class="csv-json-sub" x="30" y="372">Choosing by the data's shape rather than by preference is the rule: flat records belong in the left column and nested ones do not fit it at all.</text>
</svg>
