<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="All of them state management.">
  <title>Four things a chat UI must do</title>
  <style>
    .chat-ux-parts-bg   { fill: #f8fafc; }
    .chat-ux-parts-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chat-ux-parts-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chat-ux-parts-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chat-ux-parts-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chat-ux-parts-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chat-ux-parts-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chat-ux-parts-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .chat-ux-parts-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .chat-ux-parts-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .chat-ux-parts-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .chat-ux-parts-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .chat-ux-parts-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .chat-ux-parts-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .chat-ux-parts-stage { opacity: 1; }

    .chat-ux-parts-s0 { animation-delay: 0.00s; }
    .chat-ux-parts-e0 { animation-delay: 0.00s; }
    .chat-ux-parts-s1 { animation-delay: 1.28s; }
    .chat-ux-parts-e1 { animation-delay: 1.28s; }
    .chat-ux-parts-s2 { animation-delay: 2.56s; }
    .chat-ux-parts-e2 { animation-delay: 2.56s; }
    .chat-ux-parts-s3 { animation-delay: 3.84s; }
    .chat-ux-parts-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .chat-ux-parts-conn  { animation: chat-ux-parts-trace 6.4s ease-in-out infinite; }
      .chat-ux-parts-stage { animation: chat-ux-parts-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes chat-ux-parts-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes chat-ux-parts-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .chat-ux-parts-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .chat-ux-parts-stage { animation: chat-ux-parts-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes chat-ux-parts-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="chat-ux-parts-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="chat-ux-parts-bg" width="980" height="322"/>
  <text class="chat-ux-parts-h1"  x="30" y="40">Four things a chat UI must do</text>
  <text class="chat-ux-parts-sub" x="30" y="64">All of them state management.</text>
  <g class="chat-ux-parts-stage chat-ux-parts-s0">
    <rect class="chat-ux-parts-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="chat-ux-parts-step" x="44" y="142">01</text>
    <text class="chat-ux-parts-name" x="70" y="142">Optimistic rendering</text>
    <text class="chat-ux-parts-desc" x="44" y="166">The user's message appears at</text>
    <text class="chat-ux-parts-desc" x="44" y="182">zero milliseconds, before any</text>
    <text class="chat-ux-parts-desc" x="44" y="198">network call.</text>
    <text class="chat-ux-parts-edge" x="44" y="242">instant</text>
  </g>
  <line class="chat-ux-parts-line chat-ux-parts-conn chat-ux-parts-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#chat-ux-parts-tip)"/>
  <g class="chat-ux-parts-stage chat-ux-parts-s1">
    <rect class="chat-ux-parts-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="chat-ux-parts-step" x="280" y="142">02</text>
    <text class="chat-ux-parts-name" x="306" y="142">Chunk aggregation</text>
    <text class="chat-ux-parts-desc" x="280" y="166">SSE frames accumulated into a</text>
    <text class="chat-ux-parts-desc" x="280" y="182">growing message, safely parsed.</text>
  </g>
  <line class="chat-ux-parts-line chat-ux-parts-conn chat-ux-parts-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#chat-ux-parts-tip)"/>
  <g class="chat-ux-parts-stage chat-ux-parts-s2">
    <rect class="chat-ux-parts-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="chat-ux-parts-step" x="516" y="142">03</text>
    <text class="chat-ux-parts-name" x="542" y="142">Scroll anchoring</text>
    <text class="chat-ux-parts-desc" x="516" y="166">Follow the stream, unless the</text>
    <text class="chat-ux-parts-desc" x="516" y="182">user has scrolled up.</text>
  </g>
  <line class="chat-ux-parts-line chat-ux-parts-conn chat-ux-parts-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#chat-ux-parts-tip)"/>
  <g class="chat-ux-parts-stage chat-ux-parts-s3">
    <rect class="chat-ux-parts-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="chat-ux-parts-step" x="752" y="142">04</text>
    <text class="chat-ux-parts-name" x="778" y="142">Abort control</text>
    <text class="chat-ux-parts-desc" x="752" y="166">A stop button wired to a real</text>
    <text class="chat-ux-parts-desc" x="752" y="182">upstream cancellation.</text>
  </g>
  <text class="chat-ux-parts-sub" x="30" y="304">The third is the one that separates a tolerable chat interface from a pleasant one: content that grows while somebody is reading it is a problem no conventional page layout has to solve.</text>
</svg>
