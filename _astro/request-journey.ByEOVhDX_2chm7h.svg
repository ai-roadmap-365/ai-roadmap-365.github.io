<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" font-family="system-ui, sans-serif">
  <title>The journey of a web request from browser through DNS, TCP, TLS, and HTTP to the server and back to rendering</title>
  <rect x="0" y="0" width="900" height="360" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The journey of one web request</text>

  <!-- Outbound row: browser to server -->
  <rect x="20" y="70" width="120" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="80" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Browser</text>
  <text x="80" y="118" text-anchor="middle" font-size="14" fill="#1a202c">you press Enter</text>

  <rect x="170" y="70" width="120" height="60" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="230" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">DNS</text>
  <text x="230" y="118" text-anchor="middle" font-size="14" fill="#1a202c">name to IP</text>

  <rect x="320" y="70" width="120" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">TCP</text>
  <text x="380" y="118" text-anchor="middle" font-size="14" fill="#1a202c">open connection</text>

  <rect x="470" y="70" width="120" height="60" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="530" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">TLS</text>
  <text x="530" y="118" text-anchor="middle" font-size="14" fill="#1a202c">encrypt, verify</text>

  <rect x="620" y="70" width="120" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="680" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">HTTP request</text>
  <text x="680" y="118" text-anchor="middle" font-size="14" fill="#1a202c">GET /page</text>

  <rect x="760" y="70" width="120" height="60" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="820" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#f8fafc">Server</text>
  <text x="820" y="118" text-anchor="middle" font-size="14" fill="#f8fafc">does the work</text>

  <!-- Outbound arrows -->
  <line x1="140" y1="100" x2="168" y2="100" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="170,100 160,95 160,105" fill="#1d4ed8"/>
  <line x1="290" y1="100" x2="318" y2="100" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="320,100 310,95 310,105" fill="#1d4ed8"/>
  <line x1="440" y1="100" x2="468" y2="100" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="470,100 460,95 460,105" fill="#1d4ed8"/>
  <line x1="590" y1="100" x2="618" y2="100" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="620,100 610,95 610,105" fill="#1d4ed8"/>
  <line x1="740" y1="100" x2="758" y2="100" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="760,100 750,95 750,105" fill="#1d4ed8"/>

  <text x="450" y="158" text-anchor="middle" font-size="14" fill="#1a202c">outbound: your request travels to the server</text>

  <!-- Return row: response and render -->
  <rect x="760" y="210" width="120" height="60" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="820" y="238" text-anchor="middle" font-size="15" font-weight="bold" fill="#f8fafc">Server</text>
  <text x="820" y="258" text-anchor="middle" font-size="14" fill="#f8fafc">sends response</text>

  <rect x="470" y="210" width="270" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="605" y="238" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">HTTP response</text>
  <text x="605" y="258" text-anchor="middle" font-size="14" fill="#1a202c">200 OK, headers, HTML body</text>

  <rect x="200" y="210" width="250" height="60" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="325" y="238" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Browser parses HTML</text>
  <text x="325" y="258" text-anchor="middle" font-size="14" fill="#1a202c">fetches CSS, JS, images</text>

  <rect x="20" y="210" width="160" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="100" y="238" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Render</text>
  <text x="100" y="258" text-anchor="middle" font-size="14" fill="#1a202c">page appears</text>

  <!-- Return arrows -->
  <line x1="758" y1="240" x2="742" y2="240" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="740,240 750,235 750,245" fill="#1d4ed8"/>
  <line x1="468" y1="240" x2="452" y2="240" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="450,240 460,235 460,245" fill="#1d4ed8"/>
  <line x1="198" y1="240" x2="182" y2="240" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="180,240 190,235 190,245" fill="#1d4ed8"/>

  <text x="450" y="298" text-anchor="middle" font-size="14" fill="#1a202c">return: the response travels back and the browser renders it</text>
  <text x="450" y="332" text-anchor="middle" font-size="14" fill="#1a202c">Each hop that costs a round trip adds to how long the page takes to appear.</text>
</svg>
