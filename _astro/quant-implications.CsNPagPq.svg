<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One is a caution.">
  <title>Four consequences of quantisation</title>
  <style>
    .quant-implications-bg   { fill: #f8fafc; }
    .quant-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quant-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quant-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quant-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quant-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quant-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .quant-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .quant-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .quant-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .quant-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .quant-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .quant-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .quant-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .quant-implications-stage { opacity: 1; }

    .quant-implications-s0 { animation-delay: 0.00s; }
    .quant-implications-e0 { animation-delay: 0.00s; }
    .quant-implications-s1 { animation-delay: 1.28s; }
    .quant-implications-e1 { animation-delay: 1.28s; }
    .quant-implications-s2 { animation-delay: 2.56s; }
    .quant-implications-e2 { animation-delay: 2.56s; }
    .quant-implications-s3 { animation-delay: 3.84s; }
    .quant-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .quant-implications-conn  { animation: quant-implications-trace 6.4s ease-in-out infinite; }
      .quant-implications-stage { animation: quant-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes quant-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes quant-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .quant-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .quant-implications-stage { animation: quant-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes quant-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="quant-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="quant-implications-bg" width="980" height="322"/>
  <text class="quant-implications-h1"  x="30" y="40">Four consequences of quantisation</text>
  <text class="quant-implications-sub" x="30" y="64">One is a caution.</text>
  <g class="quant-implications-stage quant-implications-s0">
    <rect class="quant-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="quant-implications-step" x="44" y="142">01</text>
    <text class="quant-implications-name" x="70" y="142">Large models fit on ordinary hardware</text>
    <text class="quant-implications-desc" x="44" y="166">Which is what made local</text>
    <text class="quant-implications-desc" x="44" y="182">inference ordinary.</text>
  </g>
  <line class="quant-implications-line quant-implications-conn quant-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#quant-implications-tip)"/>
  <g class="quant-implications-stage quant-implications-s1">
    <rect class="quant-implications-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="quant-implications-step" x="280" y="142">02</text>
    <text class="quant-implications-name" x="306" y="142">And generation gets faster</text>
    <text class="quant-implications-desc" x="280" y="166">Proportionally to the size</text>
    <text class="quant-implications-desc" x="280" y="182">reduction.</text>
  </g>
  <line class="quant-implications-line quant-implications-conn quant-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#quant-implications-tip)"/>
  <g class="quant-implications-stage quant-implications-s2">
    <rect class="quant-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="quant-implications-step" x="516" y="142">03</text>
    <text class="quant-implications-name" x="542" y="142">With quality loss that grows below four bits</text>
    <text class="quant-implications-desc" x="516" y="166">Small above it, and steep below.</text>
  </g>
  <line class="quant-implications-line quant-implications-conn quant-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#quant-implications-tip)"/>
  <g class="quant-implications-stage quant-implications-s3">
    <rect class="quant-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="quant-implications-step" x="752" y="142">04</text>
    <text class="quant-implications-name" x="778" y="142">While model files are untrusted downloads</text>
    <text class="quant-implications-desc" x="752" y="166">So verify checksums and prefer</text>
    <text class="quant-implications-desc" x="752" y="182">non-executable formats.</text>
  </g>
  <text class="quant-implications-sub" x="30" y="304">The steepness below four bits is the practical boundary: the commonly used levels sit just above it, and going lower trades far more quality per bit saved.</text>
</svg>
