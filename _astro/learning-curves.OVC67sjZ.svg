<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Reading a learning curve</title>
  <style>
    .learning-curves-bg   { fill: #f8fafc; }
    .learning-curves-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .learning-curves-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .learning-curves-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .learning-curves-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .learning-curves-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .learning-curves-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .learning-curves-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .learning-curves-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .learning-curves-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .learning-curves-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .learning-curves-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .learning-curves-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .learning-curves-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .learning-curves-stage { opacity: 1; }

    .learning-curves-s0 { animation-delay: 0.00s; }
    .learning-curves-e0 { animation-delay: 0.00s; }
    .learning-curves-s1 { animation-delay: 1.28s; }
    .learning-curves-e1 { animation-delay: 1.28s; }
    .learning-curves-s2 { animation-delay: 2.56s; }
    .learning-curves-e2 { animation-delay: 2.56s; }
    .learning-curves-s3 { animation-delay: 3.84s; }
    .learning-curves-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .learning-curves-conn  { animation: learning-curves-trace 6.4s ease-in-out infinite; }
      .learning-curves-stage { animation: learning-curves-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes learning-curves-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes learning-curves-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .learning-curves-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .learning-curves-stage { animation: learning-curves-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes learning-curves-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="learning-curves-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="learning-curves-bg" width="980" height="322"/>
  <text class="learning-curves-h1"  x="30" y="40">Reading a learning curve</text>
  <text class="learning-curves-sub" x="30" y="64">Four steps.</text>
  <g class="learning-curves-stage learning-curves-s0">
    <rect class="learning-curves-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="learning-curves-step" x="44" y="142">01</text>
    <text class="learning-curves-name" x="70" y="142">Plot training and validation error against dataset size</text>
    <text class="learning-curves-desc" x="44" y="166">Retraining at each size.</text>
  </g>
  <line class="learning-curves-line learning-curves-conn learning-curves-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#learning-curves-tip)"/>
  <g class="learning-curves-stage learning-curves-s1">
    <rect class="learning-curves-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="learning-curves-step" x="280" y="142">02</text>
    <text class="learning-curves-name" x="306" y="142">Training error rises as data grows</text>
    <text class="learning-curves-desc" x="280" y="166">It gets harder to memorise.</text>
  </g>
  <line class="learning-curves-line learning-curves-conn learning-curves-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#learning-curves-tip)"/>
  <g class="learning-curves-stage learning-curves-s2">
    <rect class="learning-curves-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="learning-curves-step" x="516" y="142">03</text>
    <text class="learning-curves-name" x="542" y="142">Validation error falls</text>
    <text class="learning-curves-desc" x="516" y="166">The model generalises better.</text>
  </g>
  <line class="learning-curves-line learning-curves-conn learning-curves-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#learning-curves-tip)"/>
  <g class="learning-curves-stage learning-curves-s3">
    <rect class="learning-curves-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="learning-curves-step" x="752" y="142">04</text>
    <text class="learning-curves-name" x="778" y="142">Whether they converge, and where, is the answer</text>
    <text class="learning-curves-desc" x="752" y="166">A closing gap means more data</text>
    <text class="learning-curves-desc" x="752" y="182">helps.</text>
  </g>
  <text class="learning-curves-sub" x="30" y="304">This answers the most expensive question a team faces — whether to buy more data — with an experiment that costs only compute.</text>
</svg>
