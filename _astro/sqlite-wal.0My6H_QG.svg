<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One agent turn writes and reads at once.">
  <title>Why WAL mode is not optional</title>
  <style>
    .sqlite-wal-bg   { fill: #f8fafc; }
    .sqlite-wal-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sqlite-wal-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sqlite-wal-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sqlite-wal-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sqlite-wal-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sqlite-wal-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sqlite-wal-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sqlite-wal-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sqlite-wal-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sqlite-wal-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sqlite-wal-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sqlite-wal-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .sqlite-wal-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .sqlite-wal-stage { opacity: 1; }

    .sqlite-wal-s0 { animation-delay: 0.00s; }
    .sqlite-wal-e0 { animation-delay: 0.00s; }
    .sqlite-wal-s1 { animation-delay: 1.50s; }
    .sqlite-wal-e1 { animation-delay: 1.50s; }
    .sqlite-wal-s2 { animation-delay: 3.00s; }
    .sqlite-wal-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .sqlite-wal-conn  { animation: sqlite-wal-trace 6s ease-in-out infinite; }
      .sqlite-wal-stage { animation: sqlite-wal-arrive 6s ease-in-out infinite; }
    }
    @keyframes sqlite-wal-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes sqlite-wal-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .sqlite-wal-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .sqlite-wal-stage { animation: sqlite-wal-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes sqlite-wal-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="sqlite-wal-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="sqlite-wal-bg" width="980" height="322"/>
  <text class="sqlite-wal-h1"  x="30" y="40">Why WAL mode is not optional</text>
  <text class="sqlite-wal-sub" x="30" y="64">One agent turn writes and reads at once.</text>
  <g class="sqlite-wal-stage sqlite-wal-s0">
    <rect class="sqlite-wal-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="sqlite-wal-step" x="44" y="142">01</text>
    <text class="sqlite-wal-name" x="70" y="142">Default locking is file-wide</text>
    <text class="sqlite-wal-desc" x="44" y="166">A write transaction locks the whole database.</text>
  </g>
  <line class="sqlite-wal-line sqlite-wal-conn sqlite-wal-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#sqlite-wal-tip)"/>
  <g class="sqlite-wal-stage sqlite-wal-s1">
    <rect class="sqlite-wal-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="sqlite-wal-step" x="359" y="142">02</text>
    <text class="sqlite-wal-name" x="385" y="142">An agent turn does both</text>
    <text class="sqlite-wal-desc" x="359" y="166">Writes a memo, then reads a status resource.</text>
    <text class="sqlite-wal-desc" x="359" y="182">"database is locked".</text>
  </g>
  <line class="sqlite-wal-line sqlite-wal-conn sqlite-wal-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#sqlite-wal-tip)"/>
  <g class="sqlite-wal-stage sqlite-wal-s2">
    <rect class="sqlite-wal-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="sqlite-wal-step" x="674" y="142">03</text>
    <text class="sqlite-wal-name" x="700" y="142">WAL mode separates them</text>
    <text class="sqlite-wal-desc" x="674" y="166">Concurrent readers while a writer commits.</text>
    <text class="sqlite-wal-desc" x="674" y="182">Sub-millisecond responses.</text>
    <text class="sqlite-wal-edge" x="674" y="242">one PRAGMA</text>
  </g>
  <text class="sqlite-wal-sub" x="30" y="304">This is a one-line configuration change that turns an intermittent error into a non-event, and it is worth setting at database initialisation rather than discovering under load.</text>
</svg>
