<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Both saturate; one is centred.">
  <title>Sigmoid and tanh</title>
  <style>
    .sigmoid-or-tanh-bg   { fill: #f8fafc; }
    .sigmoid-or-tanh-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sigmoid-or-tanh-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sigmoid-or-tanh-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sigmoid-or-tanh-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sigmoid-or-tanh-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sigmoid-or-tanh-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sigmoid-or-tanh-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sigmoid-or-tanh-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sigmoid-or-tanh-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sigmoid-or-tanh-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sigmoid-or-tanh-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sigmoid-or-tanh-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sigmoid-or-tanh-row { opacity: 1; }
    .sigmoid-or-tanh-r0 { animation-delay: 0.00s; }
    .sigmoid-or-tanh-r1 { animation-delay: 0.45s; }
    .sigmoid-or-tanh-r2 { animation-delay: 0.90s; }
    .sigmoid-or-tanh-r3 { animation-delay: 1.35s; }
    .sigmoid-or-tanh-r4 { animation-delay: 1.80s; }
    .sigmoid-or-tanh-row { animation: sigmoid-or-tanh-reveal 7.3s ease-in-out infinite; }
    @keyframes sigmoid-or-tanh-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="sigmoid-or-tanh-bg" width="980" height="390"/>
  <text class="sigmoid-or-tanh-h1"  x="30" y="40">Sigmoid and tanh</text>
  <text class="sigmoid-or-tanh-sub" x="30" y="64">Both saturate; one is centred.</text>
  <rect class="sigmoid-or-tanh-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="sigmoid-or-tanh-name" x="46" y="122">Sigmoid</text>
  <text class="sigmoid-or-tanh-desc" x="46" y="142">Zero to one.</text>
  <text class="sigmoid-or-tanh-desc sigmoid-or-tanh-row sigmoid-or-tanh-r0" x="46" y="182">Output between 0 and 1</text>
  <text class="sigmoid-or-tanh-desc sigmoid-or-tanh-row sigmoid-or-tanh-r1" x="46" y="216">Reads naturally as a probability</text>
  <text class="sigmoid-or-tanh-desc sigmoid-or-tanh-row sigmoid-or-tanh-r2" x="46" y="250">Not zero-centred — all outputs positive</text>
  <text class="sigmoid-or-tanh-desc sigmoid-or-tanh-row sigmoid-or-tanh-r3" x="46" y="284">Which biases gradient updates in one direction</text>
  <text class="sigmoid-or-tanh-desc sigmoid-or-tanh-row sigmoid-or-tanh-r4" x="46" y="318">Maximum derivative: 0.25</text>
  <rect class="sigmoid-or-tanh-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="sigmoid-or-tanh-name" x="526" y="122">Tanh</text>
  <text class="sigmoid-or-tanh-desc" x="526" y="142">Minus one to one.</text>
  <text class="sigmoid-or-tanh-desc sigmoid-or-tanh-row sigmoid-or-tanh-r0" x="526" y="182">Output between -1 and 1</text>
  <text class="sigmoid-or-tanh-desc sigmoid-or-tanh-row sigmoid-or-tanh-r1" x="526" y="216">Zero-centred, so updates are balanced</text>
  <text class="sigmoid-or-tanh-desc sigmoid-or-tanh-row sigmoid-or-tanh-r2" x="526" y="250">Generally trains better in hidden layers</text>
  <text class="sigmoid-or-tanh-desc sigmoid-or-tanh-row sigmoid-or-tanh-r3" x="526" y="284">Maximum derivative: 1.0</text>
  <text class="sigmoid-or-tanh-desc sigmoid-or-tanh-row sigmoid-or-tanh-r4" x="526" y="318">Still saturates at both ends</text>
  <text class="sigmoid-or-tanh-sub" x="30" y="372">Tanh is strictly the better hidden-layer choice of the two and neither solves the underlying problem: both flatten at the extremes, and a flat function has almost no gradient.</text>
</svg>
