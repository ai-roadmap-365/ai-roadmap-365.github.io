<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each covering the last one's gap.">
  <title>Four layers of provenance</title>
  <style>
    .provenance-idea-bg   { fill: #f8fafc; }
    .provenance-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .provenance-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .provenance-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .provenance-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .provenance-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .provenance-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .provenance-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .provenance-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .provenance-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .provenance-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .provenance-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .provenance-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .provenance-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .provenance-idea-stage { opacity: 1; }

    .provenance-idea-s0 { animation-delay: 0.00s; }
    .provenance-idea-e0 { animation-delay: 0.00s; }
    .provenance-idea-s1 { animation-delay: 1.28s; }
    .provenance-idea-e1 { animation-delay: 1.28s; }
    .provenance-idea-s2 { animation-delay: 2.56s; }
    .provenance-idea-e2 { animation-delay: 2.56s; }
    .provenance-idea-s3 { animation-delay: 3.84s; }
    .provenance-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .provenance-idea-conn  { animation: provenance-idea-trace 6.4s ease-in-out infinite; }
      .provenance-idea-stage { animation: provenance-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes provenance-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes provenance-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .provenance-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .provenance-idea-stage { animation: provenance-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes provenance-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="provenance-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="provenance-idea-bg" width="980" height="322"/>
  <text class="provenance-idea-h1"  x="30" y="40">Four layers of provenance</text>
  <text class="provenance-idea-sub" x="30" y="64">Each covering the last one's gap.</text>
  <g class="provenance-idea-stage provenance-idea-s0">
    <rect class="provenance-idea-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="provenance-idea-step" x="44" y="142">01</text>
    <text class="provenance-idea-name" x="70" y="142">A signed manifest travelling with the file</text>
    <text class="provenance-idea-desc" x="44" y="166">Stating how it was made. Strong,</text>
    <text class="provenance-idea-desc" x="44" y="182">and strippable.</text>
  </g>
  <line class="provenance-idea-line provenance-idea-conn provenance-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#provenance-idea-tip)"/>
  <g class="provenance-idea-stage provenance-idea-s1">
    <rect class="provenance-idea-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="provenance-idea-step" x="280" y="142">02</text>
    <text class="provenance-idea-name" x="306" y="142">A watermark in the content itself</text>
    <text class="provenance-idea-desc" x="280" y="166">Survives re-encoding, and is</text>
    <text class="provenance-idea-desc" x="280" y="182">weaker evidence.</text>
  </g>
  <line class="provenance-idea-line provenance-idea-conn provenance-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#provenance-idea-tip)"/>
  <g class="provenance-idea-stage provenance-idea-s2">
    <rect class="provenance-idea-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="provenance-idea-step" x="516" y="142">03</text>
    <text class="provenance-idea-name" x="542" y="142">Perceptual hashes of what was generated</text>
    <text class="provenance-idea-desc" x="516" y="166">So near-duplicates can be found</text>
    <text class="provenance-idea-desc" x="516" y="182">later.</text>
  </g>
  <line class="provenance-idea-line provenance-idea-conn provenance-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#provenance-idea-tip)"/>
  <g class="provenance-idea-stage provenance-idea-s3">
    <rect class="provenance-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="provenance-idea-step" x="752" y="142">04</text>
    <text class="provenance-idea-name" x="778" y="142">And plain disclosure to the reader</text>
    <text class="provenance-idea-desc" x="752" y="166">Which is the only layer they</text>
    <text class="provenance-idea-desc" x="752" y="182">actually see.</text>
  </g>
  <text class="provenance-idea-sub" x="30" y="304">The layers cover each other's failures: manifests are strong but removable, watermarks persist but prove less, and disclosure needs neither to work.</text>
</svg>
