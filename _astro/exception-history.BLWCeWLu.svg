<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward the unmissable.">
  <title>Four steps in error handling</title>
  <style>
    .exception-history-bg   { fill: #f8fafc; }
    .exception-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exception-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exception-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exception-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exception-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exception-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exception-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .exception-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .exception-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .exception-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .exception-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .exception-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .exception-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .exception-history-stage { opacity: 1; }

    .exception-history-s0 { animation-delay: 0.00s; }
    .exception-history-e0 { animation-delay: 0.00s; }
    .exception-history-s1 { animation-delay: 1.28s; }
    .exception-history-e1 { animation-delay: 1.28s; }
    .exception-history-s2 { animation-delay: 2.56s; }
    .exception-history-e2 { animation-delay: 2.56s; }
    .exception-history-s3 { animation-delay: 3.84s; }
    .exception-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .exception-history-conn  { animation: exception-history-trace 6.4s ease-in-out infinite; }
      .exception-history-stage { animation: exception-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes exception-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes exception-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .exception-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .exception-history-stage { animation: exception-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes exception-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="exception-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="exception-history-bg" width="980" height="322"/>
  <text class="exception-history-h1"  x="30" y="40">Four steps in error handling</text>
  <text class="exception-history-sub" x="30" y="64">Toward the unmissable.</text>
  <g class="exception-history-stage exception-history-s0">
    <rect class="exception-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="exception-history-step" x="44" y="142">01</text>
    <text class="exception-history-name" x="70" y="142">Error codes returned from functions</text>
    <text class="exception-history-desc" x="44" y="166">Which every caller had to check,</text>
    <text class="exception-history-desc" x="44" y="182">and many did not.</text>
  </g>
  <line class="exception-history-line exception-history-conn exception-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#exception-history-tip)"/>
  <g class="exception-history-stage exception-history-s1">
    <rect class="exception-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="exception-history-step" x="280" y="142">02</text>
    <text class="exception-history-name" x="306" y="142">Then exceptions, which cannot be silently ignored</text>
    <text class="exception-history-desc" x="280" y="166">They propagate until handled.</text>
  </g>
  <line class="exception-history-line exception-history-conn exception-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#exception-history-tip)"/>
  <g class="exception-history-stage exception-history-s2">
    <rect class="exception-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="exception-history-step" x="516" y="142">03</text>
    <text class="exception-history-name" x="542" y="142">Then chaining, which preserves the original cause</text>
    <text class="exception-history-desc" x="516" y="166">So a translated error keeps its</text>
    <text class="exception-history-desc" x="516" y="182">history.</text>
  </g>
  <line class="exception-history-line exception-history-conn exception-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#exception-history-tip)"/>
  <g class="exception-history-stage exception-history-s3">
    <rect class="exception-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="exception-history-step" x="752" y="142">04</text>
    <text class="exception-history-name" x="778" y="142">And typed error hierarchies, catchable by category</text>
    <text class="exception-history-desc" x="752" y="166">Which is how libraries expose</text>
    <text class="exception-history-desc" x="752" y="182">their failures.</text>
  </g>
  <text class="exception-history-sub" x="30" y="304">The move from codes to exceptions was about making failure unmissable, which is the same instinct as every gate in this curriculum.</text>
</svg>
