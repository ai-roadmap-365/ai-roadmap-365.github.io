<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Streaming and loading are different shapes of work.">
  <title>Why a pipeline handles a file bigger than your laptop</title>
  <style>
    .streaming-versus-loading-bg   { fill: #f8fafc; }
    .streaming-versus-loading-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-versus-loading-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-versus-loading-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-versus-loading-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-versus-loading-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-versus-loading-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .streaming-versus-loading-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .streaming-versus-loading-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .streaming-versus-loading-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .streaming-versus-loading-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .streaming-versus-loading-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .streaming-versus-loading-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .streaming-versus-loading-row { opacity: 1; }
    .streaming-versus-loading-r0 { animation-delay: 0.00s; }
    .streaming-versus-loading-r1 { animation-delay: 0.45s; }
    .streaming-versus-loading-r2 { animation-delay: 0.90s; }
    .streaming-versus-loading-r3 { animation-delay: 1.35s; }
    .streaming-versus-loading-r4 { animation-delay: 1.80s; }
    .streaming-versus-loading-row { animation: streaming-versus-loading-reveal 7.3s ease-in-out infinite; }
    @keyframes streaming-versus-loading-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="streaming-versus-loading-bg" width="980" height="390"/>
  <text class="streaming-versus-loading-h1"  x="30" y="40">Why a pipeline handles a file bigger than your laptop</text>
  <text class="streaming-versus-loading-sub" x="30" y="64">Streaming and loading are different shapes of work.</text>
  <rect class="streaming-versus-loading-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="streaming-versus-loading-name" x="46" y="122">Streaming</text>
  <text class="streaming-versus-loading-desc" x="46" y="142">grep, cut, sed, wc, head.</text>
  <text class="streaming-versus-loading-desc streaming-versus-loading-row streaming-versus-loading-r0" x="46" y="182">One line in memory at a time</text>
  <text class="streaming-versus-loading-desc streaming-versus-loading-row streaming-versus-loading-r1" x="46" y="216">Memory use is flat, whatever the file size</text>
  <text class="streaming-versus-loading-desc streaming-versus-loading-row streaming-versus-loading-r2" x="46" y="250">A 200 GB log processes on a laptop</text>
  <text class="streaming-versus-loading-desc streaming-versus-loading-row streaming-versus-loading-r3" x="46" y="284">Results appear as they are found</text>
  <text class="streaming-versus-loading-desc streaming-versus-loading-row streaming-versus-loading-r4" x="46" y="318">Can be stopped early with head</text>
  <rect class="streaming-versus-loading-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="streaming-versus-loading-name" x="526" y="122">Loading</text>
  <text class="streaming-versus-loading-desc" x="526" y="142">sort, pandas, a spreadsheet.</text>
  <text class="streaming-versus-loading-desc streaming-versus-loading-row streaming-versus-loading-r0" x="526" y="182">The whole dataset in memory</text>
  <text class="streaming-versus-loading-desc streaming-versus-loading-row streaming-versus-loading-r1" x="526" y="216">Memory use grows with the file</text>
  <text class="streaming-versus-loading-desc streaming-versus-loading-row streaming-versus-loading-r2" x="526" y="250">Bounded by your RAM, then by your disk</text>
  <text class="streaming-versus-loading-desc streaming-versus-loading-row streaming-versus-loading-r3" x="526" y="284">Nothing appears until it finishes</text>
  <text class="streaming-versus-loading-desc streaming-versus-loading-row streaming-versus-loading-r4" x="526" y="318">Must read everything before answering</text>
  <text class="streaming-versus-loading-sub" x="30" y="372">sort is the exception among the classic tools: it cannot order data it has not seen, so it buffers and spills to disk on large inputs.</text>
</svg>
