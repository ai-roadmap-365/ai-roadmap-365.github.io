<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward automatic choice.">
  <title>Four steps in access methods</title>
  <style>
    .index-history-bg   { fill: #f8fafc; }
    .index-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .index-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .index-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .index-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .index-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .index-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .index-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .index-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .index-history-stage { opacity: 1; }

    .index-history-s0 { animation-delay: 0.00s; }
    .index-history-e0 { animation-delay: 0.00s; }
    .index-history-s1 { animation-delay: 1.28s; }
    .index-history-e1 { animation-delay: 1.28s; }
    .index-history-s2 { animation-delay: 2.56s; }
    .index-history-e2 { animation-delay: 2.56s; }
    .index-history-s3 { animation-delay: 3.84s; }
    .index-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .index-history-conn  { animation: index-history-trace 6.4s ease-in-out infinite; }
      .index-history-stage { animation: index-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes index-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes index-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .index-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .index-history-stage { animation: index-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes index-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="index-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="index-history-bg" width="980" height="322"/>
  <text class="index-history-h1"  x="30" y="40">Four steps in access methods</text>
  <text class="index-history-sub" x="30" y="64">Toward automatic choice.</text>
  <g class="index-history-stage index-history-s0">
    <rect class="index-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="index-history-step" x="44" y="142">01</text>
    <text class="index-history-name" x="70" y="142">Full scans, examining every record</text>
    <text class="index-history-desc" x="44" y="166">Simple, and linear.</text>
  </g>
  <line class="index-history-line index-history-conn index-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#index-history-tip)"/>
  <g class="index-history-stage index-history-s1">
    <rect class="index-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="index-history-step" x="280" y="142">02</text>
    <text class="index-history-name" x="306" y="142">Then indexes maintained by the programmer</text>
    <text class="index-history-desc" x="280" y="166">Fast, and easy to get out of</text>
    <text class="index-history-desc" x="280" y="182">step.</text>
  </g>
  <line class="index-history-line index-history-conn index-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#index-history-tip)"/>
  <g class="index-history-stage index-history-s2">
    <rect class="index-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="index-history-step" x="516" y="142">03</text>
    <text class="index-history-name" x="542" y="142">Then balanced trees maintained by the engine</text>
    <text class="index-history-desc" x="516" y="166">Correct by construction.</text>
  </g>
  <line class="index-history-line index-history-conn index-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#index-history-tip)"/>
  <g class="index-history-stage index-history-s3">
    <rect class="index-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="index-history-step" x="752" y="142">04</text>
    <text class="index-history-name" x="778" y="142">And cost-based optimisers choosing per query</text>
    <text class="index-history-desc" x="752" y="166">Using statistics about the data.</text>
  </g>
  <text class="index-history-sub" x="30" y="304">Moving index maintenance into the engine removed an entire category of bug, since a hand-maintained index that falls out of step returns wrong answers.</text>
</svg>
