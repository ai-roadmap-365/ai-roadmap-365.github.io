<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img">
  <title>State Graph Checkpointing Lifecycle</title>
  <defs>
    <style>
      .d292f-bg { fill: #f8fafc; }
      .d292f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d292f-node { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d292f-hitl { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; rx: 8px; }
      .d292f-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d292f-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d292f-header { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
      .d292f-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .d292f-flow { stroke: #64748b; stroke-width: 2px; stroke-dasharray: 4,4; fill: none; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d292f-bg" />
  
  <text x="40" y="40" class="d292f-title">State Graph Checkpointing Lifecycle</text>
  <text x="40" y="65" class="d292f-subtitle">State Graph Checkpointing Lifecycle showing Node Execution, State Reducer, Checkpoint Persistence, and Human in the Loop pause</text>
  
  <!-- Node A: Researcher -->
  <rect x="40" y="110" width="200" height="80" class="d292f-node" />
  <text x="55" y="135" class="d292f-header" fill="#1d4ed8">Node: Researcher</text>
  <text x="55" y="155" class="d292f-text">Executes web search</text>
  <text x="55" y="170" class="d292f-text">Emits: {"docs": [D1, D2]}</text>
  
  <path d="M 240 150 L 320 150" class="d292f-flow" />
  
  <!-- State Reducer & Checkpoint -->
  <rect x="320" y="110" width="220" height="80" class="d292f-card" />
  <text x="335" y="135" class="d292f-header">State Reducer &amp; Save</text>
  <text x="335" y="155" class="d292f-text">state.docs.extend(new_docs)</text>
  <text x="335" y="170" class="d292f-text">Write to Checkpoint DB</text>
  
  <path d="M 540 150 L 620 150" class="d292f-flow" />
  
  <!-- Human in the loop pause gate -->
  <rect x="620" y="110" width="240" height="120" class="d292f-hitl" />
  <text x="635" y="135" class="d292f-header" fill="#b91c1c">Human Approval Gate</text>
  <text x="635" y="155" class="d292f-text">PAUSE Execution</text>
  <text x="635" y="170" class="d292f-text">Requires admin confirmation</text>
  <text x="635" y="195" class="d292f-text" font-weight="600">Action: Mutate Database?</text>
  
  <path d="M 740 230 L 740 280" class="d292f-flow" stroke="#22c55e" />
  
  <!-- Node B: Executor -->
  <rect x="620" y="280" width="240" height="90" class="d292f-node" />
  <text x="635" y="305" class="d292f-header" fill="#1d4ed8">Node: DB Executor</text>
  <text x="635" y="325" class="d292f-text">Resume from Checkpoint #4</text>
  <text x="635" y="340" class="d292f-text">Apply verified schema update</text>
</svg>