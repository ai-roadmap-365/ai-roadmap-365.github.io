<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>How graph indexes work</title>
  <style>
    .hnsw-bg   { fill: #f8fafc; }
    .hnsw-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hnsw-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hnsw-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hnsw-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hnsw-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hnsw-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hnsw-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hnsw-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hnsw-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hnsw-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hnsw-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hnsw-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .hnsw-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .hnsw-stage { opacity: 1; }

    .hnsw-s0 { animation-delay: 0.00s; }
    .hnsw-e0 { animation-delay: 0.00s; }
    .hnsw-s1 { animation-delay: 1.28s; }
    .hnsw-e1 { animation-delay: 1.28s; }
    .hnsw-s2 { animation-delay: 2.56s; }
    .hnsw-e2 { animation-delay: 2.56s; }
    .hnsw-s3 { animation-delay: 3.84s; }
    .hnsw-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .hnsw-conn  { animation: hnsw-trace 6.4s ease-in-out infinite; }
      .hnsw-stage { animation: hnsw-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes hnsw-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes hnsw-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .hnsw-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .hnsw-stage { animation: hnsw-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes hnsw-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="hnsw-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="hnsw-bg" width="980" height="322"/>
  <text class="hnsw-h1"  x="30" y="40">How graph indexes work</text>
  <text class="hnsw-sub" x="30" y="64">Four steps.</text>
  <g class="hnsw-stage hnsw-s0">
    <rect class="hnsw-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="hnsw-step" x="44" y="142">01</text>
    <text class="hnsw-name" x="70" y="142">Connect each vector to its near neighbours</text>
    <text class="hnsw-desc" x="44" y="166">Forming a navigable graph.</text>
  </g>
  <line class="hnsw-line hnsw-conn hnsw-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#hnsw-tip)"/>
  <g class="hnsw-stage hnsw-s1">
    <rect class="hnsw-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="hnsw-step" x="280" y="142">02</text>
    <text class="hnsw-name" x="306" y="142">Add sparse upper layers for long jumps</text>
    <text class="hnsw-desc" x="280" y="166">So the search starts close,</text>
    <text class="hnsw-desc" x="280" y="182">quickly.</text>
  </g>
  <line class="hnsw-line hnsw-conn hnsw-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#hnsw-tip)"/>
  <g class="hnsw-stage hnsw-s2">
    <rect class="hnsw-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="hnsw-step" x="516" y="142">03</text>
    <text class="hnsw-name" x="542" y="142">Then walk greedily downward toward the query</text>
    <text class="hnsw-desc" x="516" y="166">Visiting a tiny fraction of the</text>
    <text class="hnsw-desc" x="516" y="182">corpus.</text>
  </g>
  <line class="hnsw-line hnsw-conn hnsw-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#hnsw-tip)"/>
  <g class="hnsw-stage hnsw-s3">
    <rect class="hnsw-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="hnsw-step" x="752" y="142">04</text>
    <text class="hnsw-name" x="778" y="142">Which can miss the true nearest</text>
    <text class="hnsw-desc" x="752" y="166">Recall traded for speed, and</text>
    <text class="hnsw-desc" x="752" y="182">tunable.</text>
  </g>
  <text class="hnsw-sub" x="30" y="304">The tunability is the important property: recall is a dial rather than a fixed property of the index, and it should be set against a measured requirement.</text>
</svg>
