<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Look outward, never inward.">
  <title>Rooms inside rooms</title>
  <style>
    .nested-rooms-bg   { fill: #f8fafc; }
    .nested-rooms-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nested-rooms-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nested-rooms-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nested-rooms-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nested-rooms-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nested-rooms-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nested-rooms-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .nested-rooms-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .nested-rooms-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .nested-rooms-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .nested-rooms-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .nested-rooms-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nested-rooms-row { opacity: 1; }
    .nested-rooms-r0 { animation-delay: 0.00s; }
    .nested-rooms-r1 { animation-delay: 0.45s; }
    .nested-rooms-r2 { animation-delay: 0.90s; }
    .nested-rooms-r3 { animation-delay: 1.35s; }
    .nested-rooms-r4 { animation-delay: 1.80s; }
    .nested-rooms-row { animation: nested-rooms-reveal 7.3s ease-in-out infinite; }
    @keyframes nested-rooms-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="nested-rooms-bg" width="980" height="390"/>
  <text class="nested-rooms-h1"  x="30" y="40">Rooms inside rooms</text>
  <text class="nested-rooms-sub" x="30" y="64">Look outward, never inward.</text>
  <rect class="nested-rooms-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="nested-rooms-name" x="46" y="122">Looking outward</text>
  <text class="nested-rooms-desc" x="46" y="142">How lookup works.</text>
  <text class="nested-rooms-desc nested-rooms-row nested-rooms-r0" x="46" y="182">Check this room first</text>
  <text class="nested-rooms-desc nested-rooms-row nested-rooms-r1" x="46" y="216">Then the room containing it</text>
  <text class="nested-rooms-desc nested-rooms-row nested-rooms-r2" x="46" y="250">Then the building</text>
  <text class="nested-rooms-desc nested-rooms-row nested-rooms-r3" x="46" y="284">Then the street</text>
  <text class="nested-rooms-desc nested-rooms-row nested-rooms-r4" x="46" y="318">This is name resolution</text>
  <rect class="nested-rooms-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="nested-rooms-name" x="526" y="122">Looking inward</text>
  <text class="nested-rooms-desc" x="526" y="142">Not possible.</text>
  <text class="nested-rooms-desc nested-rooms-row nested-rooms-r0" x="526" y="182">The outer room cannot see inside</text>
  <text class="nested-rooms-desc nested-rooms-row nested-rooms-r1" x="526" y="216">A function's locals are private</text>
  <text class="nested-rooms-desc nested-rooms-row nested-rooms-r2" x="526" y="250">Which is what makes them safe</text>
  <text class="nested-rooms-desc nested-rooms-row nested-rooms-r3" x="526" y="284">Nothing outside is disturbed</text>
  <text class="nested-rooms-desc nested-rooms-row nested-rooms-r4" x="526" y="318">This is scope isolation</text>
  <text class="nested-rooms-sub" x="30" y="372">The one-way visibility is exactly what makes functions composable: you can call one without knowing or caring what names it uses inside.</text>
</svg>
