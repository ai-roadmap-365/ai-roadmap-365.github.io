<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five essentials.">
  <title>What a model card contains</title>
  <style>
    .model-card-bg   { fill: #f8fafc; }
    .model-card-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-card-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-card-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-card-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-card-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-card-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .model-card-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .model-card-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .model-card-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .model-card-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .model-card-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .model-card-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .model-card-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .model-card-stage { opacity: 1; }

    .model-card-s0 { animation-delay: 0.00s; }
    .model-card-e0 { animation-delay: 0.00s; }
    .model-card-s1 { animation-delay: 1.33s; }
    .model-card-e1 { animation-delay: 1.33s; }
    .model-card-s2 { animation-delay: 2.67s; }
    .model-card-e2 { animation-delay: 2.67s; }
    .model-card-s3 { animation-delay: 4.00s; }
    .model-card-e3 { animation-delay: 4.00s; }
    .model-card-s4 { animation-delay: 5.33s; }
    .model-card-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .model-card-conn  { animation: model-card-trace 8s ease-in-out infinite; }
      .model-card-stage { animation: model-card-arrive 8s ease-in-out infinite; }
    }
    @keyframes model-card-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes model-card-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .model-card-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .model-card-stage { animation: model-card-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes model-card-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="model-card-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="model-card-bg" width="980" height="322"/>
  <text class="model-card-h1"  x="30" y="40">What a model card contains</text>
  <text class="model-card-sub" x="30" y="64">Five essentials.</text>
  <g class="model-card-stage model-card-s0">
    <rect class="model-card-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="model-card-step" x="44" y="142">01</text>
    <text class="model-card-name" x="70" y="142">What the model is</text>
    <text class="model-card-desc" x="44" y="166">Version, date,</text>
    <text class="model-card-desc" x="44" y="182">architecture, owner,</text>
    <text class="model-card-desc" x="44" y="198">training data version.</text>
  </g>
  <line class="model-card-line model-card-conn model-card-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#model-card-tip)"/>
  <g class="model-card-stage model-card-s1">
    <rect class="model-card-warn" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="model-card-step" x="233" y="142">02</text>
    <text class="model-card-name" x="259" y="142">What it is for, and what it is not for</text>
    <text class="model-card-desc" x="233" y="166">Which bounds the</text>
    <text class="model-card-desc" x="233" y="182">liability.</text>
  </g>
  <line class="model-card-line model-card-conn model-card-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#model-card-tip)"/>
  <g class="model-card-stage model-card-s2">
    <rect class="model-card-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="model-card-step" x="422" y="142">03</text>
    <text class="model-card-name" x="448" y="142">How it was evaluated</text>
    <text class="model-card-desc" x="422" y="166">Metric, data, operating</text>
    <text class="model-card-desc" x="422" y="182">point, and the number.</text>
  </g>
  <line class="model-card-line model-card-conn model-card-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#model-card-tip)"/>
  <g class="model-card-stage model-card-s3">
    <rect class="model-card-good" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="model-card-step" x="611" y="142">04</text>
    <text class="model-card-name" x="637" y="142">How it performs per subgroup</text>
    <text class="model-card-desc" x="611" y="166">Not only in aggregate.</text>
  </g>
  <line class="model-card-line model-card-conn model-card-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#model-card-tip)"/>
  <g class="model-card-stage model-card-s4">
    <rect class="model-card-box" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="model-card-step" x="800" y="142">05</text>
    <text class="model-card-name" x="826" y="142">And what it should not be trusted for</text>
    <text class="model-card-desc" x="800" y="166">Stated plainly, by the</text>
    <text class="model-card-desc" x="800" y="182">people who built it.</text>
    <text class="model-card-edge" x="800" y="242">honesty</text>
  </g>
  <text class="model-card-sub" x="30" y="304">The out-of-scope statement does the most work: most documented harm comes from a model used outside the conditions it was evaluated under.</text>
</svg>
