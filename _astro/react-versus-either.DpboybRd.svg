<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Both fail, in opposite directions.">
  <title>Reason only, or act only</title>
  <style>
    .react-versus-either-bg   { fill: #f8fafc; }
    .react-versus-either-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .react-versus-either-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .react-versus-either-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .react-versus-either-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .react-versus-either-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .react-versus-either-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .react-versus-either-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .react-versus-either-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .react-versus-either-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .react-versus-either-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .react-versus-either-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .react-versus-either-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .react-versus-either-row { opacity: 1; }
    .react-versus-either-r0 { animation-delay: 0.00s; }
    .react-versus-either-r1 { animation-delay: 0.45s; }
    .react-versus-either-r2 { animation-delay: 0.90s; }
    .react-versus-either-r3 { animation-delay: 1.35s; }
    .react-versus-either-r4 { animation-delay: 1.80s; }
    .react-versus-either-row { animation: react-versus-either-reveal 7.3s ease-in-out infinite; }
    @keyframes react-versus-either-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="react-versus-either-bg" width="980" height="390"/>
  <text class="react-versus-either-h1"  x="30" y="40">Reason only, or act only</text>
  <text class="react-versus-either-sub" x="30" y="64">Both fail, in opposite directions.</text>
  <rect class="react-versus-either-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="react-versus-either-name" x="46" y="122">Reason only</text>
  <text class="react-versus-either-desc" x="46" y="142">Elaborate, and untested.</text>
  <text class="react-versus-either-desc react-versus-either-row react-versus-either-r0" x="46" y="182">Sits still and theorises</text>
  <text class="react-versus-either-desc react-versus-either-row react-versus-either-r1" x="46" y="216">Never touches anything</text>
  <text class="react-versus-either-desc react-versus-either-row react-versus-either-r2" x="46" y="250">Hallucinates impossible solutions</text>
  <text class="react-versus-either-desc react-versus-either-row react-versus-either-r3" x="46" y="284">Nothing corrects the theory</text>
  <text class="react-versus-either-desc react-versus-either-row react-versus-either-r4" x="46" y="318">This is chain-of-thought alone</text>
  <rect class="react-versus-either-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="react-versus-either-name" x="526" y="122">Act only</text>
  <text class="react-versus-either-desc" x="526" y="142">Busy, and blind.</text>
  <text class="react-versus-either-desc react-versus-either-row react-versus-either-r0" x="526" y="182">Presses every button at random</text>
  <text class="react-versus-either-desc react-versus-either-row react-versus-either-r1" x="526" y="216">Takes no notes</text>
  <text class="react-versus-either-desc react-versus-either-row react-versus-either-r2" x="526" y="250">Triggers traps</text>
  <text class="react-versus-either-desc react-versus-either-row react-versus-either-r3" x="526" y="284">Nothing accumulates between attempts</text>
  <text class="react-versus-either-desc react-versus-either-row react-versus-either-r4" x="526" y="318">This is a tool-calling loop with no trace</text>
  <text class="react-versus-either-sub" x="30" y="372">Interleaving them is the whole contribution: the thought decides what to try, and the observation decides whether that was right, and neither half works without the other.</text>
</svg>
