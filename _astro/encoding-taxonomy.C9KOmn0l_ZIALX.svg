<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Chosen by cardinality and model.">
  <title>Four encodings</title>
  <style>
    .encoding-taxonomy-bg   { fill: #f8fafc; }
    .encoding-taxonomy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoding-taxonomy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoding-taxonomy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoding-taxonomy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoding-taxonomy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoding-taxonomy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .encoding-taxonomy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .encoding-taxonomy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .encoding-taxonomy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .encoding-taxonomy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .encoding-taxonomy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .encoding-taxonomy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .encoding-taxonomy-row { opacity: 1; }
    .encoding-taxonomy-r0 { animation-delay: 0.00s; }
    .encoding-taxonomy-r1 { animation-delay: 0.45s; }
    .encoding-taxonomy-r2 { animation-delay: 0.90s; }
    .encoding-taxonomy-r3 { animation-delay: 1.35s; }
    .encoding-taxonomy-r4 { animation-delay: 1.80s; }
    .encoding-taxonomy-row { animation: encoding-taxonomy-reveal 7.3s ease-in-out infinite; }
    @keyframes encoding-taxonomy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="encoding-taxonomy-bg" width="980" height="390"/>
  <text class="encoding-taxonomy-h1"  x="30" y="40">Four encodings</text>
  <text class="encoding-taxonomy-sub" x="30" y="64">Chosen by cardinality and model.</text>
  <rect class="encoding-taxonomy-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="encoding-taxonomy-name" x="46" y="122">The encoding</text>
  <text class="encoding-taxonomy-desc" x="46" y="142">What it does.</text>
  <text class="encoding-taxonomy-desc encoding-taxonomy-row encoding-taxonomy-r0" x="46" y="182">One-hot — a column per category</text>
  <text class="encoding-taxonomy-desc encoding-taxonomy-row encoding-taxonomy-r1" x="46" y="216">Ordinal — an integer per category</text>
  <text class="encoding-taxonomy-desc encoding-taxonomy-row encoding-taxonomy-r2" x="46" y="250">Target — the mean outcome per category</text>
  <text class="encoding-taxonomy-desc encoding-taxonomy-row encoding-taxonomy-r3" x="46" y="284">Hashing — categories into fixed buckets</text>
  <text class="encoding-taxonomy-desc encoding-taxonomy-row encoding-taxonomy-r4" x="46" y="318">Native — handled by the model itself</text>
  <rect class="encoding-taxonomy-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="encoding-taxonomy-name" x="526" y="122">When</text>
  <text class="encoding-taxonomy-desc" x="526" y="142">What it suits.</text>
  <text class="encoding-taxonomy-desc encoding-taxonomy-row encoding-taxonomy-r0" x="526" y="182">Low cardinality, linear models</text>
  <text class="encoding-taxonomy-desc encoding-taxonomy-row encoding-taxonomy-r1" x="526" y="216">Genuinely ordered categories, or trees</text>
  <text class="encoding-taxonomy-desc encoding-taxonomy-row encoding-taxonomy-r2" x="526" y="250">High cardinality, with cross-fold discipline</text>
  <text class="encoding-taxonomy-desc encoding-taxonomy-row encoding-taxonomy-r3" x="526" y="284">Very high or unbounded cardinality</text>
  <text class="encoding-taxonomy-desc encoding-taxonomy-row encoding-taxonomy-r4" x="526" y="318">Boosting libraries that support it</text>
  <text class="encoding-taxonomy-sub" x="30" y="372">Ordinal encoding of unordered categories is a common error for linear models, because it asserts an ordering and a spacing that do not exist.</text>
</svg>
