<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One has edges; one has conversation.">
  <title>A graph, or a group chat</title>
  <style>
    .graph-or-chatter-bg   { fill: #f8fafc; }
    .graph-or-chatter-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .graph-or-chatter-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .graph-or-chatter-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .graph-or-chatter-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .graph-or-chatter-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .graph-or-chatter-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .graph-or-chatter-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .graph-or-chatter-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .graph-or-chatter-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .graph-or-chatter-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .graph-or-chatter-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .graph-or-chatter-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .graph-or-chatter-row { opacity: 1; }
    .graph-or-chatter-r0 { animation-delay: 0.00s; }
    .graph-or-chatter-r1 { animation-delay: 0.45s; }
    .graph-or-chatter-r2 { animation-delay: 0.90s; }
    .graph-or-chatter-r3 { animation-delay: 1.35s; }
    .graph-or-chatter-r4 { animation-delay: 1.80s; }
    .graph-or-chatter-row { animation: graph-or-chatter-reveal 7.3s ease-in-out infinite; }
    @keyframes graph-or-chatter-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="graph-or-chatter-bg" width="980" height="390"/>
  <text class="graph-or-chatter-h1"  x="30" y="40">A graph, or a group chat</text>
  <text class="graph-or-chatter-sub" x="30" y="64">One has edges; one has conversation.</text>
  <rect class="graph-or-chatter-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="graph-or-chatter-name" x="46" y="122">A state graph</text>
  <text class="graph-or-chatter-desc" x="46" y="142">Transitions are code.</text>
  <text class="graph-or-chatter-desc graph-or-chatter-row graph-or-chatter-r0" x="46" y="182">Edges enforce what may follow what</text>
  <text class="graph-or-chatter-desc graph-or-chatter-row graph-or-chatter-r1" x="46" y="216">A failing node routes to recovery</text>
  <text class="graph-or-chatter-desc graph-or-chatter-row graph-or-chatter-r2" x="46" y="250">State is snapshotted after every step</text>
  <text class="graph-or-chatter-desc graph-or-chatter-row graph-or-chatter-r3" x="46" y="284">Auditable and rewindable</text>
  <text class="graph-or-chatter-desc graph-or-chatter-row graph-or-chatter-r4" x="46" y="318">Cost is bounded by the graph</text>
  <rect class="graph-or-chatter-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="graph-or-chatter-name" x="526" y="122">A group chat</text>
  <text class="graph-or-chatter-desc" x="526" y="142">Transitions are emergent.</text>
  <text class="graph-or-chatter-desc graph-or-chatter-row graph-or-chatter-r0" x="526" y="182">Agents critique each other in a shared thread</text>
  <text class="graph-or-chatter-desc graph-or-chatter-row graph-or-chatter-r1" x="526" y="216">Visually impressive in a demo</text>
  <text class="graph-or-chatter-desc graph-or-chatter-row graph-or-chatter-r2" x="526" y="250">Infinite polite chatter is a real failure</text>
  <text class="graph-or-chatter-desc graph-or-chatter-row graph-or-chatter-r3" x="526" y="284">No checkpoint to resume from</text>
  <text class="graph-or-chatter-desc graph-or-chatter-row graph-or-chatter-r4" x="526" y="318">Thousands of tokens, no progress</text>
  <text class="graph-or-chatter-sub" x="30" y="372">Both patterns have a place, and the deciding question is whether you need to be able to say what happens next: a graph answers that by construction and a conversation answers it by hoping.</text>
</svg>
