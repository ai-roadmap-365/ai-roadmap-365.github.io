<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four failures.">
  <title>What the lifecycle addresses</title>
  <style>
    .lifecycle-why-bg   { fill: #f8fafc; }
    .lifecycle-why-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lifecycle-why-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lifecycle-why-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lifecycle-why-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lifecycle-why-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lifecycle-why-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lifecycle-why-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .lifecycle-why-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .lifecycle-why-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .lifecycle-why-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .lifecycle-why-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .lifecycle-why-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .lifecycle-why-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .lifecycle-why-stage { opacity: 1; }

    .lifecycle-why-s0 { animation-delay: 0.00s; }
    .lifecycle-why-e0 { animation-delay: 0.00s; }
    .lifecycle-why-s1 { animation-delay: 1.28s; }
    .lifecycle-why-e1 { animation-delay: 1.28s; }
    .lifecycle-why-s2 { animation-delay: 2.56s; }
    .lifecycle-why-e2 { animation-delay: 2.56s; }
    .lifecycle-why-s3 { animation-delay: 3.84s; }
    .lifecycle-why-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .lifecycle-why-conn  { animation: lifecycle-why-trace 6.4s ease-in-out infinite; }
      .lifecycle-why-stage { animation: lifecycle-why-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes lifecycle-why-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes lifecycle-why-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .lifecycle-why-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .lifecycle-why-stage { animation: lifecycle-why-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes lifecycle-why-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="lifecycle-why-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="lifecycle-why-bg" width="980" height="322"/>
  <text class="lifecycle-why-h1"  x="30" y="40">What the lifecycle addresses</text>
  <text class="lifecycle-why-sub" x="30" y="64">Four failures.</text>
  <g class="lifecycle-why-stage lifecycle-why-s0">
    <rect class="lifecycle-why-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="lifecycle-why-step" x="44" y="142">01</text>
    <text class="lifecycle-why-name" x="70" y="142">A problem framed wrongly at the start</text>
    <text class="lifecycle-why-desc" x="44" y="166">Which no later stage can</text>
    <text class="lifecycle-why-desc" x="44" y="182">correct.</text>
  </g>
  <line class="lifecycle-why-line lifecycle-why-conn lifecycle-why-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#lifecycle-why-tip)"/>
  <g class="lifecycle-why-stage lifecycle-why-s1">
    <rect class="lifecycle-why-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="lifecycle-why-step" x="280" y="142">02</text>
    <text class="lifecycle-why-name" x="306" y="142">Data problems found after commitment</text>
    <text class="lifecycle-why-desc" x="280" y="166">When the schedule is already</text>
    <text class="lifecycle-why-desc" x="280" y="182">fixed.</text>
  </g>
  <line class="lifecycle-why-line lifecycle-why-conn lifecycle-why-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#lifecycle-why-tip)"/>
  <g class="lifecycle-why-stage lifecycle-why-s2">
    <rect class="lifecycle-why-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="lifecycle-why-step" x="516" y="142">03</text>
    <text class="lifecycle-why-name" x="542" y="142">A working model with no route to production</text>
    <text class="lifecycle-why-desc" x="516" y="166">Which is the commonest stranding</text>
    <text class="lifecycle-why-desc" x="516" y="182">point.</text>
  </g>
  <line class="lifecycle-why-line lifecycle-why-conn lifecycle-why-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#lifecycle-why-tip)"/>
  <g class="lifecycle-why-stage lifecycle-why-s3">
    <rect class="lifecycle-why-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="lifecycle-why-step" x="752" y="142">04</text>
    <text class="lifecycle-why-name" x="778" y="142">And a deployed model nobody maintains</text>
    <text class="lifecycle-why-desc" x="752" y="166">Which decays until it is quietly</text>
    <text class="lifecycle-why-desc" x="752" y="182">switched off.</text>
  </g>
  <text class="lifecycle-why-sub" x="30" y="304">Each failure is prevented by a stage that happens before the modelling, which is why the lifecycle is front-loaded rather than evenly weighted.</text>
</svg>
