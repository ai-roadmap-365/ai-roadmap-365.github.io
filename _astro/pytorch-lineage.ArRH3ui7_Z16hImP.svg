<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three properties nobody wanted to give up.">
  <title>Why eager execution won</title>
  <style>
    .pytorch-lineage-bg   { fill: #f8fafc; }
    .pytorch-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pytorch-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pytorch-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pytorch-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pytorch-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pytorch-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pytorch-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pytorch-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pytorch-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pytorch-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pytorch-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pytorch-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pytorch-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pytorch-lineage-stage { opacity: 1; }

    .pytorch-lineage-s0 { animation-delay: 0.00s; }
    .pytorch-lineage-e0 { animation-delay: 0.00s; }
    .pytorch-lineage-s1 { animation-delay: 1.50s; }
    .pytorch-lineage-e1 { animation-delay: 1.50s; }
    .pytorch-lineage-s2 { animation-delay: 3.00s; }
    .pytorch-lineage-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .pytorch-lineage-conn  { animation: pytorch-lineage-trace 6s ease-in-out infinite; }
      .pytorch-lineage-stage { animation: pytorch-lineage-arrive 6s ease-in-out infinite; }
    }
    @keyframes pytorch-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pytorch-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pytorch-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pytorch-lineage-stage { animation: pytorch-lineage-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pytorch-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pytorch-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pytorch-lineage-bg" width="980" height="322"/>
  <text class="pytorch-lineage-h1"  x="30" y="40">Why eager execution won</text>
  <text class="pytorch-lineage-sub" x="30" y="64">Three properties nobody wanted to give up.</text>
  <g class="pytorch-lineage-stage pytorch-lineage-s0">
    <rect class="pytorch-lineage-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="pytorch-lineage-step" x="44" y="142">01</text>
    <text class="pytorch-lineage-name" x="70" y="142">Static graphs came first</text>
    <text class="pytorch-lineage-desc" x="44" y="166">Define the whole computation, then run it.</text>
    <text class="pytorch-lineage-desc" x="44" y="182">Fast, and opaque.</text>
  </g>
  <line class="pytorch-lineage-line pytorch-lineage-conn pytorch-lineage-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#pytorch-lineage-tip)"/>
  <g class="pytorch-lineage-stage pytorch-lineage-s1">
    <rect class="pytorch-lineage-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="pytorch-lineage-step" x="359" y="142">02</text>
    <text class="pytorch-lineage-name" x="385" y="142">Eager execution runs immediately</text>
    <text class="pytorch-lineage-desc" x="359" y="166">Operations execute in Python order, with real</text>
    <text class="pytorch-lineage-desc" x="359" y="182">values at every step.</text>
  </g>
  <line class="pytorch-lineage-line pytorch-lineage-conn pytorch-lineage-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#pytorch-lineage-tip)"/>
  <g class="pytorch-lineage-stage pytorch-lineage-s2">
    <rect class="pytorch-lineage-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="pytorch-lineage-step" x="674" y="142">03</text>
    <text class="pytorch-lineage-name" x="700" y="142">So you can print, and step through it</text>
    <text class="pytorch-lineage-desc" x="674" y="166">A debugger works. Python control flow works.</text>
  </g>
  <text class="pytorch-lineage-sub" x="30" y="304">The debugging argument is what decided adoption rather than performance: a graph you can inspect with a print statement is a graph researchers will use.</text>
</svg>
