<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Text against binary</title>
  <style>
    .encoding-bg   { fill: #f8fafc; }
    .encoding-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoding-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoding-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoding-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoding-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoding-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .encoding-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .encoding-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .encoding-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .encoding-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .encoding-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .encoding-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .encoding-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .encoding-stage { opacity: 1; }

    .encoding-s0 { animation-delay: 0.00s; }
    .encoding-e0 { animation-delay: 0.00s; }
    .encoding-s1 { animation-delay: 1.28s; }
    .encoding-e1 { animation-delay: 1.28s; }
    .encoding-s2 { animation-delay: 2.56s; }
    .encoding-e2 { animation-delay: 2.56s; }
    .encoding-s3 { animation-delay: 3.84s; }
    .encoding-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .encoding-conn  { animation: encoding-trace 6.4s ease-in-out infinite; }
      .encoding-stage { animation: encoding-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes encoding-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes encoding-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .encoding-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .encoding-stage { animation: encoding-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes encoding-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="encoding-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="encoding-bg" width="980" height="322"/>
  <text class="encoding-h1"  x="30" y="40">Text against binary</text>
  <text class="encoding-sub" x="30" y="64">Four steps.</text>
  <g class="encoding-stage encoding-s0">
    <rect class="encoding-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="encoding-step" x="44" y="142">01</text>
    <text class="encoding-name" x="70" y="142">A file is bytes</text>
    <text class="encoding-desc" x="44" y="166">Always, underneath.</text>
  </g>
  <line class="encoding-line encoding-conn encoding-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#encoding-tip)"/>
  <g class="encoding-stage encoding-s1">
    <rect class="encoding-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="encoding-step" x="280" y="142">02</text>
    <text class="encoding-name" x="306" y="142">Text mode decodes them using an encoding</text>
    <text class="encoding-desc" x="280" y="166">Producing characters.</text>
  </g>
  <line class="encoding-line encoding-conn encoding-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#encoding-tip)"/>
  <g class="encoding-stage encoding-s2">
    <rect class="encoding-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="encoding-step" x="516" y="142">03</text>
    <text class="encoding-name" x="542" y="142">Which defaults to the platform's, if unspecified</text>
    <text class="encoding-desc" x="516" y="166">So the same code behaves</text>
    <text class="encoding-desc" x="516" y="182">differently elsewhere.</text>
  </g>
  <line class="encoding-line encoding-conn encoding-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#encoding-tip)"/>
  <g class="encoding-stage encoding-s3">
    <rect class="encoding-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="encoding-step" x="752" y="142">04</text>
    <text class="encoding-name" x="778" y="142">State the encoding explicitly, every time</text>
    <text class="encoding-desc" x="752" y="166">Which is nearly always the right</text>
    <text class="encoding-desc" x="752" y="182">one.</text>
  </g>
  <text class="encoding-sub" x="30" y="304">The platform default is the reason a script works on one machine and fails on another, and stating the encoding removes the whole class of problem.</text>
</svg>
