<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each shrank the blast radius.">
  <title>Three eras of release engineering</title>
  <style>
    .rollout-eras-bg   { fill: #f8fafc; }
    .rollout-eras-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rollout-eras-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rollout-eras-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rollout-eras-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rollout-eras-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rollout-eras-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rollout-eras-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rollout-eras-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rollout-eras-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rollout-eras-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rollout-eras-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rollout-eras-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .rollout-eras-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .rollout-eras-stage { opacity: 1; }

    .rollout-eras-s0 { animation-delay: 0.00s; }
    .rollout-eras-e0 { animation-delay: 0.00s; }
    .rollout-eras-s1 { animation-delay: 1.50s; }
    .rollout-eras-e1 { animation-delay: 1.50s; }
    .rollout-eras-s2 { animation-delay: 3.00s; }
    .rollout-eras-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .rollout-eras-conn  { animation: rollout-eras-trace 6s ease-in-out infinite; }
      .rollout-eras-stage { animation: rollout-eras-arrive 6s ease-in-out infinite; }
    }
    @keyframes rollout-eras-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes rollout-eras-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .rollout-eras-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .rollout-eras-stage { animation: rollout-eras-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes rollout-eras-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="rollout-eras-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="rollout-eras-bg" width="980" height="322"/>
  <text class="rollout-eras-h1"  x="30" y="40">Three eras of release engineering</text>
  <text class="rollout-eras-sub" x="30" y="64">Each shrank the blast radius.</text>
  <g class="rollout-eras-stage rollout-eras-s0">
    <rect class="rollout-eras-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="rollout-eras-step" x="44" y="142">01</text>
    <text class="rollout-eras-name" x="70" y="142">Big-bang, 2000-2014</text>
    <text class="rollout-eras-desc" x="44" y="166">Midnight weekend windows. All or nothing, and</text>
    <text class="rollout-eras-desc" x="44" y="182">a panic rollback.</text>
  </g>
  <line class="rollout-eras-line rollout-eras-conn rollout-eras-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#rollout-eras-tip)"/>
  <g class="rollout-eras-stage rollout-eras-s1">
    <rect class="rollout-eras-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="rollout-eras-step" x="359" y="142">02</text>
    <text class="rollout-eras-name" x="385" y="142">Feature flags, 2015-2022</text>
    <text class="rollout-eras-desc" x="359" y="166">Progressive canaries become standard. 5%,</text>
    <text class="rollout-eras-desc" x="359" y="182">25%, 100%.</text>
  </g>
  <line class="rollout-eras-line rollout-eras-conn rollout-eras-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#rollout-eras-tip)"/>
  <g class="rollout-eras-stage rollout-eras-s2">
    <rect class="rollout-eras-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="rollout-eras-step" x="674" y="142">03</text>
    <text class="rollout-eras-name" x="700" y="142">Shadow and bandits, 2023</text>
    <text class="rollout-eras-desc" x="674" y="166">Mirror live prompts, judge scores in the</text>
    <text class="rollout-eras-desc" x="674" y="182">background, route by Thompson sampling.</text>
  </g>
  <text class="rollout-eras-sub" x="30" y="304">The third era exists because AI outputs are gradable automatically: an LLM-as-judge score on a mirrored response gives you a comparison signal without any user ever seeing the candidate's answer.</text>
</svg>
