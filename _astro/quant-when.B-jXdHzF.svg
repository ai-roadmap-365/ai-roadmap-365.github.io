<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By what you are doing.">
  <title>Which quantisation level</title>
  <style>
    .quant-when-bg   { fill: #f8fafc; }
    .quant-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quant-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quant-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quant-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quant-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quant-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .quant-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .quant-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .quant-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .quant-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .quant-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .quant-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .quant-when-row { opacity: 1; }
    .quant-when-r0 { animation-delay: 0.00s; }
    .quant-when-r1 { animation-delay: 0.45s; }
    .quant-when-r2 { animation-delay: 0.90s; }
    .quant-when-r3 { animation-delay: 1.35s; }
    .quant-when-r4 { animation-delay: 1.80s; }
    .quant-when-row { animation: quant-when-reveal 7.3s ease-in-out infinite; }
    @keyframes quant-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="quant-when-bg" width="980" height="390"/>
  <text class="quant-when-h1"  x="30" y="40">Which quantisation level</text>
  <text class="quant-when-sub" x="30" y="64">By what you are doing.</text>
  <rect class="quant-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="quant-when-name" x="46" y="122">Higher precision</text>
  <text class="quant-when-desc" x="46" y="142">Quality matters.</text>
  <text class="quant-when-desc quant-when-row quant-when-r0" x="46" y="182">Evaluation and benchmarking</text>
  <text class="quant-when-desc quant-when-row quant-when-r1" x="46" y="216">Reasoning and code generation</text>
  <text class="quant-when-desc quant-when-row quant-when-r2" x="46" y="250">Anything user-facing</text>
  <text class="quant-when-desc quant-when-row quant-when-r3" x="46" y="284">Where the model barely fits anyway</text>
  <text class="quant-when-desc quant-when-row quant-when-r4" x="46" y="318">Eight bits, or five</text>
  <rect class="quant-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="quant-when-name" x="526" y="122">Lower precision</text>
  <text class="quant-when-desc" x="526" y="142">Fitting matters.</text>
  <text class="quant-when-desc quant-when-row quant-when-r0" x="526" y="182">A model that will not otherwise fit</text>
  <text class="quant-when-desc quant-when-row quant-when-r1" x="526" y="216">Bulk classification and extraction</text>
  <text class="quant-when-desc quant-when-row quant-when-r2" x="526" y="250">Experimentation</text>
  <text class="quant-when-desc quant-when-row quant-when-r3" x="526" y="284">Constrained edge hardware</text>
  <text class="quant-when-desc quant-when-row quant-when-r4" x="526" y="318">Four bits, rarely lower</text>
  <text class="quant-when-sub" x="30" y="372">Measuring the loss on your own task rather than trusting a general recommendation is the part that cannot be skipped: sensitivity to quantisation varies enormously by task.</text>
</svg>
