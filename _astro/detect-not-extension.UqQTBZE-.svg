<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Because the extension lies.">
  <title>Detecting the real format</title>
  <style>
    .detect-not-extension-bg   { fill: #f8fafc; }
    .detect-not-extension-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .detect-not-extension-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .detect-not-extension-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .detect-not-extension-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .detect-not-extension-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .detect-not-extension-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .detect-not-extension-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .detect-not-extension-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .detect-not-extension-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .detect-not-extension-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .detect-not-extension-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .detect-not-extension-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .detect-not-extension-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .detect-not-extension-stage { opacity: 1; }

    .detect-not-extension-s0 { animation-delay: 0.00s; }
    .detect-not-extension-e0 { animation-delay: 0.00s; }
    .detect-not-extension-s1 { animation-delay: 1.28s; }
    .detect-not-extension-e1 { animation-delay: 1.28s; }
    .detect-not-extension-s2 { animation-delay: 2.56s; }
    .detect-not-extension-e2 { animation-delay: 2.56s; }
    .detect-not-extension-s3 { animation-delay: 3.84s; }
    .detect-not-extension-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .detect-not-extension-conn  { animation: detect-not-extension-trace 6.4s ease-in-out infinite; }
      .detect-not-extension-stage { animation: detect-not-extension-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes detect-not-extension-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes detect-not-extension-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .detect-not-extension-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .detect-not-extension-stage { animation: detect-not-extension-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes detect-not-extension-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="detect-not-extension-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="detect-not-extension-bg" width="980" height="322"/>
  <text class="detect-not-extension-h1"  x="30" y="40">Detecting the real format</text>
  <text class="detect-not-extension-sub" x="30" y="64">Because the extension lies.</text>
  <g class="detect-not-extension-stage detect-not-extension-s0">
    <rect class="detect-not-extension-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="detect-not-extension-step" x="44" y="142">01</text>
    <text class="detect-not-extension-name" x="70" y="142">Read the leading bytes</text>
    <text class="detect-not-extension-desc" x="44" y="166">A PDF begins with a known</text>
    <text class="detect-not-extension-desc" x="44" y="182">signature; a ZIP-based office</text>
    <text class="detect-not-extension-desc" x="44" y="198">document with another.</text>
  </g>
  <line class="detect-not-extension-line detect-not-extension-conn detect-not-extension-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#detect-not-extension-tip)"/>
  <g class="detect-not-extension-stage detect-not-extension-s1">
    <rect class="detect-not-extension-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="detect-not-extension-step" x="280" y="142">02</text>
    <text class="detect-not-extension-name" x="306" y="142">The extension is a hint, not a fact</text>
    <text class="detect-not-extension-desc" x="280" y="166">A .pdf may be a scan; a .txt may</text>
    <text class="detect-not-extension-desc" x="280" y="182">be UTF-16; a .html may wrap a</text>
    <text class="detect-not-extension-desc" x="280" y="198">PDF.</text>
  </g>
  <line class="detect-not-extension-line detect-not-extension-conn detect-not-extension-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#detect-not-extension-tip)"/>
  <g class="detect-not-extension-stage detect-not-extension-s2">
    <rect class="detect-not-extension-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="detect-not-extension-step" x="516" y="142">03</text>
    <text class="detect-not-extension-name" x="542" y="142">Probe ambiguous containers further</text>
    <text class="detect-not-extension-desc" x="516" y="166">No font resources and one large</text>
    <text class="detect-not-extension-desc" x="516" y="182">image per page is a scan.</text>
  </g>
  <line class="detect-not-extension-line detect-not-extension-conn detect-not-extension-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#detect-not-extension-tip)"/>
  <g class="detect-not-extension-stage detect-not-extension-s3">
    <rect class="detect-not-extension-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="detect-not-extension-step" x="752" y="142">04</text>
    <text class="detect-not-extension-name" x="778" y="142">Then route</text>
    <text class="detect-not-extension-desc" x="752" y="166">A scan and a born-digital PDF</text>
    <text class="detect-not-extension-desc" x="752" y="182">need entirely different</text>
    <text class="detect-not-extension-desc" x="752" y="198">handling.</text>
  </g>
  <text class="detect-not-extension-sub" x="30" y="304">The third step is what separates a working dispatcher from a nominal one: both files are valid PDFs, and sending a scan down the born-digital path produces the silent empty extraction.</text>
</svg>
