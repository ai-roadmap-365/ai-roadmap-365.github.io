<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The same request, different price.">
  <title>With and without prompt caching</title>
  <style>
    .caching-api-bg   { fill: #f8fafc; }
    .caching-api-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .caching-api-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .caching-api-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .caching-api-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .caching-api-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .caching-api-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .caching-api-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .caching-api-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .caching-api-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .caching-api-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .caching-api-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .caching-api-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .caching-api-row { opacity: 1; }
    .caching-api-r0 { animation-delay: 0.00s; }
    .caching-api-r1 { animation-delay: 0.45s; }
    .caching-api-r2 { animation-delay: 0.90s; }
    .caching-api-r3 { animation-delay: 1.35s; }
    .caching-api-r4 { animation-delay: 1.80s; }
    .caching-api-row { animation: caching-api-reveal 7.3s ease-in-out infinite; }
    @keyframes caching-api-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="caching-api-bg" width="980" height="390"/>
  <text class="caching-api-h1"  x="30" y="40">With and without prompt caching</text>
  <text class="caching-api-sub" x="30" y="64">The same request, different price.</text>
  <rect class="caching-api-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="caching-api-name" x="46" y="122">Uncached</text>
  <text class="caching-api-desc" x="46" y="142">Full price, every call.</text>
  <text class="caching-api-desc caching-api-row caching-api-r0" x="46" y="182">The whole prompt processed each time</text>
  <text class="caching-api-desc caching-api-row caching-api-r1" x="46" y="216">Instructions and examples re-billed</text>
  <text class="caching-api-desc caching-api-row caching-api-r2" x="46" y="250">Higher latency to first token</text>
  <text class="caching-api-desc caching-api-row caching-api-r3" x="46" y="284">Cost scales with prompt length</text>
  <text class="caching-api-desc caching-api-row caching-api-r4" x="46" y="318">Which discourages long context</text>
  <rect class="caching-api-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="caching-api-name" x="526" y="122">Cached</text>
  <text class="caching-api-desc" x="526" y="142">Discounted prefix.</text>
  <text class="caching-api-desc caching-api-row caching-api-r0" x="526" y="182">The stable prefix reused</text>
  <text class="caching-api-desc caching-api-row caching-api-r1" x="526" y="216">Billed at a fraction of the rate</text>
  <text class="caching-api-desc caching-api-row caching-api-r2" x="526" y="250">Lower latency to first token</text>
  <text class="caching-api-desc caching-api-row caching-api-r3" x="526" y="284">Cost scales with the variable part</text>
  <text class="caching-api-desc caching-api-row caching-api-r4" x="526" y="318">Which makes long context affordable</text>
  <text class="caching-api-sub" x="30" y="372">The cache has a short lifetime, so it helps sustained traffic against a stable prefix and does nothing for an occasional call — which is worth checking before designing around it.</text>
</svg>
