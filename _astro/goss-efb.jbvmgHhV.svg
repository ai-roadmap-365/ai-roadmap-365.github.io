<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Both reduce work.">
  <title>Two sampling tricks</title>
  <style>
    .goss-efb-bg   { fill: #f8fafc; }
    .goss-efb-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .goss-efb-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .goss-efb-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .goss-efb-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .goss-efb-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .goss-efb-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .goss-efb-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .goss-efb-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .goss-efb-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .goss-efb-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .goss-efb-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .goss-efb-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .goss-efb-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .goss-efb-stage { opacity: 1; }

    .goss-efb-s0 { animation-delay: 0.00s; }
    .goss-efb-e0 { animation-delay: 0.00s; }
    .goss-efb-s1 { animation-delay: 1.28s; }
    .goss-efb-e1 { animation-delay: 1.28s; }
    .goss-efb-s2 { animation-delay: 2.56s; }
    .goss-efb-e2 { animation-delay: 2.56s; }
    .goss-efb-s3 { animation-delay: 3.84s; }
    .goss-efb-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .goss-efb-conn  { animation: goss-efb-trace 6.4s ease-in-out infinite; }
      .goss-efb-stage { animation: goss-efb-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes goss-efb-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes goss-efb-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .goss-efb-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .goss-efb-stage { animation: goss-efb-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes goss-efb-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="goss-efb-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="goss-efb-bg" width="980" height="322"/>
  <text class="goss-efb-h1"  x="30" y="40">Two sampling tricks</text>
  <text class="goss-efb-sub" x="30" y="64">Both reduce work.</text>
  <g class="goss-efb-stage goss-efb-s0">
    <rect class="goss-efb-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="goss-efb-step" x="44" y="142">01</text>
    <text class="goss-efb-name" x="70" y="142">Examples with small gradients are already well fitted</text>
    <text class="goss-efb-desc" x="44" y="166">They contribute little to the</text>
    <text class="goss-efb-desc" x="44" y="182">next tree.</text>
  </g>
  <line class="goss-efb-line goss-efb-conn goss-efb-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#goss-efb-tip)"/>
  <g class="goss-efb-stage goss-efb-s1">
    <rect class="goss-efb-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="goss-efb-step" x="280" y="142">02</text>
    <text class="goss-efb-name" x="306" y="142">So keep all the large ones and sample the rest</text>
    <text class="goss-efb-desc" x="280" y="166">Reweighting to stay unbiased.</text>
  </g>
  <line class="goss-efb-line goss-efb-conn goss-efb-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#goss-efb-tip)"/>
  <g class="goss-efb-stage goss-efb-s2">
    <rect class="goss-efb-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="goss-efb-step" x="516" y="142">03</text>
    <text class="goss-efb-name" x="542" y="142">And sparse features rarely take nonzero values together</text>
    <text class="goss-efb-desc" x="516" y="166">Especially after one-hot</text>
    <text class="goss-efb-desc" x="516" y="182">encoding.</text>
  </g>
  <line class="goss-efb-line goss-efb-conn goss-efb-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#goss-efb-tip)"/>
  <g class="goss-efb-stage goss-efb-s3">
    <rect class="goss-efb-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="goss-efb-step" x="752" y="142">04</text>
    <text class="goss-efb-name" x="778" y="142">So bundle mutually exclusive ones into single features</text>
    <text class="goss-efb-desc" x="752" y="166">Which cuts the effective feature</text>
    <text class="goss-efb-desc" x="752" y="182">count sharply.</text>
    <text class="goss-efb-edge" x="752" y="242">fewer, wider</text>
  </g>
  <text class="goss-efb-sub" x="30" y="304">Both tricks exploit structure that is almost always present in real tabular data, which is why they deliver speed without a measurable accuracy cost.</text>
</svg>
