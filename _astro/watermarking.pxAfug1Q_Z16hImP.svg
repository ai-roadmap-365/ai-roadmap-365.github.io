<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties in tension.">
  <title>Watermarking</title>
  <style>
    .watermarking-bg   { fill: #f8fafc; }
    .watermarking-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .watermarking-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .watermarking-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .watermarking-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .watermarking-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .watermarking-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .watermarking-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .watermarking-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .watermarking-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .watermarking-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .watermarking-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .watermarking-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .watermarking-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .watermarking-stage { opacity: 1; }

    .watermarking-s0 { animation-delay: 0.00s; }
    .watermarking-e0 { animation-delay: 0.00s; }
    .watermarking-s1 { animation-delay: 1.28s; }
    .watermarking-e1 { animation-delay: 1.28s; }
    .watermarking-s2 { animation-delay: 2.56s; }
    .watermarking-e2 { animation-delay: 2.56s; }
    .watermarking-s3 { animation-delay: 3.84s; }
    .watermarking-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .watermarking-conn  { animation: watermarking-trace 6.4s ease-in-out infinite; }
      .watermarking-stage { animation: watermarking-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes watermarking-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes watermarking-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .watermarking-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .watermarking-stage { animation: watermarking-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes watermarking-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="watermarking-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="watermarking-bg" width="980" height="322"/>
  <text class="watermarking-h1"  x="30" y="40">Watermarking</text>
  <text class="watermarking-sub" x="30" y="64">Four properties in tension.</text>
  <g class="watermarking-stage watermarking-s0">
    <rect class="watermarking-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="watermarking-step" x="44" y="142">01</text>
    <text class="watermarking-name" x="70" y="142">Imperceptible</text>
    <text class="watermarking-desc" x="44" y="166">Or it degrades the content it</text>
    <text class="watermarking-desc" x="44" y="182">marks.</text>
  </g>
  <line class="watermarking-line watermarking-conn watermarking-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#watermarking-tip)"/>
  <g class="watermarking-stage watermarking-s1">
    <rect class="watermarking-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="watermarking-step" x="280" y="142">02</text>
    <text class="watermarking-name" x="306" y="142">Robust</text>
    <text class="watermarking-desc" x="280" y="166">Surviving recompression,</text>
    <text class="watermarking-desc" x="280" y="182">cropping and rescaling.</text>
  </g>
  <line class="watermarking-line watermarking-conn watermarking-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#watermarking-tip)"/>
  <g class="watermarking-stage watermarking-s2">
    <rect class="watermarking-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="watermarking-step" x="516" y="142">03</text>
    <text class="watermarking-name" x="542" y="142">Carrying enough information</text>
    <text class="watermarking-desc" x="516" y="166">To identify the producer, at</text>
    <text class="watermarking-desc" x="516" y="182">least.</text>
  </g>
  <line class="watermarking-line watermarking-conn watermarking-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#watermarking-tip)"/>
  <g class="watermarking-stage watermarking-s3">
    <rect class="watermarking-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="watermarking-step" x="752" y="142">04</text>
    <text class="watermarking-name" x="778" y="142">And hard to remove deliberately</text>
    <text class="watermarking-desc" x="752" y="166">Which is the requirement nobody</text>
    <text class="watermarking-desc" x="752" y="182">fully meets.</text>
  </g>
  <text class="watermarking-sub" x="30" y="304">These four pull against each other directly: a mark robust enough to survive determined removal is usually perceptible, which is why watermarking supplements manifests rather than replacing them.</text>
</svg>
