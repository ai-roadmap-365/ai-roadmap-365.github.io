<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Interleaving reads and writes forces a reflow per iteration.">
  <title>Reading geometry is not free</title>
  <style>
    .layout-thrash-bg   { fill: #f8fafc; }
    .layout-thrash-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .layout-thrash-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .layout-thrash-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .layout-thrash-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .layout-thrash-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .layout-thrash-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .layout-thrash-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .layout-thrash-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .layout-thrash-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .layout-thrash-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .layout-thrash-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .layout-thrash-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .layout-thrash-row { opacity: 1; }
    .layout-thrash-r0 { animation-delay: 0.00s; }
    .layout-thrash-r1 { animation-delay: 0.45s; }
    .layout-thrash-r2 { animation-delay: 0.90s; }
    .layout-thrash-r3 { animation-delay: 1.35s; }
    .layout-thrash-r4 { animation-delay: 1.80s; }
    .layout-thrash-row { animation: layout-thrash-reveal 7.3s ease-in-out infinite; }
    @keyframes layout-thrash-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="layout-thrash-bg" width="980" height="390"/>
  <text class="layout-thrash-h1"  x="30" y="40">Reading geometry is not free</text>
  <text class="layout-thrash-sub" x="30" y="64">Interleaving reads and writes forces a reflow per iteration.</text>
  <rect class="layout-thrash-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="layout-thrash-name" x="46" y="122">Interleaved</text>
  <text class="layout-thrash-desc" x="46" y="142">Read, write, read, write.</text>
  <text class="layout-thrash-desc layout-thrash-row layout-thrash-r0" x="46" y="182">Each read needs current geometry</text>
  <text class="layout-thrash-desc layout-thrash-row layout-thrash-r1" x="46" y="216">The previous write invalidated it</text>
  <text class="layout-thrash-desc layout-thrash-row layout-thrash-r2" x="46" y="250">So the browser must lay out again, now</text>
  <text class="layout-thrash-desc layout-thrash-row layout-thrash-r3" x="46" y="284">One forced reflow per iteration</text>
  <text class="layout-thrash-desc layout-thrash-row layout-thrash-r4" x="46" y="318">A hundred items becomes a hundred layouts</text>
  <rect class="layout-thrash-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="layout-thrash-name" x="526" y="122">Batched</text>
  <text class="layout-thrash-desc" x="526" y="142">All reads, then all writes.</text>
  <text class="layout-thrash-desc layout-thrash-row layout-thrash-r0" x="526" y="182">Read every value first</text>
  <text class="layout-thrash-desc layout-thrash-row layout-thrash-r1" x="526" y="216">Geometry is still valid throughout</text>
  <text class="layout-thrash-desc layout-thrash-row layout-thrash-r2" x="526" y="250">Then apply every write together</text>
  <text class="layout-thrash-desc layout-thrash-row layout-thrash-r3" x="526" y="284">One layout pass at the end</text>
  <text class="layout-thrash-desc layout-thrash-row layout-thrash-r4" x="526" y="318">Same result, a fraction of the cost</text>
  <text class="layout-thrash-sub" x="30" y="372">This is the most common front-end performance bug that is invisible in code review: the loop looks reasonable, and the cost lives in the order of two lines.</text>
</svg>
