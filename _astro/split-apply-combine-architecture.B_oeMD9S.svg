<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" width="1040" height="620" role="img" aria-labelledby="d123aTitleId d123aDescId">
  <title id="d123aTitleId">Split, apply, combine -- with the missing-key rows falling out at the split stage</title>
  <desc id="d123aDescId">A six-row orders table splits into three group boxes by region -- North, South, East -- with two rows whose region is missing falling out below the split into a separate "dropped: region missing" tray rather than joining any group. Each group box has a function applied inside it, producing one summed value per group. The three group results combine into a final two-column result table. A caption states that groupby drops rows with a missing key by default, silently, and that the fix is dropna=False.</desc>

  <style>
    .d123a-bg      { fill: #f8fafc; }
    .d123a-title   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; fill: #1a202c; }
    .d123a-sub     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d123a-label   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; fill: #1a202c; }
    .d123a-stage   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; font-weight: 700; fill: #1d4ed8; letter-spacing: 1px; }
    .d123a-mono    { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; fill: #1a202c; }
    .d123a-monosm  { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; fill: #1a202c; }
    .d123a-caption { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d123a-cell    { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.25; }
    .d123a-head    { fill: #e2e8f0; stroke: #64748b; stroke-width: 1.25; }
    .d123a-group   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.75; }
    .d123a-groupcell { fill: #ffffff; stroke: #93c5fd; stroke-width: 1; }
    .d123a-drop    { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .d123a-result  { fill: #dcfce7; stroke: #047857; stroke-width: 1.5; }
    .d123a-arrow   { stroke: #1d4ed8; stroke-width: 2; fill: none; marker-end: url(#d123a-arrowhead); }
    .d123a-droparrow { stroke: #b91c1c; stroke-width: 2; fill: none; stroke-dasharray: 4 3; marker-end: url(#d123a-arrowhead-red); }
    .d123a-fn      { fill: #1d4ed8; }
    .d123a-fntext  { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #ffffff; }
  </style>

  <defs>
    <marker id="d123a-arrowhead" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#1d4ed8" />
    </marker>
    <marker id="d123a-arrowhead-red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b91c1c" />
    </marker>
  </defs>

  <rect class="d123a-bg" x="0" y="0" width="1040" height="620" />

  <text class="d123a-title" x="28" y="38">Split, apply, combine</text>
  <text class="d123a-sub" x="28" y="60">groupby("region").sum() -- watch the two rows with no region at all</text>

  <!-- ============================ SOURCE TABLE ============================ -->
  <text class="d123a-stage" x="28" y="92">1. SOURCE</text>
  <g transform="translate(28,100)">
    <rect class="d123a-head" x="0" y="0" width="70" height="28" />
    <text class="d123a-mono" x="10" y="19">region</text>
    <rect class="d123a-head" x="70" y="0" width="80" height="28" />
    <text class="d123a-mono" x="80" y="19">amount</text>

    <rect class="d123a-cell" x="0" y="28" width="70" height="26" /><text class="d123a-mono" x="10" y="46">North</text>
    <rect class="d123a-cell" x="70" y="28" width="80" height="26" /><text class="d123a-mono" x="80" y="46">100</text>

    <rect class="d123a-cell" x="0" y="54" width="70" height="26" /><text class="d123a-mono" x="10" y="72">South</text>
    <rect class="d123a-cell" x="70" y="54" width="80" height="26" /><text class="d123a-mono" x="80" y="72">250</text>

    <rect class="d123a-cell" x="0" y="80" width="70" height="26" /><text class="d123a-mono" x="10" y="98">North</text>
    <rect class="d123a-cell" x="70" y="80" width="80" height="26" /><text class="d123a-mono" x="80" y="98">150</text>

    <rect class="d123a-cell" x="0" y="106" width="70" height="26" /><text class="d123a-mono" x="10" y="124">East</text>
    <rect class="d123a-cell" x="70" y="106" width="80" height="26" /><text class="d123a-mono" x="80" y="124">300</text>

    <rect class="d123a-drop" x="0" y="132" width="70" height="26" /><text class="d123a-mono" x="10" y="150">NaN</text>
    <rect class="d123a-drop" x="70" y="132" width="80" height="26" /><text class="d123a-mono" x="80" y="150">80</text>

    <rect class="d123a-cell" x="0" y="158" width="70" height="26" /><text class="d123a-mono" x="10" y="176">South</text>
    <rect class="d123a-cell" x="70" y="158" width="80" height="26" /><text class="d123a-mono" x="80" y="176">200</text>

    <rect class="d123a-drop" x="0" y="184" width="70" height="26" /><text class="d123a-mono" x="10" y="202">NaN</text>
    <rect class="d123a-drop" x="70" y="184" width="80" height="26" /><text class="d123a-mono" x="80" y="202">90</text>
  </g>

  <!-- Arrows from source to groups -->
  <path class="d123a-arrow" d="M 158 140 C 220 140, 240 120, 300 118" />
  <path class="d123a-arrow" d="M 158 192 C 220 192, 240 240, 300 260" />
  <path class="d123a-arrow" d="M 158 218 C 220 218, 240 400, 300 400" />
  <!-- Missing-key rows fall out at the split, into the dropped tray below -->
  <path class="d123a-droparrow" d="M 35 258 C 35 320, 35 420, 90 470" />
  <path class="d123a-droparrow" d="M 105 310 C 105 360, 105 430, 130 470" />

  <!-- ============================ GROUPED BOXES ============================ -->
  <text class="d123a-stage" x="300" y="92">2. SPLIT + APPLY</text>

  <g transform="translate(300,100)">
    <rect class="d123a-group" x="0" y="0" width="150" height="70" rx="6" />
    <text class="d123a-label" x="10" y="20">North</text>
    <text class="d123a-monosm" x="10" y="38">100, 150</text>
    <circle class="d123a-fn" cx="122" cy="20" r="14" />
    <text class="d123a-fntext" x="122" y="24" text-anchor="middle">&#931;</text>
    <text class="d123a-monosm" x="10" y="58">sum = 250</text>
  </g>

  <g transform="translate(300,180)">
    <rect class="d123a-group" x="0" y="60" width="150" height="90" rx="6" />
    <text class="d123a-label" x="10" y="80">South</text>
    <text class="d123a-monosm" x="10" y="98">250, 200</text>
    <circle class="d123a-fn" cx="122" cy="80" r="14" />
    <text class="d123a-fntext" x="122" y="84" text-anchor="middle">&#931;</text>
    <text class="d123a-monosm" x="10" y="118">sum = 450</text>
  </g>

  <g transform="translate(300,320)">
    <rect class="d123a-group" x="0" y="60" width="150" height="70" rx="6" />
    <text class="d123a-label" x="10" y="80">East</text>
    <text class="d123a-monosm" x="10" y="98">300</text>
    <circle class="d123a-fn" cx="122" cy="80" r="14" />
    <text class="d123a-fntext" x="122" y="84" text-anchor="middle">&#931;</text>
    <text class="d123a-monosm" x="10" y="118">sum = 300</text>
  </g>

  <!-- Dropped tray -->
  <g transform="translate(20,470)">
    <rect class="d123a-drop" x="0" y="0" width="240" height="70" rx="6" />
    <text class="d123a-mono" x="12" y="24" fill="#b91c1c">dropped: region missing</text>
    <text class="d123a-monosm" x="12" y="44">amount 80, amount 90</text>
    <text class="d123a-monosm" x="12" y="60">never joins ANY group</text>
  </g>

  <!-- ============================ RESULT TABLE ============================ -->
  <text class="d123a-stage" x="740" y="92">3. COMBINE</text>
  <g transform="translate(740,100)">
    <rect class="d123a-head" x="0" y="0" width="90" height="28" /><text class="d123a-mono" x="10" y="19">region</text>
    <rect class="d123a-head" x="90" y="0" width="90" height="28" /><text class="d123a-mono" x="100" y="19">amount</text>

    <rect class="d123a-result" x="0" y="28" width="90" height="28" /><text class="d123a-mono" x="10" y="47">North</text>
    <rect class="d123a-result" x="90" y="28" width="90" height="28" /><text class="d123a-mono" x="100" y="47">250</text>

    <rect class="d123a-result" x="0" y="56" width="90" height="28" /><text class="d123a-mono" x="10" y="75">South</text>
    <rect class="d123a-result" x="90" y="56" width="90" height="28" /><text class="d123a-mono" x="100" y="75">450</text>

    <rect class="d123a-result" x="0" y="84" width="90" height="28" /><text class="d123a-mono" x="10" y="103">East</text>
    <rect class="d123a-result" x="90" y="84" width="90" height="28" /><text class="d123a-mono" x="100" y="103">300</text>
  </g>

  <path class="d123a-arrow" d="M 450 135 C 600 135, 650 130, 738 128" />
  <path class="d123a-arrow" d="M 450 260 C 600 260, 650 165, 738 156" />
  <path class="d123a-arrow" d="M 450 400 C 620 400, 660 195, 738 184" />

  <!-- ============================ CAPTION ============================ -->
  <g transform="translate(28,556)">
    <rect x="0" y="0" width="984" height="52" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" rx="6" />
    <text class="d123a-caption" x="14" y="20">Grouped sum: 250 + 450 + 300 = 1000. Overall sum: 1000 + 80 + 90 = 1170. The gap (170) is not lost --</text>
    <text class="d123a-caption" x="14" y="38">it equals exactly the dropped rows' total. groupby(dropna=False) keeps the NaN group instead of dropping it.</text>
  </g>
</svg>
