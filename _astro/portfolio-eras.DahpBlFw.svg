<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From being believed to being verified.">
  <title>How evidence changed</title>
  <style>
    .portfolio-eras-bg   { fill: #f8fafc; }
    .portfolio-eras-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .portfolio-eras-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .portfolio-eras-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .portfolio-eras-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .portfolio-eras-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .portfolio-eras-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .portfolio-eras-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .portfolio-eras-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .portfolio-eras-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .portfolio-eras-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .portfolio-eras-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .portfolio-eras-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .portfolio-eras-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .portfolio-eras-stage { opacity: 1; }

    .portfolio-eras-s0 { animation-delay: 0.00s; }
    .portfolio-eras-e0 { animation-delay: 0.00s; }
    .portfolio-eras-s1 { animation-delay: 1.28s; }
    .portfolio-eras-e1 { animation-delay: 1.28s; }
    .portfolio-eras-s2 { animation-delay: 2.56s; }
    .portfolio-eras-e2 { animation-delay: 2.56s; }
    .portfolio-eras-s3 { animation-delay: 3.84s; }
    .portfolio-eras-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .portfolio-eras-conn  { animation: portfolio-eras-trace 6.4s ease-in-out infinite; }
      .portfolio-eras-stage { animation: portfolio-eras-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes portfolio-eras-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes portfolio-eras-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .portfolio-eras-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .portfolio-eras-stage { animation: portfolio-eras-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes portfolio-eras-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="portfolio-eras-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="portfolio-eras-bg" width="980" height="322"/>
  <text class="portfolio-eras-h1"  x="30" y="40">How evidence changed</text>
  <text class="portfolio-eras-sub" x="30" y="64">From being believed to being verified.</text>
  <g class="portfolio-eras-stage portfolio-eras-s0">
    <rect class="portfolio-eras-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="portfolio-eras-step" x="44" y="142">01</text>
    <text class="portfolio-eras-name" x="70" y="142">Behavioural interviews, 1970s</text>
    <text class="portfolio-eras-desc" x="44" y="166">Past specifics predict better</text>
    <text class="portfolio-eras-desc" x="44" y="182">than general impressions.</text>
    <text class="portfolio-eras-edge" x="44" y="242">specifics</text>
  </g>
  <line class="portfolio-eras-line portfolio-eras-conn portfolio-eras-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#portfolio-eras-tip)"/>
  <g class="portfolio-eras-stage portfolio-eras-s1">
    <rect class="portfolio-eras-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="portfolio-eras-step" x="280" y="142">02</text>
    <text class="portfolio-eras-name" x="306" y="142">Resume conventions</text>
    <text class="portfolio-eras-desc" x="280" y="166">Action verb plus a metric. Good</text>
    <text class="portfolio-eras-desc" x="280" y="182">advice with no way to check the</text>
    <text class="portfolio-eras-desc" x="280" y="198">shape was met.</text>
  </g>
  <line class="portfolio-eras-line portfolio-eras-conn portfolio-eras-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#portfolio-eras-tip)"/>
  <g class="portfolio-eras-stage portfolio-eras-s2">
    <rect class="portfolio-eras-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="portfolio-eras-step" x="516" y="142">03</text>
    <text class="portfolio-eras-name" x="542" y="142">Open source, 2008</text>
    <text class="portfolio-eras-desc" x="516" y="166">Anyone with a browser can</text>
    <text class="portfolio-eras-desc" x="516" y="182">verify. An unopenable link</text>
    <text class="portfolio-eras-desc" x="516" y="198">becomes conspicuous.</text>
    <text class="portfolio-eras-edge" x="516" y="242">verifiable</text>
  </g>
  <line class="portfolio-eras-line portfolio-eras-conn portfolio-eras-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#portfolio-eras-tip)"/>
  <g class="portfolio-eras-stage portfolio-eras-s3">
    <rect class="portfolio-eras-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="portfolio-eras-step" x="752" y="142">04</text>
    <text class="portfolio-eras-name" x="778" y="142">Working in public, 2010s</text>
    <text class="portfolio-eras-desc" x="752" y="166">The write-up shows reasoning,</text>
    <text class="portfolio-eras-desc" x="752" y="182">which is the thing being hired.</text>
    <text class="portfolio-eras-edge" x="752" y="242">reasoning</text>
  </g>
  <text class="portfolio-eras-sub" x="30" y="304">The third step shifted the burden helpfully: you no longer have to be believed, you can be checked — which is why an evidence link that a stranger cannot open now reads as a claim withdrawn.</text>
</svg>
