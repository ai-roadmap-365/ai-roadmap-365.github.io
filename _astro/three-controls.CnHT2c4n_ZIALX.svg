<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Over-redaction is recoverable.">
  <title>Three controls, one asymmetry</title>
  <style>
    .three-controls-bg   { fill: #f8fafc; }
    .three-controls-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-controls-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-controls-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-controls-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-controls-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-controls-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-controls-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-controls-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-controls-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-controls-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-controls-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-controls-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-controls-row { opacity: 1; }
    .three-controls-r0 { animation-delay: 0.00s; }
    .three-controls-r1 { animation-delay: 0.45s; }
    .three-controls-r2 { animation-delay: 0.90s; }
    .three-controls-r3 { animation-delay: 1.35s; }
    .three-controls-r4 { animation-delay: 1.80s; }
    .three-controls-row { animation: three-controls-reveal 7.3s ease-in-out infinite; }
    @keyframes three-controls-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="three-controls-bg" width="980" height="390"/>
  <text class="three-controls-h1"  x="30" y="40">Three controls, one asymmetry</text>
  <text class="three-controls-sub" x="30" y="64">Over-redaction is recoverable.</text>
  <rect class="three-controls-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="three-controls-name" x="46" y="122">Three controls</text>
  <text class="three-controls-desc" x="46" y="142">Boundary, record, verify.</text>
  <text class="three-controls-desc three-controls-row three-controls-r0" x="46" y="182">Redact at the boundary, before the fan-out</text>
  <text class="three-controls-desc three-controls-row three-controls-r1" x="46" y="216">Record which stores hold data for which subject</text>
  <text class="three-controls-desc three-controls-row three-controls-r2" x="46" y="250">Erase, then read back and confirm</text>
  <text class="three-controls-desc three-controls-row three-controls-r3" x="46" y="284">The third is the one that fails silently</text>
  <text class="three-controls-desc three-controls-row three-controls-r4" x="46" y="318">And the one that was actually promised</text>
  <rect class="three-controls-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="three-controls-name" x="526" y="122">The asymmetry</text>
  <text class="three-controls-desc" x="526" y="142">Errors are not symmetrical.</text>
  <text class="three-controls-desc three-controls-row three-controls-r0" x="526" y="182">Over-redaction costs a little utility</text>
  <text class="three-controls-desc three-controls-row three-controls-r1" x="526" y="216">And is recoverable</text>
  <text class="three-controls-desc three-controls-row three-controls-r2" x="526" y="250">Under-redaction is a disclosure</text>
  <text class="three-controls-desc three-controls-row three-controls-r3" x="526" y="284">And is not recoverable</text>
  <text class="three-controls-desc three-controls-row three-controls-r4" x="526" y="318">So tune toward over-redaction</text>
  <text class="three-controls-sub" x="30" y="372">Reporting success because the delete calls returned is not verification, and it is precisely how a compliance failure looks from the inside — every step ran, and the data is still there.</text>
</svg>
