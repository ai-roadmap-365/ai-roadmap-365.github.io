<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Collapsing them is the classic failure.">
  <title>Three probes, three questions</title>
  <style>
    .three-probes-bg   { fill: #f8fafc; }
    .three-probes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-probes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-probes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-probes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-probes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-probes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-probes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-probes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-probes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-probes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-probes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-probes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .three-probes-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .three-probes-stage { opacity: 1; }

    .three-probes-s0 { animation-delay: 0.00s; }
    .three-probes-e0 { animation-delay: 0.00s; }
    .three-probes-s1 { animation-delay: 1.28s; }
    .three-probes-e1 { animation-delay: 1.28s; }
    .three-probes-s2 { animation-delay: 2.56s; }
    .three-probes-e2 { animation-delay: 2.56s; }
    .three-probes-s3 { animation-delay: 3.84s; }
    .three-probes-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .three-probes-conn  { animation: three-probes-trace 6.4s ease-in-out infinite; }
      .three-probes-stage { animation: three-probes-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes three-probes-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes three-probes-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .three-probes-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .three-probes-stage { animation: three-probes-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes three-probes-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="three-probes-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="three-probes-bg" width="980" height="322"/>
  <text class="three-probes-h1"  x="30" y="40">Three probes, three questions</text>
  <text class="three-probes-sub" x="30" y="64">Collapsing them is the classic failure.</text>
  <g class="three-probes-stage three-probes-s0">
    <rect class="three-probes-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="three-probes-step" x="44" y="142">01</text>
    <text class="three-probes-name" x="70" y="142">Startup: has it finished starting?</text>
    <text class="three-probes-desc" x="44" y="166">Up to 180 seconds while 14 GB of</text>
    <text class="three-probes-desc" x="44" y="182">weights download.</text>
    <text class="three-probes-edge" x="44" y="242">180s</text>
  </g>
  <line class="three-probes-line three-probes-conn three-probes-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#three-probes-tip)"/>
  <g class="three-probes-stage three-probes-s1">
    <rect class="three-probes-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="three-probes-step" x="280" y="142">02</text>
    <text class="three-probes-name" x="306" y="142">Readiness: can it serve now?</text>
    <text class="three-probes-desc" x="280" y="166">Gates Service membership.</text>
    <text class="three-probes-desc" x="280" y="182">Failing removes it from the load</text>
    <text class="three-probes-desc" x="280" y="198">balancer.</text>
  </g>
  <line class="three-probes-line three-probes-conn three-probes-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#three-probes-tip)"/>
  <g class="three-probes-stage three-probes-s2">
    <rect class="three-probes-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="three-probes-step" x="516" y="142">03</text>
    <text class="three-probes-name" x="542" y="142">Liveness: should it be restarted?</text>
    <text class="three-probes-desc" x="516" y="166">Only for a process that is</text>
    <text class="three-probes-desc" x="516" y="182">stuck. Failing kills the</text>
    <text class="three-probes-desc" x="516" y="198">container.</text>
  </g>
  <line class="three-probes-line three-probes-conn three-probes-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#three-probes-tip)"/>
  <g class="three-probes-stage three-probes-s3">
    <rect class="three-probes-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="three-probes-step" x="752" y="142">04</text>
    <text class="three-probes-name" x="778" y="142">One probe for all three</text>
    <text class="three-probes-desc" x="752" y="166">Kills a loading pod, then loops.</text>
    <text class="three-probes-desc" x="752" y="182">CrashLoopBackOff that looks like</text>
    <text class="three-probes-desc" x="752" y="198">a crash.</text>
    <text class="three-probes-edge" x="752" y="242">the failure</text>
  </g>
  <text class="three-probes-sub" x="30" y="304">A three-minute model load is a legitimate start, not a hang, and a liveness probe tuned for a web service cannot tell the difference — which is why the startup probe exists as a separate thing at all.</text>
</svg>
