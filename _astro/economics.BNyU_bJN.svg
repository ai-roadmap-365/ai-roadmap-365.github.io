<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Per request, or once.">
  <title>The cost shapes differ</title>
  <style>
    .economics-bg   { fill: #f8fafc; }
    .economics-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .economics-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .economics-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .economics-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .economics-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .economics-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .economics-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .economics-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .economics-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .economics-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .economics-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .economics-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .economics-row { opacity: 1; }
    .economics-r0 { animation-delay: 0.00s; }
    .economics-r1 { animation-delay: 0.45s; }
    .economics-r2 { animation-delay: 0.90s; }
    .economics-r3 { animation-delay: 1.35s; }
    .economics-r4 { animation-delay: 1.80s; }
    .economics-row { animation: economics-reveal 7.3s ease-in-out infinite; }
    @keyframes economics-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="economics-bg" width="980" height="390"/>
  <text class="economics-h1"  x="30" y="40">The cost shapes differ</text>
  <text class="economics-sub" x="30" y="64">Per request, or once.</text>
  <rect class="economics-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="economics-name" x="46" y="122">Prompting and retrieval</text>
  <text class="economics-desc" x="46" y="142">Pay per request.</text>
  <text class="economics-desc economics-row economics-r0" x="46" y="182">Nothing up front</text>
  <text class="economics-desc economics-row economics-r1" x="46" y="216">Every request carries context tokens</text>
  <text class="economics-desc economics-row economics-r2" x="46" y="250">Cost scales with usage</text>
  <text class="economics-desc economics-row economics-r3" x="46" y="284">Cheap at low volume</text>
  <text class="economics-desc economics-row economics-r4" x="46" y="318">Expensive at high volume</text>
  <rect class="economics-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="economics-name" x="526" y="122">Fine-tuning</text>
  <text class="economics-desc" x="526" y="142">Pay once.</text>
  <text class="economics-desc economics-row economics-r0" x="526" y="182">Training cost, and labelled data</text>
  <text class="economics-desc economics-row economics-r1" x="526" y="216">Shorter prompts thereafter</text>
  <text class="economics-desc economics-row economics-r2" x="526" y="250">Cost flat as usage grows</text>
  <text class="economics-desc economics-row economics-r3" x="526" y="284">Expensive at low volume</text>
  <text class="economics-desc economics-row economics-r4" x="526" y="318">Cheap at high volume</text>
  <text class="economics-sub" x="30" y="372">Because the shapes differ rather than the magnitudes, the answer flips at a volume threshold — which is a calculation rather than a judgment.</text>
</svg>
