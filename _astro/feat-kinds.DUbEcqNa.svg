<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And what each captures.">
  <title>Four kinds of engineered feature</title>
  <style>
    .feat-kinds-bg   { fill: #f8fafc; }
    .feat-kinds-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feat-kinds-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feat-kinds-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feat-kinds-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feat-kinds-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feat-kinds-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .feat-kinds-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .feat-kinds-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .feat-kinds-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .feat-kinds-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .feat-kinds-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .feat-kinds-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .feat-kinds-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .feat-kinds-stage { opacity: 1; }

    .feat-kinds-s0 { animation-delay: 0.00s; }
    .feat-kinds-e0 { animation-delay: 0.00s; }
    .feat-kinds-s1 { animation-delay: 1.28s; }
    .feat-kinds-e1 { animation-delay: 1.28s; }
    .feat-kinds-s2 { animation-delay: 2.56s; }
    .feat-kinds-e2 { animation-delay: 2.56s; }
    .feat-kinds-s3 { animation-delay: 3.84s; }
    .feat-kinds-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .feat-kinds-conn  { animation: feat-kinds-trace 6.4s ease-in-out infinite; }
      .feat-kinds-stage { animation: feat-kinds-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes feat-kinds-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes feat-kinds-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .feat-kinds-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .feat-kinds-stage { animation: feat-kinds-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes feat-kinds-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="feat-kinds-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="feat-kinds-bg" width="980" height="322"/>
  <text class="feat-kinds-h1"  x="30" y="40">Four kinds of engineered feature</text>
  <text class="feat-kinds-sub" x="30" y="64">And what each captures.</text>
  <g class="feat-kinds-stage feat-kinds-s0">
    <rect class="feat-kinds-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="feat-kinds-step" x="44" y="142">01</text>
    <text class="feat-kinds-name" x="70" y="142">Transformations of one variable</text>
    <text class="feat-kinds-desc" x="44" y="166">Logs, ratios, differences.</text>
  </g>
  <line class="feat-kinds-line feat-kinds-conn feat-kinds-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#feat-kinds-tip)"/>
  <g class="feat-kinds-stage feat-kinds-s1">
    <rect class="feat-kinds-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="feat-kinds-step" x="280" y="142">02</text>
    <text class="feat-kinds-name" x="306" y="142">Encodings of categories as numbers</text>
    <text class="feat-kinds-desc" x="280" y="166">One column per value, or a</text>
    <text class="feat-kinds-desc" x="280" y="182">learned vector.</text>
  </g>
  <line class="feat-kinds-line feat-kinds-conn feat-kinds-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#feat-kinds-tip)"/>
  <g class="feat-kinds-stage feat-kinds-s2">
    <rect class="feat-kinds-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="feat-kinds-step" x="516" y="142">03</text>
    <text class="feat-kinds-name" x="542" y="142">Aggregations over a group or a window</text>
    <text class="feat-kinds-desc" x="516" y="166">Counts, averages, recency.</text>
  </g>
  <line class="feat-kinds-line feat-kinds-conn feat-kinds-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#feat-kinds-tip)"/>
  <g class="feat-kinds-stage feat-kinds-s3">
    <rect class="feat-kinds-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="feat-kinds-step" x="752" y="142">04</text>
    <text class="feat-kinds-name" x="778" y="142">And interactions combining two variables</text>
    <text class="feat-kinds-desc" x="752" y="166">Which linear models cannot infer</text>
    <text class="feat-kinds-desc" x="752" y="182">themselves.</text>
  </g>
  <text class="feat-kinds-sub" x="30" y="304">Aggregations over a time window are where most predictive power tends to live in practice, and they are also where leakage most easily creeps in.</text>
</svg>
