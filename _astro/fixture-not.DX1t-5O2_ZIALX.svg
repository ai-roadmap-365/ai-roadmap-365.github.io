<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things fixtures are not</title>
  <style>
    .fixture-not-bg   { fill: #f8fafc; }
    .fixture-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fixture-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fixture-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fixture-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fixture-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fixture-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fixture-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fixture-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fixture-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fixture-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fixture-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fixture-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fixture-not-row { opacity: 1; }
    .fixture-not-r0 { animation-delay: 0.00s; }
    .fixture-not-r1 { animation-delay: 0.45s; }
    .fixture-not-r2 { animation-delay: 0.90s; }
    .fixture-not-r3 { animation-delay: 1.35s; }
    .fixture-not-r4 { animation-delay: 1.80s; }
    .fixture-not-row { animation: fixture-not-reveal 7.3s ease-in-out infinite; }
    @keyframes fixture-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="fixture-not-bg" width="980" height="390"/>
  <text class="fixture-not-h1"  x="30" y="40">Four things fixtures are not</text>
  <text class="fixture-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="fixture-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="fixture-not-name" x="46" y="122">The misconception</text>
  <text class="fixture-not-desc" x="46" y="142">Commonly held.</text>
  <text class="fixture-not-desc fixture-not-row fixture-not-r0" x="46" y="182">Fixtures are imported</text>
  <text class="fixture-not-desc fixture-not-row fixture-not-r1" x="46" y="216">Wider scope is simply faster</text>
  <text class="fixture-not-desc fixture-not-row fixture-not-r2" x="46" y="250">Parametrisation is a loop</text>
  <text class="fixture-not-desc fixture-not-row fixture-not-r3" x="46" y="284">More fixtures means better structure</text>
  <text class="fixture-not-desc fixture-not-row fixture-not-r4" x="46" y="318">Shared setup should always be a fixture</text>
  <rect class="fixture-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="fixture-not-name" x="526" y="122">What is true</text>
  <text class="fixture-not-desc" x="526" y="142">Actually.</text>
  <text class="fixture-not-desc fixture-not-row fixture-not-r0" x="526" y="182">They are discovered by location</text>
  <text class="fixture-not-desc fixture-not-row fixture-not-r1" x="526" y="216">It shares state and risks coupling</text>
  <text class="fixture-not-desc fixture-not-row fixture-not-r2" x="526" y="250">It creates independent tests</text>
  <text class="fixture-not-desc fixture-not-row fixture-not-r3" x="526" y="284">Deeply chained fixtures obscure the setup</text>
  <text class="fixture-not-desc fixture-not-row fixture-not-r4" x="526" y="318">Sometimes a plain helper reads better</text>
  <text class="fixture-not-sub" x="30" y="372">Deeply chained fixtures are a real readability problem: a test whose setup spans four fixtures in three files is hard to reason about.</text>
</svg>
