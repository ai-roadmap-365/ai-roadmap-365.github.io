<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-labelledby="d100a-title d100a-desc">
  <title id="d100a-title">One 3 by 4 matrix drawn three times: as a table of data, as a stack of row vectors, and as a transformation</title>
  <desc id="d100a-desc">The same twelve numbers appear three times. On the left they are a labelled data table with named rows and columns. In the middle they are three row vectors drawn as arrows. On the right they are a machine that takes a vector of length four in and returns a vector of length three out. A footer states the shape rule that connects the three readings.</desc>

  <style>
    .d100a-bg      { fill: #f8fafc; }
    .d100a-h1      { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 21px; font-weight: 600; fill: #1a202c; }
    .d100a-h2      { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 600; fill: #1d4ed8; }
    .d100a-label   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #1a202c; }
    .d100a-small   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d100a-num     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; fill: #1a202c; text-anchor: middle; }
    .d100a-mono    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1d4ed8; }
    .d100a-panel   { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d100a-cell    { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
    .d100a-head    { fill: #e0e7ff; stroke: #94a3b8; stroke-width: 1; }
    .d100a-rowa    { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 1.5; }
    .d100a-rowb    { fill: #e0f2fe; stroke: #0369a1; stroke-width: 1.5; }
    .d100a-rowc    { fill: #ede9fe; stroke: #6d28d9; stroke-width: 1.5; }
    .d100a-arrowa  { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .d100a-arrowb  { stroke: #0369a1; stroke-width: 2.5; fill: none; }
    .d100a-arrowc  { stroke: #6d28d9; stroke-width: 2.5; fill: none; }
    .d100a-wire    { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .d100a-box     { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 2; }
    .d100a-out     { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .d100a-note    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #475569; }
    .d100a-foot    { fill: #ffffff; stroke: #1d4ed8; stroke-width: 1.5; }
  </style>

  <defs>
    <marker id="d100a-arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
    <marker id="d100a-arrowhead-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0369a1" />
    </marker>
    <marker id="d100a-arrowhead-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9" />
    </marker>
  </defs>

  <rect class="d100a-bg" x="0" y="0" width="1000" height="760" />

  <text class="d100a-h1" x="30" y="42">The same 3 by 4 matrix, read three ways</text>
  <text class="d100a-small" x="30" y="68">Twelve numbers. Three questions. Nothing about the numbers changes — only what you are asking them.</text>

  <!-- ============ MEANING 1: a table of data ============ -->
  <rect class="d100a-panel" x="24" y="90" width="300" height="290" rx="6" />
  <text class="d100a-h2" x="42" y="118">1. A table of data</text>
  <text class="d100a-note" x="42" y="139">rows are items, columns are features</text>

  <!-- column headers -->
  <rect class="d100a-head" x="130" y="150" width="46" height="26" />
  <rect class="d100a-head" x="176" y="150" width="46" height="26" />
  <rect class="d100a-head" x="222" y="150" width="46" height="26" />
  <rect class="d100a-head" x="268" y="150" width="46" height="26" />
  <text class="d100a-small" x="153" y="168" text-anchor="middle">base</text>
  <text class="d100a-small" x="199" y="168" text-anchor="middle">bark</text>
  <text class="d100a-small" x="245" y="168" text-anchor="middle">grit</text>
  <text class="d100a-small" x="291" y="168" text-anchor="middle">comp</text>

  <!-- row 0 -->
  <rect class="d100a-head" x="40" y="176" width="90" height="34" />
  <text class="d100a-small" x="48" y="198">Seedling</text>
  <rect class="d100a-cell" x="130" y="176" width="46" height="34" />
  <rect class="d100a-cell" x="176" y="176" width="46" height="34" />
  <rect class="d100a-cell" x="222" y="176" width="46" height="34" />
  <rect class="d100a-cell" x="268" y="176" width="46" height="34" />
  <text class="d100a-num" x="153" y="199">2</text>
  <text class="d100a-num" x="199" y="199">4</text>
  <text class="d100a-num" x="245" y="199">1</text>
  <text class="d100a-num" x="291" y="199">3</text>

  <!-- row 1 -->
  <rect class="d100a-head" x="40" y="210" width="90" height="34" />
  <text class="d100a-small" x="48" y="232">Container</text>
  <rect class="d100a-cell" x="130" y="210" width="46" height="34" />
  <rect class="d100a-cell" x="176" y="210" width="46" height="34" />
  <rect class="d100a-cell" x="222" y="210" width="46" height="34" />
  <rect class="d100a-cell" x="268" y="210" width="46" height="34" />
  <text class="d100a-num" x="153" y="233">0</text>
  <text class="d100a-num" x="199" y="233">5</text>
  <text class="d100a-num" x="245" y="233">2</text>
  <text class="d100a-num" x="291" y="233">7</text>

  <!-- row 2 -->
  <rect class="d100a-head" x="40" y="244" width="90" height="34" />
  <text class="d100a-small" x="48" y="266">Alpine</text>
  <rect class="d100a-cell" x="130" y="244" width="46" height="34" />
  <rect class="d100a-cell" x="176" y="244" width="46" height="34" />
  <rect class="d100a-cell" x="222" y="244" width="46" height="34" />
  <rect class="d100a-cell" x="268" y="244" width="46" height="34" />
  <text class="d100a-num" x="153" y="267">6</text>
  <text class="d100a-num" x="199" y="267">1</text>
  <text class="d100a-num" x="245" y="267">4</text>
  <text class="d100a-num" x="291" y="267">2</text>

  <text class="d100a-mono" x="42" y="302">shape (3, 4) — rows first</text>
  <text class="d100a-small" x="42" y="322">M[2, 0] is 6: row 2, column 0.</text>
  <text class="d100a-small" x="42" y="342">A paper would call that same entry</text>
  <text class="d100a-small" x="42" y="360">a-31, because mathematics counts from 1.</text>

  <!-- ============ MEANING 2: a collection of vectors ============ -->
  <rect class="d100a-panel" x="348" y="90" width="300" height="290" rx="6" />
  <text class="d100a-h2" x="366" y="118">2. A collection of vectors</text>
  <text class="d100a-note" x="366" y="139">and WHICH collection changes everything</text>

  <rect class="d100a-rowa" x="366" y="152" width="200" height="30" rx="4" />
  <text class="d100a-label" x="376" y="173">[ 2, 4, 1, 3 ]</text>
  <path class="d100a-arrowa" d="M 574 167 L 614 167" marker-end="url(#d100a-arrowhead)" />
  <text class="d100a-small" x="366" y="196">Seedling as one point in 4 dimensions</text>

  <rect class="d100a-rowb" x="366" y="206" width="200" height="30" rx="4" />
  <text class="d100a-label" x="376" y="227">[ 0, 5, 2, 7 ]</text>
  <path class="d100a-arrowb" d="M 574 221 L 614 221" marker-end="url(#d100a-arrowhead-b)" />
  <text class="d100a-small" x="366" y="250">Container</text>

  <rect class="d100a-rowc" x="366" y="260" width="200" height="30" rx="4" />
  <text class="d100a-label" x="376" y="281">[ 6, 1, 4, 2 ]</text>
  <path class="d100a-arrowc" d="M 574 275 L 614 275" marker-end="url(#d100a-arrowhead-c)" />
  <text class="d100a-small" x="366" y="304">Alpine</text>

  <text class="d100a-mono" x="366" y="330">3 row vectors of length 4</text>
  <text class="d100a-small" x="366" y="352">or 4 column vectors of length 3 — a</text>
  <text class="d100a-small" x="366" y="370">different set of vectors entirely.</text>

  <!-- ============ MEANING 3: a transformation ============ -->
  <rect class="d100a-panel" x="672" y="90" width="304" height="290" rx="6" />
  <text class="d100a-h2" x="690" y="118">3. A transformation</text>
  <text class="d100a-note" x="690" y="139">a machine: vector in, vector out</text>

  <rect class="d100a-cell" x="690" y="156" width="150" height="28" rx="4" />
  <text class="d100a-label" x="700" y="176">in: [10, 2, 5, 1]</text>
  <text class="d100a-small" x="690" y="200">length 4 — one per COLUMN</text>

  <path class="d100a-wire" d="M 765 206 L 765 234" marker-end="url(#d100a-arrowhead)" />

  <rect class="d100a-box" x="690" y="238" width="266" height="56" rx="6" />
  <text class="d100a-label" x="704" y="262">M — the 3 by 4 matrix above</text>
  <text class="d100a-small" x="704" y="284">each row is multiplied entry by entry, then summed</text>

  <path class="d100a-wire" d="M 765 298 L 765 322" marker-end="url(#d100a-arrowhead)" />

  <rect class="d100a-out" x="690" y="326" width="180" height="28" rx="4" />
  <text class="d100a-label" x="700" y="346">out: [36, 27, 84]</text>
  <text class="d100a-small" x="690" y="370">length 3 — one per ROW</text>

  <!-- ============ the connecting rule ============ -->
  <rect class="d100a-foot" x="24" y="400" width="952" height="150" rx="6" />
  <text class="d100a-h2" x="44" y="428">The rule that ties the three together</text>
  <text class="d100a-label" x="44" y="456">A matrix of shape (3, 4) applied to a vector of length 4 returns a vector of length 3.</text>
  <text class="d100a-small" x="44" y="480">The 4 is CONSUMED — it had to match the number of columns, and it is gone from the answer.</text>
  <text class="d100a-small" x="44" y="502">The 3 SURVIVES — it was the number of rows, and it is the length of what comes back.</text>
  <text class="d100a-small" x="44" y="526">Every shape error you will ever hit in a model is two pieces of code disagreeing about which meaning each assumed.</text>

  <!-- worked arithmetic strip -->
  <rect class="d100a-panel" x="24" y="566" width="952" height="166" rx="6" />
  <text class="d100a-h2" x="44" y="594">The output, worked out by hand</text>
  <text class="d100a-label" x="44" y="622">Seedling  : 2 x 10 + 4 x 2 + 1 x 5 + 3 x 1 = 20 + 8 + 5 + 3 = 36</text>
  <text class="d100a-label" x="44" y="648">Container : 0 x 10 + 5 x 2 + 2 x 5 + 7 x 1 = 0 + 10 + 10 + 7 = 27</text>
  <text class="d100a-label" x="44" y="674">Alpine    : 6 x 10 + 1 x 2 + 4 x 5 + 2 x 1 = 60 + 2 + 20 + 2 = 84</text>
  <text class="d100a-small" x="44" y="704">Reading 1 says these are ingredient quantities. Reading 2 says each row is a point. Reading 3 says the whole grid is a</text>
  <text class="d100a-small" x="44" y="724">price calculator. All three are true at once, and the numbers never moved. Data is invented.</text>
</svg>
