<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By what the model replaces.">
  <title>Which baseline when</title>
  <style>
    .baseline-when-bg   { fill: #f8fafc; }
    .baseline-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baseline-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baseline-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baseline-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baseline-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baseline-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .baseline-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .baseline-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .baseline-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .baseline-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .baseline-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .baseline-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .baseline-when-row { opacity: 1; }
    .baseline-when-r0 { animation-delay: 0.00s; }
    .baseline-when-r1 { animation-delay: 0.45s; }
    .baseline-when-r2 { animation-delay: 0.90s; }
    .baseline-when-r3 { animation-delay: 1.35s; }
    .baseline-when-r4 { animation-delay: 1.80s; }
    .baseline-when-row { animation: baseline-when-reveal 7.3s ease-in-out infinite; }
    @keyframes baseline-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="baseline-when-bg" width="980" height="390"/>
  <text class="baseline-when-h1"  x="30" y="40">Which baseline when</text>
  <text class="baseline-when-sub" x="30" y="64">By what the model replaces.</text>
  <rect class="baseline-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="baseline-when-name" x="46" y="122">The situation</text>
  <text class="baseline-when-desc" x="46" y="142">What exists now.</text>
  <text class="baseline-when-desc baseline-when-row baseline-when-r0" x="46" y="182">Nothing; a new capability</text>
  <text class="baseline-when-desc baseline-when-row baseline-when-r1" x="46" y="216">An existing business rule</text>
  <text class="baseline-when-desc baseline-when-row baseline-when-r2" x="46" y="250">An existing model</text>
  <text class="baseline-when-desc baseline-when-row baseline-when-r3" x="46" y="284">A human making the decision</text>
  <text class="baseline-when-desc baseline-when-row baseline-when-r4" x="46" y="318">A published benchmark</text>
  <rect class="baseline-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="baseline-when-name" x="526" y="122">The baseline</text>
  <text class="baseline-when-desc" x="526" y="142">What to beat.</text>
  <text class="baseline-when-desc baseline-when-row baseline-when-r0" x="526" y="182">Trivial baseline, plus a simple model</text>
  <text class="baseline-when-desc baseline-when-row baseline-when-r1" x="526" y="216">The rule itself, measured on the same data</text>
  <text class="baseline-when-desc baseline-when-row baseline-when-r2" x="526" y="250">The current model, on the same split</text>
  <text class="baseline-when-desc baseline-when-row baseline-when-r3" x="526" y="284">Human agreement rate, measured</text>
  <text class="baseline-when-desc baseline-when-row baseline-when-r4" x="526" y="318">The published number, reproduced first</text>
  <text class="baseline-when-sub" x="30" y="372">Measuring the existing rule on the same data as the model is the step that makes the comparison fair, and it frequently reveals the rule is stronger than assumed.</text>
</svg>
