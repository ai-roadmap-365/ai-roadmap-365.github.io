<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Why the labels come off.">
  <title>A blind tasting</title>
  <style>
    .blind-tasting-bg   { fill: #f8fafc; }
    .blind-tasting-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blind-tasting-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blind-tasting-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blind-tasting-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blind-tasting-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blind-tasting-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .blind-tasting-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .blind-tasting-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .blind-tasting-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .blind-tasting-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .blind-tasting-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .blind-tasting-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .blind-tasting-row { opacity: 1; }
    .blind-tasting-r0 { animation-delay: 0.00s; }
    .blind-tasting-r1 { animation-delay: 0.45s; }
    .blind-tasting-r2 { animation-delay: 0.90s; }
    .blind-tasting-r3 { animation-delay: 1.35s; }
    .blind-tasting-r4 { animation-delay: 1.80s; }
    .blind-tasting-row { animation: blind-tasting-reveal 7.3s ease-in-out infinite; }
    @keyframes blind-tasting-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="blind-tasting-bg" width="980" height="390"/>
  <text class="blind-tasting-h1"  x="30" y="40">A blind tasting</text>
  <text class="blind-tasting-sub" x="30" y="64">Why the labels come off.</text>
  <rect class="blind-tasting-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="blind-tasting-name" x="46" y="122">Knowing the label</text>
  <text class="blind-tasting-desc" x="46" y="142">Expectation decides.</text>
  <text class="blind-tasting-desc blind-tasting-row blind-tasting-r0" x="46" y="182">The expensive one tastes better</text>
  <text class="blind-tasting-desc blind-tasting-row blind-tasting-r1" x="46" y="216">Reputation shapes the judgment</text>
  <text class="blind-tasting-desc blind-tasting-row blind-tasting-r2" x="46" y="250">Order affects the result</text>
  <text class="blind-tasting-desc blind-tasting-row blind-tasting-r3" x="46" y="284">Reproducible only by accident</text>
  <text class="blind-tasting-desc blind-tasting-row blind-tasting-r4" x="46" y="318">This is an informal comparison</text>
  <rect class="blind-tasting-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="blind-tasting-name" x="526" y="122">Blind, and randomised</text>
  <text class="blind-tasting-desc" x="526" y="142">The thing itself decides.</text>
  <text class="blind-tasting-desc blind-tasting-row blind-tasting-r0" x="526" y="182">Labels hidden from the judge</text>
  <text class="blind-tasting-desc blind-tasting-row blind-tasting-r1" x="526" y="216">Order randomised per judge</text>
  <text class="blind-tasting-desc blind-tasting-row blind-tasting-r2" x="526" y="250">Scored on written criteria</text>
  <text class="blind-tasting-desc blind-tasting-row blind-tasting-r3" x="526" y="284">Repeatable by anyone</text>
  <text class="blind-tasting-desc blind-tasting-row blind-tasting-r4" x="526" y="318">This is an evaluation</text>
  <text class="blind-tasting-sub" x="30" y="372">Randomising order is not fussiness in either setting: position bias is one of the largest and best-documented effects in both human and model grading.</text>
</svg>
