<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Why fairness needs defining</title>
  <style>
    .fairness-idea-bg   { fill: #f8fafc; }
    .fairness-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fairness-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fairness-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fairness-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fairness-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fairness-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fairness-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fairness-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fairness-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fairness-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fairness-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fairness-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .fairness-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .fairness-idea-stage { opacity: 1; }

    .fairness-idea-s0 { animation-delay: 0.00s; }
    .fairness-idea-e0 { animation-delay: 0.00s; }
    .fairness-idea-s1 { animation-delay: 1.28s; }
    .fairness-idea-e1 { animation-delay: 1.28s; }
    .fairness-idea-s2 { animation-delay: 2.56s; }
    .fairness-idea-e2 { animation-delay: 2.56s; }
    .fairness-idea-s3 { animation-delay: 3.84s; }
    .fairness-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .fairness-idea-conn  { animation: fairness-idea-trace 6.4s ease-in-out infinite; }
      .fairness-idea-stage { animation: fairness-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes fairness-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes fairness-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .fairness-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .fairness-idea-stage { animation: fairness-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes fairness-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="fairness-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="fairness-idea-bg" width="980" height="322"/>
  <text class="fairness-idea-h1"  x="30" y="40">Why fairness needs defining</text>
  <text class="fairness-idea-sub" x="30" y="64">Four steps.</text>
  <g class="fairness-idea-stage fairness-idea-s0">
    <rect class="fairness-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="fairness-idea-step" x="44" y="142">01</text>
    <text class="fairness-idea-name" x="70" y="142">Everyone agrees the model should be fair</text>
    <text class="fairness-idea-desc" x="44" y="166">In the abstract.</text>
  </g>
  <line class="fairness-idea-line fairness-idea-conn fairness-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#fairness-idea-tip)"/>
  <g class="fairness-idea-stage fairness-idea-s1">
    <rect class="fairness-idea-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="fairness-idea-step" x="280" y="142">02</text>
    <text class="fairness-idea-name" x="306" y="142">But fairness formalises several incompatible ways</text>
    <text class="fairness-idea-desc" x="280" y="166">Equal rates, equal errors, equal</text>
    <text class="fairness-idea-desc" x="280" y="182">calibration.</text>
  </g>
  <line class="fairness-idea-line fairness-idea-conn fairness-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#fairness-idea-tip)"/>
  <g class="fairness-idea-stage fairness-idea-s2">
    <rect class="fairness-idea-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="fairness-idea-step" x="516" y="142">03</text>
    <text class="fairness-idea-name" x="542" y="142">And they cannot all hold at once</text>
    <text class="fairness-idea-desc" x="516" y="166">Which is a theorem, not a</text>
    <text class="fairness-idea-desc" x="516" y="182">limitation of current methods.</text>
  </g>
  <line class="fairness-idea-line fairness-idea-conn fairness-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#fairness-idea-tip)"/>
  <g class="fairness-idea-stage fairness-idea-s3">
    <rect class="fairness-idea-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="fairness-idea-step" x="752" y="142">04</text>
    <text class="fairness-idea-name" x="778" y="142">So the definition must be chosen and stated</text>
    <text class="fairness-idea-desc" x="752" y="166">Which makes it a policy</text>
    <text class="fairness-idea-desc" x="752" y="182">decision, not a technical one.</text>
  </g>
  <text class="fairness-idea-sub" x="30" y="304">That this is a policy decision rather than a technical one is the honest framing: the mathematics cannot choose between the definitions, and someone must.</text>
</svg>
