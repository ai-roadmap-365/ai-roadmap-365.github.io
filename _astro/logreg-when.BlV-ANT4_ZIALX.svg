<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when to move on.">
  <title>When to use logistic regression</title>
  <style>
    .logreg-when-bg   { fill: #f8fafc; }
    .logreg-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logreg-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logreg-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logreg-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logreg-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logreg-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .logreg-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .logreg-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .logreg-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .logreg-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .logreg-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .logreg-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .logreg-when-row { opacity: 1; }
    .logreg-when-r0 { animation-delay: 0.00s; }
    .logreg-when-r1 { animation-delay: 0.45s; }
    .logreg-when-r2 { animation-delay: 0.90s; }
    .logreg-when-r3 { animation-delay: 1.35s; }
    .logreg-when-r4 { animation-delay: 1.80s; }
    .logreg-when-row { animation: logreg-when-reveal 7.3s ease-in-out infinite; }
    @keyframes logreg-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="logreg-when-bg" width="980" height="390"/>
  <text class="logreg-when-h1"  x="30" y="40">When to use logistic regression</text>
  <text class="logreg-when-sub" x="30" y="64">And when to move on.</text>
  <rect class="logreg-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="logreg-when-name" x="46" y="122">Use it</text>
  <text class="logreg-when-desc" x="46" y="142">More often than expected.</text>
  <text class="logreg-when-desc logreg-when-row logreg-when-r0" x="46" y="182">As the first baseline, always</text>
  <text class="logreg-when-desc logreg-when-row logreg-when-r1" x="46" y="216">Where decisions must be explained</text>
  <text class="logreg-when-desc logreg-when-row logreg-when-r2" x="46" y="250">Where calibrated probabilities matter</text>
  <text class="logreg-when-desc logreg-when-row logreg-when-r3" x="46" y="284">High-dimensional sparse data such as text</text>
  <text class="logreg-when-desc logreg-when-row logreg-when-r4" x="46" y="318">Limited training data</text>
  <rect class="logreg-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="logreg-when-name" x="526" y="122">Move on</text>
  <text class="logreg-when-desc" x="526" y="142">Four signals.</text>
  <text class="logreg-when-desc logreg-when-row logreg-when-r0" x="526" y="182">Strong feature interactions you cannot enumerate</text>
  <text class="logreg-when-desc logreg-when-row logreg-when-r1" x="526" y="216">Images, audio or raw signals</text>
  <text class="logreg-when-desc logreg-when-row logreg-when-r2" x="526" y="250">Where the baseline is clearly insufficient</text>
  <text class="logreg-when-desc logreg-when-row logreg-when-r3" x="526" y="284">Highly non-linear structure</text>
  <text class="logreg-when-desc logreg-when-row logreg-when-r4" x="526" y="318">But only after measuring the baseline</text>
  <text class="logreg-when-sub" x="30" y="372">Measuring the baseline first is the part that gets skipped, and it regularly turns out that the complex model beats it by less than the maintenance cost.</text>
</svg>
