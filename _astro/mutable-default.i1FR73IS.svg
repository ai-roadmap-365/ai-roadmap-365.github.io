<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The mutable default trap</title>
  <style>
    .mutable-default-bg   { fill: #f8fafc; }
    .mutable-default-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mutable-default-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mutable-default-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mutable-default-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mutable-default-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mutable-default-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mutable-default-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mutable-default-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mutable-default-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mutable-default-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mutable-default-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mutable-default-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .mutable-default-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .mutable-default-stage { opacity: 1; }

    .mutable-default-s0 { animation-delay: 0.00s; }
    .mutable-default-e0 { animation-delay: 0.00s; }
    .mutable-default-s1 { animation-delay: 1.28s; }
    .mutable-default-e1 { animation-delay: 1.28s; }
    .mutable-default-s2 { animation-delay: 2.56s; }
    .mutable-default-e2 { animation-delay: 2.56s; }
    .mutable-default-s3 { animation-delay: 3.84s; }
    .mutable-default-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .mutable-default-conn  { animation: mutable-default-trace 6.4s ease-in-out infinite; }
      .mutable-default-stage { animation: mutable-default-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes mutable-default-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes mutable-default-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .mutable-default-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .mutable-default-stage { animation: mutable-default-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes mutable-default-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="mutable-default-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="mutable-default-bg" width="980" height="322"/>
  <text class="mutable-default-h1"  x="30" y="40">The mutable default trap</text>
  <text class="mutable-default-sub" x="30" y="64">Four steps.</text>
  <g class="mutable-default-stage mutable-default-s0">
    <rect class="mutable-default-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="mutable-default-step" x="44" y="142">01</text>
    <text class="mutable-default-name" x="70" y="142">Default arguments are evaluated once, at definition</text>
    <text class="mutable-default-desc" x="44" y="166">Not on each call.</text>
  </g>
  <line class="mutable-default-line mutable-default-conn mutable-default-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#mutable-default-tip)"/>
  <g class="mutable-default-stage mutable-default-s1">
    <rect class="mutable-default-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="mutable-default-step" x="280" y="142">02</text>
    <text class="mutable-default-name" x="306" y="142">So a mutable default is one object, shared by every call</text>
    <text class="mutable-default-desc" x="280" y="166">For the life of the program.</text>
  </g>
  <line class="mutable-default-line mutable-default-conn mutable-default-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#mutable-default-tip)"/>
  <g class="mutable-default-stage mutable-default-s2">
    <rect class="mutable-default-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="mutable-default-step" x="516" y="142">03</text>
    <text class="mutable-default-name" x="542" y="142">Which means changes accumulate between calls</text>
    <text class="mutable-default-desc" x="516" y="166">Producing behaviour nobody</text>
    <text class="mutable-default-desc" x="516" y="182">intended.</text>
  </g>
  <line class="mutable-default-line mutable-default-conn mutable-default-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#mutable-default-tip)"/>
  <g class="mutable-default-stage mutable-default-s3">
    <rect class="mutable-default-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="mutable-default-step" x="752" y="142">04</text>
    <text class="mutable-default-name" x="778" y="142">Use None as the default and create inside</text>
    <text class="mutable-default-desc" x="752" y="166">Which is the standard fix.</text>
  </g>
  <text class="mutable-default-sub" x="30" y="304">This is the language's most famous trap and it follows directly from when defaults are evaluated, which makes it predictable once the rule is known.</text>
</svg>
