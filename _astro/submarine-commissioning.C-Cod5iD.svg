<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Hull, airlock, bulkheads, dive test.">
  <title>Commissioning a submarine</title>
  <style>
    .submarine-commissioning-bg   { fill: #f8fafc; }
    .submarine-commissioning-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .submarine-commissioning-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .submarine-commissioning-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .submarine-commissioning-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .submarine-commissioning-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .submarine-commissioning-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .submarine-commissioning-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .submarine-commissioning-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .submarine-commissioning-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .submarine-commissioning-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .submarine-commissioning-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .submarine-commissioning-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .submarine-commissioning-row { opacity: 1; }
    .submarine-commissioning-r0 { animation-delay: 0.00s; }
    .submarine-commissioning-r1 { animation-delay: 0.45s; }
    .submarine-commissioning-r2 { animation-delay: 0.90s; }
    .submarine-commissioning-r3 { animation-delay: 1.35s; }
    .submarine-commissioning-r4 { animation-delay: 1.80s; }
    .submarine-commissioning-row { animation: submarine-commissioning-reveal 7.3s ease-in-out infinite; }
    @keyframes submarine-commissioning-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="submarine-commissioning-bg" width="980" height="390"/>
  <text class="submarine-commissioning-h1"  x="30" y="40">Commissioning a submarine</text>
  <text class="submarine-commissioning-sub" x="30" y="64">Hull, airlock, bulkheads, dive test.</text>
  <rect class="submarine-commissioning-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="submarine-commissioning-name" x="46" y="122">The commissioning</text>
  <text class="submarine-commissioning-desc" x="46" y="142">Four checks before the dive.</text>
  <text class="submarine-commissioning-desc submarine-commissioning-row submarine-commissioning-r0" x="46" y="182">Every steel plate certified, no fractures</text>
  <text class="submarine-commissioning-desc submarine-commissioning-row submarine-commissioning-r1" x="46" y="216">Airlocks strip contaminants at entry</text>
  <text class="submarine-commissioning-desc submarine-commissioning-row submarine-commissioning-r2" x="46" y="250">Bulkheads seal a breached compartment</text>
  <text class="submarine-commissioning-desc submarine-commissioning-row submarine-commissioning-r3" x="46" y="284">A controlled dive to test depth</text>
  <text class="submarine-commissioning-desc submarine-commissioning-row submarine-commissioning-r4" x="46" y="318">Nobody aboard for the last one</text>
  <rect class="submarine-commissioning-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="submarine-commissioning-name" x="526" y="122">The review</text>
  <text class="submarine-commissioning-desc" x="526" y="142">The same four.</text>
  <text class="submarine-commissioning-desc submarine-commissioning-row submarine-commissioning-r0" x="526" y="182">Signed SafeTensors, no pickle</text>
  <text class="submarine-commissioning-desc submarine-commissioning-row submarine-commissioning-r1" x="526" y="216">The PII vault at ingress</text>
  <text class="submarine-commissioning-desc submarine-commissioning-row submarine-commissioning-r2" x="526" y="250">Layered isolation contains one bypass</text>
  <text class="submarine-commissioning-desc submarine-commissioning-row submarine-commissioning-r3" x="526" y="284">Red teaming at maximum adversarial pressure</text>
  <text class="submarine-commissioning-desc submarine-commissioning-row submarine-commissioning-r4" x="526" y="318">In staging, before users</text>
  <text class="submarine-commissioning-sub" x="30" y="372">The controlled dive is the part organisations skip: proving the vessel survives its rated depth in a dry dock is expensive, and the alternative is discovering the answer with passengers aboard.</text>
</svg>
