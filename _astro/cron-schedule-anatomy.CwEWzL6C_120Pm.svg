<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" font-family="system-ui, sans-serif">
  <title>The five crontab fields decoded, with the example 0 9 * * 1 meaning 9 a.m. every Monday</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Anatomy of a crontab schedule</text>
  <text x="380" y="62" text-anchor="middle" font-size="15" fill="#1a202c">Five time fields, then the command to run</text>

  <!-- The example schedule, big -->
  <text x="380" y="118" text-anchor="middle" font-size="34" font-weight="bold" fill="#1d4ed8" font-family="ui-monospace, monospace">0   9   *   *   1</text>

  <!-- Field boxes -->
  <g>
    <rect x="40" y="160" width="130" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
    <text x="105" y="186" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Minute</text>
    <text x="105" y="208" text-anchor="middle" font-size="14" fill="#1a202c">0–59</text>

    <rect x="184" y="160" width="130" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
    <text x="249" y="186" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Hour</text>
    <text x="249" y="208" text-anchor="middle" font-size="14" fill="#1a202c">0–23</text>

    <rect x="328" y="160" width="130" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
    <text x="393" y="182" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Day of</text>
    <text x="393" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">month</text>
    <text x="393" y="220" text-anchor="middle" font-size="14" fill="#1a202c">1–31</text>

    <rect x="472" y="160" width="130" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
    <text x="537" y="186" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Month</text>
    <text x="537" y="208" text-anchor="middle" font-size="14" fill="#1a202c">1–12</text>

    <rect x="616" y="160" width="130" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
    <text x="681" y="182" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Day of</text>
    <text x="681" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">week</text>
    <text x="681" y="220" text-anchor="middle" font-size="14" fill="#1a202c">0–7 (Sun=0)</text>
  </g>

  <!-- Connectors from the digits to the boxes -->
  <g stroke="#1d4ed8" stroke-width="2">
    <line x1="290" y1="128" x2="105" y2="158"/>
    <line x1="330" y1="128" x2="249" y2="158"/>
    <line x1="372" y1="128" x2="393" y2="158"/>
    <line x1="414" y1="128" x2="537" y2="158"/>
    <line x1="456" y1="128" x2="681" y2="158"/>
  </g>

  <!-- Decoded values row -->
  <g>
    <text x="105" y="262" text-anchor="middle" font-size="14" fill="#1d4ed8" font-weight="bold">0 = minute 0</text>
    <text x="249" y="262" text-anchor="middle" font-size="14" fill="#1d4ed8" font-weight="bold">9 = 9 o'clock</text>
    <text x="393" y="262" text-anchor="middle" font-size="14" fill="#1d4ed8" font-weight="bold">* = any day</text>
    <text x="537" y="262" text-anchor="middle" font-size="14" fill="#1d4ed8" font-weight="bold">* = any month</text>
    <text x="681" y="262" text-anchor="middle" font-size="14" fill="#1d4ed8" font-weight="bold">1 = Monday</text>
  </g>

  <!-- Result banner -->
  <rect x="120" y="300" width="520" height="56" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="380" y="334" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a202c">Reads as: run at 09:00 every Monday</text>

  <!-- Legend for wildcard / step -->
  <text x="380" y="392" text-anchor="middle" font-size="14" fill="#1a202c">* = every value   ·   1,15 = a list   ·   1-5 = a range   ·   */15 = a step (every 15)</text>
  <text x="380" y="416" text-anchor="middle" font-size="14" fill="#1a202c">Edit your table with crontab -e   ·   view it with crontab -l</text>
</svg>
