<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A real denial-of-service vector, in one line.">
  <title>When a pattern takes exponential time</title>
  <style>
    .catastrophic-backtracking-bg   { fill: #f8fafc; }
    .catastrophic-backtracking-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .catastrophic-backtracking-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .catastrophic-backtracking-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .catastrophic-backtracking-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .catastrophic-backtracking-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .catastrophic-backtracking-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .catastrophic-backtracking-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .catastrophic-backtracking-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .catastrophic-backtracking-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .catastrophic-backtracking-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .catastrophic-backtracking-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .catastrophic-backtracking-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .catastrophic-backtracking-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .catastrophic-backtracking-stage { opacity: 1; }

    .catastrophic-backtracking-s0 { animation-delay: 0.00s; }
    .catastrophic-backtracking-e0 { animation-delay: 0.00s; }
    .catastrophic-backtracking-s1 { animation-delay: 1.28s; }
    .catastrophic-backtracking-e1 { animation-delay: 1.28s; }
    .catastrophic-backtracking-s2 { animation-delay: 2.56s; }
    .catastrophic-backtracking-e2 { animation-delay: 2.56s; }
    .catastrophic-backtracking-s3 { animation-delay: 3.84s; }
    .catastrophic-backtracking-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .catastrophic-backtracking-conn  { animation: catastrophic-backtracking-trace 6.4s ease-in-out infinite; }
      .catastrophic-backtracking-stage { animation: catastrophic-backtracking-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes catastrophic-backtracking-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes catastrophic-backtracking-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .catastrophic-backtracking-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .catastrophic-backtracking-stage { animation: catastrophic-backtracking-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes catastrophic-backtracking-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="catastrophic-backtracking-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="catastrophic-backtracking-bg" width="980" height="322"/>
  <text class="catastrophic-backtracking-h1"  x="30" y="40">When a pattern takes exponential time</text>
  <text class="catastrophic-backtracking-sub" x="30" y="64">A real denial-of-service vector, in one line.</text>
  <g class="catastrophic-backtracking-stage catastrophic-backtracking-s0">
    <rect class="catastrophic-backtracking-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="catastrophic-backtracking-step" x="44" y="142">01</text>
    <text class="catastrophic-backtracking-name" x="70" y="142">Nested quantifiers</text>
    <text class="catastrophic-backtracking-desc" x="44" y="166">(a+)+ — a repetition inside a</text>
    <text class="catastrophic-backtracking-desc" x="44" y="182">repetition.</text>
    <text class="catastrophic-backtracking-edge" x="44" y="242">(a+)+$</text>
  </g>
  <line class="catastrophic-backtracking-line catastrophic-backtracking-conn catastrophic-backtracking-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#catastrophic-backtracking-tip)"/>
  <g class="catastrophic-backtracking-stage catastrophic-backtracking-s1">
    <rect class="catastrophic-backtracking-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="catastrophic-backtracking-step" x="280" y="142">02</text>
    <text class="catastrophic-backtracking-name" x="306" y="142">Many ways to divide the input</text>
    <text class="catastrophic-backtracking-desc" x="280" y="166">The engine must try each split</text>
    <text class="catastrophic-backtracking-desc" x="280" y="182">between the inner and outer</text>
    <text class="catastrophic-backtracking-desc" x="280" y="198">repetition.</text>
  </g>
  <line class="catastrophic-backtracking-line catastrophic-backtracking-conn catastrophic-backtracking-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#catastrophic-backtracking-tip)"/>
  <g class="catastrophic-backtracking-stage catastrophic-backtracking-s2">
    <rect class="catastrophic-backtracking-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="catastrophic-backtracking-step" x="516" y="142">03</text>
    <text class="catastrophic-backtracking-name" x="542" y="142">On a non-match, it tries them all</text>
    <text class="catastrophic-backtracking-desc" x="516" y="166">And the number of splits grows</text>
    <text class="catastrophic-backtracking-desc" x="516" y="182">exponentially with length.</text>
    <text class="catastrophic-backtracking-edge" x="516" y="242">2^n</text>
  </g>
  <line class="catastrophic-backtracking-line catastrophic-backtracking-conn catastrophic-backtracking-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#catastrophic-backtracking-tip)"/>
  <g class="catastrophic-backtracking-stage catastrophic-backtracking-s3">
    <rect class="catastrophic-backtracking-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="catastrophic-backtracking-step" x="752" y="142">04</text>
    <text class="catastrophic-backtracking-name" x="778" y="142">Mitigate</text>
    <text class="catastrophic-backtracking-desc" x="752" y="166">A timeout, a length limit, and</text>
    <text class="catastrophic-backtracking-desc" x="752" y="182">no nested quantifiers on</text>
    <text class="catastrophic-backtracking-desc" x="752" y="198">untrusted input.</text>
    <text class="catastrophic-backtracking-edge" x="752" y="242">timeout</text>
  </g>
  <text class="catastrophic-backtracking-sub" x="30" y="304">Never run a user-supplied pattern without a timeout and a length cap. Some engines offer neither, which makes the input limit the only control you have.</text>
</svg>
