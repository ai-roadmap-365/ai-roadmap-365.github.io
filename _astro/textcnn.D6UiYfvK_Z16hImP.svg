<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Filters as phrase detectors.">
  <title>How a text CNN works</title>
  <style>
    .textcnn-bg   { fill: #f8fafc; }
    .textcnn-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .textcnn-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .textcnn-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .textcnn-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .textcnn-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .textcnn-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .textcnn-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .textcnn-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .textcnn-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .textcnn-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .textcnn-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .textcnn-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .textcnn-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .textcnn-stage { opacity: 1; }

    .textcnn-s0 { animation-delay: 0.00s; }
    .textcnn-e0 { animation-delay: 0.00s; }
    .textcnn-s1 { animation-delay: 1.28s; }
    .textcnn-e1 { animation-delay: 1.28s; }
    .textcnn-s2 { animation-delay: 2.56s; }
    .textcnn-e2 { animation-delay: 2.56s; }
    .textcnn-s3 { animation-delay: 3.84s; }
    .textcnn-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .textcnn-conn  { animation: textcnn-trace 6.4s ease-in-out infinite; }
      .textcnn-stage { animation: textcnn-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes textcnn-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes textcnn-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .textcnn-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .textcnn-stage { animation: textcnn-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes textcnn-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="textcnn-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="textcnn-bg" width="980" height="322"/>
  <text class="textcnn-h1"  x="30" y="40">How a text CNN works</text>
  <text class="textcnn-sub" x="30" y="64">Filters as phrase detectors.</text>
  <g class="textcnn-stage textcnn-s0">
    <rect class="textcnn-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="textcnn-step" x="44" y="142">01</text>
    <text class="textcnn-name" x="70" y="142">The sentence as a matrix</text>
    <text class="textcnn-desc" x="44" y="166">One embedding row per token, in</text>
    <text class="textcnn-desc" x="44" y="182">order.</text>
  </g>
  <line class="textcnn-line textcnn-conn textcnn-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#textcnn-tip)"/>
  <g class="textcnn-stage textcnn-s1">
    <rect class="textcnn-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="textcnn-step" x="280" y="142">02</text>
    <text class="textcnn-name" x="306" y="142">Filters slide over token windows</text>
    <text class="textcnn-desc" x="280" y="166">A width-three filter is a</text>
    <text class="textcnn-desc" x="280" y="182">trigram detector, learned rather</text>
    <text class="textcnn-desc" x="280" y="198">than listed.</text>
    <text class="textcnn-edge" x="280" y="242">n-grams</text>
  </g>
  <line class="textcnn-line textcnn-conn textcnn-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#textcnn-tip)"/>
  <g class="textcnn-stage textcnn-s2">
    <rect class="textcnn-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="textcnn-step" x="516" y="142">03</text>
    <text class="textcnn-name" x="542" y="142">Max pool over positions</text>
    <text class="textcnn-desc" x="516" y="166">Did this phrase appear anywhere?</text>
    <text class="textcnn-desc" x="516" y="182">Position is discarded</text>
    <text class="textcnn-desc" x="516" y="198">deliberately.</text>
  </g>
  <line class="textcnn-line textcnn-conn textcnn-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#textcnn-tip)"/>
  <g class="textcnn-stage textcnn-s3">
    <rect class="textcnn-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="textcnn-step" x="752" y="142">04</text>
    <text class="textcnn-name" x="778" y="142">Several widths, concatenated</text>
    <text class="textcnn-desc" x="752" y="166">Bigram, trigram and four-gram</text>
    <text class="textcnn-desc" x="752" y="182">detectors together.</text>
  </g>
  <text class="textcnn-sub" x="30" y="304">Max pooling over the whole sentence is what gives translation invariance in text: a negative phrase counts the same whether it appears at the start or the end of a review.</text>
</svg>
