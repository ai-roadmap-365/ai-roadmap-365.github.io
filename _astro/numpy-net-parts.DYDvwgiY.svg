<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Everything a training loop needs.">
  <title>Five pieces, no framework</title>
  <style>
    .numpy-net-parts-bg   { fill: #f8fafc; }
    .numpy-net-parts-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .numpy-net-parts-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .numpy-net-parts-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .numpy-net-parts-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .numpy-net-parts-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .numpy-net-parts-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .numpy-net-parts-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .numpy-net-parts-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .numpy-net-parts-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .numpy-net-parts-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .numpy-net-parts-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .numpy-net-parts-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .numpy-net-parts-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .numpy-net-parts-stage { opacity: 1; }

    .numpy-net-parts-s0 { animation-delay: 0.00s; }
    .numpy-net-parts-e0 { animation-delay: 0.00s; }
    .numpy-net-parts-s1 { animation-delay: 1.33s; }
    .numpy-net-parts-e1 { animation-delay: 1.33s; }
    .numpy-net-parts-s2 { animation-delay: 2.67s; }
    .numpy-net-parts-e2 { animation-delay: 2.67s; }
    .numpy-net-parts-s3 { animation-delay: 4.00s; }
    .numpy-net-parts-e3 { animation-delay: 4.00s; }
    .numpy-net-parts-s4 { animation-delay: 5.33s; }
    .numpy-net-parts-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .numpy-net-parts-conn  { animation: numpy-net-parts-trace 8s ease-in-out infinite; }
      .numpy-net-parts-stage { animation: numpy-net-parts-arrive 8s ease-in-out infinite; }
    }
    @keyframes numpy-net-parts-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes numpy-net-parts-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .numpy-net-parts-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .numpy-net-parts-stage { animation: numpy-net-parts-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes numpy-net-parts-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="numpy-net-parts-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="numpy-net-parts-bg" width="980" height="322"/>
  <text class="numpy-net-parts-h1"  x="30" y="40">Five pieces, no framework</text>
  <text class="numpy-net-parts-sub" x="30" y="64">Everything a training loop needs.</text>
  <g class="numpy-net-parts-stage numpy-net-parts-s0">
    <rect class="numpy-net-parts-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="numpy-net-parts-step" x="44" y="142">01</text>
    <text class="numpy-net-parts-name" x="70" y="142">Initialise the weights</text>
    <text class="numpy-net-parts-desc" x="44" y="166">Scaled by fan-in. Not</text>
    <text class="numpy-net-parts-desc" x="44" y="182">zero, and not arbitrary.</text>
    <text class="numpy-net-parts-edge" x="44" y="242">He or Xavier</text>
  </g>
  <line class="numpy-net-parts-line numpy-net-parts-conn numpy-net-parts-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#numpy-net-parts-tip)"/>
  <g class="numpy-net-parts-stage numpy-net-parts-s1">
    <rect class="numpy-net-parts-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="numpy-net-parts-step" x="233" y="142">02</text>
    <text class="numpy-net-parts-name" x="259" y="142">Forward</text>
    <text class="numpy-net-parts-desc" x="233" y="166">Matrix multiply, bias,</text>
    <text class="numpy-net-parts-desc" x="233" y="182">activation. Cache Z and</text>
    <text class="numpy-net-parts-desc" x="233" y="198">A.</text>
  </g>
  <line class="numpy-net-parts-line numpy-net-parts-conn numpy-net-parts-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#numpy-net-parts-tip)"/>
  <g class="numpy-net-parts-stage numpy-net-parts-s2">
    <rect class="numpy-net-parts-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="numpy-net-parts-step" x="422" y="142">03</text>
    <text class="numpy-net-parts-name" x="448" y="142">Loss</text>
    <text class="numpy-net-parts-desc" x="422" y="166">A scalar, and its</text>
    <text class="numpy-net-parts-desc" x="422" y="182">derivative with respect</text>
    <text class="numpy-net-parts-desc" x="422" y="198">to the output.</text>
  </g>
  <line class="numpy-net-parts-line numpy-net-parts-conn numpy-net-parts-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#numpy-net-parts-tip)"/>
  <g class="numpy-net-parts-stage numpy-net-parts-s3">
    <rect class="numpy-net-parts-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="numpy-net-parts-step" x="611" y="142">04</text>
    <text class="numpy-net-parts-name" x="637" y="142">Backward</text>
    <text class="numpy-net-parts-desc" x="611" y="166">Four equations per layer,</text>
    <text class="numpy-net-parts-desc" x="611" y="182">by the chain rule.</text>
  </g>
  <line class="numpy-net-parts-line numpy-net-parts-conn numpy-net-parts-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#numpy-net-parts-tip)"/>
  <g class="numpy-net-parts-stage numpy-net-parts-s4">
    <rect class="numpy-net-parts-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="numpy-net-parts-step" x="800" y="142">05</text>
    <text class="numpy-net-parts-name" x="826" y="142">Update</text>
    <text class="numpy-net-parts-desc" x="800" y="166">Mini-batch SGD with</text>
    <text class="numpy-net-parts-desc" x="800" y="182">momentum.</text>
  </g>
  <text class="numpy-net-parts-sub" x="30" y="304">Every one of these is a line in a framework and a function here, which is the point of the exercise: `loss.backward()` stops being magic once you have written the sweep it performs.</text>
</svg>
