<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four consequences.">
  <title>The dual form</title>
  <style>
    .dual-support-bg   { fill: #f8fafc; }
    .dual-support-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dual-support-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dual-support-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dual-support-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dual-support-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dual-support-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dual-support-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dual-support-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dual-support-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dual-support-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dual-support-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dual-support-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .dual-support-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .dual-support-stage { opacity: 1; }

    .dual-support-s0 { animation-delay: 0.00s; }
    .dual-support-e0 { animation-delay: 0.00s; }
    .dual-support-s1 { animation-delay: 1.28s; }
    .dual-support-e1 { animation-delay: 1.28s; }
    .dual-support-s2 { animation-delay: 2.56s; }
    .dual-support-e2 { animation-delay: 2.56s; }
    .dual-support-s3 { animation-delay: 3.84s; }
    .dual-support-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .dual-support-conn  { animation: dual-support-trace 6.4s ease-in-out infinite; }
      .dual-support-stage { animation: dual-support-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes dual-support-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes dual-support-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .dual-support-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .dual-support-stage { animation: dual-support-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes dual-support-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="dual-support-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="dual-support-bg" width="980" height="322"/>
  <text class="dual-support-h1"  x="30" y="40">The dual form</text>
  <text class="dual-support-sub" x="30" y="64">Four consequences.</text>
  <g class="dual-support-stage dual-support-s0">
    <rect class="dual-support-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="dual-support-step" x="44" y="142">01</text>
    <text class="dual-support-name" x="70" y="142">The problem can be rewritten in terms of the training points</text>
    <text class="dual-support-desc" x="44" y="166">Rather than the weight vector.</text>
  </g>
  <line class="dual-support-line dual-support-conn dual-support-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#dual-support-tip)"/>
  <g class="dual-support-stage dual-support-s1">
    <rect class="dual-support-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="dual-support-step" x="280" y="142">02</text>
    <text class="dual-support-name" x="306" y="142">In which the data appears only as dot products</text>
    <text class="dual-support-desc" x="280" y="166">Never individually.</text>
  </g>
  <line class="dual-support-line dual-support-conn dual-support-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#dual-support-tip)"/>
  <g class="dual-support-stage dual-support-s2">
    <rect class="dual-support-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="dual-support-step" x="516" y="142">03</text>
    <text class="dual-support-name" x="542" y="142">Most points get zero weight</text>
    <text class="dual-support-desc" x="516" y="166">Only the support vectors matter,</text>
    <text class="dual-support-desc" x="516" y="182">which makes it sparse.</text>
  </g>
  <line class="dual-support-line dual-support-conn dual-support-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#dual-support-tip)"/>
  <g class="dual-support-stage dual-support-s3">
    <rect class="dual-support-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="dual-support-step" x="752" y="142">04</text>
    <text class="dual-support-name" x="778" y="142">And the dot product can be replaced</text>
    <text class="dual-support-desc" x="752" y="166">Which is what opens the door to</text>
    <text class="dual-support-desc" x="752" y="182">kernels.</text>
    <text class="dual-support-edge" x="752" y="242">the trick</text>
  </g>
  <text class="dual-support-sub" x="30" y="304">The data appearing only through dot products is the structural fact that makes the kernel trick possible, so this reformulation is the load-bearing step.</text>
</svg>
