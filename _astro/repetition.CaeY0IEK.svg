<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And three ways to reduce it.">
  <title>Degenerate repetition</title>
  <style>
    .repetition-bg   { fill: #f8fafc; }
    .repetition-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repetition-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repetition-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repetition-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repetition-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repetition-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .repetition-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .repetition-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .repetition-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .repetition-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .repetition-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .repetition-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .repetition-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .repetition-stage { opacity: 1; }

    .repetition-s0 { animation-delay: 0.00s; }
    .repetition-e0 { animation-delay: 0.00s; }
    .repetition-s1 { animation-delay: 1.28s; }
    .repetition-e1 { animation-delay: 1.28s; }
    .repetition-s2 { animation-delay: 2.56s; }
    .repetition-e2 { animation-delay: 2.56s; }
    .repetition-s3 { animation-delay: 3.84s; }
    .repetition-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .repetition-conn  { animation: repetition-trace 6.4s ease-in-out infinite; }
      .repetition-stage { animation: repetition-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes repetition-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes repetition-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .repetition-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .repetition-stage { animation: repetition-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes repetition-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="repetition-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="repetition-bg" width="980" height="322"/>
  <text class="repetition-h1"  x="30" y="40">Degenerate repetition</text>
  <text class="repetition-sub" x="30" y="64">And three ways to reduce it.</text>
  <g class="repetition-stage repetition-s0">
    <rect class="repetition-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="repetition-step" x="44" y="142">01</text>
    <text class="repetition-name" x="70" y="142">The model loops on a phrase</text>
    <text class="repetition-desc" x="44" y="166">Repeating the same span</text>
    <text class="repetition-desc" x="44" y="182">indefinitely.</text>
  </g>
  <line class="repetition-line repetition-conn repetition-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#repetition-tip)"/>
  <g class="repetition-stage repetition-s1">
    <rect class="repetition-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="repetition-step" x="280" y="142">02</text>
    <text class="repetition-name" x="306" y="142">Because repetition is self-reinforcing</text>
    <text class="repetition-desc" x="280" y="166">A phrase in the context raises</text>
    <text class="repetition-desc" x="280" y="182">the probability of repeating it.</text>
  </g>
  <line class="repetition-line repetition-conn repetition-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#repetition-tip)"/>
  <g class="repetition-stage repetition-s2">
    <rect class="repetition-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="repetition-step" x="516" y="142">03</text>
    <text class="repetition-name" x="542" y="142">Frequency and presence penalties</text>
    <text class="repetition-desc" x="516" y="166">Reduce the logit of tokens</text>
    <text class="repetition-desc" x="516" y="182">already used.</text>
  </g>
  <line class="repetition-line repetition-conn repetition-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#repetition-tip)"/>
  <g class="repetition-stage repetition-s3">
    <rect class="repetition-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="repetition-step" x="752" y="142">04</text>
    <text class="repetition-name" x="778" y="142">Or sample rather than maximise</text>
    <text class="repetition-desc" x="752" y="166">Which breaks the loop by not</text>
    <text class="repetition-desc" x="752" y="182">always taking the peak.</text>
  </g>
  <text class="repetition-sub" x="30" y="304">The self-reinforcement is the mechanism worth understanding: nothing in the training objective penalises repetition, and the context window makes repeated text more probable rather than less.</text>
</svg>
