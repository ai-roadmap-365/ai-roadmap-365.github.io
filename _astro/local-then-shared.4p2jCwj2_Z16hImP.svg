<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Fast and private, then slow and authoritative.">
  <title>Two lines of defence, and why you want both</title>
  <style>
    .local-then-shared-bg   { fill: #f8fafc; }
    .local-then-shared-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-then-shared-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-then-shared-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-then-shared-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-then-shared-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-then-shared-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .local-then-shared-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .local-then-shared-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .local-then-shared-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .local-then-shared-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .local-then-shared-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .local-then-shared-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .local-then-shared-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .local-then-shared-stage { opacity: 1; }

    .local-then-shared-s0 { animation-delay: 0.00s; }
    .local-then-shared-e0 { animation-delay: 0.00s; }
    .local-then-shared-s1 { animation-delay: 1.28s; }
    .local-then-shared-e1 { animation-delay: 1.28s; }
    .local-then-shared-s2 { animation-delay: 2.56s; }
    .local-then-shared-e2 { animation-delay: 2.56s; }
    .local-then-shared-s3 { animation-delay: 3.84s; }
    .local-then-shared-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .local-then-shared-conn  { animation: local-then-shared-trace 6.4s ease-in-out infinite; }
      .local-then-shared-stage { animation: local-then-shared-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes local-then-shared-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes local-then-shared-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .local-then-shared-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .local-then-shared-stage { animation: local-then-shared-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes local-then-shared-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="local-then-shared-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="local-then-shared-bg" width="980" height="322"/>
  <text class="local-then-shared-h1"  x="30" y="40">Two lines of defence, and why you want both</text>
  <text class="local-then-shared-sub" x="30" y="64">Fast and private, then slow and authoritative.</text>
  <g class="local-then-shared-stage local-then-shared-s0">
    <rect class="local-then-shared-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="local-then-shared-step" x="44" y="142">01</text>
    <text class="local-then-shared-name" x="70" y="142">The hook runs locally</text>
    <text class="local-then-shared-desc" x="44" y="166">In the second before a commit.</text>
    <text class="local-then-shared-desc" x="44" y="182">On your machine, privately.</text>
    <text class="local-then-shared-edge" x="44" y="242">seconds</text>
  </g>
  <line class="local-then-shared-line local-then-shared-conn local-then-shared-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#local-then-shared-tip)"/>
  <g class="local-then-shared-stage local-then-shared-s1">
    <rect class="local-then-shared-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="local-then-shared-step" x="280" y="142">02</text>
    <text class="local-then-shared-name" x="306" y="142">You fix it before anyone sees</text>
    <text class="local-then-shared-desc" x="280" y="166">Which is the entire value of the</text>
    <text class="local-then-shared-desc" x="280" y="182">fast loop.</text>
  </g>
  <line class="local-then-shared-line local-then-shared-conn local-then-shared-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#local-then-shared-tip)"/>
  <g class="local-then-shared-stage local-then-shared-s2">
    <rect class="local-then-shared-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="local-then-shared-step" x="516" y="142">03</text>
    <text class="local-then-shared-name" x="542" y="142">But it is skippable</text>
    <text class="local-then-shared-desc" x="516" y="166">--no-verify bypasses it, and a</text>
    <text class="local-then-shared-desc" x="516" y="182">colleague may never have</text>
    <text class="local-then-shared-desc" x="516" y="198">installed it.</text>
    <text class="local-then-shared-edge" x="516" y="242">skippable</text>
  </g>
  <line class="local-then-shared-line local-then-shared-conn local-then-shared-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#local-then-shared-tip)"/>
  <g class="local-then-shared-stage local-then-shared-s3">
    <rect class="local-then-shared-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="local-then-shared-step" x="752" y="142">04</text>
    <text class="local-then-shared-name" x="778" y="142">CI runs the same script</text>
    <text class="local-then-shared-desc" x="752" y="166">On a shared server, for</text>
    <text class="local-then-shared-desc" x="752" y="182">everyone, on every push. Nobody</text>
    <text class="local-then-shared-desc" x="752" y="198">can skip it.</text>
    <text class="local-then-shared-edge" x="752" y="242">authoritative</text>
  </g>
  <text class="local-then-shared-sub" x="30" y="304">Run the same script in both places. The hook is a courtesy to you; CI is the guarantee to everyone else, and neither one replaces the other.</text>
</svg>
