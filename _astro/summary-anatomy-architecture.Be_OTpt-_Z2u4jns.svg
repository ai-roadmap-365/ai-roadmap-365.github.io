<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="d116a-title d116a-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="d116a-title">Where mean, median and mode land on a symmetric distribution versus a skewed one</title>
  <desc id="d116a-desc">Two histograms side by side. The left one is symmetric: the mean, median and mode all fall at the same point near the centre, and the quartiles and interquartile range sit evenly on either side. The right one is right-skewed, with a long tail of high values: the mode stays at the peak, the median shifts right of it, and the mean is pulled furthest right of all, past the third quartile, because the long tail drags it toward the rare extreme values.</desc>

  <style>
    .d116a-bg { fill: #f8fafc; }
    .d116a-heading { font-size: 18px; font-weight: 700; fill: #1a202c; }
    .d116a-subheading { font-size: 15px; font-weight: 700; fill: #1a202c; }
    .d116a-label { font-size: 13px; fill: #1a202c; }
    .d116a-small { font-size: 12px; fill: #475569; }
    .d116a-mono { font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace; font-size: 13px; fill: #1a202c; }
    .d116a-bar-sym { fill: #93c5fd; stroke: #1d4ed8; stroke-width: 1; }
    .d116a-bar-skew { fill: #fca5a5; stroke: #b91c1c; stroke-width: 1; }
    .d116a-axis { stroke: #64748b; stroke-width: 1.5; }
    .d116a-mean-line { stroke: #b91c1c; stroke-width: 2.5; }
    .d116a-median-line { stroke: #1d4ed8; stroke-width: 2.5; stroke-dasharray: 6 4; }
    .d116a-mode-line { stroke: #15803d; stroke-width: 2.5; stroke-dasharray: 2 3; }
    .d116a-iqr { fill: #1d4ed8; opacity: 0.12; }
    .d116a-panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
  </style>

  <rect class="d116a-bg" x="0" y="0" width="1000" height="620" />
  <text class="d116a-heading" x="500" y="34" text-anchor="middle">One distribution, three different "typical value" answers</text>

  <!-- LEFT PANEL: symmetric -->
  <rect class="d116a-panel" x="30" y="60" width="440" height="470" rx="10" />
  <text class="d116a-subheading" x="250" y="90" text-anchor="middle">Symmetric: all three agree</text>

  <!-- IQR band -->
  <rect class="d116a-iqr" x="150" y="120" width="140" height="360" />
  <text class="d116a-small" x="220" y="500" text-anchor="middle">IQR (Q1 to Q3)</text>

  <!-- symmetric histogram bars (bell-ish) -->
  <g>
    <rect class="d116a-bar-sym" x="70"  y="440" width="26" height="40" />
    <rect class="d116a-bar-sym" x="100" y="400" width="26" height="80" />
    <rect class="d116a-bar-sym" x="130" y="340" width="26" height="140" />
    <rect class="d116a-bar-sym" x="160" y="270" width="26" height="210" />
    <rect class="d116a-bar-sym" x="190" y="200" width="26" height="280" />
    <rect class="d116a-bar-sym" x="220" y="150" width="26" height="330" />
    <rect class="d116a-bar-sym" x="250" y="150" width="26" height="330" />
    <rect class="d116a-bar-sym" x="280" y="200" width="26" height="280" />
    <rect class="d116a-bar-sym" x="310" y="270" width="26" height="210" />
    <rect class="d116a-bar-sym" x="340" y="340" width="26" height="140" />
    <rect class="d116a-bar-sym" x="370" y="400" width="26" height="80" />
    <rect class="d116a-bar-sym" x="400" y="440" width="26" height="40" />
  </g>
  <line class="d116a-axis" x1="60" y1="480" x2="440" y2="480" />

  <!-- mean = median = mode, all at x=250 (centre) -->
  <line class="d116a-mean-line" x1="250" y1="120" x2="250" y2="490" />
  <line class="d116a-median-line" x1="250" y1="120" x2="250" y2="490" transform="translate(-4,0)" />
  <line class="d116a-mode-line" x1="250" y1="120" x2="250" y2="490" transform="translate(4,0)" />

  <text class="d116a-mono" x="250" y="512" text-anchor="middle">mean = median = mode</text>
  <text class="d116a-small" x="250" y="530" text-anchor="middle">all three land at the centre</text>

  <!-- legend left -->
  <g>
    <line class="d116a-mean-line" x1="60" y1="555" x2="90" y2="555" />
    <text class="d116a-label" x="98" y="560">mean</text>
    <line class="d116a-median-line" x1="60" y1="578" x2="90" y2="578" />
    <text class="d116a-label" x="98" y="583">median</text>
    <line class="d116a-mode-line" x1="60" y1="601" x2="90" y2="601" />
    <text class="d116a-label" x="98" y="606">mode</text>
  </g>

  <!-- RIGHT PANEL: skewed -->
  <rect class="d116a-panel" x="530" y="60" width="440" height="470" rx="10" />
  <text class="d116a-subheading" x="750" y="90" text-anchor="middle">Right-skewed: they separate</text>

  <!-- IQR band, shifted -->
  <rect class="d116a-iqr" x="600" y="120" width="180" height="360" />
  <text class="d116a-small" x="690" y="500" text-anchor="middle">IQR (Q1 to Q3)</text>

  <!-- skewed histogram bars: sharp rise, long tail -->
  <g>
    <rect class="d116a-bar-skew" x="570" y="150" width="24" height="330" />
    <rect class="d116a-bar-skew" x="598" y="180" width="24" height="300" />
    <rect class="d116a-bar-skew" x="626" y="230" width="24" height="250" />
    <rect class="d116a-bar-skew" x="654" y="290" width="24" height="190" />
    <rect class="d116a-bar-skew" x="682" y="350" width="24" height="130" />
    <rect class="d116a-bar-skew" x="710" y="400" width="24" height="80" />
    <rect class="d116a-bar-skew" x="738" y="430" width="24" height="50" />
    <rect class="d116a-bar-skew" x="766" y="450" width="24" height="30" />
    <rect class="d116a-bar-skew" x="794" y="462" width="24" height="18" />
    <rect class="d116a-bar-skew" x="822" y="470" width="24" height="10" />
    <rect class="d116a-bar-skew" x="850" y="474" width="24" height="6" />
    <rect class="d116a-bar-skew" x="878" y="477" width="24" height="3" />
  </g>
  <line class="d116a-axis" x1="560" y1="480" x2="920" y2="480" />

  <!-- mode at the peak (x=582), median a bit right (x=650), mean pulled further right (x=740) -->
  <line class="d116a-mode-line" x1="582" y1="120" x2="582" y2="490" />
  <line class="d116a-median-line" x1="650" y1="120" x2="650" y2="490" />
  <line class="d116a-mean-line" x1="740" y1="120" x2="740" y2="490" />

  <text class="d116a-mono" x="582" y="512" text-anchor="middle">mode</text>
  <text class="d116a-mono" x="650" y="512" text-anchor="middle">median</text>
  <text class="d116a-mono" x="740" y="512" text-anchor="middle">mean</text>
  <text class="d116a-small" x="750" y="530" text-anchor="middle">the long tail drags the mean past Q3</text>

  <!-- legend right -->
  <g>
    <line class="d116a-mean-line" x1="560" y1="555" x2="590" y2="555" />
    <text class="d116a-label" x="598" y="560">mean -- pulled toward the tail</text>
    <line class="d116a-median-line" x1="560" y1="578" x2="590" y2="578" />
    <text class="d116a-label" x="598" y="583">median -- the honest "typical" figure</text>
    <line class="d116a-mode-line" x1="560" y1="601" x2="590" y2="601" />
    <text class="d116a-label" x="598" y="606">mode -- stays at the peak</text>
  </g>
</svg>
