<svg role="img" aria-label="Prompt lifecycle CI/CD and production observability pipeline diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Prompt Lifecycle CI/CD &amp; Observability Pipeline</title>
  <defs>
    <linearGradient id="bg252b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card252b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg252b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">PROMPTS AS CODE: THE PROD LIFECYCLE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Git Versioning, Automated Testing, Staging Rollout, and OpenTelemetry Tracing</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card252b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Step 1: Git Versioning -->
    <rect x="25" y="25" width="165" height="245" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="107" y="50" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">1. Git Versioning</text>
    <rect x="35" y="75" width="145" height="70" fill="#1e293b" rx="4"/>
    <text x="40" y="95" fill="#cbd5e1" font-size="7">• prompts/v2.1.0.j2</text>
    <text x="40" y="112" fill="#cbd5e1" font-size="7">• SemVer commit tag</text>
    <text x="40" y="129" fill="#cbd5e1" font-size="7">• Peer code review</text>
    <text x="107" y="200" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">Version Controlled</text>

    <!-- Step 2: Automated CI/CD -->
    <rect x="210" y="25" width="165" height="245" fill="#0f172a" stroke="#fbbf24" rx="6"/>
    <text x="292" y="50" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">2. CI/CD Evals</text>
    <rect x="220" y="75" width="145" height="70" fill="#1e293b" rx="4"/>
    <text x="225" y="95" fill="#cbd5e1" font-size="7">• Promptfoo test run</text>
    <text x="225" y="112" fill="#cbd5e1" font-size="7">• Zero regression gate</text>
    <text x="225" y="129" fill="#cbd5e1" font-size="7">• Token budget check</text>
    <text x="292" y="200" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">Automated Testing</text>

    <!-- Step 3: Canary Deploy -->
    <rect x="395" y="25" width="165" height="245" fill="#0f172a" stroke="#a855f7" rx="6"/>
    <text x="477" y="50" fill="#c084fc" font-size="10" font-weight="700" text-anchor="middle">3. Canary Rollout</text>
    <rect x="405" y="75" width="145" height="70" fill="#1e293b" rx="4"/>
    <text x="410" y="95" fill="#cbd5e1" font-size="7">• 10% traffic routing</text>
    <text x="410" y="112" fill="#cbd5e1" font-size="7">• Error rate telemetry</text>
    <text x="410" y="129" fill="#cbd5e1" font-size="7">• Automated rollback</text>
    <text x="477" y="200" fill="#c084fc" font-size="8" font-weight="700" text-anchor="middle">Risk-Free Staging</text>

    <!-- Step 4: OpenTelemetry Tracing -->
    <rect x="580" y="25" width="165" height="245" fill="#0f172a" stroke="#34d399" stroke-width="1.5" rx="6"/>
    <text x="662" y="50" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">4. Observability</text>
    <rect x="590" y="75" width="145" height="70" fill="#1e293b" rx="4"/>
    <text x="595" y="95" fill="#cbd5e1" font-size="7">• OpenInference trace</text>
    <text x="595" y="112" fill="#cbd5e1" font-size="7">• Prompt hash tracking</text>
    <text x="595" y="129" fill="#cbd5e1" font-size="7">• User feedback loops</text>
    <text x="662" y="200" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Full Observability</text>
  </g>
</svg>
