<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward a named pattern.">
  <title>Four steps in aggregation</title>
  <style>
    .group-history-bg   { fill: #f8fafc; }
    .group-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .group-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .group-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .group-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .group-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .group-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .group-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .group-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .group-history-stage { opacity: 1; }

    .group-history-s0 { animation-delay: 0.00s; }
    .group-history-e0 { animation-delay: 0.00s; }
    .group-history-s1 { animation-delay: 1.28s; }
    .group-history-e1 { animation-delay: 1.28s; }
    .group-history-s2 { animation-delay: 2.56s; }
    .group-history-e2 { animation-delay: 2.56s; }
    .group-history-s3 { animation-delay: 3.84s; }
    .group-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .group-history-conn  { animation: group-history-trace 6.4s ease-in-out infinite; }
      .group-history-stage { animation: group-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes group-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes group-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .group-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .group-history-stage { animation: group-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes group-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="group-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="group-history-bg" width="980" height="322"/>
  <text class="group-history-h1"  x="30" y="40">Four steps in aggregation</text>
  <text class="group-history-sub" x="30" y="64">Toward a named pattern.</text>
  <g class="group-history-stage group-history-s0">
    <rect class="group-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="group-history-step" x="44" y="142">01</text>
    <text class="group-history-name" x="70" y="142">Tabulating by hand, one category at a time</text>
    <text class="group-history-desc" x="44" y="166">Slow, and error-prone.</text>
  </g>
  <line class="group-history-line group-history-conn group-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#group-history-tip)"/>
  <g class="group-history-stage group-history-s1">
    <rect class="group-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="group-history-step" x="280" y="142">02</text>
    <text class="group-history-name" x="306" y="142">Then grouping in query languages</text>
    <text class="group-history-desc" x="280" y="166">Declared, and optimised.</text>
  </g>
  <line class="group-history-line group-history-conn group-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#group-history-tip)"/>
  <g class="group-history-stage group-history-s2">
    <rect class="group-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="group-history-step" x="516" y="142">03</text>
    <text class="group-history-name" x="542" y="142">Then the pattern named and generalised</text>
    <text class="group-history-desc" x="516" y="166">Beyond simple aggregation.</text>
  </g>
  <line class="group-history-line group-history-conn group-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#group-history-tip)"/>
  <g class="group-history-stage group-history-s3">
    <rect class="group-history-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="group-history-step" x="752" y="142">04</text>
    <text class="group-history-name" x="778" y="142">And distributed frameworks built on it</text>
    <text class="group-history-desc" x="752" y="166">Where the split spans machines.</text>
  </g>
  <text class="group-history-sub" x="30" y="304">The distributed frameworks work because the pattern parallelises naturally: each group can be processed independently, which is exactly what a cluster needs.</text>
</svg>
