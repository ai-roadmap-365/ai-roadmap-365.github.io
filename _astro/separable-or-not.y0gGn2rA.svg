<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The same algorithm, two very different behaviours.">
  <title>Separable, or not</title>
  <style>
    .separable-or-not-bg   { fill: #f8fafc; }
    .separable-or-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .separable-or-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .separable-or-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .separable-or-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .separable-or-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .separable-or-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .separable-or-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .separable-or-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .separable-or-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .separable-or-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .separable-or-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .separable-or-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .separable-or-not-row { opacity: 1; }
    .separable-or-not-r0 { animation-delay: 0.00s; }
    .separable-or-not-r1 { animation-delay: 0.45s; }
    .separable-or-not-r2 { animation-delay: 0.90s; }
    .separable-or-not-r3 { animation-delay: 1.35s; }
    .separable-or-not-r4 { animation-delay: 1.80s; }
    .separable-or-not-row { animation: separable-or-not-reveal 7.3s ease-in-out infinite; }
    @keyframes separable-or-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="separable-or-not-bg" width="980" height="390"/>
  <text class="separable-or-not-h1"  x="30" y="40">Separable, or not</text>
  <text class="separable-or-not-sub" x="30" y="64">The same algorithm, two very different behaviours.</text>
  <rect class="separable-or-not-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="separable-or-not-name" x="46" y="122">Separable</text>
  <text class="separable-or-not-desc" x="46" y="142">Guaranteed convergence.</text>
  <text class="separable-or-not-desc separable-or-not-row separable-or-not-r0" x="46" y="182">Some hyperplane exists</text>
  <text class="separable-or-not-desc separable-or-not-row separable-or-not-r1" x="46" y="216">Updates are bounded</text>
  <text class="separable-or-not-desc separable-or-not-row separable-or-not-r2" x="46" y="250">Zero training errors, in finite steps</text>
  <text class="separable-or-not-desc separable-or-not-row separable-or-not-r3" x="46" y="284">Which hyperplane you get depends on the order</text>
  <text class="separable-or-not-desc separable-or-not-row separable-or-not-r4" x="46" y="318">Any of them is correct</text>
  <rect class="separable-or-not-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="separable-or-not-name" x="526" y="122">Not separable</text>
  <text class="separable-or-not-desc" x="526" y="142">Oscillates forever.</text>
  <text class="separable-or-not-desc separable-or-not-row separable-or-not-r0" x="526" y="182">No hyperplane exists</text>
  <text class="separable-or-not-desc separable-or-not-row separable-or-not-r1" x="526" y="216">The rule keeps finding mistakes</text>
  <text class="separable-or-not-desc separable-or-not-row separable-or-not-r2" x="526" y="250">Weights swing without settling</text>
  <text class="separable-or-not-desc separable-or-not-row separable-or-not-r3" x="526" y="284">No convergence, and no warning</text>
  <text class="separable-or-not-desc separable-or-not-row separable-or-not-r4" x="526" y="318">You must cap the epochs yourself</text>
  <text class="separable-or-not-sub" x="30" y="372">The absence of a warning is what makes this a practical trap: a perceptron on non-separable data looks like a perceptron that has not finished yet, indefinitely.</text>
</svg>
