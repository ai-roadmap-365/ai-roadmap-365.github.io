<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four choices.">
  <title>Robust summaries</title>
  <style>
    .robust-stats-bg   { fill: #f8fafc; }
    .robust-stats-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .robust-stats-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .robust-stats-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .robust-stats-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .robust-stats-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .robust-stats-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .robust-stats-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .robust-stats-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .robust-stats-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .robust-stats-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .robust-stats-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .robust-stats-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .robust-stats-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .robust-stats-stage { opacity: 1; }

    .robust-stats-s0 { animation-delay: 0.00s; }
    .robust-stats-e0 { animation-delay: 0.00s; }
    .robust-stats-s1 { animation-delay: 1.28s; }
    .robust-stats-e1 { animation-delay: 1.28s; }
    .robust-stats-s2 { animation-delay: 2.56s; }
    .robust-stats-e2 { animation-delay: 2.56s; }
    .robust-stats-s3 { animation-delay: 3.84s; }
    .robust-stats-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .robust-stats-conn  { animation: robust-stats-trace 6.4s ease-in-out infinite; }
      .robust-stats-stage { animation: robust-stats-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes robust-stats-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes robust-stats-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .robust-stats-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .robust-stats-stage { animation: robust-stats-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes robust-stats-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="robust-stats-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="robust-stats-bg" width="980" height="322"/>
  <text class="robust-stats-h1"  x="30" y="40">Robust summaries</text>
  <text class="robust-stats-sub" x="30" y="64">Four choices.</text>
  <g class="robust-stats-stage robust-stats-s0">
    <rect class="robust-stats-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="robust-stats-step" x="44" y="142">01</text>
    <text class="robust-stats-name" x="70" y="142">Use the median when the data is skewed</text>
    <text class="robust-stats-desc" x="44" y="166">It is unmoved by extremes.</text>
  </g>
  <line class="robust-stats-line robust-stats-conn robust-stats-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#robust-stats-tip)"/>
  <g class="robust-stats-stage robust-stats-s1">
    <rect class="robust-stats-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="robust-stats-step" x="280" y="142">02</text>
    <text class="robust-stats-name" x="306" y="142">Use quartiles rather than standard deviation</text>
    <text class="robust-stats-desc" x="280" y="166">Which describe the middle</text>
    <text class="robust-stats-desc" x="280" y="182">honestly.</text>
  </g>
  <line class="robust-stats-line robust-stats-conn robust-stats-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#robust-stats-tip)"/>
  <g class="robust-stats-stage robust-stats-s2">
    <rect class="robust-stats-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="robust-stats-step" x="516" y="142">03</text>
    <text class="robust-stats-name" x="542" y="142">Trim or winsorise when outliers dominate</text>
    <text class="robust-stats-desc" x="516" y="166">But say that you did.</text>
  </g>
  <line class="robust-stats-line robust-stats-conn robust-stats-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#robust-stats-tip)"/>
  <g class="robust-stats-stage robust-stats-s3">
    <rect class="robust-stats-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="robust-stats-step" x="752" y="142">04</text>
    <text class="robust-stats-name" x="778" y="142">And always plot the distribution as well</text>
    <text class="robust-stats-desc" x="752" y="166">No summary replaces looking.</text>
  </g>
  <text class="robust-stats-sub" x="30" y="304">Always plotting is the single most valuable rule here, because summary statistics are designed to compress and therefore designed to hide.</text>
</svg>
