<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The result either way tells you where to look next.">
  <title>Reproduce before you edit</title>
  <style>
    .isolate-the-variable-bg   { fill: #f8fafc; }
    .isolate-the-variable-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .isolate-the-variable-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .isolate-the-variable-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .isolate-the-variable-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .isolate-the-variable-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .isolate-the-variable-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .isolate-the-variable-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .isolate-the-variable-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .isolate-the-variable-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .isolate-the-variable-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .isolate-the-variable-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .isolate-the-variable-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .isolate-the-variable-row { opacity: 1; }
    .isolate-the-variable-r0 { animation-delay: 0.00s; }
    .isolate-the-variable-r1 { animation-delay: 0.45s; }
    .isolate-the-variable-r2 { animation-delay: 0.90s; }
    .isolate-the-variable-r3 { animation-delay: 1.35s; }
    .isolate-the-variable-r4 { animation-delay: 1.80s; }
    .isolate-the-variable-row { animation: isolate-the-variable-reveal 7.3s ease-in-out infinite; }
    @keyframes isolate-the-variable-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="isolate-the-variable-bg" width="980" height="390"/>
  <text class="isolate-the-variable-h1"  x="30" y="40">Reproduce before you edit</text>
  <text class="isolate-the-variable-sub" x="30" y="64">The result either way tells you where to look next.</text>
  <rect class="isolate-the-variable-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="isolate-the-variable-name" x="46" y="122">curl succeeds, code fails</text>
  <text class="isolate-the-variable-desc" x="46" y="142">The difference is in your code.</text>
  <text class="isolate-the-variable-desc isolate-the-variable-row isolate-the-variable-r0" x="46" y="182">Compare curl's &gt; lines with your headers</text>
  <text class="isolate-the-variable-desc isolate-the-variable-row isolate-the-variable-r1" x="46" y="216">A missing Content-Type is common</text>
  <text class="isolate-the-variable-desc isolate-the-variable-row isolate-the-variable-r2" x="46" y="250">So is a missing Bearer prefix</text>
  <text class="isolate-the-variable-desc isolate-the-variable-row isolate-the-variable-r3" x="46" y="284">Or a client library adding something</text>
  <text class="isolate-the-variable-desc isolate-the-variable-row isolate-the-variable-r4" x="46" y="318">Search halved, in one command</text>
  <rect class="isolate-the-variable-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="isolate-the-variable-name" x="526" y="122">curl fails too</text>
  <text class="isolate-the-variable-desc" x="526" y="142">Your code was never the problem.</text>
  <text class="isolate-the-variable-desc isolate-the-variable-row isolate-the-variable-r0" x="526" y="182">Walk the five gates on the curl output</text>
  <text class="isolate-the-variable-desc isolate-the-variable-row isolate-the-variable-r1" x="526" y="216">Now you have a reproducible bug report</text>
  <text class="isolate-the-variable-desc isolate-the-variable-row isolate-the-variable-r2" x="526" y="250">Anyone can run it and see the same thing</text>
  <text class="isolate-the-variable-desc isolate-the-variable-row isolate-the-variable-r3" x="526" y="284">Including the service's support team</text>
  <text class="isolate-the-variable-desc isolate-the-variable-row isolate-the-variable-r4" x="526" y="318">Search halved the other way</text>
  <text class="isolate-the-variable-sub" x="30" y="372">Either outcome is progress. The only expensive move is editing code before running the command.</text>
</svg>
