<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Learn five classes and every code finds its place.">
  <title>The first digit is the whole diagnosis</title>
  <style>
    .status-first-digit-bg   { fill: #f8fafc; }
    .status-first-digit-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .status-first-digit-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .status-first-digit-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .status-first-digit-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .status-first-digit-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .status-first-digit-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .status-first-digit-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .status-first-digit-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .status-first-digit-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .status-first-digit-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .status-first-digit-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .status-first-digit-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .status-first-digit-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .status-first-digit-stage { opacity: 1; }

    .status-first-digit-s0 { animation-delay: 0.00s; }
    .status-first-digit-e0 { animation-delay: 0.00s; }
    .status-first-digit-s1 { animation-delay: 1.33s; }
    .status-first-digit-e1 { animation-delay: 1.33s; }
    .status-first-digit-s2 { animation-delay: 2.67s; }
    .status-first-digit-e2 { animation-delay: 2.67s; }
    .status-first-digit-s3 { animation-delay: 4.00s; }
    .status-first-digit-e3 { animation-delay: 4.00s; }
    .status-first-digit-s4 { animation-delay: 5.33s; }
    .status-first-digit-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .status-first-digit-conn  { animation: status-first-digit-trace 8s ease-in-out infinite; }
      .status-first-digit-stage { animation: status-first-digit-arrive 8s ease-in-out infinite; }
    }
    @keyframes status-first-digit-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes status-first-digit-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .status-first-digit-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .status-first-digit-stage { animation: status-first-digit-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes status-first-digit-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="status-first-digit-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="status-first-digit-bg" width="980" height="322"/>
  <text class="status-first-digit-h1"  x="30" y="40">The first digit is the whole diagnosis</text>
  <text class="status-first-digit-sub" x="30" y="64">Learn five classes and every code finds its place.</text>
  <g class="status-first-digit-stage status-first-digit-s0">
    <rect class="status-first-digit-good" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="status-first-digit-step" x="44" y="142">01</text>
    <text class="status-first-digit-name" x="70" y="142">2xx</text>
    <text class="status-first-digit-desc" x="44" y="166">It worked. Read the body.</text>
    <text class="status-first-digit-edge" x="44" y="242">success</text>
  </g>
  <line class="status-first-digit-line status-first-digit-conn status-first-digit-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#status-first-digit-tip)"/>
  <g class="status-first-digit-stage status-first-digit-s1">
    <rect class="status-first-digit-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="status-first-digit-step" x="233" y="142">02</text>
    <text class="status-first-digit-name" x="259" y="142">3xx</text>
    <text class="status-first-digit-desc" x="233" y="166">It moved. Follow the</text>
    <text class="status-first-digit-desc" x="233" y="182">Location header; your</text>
    <text class="status-first-digit-desc" x="233" y="198">client usually does.</text>
    <text class="status-first-digit-edge" x="233" y="242">elsewhere</text>
  </g>
  <line class="status-first-digit-line status-first-digit-conn status-first-digit-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#status-first-digit-tip)"/>
  <g class="status-first-digit-stage status-first-digit-s2">
    <rect class="status-first-digit-warn" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="status-first-digit-step" x="422" y="142">03</text>
    <text class="status-first-digit-name" x="448" y="142">4xx</text>
    <text class="status-first-digit-desc" x="422" y="166">You were wrong. Fix the</text>
    <text class="status-first-digit-desc" x="422" y="182">request; retrying</text>
    <text class="status-first-digit-desc" x="422" y="198">unchanged is pointless.</text>
    <text class="status-first-digit-edge" x="422" y="242">your fault</text>
  </g>
  <line class="status-first-digit-line status-first-digit-conn status-first-digit-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#status-first-digit-tip)"/>
  <g class="status-first-digit-stage status-first-digit-s3">
    <rect class="status-first-digit-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="status-first-digit-step" x="611" y="142">04</text>
    <text class="status-first-digit-name" x="637" y="142">5xx</text>
    <text class="status-first-digit-desc" x="611" y="166">They were wrong. Retry</text>
    <text class="status-first-digit-desc" x="611" y="182">with backoff.</text>
    <text class="status-first-digit-edge" x="611" y="242">their fault</text>
  </g>
  <line class="status-first-digit-line status-first-digit-conn status-first-digit-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#status-first-digit-tip)"/>
  <g class="status-first-digit-stage status-first-digit-s4">
    <rect class="status-first-digit-box" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="status-first-digit-step" x="800" y="142">05</text>
    <text class="status-first-digit-name" x="826" y="142">1xx</text>
    <text class="status-first-digit-desc" x="800" y="166">Received, continue. You</text>
    <text class="status-first-digit-desc" x="800" y="182">will rarely handle these</text>
    <text class="status-first-digit-desc" x="800" y="198">yourself.</text>
    <text class="status-first-digit-edge" x="800" y="242">rare</text>
  </g>
  <text class="status-first-digit-sub" x="30" y="304">The 4xx versus 5xx line is the single most useful thing to internalise: it decides whether the fix is in your code or in your patience.</text>
</svg>
