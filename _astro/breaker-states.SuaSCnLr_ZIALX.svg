<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what closes it again.">
  <title>Circuit breaker states</title>
  <style>
    .breaker-states-bg   { fill: #f8fafc; }
    .breaker-states-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .breaker-states-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .breaker-states-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .breaker-states-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .breaker-states-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .breaker-states-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .breaker-states-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .breaker-states-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .breaker-states-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .breaker-states-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .breaker-states-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .breaker-states-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .breaker-states-row { opacity: 1; }
    .breaker-states-r0 { animation-delay: 0.00s; }
    .breaker-states-r1 { animation-delay: 0.45s; }
    .breaker-states-r2 { animation-delay: 0.90s; }
    .breaker-states-r3 { animation-delay: 1.35s; }
    .breaker-states-r4 { animation-delay: 1.80s; }
    .breaker-states-row { animation: breaker-states-reveal 7.3s ease-in-out infinite; }
    @keyframes breaker-states-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="breaker-states-bg" width="980" height="390"/>
  <text class="breaker-states-h1"  x="30" y="40">Circuit breaker states</text>
  <text class="breaker-states-sub" x="30" y="64">And what closes it again.</text>
  <rect class="breaker-states-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="breaker-states-name" x="46" y="122">Closed</text>
  <text class="breaker-states-desc" x="46" y="142">Normal.</text>
  <text class="breaker-states-desc breaker-states-row breaker-states-r0" x="46" y="182">All traffic to the primary provider</text>
  <text class="breaker-states-desc breaker-states-row breaker-states-r1" x="46" y="216">Rolling failure rate measured</text>
  <text class="breaker-states-desc breaker-states-row breaker-states-r2" x="46" y="250">Successes reset the counter</text>
  <text class="breaker-states-desc breaker-states-row breaker-states-r3" x="46" y="284">Latency and errors within budget</text>
  <text class="breaker-states-desc breaker-states-row breaker-states-r4" x="46" y="318">Nothing to decide</text>
  <rect class="breaker-states-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="breaker-states-name" x="526" y="122">Open, then half-open</text>
  <text class="breaker-states-desc" x="526" y="142">Tripped, then probing.</text>
  <text class="breaker-states-desc breaker-states-row breaker-states-r0" x="526" y="182">Threshold breached: fail fast</text>
  <text class="breaker-states-desc breaker-states-row breaker-states-r1" x="526" y="216">Traffic falls back immediately</text>
  <text class="breaker-states-desc breaker-states-row breaker-states-r2" x="526" y="250">No waiting on a dead upstream</text>
  <text class="breaker-states-desc breaker-states-row breaker-states-r3" x="526" y="284">After a cooldown, one probe</text>
  <text class="breaker-states-desc breaker-states-row breaker-states-r4" x="526" y="318">Success closes it; failure re-opens</text>
  <text class="breaker-states-sub" x="30" y="372">Failing fast is the counter-intuitive half: continuing to send requests to a failing provider converts one outage into a queue of timeouts across every client waiting behind them.</text>
</svg>
