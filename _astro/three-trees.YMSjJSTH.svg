<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Every undo command is a rule about these.">
  <title>Three places, and one pointer</title>
  <style>
    .three-trees-bg   { fill: #f8fafc; }
    .three-trees-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-trees-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-trees-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-trees-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-trees-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-trees-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-trees-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-trees-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-trees-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-trees-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-trees-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-trees-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .three-trees-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .three-trees-stage { opacity: 1; }

    .three-trees-s0 { animation-delay: 0.00s; }
    .three-trees-e0 { animation-delay: 0.00s; }
    .three-trees-s1 { animation-delay: 1.50s; }
    .three-trees-e1 { animation-delay: 1.50s; }
    .three-trees-s2 { animation-delay: 3.00s; }
    .three-trees-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .three-trees-conn  { animation: three-trees-trace 6s ease-in-out infinite; }
      .three-trees-stage { animation: three-trees-arrive 6s ease-in-out infinite; }
    }
    @keyframes three-trees-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes three-trees-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .three-trees-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .three-trees-stage { animation: three-trees-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes three-trees-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="three-trees-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="three-trees-bg" width="980" height="322"/>
  <text class="three-trees-h1"  x="30" y="40">Three places, and one pointer</text>
  <text class="three-trees-sub" x="30" y="64">Every undo command is a rule about these.</text>
  <g class="three-trees-stage three-trees-s0">
    <rect class="three-trees-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="three-trees-step" x="44" y="142">01</text>
    <text class="three-trees-name" x="70" y="142">The working tree</text>
    <text class="three-trees-desc" x="44" y="166">The real files on disk. What your editor</text>
    <text class="three-trees-desc" x="44" y="182">opens and changes.</text>
    <text class="three-trees-edge" x="44" y="242">on disk</text>
  </g>
  <line class="three-trees-line three-trees-conn three-trees-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#three-trees-tip)"/>
  <g class="three-trees-stage three-trees-s1">
    <rect class="three-trees-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="three-trees-step" x="359" y="142">02</text>
    <text class="three-trees-name" x="385" y="142">The index</text>
    <text class="three-trees-desc" x="359" y="166">A proposed next snapshot. git add copies a</text>
    <text class="three-trees-desc" x="359" y="182">file's current state into it.</text>
    <text class="three-trees-edge" x="359" y="242">staged</text>
  </g>
  <line class="three-trees-line three-trees-conn three-trees-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#three-trees-tip)"/>
  <g class="three-trees-stage three-trees-s2">
    <rect class="three-trees-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="three-trees-step" x="674" y="142">03</text>
    <text class="three-trees-name" x="700" y="142">HEAD</text>
    <text class="three-trees-desc" x="674" y="166">A pointer to your most recent commit.</text>
    <text class="three-trees-desc" x="674" y="182">Committing freezes the index and advances it.</text>
    <text class="three-trees-edge" x="674" y="242">committed</text>
  </g>
  <text class="three-trees-sub" x="30" y="304">git add moves a change one way. Every undo command moves something the other way, or slides HEAD to a different commit. There is nothing else going on.</text>
</svg>
