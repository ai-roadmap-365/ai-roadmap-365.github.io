<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>What makes a pipeline reliable</title>
  <style>
    .pipeline-reliability-bg   { fill: #f8fafc; }
    .pipeline-reliability-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-reliability-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-reliability-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-reliability-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-reliability-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-reliability-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pipeline-reliability-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pipeline-reliability-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pipeline-reliability-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pipeline-reliability-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pipeline-reliability-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pipeline-reliability-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pipeline-reliability-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pipeline-reliability-stage { opacity: 1; }

    .pipeline-reliability-s0 { animation-delay: 0.00s; }
    .pipeline-reliability-e0 { animation-delay: 0.00s; }
    .pipeline-reliability-s1 { animation-delay: 1.28s; }
    .pipeline-reliability-e1 { animation-delay: 1.28s; }
    .pipeline-reliability-s2 { animation-delay: 2.56s; }
    .pipeline-reliability-e2 { animation-delay: 2.56s; }
    .pipeline-reliability-s3 { animation-delay: 3.84s; }
    .pipeline-reliability-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .pipeline-reliability-conn  { animation: pipeline-reliability-trace 6.4s ease-in-out infinite; }
      .pipeline-reliability-stage { animation: pipeline-reliability-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes pipeline-reliability-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pipeline-reliability-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pipeline-reliability-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pipeline-reliability-stage { animation: pipeline-reliability-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pipeline-reliability-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pipeline-reliability-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pipeline-reliability-bg" width="980" height="322"/>
  <text class="pipeline-reliability-h1"  x="30" y="40">What makes a pipeline reliable</text>
  <text class="pipeline-reliability-sub" x="30" y="64">Four properties.</text>
  <g class="pipeline-reliability-stage pipeline-reliability-s0">
    <rect class="pipeline-reliability-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="pipeline-reliability-step" x="44" y="142">01</text>
    <text class="pipeline-reliability-name" x="70" y="142">Idempotent, so a rerun is safe</text>
    <text class="pipeline-reliability-desc" x="44" y="166">Which every pipeline eventually</text>
    <text class="pipeline-reliability-desc" x="44" y="182">needs.</text>
  </g>
  <line class="pipeline-reliability-line pipeline-reliability-conn pipeline-reliability-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#pipeline-reliability-tip)"/>
  <g class="pipeline-reliability-stage pipeline-reliability-s1">
    <rect class="pipeline-reliability-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="pipeline-reliability-step" x="280" y="142">02</text>
    <text class="pipeline-reliability-name" x="306" y="142">Checkpointed, so a rerun resumes</text>
    <text class="pipeline-reliability-desc" x="280" y="166">Rather than starting from</text>
    <text class="pipeline-reliability-desc" x="280" y="182">nothing.</text>
  </g>
  <line class="pipeline-reliability-line pipeline-reliability-conn pipeline-reliability-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#pipeline-reliability-tip)"/>
  <g class="pipeline-reliability-stage pipeline-reliability-s2">
    <rect class="pipeline-reliability-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="pipeline-reliability-step" x="516" y="142">03</text>
    <text class="pipeline-reliability-name" x="542" y="142">Observable, with counts logged at each stage</text>
    <text class="pipeline-reliability-desc" x="516" y="166">So a silent drop is visible.</text>
  </g>
  <line class="pipeline-reliability-line pipeline-reliability-conn pipeline-reliability-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#pipeline-reliability-tip)"/>
  <g class="pipeline-reliability-stage pipeline-reliability-s3">
    <rect class="pipeline-reliability-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="pipeline-reliability-step" x="752" y="142">04</text>
    <text class="pipeline-reliability-name" x="778" y="142">And explicit about failure: retry, or stop</text>
    <text class="pipeline-reliability-desc" x="752" y="166">Never continue with partial</text>
    <text class="pipeline-reliability-desc" x="752" y="182">data.</text>
  </g>
  <text class="pipeline-reliability-sub" x="30" y="304">Logging counts at each stage is the cheapest possible data quality check, because a stage that silently drops half its rows shows up immediately.</text>
</svg>
