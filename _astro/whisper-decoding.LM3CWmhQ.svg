<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>One model, several tasks</title>
  <style>
    .whisper-decoding-bg   { fill: #f8fafc; }
    .whisper-decoding-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .whisper-decoding-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .whisper-decoding-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .whisper-decoding-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .whisper-decoding-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .whisper-decoding-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .whisper-decoding-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .whisper-decoding-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .whisper-decoding-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .whisper-decoding-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .whisper-decoding-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .whisper-decoding-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .whisper-decoding-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .whisper-decoding-stage { opacity: 1; }

    .whisper-decoding-s0 { animation-delay: 0.00s; }
    .whisper-decoding-e0 { animation-delay: 0.00s; }
    .whisper-decoding-s1 { animation-delay: 1.28s; }
    .whisper-decoding-e1 { animation-delay: 1.28s; }
    .whisper-decoding-s2 { animation-delay: 2.56s; }
    .whisper-decoding-e2 { animation-delay: 2.56s; }
    .whisper-decoding-s3 { animation-delay: 3.84s; }
    .whisper-decoding-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .whisper-decoding-conn  { animation: whisper-decoding-trace 6.4s ease-in-out infinite; }
      .whisper-decoding-stage { animation: whisper-decoding-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes whisper-decoding-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes whisper-decoding-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .whisper-decoding-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .whisper-decoding-stage { animation: whisper-decoding-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes whisper-decoding-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="whisper-decoding-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="whisper-decoding-bg" width="980" height="322"/>
  <text class="whisper-decoding-h1"  x="30" y="40">One model, several tasks</text>
  <text class="whisper-decoding-sub" x="30" y="64">Four steps.</text>
  <g class="whisper-decoding-stage whisper-decoding-s0">
    <rect class="whisper-decoding-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="whisper-decoding-step" x="44" y="142">01</text>
    <text class="whisper-decoding-name" x="70" y="142">One encoder reads the audio</text>
    <text class="whisper-decoding-desc" x="44" y="166">Regardless of what is wanted</text>
    <text class="whisper-decoding-desc" x="44" y="182">from it.</text>
  </g>
  <line class="whisper-decoding-line whisper-decoding-conn whisper-decoding-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#whisper-decoding-tip)"/>
  <g class="whisper-decoding-stage whisper-decoding-s1">
    <rect class="whisper-decoding-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="whisper-decoding-step" x="280" y="142">02</text>
    <text class="whisper-decoding-name" x="306" y="142">Special tokens then select the task</text>
    <text class="whisper-decoding-desc" x="280" y="166">Language, transcribe or</text>
    <text class="whisper-decoding-desc" x="280" y="182">translate, timestamps or not.</text>
  </g>
  <line class="whisper-decoding-line whisper-decoding-conn whisper-decoding-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#whisper-decoding-tip)"/>
  <g class="whisper-decoding-stage whisper-decoding-s2">
    <rect class="whisper-decoding-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="whisper-decoding-step" x="516" y="142">03</text>
    <text class="whisper-decoding-name" x="542" y="142">And the decoder behaves accordingly</text>
    <text class="whisper-decoding-desc" x="516" y="166">Producing text in the requested</text>
    <text class="whisper-decoding-desc" x="516" y="182">form.</text>
  </g>
  <line class="whisper-decoding-line whisper-decoding-conn whisper-decoding-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#whisper-decoding-tip)"/>
  <g class="whisper-decoding-stage whisper-decoding-s3">
    <rect class="whisper-decoding-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="whisper-decoding-step" x="752" y="142">04</text>
    <text class="whisper-decoding-name" x="778" y="142">So one model replaces a pipeline of several</text>
    <text class="whisper-decoding-desc" x="752" y="166">Which is where much of the</text>
    <text class="whisper-decoding-desc" x="752" y="182">robustness came from.</text>
    <text class="whisper-decoding-edge" x="752" y="242">one model</text>
  </g>
  <text class="whisper-decoding-sub" x="30" y="304">Training the tasks jointly rather than separately is what produced the robustness: each task regularises the others, and the shared encoder sees far more varied audio.</text>
</svg>
