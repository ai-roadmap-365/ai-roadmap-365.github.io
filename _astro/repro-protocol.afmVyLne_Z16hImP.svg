<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Six stages, in order.">
  <title>Reproducing a paper</title>
  <style>
    .repro-protocol-bg   { fill: #f8fafc; }
    .repro-protocol-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-protocol-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-protocol-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-protocol-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-protocol-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-protocol-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .repro-protocol-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .repro-protocol-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .repro-protocol-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .repro-protocol-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .repro-protocol-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .repro-protocol-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .repro-protocol-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .repro-protocol-stage { opacity: 1; }

    .repro-protocol-s0 { animation-delay: 0.00s; }
    .repro-protocol-e0 { animation-delay: 0.00s; }
    .repro-protocol-s1 { animation-delay: 1.37s; }
    .repro-protocol-e1 { animation-delay: 1.37s; }
    .repro-protocol-s2 { animation-delay: 2.74s; }
    .repro-protocol-e2 { animation-delay: 2.74s; }
    .repro-protocol-s3 { animation-delay: 4.11s; }
    .repro-protocol-e3 { animation-delay: 4.11s; }
    .repro-protocol-s4 { animation-delay: 5.49s; }
    .repro-protocol-e4 { animation-delay: 5.49s; }
    .repro-protocol-s5 { animation-delay: 6.86s; }
    .repro-protocol-e5 { animation-delay: 6.86s; }
    @media (prefers-reduced-motion: no-preference) {
      .repro-protocol-conn  { animation: repro-protocol-trace 9.600000000000001s ease-in-out infinite; }
      .repro-protocol-stage { animation: repro-protocol-arrive 9.600000000000001s ease-in-out infinite; }
    }
    @keyframes repro-protocol-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes repro-protocol-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .repro-protocol-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .repro-protocol-stage { animation: repro-protocol-settle 9.600000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes repro-protocol-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="repro-protocol-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="repro-protocol-bg" width="980" height="322"/>
  <text class="repro-protocol-h1"  x="30" y="40">Reproducing a paper</text>
  <text class="repro-protocol-sub" x="30" y="64">Six stages, in order.</text>
  <g class="repro-protocol-stage repro-protocol-s0">
    <rect class="repro-protocol-box" x="30" y="118" width="131" height="104" rx="10"/>
    <text class="repro-protocol-step" x="44" y="142">01</text>
    <text class="repro-protocol-name" x="70" y="142">Read for what is not stated</text>
    <text class="repro-protocol-desc" x="44" y="166">Initialisation,</text>
    <text class="repro-protocol-desc" x="44" y="182">schedule,</text>
    <text class="repro-protocol-desc" x="44" y="198">preprocessing. The</text>
  </g>
  <line class="repro-protocol-line repro-protocol-conn repro-protocol-e0" x1="163" y1="170" x2="185" y2="170" marker-end="url(#repro-protocol-tip)"/>
  <g class="repro-protocol-stage repro-protocol-s1">
    <rect class="repro-protocol-box" x="187" y="118" width="131" height="104" rx="10"/>
    <text class="repro-protocol-step" x="201" y="142">02</text>
    <text class="repro-protocol-name" x="227" y="142">Get the data exactly</text>
    <text class="repro-protocol-desc" x="201" y="166">Same version, same</text>
    <text class="repro-protocol-desc" x="201" y="182">split, same</text>
    <text class="repro-protocol-desc" x="201" y="198">preprocessing.</text>
  </g>
  <line class="repro-protocol-line repro-protocol-conn repro-protocol-e1" x1="320" y1="170" x2="342" y2="170" marker-end="url(#repro-protocol-tip)"/>
  <g class="repro-protocol-stage repro-protocol-s2">
    <rect class="repro-protocol-box" x="344" y="118" width="131" height="104" rx="10"/>
    <text class="repro-protocol-step" x="358" y="142">03</text>
    <text class="repro-protocol-name" x="384" y="142">Implement the smallest complete version</text>
    <text class="repro-protocol-desc" x="358" y="166">Before any</text>
    <text class="repro-protocol-desc" x="358" y="182">optimisation or</text>
    <text class="repro-protocol-desc" x="358" y="198">scaling.</text>
  </g>
  <line class="repro-protocol-line repro-protocol-conn repro-protocol-e2" x1="477" y1="170" x2="499" y2="170" marker-end="url(#repro-protocol-tip)"/>
  <g class="repro-protocol-stage repro-protocol-s3">
    <rect class="repro-protocol-good" x="501" y="118" width="131" height="104" rx="10"/>
    <text class="repro-protocol-step" x="515" y="142">04</text>
    <text class="repro-protocol-name" x="541" y="142">Overfit a single batch</text>
    <text class="repro-protocol-desc" x="515" y="166">If loss does not</text>
    <text class="repro-protocol-desc" x="515" y="182">reach zero,</text>
    <text class="repro-protocol-desc" x="515" y="198">something is wrong.</text>
  </g>
  <line class="repro-protocol-line repro-protocol-conn repro-protocol-e3" x1="634" y1="170" x2="656" y2="170" marker-end="url(#repro-protocol-tip)"/>
  <g class="repro-protocol-stage repro-protocol-s4">
    <rect class="repro-protocol-box" x="658" y="118" width="131" height="104" rx="10"/>
    <text class="repro-protocol-step" x="672" y="142">05</text>
    <text class="repro-protocol-name" x="698" y="142">Then run at full scale</text>
    <text class="repro-protocol-desc" x="672" y="166">With everything</text>
    <text class="repro-protocol-desc" x="672" y="182">tracked from the</text>
    <text class="repro-protocol-desc" x="672" y="198">first step.</text>
  </g>
  <line class="repro-protocol-line repro-protocol-conn repro-protocol-e4" x1="791" y1="170" x2="813" y2="170" marker-end="url(#repro-protocol-tip)"/>
  <g class="repro-protocol-stage repro-protocol-s5">
    <rect class="repro-protocol-box" x="815" y="118" width="131" height="104" rx="10"/>
    <text class="repro-protocol-step" x="829" y="142">06</text>
    <text class="repro-protocol-name" x="855" y="142">Compare, and account for every difference</text>
    <text class="repro-protocol-desc" x="829" y="166">A discrepancy</text>
    <text class="repro-protocol-desc" x="829" y="182">explained is the</text>
    <text class="repro-protocol-desc" x="829" y="198">actual finding.</text>
    <text class="repro-protocol-edge" x="829" y="242">the point</text>
  </g>
  <text class="repro-protocol-sub" x="30" y="304">The single-batch check is disproportionately valuable: a model that cannot memorise eight examples has a bug, and finding it there costs a minute rather than a week.</text>
</svg>
