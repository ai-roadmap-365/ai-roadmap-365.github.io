<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Sending the same body to each does two different things.">
  <title>PUT replaces. PATCH merges.</title>
  <style>
    .put-versus-patch-bg   { fill: #f8fafc; }
    .put-versus-patch-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .put-versus-patch-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .put-versus-patch-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .put-versus-patch-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .put-versus-patch-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .put-versus-patch-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .put-versus-patch-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .put-versus-patch-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .put-versus-patch-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .put-versus-patch-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .put-versus-patch-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .put-versus-patch-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .put-versus-patch-row { opacity: 1; }
    .put-versus-patch-r0 { animation-delay: 0.00s; }
    .put-versus-patch-r1 { animation-delay: 0.45s; }
    .put-versus-patch-r2 { animation-delay: 0.90s; }
    .put-versus-patch-r3 { animation-delay: 1.35s; }
    .put-versus-patch-r4 { animation-delay: 1.80s; }
    .put-versus-patch-row { animation: put-versus-patch-reveal 7.3s ease-in-out infinite; }
    @keyframes put-versus-patch-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="put-versus-patch-bg" width="980" height="390"/>
  <text class="put-versus-patch-h1"  x="30" y="40">PUT replaces. PATCH merges.</text>
  <text class="put-versus-patch-sub" x="30" y="64">Sending the same body to each does two different things.</text>
  <rect class="put-versus-patch-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="put-versus-patch-name" x="46" y="122">PUT {"email": "new@x.org"}</text>
  <text class="put-versus-patch-desc" x="46" y="142">Make the resource be exactly this.</text>
  <text class="put-versus-patch-desc put-versus-patch-row put-versus-patch-r0" x="46" y="182">The whole resource is replaced</text>
  <text class="put-versus-patch-desc put-versus-patch-row put-versus-patch-r1" x="46" y="216">Omitted fields are cleared</text>
  <text class="put-versus-patch-desc put-versus-patch-row put-versus-patch-r2" x="46" y="250">name and role are now empty</text>
  <text class="put-versus-patch-desc put-versus-patch-row put-versus-patch-r3" x="46" y="284">Idempotent — repeating changes nothing further</text>
  <text class="put-versus-patch-desc put-versus-patch-row put-versus-patch-r4" x="46" y="318">Correct when you hold the complete version</text>
  <rect class="put-versus-patch-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="put-versus-patch-name" x="526" y="122">PATCH {"email": "new@x.org"}</text>
  <text class="put-versus-patch-desc" x="526" y="142">Change this, leave the rest.</text>
  <text class="put-versus-patch-desc put-versus-patch-row put-versus-patch-r0" x="526" y="182">Only the named fields change</text>
  <text class="put-versus-patch-desc put-versus-patch-row put-versus-patch-r1" x="526" y="216">Omitted fields are untouched</text>
  <text class="put-versus-patch-desc put-versus-patch-row put-versus-patch-r2" x="526" y="250">name and role survive</text>
  <text class="put-versus-patch-desc put-versus-patch-row put-versus-patch-r3" x="526" y="284">Usually NOT idempotent, if the change is relative</text>
  <text class="put-versus-patch-desc put-versus-patch-row put-versus-patch-r4" x="526" y="318">Correct when changing one attribute</text>
  <text class="put-versus-patch-sub" x="30" y="372">The cleared-fields bug is quiet: the request succeeds, the status is 200, and you find out when someone notices their name is missing.</text>
</svg>
