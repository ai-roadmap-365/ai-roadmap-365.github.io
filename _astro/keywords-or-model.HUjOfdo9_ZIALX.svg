<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Where the lexicon fails.">
  <title>Keyword matching, or a model</title>
  <style>
    .keywords-or-model-bg   { fill: #f8fafc; }
    .keywords-or-model-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .keywords-or-model-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .keywords-or-model-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .keywords-or-model-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .keywords-or-model-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .keywords-or-model-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .keywords-or-model-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .keywords-or-model-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .keywords-or-model-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .keywords-or-model-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .keywords-or-model-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .keywords-or-model-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .keywords-or-model-row { opacity: 1; }
    .keywords-or-model-r0 { animation-delay: 0.00s; }
    .keywords-or-model-r1 { animation-delay: 0.45s; }
    .keywords-or-model-r2 { animation-delay: 0.90s; }
    .keywords-or-model-r3 { animation-delay: 1.35s; }
    .keywords-or-model-r4 { animation-delay: 1.80s; }
    .keywords-or-model-row { animation: keywords-or-model-reveal 7.3s ease-in-out infinite; }
    @keyframes keywords-or-model-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="keywords-or-model-bg" width="980" height="390"/>
  <text class="keywords-or-model-h1"  x="30" y="40">Keyword matching, or a model</text>
  <text class="keywords-or-model-sub" x="30" y="64">Where the lexicon fails.</text>
  <rect class="keywords-or-model-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="keywords-or-model-name" x="46" y="122">A sentiment lexicon</text>
  <text class="keywords-or-model-desc" x="46" y="142">Words with scores.</text>
  <text class="keywords-or-model-desc keywords-or-model-row keywords-or-model-r0" x="46" y="182">"Great" is positive, "delay" negative</text>
  <text class="keywords-or-model-desc keywords-or-model-row keywords-or-model-r1" x="46" y="216">Fast, and fully interpretable</text>
  <text class="keywords-or-model-desc keywords-or-model-row keywords-or-model-r2" x="46" y="250">"Oh great, another delay" scores positive</text>
  <text class="keywords-or-model-desc keywords-or-model-row keywords-or-model-r3" x="46" y="284">Double negatives invert wrongly</text>
  <text class="keywords-or-model-desc keywords-or-model-row keywords-or-model-r4" x="46" y="318">Qualifiers ignored entirely</text>
  <rect class="keywords-or-model-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="keywords-or-model-name" x="526" y="122">A trained classifier</text>
  <text class="keywords-or-model-desc" x="526" y="142">Learned from examples.</text>
  <text class="keywords-or-model-desc keywords-or-model-row keywords-or-model-r0" x="526" y="182">Sarcasm learnable from labelled examples</text>
  <text class="keywords-or-model-desc keywords-or-model-row keywords-or-model-r1" x="526" y="216">Negation handled by context</text>
  <text class="keywords-or-model-desc keywords-or-model-row keywords-or-model-r2" x="526" y="250">Qualifiers weighted appropriately</text>
  <text class="keywords-or-model-desc keywords-or-model-row keywords-or-model-r3" x="526" y="284">Needs labelled data</text>
  <text class="keywords-or-model-desc keywords-or-model-row keywords-or-model-r4" x="526" y="318">And is harder to explain</text>
  <text class="keywords-or-model-sub" x="30" y="372">The sarcasm example is not contrived: it is a common shape in customer feedback, and it is precisely the case where a lexicon confidently produces the opposite of the truth.</text>
</svg>
