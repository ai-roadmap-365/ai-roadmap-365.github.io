<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="What survives fifty people.">
  <title>A whispering game down a line</title>
  <style>
    .telephone-bg   { fill: #f8fafc; }
    .telephone-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .telephone-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .telephone-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .telephone-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .telephone-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .telephone-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .telephone-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .telephone-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .telephone-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .telephone-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .telephone-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .telephone-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .telephone-row { opacity: 1; }
    .telephone-r0 { animation-delay: 0.00s; }
    .telephone-r1 { animation-delay: 0.45s; }
    .telephone-r2 { animation-delay: 0.90s; }
    .telephone-r3 { animation-delay: 1.35s; }
    .telephone-r4 { animation-delay: 1.80s; }
    .telephone-row { animation: telephone-reveal 7.3s ease-in-out infinite; }
    @keyframes telephone-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="telephone-bg" width="980" height="390"/>
  <text class="telephone-h1"  x="30" y="40">A whispering game down a line</text>
  <text class="telephone-sub" x="30" y="64">What survives fifty people.</text>
  <rect class="telephone-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="telephone-name" x="46" y="122">A short line</text>
  <text class="telephone-desc" x="46" y="142">The message survives.</text>
  <text class="telephone-desc telephone-row telephone-r0" x="46" y="182">Five people, one message</text>
  <text class="telephone-desc telephone-row telephone-r1" x="46" y="216">Small distortions accumulate slowly</text>
  <text class="telephone-desc telephone-row telephone-r2" x="46" y="250">The end is recognisably the start</text>
  <text class="telephone-desc telephone-row telephone-r3" x="46" y="284">Details survive</text>
  <text class="telephone-desc telephone-row telephone-r4" x="46" y="318">This is a short sequence</text>
  <rect class="telephone-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="telephone-name" x="526" y="122">Fifty people</text>
  <text class="telephone-desc" x="526" y="142">Nothing of the original.</text>
  <text class="telephone-desc telephone-row telephone-r0" x="526" y="182">Each pass loses a little</text>
  <text class="telephone-desc telephone-row telephone-r1" x="526" y="216">Losses compound multiplicatively</text>
  <text class="telephone-desc telephone-row telephone-r2" x="526" y="250">The end bears no relation to the start</text>
  <text class="telephone-desc telephone-row telephone-r3" x="526" y="284">Early details gone entirely</text>
  <text class="telephone-desc telephone-row telephone-r4" x="526" y="318">This is vanishing memory</text>
  <text class="telephone-sub" x="30" y="372">The compounding is multiplicative rather than additive in both cases, which is why degradation is not gradual: it is imperceptible for ten steps and total by fifty.</text>
</svg>
