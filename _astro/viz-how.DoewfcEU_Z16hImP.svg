<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>How a high-dimensional surface is visualised</title>
  <style>
    .viz-how-bg   { fill: #f8fafc; }
    .viz-how-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz-how-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz-how-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz-how-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz-how-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz-how-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .viz-how-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .viz-how-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .viz-how-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .viz-how-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .viz-how-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .viz-how-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .viz-how-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .viz-how-stage { opacity: 1; }

    .viz-how-s0 { animation-delay: 0.00s; }
    .viz-how-e0 { animation-delay: 0.00s; }
    .viz-how-s1 { animation-delay: 1.28s; }
    .viz-how-e1 { animation-delay: 1.28s; }
    .viz-how-s2 { animation-delay: 2.56s; }
    .viz-how-e2 { animation-delay: 2.56s; }
    .viz-how-s3 { animation-delay: 3.84s; }
    .viz-how-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .viz-how-conn  { animation: viz-how-trace 6.4s ease-in-out infinite; }
      .viz-how-stage { animation: viz-how-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes viz-how-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes viz-how-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .viz-how-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .viz-how-stage { animation: viz-how-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes viz-how-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="viz-how-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="viz-how-bg" width="980" height="322"/>
  <text class="viz-how-h1"  x="30" y="40">How a high-dimensional surface is visualised</text>
  <text class="viz-how-sub" x="30" y="64">Four steps.</text>
  <g class="viz-how-stage viz-how-s0">
    <rect class="viz-how-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="viz-how-step" x="44" y="142">01</text>
    <text class="viz-how-name" x="70" y="142">The real surface has as many dimensions as parameters</text>
    <text class="viz-how-desc" x="44" y="166">Which cannot be drawn.</text>
  </g>
  <line class="viz-how-line viz-how-conn viz-how-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#viz-how-tip)"/>
  <g class="viz-how-stage viz-how-s1">
    <rect class="viz-how-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="viz-how-step" x="280" y="142">02</text>
    <text class="viz-how-name" x="306" y="142">So two directions are chosen through the space</text>
    <text class="viz-how-desc" x="280" y="166">Random, or meaningful.</text>
  </g>
  <line class="viz-how-line viz-how-conn viz-how-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#viz-how-tip)"/>
  <g class="viz-how-stage viz-how-s2">
    <rect class="viz-how-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="viz-how-step" x="516" y="142">03</text>
    <text class="viz-how-name" x="542" y="142">And loss is evaluated on a grid in that plane</text>
    <text class="viz-how-desc" x="516" y="166">Producing a drawable surface.</text>
  </g>
  <line class="viz-how-line viz-how-conn viz-how-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#viz-how-tip)"/>
  <g class="viz-how-stage viz-how-s3">
    <rect class="viz-how-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="viz-how-step" x="752" y="142">04</text>
    <text class="viz-how-name" x="778" y="142">But the picture is a slice, not the whole</text>
    <text class="viz-how-desc" x="752" y="166">And can mislead badly.</text>
  </g>
  <text class="viz-how-sub" x="30" y="304">The slice caveat matters: a two-dimensional picture of a million-dimensional surface can show a smooth basin where the true landscape is nothing of the kind.</text>
</svg>
