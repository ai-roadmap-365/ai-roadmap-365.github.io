<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Dotfiles, then rules, then a standard.">
  <title>Three standardisations</title>
  <style>
    .config-lineage-bg   { fill: #f8fafc; }
    .config-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .config-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .config-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .config-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .config-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .config-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .config-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .config-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .config-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .config-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .config-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .config-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .config-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .config-lineage-stage { opacity: 1; }

    .config-lineage-s0 { animation-delay: 0.00s; }
    .config-lineage-e0 { animation-delay: 0.00s; }
    .config-lineage-s1 { animation-delay: 1.50s; }
    .config-lineage-e1 { animation-delay: 1.50s; }
    .config-lineage-s2 { animation-delay: 3.00s; }
    .config-lineage-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .config-lineage-conn  { animation: config-lineage-trace 6s ease-in-out infinite; }
      .config-lineage-stage { animation: config-lineage-arrive 6s ease-in-out infinite; }
    }
    @keyframes config-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes config-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .config-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .config-lineage-stage { animation: config-lineage-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes config-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="config-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="config-lineage-bg" width="980" height="322"/>
  <text class="config-lineage-h1"  x="30" y="40">Three standardisations</text>
  <text class="config-lineage-sub" x="30" y="64">Dotfiles, then rules, then a standard.</text>
  <g class="config-lineage-stage config-lineage-s0">
    <rect class="config-lineage-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="config-lineage-step" x="44" y="142">01</text>
    <text class="config-lineage-name" x="70" y="142">In-repo dotfiles</text>
    <text class="config-lineage-desc" x="44" y="166">.editorconfig and .eslintrc enforced</text>
    <text class="config-lineage-desc" x="44" y="182">conventions across a team.</text>
  </g>
  <line class="config-lineage-line config-lineage-conn config-lineage-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#config-lineage-tip)"/>
  <g class="config-lineage-stage config-lineage-s1">
    <rect class="config-lineage-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="config-lineage-step" x="359" y="142">02</text>
    <text class="config-lineage-name" x="385" y="142">Per-IDE rule files, 2023</text>
    <text class="config-lineage-desc" x="359" y="166">Custom system prompts per workspace.</text>
    <text class="config-lineage-desc" x="359" y="182">Proprietary, and per-tool.</text>
  </g>
  <line class="config-lineage-line config-lineage-conn config-lineage-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#config-lineage-tip)"/>
  <g class="config-lineage-stage config-lineage-s2">
    <rect class="config-lineage-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="config-lineage-step" x="674" y="142">03</text>
    <text class="config-lineage-name" x="700" y="142">AGENTS.md and skills, 2024</text>
    <text class="config-lineage-desc" x="674" y="166">Hierarchical resolution, MCP bridges,</text>
    <text class="config-lineage-desc" x="674" y="182">directory-based skills.</text>
  </g>
  <text class="config-lineage-sub" x="30" y="304">The middle step repeated the extension problem from Day 301: the capability was right and the format was per-tool, so teams maintained the same rules three times.</text>
</svg>
