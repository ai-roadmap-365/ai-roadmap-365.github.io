<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each one prevents a specific way automation goes wrong.">
  <title>Three properties that make a pipeline trustworthy</title>
  <style>
    .pipeline-properties-bg   { fill: #f8fafc; }
    .pipeline-properties-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-properties-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-properties-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-properties-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-properties-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-properties-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pipeline-properties-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pipeline-properties-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pipeline-properties-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pipeline-properties-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pipeline-properties-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pipeline-properties-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pipeline-properties-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pipeline-properties-stage { opacity: 1; }

    .pipeline-properties-s0 { animation-delay: 0.00s; }
    .pipeline-properties-e0 { animation-delay: 0.00s; }
    .pipeline-properties-s1 { animation-delay: 1.50s; }
    .pipeline-properties-e1 { animation-delay: 1.50s; }
    .pipeline-properties-s2 { animation-delay: 3.00s; }
    .pipeline-properties-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .pipeline-properties-conn  { animation: pipeline-properties-trace 6s ease-in-out infinite; }
      .pipeline-properties-stage { animation: pipeline-properties-arrive 6s ease-in-out infinite; }
    }
    @keyframes pipeline-properties-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pipeline-properties-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pipeline-properties-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pipeline-properties-stage { animation: pipeline-properties-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pipeline-properties-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pipeline-properties-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pipeline-properties-bg" width="980" height="322"/>
  <text class="pipeline-properties-h1"  x="30" y="40">Three properties that make a pipeline trustworthy</text>
  <text class="pipeline-properties-sub" x="30" y="64">Each one prevents a specific way automation goes wrong.</text>
  <g class="pipeline-properties-stage pipeline-properties-s0">
    <rect class="pipeline-properties-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="pipeline-properties-step" x="44" y="142">01</text>
    <text class="pipeline-properties-name" x="70" y="142">Fail fast</text>
    <text class="pipeline-properties-desc" x="44" y="166">Stop at the first failing stage. No later</text>
    <text class="pipeline-properties-desc" x="44" y="182">stage runs on a known-bad input.</text>
    <text class="pipeline-properties-edge" x="44" y="242">cheap</text>
  </g>
  <line class="pipeline-properties-line pipeline-properties-conn pipeline-properties-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#pipeline-properties-tip)"/>
  <g class="pipeline-properties-stage pipeline-properties-s1">
    <rect class="pipeline-properties-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="pipeline-properties-step" x="359" y="142">02</text>
    <text class="pipeline-properties-name" x="385" y="142">Idempotent</text>
    <text class="pipeline-properties-desc" x="359" y="166">Twice on the same input gives the same</text>
    <text class="pipeline-properties-desc" x="359" y="182">result. No state leaks between runs.</text>
    <text class="pipeline-properties-edge" x="359" y="242">safe to re-run</text>
  </g>
  <line class="pipeline-properties-line pipeline-properties-conn pipeline-properties-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#pipeline-properties-tip)"/>
  <g class="pipeline-properties-stage pipeline-properties-s2">
    <rect class="pipeline-properties-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="pipeline-properties-step" x="674" y="142">03</text>
    <text class="pipeline-properties-name" x="700" y="142">Reproducible</text>
    <text class="pipeline-properties-desc" x="674" y="166">Inputs and environment pinned, so the same</text>
    <text class="pipeline-properties-desc" x="674" y="182">commit gives the same output anywhere.</text>
    <text class="pipeline-properties-edge" x="674" y="242">trustworthy</text>
  </g>
  <text class="pipeline-properties-sub" x="30" y="304">Fail fast keeps it cheap, idempotency makes it safe to re-run after a blip, and reproducibility is what lets you trust the result at all. A pipeline missing any one of the three will eventually surprise you.</text>
</svg>
