<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" role="img" aria-labelledby="d137a-title d137a-desc">
  <title id="d137a-title">The anatomy of leakage: one boundary, three ways to cross it</title>
  <desc id="d137a-desc">A timeline of a single prediction. Everything left of the prediction moment is knowable; everything right of it is not. Three kinds of leakage are drawn as arrows carrying information back across that boundary into the feature table.</desc>
  <style>
    .d137a-bg { fill: #f8fafc; }
    .d137a-t { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a202c; }
    .d137a-h { font-size: 21px; font-weight: 700; }
    .d137a-sub { font-size: 15px; fill: #475569; }
    .d137a-lbl { font-size: 15px; }
    .d137a-lbl-b { font-size: 15px; font-weight: 700; }
    .d137a-small { font-size: 14px; fill: #334155; }
    .d137a-known { fill: #dcfce7; stroke: #15803d; stroke-width: 1.5; }
    .d137a-unknown { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.5; }
    .d137a-table { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 2; }
    .d137a-card { fill: #ffffff; stroke: #b91c1c; stroke-width: 2; }
    .d137a-axis { stroke: #1a202c; stroke-width: 2.5; }
    .d137a-boundary { stroke: #1d4ed8; stroke-width: 3.5; stroke-dasharray: 9 6; }
    .d137a-leak { stroke: #b91c1c; stroke-width: 2.5; fill: none; }
    .d137a-green { fill: #15803d; font-weight: 700; }
    .d137a-red { fill: #b91c1c; font-weight: 700; }
    .d137a-blue { fill: #1d4ed8; font-weight: 700; }
  </style>

  <rect class="d137a-bg" width="980" height="660" />

  <text class="d137a-t d137a-h" x="30" y="38">The anatomy of leakage: one boundary, three ways to cross it</text>
  <text class="d137a-t d137a-sub" x="30" y="62">Every feature must be computable from what exists on the left of the dashed line. Each red arrow is a way of quietly using the right.</text>

  <!-- knowable / not knowable bands -->
  <rect class="d137a-known" x="30" y="88" width="560" height="58" rx="8" />
  <text class="d137a-t d137a-lbl-b d137a-green" x="46" y="114">KNOWABLE AT PREDICTION TIME</text>
  <text class="d137a-t d137a-small" x="46" y="135">visits so far, minutes on site, the discount offered, the batch this sensor is running under today</text>

  <rect class="d137a-unknown" x="600" y="88" width="350" height="58" rx="8" />
  <text class="d137a-t d137a-lbl-b d137a-red" x="616" y="114">NOT KNOWABLE — THE FUTURE</text>
  <text class="d137a-t d137a-small" x="616" y="135">did they convert, when the invoice went out, next month's calibration</text>

  <!-- timeline -->
  <line class="d137a-axis" x1="30" y1="205" x2="950" y2="205" marker-end="url(#d137a-arrow)" />
  <text class="d137a-t d137a-small" x="30" y="232">the past</text>
  <text class="d137a-t d137a-small" x="880" y="232">later</text>

  <line class="d137a-boundary" x1="595" y1="160" x2="595" y2="470" />
  <text class="d137a-t d137a-lbl-b d137a-blue" x="470" y="182">PREDICTION TIME</text>
  <circle cx="595" cy="205" r="8" fill="#1d4ed8" />

  <!-- events on the timeline -->
  <circle cx="150" cy="205" r="6" fill="#15803d" />
  <text class="d137a-t d137a-small" x="112" y="196">first visit</text>
  <circle cx="330" cy="205" r="6" fill="#15803d" />
  <text class="d137a-t d137a-small" x="285" y="196">discount shown</text>
  <circle cx="720" cy="205" r="6" fill="#b91c1c" />
  <text class="d137a-t d137a-small" x="678" y="196">they convert</text>
  <circle cx="870" cy="205" r="6" fill="#b91c1c" />
  <text class="d137a-t d137a-small" x="818" y="196">invoice issued</text>

  <!-- the feature table -->
  <rect class="d137a-table" x="60" y="392" width="470" height="86" rx="10" />
  <text class="d137a-t d137a-lbl-b" x="80" y="420">THE FEATURE TABLE THE MODEL TRAINS ON</text>
  <text class="d137a-t d137a-small" x="80" y="444">Anything that reaches this box from the right of the line is a leak, however it got here,</text>
  <text class="d137a-t d137a-small" x="80" y="464">and it will show up as a score that looks better than the problem deserves.</text>

  <!-- the three leaks -->
  <path class="d137a-leak" d="M 866 214 C 866 262, 700 262, 560 300 C 460 326, 340 350, 296 388" marker-end="url(#d137a-arrowr)" />
  <path class="d137a-leak" d="M 700 512 C 600 512, 480 500, 380 484" marker-end="url(#d137a-arrowr)" />
  <path class="d137a-leak" d="M 716 214 C 716 250, 640 268, 596 300 C 540 336, 480 366, 452 388" marker-end="url(#d137a-arrowr)" />

  <rect class="d137a-card" x="600" y="258" width="350" height="70" rx="8" />
  <text class="d137a-t d137a-lbl-b d137a-red" x="616" y="282">1. TARGET LEAKAGE</text>
  <text class="d137a-t d137a-small" x="616" y="302">A column derived from the outcome. days_to_first_invoice</text>
  <text class="d137a-t d137a-small" x="616" y="320">is -1 until they convert. Measured here: 1.00 against 0.64.</text>

  <rect class="d137a-card" x="600" y="344" width="350" height="70" rx="8" />
  <text class="d137a-t d137a-lbl-b d137a-red" x="616" y="368">2. TRAIN/TEST CONTAMINATION</text>
  <text class="d137a-t d137a-small" x="616" y="388">A statistic fitted before the split. A group-mean imputer</text>
  <text class="d137a-t d137a-small" x="616" y="406">over all rows: 0.748 against 0.666, eight points of optimism.</text>

  <rect class="d137a-card" x="600" y="478" width="350" height="70" rx="8" />
  <text class="d137a-t d137a-lbl-b d137a-red" x="616" y="502">3. TEMPORAL LEAKAGE</text>
  <text class="d137a-t d137a-small" x="616" y="522">A value recorded after the moment, hidden by a random</text>
  <text class="d137a-t d137a-small" x="616" y="540">split. Random 0.88; time-ordered 0.07. Trust the second.</text>

  <!-- closing note -->
  <rect x="60" y="566" width="890" height="66" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5" />
  <text class="d137a-t d137a-small" x="80" y="590">The three cross the same boundary and hide in different places. The first is in the column list, the second is in the order of your</text>
  <text class="d137a-t d137a-small" x="80" y="610">code, and the third is in the split itself — which is why it survives code review most often, and why a random split can conceal it entirely.</text>

  <defs>
    <marker id="d137a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a202c" />
    </marker>
    <marker id="d137a-arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c" />
    </marker>
  </defs>
</svg>
