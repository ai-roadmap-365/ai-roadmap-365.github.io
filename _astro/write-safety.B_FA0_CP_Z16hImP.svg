<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Writing safely</title>
  <style>
    .write-safety-bg   { fill: #f8fafc; }
    .write-safety-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .write-safety-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .write-safety-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .write-safety-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .write-safety-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .write-safety-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .write-safety-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .write-safety-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .write-safety-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .write-safety-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .write-safety-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .write-safety-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .write-safety-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .write-safety-stage { opacity: 1; }

    .write-safety-s0 { animation-delay: 0.00s; }
    .write-safety-e0 { animation-delay: 0.00s; }
    .write-safety-s1 { animation-delay: 1.28s; }
    .write-safety-e1 { animation-delay: 1.28s; }
    .write-safety-s2 { animation-delay: 2.56s; }
    .write-safety-e2 { animation-delay: 2.56s; }
    .write-safety-s3 { animation-delay: 3.84s; }
    .write-safety-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .write-safety-conn  { animation: write-safety-trace 6.4s ease-in-out infinite; }
      .write-safety-stage { animation: write-safety-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes write-safety-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes write-safety-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .write-safety-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .write-safety-stage { animation: write-safety-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes write-safety-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="write-safety-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="write-safety-bg" width="980" height="322"/>
  <text class="write-safety-h1"  x="30" y="40">Writing safely</text>
  <text class="write-safety-sub" x="30" y="64">Four steps.</text>
  <g class="write-safety-stage write-safety-s0">
    <rect class="write-safety-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="write-safety-step" x="44" y="142">01</text>
    <text class="write-safety-name" x="70" y="142">Always pass values as parameters</text>
    <text class="write-safety-desc" x="44" y="166">Never by building the statement</text>
    <text class="write-safety-desc" x="44" y="182">as text.</text>
  </g>
  <line class="write-safety-line write-safety-conn write-safety-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#write-safety-tip)"/>
  <g class="write-safety-stage write-safety-s1">
    <rect class="write-safety-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="write-safety-step" x="280" y="142">02</text>
    <text class="write-safety-name" x="306" y="142">Wrap related changes in one transaction</text>
    <text class="write-safety-desc" x="280" y="166">So a failure leaves nothing</text>
    <text class="write-safety-desc" x="280" y="182">half-done.</text>
  </g>
  <line class="write-safety-line write-safety-conn write-safety-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#write-safety-tip)"/>
  <g class="write-safety-stage write-safety-s2">
    <rect class="write-safety-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="write-safety-step" x="516" y="142">03</text>
    <text class="write-safety-name" x="542" y="142">Check how many rows were affected</text>
    <text class="write-safety-desc" x="516" y="166">An update matching nothing is</text>
    <text class="write-safety-desc" x="516" y="182">usually a bug.</text>
  </g>
  <line class="write-safety-line write-safety-conn write-safety-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#write-safety-tip)"/>
  <g class="write-safety-stage write-safety-s3">
    <rect class="write-safety-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="write-safety-step" x="752" y="142">04</text>
    <text class="write-safety-name" x="778" y="142">And let constraints reject bad data</text>
    <text class="write-safety-desc" x="752" y="166">Rather than checking in the</text>
    <text class="write-safety-desc" x="752" y="182">application.</text>
  </g>
  <text class="write-safety-sub" x="30" y="304">Checking the affected row count is the cheapest bug detector available here: an update that silently matched zero rows looks exactly like success.</text>
</svg>
