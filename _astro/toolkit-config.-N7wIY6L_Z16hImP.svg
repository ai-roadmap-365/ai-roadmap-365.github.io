<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four sources, in order.">
  <title>Resolving configuration</title>
  <style>
    .toolkit-config-bg   { fill: #f8fafc; }
    .toolkit-config-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toolkit-config-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toolkit-config-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toolkit-config-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toolkit-config-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toolkit-config-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .toolkit-config-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .toolkit-config-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .toolkit-config-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .toolkit-config-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .toolkit-config-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .toolkit-config-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .toolkit-config-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .toolkit-config-stage { opacity: 1; }

    .toolkit-config-s0 { animation-delay: 0.00s; }
    .toolkit-config-e0 { animation-delay: 0.00s; }
    .toolkit-config-s1 { animation-delay: 1.28s; }
    .toolkit-config-e1 { animation-delay: 1.28s; }
    .toolkit-config-s2 { animation-delay: 2.56s; }
    .toolkit-config-e2 { animation-delay: 2.56s; }
    .toolkit-config-s3 { animation-delay: 3.84s; }
    .toolkit-config-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .toolkit-config-conn  { animation: toolkit-config-trace 6.4s ease-in-out infinite; }
      .toolkit-config-stage { animation: toolkit-config-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes toolkit-config-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes toolkit-config-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .toolkit-config-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .toolkit-config-stage { animation: toolkit-config-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes toolkit-config-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="toolkit-config-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="toolkit-config-bg" width="980" height="322"/>
  <text class="toolkit-config-h1"  x="30" y="40">Resolving configuration</text>
  <text class="toolkit-config-sub" x="30" y="64">Four sources, in order.</text>
  <g class="toolkit-config-stage toolkit-config-s0">
    <rect class="toolkit-config-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="toolkit-config-step" x="44" y="142">01</text>
    <text class="toolkit-config-name" x="70" y="142">Built-in defaults, so it runs with nothing set</text>
    <text class="toolkit-config-desc" x="44" y="166">Which is the baseline.</text>
  </g>
  <line class="toolkit-config-line toolkit-config-conn toolkit-config-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#toolkit-config-tip)"/>
  <g class="toolkit-config-stage toolkit-config-s1">
    <rect class="toolkit-config-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="toolkit-config-step" x="280" y="142">02</text>
    <text class="toolkit-config-name" x="306" y="142">Then a configuration file, for the project</text>
    <text class="toolkit-config-desc" x="280" y="166">Checked in, and shared.</text>
  </g>
  <line class="toolkit-config-line toolkit-config-conn toolkit-config-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#toolkit-config-tip)"/>
  <g class="toolkit-config-stage toolkit-config-s2">
    <rect class="toolkit-config-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="toolkit-config-step" x="516" y="142">03</text>
    <text class="toolkit-config-name" x="542" y="142">Then environment variables, for the machine</text>
    <text class="toolkit-config-desc" x="516" y="166">Where secrets belong.</text>
  </g>
  <line class="toolkit-config-line toolkit-config-conn toolkit-config-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#toolkit-config-tip)"/>
  <g class="toolkit-config-stage toolkit-config-s3">
    <rect class="toolkit-config-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="toolkit-config-step" x="752" y="142">04</text>
    <text class="toolkit-config-name" x="778" y="142">And finally flags, for this one invocation</text>
    <text class="toolkit-config-desc" x="752" y="166">Which win over everything.</text>
  </g>
  <text class="toolkit-config-sub" x="30" y="304">Secrets belonging in the environment rather than the file is the rule that keeps credentials out of version control, which is where they most often leak.</text>
</svg>
