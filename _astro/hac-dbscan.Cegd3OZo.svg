<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Structure or density.">
  <title>Two ways beyond k-means</title>
  <style>
    .hac-dbscan-bg   { fill: #f8fafc; }
    .hac-dbscan-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hac-dbscan-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hac-dbscan-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hac-dbscan-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hac-dbscan-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hac-dbscan-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hac-dbscan-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hac-dbscan-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hac-dbscan-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hac-dbscan-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hac-dbscan-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hac-dbscan-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hac-dbscan-row { opacity: 1; }
    .hac-dbscan-r0 { animation-delay: 0.00s; }
    .hac-dbscan-r1 { animation-delay: 0.45s; }
    .hac-dbscan-r2 { animation-delay: 0.90s; }
    .hac-dbscan-r3 { animation-delay: 1.35s; }
    .hac-dbscan-r4 { animation-delay: 1.80s; }
    .hac-dbscan-row { animation: hac-dbscan-reveal 7.3s ease-in-out infinite; }
    @keyframes hac-dbscan-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="hac-dbscan-bg" width="980" height="390"/>
  <text class="hac-dbscan-h1"  x="30" y="40">Two ways beyond k-means</text>
  <text class="hac-dbscan-sub" x="30" y="64">Structure or density.</text>
  <rect class="hac-dbscan-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="hac-dbscan-name" x="46" y="122">Hierarchical</text>
  <text class="hac-dbscan-desc" x="46" y="142">Builds a tree.</text>
  <text class="hac-dbscan-desc hac-dbscan-row hac-dbscan-r0" x="46" y="182">Merges the closest pair repeatedly</text>
  <text class="hac-dbscan-desc hac-dbscan-row hac-dbscan-r1" x="46" y="216">Produces a full hierarchy, not a partition</text>
  <text class="hac-dbscan-desc hac-dbscan-row hac-dbscan-r2" x="46" y="250">The group count is chosen afterwards</text>
  <text class="hac-dbscan-desc hac-dbscan-row hac-dbscan-r3" x="46" y="284">Every point is placed</text>
  <text class="hac-dbscan-desc hac-dbscan-row hac-dbscan-r4" x="46" y="318">Expensive: quadratic or worse</text>
  <rect class="hac-dbscan-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="hac-dbscan-name" x="526" y="122">Density-based</text>
  <text class="hac-dbscan-desc" x="526" y="142">Follows dense regions.</text>
  <text class="hac-dbscan-desc hac-dbscan-row hac-dbscan-r0" x="526" y="182">Grows clusters through dense neighbourhoods</text>
  <text class="hac-dbscan-desc hac-dbscan-row hac-dbscan-r1" x="526" y="216">Produces clusters of any shape</text>
  <text class="hac-dbscan-desc hac-dbscan-row hac-dbscan-r2" x="526" y="250">The count emerges from the data</text>
  <text class="hac-dbscan-desc hac-dbscan-row hac-dbscan-r3" x="526" y="284">Sparse points are labelled noise</text>
  <text class="hac-dbscan-desc hac-dbscan-row hac-dbscan-r4" x="526" y="318">Sensitive to its distance parameter</text>
  <text class="hac-dbscan-sub" x="30" y="372">Choosing the group count after seeing the hierarchy is a genuine advantage of the first, and labelling noise explicitly is the genuine advantage of the second.</text>
</svg>
