<svg role="img" aria-label="AdamW optimizer mathematical update pipeline showing first moment estimation second uncentered moment calculation bias corrections and decoupled weight decay step" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>AdamW Mathematical Update Engine and Decoupled Weight Decay</title>
  <defs>
    <linearGradient id="bg206b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card206b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg206b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">ADAMW MATHEMATICAL UPDATE ENGINE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">First Moment, Second Moment, Bias Correction, and True Decoupled Regularization</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card206b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Box 1: Gradients -->
    <rect x="25" y="35" width="155" height="105" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="102" y="60" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">1. Incoming Gradient</text>
    <text x="102" y="85" fill="#f8fafc" font-size="10" text-anchor="middle">g_t = dL / d_theta</text>
    <text x="102" y="110" fill="#94a3b8" font-size="9" text-anchor="middle">Computed by autograd</text>

    <!-- Box 2: First Moment (m_t) -->
    <rect x="210" y="35" width="165" height="105" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="292" y="60" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">2. 1st Moment (Mean)</text>
    <text x="292" y="85" fill="#f8fafc" font-size="9" text-anchor="middle">m_t = beta1*m_{t-1} + (1-beta1)*g_t</text>
    <text x="292" y="105" fill="#cbd5e1" font-size="9" text-anchor="middle">m_hat = m_t / (1 - beta1^t)</text>
    <text x="292" y="125" fill="#94a3b8" font-size="8" text-anchor="middle">beta1 = 0.9 (Momentum)</text>

    <!-- Box 3: Second Moment (v_t) -->
    <rect x="405" y="35" width="165" height="105" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" rx="6"/>
    <text x="487" y="60" fill="#c084fc" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">3. 2nd Moment (Variance)</text>
    <text x="487" y="85" fill="#f8fafc" font-size="9" text-anchor="middle">v_t = beta2*v_{t-1} + (1-beta2)*g_t^2</text>
    <text x="487" y="105" fill="#cbd5e1" font-size="9" text-anchor="middle">v_hat = v_t / (1 - beta2^t)</text>
    <text x="487" y="125" fill="#94a3b8" font-size="8" text-anchor="middle">beta2 = 0.999 (Curvature)</text>

    <!-- Box 4: Decoupled Update (theta_t) -->
    <rect x="25" y="165" width="710" height="100" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="380" y="190" fill="#34d399" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">4. Final Decoupled AdamW Parameter Update Step</text>
    <text x="380" y="218" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">theta_t = theta_{t-1} - lr * weight_decay * theta_{t-1} - (lr / (sqrt(v_hat) + eps)) * m_hat</text>
    <text x="380" y="245" fill="#fbbf24" font-size="9" text-anchor="middle">True Weight Decay is subtracted directly, independent of the adaptive gradient scale 1 / (sqrt(v_hat) + eps)!</text>
  </g>
</svg>
