<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things Bayes' theorem is not</title>
  <style>
    .bayes-not-bg   { fill: #f8fafc; }
    .bayes-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bayes-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bayes-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bayes-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bayes-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bayes-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bayes-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bayes-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bayes-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bayes-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bayes-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bayes-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bayes-not-row { opacity: 1; }
    .bayes-not-r0 { animation-delay: 0.00s; }
    .bayes-not-r1 { animation-delay: 0.45s; }
    .bayes-not-r2 { animation-delay: 0.90s; }
    .bayes-not-r3 { animation-delay: 1.35s; }
    .bayes-not-r4 { animation-delay: 1.80s; }
    .bayes-not-row { animation: bayes-not-reveal 7.3s ease-in-out infinite; }
    @keyframes bayes-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="bayes-not-bg" width="980" height="390"/>
  <text class="bayes-not-h1"  x="30" y="40">Four things Bayes' theorem is not</text>
  <text class="bayes-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="bayes-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="bayes-not-name" x="46" y="122">The misconception</text>
  <text class="bayes-not-desc" x="46" y="142">Commonly held.</text>
  <text class="bayes-not-desc bayes-not-row bayes-not-r0" x="46" y="182">A positive test means you probably have it</text>
  <text class="bayes-not-desc bayes-not-row bayes-not-r1" x="46" y="216">The prior is unscientific</text>
  <text class="bayes-not-desc bayes-not-row bayes-not-r2" x="46" y="250">It gives certainty</text>
  <text class="bayes-not-desc bayes-not-row bayes-not-r3" x="46" y="284">Both conditionals are the same</text>
  <text class="bayes-not-desc bayes-not-row bayes-not-r4" x="46" y="318">It only applies to medical tests</text>
  <rect class="bayes-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="bayes-not-name" x="526" y="122">What is true</text>
  <text class="bayes-not-desc" x="526" y="142">Actually.</text>
  <text class="bayes-not-desc bayes-not-row bayes-not-r0" x="526" y="182">For rare conditions, usually not</text>
  <text class="bayes-not-desc bayes-not-row bayes-not-r1" x="526" y="216">Ignoring the base rate is worse</text>
  <text class="bayes-not-desc bayes-not-row bayes-not-r2" x="526" y="250">It gives an updated probability</text>
  <text class="bayes-not-desc bayes-not-row bayes-not-r3" x="526" y="284">They differ, often enormously</text>
  <text class="bayes-not-desc bayes-not-row bayes-not-r4" x="526" y="318">It is the general rule for evidence</text>
  <text class="bayes-not-sub" x="30" y="372">Ignoring a base rate is not neutrality but an implicit and usually wrong prior, which is the strongest answer to the objection that priors are subjective.</text>
</svg>
