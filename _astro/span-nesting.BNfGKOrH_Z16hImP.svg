<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Nested spans, one shared id.">
  <title>How a trace localises a slow request</title>
  <style>
    .span-nesting-bg   { fill: #f8fafc; }
    .span-nesting-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .span-nesting-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .span-nesting-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .span-nesting-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .span-nesting-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .span-nesting-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .span-nesting-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .span-nesting-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .span-nesting-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .span-nesting-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .span-nesting-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .span-nesting-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .span-nesting-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .span-nesting-stage { opacity: 1; }

    .span-nesting-s0 { animation-delay: 0.00s; }
    .span-nesting-e0 { animation-delay: 0.00s; }
    .span-nesting-s1 { animation-delay: 1.28s; }
    .span-nesting-e1 { animation-delay: 1.28s; }
    .span-nesting-s2 { animation-delay: 2.56s; }
    .span-nesting-e2 { animation-delay: 2.56s; }
    .span-nesting-s3 { animation-delay: 3.84s; }
    .span-nesting-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .span-nesting-conn  { animation: span-nesting-trace 6.4s ease-in-out infinite; }
      .span-nesting-stage { animation: span-nesting-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes span-nesting-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes span-nesting-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .span-nesting-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .span-nesting-stage { animation: span-nesting-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes span-nesting-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="span-nesting-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="span-nesting-bg" width="980" height="322"/>
  <text class="span-nesting-h1"  x="30" y="40">How a trace localises a slow request</text>
  <text class="span-nesting-sub" x="30" y="64">Nested spans, one shared id.</text>
  <g class="span-nesting-stage span-nesting-s0">
    <rect class="span-nesting-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="span-nesting-step" x="44" y="142">01</text>
    <text class="span-nesting-name" x="70" y="142">One span for the whole request</text>
    <text class="span-nesting-desc" x="44" y="166">Start time, duration, name. The</text>
    <text class="span-nesting-desc" x="44" y="182">total you already knew.</text>
  </g>
  <line class="span-nesting-line span-nesting-conn span-nesting-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#span-nesting-tip)"/>
  <g class="span-nesting-stage span-nesting-s1">
    <rect class="span-nesting-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="span-nesting-step" x="280" y="142">02</text>
    <text class="span-nesting-name" x="306" y="142">Child spans for each step</text>
    <text class="span-nesting-desc" x="280" y="166">A database query, an external</text>
    <text class="span-nesting-desc" x="280" y="182">call, a computation. Each timed</text>
    <text class="span-nesting-desc" x="280" y="198">separately.</text>
    <text class="span-nesting-edge" x="280" y="242">nested</text>
  </g>
  <line class="span-nesting-line span-nesting-conn span-nesting-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#span-nesting-tip)"/>
  <g class="span-nesting-stage span-nesting-s2">
    <rect class="span-nesting-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="span-nesting-step" x="516" y="142">03</text>
    <text class="span-nesting-name" x="542" y="142">All share a trace id</text>
    <text class="span-nesting-desc" x="516" y="166">Which is how fragments logged on</text>
    <text class="span-nesting-desc" x="516" y="182">different machines become one</text>
    <text class="span-nesting-desc" x="516" y="198">timeline.</text>
    <text class="span-nesting-edge" x="516" y="242">trace_id</text>
  </g>
  <line class="span-nesting-line span-nesting-conn span-nesting-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#span-nesting-tip)"/>
  <g class="span-nesting-stage span-nesting-s3">
    <rect class="span-nesting-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="span-nesting-step" x="752" y="142">04</text>
    <text class="span-nesting-name" x="778" y="142">Read the durations</text>
    <text class="span-nesting-desc" x="752" y="166">90% in one db_query span. No</text>
    <text class="span-nesting-desc" x="752" y="182">guessing about which service was</text>
    <text class="span-nesting-desc" x="752" y="198">slow.</text>
    <text class="span-nesting-edge" x="752" y="242">located</text>
  </g>
  <text class="span-nesting-sub" x="30" y="304">This is the pillar that only distributed systems truly need. On a single service, good metrics and logs usually suffice — and the plumbing to thread a trace id through everything is real work.</text>
</svg>
