<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are risks.">
  <title>Four consequences of error strategy</title>
  <style>
    .exception-implications-bg   { fill: #f8fafc; }
    .exception-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exception-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exception-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exception-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exception-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exception-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exception-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .exception-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .exception-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .exception-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .exception-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .exception-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .exception-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .exception-implications-stage { opacity: 1; }

    .exception-implications-s0 { animation-delay: 0.00s; }
    .exception-implications-e0 { animation-delay: 0.00s; }
    .exception-implications-s1 { animation-delay: 1.28s; }
    .exception-implications-e1 { animation-delay: 1.28s; }
    .exception-implications-s2 { animation-delay: 2.56s; }
    .exception-implications-e2 { animation-delay: 2.56s; }
    .exception-implications-s3 { animation-delay: 3.84s; }
    .exception-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .exception-implications-conn  { animation: exception-implications-trace 6.4s ease-in-out infinite; }
      .exception-implications-stage { animation: exception-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes exception-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes exception-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .exception-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .exception-implications-stage { animation: exception-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes exception-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="exception-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="exception-implications-bg" width="980" height="322"/>
  <text class="exception-implications-h1"  x="30" y="40">Four consequences of error strategy</text>
  <text class="exception-implications-sub" x="30" y="64">Two are risks.</text>
  <g class="exception-implications-stage exception-implications-s0">
    <rect class="exception-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="exception-implications-step" x="44" y="142">01</text>
    <text class="exception-implications-name" x="70" y="142">Failures become visible rather than silent</text>
    <text class="exception-implications-desc" x="44" y="166">Which is what makes a system</text>
    <text class="exception-implications-desc" x="44" y="182">operable.</text>
  </g>
  <line class="exception-implications-line exception-implications-conn exception-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#exception-implications-tip)"/>
  <g class="exception-implications-stage exception-implications-s1">
    <rect class="exception-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="exception-implications-step" x="280" y="142">02</text>
    <text class="exception-implications-name" x="306" y="142">But over-broad catching hides real bugs</text>
    <text class="exception-implications-desc" x="280" y="166">Sometimes for months.</text>
  </g>
  <line class="exception-implications-line exception-implications-conn exception-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#exception-implications-tip)"/>
  <g class="exception-implications-stage exception-implications-s2">
    <rect class="exception-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="exception-implications-step" x="516" y="142">03</text>
    <text class="exception-implications-name" x="542" y="142">And error messages can leak internal detail</text>
    <text class="exception-implications-desc" x="516" y="166">Paths, queries, credentials, to</text>
    <text class="exception-implications-desc" x="516" y="182">a user.</text>
  </g>
  <line class="exception-implications-line exception-implications-conn exception-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#exception-implications-tip)"/>
  <g class="exception-implications-stage exception-implications-s3">
    <rect class="exception-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="exception-implications-step" x="752" y="142">04</text>
    <text class="exception-implications-name" x="778" y="142">While retries multiply cost against a metered service</text>
    <text class="exception-implications-desc" x="752" y="166">So bound them.</text>
  </g>
  <text class="exception-implications-sub" x="30" y="304">Leaking internal detail in a user-facing error is a common and easily fixed exposure: log the detail, and return a reference the support team can look up.</text>
</svg>
