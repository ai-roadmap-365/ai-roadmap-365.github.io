<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Delivery changed, so the answer did.">
  <title>Why the recommended workflow changed</title>
  <style>
    .workflow-history-bg   { fill: #f8fafc; }
    .workflow-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .workflow-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .workflow-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .workflow-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .workflow-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .workflow-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .workflow-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .workflow-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .workflow-history-stage { opacity: 1; }

    .workflow-history-s0 { animation-delay: 0.00s; }
    .workflow-history-e0 { animation-delay: 0.00s; }
    .workflow-history-s1 { animation-delay: 1.28s; }
    .workflow-history-e1 { animation-delay: 1.28s; }
    .workflow-history-s2 { animation-delay: 2.56s; }
    .workflow-history-e2 { animation-delay: 2.56s; }
    .workflow-history-s3 { animation-delay: 3.84s; }
    .workflow-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .workflow-history-conn  { animation: workflow-history-trace 6.4s ease-in-out infinite; }
      .workflow-history-stage { animation: workflow-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes workflow-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes workflow-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .workflow-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .workflow-history-stage { animation: workflow-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes workflow-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="workflow-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="workflow-history-bg" width="980" height="322"/>
  <text class="workflow-history-h1"  x="30" y="40">Why the recommended workflow changed</text>
  <text class="workflow-history-sub" x="30" y="64">Delivery changed, so the answer did.</text>
  <g class="workflow-history-stage workflow-history-s0">
    <rect class="workflow-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="workflow-history-step" x="44" y="142">01</text>
    <text class="workflow-history-name" x="70" y="142">Git Flow, 2010</text>
    <text class="workflow-history-desc" x="44" y="166">The first written-down answer,</text>
    <text class="workflow-history-desc" x="44" y="182">and the default recommendation</text>
    <text class="workflow-history-desc" x="44" y="198">for years.</text>
    <text class="workflow-history-edge" x="44" y="242">2010</text>
  </g>
  <line class="workflow-history-line workflow-history-conn workflow-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#workflow-history-tip)"/>
  <g class="workflow-history-stage workflow-history-s1">
    <rect class="workflow-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="workflow-history-step" x="280" y="142">02</text>
    <text class="workflow-history-name" x="306" y="142">Its author added a caveat</text>
    <text class="workflow-history-desc" x="280" y="166">Often the wrong choice for</text>
    <text class="workflow-history-desc" x="280" y="182">software delivered continuously</text>
    <text class="workflow-history-desc" x="280" y="198">rather than in versioned</text>
  </g>
  <line class="workflow-history-line workflow-history-conn workflow-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#workflow-history-tip)"/>
  <g class="workflow-history-stage workflow-history-s2">
    <rect class="workflow-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="workflow-history-step" x="516" y="142">03</text>
    <text class="workflow-history-name" x="542" y="142">GitHub Flow</text>
    <text class="workflow-history-desc" x="516" y="166">One long-lived branch, short</text>
    <text class="workflow-history-desc" x="516" y="182">feature branches, a pull request</text>
    <text class="workflow-history-desc" x="516" y="198">as the gate.</text>
    <text class="workflow-history-edge" x="516" y="242">simpler</text>
  </g>
  <line class="workflow-history-line workflow-history-conn workflow-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#workflow-history-tip)"/>
  <g class="workflow-history-stage workflow-history-s3">
    <rect class="workflow-history-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="workflow-history-step" x="752" y="142">04</text>
    <text class="workflow-history-name" x="778" y="142">Trunk-based returns</text>
    <text class="workflow-history-desc" x="752" y="166">Older than both, back in favour</text>
    <text class="workflow-history-desc" x="752" y="182">with continuous delivery and</text>
    <text class="workflow-history-desc" x="752" y="198">strong test automation.</text>
    <text class="workflow-history-edge" x="752" y="242">fastest</text>
  </g>
  <text class="workflow-history-sub" x="30" y="304">None of these superseded the others. A library with support windows still wants release branches; the change is that most software is no longer delivered that way.</text>
</svg>
