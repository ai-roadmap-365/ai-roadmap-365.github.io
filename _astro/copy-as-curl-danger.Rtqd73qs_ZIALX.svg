<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Everything the browser sent, including the parts you cannot see.">
  <title>"Copy as cURL" copies your credentials</title>
  <style>
    .copy-as-curl-danger-bg   { fill: #f8fafc; }
    .copy-as-curl-danger-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .copy-as-curl-danger-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .copy-as-curl-danger-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .copy-as-curl-danger-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .copy-as-curl-danger-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .copy-as-curl-danger-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .copy-as-curl-danger-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .copy-as-curl-danger-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .copy-as-curl-danger-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .copy-as-curl-danger-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .copy-as-curl-danger-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .copy-as-curl-danger-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .copy-as-curl-danger-row { opacity: 1; }
    .copy-as-curl-danger-r0 { animation-delay: 0.00s; }
    .copy-as-curl-danger-r1 { animation-delay: 0.45s; }
    .copy-as-curl-danger-r2 { animation-delay: 0.90s; }
    .copy-as-curl-danger-r3 { animation-delay: 1.35s; }
    .copy-as-curl-danger-r4 { animation-delay: 1.80s; }
    .copy-as-curl-danger-row { animation: copy-as-curl-danger-reveal 7.3s ease-in-out infinite; }
    @keyframes copy-as-curl-danger-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="copy-as-curl-danger-bg" width="980" height="390"/>
  <text class="copy-as-curl-danger-h1"  x="30" y="40">"Copy as cURL" copies your credentials</text>
  <text class="copy-as-curl-danger-sub" x="30" y="64">Everything the browser sent, including the parts you cannot see.</text>
  <rect class="copy-as-curl-danger-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="copy-as-curl-danger-name" x="46" y="122">What you just copied</text>
  <text class="copy-as-curl-danger-desc" x="46" y="142">A working key to your account.</text>
  <text class="copy-as-curl-danger-desc copy-as-curl-danger-row copy-as-curl-danger-r0" x="46" y="182">Every session cookie</text>
  <text class="copy-as-curl-danger-desc copy-as-curl-danger-row copy-as-curl-danger-r1" x="46" y="216">The Authorization header, in full</text>
  <text class="copy-as-curl-danger-desc copy-as-curl-danger-row copy-as-curl-danger-r2" x="46" y="250">CSRF tokens</text>
  <text class="copy-as-curl-danger-desc copy-as-curl-danger-row copy-as-curl-danger-r3" x="46" y="284">Anything identifying your account</text>
  <text class="copy-as-curl-danger-desc copy-as-curl-danger-row copy-as-curl-danger-r4" x="46" y="318">It goes into shell history too</text>
  <rect class="copy-as-curl-danger-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="copy-as-curl-danger-name" x="526" y="122">Before you share it</text>
  <text class="copy-as-curl-danger-desc" x="526" y="142">Ten seconds of redaction.</text>
  <text class="copy-as-curl-danger-desc copy-as-curl-danger-row copy-as-curl-danger-r0" x="526" y="182">Replace token values with REDACTED</text>
  <text class="copy-as-curl-danger-desc copy-as-curl-danger-row copy-as-curl-danger-r1" x="526" y="216">Strip the cookie header entirely</text>
  <text class="copy-as-curl-danger-desc copy-as-curl-danger-row copy-as-curl-danger-r2" x="526" y="250">Check for keys in the URL query string</text>
  <text class="copy-as-curl-danger-desc copy-as-curl-danger-row copy-as-curl-danger-r3" x="526" y="284">Confirm it still shows the problem</text>
  <text class="copy-as-curl-danger-desc copy-as-curl-danger-row copy-as-curl-danger-r4" x="526" y="318">Then paste it — including into a model</text>
  <text class="copy-as-curl-danger-sub" x="30" y="372">This applies to verbose output as much as to copied commands: the Authorization header is right there in the &gt; lines of anything you paste into an issue tracker.</text>
</svg>
