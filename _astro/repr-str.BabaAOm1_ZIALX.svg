<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two audiences.">
  <title>Two string forms</title>
  <style>
    .repr-str-bg   { fill: #f8fafc; }
    .repr-str-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repr-str-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repr-str-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repr-str-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repr-str-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repr-str-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .repr-str-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .repr-str-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .repr-str-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .repr-str-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .repr-str-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .repr-str-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .repr-str-row { opacity: 1; }
    .repr-str-r0 { animation-delay: 0.00s; }
    .repr-str-r1 { animation-delay: 0.45s; }
    .repr-str-r2 { animation-delay: 0.90s; }
    .repr-str-r3 { animation-delay: 1.35s; }
    .repr-str-r4 { animation-delay: 1.80s; }
    .repr-str-row { animation: repr-str-reveal 7.3s ease-in-out infinite; }
    @keyframes repr-str-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="repr-str-bg" width="980" height="390"/>
  <text class="repr-str-h1"  x="30" y="40">Two string forms</text>
  <text class="repr-str-sub" x="30" y="64">Two audiences.</text>
  <rect class="repr-str-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="repr-str-name" x="46" y="122">The developer form</text>
  <text class="repr-str-desc" x="46" y="142">For you.</text>
  <text class="repr-str-desc repr-str-row repr-str-r0" x="46" y="182">Unambiguous, and precise</text>
  <text class="repr-str-desc repr-str-row repr-str-r1" x="46" y="216">Shown in a debugger and a collection</text>
  <text class="repr-str-desc repr-str-row repr-str-r2" x="46" y="250">Ideally reconstructs the object</text>
  <text class="repr-str-desc repr-str-row repr-str-r3" x="46" y="284">Define this one, always</text>
  <text class="repr-str-desc repr-str-row repr-str-r4" x="46" y="318">Falls back to a memory address</text>
  <rect class="repr-str-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="repr-str-name" x="526" y="122">The display form</text>
  <text class="repr-str-desc" x="526" y="142">For a user.</text>
  <text class="repr-str-desc repr-str-row repr-str-r0" x="526" y="182">Readable, and possibly lossy</text>
  <text class="repr-str-desc repr-str-row repr-str-r1" x="526" y="216">Shown when printed</text>
  <text class="repr-str-desc repr-str-row repr-str-r2" x="526" y="250">Prose rather than syntax</text>
  <text class="repr-str-desc repr-str-row repr-str-r3" x="526" y="284">Optional; defaults to the other</text>
  <text class="repr-str-desc repr-str-row repr-str-r4" x="526" y="318">Define it only when they differ</text>
  <text class="repr-str-sub" x="30" y="372">Defining only the developer form is the right default, because the display form falls back to it and an object printed inside a list uses the developer form regardless.</text>
</svg>
