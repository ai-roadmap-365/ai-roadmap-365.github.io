<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Seven steps, ending in a cut list.">
  <title>The procedure, in order</title>
  <style>
    .plan-procedure-bg   { fill: #f8fafc; }
    .plan-procedure-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .plan-procedure-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .plan-procedure-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .plan-procedure-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .plan-procedure-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .plan-procedure-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .plan-procedure-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .plan-procedure-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .plan-procedure-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .plan-procedure-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .plan-procedure-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .plan-procedure-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .plan-procedure-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .plan-procedure-stage { opacity: 1; }

    .plan-procedure-s0 { animation-delay: 0.00s; }
    .plan-procedure-e0 { animation-delay: 0.00s; }
    .plan-procedure-s1 { animation-delay: 1.40s; }
    .plan-procedure-e1 { animation-delay: 1.40s; }
    .plan-procedure-s2 { animation-delay: 2.80s; }
    .plan-procedure-e2 { animation-delay: 2.80s; }
    .plan-procedure-s3 { animation-delay: 4.20s; }
    .plan-procedure-e3 { animation-delay: 4.20s; }
    .plan-procedure-s4 { animation-delay: 5.60s; }
    .plan-procedure-e4 { animation-delay: 5.60s; }
    .plan-procedure-s5 { animation-delay: 7.00s; }
    .plan-procedure-e5 { animation-delay: 7.00s; }
    .plan-procedure-s6 { animation-delay: 8.40s; }
    .plan-procedure-e6 { animation-delay: 8.40s; }
    @media (prefers-reduced-motion: no-preference) {
      .plan-procedure-conn  { animation: plan-procedure-trace 11.200000000000001s ease-in-out infinite; }
      .plan-procedure-stage { animation: plan-procedure-arrive 11.200000000000001s ease-in-out infinite; }
    }
    @keyframes plan-procedure-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes plan-procedure-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .plan-procedure-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .plan-procedure-stage { animation: plan-procedure-settle 11.200000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes plan-procedure-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="plan-procedure-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="plan-procedure-bg" width="980" height="322"/>
  <text class="plan-procedure-h1"  x="30" y="40">The procedure, in order</text>
  <text class="plan-procedure-sub" x="30" y="64">Seven steps, ending in a cut list.</text>
  <g class="plan-procedure-stage plan-procedure-s0">
    <rect class="plan-procedure-box" x="30" y="118" width="109" height="104" rx="10"/>
    <text class="plan-procedure-step" x="44" y="142">01</text>
    <text class="plan-procedure-name" x="70" y="142">Write the commitments</text>
    <text class="plan-procedure-desc" x="44" y="166">Topic, next</text>
    <text class="plan-procedure-desc" x="44" y="182">action, artifact,</text>
    <text class="plan-procedure-desc" x="44" y="198">hours per week,</text>
  </g>
  <line class="plan-procedure-line plan-procedure-conn plan-procedure-e0" x1="141" y1="170" x2="163" y2="170" marker-end="url(#plan-procedure-tip)"/>
  <g class="plan-procedure-stage plan-procedure-s1">
    <rect class="plan-procedure-warn" x="165" y="118" width="109" height="104" rx="10"/>
    <text class="plan-procedure-step" x="179" y="142">02</text>
    <text class="plan-procedure-name" x="205" y="142">Check each next action</text>
    <text class="plan-procedure-desc" x="179" y="166">Reject topic</text>
    <text class="plan-procedure-desc" x="179" y="182">verbs — learn,</text>
    <text class="plan-procedure-desc" x="179" y="198">study, explore,</text>
  </g>
  <line class="plan-procedure-line plan-procedure-conn plan-procedure-e1" x1="276" y1="170" x2="298" y2="170" marker-end="url(#plan-procedure-tip)"/>
  <g class="plan-procedure-stage plan-procedure-s2">
    <rect class="plan-procedure-box" x="300" y="118" width="109" height="104" rx="10"/>
    <text class="plan-procedure-step" x="314" y="142">03</text>
    <text class="plan-procedure-name" x="340" y="142">Check each artifact</text>
    <text class="plan-procedure-desc" x="314" y="166">If nothing exists</text>
    <text class="plan-procedure-desc" x="314" y="182">afterwards, the</text>
    <text class="plan-procedure-desc" x="314" y="198">commitment is</text>
  </g>
  <line class="plan-procedure-line plan-procedure-conn plan-procedure-e2" x1="411" y1="170" x2="433" y2="170" marker-end="url(#plan-procedure-tip)"/>
  <g class="plan-procedure-stage plan-procedure-s3">
    <rect class="plan-procedure-box" x="435" y="118" width="109" height="104" rx="10"/>
    <text class="plan-procedure-step" x="449" y="142">04</text>
    <text class="plan-procedure-name" x="475" y="142">Measure your available hours</text>
    <text class="plan-procedure-desc" x="449" y="166">Measure, do not</text>
    <text class="plan-procedure-desc" x="449" y="182">estimate. Look at</text>
    <text class="plan-procedure-desc" x="449" y="198">what last month</text>
    <text class="plan-procedure-edge" x="449" y="242">measured</text>
  </g>
  <line class="plan-procedure-line plan-procedure-conn plan-procedure-e3" x1="546" y1="170" x2="568" y2="170" marker-end="url(#plan-procedure-tip)"/>
  <g class="plan-procedure-stage plan-procedure-s4">
    <rect class="plan-procedure-box" x="570" y="118" width="109" height="104" rx="10"/>
    <text class="plan-procedure-step" x="584" y="142">05</text>
    <text class="plan-procedure-name" x="610" y="142">Re-cost at your calibration</text>
    <text class="plan-procedure-desc" x="584" y="166">Multiply by</text>
    <text class="plan-procedure-desc" x="584" y="182">yesterday's</text>
    <text class="plan-procedure-desc" x="584" y="198">ratio. A plan in</text>
  </g>
  <line class="plan-procedure-line plan-procedure-conn plan-procedure-e4" x1="681" y1="170" x2="703" y2="170" marker-end="url(#plan-procedure-tip)"/>
  <g class="plan-procedure-stage plan-procedure-s5">
    <rect class="plan-procedure-good" x="705" y="118" width="109" height="104" rx="10"/>
    <text class="plan-procedure-step" x="719" y="142">06</text>
    <text class="plan-procedure-name" x="745" y="142">Total and compare</text>
    <text class="plan-procedure-desc" x="719" y="166">If it fits, stop.</text>
    <text class="plan-procedure-desc" x="719" y="182">Resist filling</text>
    <text class="plan-procedure-desc" x="719" y="198">the gap — the gap</text>
  </g>
  <line class="plan-procedure-line plan-procedure-conn plan-procedure-e5" x1="816" y1="170" x2="838" y2="170" marker-end="url(#plan-procedure-tip)"/>
  <g class="plan-procedure-stage plan-procedure-s6">
    <rect class="plan-procedure-box" x="840" y="118" width="109" height="104" rx="10"/>
    <text class="plan-procedure-step" x="854" y="142">07</text>
    <text class="plan-procedure-name" x="880" y="142">If not, trim by priority</text>
    <text class="plan-procedure-desc" x="854" y="166">Keep each that</text>
    <text class="plan-procedure-desc" x="854" y="182">still fits, skip</text>
    <text class="plan-procedure-desc" x="854" y="198">past what does</text>
  </g>
  <text class="plan-procedure-sub" x="30" y="304">The sixth step is the one that gets ignored when a plan happens to fit: the spare capacity is not unused, it is what a busy fortnight consumes without taking anything down with it.</text>
</svg>
