<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="MCP Universal Architecture N times M">
  <title>MCP Universal Architecture N times M</title>
  <defs>
    <style>
      .d295a-bg { fill: #f8fafc; }
      .d295a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d295a-mcp { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d295a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d295a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d295a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
      .d295a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d295a-bg" />
  
  <text x="40" y="40" class="d295a-title">The Model Context Protocol: Resolving N x M Complexity</text>
  <text x="40" y="65" class="d295a-subtitle">MCP Universal Architecture N times M diagram comparing fragmented bespoke point-to-point connections with universal MCP standardized protocol bus</text>
  
  <!-- Left: Fragmented Point-to-Point -->
  <rect x="40" y="100" width="380" height="300" class="d295a-card" />
  <text x="60" y="130" class="d295a-header" fill="#dc2626">Before MCP: N x M Bespoke Connectors</text>
  <text x="60" y="160" class="d295a-text">• 5 AI Clients (Claude, Cursor, Copilot, ChatGPT, IDE)</text>
  <text x="60" y="180" class="d295a-text">• 10 Data Tools (Postgres, GitHub, Slack, SQLite, S3...)</text>
  <text x="60" y="210" class="d295a-text" font-weight="600">Problem: 50 Custom Integrations to Build &amp; Maintain</text>
  <text x="60" y="235" class="d295a-text">- Incompatible auth &amp; schema formats</text>
  <text x="60" y="255" class="d295a-text">- High development friction</text>
  <text x="60" y="275" class="d295a-text">- Fragmented security models</text>
  <text x="60" y="310" class="d295a-text" fill="#b91c1c" font-weight="700">Fragile, redundant, proprietary lock-in</text>
  
  <!-- Right: Standardized MCP Bus -->
  <rect x="480" y="100" width="380" height="300" class="d295a-mcp" />
  <text x="500" y="130" class="d295a-header" fill="#1d4ed8">With MCP: 1 Standard Universal Interface</text>
  <text x="500" y="160" class="d295a-text">• AI Clients connect via standardized JSON-RPC 2.0</text>
  <text x="500" y="180" class="d295a-text">• Any MCP Server exposes Tools, Resources, and Prompts</text>
  <text x="500" y="210" class="d295a-text" font-weight="600">Solution: 5 Clients + 10 Servers = 15 Integrations</text>
  <text x="500" y="235" class="d295a-text">- Write once, run in any AI environment</text>
  <text x="500" y="255" class="d295a-text">- Clean stdio / SSE transport boundaries</text>
  <text x="500" y="275" class="d295a-text">- Standardized capability negotiation &amp; safety</text>
  <text x="500" y="310" class="d295a-text" fill="#1e40af" font-weight="700">Open standard, composable, zero lock-in</text>
</svg>