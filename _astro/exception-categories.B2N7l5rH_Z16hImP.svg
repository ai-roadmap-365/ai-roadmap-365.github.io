<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each category points at a different kind of mistake.">
  <title>The exception type is the first clue</title>
  <style>
    .exception-categories-bg   { fill: #f8fafc; }
    .exception-categories-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exception-categories-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exception-categories-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exception-categories-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exception-categories-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exception-categories-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exception-categories-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .exception-categories-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .exception-categories-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .exception-categories-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .exception-categories-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .exception-categories-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .exception-categories-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .exception-categories-stage { opacity: 1; }

    .exception-categories-s0 { animation-delay: 0.00s; }
    .exception-categories-e0 { animation-delay: 0.00s; }
    .exception-categories-s1 { animation-delay: 1.28s; }
    .exception-categories-e1 { animation-delay: 1.28s; }
    .exception-categories-s2 { animation-delay: 2.56s; }
    .exception-categories-e2 { animation-delay: 2.56s; }
    .exception-categories-s3 { animation-delay: 3.84s; }
    .exception-categories-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .exception-categories-conn  { animation: exception-categories-trace 6.4s ease-in-out infinite; }
      .exception-categories-stage { animation: exception-categories-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes exception-categories-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes exception-categories-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .exception-categories-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .exception-categories-stage { animation: exception-categories-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes exception-categories-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="exception-categories-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="exception-categories-bg" width="980" height="322"/>
  <text class="exception-categories-h1"  x="30" y="40">The exception type is the first clue</text>
  <text class="exception-categories-sub" x="30" y="64">Each category points at a different kind of mistake.</text>
  <g class="exception-categories-stage exception-categories-s0">
    <rect class="exception-categories-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="exception-categories-step" x="44" y="142">01</text>
    <text class="exception-categories-name" x="70" y="142">Name and Import</text>
    <text class="exception-categories-desc" x="44" y="166">It does not exist here. A typo,</text>
    <text class="exception-categories-desc" x="44" y="182">a missing import, or the wrong</text>
    <text class="exception-categories-desc" x="44" y="198">environment.</text>
    <text class="exception-categories-edge" x="44" y="242">Day 43</text>
  </g>
  <line class="exception-categories-line exception-categories-conn exception-categories-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#exception-categories-tip)"/>
  <g class="exception-categories-stage exception-categories-s1">
    <rect class="exception-categories-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="exception-categories-step" x="280" y="142">02</text>
    <text class="exception-categories-name" x="306" y="142">Type and Attribute</text>
    <text class="exception-categories-desc" x="280" y="166">Wrong KIND of thing. Very often</text>
    <text class="exception-categories-desc" x="280" y="182">a None that should have been a</text>
    <text class="exception-categories-desc" x="280" y="198">value.</text>
    <text class="exception-categories-edge" x="280" y="242">None</text>
  </g>
  <line class="exception-categories-line exception-categories-conn exception-categories-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#exception-categories-tip)"/>
  <g class="exception-categories-stage exception-categories-s2">
    <rect class="exception-categories-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="exception-categories-step" x="516" y="142">03</text>
    <text class="exception-categories-name" x="542" y="142">Value</text>
    <text class="exception-categories-desc" x="516" y="166">Right kind, wrong content.</text>
    <text class="exception-categories-desc" x="516" y="182">int("abc") — the conversion Day</text>
    <text class="exception-categories-desc" x="516" y="198">47 warned about.</text>
    <text class="exception-categories-edge" x="516" y="242">convert</text>
  </g>
  <line class="exception-categories-line exception-categories-conn exception-categories-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#exception-categories-tip)"/>
  <g class="exception-categories-stage exception-categories-s3">
    <rect class="exception-categories-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="exception-categories-step" x="752" y="142">04</text>
    <text class="exception-categories-name" x="778" y="142">Key, Index, FileNotFound</text>
    <text class="exception-categories-desc" x="752" y="166">You asked for something that is</text>
    <text class="exception-categories-desc" x="752" y="182">not there. Check what IS there.</text>
    <text class="exception-categories-edge" x="752" y="242">lookup</text>
  </g>
  <text class="exception-categories-sub" x="30" y="304">Reading the category before the message narrows the search immediately: a TypeError and a KeyError on the same line call for entirely different questions about entirely different values.</text>
</svg>
