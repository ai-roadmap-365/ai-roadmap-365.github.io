<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Bidirectional, or causal.">
  <title>Encoders and decoders</title>
  <style>
    .encoder-or-decoder-bg   { fill: #f8fafc; }
    .encoder-or-decoder-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoder-or-decoder-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoder-or-decoder-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoder-or-decoder-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoder-or-decoder-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoder-or-decoder-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .encoder-or-decoder-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .encoder-or-decoder-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .encoder-or-decoder-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .encoder-or-decoder-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .encoder-or-decoder-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .encoder-or-decoder-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .encoder-or-decoder-row { opacity: 1; }
    .encoder-or-decoder-r0 { animation-delay: 0.00s; }
    .encoder-or-decoder-r1 { animation-delay: 0.45s; }
    .encoder-or-decoder-r2 { animation-delay: 0.90s; }
    .encoder-or-decoder-r3 { animation-delay: 1.35s; }
    .encoder-or-decoder-r4 { animation-delay: 1.80s; }
    .encoder-or-decoder-row { animation: encoder-or-decoder-reveal 7.3s ease-in-out infinite; }
    @keyframes encoder-or-decoder-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="encoder-or-decoder-bg" width="980" height="390"/>
  <text class="encoder-or-decoder-h1"  x="30" y="40">Encoders and decoders</text>
  <text class="encoder-or-decoder-sub" x="30" y="64">Bidirectional, or causal.</text>
  <rect class="encoder-or-decoder-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="encoder-or-decoder-name" x="46" y="122">Encoder</text>
  <text class="encoder-or-decoder-desc" x="46" y="142">Sees everything.</text>
  <text class="encoder-or-decoder-desc encoder-or-decoder-row encoder-or-decoder-r0" x="46" y="182">Bidirectional attention, no mask</text>
  <text class="encoder-or-decoder-desc encoder-or-decoder-row encoder-or-decoder-r1" x="46" y="216">Every token conditioned on the whole sequence</text>
  <text class="encoder-or-decoder-desc encoder-or-decoder-row encoder-or-decoder-r2" x="46" y="250">Excellent representations for classification</text>
  <text class="encoder-or-decoder-desc encoder-or-decoder-row encoder-or-decoder-r3" x="46" y="284">Cannot generate — it sees the answer</text>
  <text class="encoder-or-decoder-desc encoder-or-decoder-row encoder-or-decoder-r4" x="46" y="318">Trained by masking</text>
  <rect class="encoder-or-decoder-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="encoder-or-decoder-name" x="526" y="122">Decoder</text>
  <text class="encoder-or-decoder-desc" x="526" y="142">Sees only the past.</text>
  <text class="encoder-or-decoder-desc encoder-or-decoder-row encoder-or-decoder-r0" x="526" y="182">Causal mask over future positions</text>
  <text class="encoder-or-decoder-desc encoder-or-decoder-row encoder-or-decoder-r1" x="526" y="216">Each token conditioned on what precedes it</text>
  <text class="encoder-or-decoder-desc encoder-or-decoder-row encoder-or-decoder-r2" x="526" y="250">Generates one token at a time</text>
  <text class="encoder-or-decoder-desc encoder-or-decoder-row encoder-or-decoder-r3" x="526" y="284">Weaker representations for classification</text>
  <text class="encoder-or-decoder-desc encoder-or-decoder-row encoder-or-decoder-r4" x="526" y="318">Trained by next-token prediction</text>
  <text class="encoder-or-decoder-sub" x="30" y="372">The inability to generate is a direct consequence of the strength: bidirectional context is exactly what a generator must not have, since the future is what it is producing.</text>
</svg>
