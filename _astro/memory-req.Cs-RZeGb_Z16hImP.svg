<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four consumers.">
  <title>Where the memory goes</title>
  <style>
    .memory-req-bg   { fill: #f8fafc; }
    .memory-req-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .memory-req-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .memory-req-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .memory-req-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .memory-req-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .memory-req-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .memory-req-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .memory-req-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .memory-req-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .memory-req-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .memory-req-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .memory-req-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .memory-req-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .memory-req-stage { opacity: 1; }

    .memory-req-s0 { animation-delay: 0.00s; }
    .memory-req-e0 { animation-delay: 0.00s; }
    .memory-req-s1 { animation-delay: 1.28s; }
    .memory-req-e1 { animation-delay: 1.28s; }
    .memory-req-s2 { animation-delay: 2.56s; }
    .memory-req-e2 { animation-delay: 2.56s; }
    .memory-req-s3 { animation-delay: 3.84s; }
    .memory-req-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .memory-req-conn  { animation: memory-req-trace 6.4s ease-in-out infinite; }
      .memory-req-stage { animation: memory-req-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes memory-req-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes memory-req-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .memory-req-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .memory-req-stage { animation: memory-req-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes memory-req-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="memory-req-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="memory-req-bg" width="980" height="322"/>
  <text class="memory-req-h1"  x="30" y="40">Where the memory goes</text>
  <text class="memory-req-sub" x="30" y="64">Four consumers.</text>
  <g class="memory-req-stage memory-req-s0">
    <rect class="memory-req-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="memory-req-step" x="44" y="142">01</text>
    <text class="memory-req-name" x="70" y="142">The latent volume itself</text>
    <text class="memory-req-desc" x="44" y="166">Frames multiplied by height and</text>
    <text class="memory-req-desc" x="44" y="182">width.</text>
  </g>
  <line class="memory-req-line memory-req-conn memory-req-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#memory-req-tip)"/>
  <g class="memory-req-stage memory-req-s1">
    <rect class="memory-req-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="memory-req-step" x="280" y="142">02</text>
    <text class="memory-req-name" x="306" y="142">Activations through every layer</text>
    <text class="memory-req-desc" x="280" y="166">Which scale with that whole</text>
    <text class="memory-req-desc" x="280" y="182">volume.</text>
  </g>
  <line class="memory-req-line memory-req-conn memory-req-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#memory-req-tip)"/>
  <g class="memory-req-stage memory-req-s2">
    <rect class="memory-req-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="memory-req-step" x="516" y="142">03</text>
    <text class="memory-req-name" x="542" y="142">Attention state across frames</text>
    <text class="memory-req-desc" x="516" y="166">The largest term at longer</text>
    <text class="memory-req-desc" x="516" y="182">clips.</text>
  </g>
  <line class="memory-req-line memory-req-conn memory-req-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#memory-req-tip)"/>
  <g class="memory-req-stage memory-req-s3">
    <rect class="memory-req-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="memory-req-step" x="752" y="142">04</text>
    <text class="memory-req-name" x="778" y="142">Which caps clip length before quality does</text>
    <text class="memory-req-desc" x="752" y="166">So clips are short for a memory</text>
    <text class="memory-req-desc" x="752" y="182">reason.</text>
  </g>
  <text class="memory-req-sub" x="30" y="304">Clip length being a memory limit rather than a quality one explains why the practical answer is generating short segments and stitching them.</text>
</svg>
