<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Enough to orient a reader, and no more.">
  <title>Draw two levels, not five</title>
  <style>
    .c4-levels-bg   { fill: #f8fafc; }
    .c4-levels-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .c4-levels-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .c4-levels-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .c4-levels-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .c4-levels-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .c4-levels-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .c4-levels-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .c4-levels-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .c4-levels-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .c4-levels-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .c4-levels-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .c4-levels-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .c4-levels-row { opacity: 1; }
    .c4-levels-r0 { animation-delay: 0.00s; }
    .c4-levels-r1 { animation-delay: 0.45s; }
    .c4-levels-r2 { animation-delay: 0.90s; }
    .c4-levels-r3 { animation-delay: 1.35s; }
    .c4-levels-r4 { animation-delay: 1.80s; }
    .c4-levels-row { animation: c4-levels-reveal 7.3s ease-in-out infinite; }
    @keyframes c4-levels-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="c4-levels-bg" width="980" height="390"/>
  <text class="c4-levels-h1"  x="30" y="40">Draw two levels, not five</text>
  <text class="c4-levels-sub" x="30" y="64">Enough to orient a reader, and no more.</text>
  <rect class="c4-levels-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="c4-levels-name" x="46" y="122">Worth drawing</text>
  <text class="c4-levels-desc" x="46" y="142">Two diagrams, both short-lived.</text>
  <text class="c4-levels-desc c4-levels-row c4-levels-r0" x="46" y="182">Context: your system and what it talks to</text>
  <text class="c4-levels-desc c4-levels-row c4-levels-r1" x="46" y="216">Containers: the few running pieces</text>
  <text class="c4-levels-desc c4-levels-row c4-levels-r2" x="46" y="250">The contract between each pair</text>
  <text class="c4-levels-desc c4-levels-row c4-levels-r3" x="46" y="284">Where the data actually lives</text>
  <text class="c4-levels-desc c4-levels-row c4-levels-r4" x="46" y="318">Redrawn when the design changes</text>
  <rect class="c4-levels-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="c4-levels-name" x="526" y="122">Not worth drawing</text>
  <text class="c4-levels-desc" x="526" y="142">Stale before it is finished.</text>
  <text class="c4-levels-desc c4-levels-row c4-levels-r0" x="526" y="182">Every class and its methods</text>
  <text class="c4-levels-desc c4-levels-row c4-levels-r1" x="526" y="216">Sequence diagrams for every path</text>
  <text class="c4-levels-desc c4-levels-row c4-levels-r2" x="526" y="250">Anything the code already shows</text>
  <text class="c4-levels-desc c4-levels-row c4-levels-r3" x="526" y="284">Anything nobody will update</text>
  <text class="c4-levels-desc c4-levels-row c4-levels-r4" x="526" y="318">Detail that decays faster than it informs</text>
  <text class="c4-levels-sub" x="30" y="372">The useful test is decay rate: a container diagram stays true for weeks, and a class diagram is wrong by the next commit. Draw the things that change slowly.</text>
</svg>
