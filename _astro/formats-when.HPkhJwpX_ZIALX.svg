<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what is never allowed.">
  <title>Where SafeTensors is mandatory</title>
  <style>
    .formats-when-bg   { fill: #f8fafc; }
    .formats-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .formats-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .formats-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .formats-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .formats-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .formats-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .formats-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .formats-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .formats-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .formats-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .formats-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .formats-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .formats-when-row { opacity: 1; }
    .formats-when-r0 { animation-delay: 0.00s; }
    .formats-when-r1 { animation-delay: 0.45s; }
    .formats-when-r2 { animation-delay: 0.90s; }
    .formats-when-r3 { animation-delay: 1.35s; }
    .formats-when-r4 { animation-delay: 1.80s; }
    .formats-when-row { animation: formats-when-reveal 7.3s ease-in-out infinite; }
    @keyframes formats-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="formats-when-bg" width="980" height="390"/>
  <text class="formats-when-h1"  x="30" y="40">Where SafeTensors is mandatory</text>
  <text class="formats-when-sub" x="30" y="64">And what is never allowed.</text>
  <rect class="formats-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="formats-when-name" x="46" y="122">Require it</text>
  <text class="formats-when-desc" x="46" y="142">Everywhere weights run.</text>
  <text class="formats-when-desc formats-when-row formats-when-r0" x="46" y="182">All production serving workloads</text>
  <text class="formats-when-desc formats-when-row formats-when-r1" x="46" y="216">Cloud deployments</text>
  <text class="formats-when-desc formats-when-row formats-when-r2" x="46" y="250">Shared team registries</text>
  <text class="formats-when-desc formats-when-row formats-when-r3" x="46" y="284">Anything from a public hub</text>
  <text class="formats-when-desc formats-when-row formats-when-r4" x="46" y="318">Verified at admission, not on trust</text>
  <rect class="formats-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="formats-when-name" x="526" y="122">Never permit</text>
  <text class="formats-when-desc" x="526" y="142">Three extensions.</text>
  <text class="formats-when-desc formats-when-row formats-when-r0" x="526" y="182">.pt in a production cluster</text>
  <text class="formats-when-desc formats-when-row formats-when-r1" x="526" y="216">.pkl anywhere near a service</text>
  <text class="formats-when-desc formats-when-row formats-when-r2" x="526" y="250">.bin from an untrusted source</text>
  <text class="formats-when-desc formats-when-row formats-when-r3" x="526" y="284">Convert on ingest, then scan</text>
  <text class="formats-when-desc formats-when-row formats-when-r4" x="526" y="318">A local experiment is not an exception worth making</text>
  <text class="formats-when-sub" x="30" y="372">Treating a public hub download the same as an internally trained artefact is the right default: the pipeline cannot tell them apart, and neither can the attacker who uploaded one.</text>
</svg>
