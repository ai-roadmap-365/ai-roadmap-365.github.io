<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Blameless Post-Mortem Five Whys Root Cause Analysis">
  <title>Blameless Post-Mortem Five Whys Root Cause Analysis</title>
  <defs>
    <style>
      .d342b-bg { fill: #f8fafc; }
      .d342b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d342b-why { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d342b-act { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d342b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d342b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d342b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d342b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d342b-bg" />
  
  <text x="40" y="40" class="d342a-title">Blameless Post-Mortem: Five Whys Framework</text>
  <text x="40" y="65" class="d342a-subtitle">Blameless Post-Mortem Five Whys Root Cause Analysis detailing step-by-step causal investigation from Surface Symptom to Architectural Defect and Preventive Action Items</text>
  
  <!-- Five Whys Chain -->
  <rect x="40" y="110" width="410" height="270" class="d342b-why" />
  <text x="60" y="145" class="d342b-header" fill="#1d4ed8">The Five Whys Investigation</text>
  <text x="60" y="175" class="d342b-text">1. **Why did API crash?** GPU workers threw CUDA OOM.</text>
  <text x="60" y="200" class="d342b-text">2. **Why OOM?** KV cache memory allocation hit 100%.</text>
  <text x="60" y="225" class="d342b-text">3. **Why 100%?** New prompt version doubled context length.</text>
  <text x="60" y="250" class="d342b-text">4. **Why not caught in staging?** Load test used 512-tok inputs.</text>
  <text x="60" y="275" class="d342b-text">5. **Why short inputs?** Benchmark lacked max-context tests.</text>
  <text x="60" y="320" class="d342b-text" font-weight="600" fill="#1d4ed8">Root Cause: Inadequate Long-Context Benchmark</text>
  
  <!-- Action Items -->
  <rect x="480" y="110" width="380" height="270" class="d342b-act" />
  <text x="500" y="145" class="d342b-header" fill="#15803d">Preventive Architectural Action Items</text>
  <text x="500" y="180" class="d342b-text">• **Action 1 (Prevention):** Add 8k context synthetic</text>
  <text x="500" y="200" class="d342b-text">  stress test to CI/CD pipeline before release.</text>
  <text x="500" y="230" class="d342b-text">• **Action 2 (Mitigation):** Configure PagedAttention</text>
  <text x="500" y="250" class="d342b-text">  memory chunk pre-allocation limit at 90% VRAM.</text>
  <text x="500" y="280" class="d342b-text">• **Action 3 (Detection):** Alert on KV cache &gt; 85%.</text>
  <text x="500" y="320" class="d342b-text" font-weight="600" fill="#15803d">Systemic Hardening Complete</text>
</svg>