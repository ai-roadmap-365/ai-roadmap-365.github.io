<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" font-family="system-ui, sans-serif">
  <title>The same kitchen-appliance domain modelled two ways: on the left an inheritance hierarchy where Oven and Toaster are subclasses of HeatingAppliance, itself a subclass of Appliance, with an arrow showing the method resolution order Oven, HeatingAppliance, Appliance, object; on the right a composition object graph where Oven and Toaster each hold their own HeatingElement and Timer objects and delegate work to them</title>
  <rect x="0" y="0" width="900" height="620" fill="#f8fafc"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">One domain, two designs: is-a versus has-a</text>

  <line x1="450" y1="46" x2="450" y2="604" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- ================= LEFT: inheritance ================= -->
  <text x="222" y="70" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d4ed8">INHERITANCE — "an Oven IS-A HeatingAppliance"</text>

  <rect x="122" y="88" width="200" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="222" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Appliance</text>
  <text x="222" y="134" text-anchor="middle" font-size="14" fill="#1a202c">name, watts, describe()</text>

  <line x1="222" y1="148" x2="222" y2="188" stroke="#1a202c" stroke-width="2"/>
  <polygon points="222,188 215,174 229,174" fill="#1a202c"/>
  <text x="292" y="173" text-anchor="middle" font-size="14" fill="#1a202c">subclass of</text>

  <rect x="122" y="188" width="200" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="222" y="212" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">HeatingAppliance</text>
  <text x="222" y="234" text-anchor="middle" font-size="14" fill="#1a202c">max_celsius, heat()</text>

  <line x1="170" y1="248" x2="112" y2="298" stroke="#1a202c" stroke-width="2"/>
  <polygon points="112,298 120,285 128,296" fill="#1a202c"/>
  <line x1="274" y1="248" x2="332" y2="298" stroke="#1a202c" stroke-width="2"/>
  <polygon points="332,298 316,296 324,285" fill="#1a202c"/>

  <rect x="32" y="298" width="160" height="62" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="112" y="322" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Oven</text>
  <text x="112" y="344" text-anchor="middle" font-size="14" fill="#1a202c">capacity, bake()</text>

  <rect x="252" y="298" width="160" height="62" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="332" y="322" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Toaster</text>
  <text x="332" y="344" text-anchor="middle" font-size="14" fill="#1a202c">slots, toast()</text>

  <!-- MRO arrow -->
  <rect x="32" y="392" width="380" height="112" fill="#fef9c3" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="222" y="416" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Attribute lookup walks the MRO</text>
  <text x="222" y="440" text-anchor="middle" font-size="14" fill="#1a202c">Oven.__mro__ =</text>
  <text x="222" y="462" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">Oven &#8594; HeatingAppliance &#8594; Appliance &#8594; object</text>
  <text x="222" y="486" text-anchor="middle" font-size="14" fill="#1a202c">first class that has the name wins; super() = next in line</text>

  <rect x="32" y="522" width="380" height="76" fill="#fee2e2" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="222" y="546" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Cost: tight coupling</text>
  <text x="222" y="568" text-anchor="middle" font-size="14" fill="#1a202c">a change in Appliance reaches every subclass</text>
  <text x="222" y="588" text-anchor="middle" font-size="14" fill="#1a202c">(the fragile base class problem)</text>

  <!-- ================= RIGHT: composition ================= -->
  <text x="678" y="70" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d4ed8">COMPOSITION — "an Oven HAS-A HeatingElement"</text>

  <rect x="500" y="102" width="160" height="62" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="580" y="126" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Oven</text>
  <text x="580" y="148" text-anchor="middle" font-size="14" fill="#1a202c">bake()</text>

  <rect x="700" y="102" width="160" height="62" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="780" y="126" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Toaster</text>
  <text x="780" y="148" text-anchor="middle" font-size="14" fill="#1a202c">toast()</text>

  <!-- delegation arrows -->
  <line x1="560" y1="164" x2="560" y2="252" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="560,252 553,238 567,238" fill="#1d4ed8"/>
  <text x="512" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">has-a</text>

  <line x1="620" y1="164" x2="700" y2="342" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="700,342 686,336 697,327" fill="#1d4ed8"/>
  <text x="672" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">has-a</text>

  <line x1="760" y1="164" x2="640" y2="252" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="640,252 648,238 657,249" fill="#1d4ed8"/>
  <text x="758" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">has-a</text>

  <rect x="500" y="252" width="220" height="62" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="610" y="276" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">HeatingElement</text>
  <text x="610" y="298" text-anchor="middle" font-size="14" fill="#1a202c">watts, heat(celsius)</text>

  <rect x="640" y="342" width="220" height="62" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="750" y="366" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Timer</text>
  <text x="750" y="388" text-anchor="middle" font-size="14" fill="#1a202c">set(minutes)</text>

  <rect x="500" y="432" width="368" height="72" fill="#fef9c3" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="684" y="456" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Delegation, not lookup</text>
  <text x="684" y="478" text-anchor="middle" font-size="14" fill="#1a202c">Oven.bake() calls self.element.heat(...) explicitly</text>
  <text x="684" y="498" text-anchor="middle" font-size="14" fill="#1a202c">no MRO involved; the wiring is visible in the code</text>

  <rect x="500" y="522" width="368" height="76" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="684" y="546" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Benefit: loose coupling</text>
  <text x="684" y="568" text-anchor="middle" font-size="14" fill="#1a202c">swap in a FanElement without touching Oven's parents</text>
  <text x="684" y="588" text-anchor="middle" font-size="14" fill="#1a202c">cost: you write the forwarding methods yourself</text>
</svg>
