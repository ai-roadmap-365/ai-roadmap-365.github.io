<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Views against copies</title>
  <style>
    .views-bg   { fill: #f8fafc; }
    .views-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .views-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .views-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .views-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .views-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .views-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .views-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .views-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .views-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .views-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .views-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .views-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .views-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .views-stage { opacity: 1; }

    .views-s0 { animation-delay: 0.00s; }
    .views-e0 { animation-delay: 0.00s; }
    .views-s1 { animation-delay: 1.28s; }
    .views-e1 { animation-delay: 1.28s; }
    .views-s2 { animation-delay: 2.56s; }
    .views-e2 { animation-delay: 2.56s; }
    .views-s3 { animation-delay: 3.84s; }
    .views-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .views-conn  { animation: views-trace 6.4s ease-in-out infinite; }
      .views-stage { animation: views-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes views-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes views-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .views-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .views-stage { animation: views-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes views-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="views-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="views-bg" width="980" height="322"/>
  <text class="views-h1"  x="30" y="40">Views against copies</text>
  <text class="views-sub" x="30" y="64">Four steps.</text>
  <g class="views-stage views-s0">
    <rect class="views-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="views-step" x="44" y="142">01</text>
    <text class="views-name" x="70" y="142">Reshaping usually returns a view</text>
    <text class="views-desc" x="44" y="166">The same data, read differently.</text>
  </g>
  <line class="views-line views-conn views-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#views-tip)"/>
  <g class="views-stage views-s1">
    <rect class="views-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="views-step" x="280" y="142">02</text>
    <text class="views-name" x="306" y="142">Which shares memory with the original</text>
    <text class="views-desc" x="280" y="166">No data is duplicated.</text>
  </g>
  <line class="views-line views-conn views-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#views-tip)"/>
  <g class="views-stage views-s2">
    <rect class="views-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="views-step" x="516" y="142">03</text>
    <text class="views-name" x="542" y="142">So modifying the view modifies the original</text>
    <text class="views-desc" x="516" y="166">Which surprises people, once.</text>
  </g>
  <line class="views-line views-conn views-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#views-tip)"/>
  <g class="views-stage views-s3">
    <rect class="views-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="views-step" x="752" y="142">04</text>
    <text class="views-name" x="778" y="142">Copy explicitly when you need independence</text>
    <text class="views-desc" x="752" y="166">Which is cheap to say and</text>
    <text class="views-desc" x="752" y="182">expensive to forget.</text>
  </g>
  <text class="views-sub" x="30" y="304">This is a genuine source of bugs in training loops, where an in-place modification propagates somewhere the author did not expect.</text>
</svg>
