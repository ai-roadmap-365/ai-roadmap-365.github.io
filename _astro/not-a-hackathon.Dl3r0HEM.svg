<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One about method, one about target.">
  <title>Two misconceptions</title>
  <style>
    .not-a-hackathon-bg   { fill: #f8fafc; }
    .not-a-hackathon-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-hackathon-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-hackathon-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-hackathon-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-hackathon-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-hackathon-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-a-hackathon-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .not-a-hackathon-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .not-a-hackathon-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .not-a-hackathon-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .not-a-hackathon-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .not-a-hackathon-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-a-hackathon-row { opacity: 1; }
    .not-a-hackathon-r0 { animation-delay: 0.00s; }
    .not-a-hackathon-r1 { animation-delay: 0.45s; }
    .not-a-hackathon-r2 { animation-delay: 0.90s; }
    .not-a-hackathon-r3 { animation-delay: 1.35s; }
    .not-a-hackathon-r4 { animation-delay: 1.80s; }
    .not-a-hackathon-row { animation: not-a-hackathon-reveal 7.3s ease-in-out infinite; }
    @keyframes not-a-hackathon-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="not-a-hackathon-bg" width="980" height="390"/>
  <text class="not-a-hackathon-h1"  x="30" y="40">Two misconceptions</text>
  <text class="not-a-hackathon-sub" x="30" y="64">One about method, one about target.</text>
  <rect class="not-a-hackathon-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="not-a-hackathon-name" x="46" y="122">What it is</text>
  <text class="not-a-hackathon-desc" x="46" y="142">Systematic and measured.</text>
  <text class="not-a-hackathon-desc not-a-hackathon-row not-a-hackathon-r0" x="46" y="182">Adversarial suites across defined categories</text>
  <text class="not-a-hackathon-desc not-a-hackathon-row not-a-hackathon-r1" x="46" y="216">Attacker-judge loops generating candidates</text>
  <text class="not-a-hackathon-desc not-a-hackathon-row not-a-hackathon-r2" x="46" y="250">Multi-turn conversational probing</text>
  <text class="not-a-hackathon-desc not-a-hackathon-row not-a-hackathon-r3" x="46" y="284">Attack Success Rate as a number</text>
  <text class="not-a-hackathon-desc not-a-hackathon-row not-a-hackathon-r4" x="46" y="318">Run on every release</text>
  <rect class="not-a-hackathon-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="not-a-hackathon-name" x="526" y="122">What it is not</text>
  <text class="not-a-hackathon-desc" x="526" y="142">Two misconceptions.</text>
  <text class="not-a-hackathon-desc not-a-hackathon-row not-a-hackathon-r0" x="526" y="182">A one-off hackathon with random inputs</text>
  <text class="not-a-hackathon-desc not-a-hackathon-row not-a-hackathon-r1" x="526" y="216">No coverage, no metric, no repeat</text>
  <text class="not-a-hackathon-desc not-a-hackathon-row not-a-hackathon-r2" x="526" y="250">A denial-of-service attack on infrastructure</text>
  <text class="not-a-hackathon-desc not-a-hackathon-row not-a-hackathon-r3" x="526" y="284">This is about model behaviour</text>
  <text class="not-a-hackathon-desc not-a-hackathon-row not-a-hackathon-r4" x="526" y="318">Not about availability</text>
  <text class="not-a-hackathon-sub" x="30" y="372">The hackathon produces anecdotes and the suite produces a trendline, which is the difference between knowing a jailbreak exists and knowing whether last week's fix worked.</text>
</svg>
