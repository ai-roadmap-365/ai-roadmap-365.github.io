<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are risks.">
  <title>Four consequences of doubles</title>
  <style>
    .mock-implications-bg   { fill: #f8fafc; }
    .mock-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mock-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mock-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mock-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mock-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mock-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mock-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mock-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mock-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mock-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mock-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mock-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .mock-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .mock-implications-stage { opacity: 1; }

    .mock-implications-s0 { animation-delay: 0.00s; }
    .mock-implications-e0 { animation-delay: 0.00s; }
    .mock-implications-s1 { animation-delay: 1.28s; }
    .mock-implications-e1 { animation-delay: 1.28s; }
    .mock-implications-s2 { animation-delay: 2.56s; }
    .mock-implications-e2 { animation-delay: 2.56s; }
    .mock-implications-s3 { animation-delay: 3.84s; }
    .mock-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .mock-implications-conn  { animation: mock-implications-trace 6.4s ease-in-out infinite; }
      .mock-implications-stage { animation: mock-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes mock-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes mock-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .mock-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .mock-implications-stage { animation: mock-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes mock-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="mock-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="mock-implications-bg" width="980" height="322"/>
  <text class="mock-implications-h1"  x="30" y="40">Four consequences of doubles</text>
  <text class="mock-implications-sub" x="30" y="64">Two are risks.</text>
  <g class="mock-implications-stage mock-implications-s0">
    <rect class="mock-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="mock-implications-step" x="44" y="142">01</text>
    <text class="mock-implications-name" x="70" y="142">Tests become fast and free to run</text>
    <text class="mock-implications-desc" x="44" y="166">Which is what allows them to run</text>
    <text class="mock-implications-desc" x="44" y="182">constantly.</text>
  </g>
  <line class="mock-implications-line mock-implications-conn mock-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#mock-implications-tip)"/>
  <g class="mock-implications-stage mock-implications-s1">
    <rect class="mock-implications-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="mock-implications-step" x="280" y="142">02</text>
    <text class="mock-implications-name" x="306" y="142">And deterministic, so failures mean something</text>
    <text class="mock-implications-desc" x="280" y="166">Rather than being retried.</text>
  </g>
  <line class="mock-implications-line mock-implications-conn mock-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#mock-implications-tip)"/>
  <g class="mock-implications-stage mock-implications-s2">
    <rect class="mock-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="mock-implications-step" x="516" y="142">03</text>
    <text class="mock-implications-name" x="542" y="142">But interaction mocks couple to call structure</text>
    <text class="mock-implications-desc" x="516" y="166">Breaking on harmless refactors.</text>
  </g>
  <line class="mock-implications-line mock-implications-conn mock-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#mock-implications-tip)"/>
  <g class="mock-implications-stage mock-implications-s3">
    <rect class="mock-implications-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="mock-implications-step" x="752" y="142">04</text>
    <text class="mock-implications-name" x="778" y="142">And doubles drift from the real service</text>
    <text class="mock-implications-desc" x="752" y="166">So keep a small set of</text>
    <text class="mock-implications-desc" x="752" y="182">integration tests.</text>
  </g>
  <text class="mock-implications-sub" x="30" y="304">Keeping a handful of real integration tests is the guard against drift: they are slow and few, and they catch the mismatch that unit tests structurally cannot.</text>
</svg>
