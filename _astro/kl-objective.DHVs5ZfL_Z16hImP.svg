<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>The objective</title>
  <style>
    .kl-objective-bg   { fill: #f8fafc; }
    .kl-objective-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kl-objective-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kl-objective-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kl-objective-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kl-objective-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kl-objective-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kl-objective-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .kl-objective-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .kl-objective-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .kl-objective-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .kl-objective-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .kl-objective-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .kl-objective-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .kl-objective-stage { opacity: 1; }

    .kl-objective-s0 { animation-delay: 0.00s; }
    .kl-objective-e0 { animation-delay: 0.00s; }
    .kl-objective-s1 { animation-delay: 1.28s; }
    .kl-objective-e1 { animation-delay: 1.28s; }
    .kl-objective-s2 { animation-delay: 2.56s; }
    .kl-objective-e2 { animation-delay: 2.56s; }
    .kl-objective-s3 { animation-delay: 3.84s; }
    .kl-objective-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .kl-objective-conn  { animation: kl-objective-trace 6.4s ease-in-out infinite; }
      .kl-objective-stage { animation: kl-objective-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes kl-objective-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes kl-objective-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .kl-objective-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .kl-objective-stage { animation: kl-objective-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes kl-objective-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="kl-objective-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="kl-objective-bg" width="980" height="322"/>
  <text class="kl-objective-h1"  x="30" y="40">The objective</text>
  <text class="kl-objective-sub" x="30" y="64">Four properties.</text>
  <g class="kl-objective-stage kl-objective-s0">
    <rect class="kl-objective-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="kl-objective-step" x="44" y="142">01</text>
    <text class="kl-objective-name" x="70" y="142">Compare the high and low dimensional distributions</text>
    <text class="kl-objective-desc" x="44" y="166">With a divergence measure.</text>
  </g>
  <line class="kl-objective-line kl-objective-conn kl-objective-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#kl-objective-tip)"/>
  <g class="kl-objective-stage kl-objective-s1">
    <rect class="kl-objective-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="kl-objective-step" x="280" y="142">02</text>
    <text class="kl-objective-name" x="306" y="142">Which is asymmetric</text>
    <text class="kl-objective-desc" x="280" y="166">Penalising some errors far more</text>
    <text class="kl-objective-desc" x="280" y="182">than others.</text>
  </g>
  <line class="kl-objective-line kl-objective-conn kl-objective-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#kl-objective-tip)"/>
  <g class="kl-objective-stage kl-objective-s2">
    <rect class="kl-objective-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="kl-objective-step" x="516" y="142">03</text>
    <text class="kl-objective-name" x="542" y="142">Placing true neighbours far apart is punished heavily</text>
    <text class="kl-objective-desc" x="516" y="166">Placing distant points near is</text>
    <text class="kl-objective-desc" x="516" y="182">barely punished.</text>
  </g>
  <line class="kl-objective-line kl-objective-conn kl-objective-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#kl-objective-tip)"/>
  <g class="kl-objective-stage kl-objective-s3">
    <rect class="kl-objective-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="kl-objective-step" x="752" y="142">04</text>
    <text class="kl-objective-name" x="778" y="142">So local structure is preserved and global is not</text>
    <text class="kl-objective-desc" x="752" y="166">Which is the method's defining</text>
    <text class="kl-objective-desc" x="752" y="182">behaviour.</text>
  </g>
  <text class="kl-objective-sub" x="30" y="304">The asymmetry is the mathematical reason global distances mean nothing in these plots, so this is not a limitation to work around but the design itself.</text>
</svg>
