<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Microseconds of pure overhead, plus a tax you cannot see.">
  <title>What a context switch actually costs</title>
  <style>
    .context-switch-cost-bg   { fill: #f8fafc; }
    .context-switch-cost-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .context-switch-cost-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .context-switch-cost-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .context-switch-cost-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .context-switch-cost-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .context-switch-cost-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .context-switch-cost-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .context-switch-cost-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .context-switch-cost-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .context-switch-cost-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .context-switch-cost-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .context-switch-cost-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .context-switch-cost-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .context-switch-cost-stage { opacity: 1; }

    .context-switch-cost-s0 { animation-delay: 0.00s; }
    .context-switch-cost-e0 { animation-delay: 0.00s; }
    .context-switch-cost-s1 { animation-delay: 1.33s; }
    .context-switch-cost-e1 { animation-delay: 1.33s; }
    .context-switch-cost-s2 { animation-delay: 2.67s; }
    .context-switch-cost-e2 { animation-delay: 2.67s; }
    .context-switch-cost-s3 { animation-delay: 4.00s; }
    .context-switch-cost-e3 { animation-delay: 4.00s; }
    .context-switch-cost-s4 { animation-delay: 5.33s; }
    .context-switch-cost-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .context-switch-cost-conn  { animation: context-switch-cost-trace 8s ease-in-out infinite; }
      .context-switch-cost-stage { animation: context-switch-cost-arrive 8s ease-in-out infinite; }
    }
    @keyframes context-switch-cost-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes context-switch-cost-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .context-switch-cost-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .context-switch-cost-stage { animation: context-switch-cost-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes context-switch-cost-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="context-switch-cost-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="context-switch-cost-bg" width="980" height="322"/>
  <text class="context-switch-cost-h1"  x="30" y="40">What a context switch actually costs</text>
  <text class="context-switch-cost-sub" x="30" y="64">Microseconds of pure overhead, plus a tax you cannot see.</text>
  <g class="context-switch-cost-stage context-switch-cost-s0">
    <rect class="context-switch-cost-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="context-switch-cost-step" x="44" y="142">01</text>
    <text class="context-switch-cost-name" x="70" y="142">The timer fires</text>
    <text class="context-switch-cost-desc" x="44" y="166">Hardware interrupt. The</text>
    <text class="context-switch-cost-desc" x="44" y="182">thread is not asked; it</text>
    <text class="context-switch-cost-desc" x="44" y="198">is stopped.</text>
    <text class="context-switch-cost-edge" x="44" y="242">preemption</text>
  </g>
  <line class="context-switch-cost-line context-switch-cost-conn context-switch-cost-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#context-switch-cost-tip)"/>
  <g class="context-switch-cost-stage context-switch-cost-s1">
    <rect class="context-switch-cost-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="context-switch-cost-step" x="233" y="142">02</text>
    <text class="context-switch-cost-name" x="259" y="142">Save the outgoing state</text>
    <text class="context-switch-cost-desc" x="233" y="166">Program counter,</text>
    <text class="context-switch-cost-desc" x="233" y="182">registers, stack pointer</text>
    <text class="context-switch-cost-desc" x="233" y="198">— all into memory.</text>
  </g>
  <line class="context-switch-cost-line context-switch-cost-conn context-switch-cost-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#context-switch-cost-tip)"/>
  <g class="context-switch-cost-stage context-switch-cost-s2">
    <rect class="context-switch-cost-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="context-switch-cost-step" x="422" y="142">03</text>
    <text class="context-switch-cost-name" x="448" y="142">The scheduler chooses</text>
    <text class="context-switch-cost-desc" x="422" y="166">Next ready thread, by</text>
    <text class="context-switch-cost-desc" x="422" y="182">policy and priority.</text>
  </g>
  <line class="context-switch-cost-line context-switch-cost-conn context-switch-cost-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#context-switch-cost-tip)"/>
  <g class="context-switch-cost-stage context-switch-cost-s3">
    <rect class="context-switch-cost-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="context-switch-cost-step" x="611" y="142">04</text>
    <text class="context-switch-cost-name" x="637" y="142">Load the incoming state</text>
    <text class="context-switch-cost-desc" x="611" y="166">It resumes exactly where</text>
    <text class="context-switch-cost-desc" x="611" y="182">it froze,</text>
    <text class="context-switch-cost-desc" x="611" y="198">mid-computation, none the</text>
  </g>
  <line class="context-switch-cost-line context-switch-cost-conn context-switch-cost-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#context-switch-cost-tip)"/>
  <g class="context-switch-cost-stage context-switch-cost-s4">
    <rect class="context-switch-cost-warn" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="context-switch-cost-step" x="800" y="142">05</text>
    <text class="context-switch-cost-name" x="826" y="142">The cache is cold</text>
    <text class="context-switch-cost-desc" x="800" y="166">The new thread finds the</text>
    <text class="context-switch-cost-desc" x="800" y="182">caches full of someone</text>
    <text class="context-switch-cost-desc" x="800" y="198">else's data.</text>
    <text class="context-switch-cost-edge" x="800" y="242">hidden tax</text>
  </g>
  <text class="context-switch-cost-sub" x="30" y="304">Thousands per second are fine. Spawn far more busy threads than cores and the machine spends its life switching instead of working.</text>
</svg>
