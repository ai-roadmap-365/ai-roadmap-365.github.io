<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Architecture and batch size decide.">
  <title>Which mechanism, and when</title>
  <style>
    .regularisation-when-bg   { fill: #f8fafc; }
    .regularisation-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regularisation-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regularisation-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regularisation-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regularisation-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regularisation-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .regularisation-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .regularisation-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .regularisation-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .regularisation-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .regularisation-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .regularisation-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .regularisation-when-row { opacity: 1; }
    .regularisation-when-r0 { animation-delay: 0.00s; }
    .regularisation-when-r1 { animation-delay: 0.45s; }
    .regularisation-when-r2 { animation-delay: 0.90s; }
    .regularisation-when-r3 { animation-delay: 1.35s; }
    .regularisation-when-r4 { animation-delay: 1.80s; }
    .regularisation-when-row { animation: regularisation-when-reveal 7.3s ease-in-out infinite; }
    @keyframes regularisation-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="regularisation-when-bg" width="980" height="390"/>
  <text class="regularisation-when-h1"  x="30" y="40">Which mechanism, and when</text>
  <text class="regularisation-when-sub" x="30" y="64">Architecture and batch size decide.</text>
  <rect class="regularisation-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="regularisation-when-name" x="46" y="122">Vision, large batches</text>
  <text class="regularisation-when-desc" x="46" y="142">BatchNorm.</text>
  <text class="regularisation-when-desc regularisation-when-row regularisation-when-r0" x="46" y="182">Convolutional networks</text>
  <text class="regularisation-when-desc regularisation-when-row regularisation-when-r1" x="46" y="216">Batch sizes in the tens or hundreds</text>
  <text class="regularisation-when-desc regularisation-when-row regularisation-when-r2" x="46" y="250">Dropout less common in modern convnets</text>
  <text class="regularisation-when-desc regularisation-when-row regularisation-when-r3" x="46" y="284">Weight decay and augmentation instead</text>
  <text class="regularisation-when-desc regularisation-when-row regularisation-when-r4" x="46" y="318">GroupNorm when batches are tiny</text>
  <rect class="regularisation-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="regularisation-when-name" x="526" y="122">Sequences and transformers</text>
  <text class="regularisation-when-desc" x="526" y="142">LayerNorm.</text>
  <text class="regularisation-when-desc regularisation-when-row regularisation-when-r0" x="526" y="182">Variable-length inputs</text>
  <text class="regularisation-when-desc regularisation-when-row regularisation-when-r1" x="526" y="216">Batch size independent</text>
  <text class="regularisation-when-desc regularisation-when-row regularisation-when-r2" x="526" y="250">Dropout inside attention and feedforward blocks</text>
  <text class="regularisation-when-desc regularisation-when-row regularisation-when-r3" x="526" y="284">Label smoothing on classification heads</text>
  <text class="regularisation-when-desc regularisation-when-row regularisation-when-r4" x="526" y="318">And weight decay on matrices only</text>
  <text class="regularisation-when-sub" x="30" y="372">Modern convolutional architectures use far less dropout than early ones did, which is worth knowing before copying an old recipe: normalisation and augmentation absorbed much of the regularising work.</text>
</svg>
