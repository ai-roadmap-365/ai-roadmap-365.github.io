<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which is why it beats a dense layer.">
  <title>Three assumptions convolution encodes</title>
  <style>
    .conv-assumptions-bg   { fill: #f8fafc; }
    .conv-assumptions-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-assumptions-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-assumptions-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-assumptions-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-assumptions-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-assumptions-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .conv-assumptions-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .conv-assumptions-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .conv-assumptions-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .conv-assumptions-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .conv-assumptions-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .conv-assumptions-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .conv-assumptions-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .conv-assumptions-stage { opacity: 1; }

    .conv-assumptions-s0 { animation-delay: 0.00s; }
    .conv-assumptions-e0 { animation-delay: 0.00s; }
    .conv-assumptions-s1 { animation-delay: 1.50s; }
    .conv-assumptions-e1 { animation-delay: 1.50s; }
    .conv-assumptions-s2 { animation-delay: 3.00s; }
    .conv-assumptions-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .conv-assumptions-conn  { animation: conv-assumptions-trace 6s ease-in-out infinite; }
      .conv-assumptions-stage { animation: conv-assumptions-arrive 6s ease-in-out infinite; }
    }
    @keyframes conv-assumptions-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes conv-assumptions-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .conv-assumptions-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .conv-assumptions-stage { animation: conv-assumptions-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes conv-assumptions-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="conv-assumptions-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="conv-assumptions-bg" width="980" height="322"/>
  <text class="conv-assumptions-h1"  x="30" y="40">Three assumptions convolution encodes</text>
  <text class="conv-assumptions-sub" x="30" y="64">Which is why it beats a dense layer.</text>
  <g class="conv-assumptions-stage conv-assumptions-s0">
    <rect class="conv-assumptions-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="conv-assumptions-step" x="44" y="142">01</text>
    <text class="conv-assumptions-name" x="70" y="142">Locality</text>
    <text class="conv-assumptions-desc" x="44" y="166">Nearby pixels are related; distant ones</text>
    <text class="conv-assumptions-desc" x="44" y="182">mostly are not. A small window suffices.</text>
  </g>
  <line class="conv-assumptions-line conv-assumptions-conn conv-assumptions-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#conv-assumptions-tip)"/>
  <g class="conv-assumptions-stage conv-assumptions-s1">
    <rect class="conv-assumptions-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="conv-assumptions-step" x="359" y="142">02</text>
    <text class="conv-assumptions-name" x="385" y="142">Weight sharing</text>
    <text class="conv-assumptions-desc" x="359" y="166">A useful feature is useful anywhere, so one</text>
    <text class="conv-assumptions-desc" x="359" y="182">kernel serves every position.</text>
    <text class="conv-assumptions-edge" x="359" y="242">parameters</text>
  </g>
  <line class="conv-assumptions-line conv-assumptions-conn conv-assumptions-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#conv-assumptions-tip)"/>
  <g class="conv-assumptions-stage conv-assumptions-s2">
    <rect class="conv-assumptions-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="conv-assumptions-step" x="674" y="142">03</text>
    <text class="conv-assumptions-name" x="700" y="142">Translation equivariance</text>
    <text class="conv-assumptions-desc" x="674" y="166">Shift the input, and the output shifts by the</text>
    <text class="conv-assumptions-desc" x="674" y="182">same amount.</text>
  </g>
  <text class="conv-assumptions-sub" x="30" y="304">These are assumptions rather than universal truths, and their correctness on images is exactly why a convolutional network needs far fewer parameters than a dense one for better accuracy.</text>
</svg>
