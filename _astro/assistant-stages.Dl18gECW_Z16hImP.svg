<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The constraints are the design.">
  <title>Four stages, and their constraints</title>
  <style>
    .assistant-stages-bg   { fill: #f8fafc; }
    .assistant-stages-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assistant-stages-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assistant-stages-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assistant-stages-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assistant-stages-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assistant-stages-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .assistant-stages-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .assistant-stages-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .assistant-stages-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .assistant-stages-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .assistant-stages-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .assistant-stages-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .assistant-stages-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .assistant-stages-stage { opacity: 1; }

    .assistant-stages-s0 { animation-delay: 0.00s; }
    .assistant-stages-e0 { animation-delay: 0.00s; }
    .assistant-stages-s1 { animation-delay: 1.28s; }
    .assistant-stages-e1 { animation-delay: 1.28s; }
    .assistant-stages-s2 { animation-delay: 2.56s; }
    .assistant-stages-e2 { animation-delay: 2.56s; }
    .assistant-stages-s3 { animation-delay: 3.84s; }
    .assistant-stages-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .assistant-stages-conn  { animation: assistant-stages-trace 6.4s ease-in-out infinite; }
      .assistant-stages-stage { animation: assistant-stages-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes assistant-stages-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes assistant-stages-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .assistant-stages-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .assistant-stages-stage { animation: assistant-stages-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes assistant-stages-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="assistant-stages-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="assistant-stages-bg" width="980" height="322"/>
  <text class="assistant-stages-h1"  x="30" y="40">Four stages, and their constraints</text>
  <text class="assistant-stages-sub" x="30" y="64">The constraints are the design.</text>
  <g class="assistant-stages-stage assistant-stages-s0">
    <rect class="assistant-stages-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="assistant-stages-step" x="44" y="142">01</text>
    <text class="assistant-stages-name" x="70" y="142">Ingest</text>
    <text class="assistant-stages-desc" x="44" y="166">Above the cursor, in order. A</text>
    <text class="assistant-stages-desc" x="44" y="182">dead letter advances the cursor</text>
    <text class="assistant-stages-desc" x="44" y="198">anyway.</text>
    <text class="assistant-stages-edge" x="44" y="242">or retried forever</text>
  </g>
  <line class="assistant-stages-line assistant-stages-conn assistant-stages-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#assistant-stages-tip)"/>
  <g class="assistant-stages-stage assistant-stages-s1">
    <rect class="assistant-stages-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="assistant-stages-step" x="280" y="142">02</text>
    <text class="assistant-stages-name" x="306" y="142">Redact before chunking</text>
    <text class="assistant-stages-desc" x="280" y="166">So no vector in the index</text>
    <text class="assistant-stages-desc" x="280" y="182">contains an identifier.</text>
  </g>
  <line class="assistant-stages-line assistant-stages-conn assistant-stages-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#assistant-stages-tip)"/>
  <g class="assistant-stages-stage assistant-stages-s2">
    <rect class="assistant-stages-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="assistant-stages-step" x="516" y="142">03</text>
    <text class="assistant-stages-name" x="542" y="142">Retrieve, and charge the ledger</text>
    <text class="assistant-stages-desc" x="516" y="166">Which puts recall and generation</text>
    <text class="assistant-stages-desc" x="516" y="182">in competition for one budget.</text>
  </g>
  <line class="assistant-stages-line assistant-stages-conn assistant-stages-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#assistant-stages-tip)"/>
  <g class="assistant-stages-stage assistant-stages-s3">
    <rect class="assistant-stages-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="assistant-stages-step" x="752" y="142">04</text>
    <text class="assistant-stages-name" x="778" y="142">Answer, then erase provably</text>
    <text class="assistant-stages-desc" x="752" y="166">Cap before recording; erase</text>
    <text class="assistant-stages-desc" x="752" y="182">chunks, hash and cached answers,</text>
    <text class="assistant-stages-desc" x="752" y="198">then read back.</text>
  </g>
  <text class="assistant-stages-sub" x="30" y="304">Advancing the cursor past a dead letter is a small decision with a large effect: without it, the poison document is retried on every run and the pipeline never progresses past it.</text>
</svg>
