<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>Generators</title>
  <style>
    .generators-bg   { fill: #f8fafc; }
    .generators-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .generators-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .generators-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .generators-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .generators-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .generators-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .generators-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .generators-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .generators-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .generators-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .generators-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .generators-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .generators-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .generators-stage { opacity: 1; }

    .generators-s0 { animation-delay: 0.00s; }
    .generators-e0 { animation-delay: 0.00s; }
    .generators-s1 { animation-delay: 1.28s; }
    .generators-e1 { animation-delay: 1.28s; }
    .generators-s2 { animation-delay: 2.56s; }
    .generators-e2 { animation-delay: 2.56s; }
    .generators-s3 { animation-delay: 3.84s; }
    .generators-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .generators-conn  { animation: generators-trace 6.4s ease-in-out infinite; }
      .generators-stage { animation: generators-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes generators-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes generators-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .generators-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .generators-stage { animation: generators-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes generators-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="generators-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="generators-bg" width="980" height="322"/>
  <text class="generators-h1"  x="30" y="40">Generators</text>
  <text class="generators-sub" x="30" y="64">Four properties.</text>
  <g class="generators-stage generators-s0">
    <rect class="generators-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="generators-step" x="44" y="142">01</text>
    <text class="generators-name" x="70" y="142">Items are produced only when asked for</text>
    <text class="generators-desc" x="44" y="166">Nothing is computed in advance.</text>
  </g>
  <line class="generators-line generators-conn generators-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#generators-tip)"/>
  <g class="generators-stage generators-s1">
    <rect class="generators-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="generators-step" x="280" y="142">02</text>
    <text class="generators-name" x="306" y="142">Execution suspends and resumes at each yield</text>
    <text class="generators-desc" x="280" y="166">Keeping local state between</text>
    <text class="generators-desc" x="280" y="182">calls.</text>
  </g>
  <line class="generators-line generators-conn generators-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#generators-tip)"/>
  <g class="generators-stage generators-s2">
    <rect class="generators-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="generators-step" x="516" y="142">03</text>
    <text class="generators-name" x="542" y="142">And it can be consumed only once</text>
    <text class="generators-desc" x="516" y="166">Which surprises people who</text>
    <text class="generators-desc" x="516" y="182">iterate twice.</text>
  </g>
  <line class="generators-line generators-conn generators-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#generators-tip)"/>
  <g class="generators-stage generators-s3">
    <rect class="generators-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="generators-step" x="752" y="142">04</text>
    <text class="generators-name" x="778" y="142">So memory stays constant however long the sequence</text>
    <text class="generators-desc" x="752" y="166">Which is what makes large files</text>
    <text class="generators-desc" x="752" y="182">processable.</text>
    <text class="generators-edge" x="752" y="242">O(1) memory</text>
  </g>
  <text class="generators-sub" x="30" y="304">Single consumption is the property that catches people: a generator that has been iterated is empty, and the second loop silently does nothing.</text>
</svg>
