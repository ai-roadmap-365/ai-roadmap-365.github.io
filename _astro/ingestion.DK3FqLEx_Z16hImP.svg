<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Where the real work is.">
  <title>The ingestion pipeline</title>
  <style>
    .ingestion-bg   { fill: #f8fafc; }
    .ingestion-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ingestion-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ingestion-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ingestion-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ingestion-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ingestion-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ingestion-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ingestion-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ingestion-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ingestion-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ingestion-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ingestion-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .ingestion-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .ingestion-stage { opacity: 1; }

    .ingestion-s0 { animation-delay: 0.00s; }
    .ingestion-e0 { animation-delay: 0.00s; }
    .ingestion-s1 { animation-delay: 1.28s; }
    .ingestion-e1 { animation-delay: 1.28s; }
    .ingestion-s2 { animation-delay: 2.56s; }
    .ingestion-e2 { animation-delay: 2.56s; }
    .ingestion-s3 { animation-delay: 3.84s; }
    .ingestion-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .ingestion-conn  { animation: ingestion-trace 6.4s ease-in-out infinite; }
      .ingestion-stage { animation: ingestion-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes ingestion-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes ingestion-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .ingestion-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ingestion-stage { animation: ingestion-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes ingestion-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ingestion-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="ingestion-bg" width="980" height="322"/>
  <text class="ingestion-h1"  x="30" y="40">The ingestion pipeline</text>
  <text class="ingestion-sub" x="30" y="64">Where the real work is.</text>
  <g class="ingestion-stage ingestion-s0">
    <rect class="ingestion-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="ingestion-step" x="44" y="142">01</text>
    <text class="ingestion-name" x="70" y="142">Handle every format you actually have</text>
    <text class="ingestion-desc" x="44" y="166">Documents, spreadsheets, pages,</text>
    <text class="ingestion-desc" x="44" y="182">scans. Each differently.</text>
  </g>
  <line class="ingestion-line ingestion-conn ingestion-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#ingestion-tip)"/>
  <g class="ingestion-stage ingestion-s1">
    <rect class="ingestion-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="ingestion-step" x="280" y="142">02</text>
    <text class="ingestion-name" x="306" y="142">Extract text, structure and metadata together</text>
    <text class="ingestion-desc" x="280" y="166">Losing structure here cannot be</text>
    <text class="ingestion-desc" x="280" y="182">recovered later.</text>
  </g>
  <line class="ingestion-line ingestion-conn ingestion-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#ingestion-tip)"/>
  <g class="ingestion-stage ingestion-s2">
    <rect class="ingestion-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="ingestion-step" x="516" y="142">03</text>
    <text class="ingestion-name" x="542" y="142">Chunk, embed and index</text>
    <text class="ingestion-desc" x="516" y="166">With source, position and</text>
    <text class="ingestion-desc" x="516" y="182">permissions attached.</text>
  </g>
  <line class="ingestion-line ingestion-conn ingestion-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#ingestion-tip)"/>
  <g class="ingestion-stage ingestion-s3">
    <rect class="ingestion-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="ingestion-step" x="752" y="142">04</text>
    <text class="ingestion-name" x="778" y="142">And update incrementally</text>
    <text class="ingestion-desc" x="752" y="166">By content hash, so unchanged</text>
    <text class="ingestion-desc" x="752" y="182">documents are skipped.</text>
  </g>
  <text class="ingestion-sub" x="30" y="304">Ingestion is consistently underestimated: it is usually more code than the retrieval and generation paths combined, and it is where the quality is actually decided.</text>
</svg>
