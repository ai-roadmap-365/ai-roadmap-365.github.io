<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A small constant that matters.">
  <title>The scaling factor</title>
  <style>
    .vae-scaling-bg   { fill: #f8fafc; }
    .vae-scaling-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vae-scaling-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vae-scaling-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vae-scaling-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vae-scaling-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vae-scaling-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vae-scaling-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .vae-scaling-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .vae-scaling-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .vae-scaling-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .vae-scaling-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .vae-scaling-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .vae-scaling-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .vae-scaling-stage { opacity: 1; }

    .vae-scaling-s0 { animation-delay: 0.00s; }
    .vae-scaling-e0 { animation-delay: 0.00s; }
    .vae-scaling-s1 { animation-delay: 1.28s; }
    .vae-scaling-e1 { animation-delay: 1.28s; }
    .vae-scaling-s2 { animation-delay: 2.56s; }
    .vae-scaling-e2 { animation-delay: 2.56s; }
    .vae-scaling-s3 { animation-delay: 3.84s; }
    .vae-scaling-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .vae-scaling-conn  { animation: vae-scaling-trace 6.4s ease-in-out infinite; }
      .vae-scaling-stage { animation: vae-scaling-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes vae-scaling-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes vae-scaling-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .vae-scaling-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .vae-scaling-stage { animation: vae-scaling-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes vae-scaling-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="vae-scaling-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="vae-scaling-bg" width="980" height="322"/>
  <text class="vae-scaling-h1"  x="30" y="40">The scaling factor</text>
  <text class="vae-scaling-sub" x="30" y="64">A small constant that matters.</text>
  <g class="vae-scaling-stage vae-scaling-s0">
    <rect class="vae-scaling-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="vae-scaling-step" x="44" y="142">01</text>
    <text class="vae-scaling-name" x="70" y="142">The encoder produces latents of some natural scale</text>
    <text class="vae-scaling-desc" x="44" y="166">Which is not the scale the</text>
    <text class="vae-scaling-desc" x="44" y="182">denoiser expects.</text>
  </g>
  <line class="vae-scaling-line vae-scaling-conn vae-scaling-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#vae-scaling-tip)"/>
  <g class="vae-scaling-stage vae-scaling-s1">
    <rect class="vae-scaling-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="vae-scaling-step" x="280" y="142">02</text>
    <text class="vae-scaling-name" x="306" y="142">Diffusion assumes roughly unit variance</text>
    <text class="vae-scaling-desc" x="280" y="166">Its noise schedule is calibrated</text>
    <text class="vae-scaling-desc" x="280" y="182">for it.</text>
  </g>
  <line class="vae-scaling-line vae-scaling-conn vae-scaling-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#vae-scaling-tip)"/>
  <g class="vae-scaling-stage vae-scaling-s2">
    <rect class="vae-scaling-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="vae-scaling-step" x="516" y="142">03</text>
    <text class="vae-scaling-name" x="542" y="142">So multiply by a fixed constant</text>
    <text class="vae-scaling-desc" x="516" y="166">Determined once, per model.</text>
  </g>
  <line class="vae-scaling-line vae-scaling-conn vae-scaling-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#vae-scaling-tip)"/>
  <g class="vae-scaling-stage vae-scaling-s3">
    <rect class="vae-scaling-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="vae-scaling-step" x="752" y="142">04</text>
    <text class="vae-scaling-name" x="778" y="142">Get it wrong and output is noise or grey</text>
    <text class="vae-scaling-desc" x="752" y="166">With no error anywhere.</text>
  </g>
  <text class="vae-scaling-sub" x="30" y="304">This is the kind of constant that is easy to drop when assembling a pipeline by hand, and the resulting failure looks like a broken model rather than a missing multiplication.</text>
</svg>
