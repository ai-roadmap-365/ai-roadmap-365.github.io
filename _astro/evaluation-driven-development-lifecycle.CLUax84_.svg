<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Evaluation Driven Development Lifecycle">
  <title>Evaluation Driven Development Lifecycle</title>
  <defs>
    <style>
      .d309f-bg { fill: #f8fafc; }
      .d309f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d309f-ds { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d309f-run { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d309f-opt { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 8px; }
      .d309f-gate { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d309f-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d309f-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d309f-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d309f-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
      .d309f-loop { stroke: #64748b; stroke-width: 2px; stroke-dasharray: 4,4; fill: none; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d309f-bg" />
  
  <text x="40" y="40" class="d309a-title">The Evaluation-Driven Development (EDD) Flywheel</text>
  <text x="40" y="65" class="d309a-subtitle">Evaluation Driven Development Lifecycle showing Curate Dataset, Run Baseline Eval, Optimize Prompt or Model, Execute Regression Gate, and Deploy</text>
  
  <!-- Step 1: Curate Labeled Dataset -->
  <rect x="40" y="110" width="180" height="260" class="d309f-ds" />
  <text x="55" y="140" class="d309f-header" fill="#1d4ed8">1. Curate Eval Dataset</text>
  <text x="55" y="170" class="d309f-text">• 100+ Labeled examples</text>
  <text x="55" y="190" class="d309f-text">• Edge cases &amp; negatives</text>
  <text x="55" y="210" class="d309f-text">• Ground truth outputs</text>
  <text x="55" y="230" class="d309f-text">• Production telemetry</text>
  <text x="55" y="260" class="d309f-text" font-weight="600">Asset:</text>
  <text x="55" y="280" class="d309f-text">`eval_dataset.jsonl`</text>
  
  <!-- Step 2: Baseline Benchmark -->
  <rect x="250" y="110" width="180" height="260" class="d309f-run" />
  <text x="265" y="140" class="d309f-header" fill="#7e22ce">2. Baseline Benchmark</text>
  <text x="265" y="170" class="d309f-text">• Execute current model</text>
  <text x="265" y="190" class="d309f-text">• Calculate pass rate</text>
  <text x="265" y="210" class="d309f-text">• Record latency &amp; cost</text>
  <text x="265" y="230" class="d309f-text">• Pin baseline metrics</text>
  <text x="265" y="260" class="d309f-text" font-weight="600">Example:</text>
  <text x="265" y="280" class="d309f-text">Accuracy = 74.2%</text>
  
  <!-- Step 3: Iterate & Optimize -->
  <rect x="460" y="110" width="180" height="260" class="d309f-opt" />
  <text x="475" y="140" class="d309f-header" fill="#a16207">3. Iterate &amp; Optimize</text>
  <text x="475" y="170" class="d309f-text">• Refine system prompt</text>
  <text x="475" y="190" class="d309f-text">• Add few-shot examples</text>
  <text x="475" y="210" class="d309f-text">• Switch model provider</text>
  <text x="475" y="230" class="d309f-text">• Fine-tune adapter</text>
  <text x="475" y="260" class="d309f-text" font-weight="600">Action:</text>
  <text x="475" y="280" class="d309f-text">Continuous tuning</text>
  
  <!-- Step 4: Regression Gate & Deploy -->
  <rect x="670" y="110" width="190" height="260" class="d309f-gate" />
  <text x="685" y="140" class="d309f-header" fill="#15803d">4. CI Regression Gate</text>
  <text x="685" y="170" class="d309f-text">• Automated CI test run</text>
  <text x="685" y="190" class="d309f-text">• Accuracy &gt;= 90.0%</text>
  <text x="685" y="210" class="d309f-text">• 0 golden case failures</text>
  <text x="685" y="240" class="d309f-text" font-weight="600">Deploy:</text>
  <text x="685" y="260" class="d309f-text">Confident release to prod</text>
  
  <!-- Loop Arrow -->
  <path d="M 765 240 L 765 340 L 130 340 L 130 240" class="d309f-loop" />
  <text x="400" y="360" class="d309f-text" font-weight="600">Continuous Evaluation Flywheel</text>
</svg>