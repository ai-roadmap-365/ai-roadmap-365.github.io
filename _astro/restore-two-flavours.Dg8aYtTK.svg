<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One flag apart, and one of them is destructive.">
  <title>Two "I changed my mind" situations</title>
  <style>
    .restore-two-flavours-bg   { fill: #f8fafc; }
    .restore-two-flavours-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .restore-two-flavours-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .restore-two-flavours-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .restore-two-flavours-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .restore-two-flavours-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .restore-two-flavours-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .restore-two-flavours-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .restore-two-flavours-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .restore-two-flavours-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .restore-two-flavours-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .restore-two-flavours-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .restore-two-flavours-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .restore-two-flavours-row { opacity: 1; }
    .restore-two-flavours-r0 { animation-delay: 0.00s; }
    .restore-two-flavours-r1 { animation-delay: 0.45s; }
    .restore-two-flavours-r2 { animation-delay: 0.90s; }
    .restore-two-flavours-r3 { animation-delay: 1.35s; }
    .restore-two-flavours-r4 { animation-delay: 1.80s; }
    .restore-two-flavours-row { animation: restore-two-flavours-reveal 7.3s ease-in-out infinite; }
    @keyframes restore-two-flavours-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="restore-two-flavours-bg" width="980" height="390"/>
  <text class="restore-two-flavours-h1"  x="30" y="40">Two "I changed my mind" situations</text>
  <text class="restore-two-flavours-sub" x="30" y="64">One flag apart, and one of them is destructive.</text>
  <rect class="restore-two-flavours-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="restore-two-flavours-name" x="46" y="122">git restore --staged file</text>
  <text class="restore-two-flavours-desc" x="46" y="142">Take it out of the index.</text>
  <text class="restore-two-flavours-desc restore-two-flavours-row restore-two-flavours-r0" x="46" y="182">The file leaves the staging area</text>
  <text class="restore-two-flavours-desc restore-two-flavours-row restore-two-flavours-r1" x="46" y="216">Your edits stay on disk, untouched</text>
  <text class="restore-two-flavours-desc restore-two-flavours-row restore-two-flavours-r2" x="46" y="250">Nothing is lost</text>
  <text class="restore-two-flavours-desc restore-two-flavours-row restore-two-flavours-r3" x="46" y="284">Fully reversible — just git add again</text>
  <text class="restore-two-flavours-desc restore-two-flavours-row restore-two-flavours-r4" x="46" y="318">"Not this commit, but keep the work"</text>
  <rect class="restore-two-flavours-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="restore-two-flavours-name" x="526" y="122">git restore file</text>
  <text class="restore-two-flavours-desc" x="526" y="142">Throw the edits away.</text>
  <text class="restore-two-flavours-desc restore-two-flavours-row restore-two-flavours-r0" x="526" y="182">The file snaps back to the last commit</text>
  <text class="restore-two-flavours-desc restore-two-flavours-row restore-two-flavours-r1" x="526" y="216">Your edits are destroyed</text>
  <text class="restore-two-flavours-desc restore-two-flavours-row restore-two-flavours-r2" x="526" y="250">Never committed, so never in the reflog</text>
  <text class="restore-two-flavours-desc restore-two-flavours-row restore-two-flavours-r3" x="526" y="284">Not reversible by anything</text>
  <text class="restore-two-flavours-desc restore-two-flavours-row restore-two-flavours-r4" x="526" y="318">"Undo my typing since the last save"</text>
  <text class="restore-two-flavours-sub" x="30" y="372">Git reports success without a warning for both. The difference is one flag, and it is the difference between keeping your afternoon and losing it.</text>
</svg>
