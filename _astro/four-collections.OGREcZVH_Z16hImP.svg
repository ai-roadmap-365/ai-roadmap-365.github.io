<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Chosen by two questions.">
  <title>Four collections</title>
  <style>
    .four-collections-bg   { fill: #f8fafc; }
    .four-collections-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-collections-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-collections-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-collections-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-collections-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-collections-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .four-collections-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .four-collections-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .four-collections-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .four-collections-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .four-collections-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .four-collections-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .four-collections-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .four-collections-stage { opacity: 1; }

    .four-collections-s0 { animation-delay: 0.00s; }
    .four-collections-e0 { animation-delay: 0.00s; }
    .four-collections-s1 { animation-delay: 1.28s; }
    .four-collections-e1 { animation-delay: 1.28s; }
    .four-collections-s2 { animation-delay: 2.56s; }
    .four-collections-e2 { animation-delay: 2.56s; }
    .four-collections-s3 { animation-delay: 3.84s; }
    .four-collections-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .four-collections-conn  { animation: four-collections-trace 6.4s ease-in-out infinite; }
      .four-collections-stage { animation: four-collections-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes four-collections-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes four-collections-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .four-collections-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .four-collections-stage { animation: four-collections-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes four-collections-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="four-collections-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="four-collections-bg" width="980" height="322"/>
  <text class="four-collections-h1"  x="30" y="40">Four collections</text>
  <text class="four-collections-sub" x="30" y="64">Chosen by two questions.</text>
  <g class="four-collections-stage four-collections-s0">
    <rect class="four-collections-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="four-collections-step" x="44" y="142">01</text>
    <text class="four-collections-name" x="70" y="142">List: ordered, mutable, duplicates allowed</text>
    <text class="four-collections-desc" x="44" y="166">The general-purpose default.</text>
  </g>
  <line class="four-collections-line four-collections-conn four-collections-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#four-collections-tip)"/>
  <g class="four-collections-stage four-collections-s1">
    <rect class="four-collections-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="four-collections-step" x="280" y="142">02</text>
    <text class="four-collections-name" x="306" y="142">Tuple: ordered, immutable</text>
    <text class="four-collections-desc" x="280" y="166">Which makes it hashable and safe</text>
    <text class="four-collections-desc" x="280" y="182">to share.</text>
  </g>
  <line class="four-collections-line four-collections-conn four-collections-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#four-collections-tip)"/>
  <g class="four-collections-stage four-collections-s2">
    <rect class="four-collections-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="four-collections-step" x="516" y="142">03</text>
    <text class="four-collections-name" x="542" y="142">Set: unordered, unique, fast membership</text>
    <text class="four-collections-desc" x="516" y="166">Which is its whole reason for</text>
    <text class="four-collections-desc" x="516" y="182">existing.</text>
  </g>
  <line class="four-collections-line four-collections-conn four-collections-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#four-collections-tip)"/>
  <g class="four-collections-stage four-collections-s3">
    <rect class="four-collections-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="four-collections-step" x="752" y="142">04</text>
    <text class="four-collections-name" x="778" y="142">Dictionary: keyed lookup, ordered, mutable</text>
    <text class="four-collections-desc" x="752" y="166">For anything with a natural key.</text>
  </g>
  <text class="four-collections-sub" x="30" y="304">Two questions settle the choice almost always: does order matter, and is lookup by position, by key, or by membership.</text>
</svg>
