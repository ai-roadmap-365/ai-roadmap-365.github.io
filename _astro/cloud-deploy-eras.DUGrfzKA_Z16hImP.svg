<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each removed a manual step.">
  <title>Three eras of cloud AI deployment</title>
  <style>
    .cloud-deploy-eras-bg   { fill: #f8fafc; }
    .cloud-deploy-eras-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cloud-deploy-eras-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cloud-deploy-eras-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cloud-deploy-eras-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cloud-deploy-eras-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cloud-deploy-eras-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cloud-deploy-eras-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cloud-deploy-eras-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cloud-deploy-eras-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cloud-deploy-eras-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cloud-deploy-eras-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cloud-deploy-eras-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cloud-deploy-eras-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cloud-deploy-eras-stage { opacity: 1; }

    .cloud-deploy-eras-s0 { animation-delay: 0.00s; }
    .cloud-deploy-eras-e0 { animation-delay: 0.00s; }
    .cloud-deploy-eras-s1 { animation-delay: 1.50s; }
    .cloud-deploy-eras-e1 { animation-delay: 1.50s; }
    .cloud-deploy-eras-s2 { animation-delay: 3.00s; }
    .cloud-deploy-eras-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .cloud-deploy-eras-conn  { animation: cloud-deploy-eras-trace 6s ease-in-out infinite; }
      .cloud-deploy-eras-stage { animation: cloud-deploy-eras-arrive 6s ease-in-out infinite; }
    }
    @keyframes cloud-deploy-eras-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cloud-deploy-eras-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cloud-deploy-eras-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cloud-deploy-eras-stage { animation: cloud-deploy-eras-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cloud-deploy-eras-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cloud-deploy-eras-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cloud-deploy-eras-bg" width="980" height="322"/>
  <text class="cloud-deploy-eras-h1"  x="30" y="40">Three eras of cloud AI deployment</text>
  <text class="cloud-deploy-eras-sub" x="30" y="64">Each removed a manual step.</text>
  <g class="cloud-deploy-eras-stage cloud-deploy-eras-s0">
    <rect class="cloud-deploy-eras-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="cloud-deploy-eras-step" x="44" y="142">01</text>
    <text class="cloud-deploy-eras-name" x="70" y="142">Manual VMs, 2016-2019</text>
    <text class="cloud-deploy-eras-desc" x="44" y="166">Launch an instance, install CUDA by shell</text>
    <text class="cloud-deploy-eras-desc" x="44" y="182">script, run Flask in tmux.</text>
    <text class="cloud-deploy-eras-edge" x="44" y="242">hours to rebuild</text>
  </g>
  <line class="cloud-deploy-eras-line cloud-deploy-eras-conn cloud-deploy-eras-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#cloud-deploy-eras-tip)"/>
  <g class="cloud-deploy-eras-stage cloud-deploy-eras-s1">
    <rect class="cloud-deploy-eras-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="cloud-deploy-eras-step" x="359" y="142">02</text>
    <text class="cloud-deploy-eras-name" x="385" y="142">Containerised platforms, 2020-2023</text>
    <text class="cloud-deploy-eras-desc" x="359" y="166">ECS and Cloud Run standardised the runtime.</text>
    <text class="cloud-deploy-eras-desc" x="359" y="182">GPU still meant a cluster.</text>
  </g>
  <line class="cloud-deploy-eras-line cloud-deploy-eras-conn cloud-deploy-eras-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#cloud-deploy-eras-tip)"/>
  <g class="cloud-deploy-eras-stage cloud-deploy-eras-s2">
    <rect class="cloud-deploy-eras-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="cloud-deploy-eras-step" x="674" y="142">03</text>
    <text class="cloud-deploy-eras-name" x="700" y="142">Serverless GPU, 2024</text>
    <text class="cloud-deploy-eras-desc" x="674" y="166">Native L4 hosting with per-second billing,</text>
    <text class="cloud-deploy-eras-desc" x="674" y="182">codified in Terraform.</text>
    <text class="cloud-deploy-eras-edge" x="674" y="242">scale to zero</text>
  </g>
  <text class="cloud-deploy-eras-sub" x="30" y="304">The third era changes Day 334's arithmetic directly: an idle GPU endpoint used to be the most expensive thing on the bill, and scale-to-zero makes it free, which moves the crossover point substantially.</text>
</svg>
