<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>What the fit statistic is</title>
  <style>
    .r2-precisely-bg   { fill: #f8fafc; }
    .r2-precisely-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .r2-precisely-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .r2-precisely-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .r2-precisely-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .r2-precisely-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .r2-precisely-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .r2-precisely-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .r2-precisely-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .r2-precisely-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .r2-precisely-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .r2-precisely-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .r2-precisely-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .r2-precisely-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .r2-precisely-stage { opacity: 1; }

    .r2-precisely-s0 { animation-delay: 0.00s; }
    .r2-precisely-e0 { animation-delay: 0.00s; }
    .r2-precisely-s1 { animation-delay: 1.28s; }
    .r2-precisely-e1 { animation-delay: 1.28s; }
    .r2-precisely-s2 { animation-delay: 2.56s; }
    .r2-precisely-e2 { animation-delay: 2.56s; }
    .r2-precisely-s3 { animation-delay: 3.84s; }
    .r2-precisely-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .r2-precisely-conn  { animation: r2-precisely-trace 6.4s ease-in-out infinite; }
      .r2-precisely-stage { animation: r2-precisely-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes r2-precisely-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes r2-precisely-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .r2-precisely-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .r2-precisely-stage { animation: r2-precisely-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes r2-precisely-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="r2-precisely-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="r2-precisely-bg" width="980" height="322"/>
  <text class="r2-precisely-h1"  x="30" y="40">What the fit statistic is</text>
  <text class="r2-precisely-sub" x="30" y="64">Four steps.</text>
  <g class="r2-precisely-stage r2-precisely-s0">
    <rect class="r2-precisely-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="r2-precisely-step" x="44" y="142">01</text>
    <text class="r2-precisely-name" x="70" y="142">Compute the model's squared error</text>
    <text class="r2-precisely-desc" x="44" y="166">Summed across the data.</text>
  </g>
  <line class="r2-precisely-line r2-precisely-conn r2-precisely-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#r2-precisely-tip)"/>
  <g class="r2-precisely-stage r2-precisely-s1">
    <rect class="r2-precisely-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="r2-precisely-step" x="280" y="142">02</text>
    <text class="r2-precisely-name" x="306" y="142">And the error of always predicting the mean</text>
    <text class="r2-precisely-desc" x="280" y="166">Which is the baseline.</text>
  </g>
  <line class="r2-precisely-line r2-precisely-conn r2-precisely-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#r2-precisely-tip)"/>
  <g class="r2-precisely-stage r2-precisely-s2">
    <rect class="r2-precisely-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="r2-precisely-step" x="516" y="142">03</text>
    <text class="r2-precisely-name" x="542" y="142">One minus their ratio is the statistic</text>
    <text class="r2-precisely-desc" x="516" y="166">The fraction of variance the</text>
    <text class="r2-precisely-desc" x="516" y="182">model explains.</text>
  </g>
  <line class="r2-precisely-line r2-precisely-conn r2-precisely-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#r2-precisely-tip)"/>
  <g class="r2-precisely-stage r2-precisely-s3">
    <rect class="r2-precisely-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="r2-precisely-step" x="752" y="142">04</text>
    <text class="r2-precisely-name" x="778" y="142">One is perfect, zero equals the mean, and it goes negative</text>
    <text class="r2-precisely-desc" x="752" y="166">Reaching -4.7009 for a bad</text>
    <text class="r2-precisely-desc" x="752" y="182">predictor.</text>
  </g>
  <text class="r2-precisely-sub" x="30" y="304">It is not bounded below by zero, which contradicts the common description of it as a percentage and is demonstrable with any sufficiently poor model.</text>
</svg>
