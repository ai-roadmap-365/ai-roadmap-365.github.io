<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 424" role="img"
     aria-label="Both are real interfaces. They are good at different jobs.">
  <title>Pointing at things, and naming them</title>
  <style>
    .gui-versus-shell-bg   { fill: #f8fafc; }
    .gui-versus-shell-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gui-versus-shell-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gui-versus-shell-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gui-versus-shell-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gui-versus-shell-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gui-versus-shell-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gui-versus-shell-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gui-versus-shell-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gui-versus-shell-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gui-versus-shell-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gui-versus-shell-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gui-versus-shell-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gui-versus-shell-row { opacity: 1; }
    .gui-versus-shell-r0 { animation-delay: 0.00s; }
    .gui-versus-shell-r1 { animation-delay: 0.45s; }
    .gui-versus-shell-r2 { animation-delay: 0.90s; }
    .gui-versus-shell-r3 { animation-delay: 1.35s; }
    .gui-versus-shell-r4 { animation-delay: 1.80s; }
    .gui-versus-shell-r5 { animation-delay: 2.25s; }
    .gui-versus-shell-row { animation: gui-versus-shell-reveal 7.7s ease-in-out infinite; }
    @keyframes gui-versus-shell-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="gui-versus-shell-bg" width="980" height="424"/>
  <text class="gui-versus-shell-h1"  x="30" y="40">Pointing at things, and naming them</text>
  <text class="gui-versus-shell-sub" x="30" y="64">Both are real interfaces. They are good at different jobs.</text>
  <rect class="gui-versus-shell-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="gui-versus-shell-name" x="46" y="122">Graphical interface</text>
  <text class="gui-versus-shell-desc" x="46" y="142">You point at what you want.</text>
  <text class="gui-versus-shell-desc gui-versus-shell-row gui-versus-shell-r0" x="46" y="182">Discoverable — the options are visible</text>
  <text class="gui-versus-shell-desc gui-versus-shell-row gui-versus-shell-r1" x="46" y="216">Excellent for one-off, visual, spatial work</text>
  <text class="gui-versus-shell-desc gui-versus-shell-row gui-versus-shell-r2" x="46" y="250">Hard to repeat exactly</text>
  <text class="gui-versus-shell-desc gui-versus-shell-row gui-versus-shell-r3" x="46" y="284">Hard to describe to someone else</text>
  <text class="gui-versus-shell-desc gui-versus-shell-row gui-versus-shell-r4" x="46" y="318">Renaming 1,000 files means 1,000 clicks</text>
  <text class="gui-versus-shell-desc gui-versus-shell-row gui-versus-shell-r5" x="46" y="352">Cannot easily be scheduled or automated</text>
  <rect class="gui-versus-shell-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="gui-versus-shell-name" x="526" y="122">The shell</text>
  <text class="gui-versus-shell-desc" x="526" y="142">You name what you want.</text>
  <text class="gui-versus-shell-desc gui-versus-shell-row gui-versus-shell-r0" x="526" y="182">Opaque — you must know the name</text>
  <text class="gui-versus-shell-desc gui-versus-shell-row gui-versus-shell-r1" x="526" y="216">Excellent for repeated, precise, bulk work</text>
  <text class="gui-versus-shell-desc gui-versus-shell-row gui-versus-shell-r2" x="526" y="250">Repeats exactly, every time</text>
  <text class="gui-versus-shell-desc gui-versus-shell-row gui-versus-shell-r3" x="526" y="284">A command is shareable as text</text>
  <text class="gui-versus-shell-desc gui-versus-shell-row gui-versus-shell-r4" x="526" y="318">Renaming 1,000 files is one line</text>
  <text class="gui-versus-shell-desc gui-versus-shell-row gui-versus-shell-r5" x="526" y="352">Anything you can type, you can schedule</text>
  <text class="gui-versus-shell-sub" x="30" y="406">This is why every deployment guide, every AI framework's README and every server you rent speaks in commands: text is the only interface that copies, pastes and repeats.</text>
</svg>
