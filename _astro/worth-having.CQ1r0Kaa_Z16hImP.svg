<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>A test worth having</title>
  <style>
    .worth-having-bg   { fill: #f8fafc; }
    .worth-having-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .worth-having-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .worth-having-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .worth-having-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .worth-having-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .worth-having-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .worth-having-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .worth-having-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .worth-having-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .worth-having-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .worth-having-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .worth-having-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .worth-having-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .worth-having-stage { opacity: 1; }

    .worth-having-s0 { animation-delay: 0.00s; }
    .worth-having-e0 { animation-delay: 0.00s; }
    .worth-having-s1 { animation-delay: 1.28s; }
    .worth-having-e1 { animation-delay: 1.28s; }
    .worth-having-s2 { animation-delay: 2.56s; }
    .worth-having-e2 { animation-delay: 2.56s; }
    .worth-having-s3 { animation-delay: 3.84s; }
    .worth-having-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .worth-having-conn  { animation: worth-having-trace 6.4s ease-in-out infinite; }
      .worth-having-stage { animation: worth-having-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes worth-having-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes worth-having-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .worth-having-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .worth-having-stage { animation: worth-having-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes worth-having-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="worth-having-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="worth-having-bg" width="980" height="322"/>
  <text class="worth-having-h1"  x="30" y="40">A test worth having</text>
  <text class="worth-having-sub" x="30" y="64">Four properties.</text>
  <g class="worth-having-stage worth-having-s0">
    <rect class="worth-having-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="worth-having-step" x="44" y="142">01</text>
    <text class="worth-having-name" x="70" y="142">It tests behaviour, not implementation</text>
    <text class="worth-having-desc" x="44" y="166">So a refactor does not break it.</text>
  </g>
  <line class="worth-having-line worth-having-conn worth-having-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#worth-having-tip)"/>
  <g class="worth-having-stage worth-having-s1">
    <rect class="worth-having-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="worth-having-step" x="280" y="142">02</text>
    <text class="worth-having-name" x="306" y="142">It is deterministic</text>
    <text class="worth-having-desc" x="280" y="166">A flaky test is worse than no</text>
    <text class="worth-having-desc" x="280" y="182">test.</text>
  </g>
  <line class="worth-having-line worth-having-conn worth-having-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#worth-having-tip)"/>
  <g class="worth-having-stage worth-having-s2">
    <rect class="worth-having-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="worth-having-step" x="516" y="142">03</text>
    <text class="worth-having-name" x="542" y="142">It is fast enough to run constantly</text>
    <text class="worth-having-desc" x="516" y="166">Or it will not be run.</text>
  </g>
  <line class="worth-having-line worth-having-conn worth-having-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#worth-having-tip)"/>
  <g class="worth-having-stage worth-having-s3">
    <rect class="worth-having-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="worth-having-step" x="752" y="142">04</text>
    <text class="worth-having-name" x="778" y="142">And its failure says what is wrong</text>
    <text class="worth-having-desc" x="752" y="166">From the name and the message</text>
    <text class="worth-having-desc" x="752" y="182">alone.</text>
  </g>
  <text class="worth-having-sub" x="30" y="304">A flaky test being worse than none is worth stating plainly: it trains the team to ignore failures, which destroys the value of the whole suite.</text>
</svg>
