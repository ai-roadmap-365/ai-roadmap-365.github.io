<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Inverse mapping</title>
  <style>
    .inverse-mapping-bg   { fill: #f8fafc; }
    .inverse-mapping-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inverse-mapping-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inverse-mapping-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inverse-mapping-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inverse-mapping-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inverse-mapping-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .inverse-mapping-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .inverse-mapping-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .inverse-mapping-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .inverse-mapping-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .inverse-mapping-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .inverse-mapping-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .inverse-mapping-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .inverse-mapping-stage { opacity: 1; }

    .inverse-mapping-s0 { animation-delay: 0.00s; }
    .inverse-mapping-e0 { animation-delay: 0.00s; }
    .inverse-mapping-s1 { animation-delay: 1.28s; }
    .inverse-mapping-e1 { animation-delay: 1.28s; }
    .inverse-mapping-s2 { animation-delay: 2.56s; }
    .inverse-mapping-e2 { animation-delay: 2.56s; }
    .inverse-mapping-s3 { animation-delay: 3.84s; }
    .inverse-mapping-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .inverse-mapping-conn  { animation: inverse-mapping-trace 6.4s ease-in-out infinite; }
      .inverse-mapping-stage { animation: inverse-mapping-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes inverse-mapping-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes inverse-mapping-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .inverse-mapping-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .inverse-mapping-stage { animation: inverse-mapping-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes inverse-mapping-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="inverse-mapping-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="inverse-mapping-bg" width="980" height="322"/>
  <text class="inverse-mapping-h1"  x="30" y="40">Inverse mapping</text>
  <text class="inverse-mapping-sub" x="30" y="64">Four steps.</text>
  <g class="inverse-mapping-stage inverse-mapping-s0">
    <rect class="inverse-mapping-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="inverse-mapping-step" x="44" y="142">01</text>
    <text class="inverse-mapping-name" x="70" y="142">Loop over output pixels instead</text>
    <text class="inverse-mapping-desc" x="44" y="166">Every one, exactly once.</text>
  </g>
  <line class="inverse-mapping-line inverse-mapping-conn inverse-mapping-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#inverse-mapping-tip)"/>
  <g class="inverse-mapping-stage inverse-mapping-s1">
    <rect class="inverse-mapping-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="inverse-mapping-step" x="280" y="142">02</text>
    <text class="inverse-mapping-name" x="306" y="142">Apply the inverse transformation to find where it came from</text>
    <text class="inverse-mapping-desc" x="280" y="166">In the source image.</text>
  </g>
  <line class="inverse-mapping-line inverse-mapping-conn inverse-mapping-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#inverse-mapping-tip)"/>
  <g class="inverse-mapping-stage inverse-mapping-s2">
    <rect class="inverse-mapping-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="inverse-mapping-step" x="516" y="142">03</text>
    <text class="inverse-mapping-name" x="542" y="142">Sample the source at that position</text>
    <text class="inverse-mapping-desc" x="516" y="166">Interpolating, since it is</text>
    <text class="inverse-mapping-desc" x="516" y="182">between pixels.</text>
  </g>
  <line class="inverse-mapping-line inverse-mapping-conn inverse-mapping-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#inverse-mapping-tip)"/>
  <g class="inverse-mapping-stage inverse-mapping-s3">
    <rect class="inverse-mapping-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="inverse-mapping-step" x="752" y="142">04</text>
    <text class="inverse-mapping-name" x="778" y="142">So every output pixel is filled, by construction</text>
    <text class="inverse-mapping-desc" x="752" y="166">No holes are possible.</text>
  </g>
  <text class="inverse-mapping-sub" x="30" y="304">Iterating over the destination rather than the source is the whole trick, and it guarantees completeness rather than merely making holes unlikely.</text>
</svg>
