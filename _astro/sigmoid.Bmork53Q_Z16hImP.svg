<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties that matter.">
  <title>The sigmoid</title>
  <style>
    .sigmoid-bg   { fill: #f8fafc; }
    .sigmoid-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sigmoid-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sigmoid-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sigmoid-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sigmoid-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sigmoid-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sigmoid-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sigmoid-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sigmoid-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sigmoid-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sigmoid-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sigmoid-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .sigmoid-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .sigmoid-stage { opacity: 1; }

    .sigmoid-s0 { animation-delay: 0.00s; }
    .sigmoid-e0 { animation-delay: 0.00s; }
    .sigmoid-s1 { animation-delay: 1.28s; }
    .sigmoid-e1 { animation-delay: 1.28s; }
    .sigmoid-s2 { animation-delay: 2.56s; }
    .sigmoid-e2 { animation-delay: 2.56s; }
    .sigmoid-s3 { animation-delay: 3.84s; }
    .sigmoid-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .sigmoid-conn  { animation: sigmoid-trace 6.4s ease-in-out infinite; }
      .sigmoid-stage { animation: sigmoid-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes sigmoid-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes sigmoid-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .sigmoid-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .sigmoid-stage { animation: sigmoid-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes sigmoid-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="sigmoid-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="sigmoid-bg" width="980" height="322"/>
  <text class="sigmoid-h1"  x="30" y="40">The sigmoid</text>
  <text class="sigmoid-sub" x="30" y="64">Four properties that matter.</text>
  <g class="sigmoid-stage sigmoid-s0">
    <rect class="sigmoid-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="sigmoid-step" x="44" y="142">01</text>
    <text class="sigmoid-name" x="70" y="142">Maps any real number into zero to one</text>
    <text class="sigmoid-desc" x="44" y="166">Which is what makes the output a</text>
    <text class="sigmoid-desc" x="44" y="182">probability.</text>
  </g>
  <line class="sigmoid-line sigmoid-conn sigmoid-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#sigmoid-tip)"/>
  <g class="sigmoid-stage sigmoid-s1">
    <rect class="sigmoid-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="sigmoid-step" x="280" y="142">02</text>
    <text class="sigmoid-name" x="306" y="142">Passes through one half at zero</text>
    <text class="sigmoid-desc" x="280" y="166">So a zero score is maximum</text>
    <text class="sigmoid-desc" x="280" y="182">uncertainty.</text>
  </g>
  <line class="sigmoid-line sigmoid-conn sigmoid-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#sigmoid-tip)"/>
  <g class="sigmoid-stage sigmoid-s2">
    <rect class="sigmoid-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="sigmoid-step" x="516" y="142">03</text>
    <text class="sigmoid-name" x="542" y="142">Its derivative has a simple closed form</text>
    <text class="sigmoid-desc" x="516" y="166">Which is why the gradient is so</text>
    <text class="sigmoid-desc" x="516" y="182">clean.</text>
  </g>
  <line class="sigmoid-line sigmoid-conn sigmoid-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#sigmoid-tip)"/>
  <g class="sigmoid-stage sigmoid-s3">
    <rect class="sigmoid-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="sigmoid-step" x="752" y="142">04</text>
    <text class="sigmoid-name" x="778" y="142">And it saturates at the extremes</text>
    <text class="sigmoid-desc" x="752" y="166">Where gradients vanish. The same</text>
    <text class="sigmoid-desc" x="752" y="182">problem deep networks have.</text>
  </g>
  <text class="sigmoid-sub" x="30" y="304">Saturation is the property that later drove the move to other activations in deep networks, so it is worth noticing here where it is easy to see.</text>
</svg>
