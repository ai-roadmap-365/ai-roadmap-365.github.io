<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Multi-Tier LLM Caching Hierarchy Flow">
  <title>Multi-Tier LLM Caching Hierarchy Flow</title>
  <defs>
    <style>
      .d320a-bg { fill: #f8fafc; }
      .d320a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d320a-t1 { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d320a-t2 { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d320a-t3 { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 8px; }
      .d320a-t4 { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d320a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d320a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d320a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d320a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d320a-bg" />
  
  <text x="40" y="40" class="d320a-title">Multi-Tier AI Latency &amp; Caching Architecture</text>
  <text x="40" y="65" class="d320a-subtitle">Multi-Tier LLM Caching Hierarchy Flow showing Tier 1 Exact Hash (1ms), Tier 2 Semantic Cache (15ms), Tier 3 Provider Prompt Caching (150ms), and Full Model Inference Fallback (800ms)</text>
  
  <!-- Tier 1: Exact Hash Cache -->
  <rect x="40" y="110" width="180" height="270" class="d320a-t1" />
  <text x="55" y="140" class="d320a-header" fill="#1d4ed8">Tier 1: Exact Hash</text>
  <text x="55" y="170" class="d320a-text">• SHA-256 in Redis</text>
  <text x="55" y="190" class="d320a-text">• Byte-exact match</text>
  <text x="55" y="210" class="d320a-text">• **Latency:** under 1ms</text>
  <text x="55" y="230" class="d320a-text">• **Cost:** $0.00 (100% saved)</text>
  <text x="55" y="260" class="d320a-text" font-weight="600">Hit Rate:</text>
  <text x="55" y="280" class="d320a-text">15-25% common queries</text>
  
  <!-- Tier 2: Semantic Cache -->
  <rect x="250" y="110" width="180" height="270" class="d320a-t2" />
  <text x="265" y="140" class="d320a-header" fill="#7e22ce">Tier 2: Semantic Vector</text>
  <text x="265" y="170" class="d320a-text">• Cosine Sim >= 0.95</text>
  <text x="265" y="190" class="d320a-text">• Paraphrased queries</text>
  <text x="265" y="210" class="d320a-text">• **Latency:** 15ms</text>
  <text x="265" y="230" class="d320a-text">• **Cost:** $0.00 (100% saved)</text>
  <text x="265" y="260" class="d320a-text" font-weight="600">Hit Rate:</text>
  <text x="265" y="280" class="d320a-text">10-18% fuzzy queries</text>
  
  <!-- Tier 3: Provider Prompt Cache -->
  <rect x="460" y="110" width="180" height="270" class="d320a-t3" />
  <text x="475" y="140" class="d320a-header" fill="#a16207">Tier 3: Provider KV</text>
  <text x="475" y="170" class="d320a-text">• Anthropic/OpenAI KV</text>
  <text x="475" y="190" class="d320a-text">• System prompt prefix</text>
  <text x="475" y="210" class="d320a-text">• **Latency:** 150ms TTFT</text>
  <text x="475" y="230" class="d320a-text">• **Cost:** 90% input discount</text>
  <text x="475" y="260" class="d320a-text" font-weight="600">Hit Rate:</text>
  <text x="475" y="280" class="d320a-text">70-90% system context</text>
  
  <!-- Tier 4: Full Inference -->
  <rect x="670" y="110" width="190" height="270" class="d320a-t4" />
  <text x="685" y="140" class="d320a-header" fill="#15803d">Tier 4: Full Model Call</text>
  <text x="685" y="170" class="d320a-text">• Full GPU prefill + decode</text>
  <text x="685" y="190" class="d320a-text">• Novel unique queries</text>
  <text x="685" y="210" class="d320a-text">• **Latency:** 800-2,500ms</text>
  <text x="685" y="230" class="d320a-text">• **Cost:** 100% full price</text>
  <text x="685" y="260" class="d320a-text" font-weight="600">Result:</text>
  <text x="685" y="280" class="d320a-text">Store output in T1 &amp; T2</text>
</svg>