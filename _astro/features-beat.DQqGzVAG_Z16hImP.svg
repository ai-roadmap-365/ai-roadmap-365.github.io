<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Why features beat algorithms</title>
  <style>
    .features-beat-bg   { fill: #f8fafc; }
    .features-beat-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .features-beat-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .features-beat-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .features-beat-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .features-beat-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .features-beat-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .features-beat-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .features-beat-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .features-beat-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .features-beat-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .features-beat-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .features-beat-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .features-beat-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .features-beat-stage { opacity: 1; }

    .features-beat-s0 { animation-delay: 0.00s; }
    .features-beat-e0 { animation-delay: 0.00s; }
    .features-beat-s1 { animation-delay: 1.28s; }
    .features-beat-e1 { animation-delay: 1.28s; }
    .features-beat-s2 { animation-delay: 2.56s; }
    .features-beat-e2 { animation-delay: 2.56s; }
    .features-beat-s3 { animation-delay: 3.84s; }
    .features-beat-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .features-beat-conn  { animation: features-beat-trace 6.4s ease-in-out infinite; }
      .features-beat-stage { animation: features-beat-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes features-beat-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes features-beat-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .features-beat-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .features-beat-stage { animation: features-beat-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes features-beat-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="features-beat-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="features-beat-bg" width="980" height="322"/>
  <text class="features-beat-h1"  x="30" y="40">Why features beat algorithms</text>
  <text class="features-beat-sub" x="30" y="64">Four steps.</text>
  <g class="features-beat-stage features-beat-s0">
    <rect class="features-beat-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="features-beat-step" x="44" y="142">01</text>
    <text class="features-beat-name" x="70" y="142">The features set a ceiling on what any model can achieve</text>
    <text class="features-beat-desc" x="44" y="166">Information absent from them</text>
    <text class="features-beat-desc" x="44" y="182">cannot be recovered.</text>
  </g>
  <line class="features-beat-line features-beat-conn features-beat-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#features-beat-tip)"/>
  <g class="features-beat-stage features-beat-s1">
    <rect class="features-beat-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="features-beat-step" x="280" y="142">02</text>
    <text class="features-beat-name" x="306" y="142">Different models differ by a few points, typically</text>
    <text class="features-beat-desc" x="280" y="166">Once each is reasonably tuned.</text>
  </g>
  <line class="features-beat-line features-beat-conn features-beat-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#features-beat-tip)"/>
  <g class="features-beat-stage features-beat-s2">
    <rect class="features-beat-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="features-beat-step" x="516" y="142">03</text>
    <text class="features-beat-name" x="542" y="142">Different feature sets differ by far more</text>
    <text class="features-beat-desc" x="516" y="166">Sometimes by tens of points.</text>
  </g>
  <line class="features-beat-line features-beat-conn features-beat-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#features-beat-tip)"/>
  <g class="features-beat-stage features-beat-s3">
    <rect class="features-beat-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="features-beat-step" x="752" y="142">04</text>
    <text class="features-beat-name" x="778" y="142">So effort spent on features returns more</text>
    <text class="features-beat-desc" x="752" y="166">Which is the finding, repeated</text>
    <text class="features-beat-desc" x="752" y="182">across decades.</text>
  </g>
  <text class="features-beat-sub" x="30" y="304">The ceiling framing is the precise version: a model cannot recover information that its inputs do not contain, however sophisticated it is.</text>
</svg>
