<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Reading the same megabyte, two ways.">
  <title>Why fast code batches its reads</title>
  <style>
    .syscall-batching-bg   { fill: #f8fafc; }
    .syscall-batching-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .syscall-batching-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .syscall-batching-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .syscall-batching-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .syscall-batching-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .syscall-batching-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .syscall-batching-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .syscall-batching-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .syscall-batching-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .syscall-batching-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .syscall-batching-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .syscall-batching-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .syscall-batching-row { opacity: 1; }
    .syscall-batching-r0 { animation-delay: 0.00s; }
    .syscall-batching-r1 { animation-delay: 0.45s; }
    .syscall-batching-r2 { animation-delay: 0.90s; }
    .syscall-batching-r3 { animation-delay: 1.35s; }
    .syscall-batching-r4 { animation-delay: 1.80s; }
    .syscall-batching-row { animation: syscall-batching-reveal 7.3s ease-in-out infinite; }
    @keyframes syscall-batching-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="syscall-batching-bg" width="980" height="390"/>
  <text class="syscall-batching-h1"  x="30" y="40">Why fast code batches its reads</text>
  <text class="syscall-batching-sub" x="30" y="64">Reading the same megabyte, two ways.</text>
  <rect class="syscall-batching-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="syscall-batching-name" x="46" y="122">One byte per call</text>
  <text class="syscall-batching-desc" x="46" y="142">A system call for every byte.</text>
  <text class="syscall-batching-desc syscall-batching-row syscall-batching-r0" x="46" y="182">1,048,576 boundary crossings</text>
  <text class="syscall-batching-desc syscall-batching-row syscall-batching-r1" x="46" y="216">Mode switch on each one</text>
  <text class="syscall-batching-desc syscall-batching-row syscall-batching-r2" x="46" y="250">The kernel does the same setup a million times</text>
  <text class="syscall-batching-desc syscall-batching-row syscall-batching-r3" x="46" y="284">The copying is trivial; the crossing is not</text>
  <text class="syscall-batching-desc syscall-batching-row syscall-batching-r4" x="46" y="318">Dominated entirely by overhead</text>
  <rect class="syscall-batching-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="syscall-batching-name" x="526" y="122">64 KB per call</text>
  <text class="syscall-batching-desc" x="526" y="142">A system call for every block.</text>
  <text class="syscall-batching-desc syscall-batching-row syscall-batching-r0" x="526" y="182">16 boundary crossings</text>
  <text class="syscall-batching-desc syscall-batching-row syscall-batching-r1" x="526" y="216">Same bytes, same disk, same kernel code</text>
  <text class="syscall-batching-desc syscall-batching-row syscall-batching-r2" x="526" y="250">Setup cost amortised over 65,536 bytes</text>
  <text class="syscall-batching-desc syscall-batching-row syscall-batching-r3" x="526" y="284">Now dominated by the actual I/O</text>
  <text class="syscall-batching-desc syscall-batching-row syscall-batching-r4" x="526" y="318">Orders of magnitude faster</text>
  <text class="syscall-batching-sub" x="30" y="372">This is why a data loader reading a million small files is slow, and why formats that pack many samples into one file are so much faster.</text>
</svg>
