<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One loses your luggage.">
  <title>Two routes to the same place</title>
  <style>
    .two-routes-bg   { fill: #f8fafc; }
    .two-routes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-routes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-routes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-routes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-routes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-routes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .two-routes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .two-routes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .two-routes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .two-routes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .two-routes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .two-routes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .two-routes-row { opacity: 1; }
    .two-routes-r0 { animation-delay: 0.00s; }
    .two-routes-r1 { animation-delay: 0.45s; }
    .two-routes-r2 { animation-delay: 0.90s; }
    .two-routes-r3 { animation-delay: 1.35s; }
    .two-routes-r4 { animation-delay: 1.80s; }
    .two-routes-row { animation: two-routes-reveal 7.3s ease-in-out infinite; }
    @keyframes two-routes-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="two-routes-bg" width="980" height="390"/>
  <text class="two-routes-h1"  x="30" y="40">Two routes to the same place</text>
  <text class="two-routes-sub" x="30" y="64">One loses your luggage.</text>
  <rect class="two-routes-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="two-routes-name" x="46" y="122">The direct route</text>
  <text class="two-routes-desc" x="46" y="142">Shorter on paper.</text>
  <text class="two-routes-desc two-routes-row two-routes-r0" x="46" y="182">Fewer steps to describe</text>
  <text class="two-routes-desc two-routes-row two-routes-r1" x="46" y="216">Mathematically identical destination</text>
  <text class="two-routes-desc two-routes-row two-routes-r2" x="46" y="250">Loses precision at every transfer</text>
  <text class="two-routes-desc two-routes-row two-routes-r3" x="46" y="284">Arrives with the answer degraded</text>
  <text class="two-routes-desc two-routes-row two-routes-r4" x="46" y="318">This is the normal equations</text>
  <rect class="two-routes-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="two-routes-name" x="526" y="122">The careful route</text>
  <text class="two-routes-desc" x="526" y="142">Longer on paper.</text>
  <text class="two-routes-desc two-routes-row two-routes-r0" x="526" y="182">More steps to describe</text>
  <text class="two-routes-desc two-routes-row two-routes-r1" x="526" y="216">The same destination</text>
  <text class="two-routes-desc two-routes-row two-routes-r2" x="526" y="250">Preserves precision throughout</text>
  <text class="two-routes-desc two-routes-row two-routes-r3" x="526" y="284">Arrives with the answer intact</text>
  <text class="two-routes-desc two-routes-row two-routes-r4" x="526" y="318">This is the decomposition</text>
  <text class="two-routes-sub" x="30" y="372">Equivalence on paper and difference in practice is the whole content of numerical analysis, and this lesson is a compact demonstration of why it exists.</text>
</svg>
