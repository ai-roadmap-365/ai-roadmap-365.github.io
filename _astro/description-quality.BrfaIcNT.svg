<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And it is the part beginners skip.">
  <title>The description is the biggest lever</title>
  <style>
    .description-quality-bg   { fill: #f8fafc; }
    .description-quality-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .description-quality-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .description-quality-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .description-quality-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .description-quality-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .description-quality-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .description-quality-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .description-quality-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .description-quality-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .description-quality-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .description-quality-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .description-quality-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .description-quality-row { opacity: 1; }
    .description-quality-r0 { animation-delay: 0.00s; }
    .description-quality-r1 { animation-delay: 0.45s; }
    .description-quality-r2 { animation-delay: 0.90s; }
    .description-quality-r3 { animation-delay: 1.35s; }
    .description-quality-r4 { animation-delay: 1.80s; }
    .description-quality-row { animation: description-quality-reveal 7.3s ease-in-out infinite; }
    @keyframes description-quality-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="description-quality-bg" width="980" height="390"/>
  <text class="description-quality-h1"  x="30" y="40">The description is the biggest lever</text>
  <text class="description-quality-sub" x="30" y="64">And it is the part beginners skip.</text>
  <rect class="description-quality-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="description-quality-name" x="46" y="122">"Fix the thing"</text>
  <text class="description-quality-desc" x="46" y="142">The reviewer starts from nothing.</text>
  <text class="description-quality-desc description-quality-row description-quality-r0" x="46" y="182">They must infer your intent from the diff</text>
  <text class="description-quality-desc description-quality-row description-quality-r1" x="46" y="216">They cannot tell what you already checked</text>
  <text class="description-quality-desc description-quality-row description-quality-r2" x="46" y="250">They cannot tell what you decided against</text>
  <text class="description-quality-desc description-quality-row description-quality-r3" x="46" y="284">Review takes three times as long</text>
  <text class="description-quality-desc description-quality-row description-quality-r4" x="46" y="318">And is less confident at the end</text>
  <rect class="description-quality-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="description-quality-name" x="526" y="122">Problem, cause, fix, evidence</text>
  <text class="description-quality-desc" x="526" y="142">The reviewer starts where you finished.</text>
  <text class="description-quality-desc description-quality-row description-quality-r0" x="526" y="182">"Export did nothing on Safari"</text>
  <text class="description-quality-desc description-quality-row description-quality-r1" x="526" y="216">"Cause: a missing event listener"</text>
  <text class="description-quality-desc description-quality-row description-quality-r2" x="526" y="250">"Fixed here, with a reproducing test"</text>
  <text class="description-quality-desc description-quality-row description-quality-r3" x="526" y="284">"Verified on Safari 17 and Chrome"</text>
  <text class="description-quality-desc description-quality-row description-quality-r4" x="526" y="318">Reviewed quickly, and with confidence</text>
  <text class="description-quality-sub" x="30" y="372">Write it for someone who was not in the room and has no context. In six months, when someone finds this pull request while debugging something else, that person is you.</text>
</svg>
