<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Scaled to reuse.">
  <title>How much workflow structure</title>
  <style>
    .workflow-when-bg   { fill: #f8fafc; }
    .workflow-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .workflow-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .workflow-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .workflow-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .workflow-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .workflow-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .workflow-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .workflow-when-row { opacity: 1; }
    .workflow-when-r0 { animation-delay: 0.00s; }
    .workflow-when-r1 { animation-delay: 0.45s; }
    .workflow-when-r2 { animation-delay: 0.90s; }
    .workflow-when-r3 { animation-delay: 1.35s; }
    .workflow-when-r4 { animation-delay: 1.80s; }
    .workflow-when-row { animation: workflow-when-reveal 7.3s ease-in-out infinite; }
    @keyframes workflow-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="workflow-when-bg" width="980" height="390"/>
  <text class="workflow-when-h1"  x="30" y="40">How much workflow structure</text>
  <text class="workflow-when-sub" x="30" y="64">Scaled to reuse.</text>
  <rect class="workflow-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="workflow-when-name" x="46" y="122">Full structure</text>
  <text class="workflow-when-desc" x="46" y="142">Four cases.</text>
  <text class="workflow-when-desc workflow-when-row workflow-when-r0" x="46" y="182">Anything that will run more than once</text>
  <text class="workflow-when-desc workflow-when-row workflow-when-r1" x="46" y="216">Anything more than one person touches</text>
  <text class="workflow-when-desc workflow-when-row workflow-when-r2" x="46" y="250">Anything going to production</text>
  <text class="workflow-when-desc workflow-when-row workflow-when-r3" x="46" y="284">Where results will be defended</text>
  <text class="workflow-when-desc workflow-when-row workflow-when-r4" x="46" y="318">Where data arrives repeatedly</text>
  <rect class="workflow-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="workflow-when-name" x="526" y="122">Lighter</text>
  <text class="workflow-when-desc" x="526" y="142">Also four.</text>
  <text class="workflow-when-desc workflow-when-row workflow-when-r0" x="526" y="182">A single exploratory question</text>
  <text class="workflow-when-desc workflow-when-row workflow-when-r1" x="526" y="216">Throwaway analysis</text>
  <text class="workflow-when-desc workflow-when-row workflow-when-r2" x="526" y="250">Teaching examples</text>
  <text class="workflow-when-desc workflow-when-row workflow-when-r3" x="526" y="284">One-off feasibility checks</text>
  <text class="workflow-when-desc workflow-when-row workflow-when-r4" x="526" y="318">But keep the split ordering regardless</text>
  <text class="workflow-when-sub" x="30" y="372">The split ordering is the one rule worth keeping in even the lightest exploration, because a leaked estimate misleads the decision about whether to continue at all.</text>
</svg>
