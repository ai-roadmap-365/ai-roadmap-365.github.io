<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four dimensions, and they must agree.">
  <title>The shape contract</title>
  <style>
    .shape-contracts-bg   { fill: #f8fafc; }
    .shape-contracts-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shape-contracts-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shape-contracts-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shape-contracts-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shape-contracts-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shape-contracts-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .shape-contracts-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .shape-contracts-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .shape-contracts-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .shape-contracts-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .shape-contracts-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .shape-contracts-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .shape-contracts-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .shape-contracts-stage { opacity: 1; }

    .shape-contracts-s0 { animation-delay: 0.00s; }
    .shape-contracts-e0 { animation-delay: 0.00s; }
    .shape-contracts-s1 { animation-delay: 1.28s; }
    .shape-contracts-e1 { animation-delay: 1.28s; }
    .shape-contracts-s2 { animation-delay: 2.56s; }
    .shape-contracts-e2 { animation-delay: 2.56s; }
    .shape-contracts-s3 { animation-delay: 3.84s; }
    .shape-contracts-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .shape-contracts-conn  { animation: shape-contracts-trace 6.4s ease-in-out infinite; }
      .shape-contracts-stage { animation: shape-contracts-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes shape-contracts-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes shape-contracts-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .shape-contracts-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .shape-contracts-stage { animation: shape-contracts-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes shape-contracts-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="shape-contracts-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="shape-contracts-bg" width="980" height="322"/>
  <text class="shape-contracts-h1"  x="30" y="40">The shape contract</text>
  <text class="shape-contracts-sub" x="30" y="64">Four dimensions, and they must agree.</text>
  <g class="shape-contracts-stage shape-contracts-s0">
    <rect class="shape-contracts-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="shape-contracts-step" x="44" y="142">01</text>
    <text class="shape-contracts-name" x="70" y="142">Weights: outputs by inputs</text>
    <text class="shape-contracts-desc" x="44" y="166">Rows are this layer's neurons;</text>
    <text class="shape-contracts-desc" x="44" y="182">columns are the previous</text>
    <text class="shape-contracts-desc" x="44" y="198">layer's.</text>
  </g>
  <line class="shape-contracts-line shape-contracts-conn shape-contracts-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#shape-contracts-tip)"/>
  <g class="shape-contracts-stage shape-contracts-s1">
    <rect class="shape-contracts-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="shape-contracts-step" x="280" y="142">02</text>
    <text class="shape-contracts-name" x="306" y="142">Input batch: inputs by samples</text>
    <text class="shape-contracts-desc" x="280" y="166">Each column is one sample.</text>
  </g>
  <line class="shape-contracts-line shape-contracts-conn shape-contracts-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#shape-contracts-tip)"/>
  <g class="shape-contracts-stage shape-contracts-s2">
    <rect class="shape-contracts-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="shape-contracts-step" x="516" y="142">03</text>
    <text class="shape-contracts-name" x="542" y="142">The inner dimensions must match</text>
    <text class="shape-contracts-desc" x="516" y="166">This is the contract. Most bugs</text>
    <text class="shape-contracts-desc" x="516" y="182">here are a transpose.</text>
  </g>
  <line class="shape-contracts-line shape-contracts-conn shape-contracts-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#shape-contracts-tip)"/>
  <g class="shape-contracts-stage shape-contracts-s3">
    <rect class="shape-contracts-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="shape-contracts-step" x="752" y="142">04</text>
    <text class="shape-contracts-name" x="778" y="142">The bias broadcasts</text>
    <text class="shape-contracts-desc" x="752" y="166">One column, replicated across</text>
    <text class="shape-contracts-desc" x="752" y="182">every sample in the batch.</text>
  </g>
  <text class="shape-contracts-sub" x="30" y="304">A transposed weight matrix that happens to be square produces a network that runs, trains, and learns something meaningless — which is why shape assertions are worth writing rather than trusting.</text>
</svg>
