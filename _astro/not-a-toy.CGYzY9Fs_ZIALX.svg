<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Three misreadings.">
  <title>Zero dependency is not zero safety</title>
  <style>
    .not-a-toy-bg   { fill: #f8fafc; }
    .not-a-toy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-toy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-toy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-toy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-toy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-toy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-a-toy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .not-a-toy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .not-a-toy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .not-a-toy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .not-a-toy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .not-a-toy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-a-toy-row { opacity: 1; }
    .not-a-toy-r0 { animation-delay: 0.00s; }
    .not-a-toy-r1 { animation-delay: 0.45s; }
    .not-a-toy-r2 { animation-delay: 0.90s; }
    .not-a-toy-r3 { animation-delay: 1.35s; }
    .not-a-toy-r4 { animation-delay: 1.80s; }
    .not-a-toy-row { animation: not-a-toy-reveal 7.3s ease-in-out infinite; }
    @keyframes not-a-toy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="not-a-toy-bg" width="980" height="390"/>
  <text class="not-a-toy-h1"  x="30" y="40">Zero dependency is not zero safety</text>
  <text class="not-a-toy-sub" x="30" y="64">Three misreadings.</text>
  <rect class="not-a-toy-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="not-a-toy-name" x="46" y="122">What it includes</text>
  <text class="not-a-toy-desc" x="46" y="142">Everything safety needs.</text>
  <text class="not-a-toy-desc not-a-toy-row not-a-toy-r0" x="46" y="182">Strict timeout limits</text>
  <text class="not-a-toy-desc not-a-toy-row not-a-toy-r1" x="46" y="216">Step guards and budget caps</text>
  <text class="not-a-toy-desc not-a-toy-row not-a-toy-r2" x="46" y="250">Syntax error recovery</text>
  <text class="not-a-toy-desc not-a-toy-row not-a-toy-r3" x="46" y="284">An explicit state machine</text>
  <text class="not-a-toy-desc not-a-toy-row not-a-toy-r4" x="46" y="318">Full visibility into every prompt sent</text>
  <rect class="not-a-toy-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="not-a-toy-name" x="526" y="122">Three misreadings</text>
  <text class="not-a-toy-desc" x="526" y="142">All common.</text>
  <text class="not-a-toy-desc not-a-toy-row not-a-toy-r0" x="526" y="182">"It must be a toy" — it has more guards, not fewer</text>
  <text class="not-a-toy-desc not-a-toy-row not-a-toy-r1" x="526" y="216">"It means no libraries" — you still use an HTTP client and an SDK</text>
  <text class="not-a-toy-desc not-a-toy-row not-a-toy-r2" x="526" y="250">"It is one big prompt" — it is an iterative loop</text>
  <text class="not-a-toy-desc not-a-toy-row not-a-toy-r3" x="526" y="284">The dependency being avoided is the orchestration layer</text>
  <text class="not-a-toy-desc not-a-toy-row not-a-toy-r4" x="526" y="318">Not the standard library, and not the model SDK</text>
  <text class="not-a-toy-sub" x="30" y="372">"Zero-dependency" is a claim about the orchestration layer specifically, and stating that precisely avoids an argument about whether `httpx` counts.</text>
</svg>
