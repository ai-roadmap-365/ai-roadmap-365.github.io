<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two ways to pass a signal on.">
  <title>A dimmer switch, or a valve</title>
  <style>
    .activation-analogy-bg   { fill: #f8fafc; }
    .activation-analogy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .activation-analogy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .activation-analogy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .activation-analogy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .activation-analogy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .activation-analogy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .activation-analogy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .activation-analogy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .activation-analogy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .activation-analogy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .activation-analogy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .activation-analogy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .activation-analogy-row { opacity: 1; }
    .activation-analogy-r0 { animation-delay: 0.00s; }
    .activation-analogy-r1 { animation-delay: 0.45s; }
    .activation-analogy-r2 { animation-delay: 0.90s; }
    .activation-analogy-r3 { animation-delay: 1.35s; }
    .activation-analogy-r4 { animation-delay: 1.80s; }
    .activation-analogy-row { animation: activation-analogy-reveal 7.3s ease-in-out infinite; }
    @keyframes activation-analogy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="activation-analogy-bg" width="980" height="390"/>
  <text class="activation-analogy-h1"  x="30" y="40">A dimmer switch, or a valve</text>
  <text class="activation-analogy-sub" x="30" y="64">Two ways to pass a signal on.</text>
  <rect class="activation-analogy-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="activation-analogy-name" x="46" y="122">A perfect amplifier</text>
  <text class="activation-analogy-desc" x="46" y="142">Passes everything through.</text>
  <text class="activation-analogy-desc activation-analogy-row activation-analogy-r0" x="46" y="182">Output proportional to input</text>
  <text class="activation-analogy-desc activation-analogy-row activation-analogy-r1" x="46" y="216">Chain ten of them together</text>
  <text class="activation-analogy-desc activation-analogy-row activation-analogy-r2" x="46" y="250">The result is still proportional</text>
  <text class="activation-analogy-desc activation-analogy-row activation-analogy-r3" x="46" y="284">One amplifier with a bigger gain</text>
  <text class="activation-analogy-desc activation-analogy-row activation-analogy-r4" x="46" y="318">No new behaviour at any depth</text>
  <rect class="activation-analogy-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="activation-analogy-name" x="526" y="122">A valve</text>
  <text class="activation-analogy-desc" x="526" y="142">Responds non-linearly.</text>
  <text class="activation-analogy-desc activation-analogy-row activation-analogy-r0" x="526" y="182">Nothing below a threshold</text>
  <text class="activation-analogy-desc activation-analogy-row activation-analogy-r1" x="526" y="216">Proportional above it</text>
  <text class="activation-analogy-desc activation-analogy-row activation-analogy-r2" x="526" y="250">Chain ten and behaviour compounds</text>
  <text class="activation-analogy-desc activation-analogy-row activation-analogy-r3" x="526" y="284">Each stage can gate the last</text>
  <text class="activation-analogy-desc activation-analogy-row activation-analogy-r4" x="526" y="318">New behaviour emerges from depth</text>
  <text class="activation-analogy-sub" x="30" y="372">Ten amplifiers in series is one amplifier, and ten valves in series is a control system — which is the whole argument for putting a non-linearity between every pair of layers.</text>
</svg>
