<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="100%" height="100%" role="img" aria-label="Instruction Order Decides Rebuild Time showing the same instructions in two orders and the resulting cache hits">
  <title>Instruction Order Decides Rebuild Time</title>
  <defs>
    <style>
      .d330b-bg { fill: #f8fafc; }
      .d330b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; }
      .d330b-good { fill: #dcfce7; stroke: #22c55e; stroke-width: 2px; }
      .d330b-bad { fill: #fee2e2; stroke: #ef4444; stroke-width: 2px; }
      .d330b-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d330b-h { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .d330b-t { font-family: system-ui, sans-serif; font-size: 13px; fill: #334155; }
      .d330b-s { font-family: system-ui, sans-serif; font-size: 12px; fill: #64748b; }
      .d330b-big { font-family: system-ui, sans-serif; font-size: 26px; font-weight: 700; }
      .d330b-ax { stroke: #94a3b8; stroke-width: 1.5px; }
    </style>
  </defs>
  <rect class="d330b-bg" width="900" height="430" />
  <text class="d330b-title" x="30" y="36">Instruction Order Decides Rebuild Time</text>
  <text class="d330b-s" x="30" y="58">Rebuild cost after editing one source file. Measured by the day 330 lab.</text>

  <line class="d330b-ax" x1="150" y1="200" x2="860" y2="200" />
  <text class="d330b-s" x="150" y="220">0s</text>
  <text class="d330b-s" x="480" y="220">40s</text>
  <text class="d330b-s" x="810" y="220">80s</text>

  <text class="d330b-t" x="30" y="112">naive</text>
  <rect class="d330b-bad" x="150" y="94" width="627" height="28" rx="4" />
  <text class="d330b-s" x="600" y="113" fill="#7f1d1d">76.0s — the install re-runs</text>

  <text class="d330b-t" x="30" y="160">ordered</text>
  <rect class="d330b-good" x="150" y="142" width="9" height="28" rx="3" />
  <text class="d330b-s" x="170" y="161" fill="#15803d">1.0s — only the source copy</text>

  <rect class="d330b-card" x="30" y="246" width="410" height="96" rx="8" />
  <text class="d330b-h" x="48" y="272">What changed</text>
  <text class="d330b-t" x="48" y="298">one line in src/app.py</text>
  <text class="d330b-s" x="48" y="322">nothing else — same base, same packages</text>

  <rect class="d330b-card" x="460" y="246" width="410" height="96" rx="8" />
  <text class="d330b-h" x="478" y="272">What it cost</text>
  <text class="d330b-big" x="478" y="304" fill="#7f1d1d">76x</text>
  <text class="d330b-t" x="560" y="302">more, for the same edit</text>
  <text class="d330b-s" x="478" y="326">and the cold builds differ by 1 second</text>

  <rect class="d330b-card" x="30" y="356" width="840" height="50" rx="6" />
  <text class="d330b-t" x="48" y="378">Put the expensive, stable layer above the cheap, volatile one:</text>
  <text class="d330b-t" x="48" y="398">copy the manifest, install, THEN copy the source.</text>
</svg>
