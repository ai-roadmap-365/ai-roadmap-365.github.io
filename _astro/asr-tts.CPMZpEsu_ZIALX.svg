<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Different problems.">
  <title>Recognition against synthesis</title>
  <style>
    .asr-tts-bg   { fill: #f8fafc; }
    .asr-tts-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .asr-tts-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .asr-tts-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .asr-tts-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .asr-tts-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .asr-tts-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .asr-tts-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .asr-tts-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .asr-tts-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .asr-tts-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .asr-tts-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .asr-tts-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .asr-tts-row { opacity: 1; }
    .asr-tts-r0 { animation-delay: 0.00s; }
    .asr-tts-r1 { animation-delay: 0.45s; }
    .asr-tts-r2 { animation-delay: 0.90s; }
    .asr-tts-r3 { animation-delay: 1.35s; }
    .asr-tts-r4 { animation-delay: 1.80s; }
    .asr-tts-row { animation: asr-tts-reveal 7.3s ease-in-out infinite; }
    @keyframes asr-tts-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="asr-tts-bg" width="980" height="390"/>
  <text class="asr-tts-h1"  x="30" y="40">Recognition against synthesis</text>
  <text class="asr-tts-sub" x="30" y="64">Different problems.</text>
  <rect class="asr-tts-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="asr-tts-name" x="46" y="122">Recognition</text>
  <text class="asr-tts-desc" x="46" y="142">Sound to text.</text>
  <text class="asr-tts-desc asr-tts-row asr-tts-r0" x="46" y="182">Many-to-one: many voices, one transcript</text>
  <text class="asr-tts-desc asr-tts-row asr-tts-r1" x="46" y="216">A correct answer exists</text>
  <text class="asr-tts-desc asr-tts-row asr-tts-r2" x="46" y="250">Measurable by edit distance</text>
  <text class="asr-tts-desc asr-tts-row asr-tts-r3" x="46" y="284">Robustness to noise is the challenge</text>
  <text class="asr-tts-desc asr-tts-row asr-tts-r4" x="46" y="318">Evaluation is objective</text>
  <rect class="asr-tts-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="asr-tts-name" x="526" y="122">Synthesis</text>
  <text class="asr-tts-desc" x="526" y="142">Text to sound.</text>
  <text class="asr-tts-desc asr-tts-row asr-tts-r0" x="526" y="182">One-to-many: many valid readings</text>
  <text class="asr-tts-desc asr-tts-row asr-tts-r1" x="526" y="216">No single correct output</text>
  <text class="asr-tts-desc asr-tts-row asr-tts-r2" x="526" y="250">Measured by human listening</text>
  <text class="asr-tts-desc asr-tts-row asr-tts-r3" x="526" y="284">Naturalness is the challenge</text>
  <text class="asr-tts-desc asr-tts-row asr-tts-r4" x="526" y="318">Evaluation is subjective</text>
  <text class="asr-tts-sub" x="30" y="372">The asymmetry in evaluation is the practical difference: recognition progress is measurable automatically and synthesis progress still needs people to listen.</text>
</svg>
