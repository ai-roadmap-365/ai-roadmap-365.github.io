<svg role="img" aria-label="Floating point number formats comparison showing sign exponent and mantissa bits for FP32 FP16 BF16 and FP8" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>Floating-Point Numerical Formats: FP32, FP16, BF16, and FP8</title>
  <defs>
    <linearGradient id="bg233a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card233" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg233a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">FLOATING-POINT FORMATS: FP32, FP16, BF16, &amp; FP8</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Sign (1-bit), Exponent (Dynamic Range), and Mantissa (Precision / Fractional Precision)</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card233)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- 1. FP32 Standard Single Precision -->
    <g transform="translate(30, 20)">
      <text x="0" y="18" fill="#38bdf8" font-size="11" font-weight="700">1. FP32 (Single Precision, 32-bit):</text>
      <!-- Sign (1) -->
      <rect x="230" y="0" width="25" height="28" fill="#f43f5e" rx="2"/>
      <text x="242" y="18" fill="#ffffff" font-size="9" text-anchor="middle">S:1</text>
      <!-- Exponent (8) -->
      <rect x="260" y="0" width="160" height="28" fill="#fbbf24" rx="2"/>
      <text x="340" y="18" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">Exponent (8 bits)</text>
      <!-- Mantissa (23) -->
      <rect x="425" y="0" width="265" height="28" fill="#10b981" rx="2"/>
      <text x="557" y="18" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">Mantissa (23 bits)</text>
    </g>

    <!-- 2. FP16 Half Precision -->
    <g transform="translate(30, 80)">
      <text x="0" y="18" fill="#fb7185" font-size="11" font-weight="700">2. FP16 (Half Precision, 16-bit):</text>
      <!-- Sign (1) -->
      <rect x="230" y="0" width="25" height="28" fill="#f43f5e" rx="2"/>
      <text x="242" y="18" fill="#ffffff" font-size="9" text-anchor="middle">S:1</text>
      <!-- Exponent (5) -->
      <rect x="260" y="0" width="100" height="28" fill="#fbbf24" rx="2"/>
      <text x="310" y="18" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">Exp (5 bits)</text>
      <!-- Mantissa (10) -->
      <rect x="365" y="0" width="170" height="28" fill="#10b981" rx="2"/>
      <text x="450" y="18" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">Mantissa (10 bits)</text>
      <text x="550" y="18" fill="#fb7185" font-size="8" font-style="italic">Underflow risk: Requires Loss Scaling</text>
    </g>

    <!-- 3. BF16 Brain Floating Point -->
    <g transform="translate(30, 140)">
      <text x="0" y="18" fill="#34d399" font-size="11" font-weight="700">3. BF16 (Bfloat16, 16-bit):</text>
      <!-- Sign (1) -->
      <rect x="230" y="0" width="25" height="28" fill="#f43f5e" rx="2"/>
      <text x="242" y="18" fill="#ffffff" font-size="9" text-anchor="middle">S:1</text>
      <!-- Exponent (8 - Matches FP32!) -->
      <rect x="260" y="0" width="160" height="28" fill="#fbbf24" rx="2"/>
      <text x="340" y="18" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">Exponent (8 bits - FP32 Range!)</text>
      <!-- Mantissa (7) -->
      <rect x="425" y="0" width="115" height="28" fill="#10b981" rx="2"/>
      <text x="482" y="18" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">Mant (7b)</text>
      <text x="550" y="18" fill="#34d399" font-size="8" font-weight="700">Zero Loss Scaling Needed (SOTA)</text>
    </g>

    <!-- 4. FP8 Modern Training & Inference -->
    <g transform="translate(30, 200)">
      <text x="0" y="18" fill="#c084fc" font-size="11" font-weight="700">4. FP8 E4M3 / E5M2 (8-bit):</text>
      <!-- E4M3 -->
      <rect x="230" y="0" width="25" height="28" fill="#f43f5e" rx="2"/>
      <text x="242" y="18" fill="#ffffff" font-size="9" text-anchor="middle">S:1</text>
      <rect x="260" y="0" width="80" height="28" fill="#fbbf24" rx="2"/>
      <text x="300" y="18" fill="#0f172a" font-size="8" font-weight="700" text-anchor="middle">Exp (4b)</text>
      <rect x="345" y="0" width="65" height="28" fill="#10b981" rx="2"/>
      <text x="377" y="18" fill="#ffffff" font-size="8" font-weight="700" text-anchor="middle">Mant (3b)</text>
      <text x="430" y="18" fill="#cbd5e1" font-size="8">E4M3 (Weights / Activations) &amp; E5M2 (Gradients)</text>
    </g>

    <!-- Summary Box -->
    <rect x="30" y="245" width="700" height="40" fill="#0f172a" stroke="#64748b" rx="4"/>
    <text x="380" y="270" fill="#f8fafc" font-size="9" text-anchor="middle">Mixed Precision = 2x - 4x Faster Compute + 50% - 75% Memory Reduction with Zero Accuracy Loss</text>
  </g>
</svg>
