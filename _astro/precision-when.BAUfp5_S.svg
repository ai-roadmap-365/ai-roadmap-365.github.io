<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And where it is unsafe.">
  <title>When to use low precision</title>
  <style>
    .precision-when-bg   { fill: #f8fafc; }
    .precision-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .precision-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .precision-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .precision-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .precision-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .precision-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .precision-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .precision-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .precision-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .precision-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .precision-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .precision-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .precision-when-row { opacity: 1; }
    .precision-when-r0 { animation-delay: 0.00s; }
    .precision-when-r1 { animation-delay: 0.45s; }
    .precision-when-r2 { animation-delay: 0.90s; }
    .precision-when-r3 { animation-delay: 1.35s; }
    .precision-when-r4 { animation-delay: 1.80s; }
    .precision-when-row { animation: precision-when-reveal 7.3s ease-in-out infinite; }
    @keyframes precision-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="precision-when-bg" width="980" height="390"/>
  <text class="precision-when-h1"  x="30" y="40">When to use low precision</text>
  <text class="precision-when-sub" x="30" y="64">And where it is unsafe.</text>
  <rect class="precision-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="precision-when-name" x="46" y="122">Use it</text>
  <text class="precision-when-desc" x="46" y="142">Nearly all training.</text>
  <text class="precision-when-desc precision-when-row precision-when-r0" x="46" y="182">Every large model training run</text>
  <text class="precision-when-desc precision-when-row precision-when-r1" x="46" y="216">Fine-tuning of any size</text>
  <text class="precision-when-desc precision-when-row precision-when-r2" x="46" y="250">High-throughput inference</text>
  <text class="precision-when-desc precision-when-row precision-when-r3" x="46" y="284">Anywhere memory is the constraint</text>
  <text class="precision-when-desc precision-when-row precision-when-r4" x="46" y="318">On hardware with matrix units</text>
  <rect class="precision-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="precision-when-name" x="526" y="122">Keep full precision</text>
  <text class="precision-when-desc" x="526" y="142">Four situations.</text>
  <text class="precision-when-desc precision-when-row precision-when-r0" x="526" y="182">Scientific simulation needing exact digits</text>
  <text class="precision-when-desc precision-when-row precision-when-r1" x="526" y="216">Reinforcement learning with fragile value estimates</text>
  <text class="precision-when-desc precision-when-row precision-when-r2" x="526" y="250">Debugging a divergent run</text>
  <text class="precision-when-desc precision-when-row precision-when-r3" x="526" y="284">Hardware without low-precision support</text>
  <text class="precision-when-desc precision-when-row precision-when-r4" x="526" y="318">And any computation feeding a financial ledger</text>
  <text class="precision-when-sub" x="30" y="372">Reverting to full precision as a diagnostic step is a useful habit: if a divergent run becomes stable, the problem is numerical rather than in the model or the data.</text>
</svg>
