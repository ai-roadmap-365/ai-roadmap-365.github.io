<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="OpenTelemetry, Prometheus, and Grafana Observability Pipeline">
  <title>OpenTelemetry, Prometheus, and Grafana Observability Pipeline</title>
  <defs>
    <style>
      .d339a-bg { fill: #f8fafc; }
      .d339a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d339a-app { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d339a-prm { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d339a-alt { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d339a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d339a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d339a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d339a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d339a-bg" />
  
  <text x="40" y="40" class="d339a-title">AI Observability &amp; Alerting Pipeline (OTel / Prometheus)</text>
  <text x="40" y="65" class="d339a-subtitle">OpenTelemetry, Prometheus, and Grafana Observability Pipeline showing Application Metrics Export, Prometheus Scrape Collector, Grafana Real-Time Dashboard, and Alertmanager PagerDuty Escalation</text>
  
  <!-- App Instrumentation -->
  <rect x="40" y="110" width="240" height="270" class="d339a-app" />
  <text x="55" y="145" class="d339a-header" fill="#1d4ed8">1. Application Telemetry</text>
  <text x="55" y="180" class="d339a-text">• OpenTelemetry Python SDK</text>
  <text x="55" y="205" class="d339a-text">• `llm.ttft_latency_seconds`</text>
  <text x="55" y="230" class="d339a-text">• `llm.inter_token_latency_ms`</text>
  <text x="55" y="255" class="d339a-text">• `llm.token_consumption_total`</text>
  <text x="55" y="295" class="d339a-text" font-weight="600" fill="#1d4ed8">Vendor-Neutral Metrics</text>
  <text x="55" y="320" class="d339a-text">Structured telemetry instrumentation</text>
  
  <!-- Prometheus Engine -->
  <rect x="315" y="110" width="240" height="270" class="d339a-prm" />
  <text x="330" y="145" class="d339a-header" fill="#7e22ce">2. Prometheus Time-Series</text>
  <text x="330" y="180" class="d339a-text">• Scrapes `:8000/metrics` (2s)</text>
  <text x="330" y="205" class="d339a-text">• Evaluates PromQL Queries:</text>
  <text x="330" y="225" class="d339a-text">  `histogram_quantile(0.95, ...)`</text>
  <text x="330" y="255" class="d339a-text">• Computes Error Budget Burn</text>
  <text x="330" y="295" class="d339a-text" font-weight="600" fill="#7e22ce">Sub-Second Scrape Rates</text>
  <text x="330" y="320" class="d339a-text">High-resolution metrics engine</text>
  
  <!-- Grafana & Alerting -->
  <rect x="590" y="110" width="270" height="270" class="d339a-alt" />
  <text x="605" y="145" class="d339a-header" fill="#15803d">3. Grafana &amp; Alertmanager</text>
  <text x="605" y="180" class="d339a-text">• **Live Dashboard:** TTFT, ITL, VRAM</text>
  <text x="605" y="205" class="d339a-text">• **Warning Alert:** Slack channel</text>
  <text x="605" y="230" class="d339a-text">• **Critical Alert:** PagerDuty 24/7</text>
  <text x="605" y="255" class="d339a-text">• Trigger: `P95 TTFT &gt; 500ms for 2m`</text>
  <text x="605" y="295" class="d339a-text" font-weight="600" fill="#15803d">Actionable Incident Alerting</text>
  <text x="605" y="320" class="d339a-text">Zero alert fatigue policy</text>
</svg>