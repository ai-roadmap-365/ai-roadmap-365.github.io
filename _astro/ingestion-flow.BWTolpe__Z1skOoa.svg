<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="1040" height="520" role="img" aria-labelledby="d135fTitleId d135fDescId">
  <title id="d135fTitleId">Pages arriving, landing in raw storage first, then transformed into a contracted frame, with a re-run visibly skipping the fetch</title>
  <desc id="d135fDescId">Four API pages travel left to right along a marching-dash wire into a raw storage stage, which lights up first. From raw storage, a second wire carries the data into a transform stage, which lights up second, and then into a contract-checked frame stage, which lights up third. Below the main path, a second, dashed re-run path starts directly at raw storage and skips the API entirely, labelled zero requests, proving that a replay never touches the network. With motion disabled, every page, stage, arrow, and label is already drawn in its resting position; the animation only shows the order the steps happen in.</desc>

  <style>
    .d135f-bg     { fill: #f8fafc; }
    .d135f-title  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 19px; font-weight: 600; fill: #1a202c; }
    .d135f-label  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1a202c; }
    .d135f-small  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #334155; }
    .d135f-page   { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }

    .d135f-stage  { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5; animation: d135f-lift 7s ease-in-out infinite; }
    .d135f-s1 { animation-delay: 0.3s; }
    .d135f-s2 { animation-delay: 2.3s; }
    .d135f-s3 { animation-delay: 4.3s; }
    @keyframes d135f-lift {
      0%, 24%, 100% { fill: #e0e7ff; }
      8%, 16%       { fill: #bfdbfe; }
    }

    .d135f-wire {
      fill: none; stroke: #1d4ed8; stroke-width: 2.5;
      stroke-dasharray: 10 8; animation: d135f-march 1.6s linear infinite;
    }
    @keyframes d135f-march { to { stroke-dashoffset: -18; } }

    .d135f-token { fill: #1d4ed8; animation: d135f-travel 7s ease-in-out infinite; }
    @keyframes d135f-travel {
      0%   { transform: translateX(0);     opacity: 1; }
      6%   { transform: translateX(0);     opacity: 1; }
      92%  { transform: translateX(760px); opacity: 1; }
      100% { transform: translateX(760px); opacity: 1; }
    }

    .d135f-replay { stroke: #b45309; stroke-width: 2.5; fill: none; stroke-dasharray: 6 6; animation: d135f-reveal 7s ease-in-out infinite; }
    @keyframes d135f-reveal {
      0%, 60%   { opacity: 0.85; }
      68%, 100% { opacity: 1; }
    }
    .d135f-replay-token { fill: #b45309; animation: d135f-replaytravel 7s ease-in-out infinite; }
    @keyframes d135f-replaytravel {
      0%,64%  { transform: translateX(0); opacity: 0; }
      70%     { transform: translateX(0); opacity: 1; }
      96%     { transform: translateX(430px); opacity: 1; }
      100%    { transform: translateX(430px); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d135f-stage       { animation: none; fill: #e0e7ff; }
      .d135f-wire        { animation: none; stroke-dasharray: none; }
      .d135f-token       { animation: none; transform: none; opacity: 1; }
      .d135f-replay      { animation: none; opacity: 1; }
      .d135f-replay-token{ animation: none; transform: translateX(430px); opacity: 1; }
    }
  </style>

  <rect class="d135f-bg" x="0" y="0" width="1040" height="520" />
  <text class="d135f-title" x="30" y="36">Raw before transform: a re-run replays from disk and skips the API entirely</text>

  <!-- Four incoming pages -->
  <text class="d135f-small" x="30" y="72">4 pages, page_size=2</text>
  <rect class="d135f-page" x="30" y="80" width="60" height="40" rx="6" /><text class="d135f-small" x="60" y="104" text-anchor="middle">p1</text>
  <rect class="d135f-page" x="30" y="126" width="60" height="40" rx="6" /><text class="d135f-small" x="60" y="150" text-anchor="middle">p2</text>
  <rect class="d135f-page" x="30" y="172" width="60" height="40" rx="6" /><text class="d135f-small" x="60" y="196" text-anchor="middle">p3</text>
  <rect class="d135f-page" x="30" y="218" width="60" height="40" rx="6" /><text class="d135f-small" x="60" y="242" text-anchor="middle">p4</text>
  <text class="d135f-small" x="30" y="278">mock API, 127.0.0.1</text>

  <defs>
    <marker id="d135f-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
    <marker id="d135f-arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309" />
    </marker>
  </defs>

  <!-- Main path: fetch -> raw -> transform -> contracted frame -->
  <path class="d135f-wire" d="M 100 170 L 260 170" marker-end="url(#d135f-arrow)" />
  <path class="d135f-wire" d="M 500 170 L 640 170" marker-end="url(#d135f-arrow)" />
  <path class="d135f-wire" d="M 860 170 L 940 170" marker-end="url(#d135f-arrow)" />

  <rect class="d135f-stage d135f-s1" x="266" y="130" width="230" height="80" rx="8" />
  <text class="d135f-label" x="381" y="164" text-anchor="middle">raw JSONL storage</text>
  <text class="d135f-small" x="381" y="186" text-anchor="middle">every page written before</text>
  <text class="d135f-small" x="381" y="202" text-anchor="middle">any transform runs</text>

  <rect class="d135f-stage d135f-s2" x="646" y="130" width="210" height="80" rx="8" />
  <text class="d135f-label" x="751" y="164" text-anchor="middle">transform</text>
  <text class="d135f-small" x="751" y="186" text-anchor="middle">assemble, pin dtypes,</text>
  <text class="d135f-small" x="751" y="202" text-anchor="middle">detect drift</text>

  <circle class="d135f-token" cx="130" cy="150" r="9" />

  <rect class="d135f-page" x="946" y="130" width="64" height="80" rx="8" fill="#ecfdf5" stroke="#047857" />
  <text class="d135f-small" x="978" y="164" text-anchor="middle">contracted</text>
  <text class="d135f-small" x="978" y="180" text-anchor="middle">frame</text>
  <text class="d135f-small" x="978" y="198" text-anchor="middle">7 rows</text>

  <!-- Replay path: starts at raw storage, skips the API, 0 further requests -->
  <path class="d135f-replay" d="M 496 300 L 940 300" marker-end="url(#d135f-arrowAmber)" />
  <circle class="d135f-replay-token" cx="496" cy="300" r="9" />
  <text class="d135f-small" x="381" y="330" text-anchor="middle">re-run: transform_from_raw(raw_path)</text>
  <text class="d135f-label" x="710" y="330" text-anchor="middle">0 further requests -- the server's own counter proves it</text>

  <text class="d135f-small" x="30" y="400">Resting state: 4 pages, 3 stages, both wires and both paths fully drawn; the amber</text>
  <text class="d135f-small" x="30" y="418">replay path is always visible, labelled "0 further requests," whether or not this animates.</text>
  <text class="d135f-small" x="30" y="450">A first run costs 4 HTTP requests, one per page, confirmed by /control/stats on the mock server.</text>
  <text class="d135f-small" x="30" y="470">A bug found later in transform is fixed and re-run from the stored raw copy -- never re-fetched.</text>
</svg>
