<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Consistency is the lesson.">
  <title>Worked examples, or a pile of paper</title>
  <style>
    .teaching-examples-bg   { fill: #f8fafc; }
    .teaching-examples-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .teaching-examples-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .teaching-examples-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .teaching-examples-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .teaching-examples-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .teaching-examples-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .teaching-examples-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .teaching-examples-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .teaching-examples-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .teaching-examples-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .teaching-examples-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .teaching-examples-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .teaching-examples-row { opacity: 1; }
    .teaching-examples-r0 { animation-delay: 0.00s; }
    .teaching-examples-r1 { animation-delay: 0.45s; }
    .teaching-examples-r2 { animation-delay: 0.90s; }
    .teaching-examples-r3 { animation-delay: 1.35s; }
    .teaching-examples-r4 { animation-delay: 1.80s; }
    .teaching-examples-row { animation: teaching-examples-reveal 7.3s ease-in-out infinite; }
    @keyframes teaching-examples-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="teaching-examples-bg" width="980" height="390"/>
  <text class="teaching-examples-h1"  x="30" y="40">Worked examples, or a pile of paper</text>
  <text class="teaching-examples-sub" x="30" y="64">Consistency is the lesson.</text>
  <rect class="teaching-examples-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="teaching-examples-name" x="46" y="122">Consistent examples</text>
  <text class="teaching-examples-desc" x="46" y="142">A method is visible.</text>
  <text class="teaching-examples-desc teaching-examples-row teaching-examples-r0" x="46" y="182">Every one worked the same way</text>
  <text class="teaching-examples-desc teaching-examples-row teaching-examples-r1" x="46" y="216">The pattern is unmistakable</text>
  <text class="teaching-examples-desc teaching-examples-row teaching-examples-r2" x="46" y="250">A few dozen suffice</text>
  <text class="teaching-examples-desc teaching-examples-row teaching-examples-r3" x="46" y="284">The learner generalises</text>
  <text class="teaching-examples-desc teaching-examples-row teaching-examples-r4" x="46" y="318">This is a good dataset</text>
  <rect class="teaching-examples-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="teaching-examples-name" x="526" y="122">Inconsistent examples</text>
  <text class="teaching-examples-desc" x="526" y="142">No method is visible.</text>
  <text class="teaching-examples-desc teaching-examples-row teaching-examples-r0" x="526" y="182">Each worked differently</text>
  <text class="teaching-examples-desc teaching-examples-row teaching-examples-r1" x="526" y="216">No pattern to extract</text>
  <text class="teaching-examples-desc teaching-examples-row teaching-examples-r2" x="526" y="250">Volume does not compensate</text>
  <text class="teaching-examples-desc teaching-examples-row teaching-examples-r3" x="526" y="284">The learner picks one at random</text>
  <text class="teaching-examples-desc teaching-examples-row teaching-examples-r4" x="526" y="318">This is a bad dataset</text>
  <text class="teaching-examples-sub" x="30" y="372">Volume failing to compensate for inconsistency is the point: adding more contradictory examples makes the pattern harder to find, not easier.</text>
</svg>
