<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>What scope decides</title>
  <style>
    .scope-idea-bg   { fill: #f8fafc; }
    .scope-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scope-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scope-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scope-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scope-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scope-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scope-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .scope-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .scope-idea-stage { opacity: 1; }

    .scope-idea-s0 { animation-delay: 0.00s; }
    .scope-idea-e0 { animation-delay: 0.00s; }
    .scope-idea-s1 { animation-delay: 1.28s; }
    .scope-idea-e1 { animation-delay: 1.28s; }
    .scope-idea-s2 { animation-delay: 2.56s; }
    .scope-idea-e2 { animation-delay: 2.56s; }
    .scope-idea-s3 { animation-delay: 3.84s; }
    .scope-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .scope-idea-conn  { animation: scope-idea-trace 6.4s ease-in-out infinite; }
      .scope-idea-stage { animation: scope-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes scope-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes scope-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .scope-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .scope-idea-stage { animation: scope-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes scope-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="scope-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="scope-idea-bg" width="980" height="322"/>
  <text class="scope-idea-h1"  x="30" y="40">What scope decides</text>
  <text class="scope-idea-sub" x="30" y="64">Four steps.</text>
  <g class="scope-idea-stage scope-idea-s0">
    <rect class="scope-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="scope-idea-step" x="44" y="142">01</text>
    <text class="scope-idea-name" x="70" y="142">Which value a name refers to</text>
    <text class="scope-idea-desc" x="44" y="166">When the same name exists in</text>
    <text class="scope-idea-desc" x="44" y="182">several places.</text>
  </g>
  <line class="scope-idea-line scope-idea-conn scope-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#scope-idea-tip)"/>
  <g class="scope-idea-stage scope-idea-s1">
    <rect class="scope-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="scope-idea-step" x="280" y="142">02</text>
    <text class="scope-idea-name" x="306" y="142">Whether a function can disturb the outside</text>
    <text class="scope-idea-desc" x="280" y="166">By default, it cannot.</text>
  </g>
  <line class="scope-idea-line scope-idea-conn scope-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#scope-idea-tip)"/>
  <g class="scope-idea-stage scope-idea-s2">
    <rect class="scope-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="scope-idea-step" x="516" y="142">03</text>
    <text class="scope-idea-name" x="542" y="142">How long a value survives</text>
    <text class="scope-idea-desc" x="516" y="166">Local names vanish when the call</text>
    <text class="scope-idea-desc" x="516" y="182">returns.</text>
  </g>
  <line class="scope-idea-line scope-idea-conn scope-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#scope-idea-tip)"/>
  <g class="scope-idea-stage scope-idea-s3">
    <rect class="scope-idea-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="scope-idea-step" x="752" y="142">04</text>
    <text class="scope-idea-name" x="778" y="142">So most bugs that look impossible are scope bugs</text>
    <text class="scope-idea-desc" x="752" y="166">A different name than you</text>
    <text class="scope-idea-desc" x="752" y="182">thought.</text>
  </g>
  <text class="scope-idea-sub" x="30" y="304">Naming the rule explicitly is what turns these from mysterious to obvious, because the resolution order is entirely mechanical.</text>
</svg>
