<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The discipline that makes a new API quick instead of slow.">
  <title>Run their example first</title>
  <style>
    .one-thing-at-a-time-bg   { fill: #f8fafc; }
    .one-thing-at-a-time-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-thing-at-a-time-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-thing-at-a-time-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-thing-at-a-time-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-thing-at-a-time-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-thing-at-a-time-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .one-thing-at-a-time-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .one-thing-at-a-time-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .one-thing-at-a-time-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .one-thing-at-a-time-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .one-thing-at-a-time-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .one-thing-at-a-time-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .one-thing-at-a-time-row { opacity: 1; }
    .one-thing-at-a-time-r0 { animation-delay: 0.00s; }
    .one-thing-at-a-time-r1 { animation-delay: 0.45s; }
    .one-thing-at-a-time-r2 { animation-delay: 0.90s; }
    .one-thing-at-a-time-r3 { animation-delay: 1.35s; }
    .one-thing-at-a-time-r4 { animation-delay: 1.80s; }
    .one-thing-at-a-time-row { animation: one-thing-at-a-time-reveal 7.3s ease-in-out infinite; }
    @keyframes one-thing-at-a-time-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="one-thing-at-a-time-bg" width="980" height="390"/>
  <text class="one-thing-at-a-time-h1"  x="30" y="40">Run their example first</text>
  <text class="one-thing-at-a-time-sub" x="30" y="64">The discipline that makes a new API quick instead of slow.</text>
  <rect class="one-thing-at-a-time-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="one-thing-at-a-time-name" x="46" y="122">Writing it yourself</text>
  <text class="one-thing-at-a-time-desc" x="46" y="142">Several unknowns at once.</text>
  <text class="one-thing-at-a-time-desc one-thing-at-a-time-row one-thing-at-a-time-r0" x="46" y="182">URL, parameters, headers, body — all new</text>
  <text class="one-thing-at-a-time-desc one-thing-at-a-time-row one-thing-at-a-time-r1" x="46" y="216">It fails, and any of them could be why</text>
  <text class="one-thing-at-a-time-desc one-thing-at-a-time-row one-thing-at-a-time-r2" x="46" y="250">You change two things and it still fails</text>
  <text class="one-thing-at-a-time-desc one-thing-at-a-time-row one-thing-at-a-time-r3" x="46" y="284">No known-good state to return to</text>
  <text class="one-thing-at-a-time-desc one-thing-at-a-time-row one-thing-at-a-time-r4" x="46" y="318">This is where the hours go</text>
  <rect class="one-thing-at-a-time-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="one-thing-at-a-time-name" x="526" y="122">Their example, then one change</text>
  <text class="one-thing-at-a-time-desc" x="526" y="142">One unknown at a time.</text>
  <text class="one-thing-at-a-time-desc one-thing-at-a-time-row one-thing-at-a-time-r0" x="526" y="182">Copy it verbatim. Confirm it works.</text>
  <text class="one-thing-at-a-time-desc one-thing-at-a-time-row one-thing-at-a-time-r1" x="526" y="216">Now you have a known-good baseline</text>
  <text class="one-thing-at-a-time-desc one-thing-at-a-time-row one-thing-at-a-time-r2" x="526" y="250">Change one thing. Still works? Change the next.</text>
  <text class="one-thing-at-a-time-desc one-thing-at-a-time-row one-thing-at-a-time-r3" x="526" y="284">A failure names its own cause</text>
  <text class="one-thing-at-a-time-desc one-thing-at-a-time-row one-thing-at-a-time-r4" x="526" y="318">Minutes, not hours</text>
  <text class="one-thing-at-a-time-sub" x="30" y="372">This is the same instinct as building a pipeline one stage at a time on Day 10, and as bisecting a failure. Reduce the number of things that could be wrong to one.</text>
</svg>
