<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What a model report is not</title>
  <style>
    .report-not-bg   { fill: #f8fafc; }
    .report-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .report-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .report-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .report-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .report-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .report-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .report-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .report-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .report-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .report-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .report-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .report-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .report-not-row { opacity: 1; }
    .report-not-r0 { animation-delay: 0.00s; }
    .report-not-r1 { animation-delay: 0.45s; }
    .report-not-r2 { animation-delay: 0.90s; }
    .report-not-r3 { animation-delay: 1.35s; }
    .report-not-r4 { animation-delay: 1.80s; }
    .report-not-row { animation: report-not-reveal 7.3s ease-in-out infinite; }
    @keyframes report-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="report-not-bg" width="980" height="390"/>
  <text class="report-not-h1"  x="30" y="40">What a model report is not</text>
  <text class="report-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="report-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="report-not-name" x="46" y="122">The misconception</text>
  <text class="report-not-desc" x="46" y="142">Commonly held.</text>
  <text class="report-not-desc report-not-row report-not-r0" x="46" y="182">It is documentation written afterwards</text>
  <text class="report-not-desc report-not-row report-not-r1" x="46" y="216">It is a sales document</text>
  <text class="report-not-desc report-not-row report-not-r2" x="46" y="250">Good models need short reports</text>
  <text class="report-not-desc report-not-row report-not-r3" x="46" y="284">It is written once</text>
  <text class="report-not-desc report-not-row report-not-r4" x="46" y="318">It is for regulators only</text>
  <rect class="report-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="report-not-name" x="526" y="122">What is true</text>
  <text class="report-not-desc" x="526" y="142">Actually.</text>
  <text class="report-not-desc report-not-row report-not-r0" x="526" y="182">Writing it exposes gaps while they are fixable</text>
  <text class="report-not-desc report-not-row report-not-r1" x="526" y="216">Its value comes from stating the limitations</text>
  <text class="report-not-desc report-not-row report-not-r2" x="526" y="250">Complex models need more disclosure, not less</text>
  <text class="report-not-desc report-not-row report-not-r3" x="526" y="284">It is versioned with the model</text>
  <text class="report-not-desc report-not-row report-not-r4" x="526" y="318">Operations and users need it most</text>
  <text class="report-not-sub" x="30" y="372">Writing the report early rather than at the end is the practical recommendation, because the sections that cannot be filled in identify work that is still missing.</text>
</svg>
