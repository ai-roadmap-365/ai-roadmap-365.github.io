<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 920" role="img" aria-labelledby="d102a-title d102a-desc" width="1240" height="920">
  <title id="d102a-title">The columns of a matrix are where the basis vectors land</title>
  <desc id="d102a-desc">A square grid with the arrows (1, 0) and (0, 1) highlighted, the same grid after a transformation with those two arrows landing at (3, 1) and (-1, 2), and arrows showing that those two landing places written downwards are precisely the two columns of the matrix.</desc>

  <style>
    .d102a-bg    { fill: #f8fafc; }
    .d102a-title { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 30px; font-weight: 700; }
    .d102a-sub   { fill: #334155; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 18px; }
    .d102a-head  { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; }
    .d102a-text  { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; }
    .d102a-small { fill: #334155; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; }
    .d102a-mono  { fill: #1a202c; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 18px; }
    .d102a-big   { fill: #1a202c; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 34px; font-weight: 700; }
    .d102a-grid  { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
    .d102a-axis  { stroke: #94a3b8; stroke-width: 2.5; fill: none; }
    .d102a-e1    { stroke: #1d4ed8; stroke-width: 5; fill: none; stroke-linecap: round; }
    .d102a-e2    { stroke: #b45309; stroke-width: 5; fill: none; stroke-linecap: round; }
    .d102a-e1lbl { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 700; }
    .d102a-e2lbl { fill: #b45309; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 700; }
    .d102a-cell  { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
    .d102a-panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .d102a-col1  { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.5; }
    .d102a-col2  { fill: #fef3c7; stroke: #b45309; stroke-width: 2.5; }
    .d102a-link1 { stroke: #1d4ed8; stroke-width: 2.5; fill: none; stroke-dasharray: 7 5; }
    .d102a-link2 { stroke: #b45309; stroke-width: 2.5; fill: none; stroke-dasharray: 7 5; }
    .d102a-flow  { stroke: #1d4ed8; stroke-width: 3.5; fill: none; }
  </style>

  <defs>
    <marker id="d102a-arrowblue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#1d4ed8"/>
    </marker>
    <marker id="d102a-arrowamber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect class="d102a-bg" x="0" y="0" width="1240" height="920"/>

  <text class="d102a-title" x="40" y="48">A matrix is a function. Its columns are where the basis vectors land.</text>
  <text class="d102a-sub" x="40" y="82">Know where these two arrows go, and you know where every vector goes — because every vector is a combination of them.</text>

  <!-- ================= LEFT: before ================= -->
  <text class="d102a-head" x="180" y="132">Before</text>
  <text class="d102a-small" x="180" y="156">the plain grid, with the two arrows every vector is built from</text>

  <g class="d102a-grid">
    <path d="M 180 180 L 180 420"/>
    <path d="M 240 180 L 240 420"/>
    <path d="M 300 180 L 300 420"/>
    <path d="M 360 180 L 360 420"/>
    <path d="M 420 180 L 420 420"/>
    <path d="M 180 180 L 420 180"/>
    <path d="M 180 240 L 420 240"/>
    <path d="M 180 300 L 420 300"/>
    <path d="M 180 360 L 420 360"/>
    <path d="M 180 420 L 420 420"/>
  </g>
  <g class="d102a-axis">
    <path d="M 180 360 L 420 360"/>
    <path d="M 240 420 L 240 180"/>
  </g>

  <rect class="d102a-cell" x="240" y="300" width="60" height="60" opacity="0.55"/>
  <text class="d102a-small" x="248" y="336">area 1</text>

  <path class="d102a-e1" d="M 240 360 L 296 360" marker-end="url(#d102a-arrowblue)"/>
  <path class="d102a-e2" d="M 240 360 L 240 304" marker-end="url(#d102a-arrowamber)"/>
  <text class="d102a-e1lbl" x="284" y="390">e1 = (1, 0)</text>
  <text class="d102a-e2lbl" x="150" y="286">e2 = (0, 1)</text>
  <text class="d102a-small" x="180" y="452">the origin sits at the crossing point</text>

  <!-- ================= MIDDLE: the transformation ================= -->
  <path class="d102a-flow" d="M 448 300 L 528 300" marker-end="url(#d102a-arrowblue)"/>
  <text class="d102a-text" x="440" y="278">apply M</text>
  <text class="d102a-small" x="428" y="332">every point</text>
  <text class="d102a-small" x="428" y="352">moves at once</text>

  <!-- ================= RIGHT: after ================= -->
  <text class="d102a-head" x="560" y="132">After</text>
  <text class="d102a-small" x="560" y="156">the same grid, transformed — still straight lines, still evenly spaced, origin still fixed</text>

  <g class="d102a-grid">
    <path d="M 680 520 L 1040 400"/>
    <path d="M 640 440 L 1000 320"/>
    <path d="M 600 360 L 960 240"/>
    <path d="M 560 280 L 920 160"/>
    <path d="M 680 520 L 560 280"/>
    <path d="M 800 480 L 680 240"/>
    <path d="M 920 440 L 800 200"/>
    <path d="M 1040 400 L 920 160"/>
  </g>
  <g class="d102a-axis">
    <path d="M 640 440 L 1000 320"/>
    <path d="M 800 480 L 680 240"/>
  </g>

  <path class="d102a-cell" d="M 760 400 L 880 360 L 840 280 L 720 320 Z" opacity="0.55"/>
  <text class="d102a-small" x="762" y="345">area 7</text>

  <path class="d102a-e1" d="M 760 400 L 872 363" marker-end="url(#d102a-arrowblue)"/>
  <path class="d102a-e2" d="M 760 400 L 726 325" marker-end="url(#d102a-arrowamber)"/>
  <text class="d102a-e1lbl" x="884" y="368">e1 landed at (3, 1)</text>
  <text class="d102a-e2lbl" x="596" y="312">e2 landed at (-1, 2)</text>
  <text class="d102a-small" x="560" y="556">the origin is the one point that did not move; no matrix can move it</text>

  <!-- ================= BOTTOM: the matrix ================= -->
  <rect class="d102a-panel" x="40" y="596" width="1160" height="292" rx="10"/>
  <text class="d102a-head" x="70" y="634">Those two landing places, written downwards, ARE the matrix</text>

  <!-- matrix picture -->
  <text class="d102a-big" x="96" y="716">M  =</text>
  <rect class="d102a-col1" x="196" y="672" width="66" height="104" rx="6" opacity="0.6"/>
  <rect class="d102a-col2" x="266" y="672" width="66" height="104" rx="6" opacity="0.6"/>
  <text class="d102a-big" x="174" y="716">[</text>
  <text class="d102a-big" x="340" y="716">]</text>
  <text class="d102a-big" x="216" y="708">3</text>
  <text class="d102a-big" x="286" y="708">-1</text>
  <text class="d102a-big" x="216" y="758">1</text>
  <text class="d102a-big" x="290" y="758">2</text>

  <text class="d102a-e1lbl" x="180" y="806">column 0</text>
  <text class="d102a-e2lbl" x="266" y="806">column 1</text>
  <text class="d102a-small" x="122" y="836">read each one DOWNWARDS</text>

  <path class="d102a-link1" d="M 596 372 C 520 470 300 520 230 664" marker-end="url(#d102a-arrowblue)"/>
  <path class="d102a-link2" d="M 596 322 C 480 400 340 500 300 664" marker-end="url(#d102a-arrowamber)"/>

  <!-- the rule -->
  <text class="d102a-text" x="420" y="676">The trap: a ROW is not a landing place. Row 0 here is (3, -1), and nothing lands there.</text>
  <text class="d102a-text" x="420" y="706">The matrix is written across; it means down.</text>

  <text class="d102a-head" x="420" y="754">And now every other vector, without looking at the picture again:</text>
  <text class="d102a-mono" x="420" y="786">(2, 1)  =  2 · (1, 0)  +  1 · (0, 1)</text>
  <text class="d102a-mono" x="420" y="814">so it must land at  2 · (3, 1)  +  1 · (-1, 2)  =  (6, 2) + (-1, 2)  =  (5, 4)</text>
  <text class="d102a-small" x="420" y="846">That step is the whole day: a linear transformation preserves combinations, so knowing two landings settles all of them.</text>

  <text class="d102a-small" x="70" y="878">Determinant 3·2 − (−1)·1 = 7, which is why the shaded unit square came out with area 7. All numbers here are invented.</text>
</svg>
