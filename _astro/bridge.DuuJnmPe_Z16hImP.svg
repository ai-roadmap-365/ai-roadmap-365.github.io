<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four things.">
  <title>What transfers to deep learning</title>
  <style>
    .bridge-bg   { fill: #f8fafc; }
    .bridge-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bridge-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bridge-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bridge-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bridge-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bridge-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bridge-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bridge-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bridge-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bridge-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bridge-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bridge-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .bridge-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .bridge-stage { opacity: 1; }

    .bridge-s0 { animation-delay: 0.00s; }
    .bridge-e0 { animation-delay: 0.00s; }
    .bridge-s1 { animation-delay: 1.28s; }
    .bridge-e1 { animation-delay: 1.28s; }
    .bridge-s2 { animation-delay: 2.56s; }
    .bridge-e2 { animation-delay: 2.56s; }
    .bridge-s3 { animation-delay: 3.84s; }
    .bridge-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .bridge-conn  { animation: bridge-trace 6.4s ease-in-out infinite; }
      .bridge-stage { animation: bridge-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes bridge-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes bridge-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .bridge-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .bridge-stage { animation: bridge-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes bridge-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="bridge-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="bridge-bg" width="980" height="322"/>
  <text class="bridge-h1"  x="30" y="40">What transfers to deep learning</text>
  <text class="bridge-sub" x="30" y="64">Four things.</text>
  <g class="bridge-stage bridge-s0">
    <rect class="bridge-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="bridge-step" x="44" y="142">01</text>
    <text class="bridge-name" x="70" y="142">Splitting and leakage discipline</text>
    <text class="bridge-desc" x="44" y="166">Identical, and more</text>
    <text class="bridge-desc" x="44" y="182">consequential at scale.</text>
  </g>
  <line class="bridge-line bridge-conn bridge-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#bridge-tip)"/>
  <g class="bridge-stage bridge-s1">
    <rect class="bridge-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="bridge-step" x="280" y="142">02</text>
    <text class="bridge-name" x="306" y="142">Metric choice from decision costs</text>
    <text class="bridge-desc" x="280" y="166">Unchanged.</text>
  </g>
  <line class="bridge-line bridge-conn bridge-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#bridge-tip)"/>
  <g class="bridge-stage bridge-s2">
    <rect class="bridge-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="bridge-step" x="516" y="142">03</text>
    <text class="bridge-name" x="542" y="142">Bias-variance diagnostics</text>
    <text class="bridge-desc" x="516" y="166">Read from loss curves instead of</text>
    <text class="bridge-desc" x="516" y="182">learning curves.</text>
  </g>
  <line class="bridge-line bridge-conn bridge-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#bridge-tip)"/>
  <g class="bridge-stage bridge-s3">
    <rect class="bridge-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="bridge-step" x="752" y="142">04</text>
    <text class="bridge-name" x="778" y="142">And the whole operational lifecycle</text>
    <text class="bridge-desc" x="752" y="166">Versioning, serving, monitoring,</text>
    <text class="bridge-desc" x="752" y="182">retraining.</text>
  </g>
  <text class="bridge-sub" x="30" y="304">Almost nothing about the algorithms transfers and almost everything about the method does, which is why this course precedes the deep learning one.</text>
</svg>
