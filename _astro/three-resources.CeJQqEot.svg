<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Processor, memory, or storage. There is no fourth.">
  <title>Every slow program is slow for one of three reasons</title>
  <style>
    .three-resources-bg   { fill: #f8fafc; }
    .three-resources-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-resources-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-resources-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-resources-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-resources-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-resources-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-resources-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-resources-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-resources-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-resources-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-resources-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-resources-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .three-resources-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .three-resources-stage { opacity: 1; }

    .three-resources-s0 { animation-delay: 0.00s; }
    .three-resources-e0 { animation-delay: 0.00s; }
    .three-resources-s1 { animation-delay: 1.50s; }
    .three-resources-e1 { animation-delay: 1.50s; }
    .three-resources-s2 { animation-delay: 3.00s; }
    .three-resources-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .three-resources-conn  { animation: three-resources-trace 6s ease-in-out infinite; }
      .three-resources-stage { animation: three-resources-arrive 6s ease-in-out infinite; }
    }
    @keyframes three-resources-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes three-resources-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .three-resources-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .three-resources-stage { animation: three-resources-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes three-resources-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="three-resources-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="three-resources-bg" width="980" height="322"/>
  <text class="three-resources-h1"  x="30" y="40">Every slow program is slow for one of three reasons</text>
  <text class="three-resources-sub" x="30" y="64">Processor, memory, or storage. There is no fourth.</text>
  <g class="three-resources-stage three-resources-s0">
    <rect class="three-resources-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="three-resources-step" x="44" y="142">01</text>
    <text class="three-resources-name" x="70" y="142">The processor</text>
    <text class="three-resources-desc" x="44" y="166">Doing arithmetic. Saturated means a core</text>
    <text class="three-resources-desc" x="44" y="182">pinned at 100 percent.</text>
    <text class="three-resources-edge" x="44" y="242">compute-bound</text>
  </g>
  <line class="three-resources-line three-resources-conn three-resources-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#three-resources-tip)"/>
  <g class="three-resources-stage three-resources-s1">
    <rect class="three-resources-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="three-resources-step" x="359" y="142">02</text>
    <text class="three-resources-name" x="385" y="142">Memory</text>
    <text class="three-resources-desc" x="359" y="166">Holding what is in use. Exhausted means</text>
    <text class="three-resources-desc" x="359" y="182">swapping, or a job killed outright.</text>
    <text class="three-resources-edge" x="359" y="242">memory-bound</text>
  </g>
  <line class="three-resources-line three-resources-conn three-resources-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#three-resources-tip)"/>
  <g class="three-resources-stage three-resources-s2">
    <rect class="three-resources-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="three-resources-step" x="674" y="142">03</text>
    <text class="three-resources-name" x="700" y="142">Storage</text>
    <text class="three-resources-desc" x="674" y="166">Holding what is not. Saturated means waiting</text>
    <text class="three-resources-desc" x="674" y="182">on reads that never keep up.</text>
    <text class="three-resources-edge" x="674" y="242">I/O-bound</text>
  </g>
  <text class="three-resources-sub" x="30" y="304">When a training run is slow, the useful first question is which of these three it is waiting on. The answer changes what you should do next, and the three answers have nothing in common.</text>
</svg>
