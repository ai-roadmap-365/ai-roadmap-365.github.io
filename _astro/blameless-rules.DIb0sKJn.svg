<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And one deadline that makes it real.">
  <title>Three rules that make it blameless</title>
  <style>
    .blameless-rules-bg   { fill: #f8fafc; }
    .blameless-rules-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blameless-rules-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blameless-rules-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blameless-rules-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blameless-rules-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blameless-rules-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .blameless-rules-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .blameless-rules-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .blameless-rules-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .blameless-rules-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .blameless-rules-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .blameless-rules-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .blameless-rules-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .blameless-rules-stage { opacity: 1; }

    .blameless-rules-s0 { animation-delay: 0.00s; }
    .blameless-rules-e0 { animation-delay: 0.00s; }
    .blameless-rules-s1 { animation-delay: 1.28s; }
    .blameless-rules-e1 { animation-delay: 1.28s; }
    .blameless-rules-s2 { animation-delay: 2.56s; }
    .blameless-rules-e2 { animation-delay: 2.56s; }
    .blameless-rules-s3 { animation-delay: 3.84s; }
    .blameless-rules-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .blameless-rules-conn  { animation: blameless-rules-trace 6.4s ease-in-out infinite; }
      .blameless-rules-stage { animation: blameless-rules-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes blameless-rules-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes blameless-rules-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .blameless-rules-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .blameless-rules-stage { animation: blameless-rules-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes blameless-rules-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="blameless-rules-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="blameless-rules-bg" width="980" height="322"/>
  <text class="blameless-rules-h1"  x="30" y="40">Three rules that make it blameless</text>
  <text class="blameless-rules-sub" x="30" y="64">And one deadline that makes it real.</text>
  <g class="blameless-rules-stage blameless-rules-s0">
    <rect class="blameless-rules-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="blameless-rules-step" x="44" y="142">01</text>
    <text class="blameless-rules-name" x="70" y="142">No individuals in the timeline</text>
    <text class="blameless-rules-desc" x="44" y="166">"On-call Engineer A", "Incident</text>
    <text class="blameless-rules-desc" x="44" y="182">Commander". Roles, not names.</text>
  </g>
  <line class="blameless-rules-line blameless-rules-conn blameless-rules-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#blameless-rules-tip)"/>
  <g class="blameless-rules-stage blameless-rules-s1">
    <rect class="blameless-rules-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="blameless-rules-step" x="280" y="142">02</text>
    <text class="blameless-rules-name" x="306" y="142">Focus on what permitted it</text>
    <text class="blameless-rules-desc" x="280" y="166">A human error means the system</text>
    <text class="blameless-rules-desc" x="280" y="182">allowed a dangerous action</text>
    <text class="blameless-rules-desc" x="280" y="198">without a guard.</text>
  </g>
  <line class="blameless-rules-line blameless-rules-conn blameless-rules-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#blameless-rules-tip)"/>
  <g class="blameless-rules-stage blameless-rules-s2">
    <rect class="blameless-rules-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="blameless-rules-step" x="516" y="142">03</text>
    <text class="blameless-rules-name" x="542" y="142">Action items have SLAs</text>
    <text class="blameless-rules-desc" x="516" y="166">P0 within 14 days, P1 within 30.</text>
    <text class="blameless-rules-desc" x="516" y="182">Tracked in the sprint backlog.</text>
    <text class="blameless-rules-edge" x="516" y="242">enforced</text>
  </g>
  <line class="blameless-rules-line blameless-rules-conn blameless-rules-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#blameless-rules-tip)"/>
  <g class="blameless-rules-stage blameless-rules-s3">
    <rect class="blameless-rules-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="blameless-rules-step" x="752" y="142">04</text>
    <text class="blameless-rules-name" x="778" y="142">Without the third, it is a document</text>
    <text class="blameless-rules-desc" x="752" y="166">The same incident recurs, with a</text>
    <text class="blameless-rules-desc" x="752" y="182">second post-mortem attached.</text>
  </g>
  <text class="blameless-rules-sub" x="30" y="304">The deadline is what separates a blameless culture from a comfortable one: analysis without enforced follow-through produces a well-written archive of failures that keep happening.</text>
</svg>
