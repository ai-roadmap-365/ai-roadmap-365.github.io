<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="How the prompt gets in.">
  <title>Unconditional against text-conditioned</title>
  <style>
    .cross-attention-bg   { fill: #f8fafc; }
    .cross-attention-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cross-attention-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cross-attention-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cross-attention-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cross-attention-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cross-attention-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cross-attention-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cross-attention-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cross-attention-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cross-attention-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cross-attention-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cross-attention-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cross-attention-row { opacity: 1; }
    .cross-attention-r0 { animation-delay: 0.00s; }
    .cross-attention-r1 { animation-delay: 0.45s; }
    .cross-attention-r2 { animation-delay: 0.90s; }
    .cross-attention-r3 { animation-delay: 1.35s; }
    .cross-attention-r4 { animation-delay: 1.80s; }
    .cross-attention-row { animation: cross-attention-reveal 7.3s ease-in-out infinite; }
    @keyframes cross-attention-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cross-attention-bg" width="980" height="390"/>
  <text class="cross-attention-h1"  x="30" y="40">Unconditional against text-conditioned</text>
  <text class="cross-attention-sub" x="30" y="64">How the prompt gets in.</text>
  <rect class="cross-attention-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cross-attention-name" x="46" y="122">Unconditional</text>
  <text class="cross-attention-desc" x="46" y="142">Something from the distribution.</text>
  <text class="cross-attention-desc cross-attention-row cross-attention-r0" x="46" y="182">Noise in, an image out</text>
  <text class="cross-attention-desc cross-attention-row cross-attention-r1" x="46" y="216">No control over what appears</text>
  <text class="cross-attention-desc cross-attention-row cross-attention-r2" x="46" y="250">Learns the data distribution only</text>
  <text class="cross-attention-desc cross-attention-row cross-attention-r3" x="46" y="284">Useful for study, not for products</text>
  <text class="cross-attention-desc cross-attention-row cross-attention-r4" x="46" y="318">The original formulation</text>
  <rect class="cross-attention-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cross-attention-name" x="526" y="122">Text-conditioned</text>
  <text class="cross-attention-desc" x="526" y="142">What you asked for.</text>
  <text class="cross-attention-desc cross-attention-row cross-attention-r0" x="526" y="182">A text encoding attends into every layer</text>
  <text class="cross-attention-desc cross-attention-row cross-attention-r1" x="526" y="216">The prompt steers each denoising step</text>
  <text class="cross-attention-desc cross-attention-row cross-attention-r2" x="526" y="250">Learns image and language jointly</text>
  <text class="cross-attention-desc cross-attention-row cross-attention-r3" x="526" y="284">Which is what made it useful</text>
  <text class="cross-attention-desc cross-attention-row cross-attention-r4" x="526" y="318">Cross-attention throughout</text>
  <text class="cross-attention-sub" x="30" y="372">Injecting the condition at every layer rather than only at the start is what gives the prompt influence over both composition and fine detail.</text>
</svg>
