<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each small, and cumulative.">
  <title>Four modern refinements</title>
  <style>
    .modern-refinements-bg   { fill: #f8fafc; }
    .modern-refinements-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .modern-refinements-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .modern-refinements-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .modern-refinements-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .modern-refinements-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .modern-refinements-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .modern-refinements-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .modern-refinements-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .modern-refinements-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .modern-refinements-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .modern-refinements-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .modern-refinements-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .modern-refinements-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .modern-refinements-stage { opacity: 1; }

    .modern-refinements-s0 { animation-delay: 0.00s; }
    .modern-refinements-e0 { animation-delay: 0.00s; }
    .modern-refinements-s1 { animation-delay: 1.28s; }
    .modern-refinements-e1 { animation-delay: 1.28s; }
    .modern-refinements-s2 { animation-delay: 2.56s; }
    .modern-refinements-e2 { animation-delay: 2.56s; }
    .modern-refinements-s3 { animation-delay: 3.84s; }
    .modern-refinements-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .modern-refinements-conn  { animation: modern-refinements-trace 6.4s ease-in-out infinite; }
      .modern-refinements-stage { animation: modern-refinements-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes modern-refinements-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes modern-refinements-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .modern-refinements-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .modern-refinements-stage { animation: modern-refinements-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes modern-refinements-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="modern-refinements-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="modern-refinements-bg" width="980" height="322"/>
  <text class="modern-refinements-h1"  x="30" y="40">Four modern refinements</text>
  <text class="modern-refinements-sub" x="30" y="64">Each small, and cumulative.</text>
  <g class="modern-refinements-stage modern-refinements-s0">
    <rect class="modern-refinements-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="modern-refinements-step" x="44" y="142">01</text>
    <text class="modern-refinements-name" x="70" y="142">RMS normalisation</text>
    <text class="modern-refinements-desc" x="44" y="166">Drops the mean subtraction.</text>
    <text class="modern-refinements-desc" x="44" y="182">Cheaper, and works as well.</text>
  </g>
  <line class="modern-refinements-line modern-refinements-conn modern-refinements-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#modern-refinements-tip)"/>
  <g class="modern-refinements-stage modern-refinements-s1">
    <rect class="modern-refinements-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="modern-refinements-step" x="280" y="142">02</text>
    <text class="modern-refinements-name" x="306" y="142">Gated feedforward activations</text>
    <text class="modern-refinements-desc" x="280" y="166">A learned gate on the</text>
    <text class="modern-refinements-desc" x="280" y="182">intermediate representation.</text>
    <text class="modern-refinements-desc" x="280" y="198">Consistently better.</text>
  </g>
  <line class="modern-refinements-line modern-refinements-conn modern-refinements-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#modern-refinements-tip)"/>
  <g class="modern-refinements-stage modern-refinements-s2">
    <rect class="modern-refinements-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="modern-refinements-step" x="516" y="142">03</text>
    <text class="modern-refinements-name" x="542" y="142">Depth-aware initialisation scaling</text>
    <text class="modern-refinements-desc" x="516" y="166">So very deep stacks train</text>
    <text class="modern-refinements-desc" x="516" y="182">without divergence.</text>
    <text class="modern-refinements-edge" x="516" y="242">100+ layers</text>
  </g>
  <line class="modern-refinements-line modern-refinements-conn modern-refinements-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#modern-refinements-tip)"/>
  <g class="modern-refinements-stage modern-refinements-s3">
    <rect class="modern-refinements-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="modern-refinements-step" x="752" y="142">04</text>
    <text class="modern-refinements-name" x="778" y="142">Layer scaling</text>
    <text class="modern-refinements-desc" x="752" y="166">A small learned per-channel</text>
    <text class="modern-refinements-desc" x="752" y="182">factor on each sublayer's</text>
    <text class="modern-refinements-desc" x="752" y="198">output.</text>
  </g>
  <text class="modern-refinements-sub" x="30" y="304">None of these changes the architecture conceptually, and together they are a substantial part of why models trained today are stable at depths that were impossible in 2017.</text>
</svg>
