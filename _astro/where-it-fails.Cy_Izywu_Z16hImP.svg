<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each failure looks different, and each has a different fix.">
  <title>Which stop broke?</title>
  <style>
    .where-it-fails-bg   { fill: #f8fafc; }
    .where-it-fails-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .where-it-fails-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .where-it-fails-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .where-it-fails-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .where-it-fails-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .where-it-fails-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .where-it-fails-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .where-it-fails-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .where-it-fails-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .where-it-fails-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .where-it-fails-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .where-it-fails-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .where-it-fails-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .where-it-fails-stage { opacity: 1; }

    .where-it-fails-s0 { animation-delay: 0.00s; }
    .where-it-fails-e0 { animation-delay: 0.00s; }
    .where-it-fails-s1 { animation-delay: 1.33s; }
    .where-it-fails-e1 { animation-delay: 1.33s; }
    .where-it-fails-s2 { animation-delay: 2.67s; }
    .where-it-fails-e2 { animation-delay: 2.67s; }
    .where-it-fails-s3 { animation-delay: 4.00s; }
    .where-it-fails-e3 { animation-delay: 4.00s; }
    .where-it-fails-s4 { animation-delay: 5.33s; }
    .where-it-fails-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .where-it-fails-conn  { animation: where-it-fails-trace 8s ease-in-out infinite; }
      .where-it-fails-stage { animation: where-it-fails-arrive 8s ease-in-out infinite; }
    }
    @keyframes where-it-fails-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes where-it-fails-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .where-it-fails-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .where-it-fails-stage { animation: where-it-fails-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes where-it-fails-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="where-it-fails-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="where-it-fails-bg" width="980" height="322"/>
  <text class="where-it-fails-h1"  x="30" y="40">Which stop broke?</text>
  <text class="where-it-fails-sub" x="30" y="64">Each failure looks different, and each has a different fix.</text>
  <g class="where-it-fails-stage where-it-fails-s0">
    <rect class="where-it-fails-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="where-it-fails-step" x="44" y="142">01</text>
    <text class="where-it-fails-name" x="70" y="142">DNS</text>
    <text class="where-it-fails-desc" x="44" y="166">"Could not resolve host."</text>
    <text class="where-it-fails-desc" x="44" y="182">The name does not exist,</text>
    <text class="where-it-fails-desc" x="44" y="198">or your resolver is</text>
    <text class="where-it-fails-edge" x="44" y="242">stop 2</text>
  </g>
  <line class="where-it-fails-line where-it-fails-conn where-it-fails-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#where-it-fails-tip)"/>
  <g class="where-it-fails-stage where-it-fails-s1">
    <rect class="where-it-fails-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="where-it-fails-step" x="233" y="142">02</text>
    <text class="where-it-fails-name" x="259" y="142">TCP</text>
    <text class="where-it-fails-desc" x="233" y="166">"Connection refused" or a</text>
    <text class="where-it-fails-desc" x="233" y="182">hang. Nothing is</text>
    <text class="where-it-fails-desc" x="233" y="198">listening, or a firewall</text>
    <text class="where-it-fails-edge" x="233" y="242">stop 3</text>
  </g>
  <line class="where-it-fails-line where-it-fails-conn where-it-fails-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#where-it-fails-tip)"/>
  <g class="where-it-fails-stage where-it-fails-s2">
    <rect class="where-it-fails-warn" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="where-it-fails-step" x="422" y="142">03</text>
    <text class="where-it-fails-name" x="448" y="142">TLS</text>
    <text class="where-it-fails-desc" x="422" y="166">Certificate expired, or</text>
    <text class="where-it-fails-desc" x="422" y="182">issued for a different</text>
    <text class="where-it-fails-desc" x="422" y="198">name. No request was ever</text>
    <text class="where-it-fails-edge" x="422" y="242">stop 4</text>
  </g>
  <line class="where-it-fails-line where-it-fails-conn where-it-fails-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#where-it-fails-tip)"/>
  <g class="where-it-fails-stage where-it-fails-s3">
    <rect class="where-it-fails-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="where-it-fails-step" x="611" y="142">04</text>
    <text class="where-it-fails-name" x="637" y="142">HTTP</text>
    <text class="where-it-fails-desc" x="611" y="166">404 means the server</text>
    <text class="where-it-fails-desc" x="611" y="182">answered and has no such</text>
    <text class="where-it-fails-desc" x="611" y="198">path. 500 means it broke</text>
    <text class="where-it-fails-edge" x="611" y="242">stop 6</text>
  </g>
  <line class="where-it-fails-line where-it-fails-conn where-it-fails-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#where-it-fails-tip)"/>
  <g class="where-it-fails-stage where-it-fails-s4">
    <rect class="where-it-fails-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="where-it-fails-step" x="800" y="142">05</text>
    <text class="where-it-fails-name" x="826" y="142">Sub-resources</text>
    <text class="where-it-fails-desc" x="800" y="166">HTML arrives instantly,</text>
    <text class="where-it-fails-desc" x="800" y="182">page stays blank.</text>
    <text class="where-it-fails-desc" x="800" y="198">Something at stop 8 is</text>
    <text class="where-it-fails-edge" x="800" y="242">stop 8</text>
  </g>
  <text class="where-it-fails-sub" x="30" y="304">Naming the stop before changing anything is the difference between a ten-minute fix and an afternoon.</text>
</svg>
