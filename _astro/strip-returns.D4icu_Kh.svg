<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="No string method modifies anything.">
  <title>Why .strip() on its own line does nothing</title>
  <style>
    .strip-returns-bg   { fill: #f8fafc; }
    .strip-returns-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .strip-returns-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .strip-returns-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .strip-returns-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .strip-returns-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .strip-returns-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .strip-returns-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .strip-returns-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .strip-returns-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .strip-returns-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .strip-returns-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .strip-returns-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .strip-returns-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .strip-returns-stage { opacity: 1; }

    .strip-returns-s0 { animation-delay: 0.00s; }
    .strip-returns-e0 { animation-delay: 0.00s; }
    .strip-returns-s1 { animation-delay: 1.28s; }
    .strip-returns-e1 { animation-delay: 1.28s; }
    .strip-returns-s2 { animation-delay: 2.56s; }
    .strip-returns-e2 { animation-delay: 2.56s; }
    .strip-returns-s3 { animation-delay: 3.84s; }
    .strip-returns-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .strip-returns-conn  { animation: strip-returns-trace 6.4s ease-in-out infinite; }
      .strip-returns-stage { animation: strip-returns-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes strip-returns-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes strip-returns-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .strip-returns-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .strip-returns-stage { animation: strip-returns-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes strip-returns-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="strip-returns-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="strip-returns-bg" width="980" height="322"/>
  <text class="strip-returns-h1"  x="30" y="40">Why .strip() on its own line does nothing</text>
  <text class="strip-returns-sub" x="30" y="64">No string method modifies anything.</text>
  <g class="strip-returns-stage strip-returns-s0">
    <rect class="strip-returns-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="strip-returns-step" x="44" y="142">01</text>
    <text class="strip-returns-name" x="70" y="142">text.strip()</text>
    <text class="strip-returns-desc" x="44" y="166">Computes a new, stripped string.</text>
  </g>
  <line class="strip-returns-line strip-returns-conn strip-returns-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#strip-returns-tip)"/>
  <g class="strip-returns-stage strip-returns-s1">
    <rect class="strip-returns-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="strip-returns-step" x="280" y="142">02</text>
    <text class="strip-returns-name" x="306" y="142">And returns it</text>
    <text class="strip-returns-desc" x="280" y="166">The original is untouched — it</text>
    <text class="strip-returns-desc" x="280" y="182">cannot be touched.</text>
    <text class="strip-returns-edge" x="280" y="242">immutable</text>
  </g>
  <line class="strip-returns-line strip-returns-conn strip-returns-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#strip-returns-tip)"/>
  <g class="strip-returns-stage strip-returns-s2">
    <rect class="strip-returns-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="strip-returns-step" x="516" y="142">03</text>
    <text class="strip-returns-name" x="542" y="142">On its own line, it is discarded</text>
    <text class="strip-returns-desc" x="516" y="166">The work happened; the result</text>
    <text class="strip-returns-desc" x="516" y="182">went nowhere.</text>
    <text class="strip-returns-edge" x="516" y="242">lost</text>
  </g>
  <line class="strip-returns-line strip-returns-conn strip-returns-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#strip-returns-tip)"/>
  <g class="strip-returns-stage strip-returns-s3">
    <rect class="strip-returns-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="strip-returns-step" x="752" y="142">04</text>
    <text class="strip-returns-name" x="778" y="142">text = text.strip()</text>
    <text class="strip-returns-desc" x="752" y="166">Assign it, or rebind. Then the</text>
    <text class="strip-returns-desc" x="752" y="182">name points at the new string.</text>
  </g>
  <text class="strip-returns-sub" x="30" y="304">Every method on this page behaves this way — replace, lower, title, all of them. Coming from a language where strings are mutable, this is the single most common early mistake.</text>
</svg>
