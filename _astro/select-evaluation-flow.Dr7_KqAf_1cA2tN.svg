<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="d086f-title d086f-desc">
  <title id="d086f-title">One query flowing through the seven evaluation stages, with the real row count at every step</title>
  <desc id="d086f-desc">A left-to-right pipeline of seven stages with the row count entering and leaving each one, taken from a real run against the lab database. FROM reads 24 book rows. WHERE on the publication year keeps 20, dropping three books published before 2000 and one whose year is NULL. GROUP BY on genre collapses those 20 rows into 6 buckets. HAVING on the bucket size keeps 3. SELECT projects those 3 buckets into 3 rows of 2 columns, the genre and its count. ORDER BY sorts those same 3 rows and changes no count. LIMIT 2 cuts the result to 2 rows. A travelling marker moves along the pipeline and each stage lights up in turn; with motion disabled every stage, arrow, label and number is still shown.</desc>

  <style>
    .d086f-bg     { fill: #f8fafc; }
    .d086f-title  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 22px; font-weight: 600; fill: #1a202c; }
    .d086f-label  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 600; fill: #1a202c; }
    .d086f-small  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d086f-count  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 26px; font-weight: 600; fill: #1d4ed8; }
    .d086f-unit   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1a202c; }
    .d086f-note   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1a202c; }
    .d086f-cut    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #b91c1c; }

    /* Stages light up in order. The resting fill is the readable state. */
    .d086f-stage  { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5; animation: d086f-lift 7s ease-in-out infinite; }
    .d086f-s1 { animation-delay: 0s; }
    .d086f-s2 { animation-delay: 0.8s; }
    .d086f-s3 { animation-delay: 1.6s; }
    .d086f-s4 { animation-delay: 2.4s; }
    .d086f-s5 { animation-delay: 3.2s; }
    .d086f-s6 { animation-delay: 4.0s; }
    .d086f-s7 { animation-delay: 4.8s; }
    @keyframes d086f-lift {
      0%, 16%, 100% { fill: #e0e7ff; }
      4%, 12%       { fill: #bfdbfe; }
    }

    /* The wires flow. Reduced motion turns them into solid arrows. */
    .d086f-wire {
      fill: none; stroke: #1d4ed8; stroke-width: 2.5;
      stroke-dasharray: 9 7; animation: d086f-march 1.6s linear infinite;
    }
    @keyframes d086f-march { to { stroke-dashoffset: -16; } }

    /* A marker travels the pipeline, resting visible at the start. */
    .d086f-token { fill: #1d4ed8; animation: d086f-travel 7s ease-in-out infinite; }
    @keyframes d086f-travel {
      0%   { transform: translateX(0);    opacity: 1; }
      6%   { transform: translateX(0);    opacity: 1; }
      94%  { transform: translateX(984px); opacity: 1; }
      100% { transform: translateX(984px); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d086f-stage { animation: none; fill: #e0e7ff; }
      .d086f-wire  { animation: none; stroke-dasharray: none; }
      .d086f-token { animation: none; transform: none; opacity: 1; }
    }
  </style>

  <defs>
    <marker id="d086f-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
  </defs>

  <rect class="d086f-bg" x="0" y="0" width="1200" height="560" />

  <text class="d086f-title" x="30" y="44">What actually happens, and how much is left after each step</text>
  <text class="d086f-small" x="30" y="70">Real counts from the lab database: SELECT genre, COUNT(*) FROM books WHERE published_year &gt;= 2000 GROUP BY genre HAVING COUNT(*) &gt;= 3 ORDER BY COUNT(*) DESC LIMIT 2</text>

  <!-- travelling marker, above the pipeline -->
  <circle class="d086f-token" cx="96" cy="128" r="9" />
  <text class="d086f-small" x="96" y="108" text-anchor="middle">the query</text>

  <!-- wires between the stages -->
  <path class="d086f-wire" d="M 162 250 L 192 250" marker-end="url(#d086f-arrow)" />
  <path class="d086f-wire" d="M 330 250 L 360 250" marker-end="url(#d086f-arrow)" />
  <path class="d086f-wire" d="M 498 250 L 528 250" marker-end="url(#d086f-arrow)" />
  <path class="d086f-wire" d="M 666 250 L 696 250" marker-end="url(#d086f-arrow)" />
  <path class="d086f-wire" d="M 834 250 L 864 250" marker-end="url(#d086f-arrow)" />
  <path class="d086f-wire" d="M 1002 250 L 1032 250" marker-end="url(#d086f-arrow)" />

  <!-- 1 FROM -->
  <rect class="d086f-stage d086f-s1" x="30" y="196" width="132" height="108" rx="8" />
  <text class="d086f-label" x="96" y="226" text-anchor="middle">FROM</text>
  <text class="d086f-small" x="96" y="248" text-anchor="middle">read the table</text>
  <text class="d086f-count" x="96" y="284" text-anchor="middle">24</text>
  <text class="d086f-unit"  x="96" y="330" text-anchor="middle">rows out</text>
  <text class="d086f-small" x="96" y="354" text-anchor="middle">every book</text>

  <!-- 2 WHERE -->
  <rect class="d086f-stage d086f-s2" x="198" y="196" width="132" height="108" rx="8" />
  <text class="d086f-label" x="264" y="226" text-anchor="middle">WHERE</text>
  <text class="d086f-small" x="264" y="248" text-anchor="middle">keep TRUE rows</text>
  <text class="d086f-count" x="264" y="284" text-anchor="middle">20</text>
  <text class="d086f-unit"  x="264" y="330" text-anchor="middle">rows out</text>
  <text class="d086f-cut"   x="264" y="354" text-anchor="middle">4 dropped: 3 too old,</text>
  <text class="d086f-cut"   x="264" y="374" text-anchor="middle">1 with no year at all</text>

  <!-- 3 GROUP BY -->
  <rect class="d086f-stage d086f-s3" x="366" y="196" width="132" height="108" rx="8" />
  <text class="d086f-label" x="432" y="226" text-anchor="middle">GROUP BY</text>
  <text class="d086f-small" x="432" y="248" text-anchor="middle">collapse to buckets</text>
  <text class="d086f-count" x="432" y="284" text-anchor="middle">6</text>
  <text class="d086f-unit"  x="432" y="330" text-anchor="middle">buckets out</text>
  <text class="d086f-small" x="432" y="354" text-anchor="middle">NULLs share one</text>

  <!-- 4 HAVING -->
  <rect class="d086f-stage d086f-s4" x="534" y="196" width="132" height="108" rx="8" />
  <text class="d086f-label" x="600" y="226" text-anchor="middle">HAVING</text>
  <text class="d086f-small" x="600" y="248" text-anchor="middle">keep TRUE buckets</text>
  <text class="d086f-count" x="600" y="284" text-anchor="middle">3</text>
  <text class="d086f-unit"  x="600" y="330" text-anchor="middle">buckets out</text>
  <text class="d086f-cut"   x="600" y="354" text-anchor="middle">3 dropped: too small</text>

  <!-- 5 SELECT -->
  <rect class="d086f-stage d086f-s5" x="702" y="196" width="132" height="108" rx="8" />
  <text class="d086f-label" x="768" y="226" text-anchor="middle">SELECT</text>
  <text class="d086f-small" x="768" y="248" text-anchor="middle">project the columns</text>
  <text class="d086f-count" x="768" y="284" text-anchor="middle">3</text>
  <text class="d086f-unit"  x="768" y="330" text-anchor="middle">rows out</text>
  <text class="d086f-small" x="768" y="354" text-anchor="middle">aliases born here</text>

  <!-- 6 ORDER BY -->
  <rect class="d086f-stage d086f-s6" x="870" y="196" width="132" height="108" rx="8" />
  <text class="d086f-label" x="936" y="226" text-anchor="middle">ORDER BY</text>
  <text class="d086f-small" x="936" y="248" text-anchor="middle">sort what is left</text>
  <text class="d086f-count" x="936" y="284" text-anchor="middle">3</text>
  <text class="d086f-unit"  x="936" y="330" text-anchor="middle">rows out</text>
  <text class="d086f-small" x="936" y="354" text-anchor="middle">count never changes</text>

  <!-- 7 LIMIT -->
  <rect class="d086f-stage d086f-s7" x="1038" y="196" width="132" height="108" rx="8" />
  <text class="d086f-label" x="1104" y="226" text-anchor="middle">LIMIT 2</text>
  <text class="d086f-small" x="1104" y="248" text-anchor="middle">cut the top off</text>
  <text class="d086f-count" x="1104" y="284" text-anchor="middle">2</text>
  <text class="d086f-unit"  x="1104" y="330" text-anchor="middle">rows out</text>
  <text class="d086f-cut"   x="1104" y="354" text-anchor="middle">1 dropped: past the cut</text>

  <text class="d086f-note" x="30" y="416">Read the shape, not just the numbers. Two stages THROW ROWS AWAY (WHERE, HAVING) and they are the two that carry a predicate.</text>
  <text class="d086f-note" x="30" y="440">One stage CHANGES WHAT A ROW IS: after GROUP BY there are no longer 20 books, there are 6 buckets, and no bucket has a single title to give you.</text>
  <text class="d086f-note" x="30" y="464">One stage CHANGES THE COLUMNS but never the count (SELECT). One changes neither the count nor the columns, only the order (ORDER BY).</text>
  <text class="d086f-note" x="30" y="488">And LIMIT is last, which is why LIMIT without ORDER BY takes an arbitrary slice: at that point nothing has promised you an order at all.</text>
  <text class="d086f-small" x="30" y="524">Resting state: all seven stages shaded, all arrows drawn, every count printed, marker at the start. With reduced motion requested this is exactly what you see.</text>
</svg>
