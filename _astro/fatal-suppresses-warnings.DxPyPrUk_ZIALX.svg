<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Because they would be derived from an impossible ordering.">
  <title>A fatal error suppresses the warnings</title>
  <style>
    .fatal-suppresses-warnings-bg   { fill: #f8fafc; }
    .fatal-suppresses-warnings-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fatal-suppresses-warnings-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fatal-suppresses-warnings-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fatal-suppresses-warnings-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fatal-suppresses-warnings-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fatal-suppresses-warnings-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fatal-suppresses-warnings-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fatal-suppresses-warnings-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fatal-suppresses-warnings-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fatal-suppresses-warnings-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fatal-suppresses-warnings-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fatal-suppresses-warnings-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fatal-suppresses-warnings-row { opacity: 1; }
    .fatal-suppresses-warnings-r0 { animation-delay: 0.00s; }
    .fatal-suppresses-warnings-r1 { animation-delay: 0.45s; }
    .fatal-suppresses-warnings-r2 { animation-delay: 0.90s; }
    .fatal-suppresses-warnings-r3 { animation-delay: 1.35s; }
    .fatal-suppresses-warnings-r4 { animation-delay: 1.80s; }
    .fatal-suppresses-warnings-row { animation: fatal-suppresses-warnings-reveal 7.3s ease-in-out infinite; }
    @keyframes fatal-suppresses-warnings-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="fatal-suppresses-warnings-bg" width="980" height="390"/>
  <text class="fatal-suppresses-warnings-h1"  x="30" y="40">A fatal error suppresses the warnings</text>
  <text class="fatal-suppresses-warnings-sub" x="30" y="64">Because they would be derived from an impossible ordering.</text>
  <rect class="fatal-suppresses-warnings-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="fatal-suppresses-warnings-name" x="46" y="122">Report the cycle alone</text>
  <text class="fatal-suppresses-warnings-desc" x="46" y="142">What the lab does.</text>
  <text class="fatal-suppresses-warnings-desc fatal-suppresses-warnings-row fatal-suppresses-warnings-r0" x="46" y="182">cycle: api -&gt; worker -&gt; api</text>
  <text class="fatal-suppresses-warnings-desc fatal-suppresses-warnings-row fatal-suppresses-warnings-r1" x="46" y="216">Plus checks that do not need an ordering</text>
  <text class="fatal-suppresses-warnings-desc fatal-suppresses-warnings-row fatal-suppresses-warnings-r2" x="46" y="250">undefined-dependency: ghost -&gt; nowhere</text>
  <text class="fatal-suppresses-warnings-desc fatal-suppresses-warnings-row fatal-suppresses-warnings-r3" x="46" y="284">port-conflict: 8000 claimed twice</text>
  <text class="fatal-suppresses-warnings-desc fatal-suppresses-warnings-row fatal-suppresses-warnings-r4" x="46" y="318">Timing findings suppressed</text>
  <rect class="fatal-suppresses-warnings-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="fatal-suppresses-warnings-name" x="526" y="122">Report everything</text>
  <text class="fatal-suppresses-warnings-desc" x="526" y="142">Noise on a fatal error.</text>
  <text class="fatal-suppresses-warnings-desc fatal-suppresses-warnings-row fatal-suppresses-warnings-r0" x="526" y="182">"Starts too early" from an order that cannot exist</text>
  <text class="fatal-suppresses-warnings-desc fatal-suppresses-warnings-row fatal-suppresses-warnings-r1" x="526" y="216">Derived from an impossible premise</text>
  <text class="fatal-suppresses-warnings-desc fatal-suppresses-warnings-row fatal-suppresses-warnings-r2" x="526" y="250">Buries the one finding that matters</text>
  <text class="fatal-suppresses-warnings-desc fatal-suppresses-warnings-row fatal-suppresses-warnings-r3" x="526" y="284">The reader triages noise first</text>
  <text class="fatal-suppresses-warnings-desc fatal-suppresses-warnings-row fatal-suppresses-warnings-r4" x="526" y="318">And may miss the cycle entirely</text>
  <text class="fatal-suppresses-warnings-sub" x="30" y="372">This is a general reporting rule worth carrying: when one finding invalidates the premise of others, reporting the others is not thoroughness, it is burying the finding that has to be fixed first.</text>
</svg>
