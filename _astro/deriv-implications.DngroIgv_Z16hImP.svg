<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are practical.">
  <title>Four consequences of differentiability</title>
  <style>
    .deriv-implications-bg   { fill: #f8fafc; }
    .deriv-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deriv-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deriv-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deriv-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deriv-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deriv-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .deriv-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .deriv-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .deriv-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .deriv-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .deriv-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .deriv-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .deriv-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .deriv-implications-stage { opacity: 1; }

    .deriv-implications-s0 { animation-delay: 0.00s; }
    .deriv-implications-e0 { animation-delay: 0.00s; }
    .deriv-implications-s1 { animation-delay: 1.28s; }
    .deriv-implications-e1 { animation-delay: 1.28s; }
    .deriv-implications-s2 { animation-delay: 2.56s; }
    .deriv-implications-e2 { animation-delay: 2.56s; }
    .deriv-implications-s3 { animation-delay: 3.84s; }
    .deriv-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .deriv-implications-conn  { animation: deriv-implications-trace 6.4s ease-in-out infinite; }
      .deriv-implications-stage { animation: deriv-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes deriv-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes deriv-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .deriv-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .deriv-implications-stage { animation: deriv-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes deriv-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="deriv-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="deriv-implications-bg" width="980" height="322"/>
  <text class="deriv-implications-h1"  x="30" y="40">Four consequences of differentiability</text>
  <text class="deriv-implications-sub" x="30" y="64">Two are practical.</text>
  <g class="deriv-implications-stage deriv-implications-s0">
    <rect class="deriv-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="deriv-implications-step" x="44" y="142">01</text>
    <text class="deriv-implications-name" x="70" y="142">Optimisation becomes possible: follow the slope down</text>
    <text class="deriv-implications-desc" x="44" y="166">Which is how models are trained.</text>
  </g>
  <line class="deriv-implications-line deriv-implications-conn deriv-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#deriv-implications-tip)"/>
  <g class="deriv-implications-stage deriv-implications-s1">
    <rect class="deriv-implications-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="deriv-implications-step" x="280" y="142">02</text>
    <text class="deriv-implications-name" x="306" y="142">And sensitivity is quantified: how much output moves</text>
    <text class="deriv-implications-desc" x="280" y="166">Per unit of input.</text>
  </g>
  <line class="deriv-implications-line deriv-implications-conn deriv-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#deriv-implications-tip)"/>
  <g class="deriv-implications-stage deriv-implications-s2">
    <rect class="deriv-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="deriv-implications-step" x="516" y="142">03</text>
    <text class="deriv-implications-name" x="542" y="142">But numerical approximations of it are unstable</text>
    <text class="deriv-implications-desc" x="516" y="166">Very small steps amplify</text>
    <text class="deriv-implications-desc" x="516" y="182">rounding error.</text>
  </g>
  <line class="deriv-implications-line deriv-implications-conn deriv-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#deriv-implications-tip)"/>
  <g class="deriv-implications-stage deriv-implications-s3">
    <rect class="deriv-implications-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="deriv-implications-step" x="752" y="142">04</text>
    <text class="deriv-implications-name" x="778" y="142">Which is why models are built from differentiable pieces</text>
    <text class="deriv-implications-desc" x="752" y="166">Deliberately.</text>
  </g>
  <text class="deriv-implications-sub" x="30" y="304">Choosing differentiable components is a genuine design constraint on model architecture, and it explains several activation functions that look otherwise arbitrary.</text>
</svg>
