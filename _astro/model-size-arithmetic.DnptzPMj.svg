<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="There is nothing more to model sizing than this.">
  <title>Parameters times bytes is the whole calculation</title>
  <style>
    .model-size-arithmetic-bg   { fill: #f8fafc; }
    .model-size-arithmetic-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-size-arithmetic-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-size-arithmetic-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-size-arithmetic-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-size-arithmetic-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-size-arithmetic-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .model-size-arithmetic-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .model-size-arithmetic-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .model-size-arithmetic-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .model-size-arithmetic-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .model-size-arithmetic-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .model-size-arithmetic-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .model-size-arithmetic-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .model-size-arithmetic-stage { opacity: 1; }

    .model-size-arithmetic-s0 { animation-delay: 0.00s; }
    .model-size-arithmetic-e0 { animation-delay: 0.00s; }
    .model-size-arithmetic-s1 { animation-delay: 1.28s; }
    .model-size-arithmetic-e1 { animation-delay: 1.28s; }
    .model-size-arithmetic-s2 { animation-delay: 2.56s; }
    .model-size-arithmetic-e2 { animation-delay: 2.56s; }
    .model-size-arithmetic-s3 { animation-delay: 3.84s; }
    .model-size-arithmetic-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .model-size-arithmetic-conn  { animation: model-size-arithmetic-trace 6.4s ease-in-out infinite; }
      .model-size-arithmetic-stage { animation: model-size-arithmetic-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes model-size-arithmetic-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes model-size-arithmetic-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .model-size-arithmetic-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .model-size-arithmetic-stage { animation: model-size-arithmetic-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes model-size-arithmetic-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="model-size-arithmetic-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="model-size-arithmetic-bg" width="980" height="322"/>
  <text class="model-size-arithmetic-h1"  x="30" y="40">Parameters times bytes is the whole calculation</text>
  <text class="model-size-arithmetic-sub" x="30" y="64">There is nothing more to model sizing than this.</text>
  <g class="model-size-arithmetic-stage model-size-arithmetic-s0">
    <rect class="model-size-arithmetic-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="model-size-arithmetic-step" x="44" y="142">01</text>
    <text class="model-size-arithmetic-name" x="70" y="142">float32</text>
    <text class="model-size-arithmetic-desc" x="44" y="166">4 bytes per parameter. The</text>
    <text class="model-size-arithmetic-desc" x="44" y="182">training default, once.</text>
    <text class="model-size-arithmetic-edge" x="44" y="242">280 GB</text>
  </g>
  <line class="model-size-arithmetic-line model-size-arithmetic-conn model-size-arithmetic-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#model-size-arithmetic-tip)"/>
  <g class="model-size-arithmetic-stage model-size-arithmetic-s1">
    <rect class="model-size-arithmetic-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="model-size-arithmetic-step" x="280" y="142">02</text>
    <text class="model-size-arithmetic-name" x="306" y="142">bfloat16</text>
    <text class="model-size-arithmetic-desc" x="280" y="166">2 bytes. Range kept, precision</text>
    <text class="model-size-arithmetic-desc" x="280" y="182">traded.</text>
    <text class="model-size-arithmetic-edge" x="280" y="242">140 GB</text>
  </g>
  <line class="model-size-arithmetic-line model-size-arithmetic-conn model-size-arithmetic-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#model-size-arithmetic-tip)"/>
  <g class="model-size-arithmetic-stage model-size-arithmetic-s2">
    <rect class="model-size-arithmetic-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="model-size-arithmetic-step" x="516" y="142">03</text>
    <text class="model-size-arithmetic-name" x="542" y="142">int8</text>
    <text class="model-size-arithmetic-desc" x="516" y="166">1 byte. Quantised after</text>
    <text class="model-size-arithmetic-desc" x="516" y="182">training.</text>
    <text class="model-size-arithmetic-edge" x="516" y="242">70 GB</text>
  </g>
  <line class="model-size-arithmetic-line model-size-arithmetic-conn model-size-arithmetic-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#model-size-arithmetic-tip)"/>
  <g class="model-size-arithmetic-stage model-size-arithmetic-s3">
    <rect class="model-size-arithmetic-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="model-size-arithmetic-step" x="752" y="142">04</text>
    <text class="model-size-arithmetic-name" x="778" y="142">4-bit</text>
    <text class="model-size-arithmetic-desc" x="752" y="166">Half a byte. Fits on hardware it</text>
    <text class="model-size-arithmetic-desc" x="752" y="182">could not before.</text>
    <text class="model-size-arithmetic-edge" x="752" y="242">35 GB</text>
  </g>
  <text class="model-size-arithmetic-sub" x="30" y="304">Each step also quarters the bytes moved per token, which raises the bandwidth ceiling from Day 3.</text>
</svg>
