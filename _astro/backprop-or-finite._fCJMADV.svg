<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two passes, or twenty million.">
  <title>Analytical gradients, or finite differences</title>
  <style>
    .backprop-or-finite-bg   { fill: #f8fafc; }
    .backprop-or-finite-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backprop-or-finite-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backprop-or-finite-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backprop-or-finite-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backprop-or-finite-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backprop-or-finite-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .backprop-or-finite-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .backprop-or-finite-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .backprop-or-finite-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .backprop-or-finite-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .backprop-or-finite-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .backprop-or-finite-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .backprop-or-finite-row { opacity: 1; }
    .backprop-or-finite-r0 { animation-delay: 0.00s; }
    .backprop-or-finite-r1 { animation-delay: 0.45s; }
    .backprop-or-finite-r2 { animation-delay: 0.90s; }
    .backprop-or-finite-r3 { animation-delay: 1.35s; }
    .backprop-or-finite-r4 { animation-delay: 1.80s; }
    .backprop-or-finite-row { animation: backprop-or-finite-reveal 7.3s ease-in-out infinite; }
    @keyframes backprop-or-finite-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="backprop-or-finite-bg" width="980" height="390"/>
  <text class="backprop-or-finite-h1"  x="30" y="40">Analytical gradients, or finite differences</text>
  <text class="backprop-or-finite-sub" x="30" y="64">Two passes, or twenty million.</text>
  <rect class="backprop-or-finite-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="backprop-or-finite-name" x="46" y="122">Backpropagation</text>
  <text class="backprop-or-finite-desc" x="46" y="142">One backward pass.</text>
  <text class="backprop-or-finite-desc backprop-or-finite-row backprop-or-finite-r0" x="46" y="182">Exact analytical derivatives</text>
  <text class="backprop-or-finite-desc backprop-or-finite-row backprop-or-finite-r1" x="46" y="216">All parameters, simultaneously</text>
  <text class="backprop-or-finite-desc backprop-or-finite-row backprop-or-finite-r2" x="46" y="250">Cost comparable to one forward pass</text>
  <text class="backprop-or-finite-desc backprop-or-finite-row backprop-or-finite-r3" x="46" y="284">Numerically stable</text>
  <text class="backprop-or-finite-desc backprop-or-finite-row backprop-or-finite-r4" x="46" y="318">This is what makes training feasible</text>
  <rect class="backprop-or-finite-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="backprop-or-finite-name" x="526" y="122">Finite differences</text>
  <text class="backprop-or-finite-desc" x="526" y="142">Two passes per parameter.</text>
  <text class="backprop-or-finite-desc backprop-or-finite-row backprop-or-finite-r0" x="526" y="182">Approximate, with a step-size trade-off</text>
  <text class="backprop-or-finite-desc backprop-or-finite-row backprop-or-finite-r1" x="526" y="216">Ten million parameters: twenty million passes</text>
  <text class="backprop-or-finite-desc backprop-or-finite-row backprop-or-finite-r2" x="526" y="250">Hours per single gradient step</text>
  <text class="backprop-or-finite-desc backprop-or-finite-row backprop-or-finite-r3" x="526" y="284">Cancellation error at small steps</text>
  <text class="backprop-or-finite-desc backprop-or-finite-row backprop-or-finite-r4" x="526" y="318">Useful only to check a gradient, on a tiny model</text>
  <text class="backprop-or-finite-sub" x="30" y="372">Finite differences retain exactly one use: verifying that a hand-written backward pass agrees with the forward pass, on a network small enough for the comparison to finish.</text>
</svg>
