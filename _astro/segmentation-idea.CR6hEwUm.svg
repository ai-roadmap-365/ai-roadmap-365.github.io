<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>What makes a segmentation useful</title>
  <style>
    .segmentation-idea-bg   { fill: #f8fafc; }
    .segmentation-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .segmentation-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .segmentation-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .segmentation-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .segmentation-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .segmentation-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .segmentation-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .segmentation-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .segmentation-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .segmentation-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .segmentation-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .segmentation-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .segmentation-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .segmentation-idea-stage { opacity: 1; }

    .segmentation-idea-s0 { animation-delay: 0.00s; }
    .segmentation-idea-e0 { animation-delay: 0.00s; }
    .segmentation-idea-s1 { animation-delay: 1.28s; }
    .segmentation-idea-e1 { animation-delay: 1.28s; }
    .segmentation-idea-s2 { animation-delay: 2.56s; }
    .segmentation-idea-e2 { animation-delay: 2.56s; }
    .segmentation-idea-s3 { animation-delay: 3.84s; }
    .segmentation-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .segmentation-idea-conn  { animation: segmentation-idea-trace 6.4s ease-in-out infinite; }
      .segmentation-idea-stage { animation: segmentation-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes segmentation-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes segmentation-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .segmentation-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .segmentation-idea-stage { animation: segmentation-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes segmentation-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="segmentation-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="segmentation-idea-bg" width="980" height="322"/>
  <text class="segmentation-idea-h1"  x="30" y="40">What makes a segmentation useful</text>
  <text class="segmentation-idea-sub" x="30" y="64">Four properties.</text>
  <g class="segmentation-idea-stage segmentation-idea-s0">
    <rect class="segmentation-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="segmentation-idea-step" x="44" y="142">01</text>
    <text class="segmentation-idea-name" x="70" y="142">Segments differ on something that matters</text>
    <text class="segmentation-idea-desc" x="44" y="166">Not merely on something</text>
    <text class="segmentation-idea-desc" x="44" y="182">measurable.</text>
  </g>
  <line class="segmentation-idea-line segmentation-idea-conn segmentation-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#segmentation-idea-tip)"/>
  <g class="segmentation-idea-stage segmentation-idea-s1">
    <rect class="segmentation-idea-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="segmentation-idea-step" x="280" y="142">02</text>
    <text class="segmentation-idea-name" x="306" y="142">Each is large enough to be worth addressing</text>
    <text class="segmentation-idea-desc" x="280" y="166">A segment of eleven people is a</text>
    <text class="segmentation-idea-desc" x="280" y="182">curiosity.</text>
  </g>
  <line class="segmentation-idea-line segmentation-idea-conn segmentation-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#segmentation-idea-tip)"/>
  <g class="segmentation-idea-stage segmentation-idea-s2">
    <rect class="segmentation-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="segmentation-idea-step" x="516" y="142">03</text>
    <text class="segmentation-idea-name" x="542" y="142">And describable in a sentence</text>
    <text class="segmentation-idea-desc" x="516" y="166">Or nobody in the business will</text>
    <text class="segmentation-idea-desc" x="516" y="182">use it.</text>
  </g>
  <line class="segmentation-idea-line segmentation-idea-conn segmentation-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#segmentation-idea-tip)"/>
  <g class="segmentation-idea-stage segmentation-idea-s3">
    <rect class="segmentation-idea-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="segmentation-idea-step" x="752" y="142">04</text>
    <text class="segmentation-idea-name" x="778" y="142">With a different action for each</text>
    <text class="segmentation-idea-desc" x="752" y="166">Which is the actual test of a</text>
    <text class="segmentation-idea-desc" x="752" y="182">segmentation.</text>
  </g>
  <text class="segmentation-idea-sub" x="30" y="304">The last property is the one that fails most often: a statistically clean segmentation with no differentiated action is an expensive way to produce a chart.</text>
</svg>
