<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Averaging weights, and averaging predictions.">
  <title>Two cheap accuracy gains</title>
  <style>
    .swa-tta-bg   { fill: #f8fafc; }
    .swa-tta-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .swa-tta-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .swa-tta-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .swa-tta-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .swa-tta-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .swa-tta-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .swa-tta-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .swa-tta-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .swa-tta-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .swa-tta-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .swa-tta-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .swa-tta-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .swa-tta-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .swa-tta-stage { opacity: 1; }

    .swa-tta-s0 { animation-delay: 0.00s; }
    .swa-tta-e0 { animation-delay: 0.00s; }
    .swa-tta-s1 { animation-delay: 1.50s; }
    .swa-tta-e1 { animation-delay: 1.50s; }
    .swa-tta-s2 { animation-delay: 3.00s; }
    .swa-tta-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .swa-tta-conn  { animation: swa-tta-trace 6s ease-in-out infinite; }
      .swa-tta-stage { animation: swa-tta-arrive 6s ease-in-out infinite; }
    }
    @keyframes swa-tta-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes swa-tta-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .swa-tta-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .swa-tta-stage { animation: swa-tta-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes swa-tta-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="swa-tta-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="swa-tta-bg" width="980" height="322"/>
  <text class="swa-tta-h1"  x="30" y="40">Two cheap accuracy gains</text>
  <text class="swa-tta-sub" x="30" y="64">Averaging weights, and averaging predictions.</text>
  <g class="swa-tta-stage swa-tta-s0">
    <rect class="swa-tta-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="swa-tta-step" x="44" y="142">01</text>
    <text class="swa-tta-name" x="70" y="142">Weight averaging</text>
    <text class="swa-tta-desc" x="44" y="166">Average parameters from several late</text>
    <text class="swa-tta-desc" x="44" y="182">checkpoints. Finds a flatter minimum.</text>
    <text class="swa-tta-edge" x="44" y="242">free at inference</text>
  </g>
  <line class="swa-tta-line swa-tta-conn swa-tta-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#swa-tta-tip)"/>
  <g class="swa-tta-stage swa-tta-s1">
    <rect class="swa-tta-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="swa-tta-step" x="359" y="142">02</text>
    <text class="swa-tta-name" x="385" y="142">Test-time augmentation</text>
    <text class="swa-tta-desc" x="359" y="166">Predict on several transformed copies and</text>
    <text class="swa-tta-desc" x="359" y="182">average the outputs.</text>
  </g>
  <line class="swa-tta-line swa-tta-conn swa-tta-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#swa-tta-tip)"/>
  <g class="swa-tta-stage swa-tta-s2">
    <rect class="swa-tta-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="swa-tta-step" x="674" y="142">03</text>
    <text class="swa-tta-name" x="700" y="142">Which costs inference time</text>
    <text class="swa-tta-desc" x="674" y="166">Several forward passes per sample. Worth it</text>
    <text class="swa-tta-desc" x="674" y="182">in batch settings.</text>
  </g>
  <text class="swa-tta-sub" x="30" y="304">The asymmetry matters for deployment: averaged weights are one model and cost nothing extra to serve, and test-time augmentation multiplies inference cost by the number of views.</text>
</svg>
