<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five steps, all sub-millisecond except one.">
  <title>The firewall, in order</title>
  <style>
    .firewall-pipeline-bg   { fill: #f8fafc; }
    .firewall-pipeline-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .firewall-pipeline-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .firewall-pipeline-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .firewall-pipeline-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .firewall-pipeline-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .firewall-pipeline-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .firewall-pipeline-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .firewall-pipeline-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .firewall-pipeline-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .firewall-pipeline-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .firewall-pipeline-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .firewall-pipeline-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .firewall-pipeline-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .firewall-pipeline-stage { opacity: 1; }

    .firewall-pipeline-s0 { animation-delay: 0.00s; }
    .firewall-pipeline-e0 { animation-delay: 0.00s; }
    .firewall-pipeline-s1 { animation-delay: 1.33s; }
    .firewall-pipeline-e1 { animation-delay: 1.33s; }
    .firewall-pipeline-s2 { animation-delay: 2.67s; }
    .firewall-pipeline-e2 { animation-delay: 2.67s; }
    .firewall-pipeline-s3 { animation-delay: 4.00s; }
    .firewall-pipeline-e3 { animation-delay: 4.00s; }
    .firewall-pipeline-s4 { animation-delay: 5.33s; }
    .firewall-pipeline-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .firewall-pipeline-conn  { animation: firewall-pipeline-trace 8s ease-in-out infinite; }
      .firewall-pipeline-stage { animation: firewall-pipeline-arrive 8s ease-in-out infinite; }
    }
    @keyframes firewall-pipeline-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes firewall-pipeline-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .firewall-pipeline-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .firewall-pipeline-stage { animation: firewall-pipeline-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes firewall-pipeline-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="firewall-pipeline-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="firewall-pipeline-bg" width="980" height="322"/>
  <text class="firewall-pipeline-h1"  x="30" y="40">The firewall, in order</text>
  <text class="firewall-pipeline-sub" x="30" y="64">Five steps, all sub-millisecond except one.</text>
  <g class="firewall-pipeline-stage firewall-pipeline-s0">
    <rect class="firewall-pipeline-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="firewall-pipeline-step" x="44" y="142">01</text>
    <text class="firewall-pipeline-name" x="70" y="142">Scan the input heuristically</text>
    <text class="firewall-pipeline-desc" x="44" y="166">Cheap signal, logged</text>
    <text class="firewall-pipeline-desc" x="44" y="182">rather than trusted.</text>
  </g>
  <line class="firewall-pipeline-line firewall-pipeline-conn firewall-pipeline-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#firewall-pipeline-tip)"/>
  <g class="firewall-pipeline-stage firewall-pipeline-s1">
    <rect class="firewall-pipeline-warn" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="firewall-pipeline-step" x="233" y="142">02</text>
    <text class="firewall-pipeline-name" x="259" y="142">Escape the delimiter characters</text>
    <text class="firewall-pipeline-desc" x="233" y="166">Angle brackets and</text>
    <text class="firewall-pipeline-desc" x="233" y="182">ampersands, so user text</text>
    <text class="firewall-pipeline-desc" x="233" y="198">cannot close your tag.</text>
    <text class="firewall-pipeline-edge" x="233" y="242">the trick</text>
  </g>
  <line class="firewall-pipeline-line firewall-pipeline-conn firewall-pipeline-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#firewall-pipeline-tip)"/>
  <g class="firewall-pipeline-stage firewall-pipeline-s2">
    <rect class="firewall-pipeline-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="firewall-pipeline-step" x="422" y="142">03</text>
    <text class="firewall-pipeline-name" x="448" y="142">Wrap in explicit tags</text>
    <text class="firewall-pipeline-desc" x="422" y="166">user_input, context,</text>
    <text class="firewall-pipeline-desc" x="422" y="182">instructions. Aligned</text>
    <text class="firewall-pipeline-desc" x="422" y="198">with the training</text>
  </g>
  <line class="firewall-pipeline-line firewall-pipeline-conn firewall-pipeline-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#firewall-pipeline-tip)"/>
  <g class="firewall-pipeline-stage firewall-pipeline-s3">
    <rect class="firewall-pipeline-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="firewall-pipeline-step" x="611" y="142">04</text>
    <text class="firewall-pipeline-name" x="637" y="142">Inject a per-session canary</text>
    <text class="firewall-pipeline-desc" x="611" y="166">A random token in the</text>
    <text class="firewall-pipeline-desc" x="611" y="182">system prompt, unique to</text>
    <text class="firewall-pipeline-desc" x="611" y="198">this request.</text>
  </g>
  <line class="firewall-pipeline-line firewall-pipeline-conn firewall-pipeline-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#firewall-pipeline-tip)"/>
  <g class="firewall-pipeline-stage firewall-pipeline-s4">
    <rect class="firewall-pipeline-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="firewall-pipeline-step" x="800" y="142">05</text>
    <text class="firewall-pipeline-name" x="826" y="142">Scan the completion outbound</text>
    <text class="firewall-pipeline-desc" x="800" y="166">Canary present means the</text>
    <text class="firewall-pipeline-desc" x="800" y="182">prompt leaked. Drop,</text>
    <text class="firewall-pipeline-desc" x="800" y="198">alert, do not return.</text>
    <text class="firewall-pipeline-edge" x="800" y="242">&lt;0.5 ms</text>
  </g>
  <text class="firewall-pipeline-sub" x="30" y="304">Step two is the step people omit and the one that makes step three real: an unescaped closing tag inside user text ends your delimiter early, and everything after it reads as your own instructions.</text>
</svg>
