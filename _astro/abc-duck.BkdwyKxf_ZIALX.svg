<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two ways to require behaviour.">
  <title>Declared interfaces against duck typing</title>
  <style>
    .abc-duck-bg   { fill: #f8fafc; }
    .abc-duck-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .abc-duck-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .abc-duck-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .abc-duck-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .abc-duck-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .abc-duck-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .abc-duck-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .abc-duck-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .abc-duck-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .abc-duck-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .abc-duck-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .abc-duck-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .abc-duck-row { opacity: 1; }
    .abc-duck-r0 { animation-delay: 0.00s; }
    .abc-duck-r1 { animation-delay: 0.45s; }
    .abc-duck-r2 { animation-delay: 0.90s; }
    .abc-duck-r3 { animation-delay: 1.35s; }
    .abc-duck-r4 { animation-delay: 1.80s; }
    .abc-duck-row { animation: abc-duck-reveal 7.3s ease-in-out infinite; }
    @keyframes abc-duck-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="abc-duck-bg" width="980" height="390"/>
  <text class="abc-duck-h1"  x="30" y="40">Declared interfaces against duck typing</text>
  <text class="abc-duck-sub" x="30" y="64">Two ways to require behaviour.</text>
  <rect class="abc-duck-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="abc-duck-name" x="46" y="122">An abstract base</text>
  <text class="abc-duck-desc" x="46" y="142">Declared and enforced.</text>
  <text class="abc-duck-desc abc-duck-row abc-duck-r0" x="46" y="182">States the required methods</text>
  <text class="abc-duck-desc abc-duck-row abc-duck-r1" x="46" y="216">Instantiation fails if any is missing</text>
  <text class="abc-duck-desc abc-duck-row abc-duck-r2" x="46" y="250">The relationship is explicit</text>
  <text class="abc-duck-desc abc-duck-row abc-duck-r3" x="46" y="284">Discoverable by a reader</text>
  <text class="abc-duck-desc abc-duck-row abc-duck-r4" x="46" y="318">Needs the implementer to inherit</text>
  <rect class="abc-duck-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="abc-duck-name" x="526" y="122">Duck typing</text>
  <text class="abc-duck-desc" x="526" y="142">Structural and implicit.</text>
  <text class="abc-duck-desc abc-duck-row abc-duck-r0" x="526" y="182">Anything with the right methods works</text>
  <text class="abc-duck-desc abc-duck-row abc-duck-r1" x="526" y="216">Failure appears at the call, not before</text>
  <text class="abc-duck-desc abc-duck-row abc-duck-r2" x="526" y="250">The relationship is implicit</text>
  <text class="abc-duck-desc abc-duck-row abc-duck-r3" x="526" y="284">Harder to discover</text>
  <text class="abc-duck-desc abc-duck-row abc-duck-r4" x="526" y="318">No inheritance required</text>
  <text class="abc-duck-sub" x="30" y="372">Failing at instantiation rather than at the call is the concrete benefit of declaring the interface, and it moves the error to where it can be understood.</text>
</svg>
