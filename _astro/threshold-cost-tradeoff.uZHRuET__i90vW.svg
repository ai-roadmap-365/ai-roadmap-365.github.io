<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="Threshold and Cost Optimization Flow">
  <title>Threshold and Cost Optimization Flow</title>
  <defs>
    <style>
      .d159f-bg { fill: #f8fafc; }
      .d159f-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d159f-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 700; }
      .d159f-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; }
      .d159f-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 13px; font-weight: 600; }
      .d159f-arrow { stroke: #2563eb; stroke-width: 2; marker-end: url(#d159f-arr); fill: none; }
      
      @keyframes d159f-sweep {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(180px); }
      }
      .d159f-marker { animation: d159f-sweep 4s infinite ease-in-out; }
      
      @media (prefers-reduced-motion: reduce) {
        .d159f-marker { animation: none; transform: translateX(90px); }
      }
    </style>
    <marker id="d159f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="d159f-bg" />

  <text x="40" y="45" class="d159f-title" font-size="22">Cost-Sensitive Decision Threshold Optimization</text>
  <text x="40" y="70" class="d159f-text">Minimizing total expected financial/clinical loss: Cost = C_FP · FP + C_FN · FN</text>

  <!-- Step 1: Probability Distribution -->
  <rect x="40" y="110" width="260" height="160" class="d159f-box" />
  <text x="55" y="135" class="d159f-title" font-size="14" fill="#1e40af">1. Predicted Probability</text>
  <text x="55" y="160" class="d159f-text">p = P(Fraud | x) ∈ [0, 1]</text>
  
  <!-- Threshold Slider Graphic -->
  <rect x="55" y="180" width="230" height="12" fill="#e2e8f0" rx="6" />
  <rect x="55" y="180" width="120" fill="#bfdbfe" height="12" rx="6" />
  
  <g class="d159f-marker">
    <circle cx="95" cy="186" r="10" fill="#2563eb" stroke="#ffffff" stroke-width="2" />
  </g>
  <text x="55" y="225" class="d159f-math" font-size="11">Sweeping threshold τ: 0.0 → 1.0</text>
  <text x="55" y="250" class="d159f-text" font-size="11" fill="#64748b">Controls FP vs FN balance</text>

  <path d="M 300 190 L 340 190" class="d159f-arrow" />

  <!-- Step 2: Asymmetric Costs -->
  <rect x="350" y="110" width="240" height="160" class="d159f-box" />
  <text x="365" y="135" class="d159f-title" font-size="14" fill="#dc2626">2. Asymmetric Cost Matrix</text>
  <text x="365" y="165" class="d159f-math" font-size="12" fill="#dc2626">C_FN = $1,000 (Missed Fraud)</text>
  <text x="365" y="195" class="d159f-math" font-size="12" fill="#16a34a">C_FP = $10 (False Alarm)</text>
  <text x="365" y="235" class="d159f-text" font-size="11" fill="#64748b">Ratio: 100 to 1 penalty</text>

  <path d="M 590 190 L 630 190" class="d159f-arrow" />

  <!-- Step 3: Optimal Operating Point -->
  <rect x="640" y="110" width="220" height="160" class="d159f-box" fill="#f0fdf4" stroke="#86efac" />
  <text x="655" y="135" class="d159f-title" font-size="14" fill="#15803d">3. Optimal Operating Point</text>
  <text x="655" y="165" class="d159f-math" font-size="14" fill="#15803d">τ* = 0.12 (Optimal)</text>
  <text x="655" y="195" class="d159f-text" font-size="12">Default τ=0.50 Cost: $14,200</text>
  <text x="655" y="220" class="d159f-text" font-size="12" font-weight="700" fill="#15803d">Optimal τ=0.12 Cost: $2,850</text>
  <text x="655" y="245" class="d159f-text" font-size="11" fill="#166534">80% Total Loss Reduction</text>

  <!-- Summary Footer -->
  <rect x="40" y="295" width="820" height="145" class="d159f-box" />
  <text x="60" y="325" class="d159f-title" font-size="15">Key Metric Decision Rules</text>
  <text x="60" y="355" class="d159f-text">1. High Cost of False Positives (Spam Filter, Loan Approvals): Optimize for Precision -> Raise threshold τ > 0.50.</text>
  <text x="60" y="380" class="d159f-text">2. High Cost of False Negatives (Cancer Detection, Fraud): Optimize for Recall -> Lower threshold τ &lt; 0.50.</text>
  <text x="60" y="405" class="d159f-text">3. Equal Costs / Balanced Objectives: Optimize F1 score or Matthews Correlation Coefficient (MCC).</text>
</svg>
