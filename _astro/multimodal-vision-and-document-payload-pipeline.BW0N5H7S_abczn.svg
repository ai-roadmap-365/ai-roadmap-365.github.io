<svg role="img" aria-label="Multimodal vision and document payload pipeline diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>Multimodal Vision &amp; Document Payload Architecture</title>
  <defs>
    <linearGradient id="bg257a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card257" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg257a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">MULTIMODAL VISION &amp; DOCUMENT PAYLOAD PIPELINE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Encoding Images and PDFs into Standardized API Message Arrays</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card257)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Input Media Files -->
    <rect x="25" y="25" width="220" height="255" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="135" y="50" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">1. Media Ingestion</text>
    <rect x="35" y="70" width="200" height="70" fill="#1e293b" rx="4"/>
    <text x="45" y="90" fill="#38bdf8" font-size="8" font-weight="700">Supported Formats:</text>
    <text x="45" y="105" fill="#cbd5e1" font-size="7">• PNG / JPEG / WEBP / GIF</text>
    <text x="45" y="120" fill="#cbd5e1" font-size="7">• PDF Documents (Anthropic)</text>
    <text x="45" y="132" fill="#cbd5e1" font-size="7">• Base64 String / Hosted URL</text>
    <text x="135" y="245" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">Raw Media Bytes</text>

    <!-- Message Payload Construction -->
    <rect x="270" y="25" width="220" height="255" fill="#0f172a" stroke="#fbbf24" rx="6"/>
    <text x="380" y="50" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">2. Payload Construction</text>
    <rect x="280" y="70" width="200" height="150" fill="#1e293b" rx="4"/>
    <text x="290" y="90" fill="#cbd5e1" font-size="7">messages: [&#123;</text>
    <text x="290" y="105" fill="#cbd5e1" font-size="7">  role: "user",</text>
    <text x="290" y="120" fill="#cbd5e1" font-size="7">  content: [</text>
    <text x="300" y="135" fill="#fbbf24" font-size="7">    &#123;type: "image",</text>
    <text x="300" y="150" fill="#fbbf24" font-size="7">     source: &#123;type: "base64", ...&#125;&#125;,</text>
    <text x="300" y="165" fill="#34d399" font-size="7">    &#123;type: "text",</text>
    <text x="300" y="180" fill="#34d399" font-size="7">     text: "Extract invoice data"&#125;</text>
    <text x="290" y="195" fill="#cbd5e1" font-size="7">  ]</text>
    <text x="290" y="210" fill="#cbd5e1" font-size="7">&#125;]</text>
    <text x="380" y="255" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">Composite Content Blocks</text>

    <!-- Vision Encoder Output -->
    <rect x="515" y="25" width="220" height="255" fill="#0f172a" stroke="#34d399" stroke-width="1.5" rx="6"/>
    <text x="625" y="50" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">3. Vision Embedding &amp; JSON</text>
    <rect x="525" y="70" width="200" height="150" fill="#1e293b" rx="4"/>
    <text x="535" y="90" fill="#34d399" font-size="8" font-weight="700">Structured Output:</text>
    <text x="535" y="108" fill="#cbd5e1" font-size="7">&#123;</text>
    <text x="545" y="122" fill="#cbd5e1" font-size="7">"invoice_number": "INV-4821",</text>
    <text x="545" y="136" fill="#cbd5e1" font-size="7">"vendor": "Acme Corp",</text>
    <text x="545" y="150" fill="#cbd5e1" font-size="7">"total_usd": 1450.00,</text>
    <text x="545" y="164" fill="#cbd5e1" font-size="7">"line_items": [ ... ]</text>
    <text x="535" y="178" fill="#cbd5e1" font-size="7">&#125;</text>
    <text x="625" y="255" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">High Precision Extraction</text>
  </g>
</svg>
