<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="It asks a maintainer to pull. Nothing pulls any more.">
  <title>Where the name comes from</title>
  <style>
    .email-to-pull-request-bg   { fill: #f8fafc; }
    .email-to-pull-request-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .email-to-pull-request-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .email-to-pull-request-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .email-to-pull-request-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .email-to-pull-request-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .email-to-pull-request-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .email-to-pull-request-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .email-to-pull-request-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .email-to-pull-request-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .email-to-pull-request-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .email-to-pull-request-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .email-to-pull-request-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .email-to-pull-request-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .email-to-pull-request-stage { opacity: 1; }

    .email-to-pull-request-s0 { animation-delay: 0.00s; }
    .email-to-pull-request-e0 { animation-delay: 0.00s; }
    .email-to-pull-request-s1 { animation-delay: 1.28s; }
    .email-to-pull-request-e1 { animation-delay: 1.28s; }
    .email-to-pull-request-s2 { animation-delay: 2.56s; }
    .email-to-pull-request-e2 { animation-delay: 2.56s; }
    .email-to-pull-request-s3 { animation-delay: 3.84s; }
    .email-to-pull-request-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .email-to-pull-request-conn  { animation: email-to-pull-request-trace 6.4s ease-in-out infinite; }
      .email-to-pull-request-stage { animation: email-to-pull-request-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes email-to-pull-request-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes email-to-pull-request-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .email-to-pull-request-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .email-to-pull-request-stage { animation: email-to-pull-request-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes email-to-pull-request-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="email-to-pull-request-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="email-to-pull-request-bg" width="980" height="322"/>
  <text class="email-to-pull-request-h1"  x="30" y="40">Where the name comes from</text>
  <text class="email-to-pull-request-sub" x="30" y="64">It asks a maintainer to pull. Nothing pulls any more.</text>
  <g class="email-to-pull-request-stage email-to-pull-request-s0">
    <rect class="email-to-pull-request-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="email-to-pull-request-step" x="44" y="142">01</text>
    <text class="email-to-pull-request-name" x="70" y="142">Mailed patches</text>
    <text class="email-to-pull-request-desc" x="44" y="166">git format-patch, then email.</text>
    <text class="email-to-pull-request-desc" x="44" y="182">Still how the Linux kernel</text>
    <text class="email-to-pull-request-desc" x="44" y="198">works.</text>
    <text class="email-to-pull-request-edge" x="44" y="242">1990s</text>
  </g>
  <line class="email-to-pull-request-line email-to-pull-request-conn email-to-pull-request-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#email-to-pull-request-tip)"/>
  <g class="email-to-pull-request-stage email-to-pull-request-s1">
    <rect class="email-to-pull-request-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="email-to-pull-request-step" x="280" y="142">02</text>
    <text class="email-to-pull-request-name" x="306" y="142">"Please pull from my branch"</text>
    <text class="email-to-pull-request-desc" x="280" y="166">A request to a maintainer to</text>
    <text class="email-to-pull-request-desc" x="280" y="182">fetch and merge. Hence the name.</text>
  </g>
  <line class="email-to-pull-request-line email-to-pull-request-conn email-to-pull-request-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#email-to-pull-request-tip)"/>
  <g class="email-to-pull-request-stage email-to-pull-request-s2">
    <rect class="email-to-pull-request-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="email-to-pull-request-step" x="516" y="142">03</text>
    <text class="email-to-pull-request-name" x="542" y="142">Hosted forks and a web diff</text>
    <text class="email-to-pull-request-desc" x="516" y="166">You no longer needed write</text>
    <text class="email-to-pull-request-desc" x="516" y="182">access to propose a change.</text>
    <text class="email-to-pull-request-edge" x="516" y="242">opened it up</text>
  </g>
  <line class="email-to-pull-request-line email-to-pull-request-conn email-to-pull-request-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#email-to-pull-request-tip)"/>
  <g class="email-to-pull-request-stage email-to-pull-request-s3">
    <rect class="email-to-pull-request-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="email-to-pull-request-step" x="752" y="142">04</text>
    <text class="email-to-pull-request-name" x="778" y="142">Plus automated checks</text>
    <text class="email-to-pull-request-desc" x="752" y="166">Review and CI together, gating a</text>
    <text class="email-to-pull-request-desc" x="752" y="182">protected branch. The modern</text>
    <text class="email-to-pull-request-desc" x="752" y="198">default.</text>
  </g>
  <text class="email-to-pull-request-sub" x="30" y="304">None of this is in Git. Every platform implements pull requests differently, which is why the vocabulary — fork, upstream, draft, approval — varies between them.</text>
</svg>
