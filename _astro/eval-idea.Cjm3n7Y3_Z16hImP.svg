<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each isolates a stage.">
  <title>Three measurements, one diagnosis</title>
  <style>
    .eval-idea-bg   { fill: #f8fafc; }
    .eval-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eval-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eval-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eval-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eval-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eval-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eval-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .eval-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .eval-idea-stage { opacity: 1; }

    .eval-idea-s0 { animation-delay: 0.00s; }
    .eval-idea-e0 { animation-delay: 0.00s; }
    .eval-idea-s1 { animation-delay: 1.50s; }
    .eval-idea-e1 { animation-delay: 1.50s; }
    .eval-idea-s2 { animation-delay: 3.00s; }
    .eval-idea-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .eval-idea-conn  { animation: eval-idea-trace 6s ease-in-out infinite; }
      .eval-idea-stage { animation: eval-idea-arrive 6s ease-in-out infinite; }
    }
    @keyframes eval-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes eval-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .eval-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .eval-idea-stage { animation: eval-idea-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes eval-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="eval-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="eval-idea-bg" width="980" height="322"/>
  <text class="eval-idea-h1"  x="30" y="40">Three measurements, one diagnosis</text>
  <text class="eval-idea-sub" x="30" y="64">Each isolates a stage.</text>
  <g class="eval-idea-stage eval-idea-s0">
    <rect class="eval-idea-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="eval-idea-step" x="44" y="142">01</text>
    <text class="eval-idea-name" x="70" y="142">Context relevance</text>
    <text class="eval-idea-desc" x="44" y="166">Was the right material retrieved? Isolates</text>
    <text class="eval-idea-desc" x="44" y="182">retrieval.</text>
  </g>
  <line class="eval-idea-line eval-idea-conn eval-idea-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#eval-idea-tip)"/>
  <g class="eval-idea-stage eval-idea-s1">
    <rect class="eval-idea-good" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="eval-idea-step" x="359" y="142">02</text>
    <text class="eval-idea-name" x="385" y="142">Faithfulness</text>
    <text class="eval-idea-desc" x="359" y="166">Does the answer follow from it? Isolates</text>
    <text class="eval-idea-desc" x="359" y="182">grounding.</text>
  </g>
  <line class="eval-idea-line eval-idea-conn eval-idea-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#eval-idea-tip)"/>
  <g class="eval-idea-stage eval-idea-s2">
    <rect class="eval-idea-box" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="eval-idea-step" x="674" y="142">03</text>
    <text class="eval-idea-name" x="700" y="142">Answer relevance</text>
    <text class="eval-idea-desc" x="674" y="166">Does it address the question? Isolates the</text>
    <text class="eval-idea-desc" x="674" y="182">prompt.</text>
  </g>
  <text class="eval-idea-sub" x="30" y="304">Each metric holds the other stages constant, which is what makes them diagnostic: a low score points at one stage rather than at the system.</text>
</svg>
