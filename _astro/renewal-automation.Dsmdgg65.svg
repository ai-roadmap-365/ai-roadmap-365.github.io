<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Certificates expire on a known date. Nothing about this is a surprise.">
  <title>The most preventable outage there is</title>
  <style>
    .renewal-automation-bg   { fill: #f8fafc; }
    .renewal-automation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .renewal-automation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .renewal-automation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .renewal-automation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .renewal-automation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .renewal-automation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .renewal-automation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .renewal-automation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .renewal-automation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .renewal-automation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .renewal-automation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .renewal-automation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .renewal-automation-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .renewal-automation-stage { opacity: 1; }

    .renewal-automation-s0 { animation-delay: 0.00s; }
    .renewal-automation-e0 { animation-delay: 0.00s; }
    .renewal-automation-s1 { animation-delay: 1.28s; }
    .renewal-automation-e1 { animation-delay: 1.28s; }
    .renewal-automation-s2 { animation-delay: 2.56s; }
    .renewal-automation-e2 { animation-delay: 2.56s; }
    .renewal-automation-s3 { animation-delay: 3.84s; }
    .renewal-automation-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .renewal-automation-conn  { animation: renewal-automation-trace 6.4s ease-in-out infinite; }
      .renewal-automation-stage { animation: renewal-automation-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes renewal-automation-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes renewal-automation-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .renewal-automation-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .renewal-automation-stage { animation: renewal-automation-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes renewal-automation-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="renewal-automation-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="renewal-automation-bg" width="980" height="322"/>
  <text class="renewal-automation-h1"  x="30" y="40">The most preventable outage there is</text>
  <text class="renewal-automation-sub" x="30" y="64">Certificates expire on a known date. Nothing about this is a surprise.</text>
  <g class="renewal-automation-stage renewal-automation-s0">
    <rect class="renewal-automation-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="renewal-automation-step" x="44" y="142">01</text>
    <text class="renewal-automation-name" x="70" y="142">Check on a schedule</text>
    <text class="renewal-automation-desc" x="44" y="166">A daily job, exactly as Day 14</text>
    <text class="renewal-automation-desc" x="44" y="182">described.</text>
    <text class="renewal-automation-edge" x="44" y="242">cron</text>
  </g>
  <line class="renewal-automation-line renewal-automation-conn renewal-automation-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#renewal-automation-tip)"/>
  <g class="renewal-automation-stage renewal-automation-s1">
    <rect class="renewal-automation-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="renewal-automation-step" x="280" y="142">02</text>
    <text class="renewal-automation-name" x="306" y="142">Renew early</text>
    <text class="renewal-automation-desc" x="280" y="166">At 30 days remaining, not at 1.</text>
    <text class="renewal-automation-desc" x="280" y="182">Leaves room for the renewal</text>
    <text class="renewal-automation-desc" x="280" y="198">itself to fail.</text>
    <text class="renewal-automation-edge" x="280" y="242">30 days</text>
  </g>
  <line class="renewal-automation-line renewal-automation-conn renewal-automation-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#renewal-automation-tip)"/>
  <g class="renewal-automation-stage renewal-automation-s2">
    <rect class="renewal-automation-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="renewal-automation-step" x="516" y="142">03</text>
    <text class="renewal-automation-name" x="542" y="142">Reload the server</text>
    <text class="renewal-automation-desc" x="516" y="166">A new certificate on disk does</text>
    <text class="renewal-automation-desc" x="516" y="182">nothing until the process picks</text>
    <text class="renewal-automation-desc" x="516" y="198">it up.</text>
  </g>
  <line class="renewal-automation-line renewal-automation-conn renewal-automation-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#renewal-automation-tip)"/>
  <g class="renewal-automation-stage renewal-automation-s3">
    <rect class="renewal-automation-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="renewal-automation-step" x="752" y="142">04</text>
    <text class="renewal-automation-name" x="778" y="142">Alert on failure</text>
    <text class="renewal-automation-desc" x="752" y="166">A renewal job that fails</text>
    <text class="renewal-automation-desc" x="752" y="182">silently is the same as no</text>
    <text class="renewal-automation-desc" x="752" y="198">renewal job.</text>
  </g>
  <text class="renewal-automation-sub" x="30" y="304">Every expired-certificate outage was scheduled months in advance and visible the whole time. The failure is never cryptographic; it is operational.</text>
</svg>
