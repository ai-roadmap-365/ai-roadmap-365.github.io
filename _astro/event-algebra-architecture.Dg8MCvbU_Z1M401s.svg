<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="d113a-title d113a-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="d113a-title">Event algebra: the addition rule's double-counted region, and a mutually exclusive pair for contrast</title>
  <desc id="d113a-desc">Two labelled sample spaces of two dice: one showing overlapping events A and B with their double-counted intersection, one showing mutually exclusive events C and D with an empty intersection, and a footer explaining the addition rule and mutual exclusivity implying dependence.</desc>

  <style>
    .d113a-bg { fill: #f8fafc; }
    .d113a-panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .d113a-heading { font-size: 17px; font-weight: 700; fill: #1a202c; }
    .d113a-subheading { font-size: 14px; font-weight: 600; fill: #475569; }
    .d113a-label { font-size: 14px; fill: #1a202c; }
    .d113a-mono { font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace; font-size: 14px; fill: #1a202c; }
    .d113a-mono-bold { font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace; font-size: 15px; font-weight: 700; fill: #1a202c; }
    .d113a-small { font-size: 12.5px; fill: #475569; }
    .d113a-circleA { fill: #f59e0b; fill-opacity: 0.28; stroke: #b45309; stroke-width: 2; }
    .d113a-circleB { fill: #1d4ed8; fill-opacity: 0.22; stroke: #1d4ed8; stroke-width: 2; }
    .d113a-circleC { fill: #f59e0b; fill-opacity: 0.28; stroke: #b45309; stroke-width: 2; }
    .d113a-circleD { fill: #1d4ed8; fill-opacity: 0.22; stroke: #1d4ed8; stroke-width: 2; }
    .d113a-omega { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; }
    .d113a-footer { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1.5; }
    .d113a-rule { stroke: #cbd5e1; stroke-width: 1.5; }
  </style>

  <rect class="d113a-bg" x="0" y="0" width="1000" height="660" />

  <!-- Title band -->
  <text x="500" y="34" text-anchor="middle" class="d113a-heading">Two overlapping events versus two mutually exclusive events</text>
  <text x="500" y="55" text-anchor="middle" class="d113a-small">Both panels use the 36-outcome sample space of two dice. Every count shown is exact, by enumeration.</text>

  <!-- LEFT PANEL: overlapping A and B -->
  <rect class="d113a-panel" x="30" y="75" width="460" height="430" rx="8" />
  <text x="260" y="105" text-anchor="middle" class="d113a-subheading">A AND B OVERLAP — THE ADDITION RULE</text>

  <rect class="d113a-omega" x="55" y="120" width="410" height="290" rx="6" />
  <text x="65" y="138" class="d113a-small">Ω — sample space, 36 outcomes</text>

  <circle class="d113a-circleA" cx="200" cy="270" r="110" />
  <circle class="d113a-circleB" cx="320" cy="270" r="110" />

  <text x="150" y="200" text-anchor="middle" class="d113a-mono-bold" fill="#92400e">A</text>
  <text x="150" y="220" text-anchor="middle" class="d113a-small">"sum is 7"</text>
  <text x="150" y="236" text-anchor="middle" class="d113a-small">6 outcomes</text>

  <text x="370" y="200" text-anchor="middle" class="d113a-mono-bold" fill="#1d4ed8">B</text>
  <text x="370" y="220" text-anchor="middle" class="d113a-small">"first die is 6"</text>
  <text x="370" y="236" text-anchor="middle" class="d113a-small">6 outcomes</text>

  <text x="260" y="266" text-anchor="middle" class="d113a-mono" font-weight="700">(6,1)</text>
  <text x="260" y="284" text-anchor="middle" class="d113a-small">A ∩ B — 1 outcome</text>
  <text x="260" y="300" text-anchor="middle" class="d113a-small">double-counted region</text>

  <rect x="60" y="418" width="400" height="80" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
  <text x="75" y="440" class="d113a-mono">naive:  P(A) + P(B)              = 12/36 = 1/3   WRONG</text>
  <text x="75" y="460" class="d113a-mono" font-weight="700">true:   P(A) + P(B) − P(A∩B)     = 11/36           correct</text>
  <text x="75" y="480" class="d113a-small">error = exactly P(A∩B) = 1/36, the region counted twice above</text>

  <!-- RIGHT PANEL: mutually exclusive C and D -->
  <rect class="d113a-panel" x="510" y="75" width="460" height="430" rx="8" />
  <text x="740" y="105" text-anchor="middle" class="d113a-subheading">C AND D CANNOT BOTH HAPPEN — MUTUAL EXCLUSIVITY</text>

  <rect class="d113a-omega" x="535" y="120" width="410" height="290" rx="6" />
  <text x="545" y="138" class="d113a-small">Ω — sample space, 36 outcomes</text>

  <circle class="d113a-circleC" cx="670" cy="270" r="90" />
  <circle class="d113a-circleD" cx="830" cy="270" r="90" />

  <text x="670" y="266" text-anchor="middle" class="d113a-mono-bold" fill="#92400e">C</text>
  <text x="670" y="286" text-anchor="middle" class="d113a-small">"sum is 2"</text>
  <text x="670" y="302" text-anchor="middle" class="d113a-small">only {(1,1)}</text>

  <text x="830" y="266" text-anchor="middle" class="d113a-mono-bold" fill="#1d4ed8">D</text>
  <text x="830" y="286" text-anchor="middle" class="d113a-small">"sum is 12"</text>
  <text x="830" y="302" text-anchor="middle" class="d113a-small">only {(6,6)}</text>

  <text x="750" y="355" text-anchor="middle" class="d113a-mono" font-weight="700">C ∩ D = ∅</text>

  <rect x="540" y="418" width="400" height="80" rx="6" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="1.5" />
  <text x="555" y="440" class="d113a-mono">P(C | D) = P(C∩D)/P(D) = 0/(1/36) = 0</text>
  <text x="555" y="460" class="d113a-mono" font-weight="700">but P(C) = 1/36 ≠ 0  →  C and D are DEPENDENT</text>
  <text x="555" y="480" class="d113a-small">mutually exclusive with non-zero probability always implies dependence</text>

  <!-- Footer -->
  <rect class="d113a-footer" x="30" y="520" width="940" height="120" rx="8" />
  <text x="500" y="546" text-anchor="middle" class="d113a-heading">THE ADDITION RULE, IN GENERAL</text>
  <text x="500" y="572" text-anchor="middle" class="d113a-mono-bold">P(A or B) = P(A) + P(B) − P(A and B)</text>
  <line x1="500" y1="588" x2="500" y2="628" class="d113a-rule" />
  <text x="255" y="608" text-anchor="middle" class="d113a-small">Left panel: A and B overlap, so their intersection</text>
  <text x="255" y="624" text-anchor="middle" class="d113a-small">is subtracted once to undo the double count.</text>
  <text x="745" y="608" text-anchor="middle" class="d113a-small">Right panel: C and D never overlap, so P(C or D)</text>
  <text x="745" y="624" text-anchor="middle" class="d113a-small">is simply P(C) + P(D) — but they are still dependent.</text>
</svg>
