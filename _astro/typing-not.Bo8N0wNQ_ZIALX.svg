<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things typing is not</title>
  <style>
    .typing-not-bg   { fill: #f8fafc; }
    .typing-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .typing-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .typing-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .typing-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .typing-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .typing-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .typing-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .typing-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .typing-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .typing-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .typing-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .typing-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .typing-not-row { opacity: 1; }
    .typing-not-r0 { animation-delay: 0.00s; }
    .typing-not-r1 { animation-delay: 0.45s; }
    .typing-not-r2 { animation-delay: 0.90s; }
    .typing-not-r3 { animation-delay: 1.35s; }
    .typing-not-r4 { animation-delay: 1.80s; }
    .typing-not-row { animation: typing-not-reveal 7.3s ease-in-out infinite; }
    @keyframes typing-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="typing-not-bg" width="980" height="390"/>
  <text class="typing-not-h1"  x="30" y="40">Four things typing is not</text>
  <text class="typing-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="typing-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="typing-not-name" x="46" y="122">The misconception</text>
  <text class="typing-not-desc" x="46" y="142">Commonly held.</text>
  <text class="typing-not-desc typing-not-row typing-not-r0" x="46" y="182">Annotations are enforced at runtime</text>
  <text class="typing-not-desc typing-not-row typing-not-r1" x="46" y="216">Typing makes the program faster</text>
  <text class="typing-not-desc typing-not-row typing-not-r2" x="46" y="250">A typed codebase cannot have type errors</text>
  <text class="typing-not-desc typing-not-row typing-not-r3" x="46" y="284">All-or-nothing adoption</text>
  <text class="typing-not-desc typing-not-row typing-not-r4" x="46" y="318">Annotating everything is the goal</text>
  <rect class="typing-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="typing-not-name" x="526" y="122">What is true</text>
  <text class="typing-not-desc" x="526" y="142">Actually.</text>
  <text class="typing-not-desc typing-not-row typing-not-r0" x="526" y="182">They are inert unless a checker runs</text>
  <text class="typing-not-desc typing-not-row typing-not-r1" x="526" y="216">They are stored and ignored by the interpreter</text>
  <text class="typing-not-desc typing-not-row typing-not-r2" x="526" y="250">Runtime data can still be anything</text>
  <text class="typing-not-desc typing-not-row typing-not-r3" x="526" y="284">Adoption is gradual, by module</text>
  <text class="typing-not-desc typing-not-row typing-not-r4" x="526" y="318">Boundaries pay; internals often do not</text>
  <text class="typing-not-sub" x="30" y="372">Annotations being inert at runtime is the fact that decides where validation belongs, and it is why the two lessons sit next to each other.</text>
</svg>
