<svg role="img" aria-label="ResNet residual block architecture showing convolutional path and identity shortcut connection creating direct gradient flow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>ResNet Residual Block and Gradient Highway Mechanics</title>
  <defs>
    <linearGradient id="bg212b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card212b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg212b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">RESNET RESIDUAL BLOCK &amp; GRADIENT HIGHWAY</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Identity Mapping y = F(x) + x Preserves Gradient Flow Across Hundreds of Layers</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card212b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Input x -->
    <rect x="70" y="115" width="100" height="40" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="4"/>
    <text x="120" y="140" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">Input x</text>

    <!-- Split Arrow -->
    <circle cx="210" cy="135" r="4" fill="#38bdf8"/>
    <path d="M 170 135 L 250 85" stroke="#fbbf24" stroke-width="2" fill="none"/>
    <path d="M 210 135 L 210 230 L 490 230 L 490 145" stroke="#10b981" stroke-width="3" fill="none"/>
    <text x="350" y="250" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">Identity Shortcut Connection (Gradient Highway)</text>

    <!-- Main Path: Conv1 -> BN -> ReLU -> Conv2 -> BN -->
    <rect x="250" y="65" width="190" height="40" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="4"/>
    <text x="345" y="89" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">Conv 3x3 + BatchNorm + ReLU</text>

    <path d="M 345 105 L 345 125" stroke="#fbbf24" stroke-width="2" fill="none"/>
    <polygon points="345,125 340,117 350,117" fill="#fbbf24"/>

    <rect x="250" y="125" width="190" height="40" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="4"/>
    <text x="345" y="149" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">Conv 3x3 + BatchNorm</text>
    <text x="345" y="180" fill="#fbbf24" font-size="9" text-anchor="middle">Residual Mapping F(x)</text>

    <!-- Addition Operator (+) -->
    <circle cx="490" cy="135" r="16" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
    <text x="490" y="141" fill="#f43f5e" font-size="16" font-weight="700" text-anchor="middle">+</text>

    <path d="M 440 145 L 474 138" stroke="#fbbf24" stroke-width="2" fill="none"/>

    <!-- Final Activation & Output -->
    <path d="M 506 135 L 550 135" stroke="#10b981" stroke-width="2" fill="none"/>
    <polygon points="550,135 542,130 542,140" fill="#10b981"/>

    <rect x="550" y="115" width="170" height="40" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="635" y="133" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">ReLU(F(x) + x)</text>
    <text x="635" y="148" fill="#f8fafc" font-size="9" text-anchor="middle">Output Tensor y</text>

    <!-- Backprop Formula Box -->
    <rect x="30" y="240" width="700" height="40" fill="#0f172a" stroke="#475569" rx="4"/>
    <text x="380" y="265" fill="#f8fafc" font-size="10" text-anchor="middle">Backprop Gradient: dL/dx = (dL/dy) * (dF/dx + 1.0)  -- The "+ 1.0" guarantees gradient flow!</text>
  </g>
</svg>
