<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The most expensive mistake in API use, and the easiest to avoid.">
  <title>A loop of calls is a loop of round trips</title>
  <style>
    .n-plus-one-calls-bg   { fill: #f8fafc; }
    .n-plus-one-calls-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .n-plus-one-calls-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .n-plus-one-calls-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .n-plus-one-calls-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .n-plus-one-calls-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .n-plus-one-calls-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .n-plus-one-calls-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .n-plus-one-calls-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .n-plus-one-calls-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .n-plus-one-calls-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .n-plus-one-calls-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .n-plus-one-calls-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .n-plus-one-calls-row { opacity: 1; }
    .n-plus-one-calls-r0 { animation-delay: 0.00s; }
    .n-plus-one-calls-r1 { animation-delay: 0.45s; }
    .n-plus-one-calls-r2 { animation-delay: 0.90s; }
    .n-plus-one-calls-r3 { animation-delay: 1.35s; }
    .n-plus-one-calls-r4 { animation-delay: 1.80s; }
    .n-plus-one-calls-row { animation: n-plus-one-calls-reveal 7.3s ease-in-out infinite; }
    @keyframes n-plus-one-calls-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="n-plus-one-calls-bg" width="980" height="390"/>
  <text class="n-plus-one-calls-h1"  x="30" y="40">A loop of calls is a loop of round trips</text>
  <text class="n-plus-one-calls-sub" x="30" y="64">The most expensive mistake in API use, and the easiest to avoid.</text>
  <rect class="n-plus-one-calls-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="n-plus-one-calls-name" x="46" y="122">One call per item</text>
  <text class="n-plus-one-calls-desc" x="46" y="142">for id in ids: get(id)</text>
  <text class="n-plus-one-calls-desc n-plus-one-calls-row n-plus-one-calls-r0" x="46" y="182">1,000 items means 1,000 round trips</text>
  <text class="n-plus-one-calls-desc n-plus-one-calls-row n-plus-one-calls-r1" x="46" y="216">At 100 ms each, that is 100 seconds</text>
  <text class="n-plus-one-calls-desc n-plus-one-calls-row n-plus-one-calls-r2" x="46" y="250">1,000 requests against your rate limit</text>
  <text class="n-plus-one-calls-desc n-plus-one-calls-row n-plus-one-calls-r3" x="46" y="284">1,000 billable calls, if metered</text>
  <text class="n-plus-one-calls-desc n-plus-one-calls-row n-plus-one-calls-r4" x="46" y="318">Latency dominates entirely</text>
  <rect class="n-plus-one-calls-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="n-plus-one-calls-name" x="526" y="122">One batched call</text>
  <text class="n-plus-one-calls-desc" x="526" y="142">get(ids) — or a filter parameter.</text>
  <text class="n-plus-one-calls-desc n-plus-one-calls-row n-plus-one-calls-r0" x="526" y="182">One round trip, or a handful with paging</text>
  <text class="n-plus-one-calls-desc n-plus-one-calls-row n-plus-one-calls-r1" x="526" y="216">Well under a second</text>
  <text class="n-plus-one-calls-desc n-plus-one-calls-row n-plus-one-calls-r2" x="526" y="250">One request against the limit</text>
  <text class="n-plus-one-calls-desc n-plus-one-calls-row n-plus-one-calls-r3" x="526" y="284">One billable call</text>
  <text class="n-plus-one-calls-desc n-plus-one-calls-row n-plus-one-calls-r4" x="526" y="318">Now the server's work dominates, correctly</text>
  <text class="n-plus-one-calls-sub" x="30" y="372">Before writing the loop, search the documentation for a batch endpoint or a filter parameter. Most APIs have one, and most people write the loop first.</text>
</svg>
