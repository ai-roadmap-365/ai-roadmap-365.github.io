<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="localhost or every interface. There is no third option by accident.">
  <title>The one line that decides who can reach your service</title>
  <style>
    .bind-address-choice-bg   { fill: #f8fafc; }
    .bind-address-choice-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bind-address-choice-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bind-address-choice-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bind-address-choice-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bind-address-choice-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bind-address-choice-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bind-address-choice-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bind-address-choice-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bind-address-choice-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bind-address-choice-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bind-address-choice-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bind-address-choice-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bind-address-choice-row { opacity: 1; }
    .bind-address-choice-r0 { animation-delay: 0.00s; }
    .bind-address-choice-r1 { animation-delay: 0.45s; }
    .bind-address-choice-r2 { animation-delay: 0.90s; }
    .bind-address-choice-r3 { animation-delay: 1.35s; }
    .bind-address-choice-r4 { animation-delay: 1.80s; }
    .bind-address-choice-row { animation: bind-address-choice-reveal 7.3s ease-in-out infinite; }
    @keyframes bind-address-choice-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="bind-address-choice-bg" width="980" height="390"/>
  <text class="bind-address-choice-h1"  x="30" y="40">The one line that decides who can reach your service</text>
  <text class="bind-address-choice-sub" x="30" y="64">localhost or every interface. There is no third option by accident.</text>
  <rect class="bind-address-choice-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="bind-address-choice-name" x="46" y="122">Bind to 127.0.0.1</text>
  <text class="bind-address-choice-desc" x="46" y="142">This machine only.</text>
  <text class="bind-address-choice-desc bind-address-choice-row bind-address-choice-r0" x="46" y="182">Only processes on this host can connect</text>
  <text class="bind-address-choice-desc bind-address-choice-row bind-address-choice-r1" x="46" y="216">Invisible from the network entirely</text>
  <text class="bind-address-choice-desc bind-address-choice-row bind-address-choice-r2" x="46" y="250">The right default for a database</text>
  <text class="bind-address-choice-desc bind-address-choice-row bind-address-choice-r3" x="46" y="284">The right default for a dev server</text>
  <text class="bind-address-choice-desc bind-address-choice-row bind-address-choice-r4" x="46" y="318">Nothing to firewall, because nothing is exposed</text>
  <rect class="bind-address-choice-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="bind-address-choice-name" x="526" y="122">Bind to 0.0.0.0</text>
  <text class="bind-address-choice-desc" x="526" y="142">Every interface.</text>
  <text class="bind-address-choice-desc bind-address-choice-row bind-address-choice-r0" x="526" y="182">Anyone who can route to you can connect</text>
  <text class="bind-address-choice-desc bind-address-choice-row bind-address-choice-r1" x="526" y="216">Includes the coffee shop Wi-Fi</text>
  <text class="bind-address-choice-desc bind-address-choice-row bind-address-choice-r2" x="526" y="250">Required inside a container, deliberately</text>
  <text class="bind-address-choice-desc bind-address-choice-row bind-address-choice-r3" x="526" y="284">Needs a firewall in front of it</text>
  <text class="bind-address-choice-desc bind-address-choice-row bind-address-choice-r4" x="526" y="318">This is how databases end up on the public internet</text>
  <text class="bind-address-choice-sub" x="30" y="372">Inside a container, 0.0.0.0 is correct and safe: the container's network is the boundary. On your laptop it usually is not.</text>
</svg>
