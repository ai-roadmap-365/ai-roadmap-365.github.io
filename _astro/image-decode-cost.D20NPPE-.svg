<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Decoding images is a common reason an expensive accelerator sits idle.">
  <title>Where a training pipeline actually spends its time</title>
  <style>
    .image-decode-cost-bg   { fill: #f8fafc; }
    .image-decode-cost-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .image-decode-cost-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .image-decode-cost-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .image-decode-cost-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .image-decode-cost-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .image-decode-cost-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .image-decode-cost-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .image-decode-cost-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .image-decode-cost-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .image-decode-cost-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .image-decode-cost-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .image-decode-cost-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .image-decode-cost-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .image-decode-cost-stage { opacity: 1; }

    .image-decode-cost-s0 { animation-delay: 0.00s; }
    .image-decode-cost-e0 { animation-delay: 0.00s; }
    .image-decode-cost-s1 { animation-delay: 1.33s; }
    .image-decode-cost-e1 { animation-delay: 1.33s; }
    .image-decode-cost-s2 { animation-delay: 2.67s; }
    .image-decode-cost-e2 { animation-delay: 2.67s; }
    .image-decode-cost-s3 { animation-delay: 4.00s; }
    .image-decode-cost-e3 { animation-delay: 4.00s; }
    .image-decode-cost-s4 { animation-delay: 5.33s; }
    .image-decode-cost-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .image-decode-cost-conn  { animation: image-decode-cost-trace 8s ease-in-out infinite; }
      .image-decode-cost-stage { animation: image-decode-cost-arrive 8s ease-in-out infinite; }
    }
    @keyframes image-decode-cost-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes image-decode-cost-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .image-decode-cost-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .image-decode-cost-stage { animation: image-decode-cost-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes image-decode-cost-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="image-decode-cost-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="image-decode-cost-bg" width="980" height="322"/>
  <text class="image-decode-cost-h1"  x="30" y="40">Where a training pipeline actually spends its time</text>
  <text class="image-decode-cost-sub" x="30" y="64">Decoding images is a common reason an expensive accelerator sits idle.</text>
  <g class="image-decode-cost-stage image-decode-cost-s0">
    <rect class="image-decode-cost-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="image-decode-cost-step" x="44" y="142">01</text>
    <text class="image-decode-cost-name" x="70" y="142">On disk</text>
    <text class="image-decode-cost-desc" x="44" y="166">A 200 KB JPEG. Cheap to</text>
    <text class="image-decode-cost-desc" x="44" y="182">store, cheap to read.</text>
    <text class="image-decode-cost-edge" x="44" y="242">~1 ms</text>
  </g>
  <line class="image-decode-cost-line image-decode-cost-conn image-decode-cost-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#image-decode-cost-tip)"/>
  <g class="image-decode-cost-stage image-decode-cost-s1">
    <rect class="image-decode-cost-warn" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="image-decode-cost-step" x="233" y="142">02</text>
    <text class="image-decode-cost-name" x="259" y="142">Decode</text>
    <text class="image-decode-cost-desc" x="233" y="166">Undo the compression into</text>
    <text class="image-decode-cost-desc" x="233" y="182">6.2 million numbers.</text>
    <text class="image-decode-cost-edge" x="233" y="242">the expensive part</text>
  </g>
  <line class="image-decode-cost-line image-decode-cost-conn image-decode-cost-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#image-decode-cost-tip)"/>
  <g class="image-decode-cost-stage image-decode-cost-s2">
    <rect class="image-decode-cost-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="image-decode-cost-step" x="422" y="142">03</text>
    <text class="image-decode-cost-name" x="448" y="142">Resize</text>
    <text class="image-decode-cost-desc" x="422" y="166">Down to whatever the</text>
    <text class="image-decode-cost-desc" x="422" y="182">model expects, say</text>
    <text class="image-decode-cost-desc" x="422" y="198">224x224.</text>
    <text class="image-decode-cost-edge" x="422" y="242">~1 ms</text>
  </g>
  <line class="image-decode-cost-line image-decode-cost-conn image-decode-cost-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#image-decode-cost-tip)"/>
  <g class="image-decode-cost-stage image-decode-cost-s3">
    <rect class="image-decode-cost-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="image-decode-cost-step" x="611" y="142">04</text>
    <text class="image-decode-cost-name" x="637" y="142">Normalise</text>
    <text class="image-decode-cost-desc" x="611" y="166">Subtract the mean, divide</text>
    <text class="image-decode-cost-desc" x="611" y="182">by the standard</text>
    <text class="image-decode-cost-desc" x="611" y="198">deviation.</text>
    <text class="image-decode-cost-edge" x="611" y="242">cheap</text>
  </g>
  <line class="image-decode-cost-line image-decode-cost-conn image-decode-cost-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#image-decode-cost-tip)"/>
  <g class="image-decode-cost-stage image-decode-cost-s4">
    <rect class="image-decode-cost-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="image-decode-cost-step" x="800" y="142">05</text>
    <text class="image-decode-cost-name" x="826" y="142">Batch</text>
    <text class="image-decode-cost-desc" x="800" y="166">Stack many into one</text>
    <text class="image-decode-cost-desc" x="800" y="182">tensor and hand it to the</text>
    <text class="image-decode-cost-desc" x="800" y="198">GPU.</text>
    <text class="image-decode-cost-edge" x="800" y="242">the goal</text>
  </g>
  <text class="image-decode-cost-sub" x="30" y="304">This is CPU work. If it cannot keep pace, the accelerator waits — the sawtooth graph from Day 2.</text>
</svg>
