<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Corrections along the way.">
  <title>Four steps in regression metrics</title>
  <style>
    .metric-history-152-bg   { fill: #f8fafc; }
    .metric-history-152-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-history-152-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-history-152-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-history-152-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-history-152-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-history-152-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .metric-history-152-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .metric-history-152-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .metric-history-152-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .metric-history-152-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .metric-history-152-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .metric-history-152-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .metric-history-152-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .metric-history-152-stage { opacity: 1; }

    .metric-history-152-s0 { animation-delay: 0.00s; }
    .metric-history-152-e0 { animation-delay: 0.00s; }
    .metric-history-152-s1 { animation-delay: 1.28s; }
    .metric-history-152-e1 { animation-delay: 1.28s; }
    .metric-history-152-s2 { animation-delay: 2.56s; }
    .metric-history-152-e2 { animation-delay: 2.56s; }
    .metric-history-152-s3 { animation-delay: 3.84s; }
    .metric-history-152-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .metric-history-152-conn  { animation: metric-history-152-trace 6.4s ease-in-out infinite; }
      .metric-history-152-stage { animation: metric-history-152-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes metric-history-152-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes metric-history-152-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .metric-history-152-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .metric-history-152-stage { animation: metric-history-152-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes metric-history-152-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="metric-history-152-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="metric-history-152-bg" width="980" height="322"/>
  <text class="metric-history-152-h1"  x="30" y="40">Four steps in regression metrics</text>
  <text class="metric-history-152-sub" x="30" y="64">Corrections along the way.</text>
  <g class="metric-history-152-stage metric-history-152-s0">
    <rect class="metric-history-152-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="metric-history-152-step" x="44" y="142">01</text>
    <text class="metric-history-152-name" x="70" y="142">Squared error, from the least-squares tradition</text>
    <text class="metric-history-152-desc" x="44" y="166">Which the loss and the metric</text>
    <text class="metric-history-152-desc" x="44" y="182">shared.</text>
  </g>
  <line class="metric-history-152-line metric-history-152-conn metric-history-152-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#metric-history-152-tip)"/>
  <g class="metric-history-152-stage metric-history-152-s1">
    <rect class="metric-history-152-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="metric-history-152-step" x="280" y="142">02</text>
    <text class="metric-history-152-name" x="306" y="142">Then a normalised fit statistic</text>
    <text class="metric-history-152-desc" x="280" y="166">Comparable across problems, and</text>
    <text class="metric-history-152-desc" x="280" y="182">easily gamed.</text>
  </g>
  <line class="metric-history-152-line metric-history-152-conn metric-history-152-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#metric-history-152-tip)"/>
  <g class="metric-history-152-stage metric-history-152-s2">
    <rect class="metric-history-152-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="metric-history-152-step" x="516" y="142">03</text>
    <text class="metric-history-152-name" x="542" y="142">Adjusted and alternative variants</text>
    <text class="metric-history-152-desc" x="516" y="166">Each fixing one failure and</text>
    <text class="metric-history-152-desc" x="516" y="182">introducing another.</text>
  </g>
  <line class="metric-history-152-line metric-history-152-conn metric-history-152-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#metric-history-152-tip)"/>
  <g class="metric-history-152-stage metric-history-152-s3">
    <rect class="metric-history-152-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="metric-history-152-step" x="752" y="142">04</text>
    <text class="metric-history-152-name" x="778" y="142">And decision-based evaluation in real units</text>
    <text class="metric-history-152-desc" x="752" y="166">Which sidesteps the whole</text>
    <text class="metric-history-152-desc" x="752" y="182">argument.</text>
  </g>
  <text class="metric-history-152-sub" x="30" y="304">The recurring pattern is that each corrected metric acquires its own failure mode, which is the argument for evaluating in real units where that is possible.</text>
</svg>
