<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Not just designing it.">
  <title>Designing and maintaining a building</title>
  <style>
    .building-project-bg   { fill: #f8fafc; }
    .building-project-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .building-project-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .building-project-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .building-project-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .building-project-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .building-project-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .building-project-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .building-project-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .building-project-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .building-project-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .building-project-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .building-project-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .building-project-row { opacity: 1; }
    .building-project-r0 { animation-delay: 0.00s; }
    .building-project-r1 { animation-delay: 0.45s; }
    .building-project-r2 { animation-delay: 0.90s; }
    .building-project-r3 { animation-delay: 1.35s; }
    .building-project-r4 { animation-delay: 1.80s; }
    .building-project-row { animation: building-project-reveal 7.3s ease-in-out infinite; }
    @keyframes building-project-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="building-project-bg" width="980" height="390"/>
  <text class="building-project-h1"  x="30" y="40">Designing and maintaining a building</text>
  <text class="building-project-sub" x="30" y="64">Not just designing it.</text>
  <rect class="building-project-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="building-project-name" x="46" y="122">Design only</text>
  <text class="building-project-desc" x="46" y="142">The interesting part.</text>
  <text class="building-project-desc building-project-row building-project-r0" x="46" y="182">The drawings are the deliverable</text>
  <text class="building-project-desc building-project-row building-project-r1" x="46" y="216">Construction is somebody else's problem</text>
  <text class="building-project-desc building-project-row building-project-r2" x="46" y="250">Maintenance is unconsidered</text>
  <text class="building-project-desc building-project-row building-project-r3" x="46" y="284">The building degrades unattended</text>
  <text class="building-project-desc building-project-row building-project-r4" x="46" y="318">This is a notebook handed over</text>
  <rect class="building-project-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="building-project-name" x="526" y="122">The whole life</text>
  <text class="building-project-desc" x="526" y="142">Including the dull parts.</text>
  <text class="building-project-desc building-project-row building-project-r0" x="526" y="182">Design, build, occupy, maintain</text>
  <text class="building-project-desc building-project-row building-project-r1" x="526" y="216">Constructability shapes the design</text>
  <text class="building-project-desc building-project-row building-project-r2" x="526" y="250">Maintenance is planned from the start</text>
  <text class="building-project-desc building-project-row building-project-r3" x="526" y="284">The building lasts</text>
  <text class="building-project-desc building-project-row building-project-r4" x="526" y="318">This is a lifecycle project</text>
  <text class="building-project-sub" x="30" y="372">Constructability shaping the design is the transferable point: knowing a model must be served in ten milliseconds changes which model you should design.</text>
</svg>
