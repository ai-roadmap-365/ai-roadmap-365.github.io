<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five pillars, one question each.">
  <title>What a readiness review asks</title>
  <style>
    .readiness-pillars-bg   { fill: #f8fafc; }
    .readiness-pillars-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readiness-pillars-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readiness-pillars-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readiness-pillars-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readiness-pillars-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readiness-pillars-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .readiness-pillars-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .readiness-pillars-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .readiness-pillars-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .readiness-pillars-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .readiness-pillars-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .readiness-pillars-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .readiness-pillars-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .readiness-pillars-stage { opacity: 1; }

    .readiness-pillars-s0 { animation-delay: 0.00s; }
    .readiness-pillars-e0 { animation-delay: 0.00s; }
    .readiness-pillars-s1 { animation-delay: 1.33s; }
    .readiness-pillars-e1 { animation-delay: 1.33s; }
    .readiness-pillars-s2 { animation-delay: 2.67s; }
    .readiness-pillars-e2 { animation-delay: 2.67s; }
    .readiness-pillars-s3 { animation-delay: 4.00s; }
    .readiness-pillars-e3 { animation-delay: 4.00s; }
    .readiness-pillars-s4 { animation-delay: 5.33s; }
    .readiness-pillars-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .readiness-pillars-conn  { animation: readiness-pillars-trace 8s ease-in-out infinite; }
      .readiness-pillars-stage { animation: readiness-pillars-arrive 8s ease-in-out infinite; }
    }
    @keyframes readiness-pillars-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes readiness-pillars-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .readiness-pillars-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .readiness-pillars-stage { animation: readiness-pillars-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes readiness-pillars-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="readiness-pillars-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="readiness-pillars-bg" width="980" height="322"/>
  <text class="readiness-pillars-h1"  x="30" y="40">What a readiness review asks</text>
  <text class="readiness-pillars-sub" x="30" y="64">Five pillars, one question each.</text>
  <g class="readiness-pillars-stage readiness-pillars-s0">
    <rect class="readiness-pillars-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="readiness-pillars-step" x="44" y="142">01</text>
    <text class="readiness-pillars-name" x="70" y="142">Can this be rebuilt from the repository?</text>
    <text class="readiness-pillars-desc" x="44" y="166">If not, the answer is a</text>
    <text class="readiness-pillars-desc" x="44" y="182">runbook nobody has</text>
    <text class="readiness-pillars-desc" x="44" y="198">followed.</text>
  </g>
  <line class="readiness-pillars-line readiness-pillars-conn readiness-pillars-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#readiness-pillars-tip)"/>
  <g class="readiness-pillars-stage readiness-pillars-s1">
    <rect class="readiness-pillars-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="readiness-pillars-step" x="233" y="142">02</text>
    <text class="readiness-pillars-name" x="259" y="142">Is the GPU actually busy?</text>
    <text class="readiness-pillars-desc" x="233" y="166">Batching configured, VRAM</text>
    <text class="readiness-pillars-desc" x="233" y="182">bounded, saturation</text>
    <text class="readiness-pillars-desc" x="233" y="198">visible.</text>
    <text class="readiness-pillars-edge" x="233" y="242">utilisation</text>
  </g>
  <line class="readiness-pillars-line readiness-pillars-conn readiness-pillars-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#readiness-pillars-tip)"/>
  <g class="readiness-pillars-stage readiness-pillars-s2">
    <rect class="readiness-pillars-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="readiness-pillars-step" x="422" y="142">03</text>
    <text class="readiness-pillars-name" x="448" y="142">Would you know within five minutes?</text>
    <text class="readiness-pillars-desc" x="422" y="166">P95 alerts with a</text>
    <text class="readiness-pillars-desc" x="422" y="182">duration clause, routed</text>
    <text class="readiness-pillars-desc" x="422" y="198">to a pager.</text>
  </g>
  <line class="readiness-pillars-line readiness-pillars-conn readiness-pillars-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#readiness-pillars-tip)"/>
  <g class="readiness-pillars-stage readiness-pillars-s3">
    <rect class="readiness-pillars-warn" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="readiness-pillars-step" x="611" y="142">04</text>
    <text class="readiness-pillars-name" x="637" y="142">Does PII reach disk?</text>
    <text class="readiness-pillars-desc" x="611" y="166">Scrubbing in memory,</text>
    <text class="readiness-pillars-desc" x="611" y="182">retention configured,</text>
    <text class="readiness-pillars-desc" x="611" y="198">encryption on.</text>
  </g>
  <line class="readiness-pillars-line readiness-pillars-conn readiness-pillars-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#readiness-pillars-tip)"/>
  <g class="readiness-pillars-stage readiness-pillars-s4">
    <rect class="readiness-pillars-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="readiness-pillars-step" x="800" y="142">05</text>
    <text class="readiness-pillars-name" x="826" y="142">Has the rollback been tested?</text>
    <text class="readiness-pillars-desc" x="800" y="166">Not configured —</text>
    <text class="readiness-pillars-desc" x="800" y="182">exercised, with a</text>
    <text class="readiness-pillars-desc" x="800" y="198">measured time.</text>
    <text class="readiness-pillars-edge" x="800" y="242">under 500 ms</text>
  </g>
  <text class="readiness-pillars-sub" x="30" y="304">The last question is the one most reviews accept a configuration file as the answer to, and Day 342's chaos injection is what turns that configuration into evidence.</text>
</svg>
