<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Only one of them is training.">
  <title>Five phases</title>
  <style>
    .classifier-phases-bg   { fill: #f8fafc; }
    .classifier-phases-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .classifier-phases-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .classifier-phases-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .classifier-phases-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .classifier-phases-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .classifier-phases-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .classifier-phases-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .classifier-phases-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .classifier-phases-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .classifier-phases-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .classifier-phases-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .classifier-phases-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .classifier-phases-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .classifier-phases-stage { opacity: 1; }

    .classifier-phases-s0 { animation-delay: 0.00s; }
    .classifier-phases-e0 { animation-delay: 0.00s; }
    .classifier-phases-s1 { animation-delay: 1.33s; }
    .classifier-phases-e1 { animation-delay: 1.33s; }
    .classifier-phases-s2 { animation-delay: 2.67s; }
    .classifier-phases-e2 { animation-delay: 2.67s; }
    .classifier-phases-s3 { animation-delay: 4.00s; }
    .classifier-phases-e3 { animation-delay: 4.00s; }
    .classifier-phases-s4 { animation-delay: 5.33s; }
    .classifier-phases-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .classifier-phases-conn  { animation: classifier-phases-trace 8s ease-in-out infinite; }
      .classifier-phases-stage { animation: classifier-phases-arrive 8s ease-in-out infinite; }
    }
    @keyframes classifier-phases-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes classifier-phases-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .classifier-phases-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .classifier-phases-stage { animation: classifier-phases-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes classifier-phases-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="classifier-phases-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="classifier-phases-bg" width="980" height="322"/>
  <text class="classifier-phases-h1"  x="30" y="40">Five phases</text>
  <text class="classifier-phases-sub" x="30" y="64">Only one of them is training.</text>
  <g class="classifier-phases-stage classifier-phases-s0">
    <rect class="classifier-phases-warn" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="classifier-phases-step" x="44" y="142">01</text>
    <text class="classifier-phases-name" x="70" y="142">Curate</text>
    <text class="classifier-phases-desc" x="44" y="166">Deduplicate, remove</text>
    <text class="classifier-phases-desc" x="44" y="182">corrupt files, audit</text>
    <text class="classifier-phases-desc" x="44" y="198">labels. The phase most</text>
  </g>
  <line class="classifier-phases-line classifier-phases-conn classifier-phases-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#classifier-phases-tip)"/>
  <g class="classifier-phases-stage classifier-phases-s1">
    <rect class="classifier-phases-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="classifier-phases-step" x="233" y="142">02</text>
    <text class="classifier-phases-name" x="259" y="142">Fine-tune</text>
    <text class="classifier-phases-desc" x="233" y="166">A pretrained backbone,</text>
    <text class="classifier-phases-desc" x="233" y="182">two-phase, with</text>
    <text class="classifier-phases-desc" x="233" y="198">augmentation.</text>
  </g>
  <line class="classifier-phases-line classifier-phases-conn classifier-phases-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#classifier-phases-tip)"/>
  <g class="classifier-phases-stage classifier-phases-s2">
    <rect class="classifier-phases-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="classifier-phases-step" x="422" y="142">03</text>
    <text class="classifier-phases-name" x="448" y="142">Analyse errors</text>
    <text class="classifier-phases-desc" x="422" y="166">The confident mistakes</text>
    <text class="classifier-phases-desc" x="422" y="182">name what to fix.</text>
    <text class="classifier-phases-edge" x="422" y="242">the real work</text>
  </g>
  <line class="classifier-phases-line classifier-phases-conn classifier-phases-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#classifier-phases-tip)"/>
  <g class="classifier-phases-stage classifier-phases-s3">
    <rect class="classifier-phases-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="classifier-phases-step" x="611" y="142">04</text>
    <text class="classifier-phases-name" x="637" y="142">Export and verify</text>
    <text class="classifier-phases-desc" x="611" y="166">A model inside a notebook</text>
    <text class="classifier-phases-desc" x="611" y="182">is not a solution.</text>
  </g>
  <line class="classifier-phases-line classifier-phases-conn classifier-phases-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#classifier-phases-tip)"/>
  <g class="classifier-phases-stage classifier-phases-s4">
    <rect class="classifier-phases-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="classifier-phases-step" x="800" y="142">05</text>
    <text class="classifier-phases-name" x="826" y="142">Monitor for drift</text>
    <text class="classifier-phases-desc" x="800" y="166">Cameras, lighting and</text>
    <text class="classifier-phases-desc" x="800" y="182">products all change.</text>
  </g>
  <text class="classifier-phases-sub" x="30" y="304">Training occupies a small fraction of the effort in a real project, and the phases either side of it — curation and error analysis — are where accuracy is actually gained.</text>
</svg>
