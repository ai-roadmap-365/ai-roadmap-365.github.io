<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Which changes decisions in flight.">
  <title>A visible meter</title>
  <style>
    .taxi-meter-bg   { fill: #f8fafc; }
    .taxi-meter-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .taxi-meter-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .taxi-meter-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .taxi-meter-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .taxi-meter-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .taxi-meter-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .taxi-meter-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .taxi-meter-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .taxi-meter-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .taxi-meter-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .taxi-meter-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .taxi-meter-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .taxi-meter-row { opacity: 1; }
    .taxi-meter-r0 { animation-delay: 0.00s; }
    .taxi-meter-r1 { animation-delay: 0.45s; }
    .taxi-meter-r2 { animation-delay: 0.90s; }
    .taxi-meter-r3 { animation-delay: 1.35s; }
    .taxi-meter-r4 { animation-delay: 1.80s; }
    .taxi-meter-row { animation: taxi-meter-reveal 7.3s ease-in-out infinite; }
    @keyframes taxi-meter-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="taxi-meter-bg" width="980" height="390"/>
  <text class="taxi-meter-h1"  x="30" y="40">A visible meter</text>
  <text class="taxi-meter-sub" x="30" y="64">Which changes decisions in flight.</text>
  <rect class="taxi-meter-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="taxi-meter-name" x="46" y="122">A monthly budget</text>
  <text class="taxi-meter-desc" x="46" y="142">Found out at the end.</text>
  <text class="taxi-meter-desc taxi-meter-row taxi-meter-r0" x="46" y="182">Transport cost something</text>
  <text class="taxi-meter-desc taxi-meter-row taxi-meter-r1" x="46" y="216">The amount arrives with the statement</text>
  <text class="taxi-meter-desc taxi-meter-row taxi-meter-r2" x="46" y="250">No decision changes in flight</text>
  <text class="taxi-meter-desc taxi-meter-row taxi-meter-r3" x="46" y="284">The scenic route is invisible</text>
  <text class="taxi-meter-desc taxi-meter-row taxi-meter-r4" x="46" y="318">And so is the one that repeated</text>
  <rect class="taxi-meter-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="taxi-meter-name" x="526" y="122">A visible meter</text>
  <text class="taxi-meter-desc" x="526" y="142">Four behaviours change.</text>
  <text class="taxi-meter-desc taxi-meter-row taxi-meter-r0" x="526" y="182">You notice the scenic route costs three times more</text>
  <text class="taxi-meter-desc taxi-meter-row taxi-meter-r1" x="526" y="216">You remember making this exact journey today</text>
  <text class="taxi-meter-desc taxi-meter-row taxi-meter-r2" x="526" y="250">You take the bus for short predictable trips</text>
  <text class="taxi-meter-desc taxi-meter-row taxi-meter-r3" x="526" y="284">You do not ask the driver to circle the block</text>
  <text class="taxi-meter-desc taxi-meter-row taxi-meter-r4" x="526" y="318">And you say "stop at forty pounds"</text>
  <text class="taxi-meter-sub" x="30" y="372">The last is the cap, and its absence is what makes an unfamiliar city with a meter running unbounded — which is precisely the shape of a retry loop against a paid API.</text>
</svg>
