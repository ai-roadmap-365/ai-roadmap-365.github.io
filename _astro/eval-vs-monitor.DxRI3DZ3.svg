<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Before and after.">
  <title>Offline evaluation against live monitoring</title>
  <style>
    .eval-vs-monitor-bg   { fill: #f8fafc; }
    .eval-vs-monitor-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-vs-monitor-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-vs-monitor-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-vs-monitor-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-vs-monitor-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-vs-monitor-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eval-vs-monitor-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eval-vs-monitor-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eval-vs-monitor-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eval-vs-monitor-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eval-vs-monitor-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eval-vs-monitor-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eval-vs-monitor-row { opacity: 1; }
    .eval-vs-monitor-r0 { animation-delay: 0.00s; }
    .eval-vs-monitor-r1 { animation-delay: 0.45s; }
    .eval-vs-monitor-r2 { animation-delay: 0.90s; }
    .eval-vs-monitor-r3 { animation-delay: 1.35s; }
    .eval-vs-monitor-r4 { animation-delay: 1.80s; }
    .eval-vs-monitor-row { animation: eval-vs-monitor-reveal 7.3s ease-in-out infinite; }
    @keyframes eval-vs-monitor-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="eval-vs-monitor-bg" width="980" height="390"/>
  <text class="eval-vs-monitor-h1"  x="30" y="40">Offline evaluation against live monitoring</text>
  <text class="eval-vs-monitor-sub" x="30" y="64">Before and after.</text>
  <rect class="eval-vs-monitor-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="eval-vs-monitor-name" x="46" y="122">Offline evaluation</text>
  <text class="eval-vs-monitor-desc" x="46" y="142">A fixed test set.</text>
  <text class="eval-vs-monitor-desc eval-vs-monitor-row eval-vs-monitor-r0" x="46" y="182">The same questions every run</text>
  <text class="eval-vs-monitor-desc eval-vs-monitor-row eval-vs-monitor-r1" x="46" y="216">Comparable across versions</text>
  <text class="eval-vs-monitor-desc eval-vs-monitor-row eval-vs-monitor-r2" x="46" y="250">Run on changes, before release</text>
  <text class="eval-vs-monitor-desc eval-vs-monitor-row eval-vs-monitor-r3" x="46" y="284">Complete metrics, high cost</text>
  <text class="eval-vs-monitor-desc eval-vs-monitor-row eval-vs-monitor-r4" x="46" y="318">Answers: is this change better</text>
  <rect class="eval-vs-monitor-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="eval-vs-monitor-name" x="526" y="122">Live monitoring</text>
  <text class="eval-vs-monitor-desc" x="526" y="142">Real traffic.</text>
  <text class="eval-vs-monitor-desc eval-vs-monitor-row eval-vs-monitor-r0" x="526" y="182">Whatever users actually ask</text>
  <text class="eval-vs-monitor-desc eval-vs-monitor-row eval-vs-monitor-r1" x="526" y="216">Not comparable across time</text>
  <text class="eval-vs-monitor-desc eval-vs-monitor-row eval-vs-monitor-r2" x="526" y="250">Sampled continuously</text>
  <text class="eval-vs-monitor-desc eval-vs-monitor-row eval-vs-monitor-r3" x="526" y="284">Cheap metrics only</text>
  <text class="eval-vs-monitor-desc eval-vs-monitor-row eval-vs-monitor-r4" x="526" y="318">Answers: is it still working</text>
  <text class="eval-vs-monitor-sub" x="30" y="372">They answer different questions and neither substitutes for the other: an offline set cannot detect that user behaviour changed, and monitoring cannot compare two candidates.</text>
</svg>
