<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Present is not the same as ready.">
  <title>Opening a restaurant</title>
  <style>
    .restaurant-analogy-bg   { fill: #f8fafc; }
    .restaurant-analogy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .restaurant-analogy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .restaurant-analogy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .restaurant-analogy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .restaurant-analogy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .restaurant-analogy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .restaurant-analogy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .restaurant-analogy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .restaurant-analogy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .restaurant-analogy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .restaurant-analogy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .restaurant-analogy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .restaurant-analogy-row { opacity: 1; }
    .restaurant-analogy-r0 { animation-delay: 0.00s; }
    .restaurant-analogy-r1 { animation-delay: 0.45s; }
    .restaurant-analogy-r2 { animation-delay: 0.90s; }
    .restaurant-analogy-r3 { animation-delay: 1.35s; }
    .restaurant-analogy-r4 { animation-delay: 1.80s; }
    .restaurant-analogy-row { animation: restaurant-analogy-reveal 7.3s ease-in-out infinite; }
    @keyframes restaurant-analogy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="restaurant-analogy-bg" width="980" height="390"/>
  <text class="restaurant-analogy-h1"  x="30" y="40">Opening a restaurant</text>
  <text class="restaurant-analogy-sub" x="30" y="64">Present is not the same as ready.</text>
  <rect class="restaurant-analogy-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="restaurant-analogy-name" x="46" y="122">Staff arrive in order</text>
  <text class="restaurant-analogy-desc" x="46" y="142">Everyone present, nothing ready.</text>
  <text class="restaurant-analogy-desc restaurant-analogy-row restaurant-analogy-r0" x="46" y="182">Kitchen staff before front of house</text>
  <text class="restaurant-analogy-desc restaurant-analogy-row restaurant-analogy-r1" x="46" y="216">Says nothing about the ovens</text>
  <text class="restaurant-analogy-desc restaurant-analogy-row restaurant-analogy-r2" x="46" y="250">The doors open, someone orders</text>
  <text class="restaurant-analogy-desc restaurant-analogy-row restaurant-analogy-r3" x="46" y="284">The kitchen cannot cook</text>
  <text class="restaurant-analogy-desc restaurant-analogy-row restaurant-analogy-r4" x="46" y="318">This is depends_on with no condition</text>
  <rect class="restaurant-analogy-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="restaurant-analogy-name" x="526" y="122">The chef says ready</text>
  <text class="restaurant-analogy-desc" x="526" y="142">Opens later, serves food.</text>
  <text class="restaurant-analogy-desc restaurant-analogy-row restaurant-analogy-r0" x="526" y="182">The doors open on a signal</text>
  <text class="restaurant-analogy-desc restaurant-analogy-row restaurant-analogy-r1" x="526" y="216">The signal has to mean something</text>
  <text class="restaurant-analogy-desc restaurant-analogy-row restaurant-analogy-r2" x="526" y="250">A chef who says "ready" on arrival tells you nothing</text>
  <text class="restaurant-analogy-desc restaurant-analogy-row restaurant-analogy-r3" x="526" y="284">That is a healthcheck returning 200 for liveness</text>
  <text class="restaurant-analogy-desc restaurant-analogy-row restaurant-analogy-r4" x="526" y="318">This is condition: service_healthy</text>
  <text class="restaurant-analogy-sub" x="30" y="372">And the cycle: front of house waiting for the kitchen while the kitchen waits for front of house. Nobody starts, ever — which is the useful kind of failure, because it is total rather than intermittent.</text>
</svg>
