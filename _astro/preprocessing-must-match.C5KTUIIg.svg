<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="When they differ, the model degrades quietly instead of failing loudly.">
  <title>Training and serving must encode identically</title>
  <style>
    .preprocessing-must-match-bg   { fill: #f8fafc; }
    .preprocessing-must-match-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .preprocessing-must-match-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .preprocessing-must-match-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .preprocessing-must-match-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .preprocessing-must-match-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .preprocessing-must-match-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .preprocessing-must-match-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .preprocessing-must-match-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .preprocessing-must-match-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .preprocessing-must-match-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .preprocessing-must-match-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .preprocessing-must-match-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .preprocessing-must-match-row { opacity: 1; }
    .preprocessing-must-match-r0 { animation-delay: 0.00s; }
    .preprocessing-must-match-r1 { animation-delay: 0.45s; }
    .preprocessing-must-match-r2 { animation-delay: 0.90s; }
    .preprocessing-must-match-r3 { animation-delay: 1.35s; }
    .preprocessing-must-match-r4 { animation-delay: 1.80s; }
    .preprocessing-must-match-row { animation: preprocessing-must-match-reveal 7.3s ease-in-out infinite; }
    @keyframes preprocessing-must-match-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="preprocessing-must-match-bg" width="980" height="390"/>
  <text class="preprocessing-must-match-h1"  x="30" y="40">Training and serving must encode identically</text>
  <text class="preprocessing-must-match-sub" x="30" y="64">When they differ, the model degrades quietly instead of failing loudly.</text>
  <rect class="preprocessing-must-match-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="preprocessing-must-match-name" x="46" y="122">They agree</text>
  <text class="preprocessing-must-match-desc" x="46" y="142">The model sees what it learned</text>
  <text class="preprocessing-must-match-desc preprocessing-must-match-row preprocessing-must-match-r0" x="46" y="182">Same image size and interpolation</text>
  <text class="preprocessing-must-match-desc preprocessing-must-match-row preprocessing-must-match-r1" x="46" y="216">Same channel order, RGB or BGR</text>
  <text class="preprocessing-must-match-desc preprocessing-must-match-row preprocessing-must-match-r2" x="46" y="250">Same normalisation mean and standard deviation</text>
  <text class="preprocessing-must-match-desc preprocessing-must-match-row preprocessing-must-match-r3" x="46" y="284">Same tokeniser and same version</text>
  <text class="preprocessing-must-match-desc preprocessing-must-match-row preprocessing-must-match-r4" x="46" y="318">Same audio sample rate</text>
  <rect class="preprocessing-must-match-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="preprocessing-must-match-name" x="526" y="122">They differ</text>
  <text class="preprocessing-must-match-desc" x="526" y="142">Silently worse</text>
  <text class="preprocessing-must-match-desc preprocessing-must-match-row preprocessing-must-match-r0" x="526" y="182">No exception is raised anywhere</text>
  <text class="preprocessing-must-match-desc preprocessing-must-match-row preprocessing-must-match-r1" x="526" y="216">Accuracy drops by a few points, unexplained</text>
  <text class="preprocessing-must-match-desc preprocessing-must-match-row preprocessing-must-match-r2" x="526" y="250">Or a lot, if channel order is swapped</text>
  <text class="preprocessing-must-match-desc preprocessing-must-match-row preprocessing-must-match-r3" x="526" y="284">Tests pass because tests use the same code path</text>
  <text class="preprocessing-must-match-desc preprocessing-must-match-row preprocessing-must-match-r4" x="526" y="318">Found weeks later, if at all</text>
  <text class="preprocessing-must-match-sub" x="30" y="372">The model is being asked a question in a language it was not taught. It answers anyway.</text>
</svg>
