<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when a script suffices.">
  <title>When to build a pipeline</title>
  <style>
    .pipe-when-bg   { fill: #f8fafc; }
    .pipe-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipe-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipe-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipe-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipe-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipe-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pipe-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pipe-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pipe-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pipe-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pipe-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pipe-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pipe-when-row { opacity: 1; }
    .pipe-when-r0 { animation-delay: 0.00s; }
    .pipe-when-r1 { animation-delay: 0.45s; }
    .pipe-when-r2 { animation-delay: 0.90s; }
    .pipe-when-r3 { animation-delay: 1.35s; }
    .pipe-when-r4 { animation-delay: 1.80s; }
    .pipe-when-row { animation: pipe-when-reveal 7.3s ease-in-out infinite; }
    @keyframes pipe-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="pipe-when-bg" width="980" height="390"/>
  <text class="pipe-when-h1"  x="30" y="40">When to build a pipeline</text>
  <text class="pipe-when-sub" x="30" y="64">And when a script suffices.</text>
  <rect class="pipe-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="pipe-when-name" x="46" y="122">Build one</text>
  <text class="pipe-when-desc" x="46" y="142">Four cases.</text>
  <text class="pipe-when-desc pipe-when-row pipe-when-r0" x="46" y="182">Data refreshed regularly</text>
  <text class="pipe-when-desc pipe-when-row pipe-when-r1" x="46" y="216">Results others depend on</text>
  <text class="pipe-when-desc pipe-when-row pipe-when-r2" x="46" y="250">Several people involved</text>
  <text class="pipe-when-desc pipe-when-row pipe-when-r3" x="46" y="284">Regulatory or audit requirements</text>
  <text class="pipe-when-desc pipe-when-row pipe-when-r4" x="46" y="318">Anything that will be rerun</text>
  <rect class="pipe-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="pipe-when-name" x="526" y="122">A script suffices</text>
  <text class="pipe-when-desc" x="526" y="142">Also four.</text>
  <text class="pipe-when-desc pipe-when-row pipe-when-r0" x="526" y="182">A genuinely one-off question</text>
  <text class="pipe-when-desc pipe-when-row pipe-when-r1" x="526" y="216">A dataset that will never change</text>
  <text class="pipe-when-desc pipe-when-row pipe-when-r2" x="526" y="250">Exploratory work being discarded</text>
  <text class="pipe-when-desc pipe-when-row pipe-when-r3" x="526" y="284">A prototype</text>
  <text class="pipe-when-desc pipe-when-row pipe-when-r4" x="526" y="318">But keep even those in version control</text>
  <text class="pipe-when-sub" x="30" y="372">Keeping even throwaway work in version control costs nothing and repeatedly turns out to matter when someone asks how a number was produced.</text>
</svg>
