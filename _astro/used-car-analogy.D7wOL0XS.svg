<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Disclosure is what makes the rest believable.">
  <title>Selling a used car</title>
  <style>
    .used-car-analogy-bg   { fill: #f8fafc; }
    .used-car-analogy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .used-car-analogy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .used-car-analogy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .used-car-analogy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .used-car-analogy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .used-car-analogy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .used-car-analogy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .used-car-analogy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .used-car-analogy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .used-car-analogy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .used-car-analogy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .used-car-analogy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .used-car-analogy-row { opacity: 1; }
    .used-car-analogy-r0 { animation-delay: 0.00s; }
    .used-car-analogy-r1 { animation-delay: 0.45s; }
    .used-car-analogy-r2 { animation-delay: 0.90s; }
    .used-car-analogy-r3 { animation-delay: 1.35s; }
    .used-car-analogy-r4 { animation-delay: 1.80s; }
    .used-car-analogy-row { animation: used-car-analogy-reveal 7.3s ease-in-out infinite; }
    @keyframes used-car-analogy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="used-car-analogy-bg" width="980" height="390"/>
  <text class="used-car-analogy-h1"  x="30" y="40">Selling a used car</text>
  <text class="used-car-analogy-sub" x="30" y="64">Disclosure is what makes the rest believable.</text>
  <rect class="used-car-analogy-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="used-car-analogy-name" x="46" y="122">"Great condition"</text>
  <text class="used-car-analogy-desc" x="46" y="142">Every advert says this.</text>
  <text class="used-car-analogy-desc used-car-analogy-row used-car-analogy-r0" x="46" y="182">"Runs beautifully"</text>
  <text class="used-car-analogy-desc used-car-analogy-row used-car-analogy-r1" x="46" y="216">"Well looked after"</text>
  <text class="used-car-analogy-desc used-car-analogy-row used-car-analogy-r2" x="46" y="250">Nothing to distinguish it</text>
  <text class="used-car-analogy-desc used-car-analogy-row used-car-analogy-r3" x="46" y="284">The absence starts to look deliberate</text>
  <text class="used-car-analogy-desc used-car-analogy-row used-car-analogy-r4" x="46" y="318">Confidence has nowhere to come from</text>
  <rect class="used-car-analogy-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="used-car-analogy-name" x="526" y="122">"68,000 miles"</text>
  <text class="used-car-analogy-desc" x="526" y="142">All checkable.</text>
  <text class="used-car-analogy-desc used-car-analogy-row used-car-analogy-r0" x="526" y="182">One owner, full service history</text>
  <text class="used-car-analogy-desc used-car-analogy-row used-car-analogy-r1" x="526" y="216">New timing belt at 62,000</text>
  <text class="used-car-analogy-desc used-car-analogy-row used-car-analogy-r2" x="526" y="250">"Here is the inspection report"</text>
  <text class="used-car-analogy-desc used-car-analogy-row used-car-analogy-r3" x="526" y="284">"I did the belt; the garage did the clutch"</text>
  <text class="used-car-analogy-desc used-car-analogy-row used-car-analogy-r4" x="526" y="318">Confidence comes from being able to check</text>
  <text class="used-car-analogy-sub" x="30" y="372">The strong advert gives away the mileage. That disclosure is what makes the flattering parts credible — the same mechanism as yesterday's limitations section, applied to a different document.</text>
</svg>
