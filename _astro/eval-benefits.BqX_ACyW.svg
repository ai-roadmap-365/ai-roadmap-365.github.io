<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Editing, migrating and improving.">
  <title>Three things evals unlock</title>
  <style>
    .eval-benefits-bg   { fill: #f8fafc; }
    .eval-benefits-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-benefits-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-benefits-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-benefits-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-benefits-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-benefits-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eval-benefits-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eval-benefits-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eval-benefits-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eval-benefits-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eval-benefits-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eval-benefits-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .eval-benefits-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .eval-benefits-stage { opacity: 1; }

    .eval-benefits-s0 { animation-delay: 0.00s; }
    .eval-benefits-e0 { animation-delay: 0.00s; }
    .eval-benefits-s1 { animation-delay: 1.50s; }
    .eval-benefits-e1 { animation-delay: 1.50s; }
    .eval-benefits-s2 { animation-delay: 3.00s; }
    .eval-benefits-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .eval-benefits-conn  { animation: eval-benefits-trace 6s ease-in-out infinite; }
      .eval-benefits-stage { animation: eval-benefits-arrive 6s ease-in-out infinite; }
    }
    @keyframes eval-benefits-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes eval-benefits-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .eval-benefits-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .eval-benefits-stage { animation: eval-benefits-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes eval-benefits-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="eval-benefits-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="eval-benefits-bg" width="980" height="322"/>
  <text class="eval-benefits-h1"  x="30" y="40">Three things evals unlock</text>
  <text class="eval-benefits-sub" x="30" y="64">Editing, migrating and improving.</text>
  <g class="eval-benefits-stage eval-benefits-s0">
    <rect class="eval-benefits-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="eval-benefits-step" x="44" y="142">01</text>
    <text class="eval-benefits-name" x="70" y="142">Prompt editing becomes safe</text>
    <text class="eval-benefits-desc" x="44" y="166">A change is measured against a baseline</text>
    <text class="eval-benefits-desc" x="44" y="182">rather than hoped about.</text>
  </g>
  <line class="eval-benefits-line eval-benefits-conn eval-benefits-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#eval-benefits-tip)"/>
  <g class="eval-benefits-stage eval-benefits-s1">
    <rect class="eval-benefits-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="eval-benefits-step" x="359" y="142">02</text>
    <text class="eval-benefits-name" x="385" y="142">Migration becomes a decision</text>
    <text class="eval-benefits-desc" x="359" y="166">500 examples in two minutes, against a 70%</text>
    <text class="eval-benefits-desc" x="359" y="182">cheaper model.</text>
    <text class="eval-benefits-edge" x="359" y="242">evidence</text>
  </g>
  <line class="eval-benefits-line eval-benefits-conn eval-benefits-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#eval-benefits-tip)"/>
  <g class="eval-benefits-stage eval-benefits-s2">
    <rect class="eval-benefits-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="eval-benefits-step" x="674" y="142">03</text>
    <text class="eval-benefits-name" x="700" y="142">Production failures become tests</text>
    <text class="eval-benefits-desc" x="674" y="166">A thumbs-down becomes a case that can never</text>
    <text class="eval-benefits-desc" x="674" y="182">silently regress.</text>
    <text class="eval-benefits-edge" x="674" y="242">flywheel</text>
  </g>
  <text class="eval-benefits-sub" x="30" y="304">The third is what makes the suite an asset rather than a cost: it accumulates exactly the failures your users actually encountered, which is a dataset no benchmark and no vendor can supply.</text>
</svg>
