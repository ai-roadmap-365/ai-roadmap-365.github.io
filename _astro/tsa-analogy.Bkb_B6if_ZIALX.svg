<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label=""Average six minutes" and a missed flight.">
  <title>Airport security wait times</title>
  <style>
    .tsa-analogy-bg   { fill: #f8fafc; }
    .tsa-analogy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tsa-analogy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tsa-analogy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tsa-analogy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tsa-analogy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tsa-analogy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tsa-analogy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tsa-analogy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tsa-analogy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tsa-analogy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tsa-analogy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tsa-analogy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tsa-analogy-row { opacity: 1; }
    .tsa-analogy-r0 { animation-delay: 0.00s; }
    .tsa-analogy-r1 { animation-delay: 0.45s; }
    .tsa-analogy-r2 { animation-delay: 0.90s; }
    .tsa-analogy-r3 { animation-delay: 1.35s; }
    .tsa-analogy-r4 { animation-delay: 1.80s; }
    .tsa-analogy-row { animation: tsa-analogy-reveal 7.3s ease-in-out infinite; }
    @keyframes tsa-analogy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tsa-analogy-bg" width="980" height="390"/>
  <text class="tsa-analogy-h1"  x="30" y="40">Airport security wait times</text>
  <text class="tsa-analogy-sub" x="30" y="64">"Average six minutes" and a missed flight.</text>
  <rect class="tsa-analogy-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tsa-analogy-name" x="46" y="122">"Average: 6 minutes"</text>
  <text class="tsa-analogy-desc" x="46" y="142">Technically true.</text>
  <text class="tsa-analogy-desc tsa-analogy-row tsa-analogy-r0" x="46" y="182">90% of travellers pass in 2 minutes</text>
  <text class="tsa-analogy-desc tsa-analogy-row tsa-analogy-r1" x="46" y="216">Which drags the average down</text>
  <text class="tsa-analogy-desc tsa-analogy-row tsa-analogy-r2" x="46" y="250">The announcement is accurate</text>
  <text class="tsa-analogy-desc tsa-analogy-row tsa-analogy-r3" x="46" y="284">And describes nobody's actual problem</text>
  <text class="tsa-analogy-desc tsa-analogy-row tsa-analogy-r4" x="46" y="318">Nothing triggers a response</text>
  <rect class="tsa-analogy-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tsa-analogy-name" x="526" y="122">P95: 45 minutes</text>
  <text class="tsa-analogy-desc" x="526" y="142">Five percent miss flights.</text>
  <text class="tsa-analogy-desc tsa-analogy-row tsa-analogy-r0" x="526" y="182">Flagged for manual bag inspection</text>
  <text class="tsa-analogy-desc tsa-analogy-row tsa-analogy-r1" x="526" y="216">Waiting in a line nobody measured</text>
  <text class="tsa-analogy-desc tsa-analogy-row tsa-analogy-r2" x="526" y="250">This is the number worth alerting on</text>
  <text class="tsa-analogy-desc tsa-analogy-row tsa-analogy-r3" x="526" y="284">P95 above 20 minutes: open four lanes</text>
  <text class="tsa-analogy-desc tsa-analogy-row tsa-analogy-r4" x="526" y="318">An alert with an action attached</text>
  <text class="tsa-analogy-sub" x="30" y="372">The mitigation attached to the alert is what makes it worth having: "P95 above twenty minutes, open four lanes" is a rule, and "wait times are high" is an observation.</text>
</svg>
