<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" role="img" aria-label="Latent Diffusion Inference Pipeline">
  <title>Latent Diffusion Inference Pipeline</title>
  <rect width="100%" height="100%" fill="#f8fafc" />
  
    <style>
      .d282a-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d282a-header { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .d282a-text { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .d282a-accent { fill: #1d4ed8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .d282a-arrow { stroke: #1d4ed8; stroke-width: 2; stroke-linecap: round; marker-end: url(#d282a-arrowhead); }
      .d282a-pulse { animation: d282a-glow 2.5s infinite ease-in-out; }
      @keyframes d282a-glow {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(29, 78, 216, 0.2)); }
        50% { filter: drop-shadow(0 0 6px rgba(29, 78, 216, 0.6)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .d282a-pulse { animation: none; }
      }
    </style>
    
  
    <defs>
      <marker id="d282a-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8" />
      </marker>
    </defs>
    
  
  <g transform="translate(40, 40)">
    <rect class="d282a-box" x="0" y="0" width="180" height="220" />
    <text class="d282a-header" x="15" y="30">1. Text Prompt</text>
    <text class="d282a-text" x="15" y="60">• Tokenize text</text>
    <text class="d282a-text" x="15" y="85">• CLIP / T5 Encoder</text>
    <text class="d282a-accent" x="15" y="140">Embedding [77, 768]</text>

    <path class="d282a-arrow" d="M 180 110 L 240 110" />

    <rect class="d282a-box d282a-pulse" x="240" y="0" width="260" height="220" />
    <text class="d282a-header" x="15" y="30">2. Latent Denoising Loop</text>
    <text class="d282a-text" x="15" y="60">• 64x64x4 Latent Space</text>
    <text class="d282a-text" x="15" y="85">• Cross-Attention Layers</text>
    <text class="d282a-text" x="15" y="110">• CFG: Uncond + s*(Cond-Uncond)</text>
    <text class="d282a-accent" x="15" y="160">20-30 Denoising Steps</text>

    <path class="d282a-arrow" d="M 500 110 L 560 110" />

    <rect class="d282a-box" x="560" y="0" width="200" height="220" />
    <text class="d282a-header" x="15" y="30">3. VAE Decoder</text>
    <text class="d282a-text" x="15" y="60">• 8x Upsampling</text>
    <text class="d282a-text" x="15" y="85">• Latent to RGB</text>
    <text class="d282a-accent" x="15" y="140">512x512x3 Image</text>
  </g>

</svg>