<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Beyond the code itself.">
  <title>Five things a deployment changes</title>
  <style>
    .deploy-implications-bg   { fill: #f8fafc; }
    .deploy-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deploy-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deploy-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deploy-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deploy-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deploy-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .deploy-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .deploy-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .deploy-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .deploy-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .deploy-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .deploy-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .deploy-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .deploy-implications-stage { opacity: 1; }

    .deploy-implications-s0 { animation-delay: 0.00s; }
    .deploy-implications-e0 { animation-delay: 0.00s; }
    .deploy-implications-s1 { animation-delay: 1.33s; }
    .deploy-implications-e1 { animation-delay: 1.33s; }
    .deploy-implications-s2 { animation-delay: 2.67s; }
    .deploy-implications-e2 { animation-delay: 2.67s; }
    .deploy-implications-s3 { animation-delay: 4.00s; }
    .deploy-implications-e3 { animation-delay: 4.00s; }
    .deploy-implications-s4 { animation-delay: 5.33s; }
    .deploy-implications-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .deploy-implications-conn  { animation: deploy-implications-trace 8s ease-in-out infinite; }
      .deploy-implications-stage { animation: deploy-implications-arrive 8s ease-in-out infinite; }
    }
    @keyframes deploy-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes deploy-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .deploy-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .deploy-implications-stage { animation: deploy-implications-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes deploy-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="deploy-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="deploy-implications-bg" width="980" height="322"/>
  <text class="deploy-implications-h1"  x="30" y="40">Five things a deployment changes</text>
  <text class="deploy-implications-sub" x="30" y="64">Beyond the code itself.</text>
  <g class="deploy-implications-stage deploy-implications-s0">
    <rect class="deploy-implications-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="deploy-implications-step" x="44" y="142">01</text>
    <text class="deploy-implications-name" x="70" y="142">Pin the digest, not the tag</text>
    <text class="deploy-implications-desc" x="44" y="166">`latest` is mutable and</text>
    <text class="deploy-implications-desc" x="44" y="182">can point at something</text>
    <text class="deploy-implications-desc" x="44" y="198">you did not build.</text>
    <text class="deploy-implications-edge" x="44" y="242">security</text>
  </g>
  <line class="deploy-implications-line deploy-implications-conn deploy-implications-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#deploy-implications-tip)"/>
  <g class="deploy-implications-stage deploy-implications-s1">
    <rect class="deploy-implications-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="deploy-implications-step" x="233" y="142">02</text>
    <text class="deploy-implications-name" x="259" y="142">New logging starts here</text>
    <text class="deploy-implications-desc" x="233" y="166">A deployment is when new</text>
    <text class="deploy-implications-desc" x="233" y="182">fields begin being</text>
    <text class="deploy-implications-desc" x="233" y="198">captured.</text>
    <text class="deploy-implications-edge" x="233" y="242">privacy</text>
  </g>
  <line class="deploy-implications-line deploy-implications-conn deploy-implications-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#deploy-implications-tip)"/>
  <g class="deploy-implications-stage deploy-implications-s2">
    <rect class="deploy-implications-warn" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="deploy-implications-step" x="422" y="142">03</text>
    <text class="deploy-implications-name" x="448" y="142">Readiness must allow for load time</text>
    <text class="deploy-implications-desc" x="422" y="166">Or the orchestrator kills</text>
    <text class="deploy-implications-desc" x="422" y="182">a container that was</text>
    <text class="deploy-implications-desc" x="422" y="198">warming up.</text>
    <text class="deploy-implications-edge" x="422" y="242">restart loop</text>
  </g>
  <line class="deploy-implications-line deploy-implications-conn deploy-implications-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#deploy-implications-tip)"/>
  <g class="deploy-implications-stage deploy-implications-s3">
    <rect class="deploy-implications-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="deploy-implications-step" x="611" y="142">04</text>
    <text class="deploy-implications-name" x="637" y="142">A canary needs volume</text>
    <text class="deploy-implications-desc" x="611" y="166">Ten percent of low</text>
    <text class="deploy-implications-desc" x="611" y="182">traffic is three</text>
    <text class="deploy-implications-desc" x="611" y="198">requests, which measures</text>
    <text class="deploy-implications-edge" x="611" y="242">statistics</text>
  </g>
  <line class="deploy-implications-line deploy-implications-conn deploy-implications-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#deploy-implications-tip)"/>
  <g class="deploy-implications-stage deploy-implications-s4">
    <rect class="deploy-implications-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="deploy-implications-step" x="800" y="142">05</text>
    <text class="deploy-implications-name" x="826" y="142">Two versions cost double</text>
    <text class="deploy-implications-desc" x="800" y="166">For the overlap. Usually</text>
    <text class="deploy-implications-desc" x="800" y="182">worth it; worth knowing.</text>
    <text class="deploy-implications-edge" x="800" y="242">money</text>
  </g>
  <text class="deploy-implications-sub" x="30" y="304">The fourth is the one capstones hit: below a certain traffic level a canary is theatre, and a fast rollback is the control actually doing the work.</text>
</svg>
