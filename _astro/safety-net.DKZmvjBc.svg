<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="It changes what you attempt.">
  <title>A safety net</title>
  <style>
    .safety-net-bg   { fill: #f8fafc; }
    .safety-net-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safety-net-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safety-net-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safety-net-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safety-net-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safety-net-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .safety-net-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .safety-net-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .safety-net-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .safety-net-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .safety-net-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .safety-net-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .safety-net-row { opacity: 1; }
    .safety-net-r0 { animation-delay: 0.00s; }
    .safety-net-r1 { animation-delay: 0.45s; }
    .safety-net-r2 { animation-delay: 0.90s; }
    .safety-net-r3 { animation-delay: 1.35s; }
    .safety-net-r4 { animation-delay: 1.80s; }
    .safety-net-row { animation: safety-net-reveal 7.3s ease-in-out infinite; }
    @keyframes safety-net-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="safety-net-bg" width="980" height="390"/>
  <text class="safety-net-h1"  x="30" y="40">A safety net</text>
  <text class="safety-net-sub" x="30" y="64">It changes what you attempt.</text>
  <rect class="safety-net-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="safety-net-name" x="46" y="122">Without a net</text>
  <text class="safety-net-desc" x="46" y="142">Every move is risky.</text>
  <text class="safety-net-desc safety-net-row safety-net-r0" x="46" y="182">Change only what you must</text>
  <text class="safety-net-desc safety-net-row safety-net-r1" x="46" y="216">Avoid touching working code</text>
  <text class="safety-net-desc safety-net-row safety-net-r2" x="46" y="250">Improvements are deferred indefinitely</text>
  <text class="safety-net-desc safety-net-row safety-net-r3" x="46" y="284">The codebase ossifies</text>
  <text class="safety-net-desc safety-net-row safety-net-r4" x="46" y="318">This is untested code</text>
  <rect class="safety-net-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="safety-net-name" x="526" y="122">With a net</text>
  <text class="safety-net-desc" x="526" y="142">Mistakes are caught.</text>
  <text class="safety-net-desc safety-net-row safety-net-r0" x="526" y="182">Change freely, and check</text>
  <text class="safety-net-desc safety-net-row safety-net-r1" x="526" y="216">Refactor without fear</text>
  <text class="safety-net-desc safety-net-row safety-net-r2" x="526" y="250">Improvements happen continuously</text>
  <text class="safety-net-desc safety-net-row safety-net-r3" x="526" y="284">The codebase stays workable</text>
  <text class="safety-net-desc safety-net-row safety-net-r4" x="526" y="318">This is tested code</text>
  <text class="safety-net-sub" x="30" y="372">The ossification in the left column is the real cost of not testing: the code stops improving because nobody dares touch it.</text>
</svg>
