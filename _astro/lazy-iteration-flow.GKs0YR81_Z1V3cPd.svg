<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" font-family="system-ui, sans-serif">
  <title>A lazy generator pipeline moving one record at a time from a large source through a transform and a filter to the consumer, holding only one item in memory</title>
  <rect x="0" y="0" width="780" height="500" fill="#f8fafc"/>
  <text x="390" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">A lazy generator pipeline: one item at a time</text>
  <text x="390" y="60" text-anchor="middle" font-size="14" fill="#1a202c">The consumer pulls; each stage produces a single item on demand, then pauses.</text>

  <!-- Source -->
  <rect x="30" y="120" width="150" height="150" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="8"/>
  <text x="105" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Huge source</text>
  <text x="105" y="166" text-anchor="middle" font-size="13" fill="#1a202c">file / socket /</text>
  <text x="105" y="183" text-anchor="middle" font-size="13" fill="#1a202c">dataset too big</text>
  <text x="105" y="200" text-anchor="middle" font-size="13" fill="#1a202c">to hold in memory</text>
  <text x="105" y="230" text-anchor="middle" font-size="13" fill="#1d4ed8">row 1</text>
  <text x="105" y="248" text-anchor="middle" font-size="13" fill="#1a202c">row 2 ... row N</text>

  <!-- Stage 1: read/parse generator -->
  <rect x="230" y="120" width="150" height="90" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="305" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">read_records</text>
  <text x="305" y="172" text-anchor="middle" font-size="13" fill="#1a202c">yield one</text>
  <text x="305" y="189" text-anchor="middle" font-size="13" fill="#1a202c">parsed record</text>

  <!-- Stage 2: filter generator -->
  <rect x="430" y="120" width="150" height="90" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="505" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">only_matching</text>
  <text x="505" y="172" text-anchor="middle" font-size="13" fill="#1a202c">yield it only</text>
  <text x="505" y="189" text-anchor="middle" font-size="13" fill="#1a202c">if it passes</text>

  <!-- Consumer -->
  <rect x="630" y="120" width="120" height="90" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="690" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Consumer</text>
  <text x="690" y="172" text-anchor="middle" font-size="13" fill="#1a202c">sum / for /</text>
  <text x="690" y="189" text-anchor="middle" font-size="13" fill="#1a202c">next()</text>

  <!-- Forward arrows: one item flows right -->
  <line x1="180" y1="165" x2="228" y2="165" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="228,165 216,159 216,171" fill="#1d4ed8"/>
  <line x1="380" y1="165" x2="428" y2="165" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="428,165 416,159 416,171" fill="#1d4ed8"/>
  <line x1="580" y1="165" x2="628" y2="165" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="628,165 616,159 616,171" fill="#1d4ed8"/>

  <!-- "pull" back arrows -->
  <text x="204" y="105" text-anchor="middle" font-size="12" fill="#1a202c">one record</text>
  <text x="404" y="105" text-anchor="middle" font-size="12" fill="#1a202c">one record</text>
  <text x="604" y="105" text-anchor="middle" font-size="12" fill="#1a202c">one record</text>

  <text x="390" y="300" text-anchor="middle" font-size="13" font-style="italic" fill="#1d4ed8">"next, please" — the pull travels left; the item travels right; nothing runs until asked.</text>

  <!-- Memory footprint box -->
  <rect x="120" y="330" width="540" height="70" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="390" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Memory in flight: exactly ONE record</text>
  <text x="390" y="382" text-anchor="middle" font-size="13" fill="#1a202c">A list comprehension would build the whole result first; the generator never does.</text>

  <!-- StopIteration note -->
  <rect x="120" y="420" width="540" height="56" fill="#fee2e2" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="390" y="446" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">When the source runs dry, the generator raises StopIteration</text>
  <text x="390" y="466" text-anchor="middle" font-size="13" fill="#1a202c">— the signal a for loop catches to know it is done.</text>
</svg>
