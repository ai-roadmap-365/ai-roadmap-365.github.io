<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The account is the risk.">
  <title>Five consequences, and only one is code</title>
  <style>
    .cloud-implications-bg   { fill: #f8fafc; }
    .cloud-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cloud-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cloud-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cloud-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cloud-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cloud-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cloud-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cloud-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cloud-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cloud-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cloud-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cloud-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cloud-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cloud-implications-stage { opacity: 1; }

    .cloud-implications-s0 { animation-delay: 0.00s; }
    .cloud-implications-e0 { animation-delay: 0.00s; }
    .cloud-implications-s1 { animation-delay: 1.33s; }
    .cloud-implications-e1 { animation-delay: 1.33s; }
    .cloud-implications-s2 { animation-delay: 2.67s; }
    .cloud-implications-e2 { animation-delay: 2.67s; }
    .cloud-implications-s3 { animation-delay: 4.00s; }
    .cloud-implications-e3 { animation-delay: 4.00s; }
    .cloud-implications-s4 { animation-delay: 5.33s; }
    .cloud-implications-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .cloud-implications-conn  { animation: cloud-implications-trace 8s ease-in-out infinite; }
      .cloud-implications-stage { animation: cloud-implications-arrive 8s ease-in-out infinite; }
    }
    @keyframes cloud-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cloud-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cloud-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cloud-implications-stage { animation: cloud-implications-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cloud-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cloud-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cloud-implications-bg" width="980" height="322"/>
  <text class="cloud-implications-h1"  x="30" y="40">Five consequences, and only one is code</text>
  <text class="cloud-implications-sub" x="30" y="64">The account is the risk.</text>
  <g class="cloud-implications-stage cloud-implications-s0">
    <rect class="cloud-implications-warn" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="cloud-implications-step" x="44" y="142">01</text>
    <text class="cloud-implications-name" x="70" y="142">The account is the risk, not the code</text>
    <text class="cloud-implications-desc" x="44" y="166">MFA first, a budget alert</text>
    <text class="cloud-implications-desc" x="44" y="182">before deploying, no</text>
    <text class="cloud-implications-desc" x="44" y="198">long-lived key on a</text>
    <text class="cloud-implications-edge" x="44" y="242">security</text>
  </g>
  <line class="cloud-implications-line cloud-implications-conn cloud-implications-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#cloud-implications-tip)"/>
  <g class="cloud-implications-stage cloud-implications-s1">
    <rect class="cloud-implications-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="cloud-implications-step" x="233" y="142">02</text>
    <text class="cloud-implications-name" x="259" y="142">Egress is an attack surface</text>
    <text class="cloud-implications-desc" x="233" y="166">Large responses spend</text>
    <text class="cloud-implications-desc" x="233" y="182">your budget. Rate limits</text>
    <text class="cloud-implications-desc" x="233" y="198">count requests, not</text>
    <text class="cloud-implications-edge" x="233" y="242">cap bytes</text>
  </g>
  <line class="cloud-implications-line cloud-implications-conn cloud-implications-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#cloud-implications-tip)"/>
  <g class="cloud-implications-stage cloud-implications-s2">
    <rect class="cloud-implications-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="cloud-implications-step" x="422" y="142">03</text>
    <text class="cloud-implications-name" x="448" y="142">The region decides the law</text>
    <text class="cloud-implications-desc" x="422" y="166">A compliance question</text>
    <text class="cloud-implications-desc" x="422" y="182">that looks like a</text>
    <text class="cloud-implications-desc" x="422" y="198">dropdown. Answer it</text>
    <text class="cloud-implications-edge" x="422" y="242">jurisdiction</text>
  </g>
  <line class="cloud-implications-line cloud-implications-conn cloud-implications-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#cloud-implications-tip)"/>
  <g class="cloud-implications-stage cloud-implications-s3">
    <rect class="cloud-implications-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="cloud-implications-step" x="611" y="142">04</text>
    <text class="cloud-implications-name" x="637" y="142">Cold starts are seconds for a model</text>
    <text class="cloud-implications-desc" x="611" y="166">A latency decision the</text>
    <text class="cloud-implications-desc" x="611" y="182">cost model says nothing</text>
    <text class="cloud-implications-desc" x="611" y="198">about.</text>
    <text class="cloud-implications-edge" x="611" y="242">performance</text>
  </g>
  <line class="cloud-implications-line cloud-implications-conn cloud-implications-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#cloud-implications-tip)"/>
  <g class="cloud-implications-stage cloud-implications-s4">
    <rect class="cloud-implications-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="cloud-implications-step" x="800" y="142">05</text>
    <text class="cloud-implications-name" x="826" y="142">Capacity is not checked here</text>
    <text class="cloud-implications-desc" x="800" y="166">Cost is one input;</text>
    <text class="cloud-implications-desc" x="800" y="182">reliability and blast</text>
    <text class="cloud-implications-desc" x="800" y="198">radius are others.</text>
  </g>
  <text class="cloud-implications-sub" x="30" y="304">The account with a free tier and a card attached is an attractive target precisely because the attacker's spending is bounded by your card rather than by the free allowance.</text>
</svg>
