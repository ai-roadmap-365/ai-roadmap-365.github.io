<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A volume calculation.">
  <title>Where self-hosting breaks even</title>
  <style>
    .tco-bg   { fill: #f8fafc; }
    .tco-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tco-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tco-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tco-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tco-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tco-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tco-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tco-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tco-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tco-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tco-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tco-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tco-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tco-stage { opacity: 1; }

    .tco-s0 { animation-delay: 0.00s; }
    .tco-e0 { animation-delay: 0.00s; }
    .tco-s1 { animation-delay: 1.28s; }
    .tco-e1 { animation-delay: 1.28s; }
    .tco-s2 { animation-delay: 2.56s; }
    .tco-e2 { animation-delay: 2.56s; }
    .tco-s3 { animation-delay: 3.84s; }
    .tco-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tco-conn  { animation: tco-trace 6.4s ease-in-out infinite; }
      .tco-stage { animation: tco-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tco-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tco-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tco-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tco-stage { animation: tco-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tco-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tco-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tco-bg" width="980" height="322"/>
  <text class="tco-h1"  x="30" y="40">Where self-hosting breaks even</text>
  <text class="tco-sub" x="30" y="64">A volume calculation.</text>
  <g class="tco-stage tco-s0">
    <rect class="tco-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tco-step" x="44" y="142">01</text>
    <text class="tco-name" x="70" y="142">Self-hosting costs the same whether idle or busy</text>
    <text class="tco-desc" x="44" y="166">Hardware, or reserved capacity,</text>
    <text class="tco-desc" x="44" y="182">per hour.</text>
  </g>
  <line class="tco-line tco-conn tco-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tco-tip)"/>
  <g class="tco-stage tco-s1">
    <rect class="tco-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tco-step" x="280" y="142">02</text>
    <text class="tco-name" x="306" y="142">The API costs nothing when idle</text>
    <text class="tco-desc" x="280" y="166">And scales linearly with use.</text>
  </g>
  <line class="tco-line tco-conn tco-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tco-tip)"/>
  <g class="tco-stage tco-s2">
    <rect class="tco-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tco-step" x="516" y="142">03</text>
    <text class="tco-name" x="542" y="142">They cross at a volume</text>
    <text class="tco-desc" x="516" y="166">Below it the API wins, above it</text>
    <text class="tco-desc" x="516" y="182">the hardware does.</text>
  </g>
  <line class="tco-line tco-conn tco-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tco-tip)"/>
  <g class="tco-stage tco-s3">
    <rect class="tco-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tco-step" x="752" y="142">04</text>
    <text class="tco-name" x="778" y="142">But engineering time is the larger cost</text>
    <text class="tco-desc" x="752" y="166">And it is routinely left out of</text>
    <text class="tco-desc" x="752" y="182">the comparison.</text>
  </g>
  <text class="tco-sub" x="30" y="304">Omitting the operating cost is what makes most self-hosting business cases wrong: the salary of the person keeping the cluster healthy usually exceeds the token saving.</text>
</svg>
