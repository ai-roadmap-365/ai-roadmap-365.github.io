<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Displaced, then partly returned.">
  <title>Where recurrence went</title>
  <style>
    .rnn-alternatives-bg   { fill: #f8fafc; }
    .rnn-alternatives-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rnn-alternatives-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rnn-alternatives-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rnn-alternatives-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rnn-alternatives-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rnn-alternatives-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rnn-alternatives-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rnn-alternatives-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rnn-alternatives-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rnn-alternatives-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rnn-alternatives-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rnn-alternatives-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .rnn-alternatives-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .rnn-alternatives-stage { opacity: 1; }

    .rnn-alternatives-s0 { animation-delay: 0.00s; }
    .rnn-alternatives-e0 { animation-delay: 0.00s; }
    .rnn-alternatives-s1 { animation-delay: 1.28s; }
    .rnn-alternatives-e1 { animation-delay: 1.28s; }
    .rnn-alternatives-s2 { animation-delay: 2.56s; }
    .rnn-alternatives-e2 { animation-delay: 2.56s; }
    .rnn-alternatives-s3 { animation-delay: 3.84s; }
    .rnn-alternatives-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .rnn-alternatives-conn  { animation: rnn-alternatives-trace 6.4s ease-in-out infinite; }
      .rnn-alternatives-stage { animation: rnn-alternatives-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes rnn-alternatives-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes rnn-alternatives-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .rnn-alternatives-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .rnn-alternatives-stage { animation: rnn-alternatives-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes rnn-alternatives-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="rnn-alternatives-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="rnn-alternatives-bg" width="980" height="322"/>
  <text class="rnn-alternatives-h1"  x="30" y="40">Where recurrence went</text>
  <text class="rnn-alternatives-sub" x="30" y="64">Displaced, then partly returned.</text>
  <g class="rnn-alternatives-stage rnn-alternatives-s0">
    <rect class="rnn-alternatives-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="rnn-alternatives-step" x="44" y="142">01</text>
    <text class="rnn-alternatives-name" x="70" y="142">Vanilla recurrence</text>
    <text class="rnn-alternatives-desc" x="44" y="166">Memory, and a fifteen-step</text>
    <text class="rnn-alternatives-desc" x="44" y="182">horizon.</text>
  </g>
  <line class="rnn-alternatives-line rnn-alternatives-conn rnn-alternatives-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#rnn-alternatives-tip)"/>
  <g class="rnn-alternatives-stage rnn-alternatives-s1">
    <rect class="rnn-alternatives-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="rnn-alternatives-step" x="280" y="142">02</text>
    <text class="rnn-alternatives-name" x="306" y="142">Gating</text>
    <text class="rnn-alternatives-desc" x="280" y="166">LSTMs and GRUs extend the</text>
    <text class="rnn-alternatives-desc" x="280" y="182">horizon considerably — Day 221.</text>
  </g>
  <line class="rnn-alternatives-line rnn-alternatives-conn rnn-alternatives-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#rnn-alternatives-tip)"/>
  <g class="rnn-alternatives-stage rnn-alternatives-s2">
    <rect class="rnn-alternatives-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="rnn-alternatives-step" x="516" y="142">03</text>
    <text class="rnn-alternatives-name" x="542" y="142">Transformers displace them</text>
    <text class="rnn-alternatives-desc" x="516" y="166">Parallel across positions, and</text>
    <text class="rnn-alternatives-desc" x="516" y="182">far better on long dependencies.</text>
  </g>
  <line class="rnn-alternatives-line rnn-alternatives-conn rnn-alternatives-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#rnn-alternatives-tip)"/>
  <g class="rnn-alternatives-stage rnn-alternatives-s3">
    <rect class="rnn-alternatives-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="rnn-alternatives-step" x="752" y="142">04</text>
    <text class="rnn-alternatives-name" x="778" y="142">State space models revive the idea</text>
    <text class="rnn-alternatives-desc" x="752" y="166">Linear scaling in sequence</text>
    <text class="rnn-alternatives-desc" x="752" y="182">length, parallelisable at</text>
    <text class="rnn-alternatives-desc" x="752" y="198">training time.</text>
  </g>
  <text class="rnn-alternatives-sub" x="30" y="304">The revival is not nostalgia: attention costs quadratic time in sequence length, and recurrent formulations that parallelise during training recover linear scaling without losing trainability.</text>
</svg>
