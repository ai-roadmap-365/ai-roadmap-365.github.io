<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="What each predicts.">
  <title>Logistic against linear regression</title>
  <style>
    .logreg-vs-linear-bg   { fill: #f8fafc; }
    .logreg-vs-linear-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logreg-vs-linear-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logreg-vs-linear-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logreg-vs-linear-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logreg-vs-linear-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logreg-vs-linear-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .logreg-vs-linear-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .logreg-vs-linear-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .logreg-vs-linear-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .logreg-vs-linear-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .logreg-vs-linear-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .logreg-vs-linear-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .logreg-vs-linear-row { opacity: 1; }
    .logreg-vs-linear-r0 { animation-delay: 0.00s; }
    .logreg-vs-linear-r1 { animation-delay: 0.45s; }
    .logreg-vs-linear-r2 { animation-delay: 0.90s; }
    .logreg-vs-linear-r3 { animation-delay: 1.35s; }
    .logreg-vs-linear-r4 { animation-delay: 1.80s; }
    .logreg-vs-linear-row { animation: logreg-vs-linear-reveal 7.3s ease-in-out infinite; }
    @keyframes logreg-vs-linear-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="logreg-vs-linear-bg" width="980" height="390"/>
  <text class="logreg-vs-linear-h1"  x="30" y="40">Logistic against linear regression</text>
  <text class="logreg-vs-linear-sub" x="30" y="64">What each predicts.</text>
  <rect class="logreg-vs-linear-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="logreg-vs-linear-name" x="46" y="122">Linear regression</text>
  <text class="logreg-vs-linear-desc" x="46" y="142">A number.</text>
  <text class="logreg-vs-linear-desc logreg-vs-linear-row logreg-vs-linear-r0" x="46" y="182">Predicts an unbounded quantity</text>
  <text class="logreg-vs-linear-desc logreg-vs-linear-row logreg-vs-linear-r1" x="46" y="216">Squared error loss</text>
  <text class="logreg-vs-linear-desc logreg-vs-linear-row logreg-vs-linear-r2" x="46" y="250">Closed-form solution exists</text>
  <text class="logreg-vs-linear-desc logreg-vs-linear-row logreg-vs-linear-r3" x="46" y="284">Output can be negative or above one</text>
  <text class="logreg-vs-linear-desc logreg-vs-linear-row logreg-vs-linear-r4" x="46" y="318">For prices, counts, measurements</text>
  <rect class="logreg-vs-linear-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="logreg-vs-linear-name" x="526" y="122">Logistic regression</text>
  <text class="logreg-vs-linear-desc" x="526" y="142">A probability.</text>
  <text class="logreg-vs-linear-desc logreg-vs-linear-row logreg-vs-linear-r0" x="526" y="182">Predicts a bounded probability</text>
  <text class="logreg-vs-linear-desc logreg-vs-linear-row logreg-vs-linear-r1" x="526" y="216">Cross-entropy loss</text>
  <text class="logreg-vs-linear-desc logreg-vs-linear-row logreg-vs-linear-r2" x="526" y="250">Solved iteratively</text>
  <text class="logreg-vs-linear-desc logreg-vs-linear-row logreg-vs-linear-r3" x="526" y="284">Output always between zero and one</text>
  <text class="logreg-vs-linear-desc logreg-vs-linear-row logreg-vs-linear-r4" x="526" y="318">For yes-or-no questions</text>
  <text class="logreg-vs-linear-sub" x="30" y="372">Despite the shared name, only the linear part is shared: the loss, the output and the solution method all differ.</text>
</svg>
