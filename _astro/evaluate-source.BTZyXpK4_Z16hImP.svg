<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four questions.">
  <title>Evaluating a dataset</title>
  <style>
    .evaluate-source-bg   { fill: #f8fafc; }
    .evaluate-source-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .evaluate-source-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .evaluate-source-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .evaluate-source-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .evaluate-source-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .evaluate-source-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .evaluate-source-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .evaluate-source-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .evaluate-source-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .evaluate-source-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .evaluate-source-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .evaluate-source-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .evaluate-source-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .evaluate-source-stage { opacity: 1; }

    .evaluate-source-s0 { animation-delay: 0.00s; }
    .evaluate-source-e0 { animation-delay: 0.00s; }
    .evaluate-source-s1 { animation-delay: 1.28s; }
    .evaluate-source-e1 { animation-delay: 1.28s; }
    .evaluate-source-s2 { animation-delay: 2.56s; }
    .evaluate-source-e2 { animation-delay: 2.56s; }
    .evaluate-source-s3 { animation-delay: 3.84s; }
    .evaluate-source-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .evaluate-source-conn  { animation: evaluate-source-trace 6.4s ease-in-out infinite; }
      .evaluate-source-stage { animation: evaluate-source-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes evaluate-source-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes evaluate-source-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .evaluate-source-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .evaluate-source-stage { animation: evaluate-source-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes evaluate-source-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="evaluate-source-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="evaluate-source-bg" width="980" height="322"/>
  <text class="evaluate-source-h1"  x="30" y="40">Evaluating a dataset</text>
  <text class="evaluate-source-sub" x="30" y="64">Four questions.</text>
  <g class="evaluate-source-stage evaluate-source-s0">
    <rect class="evaluate-source-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="evaluate-source-step" x="44" y="142">01</text>
    <text class="evaluate-source-name" x="70" y="142">Who collected it, how, and for what purpose?</text>
    <text class="evaluate-source-desc" x="44" y="166">Which shapes every bias in it.</text>
  </g>
  <line class="evaluate-source-line evaluate-source-conn evaluate-source-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#evaluate-source-tip)"/>
  <g class="evaluate-source-stage evaluate-source-s1">
    <rect class="evaluate-source-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="evaluate-source-step" x="280" y="142">02</text>
    <text class="evaluate-source-name" x="306" y="142">What licence governs its use?</text>
    <text class="evaluate-source-desc" x="280" y="166">Including commercial and</text>
    <text class="evaluate-source-desc" x="280" y="182">redistribution terms.</text>
  </g>
  <line class="evaluate-source-line evaluate-source-conn evaluate-source-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#evaluate-source-tip)"/>
  <g class="evaluate-source-stage evaluate-source-s2">
    <rect class="evaluate-source-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="evaluate-source-step" x="516" y="142">03</text>
    <text class="evaluate-source-name" x="542" y="142">Who or what is covered, and who is missing?</text>
    <text class="evaluate-source-desc" x="516" y="166">Which limits every conclusion.</text>
  </g>
  <line class="evaluate-source-line evaluate-source-conn evaluate-source-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#evaluate-source-tip)"/>
  <g class="evaluate-source-stage evaluate-source-s3">
    <rect class="evaluate-source-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="evaluate-source-step" x="752" y="142">04</text>
    <text class="evaluate-source-name" x="778" y="142">And when was it collected and last updated?</text>
    <text class="evaluate-source-desc" x="752" y="166">Stale data answers a past</text>
    <text class="evaluate-source-desc" x="752" y="182">question.</text>
  </g>
  <text class="evaluate-source-sub" x="30" y="304">The collection purpose shaping the bias is the question most often skipped, and it explains most of the surprises that emerge later in analysis.</text>
</svg>
