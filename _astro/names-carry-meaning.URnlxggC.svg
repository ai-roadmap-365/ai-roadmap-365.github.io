<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Unlike a comment, the name is used.">
  <title>Names are the documentation that cannot go stale</title>
  <style>
    .names-carry-meaning-bg   { fill: #f8fafc; }
    .names-carry-meaning-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .names-carry-meaning-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .names-carry-meaning-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .names-carry-meaning-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .names-carry-meaning-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .names-carry-meaning-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .names-carry-meaning-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .names-carry-meaning-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .names-carry-meaning-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .names-carry-meaning-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .names-carry-meaning-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .names-carry-meaning-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .names-carry-meaning-row { opacity: 1; }
    .names-carry-meaning-r0 { animation-delay: 0.00s; }
    .names-carry-meaning-r1 { animation-delay: 0.45s; }
    .names-carry-meaning-r2 { animation-delay: 0.90s; }
    .names-carry-meaning-r3 { animation-delay: 1.35s; }
    .names-carry-meaning-r4 { animation-delay: 1.80s; }
    .names-carry-meaning-row { animation: names-carry-meaning-reveal 7.3s ease-in-out infinite; }
    @keyframes names-carry-meaning-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="names-carry-meaning-bg" width="980" height="390"/>
  <text class="names-carry-meaning-h1"  x="30" y="40">Names are the documentation that cannot go stale</text>
  <text class="names-carry-meaning-sub" x="30" y="64">Unlike a comment, the name is used.</text>
  <rect class="names-carry-meaning-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="names-carry-meaning-name" x="46" y="122">Clear for an hour</text>
  <text class="names-carry-meaning-desc" x="46" y="142">df, df2, df_final, x, tmp</text>
  <text class="names-carry-meaning-desc names-carry-meaning-row names-carry-meaning-r0" x="46" y="182">Obvious while you are writing it</text>
  <text class="names-carry-meaning-desc names-carry-meaning-row names-carry-meaning-r1" x="46" y="216">Meaningless the following week</text>
  <text class="names-carry-meaning-desc names-carry-meaning-row names-carry-meaning-r2" x="46" y="250">df2 — what happened between 1 and 2?</text>
  <text class="names-carry-meaning-desc names-carry-meaning-row names-carry-meaning-r3" x="46" y="284">df_final — until df_final_v2 appears</text>
  <text class="names-carry-meaning-desc names-carry-meaning-row names-carry-meaning-r4" x="46" y="318">A reader must reconstruct the intent</text>
  <rect class="names-carry-meaning-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="names-carry-meaning-name" x="526" y="122">Clear in a year</text>
  <text class="names-carry-meaning-desc" x="526" y="142">raw_orders, valid_orders, totals_by_customer</text>
  <text class="names-carry-meaning-desc names-carry-meaning-row names-carry-meaning-r0" x="526" y="182">The transformation is in the name</text>
  <text class="names-carry-meaning-desc names-carry-meaning-row names-carry-meaning-r1" x="526" y="216">No need to read the body to know what it holds</text>
  <text class="names-carry-meaning-desc names-carry-meaning-row names-carry-meaning-r2" x="526" y="250">A wrong name becomes visibly wrong</text>
  <text class="names-carry-meaning-desc names-carry-meaning-row names-carry-meaning-r3" x="526" y="284">Renaming is safe — the language server does it</text>
  <text class="names-carry-meaning-desc names-carry-meaning-row names-carry-meaning-r4" x="526" y="318">Costs a few characters, once</text>
  <text class="names-carry-meaning-sub" x="30" y="372">A comment can drift out of date because nothing forces it to change. A name is used everywhere it applies, so a rename either happens completely or fails loudly, which makes it the more durable form of documentation.</text>
</svg>
