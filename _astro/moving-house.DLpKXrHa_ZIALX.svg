<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The scaffolding, the furniture and the loft.">
  <title>Moving house</title>
  <style>
    .moving-house-bg   { fill: #f8fafc; }
    .moving-house-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .moving-house-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .moving-house-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .moving-house-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .moving-house-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .moving-house-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .moving-house-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .moving-house-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .moving-house-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .moving-house-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .moving-house-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .moving-house-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .moving-house-row { opacity: 1; }
    .moving-house-r0 { animation-delay: 0.00s; }
    .moving-house-r1 { animation-delay: 0.45s; }
    .moving-house-r2 { animation-delay: 0.90s; }
    .moving-house-r3 { animation-delay: 1.35s; }
    .moving-house-r4 { animation-delay: 1.80s; }
    .moving-house-row { animation: moving-house-reveal 7.3s ease-in-out infinite; }
    @keyframes moving-house-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="moving-house-bg" width="980" height="390"/>
  <text class="moving-house-h1"  x="30" y="40">Moving house</text>
  <text class="moving-house-sub" x="30" y="64">The scaffolding, the furniture and the loft.</text>
  <rect class="moving-house-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="moving-house-name" x="46" y="122">What everyone gets right</text>
  <text class="moving-house-desc" x="46" y="142">The scaffolding stays.</text>
  <text class="moving-house-desc moving-house-row moving-house-r0" x="46" y="182">Scaffolding got the piano through the window</text>
  <text class="moving-house-desc moving-house-row moving-house-r1" x="46" y="216">It does not go on the van</text>
  <text class="moving-house-desc moving-house-row moving-house-r2" x="46" y="250">That is the multi-stage build</text>
  <text class="moving-house-desc moving-house-row moving-house-r3" x="46" y="284">Furniture goes on the van — it is needed</text>
  <text class="moving-house-desc moving-house-row moving-house-r4" x="46" y="318">Everyone understands this immediately</text>
  <rect class="moving-house-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="moving-house-name" x="526" y="122">What everyone misses</text>
  <text class="moving-house-desc" x="526" y="142">The loft goes on the van.</text>
  <text class="moving-house-desc moving-house-row moving-house-r0" x="526" y="182">Heavy, and going to the same address</text>
  <text class="moving-house-desc moving-house-row moving-house-r1" x="526" y="216">Not necessarily on this van</text>
  <text class="moving-house-desc moving-house-row moving-house-r2" x="526" y="250">Ship it separately if you move again next month</text>
  <text class="moving-house-desc moving-house-row moving-house-r3" x="526" y="284">Otherwise every move carries the loft</text>
  <text class="moving-house-desc moving-house-row moving-house-r4" x="526" y="318">It outweighs the furniture four to one</text>
  <text class="moving-house-sub" x="30" y="372">The mistake the analogy exposes is the common one exactly: people become very disciplined about the scaffolding, feel efficient, and load the loft without noticing what it weighs.</text>
</svg>
