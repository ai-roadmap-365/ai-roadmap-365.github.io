<svg role="img" aria-label="Multi-layered Defense in Depth architecture diagram for LLM prompt security and guardrails" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Multi-Layered Defense-in-Depth Guardrail Architecture</title>
  <defs>
    <linearGradient id="bg251b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card251b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg251b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">DEFENSE-IN-DEPTH PROMPT SECURITY PIPELINE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">4-Tier Protective Filter: Ingress Sanitization, XML Sandboxing, Dual-LLM Guard, Egress Scanners</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card251b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Tier 1: Ingress Sanitizer -->
    <rect x="25" y="25" width="165" height="245" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="107" y="50" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">Tier 1: Ingress Filter</text>
    <rect x="35" y="75" width="145" height="70" fill="#1e293b" rx="4"/>
    <text x="40" y="95" fill="#cbd5e1" font-size="7">• Regex pattern block</text>
    <text x="40" y="112" fill="#cbd5e1" font-size="7">• Tag escape filter</text>
    <text x="40" y="129" fill="#cbd5e1" font-size="7">• PII redaction</text>
    <text x="107" y="200" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">Deterministic Clean</text>

    <!-- Tier 2: XML Sandboxing -->
    <rect x="210" y="25" width="165" height="245" fill="#0f172a" stroke="#fbbf24" rx="6"/>
    <text x="292" y="50" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">Tier 2: Tag Sandbox</text>
    <rect x="220" y="75" width="145" height="70" fill="#1e293b" rx="4"/>
    <text x="225" y="95" fill="#cbd5e1" font-size="7">• XML encapsulation</text>
    <text x="225" y="112" fill="#cbd5e1" font-size="7">• Role boundary rules</text>
    <text x="225" y="129" fill="#cbd5e1" font-size="7">• Untrusted markers</text>
    <text x="292" y="200" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">Attention Isolation</text>

    <!-- Tier 3: Dual-LLM Guard -->
    <rect x="395" y="25" width="165" height="245" fill="#0f172a" stroke="#a855f7" rx="6"/>
    <text x="477" y="50" fill="#c084fc" font-size="10" font-weight="700" text-anchor="middle">Tier 3: Guard Model</text>
    <rect x="405" y="75" width="145" height="70" fill="#1e293b" rx="4"/>
    <text x="410" y="95" fill="#cbd5e1" font-size="7">• Llama Guard / NeMo</text>
    <text x="410" y="112" fill="#cbd5e1" font-size="7">• Intent classification</text>
    <text x="410" y="129" fill="#cbd5e1" font-size="7">• Refusal trigger</text>
    <text x="477" y="200" fill="#c084fc" font-size="8" font-weight="700" text-anchor="middle">Semantic Inspector</text>

    <!-- Tier 4: Egress Leakage Scanner -->
    <rect x="580" y="25" width="165" height="245" fill="#0f172a" stroke="#34d399" stroke-width="1.5" rx="6"/>
    <text x="662" y="50" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">Tier 4: Egress Scanner</text>
    <rect x="590" y="75" width="145" height="70" fill="#1e293b" rx="4"/>
    <text x="595" y="95" fill="#cbd5e1" font-size="7">• Secret key detection</text>
    <text x="595" y="112" fill="#cbd5e1" font-size="7">• Markdown image block</text>
    <text x="595" y="129" fill="#cbd5e1" font-size="7">• Schema enforcement</text>
    <text x="662" y="200" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Exfiltration Block</text>
  </g>
</svg>
