<svg role="img" aria-label="Evolution roadmap of encoder transformer models from BERT to RoBERTa ALBERT and DeBERTa-v3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Encoder Models Evolution: BERT to DeBERTa-v3</title>
  <defs>
    <linearGradient id="bg228b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card228b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg228b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">ENCODER TRANSFORMER EVOLUTION ROADMAP</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">How Architectural Innovations Refined Contextual Understanding</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card228b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- 1. BERT (2018) -->
    <rect x="25" y="25" width="165" height="245" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="107" y="48" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">1. BERT (2018)</text>
    <rect x="35" y="65" width="145" height="190" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="107" y="88" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">The Foundation</text>
    <text x="107" y="112" fill="#cbd5e1" font-size="8" text-anchor="middle">• Static 15% Masking</text>
    <text x="107" y="132" fill="#cbd5e1" font-size="8" text-anchor="middle">• Next Sentence Pred (NSP)</text>
    <text x="107" y="152" fill="#cbd5e1" font-size="8" text-anchor="middle">• Learned Abs Pos Embeds</text>
    <text x="107" y="172" fill="#cbd5e1" font-size="8" text-anchor="middle">• Batch Size = 256</text>
    <text x="107" y="192" fill="#cbd5e1" font-size="8" text-anchor="middle">• 16 GB Text Corpus</text>
    <text x="107" y="235" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">110M / 340M Params</text>

    <!-- 2. RoBERTa (2019) -->
    <rect x="205" y="25" width="165" height="245" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="287" y="48" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">2. RoBERTa (2019)</text>
    <rect x="215" y="65" width="145" height="190" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="287" y="88" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">Robustly Optimized</text>
    <text x="287" y="112" fill="#cbd5e1" font-size="8" text-anchor="middle">• Dynamic Masking</text>
    <text x="287" y="132" fill="#cbd5e1" font-size="8" text-anchor="middle">• REMOVED NSP Task</text>
    <text x="287" y="152" fill="#cbd5e1" font-size="8" text-anchor="middle">• Batch Size = 8,192</text>
    <text x="287" y="172" fill="#cbd5e1" font-size="8" text-anchor="middle">• 160 GB Text Corpus</text>
    <text x="287" y="192" fill="#cbd5e1" font-size="8" text-anchor="middle">• Byte-level BPE (50k)</text>
    <text x="287" y="235" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">+5.4 GLUE Score</text>

    <!-- 3. ALBERT (2019) -->
    <rect x="385" y="25" width="165" height="245" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" rx="6"/>
    <text x="467" y="48" fill="#c084fc" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">3. ALBERT (2019)</text>
    <rect x="395" y="65" width="145" height="190" fill="#1e293b" stroke="#a855f7" rx="4"/>
    <text x="467" y="88" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">Parameter Efficient</text>
    <text x="467" y="112" fill="#cbd5e1" font-size="8" text-anchor="middle">• Cross-Layer Weight Share</text>
    <text x="467" y="132" fill="#cbd5e1" font-size="8" text-anchor="middle">• Factorized Embeds (128D)</text>
    <text x="467" y="152" fill="#cbd5e1" font-size="8" text-anchor="middle">• Sentence Order Pred (SOP)</text>
    <text x="467" y="172" fill="#cbd5e1" font-size="8" text-anchor="middle">• 18x Fewer Parameters</text>
    <text x="467" y="192" fill="#cbd5e1" font-size="8" text-anchor="middle">• Memory Footprint Drop</text>
    <text x="467" y="235" fill="#c084fc" font-size="8" font-weight="700" text-anchor="middle">12M Params (Base)</text>

    <!-- 4. DeBERTa-v3 (2021) -->
    <rect x="565" y="25" width="170" height="245" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="650" y="48" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">4. DeBERTa-v3 (2021)</text>
    <rect x="575" y="65" width="150" height="190" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="650" y="88" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">State of the Art</text>
    <text x="650" y="112" fill="#cbd5e1" font-size="8" text-anchor="middle">• Disentangled Attention</text>
    <text x="650" y="132" fill="#cbd5e1" font-size="8" text-anchor="middle">  (Content-to-Pos +</text>
    <text x="650" y="148" fill="#cbd5e1" font-size="8" text-anchor="middle">   Pos-to-Content)</text>
    <text x="650" y="168" fill="#cbd5e1" font-size="8" text-anchor="middle">• Enhanced Mask Decoder</text>
    <text x="650" y="188" fill="#cbd5e1" font-size="8" text-anchor="middle">• ELECTRA-Style RTD Loss</text>
    <text x="650" y="235" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">SOTA Encoder</text>
  </g>
</svg>
