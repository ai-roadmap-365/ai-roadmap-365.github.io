<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Attributing a prediction</title>
  <style>
    .shap-bg   { fill: #f8fafc; }
    .shap-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shap-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shap-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shap-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shap-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shap-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .shap-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .shap-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .shap-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .shap-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .shap-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .shap-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .shap-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .shap-stage { opacity: 1; }

    .shap-s0 { animation-delay: 0.00s; }
    .shap-e0 { animation-delay: 0.00s; }
    .shap-s1 { animation-delay: 1.28s; }
    .shap-e1 { animation-delay: 1.28s; }
    .shap-s2 { animation-delay: 2.56s; }
    .shap-e2 { animation-delay: 2.56s; }
    .shap-s3 { animation-delay: 3.84s; }
    .shap-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .shap-conn  { animation: shap-trace 6.4s ease-in-out infinite; }
      .shap-stage { animation: shap-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes shap-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes shap-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .shap-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .shap-stage { animation: shap-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes shap-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="shap-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="shap-bg" width="980" height="322"/>
  <text class="shap-h1"  x="30" y="40">Attributing a prediction</text>
  <text class="shap-sub" x="30" y="64">Four steps.</text>
  <g class="shap-stage shap-s0">
    <rect class="shap-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="shap-step" x="44" y="142">01</text>
    <text class="shap-name" x="70" y="142">Start from the average prediction</text>
    <text class="shap-desc" x="44" y="166">What the model says knowing</text>
    <text class="shap-desc" x="44" y="182">nothing.</text>
  </g>
  <line class="shap-line shap-conn shap-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#shap-tip)"/>
  <g class="shap-stage shap-s1">
    <rect class="shap-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="shap-step" x="280" y="142">02</text>
    <text class="shap-name" x="306" y="142">Ask what each feature contributes</text>
    <text class="shap-desc" x="280" y="166">Averaged over every order</text>
    <text class="shap-desc" x="280" y="182">features could be added.</text>
  </g>
  <line class="shap-line shap-conn shap-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#shap-tip)"/>
  <g class="shap-stage shap-s2">
    <rect class="shap-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="shap-step" x="516" y="142">03</text>
    <text class="shap-name" x="542" y="142">Which allocates credit fairly</text>
    <text class="shap-desc" x="516" y="166">By a result from cooperative</text>
    <text class="shap-desc" x="516" y="182">game theory.</text>
  </g>
  <line class="shap-line shap-conn shap-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#shap-tip)"/>
  <g class="shap-stage shap-s3">
    <rect class="shap-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="shap-step" x="752" y="142">04</text>
    <text class="shap-name" x="778" y="142">And the contributions sum exactly to the prediction</text>
    <text class="shap-desc" x="752" y="166">Which is what makes it an</text>
    <text class="shap-desc" x="752" y="182">explanation.</text>
    <text class="shap-edge" x="752" y="242">additive</text>
  </g>
  <text class="shap-sub" x="30" y="304">The exact summation is what distinguishes this from feature importance: it explains one prediction completely rather than describing the model in general.</text>
</svg>
