<svg role="img" aria-label="Structured breakdown of the 6 core components of a production-grade LLM prompt" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>Anatomy of a Production-Grade Prompt</title>
  <defs>
    <linearGradient id="bg246a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card246" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg246a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">ANATOMY OF A PRODUCTION-GRADE PROMPT</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">The 6 Modular Components of Deterministic, High-Accuracy LLM Steering</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card246)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Component 1: Role -->
    <rect x="25" y="25" width="220" height="120" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="135" y="48" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">1. Role &amp; Persona</text>
    <text x="35" y="70" fill="#cbd5e1" font-size="8">• Domain identity &amp; expertise</text>
    <text x="35" y="88" fill="#cbd5e1" font-size="8">• Communication tone &amp; level</text>
    <text x="35" y="106" fill="#34d399" font-size="8">e.g., "Senior Security Auditor"</text>

    <!-- Component 2: Context Background -->
    <rect x="270" y="25" width="220" height="120" fill="#0f172a" stroke="#fbbf24" rx="6"/>
    <text x="380" y="48" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">2. Context &amp; Objective</text>
    <text x="280" y="70" fill="#cbd5e1" font-size="8">• Problem space framing</text>
    <text x="280" y="88" fill="#cbd5e1" font-size="8">• Target audience &amp; goal</text>
    <text x="280" y="106" fill="#34d399" font-size="8">e.g., "Auditing FastAPI routes"</text>

    <!-- Component 3: Input Sandboxing -->
    <rect x="515" y="25" width="220" height="120" fill="#0f172a" stroke="#a855f7" rx="6"/>
    <text x="625" y="48" fill="#c084fc" font-size="10" font-weight="700" text-anchor="middle">3. Input Data (Delimited)</text>
    <text x="525" y="70" fill="#cbd5e1" font-size="8">• Sandboxed with XML tags</text>
    <text x="525" y="88" fill="#cbd5e1" font-size="8">• Isolates untrusted payload</text>
    <text x="525" y="106" fill="#34d399" font-size="8">e.g., &lt;code_snippet&gt;...&lt;/code&gt;</text>

    <!-- Component 4: Step-by-Step Instructions -->
    <rect x="25" y="160" width="220" height="120" fill="#0f172a" stroke="#10b981" rx="6"/>
    <text x="135" y="183" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">4. Step-by-Step Directives</text>
    <text x="35" y="205" fill="#cbd5e1" font-size="8">• Ordered numbered execution</text>
    <text x="35" y="223" fill="#cbd5e1" font-size="8">• Chain-of-thought elicitation</text>
    <text x="35" y="241" fill="#38bdf8" font-size="8">e.g., "1. Inspect auth tokens"</text>

    <!-- Component 5: Explicit Constraints -->
    <rect x="270" y="160" width="220" height="120" fill="#0f172a" stroke="#fb7185" rx="6"/>
    <text x="380" y="183" fill="#fb7185" font-size="10" font-weight="700" text-anchor="middle">5. Negative &amp; Positive Rules</text>
    <text x="280" y="205" fill="#cbd5e1" font-size="8">• Positive action over bans</text>
    <text x="280" y="223" fill="#cbd5e1" font-size="8">• Strict boundary guardrails</text>
    <text x="280" y="241" fill="#38bdf8" font-size="8">e.g., "Max 3 bullet points"</text>

    <!-- Component 6: Output Format Specification -->
    <rect x="515" y="160" width="220" height="120" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="625" y="183" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">6. Exact Output Schema</text>
    <text x="525" y="205" fill="#cbd5e1" font-size="8">• JSON schema / markdown AST</text>
    <text x="525" y="223" fill="#cbd5e1" font-size="8">• Zero conversational preamble</text>
    <text x="525" y="241" fill="#34d399" font-size="8">e.g., "Return valid JSON object"</text>
  </g>
</svg>
