<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Debugging, cost control and improvement.">
  <title>Three things traces enable</title>
  <style>
    .observability-uses-bg   { fill: #f8fafc; }
    .observability-uses-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .observability-uses-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .observability-uses-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .observability-uses-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .observability-uses-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .observability-uses-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .observability-uses-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .observability-uses-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .observability-uses-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .observability-uses-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .observability-uses-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .observability-uses-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .observability-uses-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .observability-uses-stage { opacity: 1; }

    .observability-uses-s0 { animation-delay: 0.00s; }
    .observability-uses-e0 { animation-delay: 0.00s; }
    .observability-uses-s1 { animation-delay: 1.50s; }
    .observability-uses-e1 { animation-delay: 1.50s; }
    .observability-uses-s2 { animation-delay: 3.00s; }
    .observability-uses-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .observability-uses-conn  { animation: observability-uses-trace 6s ease-in-out infinite; }
      .observability-uses-stage { animation: observability-uses-arrive 6s ease-in-out infinite; }
    }
    @keyframes observability-uses-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes observability-uses-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .observability-uses-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .observability-uses-stage { animation: observability-uses-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes observability-uses-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="observability-uses-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="observability-uses-bg" width="980" height="322"/>
  <text class="observability-uses-h1"  x="30" y="40">Three things traces enable</text>
  <text class="observability-uses-sub" x="30" y="64">Debugging, cost control and improvement.</text>
  <g class="observability-uses-stage observability-uses-s0">
    <rect class="observability-uses-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="observability-uses-step" x="44" y="142">01</text>
    <text class="observability-uses-name" x="70" y="142">Root-cause debugging</text>
    <text class="observability-uses-desc" x="44" y="166">Empty retrieval, truncated context or a</text>
    <text class="observability-uses-desc" x="44" y="182">reasoning error — the tree says which.</text>
  </g>
  <line class="observability-uses-line observability-uses-conn observability-uses-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#observability-uses-tip)"/>
  <g class="observability-uses-stage observability-uses-s1">
    <rect class="observability-uses-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="observability-uses-step" x="359" y="142">02</text>
    <text class="observability-uses-name" x="385" y="142">Cost control</text>
    <text class="observability-uses-desc" x="359" y="166">Token usage per user and per organisation.</text>
    <text class="observability-uses-desc" x="359" y="182">Loops and inflation visible immediately.</text>
  </g>
  <line class="observability-uses-line observability-uses-conn observability-uses-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#observability-uses-tip)"/>
  <g class="observability-uses-stage observability-uses-s2">
    <rect class="observability-uses-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="observability-uses-step" x="674" y="142">03</text>
    <text class="observability-uses-name" x="700" y="142">The feedback flywheel</text>
    <text class="observability-uses-desc" x="674" y="166">A thumbs-down carries a trace ID; the trace</text>
    <text class="observability-uses-desc" x="674" y="182">becomes a test case.</text>
  </g>
  <text class="observability-uses-sub" x="30" y="304">The third is the one that compounds: without a trace ID attached to the rating, negative feedback is an aggregate number, and with it every complaint is a reproducible case.</text>
</svg>
