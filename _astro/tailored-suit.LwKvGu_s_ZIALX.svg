<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Both from cloth.">
  <title>A tailored fit or a pattern</title>
  <style>
    .tailored-suit-bg   { fill: #f8fafc; }
    .tailored-suit-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tailored-suit-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tailored-suit-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tailored-suit-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tailored-suit-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tailored-suit-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tailored-suit-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tailored-suit-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tailored-suit-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tailored-suit-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tailored-suit-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tailored-suit-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tailored-suit-row { opacity: 1; }
    .tailored-suit-r0 { animation-delay: 0.00s; }
    .tailored-suit-r1 { animation-delay: 0.45s; }
    .tailored-suit-r2 { animation-delay: 0.90s; }
    .tailored-suit-r3 { animation-delay: 1.35s; }
    .tailored-suit-r4 { animation-delay: 1.80s; }
    .tailored-suit-row { animation: tailored-suit-reveal 7.3s ease-in-out infinite; }
    @keyframes tailored-suit-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tailored-suit-bg" width="980" height="390"/>
  <text class="tailored-suit-h1"  x="30" y="40">A tailored fit or a pattern</text>
  <text class="tailored-suit-sub" x="30" y="64">Both from cloth.</text>
  <rect class="tailored-suit-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tailored-suit-name" x="46" y="122">From a pattern</text>
  <text class="tailored-suit-desc" x="46" y="142">Fast, conventional.</text>
  <text class="tailored-suit-desc tailored-suit-row tailored-suit-r0" x="46" y="182">Proven proportions</text>
  <text class="tailored-suit-desc tailored-suit-row tailored-suit-r1" x="46" y="216">Quick to produce</text>
  <text class="tailored-suit-desc tailored-suit-row tailored-suit-r2" x="46" y="250">Adjustable within limits</text>
  <text class="tailored-suit-desc tailored-suit-row tailored-suit-r3" x="46" y="284">Covers most needs</text>
  <text class="tailored-suit-desc tailored-suit-row tailored-suit-r4" x="46" y="318">This is a statistical plotting layer</text>
  <rect class="tailored-suit-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tailored-suit-name" x="526" y="122">From scratch</text>
  <text class="tailored-suit-desc" x="526" y="142">Slow, unlimited.</text>
  <text class="tailored-suit-desc tailored-suit-row tailored-suit-r0" x="526" y="182">Every measurement your own</text>
  <text class="tailored-suit-desc tailored-suit-row tailored-suit-r1" x="526" y="216">Slow to produce</text>
  <text class="tailored-suit-desc tailored-suit-row tailored-suit-r2" x="526" y="250">Anything is possible</text>
  <text class="tailored-suit-desc tailored-suit-row tailored-suit-r3" x="526" y="284">Needed for the unusual case</text>
  <text class="tailored-suit-desc tailored-suit-row tailored-suit-r4" x="526" y="318">This is the low-level library</text>
  <text class="tailored-suit-sub" x="30" y="372">Both remain useful, which is exactly why these libraries expose the underlying objects rather than hiding them entirely.</text>
</svg>
