<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And then ensembles.">
  <title>Four steps in decision trees</title>
  <style>
    .tree-history-bg   { fill: #f8fafc; }
    .tree-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tree-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tree-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tree-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tree-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tree-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tree-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tree-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tree-history-stage { opacity: 1; }

    .tree-history-s0 { animation-delay: 0.00s; }
    .tree-history-e0 { animation-delay: 0.00s; }
    .tree-history-s1 { animation-delay: 1.28s; }
    .tree-history-e1 { animation-delay: 1.28s; }
    .tree-history-s2 { animation-delay: 2.56s; }
    .tree-history-e2 { animation-delay: 2.56s; }
    .tree-history-s3 { animation-delay: 3.84s; }
    .tree-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tree-history-conn  { animation: tree-history-trace 6.4s ease-in-out infinite; }
      .tree-history-stage { animation: tree-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tree-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tree-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tree-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tree-history-stage { animation: tree-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tree-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tree-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tree-history-bg" width="980" height="322"/>
  <text class="tree-history-h1"  x="30" y="40">Four steps in decision trees</text>
  <text class="tree-history-sub" x="30" y="64">And then ensembles.</text>
  <g class="tree-history-stage tree-history-s0">
    <rect class="tree-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tree-history-step" x="44" y="142">01</text>
    <text class="tree-history-name" x="70" y="142">Rule induction from data</text>
    <text class="tree-history-desc" x="44" y="166">Automating what an expert would</text>
    <text class="tree-history-desc" x="44" y="182">write by hand.</text>
  </g>
  <line class="tree-history-line tree-history-conn tree-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tree-history-tip)"/>
  <g class="tree-history-stage tree-history-s1">
    <rect class="tree-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tree-history-step" x="280" y="142">02</text>
    <text class="tree-history-name" x="306" y="142">The standard algorithms formalised the split criteria</text>
    <text class="tree-history-desc" x="280" y="166">And gave the recursive procedure</text>
    <text class="tree-history-desc" x="280" y="182">its shape.</text>
  </g>
  <line class="tree-history-line tree-history-conn tree-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tree-history-tip)"/>
  <g class="tree-history-stage tree-history-s2">
    <rect class="tree-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tree-history-step" x="516" y="142">03</text>
    <text class="tree-history-name" x="542" y="142">Overfitting was recognised as intrinsic</text>
    <text class="tree-history-desc" x="516" y="166">Not a tuning failure. Which</text>
    <text class="tree-history-desc" x="516" y="182">motivated pruning.</text>
  </g>
  <line class="tree-history-line tree-history-conn tree-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tree-history-tip)"/>
  <g class="tree-history-stage tree-history-s3">
    <rect class="tree-history-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tree-history-step" x="752" y="142">04</text>
    <text class="tree-history-name" x="778" y="142">Then ensembles of trees</text>
    <text class="tree-history-desc" x="752" y="166">Which fixed the variance and</text>
    <text class="tree-history-desc" x="752" y="182">kept the strengths.</text>
  </g>
  <text class="tree-history-sub" x="30" y="304">The single tree's weakness turned out to be its most useful property: high variance is exactly what averaging many of them cancels out.</text>
</svg>
