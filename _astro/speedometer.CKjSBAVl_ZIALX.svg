<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Instantaneous, not average.">
  <title>A speedometer</title>
  <style>
    .speedometer-bg   { fill: #f8fafc; }
    .speedometer-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speedometer-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speedometer-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speedometer-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speedometer-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speedometer-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .speedometer-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .speedometer-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .speedometer-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .speedometer-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .speedometer-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .speedometer-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .speedometer-row { opacity: 1; }
    .speedometer-r0 { animation-delay: 0.00s; }
    .speedometer-r1 { animation-delay: 0.45s; }
    .speedometer-r2 { animation-delay: 0.90s; }
    .speedometer-r3 { animation-delay: 1.35s; }
    .speedometer-r4 { animation-delay: 1.80s; }
    .speedometer-row { animation: speedometer-reveal 7.3s ease-in-out infinite; }
    @keyframes speedometer-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="speedometer-bg" width="980" height="390"/>
  <text class="speedometer-h1"  x="30" y="40">A speedometer</text>
  <text class="speedometer-sub" x="30" y="64">Instantaneous, not average.</text>
  <rect class="speedometer-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="speedometer-name" x="46" y="122">Average speed</text>
  <text class="speedometer-desc" x="46" y="142">Over a journey.</text>
  <text class="speedometer-desc speedometer-row speedometer-r0" x="46" y="182">Distance divided by time</text>
  <text class="speedometer-desc speedometer-row speedometer-r1" x="46" y="216">Says nothing about any moment</text>
  <text class="speedometer-desc speedometer-row speedometer-r2" x="46" y="250">Hides stops and bursts</text>
  <text class="speedometer-desc speedometer-row speedometer-r3" x="46" y="284">Computed after the fact</text>
  <text class="speedometer-desc speedometer-row speedometer-r4" x="46" y="318">This is the average rate of change</text>
  <rect class="speedometer-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="speedometer-name" x="526" y="122">The speedometer</text>
  <text class="speedometer-desc" x="526" y="142">Right now.</text>
  <text class="speedometer-desc speedometer-row speedometer-r0" x="526" y="182">Speed at this instant</text>
  <text class="speedometer-desc speedometer-row speedometer-r1" x="526" y="216">Changes continuously</text>
  <text class="speedometer-desc speedometer-row speedometer-r2" x="526" y="250">Shows stops and bursts</text>
  <text class="speedometer-desc speedometer-row speedometer-r3" x="526" y="284">Read at any moment</text>
  <text class="speedometer-desc speedometer-row speedometer-r4" x="526" y="318">This is the derivative</text>
  <text class="speedometer-sub" x="30" y="372">The speedometer reading is genuinely a derivative: it is the limit of distance over time as the interval shrinks, computed continuously by the instrument.</text>
</svg>
