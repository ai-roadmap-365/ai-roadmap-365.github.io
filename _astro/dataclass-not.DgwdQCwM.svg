<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things dataclasses are not</title>
  <style>
    .dataclass-not-bg   { fill: #f8fafc; }
    .dataclass-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataclass-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataclass-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataclass-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataclass-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataclass-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dataclass-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dataclass-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dataclass-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dataclass-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dataclass-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dataclass-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dataclass-not-row { opacity: 1; }
    .dataclass-not-r0 { animation-delay: 0.00s; }
    .dataclass-not-r1 { animation-delay: 0.45s; }
    .dataclass-not-r2 { animation-delay: 0.90s; }
    .dataclass-not-r3 { animation-delay: 1.35s; }
    .dataclass-not-r4 { animation-delay: 1.80s; }
    .dataclass-not-row { animation: dataclass-not-reveal 7.3s ease-in-out infinite; }
    @keyframes dataclass-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="dataclass-not-bg" width="980" height="390"/>
  <text class="dataclass-not-h1"  x="30" y="40">Four things dataclasses are not</text>
  <text class="dataclass-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="dataclass-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="dataclass-not-name" x="46" y="122">The misconception</text>
  <text class="dataclass-not-desc" x="46" y="142">Commonly held.</text>
  <text class="dataclass-not-desc dataclass-not-row dataclass-not-r0" x="46" y="182">Type hints are enforced at runtime</text>
  <text class="dataclass-not-desc dataclass-not-row dataclass-not-r1" x="46" y="216">A dataclass is immutable</text>
  <text class="dataclass-not-desc dataclass-not-row dataclass-not-r2" x="46" y="250">Hints slow the program down</text>
  <text class="dataclass-not-desc dataclass-not-row dataclass-not-r3" x="46" y="284">A dataclass replaces every class</text>
  <text class="dataclass-not-desc dataclass-not-row dataclass-not-r4" x="46" y="318">Annotating everything is best practice</text>
  <rect class="dataclass-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="dataclass-not-name" x="526" y="122">What is true</text>
  <text class="dataclass-not-desc" x="526" y="142">Actually.</text>
  <text class="dataclass-not-desc dataclass-not-row dataclass-not-r0" x="526" y="182">They are ignored unless a checker runs</text>
  <text class="dataclass-not-desc dataclass-not-row dataclass-not-r1" x="526" y="216">Only if you ask for frozen</text>
  <text class="dataclass-not-desc dataclass-not-row dataclass-not-r2" x="526" y="250">They are stored and otherwise inert</text>
  <text class="dataclass-not-desc dataclass-not-row dataclass-not-r3" x="526" y="284">It suits records, not behaviour-rich objects</text>
  <text class="dataclass-not-desc dataclass-not-row dataclass-not-r4" x="526" y="318">Boundaries pay; internals often do not</text>
  <text class="dataclass-not-sub" x="30" y="372">Hints not being enforced at runtime is the one that surprises people from other languages, and it is why a checker in continuous integration is what makes them real.</text>
</svg>
