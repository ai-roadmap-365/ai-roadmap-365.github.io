<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Everything has a cost.">
  <title>Packing for a journey</title>
  <style>
    .packing-bg   { fill: #f8fafc; }
    .packing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .packing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .packing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .packing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .packing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .packing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .packing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .packing-row { opacity: 1; }
    .packing-r0 { animation-delay: 0.00s; }
    .packing-r1 { animation-delay: 0.45s; }
    .packing-r2 { animation-delay: 0.90s; }
    .packing-r3 { animation-delay: 1.35s; }
    .packing-r4 { animation-delay: 1.80s; }
    .packing-row { animation: packing-reveal 7.3s ease-in-out infinite; }
    @keyframes packing-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="packing-bg" width="980" height="390"/>
  <text class="packing-h1"  x="30" y="40">Packing for a journey</text>
  <text class="packing-sub" x="30" y="64">Everything has a cost.</text>
  <rect class="packing-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="packing-name" x="46" y="122">Take everything</text>
  <text class="packing-desc" x="46" y="142">In case.</text>
  <text class="packing-desc packing-row packing-r0" x="46" y="182">Nothing is left behind</text>
  <text class="packing-desc packing-row packing-r1" x="46" y="216">Most of it is never used</text>
  <text class="packing-desc packing-row packing-r2" x="46" y="250">Everything must be carried</text>
  <text class="packing-desc packing-row packing-r3" x="46" y="284">Finding what you need takes longer</text>
  <text class="packing-desc packing-row packing-r4" x="46" y="318">This is using every feature</text>
  <rect class="packing-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="packing-name" x="526" y="122">Take what is needed</text>
  <text class="packing-desc" x="526" y="142">Deliberately.</text>
  <text class="packing-desc packing-row packing-r0" x="526" y="182">Chosen against the actual trip</text>
  <text class="packing-desc packing-row packing-r1" x="526" y="216">Almost everything gets used</text>
  <text class="packing-desc packing-row packing-r2" x="526" y="250">Light enough to move</text>
  <text class="packing-desc packing-row packing-r3" x="526" y="284">What you need is to hand</text>
  <text class="packing-desc packing-row packing-r4" x="526" y="318">This is selected features</text>
  <text class="packing-sub" x="30" y="372">The carrying cost is the point: an unused feature is not free, it must be sourced, validated and monitored on every prediction forever.</text>
</svg>
