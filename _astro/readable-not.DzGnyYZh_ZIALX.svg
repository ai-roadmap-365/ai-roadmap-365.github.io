<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things readability is not</title>
  <style>
    .readable-not-bg   { fill: #f8fafc; }
    .readable-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readable-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readable-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readable-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readable-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readable-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .readable-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .readable-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .readable-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .readable-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .readable-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .readable-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .readable-not-row { opacity: 1; }
    .readable-not-r0 { animation-delay: 0.00s; }
    .readable-not-r1 { animation-delay: 0.45s; }
    .readable-not-r2 { animation-delay: 0.90s; }
    .readable-not-r3 { animation-delay: 1.35s; }
    .readable-not-r4 { animation-delay: 1.80s; }
    .readable-not-row { animation: readable-not-reveal 7.3s ease-in-out infinite; }
    @keyframes readable-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="readable-not-bg" width="980" height="390"/>
  <text class="readable-not-h1"  x="30" y="40">Four things readability is not</text>
  <text class="readable-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="readable-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="readable-not-name" x="46" y="122">The misconception</text>
  <text class="readable-not-desc" x="46" y="142">Commonly held.</text>
  <text class="readable-not-desc readable-not-row readable-not-r0" x="46" y="182">Readable means heavily commented</text>
  <text class="readable-not-desc readable-not-row readable-not-r1" x="46" y="216">Shorter is clearer</text>
  <text class="readable-not-desc readable-not-row readable-not-r2" x="46" y="250">Style is a matter of taste</text>
  <text class="readable-not-desc readable-not-row readable-not-r3" x="46" y="284">Clever code is good code</text>
  <text class="readable-not-desc readable-not-row readable-not-r4" x="46" y="318">Formatting is cosmetic</text>
  <rect class="readable-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="readable-not-name" x="526" y="122">What is true</text>
  <text class="readable-not-desc" x="526" y="142">Actually.</text>
  <text class="readable-not-desc readable-not-row readable-not-r0" x="526" y="182">Good names beat comments; comments explain why</text>
  <text class="readable-not-desc readable-not-row readable-not-r1" x="526" y="216">Clarity beats brevity, consistently</text>
  <text class="readable-not-desc readable-not-row readable-not-r2" x="526" y="250">Consistency beats any individual preference</text>
  <text class="readable-not-desc readable-not-row readable-not-r3" x="526" y="284">Code you cannot verify is a liability</text>
  <text class="readable-not-desc readable-not-row readable-not-r4" x="526" y="318">Consistent formatting makes diffs readable</text>
  <text class="readable-not-sub" x="30" y="372">The diff argument is the practical one for automated formatting: inconsistent formatting fills reviews with noise that hides the substantive change.</text>
</svg>
