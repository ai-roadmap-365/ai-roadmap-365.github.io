<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Group contamination</title>
  <style>
    .group-leak-bg   { fill: #f8fafc; }
    .group-leak-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-leak-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-leak-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-leak-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-leak-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-leak-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .group-leak-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .group-leak-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .group-leak-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .group-leak-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .group-leak-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .group-leak-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .group-leak-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .group-leak-stage { opacity: 1; }

    .group-leak-s0 { animation-delay: 0.00s; }
    .group-leak-e0 { animation-delay: 0.00s; }
    .group-leak-s1 { animation-delay: 1.28s; }
    .group-leak-e1 { animation-delay: 1.28s; }
    .group-leak-s2 { animation-delay: 2.56s; }
    .group-leak-e2 { animation-delay: 2.56s; }
    .group-leak-s3 { animation-delay: 3.84s; }
    .group-leak-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .group-leak-conn  { animation: group-leak-trace 6.4s ease-in-out infinite; }
      .group-leak-stage { animation: group-leak-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes group-leak-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes group-leak-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .group-leak-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .group-leak-stage { animation: group-leak-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes group-leak-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="group-leak-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="group-leak-bg" width="980" height="322"/>
  <text class="group-leak-h1"  x="30" y="40">Group contamination</text>
  <text class="group-leak-sub" x="30" y="64">Four steps.</text>
  <g class="group-leak-stage group-leak-s0">
    <rect class="group-leak-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="group-leak-step" x="44" y="142">01</text>
    <text class="group-leak-name" x="70" y="142">One entity contributes many rows</text>
    <text class="group-leak-desc" x="44" y="166">Repeat customers, multiple scans</text>
    <text class="group-leak-desc" x="44" y="182">of one patient.</text>
  </g>
  <line class="group-leak-line group-leak-conn group-leak-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#group-leak-tip)"/>
  <g class="group-leak-stage group-leak-s1">
    <rect class="group-leak-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="group-leak-step" x="280" y="142">02</text>
    <text class="group-leak-name" x="306" y="142">A random split separates its rows</text>
    <text class="group-leak-desc" x="280" y="166">Some in training, some in</text>
    <text class="group-leak-desc" x="280" y="182">validation.</text>
  </g>
  <line class="group-leak-line group-leak-conn group-leak-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#group-leak-tip)"/>
  <g class="group-leak-stage group-leak-s2">
    <rect class="group-leak-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="group-leak-step" x="516" y="142">03</text>
    <text class="group-leak-name" x="542" y="142">So the model recognises the entity, not the pattern</text>
    <text class="group-leak-desc" x="516" y="166">Which is memorisation dressed as</text>
    <text class="group-leak-desc" x="516" y="182">generalisation.</text>
  </g>
  <line class="group-leak-line group-leak-conn group-leak-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#group-leak-tip)"/>
  <g class="group-leak-stage group-leak-s3">
    <rect class="group-leak-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="group-leak-step" x="752" y="142">04</text>
    <text class="group-leak-name" x="778" y="142">Keep every entity wholly on one side</text>
    <text class="group-leak-desc" x="752" y="166">Which measures generalisation to</text>
    <text class="group-leak-desc" x="752" y="182">new entities.</text>
  </g>
  <text class="group-leak-sub" x="30" y="304">This one is common in medical and customer data and is easy to miss, because the duplication is not visible without knowing how the rows relate.</text>
</svg>
