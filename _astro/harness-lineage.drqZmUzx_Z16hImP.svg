<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Notebooks, runners, then platforms.">
  <title>Three phases of eval tooling</title>
  <style>
    .harness-lineage-bg   { fill: #f8fafc; }
    .harness-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .harness-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .harness-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .harness-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .harness-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .harness-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .harness-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .harness-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .harness-lineage-stage { opacity: 1; }

    .harness-lineage-s0 { animation-delay: 0.00s; }
    .harness-lineage-e0 { animation-delay: 0.00s; }
    .harness-lineage-s1 { animation-delay: 1.50s; }
    .harness-lineage-e1 { animation-delay: 1.50s; }
    .harness-lineage-s2 { animation-delay: 3.00s; }
    .harness-lineage-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .harness-lineage-conn  { animation: harness-lineage-trace 6s ease-in-out infinite; }
      .harness-lineage-stage { animation: harness-lineage-arrive 6s ease-in-out infinite; }
    }
    @keyframes harness-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes harness-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .harness-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .harness-lineage-stage { animation: harness-lineage-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes harness-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="harness-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="harness-lineage-bg" width="980" height="322"/>
  <text class="harness-lineage-h1"  x="30" y="40">Three phases of eval tooling</text>
  <text class="harness-lineage-sub" x="30" y="64">Notebooks, runners, then platforms.</text>
  <g class="harness-lineage-stage harness-lineage-s0">
    <rect class="harness-lineage-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="harness-lineage-step" x="44" y="142">01</text>
    <text class="harness-lineage-name" x="70" y="142">Ad-hoc notebooks, 2020-2022</text>
    <text class="harness-lineage-desc" x="44" y="166">A loop over prompts, printing completions to</text>
    <text class="harness-lineage-desc" x="44" y="182">a terminal.</text>
  </g>
  <line class="harness-lineage-line harness-lineage-conn harness-lineage-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#harness-lineage-tip)"/>
  <g class="harness-lineage-stage harness-lineage-s1">
    <rect class="harness-lineage-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="harness-lineage-step" x="359" y="142">02</text>
    <text class="harness-lineage-name" x="385" y="142">Benchmark runners, 2023-2024</text>
    <text class="harness-lineage-desc" x="359" y="166">YAML-configured academic benchmarks.</text>
    <text class="harness-lineage-desc" x="359" y="182">Standardised, and detached from products.</text>
  </g>
  <line class="harness-lineage-line harness-lineage-conn harness-lineage-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#harness-lineage-tip)"/>
  <g class="harness-lineage-stage harness-lineage-s2">
    <rect class="harness-lineage-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="harness-lineage-step" x="674" y="142">03</text>
    <text class="harness-lineage-name" x="700" y="142">CI-integrated platforms, 2024</text>
    <text class="harness-lineage-desc" x="674" y="166">Blocking pull requests on domain regressions.</text>
  </g>
  <text class="harness-lineage-sub" x="30" y="304">The middle phase solved standardisation and not relevance: MMLU is reproducible and says nothing about whether your assistant still parses refund order numbers.</text>
</svg>
