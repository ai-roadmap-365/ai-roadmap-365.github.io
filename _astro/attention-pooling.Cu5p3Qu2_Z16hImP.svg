<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Beyond taking the last one.">
  <title>Pooling over hidden states</title>
  <style>
    .attention-pooling-bg   { fill: #f8fafc; }
    .attention-pooling-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-pooling-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-pooling-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-pooling-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-pooling-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-pooling-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .attention-pooling-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .attention-pooling-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .attention-pooling-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .attention-pooling-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .attention-pooling-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .attention-pooling-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .attention-pooling-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .attention-pooling-stage { opacity: 1; }

    .attention-pooling-s0 { animation-delay: 0.00s; }
    .attention-pooling-e0 { animation-delay: 0.00s; }
    .attention-pooling-s1 { animation-delay: 1.50s; }
    .attention-pooling-e1 { animation-delay: 1.50s; }
    .attention-pooling-s2 { animation-delay: 3.00s; }
    .attention-pooling-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .attention-pooling-conn  { animation: attention-pooling-trace 6s ease-in-out infinite; }
      .attention-pooling-stage { animation: attention-pooling-arrive 6s ease-in-out infinite; }
    }
    @keyframes attention-pooling-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes attention-pooling-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .attention-pooling-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .attention-pooling-stage { animation: attention-pooling-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes attention-pooling-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="attention-pooling-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="attention-pooling-bg" width="980" height="322"/>
  <text class="attention-pooling-h1"  x="30" y="40">Pooling over hidden states</text>
  <text class="attention-pooling-sub" x="30" y="64">Beyond taking the last one.</text>
  <g class="attention-pooling-stage attention-pooling-s0">
    <rect class="attention-pooling-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="attention-pooling-step" x="44" y="142">01</text>
    <text class="attention-pooling-name" x="70" y="142">The final hidden state</text>
    <text class="attention-pooling-desc" x="44" y="166">Simple, and biased toward the end of the</text>
    <text class="attention-pooling-desc" x="44" y="182">sequence.</text>
  </g>
  <line class="attention-pooling-line attention-pooling-conn attention-pooling-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#attention-pooling-tip)"/>
  <g class="attention-pooling-stage attention-pooling-s1">
    <rect class="attention-pooling-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="attention-pooling-step" x="359" y="142">02</text>
    <text class="attention-pooling-name" x="385" y="142">Mean or max pooling</text>
    <text class="attention-pooling-desc" x="359" y="166">Every position contributes equally, or the</text>
    <text class="attention-pooling-desc" x="359" y="182">strongest wins.</text>
  </g>
  <line class="attention-pooling-line attention-pooling-conn attention-pooling-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#attention-pooling-tip)"/>
  <g class="attention-pooling-stage attention-pooling-s2">
    <rect class="attention-pooling-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="attention-pooling-step" x="674" y="142">03</text>
    <text class="attention-pooling-name" x="700" y="142">Attention pooling</text>
    <text class="attention-pooling-desc" x="674" y="166">A learned weight per position. The model</text>
    <text class="attention-pooling-desc" x="674" y="182">decides what mattered.</text>
  </g>
  <text class="attention-pooling-sub" x="30" y="304">Attention pooling is a useful intermediate step historically: it introduces the weighted-lookup idea into a recurrent model, which is exactly the mechanism that displaces recurrence entirely.</text>
</svg>
