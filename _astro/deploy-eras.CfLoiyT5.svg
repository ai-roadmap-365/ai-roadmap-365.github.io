<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each step made rollback cheaper.">
  <title>From quarterly event to continuous gate</title>
  <style>
    .deploy-eras-bg   { fill: #f8fafc; }
    .deploy-eras-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deploy-eras-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deploy-eras-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deploy-eras-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deploy-eras-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deploy-eras-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .deploy-eras-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .deploy-eras-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .deploy-eras-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .deploy-eras-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .deploy-eras-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .deploy-eras-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .deploy-eras-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .deploy-eras-stage { opacity: 1; }

    .deploy-eras-s0 { animation-delay: 0.00s; }
    .deploy-eras-e0 { animation-delay: 0.00s; }
    .deploy-eras-s1 { animation-delay: 1.33s; }
    .deploy-eras-e1 { animation-delay: 1.33s; }
    .deploy-eras-s2 { animation-delay: 2.67s; }
    .deploy-eras-e2 { animation-delay: 2.67s; }
    .deploy-eras-s3 { animation-delay: 4.00s; }
    .deploy-eras-e3 { animation-delay: 4.00s; }
    .deploy-eras-s4 { animation-delay: 5.33s; }
    .deploy-eras-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .deploy-eras-conn  { animation: deploy-eras-trace 8s ease-in-out infinite; }
      .deploy-eras-stage { animation: deploy-eras-arrive 8s ease-in-out infinite; }
    }
    @keyframes deploy-eras-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes deploy-eras-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .deploy-eras-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .deploy-eras-stage { animation: deploy-eras-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes deploy-eras-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="deploy-eras-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="deploy-eras-bg" width="980" height="322"/>
  <text class="deploy-eras-h1"  x="30" y="40">From quarterly event to continuous gate</text>
  <text class="deploy-eras-sub" x="30" y="64">Each step made rollback cheaper.</text>
  <g class="deploy-eras-stage deploy-eras-s0">
    <rect class="deploy-eras-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="deploy-eras-step" x="44" y="142">01</text>
    <text class="deploy-eras-name" x="70" y="142">An event, 1990s</text>
    <text class="deploy-eras-desc" x="44" y="166">Quarterly, manual, at</text>
    <text class="deploy-eras-desc" x="44" y="182">night, with a runbook.</text>
    <text class="deploy-eras-desc" x="44" y="198">Rare, so risky.</text>
    <text class="deploy-eras-edge" x="44" y="242">quarterly</text>
  </g>
  <line class="deploy-eras-line deploy-eras-conn deploy-eras-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#deploy-eras-tip)"/>
  <g class="deploy-eras-stage deploy-eras-s1">
    <rect class="deploy-eras-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="deploy-eras-step" x="233" y="142">02</text>
    <text class="deploy-eras-name" x="259" y="142">Continuous delivery, 2010</text>
    <text class="deploy-eras-desc" x="233" y="166">Small changes often. The</text>
    <text class="deploy-eras-desc" x="233" y="182">diff you bisect stays</text>
    <text class="deploy-eras-desc" x="233" y="198">small.</text>
  </g>
  <line class="deploy-eras-line deploy-eras-conn deploy-eras-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#deploy-eras-tip)"/>
  <g class="deploy-eras-stage deploy-eras-s2">
    <rect class="deploy-eras-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="deploy-eras-step" x="422" y="142">03</text>
    <text class="deploy-eras-name" x="448" y="142">Blue-green and canary, 2010s</text>
    <text class="deploy-eras-desc" x="422" y="166">Rollback becomes a</text>
    <text class="deploy-eras-desc" x="422" y="182">pointer change rather</text>
    <text class="deploy-eras-desc" x="422" y="198">than a restore.</text>
    <text class="deploy-eras-edge" x="422" y="242">seconds</text>
  </g>
  <line class="deploy-eras-line deploy-eras-conn deploy-eras-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#deploy-eras-tip)"/>
  <g class="deploy-eras-stage deploy-eras-s3">
    <rect class="deploy-eras-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="deploy-eras-step" x="611" y="142">04</text>
    <text class="deploy-eras-name" x="637" y="142">Error budgets, 2016</text>
    <text class="deploy-eras-desc" x="611" y="166">"Is this healthy?"</text>
    <text class="deploy-eras-desc" x="611" y="182">becomes arithmetic</text>
    <text class="deploy-eras-desc" x="611" y="198">instead of a 2 a.m.</text>
  </g>
  <line class="deploy-eras-line deploy-eras-conn deploy-eras-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#deploy-eras-tip)"/>
  <g class="deploy-eras-stage deploy-eras-s4">
    <rect class="deploy-eras-warn" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="deploy-eras-step" x="800" y="142">05</text>
    <text class="deploy-eras-name" x="826" y="142">AI in production, 2023</text>
    <text class="deploy-eras-desc" x="800" y="166">Slow starts, partial</text>
    <text class="deploy-eras-desc" x="800" y="182">failures, per-request</text>
    <text class="deploy-eras-desc" x="800" y="198">cost, providers you do</text>
    <text class="deploy-eras-edge" x="800" y="242">new failure modes</text>
  </g>
  <text class="deploy-eras-sub" x="30" y="304">The third step is the one this lesson turns on: everything else in the release path assumes that going back is cheap, and that assumption has to be built rather than hoped for.</text>
</svg>
