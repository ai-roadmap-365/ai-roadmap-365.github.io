<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Distance is magnitude</title>
  <style>
    .distance-99-bg   { fill: #f8fafc; }
    .distance-99-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distance-99-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distance-99-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distance-99-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distance-99-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distance-99-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .distance-99-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .distance-99-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .distance-99-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .distance-99-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .distance-99-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .distance-99-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .distance-99-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .distance-99-stage { opacity: 1; }

    .distance-99-s0 { animation-delay: 0.00s; }
    .distance-99-e0 { animation-delay: 0.00s; }
    .distance-99-s1 { animation-delay: 1.28s; }
    .distance-99-e1 { animation-delay: 1.28s; }
    .distance-99-s2 { animation-delay: 2.56s; }
    .distance-99-e2 { animation-delay: 2.56s; }
    .distance-99-s3 { animation-delay: 3.84s; }
    .distance-99-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .distance-99-conn  { animation: distance-99-trace 6.4s ease-in-out infinite; }
      .distance-99-stage { animation: distance-99-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes distance-99-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes distance-99-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .distance-99-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .distance-99-stage { animation: distance-99-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes distance-99-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="distance-99-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="distance-99-bg" width="980" height="322"/>
  <text class="distance-99-h1"  x="30" y="40">Distance is magnitude</text>
  <text class="distance-99-sub" x="30" y="64">Four steps.</text>
  <g class="distance-99-stage distance-99-s0">
    <rect class="distance-99-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="distance-99-step" x="44" y="142">01</text>
    <text class="distance-99-name" x="70" y="142">Two points in the space</text>
    <text class="distance-99-desc" x="44" y="166">Each a vector from the origin.</text>
  </g>
  <line class="distance-99-line distance-99-conn distance-99-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#distance-99-tip)"/>
  <g class="distance-99-stage distance-99-s1">
    <rect class="distance-99-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="distance-99-step" x="280" y="142">02</text>
    <text class="distance-99-name" x="306" y="142">Their difference is the arrow between them</text>
    <text class="distance-99-desc" x="280" y="166">Which is subtraction.</text>
  </g>
  <line class="distance-99-line distance-99-conn distance-99-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#distance-99-tip)"/>
  <g class="distance-99-stage distance-99-s2">
    <rect class="distance-99-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="distance-99-step" x="516" y="142">03</text>
    <text class="distance-99-name" x="542" y="142">Its magnitude is how far apart they are</text>
    <text class="distance-99-desc" x="516" y="166">Which is the formula you already</text>
    <text class="distance-99-desc" x="516" y="182">have.</text>
  </g>
  <line class="distance-99-line distance-99-conn distance-99-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#distance-99-tip)"/>
  <g class="distance-99-stage distance-99-s3">
    <rect class="distance-99-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="distance-99-step" x="752" y="142">04</text>
    <text class="distance-99-name" x="778" y="142">So distance is not a new idea</text>
    <text class="distance-99-desc" x="752" y="166">It is magnitude, applied to a</text>
    <text class="distance-99-desc" x="752" y="182">difference.</text>
    <text class="distance-99-edge" x="752" y="242">nothing new</text>
  </g>
  <text class="distance-99-sub" x="30" y="304">Recognising distance as magnitude of a difference removes the need for a second formula and makes the relationship between the two permanent.</text>
</svg>
