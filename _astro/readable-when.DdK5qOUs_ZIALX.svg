<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Scaled to the code's life.">
  <title>How much polish</title>
  <style>
    .readable-when-bg   { fill: #f8fafc; }
    .readable-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readable-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readable-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readable-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readable-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readable-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .readable-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .readable-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .readable-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .readable-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .readable-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .readable-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .readable-when-row { opacity: 1; }
    .readable-when-r0 { animation-delay: 0.00s; }
    .readable-when-r1 { animation-delay: 0.45s; }
    .readable-when-r2 { animation-delay: 0.90s; }
    .readable-when-r3 { animation-delay: 1.35s; }
    .readable-when-r4 { animation-delay: 1.80s; }
    .readable-when-row { animation: readable-when-reveal 7.3s ease-in-out infinite; }
    @keyframes readable-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="readable-when-bg" width="980" height="390"/>
  <text class="readable-when-h1"  x="30" y="40">How much polish</text>
  <text class="readable-when-sub" x="30" y="64">Scaled to the code's life.</text>
  <rect class="readable-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="readable-when-name" x="46" y="122">Full care</text>
  <text class="readable-when-desc" x="46" y="142">Four cases.</text>
  <text class="readable-when-desc readable-when-row readable-when-r0" x="46" y="182">Anything other people will read</text>
  <text class="readable-when-desc readable-when-row readable-when-r1" x="46" y="216">Anything running in production</text>
  <text class="readable-when-desc readable-when-row readable-when-r2" x="46" y="250">Anything that will be maintained</text>
  <text class="readable-when-desc readable-when-row readable-when-r3" x="46" y="284">Library and shared code</text>
  <text class="readable-when-desc readable-when-row readable-when-r4" x="46" y="318">Where a defect would be costly</text>
  <rect class="readable-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="readable-when-name" x="526" y="122">Lighter</text>
  <text class="readable-when-desc" x="526" y="142">Also four.</text>
  <text class="readable-when-desc readable-when-row readable-when-r0" x="526" y="182">A genuinely throwaway exploration</text>
  <text class="readable-when-desc readable-when-row readable-when-r1" x="526" y="216">A one-off analysis in a notebook</text>
  <text class="readable-when-desc readable-when-row readable-when-r2" x="526" y="250">Code deleted the same day</text>
  <text class="readable-when-desc readable-when-row readable-when-r3" x="526" y="284">But run the formatter regardless</text>
  <text class="readable-when-desc readable-when-row readable-when-r4" x="526" y="318">Since it costs nothing</text>
  <text class="readable-when-sub" x="30" y="372">Running the formatter is free even on throwaway code, which is why it belongs in the second column rather than being skipped with everything else.</text>
</svg>
