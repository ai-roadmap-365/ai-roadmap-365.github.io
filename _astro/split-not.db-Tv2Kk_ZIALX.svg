<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things the split is not</title>
  <style>
    .split-not-bg   { fill: #f8fafc; }
    .split-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .split-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .split-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .split-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .split-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .split-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .split-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .split-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .split-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .split-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .split-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .split-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .split-not-row { opacity: 1; }
    .split-not-r0 { animation-delay: 0.00s; }
    .split-not-r1 { animation-delay: 0.45s; }
    .split-not-r2 { animation-delay: 0.90s; }
    .split-not-r3 { animation-delay: 1.35s; }
    .split-not-r4 { animation-delay: 1.80s; }
    .split-not-row { animation: split-not-reveal 7.3s ease-in-out infinite; }
    @keyframes split-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="split-not-bg" width="980" height="390"/>
  <text class="split-not-h1"  x="30" y="40">Four things the split is not</text>
  <text class="split-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="split-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="split-not-name" x="46" y="122">The misconception</text>
  <text class="split-not-desc" x="46" y="142">Commonly held.</text>
  <text class="split-not-desc split-not-row split-not-r0" x="46" y="182">Random splitting is the default and safe</text>
  <text class="split-not-desc split-not-row split-not-r1" x="46" y="216">Two sets are enough</text>
  <text class="split-not-desc split-not-row split-not-r2" x="46" y="250">A bigger test set is always better</text>
  <text class="split-not-desc split-not-row split-not-r3" x="46" y="284">The test set can be checked more than once</text>
  <text class="split-not-desc split-not-row split-not-r4" x="46" y="318">Any split ratio will do</text>
  <rect class="split-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="split-not-name" x="526" y="122">What is true</text>
  <text class="split-not-desc" x="526" y="142">Actually.</text>
  <text class="split-not-desc split-not-row split-not-r0" x="526" y="182">It is wrong for grouped and time-ordered data</text>
  <text class="split-not-desc split-not-row split-not-r1" x="526" y="216">Selection needs its own set</text>
  <text class="split-not-desc split-not-row split-not-r2" x="526" y="250">It trades against training data</text>
  <text class="split-not-desc split-not-row split-not-r3" x="526" y="284">Each look spends a little of it</text>
  <text class="split-not-desc split-not-row split-not-r4" x="526" y="318">Size it from the difference you must detect</text>
  <text class="split-not-sub" x="30" y="372">The third row is a real trade rather than a free choice: rows in the test set are rows the model did not learn from.</text>
</svg>
