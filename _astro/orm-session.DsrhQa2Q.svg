<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The unit of work</title>
  <style>
    .orm-session-bg   { fill: #f8fafc; }
    .orm-session-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orm-session-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orm-session-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orm-session-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orm-session-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orm-session-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .orm-session-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .orm-session-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .orm-session-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .orm-session-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .orm-session-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .orm-session-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .orm-session-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .orm-session-stage { opacity: 1; }

    .orm-session-s0 { animation-delay: 0.00s; }
    .orm-session-e0 { animation-delay: 0.00s; }
    .orm-session-s1 { animation-delay: 1.28s; }
    .orm-session-e1 { animation-delay: 1.28s; }
    .orm-session-s2 { animation-delay: 2.56s; }
    .orm-session-e2 { animation-delay: 2.56s; }
    .orm-session-s3 { animation-delay: 3.84s; }
    .orm-session-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .orm-session-conn  { animation: orm-session-trace 6.4s ease-in-out infinite; }
      .orm-session-stage { animation: orm-session-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes orm-session-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes orm-session-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .orm-session-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .orm-session-stage { animation: orm-session-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes orm-session-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="orm-session-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="orm-session-bg" width="980" height="322"/>
  <text class="orm-session-h1"  x="30" y="40">The unit of work</text>
  <text class="orm-session-sub" x="30" y="64">Four steps.</text>
  <g class="orm-session-stage orm-session-s0">
    <rect class="orm-session-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="orm-session-step" x="44" y="142">01</text>
    <text class="orm-session-name" x="70" y="142">A session collects the objects you touch</text>
    <text class="orm-session-desc" x="44" y="166">And watches them for changes.</text>
  </g>
  <line class="orm-session-line orm-session-conn orm-session-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#orm-session-tip)"/>
  <g class="orm-session-stage orm-session-s1">
    <rect class="orm-session-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="orm-session-step" x="280" y="142">02</text>
    <text class="orm-session-name" x="306" y="142">You modify objects as ordinary Python</text>
    <text class="orm-session-desc" x="280" y="166">With no statements written.</text>
  </g>
  <line class="orm-session-line orm-session-conn orm-session-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#orm-session-tip)"/>
  <g class="orm-session-stage orm-session-s2">
    <rect class="orm-session-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="orm-session-step" x="516" y="142">03</text>
    <text class="orm-session-name" x="542" y="142">A flush turns those changes into statements</text>
    <text class="orm-session-desc" x="516" y="166">Ordered to respect foreign keys.</text>
  </g>
  <line class="orm-session-line orm-session-conn orm-session-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#orm-session-tip)"/>
  <g class="orm-session-stage orm-session-s3">
    <rect class="orm-session-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="orm-session-step" x="752" y="142">04</text>
    <text class="orm-session-name" x="778" y="142">And a commit makes them permanent</text>
    <text class="orm-session-desc" x="752" y="166">Or a rollback discards them.</text>
  </g>
  <text class="orm-session-sub" x="30" y="304">Statements being ordered to respect foreign keys is real work the mapper does for you, and doing it by hand across a dozen related objects is genuinely tedious.</text>
</svg>
