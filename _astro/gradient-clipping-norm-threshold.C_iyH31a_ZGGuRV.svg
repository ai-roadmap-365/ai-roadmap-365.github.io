<svg role="img" aria-label="Gradient clipping by norm showing unconstrained exploding gradient vector scaled back within maximum threshold circle" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Gradient Norm Clipping Geometry and Threshold Scaling</title>
  <defs>
    <linearGradient id="bg209b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card209b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg209b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">GRADIENT NORM CLIPPING GEOMETRY</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Rescaling Exploding Gradients without Distorting Descent Direction</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card209b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Left: Geometric Circle -->
    <circle cx="210" cy="145" r="95" fill="#0f172a" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="210" cy="145" r="4" fill="#f8fafc"/>
    <text x="210" y="165" fill="#94a3b8" font-size="8" text-anchor="middle">Origin (0, 0)</text>
    <text x="210" y="255" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">Max Norm Threshold: ||g|| &lt;= max_norm</text>

    <!-- Exploding Vector (Red, Long) -->
    <line x1="210" y1="145" x2="355" y2="40" stroke="#f43f5e" stroke-width="3"/>
    <polygon points="355,40 342,48 350,58" fill="#f43f5e"/>
    <text x="355" y="30" fill="#fb7185" font-size="10" font-weight="700">Exploding Gradient g_t (Norm = 8.4)</text>

    <!-- Clipped Vector (Green, on circle) -->
    <line x1="210" y1="145" x2="280" y2="94" stroke="#10b981" stroke-width="4"/>
    <polygon points="280,94 267,102 275,112" fill="#10b981"/>
    <text x="300" y="115" fill="#34d399" font-size="10" font-weight="700">Clipped g_clipped (Norm = 1.0)</text>

    <!-- Right Box: Mathematical Formula -->
    <rect x="420" y="35" width="310" height="225" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="575" y="60" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Mathematical Scaling Rule</text>
    <rect x="435" y="80" width="280" height="45" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="575" y="108" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">g_new = g * (max_norm / max(||g||, max_norm))</text>

    <text x="575" y="150" fill="#cbd5e1" font-size="9" text-anchor="middle">If total norm ||g|| &gt; max_norm:</text>
    <text x="575" y="170" fill="#cbd5e1" font-size="9" text-anchor="middle">Scale ALL parameters by the same scalar factor</text>
    <text x="575" y="195" fill="#fbbf24" font-size="9" text-anchor="middle">Preserves relative gradient direction perfectly!</text>
    <text x="575" y="235" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">torch.nn.utils.clip_grad_norm_(model.parameters(), 1.0)</text>
  </g>
</svg>
