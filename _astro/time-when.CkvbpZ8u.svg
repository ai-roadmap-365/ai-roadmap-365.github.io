<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By what you mean.">
  <title>Which time type to use</title>
  <style>
    .time-when-bg   { fill: #f8fafc; }
    .time-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .time-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .time-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .time-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .time-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .time-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .time-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .time-when-row { opacity: 1; }
    .time-when-r0 { animation-delay: 0.00s; }
    .time-when-r1 { animation-delay: 0.45s; }
    .time-when-r2 { animation-delay: 0.90s; }
    .time-when-r3 { animation-delay: 1.35s; }
    .time-when-r4 { animation-delay: 1.80s; }
    .time-when-row { animation: time-when-reveal 7.3s ease-in-out infinite; }
    @keyframes time-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="time-when-bg" width="980" height="390"/>
  <text class="time-when-h1"  x="30" y="40">Which time type to use</text>
  <text class="time-when-sub" x="30" y="64">By what you mean.</text>
  <rect class="time-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="time-when-name" x="46" y="122">What you are recording</text>
  <text class="time-when-desc" x="46" y="142">The meaning.</text>
  <text class="time-when-desc time-when-row time-when-r0" x="46" y="182">When something happened</text>
  <text class="time-when-desc time-when-row time-when-r1" x="46" y="216">A recurring local event</text>
  <text class="time-when-desc time-when-row time-when-r2" x="46" y="250">A birthday or anniversary</text>
  <text class="time-when-desc time-when-row time-when-r3" x="46" y="284">How long something took</text>
  <text class="time-when-desc time-when-row time-when-r4" x="46" y="318">A future appointment in a place</text>
  <rect class="time-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="time-when-name" x="526" y="122">What to store</text>
  <text class="time-when-desc" x="526" y="142">The type.</text>
  <text class="time-when-desc time-when-row time-when-r0" x="526" y="182">An instant, in a reference zone</text>
  <text class="time-when-desc time-when-row time-when-r1" x="526" y="216">A local time plus a zone name</text>
  <text class="time-when-desc time-when-row time-when-r2" x="526" y="250">A calendar date, with no time</text>
  <text class="time-when-desc time-when-row time-when-r3" x="526" y="284">A duration</text>
  <text class="time-when-desc time-when-row time-when-r4" x="526" y="318">A local time plus a zone name</text>
  <text class="time-when-sub" x="30" y="372">The last row is the one people get wrong: storing a future appointment as a fixed instant makes it move if that region changes its rules before the date arrives.</text>
</svg>
