<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Calibrating a model judge</title>
  <style>
    .judge-calibration-bg   { fill: #f8fafc; }
    .judge-calibration-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-calibration-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-calibration-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-calibration-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-calibration-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-calibration-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .judge-calibration-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .judge-calibration-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .judge-calibration-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .judge-calibration-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .judge-calibration-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .judge-calibration-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .judge-calibration-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .judge-calibration-stage { opacity: 1; }

    .judge-calibration-s0 { animation-delay: 0.00s; }
    .judge-calibration-e0 { animation-delay: 0.00s; }
    .judge-calibration-s1 { animation-delay: 1.28s; }
    .judge-calibration-e1 { animation-delay: 1.28s; }
    .judge-calibration-s2 { animation-delay: 2.56s; }
    .judge-calibration-e2 { animation-delay: 2.56s; }
    .judge-calibration-s3 { animation-delay: 3.84s; }
    .judge-calibration-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .judge-calibration-conn  { animation: judge-calibration-trace 6.4s ease-in-out infinite; }
      .judge-calibration-stage { animation: judge-calibration-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes judge-calibration-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes judge-calibration-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .judge-calibration-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .judge-calibration-stage { animation: judge-calibration-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes judge-calibration-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="judge-calibration-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="judge-calibration-bg" width="980" height="322"/>
  <text class="judge-calibration-h1"  x="30" y="40">Calibrating a model judge</text>
  <text class="judge-calibration-sub" x="30" y="64">Four steps.</text>
  <g class="judge-calibration-stage judge-calibration-s0">
    <rect class="judge-calibration-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="judge-calibration-step" x="44" y="142">01</text>
    <text class="judge-calibration-name" x="70" y="142">Label a sample by hand</text>
    <text class="judge-calibration-desc" x="44" y="166">A hundred cases is usually</text>
    <text class="judge-calibration-desc" x="44" y="182">enough to start.</text>
  </g>
  <line class="judge-calibration-line judge-calibration-conn judge-calibration-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#judge-calibration-tip)"/>
  <g class="judge-calibration-stage judge-calibration-s1">
    <rect class="judge-calibration-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="judge-calibration-step" x="280" y="142">02</text>
    <text class="judge-calibration-name" x="306" y="142">Measure how often the judge agrees</text>
    <text class="judge-calibration-desc" x="280" y="166">Not whether it seems reasonable.</text>
  </g>
  <line class="judge-calibration-line judge-calibration-conn judge-calibration-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#judge-calibration-tip)"/>
  <g class="judge-calibration-stage judge-calibration-s2">
    <rect class="judge-calibration-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="judge-calibration-step" x="516" y="142">03</text>
    <text class="judge-calibration-name" x="542" y="142">Adjust the rubric until agreement is acceptable</text>
    <text class="judge-calibration-desc" x="516" y="166">The rubric, not the model.</text>
  </g>
  <line class="judge-calibration-line judge-calibration-conn judge-calibration-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#judge-calibration-tip)"/>
  <g class="judge-calibration-stage judge-calibration-s3">
    <rect class="judge-calibration-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="judge-calibration-step" x="752" y="142">04</text>
    <text class="judge-calibration-name" x="778" y="142">And re-check periodically</text>
    <text class="judge-calibration-desc" x="752" y="166">Because the judge model will be</text>
    <text class="judge-calibration-desc" x="752" y="182">updated too.</text>
  </g>
  <text class="judge-calibration-sub" x="30" y="304">Measuring agreement rather than inspecting outputs is the discipline: a judge whose reasoning reads well can still disagree with human raters a third of the time.</text>
</svg>
