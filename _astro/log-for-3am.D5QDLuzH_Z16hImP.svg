<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="You will be reading it half asleep.">
  <title>What a log must contain to be useful at 3am</title>
  <style>
    .log-for-3am-bg   { fill: #f8fafc; }
    .log-for-3am-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .log-for-3am-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .log-for-3am-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .log-for-3am-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .log-for-3am-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .log-for-3am-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .log-for-3am-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .log-for-3am-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .log-for-3am-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .log-for-3am-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .log-for-3am-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .log-for-3am-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .log-for-3am-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .log-for-3am-stage { opacity: 1; }

    .log-for-3am-s0 { animation-delay: 0.00s; }
    .log-for-3am-e0 { animation-delay: 0.00s; }
    .log-for-3am-s1 { animation-delay: 1.28s; }
    .log-for-3am-e1 { animation-delay: 1.28s; }
    .log-for-3am-s2 { animation-delay: 2.56s; }
    .log-for-3am-e2 { animation-delay: 2.56s; }
    .log-for-3am-s3 { animation-delay: 3.84s; }
    .log-for-3am-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .log-for-3am-conn  { animation: log-for-3am-trace 6.4s ease-in-out infinite; }
      .log-for-3am-stage { animation: log-for-3am-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes log-for-3am-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes log-for-3am-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .log-for-3am-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .log-for-3am-stage { animation: log-for-3am-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes log-for-3am-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="log-for-3am-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="log-for-3am-bg" width="980" height="322"/>
  <text class="log-for-3am-h1"  x="30" y="40">What a log must contain to be useful at 3am</text>
  <text class="log-for-3am-sub" x="30" y="64">You will be reading it half asleep.</text>
  <g class="log-for-3am-stage log-for-3am-s0">
    <rect class="log-for-3am-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="log-for-3am-step" x="44" y="142">01</text>
    <text class="log-for-3am-name" x="70" y="142">A timestamp</text>
    <text class="log-for-3am-desc" x="44" y="166">Which run this was. Without it,</text>
    <text class="log-for-3am-desc" x="44" y="182">nothing else can be placed in</text>
    <text class="log-for-3am-desc" x="44" y="198">time.</text>
    <text class="log-for-3am-edge" x="44" y="242">when</text>
  </g>
  <line class="log-for-3am-line log-for-3am-conn log-for-3am-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#log-for-3am-tip)"/>
  <g class="log-for-3am-stage log-for-3am-s1">
    <rect class="log-for-3am-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="log-for-3am-step" x="280" y="142">02</text>
    <text class="log-for-3am-name" x="306" y="142">What it was doing</text>
    <text class="log-for-3am-desc" x="280" y="166">The step, named. Not</text>
    <text class="log-for-3am-desc" x="280" y="182">"processing" but "fetching page</text>
    <text class="log-for-3am-desc" x="280" y="198">4 of 12".</text>
    <text class="log-for-3am-edge" x="280" y="242">what</text>
  </g>
  <line class="log-for-3am-line log-for-3am-conn log-for-3am-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#log-for-3am-tip)"/>
  <g class="log-for-3am-stage log-for-3am-s2">
    <rect class="log-for-3am-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="log-for-3am-step" x="516" y="142">03</text>
    <text class="log-for-3am-name" x="542" y="142">The outcome and why</text>
    <text class="log-for-3am-desc" x="516" y="166">Succeeded, or failed with the</text>
    <text class="log-for-3am-desc" x="516" y="182">actual error text — not a</text>
    <text class="log-for-3am-desc" x="516" y="198">generic message.</text>
    <text class="log-for-3am-edge" x="516" y="242">result</text>
  </g>
  <line class="log-for-3am-line log-for-3am-conn log-for-3am-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#log-for-3am-tip)"/>
  <g class="log-for-3am-stage log-for-3am-s3">
    <rect class="log-for-3am-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="log-for-3am-step" x="752" y="142">04</text>
    <text class="log-for-3am-name" x="778" y="142">Numbers</text>
    <text class="log-for-3am-desc" x="752" y="166">Records processed, bytes</text>
    <text class="log-for-3am-desc" x="752" y="182">written, seconds taken. This is</text>
    <text class="log-for-3am-desc" x="752" y="198">how you notice "succeeded, did</text>
    <text class="log-for-3am-edge" x="752" y="242">how much</text>
  </g>
  <text class="log-for-3am-sub" x="30" y="304">That last field catches the worst failure mode: a job that exits zero having silently processed nothing at all looks identical to a healthy one unless it reports a count.</text>
</svg>
