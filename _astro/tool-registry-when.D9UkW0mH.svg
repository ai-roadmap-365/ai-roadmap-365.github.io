<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Mutation is the deciding factor.">
  <title>How much tool machinery</title>
  <style>
    .tool-registry-when-bg   { fill: #f8fafc; }
    .tool-registry-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-registry-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-registry-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-registry-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-registry-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-registry-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tool-registry-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tool-registry-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tool-registry-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tool-registry-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tool-registry-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tool-registry-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tool-registry-when-row { opacity: 1; }
    .tool-registry-when-r0 { animation-delay: 0.00s; }
    .tool-registry-when-r1 { animation-delay: 0.45s; }
    .tool-registry-when-r2 { animation-delay: 0.90s; }
    .tool-registry-when-r3 { animation-delay: 1.35s; }
    .tool-registry-when-r4 { animation-delay: 1.80s; }
    .tool-registry-when-row { animation: tool-registry-when-reveal 7.3s ease-in-out infinite; }
    @keyframes tool-registry-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tool-registry-when-bg" width="980" height="390"/>
  <text class="tool-registry-when-h1"  x="30" y="40">How much tool machinery</text>
  <text class="tool-registry-when-sub" x="30" y="64">Mutation is the deciding factor.</text>
  <rect class="tool-registry-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tool-registry-when-name" x="46" y="122">A full registry</text>
  <text class="tool-registry-when-desc" x="46" y="142">Anything that mutates.</text>
  <text class="tool-registry-when-desc tool-registry-when-row tool-registry-when-r0" x="46" y="182">Side-effecting tools of any kind</text>
  <text class="tool-registry-when-desc tool-registry-when-row tool-registry-when-r1" x="46" y="216">Multi-tenant or customer-facing agents</text>
  <text class="tool-registry-when-desc tool-registry-when-row tool-registry-when-r2" x="46" y="250">More than about five tools</text>
  <text class="tool-registry-when-desc tool-registry-when-row tool-registry-when-r3" x="46" y="284">Payment, email, deletion, deployment</text>
  <text class="tool-registry-when-desc tool-registry-when-row tool-registry-when-r4" x="46" y="318">Where a duplicate call costs something</text>
  <rect class="tool-registry-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tool-registry-when-name" x="526" y="122">A plain callable</text>
  <text class="tool-registry-when-desc" x="526" y="142">Read-only and few.</text>
  <text class="tool-registry-when-desc tool-registry-when-row tool-registry-when-r0" x="526" y="182">Two or three read-only tools</text>
  <text class="tool-registry-when-desc tool-registry-when-row tool-registry-when-r1" x="526" y="216">A local prototype</text>
  <text class="tool-registry-when-desc tool-registry-when-row tool-registry-when-r2" x="526" y="250">No idempotency concern</text>
  <text class="tool-registry-when-desc tool-registry-when-row tool-registry-when-r3" x="526" y="284">But keep the schema precise anyway</text>
  <text class="tool-registry-when-desc tool-registry-when-row tool-registry-when-r4" x="526" y="318">It is the model's only documentation</text>
  <text class="tool-registry-when-sub" x="30" y="372">The caveat on the right is the one worth keeping at every scale: schema quality costs nothing and is the single largest determinant of whether an agent calls the right tool with the right arguments.</text>
</svg>
