<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four parts.">
  <title>Packaging for serving</title>
  <style>
    .stage-serving-bg   { fill: #f8fafc; }
    .stage-serving-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-serving-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-serving-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-serving-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-serving-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-serving-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stage-serving-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stage-serving-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stage-serving-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stage-serving-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stage-serving-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stage-serving-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .stage-serving-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .stage-serving-stage { opacity: 1; }

    .stage-serving-s0 { animation-delay: 0.00s; }
    .stage-serving-e0 { animation-delay: 0.00s; }
    .stage-serving-s1 { animation-delay: 1.28s; }
    .stage-serving-e1 { animation-delay: 1.28s; }
    .stage-serving-s2 { animation-delay: 2.56s; }
    .stage-serving-e2 { animation-delay: 2.56s; }
    .stage-serving-s3 { animation-delay: 3.84s; }
    .stage-serving-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .stage-serving-conn  { animation: stage-serving-trace 6.4s ease-in-out infinite; }
      .stage-serving-stage { animation: stage-serving-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes stage-serving-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes stage-serving-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .stage-serving-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .stage-serving-stage { animation: stage-serving-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes stage-serving-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="stage-serving-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="stage-serving-bg" width="980" height="322"/>
  <text class="stage-serving-h1"  x="30" y="40">Packaging for serving</text>
  <text class="stage-serving-sub" x="30" y="64">Four parts.</text>
  <g class="stage-serving-stage stage-serving-s0">
    <rect class="stage-serving-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="stage-serving-step" x="44" y="142">01</text>
    <text class="stage-serving-name" x="70" y="142">The quantised weights</text>
    <text class="stage-serving-desc" x="44" y="166">A single self-describing file.</text>
  </g>
  <line class="stage-serving-line stage-serving-conn stage-serving-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#stage-serving-tip)"/>
  <g class="stage-serving-stage stage-serving-s1">
    <rect class="stage-serving-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="stage-serving-step" x="280" y="142">02</text>
    <text class="stage-serving-name" x="306" y="142">The chat template</text>
    <text class="stage-serving-desc" x="280" y="166">Which decides whether output is</text>
    <text class="stage-serving-desc" x="280" y="182">good or merely fluent.</text>
  </g>
  <line class="stage-serving-line stage-serving-conn stage-serving-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#stage-serving-tip)"/>
  <g class="stage-serving-stage stage-serving-s2">
    <rect class="stage-serving-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="stage-serving-step" x="516" y="142">03</text>
    <text class="stage-serving-name" x="542" y="142">Default sampling parameters</text>
    <text class="stage-serving-desc" x="516" y="166">Set for the task, not for</text>
    <text class="stage-serving-desc" x="516" y="182">conversation.</text>
  </g>
  <line class="stage-serving-line stage-serving-conn stage-serving-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#stage-serving-tip)"/>
  <g class="stage-serving-stage stage-serving-s3">
    <rect class="stage-serving-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="stage-serving-step" x="752" y="142">04</text>
    <text class="stage-serving-name" x="778" y="142">And the system prompt</text>
    <text class="stage-serving-desc" x="752" y="166">So behaviour ships with the</text>
    <text class="stage-serving-desc" x="752" y="182">artefact.</text>
  </g>
  <text class="stage-serving-sub" x="30" y="304">Packaging all four together is what makes a deployment reproducible: the same file on another machine behaves identically, with nothing to configure.</text>
</svg>
