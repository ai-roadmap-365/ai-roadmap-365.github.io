<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Each measuring something different.">
  <title>Three fairness definitions</title>
  <style>
    .parity-opportunity-bg   { fill: #f8fafc; }
    .parity-opportunity-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parity-opportunity-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parity-opportunity-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parity-opportunity-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parity-opportunity-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parity-opportunity-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .parity-opportunity-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .parity-opportunity-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .parity-opportunity-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .parity-opportunity-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .parity-opportunity-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .parity-opportunity-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .parity-opportunity-row { opacity: 1; }
    .parity-opportunity-r0 { animation-delay: 0.00s; }
    .parity-opportunity-r1 { animation-delay: 0.45s; }
    .parity-opportunity-r2 { animation-delay: 0.90s; }
    .parity-opportunity-r3 { animation-delay: 1.35s; }
    .parity-opportunity-r4 { animation-delay: 1.80s; }
    .parity-opportunity-row { animation: parity-opportunity-reveal 7.3s ease-in-out infinite; }
    @keyframes parity-opportunity-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="parity-opportunity-bg" width="980" height="390"/>
  <text class="parity-opportunity-h1"  x="30" y="40">Three fairness definitions</text>
  <text class="parity-opportunity-sub" x="30" y="64">Each measuring something different.</text>
  <rect class="parity-opportunity-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="parity-opportunity-name" x="46" y="122">The definition</text>
  <text class="parity-opportunity-desc" x="46" y="142">What it requires.</text>
  <text class="parity-opportunity-desc parity-opportunity-row parity-opportunity-r0" x="46" y="182">Demographic parity — equal selection rates</text>
  <text class="parity-opportunity-desc parity-opportunity-row parity-opportunity-r1" x="46" y="216">Equal opportunity — equal recall per group</text>
  <text class="parity-opportunity-desc parity-opportunity-row parity-opportunity-r2" x="46" y="250">Equalised odds — equal recall and false alarm rates</text>
  <text class="parity-opportunity-desc parity-opportunity-row parity-opportunity-r3" x="46" y="284">Predictive parity — equal precision per group</text>
  <text class="parity-opportunity-desc parity-opportunity-row parity-opportunity-r4" x="46" y="318">Calibration — equal meaning of a score per group</text>
  <rect class="parity-opportunity-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="parity-opportunity-name" x="526" y="122">What it ignores</text>
  <text class="parity-opportunity-desc" x="526" y="142">And its cost.</text>
  <text class="parity-opportunity-desc parity-opportunity-row parity-opportunity-r0" x="526" y="182">Ignores whether groups differ in the outcome</text>
  <text class="parity-opportunity-desc parity-opportunity-row parity-opportunity-r1" x="526" y="216">Ignores false alarm disparity</text>
  <text class="parity-opportunity-desc parity-opportunity-row parity-opportunity-r2" x="526" y="250">The strictest; hardest to satisfy</text>
  <text class="parity-opportunity-desc parity-opportunity-row parity-opportunity-r3" x="526" y="284">Can coexist with unequal recall</text>
  <text class="parity-opportunity-desc parity-opportunity-row parity-opportunity-r4" x="526" y="318">Frequently conflicts with equal recall</text>
  <text class="parity-opportunity-sub" x="30" y="372">Demographic parity ignoring genuine base-rate differences is why it is contested: enforcing it can require treating unlike cases alike, which some settings forbid.</text>
</svg>
