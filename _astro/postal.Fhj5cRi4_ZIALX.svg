<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And waiting for a reply.">
  <title>Sending a letter</title>
  <style>
    .postal-bg   { fill: #f8fafc; }
    .postal-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .postal-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .postal-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .postal-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .postal-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .postal-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .postal-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .postal-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .postal-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .postal-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .postal-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .postal-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .postal-row { opacity: 1; }
    .postal-r0 { animation-delay: 0.00s; }
    .postal-r1 { animation-delay: 0.45s; }
    .postal-r2 { animation-delay: 0.90s; }
    .postal-r3 { animation-delay: 1.35s; }
    .postal-r4 { animation-delay: 1.80s; }
    .postal-row { animation: postal-reveal 7.3s ease-in-out infinite; }
    @keyframes postal-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="postal-bg" width="980" height="390"/>
  <text class="postal-h1"  x="30" y="40">Sending a letter</text>
  <text class="postal-sub" x="30" y="64">And waiting for a reply.</text>
  <rect class="postal-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="postal-name" x="46" y="122">What you control</text>
  <text class="postal-desc" x="46" y="142">The request.</text>
  <text class="postal-desc postal-row postal-r0" x="46" y="182">What you write and where you send it</text>
  <text class="postal-desc postal-row postal-r1" x="46" y="216">When you send it</text>
  <text class="postal-desc postal-row postal-r2" x="46" y="250">How long you wait</text>
  <text class="postal-desc postal-row postal-r3" x="46" y="284">What you do if nothing comes</text>
  <text class="postal-desc postal-row postal-r4" x="46" y="318">This is the client</text>
  <rect class="postal-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="postal-name" x="526" y="122">What you do not</text>
  <text class="postal-desc" x="526" y="142">Everything else.</text>
  <text class="postal-desc postal-row postal-r0" x="526" y="182">Whether it arrives</text>
  <text class="postal-desc postal-row postal-r1" x="526" y="216">How long they take</text>
  <text class="postal-desc postal-row postal-r2" x="526" y="250">Whether they understood it</text>
  <text class="postal-desc postal-row postal-r3" x="526" y="284">Whether they reply at all</text>
  <text class="postal-desc postal-row postal-r4" x="526" y="318">This is the network and the server</text>
  <text class="postal-sub" x="30" y="372">Everything in the right column is why timeouts and retries exist, and treating any of it as guaranteed is where integration bugs come from.</text>
</svg>
