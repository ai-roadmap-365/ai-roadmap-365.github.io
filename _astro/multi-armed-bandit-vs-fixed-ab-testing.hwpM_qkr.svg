<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Multi-Armed Bandit vs Fixed A/B Testing">
  <title>Multi-Armed Bandit vs Fixed A/B Testing</title>
  <defs>
    <style>
      .d341b-bg { fill: #f8fafc; }
      .d341b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d341b-ab { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d341b-mab { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d341b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d341b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d341b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d341b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d341b-bg" />
  
  <text x="40" y="40" class="d341a-title">Optimization Paradigms: Static A/B vs Multi-Armed Bandit</text>
  <text x="40" y="65" class="d341a-subtitle">Multi-Armed Bandit vs Fixed A/B Testing comparing static 50/50 traffic allocation with fixed regret against dynamic Thompson Sampling bandit traffic shifts</text>
  
  <!-- Static A/B Testing -->
  <rect x="40" y="110" width="390" height="270" class="d341b-ab" />
  <text x="60" y="145" class="d341b-header" fill="#1d4ed8">Fixed 50/50 A/B Testing</text>
  <text x="60" y="180" class="d341b-text">• **Variant A (Control):** 50% traffic (60% Conv)</text>
  <text x="60" y="205" class="d341b-text">• **Variant B (Candidate):** 50% traffic (40% Conv)</text>
  <text x="60" y="230" class="d341b-text">• **Duration:** 14 Days fixed test window</text>
  <text x="60" y="255" class="d341b-text">• **High Opportunity Cost:** 50% of users get inferior B</text>
  <text x="60" y="300" class="d341b-text" font-weight="600" fill="#1d4ed8">High Cumulative Regret</text>
  
  <!-- Multi-Armed Bandit -->
  <rect x="470" y="110" width="390" height="270" class="d341b-mab" />
  <text x="490" y="145" class="d341b-header" fill="#7e22ce">Adaptive Multi-Armed Bandit</text>
  <text x="490" y="180" class="d341b-text">• **Day 1:** 50% A / 50% B (Initial Exploration)</text>
  <text x="490" y="205" class="d341b-text">• **Day 3:** 75% A / 25% B (Detects A superiority)</text>
  <text x="490" y="230" class="d341b-text">• **Day 7:** 95% A / 5% B (Exploitation phase)</text>
  <text x="490" y="255" class="d341b-text">• **Maximum Revenue:** Routes majority to winner</text>
  <text x="490" y="300" class="d341b-text" font-weight="600" fill="#7e22ce">Minimal Regret &amp; Maximum Conversions</text>
</svg>