<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Once, deliberately.">
  <title>Taking an engine apart</title>
  <style>
    .engine-teardown-bg   { fill: #f8fafc; }
    .engine-teardown-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .engine-teardown-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .engine-teardown-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .engine-teardown-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .engine-teardown-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .engine-teardown-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .engine-teardown-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .engine-teardown-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .engine-teardown-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .engine-teardown-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .engine-teardown-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .engine-teardown-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .engine-teardown-row { opacity: 1; }
    .engine-teardown-r0 { animation-delay: 0.00s; }
    .engine-teardown-r1 { animation-delay: 0.45s; }
    .engine-teardown-r2 { animation-delay: 0.90s; }
    .engine-teardown-r3 { animation-delay: 1.35s; }
    .engine-teardown-r4 { animation-delay: 1.80s; }
    .engine-teardown-row { animation: engine-teardown-reveal 7.3s ease-in-out infinite; }
    @keyframes engine-teardown-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="engine-teardown-bg" width="980" height="390"/>
  <text class="engine-teardown-h1"  x="30" y="40">Taking an engine apart</text>
  <text class="engine-teardown-sub" x="30" y="64">Once, deliberately.</text>
  <rect class="engine-teardown-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="engine-teardown-name" x="46" y="122">As a black box</text>
  <text class="engine-teardown-desc" x="46" y="142">It works until it does not.</text>
  <text class="engine-teardown-desc engine-teardown-row engine-teardown-r0" x="46" y="182">Configured, not understood</text>
  <text class="engine-teardown-desc engine-teardown-row engine-teardown-r1" x="46" y="216">Failures are mysterious</text>
  <text class="engine-teardown-desc engine-teardown-row engine-teardown-r2" x="46" y="250">Fixes are guesses from forums</text>
  <text class="engine-teardown-desc engine-teardown-row engine-teardown-r3" x="46" y="284">Cannot judge what is worth changing</text>
  <text class="engine-teardown-desc engine-teardown-row engine-teardown-r4" x="46" y="318">This is a framework adopted first</text>
  <rect class="engine-teardown-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="engine-teardown-name" x="526" y="122">Having built it</text>
  <text class="engine-teardown-desc" x="526" y="142">You know where to look.</text>
  <text class="engine-teardown-desc engine-teardown-row engine-teardown-r0" x="526" y="182">Every part accounted for</text>
  <text class="engine-teardown-desc engine-teardown-row engine-teardown-r1" x="526" y="216">Failures localise quickly</text>
  <text class="engine-teardown-desc engine-teardown-row engine-teardown-r2" x="526" y="250">Fixes follow from understanding</text>
  <text class="engine-teardown-desc engine-teardown-row engine-teardown-r3" x="526" y="284">Can judge which knob matters</text>
  <text class="engine-teardown-desc engine-teardown-row engine-teardown-r4" x="526" y="318">This is a framework adopted second</text>
  <text class="engine-teardown-sub" x="30" y="372">The teardown is done once and pays for years, which is the argument for spending a day on two hundred lines you will not deploy.</text>
</svg>
