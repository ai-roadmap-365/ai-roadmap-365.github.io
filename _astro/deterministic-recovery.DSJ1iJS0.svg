<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four questions, answered in advance.">
  <title>Recovery has to be decided, not discovered</title>
  <style>
    .deterministic-recovery-bg   { fill: #f8fafc; }
    .deterministic-recovery-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deterministic-recovery-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deterministic-recovery-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deterministic-recovery-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deterministic-recovery-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deterministic-recovery-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .deterministic-recovery-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .deterministic-recovery-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .deterministic-recovery-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .deterministic-recovery-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .deterministic-recovery-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .deterministic-recovery-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .deterministic-recovery-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .deterministic-recovery-stage { opacity: 1; }

    .deterministic-recovery-s0 { animation-delay: 0.00s; }
    .deterministic-recovery-e0 { animation-delay: 0.00s; }
    .deterministic-recovery-s1 { animation-delay: 1.28s; }
    .deterministic-recovery-e1 { animation-delay: 1.28s; }
    .deterministic-recovery-s2 { animation-delay: 2.56s; }
    .deterministic-recovery-e2 { animation-delay: 2.56s; }
    .deterministic-recovery-s3 { animation-delay: 3.84s; }
    .deterministic-recovery-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .deterministic-recovery-conn  { animation: deterministic-recovery-trace 6.4s ease-in-out infinite; }
      .deterministic-recovery-stage { animation: deterministic-recovery-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes deterministic-recovery-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes deterministic-recovery-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .deterministic-recovery-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .deterministic-recovery-stage { animation: deterministic-recovery-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes deterministic-recovery-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="deterministic-recovery-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="deterministic-recovery-bg" width="980" height="322"/>
  <text class="deterministic-recovery-h1"  x="30" y="40">Recovery has to be decided, not discovered</text>
  <text class="deterministic-recovery-sub" x="30" y="64">Four questions, answered in advance.</text>
  <g class="deterministic-recovery-stage deterministic-recovery-s0">
    <rect class="deterministic-recovery-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="deterministic-recovery-step" x="44" y="142">01</text>
    <text class="deterministic-recovery-name" x="70" y="142">How do you detect it?</text>
    <text class="deterministic-recovery-desc" x="44" y="166">A timeout, a status code, a</text>
    <text class="deterministic-recovery-desc" x="44" y="182">schema validation failure.</text>
    <text class="deterministic-recovery-desc" x="44" y="198">Something concrete.</text>
  </g>
  <line class="deterministic-recovery-line deterministic-recovery-conn deterministic-recovery-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#deterministic-recovery-tip)"/>
  <g class="deterministic-recovery-stage deterministic-recovery-s1">
    <rect class="deterministic-recovery-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="deterministic-recovery-step" x="280" y="142">02</text>
    <text class="deterministic-recovery-name" x="306" y="142">What is served instead?</text>
    <text class="deterministic-recovery-desc" x="280" y="166">A cached answer, a smaller</text>
    <text class="deterministic-recovery-desc" x="280" y="182">model, or an honest refusal —</text>
    <text class="deterministic-recovery-desc" x="280" y="198">decided now.</text>
    <text class="deterministic-recovery-edge" x="280" y="242">fallback</text>
  </g>
  <line class="deterministic-recovery-line deterministic-recovery-conn deterministic-recovery-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#deterministic-recovery-tip)"/>
  <g class="deterministic-recovery-stage deterministic-recovery-s2">
    <rect class="deterministic-recovery-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="deterministic-recovery-step" x="516" y="142">03</text>
    <text class="deterministic-recovery-name" x="542" y="142">What about partial state?</text>
    <text class="deterministic-recovery-desc" x="516" y="166">A half-written record is worse</text>
    <text class="deterministic-recovery-desc" x="516" y="182">than none. Make the write</text>
    <text class="deterministic-recovery-desc" x="516" y="198">atomic.</text>
  </g>
  <line class="deterministic-recovery-line deterministic-recovery-conn deterministic-recovery-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#deterministic-recovery-tip)"/>
  <g class="deterministic-recovery-stage deterministic-recovery-s3">
    <rect class="deterministic-recovery-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="deterministic-recovery-step" x="752" y="142">04</text>
    <text class="deterministic-recovery-name" x="778" y="142">What does the user see?</text>
    <text class="deterministic-recovery-desc" x="752" y="166">Degraded and honest. Never a</text>
    <text class="deterministic-recovery-desc" x="752" y="182">spinner that never resolves.</text>
  </g>
  <text class="deterministic-recovery-sub" x="30" y="304">Deterministic means the same failure always produces the same behaviour. A system that sometimes retries, sometimes falls back and sometimes hangs is one nobody can reason about, including you.</text>
</svg>
