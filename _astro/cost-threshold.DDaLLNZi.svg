<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Choosing the operating point</title>
  <style>
    .cost-threshold-bg   { fill: #f8fafc; }
    .cost-threshold-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-threshold-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-threshold-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-threshold-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-threshold-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-threshold-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cost-threshold-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cost-threshold-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cost-threshold-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cost-threshold-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cost-threshold-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cost-threshold-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cost-threshold-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cost-threshold-stage { opacity: 1; }

    .cost-threshold-s0 { animation-delay: 0.00s; }
    .cost-threshold-e0 { animation-delay: 0.00s; }
    .cost-threshold-s1 { animation-delay: 1.28s; }
    .cost-threshold-e1 { animation-delay: 1.28s; }
    .cost-threshold-s2 { animation-delay: 2.56s; }
    .cost-threshold-e2 { animation-delay: 2.56s; }
    .cost-threshold-s3 { animation-delay: 3.84s; }
    .cost-threshold-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cost-threshold-conn  { animation: cost-threshold-trace 6.4s ease-in-out infinite; }
      .cost-threshold-stage { animation: cost-threshold-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cost-threshold-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cost-threshold-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cost-threshold-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cost-threshold-stage { animation: cost-threshold-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cost-threshold-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cost-threshold-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cost-threshold-bg" width="980" height="322"/>
  <text class="cost-threshold-h1"  x="30" y="40">Choosing the operating point</text>
  <text class="cost-threshold-sub" x="30" y="64">Four steps.</text>
  <g class="cost-threshold-stage cost-threshold-s0">
    <rect class="cost-threshold-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cost-threshold-step" x="44" y="142">01</text>
    <text class="cost-threshold-name" x="70" y="142">Write down what each error actually costs</text>
    <text class="cost-threshold-desc" x="44" y="166">In money, time, or harm. Real</text>
    <text class="cost-threshold-desc" x="44" y="182">units.</text>
  </g>
  <line class="cost-threshold-line cost-threshold-conn cost-threshold-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cost-threshold-tip)"/>
  <g class="cost-threshold-stage cost-threshold-s1">
    <rect class="cost-threshold-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cost-threshold-step" x="280" y="142">02</text>
    <text class="cost-threshold-name" x="306" y="142">Sweep the threshold across its range</text>
    <text class="cost-threshold-desc" x="280" y="166">Counting each error type at</text>
    <text class="cost-threshold-desc" x="280" y="182">every point.</text>
  </g>
  <line class="cost-threshold-line cost-threshold-conn cost-threshold-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cost-threshold-tip)"/>
  <g class="cost-threshold-stage cost-threshold-s2">
    <rect class="cost-threshold-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cost-threshold-step" x="516" y="142">03</text>
    <text class="cost-threshold-name" x="542" y="142">Compute expected cost at each threshold</text>
    <text class="cost-threshold-desc" x="516" y="166">Counts multiplied by costs.</text>
  </g>
  <line class="cost-threshold-line cost-threshold-conn cost-threshold-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cost-threshold-tip)"/>
  <g class="cost-threshold-stage cost-threshold-s3">
    <rect class="cost-threshold-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cost-threshold-step" x="752" y="142">04</text>
    <text class="cost-threshold-name" x="778" y="142">And take the minimum</text>
    <text class="cost-threshold-desc" x="752" y="166">Which is rarely one half.</text>
  </g>
  <text class="cost-threshold-sub" x="30" y="304">Writing down the costs is the hard part and the valuable one: teams often discover they disagree about them, which is worth surfacing before the model ships.</text>
</svg>
