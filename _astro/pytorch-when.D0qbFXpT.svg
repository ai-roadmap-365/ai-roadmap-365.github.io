<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to reach for tensors</title>
  <style>
    .pytorch-when-bg   { fill: #f8fafc; }
    .pytorch-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pytorch-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pytorch-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pytorch-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pytorch-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pytorch-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pytorch-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pytorch-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pytorch-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pytorch-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pytorch-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pytorch-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pytorch-when-row { opacity: 1; }
    .pytorch-when-r0 { animation-delay: 0.00s; }
    .pytorch-when-r1 { animation-delay: 0.45s; }
    .pytorch-when-r2 { animation-delay: 0.90s; }
    .pytorch-when-r3 { animation-delay: 1.35s; }
    .pytorch-when-r4 { animation-delay: 1.80s; }
    .pytorch-when-row { animation: pytorch-when-reveal 7.3s ease-in-out infinite; }
    @keyframes pytorch-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="pytorch-when-bg" width="980" height="390"/>
  <text class="pytorch-when-h1"  x="30" y="40">When to reach for tensors</text>
  <text class="pytorch-when-sub" x="30" y="64">And when not to.</text>
  <rect class="pytorch-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="pytorch-when-name" x="46" y="122">Use it</text>
  <text class="pytorch-when-desc" x="46" y="142">Gradients or accelerators.</text>
  <text class="pytorch-when-desc pytorch-when-row pytorch-when-r0" x="46" y="182">Any deep learning project</text>
  <text class="pytorch-when-desc pytorch-when-row pytorch-when-r1" x="46" y="216">Anything needing automatic differentiation</text>
  <text class="pytorch-when-desc pytorch-when-row pytorch-when-r2" x="46" y="250">Anything that must run on a GPU</text>
  <text class="pytorch-when-desc pytorch-when-row pytorch-when-r3" x="46" y="284">Custom optimisation with gradients</text>
  <text class="pytorch-when-desc pytorch-when-row pytorch-when-r4" x="46" y="318">Research where architectures change often</text>
  <rect class="pytorch-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="pytorch-when-name" x="526" y="122">Use something else</text>
  <text class="pytorch-when-desc" x="526" y="142">No gradients needed.</text>
  <text class="pytorch-when-desc pytorch-when-row pytorch-when-r0" x="526" y="182">Tabular exploration and cleaning</text>
  <text class="pytorch-when-desc pytorch-when-row pytorch-when-r1" x="526" y="216">Classical machine learning models</text>
  <text class="pytorch-when-desc pytorch-when-row pytorch-when-r2" x="526" y="250">Plain numerical work</text>
  <text class="pytorch-when-desc pytorch-when-row pytorch-when-r3" x="526" y="284">A dataframe library and a classical toolkit</text>
  <text class="pytorch-when-desc pytorch-when-row pytorch-when-r4" x="526" y="318">Simpler, and better suited</text>
  <text class="pytorch-when-sub" x="30" y="372">Reaching for a deep learning framework for tabular work is a common inefficiency: gradient boosting remains the stronger method on most tabular problems and needs none of this machinery.</text>
</svg>
