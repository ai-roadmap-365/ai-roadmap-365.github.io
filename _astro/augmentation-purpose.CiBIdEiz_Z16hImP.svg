<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Invariances you know and the model does not.">
  <title>What augmentation encodes</title>
  <style>
    .augmentation-purpose-bg   { fill: #f8fafc; }
    .augmentation-purpose-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .augmentation-purpose-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .augmentation-purpose-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .augmentation-purpose-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .augmentation-purpose-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .augmentation-purpose-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .augmentation-purpose-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .augmentation-purpose-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .augmentation-purpose-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .augmentation-purpose-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .augmentation-purpose-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .augmentation-purpose-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .augmentation-purpose-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .augmentation-purpose-stage { opacity: 1; }

    .augmentation-purpose-s0 { animation-delay: 0.00s; }
    .augmentation-purpose-e0 { animation-delay: 0.00s; }
    .augmentation-purpose-s1 { animation-delay: 1.28s; }
    .augmentation-purpose-e1 { animation-delay: 1.28s; }
    .augmentation-purpose-s2 { animation-delay: 2.56s; }
    .augmentation-purpose-e2 { animation-delay: 2.56s; }
    .augmentation-purpose-s3 { animation-delay: 3.84s; }
    .augmentation-purpose-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .augmentation-purpose-conn  { animation: augmentation-purpose-trace 6.4s ease-in-out infinite; }
      .augmentation-purpose-stage { animation: augmentation-purpose-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes augmentation-purpose-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes augmentation-purpose-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .augmentation-purpose-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .augmentation-purpose-stage { animation: augmentation-purpose-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes augmentation-purpose-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="augmentation-purpose-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="augmentation-purpose-bg" width="980" height="322"/>
  <text class="augmentation-purpose-h1"  x="30" y="40">What augmentation encodes</text>
  <text class="augmentation-purpose-sub" x="30" y="64">Invariances you know and the model does not.</text>
  <g class="augmentation-purpose-stage augmentation-purpose-s0">
    <rect class="augmentation-purpose-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="augmentation-purpose-step" x="44" y="142">01</text>
    <text class="augmentation-purpose-name" x="70" y="142">You know what should not change the label</text>
    <text class="augmentation-purpose-desc" x="44" y="166">A dog is a dog flipped, cropped,</text>
    <text class="augmentation-purpose-desc" x="44" y="182">or slightly darker.</text>
  </g>
  <line class="augmentation-purpose-line augmentation-purpose-conn augmentation-purpose-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#augmentation-purpose-tip)"/>
  <g class="augmentation-purpose-stage augmentation-purpose-s1">
    <rect class="augmentation-purpose-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="augmentation-purpose-step" x="280" y="142">02</text>
    <text class="augmentation-purpose-name" x="306" y="142">So apply those transformations</text>
    <text class="augmentation-purpose-desc" x="280" y="166">Randomly, and the model learns</text>
    <text class="augmentation-purpose-desc" x="280" y="182">the invariance from examples.</text>
  </g>
  <line class="augmentation-purpose-line augmentation-purpose-conn augmentation-purpose-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#augmentation-purpose-tip)"/>
  <g class="augmentation-purpose-stage augmentation-purpose-s2">
    <rect class="augmentation-purpose-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="augmentation-purpose-step" x="516" y="142">03</text>
    <text class="augmentation-purpose-name" x="542" y="142">Fresh randomness every epoch</text>
    <text class="augmentation-purpose-desc" x="516" y="166">The network essentially never</text>
    <text class="augmentation-purpose-desc" x="516" y="182">sees the same pixels twice.</text>
  </g>
  <line class="augmentation-purpose-line augmentation-purpose-conn augmentation-purpose-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#augmentation-purpose-tip)"/>
  <g class="augmentation-purpose-stage augmentation-purpose-s3">
    <rect class="augmentation-purpose-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="augmentation-purpose-step" x="752" y="142">04</text>
    <text class="augmentation-purpose-name" x="778" y="142">Which regularises</text>
    <text class="augmentation-purpose-desc" x="752" y="166">Memorising an image no longer</text>
    <text class="augmentation-purpose-desc" x="752" y="182">helps, because that image never</text>
    <text class="augmentation-purpose-desc" x="752" y="198">recurs.</text>
  </g>
  <text class="augmentation-purpose-sub" x="30" y="304">The third stage is what turns augmentation from data expansion into regularisation, and it is why augmentation belongs in the per-sample accessor rather than in preprocessing.</text>
</svg>
