<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when to classify instead.">
  <title>When to use anomaly detection</title>
  <style>
    .anomaly-when-bg   { fill: #f8fafc; }
    .anomaly-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .anomaly-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .anomaly-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .anomaly-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .anomaly-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .anomaly-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .anomaly-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .anomaly-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .anomaly-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .anomaly-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .anomaly-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .anomaly-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .anomaly-when-row { opacity: 1; }
    .anomaly-when-r0 { animation-delay: 0.00s; }
    .anomaly-when-r1 { animation-delay: 0.45s; }
    .anomaly-when-r2 { animation-delay: 0.90s; }
    .anomaly-when-r3 { animation-delay: 1.35s; }
    .anomaly-when-r4 { animation-delay: 1.80s; }
    .anomaly-when-row { animation: anomaly-when-reveal 7.3s ease-in-out infinite; }
    @keyframes anomaly-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="anomaly-when-bg" width="980" height="390"/>
  <text class="anomaly-when-h1"  x="30" y="40">When to use anomaly detection</text>
  <text class="anomaly-when-sub" x="30" y="64">And when to classify instead.</text>
  <rect class="anomaly-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="anomaly-when-name" x="46" y="122">Detect anomalies</text>
  <text class="anomaly-when-desc" x="46" y="142">Four cases.</text>
  <text class="anomaly-when-desc anomaly-when-row anomaly-when-r0" x="46" y="182">No labelled examples of the problem</text>
  <text class="anomaly-when-desc anomaly-when-row anomaly-when-r1" x="46" y="216">Novel failures are expected</text>
  <text class="anomaly-when-desc anomaly-when-row anomaly-when-r2" x="46" y="250">Extremely rare positives</text>
  <text class="anomaly-when-desc anomaly-when-row anomaly-when-r3" x="46" y="284">Monitoring for drift or unusual input</text>
  <text class="anomaly-when-desc anomaly-when-row anomaly-when-r4" x="46" y="318">Where a human reviews every flag</text>
  <rect class="anomaly-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="anomaly-when-name" x="526" y="122">Classify instead</text>
  <text class="anomaly-when-desc" x="526" y="142">Also four.</text>
  <text class="anomaly-when-desc anomaly-when-row anomaly-when-r0" x="526" y="182">Labelled examples exist in useful numbers</text>
  <text class="anomaly-when-desc anomaly-when-row anomaly-when-r1" x="526" y="216">The failure mode is stable and known</text>
  <text class="anomaly-when-desc anomaly-when-row anomaly-when-r2" x="526" y="250">You need a specific decision, not a flag</text>
  <text class="anomaly-when-desc anomaly-when-row anomaly-when-r3" x="526" y="284">Precision matters more than coverage</text>
  <text class="anomaly-when-desc anomaly-when-row anomaly-when-r4" x="526" y="318">Where flags cannot be reviewed</text>
  <text class="anomaly-when-sub" x="30" y="372">The last row of each column is the practical constraint: an unreviewed anomaly detector produces alerts nobody acts on and value nobody realises.</text>
</svg>
