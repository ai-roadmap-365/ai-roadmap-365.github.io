<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two families, different needs.">
  <title>Which preprocessing per model</title>
  <style>
    .model-family-rules-bg   { fill: #f8fafc; }
    .model-family-rules-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-family-rules-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-family-rules-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-family-rules-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-family-rules-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-family-rules-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .model-family-rules-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .model-family-rules-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .model-family-rules-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .model-family-rules-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .model-family-rules-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .model-family-rules-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .model-family-rules-row { opacity: 1; }
    .model-family-rules-r0 { animation-delay: 0.00s; }
    .model-family-rules-r1 { animation-delay: 0.45s; }
    .model-family-rules-r2 { animation-delay: 0.90s; }
    .model-family-rules-r3 { animation-delay: 1.35s; }
    .model-family-rules-r4 { animation-delay: 1.80s; }
    .model-family-rules-row { animation: model-family-rules-reveal 7.3s ease-in-out infinite; }
    @keyframes model-family-rules-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="model-family-rules-bg" width="980" height="390"/>
  <text class="model-family-rules-h1"  x="30" y="40">Which preprocessing per model</text>
  <text class="model-family-rules-sub" x="30" y="64">Two families, different needs.</text>
  <rect class="model-family-rules-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="model-family-rules-name" x="46" y="122">Distance and gradient based</text>
  <text class="model-family-rules-desc" x="46" y="142">Scaling mandatory.</text>
  <text class="model-family-rules-desc model-family-rules-row model-family-rules-r0" x="46" y="182">Linear, logistic, support vector, nearest neighbour, networks</text>
  <text class="model-family-rules-desc model-family-rules-row model-family-rules-r1" x="46" y="216">Scaling is required, not optional</text>
  <text class="model-family-rules-desc model-family-rules-row model-family-rules-r2" x="46" y="250">One-hot encoding for categories</text>
  <text class="model-family-rules-desc model-family-rules-row model-family-rules-r3" x="46" y="284">Sensitive to outliers</text>
  <text class="model-family-rules-desc model-family-rules-row model-family-rules-r4" x="46" y="318">Missing values must be imputed</text>
  <rect class="model-family-rules-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="model-family-rules-name" x="526" y="122">Tree based</text>
  <text class="model-family-rules-desc" x="526" y="142">Scaling irrelevant.</text>
  <text class="model-family-rules-desc model-family-rules-row model-family-rules-r0" x="526" y="182">Decision trees, forests, boosting</text>
  <text class="model-family-rules-desc model-family-rules-row model-family-rules-r1" x="526" y="216">Scaling changes nothing at all</text>
  <text class="model-family-rules-desc model-family-rules-row model-family-rules-r2" x="526" y="250">Ordinal or native encoding is fine</text>
  <text class="model-family-rules-desc model-family-rules-row model-family-rules-r3" x="526" y="284">Robust to outliers by construction</text>
  <text class="model-family-rules-desc model-family-rules-row model-family-rules-r4" x="526" y="318">Missing values often handled natively</text>
  <text class="model-family-rules-sub" x="30" y="372">Applying the first column's preprocessing to a tree model is harmless but wasteful; applying the second column's to a linear model is a silent failure.</text>
</svg>
