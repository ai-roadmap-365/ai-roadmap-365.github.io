<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="They protect against different things.">
  <title>Replication is not a backup</title>
  <style>
    .backup-is-not-replication-bg   { fill: #f8fafc; }
    .backup-is-not-replication-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backup-is-not-replication-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backup-is-not-replication-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backup-is-not-replication-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backup-is-not-replication-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backup-is-not-replication-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .backup-is-not-replication-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .backup-is-not-replication-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .backup-is-not-replication-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .backup-is-not-replication-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .backup-is-not-replication-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .backup-is-not-replication-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .backup-is-not-replication-row { opacity: 1; }
    .backup-is-not-replication-r0 { animation-delay: 0.00s; }
    .backup-is-not-replication-r1 { animation-delay: 0.45s; }
    .backup-is-not-replication-r2 { animation-delay: 0.90s; }
    .backup-is-not-replication-r3 { animation-delay: 1.35s; }
    .backup-is-not-replication-r4 { animation-delay: 1.80s; }
    .backup-is-not-replication-row { animation: backup-is-not-replication-reveal 7.3s ease-in-out infinite; }
    @keyframes backup-is-not-replication-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="backup-is-not-replication-bg" width="980" height="390"/>
  <text class="backup-is-not-replication-h1"  x="30" y="40">Replication is not a backup</text>
  <text class="backup-is-not-replication-sub" x="30" y="64">They protect against different things.</text>
  <rect class="backup-is-not-replication-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="backup-is-not-replication-name" x="46" y="122">Replication</text>
  <text class="backup-is-not-replication-desc" x="46" y="142">Copies kept in sync.</text>
  <text class="backup-is-not-replication-desc backup-is-not-replication-row backup-is-not-replication-r0" x="46" y="182">Protects against a machine failing</text>
  <text class="backup-is-not-replication-desc backup-is-not-replication-row backup-is-not-replication-r1" x="46" y="216">Protects against a region failing</text>
  <text class="backup-is-not-replication-desc backup-is-not-replication-row backup-is-not-replication-r2" x="46" y="250">Copies are current, always</text>
  <text class="backup-is-not-replication-desc backup-is-not-replication-row backup-is-not-replication-r3" x="46" y="284">A deletion replicates instantly</text>
  <text class="backup-is-not-replication-desc backup-is-not-replication-row backup-is-not-replication-r4" x="46" y="318">So does a corruption, or an encryption</text>
  <rect class="backup-is-not-replication-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="backup-is-not-replication-name" x="526" y="122">Backup</text>
  <text class="backup-is-not-replication-desc" x="526" y="142">Copies from a point in time.</text>
  <text class="backup-is-not-replication-desc backup-is-not-replication-row backup-is-not-replication-r0" x="526" y="182">Protects against a mistake</text>
  <text class="backup-is-not-replication-desc backup-is-not-replication-row backup-is-not-replication-r1" x="526" y="216">Protects against ransomware</text>
  <text class="backup-is-not-replication-desc backup-is-not-replication-row backup-is-not-replication-r2" x="526" y="250">Copies are deliberately behind</text>
  <text class="backup-is-not-replication-desc backup-is-not-replication-row backup-is-not-replication-r3" x="526" y="284">A deletion is not in yesterday's copy</text>
  <text class="backup-is-not-replication-desc backup-is-not-replication-row backup-is-not-replication-r4" x="526" y="318">And must be restore-tested, or it is a hope</text>
  <text class="backup-is-not-replication-sub" x="30" y="372">"We have three replicas" answers a hardware question and not a human one. A dropped table is faithfully replicated to all three within a second, which is exactly what replication is for.</text>
</svg>
