<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Mostly by being believed.">
  <title>Four ways the review itself fails</title>
  <style>
    .review-hazards-bg   { fill: #f8fafc; }
    .review-hazards-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-hazards-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-hazards-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-hazards-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-hazards-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-hazards-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .review-hazards-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .review-hazards-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .review-hazards-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .review-hazards-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .review-hazards-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .review-hazards-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .review-hazards-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .review-hazards-stage { opacity: 1; }

    .review-hazards-s0 { animation-delay: 0.00s; }
    .review-hazards-e0 { animation-delay: 0.00s; }
    .review-hazards-s1 { animation-delay: 1.28s; }
    .review-hazards-e1 { animation-delay: 1.28s; }
    .review-hazards-s2 { animation-delay: 2.56s; }
    .review-hazards-e2 { animation-delay: 2.56s; }
    .review-hazards-s3 { animation-delay: 3.84s; }
    .review-hazards-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .review-hazards-conn  { animation: review-hazards-trace 6.4s ease-in-out infinite; }
      .review-hazards-stage { animation: review-hazards-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes review-hazards-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes review-hazards-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .review-hazards-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .review-hazards-stage { animation: review-hazards-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes review-hazards-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="review-hazards-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="review-hazards-bg" width="980" height="322"/>
  <text class="review-hazards-h1"  x="30" y="40">Four ways the review itself fails</text>
  <text class="review-hazards-sub" x="30" y="64">Mostly by being believed.</text>
  <g class="review-hazards-stage review-hazards-s0">
    <rect class="review-hazards-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="review-hazards-step" x="44" y="142">01</text>
    <text class="review-hazards-name" x="70" y="142">Ticked, not verified</text>
    <text class="review-hazards-desc" x="44" y="166">A checklist item marked done</text>
    <text class="review-hazards-desc" x="44" y="182">with no artefact behind it.</text>
  </g>
  <line class="review-hazards-line review-hazards-conn review-hazards-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#review-hazards-tip)"/>
  <g class="review-hazards-stage review-hazards-s1">
    <rect class="review-hazards-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="review-hazards-step" x="280" y="142">02</text>
    <text class="review-hazards-name" x="306" y="142">One pillar, deeply</text>
    <text class="review-hazards-desc" x="280" y="166">An excellent prompt firewall and</text>
    <text class="review-hazards-desc" x="280" y="182">unsigned pickle weights.</text>
  </g>
  <line class="review-hazards-line review-hazards-conn review-hazards-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#review-hazards-tip)"/>
  <g class="review-hazards-stage review-hazards-s2">
    <rect class="review-hazards-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="review-hazards-step" x="516" y="142">03</text>
    <text class="review-hazards-name" x="542" y="142">Controls never exercised</text>
    <text class="review-hazards-desc" x="516" y="166">A canary monitor nobody has seen</text>
    <text class="review-hazards-desc" x="516" y="182">fire. Day 361's rule, again.</text>
  </g>
  <line class="review-hazards-line review-hazards-conn review-hazards-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#review-hazards-tip)"/>
  <g class="review-hazards-stage review-hazards-s3">
    <rect class="review-hazards-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="review-hazards-step" x="752" y="142">04</text>
    <text class="review-hazards-name" x="778" y="142">Scope from three tools ago</text>
    <text class="review-hazards-desc" x="752" y="166">The boundaries changed and the</text>
    <text class="review-hazards-desc" x="752" y="182">review did not.</text>
    <text class="review-hazards-edge" x="752" y="242">re-run</text>
  </g>
  <text class="review-hazards-sub" x="30" y="304">The third is the recurring theme of this entire section: a control that has never been observed failing is indistinguishable from one that does nothing, and the difference only becomes visible on the worst day.</text>
</svg>
