<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four commitments.">
  <title>The freshness contract</title>
  <style>
    .freshness-bg   { fill: #f8fafc; }
    .freshness-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .freshness-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .freshness-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .freshness-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .freshness-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .freshness-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .freshness-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .freshness-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .freshness-stage { opacity: 1; }

    .freshness-s0 { animation-delay: 0.00s; }
    .freshness-e0 { animation-delay: 0.00s; }
    .freshness-s1 { animation-delay: 1.28s; }
    .freshness-e1 { animation-delay: 1.28s; }
    .freshness-s2 { animation-delay: 2.56s; }
    .freshness-e2 { animation-delay: 2.56s; }
    .freshness-s3 { animation-delay: 3.84s; }
    .freshness-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .freshness-conn  { animation: freshness-trace 6.4s ease-in-out infinite; }
      .freshness-stage { animation: freshness-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes freshness-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes freshness-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .freshness-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .freshness-stage { animation: freshness-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes freshness-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="freshness-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="freshness-bg" width="980" height="322"/>
  <text class="freshness-h1"  x="30" y="40">The freshness contract</text>
  <text class="freshness-sub" x="30" y="64">Four commitments.</text>
  <g class="freshness-stage freshness-s0">
    <rect class="freshness-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="freshness-step" x="44" y="142">01</text>
    <text class="freshness-name" x="70" y="142">Re-ingest on a stated interval</text>
    <text class="freshness-desc" x="44" y="166">Or on a change notification from</text>
    <text class="freshness-desc" x="44" y="182">the source.</text>
  </g>
  <line class="freshness-line freshness-conn freshness-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#freshness-tip)"/>
  <g class="freshness-stage freshness-s1">
    <rect class="freshness-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="freshness-step" x="280" y="142">02</text>
    <text class="freshness-name" x="306" y="142">Detect changes by content hash</text>
    <text class="freshness-desc" x="280" y="166">So unchanged documents are not</text>
    <text class="freshness-desc" x="280" y="182">re-embedded.</text>
  </g>
  <line class="freshness-line freshness-conn freshness-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#freshness-tip)"/>
  <g class="freshness-stage freshness-s2">
    <rect class="freshness-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="freshness-step" x="516" y="142">03</text>
    <text class="freshness-name" x="542" y="142">State the guarantee to users</text>
    <text class="freshness-desc" x="516" y="166">Answers reflect documentation as</text>
    <text class="freshness-desc" x="516" y="182">of a given time.</text>
  </g>
  <line class="freshness-line freshness-conn freshness-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#freshness-tip)"/>
  <g class="freshness-stage freshness-s3">
    <rect class="freshness-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="freshness-step" x="752" y="142">04</text>
    <text class="freshness-name" x="778" y="142">And surface the age of each source</text>
    <text class="freshness-desc" x="752" y="166">So a reader can judge for</text>
    <text class="freshness-desc" x="752" y="182">themselves.</text>
  </g>
  <text class="freshness-sub" x="30" y="304">Surfacing source age costs nothing and prevents the worst failure of these systems: a confident answer drawn from a page that was superseded months ago.</text>
</svg>
