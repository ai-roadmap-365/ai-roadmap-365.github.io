<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="It is where the ranking changes.">
  <title>The question is not "which is cheapest"</title>
  <style>
    .wrong-question-bg   { fill: #f8fafc; }
    .wrong-question-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .wrong-question-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .wrong-question-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .wrong-question-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .wrong-question-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .wrong-question-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .wrong-question-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .wrong-question-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .wrong-question-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .wrong-question-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .wrong-question-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .wrong-question-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .wrong-question-row { opacity: 1; }
    .wrong-question-r0 { animation-delay: 0.00s; }
    .wrong-question-r1 { animation-delay: 0.45s; }
    .wrong-question-r2 { animation-delay: 0.90s; }
    .wrong-question-r3 { animation-delay: 1.35s; }
    .wrong-question-r4 { animation-delay: 1.80s; }
    .wrong-question-row { animation: wrong-question-reveal 7.3s ease-in-out infinite; }
    @keyframes wrong-question-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="wrong-question-bg" width="980" height="390"/>
  <text class="wrong-question-h1"  x="30" y="40">The question is not "which is cheapest"</text>
  <text class="wrong-question-sub" x="30" y="64">It is where the ranking changes.</text>
  <rect class="wrong-question-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="wrong-question-name" x="46" y="122">"Which is cheapest?"</text>
  <text class="wrong-question-desc" x="46" y="142">Incomplete without a traffic level.</text>
  <text class="wrong-question-desc wrong-question-row wrong-question-r0" x="46" y="182">Free against $7.79 at launch</text>
  <text class="wrong-question-desc wrong-question-row wrong-question-r1" x="46" y="216">3x more expensive at 20M/month</text>
  <text class="wrong-question-desc wrong-question-row wrong-question-r2" x="46" y="250">Both answers are correct</text>
  <text class="wrong-question-desc wrong-question-row wrong-question-r3" x="46" y="284">Neither is usable on its own</text>
  <text class="wrong-question-desc wrong-question-row wrong-question-r4" x="46" y="318">The ranking is not a property of the option</text>
  <rect class="wrong-question-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="wrong-question-name" x="526" y="122">Two better questions</text>
  <text class="wrong-question-desc" x="526" y="142">Both computable.</text>
  <text class="wrong-question-desc wrong-question-row wrong-question-r0" x="526" y="182">At what traffic does the ranking change?</text>
  <text class="wrong-question-desc wrong-question-row wrong-question-r1" x="526" y="216">Which free allowance runs out first?</text>
  <text class="wrong-question-desc wrong-question-row wrong-question-r2" x="526" y="250">899,599 requests a month</text>
  <text class="wrong-question-desc wrong-question-row wrong-question-r3" x="526" y="284">Egress, at 1.25x — not requests at 100x</text>
  <text class="wrong-question-desc wrong-question-row wrong-question-r4" x="526" y="318">Arithmetic on published rate cards</text>
  <text class="wrong-question-sub" x="30" y="372">Both are answerable from a pricing page with a script, which is what makes this a calculation rather than a preference — and what makes "we chose serverless because it is cheaper" an incomplete sentence.</text>
</svg>
