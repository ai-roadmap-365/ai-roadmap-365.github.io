<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="All measured, all correctable.">
  <title>Three biases, three mitigations</title>
  <style>
    .judge-biases-bg   { fill: #f8fafc; }
    .judge-biases-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-biases-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-biases-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-biases-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-biases-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-biases-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .judge-biases-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .judge-biases-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .judge-biases-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .judge-biases-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .judge-biases-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .judge-biases-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .judge-biases-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .judge-biases-stage { opacity: 1; }

    .judge-biases-s0 { animation-delay: 0.00s; }
    .judge-biases-e0 { animation-delay: 0.00s; }
    .judge-biases-s1 { animation-delay: 1.50s; }
    .judge-biases-e1 { animation-delay: 1.50s; }
    .judge-biases-s2 { animation-delay: 3.00s; }
    .judge-biases-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .judge-biases-conn  { animation: judge-biases-trace 6s ease-in-out infinite; }
      .judge-biases-stage { animation: judge-biases-arrive 6s ease-in-out infinite; }
    }
    @keyframes judge-biases-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes judge-biases-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .judge-biases-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .judge-biases-stage { animation: judge-biases-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes judge-biases-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="judge-biases-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="judge-biases-bg" width="980" height="322"/>
  <text class="judge-biases-h1"  x="30" y="40">Three biases, three mitigations</text>
  <text class="judge-biases-sub" x="30" y="64">All measured, all correctable.</text>
  <g class="judge-biases-stage judge-biases-s0">
    <rect class="judge-biases-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="judge-biases-step" x="44" y="142">01</text>
    <text class="judge-biases-name" x="70" y="142">Positional bias</text>
    <text class="judge-biases-desc" x="44" y="166">Order affects the verdict. Run A-B and B-A</text>
    <text class="judge-biases-desc" x="44" y="182">and require agreement.</text>
    <text class="judge-biases-edge" x="44" y="242">swap</text>
  </g>
  <line class="judge-biases-line judge-biases-conn judge-biases-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#judge-biases-tip)"/>
  <g class="judge-biases-stage judge-biases-s1">
    <rect class="judge-biases-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="judge-biases-step" x="359" y="142">02</text>
    <text class="judge-biases-name" x="385" y="142">Verbosity bias</text>
    <text class="judge-biases-desc" x="359" y="166">Long bullet-pointed answers score higher.</text>
    <text class="judge-biases-desc" x="359" y="182">Instruct against it explicitly.</text>
  </g>
  <line class="judge-biases-line judge-biases-conn judge-biases-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#judge-biases-tip)"/>
  <g class="judge-biases-stage judge-biases-s2">
    <rect class="judge-biases-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="judge-biases-step" x="674" y="142">03</text>
    <text class="judge-biases-name" x="700" y="142">Self-enhancement bias</text>
    <text class="judge-biases-desc" x="674" y="166">A model prefers its own family. Use a neutral</text>
    <text class="judge-biases-desc" x="674" y="182">judge, or an ensemble.</text>
  </g>
  <text class="judge-biases-sub" x="30" y="304">Running both orderings is the cheapest of the three and catches the most: a pair where A-B and B-A disagree is a case the judge could not actually distinguish, which is itself the finding.</text>
</svg>
