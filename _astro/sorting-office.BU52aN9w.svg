<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Identify before handling.">
  <title>A postal sorting office</title>
  <style>
    .sorting-office-bg   { fill: #f8fafc; }
    .sorting-office-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sorting-office-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sorting-office-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sorting-office-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sorting-office-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sorting-office-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sorting-office-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sorting-office-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sorting-office-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sorting-office-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sorting-office-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sorting-office-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sorting-office-row { opacity: 1; }
    .sorting-office-r0 { animation-delay: 0.00s; }
    .sorting-office-r1 { animation-delay: 0.45s; }
    .sorting-office-r2 { animation-delay: 0.90s; }
    .sorting-office-r3 { animation-delay: 1.35s; }
    .sorting-office-r4 { animation-delay: 1.80s; }
    .sorting-office-row { animation: sorting-office-reveal 7.3s ease-in-out infinite; }
    @keyframes sorting-office-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="sorting-office-bg" width="980" height="390"/>
  <text class="sorting-office-h1"  x="30" y="40">A postal sorting office</text>
  <text class="sorting-office-sub" x="30" y="64">Identify before handling.</text>
  <rect class="sorting-office-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="sorting-office-name" x="46" y="122">Tip it all out</text>
  <text class="sorting-office-desc" x="46" y="142">Same handling for everything.</text>
  <text class="sorting-office-desc sorting-office-row sorting-office-r0" x="46" y="182">A card, a contract and a damaged envelope alike</text>
  <text class="sorting-office-desc sorting-office-row sorting-office-r1" x="46" y="216">Pages arrive out of order</text>
  <text class="sorting-office-desc sorting-office-row sorting-office-r2" x="46" y="250">Fragments forwarded as if complete</text>
  <text class="sorting-office-desc sorting-office-row sorting-office-r3" x="46" y="284">Nobody checks the output</text>
  <text class="sorting-office-desc sorting-office-row sorting-office-r4" x="46" y="318">Something arrived for each item</text>
  <rect class="sorting-office-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="sorting-office-name" x="526" y="122">Sort first</text>
  <text class="sorting-office-desc" x="526" y="142">By what it actually is.</text>
  <text class="sorting-office-desc sorting-office-row sorting-office-r0" x="526" y="182">Letter, parcel, fragile, damaged</text>
  <text class="sorting-office-desc sorting-office-row sorting-office-r1" x="526" y="216">Each class handled appropriately</text>
  <text class="sorting-office-desc sorting-office-row sorting-office-r2" x="526" y="250">Damaged items to a separate desk, with a note</text>
  <text class="sorting-office-desc sorting-office-row sorting-office-r3" x="526" y="284">A business letter yielding three words is set aside</text>
  <text class="sorting-office-desc sorting-office-row sorting-office-r4" x="526" y="318">Rather than forwarded</text>
  <text class="sorting-office-sub" x="30" y="372">Everything the second office does maps onto the pipeline: identify before handling, route by class, budget the effort, and check the output is plausible before letting it go on.</text>
</svg>
