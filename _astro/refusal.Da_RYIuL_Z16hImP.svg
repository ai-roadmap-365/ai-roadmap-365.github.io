<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>How to decline well</title>
  <style>
    .refusal-bg   { fill: #f8fafc; }
    .refusal-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .refusal-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .refusal-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .refusal-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .refusal-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .refusal-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .refusal-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .refusal-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .refusal-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .refusal-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .refusal-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .refusal-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .refusal-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .refusal-stage { opacity: 1; }

    .refusal-s0 { animation-delay: 0.00s; }
    .refusal-e0 { animation-delay: 0.00s; }
    .refusal-s1 { animation-delay: 1.28s; }
    .refusal-e1 { animation-delay: 1.28s; }
    .refusal-s2 { animation-delay: 2.56s; }
    .refusal-e2 { animation-delay: 2.56s; }
    .refusal-s3 { animation-delay: 3.84s; }
    .refusal-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .refusal-conn  { animation: refusal-trace 6.4s ease-in-out infinite; }
      .refusal-stage { animation: refusal-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes refusal-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes refusal-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .refusal-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .refusal-stage { animation: refusal-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes refusal-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="refusal-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="refusal-bg" width="980" height="322"/>
  <text class="refusal-h1"  x="30" y="40">How to decline well</text>
  <text class="refusal-sub" x="30" y="64">Four properties.</text>
  <g class="refusal-stage refusal-s0">
    <rect class="refusal-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="refusal-step" x="44" y="142">01</text>
    <text class="refusal-name" x="70" y="142">Short</text>
    <text class="refusal-desc" x="44" y="166">One or two sentences. Length</text>
    <text class="refusal-desc" x="44" y="182">reads as defensiveness.</text>
  </g>
  <line class="refusal-line refusal-conn refusal-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#refusal-tip)"/>
  <g class="refusal-stage refusal-s1">
    <rect class="refusal-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="refusal-step" x="280" y="142">02</text>
    <text class="refusal-name" x="306" y="142">Without moralising</text>
    <text class="refusal-desc" x="280" y="166">State the limit, do not lecture</text>
    <text class="refusal-desc" x="280" y="182">about it.</text>
  </g>
  <line class="refusal-line refusal-conn refusal-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#refusal-tip)"/>
  <g class="refusal-stage refusal-s2">
    <rect class="refusal-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="refusal-step" x="516" y="142">03</text>
    <text class="refusal-name" x="542" y="142">With an alternative where one exists</text>
    <text class="refusal-desc" x="516" y="166">The nearest thing that can be</text>
    <text class="refusal-desc" x="516" y="182">done.</text>
  </g>
  <line class="refusal-line refusal-conn refusal-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#refusal-tip)"/>
  <g class="refusal-stage refusal-s3">
    <rect class="refusal-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="refusal-step" x="752" y="142">04</text>
    <text class="refusal-name" x="778" y="142">And consistent</text>
    <text class="refusal-desc" x="752" y="166">The same request refused the</text>
    <text class="refusal-desc" x="752" y="182">same way, every time.</text>
  </g>
  <text class="refusal-sub" x="30" y="304">Inconsistent refusals do more damage than strict ones: a boundary that moves with phrasing teaches users to rephrase rather than to trust the limit.</text>
</svg>
