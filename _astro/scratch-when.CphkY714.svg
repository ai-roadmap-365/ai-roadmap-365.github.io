<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when an ecosystem wins.">
  <title>When to build it yourself</title>
  <style>
    .scratch-when-bg   { fill: #f8fafc; }
    .scratch-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scratch-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scratch-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scratch-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scratch-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scratch-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scratch-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scratch-when-row { opacity: 1; }
    .scratch-when-r0 { animation-delay: 0.00s; }
    .scratch-when-r1 { animation-delay: 0.45s; }
    .scratch-when-r2 { animation-delay: 0.90s; }
    .scratch-when-r3 { animation-delay: 1.35s; }
    .scratch-when-r4 { animation-delay: 1.80s; }
    .scratch-when-row { animation: scratch-when-reveal 7.3s ease-in-out infinite; }
    @keyframes scratch-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="scratch-when-bg" width="980" height="390"/>
  <text class="scratch-when-h1"  x="30" y="40">When to build it yourself</text>
  <text class="scratch-when-sub" x="30" y="64">And when an ecosystem wins.</text>
  <rect class="scratch-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="scratch-when-name" x="46" y="122">Build it</text>
  <text class="scratch-when-desc" x="46" y="142">Control and latency.</text>
  <text class="scratch-when-desc scratch-when-row scratch-when-r0" x="46" y="182">Strict security auditing, zero CVE tolerance</text>
  <text class="scratch-when-desc scratch-when-row scratch-when-r1" x="46" y="216">Low-latency microservices</text>
  <text class="scratch-when-desc scratch-when-row scratch-when-r2" x="46" y="250">Custom memory requirements</text>
  <text class="scratch-when-desc scratch-when-row scratch-when-r3" x="46" y="284">Research agents and developer tools</text>
  <text class="scratch-when-desc scratch-when-row scratch-when-r4" x="46" y="318">Where every millisecond of overhead counts</text>
  <rect class="scratch-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="scratch-when-name" x="526" y="122">Use a framework</text>
  <text class="scratch-when-desc" x="526" y="142">Breadth and speed.</text>
  <text class="scratch-when-desc scratch-when-row scratch-when-r0" x="526" y="182">Connectors to 200 SaaS APIs on day one</text>
  <text class="scratch-when-desc scratch-when-row scratch-when-r1" x="526" y="216">Or MCP, for the same reason</text>
  <text class="scratch-when-desc scratch-when-row scratch-when-r2" x="526" y="250">A 30-minute hackathon prototype</text>
  <text class="scratch-when-desc scratch-when-row scratch-when-r3" x="526" y="284">No long-term maintenance expectation</text>
  <text class="scratch-when-desc scratch-when-row scratch-when-r4" x="526" y="318">Where the connectors are the product</text>
  <text class="scratch-when-sub" x="30" y="372">The overhead figure is worth quoting when the argument turns to performance: the scratch loop's own state transition and parsing run in about 150 microseconds, leaving essentially the whole budget to inference.</text>
</svg>
