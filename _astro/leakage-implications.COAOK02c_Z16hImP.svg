<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="All expensive.">
  <title>Four consequences of leakage</title>
  <style>
    .leakage-implications-bg   { fill: #f8fafc; }
    .leakage-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .leakage-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .leakage-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .leakage-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .leakage-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .leakage-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .leakage-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .leakage-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .leakage-implications-stage { opacity: 1; }

    .leakage-implications-s0 { animation-delay: 0.00s; }
    .leakage-implications-e0 { animation-delay: 0.00s; }
    .leakage-implications-s1 { animation-delay: 1.28s; }
    .leakage-implications-e1 { animation-delay: 1.28s; }
    .leakage-implications-s2 { animation-delay: 2.56s; }
    .leakage-implications-e2 { animation-delay: 2.56s; }
    .leakage-implications-s3 { animation-delay: 3.84s; }
    .leakage-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .leakage-implications-conn  { animation: leakage-implications-trace 6.4s ease-in-out infinite; }
      .leakage-implications-stage { animation: leakage-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes leakage-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes leakage-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .leakage-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .leakage-implications-stage { animation: leakage-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes leakage-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="leakage-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="leakage-implications-bg" width="980" height="322"/>
  <text class="leakage-implications-h1"  x="30" y="40">Four consequences of leakage</text>
  <text class="leakage-implications-sub" x="30" y="64">All expensive.</text>
  <g class="leakage-implications-stage leakage-implications-s0">
    <rect class="leakage-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="leakage-implications-step" x="44" y="142">01</text>
    <text class="leakage-implications-name" x="70" y="142">Every downstream decision rests on a false number</text>
    <text class="leakage-implications-desc" x="44" y="166">Model choice, tuning, the</text>
    <text class="leakage-implications-desc" x="44" y="182">go-ahead.</text>
  </g>
  <line class="leakage-implications-line leakage-implications-conn leakage-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#leakage-implications-tip)"/>
  <g class="leakage-implications-stage leakage-implications-s1">
    <rect class="leakage-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="leakage-implications-step" x="280" y="142">02</text>
    <text class="leakage-implications-name" x="306" y="142">And the failure appears only in production</text>
    <text class="leakage-implications-desc" x="280" y="166">After the commitment has been</text>
    <text class="leakage-implications-desc" x="280" y="182">made.</text>
  </g>
  <line class="leakage-implications-line leakage-implications-conn leakage-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#leakage-implications-tip)"/>
  <g class="leakage-implications-stage leakage-implications-s2">
    <rect class="leakage-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="leakage-implications-step" x="516" y="142">03</text>
    <text class="leakage-implications-name" x="542" y="142">Detection is usually weeks or months late</text>
    <text class="leakage-implications-desc" x="516" y="166">When live performance is</text>
    <text class="leakage-implications-desc" x="516" y="182">compared to the promise.</text>
  </g>
  <line class="leakage-implications-line leakage-implications-conn leakage-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#leakage-implications-tip)"/>
  <g class="leakage-implications-stage leakage-implications-s3">
    <rect class="leakage-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="leakage-implications-step" x="752" y="142">04</text>
    <text class="leakage-implications-name" x="778" y="142">Which costs organisational trust in the whole approach</text>
    <text class="leakage-implications-desc" x="752" y="166">More than the project itself.</text>
  </g>
  <text class="leakage-implications-sub" x="30" y="304">The reputational cost is the one that lasts: a team that promised a strong model and delivered a weak one is heard differently on the next project.</text>
</svg>
