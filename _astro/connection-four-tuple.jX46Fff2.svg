<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The port is shared. The four-tuple is not.">
  <title>How one port holds ten thousand connections</title>
  <style>
    .connection-four-tuple-bg   { fill: #f8fafc; }
    .connection-four-tuple-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .connection-four-tuple-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .connection-four-tuple-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .connection-four-tuple-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .connection-four-tuple-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .connection-four-tuple-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .connection-four-tuple-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .connection-four-tuple-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .connection-four-tuple-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .connection-four-tuple-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .connection-four-tuple-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .connection-four-tuple-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .connection-four-tuple-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .connection-four-tuple-stage { opacity: 1; }

    .connection-four-tuple-s0 { animation-delay: 0.00s; }
    .connection-four-tuple-e0 { animation-delay: 0.00s; }
    .connection-four-tuple-s1 { animation-delay: 1.28s; }
    .connection-four-tuple-e1 { animation-delay: 1.28s; }
    .connection-four-tuple-s2 { animation-delay: 2.56s; }
    .connection-four-tuple-e2 { animation-delay: 2.56s; }
    .connection-four-tuple-s3 { animation-delay: 3.84s; }
    .connection-four-tuple-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .connection-four-tuple-conn  { animation: connection-four-tuple-trace 6.4s ease-in-out infinite; }
      .connection-four-tuple-stage { animation: connection-four-tuple-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes connection-four-tuple-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes connection-four-tuple-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .connection-four-tuple-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .connection-four-tuple-stage { animation: connection-four-tuple-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes connection-four-tuple-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="connection-four-tuple-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="connection-four-tuple-bg" width="980" height="322"/>
  <text class="connection-four-tuple-h1"  x="30" y="40">How one port holds ten thousand connections</text>
  <text class="connection-four-tuple-sub" x="30" y="64">The port is shared. The four-tuple is not.</text>
  <g class="connection-four-tuple-stage connection-four-tuple-s0">
    <rect class="connection-four-tuple-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="connection-four-tuple-step" x="44" y="142">01</text>
    <text class="connection-four-tuple-name" x="70" y="142">The server listens once</text>
    <text class="connection-four-tuple-desc" x="44" y="166">One socket, bound to port 443,</text>
    <text class="connection-four-tuple-desc" x="44" y="182">waiting.</text>
    <text class="connection-four-tuple-edge" x="44" y="242">1 port</text>
  </g>
  <line class="connection-four-tuple-line connection-four-tuple-conn connection-four-tuple-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#connection-four-tuple-tip)"/>
  <g class="connection-four-tuple-stage connection-four-tuple-s1">
    <rect class="connection-four-tuple-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="connection-four-tuple-step" x="280" y="142">02</text>
    <text class="connection-four-tuple-name" x="306" y="142">Each client arrives differently</text>
    <text class="connection-four-tuple-desc" x="280" y="166">Different source address, or a</text>
    <text class="connection-four-tuple-desc" x="280" y="182">different ephemeral port, or</text>
    <text class="connection-four-tuple-desc" x="280" y="198">both.</text>
  </g>
  <line class="connection-four-tuple-line connection-four-tuple-conn connection-four-tuple-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#connection-four-tuple-tip)"/>
  <g class="connection-four-tuple-stage connection-four-tuple-s2">
    <rect class="connection-four-tuple-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="connection-four-tuple-step" x="516" y="142">03</text>
    <text class="connection-four-tuple-name" x="542" y="142">Four numbers identify each</text>
    <text class="connection-four-tuple-desc" x="516" y="166">src address, src port, dst</text>
    <text class="connection-four-tuple-desc" x="516" y="182">address, dst port — unique per</text>
    <text class="connection-four-tuple-desc" x="516" y="198">connection.</text>
    <text class="connection-four-tuple-edge" x="516" y="242">4-tuple</text>
  </g>
  <line class="connection-four-tuple-line connection-four-tuple-conn connection-four-tuple-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#connection-four-tuple-tip)"/>
  <g class="connection-four-tuple-stage connection-four-tuple-s3">
    <rect class="connection-four-tuple-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="connection-four-tuple-step" x="752" y="142">04</text>
    <text class="connection-four-tuple-name" x="778" y="142">The kernel demultiplexes</text>
    <text class="connection-four-tuple-desc" x="752" y="166">Every arriving packet is matched</text>
    <text class="connection-four-tuple-desc" x="752" y="182">to exactly one connection.</text>
    <text class="connection-four-tuple-edge" x="752" y="242">10,000+</text>
  </g>
  <text class="connection-four-tuple-sub" x="30" y="304">This is why "one port, one connection" is wrong, and why a server's connection limit is about memory and file descriptors rather than about ports.</text>
</svg>
