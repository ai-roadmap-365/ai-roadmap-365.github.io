<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Chat UX Streaming State Machine Flow">
  <title>Chat UX Streaming State Machine Flow</title>
  <defs>
    <style>
      .d318a-bg { fill: #f8fafc; }
      .d318a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d318a-s1 { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d318a-s2 { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d318a-s3 { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 8px; }
      .d318a-s4 { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d318a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d318a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d318a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d318a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d318a-bg" />
  
  <text x="40" y="40" class="d318a-title">Frontend Chat UX Streaming State Machine</text>
  <text x="40" y="65" class="d318a-subtitle">Chat UX Streaming State Machine Flow showing IDLE, OPTIMISTIC_USER_APPEND, STREAMING_TOKENS, SMART_AUTOSCROLL, and COMPLETED / ABORTED states</text>
  
  <!-- State 1: IDLE / User Submits -->
  <rect x="40" y="110" width="180" height="270" class="d318a-s1" />
  <text x="55" y="140" class="d318a-header" fill="#1d4ed8">1. User Submits</text>
  <text x="55" y="170" class="d318a-text">• User types prompt</text>
  <text x="55" y="190" class="d318a-text">• Hits Enter / Submit</text>
  <text x="55" y="210" class="d318a-text">• Optimistic append</text>
  <text x="55" y="230" class="d318a-text">• Show Typing Dots</text>
  <text x="55" y="260" class="d318a-text" font-weight="600">Perceived Latency:</text>
  <text x="55" y="280" class="d318a-text">0ms instant render</text>
  
  <!-- State 2: Fetch & Abort Signal -->
  <rect x="250" y="110" width="180" height="270" class="d318a-s2" />
  <text x="265" y="140" class="d318a-header" fill="#7e22ce">2. Stream Connect</text>
  <text x="265" y="170" class="d318a-text">• `fetch(url, {signal})`</text>
  <text x="265" y="190" class="d318a-text">• `AbortController` ready</text>
  <text x="265" y="210" class="d318a-text">• Stop button enabled</text>
  <text x="265" y="230" class="d318a-text">• Reader stream open</text>
  <text x="265" y="260" class="d318a-text" font-weight="600">Transport:</text>
  <text x="265" y="280" class="d318a-text">SSE `text/event-stream`</text>
  
  <!-- State 3: Active Token Streaming -->
  <rect x="460" y="110" width="180" height="270" class="d318a-s3" />
  <text x="475" y="140" class="d318a-header" fill="#a16207">3. Token Stream</text>
  <text x="475" y="170" class="d318a-text">• Append tokens to UI</text>
  <text x="475" y="190" class="d318a-text">• Incremental markdown</text>
  <text x="475" y="210" class="d318a-text">• Syntax highlighting</text>
  <text x="475" y="230" class="d318a-text">• Smart Auto-Scroll</text>
  <text x="475" y="260" class="d318a-text" font-weight="600">Rate:</text>
  <text x="475" y="280" class="d318a-text">50-100 tokens/sec</text>
  
  <!-- State 4: Stream Termination -->
  <rect x="670" y="110" width="190" height="270" class="d318a-s4" />
  <text x="685" y="140" class="d318a-header" fill="#15803d">4. Complete / Abort</text>
  <text x="685" y="170" class="d318a-text">• Receive `[DONE]` marker</text>
  <text x="685" y="190" class="d318a-text">• Copy button enabled</text>
  <text x="685" y="210" class="d318a-text">• Thumbs Up/Down active</text>
  <text x="685" y="230" class="d318a-text">• Input box re-focused</text>
  <text x="685" y="260" class="d318a-text" font-weight="600">Status:</text>
  <text x="685" y="280" class="d318a-text" fill="#15803d" font-weight="700">IDLE Ready</text>
</svg>