<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Borrowed from elsewhere.">
  <title>Four steps in evaluation metrics</title>
  <style>
    .metrics-history-bg   { fill: #f8fafc; }
    .metrics-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metrics-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metrics-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metrics-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metrics-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metrics-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .metrics-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .metrics-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .metrics-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .metrics-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .metrics-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .metrics-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .metrics-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .metrics-history-stage { opacity: 1; }

    .metrics-history-s0 { animation-delay: 0.00s; }
    .metrics-history-e0 { animation-delay: 0.00s; }
    .metrics-history-s1 { animation-delay: 1.28s; }
    .metrics-history-e1 { animation-delay: 1.28s; }
    .metrics-history-s2 { animation-delay: 2.56s; }
    .metrics-history-e2 { animation-delay: 2.56s; }
    .metrics-history-s3 { animation-delay: 3.84s; }
    .metrics-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .metrics-history-conn  { animation: metrics-history-trace 6.4s ease-in-out infinite; }
      .metrics-history-stage { animation: metrics-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes metrics-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes metrics-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .metrics-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .metrics-history-stage { animation: metrics-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes metrics-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="metrics-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="metrics-history-bg" width="980" height="322"/>
  <text class="metrics-history-h1"  x="30" y="40">Four steps in evaluation metrics</text>
  <text class="metrics-history-sub" x="30" y="64">Borrowed from elsewhere.</text>
  <g class="metrics-history-stage metrics-history-s0">
    <rect class="metrics-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="metrics-history-step" x="44" y="142">01</text>
    <text class="metrics-history-name" x="70" y="142">Signal detection in wartime radar</text>
    <text class="metrics-history-desc" x="44" y="166">Where the curve and its name</text>
    <text class="metrics-history-desc" x="44" y="182">came from.</text>
  </g>
  <line class="metrics-history-line metrics-history-conn metrics-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#metrics-history-tip)"/>
  <g class="metrics-history-stage metrics-history-s1">
    <rect class="metrics-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="metrics-history-step" x="280" y="142">02</text>
    <text class="metrics-history-name" x="306" y="142">Information retrieval adopted precision and recall</text>
    <text class="metrics-history-desc" x="280" y="166">For judging search results.</text>
  </g>
  <line class="metrics-history-line metrics-history-conn metrics-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#metrics-history-tip)"/>
  <g class="metrics-history-stage metrics-history-s2">
    <rect class="metrics-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="metrics-history-step" x="516" y="142">03</text>
    <text class="metrics-history-name" x="542" y="142">Machine learning inherited both</text>
    <text class="metrics-history-desc" x="516" y="166">Along with the confusion matrix.</text>
  </g>
  <line class="metrics-history-line metrics-history-conn metrics-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#metrics-history-tip)"/>
  <g class="metrics-history-stage metrics-history-s3">
    <rect class="metrics-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="metrics-history-step" x="752" y="142">04</text>
    <text class="metrics-history-name" x="778" y="142">And modern AI evaluation still uses them</text>
    <text class="metrics-history-desc" x="752" y="166">For retrieval, moderation and</text>
    <text class="metrics-history-desc" x="752" y="182">safety classifiers alike.</text>
  </g>
  <text class="metrics-history-sub" x="30" y="304">The radar origin explains the curve's odd name and its axes: the question was how many aircraft you detect against how many false alarms you tolerate.</text>
</svg>
