<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" font-family="system-ui, sans-serif">
  <title>A regex engine scanning a string left to right, finding a date match and handing back three captured groups</title>
  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">How the engine scans and captures</text>

  <!-- Pattern -->
  <text x="360" y="70" text-anchor="middle" font-size="14" fill="#1a202c">Pattern applied to the text:</text>
  <rect x="210" y="80" width="300" height="40" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="360" y="107" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" fill="#1a202c">(\d{4})-(\d{2})-(\d{2})</text>

  <!-- Scan direction arrow -->
  <text x="40" y="168" font-size="13" font-weight="bold" fill="#1d4ed8">scan</text>
  <line x1="40" y1="180" x2="560" y2="180" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 5"/>
  <polygon points="568,180 554,173 554,187" fill="#1d4ed8"/>

  <!-- Character strip -->
  <!-- Non-matching lead cells -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" text-anchor="middle">
    <rect x="40" y="196" width="40" height="48" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="60" y="227" fill="#64748b">i</text>
    <rect x="80" y="196" width="40" height="48" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="100" y="227" fill="#64748b">d</text>
    <rect x="120" y="196" width="40" height="48" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="140" y="227" fill="#64748b">·</text>

    <!-- Matched span cells -->
    <rect x="160" y="196" width="40" height="48" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="180" y="227" fill="#1a202c">2</text>
    <rect x="200" y="196" width="40" height="48" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="220" y="227" fill="#1a202c">0</text>
    <rect x="240" y="196" width="40" height="48" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="260" y="227" fill="#1a202c">2</text>
    <rect x="280" y="196" width="40" height="48" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="300" y="227" fill="#1a202c">6</text>
    <rect x="320" y="196" width="40" height="48" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="340" y="227" fill="#1a202c">-</text>
    <rect x="360" y="196" width="40" height="48" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="380" y="227" fill="#1a202c">0</text>
    <rect x="400" y="196" width="40" height="48" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="420" y="227" fill="#1a202c">7</text>
    <rect x="440" y="196" width="40" height="48" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="460" y="227" fill="#1a202c">-</text>
    <rect x="480" y="196" width="40" height="48" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="500" y="227" fill="#1a202c">1</text>
    <rect x="520" y="196" width="40" height="48" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="540" y="227" fill="#1a202c">2</text>
  </g>

  <!-- Match bracket under the matched span -->
  <line x1="160" y1="252" x2="560" y2="252" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="160" y1="252" x2="160" y2="246" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="560" y1="252" x2="560" y2="246" stroke="#1d4ed8" stroke-width="2"/>
  <text x="360" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">whole match found here (no match at i, d, or space)</text>

  <!-- Captures handed back -->
  <text x="360" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Captured pieces handed back</text>

  <rect x="120" y="330" width="140" height="66" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="190" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Group 1 (\1)</text>
  <text x="190" y="380" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" fill="#1a202c">2026</text>

  <rect x="290" y="330" width="140" height="66" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="360" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Group 2 (\2)</text>
  <text x="360" y="380" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" fill="#1a202c">07</text>

  <rect x="460" y="330" width="140" height="66" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="530" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Group 3 (\3)</text>
  <text x="530" y="380" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" fill="#1a202c">12</text>

  <text x="360" y="436" text-anchor="middle" font-size="14" fill="#1a202c">Each parenthesised group photocopies its slice — ready to extract or rebuild as \1-\2-\3.</text>
</svg>
