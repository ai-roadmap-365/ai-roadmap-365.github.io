<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 424" role="img"
     aria-label="There is no undo, and no confirmation dialog.">
  <title>The shell does exactly what you said</title>
  <style>
    .terminal-safety-bg   { fill: #f8fafc; }
    .terminal-safety-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .terminal-safety-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .terminal-safety-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .terminal-safety-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .terminal-safety-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .terminal-safety-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .terminal-safety-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .terminal-safety-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .terminal-safety-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .terminal-safety-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .terminal-safety-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .terminal-safety-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .terminal-safety-row { opacity: 1; }
    .terminal-safety-r0 { animation-delay: 0.00s; }
    .terminal-safety-r1 { animation-delay: 0.45s; }
    .terminal-safety-r2 { animation-delay: 0.90s; }
    .terminal-safety-r3 { animation-delay: 1.35s; }
    .terminal-safety-r4 { animation-delay: 1.80s; }
    .terminal-safety-r5 { animation-delay: 2.25s; }
    .terminal-safety-row { animation: terminal-safety-reveal 7.7s ease-in-out infinite; }
    @keyframes terminal-safety-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="terminal-safety-bg" width="980" height="424"/>
  <text class="terminal-safety-h1"  x="30" y="40">The shell does exactly what you said</text>
  <text class="terminal-safety-sub" x="30" y="64">There is no undo, and no confirmation dialog.</text>
  <rect class="terminal-safety-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="terminal-safety-name" x="46" y="122">How work gets lost</text>
  <text class="terminal-safety-desc" x="46" y="142">Every one of these has cost someone a day.</text>
  <text class="terminal-safety-desc terminal-safety-row terminal-safety-r0" x="46" y="182">rm deletes; there is no recycle bin</text>
  <text class="terminal-safety-desc terminal-safety-row terminal-safety-r1" x="46" y="216">Pasting a command you have not read</text>
  <text class="terminal-safety-desc terminal-safety-row terminal-safety-r2" x="46" y="250">curl some-url | sh — running unseen code</text>
  <text class="terminal-safety-desc terminal-safety-row terminal-safety-r3" x="46" y="284">Secrets as arguments, visible in ps</text>
  <text class="terminal-safety-desc terminal-safety-row terminal-safety-r4" x="46" y="318">Running everything with sudo</text>
  <text class="terminal-safety-desc terminal-safety-row terminal-safety-r5" x="46" y="352">Assuming a trailing slash does nothing</text>
  <rect class="terminal-safety-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="terminal-safety-name" x="526" y="122">How to keep it</text>
  <text class="terminal-safety-desc" x="526" y="142">Habits, not tools.</text>
  <text class="terminal-safety-desc terminal-safety-row terminal-safety-r0" x="526" y="182">Run ls on the target first, then rm</text>
  <text class="terminal-safety-desc terminal-safety-row terminal-safety-r1" x="526" y="216">Read the whole line before pressing Return</text>
  <text class="terminal-safety-desc terminal-safety-row terminal-safety-r2" x="526" y="250">Download, read, then run as two steps</text>
  <text class="terminal-safety-desc terminal-safety-row terminal-safety-r3" x="526" y="284">Secrets in environment variables or files</text>
  <text class="terminal-safety-desc terminal-safety-row terminal-safety-r4" x="526" y="318">sudo only for the one command that needs it</text>
  <text class="terminal-safety-desc terminal-safety-row terminal-safety-r5" x="526" y="352">Check the path you typed, not the one you meant</text>
  <text class="terminal-safety-sub" x="30" y="406">The shell's power and its danger are the same property: it does precisely what you said, immediately, without asking.</text>
</svg>
