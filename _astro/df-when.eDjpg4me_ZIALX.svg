<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when it does not.">
  <title>When a data frame fits</title>
  <style>
    .df-when-bg   { fill: #f8fafc; }
    .df-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .df-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .df-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .df-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .df-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .df-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .df-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .df-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .df-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .df-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .df-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .df-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .df-when-row { opacity: 1; }
    .df-when-r0 { animation-delay: 0.00s; }
    .df-when-r1 { animation-delay: 0.45s; }
    .df-when-r2 { animation-delay: 0.90s; }
    .df-when-r3 { animation-delay: 1.35s; }
    .df-when-r4 { animation-delay: 1.80s; }
    .df-when-row { animation: df-when-reveal 7.3s ease-in-out infinite; }
    @keyframes df-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="df-when-bg" width="980" height="390"/>
  <text class="df-when-h1"  x="30" y="40">When a data frame fits</text>
  <text class="df-when-sub" x="30" y="64">And when it does not.</text>
  <rect class="df-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="df-when-name" x="46" y="122">Use one</text>
  <text class="df-when-desc" x="46" y="142">Four cases.</text>
  <text class="df-when-desc df-when-row df-when-r0" x="46" y="182">Data that fits comfortably in memory</text>
  <text class="df-when-desc df-when-row df-when-r1" x="46" y="216">Exploratory analysis</text>
  <text class="df-when-desc df-when-row df-when-r2" x="46" y="250">Cleaning and reshaping</text>
  <text class="df-when-desc df-when-row df-when-r3" x="46" y="284">Feeding a model</text>
  <text class="df-when-desc df-when-row df-when-r4" x="46" y="318">Anything you want reproducible</text>
  <rect class="df-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="df-when-name" x="526" y="122">Do not</text>
  <text class="df-when-desc" x="526" y="142">Also four.</text>
  <text class="df-when-desc df-when-row df-when-r0" x="526" y="182">Data far larger than memory</text>
  <text class="df-when-desc df-when-row df-when-r1" x="526" y="216">Concurrent multi-user access</text>
  <text class="df-when-desc df-when-row df-when-r2" x="526" y="250">Long-term durable storage</text>
  <text class="df-when-desc df-when-row df-when-r3" x="526" y="284">Streaming, unbounded data</text>
  <text class="df-when-desc df-when-row df-when-r4" x="526" y="318">Where a database query is simpler</text>
  <text class="df-when-sub" x="30" y="372">Pushing work into a database query rather than loading everything is usually the cheapest fix when a data frame starts straining memory.</text>
</svg>
