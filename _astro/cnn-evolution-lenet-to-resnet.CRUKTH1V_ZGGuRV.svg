<svg role="img" aria-label="Timeline evolution of modern CNN architectures from LeNet-5 and AlexNet to VGG-16 and ResNet showing layer depth and structural innovations" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>CNN Architectural Evolution: LeNet-5 to ResNet-50</title>
  <defs>
    <linearGradient id="bg212a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card212" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg212a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">CNN ARCHITECTURAL EVOLUTION (1998 — 2015)</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">From Shallow Hand-Written Digit Recognition to Ultra-Deep Residual Networks</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card212)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- 1998: LeNet-5 -->
    <rect x="25" y="25" width="165" height="245" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="107" y="48" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">LeNet-5 (1998)</text>
    <text x="107" y="66" fill="#94a3b8" font-size="8" text-anchor="middle">Yann LeCun</text>
    <rect x="35" y="80" width="145" height="60" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="107" y="102" fill="#f8fafc" font-size="9" text-anchor="middle">5 Layers (60K params)</text>
    <text x="107" y="122" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">5x5 Conv + AvgPool</text>
    <text x="107" y="165" fill="#cbd5e1" font-size="8" text-anchor="middle">Sigmoid &amp; Tanh Activations</text>
    <text x="107" y="185" fill="#cbd5e1" font-size="8" text-anchor="middle">Handwritten Digits (MNIST)</text>
    <text x="107" y="240" fill="#94a3b8" font-size="8" text-anchor="middle">CPU Era Pioneer</text>

    <!-- 2012: AlexNet -->
    <rect x="205" y="25" width="165" height="245" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="287" y="48" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">AlexNet (2012)</text>
    <text x="287" y="66" fill="#94a3b8" font-size="8" text-anchor="middle">Krizhevsky &amp; Hinton</text>
    <rect x="215" y="80" width="145" height="60" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="287" y="102" fill="#f8fafc" font-size="9" text-anchor="middle">8 Layers (60M params)</text>
    <text x="287" y="122" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">11x11, 5x5, 3x3 + ReLU</text>
    <text x="287" y="165" fill="#cbd5e1" font-size="8" text-anchor="middle">Dropout + MaxPool</text>
    <text x="287" y="185" fill="#cbd5e1" font-size="8" text-anchor="middle">Dual GPU Parallelization</text>
    <text x="287" y="240" fill="#fbbf24" font-size="8" text-anchor="middle">ImageNet Breakthrough</text>

    <!-- 2014: VGG-16 -->
    <rect x="385" y="25" width="165" height="245" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" rx="6"/>
    <text x="467" y="48" fill="#c084fc" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">VGG-16 (2014)</text>
    <text x="467" y="66" fill="#94a3b8" font-size="8" text-anchor="middle">Simonyan &amp; Zisserman</text>
    <rect x="395" y="80" width="145" height="60" fill="#1e293b" stroke="#a855f7" rx="4"/>
    <text x="467" y="102" fill="#f8fafc" font-size="9" text-anchor="middle">16 Layers (138M params)</text>
    <text x="467" y="122" fill="#c084fc" font-size="9" font-weight="700" text-anchor="middle">Homogeneous 3x3 Convs</text>
    <text x="467" y="165" fill="#cbd5e1" font-size="8" text-anchor="middle">Stacked 3x3 = 7x7 Field</text>
    <text x="467" y="185" fill="#cbd5e1" font-size="8" text-anchor="middle">Deeper &amp; Fewer Params</text>
    <text x="467" y="240" fill="#c084fc" font-size="8" text-anchor="middle">Standard Feature Extractor</text>

    <!-- 2015: ResNet-50 -->
    <rect x="565" y="25" width="170" height="245" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="650" y="48" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">ResNet-50 / 152 (2015)</text>
    <text x="650" y="66" fill="#94a3b8" font-size="8" text-anchor="middle">Kaiming He et al.</text>
    <rect x="575" y="80" width="150" height="60" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="650" y="102" fill="#f8fafc" font-size="9" text-anchor="middle">50-152 Layers (25M params)</text>
    <text x="650" y="122" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">Residual Skip Connections</text>
    <text x="650" y="165" fill="#cbd5e1" font-size="8" text-anchor="middle">Solves Vanishing Gradients</text>
    <text x="650" y="185" fill="#cbd5e1" font-size="8" text-anchor="middle">Direct Gradient Highways</text>
    <text x="650" y="240" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Dominant Vision Backbone</text>
  </g>
</svg>
