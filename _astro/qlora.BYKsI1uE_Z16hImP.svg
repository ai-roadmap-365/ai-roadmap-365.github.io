<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which should not work, and does.">
  <title>Fine-tuning a quantised model</title>
  <style>
    .qlora-bg   { fill: #f8fafc; }
    .qlora-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .qlora-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .qlora-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .qlora-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .qlora-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .qlora-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .qlora-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .qlora-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .qlora-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .qlora-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .qlora-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .qlora-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .qlora-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .qlora-stage { opacity: 1; }

    .qlora-s0 { animation-delay: 0.00s; }
    .qlora-e0 { animation-delay: 0.00s; }
    .qlora-s1 { animation-delay: 1.28s; }
    .qlora-e1 { animation-delay: 1.28s; }
    .qlora-s2 { animation-delay: 2.56s; }
    .qlora-e2 { animation-delay: 2.56s; }
    .qlora-s3 { animation-delay: 3.84s; }
    .qlora-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .qlora-conn  { animation: qlora-trace 6.4s ease-in-out infinite; }
      .qlora-stage { animation: qlora-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes qlora-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes qlora-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .qlora-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .qlora-stage { animation: qlora-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes qlora-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="qlora-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="qlora-bg" width="980" height="322"/>
  <text class="qlora-h1"  x="30" y="40">Fine-tuning a quantised model</text>
  <text class="qlora-sub" x="30" y="64">Which should not work, and does.</text>
  <g class="qlora-stage qlora-s0">
    <rect class="qlora-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="qlora-step" x="44" y="142">01</text>
    <text class="qlora-name" x="70" y="142">Quantise the base model to four bits</text>
    <text class="qlora-desc" x="44" y="166">Using a format matched to the</text>
    <text class="qlora-desc" x="44" y="182">weight distribution.</text>
  </g>
  <line class="qlora-line qlora-conn qlora-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#qlora-tip)"/>
  <g class="qlora-stage qlora-s1">
    <rect class="qlora-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="qlora-step" x="280" y="142">02</text>
    <text class="qlora-name" x="306" y="142">Freeze it entirely</text>
    <text class="qlora-desc" x="280" y="166">So the quantisation error never</text>
    <text class="qlora-desc" x="280" y="182">compounds.</text>
  </g>
  <line class="qlora-line qlora-conn qlora-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#qlora-tip)"/>
  <g class="qlora-stage qlora-s2">
    <rect class="qlora-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="qlora-step" x="516" y="142">03</text>
    <text class="qlora-name" x="542" y="142">Train small adapters in higher precision</text>
    <text class="qlora-desc" x="516" y="166">Gradients flow through the</text>
    <text class="qlora-desc" x="516" y="182">quantised weights without</text>
    <text class="qlora-desc" x="516" y="198">updating them.</text>
  </g>
  <line class="qlora-line qlora-conn qlora-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#qlora-tip)"/>
  <g class="qlora-stage qlora-s3">
    <rect class="qlora-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="qlora-step" x="752" y="142">04</text>
    <text class="qlora-name" x="778" y="142">A very large model fine-tuned on one device</text>
    <text class="qlora-desc" x="752" y="166">Which was not previously</text>
    <text class="qlora-desc" x="752" y="182">possible.</text>
  </g>
  <text class="qlora-sub" x="30" y="304">Freezing is what keeps this stable: the quantisation error is a fixed property of the base rather than something the optimiser chases, and the adapters simply learn around it.</text>
</svg>
