<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things it is not</title>
  <style>
    .stdlib-not-bg   { fill: #f8fafc; }
    .stdlib-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stdlib-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stdlib-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stdlib-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stdlib-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stdlib-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stdlib-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stdlib-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stdlib-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stdlib-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stdlib-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stdlib-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stdlib-not-row { opacity: 1; }
    .stdlib-not-r0 { animation-delay: 0.00s; }
    .stdlib-not-r1 { animation-delay: 0.45s; }
    .stdlib-not-r2 { animation-delay: 0.90s; }
    .stdlib-not-r3 { animation-delay: 1.35s; }
    .stdlib-not-r4 { animation-delay: 1.80s; }
    .stdlib-not-row { animation: stdlib-not-reveal 7.3s ease-in-out infinite; }
    @keyframes stdlib-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="stdlib-not-bg" width="980" height="390"/>
  <text class="stdlib-not-h1"  x="30" y="40">Four things it is not</text>
  <text class="stdlib-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="stdlib-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="stdlib-not-name" x="46" y="122">The misconception</text>
  <text class="stdlib-not-desc" x="46" y="142">Commonly held.</text>
  <text class="stdlib-not-desc stdlib-not-row stdlib-not-r0" x="46" y="182">A third-party package is always better</text>
  <text class="stdlib-not-desc stdlib-not-row stdlib-not-r1" x="46" y="216">It is outdated</text>
  <text class="stdlib-not-desc stdlib-not-row stdlib-not-r2" x="46" y="250">Adding a dependency is free</text>
  <text class="stdlib-not-desc stdlib-not-row stdlib-not-r3" x="46" y="284">You must memorise it</text>
  <text class="stdlib-not-desc stdlib-not-row stdlib-not-r4" x="46" y="318">It covers everything</text>
  <rect class="stdlib-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="stdlib-not-name" x="526" y="122">What is true</text>
  <text class="stdlib-not-desc" x="526" y="142">Actually.</text>
  <text class="stdlib-not-desc stdlib-not-row stdlib-not-r0" x="526" y="182">It is often sufficient and always present</text>
  <text class="stdlib-not-desc stdlib-not-row stdlib-not-r1" x="526" y="216">It changes slowly, deliberately</text>
  <text class="stdlib-not-desc stdlib-not-row stdlib-not-r2" x="526" y="250">Each one is code, risk and maintenance</text>
  <text class="stdlib-not-desc stdlib-not-row stdlib-not-r3" x="526" y="284">Knowing what exists is enough</text>
  <text class="stdlib-not-desc stdlib-not-row stdlib-not-r4" x="526" y="318">Numerical and web work still need packages</text>
  <text class="stdlib-not-sub" x="30" y="372">Knowing what exists rather than memorising it is the realistic goal: you cannot use a module you have never heard of, and you can always look up its interface.</text>
</svg>
