<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the purpose.">
  <title>Which interpolation when</title>
  <style>
    .image-when-bg   { fill: #f8fafc; }
    .image-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .image-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .image-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .image-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .image-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .image-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .image-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .image-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .image-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .image-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .image-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .image-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .image-when-row { opacity: 1; }
    .image-when-r0 { animation-delay: 0.00s; }
    .image-when-r1 { animation-delay: 0.45s; }
    .image-when-r2 { animation-delay: 0.90s; }
    .image-when-r3 { animation-delay: 1.35s; }
    .image-when-r4 { animation-delay: 1.80s; }
    .image-when-row { animation: image-when-reveal 7.3s ease-in-out infinite; }
    @keyframes image-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="image-when-bg" width="980" height="390"/>
  <text class="image-when-h1"  x="30" y="40">Which interpolation when</text>
  <text class="image-when-sub" x="30" y="64">By the purpose.</text>
  <rect class="image-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="image-when-name" x="46" y="122">The purpose</text>
  <text class="image-when-desc" x="46" y="142">What you are doing.</text>
  <text class="image-when-desc image-when-row image-when-r0" x="46" y="182">Segmentation masks or label images</text>
  <text class="image-when-desc image-when-row image-when-r1" x="46" y="216">Photographs, general use</text>
  <text class="image-when-desc image-when-row image-when-r2" x="46" y="250">Downscaling by a large factor</text>
  <text class="image-when-desc image-when-row image-when-r3" x="46" y="284">Upscaling for display</text>
  <text class="image-when-desc image-when-row image-when-r4" x="46" y="318">Real-time, many images per second</text>
  <rect class="image-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="image-when-name" x="526" y="122">The method</text>
  <text class="image-when-desc" x="526" y="142">What to use.</text>
  <text class="image-when-desc image-when-row image-when-r0" x="526" y="182">Nearest neighbour, always</text>
  <text class="image-when-desc image-when-row image-when-r1" x="526" y="216">Bilinear</text>
  <text class="image-when-desc image-when-row image-when-r2" x="526" y="250">Area averaging, to avoid aliasing</text>
  <text class="image-when-desc image-when-row image-when-r3" x="526" y="284">Higher order, accepting the cost</text>
  <text class="image-when-desc image-when-row image-when-r4" x="526" y="318">Nearest or bilinear, for speed</text>
  <text class="image-when-sub" x="30" y="372">The first row is a correctness requirement rather than a preference: interpolating between label values invents categories that do not exist.</text>
</svg>
