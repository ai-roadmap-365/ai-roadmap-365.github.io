<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which is what makes citations precise.">
  <title>Indexing sources by sentence</title>
  <style>
    .sentence-index-bg   { fill: #f8fafc; }
    .sentence-index-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sentence-index-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sentence-index-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sentence-index-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sentence-index-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sentence-index-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sentence-index-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sentence-index-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sentence-index-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sentence-index-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sentence-index-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sentence-index-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .sentence-index-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .sentence-index-stage { opacity: 1; }

    .sentence-index-s0 { animation-delay: 0.00s; }
    .sentence-index-e0 { animation-delay: 0.00s; }
    .sentence-index-s1 { animation-delay: 1.28s; }
    .sentence-index-e1 { animation-delay: 1.28s; }
    .sentence-index-s2 { animation-delay: 2.56s; }
    .sentence-index-e2 { animation-delay: 2.56s; }
    .sentence-index-s3 { animation-delay: 3.84s; }
    .sentence-index-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .sentence-index-conn  { animation: sentence-index-trace 6.4s ease-in-out infinite; }
      .sentence-index-stage { animation: sentence-index-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes sentence-index-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes sentence-index-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .sentence-index-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .sentence-index-stage { animation: sentence-index-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes sentence-index-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="sentence-index-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="sentence-index-bg" width="980" height="322"/>
  <text class="sentence-index-h1"  x="30" y="40">Indexing sources by sentence</text>
  <text class="sentence-index-sub" x="30" y="64">Which is what makes citations precise.</text>
  <g class="sentence-index-stage sentence-index-s0">
    <rect class="sentence-index-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="sentence-index-step" x="44" y="142">01</text>
    <text class="sentence-index-name" x="70" y="142">A document-level citation is nearly useless</text>
    <text class="sentence-index-desc" x="44" y="166">It points at forty pages.</text>
  </g>
  <line class="sentence-index-line sentence-index-conn sentence-index-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#sentence-index-tip)"/>
  <g class="sentence-index-stage sentence-index-s1">
    <rect class="sentence-index-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="sentence-index-step" x="280" y="142">02</text>
    <text class="sentence-index-name" x="306" y="142">So split the retrieved passages into sentences</text>
    <text class="sentence-index-desc" x="280" y="166">Each independently addressable.</text>
  </g>
  <line class="sentence-index-line sentence-index-conn sentence-index-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#sentence-index-tip)"/>
  <g class="sentence-index-stage sentence-index-s2">
    <rect class="sentence-index-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="sentence-index-step" x="516" y="142">03</text>
    <text class="sentence-index-name" x="542" y="142">Keep the offsets back to the source</text>
    <text class="sentence-index-desc" x="516" y="166">So the citation can highlight</text>
    <text class="sentence-index-desc" x="516" y="182">the exact text.</text>
  </g>
  <line class="sentence-index-line sentence-index-conn sentence-index-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#sentence-index-tip)"/>
  <g class="sentence-index-stage sentence-index-s3">
    <rect class="sentence-index-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="sentence-index-step" x="752" y="142">04</text>
    <text class="sentence-index-name" x="778" y="142">And a reader can verify in seconds</text>
    <text class="sentence-index-desc" x="752" y="166">Which is the whole point of a</text>
    <text class="sentence-index-desc" x="752" y="182">citation.</text>
  </g>
  <text class="sentence-index-sub" x="30" y="304">Verification time is the metric that matters here: a citation a reader will not check because checking takes ten minutes is functionally the same as no citation.</text>
</svg>
