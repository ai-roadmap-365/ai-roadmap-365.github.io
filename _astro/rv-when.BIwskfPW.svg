<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the process.">
  <title>Which distribution when</title>
  <style>
    .rv-when-bg   { fill: #f8fafc; }
    .rv-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rv-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rv-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rv-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rv-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rv-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rv-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rv-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rv-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rv-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rv-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rv-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rv-when-row { opacity: 1; }
    .rv-when-r0 { animation-delay: 0.00s; }
    .rv-when-r1 { animation-delay: 0.45s; }
    .rv-when-r2 { animation-delay: 0.90s; }
    .rv-when-r3 { animation-delay: 1.35s; }
    .rv-when-r4 { animation-delay: 1.80s; }
    .rv-when-row { animation: rv-when-reveal 7.3s ease-in-out infinite; }
    @keyframes rv-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="rv-when-bg" width="980" height="390"/>
  <text class="rv-when-h1"  x="30" y="40">Which distribution when</text>
  <text class="rv-when-sub" x="30" y="64">By the process.</text>
  <rect class="rv-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="rv-when-name" x="46" y="122">The process</text>
  <text class="rv-when-desc" x="46" y="142">What generates the data.</text>
  <text class="rv-when-desc rv-when-row rv-when-r0" x="46" y="182">Successes in a fixed number of trials</text>
  <text class="rv-when-desc rv-when-row rv-when-r1" x="46" y="216">Counts of events in an interval</text>
  <text class="rv-when-desc rv-when-row rv-when-r2" x="46" y="250">Many small independent additive effects</text>
  <text class="rv-when-desc rv-when-row rv-when-r3" x="46" y="284">Multiplicative effects</text>
  <text class="rv-when-desc rv-when-row rv-when-r4" x="46" y="318">Extremes and winner-take-all</text>
  <rect class="rv-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="rv-when-name" x="526" y="122">The family</text>
  <text class="rv-when-desc" x="526" y="142">What to assume.</text>
  <text class="rv-when-desc rv-when-row rv-when-r0" x="526" y="182">Binomial</text>
  <text class="rv-when-desc rv-when-row rv-when-r1" x="526" y="216">Poisson</text>
  <text class="rv-when-desc rv-when-row rv-when-r2" x="526" y="250">Normal</text>
  <text class="rv-when-desc rv-when-row rv-when-r3" x="526" y="284">Log-normal</text>
  <text class="rv-when-desc rv-when-row rv-when-r4" x="526" y="318">A heavy-tailed family</text>
  <text class="rv-when-sub" x="30" y="372">Multiplicative effects giving a log-normal rather than a normal is the row most often missed, and it applies to a great deal of biological and economic data.</text>
</svg>
