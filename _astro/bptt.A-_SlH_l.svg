<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Unroll, then apply the chain rule.">
  <title>Backpropagation through time</title>
  <style>
    .bptt-bg   { fill: #f8fafc; }
    .bptt-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bptt-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bptt-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bptt-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bptt-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bptt-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bptt-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bptt-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bptt-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bptt-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bptt-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bptt-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .bptt-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .bptt-stage { opacity: 1; }

    .bptt-s0 { animation-delay: 0.00s; }
    .bptt-e0 { animation-delay: 0.00s; }
    .bptt-s1 { animation-delay: 1.28s; }
    .bptt-e1 { animation-delay: 1.28s; }
    .bptt-s2 { animation-delay: 2.56s; }
    .bptt-e2 { animation-delay: 2.56s; }
    .bptt-s3 { animation-delay: 3.84s; }
    .bptt-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .bptt-conn  { animation: bptt-trace 6.4s ease-in-out infinite; }
      .bptt-stage { animation: bptt-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes bptt-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes bptt-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .bptt-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .bptt-stage { animation: bptt-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes bptt-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="bptt-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="bptt-bg" width="980" height="322"/>
  <text class="bptt-h1"  x="30" y="40">Backpropagation through time</text>
  <text class="bptt-sub" x="30" y="64">Unroll, then apply the chain rule.</text>
  <g class="bptt-stage bptt-s0">
    <rect class="bptt-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="bptt-step" x="44" y="142">01</text>
    <text class="bptt-name" x="70" y="142">Unroll the loop</text>
    <text class="bptt-desc" x="44" y="166">A T-step sequence becomes a</text>
    <text class="bptt-desc" x="44" y="182">T-layer feedforward network.</text>
  </g>
  <line class="bptt-line bptt-conn bptt-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#bptt-tip)"/>
  <g class="bptt-stage bptt-s1">
    <rect class="bptt-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="bptt-step" x="280" y="142">02</text>
    <text class="bptt-name" x="306" y="142">Backpropagate through all of it</text>
    <text class="bptt-desc" x="280" y="166">Gradients from every step</text>
    <text class="bptt-desc" x="280" y="182">accumulate into the shared</text>
    <text class="bptt-desc" x="280" y="198">weights.</text>
  </g>
  <line class="bptt-line bptt-conn bptt-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#bptt-tip)"/>
  <g class="bptt-stage bptt-s2">
    <rect class="bptt-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="bptt-step" x="516" y="142">03</text>
    <text class="bptt-name" x="542" y="142">Which multiplies T Jacobians</text>
    <text class="bptt-desc" x="516" y="166">The same chain-rule product as</text>
    <text class="bptt-desc" x="516" y="182">depth, with time steps instead</text>
    <text class="bptt-desc" x="516" y="198">of layers.</text>
  </g>
  <line class="bptt-line bptt-conn bptt-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#bptt-tip)"/>
  <g class="bptt-stage bptt-s3">
    <rect class="bptt-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="bptt-step" x="752" y="142">04</text>
    <text class="bptt-name" x="778" y="142">So long sequences are truncated</text>
    <text class="bptt-desc" x="752" y="166">Backpropagate a fixed window</text>
    <text class="bptt-desc" x="752" y="182">rather than the whole sequence.</text>
  </g>
  <text class="bptt-sub" x="30" y="304">Truncation is a practical necessity rather than an approximation anyone likes: it bounds memory and compute, and it also bounds the dependencies the model can learn.</text>
</svg>
