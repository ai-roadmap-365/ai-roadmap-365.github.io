<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One is a risk.">
  <title>Four consequences of compression</title>
  <style>
    .compression-implications-bg   { fill: #f8fafc; }
    .compression-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compression-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compression-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compression-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compression-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compression-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .compression-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .compression-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .compression-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .compression-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .compression-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .compression-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .compression-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .compression-implications-stage { opacity: 1; }

    .compression-implications-s0 { animation-delay: 0.00s; }
    .compression-implications-e0 { animation-delay: 0.00s; }
    .compression-implications-s1 { animation-delay: 1.28s; }
    .compression-implications-e1 { animation-delay: 1.28s; }
    .compression-implications-s2 { animation-delay: 2.56s; }
    .compression-implications-e2 { animation-delay: 2.56s; }
    .compression-implications-s3 { animation-delay: 3.84s; }
    .compression-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .compression-implications-conn  { animation: compression-implications-trace 6.4s ease-in-out infinite; }
      .compression-implications-stage { animation: compression-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes compression-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes compression-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .compression-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .compression-implications-stage { animation: compression-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes compression-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="compression-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="compression-implications-bg" width="980" height="322"/>
  <text class="compression-implications-h1"  x="30" y="40">Four consequences of compression</text>
  <text class="compression-implications-sub" x="30" y="64">One is a risk.</text>
  <g class="compression-implications-stage compression-implications-s0">
    <rect class="compression-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="compression-implications-step" x="44" y="142">01</text>
    <text class="compression-implications-name" x="70" y="142">Serving cost falls sharply</text>
    <text class="compression-implications-desc" x="44" y="166">Less memory traffic, more</text>
    <text class="compression-implications-desc" x="44" y="182">requests per device.</text>
  </g>
  <line class="compression-implications-line compression-implications-conn compression-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#compression-implications-tip)"/>
  <g class="compression-implications-stage compression-implications-s1">
    <rect class="compression-implications-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="compression-implications-step" x="280" y="142">02</text>
    <text class="compression-implications-name" x="306" y="142">And deployment reach widens</text>
    <text class="compression-implications-desc" x="280" y="166">Phones, browsers, ordinary</text>
    <text class="compression-implications-desc" x="280" y="182">servers.</text>
  </g>
  <line class="compression-implications-line compression-implications-conn compression-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#compression-implications-tip)"/>
  <g class="compression-implications-stage compression-implications-s2">
    <rect class="compression-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="compression-implications-step" x="516" y="142">03</text>
    <text class="compression-implications-name" x="542" y="142">Accuracy loss is small but real</text>
    <text class="compression-implications-desc" x="516" y="166">Measure it on your task, not on</text>
    <text class="compression-implications-desc" x="516" y="182">a benchmark.</text>
  </g>
  <line class="compression-implications-line compression-implications-conn compression-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#compression-implications-tip)"/>
  <g class="compression-implications-stage compression-implications-s3">
    <rect class="compression-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="compression-implications-step" x="752" y="142">04</text>
    <text class="compression-implications-name" x="778" y="142">And rare behaviours can change disproportionately</text>
    <text class="compression-implications-desc" x="752" y="166">Averages hide this. Test the</text>
    <text class="compression-implications-desc" x="752" y="182">tails.</text>
  </g>
  <text class="compression-implications-sub" x="30" y="304">Aggregate accuracy holding while specific behaviours degrade is the failure mode that reaches production, because the evaluation that would have caught it was averaged.</text>
</svg>
