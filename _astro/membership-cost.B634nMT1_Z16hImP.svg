<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four facts.">
  <title>The cost that decides the container</title>
  <style>
    .membership-cost-bg   { fill: #f8fafc; }
    .membership-cost-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .membership-cost-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .membership-cost-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .membership-cost-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .membership-cost-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .membership-cost-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .membership-cost-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .membership-cost-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .membership-cost-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .membership-cost-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .membership-cost-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .membership-cost-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .membership-cost-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .membership-cost-stage { opacity: 1; }

    .membership-cost-s0 { animation-delay: 0.00s; }
    .membership-cost-e0 { animation-delay: 0.00s; }
    .membership-cost-s1 { animation-delay: 1.28s; }
    .membership-cost-e1 { animation-delay: 1.28s; }
    .membership-cost-s2 { animation-delay: 2.56s; }
    .membership-cost-e2 { animation-delay: 2.56s; }
    .membership-cost-s3 { animation-delay: 3.84s; }
    .membership-cost-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .membership-cost-conn  { animation: membership-cost-trace 6.4s ease-in-out infinite; }
      .membership-cost-stage { animation: membership-cost-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes membership-cost-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes membership-cost-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .membership-cost-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .membership-cost-stage { animation: membership-cost-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes membership-cost-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="membership-cost-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="membership-cost-bg" width="980" height="322"/>
  <text class="membership-cost-h1"  x="30" y="40">The cost that decides the container</text>
  <text class="membership-cost-sub" x="30" y="64">Four facts.</text>
  <g class="membership-cost-stage membership-cost-s0">
    <rect class="membership-cost-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="membership-cost-step" x="44" y="142">01</text>
    <text class="membership-cost-name" x="70" y="142">Testing membership in a list scans it</text>
    <text class="membership-cost-desc" x="44" y="166">Linear in its length.</text>
  </g>
  <line class="membership-cost-line membership-cost-conn membership-cost-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#membership-cost-tip)"/>
  <g class="membership-cost-stage membership-cost-s1">
    <rect class="membership-cost-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="membership-cost-step" x="280" y="142">02</text>
    <text class="membership-cost-name" x="306" y="142">In a set or a dictionary it is constant</text>
    <text class="membership-cost-desc" x="280" y="166">Independent of size.</text>
  </g>
  <line class="membership-cost-line membership-cost-conn membership-cost-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#membership-cost-tip)"/>
  <g class="membership-cost-stage membership-cost-s2">
    <rect class="membership-cost-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="membership-cost-step" x="516" y="142">03</text>
    <text class="membership-cost-name" x="542" y="142">So a membership test inside a loop over a list is quadratic</text>
    <text class="membership-cost-desc" x="516" y="166">Which is the commonest</text>
    <text class="membership-cost-desc" x="516" y="182">accidental slowdown.</text>
  </g>
  <line class="membership-cost-line membership-cost-conn membership-cost-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#membership-cost-tip)"/>
  <g class="membership-cost-stage membership-cost-s3">
    <rect class="membership-cost-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="membership-cost-step" x="752" y="142">04</text>
    <text class="membership-cost-name" x="778" y="142">And converting to a set first makes it linear</text>
    <text class="membership-cost-desc" x="752" y="166">Usually a single added line.</text>
    <text class="membership-cost-edge" x="752" y="242">one line</text>
  </g>
  <text class="membership-cost-sub" x="30" y="304">This is the highest-return single-line change available in data code, and it turns a run that takes an hour into one that takes seconds.</text>
</svg>
