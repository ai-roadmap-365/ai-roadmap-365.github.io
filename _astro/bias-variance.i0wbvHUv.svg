<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three sources of error.">
  <title>The decomposition</title>
  <style>
    .bias-variance-bg   { fill: #f8fafc; }
    .bias-variance-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bias-variance-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bias-variance-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bias-variance-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bias-variance-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bias-variance-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bias-variance-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bias-variance-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bias-variance-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bias-variance-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bias-variance-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bias-variance-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .bias-variance-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .bias-variance-stage { opacity: 1; }

    .bias-variance-s0 { animation-delay: 0.00s; }
    .bias-variance-e0 { animation-delay: 0.00s; }
    .bias-variance-s1 { animation-delay: 1.50s; }
    .bias-variance-e1 { animation-delay: 1.50s; }
    .bias-variance-s2 { animation-delay: 3.00s; }
    .bias-variance-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .bias-variance-conn  { animation: bias-variance-trace 6s ease-in-out infinite; }
      .bias-variance-stage { animation: bias-variance-arrive 6s ease-in-out infinite; }
    }
    @keyframes bias-variance-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes bias-variance-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .bias-variance-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .bias-variance-stage { animation: bias-variance-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes bias-variance-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="bias-variance-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="bias-variance-bg" width="980" height="322"/>
  <text class="bias-variance-h1"  x="30" y="40">The decomposition</text>
  <text class="bias-variance-sub" x="30" y="64">Three sources of error.</text>
  <g class="bias-variance-stage bias-variance-s0">
    <rect class="bias-variance-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="bias-variance-step" x="44" y="142">01</text>
    <text class="bias-variance-name" x="70" y="142">Bias</text>
    <text class="bias-variance-desc" x="44" y="166">The model is too simple to represent the</text>
    <text class="bias-variance-desc" x="44" y="182">pattern. Wrong on average.</text>
  </g>
  <line class="bias-variance-line bias-variance-conn bias-variance-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#bias-variance-tip)"/>
  <g class="bias-variance-stage bias-variance-s1">
    <rect class="bias-variance-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="bias-variance-step" x="359" y="142">02</text>
    <text class="bias-variance-name" x="385" y="142">Variance</text>
    <text class="bias-variance-desc" x="359" y="166">The model is too sensitive to the particular</text>
    <text class="bias-variance-desc" x="359" y="182">training sample.</text>
  </g>
  <line class="bias-variance-line bias-variance-conn bias-variance-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#bias-variance-tip)"/>
  <g class="bias-variance-stage bias-variance-s2">
    <rect class="bias-variance-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="bias-variance-step" x="674" y="142">03</text>
    <text class="bias-variance-name" x="700" y="142">Irreducible noise</text>
    <text class="bias-variance-desc" x="674" y="166">Randomness in the data itself. No model</text>
    <text class="bias-variance-desc" x="674" y="182">removes it.</text>
  </g>
  <text class="bias-variance-sub" x="30" y="304">The third term is the floor: if it is large, a model near it is finished, and further effort is spent chasing noise.</text>
</svg>
