<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One is a trap.">
  <title>Four consequences of pattern-based prompting</title>
  <style>
    .pattern-implications-bg   { fill: #f8fafc; }
    .pattern-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pattern-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pattern-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pattern-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pattern-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pattern-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pattern-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pattern-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pattern-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pattern-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pattern-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pattern-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pattern-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pattern-implications-stage { opacity: 1; }

    .pattern-implications-s0 { animation-delay: 0.00s; }
    .pattern-implications-e0 { animation-delay: 0.00s; }
    .pattern-implications-s1 { animation-delay: 1.28s; }
    .pattern-implications-e1 { animation-delay: 1.28s; }
    .pattern-implications-s2 { animation-delay: 2.56s; }
    .pattern-implications-e2 { animation-delay: 2.56s; }
    .pattern-implications-s3 { animation-delay: 3.84s; }
    .pattern-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .pattern-implications-conn  { animation: pattern-implications-trace 6.4s ease-in-out infinite; }
      .pattern-implications-stage { animation: pattern-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes pattern-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pattern-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pattern-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pattern-implications-stage { animation: pattern-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pattern-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pattern-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pattern-implications-bg" width="980" height="322"/>
  <text class="pattern-implications-h1"  x="30" y="40">Four consequences of pattern-based prompting</text>
  <text class="pattern-implications-sub" x="30" y="64">One is a trap.</text>
  <g class="pattern-implications-stage pattern-implications-s0">
    <rect class="pattern-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="pattern-implications-step" x="44" y="142">01</text>
    <text class="pattern-implications-name" x="70" y="142">Output becomes consistent across the product</text>
    <text class="pattern-implications-desc" x="44" y="166">Because the same structures are</text>
    <text class="pattern-implications-desc" x="44" y="182">used everywhere.</text>
  </g>
  <line class="pattern-implications-line pattern-implications-conn pattern-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#pattern-implications-tip)"/>
  <g class="pattern-implications-stage pattern-implications-s1">
    <rect class="pattern-implications-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="pattern-implications-step" x="280" y="142">02</text>
    <text class="pattern-implications-name" x="306" y="142">And maintenance concentrates</text>
    <text class="pattern-implications-desc" x="280" y="166">One fragment updated, every</text>
    <text class="pattern-implications-desc" x="280" y="182">prompt improved.</text>
  </g>
  <line class="pattern-implications-line pattern-implications-conn pattern-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#pattern-implications-tip)"/>
  <g class="pattern-implications-stage pattern-implications-s2">
    <rect class="pattern-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="pattern-implications-step" x="516" y="142">03</text>
    <text class="pattern-implications-name" x="542" y="142">But templating adds an injection surface</text>
    <text class="pattern-implications-desc" x="516" y="166">Which plain strings did not</text>
    <text class="pattern-implications-desc" x="516" y="182">have.</text>
  </g>
  <line class="pattern-implications-line pattern-implications-conn pattern-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#pattern-implications-tip)"/>
  <g class="pattern-implications-stage pattern-implications-s3">
    <rect class="pattern-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="pattern-implications-step" x="752" y="142">04</text>
    <text class="pattern-implications-name" x="778" y="142">And abstraction can go too far</text>
    <text class="pattern-implications-desc" x="752" y="166">A template nobody can read is</text>
    <text class="pattern-implications-desc" x="752" y="182">worse than a duplicated string.</text>
  </g>
  <text class="pattern-implications-sub" x="30" y="304">Over-abstraction is a genuine risk here and it arrives quickly: prompts are read by people reasoning about model behaviour, and a deeply nested template defeats that.</text>
</svg>
