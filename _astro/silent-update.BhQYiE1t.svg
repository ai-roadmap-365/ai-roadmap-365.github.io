<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A reproducibility problem.">
  <title>The model changed and nobody told you</title>
  <style>
    .silent-update-bg   { fill: #f8fafc; }
    .silent-update-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .silent-update-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .silent-update-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .silent-update-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .silent-update-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .silent-update-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .silent-update-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .silent-update-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .silent-update-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .silent-update-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .silent-update-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .silent-update-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .silent-update-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .silent-update-stage { opacity: 1; }

    .silent-update-s0 { animation-delay: 0.00s; }
    .silent-update-e0 { animation-delay: 0.00s; }
    .silent-update-s1 { animation-delay: 1.28s; }
    .silent-update-e1 { animation-delay: 1.28s; }
    .silent-update-s2 { animation-delay: 2.56s; }
    .silent-update-e2 { animation-delay: 2.56s; }
    .silent-update-s3 { animation-delay: 3.84s; }
    .silent-update-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .silent-update-conn  { animation: silent-update-trace 6.4s ease-in-out infinite; }
      .silent-update-stage { animation: silent-update-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes silent-update-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes silent-update-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .silent-update-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .silent-update-stage { animation: silent-update-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes silent-update-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="silent-update-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="silent-update-bg" width="980" height="322"/>
  <text class="silent-update-h1"  x="30" y="40">The model changed and nobody told you</text>
  <text class="silent-update-sub" x="30" y="64">A reproducibility problem.</text>
  <g class="silent-update-stage silent-update-s0">
    <rect class="silent-update-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="silent-update-step" x="44" y="142">01</text>
    <text class="silent-update-name" x="70" y="142">You call a model by name</text>
    <text class="silent-update-desc" x="44" y="166">Which points at whatever version</text>
    <text class="silent-update-desc" x="44" y="182">is current.</text>
  </g>
  <line class="silent-update-line silent-update-conn silent-update-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#silent-update-tip)"/>
  <g class="silent-update-stage silent-update-s1">
    <rect class="silent-update-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="silent-update-step" x="280" y="142">02</text>
    <text class="silent-update-name" x="306" y="142">The provider updates it</text>
    <text class="silent-update-desc" x="280" y="166">Improving the average, changing</text>
    <text class="silent-update-desc" x="280" y="182">the specifics.</text>
  </g>
  <line class="silent-update-line silent-update-conn silent-update-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#silent-update-tip)"/>
  <g class="silent-update-stage silent-update-s2">
    <rect class="silent-update-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="silent-update-step" x="516" y="142">03</text>
    <text class="silent-update-name" x="542" y="142">Your prompts behave differently</text>
    <text class="silent-update-desc" x="516" y="166">With no deployment on your side</text>
    <text class="silent-update-desc" x="516" y="182">to blame.</text>
  </g>
  <line class="silent-update-line silent-update-conn silent-update-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#silent-update-tip)"/>
  <g class="silent-update-stage silent-update-s3">
    <rect class="silent-update-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="silent-update-step" x="752" y="142">04</text>
    <text class="silent-update-name" x="778" y="142">Pin the version, and evaluate on a schedule</text>
    <text class="silent-update-desc" x="752" y="166">Which turns a mystery into a</text>
    <text class="silent-update-desc" x="752" y="182">scheduled decision.</text>
  </g>
  <text class="silent-update-sub" x="30" y="304">Self-hosted weights do not have this failure mode at all, which is a genuine argument for open models that has nothing to do with cost or capability.</text>
</svg>
