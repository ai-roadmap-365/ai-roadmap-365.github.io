<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties, one round trip.">
  <title>Placing a hold atomically</title>
  <style>
    .atomic-holds-bg   { fill: #f8fafc; }
    .atomic-holds-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .atomic-holds-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .atomic-holds-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .atomic-holds-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .atomic-holds-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .atomic-holds-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .atomic-holds-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .atomic-holds-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .atomic-holds-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .atomic-holds-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .atomic-holds-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .atomic-holds-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .atomic-holds-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .atomic-holds-stage { opacity: 1; }

    .atomic-holds-s0 { animation-delay: 0.00s; }
    .atomic-holds-e0 { animation-delay: 0.00s; }
    .atomic-holds-s1 { animation-delay: 1.28s; }
    .atomic-holds-e1 { animation-delay: 1.28s; }
    .atomic-holds-s2 { animation-delay: 2.56s; }
    .atomic-holds-e2 { animation-delay: 2.56s; }
    .atomic-holds-s3 { animation-delay: 3.84s; }
    .atomic-holds-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .atomic-holds-conn  { animation: atomic-holds-trace 6.4s ease-in-out infinite; }
      .atomic-holds-stage { animation: atomic-holds-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes atomic-holds-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes atomic-holds-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .atomic-holds-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .atomic-holds-stage { animation: atomic-holds-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes atomic-holds-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="atomic-holds-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="atomic-holds-bg" width="980" height="322"/>
  <text class="atomic-holds-h1"  x="30" y="40">Placing a hold atomically</text>
  <text class="atomic-holds-sub" x="30" y="64">Four properties, one round trip.</text>
  <g class="atomic-holds-stage atomic-holds-s0">
    <rect class="atomic-holds-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="atomic-holds-step" x="44" y="142">01</text>
    <text class="atomic-holds-name" x="70" y="142">Check and reserve together</text>
    <text class="atomic-holds-desc" x="44" y="166">One operation. A separate read</text>
    <text class="atomic-holds-desc" x="44" y="182">and write is a race.</text>
  </g>
  <line class="atomic-holds-line atomic-holds-conn atomic-holds-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#atomic-holds-tip)"/>
  <g class="atomic-holds-stage atomic-holds-s1">
    <rect class="atomic-holds-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="atomic-holds-step" x="280" y="142">02</text>
    <text class="atomic-holds-name" x="306" y="142">In a single round trip</text>
    <text class="atomic-holds-desc" x="280" y="166">A server-side script, or a row</text>
    <text class="atomic-holds-desc" x="280" y="182">lock in a transaction.</text>
  </g>
  <line class="atomic-holds-line atomic-holds-conn atomic-holds-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#atomic-holds-tip)"/>
  <g class="atomic-holds-stage atomic-holds-s2">
    <rect class="atomic-holds-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="atomic-holds-step" x="516" y="142">03</text>
    <text class="atomic-holds-name" x="542" y="142">With a TTL on the hold</text>
    <text class="atomic-holds-desc" x="516" y="166">120 seconds, so a crashed worker</text>
    <text class="atomic-holds-desc" x="516" y="182">does not freeze funds.</text>
    <text class="atomic-holds-edge" x="516" y="242">expiry</text>
  </g>
  <line class="atomic-holds-line atomic-holds-conn atomic-holds-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#atomic-holds-tip)"/>
  <g class="atomic-holds-stage atomic-holds-s3">
    <rect class="atomic-holds-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="atomic-holds-step" x="752" y="142">04</text>
    <text class="atomic-holds-name" x="778" y="142">Preventing the concurrent overdraw</text>
    <text class="atomic-holds-desc" x="752" y="166">Twenty simultaneous requests</text>
    <text class="atomic-holds-desc" x="752" y="182">against one cent cannot all</text>
    <text class="atomic-holds-desc" x="752" y="198">pass.</text>
  </g>
  <text class="atomic-holds-sub" x="30" y="304">The race the atomicity prevents is not theoretical: twenty concurrent requests each reading the same balance and each deciding it is sufficient is the normal behaviour of a check-then-act implementation.</text>
</svg>
