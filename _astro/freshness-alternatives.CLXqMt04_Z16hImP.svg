<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And why comparison is still needed.">
  <title>Four ways to bound staleness</title>
  <style>
    .freshness-alternatives-bg   { fill: #f8fafc; }
    .freshness-alternatives-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-alternatives-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-alternatives-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-alternatives-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-alternatives-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-alternatives-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .freshness-alternatives-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .freshness-alternatives-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .freshness-alternatives-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .freshness-alternatives-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .freshness-alternatives-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .freshness-alternatives-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .freshness-alternatives-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .freshness-alternatives-stage { opacity: 1; }

    .freshness-alternatives-s0 { animation-delay: 0.00s; }
    .freshness-alternatives-e0 { animation-delay: 0.00s; }
    .freshness-alternatives-s1 { animation-delay: 1.28s; }
    .freshness-alternatives-e1 { animation-delay: 1.28s; }
    .freshness-alternatives-s2 { animation-delay: 2.56s; }
    .freshness-alternatives-e2 { animation-delay: 2.56s; }
    .freshness-alternatives-s3 { animation-delay: 3.84s; }
    .freshness-alternatives-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .freshness-alternatives-conn  { animation: freshness-alternatives-trace 6.4s ease-in-out infinite; }
      .freshness-alternatives-stage { animation: freshness-alternatives-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes freshness-alternatives-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes freshness-alternatives-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .freshness-alternatives-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .freshness-alternatives-stage { animation: freshness-alternatives-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes freshness-alternatives-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="freshness-alternatives-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="freshness-alternatives-bg" width="980" height="322"/>
  <text class="freshness-alternatives-h1"  x="30" y="40">Four ways to bound staleness</text>
  <text class="freshness-alternatives-sub" x="30" y="64">And why comparison is still needed.</text>
  <g class="freshness-alternatives-stage freshness-alternatives-s0">
    <rect class="freshness-alternatives-good" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="freshness-alternatives-step" x="44" y="142">01</text>
    <text class="freshness-alternatives-name" x="70" y="142">Scheduled full rebuild</text>
    <text class="freshness-alternatives-desc" x="44" y="166">Correct by construction, no</text>
    <text class="freshness-alternatives-desc" x="44" y="182">deletion bug. Affordable only</text>
    <text class="freshness-alternatives-desc" x="44" y="198">for small corpora.</text>
  </g>
  <line class="freshness-alternatives-line freshness-alternatives-conn freshness-alternatives-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#freshness-alternatives-tip)"/>
  <g class="freshness-alternatives-stage freshness-alternatives-s1">
    <rect class="freshness-alternatives-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="freshness-alternatives-step" x="280" y="142">02</text>
    <text class="freshness-alternatives-name" x="306" y="142">Per-document TTL</text>
    <text class="freshness-alternatives-desc" x="280" y="166">Bounds staleness without</text>
    <text class="freshness-alternatives-desc" x="280" y="182">comparison. Does nothing for</text>
    <text class="freshness-alternatives-desc" x="280" y="198">orphans.</text>
  </g>
  <line class="freshness-alternatives-line freshness-alternatives-conn freshness-alternatives-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#freshness-alternatives-tip)"/>
  <g class="freshness-alternatives-stage freshness-alternatives-s2">
    <rect class="freshness-alternatives-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="freshness-alternatives-step" x="516" y="142">03</text>
    <text class="freshness-alternatives-name" x="542" y="142">Change data capture</text>
    <text class="freshness-alternatives-desc" x="516" y="166">Subscribe to the source's change</text>
    <text class="freshness-alternatives-desc" x="516" y="182">log, including deletes. Lowest</text>
    <text class="freshness-alternatives-desc" x="516" y="198">latency, most machinery.</text>
  </g>
  <line class="freshness-alternatives-line freshness-alternatives-conn freshness-alternatives-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#freshness-alternatives-tip)"/>
  <g class="freshness-alternatives-stage freshness-alternatives-s3">
    <rect class="freshness-alternatives-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="freshness-alternatives-step" x="752" y="142">04</text>
    <text class="freshness-alternatives-name" x="778" y="142">Atomic alias swap</text>
    <text class="freshness-alternatives-desc" x="752" y="166">Build a new index, verify, flip</text>
    <text class="freshness-alternatives-desc" x="752" y="182">the pointer. Rebuild without a</text>
    <text class="freshness-alternatives-desc" x="752" y="198">serving gap.</text>
  </g>
  <text class="freshness-alternatives-sub" x="30" y="304">The honest default combines two of these: incremental updates for cost, plus a scheduled full comparison as the safety net that catches whatever the incremental path missed.</text>
</svg>
