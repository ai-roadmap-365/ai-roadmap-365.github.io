<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Most debugging time goes on establishing where something broke, not why.">
  <title>Reproduce at the lowest level that still shows the problem</title>
  <style>
    .where-did-it-break-bg   { fill: #f8fafc; }
    .where-did-it-break-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .where-did-it-break-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .where-did-it-break-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .where-did-it-break-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .where-did-it-break-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .where-did-it-break-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .where-did-it-break-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .where-did-it-break-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .where-did-it-break-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .where-did-it-break-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .where-did-it-break-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .where-did-it-break-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .where-did-it-break-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .where-did-it-break-stage { opacity: 1; }

    .where-did-it-break-s0 { animation-delay: 0.00s; }
    .where-did-it-break-e0 { animation-delay: 0.00s; }
    .where-did-it-break-s1 { animation-delay: 1.33s; }
    .where-did-it-break-e1 { animation-delay: 1.33s; }
    .where-did-it-break-s2 { animation-delay: 2.67s; }
    .where-did-it-break-e2 { animation-delay: 2.67s; }
    .where-did-it-break-s3 { animation-delay: 4.00s; }
    .where-did-it-break-e3 { animation-delay: 4.00s; }
    .where-did-it-break-s4 { animation-delay: 5.33s; }
    .where-did-it-break-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .where-did-it-break-conn  { animation: where-did-it-break-trace 8s ease-in-out infinite; }
      .where-did-it-break-stage { animation: where-did-it-break-arrive 8s ease-in-out infinite; }
    }
    @keyframes where-did-it-break-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes where-did-it-break-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .where-did-it-break-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .where-did-it-break-stage { animation: where-did-it-break-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes where-did-it-break-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="where-did-it-break-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="where-did-it-break-bg" width="980" height="322"/>
  <text class="where-did-it-break-h1"  x="30" y="40">Reproduce at the lowest level that still shows the problem</text>
  <text class="where-did-it-break-sub" x="30" y="64">Most debugging time goes on establishing where something broke, not why.</text>
  <g class="where-did-it-break-stage where-did-it-break-s0">
    <rect class="where-did-it-break-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="where-did-it-break-step" x="44" y="142">01</text>
    <text class="where-did-it-break-name" x="70" y="142">In the app</text>
    <text class="where-did-it-break-desc" x="44" y="166">It fails. Everything is</text>
    <text class="where-did-it-break-desc" x="44" y="182">still suspect.</text>
    <text class="where-did-it-break-edge" x="44" y="242">no information</text>
  </g>
  <line class="where-did-it-break-line where-did-it-break-conn where-did-it-break-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#where-did-it-break-tip)"/>
  <g class="where-did-it-break-stage where-did-it-break-s1">
    <rect class="where-did-it-break-hi" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="where-did-it-break-step" x="233" y="142">02</text>
    <text class="where-did-it-break-name" x="259" y="142">With curl</text>
    <text class="where-did-it-break-desc" x="233" y="166">Same request, no</text>
    <text class="where-did-it-break-desc" x="233" y="182">application code</text>
    <text class="where-did-it-break-desc" x="233" y="198">involved.</text>
    <text class="where-did-it-break-edge" x="233" y="242">halves the stack</text>
  </g>
  <line class="where-did-it-break-line where-did-it-break-conn where-did-it-break-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#where-did-it-break-tip)"/>
  <g class="where-did-it-break-stage where-did-it-break-s2">
    <rect class="where-did-it-break-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="where-did-it-break-step" x="422" y="142">03</text>
    <text class="where-did-it-break-name" x="448" y="142">-v for headers</text>
    <text class="where-did-it-break-desc" x="422" y="166">See exactly what was sent</text>
    <text class="where-did-it-break-desc" x="422" y="182">and what came back.</text>
    <text class="where-did-it-break-edge" x="422" y="242">names the code</text>
  </g>
  <line class="where-did-it-break-line where-did-it-break-conn where-did-it-break-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#where-did-it-break-tip)"/>
  <g class="where-did-it-break-stage where-did-it-break-s3">
    <rect class="where-did-it-break-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="where-did-it-break-step" x="611" y="142">04</text>
    <text class="where-did-it-break-name" x="637" y="142">DNS and TLS</text>
    <text class="where-did-it-break-desc" x="611" y="166">Did the name resolve, did</text>
    <text class="where-did-it-break-desc" x="611" y="182">the certificate verify.</text>
    <text class="where-did-it-break-edge" x="611" y="242">below HTTP</text>
  </g>
  <line class="where-did-it-break-line where-did-it-break-conn where-did-it-break-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#where-did-it-break-tip)"/>
  <g class="where-did-it-break-stage where-did-it-break-s4">
    <rect class="where-did-it-break-box" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="where-did-it-break-step" x="800" y="142">05</text>
    <text class="where-did-it-break-name" x="826" y="142">Packets</text>
    <text class="where-did-it-break-desc" x="800" y="166">Only when the answer is</text>
    <text class="where-did-it-break-desc" x="800" y="182">genuinely below the</text>
    <text class="where-did-it-break-desc" x="800" y="198">protocol.</text>
    <text class="where-did-it-break-edge" x="800" y="242">rarely needed</text>
  </g>
  <text class="where-did-it-break-sub" x="30" y="304">If it works in curl and fails in code, the fault is yours — a header, an encoding, a proxy. That is one command's worth of certainty.</text>
</svg>
