<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what that obliges.">
  <title>What a checkpoint contains</title>
  <style>
    .checkpoint-privacy-bg   { fill: #f8fafc; }
    .checkpoint-privacy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .checkpoint-privacy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .checkpoint-privacy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .checkpoint-privacy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .checkpoint-privacy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .checkpoint-privacy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .checkpoint-privacy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .checkpoint-privacy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .checkpoint-privacy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .checkpoint-privacy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .checkpoint-privacy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .checkpoint-privacy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .checkpoint-privacy-row { opacity: 1; }
    .checkpoint-privacy-r0 { animation-delay: 0.00s; }
    .checkpoint-privacy-r1 { animation-delay: 0.45s; }
    .checkpoint-privacy-r2 { animation-delay: 0.90s; }
    .checkpoint-privacy-r3 { animation-delay: 1.35s; }
    .checkpoint-privacy-r4 { animation-delay: 1.80s; }
    .checkpoint-privacy-row { animation: checkpoint-privacy-reveal 7.3s ease-in-out infinite; }
    @keyframes checkpoint-privacy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="checkpoint-privacy-bg" width="980" height="390"/>
  <text class="checkpoint-privacy-h1"  x="30" y="40">What a checkpoint contains</text>
  <text class="checkpoint-privacy-sub" x="30" y="64">And what that obliges.</text>
  <rect class="checkpoint-privacy-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="checkpoint-privacy-name" x="46" y="122">Privacy</text>
  <text class="checkpoint-privacy-desc" x="46" y="142">Full history, persisted.</text>
  <text class="checkpoint-privacy-desc checkpoint-privacy-row checkpoint-privacy-r0" x="46" y="182">Complete conversation and tool returns</text>
  <text class="checkpoint-privacy-desc checkpoint-privacy-row checkpoint-privacy-r1" x="46" y="216">Written to disk by design</text>
  <text class="checkpoint-privacy-desc checkpoint-privacy-row checkpoint-privacy-r2" x="46" y="250">Subject to erasure requests</text>
  <text class="checkpoint-privacy-desc checkpoint-privacy-row checkpoint-privacy-r3" x="46" y="284">Every historical checkpoint, not just the last</text>
  <text class="checkpoint-privacy-desc checkpoint-privacy-row checkpoint-privacy-r4" x="46" y="318">Day 346's problem, in a workflow engine</text>
  <rect class="checkpoint-privacy-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="checkpoint-privacy-name" x="526" y="122">Performance</text>
  <text class="checkpoint-privacy-desc" x="526" y="142">Cheap locally, not remotely.</text>
  <text class="checkpoint-privacy-desc checkpoint-privacy-row checkpoint-privacy-r0" x="526" y="182">Under 0.5 ms per node in memory</text>
  <text class="checkpoint-privacy-desc checkpoint-privacy-row checkpoint-privacy-r1" x="526" y="216">5-25 ms to a remote store</text>
  <text class="checkpoint-privacy-desc checkpoint-privacy-row checkpoint-privacy-r2" x="526" y="250">Paid on every node, not every run</text>
  <text class="checkpoint-privacy-desc checkpoint-privacy-row checkpoint-privacy-r3" x="526" y="284">A deliberate trade for durability</text>
  <text class="checkpoint-privacy-desc checkpoint-privacy-row checkpoint-privacy-r4" x="526" y="318">Batch or async where the risk allows</text>
  <text class="checkpoint-privacy-sub" x="30" y="372">The right-hand column argues for choosing the checkpoint store per workload: an interactive agent may accept in-memory checkpoints, and a multi-day workflow cannot.</text>
</svg>
