<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Missingness is information</title>
  <style>
    .missing-indicator-bg   { fill: #f8fafc; }
    .missing-indicator-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .missing-indicator-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .missing-indicator-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .missing-indicator-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .missing-indicator-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .missing-indicator-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .missing-indicator-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .missing-indicator-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .missing-indicator-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .missing-indicator-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .missing-indicator-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .missing-indicator-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .missing-indicator-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .missing-indicator-stage { opacity: 1; }

    .missing-indicator-s0 { animation-delay: 0.00s; }
    .missing-indicator-e0 { animation-delay: 0.00s; }
    .missing-indicator-s1 { animation-delay: 1.28s; }
    .missing-indicator-e1 { animation-delay: 1.28s; }
    .missing-indicator-s2 { animation-delay: 2.56s; }
    .missing-indicator-e2 { animation-delay: 2.56s; }
    .missing-indicator-s3 { animation-delay: 3.84s; }
    .missing-indicator-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .missing-indicator-conn  { animation: missing-indicator-trace 6.4s ease-in-out infinite; }
      .missing-indicator-stage { animation: missing-indicator-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes missing-indicator-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes missing-indicator-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .missing-indicator-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .missing-indicator-stage { animation: missing-indicator-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes missing-indicator-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="missing-indicator-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="missing-indicator-bg" width="980" height="322"/>
  <text class="missing-indicator-h1"  x="30" y="40">Missingness is information</text>
  <text class="missing-indicator-sub" x="30" y="64">Four steps.</text>
  <g class="missing-indicator-stage missing-indicator-s0">
    <rect class="missing-indicator-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="missing-indicator-step" x="44" y="142">01</text>
    <text class="missing-indicator-name" x="70" y="142">A value is absent</text>
    <text class="missing-indicator-desc" x="44" y="166">An income field left blank, a</text>
    <text class="missing-indicator-desc" x="44" y="182">test not ordered.</text>
  </g>
  <line class="missing-indicator-line missing-indicator-conn missing-indicator-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#missing-indicator-tip)"/>
  <g class="missing-indicator-stage missing-indicator-s1">
    <rect class="missing-indicator-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="missing-indicator-step" x="280" y="142">02</text>
    <text class="missing-indicator-name" x="306" y="142">Which is rarely an accident</text>
    <text class="missing-indicator-desc" x="280" y="166">Someone chose not to supply it,</text>
    <text class="missing-indicator-desc" x="280" y="182">or not to measure it.</text>
  </g>
  <line class="missing-indicator-line missing-indicator-conn missing-indicator-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#missing-indicator-tip)"/>
  <g class="missing-indicator-stage missing-indicator-s2">
    <rect class="missing-indicator-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="missing-indicator-step" x="516" y="142">03</text>
    <text class="missing-indicator-name" x="542" y="142">So the absence itself predicts</text>
    <text class="missing-indicator-desc" x="516" y="166">Often more strongly than the</text>
    <text class="missing-indicator-desc" x="516" y="182">value would have.</text>
  </g>
  <line class="missing-indicator-line missing-indicator-conn missing-indicator-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#missing-indicator-tip)"/>
  <g class="missing-indicator-stage missing-indicator-s3">
    <rect class="missing-indicator-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="missing-indicator-step" x="752" y="142">04</text>
    <text class="missing-indicator-name" x="778" y="142">Add a boolean indicator alongside the imputation</text>
    <text class="missing-indicator-desc" x="752" y="166">Which keeps the signal instead</text>
    <text class="missing-indicator-desc" x="752" y="182">of erasing it.</text>
  </g>
  <text class="missing-indicator-sub" x="30" y="304">Imputing without an indicator throws away real signal, which is why the indicator is close to free and should be the default rather than an option.</text>
</svg>
