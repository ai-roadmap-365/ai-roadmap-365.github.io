<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two centuries old.">
  <title>Four steps for linear regression</title>
  <style>
    .linreg-history-bg   { fill: #f8fafc; }
    .linreg-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linreg-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linreg-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linreg-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linreg-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linreg-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .linreg-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .linreg-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .linreg-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .linreg-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .linreg-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .linreg-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .linreg-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .linreg-history-stage { opacity: 1; }

    .linreg-history-s0 { animation-delay: 0.00s; }
    .linreg-history-e0 { animation-delay: 0.00s; }
    .linreg-history-s1 { animation-delay: 1.28s; }
    .linreg-history-e1 { animation-delay: 1.28s; }
    .linreg-history-s2 { animation-delay: 2.56s; }
    .linreg-history-e2 { animation-delay: 2.56s; }
    .linreg-history-s3 { animation-delay: 3.84s; }
    .linreg-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .linreg-history-conn  { animation: linreg-history-trace 6.4s ease-in-out infinite; }
      .linreg-history-stage { animation: linreg-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes linreg-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes linreg-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .linreg-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .linreg-history-stage { animation: linreg-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes linreg-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="linreg-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="linreg-history-bg" width="980" height="322"/>
  <text class="linreg-history-h1"  x="30" y="40">Four steps for linear regression</text>
  <text class="linreg-history-sub" x="30" y="64">Two centuries old.</text>
  <g class="linreg-history-stage linreg-history-s0">
    <rect class="linreg-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="linreg-history-step" x="44" y="142">01</text>
    <text class="linreg-history-name" x="70" y="142">Developed to fit orbits from noisy observations</text>
    <text class="linreg-history-desc" x="44" y="166">Over two centuries ago.</text>
  </g>
  <line class="linreg-history-line linreg-history-conn linreg-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#linreg-history-tip)"/>
  <g class="linreg-history-stage linreg-history-s1">
    <rect class="linreg-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="linreg-history-step" x="280" y="142">02</text>
    <text class="linreg-history-name" x="306" y="142">Then given a statistical framework</text>
    <text class="linreg-history-desc" x="280" y="166">Standard errors, intervals,</text>
    <text class="linreg-history-desc" x="280" y="182">hypothesis tests.</text>
  </g>
  <line class="linreg-history-line linreg-history-conn linreg-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#linreg-history-tip)"/>
  <g class="linreg-history-stage linreg-history-s2">
    <rect class="linreg-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="linreg-history-step" x="516" y="142">03</text>
    <text class="linreg-history-name" x="542" y="142">And stable numerical solutions</text>
    <text class="linreg-history-desc" x="516" y="166">Which matter more than the</text>
    <text class="linreg-history-desc" x="516" y="182">textbook formula suggests.</text>
  </g>
  <line class="linreg-history-line linreg-history-conn linreg-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#linreg-history-tip)"/>
  <g class="linreg-history-stage linreg-history-s3">
    <rect class="linreg-history-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="linreg-history-step" x="752" y="142">04</text>
    <text class="linreg-history-name" x="778" y="142">It remains the baseline for everything since</text>
    <text class="linreg-history-desc" x="752" y="166">And the interpretable choice</text>
    <text class="linreg-history-desc" x="752" y="182">where that is required.</text>
  </g>
  <text class="linreg-history-sub" x="30" y="304">Its survival is not sentimental: interpretable coefficients with computable uncertainty remain rare, and most later methods offer neither.</text>
</svg>
