<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The first request, before any redirect.">
  <title>The gap HSTS closes</title>
  <style>
    .hsts-first-request-bg   { fill: #f8fafc; }
    .hsts-first-request-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hsts-first-request-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hsts-first-request-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hsts-first-request-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hsts-first-request-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hsts-first-request-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hsts-first-request-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hsts-first-request-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hsts-first-request-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hsts-first-request-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hsts-first-request-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hsts-first-request-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .hsts-first-request-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .hsts-first-request-stage { opacity: 1; }

    .hsts-first-request-s0 { animation-delay: 0.00s; }
    .hsts-first-request-e0 { animation-delay: 0.00s; }
    .hsts-first-request-s1 { animation-delay: 1.28s; }
    .hsts-first-request-e1 { animation-delay: 1.28s; }
    .hsts-first-request-s2 { animation-delay: 2.56s; }
    .hsts-first-request-e2 { animation-delay: 2.56s; }
    .hsts-first-request-s3 { animation-delay: 3.84s; }
    .hsts-first-request-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .hsts-first-request-conn  { animation: hsts-first-request-trace 6.4s ease-in-out infinite; }
      .hsts-first-request-stage { animation: hsts-first-request-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes hsts-first-request-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes hsts-first-request-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .hsts-first-request-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .hsts-first-request-stage { animation: hsts-first-request-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes hsts-first-request-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="hsts-first-request-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="hsts-first-request-bg" width="980" height="322"/>
  <text class="hsts-first-request-h1"  x="30" y="40">The gap HSTS closes</text>
  <text class="hsts-first-request-sub" x="30" y="64">The first request, before any redirect.</text>
  <g class="hsts-first-request-stage hsts-first-request-s0">
    <rect class="hsts-first-request-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="hsts-first-request-step" x="44" y="142">01</text>
    <text class="hsts-first-request-name" x="70" y="142">You type example.com</text>
    <text class="hsts-first-request-desc" x="44" y="166">No scheme. The first request may</text>
    <text class="hsts-first-request-desc" x="44" y="182">go out over plain HTTP.</text>
    <text class="hsts-first-request-edge" x="44" y="242">exposed</text>
  </g>
  <line class="hsts-first-request-line hsts-first-request-conn hsts-first-request-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#hsts-first-request-tip)"/>
  <g class="hsts-first-request-stage hsts-first-request-s1">
    <rect class="hsts-first-request-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="hsts-first-request-step" x="280" y="142">02</text>
    <text class="hsts-first-request-name" x="306" y="142">The server redirects</text>
    <text class="hsts-first-request-desc" x="280" y="166">301 to the HTTPS address.</text>
    <text class="hsts-first-request-desc" x="280" y="182">Correct, but one moment too</text>
    <text class="hsts-first-request-desc" x="280" y="198">late.</text>
  </g>
  <line class="hsts-first-request-line hsts-first-request-conn hsts-first-request-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#hsts-first-request-tip)"/>
  <g class="hsts-first-request-stage hsts-first-request-s2">
    <rect class="hsts-first-request-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="hsts-first-request-step" x="516" y="142">03</text>
    <text class="hsts-first-request-name" x="542" y="142">HSTS header arrives</text>
    <text class="hsts-first-request-desc" x="516" y="166">Strict-Transport-Security: only</text>
    <text class="hsts-first-request-desc" x="516" y="182">HTTPS for me, for the next N</text>
    <text class="hsts-first-request-desc" x="516" y="198">seconds.</text>
    <text class="hsts-first-request-edge" x="516" y="242">remembered</text>
  </g>
  <line class="hsts-first-request-line hsts-first-request-conn hsts-first-request-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#hsts-first-request-tip)"/>
  <g class="hsts-first-request-stage hsts-first-request-s3">
    <rect class="hsts-first-request-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="hsts-first-request-step" x="752" y="142">04</text>
    <text class="hsts-first-request-name" x="778" y="142">Every later request is upgraded</text>
    <text class="hsts-first-request-desc" x="752" y="166">Before it leaves your machine.</text>
    <text class="hsts-first-request-desc" x="752" y="182">And no click-through on</text>
    <text class="hsts-first-request-desc" x="752" y="198">warnings.</text>
  </g>
  <text class="hsts-first-request-sub" x="30" y="304">Preloading closes even the first visit: major sites ship inside browsers on a list, so the very first request is already upgraded.</text>
</svg>
