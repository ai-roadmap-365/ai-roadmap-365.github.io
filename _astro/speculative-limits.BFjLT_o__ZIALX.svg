<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Batch size decides.">
  <title>When speculative decoding does not help</title>
  <style>
    .speculative-limits-bg   { fill: #f8fafc; }
    .speculative-limits-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speculative-limits-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speculative-limits-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speculative-limits-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speculative-limits-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speculative-limits-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .speculative-limits-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .speculative-limits-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .speculative-limits-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .speculative-limits-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .speculative-limits-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .speculative-limits-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .speculative-limits-row { opacity: 1; }
    .speculative-limits-r0 { animation-delay: 0.00s; }
    .speculative-limits-r1 { animation-delay: 0.45s; }
    .speculative-limits-r2 { animation-delay: 0.90s; }
    .speculative-limits-r3 { animation-delay: 1.35s; }
    .speculative-limits-r4 { animation-delay: 1.80s; }
    .speculative-limits-row { animation: speculative-limits-reveal 7.3s ease-in-out infinite; }
    @keyframes speculative-limits-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="speculative-limits-bg" width="980" height="390"/>
  <text class="speculative-limits-h1"  x="30" y="40">When speculative decoding does not help</text>
  <text class="speculative-limits-sub" x="30" y="64">Batch size decides.</text>
  <rect class="speculative-limits-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="speculative-limits-name" x="46" y="122">Few concurrent users</text>
  <text class="speculative-limits-desc" x="46" y="142">Where it pays.</text>
  <text class="speculative-limits-desc speculative-limits-row speculative-limits-r0" x="46" y="182">The GPU has spare capacity</text>
  <text class="speculative-limits-desc speculative-limits-row speculative-limits-r1" x="46" y="216">Decode is memory-bound, not compute-bound</text>
  <text class="speculative-limits-desc speculative-limits-row speculative-limits-r2" x="46" y="250">Verification uses idle compute</text>
  <text class="speculative-limits-desc speculative-limits-row speculative-limits-r3" x="46" y="284">Latency per request falls</text>
  <text class="speculative-limits-desc speculative-limits-row speculative-limits-r4" x="46" y="318">The opposite regime from batching</text>
  <rect class="speculative-limits-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="speculative-limits-name" x="526" y="122">High batch sizes</text>
  <text class="speculative-limits-desc" x="526" y="142">Where it does not.</text>
  <text class="speculative-limits-desc speculative-limits-row speculative-limits-r0" x="526" y="182">The GPU is already saturated</text>
  <text class="speculative-limits-desc speculative-limits-row speculative-limits-r1" x="526" y="216">Other requests fill the spare capacity</text>
  <text class="speculative-limits-desc speculative-limits-row speculative-limits-r2" x="526" y="250">No idle compute to exploit</text>
  <text class="speculative-limits-desc speculative-limits-row speculative-limits-r3" x="526" y="284">Continuous batching already won</text>
  <text class="speculative-limits-desc speculative-limits-row speculative-limits-r4" x="526" y="318">The technique adds overhead</text>
  <text class="speculative-limits-sub" x="30" y="372">The two techniques optimise for opposite regimes, which is a useful thing to know before deploying both: continuous batching pays under load, and speculation pays when load is light.</text>
</svg>
