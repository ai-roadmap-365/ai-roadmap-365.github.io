<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are about serving.">
  <title>Four consequences of multi-head attention</title>
  <style>
    .mha-implications-bg   { fill: #f8fafc; }
    .mha-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mha-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mha-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mha-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mha-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mha-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mha-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mha-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mha-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mha-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mha-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mha-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .mha-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .mha-implications-stage { opacity: 1; }

    .mha-implications-s0 { animation-delay: 0.00s; }
    .mha-implications-e0 { animation-delay: 0.00s; }
    .mha-implications-s1 { animation-delay: 1.28s; }
    .mha-implications-e1 { animation-delay: 1.28s; }
    .mha-implications-s2 { animation-delay: 2.56s; }
    .mha-implications-e2 { animation-delay: 2.56s; }
    .mha-implications-s3 { animation-delay: 3.84s; }
    .mha-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .mha-implications-conn  { animation: mha-implications-trace 6.4s ease-in-out infinite; }
      .mha-implications-stage { animation: mha-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes mha-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes mha-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .mha-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .mha-implications-stage { animation: mha-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes mha-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="mha-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="mha-implications-bg" width="980" height="322"/>
  <text class="mha-implications-h1"  x="30" y="40">Four consequences of multi-head attention</text>
  <text class="mha-implications-sub" x="30" y="64">Two are about serving.</text>
  <g class="mha-implications-stage mha-implications-s0">
    <rect class="mha-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="mha-implications-step" x="44" y="142">01</text>
    <text class="mha-implications-name" x="70" y="142">Individual heads are somewhat interpretable</text>
    <text class="mha-implications-desc" x="44" y="166">Some track syntax, some</text>
    <text class="mha-implications-desc" x="44" y="182">coreference, some position.</text>
  </g>
  <line class="mha-implications-line mha-implications-conn mha-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#mha-implications-tip)"/>
  <g class="mha-implications-stage mha-implications-s1">
    <rect class="mha-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="mha-implications-step" x="280" y="142">02</text>
    <text class="mha-implications-name" x="306" y="142">The cache dominates serving memory</text>
    <text class="mha-implications-desc" x="280" y="166">Per head, per layer, per token.</text>
    <text class="mha-implications-desc" x="280" y="182">Grouped queries address it.</text>
  </g>
  <line class="mha-implications-line mha-implications-conn mha-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#mha-implications-tip)"/>
  <g class="mha-implications-stage mha-implications-s2">
    <rect class="mha-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="mha-implications-step" x="516" y="142">03</text>
    <text class="mha-implications-name" x="542" y="142">Heads prune well post-training</text>
    <text class="mha-implications-desc" x="516" y="166">A real deployment optimisation.</text>
  </g>
  <line class="mha-implications-line mha-implications-conn mha-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#mha-implications-tip)"/>
  <g class="mha-implications-stage mha-implications-s3">
    <rect class="mha-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="mha-implications-step" x="752" y="142">04</text>
    <text class="mha-implications-name" x="778" y="142">Head count is a design choice</text>
    <text class="mha-implications-desc" x="752" y="166">More heads, narrower each. Too</text>
    <text class="mha-implications-desc" x="752" y="182">narrow and each head sees too</text>
    <text class="mha-implications-desc" x="752" y="198">little.</text>
  </g>
  <text class="mha-implications-sub" x="30" y="304">The head-width floor is a practical constraint rather than a theoretical one: dividing a modest model dimension across many heads leaves each with too few dimensions to represent anything useful.</text>
</svg>
