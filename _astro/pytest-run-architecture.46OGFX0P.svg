<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" role="img" font-family="system-ui, sans-serif">
  <title>The architecture of a pytest run: the invocation names paths, configuration discovery fixes the rootdir, collection imports conftest.py and every test module and gathers test functions and Test classes into items, the assertion-rewriting import hook compiles each test module so a bare assert can report both sides, the session executes each item in turn, the reporter prints progress characters and the short test summary, and the process ends with an exit code that continuous integration reads</title>
  <rect x="0" y="0" width="880" height="700" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Anatomy of a pytest run</text>
  <text x="440" y="56" text-anchor="middle" font-size="14" fill="#1a202c">one command in, one exit code out — everything between is discovery, execution, and reporting</text>

  <!-- The process boundary -->
  <rect x="26" y="72" width="828" height="540" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="14"/>
  <text x="46" y="96" font-size="15" font-weight="bold" fill="#1a202c">One pytest process</text>

  <!-- Stage 1: configuration and rootdir -->
  <rect x="48" y="108" width="420" height="72" fill="#ffffff" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="66" y="134" font-size="15" font-weight="bold" fill="#1a202c">1. Configuration — fix the rootdir</text>
  <text x="66" y="156" font-size="14" fill="#1a202c">walk up from the given paths to the first config file;</text>
  <text x="66" y="174" font-size="14" fill="#1a202c">that directory becomes the rootdir for every printed path</text>
  <text x="492" y="134" font-size="14" font-weight="bold" fill="#1d4ed8">reads</text>
  <text x="492" y="156" font-size="14" fill="#1d4ed8">pytest.ini · pyproject.toml</text>
  <text x="492" y="174" font-size="14" fill="#1d4ed8">tox.ini · setup.cfg · addopts · testpaths</text>
  <line x1="258" y1="180" x2="258" y2="198" stroke="#1a202c" stroke-width="2"/>
  <polygon points="258,200 252,186 264,186" fill="#1a202c"/>

  <!-- Stage 2: collection -->
  <rect x="48" y="200" width="420" height="92" fill="#ffffff" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="66" y="226" font-size="15" font-weight="bold" fill="#1a202c">2. Collection — find the tests</text>
  <text x="66" y="248" font-size="14" fill="#1a202c">import every conftest.py from the rootdir down, then each</text>
  <text x="66" y="266" font-size="14" fill="#1a202c">matching module; gather functions and classes into items,</text>
  <text x="66" y="284" font-size="14" fill="#1a202c">each with an id like file.py::Class::test_name</text>
  <text x="492" y="226" font-size="14" font-weight="bold" fill="#1d4ed8">matches by name</text>
  <text x="492" y="248" font-size="14" fill="#1d4ed8">files: test_*.py or *_test.py</text>
  <text x="492" y="266" font-size="14" fill="#1d4ed8">functions: test_*</text>
  <text x="492" y="284" font-size="14" fill="#1d4ed8">classes: Test* with no __init__</text>
  <line x1="258" y1="292" x2="258" y2="310" stroke="#1a202c" stroke-width="2"/>
  <polygon points="258,312 252,298 264,298" fill="#1a202c"/>

  <!-- Stage 3: assertion rewriting -->
  <rect x="48" y="312" width="420" height="72" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="66" y="338" font-size="15" font-weight="bold" fill="#1a202c">3. Assertion rewriting — an import hook</text>
  <text x="66" y="360" font-size="14" fill="#1a202c">each test module is compiled with its assert statements</text>
  <text x="66" y="378" font-size="14" fill="#1a202c">expanded, so a failure can show both sides of the comparison</text>
  <text x="492" y="338" font-size="14" font-weight="bold" fill="#1d4ed8">this is why a bare assert is enough</text>
  <text x="492" y="360" font-size="14" fill="#1d4ed8">assert add(1, 2) == 3</text>
  <text x="492" y="378" font-size="14" fill="#1d4ed8">becomes: assert 4 == 3, where 4 = add(1, 2)</text>
  <line x1="258" y1="384" x2="258" y2="402" stroke="#1a202c" stroke-width="2"/>
  <polygon points="258,404 252,390 264,390" fill="#1a202c"/>

  <!-- Stage 4: the session -->
  <rect x="48" y="404" width="420" height="72" fill="#ffffff" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="66" y="430" font-size="15" font-weight="bold" fill="#1a202c">4. The session — run each item in turn</text>
  <text x="66" y="452" font-size="14" fill="#1a202c">resolve each parameter against a fixture of the same name,</text>
  <text x="66" y="470" font-size="14" fill="#1a202c">call the function, record pass, fail, error or skip</text>
  <text x="492" y="430" font-size="14" font-weight="bold" fill="#1d4ed8">fixtures come from conftest.py</text>
  <text x="492" y="452" font-size="14" fill="#1d4ed8">sample_text as a parameter is a request,</text>
  <text x="492" y="470" font-size="14" fill="#1d4ed8">not a value — matched by name alone</text>
  <line x1="258" y1="476" x2="258" y2="494" stroke="#1a202c" stroke-width="2"/>
  <polygon points="258,496 252,482 264,482" fill="#1a202c"/>

  <!-- Stage 5: the reporter -->
  <rect x="48" y="496" width="420" height="92" fill="#ffffff" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="66" y="522" font-size="15" font-weight="bold" fill="#1a202c">5. The reporter — turn results into text</text>
  <text x="66" y="544" font-size="14" fill="#1a202c">one character per test as it finishes, then the failure</text>
  <text x="66" y="562" font-size="14" fill="#1a202c">bodies, then the short test summary, then one final line</text>
  <text x="66" y="580" font-size="14" fill="#1a202c">that counts everything</text>
  <text x="492" y="522" font-size="14" font-weight="bold" fill="#1d4ed8">the progress characters</text>
  <text x="492" y="544" font-size="14" fill="#1d4ed8">. passed · F failed · E error</text>
  <text x="492" y="562" font-size="14" fill="#1d4ed8">s skipped · x expected failure</text>
  <text x="492" y="580" font-size="14" fill="#1d4ed8">19 passed in 0.01s</text>

  <!-- Exit code, outside the process box -->
  <rect x="240" y="626" width="400" height="56" fill="#ffffff" stroke="#1d4ed8" stroke-width="3" rx="8"/>
  <text x="440" y="650" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Process exit code — the only part a machine reads</text>
  <text x="440" y="672" text-anchor="middle" font-size="14" fill="#1d4ed8">0 all passed · 1 a test failed · 2 interrupted · 5 nothing collected</text>
  <line x1="440" y1="612" x2="440" y2="622" stroke="#1a202c" stroke-width="2"/>
  <polygon points="440,626 434,612 446,612" fill="#1a202c"/>
</svg>
