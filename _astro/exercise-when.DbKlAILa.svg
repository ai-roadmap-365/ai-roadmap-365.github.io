<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when it can be trimmed.">
  <title>When the full protocol is warranted</title>
  <style>
    .exercise-when-bg   { fill: #f8fafc; }
    .exercise-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exercise-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exercise-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exercise-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exercise-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exercise-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exercise-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .exercise-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .exercise-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .exercise-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .exercise-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .exercise-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exercise-when-row { opacity: 1; }
    .exercise-when-r0 { animation-delay: 0.00s; }
    .exercise-when-r1 { animation-delay: 0.45s; }
    .exercise-when-r2 { animation-delay: 0.90s; }
    .exercise-when-r3 { animation-delay: 1.35s; }
    .exercise-when-r4 { animation-delay: 1.80s; }
    .exercise-when-row { animation: exercise-when-reveal 7.3s ease-in-out infinite; }
    @keyframes exercise-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="exercise-when-bg" width="980" height="390"/>
  <text class="exercise-when-h1"  x="30" y="40">When the full protocol is warranted</text>
  <text class="exercise-when-sub" x="30" y="64">And when it can be trimmed.</text>
  <rect class="exercise-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="exercise-when-name" x="46" y="122">Full protocol</text>
  <text class="exercise-when-desc" x="46" y="142">Four cases.</text>
  <text class="exercise-when-desc exercise-when-row exercise-when-r0" x="46" y="182">Anything going to production</text>
  <text class="exercise-when-desc exercise-when-row exercise-when-r1" x="46" y="216">Where a number will be quoted externally</text>
  <text class="exercise-when-desc exercise-when-row exercise-when-r2" x="46" y="250">Where a decision depends on the margin</text>
  <text class="exercise-when-desc exercise-when-row exercise-when-r3" x="46" y="284">Regulated or audited work</text>
  <text class="exercise-when-desc exercise-when-row exercise-when-r4" x="46" y="318">Any comparison between candidates</text>
  <rect class="exercise-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="exercise-when-name" x="526" y="122">Trim it</text>
  <text class="exercise-when-desc" x="526" y="142">Also four.</text>
  <text class="exercise-when-desc exercise-when-row exercise-when-r0" x="526" y="182">Feasibility checks</text>
  <text class="exercise-when-desc exercise-when-row exercise-when-r1" x="526" y="216">Teaching and exploration</text>
  <text class="exercise-when-desc exercise-when-row exercise-when-r2" x="526" y="250">Where the answer is obvious either way</text>
  <text class="exercise-when-desc exercise-when-row exercise-when-r3" x="526" y="284">Throwaway analysis</text>
  <text class="exercise-when-desc exercise-when-row exercise-when-r4" x="526" y="318">But keep the split and the baseline</text>
  <text class="exercise-when-sub" x="30" y="372">The split and the baseline are the two parts to keep even when trimming, because without them a feasibility check can reach exactly the wrong conclusion.</text>
</svg>
