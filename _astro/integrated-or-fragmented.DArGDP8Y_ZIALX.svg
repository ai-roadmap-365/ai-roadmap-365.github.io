<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Each working, none joined up.">
  <title>Integrated, or six systems</title>
  <style>
    .integrated-or-fragmented-bg   { fill: #f8fafc; }
    .integrated-or-fragmented-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .integrated-or-fragmented-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .integrated-or-fragmented-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .integrated-or-fragmented-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .integrated-or-fragmented-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .integrated-or-fragmented-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .integrated-or-fragmented-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .integrated-or-fragmented-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .integrated-or-fragmented-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .integrated-or-fragmented-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .integrated-or-fragmented-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .integrated-or-fragmented-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .integrated-or-fragmented-row { opacity: 1; }
    .integrated-or-fragmented-r0 { animation-delay: 0.00s; }
    .integrated-or-fragmented-r1 { animation-delay: 0.45s; }
    .integrated-or-fragmented-r2 { animation-delay: 0.90s; }
    .integrated-or-fragmented-r3 { animation-delay: 1.35s; }
    .integrated-or-fragmented-r4 { animation-delay: 1.80s; }
    .integrated-or-fragmented-row { animation: integrated-or-fragmented-reveal 7.3s ease-in-out infinite; }
    @keyframes integrated-or-fragmented-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="integrated-or-fragmented-bg" width="980" height="390"/>
  <text class="integrated-or-fragmented-h1"  x="30" y="40">Integrated, or six systems</text>
  <text class="integrated-or-fragmented-sub" x="30" y="64">Each working, none joined up.</text>
  <rect class="integrated-or-fragmented-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="integrated-or-fragmented-name" x="46" y="122">Integrated</text>
  <text class="integrated-or-fragmented-desc" x="46" y="142">One request path.</text>
  <text class="integrated-or-fragmented-desc integrated-or-fragmented-row integrated-or-fragmented-r0" x="46" y="182">One trace ID through every layer</text>
  <text class="integrated-or-fragmented-desc integrated-or-fragmented-row integrated-or-fragmented-r1" x="46" y="216">Cache hits skip billing correctly</text>
  <text class="integrated-or-fragmented-desc integrated-or-fragmented-row integrated-or-fragmented-r2" x="46" y="250">Failover preserves the billing hold</text>
  <text class="integrated-or-fragmented-desc integrated-or-fragmented-row integrated-or-fragmented-r3" x="46" y="284">Quotas checked before expensive work</text>
  <text class="integrated-or-fragmented-desc integrated-or-fragmented-row integrated-or-fragmented-r4" x="46" y="318">Every layer knows the tenant</text>
  <rect class="integrated-or-fragmented-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="integrated-or-fragmented-name" x="526" y="122">Fragmented</text>
  <text class="integrated-or-fragmented-desc" x="526" y="142">Each part works alone.</text>
  <text class="integrated-or-fragmented-desc integrated-or-fragmented-row integrated-or-fragmented-r0" x="526" y="182">Separate tools for UI, retrieval and models</text>
  <text class="integrated-or-fragmented-desc integrated-or-fragmented-row integrated-or-fragmented-r1" x="526" y="216">No shared correlation</text>
  <text class="integrated-or-fragmented-desc integrated-or-fragmented-row integrated-or-fragmented-r2" x="526" y="250">Cache hits still charged</text>
  <text class="integrated-or-fragmented-desc integrated-or-fragmented-row integrated-or-fragmented-r3" x="526" y="284">Failover loses the hold</text>
  <text class="integrated-or-fragmented-desc integrated-or-fragmented-row integrated-or-fragmented-r4" x="526" y="318">High latency and fragile deployments</text>
  <text class="integrated-or-fragmented-sub" x="30" y="372">The billing-and-cache interaction is a good example of a join that only exists in an integrated design: a cache hit costs nothing and must settle at zero, which neither component knows on its own.</text>
</svg>
