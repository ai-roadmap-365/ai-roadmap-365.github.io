<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="To one occasion.">
  <title>A suit fitted too closely</title>
  <style>
    .tailoring-bg   { fill: #f8fafc; }
    .tailoring-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tailoring-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tailoring-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tailoring-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tailoring-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tailoring-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tailoring-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tailoring-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tailoring-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tailoring-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tailoring-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tailoring-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tailoring-row { opacity: 1; }
    .tailoring-r0 { animation-delay: 0.00s; }
    .tailoring-r1 { animation-delay: 0.45s; }
    .tailoring-r2 { animation-delay: 0.90s; }
    .tailoring-r3 { animation-delay: 1.35s; }
    .tailoring-r4 { animation-delay: 1.80s; }
    .tailoring-row { animation: tailoring-reveal 7.3s ease-in-out infinite; }
    @keyframes tailoring-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tailoring-bg" width="980" height="390"/>
  <text class="tailoring-h1"  x="30" y="40">A suit fitted too closely</text>
  <text class="tailoring-sub" x="30" y="64">To one occasion.</text>
  <rect class="tailoring-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tailoring-name" x="46" y="122">Too loose</text>
  <text class="tailoring-desc" x="46" y="142">Fits nobody well.</text>
  <text class="tailoring-desc tailoring-row tailoring-r0" x="46" y="182">The same shape for everyone</text>
  <text class="tailoring-desc tailoring-row tailoring-r1" x="46" y="216">Comfortable, and never right</text>
  <text class="tailoring-desc tailoring-row tailoring-r2" x="46" y="250">No detail captured</text>
  <text class="tailoring-desc tailoring-row tailoring-r3" x="46" y="284">Fits new wearers equally badly</text>
  <text class="tailoring-desc tailoring-row tailoring-r4" x="46" y="318">This is underfitting</text>
  <rect class="tailoring-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tailoring-name" x="526" y="122">Too tight</text>
  <text class="tailoring-desc" x="526" y="142">Fits one moment.</text>
  <text class="tailoring-desc tailoring-row tailoring-r0" x="526" y="182">Measured to one person, on one day</text>
  <text class="tailoring-desc tailoring-row tailoring-r1" x="526" y="216">Perfect, once</text>
  <text class="tailoring-desc tailoring-row tailoring-r2" x="526" y="250">Every incidental detail captured</text>
  <text class="tailoring-desc tailoring-row tailoring-r3" x="526" y="284">Unwearable after a large meal</text>
  <text class="tailoring-desc tailoring-row tailoring-r4" x="526" y="318">This is overfitting</text>
  <text class="tailoring-sub" x="30" y="372">The tight suit captures details that were never stable, which is exactly what fitting the noise in a training sample amounts to.</text>
</svg>
