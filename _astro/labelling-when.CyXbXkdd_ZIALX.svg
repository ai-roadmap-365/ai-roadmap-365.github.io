<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By budget and task.">
  <title>Which labelling strategy when</title>
  <style>
    .labelling-when-bg   { fill: #f8fafc; }
    .labelling-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .labelling-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .labelling-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .labelling-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .labelling-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .labelling-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .labelling-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .labelling-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .labelling-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .labelling-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .labelling-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .labelling-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .labelling-when-row { opacity: 1; }
    .labelling-when-r0 { animation-delay: 0.00s; }
    .labelling-when-r1 { animation-delay: 0.45s; }
    .labelling-when-r2 { animation-delay: 0.90s; }
    .labelling-when-r3 { animation-delay: 1.35s; }
    .labelling-when-r4 { animation-delay: 1.80s; }
    .labelling-when-row { animation: labelling-when-reveal 7.3s ease-in-out infinite; }
    @keyframes labelling-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="labelling-when-bg" width="980" height="390"/>
  <text class="labelling-when-h1"  x="30" y="40">Which labelling strategy when</text>
  <text class="labelling-when-sub" x="30" y="64">By budget and task.</text>
  <rect class="labelling-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="labelling-when-name" x="46" y="122">The situation</text>
  <text class="labelling-when-desc" x="46" y="142">What you face.</text>
  <text class="labelling-when-desc labelling-when-row labelling-when-r0" x="46" y="182">Small budget, large unlabelled pool</text>
  <text class="labelling-when-desc labelling-when-row labelling-when-r1" x="46" y="216">Rules can express much of the task</text>
  <text class="labelling-when-desc labelling-when-row labelling-when-r2" x="46" y="250">Existing labels of uncertain quality</text>
  <text class="labelling-when-desc labelling-when-row labelling-when-r3" x="46" y="284">Genuinely ambiguous judgments</text>
  <text class="labelling-when-desc labelling-when-row labelling-when-r4" x="46" y="318">Very large scale needed</text>
  <rect class="labelling-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="labelling-when-name" x="526" y="122">The strategy</text>
  <text class="labelling-when-desc" x="526" y="142">What to do.</text>
  <text class="labelling-when-desc labelling-when-row labelling-when-r0" x="526" y="182">Active learning, iteratively</text>
  <text class="labelling-when-desc labelling-when-row labelling-when-r1" x="526" y="216">Weak supervision, then verify</text>
  <text class="labelling-when-desc labelling-when-row labelling-when-r2" x="526" y="250">Confident learning to find errors first</text>
  <text class="labelling-when-desc labelling-when-row labelling-when-r3" x="526" y="284">Multiple annotators, and measure agreement</text>
  <text class="labelling-when-desc labelling-when-row labelling-when-r4" x="526" y="318">Model-generated labels, with verification</text>
  <text class="labelling-when-sub" x="30" y="372">Checking existing labels for errors before collecting more is frequently the highest-return move, and it is almost never the first thing anyone tries.</text>
</svg>
