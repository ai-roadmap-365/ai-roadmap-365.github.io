<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties, all of them plain.">
  <title>Why ReLU worked</title>
  <style>
    .relu-properties-bg   { fill: #f8fafc; }
    .relu-properties-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .relu-properties-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .relu-properties-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .relu-properties-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .relu-properties-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .relu-properties-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .relu-properties-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .relu-properties-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .relu-properties-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .relu-properties-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .relu-properties-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .relu-properties-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .relu-properties-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .relu-properties-stage { opacity: 1; }

    .relu-properties-s0 { animation-delay: 0.00s; }
    .relu-properties-e0 { animation-delay: 0.00s; }
    .relu-properties-s1 { animation-delay: 1.28s; }
    .relu-properties-e1 { animation-delay: 1.28s; }
    .relu-properties-s2 { animation-delay: 2.56s; }
    .relu-properties-e2 { animation-delay: 2.56s; }
    .relu-properties-s3 { animation-delay: 3.84s; }
    .relu-properties-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .relu-properties-conn  { animation: relu-properties-trace 6.4s ease-in-out infinite; }
      .relu-properties-stage { animation: relu-properties-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes relu-properties-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes relu-properties-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .relu-properties-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .relu-properties-stage { animation: relu-properties-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes relu-properties-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="relu-properties-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="relu-properties-bg" width="980" height="322"/>
  <text class="relu-properties-h1"  x="30" y="40">Why ReLU worked</text>
  <text class="relu-properties-sub" x="30" y="64">Four properties, all of them plain.</text>
  <g class="relu-properties-stage relu-properties-s0">
    <rect class="relu-properties-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="relu-properties-step" x="44" y="142">01</text>
    <text class="relu-properties-name" x="70" y="142">max(0, x)</text>
    <text class="relu-properties-desc" x="44" y="166">A single comparison. Cheaper</text>
    <text class="relu-properties-desc" x="44" y="182">than an exponential by a wide</text>
    <text class="relu-properties-desc" x="44" y="198">margin.</text>
  </g>
  <line class="relu-properties-line relu-properties-conn relu-properties-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#relu-properties-tip)"/>
  <g class="relu-properties-stage relu-properties-s1">
    <rect class="relu-properties-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="relu-properties-step" x="280" y="142">02</text>
    <text class="relu-properties-name" x="306" y="142">Derivative is one, or zero</text>
    <text class="relu-properties-desc" x="280" y="166">No shrinking factor on the</text>
    <text class="relu-properties-desc" x="280" y="182">positive side. Gradients survive</text>
    <text class="relu-properties-desc" x="280" y="198">depth.</text>
    <text class="relu-properties-edge" x="280" y="242">no vanishing</text>
  </g>
  <line class="relu-properties-line relu-properties-conn relu-properties-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#relu-properties-tip)"/>
  <g class="relu-properties-stage relu-properties-s2">
    <rect class="relu-properties-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="relu-properties-step" x="516" y="142">03</text>
    <text class="relu-properties-name" x="542" y="142">Sparse activation</text>
    <text class="relu-properties-desc" x="516" y="166">Roughly half the units output</text>
    <text class="relu-properties-desc" x="516" y="182">zero, which is efficient and</text>
    <text class="relu-properties-desc" x="516" y="198">regularising.</text>
  </g>
  <line class="relu-properties-line relu-properties-conn relu-properties-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#relu-properties-tip)"/>
  <g class="relu-properties-stage relu-properties-s3">
    <rect class="relu-properties-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="relu-properties-step" x="752" y="142">04</text>
    <text class="relu-properties-name" x="778" y="142">And units can die</text>
    <text class="relu-properties-desc" x="752" y="166">A unit stuck negative for all</text>
    <text class="relu-properties-desc" x="752" y="182">inputs has zero gradient</text>
    <text class="relu-properties-desc" x="752" y="198">forever.</text>
  </g>
  <text class="relu-properties-sub" x="30" y="304">The dying unit is the price of the hard zero: once a unit's pre-activation is negative for every input in the data, no gradient reaches it and it never recovers.</text>
</svg>
