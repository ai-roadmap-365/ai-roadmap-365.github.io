<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Given &lt;a&gt;&lt;b&gt;, the pattern &lt;.*&gt; takes both.">
  <title>The trap that catches everyone once</title>
  <style>
    .greedy-trap-bg   { fill: #f8fafc; }
    .greedy-trap-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .greedy-trap-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .greedy-trap-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .greedy-trap-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .greedy-trap-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .greedy-trap-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .greedy-trap-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .greedy-trap-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .greedy-trap-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .greedy-trap-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .greedy-trap-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .greedy-trap-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .greedy-trap-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .greedy-trap-stage { opacity: 1; }

    .greedy-trap-s0 { animation-delay: 0.00s; }
    .greedy-trap-e0 { animation-delay: 0.00s; }
    .greedy-trap-s1 { animation-delay: 1.28s; }
    .greedy-trap-e1 { animation-delay: 1.28s; }
    .greedy-trap-s2 { animation-delay: 2.56s; }
    .greedy-trap-e2 { animation-delay: 2.56s; }
    .greedy-trap-s3 { animation-delay: 3.84s; }
    .greedy-trap-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .greedy-trap-conn  { animation: greedy-trap-trace 6.4s ease-in-out infinite; }
      .greedy-trap-stage { animation: greedy-trap-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes greedy-trap-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes greedy-trap-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .greedy-trap-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .greedy-trap-stage { animation: greedy-trap-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes greedy-trap-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="greedy-trap-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="greedy-trap-bg" width="980" height="322"/>
  <text class="greedy-trap-h1"  x="30" y="40">The trap that catches everyone once</text>
  <text class="greedy-trap-sub" x="30" y="64">Given &lt;a&gt;&lt;b&gt;, the pattern &lt;.*&gt; takes both.</text>
  <g class="greedy-trap-stage greedy-trap-s0">
    <rect class="greedy-trap-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="greedy-trap-step" x="44" y="142">01</text>
    <text class="greedy-trap-name" x="70" y="142">.* takes everything</text>
    <text class="greedy-trap-desc" x="44" y="166">To the very end of the line.</text>
    <text class="greedy-trap-desc" x="44" y="182">That is what greedy means.</text>
    <text class="greedy-trap-edge" x="44" y="242">greedy</text>
  </g>
  <line class="greedy-trap-line greedy-trap-conn greedy-trap-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#greedy-trap-tip)"/>
  <g class="greedy-trap-stage greedy-trap-s1">
    <rect class="greedy-trap-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="greedy-trap-step" x="280" y="142">02</text>
    <text class="greedy-trap-name" x="306" y="142">Then it backtracks</text>
    <text class="greedy-trap-desc" x="280" y="166">Only as far as it must to let</text>
    <text class="greedy-trap-desc" x="280" y="182">the final &gt; match.</text>
  </g>
  <line class="greedy-trap-line greedy-trap-conn greedy-trap-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#greedy-trap-tip)"/>
  <g class="greedy-trap-stage greedy-trap-s2">
    <rect class="greedy-trap-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="greedy-trap-step" x="516" y="142">03</text>
    <text class="greedy-trap-name" x="542" y="142">Which lands on the LAST &gt;</text>
    <text class="greedy-trap-desc" x="516" y="166">So the match is &lt;a&gt;&lt;b&gt;, not &lt;a&gt;.</text>
    <text class="greedy-trap-edge" x="516" y="242">too much</text>
  </g>
  <line class="greedy-trap-line greedy-trap-conn greedy-trap-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#greedy-trap-tip)"/>
  <g class="greedy-trap-stage greedy-trap-s3">
    <rect class="greedy-trap-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="greedy-trap-step" x="752" y="142">04</text>
    <text class="greedy-trap-name" x="778" y="142">Two fixes</text>
    <text class="greedy-trap-desc" x="752" y="166">&lt;.*?&gt; makes it lazy. &lt;[^&gt;]*&gt;</text>
    <text class="greedy-trap-desc" x="752" y="182">makes it specific — and is</text>
    <text class="greedy-trap-desc" x="752" y="198">usually better.</text>
    <text class="greedy-trap-edge" x="752" y="242">[^&gt;]*</text>
  </g>
  <text class="greedy-trap-sub" x="30" y="304">Prefer the negated class to the lazy quantifier where you can: it says what you mean, and it does far less backtracking on long lines.</text>
</svg>
