<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Not three points on one axis.">
  <title>Three approaches, three problems</title>
  <style>
    .three-approaches-bg   { fill: #f8fafc; }
    .three-approaches-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-approaches-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-approaches-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-approaches-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-approaches-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-approaches-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-approaches-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-approaches-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-approaches-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-approaches-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-approaches-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-approaches-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .three-approaches-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .three-approaches-stage { opacity: 1; }

    .three-approaches-s0 { animation-delay: 0.00s; }
    .three-approaches-e0 { animation-delay: 0.00s; }
    .three-approaches-s1 { animation-delay: 1.50s; }
    .three-approaches-e1 { animation-delay: 1.50s; }
    .three-approaches-s2 { animation-delay: 3.00s; }
    .three-approaches-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .three-approaches-conn  { animation: three-approaches-trace 6s ease-in-out infinite; }
      .three-approaches-stage { animation: three-approaches-arrive 6s ease-in-out infinite; }
    }
    @keyframes three-approaches-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes three-approaches-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .three-approaches-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .three-approaches-stage { animation: three-approaches-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes three-approaches-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="three-approaches-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="three-approaches-bg" width="980" height="322"/>
  <text class="three-approaches-h1"  x="30" y="40">Three approaches, three problems</text>
  <text class="three-approaches-sub" x="30" y="64">Not three points on one axis.</text>
  <g class="three-approaches-stage three-approaches-s0">
    <rect class="three-approaches-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="three-approaches-step" x="44" y="142">01</text>
    <text class="three-approaches-name" x="70" y="142">Prompting</text>
    <text class="three-approaches-desc" x="44" y="166">Changes what the model is asked. Immediate,</text>
    <text class="three-approaches-desc" x="44" y="182">and costs tokens.</text>
  </g>
  <line class="three-approaches-line three-approaches-conn three-approaches-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#three-approaches-tip)"/>
  <g class="three-approaches-stage three-approaches-s1">
    <rect class="three-approaches-good" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="three-approaches-step" x="359" y="142">02</text>
    <text class="three-approaches-name" x="385" y="142">Retrieval</text>
    <text class="three-approaches-desc" x="359" y="166">Changes what the model knows. Updatable, and</text>
    <text class="three-approaches-desc" x="359" y="182">costs tokens.</text>
  </g>
  <line class="three-approaches-line three-approaches-conn three-approaches-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#three-approaches-tip)"/>
  <g class="three-approaches-stage three-approaches-s2">
    <rect class="three-approaches-box" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="three-approaches-step" x="674" y="142">03</text>
    <text class="three-approaches-name" x="700" y="142">Fine-tuning</text>
    <text class="three-approaches-desc" x="674" y="166">Changes what the model is. Costs once, then</text>
    <text class="three-approaches-desc" x="674" y="182">nothing per request.</text>
  </g>
  <text class="three-approaches-sub" x="30" y="304">Treating these as a ladder from cheap to advanced is the standard mistake: they address different deficiencies, and the right one follows from which deficiency you have.</text>
</svg>
