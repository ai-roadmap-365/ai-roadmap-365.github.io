<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Because nobody judges well at 2 a.m.">
  <title>Deciding by arithmetic</title>
  <style>
    .error-budget-decision-bg   { fill: #f8fafc; }
    .error-budget-decision-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .error-budget-decision-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .error-budget-decision-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .error-budget-decision-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .error-budget-decision-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .error-budget-decision-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .error-budget-decision-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .error-budget-decision-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .error-budget-decision-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .error-budget-decision-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .error-budget-decision-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .error-budget-decision-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .error-budget-decision-row { opacity: 1; }
    .error-budget-decision-r0 { animation-delay: 0.00s; }
    .error-budget-decision-r1 { animation-delay: 0.45s; }
    .error-budget-decision-r2 { animation-delay: 0.90s; }
    .error-budget-decision-r3 { animation-delay: 1.35s; }
    .error-budget-decision-r4 { animation-delay: 1.80s; }
    .error-budget-decision-row { animation: error-budget-decision-reveal 7.3s ease-in-out infinite; }
    @keyframes error-budget-decision-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="error-budget-decision-bg" width="980" height="390"/>
  <text class="error-budget-decision-h1"  x="30" y="40">Deciding by arithmetic</text>
  <text class="error-budget-decision-sub" x="30" y="64">Because nobody judges well at 2 a.m.</text>
  <rect class="error-budget-decision-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="error-budget-decision-name" x="46" y="122">By judgement</text>
  <text class="error-budget-decision-desc" x="46" y="142">Decided under pressure.</text>
  <text class="error-budget-decision-desc error-budget-decision-row error-budget-decision-r0" x="46" y="182">"It feels about the same"</text>
  <text class="error-budget-decision-desc error-budget-decision-row error-budget-decision-r1" x="46" y="216">"It has been up ten minutes"</text>
  <text class="error-budget-decision-desc error-budget-decision-row error-budget-decision-r2" x="46" y="250">Whoever is loudest decides</text>
  <text class="error-budget-decision-desc error-budget-decision-row error-budget-decision-r3" x="46" y="284">The threshold moves to fit the answer</text>
  <text class="error-budget-decision-desc error-budget-decision-row error-budget-decision-r4" x="46" y="318">Nobody writes down what was decided</text>
  <rect class="error-budget-decision-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="error-budget-decision-name" x="526" y="122">By budget</text>
  <text class="error-budget-decision-desc" x="526" y="142">Agreed in advance.</text>
  <text class="error-budget-decision-desc error-budget-decision-row error-budget-decision-r0" x="526" y="182">Error rate 9.0% against a 2.0% budget</text>
  <text class="error-budget-decision-desc error-budget-decision-row error-budget-decision-r1" x="526" y="216">Decided on evidence, not elapsed time</text>
  <text class="error-budget-decision-desc error-budget-decision-row error-budget-decision-r2" x="526" y="250">The rule decides, not the room</text>
  <text class="error-budget-decision-desc error-budget-decision-row error-budget-decision-r3" x="526" y="284">The threshold was set when calm</text>
  <text class="error-budget-decision-desc error-budget-decision-row error-budget-decision-r4" x="526" y="318">The decision and its number are logged</text>
  <text class="error-budget-decision-sub" x="30" y="372">"It has been up ten minutes" and "its error rate is within budget" are different claims, and only the second is about whether the release is correct.</text>
</svg>
