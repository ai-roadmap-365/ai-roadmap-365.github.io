<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things regularisation is not</title>
  <style>
    .reg-not-bg   { fill: #f8fafc; }
    .reg-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reg-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reg-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reg-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reg-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reg-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .reg-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .reg-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .reg-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .reg-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .reg-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .reg-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .reg-not-row { opacity: 1; }
    .reg-not-r0 { animation-delay: 0.00s; }
    .reg-not-r1 { animation-delay: 0.45s; }
    .reg-not-r2 { animation-delay: 0.90s; }
    .reg-not-r3 { animation-delay: 1.35s; }
    .reg-not-r4 { animation-delay: 1.80s; }
    .reg-not-row { animation: reg-not-reveal 7.3s ease-in-out infinite; }
    @keyframes reg-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="reg-not-bg" width="980" height="390"/>
  <text class="reg-not-h1"  x="30" y="40">Four things regularisation is not</text>
  <text class="reg-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="reg-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="reg-not-name" x="46" y="122">The misconception</text>
  <text class="reg-not-desc" x="46" y="142">Commonly held.</text>
  <text class="reg-not-desc reg-not-row reg-not-r0" x="46" y="182">The squared penalty can zero coefficients</text>
  <text class="reg-not-desc reg-not-row reg-not-r1" x="46" y="216">A stronger penalty is always safer</text>
  <text class="reg-not-desc reg-not-row reg-not-r2" x="46" y="250">Penalty values transfer between libraries</text>
  <text class="reg-not-desc reg-not-row reg-not-r3" x="46" y="284">It fixes collinearity</text>
  <text class="reg-not-desc reg-not-row reg-not-r4" x="46" y="318">Scaling is optional</text>
  <rect class="reg-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="reg-not-name" x="526" y="122">What is true</text>
  <text class="reg-not-desc" x="526" y="142">Actually.</text>
  <text class="reg-not-desc reg-not-row reg-not-r0" x="526" y="182">It never does, at any strength</text>
  <text class="reg-not-desc reg-not-row reg-not-r1" x="526" y="216">Too strong underfits badly</text>
  <text class="reg-not-desc reg-not-row reg-not-r2" x="526" y="250">Loss scalings differ; they do not</text>
  <text class="reg-not-desc reg-not-row reg-not-r3" x="526" y="284">It stabilises coefficients; the correlation remains</text>
  <text class="reg-not-desc reg-not-row reg-not-r4" x="526" y="318">Unscaled, the penalty depends on units</text>
  <text class="reg-not-sub" x="30" y="372">The scaling requirement is not optional: an unscaled penalty punishes predictors measured in small units far more than those measured in large ones.</text>
</svg>
