<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Outline, draft, then audit.">
  <title>Three drafting passes</title>
  <style>
    .multi-pass-drafting-bg   { fill: #f8fafc; }
    .multi-pass-drafting-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multi-pass-drafting-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multi-pass-drafting-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multi-pass-drafting-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multi-pass-drafting-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multi-pass-drafting-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .multi-pass-drafting-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .multi-pass-drafting-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .multi-pass-drafting-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .multi-pass-drafting-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .multi-pass-drafting-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .multi-pass-drafting-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .multi-pass-drafting-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .multi-pass-drafting-stage { opacity: 1; }

    .multi-pass-drafting-s0 { animation-delay: 0.00s; }
    .multi-pass-drafting-e0 { animation-delay: 0.00s; }
    .multi-pass-drafting-s1 { animation-delay: 1.50s; }
    .multi-pass-drafting-e1 { animation-delay: 1.50s; }
    .multi-pass-drafting-s2 { animation-delay: 3.00s; }
    .multi-pass-drafting-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .multi-pass-drafting-conn  { animation: multi-pass-drafting-trace 6s ease-in-out infinite; }
      .multi-pass-drafting-stage { animation: multi-pass-drafting-arrive 6s ease-in-out infinite; }
    }
    @keyframes multi-pass-drafting-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes multi-pass-drafting-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .multi-pass-drafting-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .multi-pass-drafting-stage { animation: multi-pass-drafting-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes multi-pass-drafting-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="multi-pass-drafting-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="multi-pass-drafting-bg" width="980" height="322"/>
  <text class="multi-pass-drafting-h1"  x="30" y="40">Three drafting passes</text>
  <text class="multi-pass-drafting-sub" x="30" y="64">Outline, draft, then audit.</text>
  <g class="multi-pass-drafting-stage multi-pass-drafting-s0">
    <rect class="multi-pass-drafting-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="multi-pass-drafting-step" x="44" y="142">01</text>
    <text class="multi-pass-drafting-name" x="70" y="142">Outline and cluster</text>
    <text class="multi-pass-drafting-desc" x="44" y="166">Notes grouped into coherent sections before</text>
    <text class="multi-pass-drafting-desc" x="44" y="182">any prose is written.</text>
  </g>
  <line class="multi-pass-drafting-line multi-pass-drafting-conn multi-pass-drafting-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#multi-pass-drafting-tip)"/>
  <g class="multi-pass-drafting-stage multi-pass-drafting-s1">
    <rect class="multi-pass-drafting-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="multi-pass-drafting-step" x="359" y="142">02</text>
    <text class="multi-pass-drafting-name" x="385" y="142">Draft with claim-level footnotes</text>
    <text class="multi-pass-drafting-desc" x="359" y="166">Markers attached per assertion, not per</text>
    <text class="multi-pass-drafting-desc" x="359" y="182">paragraph.</text>
  </g>
  <line class="multi-pass-drafting-line multi-pass-drafting-conn multi-pass-drafting-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#multi-pass-drafting-tip)"/>
  <g class="multi-pass-drafting-stage multi-pass-drafting-s2">
    <rect class="multi-pass-drafting-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="multi-pass-drafting-step" x="674" y="142">03</text>
    <text class="multi-pass-drafting-name" x="700" y="142">Audit adversarially</text>
    <text class="multi-pass-drafting-desc" x="674" y="166">A critic verifies every assertion is grounded</text>
    <text class="multi-pass-drafting-desc" x="674" y="182">in the note it cites.</text>
    <text class="multi-pass-drafting-edge" x="674" y="242">verification</text>
  </g>
  <text class="multi-pass-drafting-sub" x="30" y="304">The third pass is where hallucinated citations are caught: a marker can point at a real source that does not actually say the thing, and only a check against the note text finds that.</text>
</svg>
