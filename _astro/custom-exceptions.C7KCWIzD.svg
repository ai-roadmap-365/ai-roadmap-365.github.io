<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>Custom exceptions</title>
  <style>
    .custom-exceptions-bg   { fill: #f8fafc; }
    .custom-exceptions-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .custom-exceptions-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .custom-exceptions-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .custom-exceptions-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .custom-exceptions-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .custom-exceptions-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .custom-exceptions-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .custom-exceptions-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .custom-exceptions-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .custom-exceptions-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .custom-exceptions-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .custom-exceptions-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .custom-exceptions-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .custom-exceptions-stage { opacity: 1; }

    .custom-exceptions-s0 { animation-delay: 0.00s; }
    .custom-exceptions-e0 { animation-delay: 0.00s; }
    .custom-exceptions-s1 { animation-delay: 1.28s; }
    .custom-exceptions-e1 { animation-delay: 1.28s; }
    .custom-exceptions-s2 { animation-delay: 2.56s; }
    .custom-exceptions-e2 { animation-delay: 2.56s; }
    .custom-exceptions-s3 { animation-delay: 3.84s; }
    .custom-exceptions-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .custom-exceptions-conn  { animation: custom-exceptions-trace 6.4s ease-in-out infinite; }
      .custom-exceptions-stage { animation: custom-exceptions-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes custom-exceptions-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes custom-exceptions-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .custom-exceptions-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .custom-exceptions-stage { animation: custom-exceptions-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes custom-exceptions-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="custom-exceptions-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="custom-exceptions-bg" width="980" height="322"/>
  <text class="custom-exceptions-h1"  x="30" y="40">Custom exceptions</text>
  <text class="custom-exceptions-sub" x="30" y="64">Four properties.</text>
  <g class="custom-exceptions-stage custom-exceptions-s0">
    <rect class="custom-exceptions-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="custom-exceptions-step" x="44" y="142">01</text>
    <text class="custom-exceptions-name" x="70" y="142">One base exception for your package</text>
    <text class="custom-exceptions-desc" x="44" y="166">So callers can catch everything</text>
    <text class="custom-exceptions-desc" x="44" y="182">from it.</text>
  </g>
  <line class="custom-exceptions-line custom-exceptions-conn custom-exceptions-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#custom-exceptions-tip)"/>
  <g class="custom-exceptions-stage custom-exceptions-s1">
    <rect class="custom-exceptions-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="custom-exceptions-step" x="280" y="142">02</text>
    <text class="custom-exceptions-name" x="306" y="142">With specific subclasses beneath it</text>
    <text class="custom-exceptions-desc" x="280" y="166">So they can also catch narrowly.</text>
  </g>
  <line class="custom-exceptions-line custom-exceptions-conn custom-exceptions-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#custom-exceptions-tip)"/>
  <g class="custom-exceptions-stage custom-exceptions-s2">
    <rect class="custom-exceptions-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="custom-exceptions-step" x="516" y="142">03</text>
    <text class="custom-exceptions-name" x="542" y="142">Carrying structured context, not just a message</text>
    <text class="custom-exceptions-desc" x="516" y="166">The offending value, the field,</text>
    <text class="custom-exceptions-desc" x="516" y="182">the identifier.</text>
  </g>
  <line class="custom-exceptions-line custom-exceptions-conn custom-exceptions-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#custom-exceptions-tip)"/>
  <g class="custom-exceptions-stage custom-exceptions-s3">
    <rect class="custom-exceptions-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="custom-exceptions-step" x="752" y="142">04</text>
    <text class="custom-exceptions-name" x="778" y="142">And named for the problem, not the location</text>
    <text class="custom-exceptions-desc" x="752" y="166">Which is what a caller reasons</text>
    <text class="custom-exceptions-desc" x="752" y="182">about.</text>
  </g>
  <text class="custom-exceptions-sub" x="30" y="304">Carrying structured context is what lets a caller act on the exception rather than parse its message, which is otherwise a common and fragile pattern.</text>
</svg>
