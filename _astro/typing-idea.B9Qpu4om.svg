<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four things.">
  <title>What static typing adds</title>
  <style>
    .typing-idea-bg   { fill: #f8fafc; }
    .typing-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .typing-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .typing-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .typing-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .typing-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .typing-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .typing-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .typing-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .typing-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .typing-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .typing-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .typing-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .typing-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .typing-idea-stage { opacity: 1; }

    .typing-idea-s0 { animation-delay: 0.00s; }
    .typing-idea-e0 { animation-delay: 0.00s; }
    .typing-idea-s1 { animation-delay: 1.28s; }
    .typing-idea-e1 { animation-delay: 1.28s; }
    .typing-idea-s2 { animation-delay: 2.56s; }
    .typing-idea-e2 { animation-delay: 2.56s; }
    .typing-idea-s3 { animation-delay: 3.84s; }
    .typing-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .typing-idea-conn  { animation: typing-idea-trace 6.4s ease-in-out infinite; }
      .typing-idea-stage { animation: typing-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes typing-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes typing-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .typing-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .typing-idea-stage { animation: typing-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes typing-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="typing-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="typing-idea-bg" width="980" height="322"/>
  <text class="typing-idea-h1"  x="30" y="40">What static typing adds</text>
  <text class="typing-idea-sub" x="30" y="64">Four things.</text>
  <g class="typing-idea-stage typing-idea-s0">
    <rect class="typing-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="typing-idea-step" x="44" y="142">01</text>
    <text class="typing-idea-name" x="70" y="142">A class of error caught before running</text>
    <text class="typing-idea-desc" x="44" y="166">Wrong types, missing attributes,</text>
    <text class="typing-idea-desc" x="44" y="182">bad returns.</text>
  </g>
  <line class="typing-idea-line typing-idea-conn typing-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#typing-idea-tip)"/>
  <g class="typing-idea-stage typing-idea-s1">
    <rect class="typing-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="typing-idea-step" x="280" y="142">02</text>
    <text class="typing-idea-name" x="306" y="142">Documentation the checker verifies</text>
    <text class="typing-idea-desc" x="280" y="166">Which cannot drift from the</text>
    <text class="typing-idea-desc" x="280" y="182">code.</text>
  </g>
  <line class="typing-idea-line typing-idea-conn typing-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#typing-idea-tip)"/>
  <g class="typing-idea-stage typing-idea-s2">
    <rect class="typing-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="typing-idea-step" x="516" y="142">03</text>
    <text class="typing-idea-name" x="542" y="142">Editor completion and navigation</text>
    <text class="typing-idea-desc" x="516" y="166">Which speeds ordinary work.</text>
  </g>
  <line class="typing-idea-line typing-idea-conn typing-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#typing-idea-tip)"/>
  <g class="typing-idea-stage typing-idea-s3">
    <rect class="typing-idea-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="typing-idea-step" x="752" y="142">04</text>
    <text class="typing-idea-name" x="778" y="142">And safer refactoring across a codebase</text>
    <text class="typing-idea-desc" x="752" y="166">Since a changed signature</text>
    <text class="typing-idea-desc" x="752" y="182">surfaces every caller.</text>
  </g>
  <text class="typing-idea-sub" x="30" y="304">Surfacing every caller of a changed signature is where the value concentrates in a large codebase, and it is hard to get any other way.</text>
</svg>
