<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>What scaling changes</title>
  <style>
    .scaling-150-bg   { fill: #f8fafc; }
    .scaling-150-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-150-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-150-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-150-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-150-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-150-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scaling-150-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scaling-150-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scaling-150-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scaling-150-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scaling-150-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scaling-150-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .scaling-150-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .scaling-150-stage { opacity: 1; }

    .scaling-150-s0 { animation-delay: 0.00s; }
    .scaling-150-e0 { animation-delay: 0.00s; }
    .scaling-150-s1 { animation-delay: 1.28s; }
    .scaling-150-e1 { animation-delay: 1.28s; }
    .scaling-150-s2 { animation-delay: 2.56s; }
    .scaling-150-e2 { animation-delay: 2.56s; }
    .scaling-150-s3 { animation-delay: 3.84s; }
    .scaling-150-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .scaling-150-conn  { animation: scaling-150-trace 6.4s ease-in-out infinite; }
      .scaling-150-stage { animation: scaling-150-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes scaling-150-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes scaling-150-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .scaling-150-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .scaling-150-stage { animation: scaling-150-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes scaling-150-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="scaling-150-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="scaling-150-bg" width="980" height="322"/>
  <text class="scaling-150-h1"  x="30" y="40">What scaling changes</text>
  <text class="scaling-150-sub" x="30" y="64">Four steps.</text>
  <g class="scaling-150-stage scaling-150-s0">
    <rect class="scaling-150-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="scaling-150-step" x="44" y="142">01</text>
    <text class="scaling-150-name" x="70" y="142">Coefficients change, because their units change</text>
    <text class="scaling-150-desc" x="44" y="166">Per standard deviation instead</text>
    <text class="scaling-150-desc" x="44" y="182">of per unit.</text>
  </g>
  <line class="scaling-150-line scaling-150-conn scaling-150-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#scaling-150-tip)"/>
  <g class="scaling-150-stage scaling-150-s1">
    <rect class="scaling-150-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="scaling-150-step" x="280" y="142">02</text>
    <text class="scaling-150-name" x="306" y="142">Predictions do not change at all</text>
    <text class="scaling-150-desc" x="280" y="166">The fitted surface is identical.</text>
  </g>
  <line class="scaling-150-line scaling-150-conn scaling-150-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#scaling-150-tip)"/>
  <g class="scaling-150-stage scaling-150-s2">
    <rect class="scaling-150-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="scaling-150-step" x="516" y="142">03</text>
    <text class="scaling-150-name" x="542" y="142">And collinearity is entirely unaffected</text>
    <text class="scaling-150-desc" x="516" y="166">Scaling does not fix it, despite</text>
    <text class="scaling-150-desc" x="516" y="182">the common claim.</text>
  </g>
  <line class="scaling-150-line scaling-150-conn scaling-150-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#scaling-150-tip)"/>
  <g class="scaling-150-stage scaling-150-s3">
    <rect class="scaling-150-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="scaling-150-step" x="752" y="142">04</text>
    <text class="scaling-150-name" x="778" y="142">But it is required for regularisation to be fair</text>
    <text class="scaling-150-desc" x="752" y="166">Otherwise the penalty depends on</text>
    <text class="scaling-150-desc" x="752" y="182">units.</text>
  </g>
  <text class="scaling-150-sub" x="30" y="304">The claim that scaling fixes collinearity is common and wrong: the correlation between two columns is unchanged by rescaling either of them.</text>
</svg>
