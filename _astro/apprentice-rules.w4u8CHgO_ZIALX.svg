<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Rules, or examples.">
  <title>Learning a craft</title>
  <style>
    .apprentice-rules-bg   { fill: #f8fafc; }
    .apprentice-rules-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .apprentice-rules-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .apprentice-rules-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .apprentice-rules-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .apprentice-rules-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .apprentice-rules-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .apprentice-rules-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .apprentice-rules-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .apprentice-rules-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .apprentice-rules-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .apprentice-rules-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .apprentice-rules-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .apprentice-rules-row { opacity: 1; }
    .apprentice-rules-r0 { animation-delay: 0.00s; }
    .apprentice-rules-r1 { animation-delay: 0.45s; }
    .apprentice-rules-r2 { animation-delay: 0.90s; }
    .apprentice-rules-r3 { animation-delay: 1.35s; }
    .apprentice-rules-r4 { animation-delay: 1.80s; }
    .apprentice-rules-row { animation: apprentice-rules-reveal 7.3s ease-in-out infinite; }
    @keyframes apprentice-rules-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="apprentice-rules-bg" width="980" height="390"/>
  <text class="apprentice-rules-h1"  x="30" y="40">Learning a craft</text>
  <text class="apprentice-rules-sub" x="30" y="64">Rules, or examples.</text>
  <rect class="apprentice-rules-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="apprentice-rules-name" x="46" y="122">Being told the rules</text>
  <text class="apprentice-rules-desc" x="46" y="142">Explicit.</text>
  <text class="apprentice-rules-desc apprentice-rules-row apprentice-rules-r0" x="46" y="182">Every rule stated and written down</text>
  <text class="apprentice-rules-desc apprentice-rules-row apprentice-rules-r1" x="46" y="216">Can be checked against the book</text>
  <text class="apprentice-rules-desc apprentice-rules-row apprentice-rules-r2" x="46" y="250">Works where rules exist</text>
  <text class="apprentice-rules-desc apprentice-rules-row apprentice-rules-r3" x="46" y="284">Fails on cases nobody anticipated</text>
  <text class="apprentice-rules-desc apprentice-rules-row apprentice-rules-r4" x="46" y="318">This is a rule-based system</text>
  <rect class="apprentice-rules-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="apprentice-rules-name" x="526" y="122">Watching many examples</text>
  <text class="apprentice-rules-desc" x="526" y="142">Implicit.</text>
  <text class="apprentice-rules-desc apprentice-rules-row apprentice-rules-r0" x="526" y="182">Patterns absorbed, never stated</text>
  <text class="apprentice-rules-desc apprentice-rules-row apprentice-rules-r1" x="526" y="216">Cannot be checked against anything</text>
  <text class="apprentice-rules-desc apprentice-rules-row apprentice-rules-r2" x="526" y="250">Works where rules cannot be written</text>
  <text class="apprentice-rules-desc apprentice-rules-row apprentice-rules-r3" x="526" y="284">Fails on cases unlike what was seen</text>
  <text class="apprentice-rules-desc apprentice-rules-row apprentice-rules-r4" x="526" y="318">This is a learned model</text>
  <text class="apprentice-rules-sub" x="30" y="372">Both learners fail on the unfamiliar, and the difference is that one can tell you which rule it applied and the other cannot.</text>
</svg>
