<svg role="img" aria-label="MNIST handwritten digit classification pipeline showing 28x28 image flattening 784 input neurons 128 hidden ReLU units and 10 Softmax output probabilities" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>MNIST Handwritten Digit Classification Network Architecture</title>
  <defs>
    <linearGradient id="bg203a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card203" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg203a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">MNIST TWO-LAYER NEURAL NETWORK IN PURE NUMPY</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">784 Flattened Pixel Inputs -> 128 Hidden ReLU Neurons -> 10 Softmax Digit Class Probabilities</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card203)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Image Box -->
    <rect x="25" y="35" width="125" height="225" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="87" y="60" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">MNIST Digit "7"</text>
    <!-- Pixel grid 28x28 icon -->
    <rect x="47" y="80" width="80" height="80" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="87" y="130" fill="#f8fafc" font-size="32" font-weight="700" text-anchor="middle">7</text>
    <text x="87" y="185" fill="#cbd5e1" font-size="9" text-anchor="middle">28 x 28 Pixels</text>
    <text x="87" y="202" fill="#94a3b8" font-size="8" text-anchor="middle">Normalized: [0, 1]</text>
    <text x="87" y="225" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">Flatten -> 784-D</text>

    <!-- Arrow to Hidden -->
    <line x1="150" y1="147" x2="230" y2="147" stroke="#94a3b8" stroke-width="2"/>
    <text x="190" y="137" fill="#fbbf24" font-size="8" text-anchor="middle">W1 (128x784)</text>

    <!-- Hidden Layer Box -->
    <rect x="230" y="35" width="220" height="225" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="340" y="60" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Hidden Layer (128 Neurons)</text>
    <text x="340" y="80" fill="#94a3b8" font-size="9" text-anchor="middle">Z1 = W1 X + b1</text>
    <text x="340" y="98" fill="#34d399" font-size="9" text-anchor="middle">A1 = ReLU(Z1)</text>
    <!-- Feature detector nodes -->
    <circle cx="280" cy="135" r="14" fill="#1e293b" stroke="#10b981"/>
    <circle cx="340" cy="135" r="14" fill="#1e293b" stroke="#10b981"/>
    <circle cx="400" cy="135" r="14" fill="#1e293b" stroke="#10b981"/>
    <text x="340" y="180" fill="#cbd5e1" font-size="9" text-anchor="middle">Learned Stroke Detectors</text>
    <text x="340" y="200" fill="#94a3b8" font-size="8" text-anchor="middle">(Horizontal bars, loops, slants)</text>
    <text x="340" y="235" fill="#10b981" font-size="9" font-weight="700" text-anchor="middle">He Initialization</text>

    <!-- Arrow to Output -->
    <line x1="450" y1="147" x2="530" y2="147" stroke="#94a3b8" stroke-width="2"/>
    <text x="490" y="137" fill="#fbbf24" font-size="8" text-anchor="middle">W2 (10x128)</text>

    <!-- Output Layer Box -->
    <rect x="530" y="35" width="205" height="225" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" rx="6"/>
    <text x="632" y="60" fill="#fb7185" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Output Layer (10 Classes)</text>
    <text x="632" y="80" fill="#94a3b8" font-size="9" text-anchor="middle">Z2 = W2 A1 + b2</text>
    <text x="632" y="98" fill="#fb7185" font-size="9" text-anchor="middle">A2 = Softmax(Z2)</text>
    <!-- Bar charts for probabilities -->
    <text x="560" y="130" fill="#94a3b8" font-size="8">P(Digit=0): 0.001</text>
    <text x="560" y="150" fill="#94a3b8" font-size="8">P(Digit=1): 0.002</text>
    <text x="560" y="170" fill="#fb7185" font-size="9" font-weight="700">P(Digit=7): 0.985 [PRED]</text>
    <text x="560" y="190" fill="#94a3b8" font-size="8">P(Digit=9): 0.008</text>
    <text x="632" y="235" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">Test Accuracy &gt;= 95%</text>
  </g>
</svg>
