<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Three methods, none decisive.">
  <title>Choosing k</title>
  <style>
    .choosing-k-bg   { fill: #f8fafc; }
    .choosing-k-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .choosing-k-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .choosing-k-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .choosing-k-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .choosing-k-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .choosing-k-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .choosing-k-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .choosing-k-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .choosing-k-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .choosing-k-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .choosing-k-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .choosing-k-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .choosing-k-row { opacity: 1; }
    .choosing-k-r0 { animation-delay: 0.00s; }
    .choosing-k-r1 { animation-delay: 0.45s; }
    .choosing-k-r2 { animation-delay: 0.90s; }
    .choosing-k-r3 { animation-delay: 1.35s; }
    .choosing-k-r4 { animation-delay: 1.80s; }
    .choosing-k-row { animation: choosing-k-reveal 7.3s ease-in-out infinite; }
    @keyframes choosing-k-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="choosing-k-bg" width="980" height="390"/>
  <text class="choosing-k-h1"  x="30" y="40">Choosing k</text>
  <text class="choosing-k-sub" x="30" y="64">Three methods, none decisive.</text>
  <rect class="choosing-k-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="choosing-k-name" x="46" y="122">The method</text>
  <text class="choosing-k-desc" x="46" y="142">How it chooses.</text>
  <text class="choosing-k-desc choosing-k-row choosing-k-r0" x="46" y="182">Elbow — where the objective stops falling sharply</text>
  <text class="choosing-k-desc choosing-k-row choosing-k-r1" x="46" y="216">Silhouette — how well-separated the clusters are</text>
  <text class="choosing-k-desc choosing-k-row choosing-k-r2" x="46" y="250">Gap statistic — compared against random data</text>
  <text class="choosing-k-desc choosing-k-row choosing-k-r3" x="46" y="284">Domain knowledge — how many groups should exist</text>
  <text class="choosing-k-desc choosing-k-row choosing-k-r4" x="46" y="318">Downstream task — which k works best</text>
  <rect class="choosing-k-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="choosing-k-name" x="526" y="122">The catch</text>
  <text class="choosing-k-desc" x="526" y="142">Why it is not decisive.</text>
  <text class="choosing-k-desc choosing-k-row choosing-k-r0" x="526" y="182">The elbow is often absent or ambiguous</text>
  <text class="choosing-k-desc choosing-k-row choosing-k-r1" x="526" y="216">Assumes clusters are compact and separated</text>
  <text class="choosing-k-desc choosing-k-row choosing-k-r2" x="526" y="250">Expensive, and assumes a null model</text>
  <text class="choosing-k-desc choosing-k-row choosing-k-r3" x="526" y="284">Frequently unavailable</text>
  <text class="choosing-k-desc choosing-k-row choosing-k-r4" x="526" y="318">The most defensible, and the least used</text>
  <text class="choosing-k-sub" x="30" y="372">Choosing k by downstream task performance is the most defensible method and the least used, because it requires the downstream task to exist first.</text>
</svg>
