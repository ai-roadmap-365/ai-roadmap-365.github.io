<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things merging is not</title>
  <style>
    .merge-not-bg   { fill: #f8fafc; }
    .merge-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .merge-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .merge-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .merge-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .merge-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .merge-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .merge-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .merge-not-row { opacity: 1; }
    .merge-not-r0 { animation-delay: 0.00s; }
    .merge-not-r1 { animation-delay: 0.45s; }
    .merge-not-r2 { animation-delay: 0.90s; }
    .merge-not-r3 { animation-delay: 1.35s; }
    .merge-not-r4 { animation-delay: 1.80s; }
    .merge-not-row { animation: merge-not-reveal 7.3s ease-in-out infinite; }
    @keyframes merge-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="merge-not-bg" width="980" height="390"/>
  <text class="merge-not-h1"  x="30" y="40">Four things merging is not</text>
  <text class="merge-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="merge-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="merge-not-name" x="46" y="122">The misconception</text>
  <text class="merge-not-desc" x="46" y="142">Commonly held.</text>
  <text class="merge-not-desc merge-not-row merge-not-r0" x="46" y="182">Merging preserves the row count</text>
  <text class="merge-not-desc merge-not-row merge-not-r1" x="46" y="216">Wide format is always more readable</text>
  <text class="merge-not-desc merge-not-row merge-not-r2" x="46" y="250">Concatenation and merging are similar</text>
  <text class="merge-not-desc merge-not-row merge-not-r3" x="46" y="284">Keys match if they look the same</text>
  <text class="merge-not-desc merge-not-row merge-not-r4" x="46" y="318">Reshaping is cosmetic</text>
  <rect class="merge-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="merge-not-name" x="526" y="122">What is true</text>
  <text class="merge-not-desc" x="526" y="142">Actually.</text>
  <text class="merge-not-desc merge-not-row merge-not-r0" x="526" y="182">It can multiply or drop rows</text>
  <text class="merge-not-desc merge-not-row merge-not-r1" x="526" y="216">Long format is what tools expect</text>
  <text class="merge-not-desc merge-not-row merge-not-r2" x="526" y="250">One matches on a key; one does not</text>
  <text class="merge-not-desc merge-not-row merge-not-r3" x="526" y="284">Types and whitespace must match too</text>
  <text class="merge-not-desc merge-not-row merge-not-r4" x="526" y="318">It determines what analysis is possible</text>
  <text class="merge-not-sub" x="30" y="372">Whitespace preventing a match is a genuinely common cause of merge failure, and stripping key columns before merging costs nothing.</text>
</svg>
