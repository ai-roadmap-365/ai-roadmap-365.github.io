<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are obligations.">
  <title>Four consequences of interpretability</title>
  <style>
    .interpret-implications-bg   { fill: #f8fafc; }
    .interpret-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interpret-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interpret-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interpret-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interpret-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interpret-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .interpret-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .interpret-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .interpret-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .interpret-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .interpret-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .interpret-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .interpret-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .interpret-implications-stage { opacity: 1; }

    .interpret-implications-s0 { animation-delay: 0.00s; }
    .interpret-implications-e0 { animation-delay: 0.00s; }
    .interpret-implications-s1 { animation-delay: 1.28s; }
    .interpret-implications-e1 { animation-delay: 1.28s; }
    .interpret-implications-s2 { animation-delay: 2.56s; }
    .interpret-implications-e2 { animation-delay: 2.56s; }
    .interpret-implications-s3 { animation-delay: 3.84s; }
    .interpret-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .interpret-implications-conn  { animation: interpret-implications-trace 6.4s ease-in-out infinite; }
      .interpret-implications-stage { animation: interpret-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes interpret-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes interpret-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .interpret-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .interpret-implications-stage { animation: interpret-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes interpret-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="interpret-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="interpret-implications-bg" width="980" height="322"/>
  <text class="interpret-implications-h1"  x="30" y="40">Four consequences of interpretability</text>
  <text class="interpret-implications-sub" x="30" y="64">Two are obligations.</text>
  <g class="interpret-implications-stage interpret-implications-s0">
    <rect class="interpret-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="interpret-implications-step" x="44" y="142">01</text>
    <text class="interpret-implications-name" x="70" y="142">Complex models become deployable in regulated domains</text>
    <text class="interpret-implications-desc" x="44" y="166">Which was previously closed to</text>
    <text class="interpret-implications-desc" x="44" y="182">them.</text>
  </g>
  <line class="interpret-implications-line interpret-implications-conn interpret-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#interpret-implications-tip)"/>
  <g class="interpret-implications-stage interpret-implications-s1">
    <rect class="interpret-implications-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="interpret-implications-step" x="280" y="142">02</text>
    <text class="interpret-implications-name" x="306" y="142">And attribution finds leakage quickly</text>
    <text class="interpret-implications-desc" x="280" y="166">An identifier ranked highly is a</text>
    <text class="interpret-implications-desc" x="280" y="182">diagnostic.</text>
  </g>
  <line class="interpret-implications-line interpret-implications-conn interpret-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#interpret-implications-tip)"/>
  <g class="interpret-implications-stage interpret-implications-s2">
    <rect class="interpret-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="interpret-implications-step" x="516" y="142">03</text>
    <text class="interpret-implications-name" x="542" y="142">With a legal duty to explain in some jurisdictions</text>
    <text class="interpret-implications-desc" x="516" y="166">Which makes this a compliance</text>
    <text class="interpret-implications-desc" x="516" y="182">requirement.</text>
  </g>
  <line class="interpret-implications-line interpret-implications-conn interpret-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#interpret-implications-tip)"/>
  <g class="interpret-implications-stage interpret-implications-s3">
    <rect class="interpret-implications-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="interpret-implications-step" x="752" y="142">04</text>
    <text class="interpret-implications-name" x="778" y="142">But explanations get read as causal claims</text>
    <text class="interpret-implications-desc" x="752" y="166">Which they are not, and</text>
    <text class="interpret-implications-desc" x="752" y="182">stakeholders will assume</text>
    <text class="interpret-implications-desc" x="752" y="198">otherwise.</text>
  </g>
  <text class="interpret-implications-sub" x="30" y="304">Using attribution to find leakage is the most immediately useful application: a feature that dominates for no defensible reason is usually a leak rather than a discovery.</text>
</svg>
