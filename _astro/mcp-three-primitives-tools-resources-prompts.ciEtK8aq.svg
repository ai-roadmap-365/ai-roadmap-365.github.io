<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="MCP Three Primitives Tools Resources Prompts">
  <title>MCP Three Primitives Tools Resources Prompts</title>
  <defs>
    <style>
      .d298a-bg { fill: #f8fafc; }
      .d298a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d298a-tool { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d298a-res { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d298a-pmt { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d298a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d298a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d298a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
      .d298a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d298a-bg" />
  
  <text x="40" y="40" class="d298a-title">The Three MCP Primitives: Tools, Resources, Prompts</text>
  <text x="40" y="65" class="d298a-subtitle">MCP Three Primitives Tools Resources Prompts diagram comparing model-controlled Tools, application-controlled Resources, and user-controlled Prompts</text>
  
  <!-- 1. Tools -->
  <rect x="40" y="100" width="250" height="300" class="d298a-tool" />
  <text x="55" y="130" class="d298a-header" fill="#1d4ed8">1. Tools (Actions)</text>
  <text x="55" y="155" class="d298a-text" font-weight="600">Controlled by: Model (LLM)</text>
  <text x="55" y="175" class="d298a-text">• Executable Python/JS functions</text>
  <text x="55" y="195" class="d298a-text">• May produce side effects</text>
  <text x="55" y="215" class="d298a-text">• Validated via JSON Schema</text>
  <text x="55" y="245" class="d298a-text" font-weight="600">Examples:</text>
  <text x="55" y="265" class="d298a-text">- `query_sql(query)`</text>
  <text x="55" y="280" class="d298a-text">- `send_slack_message(msg)`</text>
  <text x="55" y="295" class="d298a-text">- `create_github_pr(title)`</text>
  
  <!-- 2. Resources -->
  <rect x="325" y="100" width="250" height="300" class="d298a-res" />
  <text x="340" y="130" class="d298a-header" fill="#15803d">2. Resources (Context Data)</text>
  <text x="340" y="155" class="d298a-text" font-weight="600">Controlled by: Host App / User</text>
  <text x="340" y="175" class="d298a-text">• Passive, read-only data</text>
  <text x="340" y="195" class="d298a-text">• Addressed via URI schemes</text>
  <text x="340" y="215" class="d298a-text">• Real-time change push updates</text>
  <text x="340" y="245" class="d298a-text" font-weight="600">Examples:</text>
  <text x="340" y="265" class="d298a-text">- `postgres://users/schema`</text>
  <text x="340" y="280" class="d298a-text">- `file:///workspace/app.py`</text>
  <text x="340" y="295" class="d298a-text">- `git://repo/commits/latest`</text>
  
  <!-- 3. Prompts -->
  <rect x="610" y="100" width="250" height="300" class="d298a-pmt" />
  <text x="625" y="130" class="d298a-header" fill="#7e22ce">3. Prompts (Workflows)</text>
  <text x="625" y="155" class="d298a-text" font-weight="600">Controlled by: Human User</text>
  <text x="625" y="175" class="d298a-text">• Parameterized slash commands</text>
  <text x="625" y="195" class="d298a-text">• Pre-engineered prompt templates</text>
  <text x="625" y="215" class="d298a-text">• Injects tailored instructions</text>
  <text x="625" y="245" class="d298a-text" font-weight="600">Examples:</text>
  <text x="625" y="265" class="d298a-text">- `/review-code {file}`</text>
  <text x="625" y="280" class="d298a-text">- `/debug-test {test_id}`</text>
  <text x="625" y="295" class="d298a-text">- `/explain-architecture`</text>
</svg>