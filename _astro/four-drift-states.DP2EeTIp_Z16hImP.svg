<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="At the source? In the index?">
  <title>Four states, two questions</title>
  <style>
    .four-drift-states-bg   { fill: #f8fafc; }
    .four-drift-states-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-drift-states-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-drift-states-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-drift-states-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-drift-states-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-drift-states-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .four-drift-states-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .four-drift-states-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .four-drift-states-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .four-drift-states-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .four-drift-states-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .four-drift-states-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .four-drift-states-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .four-drift-states-stage { opacity: 1; }

    .four-drift-states-s0 { animation-delay: 0.00s; }
    .four-drift-states-e0 { animation-delay: 0.00s; }
    .four-drift-states-s1 { animation-delay: 1.28s; }
    .four-drift-states-e1 { animation-delay: 1.28s; }
    .four-drift-states-s2 { animation-delay: 2.56s; }
    .four-drift-states-e2 { animation-delay: 2.56s; }
    .four-drift-states-s3 { animation-delay: 3.84s; }
    .four-drift-states-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .four-drift-states-conn  { animation: four-drift-states-trace 6.4s ease-in-out infinite; }
      .four-drift-states-stage { animation: four-drift-states-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes four-drift-states-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes four-drift-states-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .four-drift-states-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .four-drift-states-stage { animation: four-drift-states-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes four-drift-states-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="four-drift-states-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="four-drift-states-bg" width="980" height="322"/>
  <text class="four-drift-states-h1"  x="30" y="40">Four states, two questions</text>
  <text class="four-drift-states-sub" x="30" y="64">At the source? In the index?</text>
  <g class="four-drift-states-stage four-drift-states-s0">
    <rect class="four-drift-states-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="four-drift-states-step" x="44" y="142">01</text>
    <text class="four-drift-states-name" x="70" y="142">Fresh</text>
    <text class="four-drift-states-desc" x="44" y="166">In both, same version. Nothing</text>
    <text class="four-drift-states-desc" x="44" y="182">to do.</text>
  </g>
  <line class="four-drift-states-line four-drift-states-conn four-drift-states-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#four-drift-states-tip)"/>
  <g class="four-drift-states-stage four-drift-states-s1">
    <rect class="four-drift-states-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="four-drift-states-step" x="280" y="142">02</text>
    <text class="four-drift-states-name" x="306" y="142">Missing</text>
    <text class="four-drift-states-desc" x="280" y="166">At source, not indexed.</text>
    <text class="four-drift-states-desc" x="280" y="182">Annoying, and self-reporting —</text>
    <text class="four-drift-states-desc" x="280" y="198">people complain.</text>
    <text class="four-drift-states-edge" x="280" y="242">visible</text>
  </g>
  <line class="four-drift-states-line four-drift-states-conn four-drift-states-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#four-drift-states-tip)"/>
  <g class="four-drift-states-stage four-drift-states-s2">
    <rect class="four-drift-states-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="four-drift-states-step" x="516" y="142">03</text>
    <text class="four-drift-states-name" x="542" y="142">Stale</text>
    <text class="four-drift-states-desc" x="516" y="166">In both, older version. The</text>
    <text class="four-drift-states-desc" x="516" y="182">system answers confidently from</text>
    <text class="four-drift-states-desc" x="516" y="198">superseded text.</text>
  </g>
  <line class="four-drift-states-line four-drift-states-conn four-drift-states-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#four-drift-states-tip)"/>
  <g class="four-drift-states-stage four-drift-states-s3">
    <rect class="four-drift-states-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="four-drift-states-step" x="752" y="142">04</text>
    <text class="four-drift-states-name" x="778" y="142">Orphaned</text>
    <text class="four-drift-states-desc" x="752" y="166">Indexed, deleted at source. The</text>
    <text class="four-drift-states-desc" x="752" y="182">only one you cannot find by</text>
    <text class="four-drift-states-desc" x="752" y="198">iterating the source.</text>
    <text class="four-drift-states-edge" x="752" y="242">dangerous</text>
  </g>
  <text class="four-drift-states-sub" x="30" y="304">The asymmetry in consequence is the whole design argument: missing documents report themselves through user complaints, and orphaned ones are quoted as answers with nothing looking wrong.</text>
</svg>
