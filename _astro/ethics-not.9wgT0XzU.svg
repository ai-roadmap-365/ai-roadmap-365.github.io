<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things data ethics is not</title>
  <style>
    .ethics-not-bg   { fill: #f8fafc; }
    .ethics-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ethics-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ethics-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ethics-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ethics-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ethics-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ethics-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ethics-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ethics-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ethics-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ethics-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ethics-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ethics-not-row { opacity: 1; }
    .ethics-not-r0 { animation-delay: 0.00s; }
    .ethics-not-r1 { animation-delay: 0.45s; }
    .ethics-not-r2 { animation-delay: 0.90s; }
    .ethics-not-r3 { animation-delay: 1.35s; }
    .ethics-not-r4 { animation-delay: 1.80s; }
    .ethics-not-row { animation: ethics-not-reveal 7.3s ease-in-out infinite; }
    @keyframes ethics-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="ethics-not-bg" width="980" height="390"/>
  <text class="ethics-not-h1"  x="30" y="40">Four things data ethics is not</text>
  <text class="ethics-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="ethics-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="ethics-not-name" x="46" y="122">The misconception</text>
  <text class="ethics-not-desc" x="46" y="142">Commonly held.</text>
  <text class="ethics-not-desc ethics-not-row ethics-not-r0" x="46" y="182">Legal compliance is sufficient</text>
  <text class="ethics-not-desc ethics-not-row ethics-not-r1" x="46" y="216">Anonymised data carries no risk</text>
  <text class="ethics-not-desc ethics-not-row ethics-not-r2" x="46" y="250">Removing protected attributes removes bias</text>
  <text class="ethics-not-desc ethics-not-row ethics-not-r3" x="46" y="284">Bias is a modelling problem</text>
  <text class="ethics-not-desc ethics-not-row ethics-not-r4" x="46" y="318">Ethics slows the work down</text>
  <rect class="ethics-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="ethics-not-name" x="526" y="122">What is true</text>
  <text class="ethics-not-desc" x="526" y="142">Actually.</text>
  <text class="ethics-not-desc ethics-not-row ethics-not-r0" x="526" y="182">Law is a floor, not a standard</text>
  <text class="ethics-not-desc ethics-not-row ethics-not-r1" x="526" y="216">Re-identification is often possible</text>
  <text class="ethics-not-desc ethics-not-row ethics-not-r2" x="526" y="250">Proxies reconstruct them</text>
  <text class="ethics-not-desc ethics-not-row ethics-not-r3" x="526" y="284">It enters at collection first</text>
  <text class="ethics-not-desc ethics-not-row ethics-not-r4" x="526" y="318">Retrofitting after a failure costs far more</text>
  <text class="ethics-not-sub" x="30" y="372">Re-identification from supposedly anonymous data has been demonstrated repeatedly with very few attributes, which makes it a practical rather than theoretical concern.</text>
</svg>
