<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Both widely repeated.">
  <title>Two false reassurances</title>
  <style>
    .not-md5-not-maplocation-bg   { fill: #f8fafc; }
    .not-md5-not-maplocation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-md5-not-maplocation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-md5-not-maplocation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-md5-not-maplocation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-md5-not-maplocation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-md5-not-maplocation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-md5-not-maplocation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .not-md5-not-maplocation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .not-md5-not-maplocation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .not-md5-not-maplocation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .not-md5-not-maplocation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .not-md5-not-maplocation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-md5-not-maplocation-row { opacity: 1; }
    .not-md5-not-maplocation-r0 { animation-delay: 0.00s; }
    .not-md5-not-maplocation-r1 { animation-delay: 0.45s; }
    .not-md5-not-maplocation-r2 { animation-delay: 0.90s; }
    .not-md5-not-maplocation-r3 { animation-delay: 1.35s; }
    .not-md5-not-maplocation-r4 { animation-delay: 1.80s; }
    .not-md5-not-maplocation-row { animation: not-md5-not-maplocation-reveal 7.3s ease-in-out infinite; }
    @keyframes not-md5-not-maplocation-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="not-md5-not-maplocation-bg" width="980" height="390"/>
  <text class="not-md5-not-maplocation-h1"  x="30" y="40">Two false reassurances</text>
  <text class="not-md5-not-maplocation-sub" x="30" y="64">Both widely repeated.</text>
  <rect class="not-md5-not-maplocation-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="not-md5-not-maplocation-name" x="46" y="122">Real controls</text>
  <text class="not-md5-not-maplocation-desc" x="46" y="142">Four mechanisms.</text>
  <text class="not-md5-not-maplocation-desc not-md5-not-maplocation-row not-md5-not-maplocation-r0" x="46" y="182">SafeTensors exclusively</text>
  <text class="not-md5-not-maplocation-desc not-md5-not-maplocation-row not-md5-not-maplocation-r1" x="46" y="216">Static AST scanning in CI</text>
  <text class="not-md5-not-maplocation-desc not-md5-not-maplocation-row not-md5-not-maplocation-r2" x="46" y="250">Sigstore signatures on weights and tokenizers</text>
  <text class="not-md5-not-maplocation-desc not-md5-not-maplocation-row not-md5-not-maplocation-r3" x="46" y="284">SHA256 digests, verified at admission</text>
  <text class="not-md5-not-maplocation-desc not-md5-not-maplocation-row not-md5-not-maplocation-r4" x="46" y="318">An AIBOM you can query</text>
  <rect class="not-md5-not-maplocation-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="not-md5-not-maplocation-name" x="526" y="122">False reassurances</text>
  <text class="not-md5-not-maplocation-desc" x="526" y="142">Two, both common.</text>
  <text class="not-md5-not-maplocation-desc not-md5-not-maplocation-row not-md5-not-maplocation-r0" x="526" y="182">"map_location='cpu' is safe"</text>
  <text class="not-md5-not-maplocation-desc not-md5-not-maplocation-row not-md5-not-maplocation-r1" x="526" y="216">Pickle executes during CPU deserialisation</text>
  <text class="not-md5-not-maplocation-desc not-md5-not-maplocation-row not-md5-not-maplocation-r2" x="526" y="250">"We check the MD5"</text>
  <text class="not-md5-not-maplocation-desc not-md5-not-maplocation-row not-md5-not-maplocation-r3" x="526" y="284">Forgeable by collision</text>
  <text class="not-md5-not-maplocation-desc not-md5-not-maplocation-row not-md5-not-maplocation-r4" x="526" y="318">Neither is a control</text>
  <text class="not-md5-not-maplocation-sub" x="30" y="372">Both of these are stated confidently in a great deal of tutorial material, which is exactly why they are worth naming: the belief is more dangerous than the absence of a belief.</text>
</svg>
