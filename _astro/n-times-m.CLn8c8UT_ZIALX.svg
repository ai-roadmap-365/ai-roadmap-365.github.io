<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The same arithmetic LSP solved in 2016.">
  <title>N x M, or N + M</title>
  <style>
    .n-times-m-bg   { fill: #f8fafc; }
    .n-times-m-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .n-times-m-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .n-times-m-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .n-times-m-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .n-times-m-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .n-times-m-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .n-times-m-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .n-times-m-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .n-times-m-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .n-times-m-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .n-times-m-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .n-times-m-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .n-times-m-row { opacity: 1; }
    .n-times-m-r0 { animation-delay: 0.00s; }
    .n-times-m-r1 { animation-delay: 0.45s; }
    .n-times-m-r2 { animation-delay: 0.90s; }
    .n-times-m-r3 { animation-delay: 1.35s; }
    .n-times-m-r4 { animation-delay: 1.80s; }
    .n-times-m-row { animation: n-times-m-reveal 7.3s ease-in-out infinite; }
    @keyframes n-times-m-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="n-times-m-bg" width="980" height="390"/>
  <text class="n-times-m-h1"  x="30" y="40">N x M, or N + M</text>
  <text class="n-times-m-sub" x="30" y="64">The same arithmetic LSP solved in 2016.</text>
  <rect class="n-times-m-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="n-times-m-name" x="46" y="122">Point to point</text>
  <text class="n-times-m-desc" x="46" y="142">N x M connectors.</text>
  <text class="n-times-m-desc n-times-m-row n-times-m-r0" x="46" y="182">A wrapper per client, per tool</text>
  <text class="n-times-m-desc n-times-m-row n-times-m-r1" x="46" y="216">4 clients and 4 tools is 16 connectors</text>
  <text class="n-times-m-desc n-times-m-row n-times-m-r2" x="46" y="250">A schema change cascades everywhere</text>
  <text class="n-times-m-desc n-times-m-row n-times-m-r3" x="46" y="284">A new client re-implements everything</text>
  <text class="n-times-m-desc n-times-m-row n-times-m-r4" x="46" y="318">Nobody maintains the long tail</text>
  <rect class="n-times-m-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="n-times-m-name" x="526" y="122">One protocol</text>
  <text class="n-times-m-desc" x="526" y="142">N + M implementations.</text>
  <text class="n-times-m-desc n-times-m-row n-times-m-r0" x="526" y="182">One server per backend</text>
  <text class="n-times-m-desc n-times-m-row n-times-m-r1" x="526" y="216">One client implementation per host</text>
  <text class="n-times-m-desc n-times-m-row n-times-m-r2" x="526" y="250">4 + 4 is 8, and it stays linear</text>
  <text class="n-times-m-desc n-times-m-row n-times-m-r3" x="526" y="284">A new client gets every server free</text>
  <text class="n-times-m-desc n-times-m-row n-times-m-r4" x="526" y="318">The long tail becomes viable</text>
  <text class="n-times-m-sub" x="30" y="372">LSP's numbers are the standard citation for this: ten languages across five editors went from fifty bespoke extensions to fifteen implementations, and the ecosystem effects followed immediately.</text>
</svg>
