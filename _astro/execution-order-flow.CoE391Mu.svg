<svg viewBox="0 0 980 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d139f-title d139f-desc">
  <title id="d139f-title">Cells run in the order an analyst clicked them, then a restart renumbers everything and changes the answer</title>
  <desc id="d139f-desc">An animated diagram, readable as a still image. The top panel shows three cells run in the order setup, report, transform, with non-monotonic execution counts 1, 2, 3 attached out of position and a stale final answer of 50.0. An arrow marked Restart and Run All leads to a bottom panel showing the same three cells run in document order with execution counts 1, 2, 3 in position and the correct final answer of 30.0.</desc>
  <style>
    .d139f-bg { fill: #f8fafc; }
    .d139f-panel-title { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 700; fill: #1a202c; }
    .d139f-panel-sub { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #475569; }
    .d139f-cell { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d139f-cell-text { font-family: "SFMono-Regular", Consolas, monospace; font-size: 13px; fill: #1a202c; }
    .d139f-cell-name { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; fill: #475569; }
    .d139f-badge { fill: #1d4ed8; }
    .d139f-badge-bad { fill: #b91c1c; }
    .d139f-badge-text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .d139f-wire { stroke: #94a3b8; stroke-width: 2; fill: none; }
    .d139f-wire-dash { stroke: #1d4ed8; stroke-width: 2.5; fill: none; stroke-dasharray: 9 7; }
    .d139f-token { fill: #1d4ed8; }
    .d139f-answer { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
    .d139f-answer-good { fill: #ecfdf5; stroke: #047857; stroke-width: 2; }
    .d139f-answer-text { font-family: "SFMono-Regular", Consolas, monospace; font-size: 16px; font-weight: 700; fill: #1a202c; text-anchor: middle; }
    .d139f-caption { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1a202c; }
    .d139f-restart { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; fill: #1a202c; text-anchor: middle; }

    .d139f-marching {
      animation: d139f-march 1.6s linear infinite;
    }
    @keyframes d139f-march { to { stroke-dashoffset: -16; } }

    .d139f-token-top {
      offset-path: path('M 120 190 L 400 190 L 400 130 L 680 130 L 680 250 L 780 250');
      offset-rotate: 0deg;
      animation: d139f-travel-top 6s ease-in-out infinite;
    }
    @keyframes d139f-travel-top { 0% { offset-distance: 0%; } 60% { offset-distance: 100%; } 100% { offset-distance: 100%; } }

    .d139f-token-bottom {
      offset-path: path('M 120 480 L 400 480 L 400 420 L 680 420 L 680 540 L 780 540');
      offset-rotate: 0deg;
      animation: d139f-travel-bottom 6s ease-in-out infinite;
      animation-delay: 3s;
    }
    @keyframes d139f-travel-bottom { 0% { offset-distance: 0%; } 60% { offset-distance: 100%; } 100% { offset-distance: 100%; } }

    .d139f-cell-lift { animation: d139f-lift 6s ease-in-out infinite; }
    .d139f-top-1 { animation-delay: 0.1s; }
    .d139f-top-2 { animation-delay: 1.4s; }
    .d139f-top-3 { animation-delay: 2.7s; }
    .d139f-bot-1 { animation-delay: 3.1s; }
    .d139f-bot-2 { animation-delay: 4.4s; }
    .d139f-bot-3 { animation-delay: 5.7s; }
    @keyframes d139f-lift {
      0%, 12%, 100% { stroke-width: 1.5; }
      4%, 8% { stroke-width: 3.5; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d139f-marching { animation: none; stroke-dasharray: none; }
      .d139f-token-top, .d139f-token-bottom { animation: none; offset-distance: 100%; }
      .d139f-cell-lift { animation: none; stroke-width: 1.5; }
    }
  </style>

  <rect class="d139f-bg" x="0" y="0" width="980" height="640" />

  <!-- TOP PANEL: as actually run -->
  <text class="d139f-panel-title" x="40" y="46">As actually run: setup, then a look at the report, then the fix</text>
  <text class="d139f-panel-sub" x="40" y="66">click order: Cell 1 (setup) -&gt; Cell 3 (report) -&gt; Cell 2 (transform) -- never re-run after the fix</text>

  <path class="d139f-wire d139f-wire-dash d139f-marching" d="M 120 190 L 400 190 L 400 130 L 680 130 L 680 250 L 780 250" />
  <circle class="d139f-token d139f-token-top" r="8" cx="120" cy="190" />

  <rect class="d139f-cell d139f-cell-lift d139f-top-1" x="60" y="160" width="150" height="60" rx="6" />
  <text class="d139f-cell-name" x="70" y="150">Cell 1 -- setup</text>
  <text class="d139f-cell-text" x="72" y="196">x = 100</text>
  <circle class="d139f-badge" cx="220" cy="160" r="14" />
  <text class="d139f-badge-text" x="220" y="165">1</text>

  <rect class="d139f-cell d139f-cell-lift d139f-top-3" x="605" y="100" width="150" height="60" rx="6" />
  <text class="d139f-cell-name" x="615" y="90">Cell 2 -- transform</text>
  <text class="d139f-cell-text" x="617" y="136">x = x - 40</text>
  <circle class="d139f-badge d139f-badge-bad" cx="765" cy="100" r="14" />
  <text class="d139f-badge-text" x="765" y="105">3</text>

  <rect class="d139f-cell d139f-cell-lift d139f-top-2" x="330" y="130" width="150" height="60" rx="6" />
  <text class="d139f-cell-name" x="340" y="120">Cell 3 -- report</text>
  <text class="d139f-cell-text" x="342" y="166">answer = x / 2</text>
  <circle class="d139f-badge d139f-badge-bad" cx="490" cy="130" r="14" />
  <text class="d139f-badge-text" x="490" y="135">2</text>

  <rect class="d139f-answer" x="785" y="215" width="150" height="70" rx="8" />
  <text class="d139f-answer-text" x="860" y="245">answer</text>
  <text class="d139f-answer-text" x="860" y="268">50.0</text>

  <text class="d139f-panel-sub" x="60" y="300">execution_count: [1, 3, 2] -- non-monotonic, and the only trace</text>

  <!-- Divider + restart -->
  <line x1="40" y1="330" x2="940" y2="330" stroke="#cbd5e1" stroke-width="1.5" />
  <text class="d139f-restart" x="490" y="358">Restart &amp; Run All &#8595;</text>

  <!-- BOTTOM PANEL: clean run -->
  <text class="d139f-panel-title" x="40" y="400">After a restart: the same three cells, run top to bottom</text>
  <text class="d139f-panel-sub" x="40" y="420">click order: Cell 1 -&gt; Cell 2 -&gt; Cell 3, exactly the document's own order</text>

  <path class="d139f-wire d139f-wire-dash d139f-marching" d="M 120 480 L 400 480 L 400 420 L 680 420 L 680 540 L 780 540" />
  <circle class="d139f-token d139f-token-bottom" r="8" cx="120" cy="480" />

  <rect class="d139f-cell d139f-cell-lift d139f-bot-1" x="60" y="450" width="150" height="60" rx="6" />
  <text class="d139f-cell-name" x="70" y="440">Cell 1 -- setup</text>
  <text class="d139f-cell-text" x="72" y="486">x = 100</text>
  <circle class="d139f-badge" cx="220" cy="450" r="14" />
  <text class="d139f-badge-text" x="220" y="455">1</text>

  <rect class="d139f-cell d139f-cell-lift d139f-bot-2" x="330" y="420" width="150" height="60" rx="6" />
  <text class="d139f-cell-name" x="340" y="410">Cell 2 -- transform</text>
  <text class="d139f-cell-text" x="332" y="456">x = x - 40</text>
  <circle class="d139f-badge" cx="490" cy="420" r="14" />
  <text class="d139f-badge-text" x="490" y="425">2</text>

  <rect class="d139f-cell d139f-cell-lift d139f-bot-3" x="605" y="390" width="150" height="60" rx="6" />
  <text class="d139f-cell-name" x="615" y="380">Cell 3 -- report</text>
  <text class="d139f-cell-text" x="617" y="426">answer = x / 2</text>
  <circle class="d139f-badge" cx="765" cy="390" r="14" />
  <text class="d139f-badge-text" x="765" y="395">3</text>

  <rect class="d139f-answer-good" x="785" y="505" width="150" height="70" rx="8" />
  <text class="d139f-answer-text" x="860" y="535">answer</text>
  <text class="d139f-answer-text" x="860" y="558">30.0</text>

  <text class="d139f-panel-sub" x="60" y="590">execution_count: [1, 2, 3] -- monotonic, and the answer changed</text>

  <rect x="40" y="608" width="900" height="26" fill="none" />
  <text class="d139f-caption" x="40" y="628">With motion off, every cell, badge and answer already sits in its final position -- the animation only shows the click order.</text>
</svg>
