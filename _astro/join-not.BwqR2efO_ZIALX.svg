<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things a join is not</title>
  <style>
    .join-not-bg   { fill: #f8fafc; }
    .join-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .join-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .join-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .join-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .join-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .join-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .join-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .join-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .join-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .join-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .join-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .join-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .join-not-row { opacity: 1; }
    .join-not-r0 { animation-delay: 0.00s; }
    .join-not-r1 { animation-delay: 0.45s; }
    .join-not-r2 { animation-delay: 0.90s; }
    .join-not-r3 { animation-delay: 1.35s; }
    .join-not-r4 { animation-delay: 1.80s; }
    .join-not-row { animation: join-not-reveal 7.3s ease-in-out infinite; }
    @keyframes join-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="join-not-bg" width="980" height="390"/>
  <text class="join-not-h1"  x="30" y="40">Four things a join is not</text>
  <text class="join-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="join-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="join-not-name" x="46" y="122">The misconception</text>
  <text class="join-not-desc" x="46" y="142">Commonly held.</text>
  <text class="join-not-desc join-not-row join-not-r0" x="46" y="182">A join always returns one row per input row</text>
  <text class="join-not-desc join-not-row join-not-r1" x="46" y="216">Joins are inherently slow</text>
  <text class="join-not-desc join-not-row join-not-r2" x="46" y="250">Inner is a safe default</text>
  <text class="join-not-desc join-not-row join-not-r3" x="46" y="284">Missing values match each other</text>
  <text class="join-not-desc join-not-row join-not-r4" x="46" y="318">Join order does not matter</text>
  <rect class="join-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="join-not-name" x="526" y="122">What is true</text>
  <text class="join-not-desc" x="526" y="142">Actually.</text>
  <text class="join-not-desc join-not-row join-not-r0" x="526" y="182">A non-unique key multiplies rows</text>
  <text class="join-not-desc join-not-row join-not-r1" x="526" y="216">Indexed joins are fast</text>
  <text class="join-not-desc join-not-row join-not-r2" x="526" y="250">It drops unmatched rows</text>
  <text class="join-not-desc join-not-row join-not-r3" x="526" y="284">They match nothing, including themselves</text>
  <text class="join-not-desc join-not-row join-not-r4" x="526" y="318">The optimiser reorders, but cardinality matters</text>
  <text class="join-not-sub" x="30" y="372">The first row is worth checking before trusting any aggregate over a join, because verifying uniqueness takes one query and catches the worst bug.</text>
</svg>
