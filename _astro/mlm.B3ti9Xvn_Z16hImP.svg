<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Predicting what was hidden.">
  <title>Masked language modelling</title>
  <style>
    .mlm-bg   { fill: #f8fafc; }
    .mlm-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mlm-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mlm-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mlm-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mlm-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mlm-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mlm-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mlm-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mlm-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mlm-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mlm-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mlm-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .mlm-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .mlm-stage { opacity: 1; }

    .mlm-s0 { animation-delay: 0.00s; }
    .mlm-e0 { animation-delay: 0.00s; }
    .mlm-s1 { animation-delay: 1.28s; }
    .mlm-e1 { animation-delay: 1.28s; }
    .mlm-s2 { animation-delay: 2.56s; }
    .mlm-e2 { animation-delay: 2.56s; }
    .mlm-s3 { animation-delay: 3.84s; }
    .mlm-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .mlm-conn  { animation: mlm-trace 6.4s ease-in-out infinite; }
      .mlm-stage { animation: mlm-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes mlm-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes mlm-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .mlm-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .mlm-stage { animation: mlm-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes mlm-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="mlm-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="mlm-bg" width="980" height="322"/>
  <text class="mlm-h1"  x="30" y="40">Masked language modelling</text>
  <text class="mlm-sub" x="30" y="64">Predicting what was hidden.</text>
  <g class="mlm-stage mlm-s0">
    <rect class="mlm-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="mlm-step" x="44" y="142">01</text>
    <text class="mlm-name" x="70" y="142">Mask a fraction of the tokens</text>
    <text class="mlm-desc" x="44" y="166">Around fifteen percent, replaced</text>
    <text class="mlm-desc" x="44" y="182">with a mask token.</text>
  </g>
  <line class="mlm-line mlm-conn mlm-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#mlm-tip)"/>
  <g class="mlm-stage mlm-s1">
    <rect class="mlm-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="mlm-step" x="280" y="142">02</text>
    <text class="mlm-name" x="306" y="142">Encode with full bidirectional context</text>
    <text class="mlm-desc" x="280" y="166">Every unmasked position visible,</text>
    <text class="mlm-desc" x="280" y="182">both left and right.</text>
    <text class="mlm-edge" x="280" y="242">bidirectional</text>
  </g>
  <line class="mlm-line mlm-conn mlm-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#mlm-tip)"/>
  <g class="mlm-stage mlm-s2">
    <rect class="mlm-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="mlm-step" x="516" y="142">03</text>
    <text class="mlm-name" x="542" y="142">Predict the hidden tokens</text>
    <text class="mlm-desc" x="516" y="166">From the surrounding context</text>
    <text class="mlm-desc" x="516" y="182">alone.</text>
  </g>
  <line class="mlm-line mlm-conn mlm-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#mlm-tip)"/>
  <g class="mlm-stage mlm-s3">
    <rect class="mlm-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="mlm-step" x="752" y="142">04</text>
    <text class="mlm-name" x="778" y="142">Which needs no labels at all</text>
    <text class="mlm-desc" x="752" y="166">The text is its own supervision.</text>
  </g>
  <text class="mlm-sub" x="30" y="304">The label-free property is what changed the field: pretraining could suddenly use every text on the internet rather than the small fraction anybody had annotated.</text>
</svg>
