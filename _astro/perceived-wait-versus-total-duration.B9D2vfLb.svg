<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%" role="img" aria-label="Perceived Wait versus Total Duration comparing a streaming run and a blocking run of the same answer, showing the same content with very different waits">
  <title>Perceived Wait versus Total Duration</title>
  <defs>
    <style>
      .d358b-bg { fill: #f8fafc; }
      .d358b-wait { fill: #fecaca; stroke: #ef4444; stroke-width: 1px; }
      .d358b-read { fill: #bbf7d0; stroke: #22c55e; stroke-width: 1px; }
      .d358b-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d358b-sub { font-family: system-ui, sans-serif; font-size: 13px; fill: #475569; }
      .d358b-h { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; }
      .d358b-t { font-family: system-ui, sans-serif; font-size: 11px; fill: #334155; }
      .d358b-lbl { font-family: system-ui, sans-serif; font-size: 11px; fill: #475569; }
      .d358b-key { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #b91c1c; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d358b-bg"/>
  <text x="40" y="40" class="d358b-title">Perceived Wait versus Total Duration</text>
  <text x="40" y="64" class="d358b-sub">Measured: the same 47-character answer, rendered two ways. Each block is one tick.</text>

  <text x="40" y="112" class="d358b-h">streaming</text>
  <rect x="150" y="96" width="120" height="30" class="d358b-wait"/>
  <text x="210" y="116" class="d358b-t" text-anchor="middle">wait 4</text>
  <rect x="272" y="96" width="240" height="30" class="d358b-read"/>
  <text x="392" y="116" class="d358b-t" text-anchor="middle">reading while it writes — 8 more ticks</text>
  <text x="530" y="116" class="d358b-lbl">total 12, felt 4</text>

  <text x="40" y="176" class="d358b-h">blocking</text>
  <rect x="150" y="160" width="360" height="30" class="d358b-wait"/>
  <text x="330" y="180" class="d358b-t" text-anchor="middle">wait 12 — nothing on screen at all</text>
  <rect x="512" y="160" width="240" height="30" class="d358b-read"/>
  <text x="632" y="180" class="d358b-t" text-anchor="middle">everything appears at once</text>
  <text x="770" y="180" class="d358b-lbl">total 20, felt 12</text>

  <rect x="150" y="226" width="16" height="14" class="d358b-wait"/>
  <text x="176" y="238" class="d358b-t">nothing to read — this is what "slow" means to a person</text>
  <rect x="500" y="226" width="16" height="14" class="d358b-read"/>
  <text x="526" y="238" class="d358b-t">text on screen</text>

  <text x="40" y="288" class="d358b-h">The point is not that streaming is faster</text>
  <text x="40" y="312" class="d358b-t">Both runs deliver identical content and do identical work. Perceived wait is a DIFFERENT QUANTITY from total duration,</text>
  <text x="40" y="330" class="d358b-t">and it is the only one the user experiences.</text>
  <text x="40" y="358" class="d358b-key">Optimising total duration while ignoring time to first token is the most common mistake in this area.</text>
  <text x="40" y="386" class="d358b-t">Miller (1968) put the limits at ~1s for an uninterrupted train of thought and ~10s for held attention. Those are properties</text>
  <text x="40" y="404" class="d358b-t">of people, not machines, which is why the numbers have not moved in nearly sixty years.</text>
</svg>
