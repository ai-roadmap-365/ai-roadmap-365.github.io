<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what to do instead.">
  <title>How much to tune</title>
  <style>
    .tuning-when-bg   { fill: #f8fafc; }
    .tuning-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tuning-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tuning-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tuning-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tuning-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tuning-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tuning-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tuning-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tuning-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tuning-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tuning-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tuning-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tuning-when-row { opacity: 1; }
    .tuning-when-r0 { animation-delay: 0.00s; }
    .tuning-when-r1 { animation-delay: 0.45s; }
    .tuning-when-r2 { animation-delay: 0.90s; }
    .tuning-when-r3 { animation-delay: 1.35s; }
    .tuning-when-r4 { animation-delay: 1.80s; }
    .tuning-when-row { animation: tuning-when-reveal 7.3s ease-in-out infinite; }
    @keyframes tuning-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tuning-when-bg" width="980" height="390"/>
  <text class="tuning-when-h1"  x="30" y="40">How much to tune</text>
  <text class="tuning-when-sub" x="30" y="64">And what to do instead.</text>
  <rect class="tuning-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tuning-when-name" x="46" y="122">Tune</text>
  <text class="tuning-when-desc" x="46" y="142">Four cases.</text>
  <text class="tuning-when-desc tuning-when-row tuning-when-r0" x="46" y="182">The model is otherwise final</text>
  <text class="tuning-when-desc tuning-when-row tuning-when-r1" x="46" y="216">A few percent genuinely matters</text>
  <text class="tuning-when-desc tuning-when-row tuning-when-r2" x="46" y="250">Compute is available and cheap</text>
  <text class="tuning-when-desc tuning-when-row tuning-when-r3" x="46" y="284">Boosted models, which need it</text>
  <text class="tuning-when-desc tuning-when-row tuning-when-r4" x="46" y="318">Before a competition deadline</text>
  <rect class="tuning-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tuning-when-name" x="526" y="122">Do something else</text>
  <text class="tuning-when-desc" x="526" y="142">Usually better.</text>
  <text class="tuning-when-desc tuning-when-row tuning-when-r0" x="526" y="182">Improve the features</text>
  <text class="tuning-when-desc tuning-when-row tuning-when-r1" x="526" y="216">Get more or cleaner data</text>
  <text class="tuning-when-desc tuning-when-row tuning-when-r2" x="526" y="250">Fix the evaluation protocol</text>
  <text class="tuning-when-desc tuning-when-row tuning-when-r3" x="526" y="284">Do error analysis</text>
  <text class="tuning-when-desc tuning-when-row tuning-when-r4" x="526" y="318">All of which usually beat tuning</text>
  <text class="tuning-when-sub" x="30" y="372">Tuning is the most compute-hungry and least effective of the available improvements, which is why it belongs last rather than first.</text>
</svg>
