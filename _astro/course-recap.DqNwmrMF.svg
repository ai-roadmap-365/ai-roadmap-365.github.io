<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two halves.">
  <title>What this course established</title>
  <style>
    .course-recap-bg   { fill: #f8fafc; }
    .course-recap-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .course-recap-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .course-recap-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .course-recap-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .course-recap-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .course-recap-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .course-recap-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .course-recap-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .course-recap-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .course-recap-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .course-recap-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .course-recap-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .course-recap-row { opacity: 1; }
    .course-recap-r0 { animation-delay: 0.00s; }
    .course-recap-r1 { animation-delay: 0.45s; }
    .course-recap-r2 { animation-delay: 0.90s; }
    .course-recap-r3 { animation-delay: 1.35s; }
    .course-recap-r4 { animation-delay: 1.80s; }
    .course-recap-row { animation: course-recap-reveal 7.3s ease-in-out infinite; }
    @keyframes course-recap-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="course-recap-bg" width="980" height="390"/>
  <text class="course-recap-h1"  x="30" y="40">What this course established</text>
  <text class="course-recap-sub" x="30" y="64">Two halves.</text>
  <rect class="course-recap-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="course-recap-name" x="46" y="122">The models</text>
  <text class="course-recap-desc" x="46" y="142">What to fit.</text>
  <text class="course-recap-desc course-recap-row course-recap-r0" x="46" y="182">Linear and logistic regression</text>
  <text class="course-recap-desc course-recap-row course-recap-r1" x="46" y="216">Trees, forests and boosting</text>
  <text class="course-recap-desc course-recap-row course-recap-r2" x="46" y="250">Distance and margin methods</text>
  <text class="course-recap-desc course-recap-row course-recap-r3" x="46" y="284">Clustering and dimensionality reduction</text>
  <text class="course-recap-desc course-recap-row course-recap-r4" x="46" y="318">Which are largely settled</text>
  <rect class="course-recap-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="course-recap-name" x="526" y="122">The discipline</text>
  <text class="course-recap-desc" x="526" y="142">How to fit it honestly.</text>
  <text class="course-recap-desc course-recap-row course-recap-r0" x="526" y="182">Splitting, leakage and validation</text>
  <text class="course-recap-desc course-recap-row course-recap-r1" x="526" y="216">Metrics chosen from costs</text>
  <text class="course-recap-desc course-recap-row course-recap-r2" x="526" y="250">Baselines and error analysis</text>
  <text class="course-recap-desc course-recap-row course-recap-r3" x="526" y="284">Fairness, documentation and monitoring</text>
  <text class="course-recap-desc course-recap-row course-recap-r4" x="526" y="318">Which is what actually transfers</text>
  <text class="course-recap-sub" x="30" y="372">The right-hand column is what carries into every later course: the algorithms change entirely and the discipline does not change at all.</text>
</svg>
