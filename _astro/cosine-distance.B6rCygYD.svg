<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One is not a metric.">
  <title>Similarity against distance</title>
  <style>
    .cosine-distance-bg   { fill: #f8fafc; }
    .cosine-distance-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cosine-distance-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cosine-distance-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cosine-distance-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cosine-distance-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cosine-distance-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cosine-distance-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cosine-distance-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cosine-distance-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cosine-distance-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cosine-distance-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cosine-distance-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cosine-distance-row { opacity: 1; }
    .cosine-distance-r0 { animation-delay: 0.00s; }
    .cosine-distance-r1 { animation-delay: 0.45s; }
    .cosine-distance-r2 { animation-delay: 0.90s; }
    .cosine-distance-r3 { animation-delay: 1.35s; }
    .cosine-distance-r4 { animation-delay: 1.80s; }
    .cosine-distance-row { animation: cosine-distance-reveal 7.3s ease-in-out infinite; }
    @keyframes cosine-distance-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cosine-distance-bg" width="980" height="390"/>
  <text class="cosine-distance-h1"  x="30" y="40">Similarity against distance</text>
  <text class="cosine-distance-sub" x="30" y="64">One is not a metric.</text>
  <rect class="cosine-distance-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cosine-distance-name" x="46" y="122">Cosine similarity</text>
  <text class="cosine-distance-desc" x="46" y="142">Higher is closer.</text>
  <text class="cosine-distance-desc cosine-distance-row cosine-distance-r0" x="46" y="182">Ranges from minus one to one</text>
  <text class="cosine-distance-desc cosine-distance-row cosine-distance-r1" x="46" y="216">One means identical direction</text>
  <text class="cosine-distance-desc cosine-distance-row cosine-distance-r2" x="46" y="250">Used directly for ranking</text>
  <text class="cosine-distance-desc cosine-distance-row cosine-distance-r3" x="46" y="284">Not a distance in the formal sense</text>
  <text class="cosine-distance-desc cosine-distance-row cosine-distance-r4" x="46" y="318">What retrieval systems report</text>
  <rect class="cosine-distance-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cosine-distance-name" x="526" y="122">Cosine distance</text>
  <text class="cosine-distance-desc" x="526" y="142">Lower is closer.</text>
  <text class="cosine-distance-desc cosine-distance-row cosine-distance-r0" x="526" y="182">One minus the similarity</text>
  <text class="cosine-distance-desc cosine-distance-row cosine-distance-r1" x="526" y="216">Zero means identical direction</text>
  <text class="cosine-distance-desc cosine-distance-row cosine-distance-r2" x="526" y="250">Used where a distance is expected</text>
  <text class="cosine-distance-desc cosine-distance-row cosine-distance-r3" x="526" y="284">Still not a true metric</text>
  <text class="cosine-distance-desc cosine-distance-row cosine-distance-r4" x="526" y="318">Fails the triangle inequality</text>
  <text class="cosine-distance-sub" x="30" y="372">Failing the triangle inequality matters for some indexing structures, which assume a true metric and can behave incorrectly without one.</text>
</svg>
