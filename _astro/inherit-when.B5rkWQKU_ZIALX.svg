<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when to compose.">
  <title>When to inherit</title>
  <style>
    .inherit-when-bg   { fill: #f8fafc; }
    .inherit-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inherit-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inherit-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inherit-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inherit-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inherit-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .inherit-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .inherit-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .inherit-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .inherit-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .inherit-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .inherit-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .inherit-when-row { opacity: 1; }
    .inherit-when-r0 { animation-delay: 0.00s; }
    .inherit-when-r1 { animation-delay: 0.45s; }
    .inherit-when-r2 { animation-delay: 0.90s; }
    .inherit-when-r3 { animation-delay: 1.35s; }
    .inherit-when-r4 { animation-delay: 1.80s; }
    .inherit-when-row { animation: inherit-when-reveal 7.3s ease-in-out infinite; }
    @keyframes inherit-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="inherit-when-bg" width="980" height="390"/>
  <text class="inherit-when-h1"  x="30" y="40">When to inherit</text>
  <text class="inherit-when-sub" x="30" y="64">And when to compose.</text>
  <rect class="inherit-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="inherit-when-name" x="46" y="122">Inherit</text>
  <text class="inherit-when-desc" x="46" y="142">Four cases.</text>
  <text class="inherit-when-desc inherit-when-row inherit-when-r0" x="46" y="182">A genuine is-a relationship</text>
  <text class="inherit-when-desc inherit-when-row inherit-when-r1" x="46" y="216">A framework requires a base class</text>
  <text class="inherit-when-desc inherit-when-row inherit-when-r2" x="46" y="250">Sharing an interface, not an implementation</text>
  <text class="inherit-when-desc inherit-when-row inherit-when-r3" x="46" y="284">Where substitutability actually holds</text>
  <text class="inherit-when-desc inherit-when-row inherit-when-r4" x="46" y="318">And keep it one level deep</text>
  <rect class="inherit-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="inherit-when-name" x="526" y="122">Compose</text>
  <text class="inherit-when-desc" x="526" y="142">Almost everywhere else.</text>
  <text class="inherit-when-desc inherit-when-row inherit-when-r0" x="526" y="182">Reusing an implementation</text>
  <text class="inherit-when-desc inherit-when-row inherit-when-r1" x="526" y="216">A has-a relationship</text>
  <text class="inherit-when-desc inherit-when-row inherit-when-r2" x="526" y="250">Where the dependency should be swappable</text>
  <text class="inherit-when-desc inherit-when-row inherit-when-r3" x="526" y="284">Where you would override most methods</text>
  <text class="inherit-when-desc inherit-when-row inherit-when-r4" x="526" y="318">Which is the common case</text>
  <text class="inherit-when-sub" x="30" y="372">Overriding most of the parent's methods is the clearest signal that the relationship is not is-a and the design should be composed instead.</text>
</svg>
