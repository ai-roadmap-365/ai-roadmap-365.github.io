<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Which is the whole payoff of a protocol.">
  <title>One daemon, every client</title>
  <style>
    .one-server-many-clients-bg   { fill: #f8fafc; }
    .one-server-many-clients-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-server-many-clients-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-server-many-clients-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-server-many-clients-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-server-many-clients-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-server-many-clients-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .one-server-many-clients-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .one-server-many-clients-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .one-server-many-clients-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .one-server-many-clients-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .one-server-many-clients-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .one-server-many-clients-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .one-server-many-clients-row { opacity: 1; }
    .one-server-many-clients-r0 { animation-delay: 0.00s; }
    .one-server-many-clients-r1 { animation-delay: 0.45s; }
    .one-server-many-clients-r2 { animation-delay: 0.90s; }
    .one-server-many-clients-r3 { animation-delay: 1.35s; }
    .one-server-many-clients-r4 { animation-delay: 1.80s; }
    .one-server-many-clients-row { animation: one-server-many-clients-reveal 7.3s ease-in-out infinite; }
    @keyframes one-server-many-clients-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="one-server-many-clients-bg" width="980" height="390"/>
  <text class="one-server-many-clients-h1"  x="30" y="40">One daemon, every client</text>
  <text class="one-server-many-clients-sub" x="30" y="64">Which is the whole payoff of a protocol.</text>
  <rect class="one-server-many-clients-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="one-server-many-clients-name" x="46" y="122">One server</text>
  <text class="one-server-many-clients-desc" x="46" y="142">Written once.</text>
  <text class="one-server-many-clients-desc one-server-many-clients-row one-server-many-clients-r0" x="46" y="182">A single Python file over stdio</text>
  <text class="one-server-many-clients-desc one-server-many-clients-row one-server-many-clients-r1" x="46" y="216">Desktop app, editor, terminal agent</text>
  <text class="one-server-many-clients-desc one-server-many-clients-row one-server-many-clients-r2" x="46" y="250">One memory store shared by all</text>
  <text class="one-server-many-clients-desc one-server-many-clients-row one-server-many-clients-r3" x="46" y="284">One config line per client</text>
  <text class="one-server-many-clients-desc one-server-many-clients-row one-server-many-clients-r4" x="46" y="318">Change a tool, every client gets it</text>
  <rect class="one-server-many-clients-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="one-server-many-clients-name" x="526" y="122">Per-client extensions</text>
  <text class="one-server-many-clients-desc" x="526" y="142">Written repeatedly.</text>
  <text class="one-server-many-clients-desc one-server-many-clients-row one-server-many-clients-r0" x="526" y="182">A VS Code extension in TypeScript</text>
  <text class="one-server-many-clients-desc one-server-many-clients-row one-server-many-clients-r1" x="526" y="216">A separate JetBrains plugin</text>
  <text class="one-server-many-clients-desc one-server-many-clients-row one-server-many-clients-r2" x="526" y="250">Separate storage, separate drift</text>
  <text class="one-server-many-clients-desc one-server-many-clients-row one-server-many-clients-r3" x="526" y="284">Each with its own release cycle</text>
  <text class="one-server-many-clients-desc one-server-many-clients-row one-server-many-clients-r4" x="526" y="318">And the terminal gets nothing</text>
  <text class="one-server-many-clients-sub" x="30" y="372">The shared memory store is the part that is hard to replicate any other way: a note written from a chat is readable from the editor and from a scheduled script, because there is only one store.</text>
</svg>
