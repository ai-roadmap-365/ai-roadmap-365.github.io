<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Truncation removes the answer without saying so.">
  <title>The silent failure of a full context window</title>
  <style>
    .token-budget-truncation-bg   { fill: #f8fafc; }
    .token-budget-truncation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .token-budget-truncation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .token-budget-truncation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .token-budget-truncation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .token-budget-truncation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .token-budget-truncation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .token-budget-truncation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .token-budget-truncation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .token-budget-truncation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .token-budget-truncation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .token-budget-truncation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .token-budget-truncation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .token-budget-truncation-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .token-budget-truncation-stage { opacity: 1; }

    .token-budget-truncation-s0 { animation-delay: 0.00s; }
    .token-budget-truncation-e0 { animation-delay: 0.00s; }
    .token-budget-truncation-s1 { animation-delay: 1.28s; }
    .token-budget-truncation-e1 { animation-delay: 1.28s; }
    .token-budget-truncation-s2 { animation-delay: 2.56s; }
    .token-budget-truncation-e2 { animation-delay: 2.56s; }
    .token-budget-truncation-s3 { animation-delay: 3.84s; }
    .token-budget-truncation-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .token-budget-truncation-conn  { animation: token-budget-truncation-trace 6.4s ease-in-out infinite; }
      .token-budget-truncation-stage { animation: token-budget-truncation-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes token-budget-truncation-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes token-budget-truncation-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .token-budget-truncation-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .token-budget-truncation-stage { animation: token-budget-truncation-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes token-budget-truncation-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="token-budget-truncation-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="token-budget-truncation-bg" width="980" height="322"/>
  <text class="token-budget-truncation-h1"  x="30" y="40">The silent failure of a full context window</text>
  <text class="token-budget-truncation-sub" x="30" y="64">Truncation removes the answer without saying so.</text>
  <g class="token-budget-truncation-stage token-budget-truncation-s0">
    <rect class="token-budget-truncation-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="token-budget-truncation-step" x="44" y="142">01</text>
    <text class="token-budget-truncation-name" x="70" y="142">Retrieval returns ten passages</text>
    <text class="token-budget-truncation-desc" x="44" y="166">The relevant one is ranked</text>
    <text class="token-budget-truncation-desc" x="44" y="182">fourth.</text>
  </g>
  <line class="token-budget-truncation-line token-budget-truncation-conn token-budget-truncation-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#token-budget-truncation-tip)"/>
  <g class="token-budget-truncation-stage token-budget-truncation-s1">
    <rect class="token-budget-truncation-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="token-budget-truncation-step" x="280" y="142">02</text>
    <text class="token-budget-truncation-name" x="306" y="142">The prompt exceeds the budget</text>
    <text class="token-budget-truncation-desc" x="280" y="166">System prompt, history, schema</text>
    <text class="token-budget-truncation-desc" x="280" y="182">and context together.</text>
  </g>
  <line class="token-budget-truncation-line token-budget-truncation-conn token-budget-truncation-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#token-budget-truncation-tip)"/>
  <g class="token-budget-truncation-stage token-budget-truncation-s2">
    <rect class="token-budget-truncation-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="token-budget-truncation-step" x="516" y="142">03</text>
    <text class="token-budget-truncation-name" x="542" y="142">Something is truncated</text>
    <text class="token-budget-truncation-desc" x="516" y="166">Often the tail of the context —</text>
    <text class="token-budget-truncation-desc" x="516" y="182">which may be passage four.</text>
    <text class="token-budget-truncation-edge" x="516" y="242">dropped</text>
  </g>
  <line class="token-budget-truncation-line token-budget-truncation-conn token-budget-truncation-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#token-budget-truncation-tip)"/>
  <g class="token-budget-truncation-stage token-budget-truncation-s3">
    <rect class="token-budget-truncation-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="token-budget-truncation-step" x="752" y="142">04</text>
    <text class="token-budget-truncation-name" x="778" y="142">The model answers without it</text>
    <text class="token-budget-truncation-desc" x="752" y="166">Fluently, and wrongly. Nothing</text>
    <text class="token-budget-truncation-desc" x="752" y="182">raised, nothing logged.</text>
    <text class="token-budget-truncation-edge" x="752" y="242">silent</text>
  </g>
  <text class="token-budget-truncation-sub" x="30" y="304">Count tokens before sending and decide truncation deliberately — drop the lowest-ranked passages and log that you did. Discovering it from a wrong answer is far more expensive than a log line.</text>
</svg>
