<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%" role="img" aria-label="Alerting on Symptoms versus Causes showing a symptom alert that reaches a user-visible problem and cause alerts that fire without anything being wrong">
  <title>Alerting on Symptoms versus Causes</title>
  <defs>
    <style>
      .d360b-bg { fill: #f8fafc; }
      .d360b-good { fill: #dcfce7; stroke: #22c55e; stroke-width: 2px; }
      .d360b-noise { fill: #fee2e2; stroke: #ef4444; stroke-width: 2px; }
      .d360b-neutral { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2px; }
      .d360b-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d360b-sub { font-family: system-ui, sans-serif; font-size: 13px; fill: #475569; }
      .d360b-h { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .d360b-t { font-family: system-ui, sans-serif; font-size: 11px; fill: #334155; }
      .d360b-key { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #b91c1c; }
      .d360b-flow { stroke: #64748b; stroke-width: 2px; fill: none; }
    </style>
    <marker id="d360b-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="100%" height="100%" class="d360b-bg"/>
  <text x="40" y="40" class="d360b-title">Alerting on Symptoms versus Causes</text>
  <text x="40" y="64" class="d360b-sub">An alert that fires when nothing is wrong is worse than no alert — it teaches people to ignore the channel.</text>

  <rect x="40" y="100" width="240" height="60" rx="8" class="d360b-good"/>
  <text x="160" y="124" class="d360b-h" text-anchor="middle">SYMPTOM</text>
  <text x="160" y="145" class="d360b-t" text-anchor="middle">"p95 latency above 4s"</text>

  <rect x="360" y="100" width="240" height="60" rx="8" class="d360b-good"/>
  <text x="480" y="124" class="d360b-h" text-anchor="middle">a user felt this</text>
  <text x="480" y="145" class="d360b-t" text-anchor="middle">page someone</text>
  <path d="M 280 130 L 354 130" class="d360b-flow" marker-end="url(#d360b-a)"/>

  <rect x="40" y="196" width="240" height="52" rx="6" class="d360b-noise"/>
  <text x="160" y="218" class="d360b-t" text-anchor="middle">"cache hit rate fell 20%"</text>
  <text x="160" y="236" class="d360b-t" text-anchor="middle">CAUSE</text>

  <rect x="40" y="258" width="240" height="52" rx="6" class="d360b-noise"/>
  <text x="160" y="280" class="d360b-t" text-anchor="middle">"retrieval latency up"</text>
  <text x="160" y="298" class="d360b-t" text-anchor="middle">CAUSE</text>

  <rect x="360" y="222" width="240" height="62" rx="8" class="d360b-neutral"/>
  <text x="480" y="248" class="d360b-t" text-anchor="middle">may be entirely fine</text>
  <text x="480" y="268" class="d360b-t" text-anchor="middle">nothing to do</text>
  <path d="M 280 222 L 354 245" class="d360b-flow" marker-end="url(#d360b-a)"/>
  <path d="M 280 284 L 354 262" class="d360b-flow" marker-end="url(#d360b-a)"/>

  <rect x="660" y="196" width="200" height="88" rx="8" class="d360b-noise"/>
  <text x="760" y="226" class="d360b-h" text-anchor="middle">alert fatigue</text>
  <text x="760" y="250" class="d360b-t" text-anchor="middle">the channel gets muted,</text>
  <text x="760" y="268" class="d360b-t" text-anchor="middle">including the real page</text>
  <path d="M 600 253 L 654 245" class="d360b-flow" marker-end="url(#d360b-a)"/>

  <text x="40" y="342" class="d360b-h">The other half: refuse to judge a small sample</text>
  <text x="40" y="366" class="d360b-key">One failed request out of three is a 33% error rate. Paging on that is how a channel gets ignored.</text>
  <text x="40" y="390" class="d360b-t">Below a minimum sample count, report "insufficient sample" rather than an alert. It is the single most effective</text>
  <text x="40" y="408" class="d360b-t">anti-fatigue measure available, and it costs one comparison.</text>
</svg>
