<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the data.">
  <title>Which similarity when</title>
  <style>
    .dot-when-bg   { fill: #f8fafc; }
    .dot-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dot-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dot-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dot-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dot-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dot-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dot-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dot-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dot-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dot-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dot-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dot-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dot-when-row { opacity: 1; }
    .dot-when-r0 { animation-delay: 0.00s; }
    .dot-when-r1 { animation-delay: 0.45s; }
    .dot-when-r2 { animation-delay: 0.90s; }
    .dot-when-r3 { animation-delay: 1.35s; }
    .dot-when-r4 { animation-delay: 1.80s; }
    .dot-when-row { animation: dot-when-reveal 7.3s ease-in-out infinite; }
    @keyframes dot-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="dot-when-bg" width="980" height="390"/>
  <text class="dot-when-h1"  x="30" y="40">Which similarity when</text>
  <text class="dot-when-sub" x="30" y="64">By the data.</text>
  <rect class="dot-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="dot-when-name" x="46" y="122">The situation</text>
  <text class="dot-when-desc" x="46" y="142">What you have.</text>
  <text class="dot-when-desc dot-when-row dot-when-r0" x="46" y="182">Text embeddings of varying length</text>
  <text class="dot-when-desc dot-when-row dot-when-r1" x="46" y="216">Vectors already normalised</text>
  <text class="dot-when-desc dot-when-row dot-when-r2" x="46" y="250">Magnitude carries real meaning</text>
  <text class="dot-when-desc dot-when-row dot-when-r3" x="46" y="284">Binary presence or absence</text>
  <text class="dot-when-desc dot-when-row dot-when-r4" x="46" y="318">Very high dimensions, sparse</text>
  <rect class="dot-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="dot-when-name" x="526" y="122">The measure</text>
  <text class="dot-when-desc" x="526" y="142">What to use.</text>
  <text class="dot-when-desc dot-when-row dot-when-r0" x="526" y="182">Cosine similarity</text>
  <text class="dot-when-desc dot-when-row dot-when-r1" x="526" y="216">Dot product; it is equivalent and faster</text>
  <text class="dot-when-desc dot-when-row dot-when-r2" x="526" y="250">Euclidean distance, which keeps magnitude</text>
  <text class="dot-when-desc dot-when-row dot-when-r3" x="526" y="284">Set overlap, not cosine</text>
  <text class="dot-when-desc dot-when-row dot-when-r4" x="526" y="318">Sparse lexical scoring alongside</text>
  <text class="dot-when-sub" x="30" y="372">The second row is a genuine optimisation: on pre-normalised vectors the raw dot product ranks identically and skips two magnitude computations per comparison.</text>
</svg>
