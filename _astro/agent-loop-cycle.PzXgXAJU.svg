<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five steps, repeated until a stopping rule fires.">
  <title>The closed loop</title>
  <style>
    .agent-loop-cycle-bg   { fill: #f8fafc; }
    .agent-loop-cycle-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-loop-cycle-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-loop-cycle-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-loop-cycle-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-loop-cycle-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-loop-cycle-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .agent-loop-cycle-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .agent-loop-cycle-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .agent-loop-cycle-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .agent-loop-cycle-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .agent-loop-cycle-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .agent-loop-cycle-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .agent-loop-cycle-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .agent-loop-cycle-stage { opacity: 1; }

    .agent-loop-cycle-s0 { animation-delay: 0.00s; }
    .agent-loop-cycle-e0 { animation-delay: 0.00s; }
    .agent-loop-cycle-s1 { animation-delay: 1.33s; }
    .agent-loop-cycle-e1 { animation-delay: 1.33s; }
    .agent-loop-cycle-s2 { animation-delay: 2.67s; }
    .agent-loop-cycle-e2 { animation-delay: 2.67s; }
    .agent-loop-cycle-s3 { animation-delay: 4.00s; }
    .agent-loop-cycle-e3 { animation-delay: 4.00s; }
    .agent-loop-cycle-s4 { animation-delay: 5.33s; }
    .agent-loop-cycle-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .agent-loop-cycle-conn  { animation: agent-loop-cycle-trace 8s ease-in-out infinite; }
      .agent-loop-cycle-stage { animation: agent-loop-cycle-arrive 8s ease-in-out infinite; }
    }
    @keyframes agent-loop-cycle-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes agent-loop-cycle-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .agent-loop-cycle-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .agent-loop-cycle-stage { animation: agent-loop-cycle-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes agent-loop-cycle-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="agent-loop-cycle-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="agent-loop-cycle-bg" width="980" height="322"/>
  <text class="agent-loop-cycle-h1"  x="30" y="40">The closed loop</text>
  <text class="agent-loop-cycle-sub" x="30" y="64">Five steps, repeated until a stopping rule fires.</text>
  <g class="agent-loop-cycle-stage agent-loop-cycle-s0">
    <rect class="agent-loop-cycle-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="agent-loop-cycle-step" x="44" y="142">01</text>
    <text class="agent-loop-cycle-name" x="70" y="142">Perceive</text>
    <text class="agent-loop-cycle-desc" x="44" y="166">The objective, the system</text>
    <text class="agent-loop-cycle-desc" x="44" y="182">instructions, and</text>
    <text class="agent-loop-cycle-desc" x="44" y="198">whatever the last tool</text>
  </g>
  <line class="agent-loop-cycle-line agent-loop-cycle-conn agent-loop-cycle-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#agent-loop-cycle-tip)"/>
  <g class="agent-loop-cycle-stage agent-loop-cycle-s1">
    <rect class="agent-loop-cycle-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="agent-loop-cycle-step" x="233" y="142">02</text>
    <text class="agent-loop-cycle-name" x="259" y="142">Plan</text>
    <text class="agent-loop-cycle-desc" x="233" y="166">Decide the next action.</text>
    <text class="agent-loop-cycle-desc" x="233" y="182">Not the whole solution —</text>
    <text class="agent-loop-cycle-desc" x="233" y="198">the next step.</text>
  </g>
  <line class="agent-loop-cycle-line agent-loop-cycle-conn agent-loop-cycle-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#agent-loop-cycle-tip)"/>
  <g class="agent-loop-cycle-stage agent-loop-cycle-s2">
    <rect class="agent-loop-cycle-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="agent-loop-cycle-step" x="422" y="142">03</text>
    <text class="agent-loop-cycle-name" x="448" y="142">Act</text>
    <text class="agent-loop-cycle-desc" x="422" y="166">Invoke a tool. Real code</text>
    <text class="agent-loop-cycle-desc" x="422" y="182">runs, against a real</text>
    <text class="agent-loop-cycle-desc" x="422" y="198">system.</text>
    <text class="agent-loop-cycle-edge" x="422" y="242">actuation</text>
  </g>
  <line class="agent-loop-cycle-line agent-loop-cycle-conn agent-loop-cycle-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#agent-loop-cycle-tip)"/>
  <g class="agent-loop-cycle-stage agent-loop-cycle-s3">
    <rect class="agent-loop-cycle-good" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="agent-loop-cycle-step" x="611" y="142">04</text>
    <text class="agent-loop-cycle-name" x="637" y="142">Observe</text>
    <text class="agent-loop-cycle-desc" x="611" y="166">Read the result. This is</text>
    <text class="agent-loop-cycle-desc" x="611" y="182">what grounds the next</text>
    <text class="agent-loop-cycle-desc" x="611" y="198">thought in reality.</text>
  </g>
  <line class="agent-loop-cycle-line agent-loop-cycle-conn agent-loop-cycle-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#agent-loop-cycle-tip)"/>
  <g class="agent-loop-cycle-stage agent-loop-cycle-s4">
    <rect class="agent-loop-cycle-box" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="agent-loop-cycle-step" x="800" y="142">05</text>
    <text class="agent-loop-cycle-name" x="826" y="142">Reflect, or stop</text>
    <text class="agent-loop-cycle-desc" x="800" y="166">Adjust and loop, or emit</text>
    <text class="agent-loop-cycle-desc" x="800" y="182">a final answer when the</text>
    <text class="agent-loop-cycle-desc" x="800" y="198">predicate is satisfied.</text>
    <text class="agent-loop-cycle-edge" x="800" y="242">stopping rule</text>
  </g>
  <text class="agent-loop-cycle-sub" x="30" y="304">The fourth step is the one that distinguishes an agent from a long prompt: the model is conditioned on what actually happened rather than on what it predicted would happen.</text>
</svg>
