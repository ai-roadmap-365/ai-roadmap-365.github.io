<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three answers you cannot get otherwise.">
  <title>What tenant attribution buys</title>
  <style>
    .tenant-economics-bg   { fill: #f8fafc; }
    .tenant-economics-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tenant-economics-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tenant-economics-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tenant-economics-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tenant-economics-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tenant-economics-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tenant-economics-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tenant-economics-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tenant-economics-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tenant-economics-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tenant-economics-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tenant-economics-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tenant-economics-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tenant-economics-stage { opacity: 1; }

    .tenant-economics-s0 { animation-delay: 0.00s; }
    .tenant-economics-e0 { animation-delay: 0.00s; }
    .tenant-economics-s1 { animation-delay: 1.50s; }
    .tenant-economics-e1 { animation-delay: 1.50s; }
    .tenant-economics-s2 { animation-delay: 3.00s; }
    .tenant-economics-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .tenant-economics-conn  { animation: tenant-economics-trace 6s ease-in-out infinite; }
      .tenant-economics-stage { animation: tenant-economics-arrive 6s ease-in-out infinite; }
    }
    @keyframes tenant-economics-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tenant-economics-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tenant-economics-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tenant-economics-stage { animation: tenant-economics-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tenant-economics-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tenant-economics-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tenant-economics-bg" width="980" height="322"/>
  <text class="tenant-economics-h1"  x="30" y="40">What tenant attribution buys</text>
  <text class="tenant-economics-sub" x="30" y="64">Three answers you cannot get otherwise.</text>
  <g class="tenant-economics-stage tenant-economics-s0">
    <rect class="tenant-economics-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="tenant-economics-step" x="44" y="142">01</text>
    <text class="tenant-economics-name" x="70" y="142">Which customers are profitable</text>
    <text class="tenant-economics-desc" x="44" y="166">Gross margin per account, from the same</text>
    <text class="tenant-economics-desc" x="44" y="182">events that produced the invoice.</text>
    <text class="tenant-economics-edge" x="44" y="242">margin</text>
  </g>
  <line class="tenant-economics-line tenant-economics-conn tenant-economics-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#tenant-economics-tip)"/>
  <g class="tenant-economics-stage tenant-economics-s1">
    <rect class="tenant-economics-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="tenant-economics-step" x="359" y="142">02</text>
    <text class="tenant-economics-name" x="385" y="142">Which spike is growth and which is a bug</text>
    <text class="tenant-economics-desc" x="359" y="166">A $50,000 bill from many customers, or from</text>
    <text class="tenant-economics-desc" x="359" y="182">one trial account looping.</text>
  </g>
  <line class="tenant-economics-line tenant-economics-conn tenant-economics-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#tenant-economics-tip)"/>
  <g class="tenant-economics-stage tenant-economics-s2">
    <rect class="tenant-economics-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="tenant-economics-step" x="674" y="142">03</text>
    <text class="tenant-economics-name" x="700" y="142">When to warn and when to throttle</text>
    <text class="tenant-economics-desc" x="674" y="166">90% of budget: notify. 100%: downgrade the</text>
    <text class="tenant-economics-desc" x="674" y="182">model or request a top-up.</text>
    <text class="tenant-economics-edge" x="674" y="242">quota</text>
  </g>
  <text class="tenant-economics-sub" x="30" y="304">Without the tenant field these three questions have the same answer — "the bill went up" — which is why attribution is worth adding before the bill is large enough to make anyone ask.</text>
</svg>
