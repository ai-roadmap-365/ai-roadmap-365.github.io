<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Matrix multiplication</title>
  <style>
    .matmul-idea-bg   { fill: #f8fafc; }
    .matmul-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matmul-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matmul-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matmul-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matmul-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matmul-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .matmul-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .matmul-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .matmul-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .matmul-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .matmul-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .matmul-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .matmul-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .matmul-idea-stage { opacity: 1; }

    .matmul-idea-s0 { animation-delay: 0.00s; }
    .matmul-idea-e0 { animation-delay: 0.00s; }
    .matmul-idea-s1 { animation-delay: 1.28s; }
    .matmul-idea-e1 { animation-delay: 1.28s; }
    .matmul-idea-s2 { animation-delay: 2.56s; }
    .matmul-idea-e2 { animation-delay: 2.56s; }
    .matmul-idea-s3 { animation-delay: 3.84s; }
    .matmul-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .matmul-idea-conn  { animation: matmul-idea-trace 6.4s ease-in-out infinite; }
      .matmul-idea-stage { animation: matmul-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes matmul-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes matmul-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .matmul-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .matmul-idea-stage { animation: matmul-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes matmul-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="matmul-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="matmul-idea-bg" width="980" height="322"/>
  <text class="matmul-idea-h1"  x="30" y="40">Matrix multiplication</text>
  <text class="matmul-idea-sub" x="30" y="64">Four steps.</text>
  <g class="matmul-idea-stage matmul-idea-s0">
    <rect class="matmul-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="matmul-idea-step" x="44" y="142">01</text>
    <text class="matmul-idea-name" x="70" y="142">Every entry is a dot product</text>
    <text class="matmul-idea-desc" x="44" y="166">A row of the first with a column</text>
    <text class="matmul-idea-desc" x="44" y="182">of the second.</text>
  </g>
  <line class="matmul-idea-line matmul-idea-conn matmul-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#matmul-idea-tip)"/>
  <g class="matmul-idea-stage matmul-idea-s1">
    <rect class="matmul-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="matmul-idea-step" x="280" y="142">02</text>
    <text class="matmul-idea-name" x="306" y="142">So the inner dimensions must match</text>
    <text class="matmul-idea-desc" x="280" y="166">Which is where the shape rule</text>
    <text class="matmul-idea-desc" x="280" y="182">comes from.</text>
  </g>
  <line class="matmul-idea-line matmul-idea-conn matmul-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#matmul-idea-tip)"/>
  <g class="matmul-idea-stage matmul-idea-s2">
    <rect class="matmul-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="matmul-idea-step" x="516" y="142">03</text>
    <text class="matmul-idea-name" x="542" y="142">And the result takes the outer dimensions</text>
    <text class="matmul-idea-desc" x="516" y="166">Rows of the first, columns of</text>
    <text class="matmul-idea-desc" x="516" y="182">the second.</text>
  </g>
  <line class="matmul-idea-line matmul-idea-conn matmul-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#matmul-idea-tip)"/>
  <g class="matmul-idea-stage matmul-idea-s3">
    <rect class="matmul-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="matmul-idea-step" x="752" y="142">04</text>
    <text class="matmul-idea-name" x="778" y="142">Meaning: apply one transformation, then another</text>
    <text class="matmul-idea-desc" x="752" y="166">Which is composition.</text>
    <text class="matmul-idea-edge" x="752" y="242">the reading</text>
  </g>
  <text class="matmul-idea-sub" x="30" y="304">Seeing it as composition rather than as a computational recipe is what makes the order rules memorable instead of arbitrary.</text>
</svg>
