<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are cost.">
  <title>Four consequences of gradients</title>
  <style>
    .grad-implications-bg   { fill: #f8fafc; }
    .grad-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grad-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grad-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grad-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grad-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grad-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .grad-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .grad-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .grad-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .grad-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .grad-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .grad-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .grad-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .grad-implications-stage { opacity: 1; }

    .grad-implications-s0 { animation-delay: 0.00s; }
    .grad-implications-e0 { animation-delay: 0.00s; }
    .grad-implications-s1 { animation-delay: 1.28s; }
    .grad-implications-e1 { animation-delay: 1.28s; }
    .grad-implications-s2 { animation-delay: 2.56s; }
    .grad-implications-e2 { animation-delay: 2.56s; }
    .grad-implications-s3 { animation-delay: 3.84s; }
    .grad-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .grad-implications-conn  { animation: grad-implications-trace 6.4s ease-in-out infinite; }
      .grad-implications-stage { animation: grad-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes grad-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes grad-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .grad-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .grad-implications-stage { animation: grad-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes grad-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="grad-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="grad-implications-bg" width="980" height="322"/>
  <text class="grad-implications-h1"  x="30" y="40">Four consequences of gradients</text>
  <text class="grad-implications-sub" x="30" y="64">Two are cost.</text>
  <g class="grad-implications-stage grad-implications-s0">
    <rect class="grad-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="grad-implications-step" x="44" y="142">01</text>
    <text class="grad-implications-name" x="70" y="142">Models with millions of parameters become trainable</text>
    <text class="grad-implications-desc" x="44" y="166">Which is the enabling fact.</text>
  </g>
  <line class="grad-implications-line grad-implications-conn grad-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#grad-implications-tip)"/>
  <g class="grad-implications-stage grad-implications-s1">
    <rect class="grad-implications-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="grad-implications-step" x="280" y="142">02</text>
    <text class="grad-implications-name" x="306" y="142">At the cost of a backward pass per update</text>
    <text class="grad-implications-desc" x="280" y="166">Roughly doubling the work.</text>
  </g>
  <line class="grad-implications-line grad-implications-conn grad-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#grad-implications-tip)"/>
  <g class="grad-implications-stage grad-implications-s2">
    <rect class="grad-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="grad-implications-step" x="516" y="142">03</text>
    <text class="grad-implications-name" x="542" y="142">With gradients that can vanish or explode</text>
    <text class="grad-implications-desc" x="516" y="166">Through many layers.</text>
  </g>
  <line class="grad-implications-line grad-implications-conn grad-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#grad-implications-tip)"/>
  <g class="grad-implications-stage grad-implications-s3">
    <rect class="grad-implications-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="grad-implications-step" x="752" y="142">04</text>
    <text class="grad-implications-name" x="778" y="142">And components that suggest local sensitivity</text>
    <text class="grad-implications-desc" x="752" y="166">Used for attribution, with care.</text>
  </g>
  <text class="grad-implications-sub" x="30" y="304">Vanishing and exploding gradients are the practical failure of deep networks, and much of modern architecture design exists to keep them under control.</text>
</svg>
