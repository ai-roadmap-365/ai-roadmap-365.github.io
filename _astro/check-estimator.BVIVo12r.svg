<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Checking the contract</title>
  <style>
    .check-estimator-bg   { fill: #f8fafc; }
    .check-estimator-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .check-estimator-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .check-estimator-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .check-estimator-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .check-estimator-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .check-estimator-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .check-estimator-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .check-estimator-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .check-estimator-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .check-estimator-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .check-estimator-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .check-estimator-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .check-estimator-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .check-estimator-stage { opacity: 1; }

    .check-estimator-s0 { animation-delay: 0.00s; }
    .check-estimator-e0 { animation-delay: 0.00s; }
    .check-estimator-s1 { animation-delay: 1.28s; }
    .check-estimator-e1 { animation-delay: 1.28s; }
    .check-estimator-s2 { animation-delay: 2.56s; }
    .check-estimator-e2 { animation-delay: 2.56s; }
    .check-estimator-s3 { animation-delay: 3.84s; }
    .check-estimator-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .check-estimator-conn  { animation: check-estimator-trace 6.4s ease-in-out infinite; }
      .check-estimator-stage { animation: check-estimator-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes check-estimator-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes check-estimator-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .check-estimator-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .check-estimator-stage { animation: check-estimator-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes check-estimator-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="check-estimator-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="check-estimator-bg" width="980" height="322"/>
  <text class="check-estimator-h1"  x="30" y="40">Checking the contract</text>
  <text class="check-estimator-sub" x="30" y="64">Four steps.</text>
  <g class="check-estimator-stage check-estimator-s0">
    <rect class="check-estimator-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="check-estimator-step" x="44" y="142">01</text>
    <text class="check-estimator-name" x="70" y="142">A standard suite exercises the whole contract</text>
    <text class="check-estimator-desc" x="44" y="166">Against any estimator you</text>
    <text class="check-estimator-desc" x="44" y="182">supply.</text>
  </g>
  <line class="check-estimator-line check-estimator-conn check-estimator-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#check-estimator-tip)"/>
  <g class="check-estimator-stage check-estimator-s1">
    <rect class="check-estimator-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="check-estimator-step" x="280" y="142">02</text>
    <text class="check-estimator-name" x="306" y="142">Including cloning, refitting and parameter round-tripping</text>
    <text class="check-estimator-desc" x="280" y="166">Which is where custom estimators</text>
    <text class="check-estimator-desc" x="280" y="182">usually fail.</text>
  </g>
  <line class="check-estimator-line check-estimator-conn check-estimator-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#check-estimator-tip)"/>
  <g class="check-estimator-stage check-estimator-s2">
    <rect class="check-estimator-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="check-estimator-step" x="516" y="142">03</text>
    <text class="check-estimator-name" x="542" y="142">And the behaviour of fit on edge-case input</text>
    <text class="check-estimator-desc" x="516" y="166">Empty arrays, single rows, wrong</text>
    <text class="check-estimator-desc" x="516" y="182">shapes.</text>
  </g>
  <line class="check-estimator-line check-estimator-conn check-estimator-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#check-estimator-tip)"/>
  <g class="check-estimator-stage check-estimator-s3">
    <rect class="check-estimator-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="check-estimator-step" x="752" y="142">04</text>
    <text class="check-estimator-name" x="778" y="142">Turning a convention into a gate</text>
    <text class="check-estimator-desc" x="752" y="166">Which is what makes the</text>
    <text class="check-estimator-desc" x="752" y="182">ecosystem interoperable.</text>
  </g>
  <text class="check-estimator-sub" x="30" y="304">This is the same principle as the validators in this repository: a convention nobody checks drifts, and a convention with a mechanical check does not.</text>
</svg>
