<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Three tools depend on it, and all three fail without it.">
  <title>Why one commit should do one thing</title>
  <style>
    .atomic-commit-bg   { fill: #f8fafc; }
    .atomic-commit-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .atomic-commit-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .atomic-commit-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .atomic-commit-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .atomic-commit-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .atomic-commit-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .atomic-commit-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .atomic-commit-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .atomic-commit-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .atomic-commit-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .atomic-commit-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .atomic-commit-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .atomic-commit-row { opacity: 1; }
    .atomic-commit-r0 { animation-delay: 0.00s; }
    .atomic-commit-r1 { animation-delay: 0.45s; }
    .atomic-commit-r2 { animation-delay: 0.90s; }
    .atomic-commit-r3 { animation-delay: 1.35s; }
    .atomic-commit-r4 { animation-delay: 1.80s; }
    .atomic-commit-row { animation: atomic-commit-reveal 7.3s ease-in-out infinite; }
    @keyframes atomic-commit-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="atomic-commit-bg" width="980" height="390"/>
  <text class="atomic-commit-h1"  x="30" y="40">Why one commit should do one thing</text>
  <text class="atomic-commit-sub" x="30" y="64">Three tools depend on it, and all three fail without it.</text>
  <rect class="atomic-commit-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="atomic-commit-name" x="46" y="122">One logical change</text>
  <text class="atomic-commit-desc" x="46" y="142">Revertable, reviewable, bisectable.</text>
  <text class="atomic-commit-desc atomic-commit-row atomic-commit-r0" x="46" y="182">Revert it without disturbing anything else</text>
  <text class="atomic-commit-desc atomic-commit-row atomic-commit-r1" x="46" y="216">Review it in isolation</text>
  <text class="atomic-commit-desc atomic-commit-row atomic-commit-r2" x="46" y="250">git bisect points at the real cause</text>
  <text class="atomic-commit-desc atomic-commit-row atomic-commit-r3" x="46" y="284">The message can say one clear thing</text>
  <text class="atomic-commit-desc atomic-commit-row atomic-commit-r4" x="46" y="318">Easy to cherry-pick to a release branch</text>
  <rect class="atomic-commit-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="atomic-commit-name" x="526" y="122">A fix, a reformat and half a feature</text>
  <text class="atomic-commit-desc" x="526" y="142">None of the three work.</text>
  <text class="atomic-commit-desc atomic-commit-row atomic-commit-r0" x="526" y="182">Reverting it undoes things you wanted</text>
  <text class="atomic-commit-desc atomic-commit-row atomic-commit-r1" x="526" y="216">Exhausting to review; usually skimmed</text>
  <text class="atomic-commit-desc atomic-commit-row atomic-commit-r2" x="526" y="250">Bisect names it, and you still do not know why</text>
  <text class="atomic-commit-desc atomic-commit-row atomic-commit-r3" x="526" y="284">The message has to describe three things</text>
  <text class="atomic-commit-desc atomic-commit-row atomic-commit-r4" x="526" y="318">Cannot be cherry-picked cleanly</text>
  <text class="atomic-commit-sub" x="30" y="372">A formatting sweep in the same commit as a fix is the classic case: hundreds of changed lines hide the one that mattered, and no tool can separate them afterwards.</text>
</svg>
