<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things tests are not</title>
  <style>
    .test-not-bg   { fill: #f8fafc; }
    .test-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .test-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .test-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .test-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .test-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .test-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .test-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .test-not-row { opacity: 1; }
    .test-not-r0 { animation-delay: 0.00s; }
    .test-not-r1 { animation-delay: 0.45s; }
    .test-not-r2 { animation-delay: 0.90s; }
    .test-not-r3 { animation-delay: 1.35s; }
    .test-not-r4 { animation-delay: 1.80s; }
    .test-not-row { animation: test-not-reveal 7.3s ease-in-out infinite; }
    @keyframes test-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="test-not-bg" width="980" height="390"/>
  <text class="test-not-h1"  x="30" y="40">Four things tests are not</text>
  <text class="test-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="test-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="test-not-name" x="46" y="122">The misconception</text>
  <text class="test-not-desc" x="46" y="142">Commonly held.</text>
  <text class="test-not-desc test-not-row test-not-r0" x="46" y="182">Coverage percentage measures quality</text>
  <text class="test-not-desc test-not-row test-not-r1" x="46" y="216">Tests prove correctness</text>
  <text class="test-not-desc test-not-row test-not-r2" x="46" y="250">Testing slows development down</text>
  <text class="test-not-desc test-not-row test-not-r3" x="46" y="284">Every function needs a test</text>
  <text class="test-not-desc test-not-row test-not-r4" x="46" y="318">A passing suite means it works</text>
  <rect class="test-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="test-not-name" x="526" y="122">What is true</text>
  <text class="test-not-desc" x="526" y="142">Actually.</text>
  <text class="test-not-desc test-not-row test-not-r0" x="526" y="182">It measures execution, not verification</text>
  <text class="test-not-desc test-not-row test-not-r1" x="526" y="216">They show the absence of specific failures</text>
  <text class="test-not-desc test-not-row test-not-r2" x="526" y="250">It slows the first version and speeds every one after</text>
  <text class="test-not-desc test-not-row test-not-r3" x="526" y="284">Test behaviour, not every unit</text>
  <text class="test-not-desc test-not-row test-not-r4" x="526" y="318">It means the tested behaviours work</text>
  <text class="test-not-sub" x="30" y="372">Coverage measuring execution rather than verification is the trap: a test that runs a function and asserts nothing counts fully toward coverage.</text>
</svg>
