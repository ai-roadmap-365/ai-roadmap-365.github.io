<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what it removes.">
  <title>What the sandbox costs</title>
  <style>
    .sandbox-cost-bg   { fill: #f8fafc; }
    .sandbox-cost-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sandbox-cost-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sandbox-cost-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sandbox-cost-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sandbox-cost-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sandbox-cost-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sandbox-cost-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sandbox-cost-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sandbox-cost-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sandbox-cost-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sandbox-cost-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sandbox-cost-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sandbox-cost-row { opacity: 1; }
    .sandbox-cost-r0 { animation-delay: 0.00s; }
    .sandbox-cost-r1 { animation-delay: 0.45s; }
    .sandbox-cost-r2 { animation-delay: 0.90s; }
    .sandbox-cost-r3 { animation-delay: 1.35s; }
    .sandbox-cost-r4 { animation-delay: 1.80s; }
    .sandbox-cost-row { animation: sandbox-cost-reveal 7.3s ease-in-out infinite; }
    @keyframes sandbox-cost-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="sandbox-cost-bg" width="980" height="390"/>
  <text class="sandbox-cost-h1"  x="30" y="40">What the sandbox costs</text>
  <text class="sandbox-cost-sub" x="30" y="64">And what it removes.</text>
  <rect class="sandbox-cost-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="sandbox-cost-name" x="46" y="122">The cost</text>
  <text class="sandbox-cost-desc" x="46" y="142">Measurable, and real.</text>
  <text class="sandbox-cost-desc sandbox-cost-row sandbox-cost-r0" x="46" y="182">About 80 ms of added latency</text>
  <text class="sandbox-cost-desc sandbox-cost-row sandbox-cost-r1" x="46" y="216">Roughly double the tokens on ingestion</text>
  <text class="sandbox-cost-desc sandbox-cost-row sandbox-cost-r2" x="46" y="250">A second model to operate</text>
  <text class="sandbox-cost-desc sandbox-cost-row sandbox-cost-r3" x="46" y="284">A schema to maintain</text>
  <text class="sandbox-cost-desc sandbox-cost-row sandbox-cost-r4" x="46" y="318">Paid on every document</text>
  <rect class="sandbox-cost-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="sandbox-cost-name" x="526" y="122">What it removes</text>
  <text class="sandbox-cost-desc" x="526" y="142">Most of the surface.</text>
  <text class="sandbox-cost-desc sandbox-cost-row sandbox-cost-r0" x="526" y="182">Instructions in retrieved text reach nothing</text>
  <text class="sandbox-cost-desc sandbox-cost-row sandbox-cost-r1" x="526" y="216">No tool is reachable from untrusted prose</text>
  <text class="sandbox-cost-desc sandbox-cost-row sandbox-cost-r2" x="526" y="250">Failure is a parse error, not an action</text>
  <text class="sandbox-cost-desc sandbox-cost-row sandbox-cost-r3" x="526" y="284">Testable, and deterministic</text>
  <text class="sandbox-cost-desc sandbox-cost-row sandbox-cost-r4" x="526" y="318">Roughly 99% of indirect injection</text>
  <text class="sandbox-cost-sub" x="30" y="372">This is one of the few AI security controls with a clean cost figure attached, which makes it unusually easy to decide: the question is only whether 80 ms and double ingestion tokens is worth it for your data source.</text>
</svg>
