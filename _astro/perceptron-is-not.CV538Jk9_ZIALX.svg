<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two comparisons that matter.">
  <title>What a perceptron is and is not</title>
  <style>
    .perceptron-is-not-bg   { fill: #f8fafc; }
    .perceptron-is-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .perceptron-is-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .perceptron-is-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .perceptron-is-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .perceptron-is-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .perceptron-is-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .perceptron-is-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .perceptron-is-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .perceptron-is-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .perceptron-is-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .perceptron-is-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .perceptron-is-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .perceptron-is-not-row { opacity: 1; }
    .perceptron-is-not-r0 { animation-delay: 0.00s; }
    .perceptron-is-not-r1 { animation-delay: 0.45s; }
    .perceptron-is-not-r2 { animation-delay: 0.90s; }
    .perceptron-is-not-r3 { animation-delay: 1.35s; }
    .perceptron-is-not-r4 { animation-delay: 1.80s; }
    .perceptron-is-not-row { animation: perceptron-is-not-reveal 7.3s ease-in-out infinite; }
    @keyframes perceptron-is-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="perceptron-is-not-bg" width="980" height="390"/>
  <text class="perceptron-is-not-h1"  x="30" y="40">What a perceptron is and is not</text>
  <text class="perceptron-is-not-sub" x="30" y="64">Two comparisons that matter.</text>
  <rect class="perceptron-is-not-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="perceptron-is-not-name" x="46" y="122">What it is</text>
  <text class="perceptron-is-not-desc" x="46" y="142">One linear unit.</text>
  <text class="perceptron-is-not-desc perceptron-is-not-row perceptron-is-not-r0" x="46" y="182">A linear binary classifier</text>
  <text class="perceptron-is-not-desc perceptron-is-not-row perceptron-is-not-r1" x="46" y="216">One hyperplane in feature space</text>
  <text class="perceptron-is-not-desc perceptron-is-not-row perceptron-is-not-r2" x="46" y="250">An online learner — updates per sample</text>
  <text class="perceptron-is-not-desc perceptron-is-not-row perceptron-is-not-r3" x="46" y="284">Updates only on a mistake</text>
  <text class="perceptron-is-not-desc perceptron-is-not-row perceptron-is-not-r4" x="46" y="318">Four parameters for two features</text>
  <rect class="perceptron-is-not-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="perceptron-is-not-name" x="526" y="122">What it is not</text>
  <text class="perceptron-is-not-desc" x="526" y="142">Two confusions.</text>
  <text class="perceptron-is-not-desc perceptron-is-not-row perceptron-is-not-r0" x="526" y="182">Not a deep network — zero hidden layers</text>
  <text class="perceptron-is-not-desc perceptron-is-not-row perceptron-is-not-r1" x="526" y="216">No non-linear representational capacity</text>
  <text class="perceptron-is-not-desc perceptron-is-not-row perceptron-is-not-r2" x="526" y="250">Not logistic regression</text>
  <text class="perceptron-is-not-desc perceptron-is-not-row perceptron-is-not-r3" x="526" y="284">A discontinuous step, not a smooth sigmoid</text>
  <text class="perceptron-is-not-desc perceptron-is-not-row perceptron-is-not-r4" x="526" y="318">So no probabilities, and no gradient</text>
  <text class="perceptron-is-not-sub" x="30" y="372">The second confusion matters mathematically rather than cosmetically: the step function has no useful derivative, which means the perceptron cannot be trained by gradient descent at all.</text>
</svg>
