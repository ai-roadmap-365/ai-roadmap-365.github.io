<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And the one you changed without updating.">
  <title>A recipe given to a friend</title>
  <style>
    .recipe-analogy-bg   { fill: #f8fafc; }
    .recipe-analogy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recipe-analogy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recipe-analogy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recipe-analogy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recipe-analogy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recipe-analogy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .recipe-analogy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .recipe-analogy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .recipe-analogy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .recipe-analogy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .recipe-analogy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .recipe-analogy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .recipe-analogy-row { opacity: 1; }
    .recipe-analogy-r0 { animation-delay: 0.00s; }
    .recipe-analogy-r1 { animation-delay: 0.45s; }
    .recipe-analogy-r2 { animation-delay: 0.90s; }
    .recipe-analogy-r3 { animation-delay: 1.35s; }
    .recipe-analogy-r4 { animation-delay: 1.80s; }
    .recipe-analogy-row { animation: recipe-analogy-reveal 7.3s ease-in-out infinite; }
    @keyframes recipe-analogy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="recipe-analogy-bg" width="980" height="390"/>
  <text class="recipe-analogy-h1"  x="30" y="40">A recipe given to a friend</text>
  <text class="recipe-analogy-sub" x="30" y="64">And the one you changed without updating.</text>
  <rect class="recipe-analogy-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="recipe-analogy-name" x="46" y="122">Assumes what you know</text>
  <text class="recipe-analogy-desc" x="46" y="142">They cannot tell whose fault it is.</text>
  <text class="recipe-analogy-desc recipe-analogy-row recipe-analogy-r0" x="46" y="182">"Cook until done"</text>
  <text class="recipe-analogy-desc recipe-analogy-row recipe-analogy-r1" x="46" y="216">An ingredient you always have</text>
  <text class="recipe-analogy-desc recipe-analogy-row recipe-analogy-r2" x="46" y="250">Timing that assumes a fan oven</text>
  <text class="recipe-analogy-desc recipe-analogy-row recipe-analogy-r3" x="46" y="284">Says 180 because that is what you used to do</text>
  <text class="recipe-analogy-desc recipe-analogy-row recipe-analogy-r4" x="46" y="318">You would never notice — you stopped reading it</text>
  <rect class="recipe-analogy-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="recipe-analogy-name" x="526" y="122">States it</text>
  <text class="recipe-analogy-desc" x="526" y="142">They can tell success from failure.</text>
  <text class="recipe-analogy-desc recipe-analogy-row recipe-analogy-r0" x="526" y="182">What it makes, in one line</text>
  <text class="recipe-analogy-desc recipe-analogy-row recipe-analogy-r1" x="526" y="216">Exact quantities</text>
  <text class="recipe-analogy-desc recipe-analogy-row recipe-analogy-r2" x="526" y="250">A temperature and a time</text>
  <text class="recipe-analogy-desc recipe-analogy-row recipe-analogy-r3" x="526" y="284">What it looks like when it is right</text>
  <text class="recipe-analogy-desc recipe-analogy-row recipe-analogy-r4" x="526" y="318">"This does not work with the low-fat version"</text>
  <text class="recipe-analogy-sub" x="30" y="372">The last line on the right is the limitations section, and it is what makes the rest of the card trustworthy: a document that admits one boundary is believable about the others.</text>
</svg>
