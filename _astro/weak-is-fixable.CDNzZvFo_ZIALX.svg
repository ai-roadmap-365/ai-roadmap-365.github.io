<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And the report should say what to add.">
  <title>Weak is fixable; vague is not yet a claim</title>
  <style>
    .weak-is-fixable-bg   { fill: #f8fafc; }
    .weak-is-fixable-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weak-is-fixable-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weak-is-fixable-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weak-is-fixable-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weak-is-fixable-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weak-is-fixable-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .weak-is-fixable-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .weak-is-fixable-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .weak-is-fixable-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .weak-is-fixable-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .weak-is-fixable-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .weak-is-fixable-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .weak-is-fixable-row { opacity: 1; }
    .weak-is-fixable-r0 { animation-delay: 0.00s; }
    .weak-is-fixable-r1 { animation-delay: 0.45s; }
    .weak-is-fixable-r2 { animation-delay: 0.90s; }
    .weak-is-fixable-r3 { animation-delay: 1.35s; }
    .weak-is-fixable-r4 { animation-delay: 1.80s; }
    .weak-is-fixable-row { animation: weak-is-fixable-reveal 7.3s ease-in-out infinite; }
    @keyframes weak-is-fixable-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="weak-is-fixable-bg" width="980" height="390"/>
  <text class="weak-is-fixable-h1"  x="30" y="40">Weak is fixable; vague is not yet a claim</text>
  <text class="weak-is-fixable-sub" x="30" y="64">And the report should say what to add.</text>
  <rect class="weak-is-fixable-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="weak-is-fixable-name" x="46" y="122">Weak</text>
  <text class="weak-is-fixable-desc" x="46" y="142">Missing a property.</text>
  <text class="weak-is-fixable-desc weak-is-fixable-row weak-is-fixable-r0" x="46" y="182">"Reduced answer latency to 840ms"</text>
  <text class="weak-is-fixable-desc weak-is-fixable-row weak-is-fixable-r1" x="46" y="216">Has a measurement, lacks a baseline</text>
  <text class="weak-is-fixable-desc weak-is-fixable-row weak-is-fixable-r2" x="46" y="250">Or lacks attribution, or evidence</text>
  <text class="weak-is-fixable-desc weak-is-fixable-row weak-is-fixable-r3" x="46" y="284">The fix is one clause</text>
  <text class="weak-is-fixable-desc weak-is-fixable-row weak-is-fixable-r4" x="46" y="318">"Add the value it started from"</text>
  <rect class="weak-is-fixable-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="weak-is-fixable-name" x="526" y="122">Vague</text>
  <text class="weak-is-fixable-desc" x="526" y="142">No measurement at all.</text>
  <text class="weak-is-fixable-desc weak-is-fixable-row weak-is-fixable-r0" x="526" y="182">"Significantly improved retrieval quality"</text>
  <text class="weak-is-fixable-desc weak-is-fixable-row weak-is-fixable-r1" x="526" y="216">Sounds like a result, contains none</text>
  <text class="weak-is-fixable-desc weak-is-fixable-row weak-is-fixable-r2" x="526" y="250">Adjectives standing in for numbers</text>
  <text class="weak-is-fixable-desc weak-is-fixable-row weak-is-fixable-r3" x="526" y="284">The fix is going back to the data</text>
  <text class="weak-is-fixable-desc weak-is-fixable-row weak-is-fixable-r4" x="526" y="318">And the data may no longer exist</text>
  <text class="weak-is-fixable-sub" x="30" y="372">"This claim is weak" is a complaint; "add the value it started from and what you personally did" is an instruction — and only the second gets acted on.</text>
</svg>
