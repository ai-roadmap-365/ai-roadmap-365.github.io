<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Roles, and a protocol for speaking.">
  <title>A surgical team</title>
  <style>
    .surgical-team-bg   { fill: #f8fafc; }
    .surgical-team-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .surgical-team-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .surgical-team-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .surgical-team-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .surgical-team-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .surgical-team-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .surgical-team-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .surgical-team-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .surgical-team-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .surgical-team-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .surgical-team-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .surgical-team-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .surgical-team-row { opacity: 1; }
    .surgical-team-r0 { animation-delay: 0.00s; }
    .surgical-team-r1 { animation-delay: 0.45s; }
    .surgical-team-r2 { animation-delay: 0.90s; }
    .surgical-team-r3 { animation-delay: 1.35s; }
    .surgical-team-r4 { animation-delay: 1.80s; }
    .surgical-team-row { animation: surgical-team-reveal 7.3s ease-in-out infinite; }
    @keyframes surgical-team-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="surgical-team-bg" width="980" height="390"/>
  <text class="surgical-team-h1"  x="30" y="40">A surgical team</text>
  <text class="surgical-team-sub" x="30" y="64">Roles, and a protocol for speaking.</text>
  <rect class="surgical-team-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="surgical-team-name" x="46" y="122">The team</text>
  <text class="surgical-team-desc" x="46" y="142">Four roles, one protocol.</text>
  <text class="surgical-team-desc surgical-team-row surgical-team-r0" x="46" y="182">The lead surgeon dictates strategy</text>
  <text class="surgical-team-desc surgical-team-row surgical-team-r1" x="46" y="216">The anaesthetist watches vital signs</text>
  <text class="surgical-team-desc surgical-team-row surgical-team-r2" x="46" y="250">The scrub nurse manages instruments</text>
  <text class="surgical-team-desc surgical-team-row surgical-team-r3" x="46" y="284">The radiologist reads the scans</text>
  <text class="surgical-team-desc surgical-team-row surgical-team-r4" x="46" y="318">Concise, prescribed verbal protocols</text>
  <rect class="surgical-team-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="surgical-team-name" x="526" y="122">One person</text>
  <text class="surgical-team-desc" x="526" y="142">Every role at once.</text>
  <text class="surgical-team-desc surgical-team-row surgical-team-r0" x="526" y="182">Cutting while reading the monitor</text>
  <text class="surgical-team-desc surgical-team-row surgical-team-r1" x="526" y="216">Choosing instruments while reading a scan</text>
  <text class="surgical-team-desc surgical-team-row surgical-team-r2" x="526" y="250">Attention divided across all four</text>
  <text class="surgical-team-desc surgical-team-row surgical-team-r3" x="526" y="284">Errors from load, not from skill</text>
  <text class="surgical-team-desc surgical-team-row surgical-team-r4" x="526" y="318">Nobody attempts this</text>
  <text class="surgical-team-sub" x="30" y="372">The prescribed verbal protocol is the part that maps onto the message envelope: hospitals do not rely on people phrasing things well under pressure, and neither should a message bus.</text>
</svg>
