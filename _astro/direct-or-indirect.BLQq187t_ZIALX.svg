<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Only one requires the attacker to talk to you.">
  <title>Direct against indirect injection</title>
  <style>
    .direct-or-indirect-bg   { fill: #f8fafc; }
    .direct-or-indirect-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .direct-or-indirect-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .direct-or-indirect-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .direct-or-indirect-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .direct-or-indirect-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .direct-or-indirect-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .direct-or-indirect-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .direct-or-indirect-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .direct-or-indirect-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .direct-or-indirect-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .direct-or-indirect-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .direct-or-indirect-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .direct-or-indirect-row { opacity: 1; }
    .direct-or-indirect-r0 { animation-delay: 0.00s; }
    .direct-or-indirect-r1 { animation-delay: 0.45s; }
    .direct-or-indirect-r2 { animation-delay: 0.90s; }
    .direct-or-indirect-r3 { animation-delay: 1.35s; }
    .direct-or-indirect-r4 { animation-delay: 1.80s; }
    .direct-or-indirect-row { animation: direct-or-indirect-reveal 7.3s ease-in-out infinite; }
    @keyframes direct-or-indirect-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="direct-or-indirect-bg" width="980" height="390"/>
  <text class="direct-or-indirect-h1"  x="30" y="40">Direct against indirect injection</text>
  <text class="direct-or-indirect-sub" x="30" y="64">Only one requires the attacker to talk to you.</text>
  <rect class="direct-or-indirect-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="direct-or-indirect-name" x="46" y="122">Direct</text>
  <text class="direct-or-indirect-desc" x="46" y="142">The attacker is the user.</text>
  <text class="direct-or-indirect-desc direct-or-indirect-row direct-or-indirect-r0" x="46" y="182">Typed into your interface</text>
  <text class="direct-or-indirect-desc direct-or-indirect-row direct-or-indirect-r1" x="46" y="216">"Ignore previous instructions"</text>
  <text class="direct-or-indirect-desc direct-or-indirect-row direct-or-indirect-r2" x="46" y="250">Rate limits and auth apply</text>
  <text class="direct-or-indirect-desc direct-or-indirect-row direct-or-indirect-r3" x="46" y="284">One session, one actor</text>
  <text class="direct-or-indirect-desc direct-or-indirect-row direct-or-indirect-r4" x="46" y="318">Visible in your logs</text>
  <rect class="direct-or-indirect-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="direct-or-indirect-name" x="526" y="122">Indirect</text>
  <text class="direct-or-indirect-desc" x="526" y="142">The attacker is absent.</text>
  <text class="direct-or-indirect-desc direct-or-indirect-row direct-or-indirect-r0" x="526" y="182">Written into a web page or a PDF</text>
  <text class="direct-or-indirect-desc direct-or-indirect-row direct-or-indirect-r1" x="526" y="216">Retrieved because it is relevant</text>
  <text class="direct-or-indirect-desc direct-or-indirect-row direct-or-indirect-r2" x="526" y="250">No authentication to fail</text>
  <text class="direct-or-indirect-desc direct-or-indirect-row direct-or-indirect-r3" x="526" y="284">Delivered by your own pipeline</text>
  <text class="direct-or-indirect-desc direct-or-indirect-row direct-or-indirect-r4" x="526" y="318">Looks exactly like normal traffic</text>
  <text class="direct-or-indirect-sub" x="30" y="372">The right-hand column is the one that changes architecture: every control that depends on identifying a malicious user is inert when the malicious content arrives through a retrieval step working correctly.</text>
</svg>
