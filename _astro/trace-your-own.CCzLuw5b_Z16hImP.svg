<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Trace one command you run daily, all the way down.">
  <title>The exercise that proves you have it</title>
  <style>
    .trace-your-own-bg   { fill: #f8fafc; }
    .trace-your-own-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .trace-your-own-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .trace-your-own-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .trace-your-own-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .trace-your-own-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .trace-your-own-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .trace-your-own-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .trace-your-own-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .trace-your-own-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .trace-your-own-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .trace-your-own-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .trace-your-own-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .trace-your-own-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .trace-your-own-stage { opacity: 1; }

    .trace-your-own-s0 { animation-delay: 0.00s; }
    .trace-your-own-e0 { animation-delay: 0.00s; }
    .trace-your-own-s1 { animation-delay: 1.28s; }
    .trace-your-own-e1 { animation-delay: 1.28s; }
    .trace-your-own-s2 { animation-delay: 2.56s; }
    .trace-your-own-e2 { animation-delay: 2.56s; }
    .trace-your-own-s3 { animation-delay: 3.84s; }
    .trace-your-own-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .trace-your-own-conn  { animation: trace-your-own-trace 6.4s ease-in-out infinite; }
      .trace-your-own-stage { animation: trace-your-own-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes trace-your-own-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes trace-your-own-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .trace-your-own-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .trace-your-own-stage { animation: trace-your-own-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes trace-your-own-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="trace-your-own-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="trace-your-own-bg" width="980" height="322"/>
  <text class="trace-your-own-h1"  x="30" y="40">The exercise that proves you have it</text>
  <text class="trace-your-own-sub" x="30" y="64">Trace one command you run daily, all the way down.</text>
  <g class="trace-your-own-stage trace-your-own-s0">
    <rect class="trace-your-own-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="trace-your-own-step" x="44" y="142">01</text>
    <text class="trace-your-own-name" x="70" y="142">Pick a command you run daily</text>
    <text class="trace-your-own-desc" x="44" y="166">Anything real. The more</text>
    <text class="trace-your-own-desc" x="44" y="182">ordinary, the better.</text>
  </g>
  <line class="trace-your-own-line trace-your-own-conn trace-your-own-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#trace-your-own-tip)"/>
  <g class="trace-your-own-stage trace-your-own-s1">
    <rect class="trace-your-own-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="trace-your-own-step" x="280" y="142">02</text>
    <text class="trace-your-own-name" x="306" y="142">Trace it down the layers</text>
    <text class="trace-your-own-desc" x="280" y="166">Shell, process, network,</text>
    <text class="trace-your-own-desc" x="280" y="182">protocol, storage — narrate each</text>
    <text class="trace-your-own-desc" x="280" y="198">step aloud.</text>
  </g>
  <line class="trace-your-own-line trace-your-own-conn trace-your-own-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#trace-your-own-tip)"/>
  <g class="trace-your-own-stage trace-your-own-s2">
    <rect class="trace-your-own-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="trace-your-own-step" x="516" y="142">03</text>
    <text class="trace-your-own-name" x="542" y="142">Note where you go vague</text>
    <text class="trace-your-own-desc" x="516" y="166">That hesitation is the gap, and</text>
    <text class="trace-your-own-desc" x="516" y="182">it is the whole point of the</text>
    <text class="trace-your-own-desc" x="516" y="198">exercise.</text>
    <text class="trace-your-own-edge" x="516" y="242">the gap</text>
  </g>
  <line class="trace-your-own-line trace-your-own-conn trace-your-own-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#trace-your-own-tip)"/>
  <g class="trace-your-own-stage trace-your-own-s3">
    <rect class="trace-your-own-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="trace-your-own-step" x="752" y="142">04</text>
    <text class="trace-your-own-name" x="778" y="142">Go and close it</text>
    <text class="trace-your-own-desc" x="752" y="166">One lesson revisited today costs</text>
    <text class="trace-your-own-desc" x="752" y="182">minutes. The same gap under a</text>
    <text class="trace-your-own-desc" x="752" y="198">deadline costs days.</text>
  </g>
  <text class="trace-your-own-sub" x="30" y="304">Teaching it to someone else is the harsher version of the same test, and the faster one: you cannot narrate a step you only half understand without both of you noticing.</text>
</svg>
