<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="You are running code from strangers, at speed, with one command.">
  <title>A package manager is a trust decision</title>
  <style>
    .supply-chain-risk-bg   { fill: #f8fafc; }
    .supply-chain-risk-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .supply-chain-risk-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .supply-chain-risk-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .supply-chain-risk-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .supply-chain-risk-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .supply-chain-risk-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .supply-chain-risk-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .supply-chain-risk-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .supply-chain-risk-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .supply-chain-risk-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .supply-chain-risk-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .supply-chain-risk-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .supply-chain-risk-row { opacity: 1; }
    .supply-chain-risk-r0 { animation-delay: 0.00s; }
    .supply-chain-risk-r1 { animation-delay: 0.45s; }
    .supply-chain-risk-r2 { animation-delay: 0.90s; }
    .supply-chain-risk-r3 { animation-delay: 1.35s; }
    .supply-chain-risk-r4 { animation-delay: 1.80s; }
    .supply-chain-risk-row { animation: supply-chain-risk-reveal 7.3s ease-in-out infinite; }
    @keyframes supply-chain-risk-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="supply-chain-risk-bg" width="980" height="390"/>
  <text class="supply-chain-risk-h1"  x="30" y="40">A package manager is a trust decision</text>
  <text class="supply-chain-risk-sub" x="30" y="64">You are running code from strangers, at speed, with one command.</text>
  <rect class="supply-chain-risk-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="supply-chain-risk-name" x="46" y="122">Where trust breaks</text>
  <text class="supply-chain-risk-desc" x="46" y="142">Real attacks, not hypotheticals.</text>
  <text class="supply-chain-risk-desc supply-chain-risk-row supply-chain-risk-r0" x="46" y="182">Typosquatting: a name one letter off</text>
  <text class="supply-chain-risk-desc supply-chain-risk-row supply-chain-risk-r1" x="46" y="216">Adding an unofficial repository you did not vet</text>
  <text class="supply-chain-risk-desc supply-chain-risk-row supply-chain-risk-r2" x="46" y="250">Install scripts that run as your user</text>
  <text class="supply-chain-risk-desc supply-chain-risk-row supply-chain-risk-r3" x="46" y="284">Unpinned versions changing under you</text>
  <text class="supply-chain-risk-desc supply-chain-risk-row supply-chain-risk-r4" x="46" y="318">A compromised maintainer account upstream</text>
  <rect class="supply-chain-risk-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="supply-chain-risk-name" x="526" y="122">What reduces it</text>
  <text class="supply-chain-risk-desc" x="526" y="142">Cheap habits, all of them.</text>
  <text class="supply-chain-risk-desc supply-chain-risk-row supply-chain-risk-r0" x="526" y="182">Copy package names; do not type them</text>
  <text class="supply-chain-risk-desc supply-chain-risk-row supply-chain-risk-r1" x="526" y="216">Stick to the default repositories</text>
  <text class="supply-chain-risk-desc supply-chain-risk-row supply-chain-risk-r2" x="526" y="250">Read what an install script does first</text>
  <text class="supply-chain-risk-desc supply-chain-risk-row supply-chain-risk-r3" x="526" y="284">Pin versions and commit the lock file</text>
  <text class="supply-chain-risk-desc supply-chain-risk-row supply-chain-risk-r4" x="526" y="318">Update deliberately, and read the changelog</text>
  <text class="supply-chain-risk-sub" x="30" y="372">The convenience is real and so is the exposure: one command can install a hundred packages from a hundred maintainers you have never heard of.</text>
</svg>
