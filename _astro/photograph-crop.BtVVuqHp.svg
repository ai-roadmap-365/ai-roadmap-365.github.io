<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="True, and misleading.">
  <title>Cropping a photograph</title>
  <style>
    .photograph-crop-bg   { fill: #f8fafc; }
    .photograph-crop-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .photograph-crop-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .photograph-crop-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .photograph-crop-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .photograph-crop-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .photograph-crop-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .photograph-crop-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .photograph-crop-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .photograph-crop-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .photograph-crop-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .photograph-crop-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .photograph-crop-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .photograph-crop-row { opacity: 1; }
    .photograph-crop-r0 { animation-delay: 0.00s; }
    .photograph-crop-r1 { animation-delay: 0.45s; }
    .photograph-crop-r2 { animation-delay: 0.90s; }
    .photograph-crop-r3 { animation-delay: 1.35s; }
    .photograph-crop-r4 { animation-delay: 1.80s; }
    .photograph-crop-row { animation: photograph-crop-reveal 7.3s ease-in-out infinite; }
    @keyframes photograph-crop-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="photograph-crop-bg" width="980" height="390"/>
  <text class="photograph-crop-h1"  x="30" y="40">Cropping a photograph</text>
  <text class="photograph-crop-sub" x="30" y="64">True, and misleading.</text>
  <rect class="photograph-crop-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="photograph-crop-name" x="46" y="122">Cropped</text>
  <text class="photograph-crop-desc" x="46" y="142">Every pixel true.</text>
  <text class="photograph-crop-desc photograph-crop-row photograph-crop-r0" x="46" y="182">Nothing was altered</text>
  <text class="photograph-crop-desc photograph-crop-row photograph-crop-r1" x="46" y="216">But the context is removed</text>
  <text class="photograph-crop-desc photograph-crop-row photograph-crop-r2" x="46" y="250">A different story is told</text>
  <text class="photograph-crop-desc photograph-crop-row photograph-crop-r3" x="46" y="284">Hard to challenge without the original</text>
  <text class="photograph-crop-desc photograph-crop-row photograph-crop-r4" x="46" y="318">This is a truncated axis</text>
  <rect class="photograph-crop-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="photograph-crop-name" x="526" y="122">The full frame</text>
  <text class="photograph-crop-desc" x="526" y="142">Context included.</text>
  <text class="photograph-crop-desc photograph-crop-row photograph-crop-r0" x="526" y="182">The same subject</text>
  <text class="photograph-crop-desc photograph-crop-row photograph-crop-r1" x="526" y="216">The surroundings visible</text>
  <text class="photograph-crop-desc photograph-crop-row photograph-crop-r2" x="526" y="250">The story is complete</text>
  <text class="photograph-crop-desc photograph-crop-row photograph-crop-r3" x="526" y="284">Judgeable by the viewer</text>
  <text class="photograph-crop-desc photograph-crop-row photograph-crop-r4" x="526" y="318">This is a full scale</text>
  <text class="photograph-crop-sub" x="30" y="372">Nothing being altered while everything is changed is exactly the position of a truncated axis, which is why 'the numbers are correct' is not a defence.</text>
</svg>
