<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="SVM Margin Geometry Diagram">
  <title>SVM Maximum Margin Geometry</title>
  <defs>
    <style>
      .d169a-bg { fill: #f8fafc; }
      .d169a-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d169a-header { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; }
      .d169a-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
      .d169a-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
      .d169a-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 11px; font-weight: 600; }
      .d169a-pos { fill: #3b82f6; }
      .d169a-neg { fill: #ef4444; }
      .d169a-sv { stroke: #0f172a; stroke-width: 2.5; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="d169a-bg" />

  <text x="40" y="45" class="d169a-header" font-size="22">Support Vector Machine Geometric Margin</text>
  <text x="40" y="70" class="d169a-text" font-size="13">Hyperplane: wᵀx + b = 0 with Maximum Geometric Margin 2 / ||w||₂ and Support Vectors (α &gt; 0)</text>

  <!-- Main Geometric Canvas -->
  <rect x="40" y="100" width="540" height="340" class="d169a-box" />

  <!-- Margin Shade (Buffer Zone) -->
  <polygon points="120,380 460,100 520,100 180,380" fill="#eff6ff" opacity="0.7" />

  <!-- Positive Margin: w^T x + b = +1 -->
  <line x1="120" y1="380" x2="460" y2="100" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6 3" />
  <text x="470" y="105" class="d169a-math" fill="#1d4ed8">wᵀx + b = +1</text>

  <!-- Decision Hyperplane: w^T x + b = 0 -->
  <line x1="150" y1="380" x2="490" y2="100" stroke="#0f172a" stroke-width="3" />
  <text x="500" y="130" class="d169a-math" fill="#0f172a">wᵀx + b = 0</text>

  <!-- Negative Margin: w^T x + b = -1 -->
  <line x1="180" y1="380" x2="520" y2="100" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 3" />
  <text x="530" y="155" class="d169a-math" fill="#b91c1c">wᵀx + b = -1</text>

  <!-- Positive Class Points (Blue Circles) -->
  <circle cx="150" cy="220" r="7" class="d169a-pos" />
  <circle cx="200" cy="160" r="7" class="d169a-pos" />
  <circle cx="280" cy="120" r="7" class="d169a-pos" />
  <!-- Positive Support Vectors (on boundary) -->
  <circle cx="290" cy="240" r="7" class="d169a-pos d169a-sv" />
  <circle cx="410" cy="140" r="7" class="d169a-pos d169a-sv" />

  <!-- Negative Class Points (Red Squares) -->
  <rect x="360" y="320" width="14" height="14" class="d169a-neg" />
  <rect x="420" y="270" width="14" height="14" class="d169a-neg" />
  <rect x="480" y="220" width="14" height="14" class="d169a-neg" />
  <!-- Negative Support Vectors (on boundary) -->
  <rect x="300" y="280" width="14" height="14" class="d169a-neg" stroke="#0f172a" stroke-width="2.5" />
  <rect x="420" y="180" width="14" height="14" class="d169a-neg" stroke="#0f172a" stroke-width="2.5" />

  <!-- Margin Width Dimension Arrow -->
  <line x1="235" y1="285" x2="280" y2="340" stroke="#64748b" stroke-width="1.5" />
  <text x="265" y="320" class="d169a-math" fill="#475569">Margin = 2 / ||w||</text>

  <!-- Side Legend Panel -->
  <rect x="610" y="100" width="250" height="340" class="d169a-box" />
  <text x="630" y="130" class="d169a-title">SVM Primal &amp; Dual Principles</text>

  <text x="630" y="160" class="d169a-text" font-weight="700">1. Support Vectors (α_i &gt; 0):</text>
  <text x="630" y="180" class="d169a-text">• Heavy outlined points lie on margin.</text>
  <text x="630" y="200" class="d169a-text">• Non-SVs (α_i = 0) exert zero impact.</text>

  <text x="630" y="235" class="d169a-text" font-weight="700">2. Soft Margin Regularization C:</text>
  <text x="630" y="255" class="d169a-text">• Large C: Hard margin, less slack ξ_i.</text>
  <text x="630" y="275" class="d169a-text">• Small C: Wider margin, noise tolerant.</text>

  <text x="630" y="310" class="d169a-text" font-weight="700">3. Decision Function:</text>
  <text x="630" y="330" class="d169a-math">f(x) = sign(∑ α_i y_i x_iᵀ x + b)</text>

  <text x="630" y="370" class="d169a-text">• Feature scaling is strictly required!</text>
  <text x="630" y="390" class="d169a-text">• Scales via Euclidean distances.</text>
</svg>
