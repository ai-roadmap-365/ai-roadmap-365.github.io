<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="1040" height="520" role="img" aria-labelledby="d117fTitleId d117fDescId">
  <title id="d117fTitleId">The central limit theorem and its condition: a lumpy population's sample means pile into a bell as n grows, while Cauchy sample means never do</title>
  <desc id="d117fDescId">Two panels, animated. Top: a lumpy, two-spike, non-normal population's sample means are drawn at four increasing sample sizes and pile up into an increasingly bell-shaped, narrowing histogram. Bottom: the same four-stage buildup performed on standard Cauchy draws instead, whose histogram stays exactly as wide and unpeaked at the last stage as at the first, refusing to concentrate no matter how large n grows. With motion removed, all four stages of both panels remain visible at once as a labelled sequence.</desc>

  <style>
    .d117f-bg     { fill: #f8fafc; }
    .d117f-title  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; fill: #1a202c; }
    .d117f-panelh { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; fill: #1a202c; }
    .d117f-label  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1a202c; }
    .d117f-small  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d117f-panel  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d117f-stagehdr { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; fill: #1d4ed8; }

    /* Top panel bars: a genuine bell forming across four stages. Resting state
       (reduced motion) shows the FINAL, most-concentrated shape, since that is
       the theorem's conclusion and the shape most worth seeing held still. */
    .d117f-topbar { fill: #bfdbfe; stroke: #1d4ed8; stroke-width: 1.25; transform-box: fill-box; transform-origin: bottom; animation: d117f-grow-normal 7s ease-in-out infinite; }
    @keyframes d117f-grow-normal {
      0%, 8%   { transform: scaleY(0.25); opacity: 0.55; }
      30%      { transform: scaleY(0.55); opacity: 0.75; }
      55%      { transform: scaleY(0.8); opacity: 0.9; }
      80%, 100%{ transform: scaleY(1); opacity: 1; }
    }

    /* Bottom panel bars: flat and wide throughout -- never allowed to grow
       taller or narrower, because that IS the counterexample. A small,
       harmless pulse marks that time is passing without claiming progress. */
    .d117f-botbar { fill: #fecaca; stroke: #b91c1c; stroke-width: 1.25; transform-box: fill-box; transform-origin: bottom; animation: d117f-flat-cauchy 7s ease-in-out infinite; }
    @keyframes d117f-flat-cauchy {
      0%, 100% { opacity: 0.8; }
      50%      { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d117f-topbar { animation: none; transform: scaleY(1); opacity: 1; }
      .d117f-botbar { animation: none; opacity: 1; }
    }
  </style>

  <rect class="d117f-bg" x="0" y="0" width="1040" height="520" />
  <text class="d117f-title" x="30" y="36">The theorem, and its condition, in one motion</text>
  <text class="d117f-small" x="30" y="58">as n grows: 10, 40, 160, 640 -- watch each panel's histogram over the cycle</text>

  <!-- TOP PANEL: finite-variance population converging -->
  <rect class="d117f-panel" x="24" y="72" width="992" height="190" rx="10" />
  <text class="d117f-panelh" x="44" y="98">Lumpy, non-Normal population (finite variance) -- the sample mean concentrates</text>

  <!-- four stages, each a small histogram building toward a bell -->
  <g transform="translate(70,110)">
    <text class="d117f-stagehdr" x="60" y="0" text-anchor="middle">n = 10</text>
    <line x1="0" y1="130" x2="120" y2="130" stroke="#1a202c" stroke-width="1.25" />
    <rect class="d117f-topbar" x="6"  y="112" width="14" height="18" style="animation-delay:0s" />
    <rect class="d117f-topbar" x="26" y="100" width="14" height="30" style="animation-delay:0s" />
    <rect class="d117f-topbar" x="46" y="90"  width="14" height="40" style="animation-delay:0s" />
    <rect class="d117f-topbar" x="66" y="98"  width="14" height="32" style="animation-delay:0s" />
    <rect class="d117f-topbar" x="86" y="108" width="14" height="22" style="animation-delay:0s" />
    <rect class="d117f-topbar" x="106" y="118" width="14" height="12" style="animation-delay:0s" />
  </g>

  <g transform="translate(300,110)">
    <text class="d117f-stagehdr" x="60" y="0" text-anchor="middle">n = 40</text>
    <line x1="0" y1="130" x2="120" y2="130" stroke="#1a202c" stroke-width="1.25" />
    <rect class="d117f-topbar" x="6"  y="120" width="14" height="10" style="animation-delay:1.2s" />
    <rect class="d117f-topbar" x="26" y="100" width="14" height="30" style="animation-delay:1.2s" />
    <rect class="d117f-topbar" x="46" y="76"  width="14" height="54" style="animation-delay:1.2s" />
    <rect class="d117f-topbar" x="66" y="80"  width="14" height="50" style="animation-delay:1.2s" />
    <rect class="d117f-topbar" x="86" y="104" width="14" height="26" style="animation-delay:1.2s" />
    <rect class="d117f-topbar" x="106" y="122" width="14" height="8"  style="animation-delay:1.2s" />
  </g>

  <g transform="translate(530,110)">
    <text class="d117f-stagehdr" x="60" y="0" text-anchor="middle">n = 160</text>
    <line x1="0" y1="130" x2="120" y2="130" stroke="#1a202c" stroke-width="1.25" />
    <rect class="d117f-topbar" x="6"  y="126" width="14" height="4"  style="animation-delay:2.4s" />
    <rect class="d117f-topbar" x="26" y="98"  width="14" height="32" style="animation-delay:2.4s" />
    <rect class="d117f-topbar" x="46" y="60"  width="14" height="70" style="animation-delay:2.4s" />
    <rect class="d117f-topbar" x="66" y="64"  width="14" height="66" style="animation-delay:2.4s" />
    <rect class="d117f-topbar" x="86" y="100" width="14" height="30" style="animation-delay:2.4s" />
    <rect class="d117f-topbar" x="106" y="127" width="14" height="3"  style="animation-delay:2.4s" />
  </g>

  <g transform="translate(760,110)">
    <text class="d117f-stagehdr" x="60" y="0" text-anchor="middle">n = 640</text>
    <line x1="0" y1="130" x2="120" y2="130" stroke="#1a202c" stroke-width="1.25" />
    <rect class="d117f-topbar" x="6"  y="129" width="14" height="1"  style="animation-delay:3.6s" />
    <rect class="d117f-topbar" x="26" y="90"  width="14" height="40" style="animation-delay:3.6s" />
    <rect class="d117f-topbar" x="46" y="36"  width="14" height="94" style="animation-delay:3.6s" />
    <rect class="d117f-topbar" x="66" y="40"  width="14" height="90" style="animation-delay:3.6s" />
    <rect class="d117f-topbar" x="86" y="92"  width="14" height="38" style="animation-delay:3.6s" />
    <rect class="d117f-topbar" x="106" y="129" width="14" height="1"  style="animation-delay:3.6s" />
  </g>

  <text class="d117f-small" x="44" y="252">skewness of this sampling distribution measured: 1.42, 0.89, 0.45, 0.11 -- falling toward zero, every time</text>

  <!-- BOTTOM PANEL: Cauchy, refusing to concentrate -->
  <rect class="d117f-panel" x="24" y="278" width="992" height="190" rx="10" />
  <text class="d117f-panelh" x="44" y="304">Standard Cauchy population (infinite variance) -- the sample mean never concentrates</text>

  <g transform="translate(70,316)">
    <text class="d117f-stagehdr" x="60" y="0" text-anchor="middle">n = 10</text>
    <line x1="0" y1="130" x2="120" y2="130" stroke="#1a202c" stroke-width="1.25" />
    <rect class="d117f-botbar" x="6"  y="70" width="14" height="60" style="animation-delay:0s" />
    <rect class="d117f-botbar" x="26" y="66" width="14" height="64" style="animation-delay:0s" />
    <rect class="d117f-botbar" x="46" y="60" width="14" height="70" style="animation-delay:0s" />
    <rect class="d117f-botbar" x="66" y="68" width="14" height="62" style="animation-delay:0s" />
    <rect class="d117f-botbar" x="86" y="72" width="14" height="58" style="animation-delay:0s" />
    <rect class="d117f-botbar" x="106" y="64" width="14" height="66" style="animation-delay:0s" />
  </g>

  <g transform="translate(300,316)">
    <text class="d117f-stagehdr" x="60" y="0" text-anchor="middle">n = 40</text>
    <line x1="0" y1="130" x2="120" y2="130" stroke="#1a202c" stroke-width="1.25" />
    <rect class="d117f-botbar" x="6"  y="68" width="14" height="62" style="animation-delay:1.2s" />
    <rect class="d117f-botbar" x="26" y="72" width="14" height="58" style="animation-delay:1.2s" />
    <rect class="d117f-botbar" x="46" y="58" width="14" height="72" style="animation-delay:1.2s" />
    <rect class="d117f-botbar" x="66" y="64" width="14" height="66" style="animation-delay:1.2s" />
    <rect class="d117f-botbar" x="86" y="70" width="14" height="60" style="animation-delay:1.2s" />
    <rect class="d117f-botbar" x="106" y="66" width="14" height="64" style="animation-delay:1.2s" />
  </g>

  <g transform="translate(530,316)">
    <text class="d117f-stagehdr" x="60" y="0" text-anchor="middle">n = 160</text>
    <line x1="0" y1="130" x2="120" y2="130" stroke="#1a202c" stroke-width="1.25" />
    <rect class="d117f-botbar" x="6"  y="66" width="14" height="64" style="animation-delay:2.4s" />
    <rect class="d117f-botbar" x="26" y="70" width="14" height="60" style="animation-delay:2.4s" />
    <rect class="d117f-botbar" x="46" y="60" width="14" height="70" style="animation-delay:2.4s" />
    <rect class="d117f-botbar" x="66" y="62" width="14" height="68" style="animation-delay:2.4s" />
    <rect class="d117f-botbar" x="86" y="68" width="14" height="62" style="animation-delay:2.4s" />
    <rect class="d117f-botbar" x="106" y="72" width="14" height="58" style="animation-delay:2.4s" />
  </g>

  <g transform="translate(760,316)">
    <text class="d117f-stagehdr" x="60" y="0" text-anchor="middle">n = 640</text>
    <line x1="0" y1="130" x2="120" y2="130" stroke="#1a202c" stroke-width="1.25" />
    <rect class="d117f-botbar" x="6"  y="64" width="14" height="66" style="animation-delay:3.6s" />
    <rect class="d117f-botbar" x="26" y="68" width="14" height="62" style="animation-delay:3.6s" />
    <rect class="d117f-botbar" x="46" y="58" width="14" height="72" style="animation-delay:3.6s" />
    <rect class="d117f-botbar" x="66" y="66" width="14" height="64" style="animation-delay:3.6s" />
    <rect class="d117f-botbar" x="86" y="70" width="14" height="60" style="animation-delay:3.6s" />
    <rect class="d117f-botbar" x="106" y="60" width="14" height="70" style="animation-delay:3.6s" />
  </g>

  <text class="d117f-small" x="44" y="458">IQR of this sampling distribution measured: 2.00, 1.98, 1.97, 1.96 -- flat across a 64x growth in n, not shrinking</text>
  <text class="d117f-label" x="44" y="490" font-weight="700">same n at every stage, same amount of data spent -- one population's estimate tightens, the other's does not move at all</text>
</svg>
