<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And running more often does not fix it.">
  <title>Freshness is not ingestion</title>
  <style>
    .freshness-not-ingestion-bg   { fill: #f8fafc; }
    .freshness-not-ingestion-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-not-ingestion-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-not-ingestion-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-not-ingestion-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-not-ingestion-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-not-ingestion-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .freshness-not-ingestion-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .freshness-not-ingestion-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .freshness-not-ingestion-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .freshness-not-ingestion-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .freshness-not-ingestion-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .freshness-not-ingestion-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .freshness-not-ingestion-row { opacity: 1; }
    .freshness-not-ingestion-r0 { animation-delay: 0.00s; }
    .freshness-not-ingestion-r1 { animation-delay: 0.45s; }
    .freshness-not-ingestion-r2 { animation-delay: 0.90s; }
    .freshness-not-ingestion-r3 { animation-delay: 1.35s; }
    .freshness-not-ingestion-r4 { animation-delay: 1.80s; }
    .freshness-not-ingestion-row { animation: freshness-not-ingestion-reveal 7.3s ease-in-out infinite; }
    @keyframes freshness-not-ingestion-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="freshness-not-ingestion-bg" width="980" height="390"/>
  <text class="freshness-not-ingestion-h1"  x="30" y="40">Freshness is not ingestion</text>
  <text class="freshness-not-ingestion-sub" x="30" y="64">And running more often does not fix it.</text>
  <rect class="freshness-not-ingestion-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="freshness-not-ingestion-name" x="46" y="122">What it is</text>
  <text class="freshness-not-ingestion-desc" x="46" y="142">Measurement and bounds.</text>
  <text class="freshness-not-ingestion-desc freshness-not-ingestion-row freshness-not-ingestion-r0" x="46" y="182">Comparative: read both sides</text>
  <text class="freshness-not-ingestion-desc freshness-not-ingestion-row freshness-not-ingestion-r1" x="46" y="216">A target, a measurement and an error budget</text>
  <text class="freshness-not-ingestion-desc freshness-not-ingestion-row freshness-not-ingestion-r2" x="46" y="250">Asymmetric — the four states differ in risk</text>
  <text class="freshness-not-ingestion-desc freshness-not-ingestion-row freshness-not-ingestion-r3" x="46" y="284">Reconciliation finds unknown divergence</text>
  <text class="freshness-not-ingestion-desc freshness-not-ingestion-row freshness-not-ingestion-r4" x="46" y="318">A percentile, not a yes or no</text>
  <rect class="freshness-not-ingestion-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="freshness-not-ingestion-name" x="526" y="122">Three misreadings</text>
  <text class="freshness-not-ingestion-desc" x="526" y="142">All common.</text>
  <text class="freshness-not-ingestion-desc freshness-not-ingestion-row freshness-not-ingestion-r0" x="526" y="182">"Ingestion handles it" — it applies known changes</text>
  <text class="freshness-not-ingestion-desc freshness-not-ingestion-row freshness-not-ingestion-r1" x="526" y="216">"Run the pipeline hourly" — a deletion bug produces orphans faster</text>
  <text class="freshness-not-ingestion-desc freshness-not-ingestion-row freshness-not-ingestion-r2" x="526" y="250">"Is the index fresh?" — no useful answer</text>
  <text class="freshness-not-ingestion-desc freshness-not-ingestion-row freshness-not-ingestion-r3" x="526" y="284">Over-investing in harmless categories</text>
  <text class="freshness-not-ingestion-desc freshness-not-ingestion-row freshness-not-ingestion-r4" x="526" y="318">Under-investing in orphans</text>
  <text class="freshness-not-ingestion-sub" x="30" y="372">The second misreading is the expensive one: increasing frequency multiplies the rate at which a defective pipeline produces the drift it is failing to correct.</text>
</svg>
