<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Layout has to run twice otherwise.">
  <title>Why images need declared dimensions</title>
  <style>
    .layout-shift-bg   { fill: #f8fafc; }
    .layout-shift-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .layout-shift-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .layout-shift-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .layout-shift-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .layout-shift-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .layout-shift-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .layout-shift-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .layout-shift-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .layout-shift-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .layout-shift-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .layout-shift-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .layout-shift-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .layout-shift-row { opacity: 1; }
    .layout-shift-r0 { animation-delay: 0.00s; }
    .layout-shift-r1 { animation-delay: 0.45s; }
    .layout-shift-r2 { animation-delay: 0.90s; }
    .layout-shift-r3 { animation-delay: 1.35s; }
    .layout-shift-r4 { animation-delay: 1.80s; }
    .layout-shift-row { animation: layout-shift-reveal 7.3s ease-in-out infinite; }
    @keyframes layout-shift-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="layout-shift-bg" width="980" height="390"/>
  <text class="layout-shift-h1"  x="30" y="40">Why images need declared dimensions</text>
  <text class="layout-shift-sub" x="30" y="64">Layout has to run twice otherwise.</text>
  <rect class="layout-shift-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="layout-shift-name" x="46" y="122">No dimensions</text>
  <text class="layout-shift-desc" x="46" y="142">The browser cannot know the size.</text>
  <text class="layout-shift-desc layout-shift-row layout-shift-r0" x="46" y="182">Layout runs with the image at zero height</text>
  <text class="layout-shift-desc layout-shift-row layout-shift-r1" x="46" y="216">The page paints</text>
  <text class="layout-shift-desc layout-shift-row layout-shift-r2" x="46" y="250">The image arrives, and its real size is known</text>
  <text class="layout-shift-desc layout-shift-row layout-shift-r3" x="46" y="284">Layout runs again; everything below moves</text>
  <text class="layout-shift-desc layout-shift-row layout-shift-r4" x="46" y="318">The user was reading, and the text jumped</text>
  <rect class="layout-shift-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="layout-shift-name" x="526" y="122">Width and height given</text>
  <text class="layout-shift-desc" x="526" y="142">The space is reserved.</text>
  <text class="layout-shift-desc layout-shift-row layout-shift-r0" x="526" y="182">Layout reserves the correct box immediately</text>
  <text class="layout-shift-desc layout-shift-row layout-shift-r1" x="526" y="216">The page paints, with a gap</text>
  <text class="layout-shift-desc layout-shift-row layout-shift-r2" x="526" y="250">The image arrives and fills its space</text>
  <text class="layout-shift-desc layout-shift-row layout-shift-r3" x="526" y="284">Nothing below moves</text>
  <text class="layout-shift-desc layout-shift-row layout-shift-r4" x="526" y="318">Nothing jumps under anyone's cursor</text>
  <text class="layout-shift-sub" x="30" y="372">This is the cheapest front-end fix there is: two attributes, no JavaScript, and it removes an entire category of the most irritating page behaviour.</text>
</svg>
