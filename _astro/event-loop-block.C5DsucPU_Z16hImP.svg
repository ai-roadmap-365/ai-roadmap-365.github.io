<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One thread, one task at a time, run to completion.">
  <title>Why the page freezes</title>
  <style>
    .event-loop-block-bg   { fill: #f8fafc; }
    .event-loop-block-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .event-loop-block-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .event-loop-block-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .event-loop-block-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .event-loop-block-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .event-loop-block-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .event-loop-block-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .event-loop-block-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .event-loop-block-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .event-loop-block-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .event-loop-block-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .event-loop-block-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .event-loop-block-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .event-loop-block-stage { opacity: 1; }

    .event-loop-block-s0 { animation-delay: 0.00s; }
    .event-loop-block-e0 { animation-delay: 0.00s; }
    .event-loop-block-s1 { animation-delay: 1.28s; }
    .event-loop-block-e1 { animation-delay: 1.28s; }
    .event-loop-block-s2 { animation-delay: 2.56s; }
    .event-loop-block-e2 { animation-delay: 2.56s; }
    .event-loop-block-s3 { animation-delay: 3.84s; }
    .event-loop-block-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .event-loop-block-conn  { animation: event-loop-block-trace 6.4s ease-in-out infinite; }
      .event-loop-block-stage { animation: event-loop-block-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes event-loop-block-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes event-loop-block-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .event-loop-block-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .event-loop-block-stage { animation: event-loop-block-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes event-loop-block-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="event-loop-block-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="event-loop-block-bg" width="980" height="322"/>
  <text class="event-loop-block-h1"  x="30" y="40">Why the page freezes</text>
  <text class="event-loop-block-sub" x="30" y="64">One thread, one task at a time, run to completion.</text>
  <g class="event-loop-block-stage event-loop-block-s0">
    <rect class="event-loop-block-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="event-loop-block-step" x="44" y="142">01</text>
    <text class="event-loop-block-name" x="70" y="142">Take the next task</text>
    <text class="event-loop-block-desc" x="44" y="166">A click handler, a timer, a</text>
    <text class="event-loop-block-desc" x="44" y="182">network response.</text>
  </g>
  <line class="event-loop-block-line event-loop-block-conn event-loop-block-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#event-loop-block-tip)"/>
  <g class="event-loop-block-stage event-loop-block-s1">
    <rect class="event-loop-block-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="event-loop-block-step" x="280" y="142">02</text>
    <text class="event-loop-block-name" x="306" y="142">Run it to completion</text>
    <text class="event-loop-block-desc" x="280" y="166">It cannot be interrupted. The</text>
    <text class="event-loop-block-desc" x="280" y="182">thread is committed.</text>
    <text class="event-loop-block-edge" x="280" y="242">no preemption</text>
  </g>
  <line class="event-loop-block-line event-loop-block-conn event-loop-block-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#event-loop-block-tip)"/>
  <g class="event-loop-block-stage event-loop-block-s2">
    <rect class="event-loop-block-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="event-loop-block-step" x="516" y="142">03</text>
    <text class="event-loop-block-name" x="542" y="142">Everything else queues</text>
    <text class="event-loop-block-desc" x="516" y="166">Clicks pile up unhandled. No</text>
    <text class="event-loop-block-desc" x="516" y="182">repaint happens. The page looks</text>
    <text class="event-loop-block-desc" x="516" y="198">frozen.</text>
    <text class="event-loop-block-edge" x="516" y="242">frozen</text>
  </g>
  <line class="event-loop-block-line event-loop-block-conn event-loop-block-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#event-loop-block-tip)"/>
  <g class="event-loop-block-stage event-loop-block-s3">
    <rect class="event-loop-block-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="event-loop-block-step" x="752" y="142">04</text>
    <text class="event-loop-block-name" x="778" y="142">Then the screen updates</text>
    <text class="event-loop-block-desc" x="752" y="166">All at once, when the thread is</text>
    <text class="event-loop-block-desc" x="752" y="182">finally free.</text>
  </g>
  <text class="event-loop-block-sub" x="30" y="304">Note the contrast with Day 7: the operating system preempts processes, but the browser's event loop does not preempt your JavaScript. It cannot; the DOM would be left half-modified.</text>
</svg>
