<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And the one thing to always build.">
  <title>When to invest in cost work</title>
  <style>
    .cost-when-bg   { fill: #f8fafc; }
    .cost-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cost-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cost-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cost-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cost-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cost-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cost-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cost-when-row { opacity: 1; }
    .cost-when-r0 { animation-delay: 0.00s; }
    .cost-when-r1 { animation-delay: 0.45s; }
    .cost-when-r2 { animation-delay: 0.90s; }
    .cost-when-r3 { animation-delay: 1.35s; }
    .cost-when-r4 { animation-delay: 1.80s; }
    .cost-when-row { animation: cost-when-reveal 7.3s ease-in-out infinite; }
    @keyframes cost-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cost-when-bg" width="980" height="390"/>
  <text class="cost-when-h1"  x="30" y="40">When to invest in cost work</text>
  <text class="cost-when-sub" x="30" y="64">And the one thing to always build.</text>
  <rect class="cost-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cost-when-name" x="46" y="122">Invest</text>
  <text class="cost-when-desc" x="46" y="142">Volume or exposure.</text>
  <text class="cost-when-desc cost-when-row cost-when-r0" x="46" y="182">The feature will see real volume</text>
  <text class="cost-when-desc cost-when-row cost-when-r1" x="46" y="216">Spend is externally triggered</text>
  <text class="cost-when-desc cost-when-row cost-when-r2" x="46" y="250">Anything a user can cause, an attacker can cause</text>
  <text class="cost-when-desc cost-when-row cost-when-r3" x="46" y="284">Choosing between models</text>
  <text class="cost-when-desc cost-when-row cost-when-r4" x="46" y="318">Choosing hosted against self-hosted</text>
  <rect class="cost-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cost-when-name" x="526" y="122">Always</text>
  <text class="cost-when-desc" x="526" y="142">Even in a prototype.</text>
  <text class="cost-when-desc cost-when-row cost-when-r0" x="526" y="182">Add the cap</text>
  <text class="cost-when-desc cost-when-row cost-when-r1" x="526" y="216">It is the cheapest lever to build</text>
  <text class="cost-when-desc cost-when-row cost-when-r2" x="526" y="250">And the only one that bounds the worst case</text>
  <text class="cost-when-desc cost-when-row cost-when-r3" x="526" y="284">A ledger is a dozen lines — keep it</text>
  <text class="cost-when-desc cost-when-row cost-when-r4" x="526" y="318">Prototypes become internet-accessible</text>
  <text class="cost-when-sub" x="30" y="372">The last row is not a hypothetical: the demo endpoint left running is a recurring source of surprising invoices, and the cap is what makes that a footnote rather than an incident.</text>
</svg>
