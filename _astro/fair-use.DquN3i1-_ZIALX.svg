<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Training and output.">
  <title>Two exposures, different remedies</title>
  <style>
    .fair-use-bg   { fill: #f8fafc; }
    .fair-use-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fair-use-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fair-use-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fair-use-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fair-use-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fair-use-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fair-use-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fair-use-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fair-use-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fair-use-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fair-use-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fair-use-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fair-use-row { opacity: 1; }
    .fair-use-r0 { animation-delay: 0.00s; }
    .fair-use-r1 { animation-delay: 0.45s; }
    .fair-use-r2 { animation-delay: 0.90s; }
    .fair-use-r3 { animation-delay: 1.35s; }
    .fair-use-r4 { animation-delay: 1.80s; }
    .fair-use-row { animation: fair-use-reveal 7.3s ease-in-out infinite; }
    @keyframes fair-use-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="fair-use-bg" width="980" height="390"/>
  <text class="fair-use-h1"  x="30" y="40">Two exposures, different remedies</text>
  <text class="fair-use-sub" x="30" y="64">Training and output.</text>
  <rect class="fair-use-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="fair-use-name" x="46" y="122">Training data</text>
  <text class="fair-use-desc" x="46" y="142">How the model was built.</text>
  <text class="fair-use-desc fair-use-row fair-use-r0" x="46" y="182">Whether training on the work was permitted</text>
  <text class="fair-use-desc fair-use-row fair-use-r1" x="46" y="216">Litigated actively, and unresolved</text>
  <text class="fair-use-desc fair-use-row fair-use-r2" x="46" y="250">Largely the model provider's exposure</text>
  <text class="fair-use-desc fair-use-row fair-use-r3" x="46" y="284">You inherit it by using the model</text>
  <text class="fair-use-desc fair-use-row fair-use-r4" x="46" y="318">Mitigated by indemnity terms</text>
  <rect class="fair-use-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="fair-use-name" x="526" y="122">Output similarity</text>
  <text class="fair-use-desc" x="526" y="142">What you publish.</text>
  <text class="fair-use-desc fair-use-row fair-use-r0" x="526" y="182">Whether an output reproduces a work</text>
  <text class="fair-use-desc fair-use-row fair-use-r1" x="526" y="216">Assessed per output</text>
  <text class="fair-use-desc fair-use-row fair-use-r2" x="526" y="250">Entirely your exposure</text>
  <text class="fair-use-desc fair-use-row fair-use-r3" x="526" y="284">Arises when you publish</text>
  <text class="fair-use-desc fair-use-row fair-use-r4" x="526" y="318">Mitigated by perceptual hash checks</text>
  <text class="fair-use-sub" x="30" y="372">The second column is the one you can actually control, which is why checking outputs against a reference set is the practical mitigation rather than waiting for the first to resolve.</text>
</svg>
