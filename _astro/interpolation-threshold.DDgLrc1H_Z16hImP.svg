<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The interpolation threshold</title>
  <style>
    .interpolation-threshold-bg   { fill: #f8fafc; }
    .interpolation-threshold-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interpolation-threshold-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interpolation-threshold-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interpolation-threshold-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interpolation-threshold-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interpolation-threshold-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .interpolation-threshold-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .interpolation-threshold-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .interpolation-threshold-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .interpolation-threshold-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .interpolation-threshold-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .interpolation-threshold-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .interpolation-threshold-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .interpolation-threshold-stage { opacity: 1; }

    .interpolation-threshold-s0 { animation-delay: 0.00s; }
    .interpolation-threshold-e0 { animation-delay: 0.00s; }
    .interpolation-threshold-s1 { animation-delay: 1.28s; }
    .interpolation-threshold-e1 { animation-delay: 1.28s; }
    .interpolation-threshold-s2 { animation-delay: 2.56s; }
    .interpolation-threshold-e2 { animation-delay: 2.56s; }
    .interpolation-threshold-s3 { animation-delay: 3.84s; }
    .interpolation-threshold-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .interpolation-threshold-conn  { animation: interpolation-threshold-trace 6.4s ease-in-out infinite; }
      .interpolation-threshold-stage { animation: interpolation-threshold-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes interpolation-threshold-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes interpolation-threshold-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .interpolation-threshold-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .interpolation-threshold-stage { animation: interpolation-threshold-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes interpolation-threshold-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="interpolation-threshold-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="interpolation-threshold-bg" width="980" height="322"/>
  <text class="interpolation-threshold-h1"  x="30" y="40">The interpolation threshold</text>
  <text class="interpolation-threshold-sub" x="30" y="64">Four steps.</text>
  <g class="interpolation-threshold-stage interpolation-threshold-s0">
    <rect class="interpolation-threshold-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="interpolation-threshold-step" x="44" y="142">01</text>
    <text class="interpolation-threshold-name" x="70" y="142">The classical curve says error rises past the optimum</text>
    <text class="interpolation-threshold-desc" x="44" y="166">Which it does, for a while.</text>
  </g>
  <line class="interpolation-threshold-line interpolation-threshold-conn interpolation-threshold-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#interpolation-threshold-tip)"/>
  <g class="interpolation-threshold-stage interpolation-threshold-s1">
    <rect class="interpolation-threshold-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="interpolation-threshold-step" x="280" y="142">02</text>
    <text class="interpolation-threshold-name" x="306" y="142">At the point where the model can fit every point exactly</text>
    <text class="interpolation-threshold-desc" x="280" y="166">Error spikes sharply.</text>
  </g>
  <line class="interpolation-threshold-line interpolation-threshold-conn interpolation-threshold-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#interpolation-threshold-tip)"/>
  <g class="interpolation-threshold-stage interpolation-threshold-s2">
    <rect class="interpolation-threshold-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="interpolation-threshold-step" x="516" y="142">03</text>
    <text class="interpolation-threshold-name" x="542" y="142">But past that point it can fall again</text>
    <text class="interpolation-threshold-desc" x="516" y="166">Which the classical picture does</text>
    <text class="interpolation-threshold-desc" x="516" y="182">not predict.</text>
  </g>
  <line class="interpolation-threshold-line interpolation-threshold-conn interpolation-threshold-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#interpolation-threshold-tip)"/>
  <g class="interpolation-threshold-stage interpolation-threshold-s3">
    <rect class="interpolation-threshold-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="interpolation-threshold-step" x="752" y="142">04</text>
    <text class="interpolation-threshold-name" x="778" y="142">Which is why very large models generalise at all</text>
    <text class="interpolation-threshold-desc" x="752" y="166">Despite having far more</text>
    <text class="interpolation-threshold-desc" x="752" y="182">parameters than data.</text>
  </g>
  <text class="interpolation-threshold-sub" x="30" y="304">This is the observation that reconciles classical statistics with the behaviour of very large models, and it was found by looking past where the theory said to stop.</text>
</svg>
