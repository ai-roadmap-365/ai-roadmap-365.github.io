<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The first removes the class entirely.">
  <title>Four controls, in order of leverage</title>
  <style>
    .supply-chain-controls-bg   { fill: #f8fafc; }
    .supply-chain-controls-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .supply-chain-controls-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .supply-chain-controls-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .supply-chain-controls-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .supply-chain-controls-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .supply-chain-controls-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .supply-chain-controls-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .supply-chain-controls-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .supply-chain-controls-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .supply-chain-controls-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .supply-chain-controls-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .supply-chain-controls-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .supply-chain-controls-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .supply-chain-controls-stage { opacity: 1; }

    .supply-chain-controls-s0 { animation-delay: 0.00s; }
    .supply-chain-controls-e0 { animation-delay: 0.00s; }
    .supply-chain-controls-s1 { animation-delay: 1.28s; }
    .supply-chain-controls-e1 { animation-delay: 1.28s; }
    .supply-chain-controls-s2 { animation-delay: 2.56s; }
    .supply-chain-controls-e2 { animation-delay: 2.56s; }
    .supply-chain-controls-s3 { animation-delay: 3.84s; }
    .supply-chain-controls-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .supply-chain-controls-conn  { animation: supply-chain-controls-trace 6.4s ease-in-out infinite; }
      .supply-chain-controls-stage { animation: supply-chain-controls-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes supply-chain-controls-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes supply-chain-controls-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .supply-chain-controls-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .supply-chain-controls-stage { animation: supply-chain-controls-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes supply-chain-controls-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="supply-chain-controls-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="supply-chain-controls-bg" width="980" height="322"/>
  <text class="supply-chain-controls-h1"  x="30" y="40">Four controls, in order of leverage</text>
  <text class="supply-chain-controls-sub" x="30" y="64">The first removes the class entirely.</text>
  <g class="supply-chain-controls-stage supply-chain-controls-s0">
    <rect class="supply-chain-controls-good" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="supply-chain-controls-step" x="44" y="142">01</text>
    <text class="supply-chain-controls-name" x="70" y="142">SafeTensors only</text>
    <text class="supply-chain-controls-desc" x="44" y="166">A JSON header and raw buffers.</text>
    <text class="supply-chain-controls-desc" x="44" y="182">Code execution is</text>
    <text class="supply-chain-controls-desc" x="44" y="198">architecturally impossible.</text>
    <text class="supply-chain-controls-edge" x="44" y="242">the class</text>
  </g>
  <line class="supply-chain-controls-line supply-chain-controls-conn supply-chain-controls-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#supply-chain-controls-tip)"/>
  <g class="supply-chain-controls-stage supply-chain-controls-s1">
    <rect class="supply-chain-controls-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="supply-chain-controls-step" x="280" y="142">02</text>
    <text class="supply-chain-controls-name" x="306" y="142">Static scan every artefact</text>
    <text class="supply-chain-controls-desc" x="280" y="166">AST opcode analysis before</text>
    <text class="supply-chain-controls-desc" x="280" y="182">anything enters CI. Under two</text>
    <text class="supply-chain-controls-desc" x="280" y="198">seconds on 14 GB.</text>
  </g>
  <line class="supply-chain-controls-line supply-chain-controls-conn supply-chain-controls-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#supply-chain-controls-tip)"/>
  <g class="supply-chain-controls-stage supply-chain-controls-s2">
    <rect class="supply-chain-controls-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="supply-chain-controls-step" x="516" y="142">03</text>
    <text class="supply-chain-controls-name" x="542" y="142">Sign weights and configs</text>
    <text class="supply-chain-controls-desc" x="516" y="166">Sigstore Cosign, so the bytes</text>
    <text class="supply-chain-controls-desc" x="516" y="182">you evaluated are the bytes that</text>
    <text class="supply-chain-controls-desc" x="516" y="198">run.</text>
  </g>
  <line class="supply-chain-controls-line supply-chain-controls-conn supply-chain-controls-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#supply-chain-controls-tip)"/>
  <g class="supply-chain-controls-stage supply-chain-controls-s3">
    <rect class="supply-chain-controls-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="supply-chain-controls-step" x="752" y="142">04</text>
    <text class="supply-chain-controls-name" x="778" y="142">Maintain an AIBOM</text>
    <text class="supply-chain-controls-desc" x="752" y="166">Model hashes, dataset lineage,</text>
    <text class="supply-chain-controls-desc" x="752" y="182">dependencies. A queryable</text>
    <text class="supply-chain-controls-desc" x="752" y="198">inventory.</text>
    <text class="supply-chain-controls-edge" x="752" y="242">audits</text>
  </g>
  <text class="supply-chain-controls-sub" x="30" y="304">The ordering matters: the first control removes an entire vulnerability class rather than detecting instances of it, which is why format migration outranks scanning even though scanning is easier to adopt.</text>
</svg>
