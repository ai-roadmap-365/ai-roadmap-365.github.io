<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By data volume and cost.">
  <title>Which strategy when</title>
  <style>
    .imbalance-when-bg   { fill: #f8fafc; }
    .imbalance-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .imbalance-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .imbalance-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .imbalance-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .imbalance-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .imbalance-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .imbalance-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .imbalance-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .imbalance-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .imbalance-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .imbalance-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .imbalance-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .imbalance-when-row { opacity: 1; }
    .imbalance-when-r0 { animation-delay: 0.00s; }
    .imbalance-when-r1 { animation-delay: 0.45s; }
    .imbalance-when-r2 { animation-delay: 0.90s; }
    .imbalance-when-r3 { animation-delay: 1.35s; }
    .imbalance-when-r4 { animation-delay: 1.80s; }
    .imbalance-when-row { animation: imbalance-when-reveal 7.3s ease-in-out infinite; }
    @keyframes imbalance-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="imbalance-when-bg" width="980" height="390"/>
  <text class="imbalance-when-h1"  x="30" y="40">Which strategy when</text>
  <text class="imbalance-when-sub" x="30" y="64">By data volume and cost.</text>
  <rect class="imbalance-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="imbalance-when-name" x="46" y="122">The situation</text>
  <text class="imbalance-when-desc" x="46" y="142">What you have.</text>
  <text class="imbalance-when-desc imbalance-when-row imbalance-when-r0" x="46" y="182">Moderate imbalance, enough data</text>
  <text class="imbalance-when-desc imbalance-when-row imbalance-when-r1" x="46" y="216">Severe imbalance, scarce minority data</text>
  <text class="imbalance-when-desc imbalance-when-row imbalance-when-r2" x="46" y="250">Very large dataset, mild imbalance</text>
  <text class="imbalance-when-desc imbalance-when-row imbalance-when-r3" x="46" y="284">Costs known in real units</text>
  <text class="imbalance-when-desc imbalance-when-row imbalance-when-r4" x="46" y="318">Extreme imbalance, one in ten thousand</text>
  <rect class="imbalance-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="imbalance-when-name" x="526" y="122">The strategy</text>
  <text class="imbalance-when-desc" x="526" y="142">What to do.</text>
  <text class="imbalance-when-desc imbalance-when-row imbalance-when-r0" x="526" y="182">Class weights — simplest and safest</text>
  <text class="imbalance-when-desc imbalance-when-row imbalance-when-r1" x="526" y="216">Weights, plus synthetic oversampling</text>
  <text class="imbalance-when-desc imbalance-when-row imbalance-when-r2" x="526" y="250">Undersample the majority</text>
  <text class="imbalance-when-desc imbalance-when-row imbalance-when-r3" x="526" y="284">Optimise expected cost directly</text>
  <text class="imbalance-when-desc imbalance-when-row imbalance-when-r4" x="526" y="318">Consider anomaly detection instead</text>
  <text class="imbalance-when-sub" x="30" y="372">The last row is the one people reach for too late: past a certain rarity the problem stops being classification and becomes outlier detection.</text>
</svg>
