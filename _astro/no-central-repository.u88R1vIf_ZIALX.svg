<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label=""origin" is a naming convention, not a special kind of repository.">
  <title>There is no technical centre</title>
  <style>
    .no-central-repository-bg   { fill: #f8fafc; }
    .no-central-repository-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .no-central-repository-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .no-central-repository-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .no-central-repository-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .no-central-repository-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .no-central-repository-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .no-central-repository-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .no-central-repository-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .no-central-repository-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .no-central-repository-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .no-central-repository-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .no-central-repository-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .no-central-repository-row { opacity: 1; }
    .no-central-repository-r0 { animation-delay: 0.00s; }
    .no-central-repository-r1 { animation-delay: 0.45s; }
    .no-central-repository-r2 { animation-delay: 0.90s; }
    .no-central-repository-r3 { animation-delay: 1.35s; }
    .no-central-repository-r4 { animation-delay: 1.80s; }
    .no-central-repository-row { animation: no-central-repository-reveal 7.3s ease-in-out infinite; }
    @keyframes no-central-repository-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="no-central-repository-bg" width="980" height="390"/>
  <text class="no-central-repository-h1"  x="30" y="40">There is no technical centre</text>
  <text class="no-central-repository-sub" x="30" y="64">"origin" is a naming convention, not a special kind of repository.</text>
  <rect class="no-central-repository-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="no-central-repository-name" x="46" y="122">Centralised</text>
  <text class="no-central-repository-desc" x="46" y="142">One repository, on a server.</text>
  <text class="no-central-repository-desc no-central-repository-row no-central-repository-r0" x="46" y="182">The server holds the history</text>
  <text class="no-central-repository-desc no-central-repository-row no-central-repository-r1" x="46" y="216">Everyone else has a working copy</text>
  <text class="no-central-repository-desc no-central-repository-row no-central-repository-r2" x="46" y="250">No commits without the network</text>
  <text class="no-central-repository-desc no-central-repository-row no-central-repository-r3" x="46" y="284">The server down means work stops</text>
  <text class="no-central-repository-desc no-central-repository-row no-central-repository-r4" x="46" y="318">Authority is technical</text>
  <rect class="no-central-repository-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="no-central-repository-name" x="526" y="122">Distributed</text>
  <text class="no-central-repository-desc" x="526" y="142">Every clone is complete.</text>
  <text class="no-central-repository-desc no-central-repository-row no-central-repository-r0" x="526" y="182">Every clone holds all the history</text>
  <text class="no-central-repository-desc no-central-repository-row no-central-repository-r1" x="526" y="216">Commit, branch, diff — all offline</text>
  <text class="no-central-repository-desc no-central-repository-row no-central-repository-r2" x="526" y="250">No repository is technically special</text>
  <text class="no-central-repository-desc no-central-repository-row no-central-repository-r3" x="526" y="284">origin is just a default name</text>
  <text class="no-central-repository-desc no-central-repository-row no-central-repository-r4" x="526" y="318">Authority is a social agreement</text>
  <text class="no-central-repository-sub" x="30" y="372">Which is why the hosting platform matters: access control, review and issues are things Git deliberately does not do, and someone has to.</text>
</svg>
