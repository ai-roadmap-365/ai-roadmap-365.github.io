<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="It looks wasteful until you see the consequence.">
  <title>What statelessness actually buys</title>
  <style>
    .stateless-scaling-bg   { fill: #f8fafc; }
    .stateless-scaling-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stateless-scaling-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stateless-scaling-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stateless-scaling-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stateless-scaling-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stateless-scaling-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stateless-scaling-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stateless-scaling-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stateless-scaling-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stateless-scaling-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stateless-scaling-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stateless-scaling-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .stateless-scaling-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .stateless-scaling-stage { opacity: 1; }

    .stateless-scaling-s0 { animation-delay: 0.00s; }
    .stateless-scaling-e0 { animation-delay: 0.00s; }
    .stateless-scaling-s1 { animation-delay: 1.28s; }
    .stateless-scaling-e1 { animation-delay: 1.28s; }
    .stateless-scaling-s2 { animation-delay: 2.56s; }
    .stateless-scaling-e2 { animation-delay: 2.56s; }
    .stateless-scaling-s3 { animation-delay: 3.84s; }
    .stateless-scaling-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .stateless-scaling-conn  { animation: stateless-scaling-trace 6.4s ease-in-out infinite; }
      .stateless-scaling-stage { animation: stateless-scaling-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes stateless-scaling-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes stateless-scaling-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .stateless-scaling-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .stateless-scaling-stage { animation: stateless-scaling-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes stateless-scaling-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="stateless-scaling-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="stateless-scaling-bg" width="980" height="322"/>
  <text class="stateless-scaling-h1"  x="30" y="40">What statelessness actually buys</text>
  <text class="stateless-scaling-sub" x="30" y="64">It looks wasteful until you see the consequence.</text>
  <g class="stateless-scaling-stage stateless-scaling-s0">
    <rect class="stateless-scaling-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="stateless-scaling-step" x="44" y="142">01</text>
    <text class="stateless-scaling-name" x="70" y="142">Every request carries everything</text>
    <text class="stateless-scaling-desc" x="44" y="166">Including the credential. There</text>
    <text class="stateless-scaling-desc" x="44" y="182">is no session on the server to</text>
    <text class="stateless-scaling-desc" x="44" y="198">ride on.</text>
    <text class="stateless-scaling-edge" x="44" y="242">self-contained</text>
  </g>
  <line class="stateless-scaling-line stateless-scaling-conn stateless-scaling-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#stateless-scaling-tip)"/>
  <g class="stateless-scaling-stage stateless-scaling-s1">
    <rect class="stateless-scaling-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="stateless-scaling-step" x="280" y="142">02</text>
    <text class="stateless-scaling-name" x="306" y="142">So any server can answer</text>
    <text class="stateless-scaling-desc" x="280" y="166">No request depends on a previous</text>
    <text class="stateless-scaling-desc" x="280" y="182">one having landed anywhere in</text>
    <text class="stateless-scaling-desc" x="280" y="198">particular.</text>
  </g>
  <line class="stateless-scaling-line stateless-scaling-conn stateless-scaling-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#stateless-scaling-tip)"/>
  <g class="stateless-scaling-stage stateless-scaling-s2">
    <rect class="stateless-scaling-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="stateless-scaling-step" x="516" y="142">03</text>
    <text class="stateless-scaling-name" x="542" y="142">So you can run a thousand</text>
    <text class="stateless-scaling-desc" x="516" y="166">Behind a load balancer, added</text>
    <text class="stateless-scaling-desc" x="516" y="182">and removed as traffic changes.</text>
    <text class="stateless-scaling-edge" x="516" y="242">elastic</text>
  </g>
  <line class="stateless-scaling-line stateless-scaling-conn stateless-scaling-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#stateless-scaling-tip)"/>
  <g class="stateless-scaling-stage stateless-scaling-s3">
    <rect class="stateless-scaling-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="stateless-scaling-step" x="752" y="142">04</text>
    <text class="stateless-scaling-name" x="778" y="142">And restart any of them</text>
    <text class="stateless-scaling-desc" x="752" y="166">Mid-conversation. No client</text>
    <text class="stateless-scaling-desc" x="752" y="182">notices.</text>
    <text class="stateless-scaling-edge" x="752" y="242">no coordination</text>
  </g>
  <text class="stateless-scaling-sub" x="30" y="304">This is the property that turns "one server" into "as many as we need", and it is the main reason REST scales the way it does.</text>
</svg>
