<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Security included.">
  <title>Four consequences of prompt design</title>
  <style>
    .prompt-implications-bg   { fill: #f8fafc; }
    .prompt-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prompt-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .prompt-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .prompt-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .prompt-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .prompt-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .prompt-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .prompt-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .prompt-implications-stage { opacity: 1; }

    .prompt-implications-s0 { animation-delay: 0.00s; }
    .prompt-implications-e0 { animation-delay: 0.00s; }
    .prompt-implications-s1 { animation-delay: 1.28s; }
    .prompt-implications-e1 { animation-delay: 1.28s; }
    .prompt-implications-s2 { animation-delay: 2.56s; }
    .prompt-implications-e2 { animation-delay: 2.56s; }
    .prompt-implications-s3 { animation-delay: 3.84s; }
    .prompt-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .prompt-implications-conn  { animation: prompt-implications-trace 6.4s ease-in-out infinite; }
      .prompt-implications-stage { animation: prompt-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes prompt-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes prompt-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .prompt-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .prompt-implications-stage { animation: prompt-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes prompt-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="prompt-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="prompt-implications-bg" width="980" height="322"/>
  <text class="prompt-implications-h1"  x="30" y="40">Four consequences of prompt design</text>
  <text class="prompt-implications-sub" x="30" y="64">Security included.</text>
  <g class="prompt-implications-stage prompt-implications-s0">
    <rect class="prompt-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-implications-step" x="44" y="142">01</text>
    <text class="prompt-implications-name" x="70" y="142">Every token in the prompt is billed</text>
    <text class="prompt-implications-desc" x="44" y="166">On every request, forever.</text>
  </g>
  <line class="prompt-implications-line prompt-implications-conn prompt-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#prompt-implications-tip)"/>
  <g class="prompt-implications-stage prompt-implications-s1">
    <rect class="prompt-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-implications-step" x="280" y="142">02</text>
    <text class="prompt-implications-name" x="306" y="142">And user input in the prompt is an attack surface</text>
    <text class="prompt-implications-desc" x="280" y="166">Which delimiters reduce and do</text>
    <text class="prompt-implications-desc" x="280" y="182">not close.</text>
  </g>
  <line class="prompt-implications-line prompt-implications-conn prompt-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#prompt-implications-tip)"/>
  <g class="prompt-implications-stage prompt-implications-s2">
    <rect class="prompt-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-implications-step" x="516" y="142">03</text>
    <text class="prompt-implications-name" x="542" y="142">Prompts do not port cleanly between models</text>
    <text class="prompt-implications-desc" x="516" y="166">So expect to re-tune and</text>
    <text class="prompt-implications-desc" x="516" y="182">re-evaluate.</text>
  </g>
  <line class="prompt-implications-line prompt-implications-conn prompt-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#prompt-implications-tip)"/>
  <g class="prompt-implications-stage prompt-implications-s3">
    <rect class="prompt-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-implications-step" x="752" y="142">04</text>
    <text class="prompt-implications-name" x="778" y="142">And they drift out of date</text>
    <text class="prompt-implications-desc" x="752" y="166">As the product changes around</text>
    <text class="prompt-implications-desc" x="752" y="182">them.</text>
  </g>
  <text class="prompt-implications-sub" x="30" y="304">Non-portability is worth planning for: a prompt tuned carefully against one model is a sunk cost when the model is replaced, which is an argument for keeping them simple.</text>
</svg>
