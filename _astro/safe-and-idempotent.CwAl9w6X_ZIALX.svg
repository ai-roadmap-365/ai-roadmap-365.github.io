<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Confusing them is how retries create duplicate charges.">
  <title>Safe and idempotent are different promises</title>
  <style>
    .safe-and-idempotent-bg   { fill: #f8fafc; }
    .safe-and-idempotent-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safe-and-idempotent-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safe-and-idempotent-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safe-and-idempotent-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safe-and-idempotent-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safe-and-idempotent-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .safe-and-idempotent-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .safe-and-idempotent-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .safe-and-idempotent-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .safe-and-idempotent-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .safe-and-idempotent-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .safe-and-idempotent-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .safe-and-idempotent-row { opacity: 1; }
    .safe-and-idempotent-r0 { animation-delay: 0.00s; }
    .safe-and-idempotent-r1 { animation-delay: 0.45s; }
    .safe-and-idempotent-r2 { animation-delay: 0.90s; }
    .safe-and-idempotent-r3 { animation-delay: 1.35s; }
    .safe-and-idempotent-r4 { animation-delay: 1.80s; }
    .safe-and-idempotent-row { animation: safe-and-idempotent-reveal 7.3s ease-in-out infinite; }
    @keyframes safe-and-idempotent-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="safe-and-idempotent-bg" width="980" height="390"/>
  <text class="safe-and-idempotent-h1"  x="30" y="40">Safe and idempotent are different promises</text>
  <text class="safe-and-idempotent-sub" x="30" y="64">Confusing them is how retries create duplicate charges.</text>
  <rect class="safe-and-idempotent-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="safe-and-idempotent-name" x="46" y="122">Safe</text>
  <text class="safe-and-idempotent-desc" x="46" y="142">Changes nothing on the server.</text>
  <text class="safe-and-idempotent-desc safe-and-idempotent-row safe-and-idempotent-r0" x="46" y="182">GET is safe. Nothing else is.</text>
  <text class="safe-and-idempotent-desc safe-and-idempotent-row safe-and-idempotent-r1" x="46" y="216">Caches may store and replay it</text>
  <text class="safe-and-idempotent-desc safe-and-idempotent-row safe-and-idempotent-r2" x="46" y="250">Crawlers and prefetchers will trigger it</text>
  <text class="safe-and-idempotent-desc safe-and-idempotent-row safe-and-idempotent-r3" x="46" y="284">A GET that deletes something WILL be triggered</text>
  <text class="safe-and-idempotent-desc safe-and-idempotent-row safe-and-idempotent-r4" x="46" y="318">Safe implies idempotent</text>
  <rect class="safe-and-idempotent-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="safe-and-idempotent-name" x="526" y="122">Idempotent</text>
  <text class="safe-and-idempotent-desc" x="526" y="142">Twice is the same as once.</text>
  <text class="safe-and-idempotent-desc safe-and-idempotent-row safe-and-idempotent-r0" x="526" y="182">GET, PUT and DELETE are idempotent</text>
  <text class="safe-and-idempotent-desc safe-and-idempotent-row safe-and-idempotent-r1" x="526" y="216">Deleting an already-deleted item leaves it deleted</text>
  <text class="safe-and-idempotent-desc safe-and-idempotent-row safe-and-idempotent-r2" x="526" y="250">Replacing with the same content twice changes nothing</text>
  <text class="safe-and-idempotent-desc safe-and-idempotent-row safe-and-idempotent-r3" x="526" y="284">POST and PATCH are NOT</text>
  <text class="safe-and-idempotent-desc safe-and-idempotent-row safe-and-idempotent-r4" x="526" y="318">Idempotent does not imply safe</text>
  <text class="safe-and-idempotent-sub" x="30" y="372">This is the property that decides whether a retry is free or expensive. Every call to a hosted model is a POST, so it is never free.</text>
</svg>
