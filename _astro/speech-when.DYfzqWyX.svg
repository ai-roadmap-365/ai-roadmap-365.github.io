<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to use speech models</title>
  <style>
    .speech-when-bg   { fill: #f8fafc; }
    .speech-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speech-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speech-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speech-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speech-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speech-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .speech-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .speech-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .speech-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .speech-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .speech-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .speech-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .speech-when-row { opacity: 1; }
    .speech-when-r0 { animation-delay: 0.00s; }
    .speech-when-r1 { animation-delay: 0.45s; }
    .speech-when-r2 { animation-delay: 0.90s; }
    .speech-when-r3 { animation-delay: 1.35s; }
    .speech-when-r4 { animation-delay: 1.80s; }
    .speech-when-row { animation: speech-when-reveal 7.3s ease-in-out infinite; }
    @keyframes speech-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="speech-when-bg" width="980" height="390"/>
  <text class="speech-when-h1"  x="30" y="40">When to use speech models</text>
  <text class="speech-when-sub" x="30" y="64">And when not to.</text>
  <rect class="speech-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="speech-when-name" x="46" y="122">Use them</text>
  <text class="speech-when-desc" x="46" y="142">Four cases.</text>
  <text class="speech-when-desc speech-when-row speech-when-r0" x="46" y="182">Captioning and accessibility</text>
  <text class="speech-when-desc speech-when-row speech-when-r1" x="46" y="216">Dictation and note-taking</text>
  <text class="speech-when-desc speech-when-row speech-when-r2" x="46" y="250">Hands-free interfaces</text>
  <text class="speech-when-desc speech-when-row speech-when-r3" x="46" y="284">Searching audio archives</text>
  <text class="speech-when-desc speech-when-row speech-when-r4" x="46" y="318">Where errors are correctable</text>
  <rect class="speech-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="speech-when-name" x="526" y="122">Be careful</text>
  <text class="speech-when-desc" x="526" y="142">Also four.</text>
  <text class="speech-when-desc speech-when-row speech-when-r0" x="526" y="182">Legal or medical records without review</text>
  <text class="speech-when-desc speech-when-row speech-when-r1" x="526" y="216">Voice as an authentication factor</text>
  <text class="speech-when-desc speech-when-row speech-when-r2" x="526" y="250">Cloning a voice without consent</text>
  <text class="speech-when-desc speech-when-row speech-when-r3" x="526" y="284">Recording where bystanders are present</text>
  <text class="speech-when-desc speech-when-row speech-when-r4" x="526" y="318">Where an error carries real cost</text>
  <text class="speech-when-sub" x="30" y="372">Voice as an authentication factor is the one to rule out outright: cloning has made it about as strong as a password that the owner says aloud in public.</text>
</svg>
