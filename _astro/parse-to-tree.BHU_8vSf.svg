<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Structure, rather than guessing with text search.">
  <title>Why both tools start by parsing</title>
  <style>
    .parse-to-tree-bg   { fill: #f8fafc; }
    .parse-to-tree-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parse-to-tree-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parse-to-tree-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parse-to-tree-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parse-to-tree-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parse-to-tree-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .parse-to-tree-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .parse-to-tree-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .parse-to-tree-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .parse-to-tree-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .parse-to-tree-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .parse-to-tree-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .parse-to-tree-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .parse-to-tree-stage { opacity: 1; }

    .parse-to-tree-s0 { animation-delay: 0.00s; }
    .parse-to-tree-e0 { animation-delay: 0.00s; }
    .parse-to-tree-s1 { animation-delay: 1.28s; }
    .parse-to-tree-e1 { animation-delay: 1.28s; }
    .parse-to-tree-s2 { animation-delay: 2.56s; }
    .parse-to-tree-e2 { animation-delay: 2.56s; }
    .parse-to-tree-s3 { animation-delay: 3.84s; }
    .parse-to-tree-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .parse-to-tree-conn  { animation: parse-to-tree-trace 6.4s ease-in-out infinite; }
      .parse-to-tree-stage { animation: parse-to-tree-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes parse-to-tree-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes parse-to-tree-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .parse-to-tree-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .parse-to-tree-stage { animation: parse-to-tree-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes parse-to-tree-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="parse-to-tree-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="parse-to-tree-bg" width="980" height="322"/>
  <text class="parse-to-tree-h1"  x="30" y="40">Why both tools start by parsing</text>
  <text class="parse-to-tree-sub" x="30" y="64">Structure, rather than guessing with text search.</text>
  <g class="parse-to-tree-stage parse-to-tree-s0">
    <rect class="parse-to-tree-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="parse-to-tree-step" x="44" y="142">01</text>
    <text class="parse-to-tree-name" x="70" y="142">Raw characters</text>
    <text class="parse-to-tree-desc" x="44" y="166">A wall of text. Text search</text>
    <text class="parse-to-tree-desc" x="44" y="182">cannot tell a comment from code.</text>
  </g>
  <line class="parse-to-tree-line parse-to-tree-conn parse-to-tree-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#parse-to-tree-tip)"/>
  <g class="parse-to-tree-stage parse-to-tree-s1">
    <rect class="parse-to-tree-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="parse-to-tree-step" x="280" y="142">02</text>
    <text class="parse-to-tree-name" x="306" y="142">Parsed into a tree</text>
    <text class="parse-to-tree-desc" x="280" y="166">This is a function; this is its</text>
    <text class="parse-to-tree-desc" x="280" y="182">body; this condition is a</text>
    <text class="parse-to-tree-desc" x="280" y="198">comparison.</text>
    <text class="parse-to-tree-edge" x="280" y="242">structure</text>
  </g>
  <line class="parse-to-tree-line parse-to-tree-conn parse-to-tree-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#parse-to-tree-tip)"/>
  <g class="parse-to-tree-stage parse-to-tree-s2">
    <rect class="parse-to-tree-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="parse-to-tree-step" x="516" y="142">03</text>
    <text class="parse-to-tree-name" x="542" y="142">The formatter reprints it</text>
    <text class="parse-to-tree-desc" x="516" y="166">Layout regenerated from meaning,</text>
    <text class="parse-to-tree-desc" x="516" y="182">so the input's mess is</text>
    <text class="parse-to-tree-desc" x="516" y="198">irrelevant.</text>
    <text class="parse-to-tree-edge" x="516" y="242">deterministic</text>
  </g>
  <line class="parse-to-tree-line parse-to-tree-conn parse-to-tree-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#parse-to-tree-tip)"/>
  <g class="parse-to-tree-stage parse-to-tree-s3">
    <rect class="parse-to-tree-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="parse-to-tree-step" x="752" y="142">04</text>
    <text class="parse-to-tree-name" x="778" y="142">The linter walks it</text>
    <text class="parse-to-tree-desc" x="752" y="166">"Find every declaration, check</text>
    <text class="parse-to-tree-desc" x="752" y="182">whether anything later reads</text>
    <text class="parse-to-tree-desc" x="752" y="198">it."</text>
    <text class="parse-to-tree-edge" x="752" y="242">rules</text>
  </g>
  <text class="parse-to-tree-sub" x="30" y="304">This is why running a formatter twice changes nothing the second time: it is not editing your layout, it is discarding it and printing the tree afresh.</text>
</svg>
