<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The diamond problem</title>
  <style>
    .diamond-bg   { fill: #f8fafc; }
    .diamond-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diamond-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diamond-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diamond-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diamond-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diamond-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .diamond-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .diamond-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .diamond-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .diamond-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .diamond-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .diamond-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .diamond-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .diamond-stage { opacity: 1; }

    .diamond-s0 { animation-delay: 0.00s; }
    .diamond-e0 { animation-delay: 0.00s; }
    .diamond-s1 { animation-delay: 1.28s; }
    .diamond-e1 { animation-delay: 1.28s; }
    .diamond-s2 { animation-delay: 2.56s; }
    .diamond-e2 { animation-delay: 2.56s; }
    .diamond-s3 { animation-delay: 3.84s; }
    .diamond-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .diamond-conn  { animation: diamond-trace 6.4s ease-in-out infinite; }
      .diamond-stage { animation: diamond-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes diamond-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes diamond-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .diamond-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .diamond-stage { animation: diamond-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes diamond-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="diamond-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="diamond-bg" width="980" height="322"/>
  <text class="diamond-h1"  x="30" y="40">The diamond problem</text>
  <text class="diamond-sub" x="30" y="64">Four steps.</text>
  <g class="diamond-stage diamond-s0">
    <rect class="diamond-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="diamond-step" x="44" y="142">01</text>
    <text class="diamond-name" x="70" y="142">Two parents that share a grandparent</text>
    <text class="diamond-desc" x="44" y="166">Which is the diamond.</text>
  </g>
  <line class="diamond-line diamond-conn diamond-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#diamond-tip)"/>
  <g class="diamond-stage diamond-s1">
    <rect class="diamond-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="diamond-step" x="280" y="142">02</text>
    <text class="diamond-name" x="306" y="142">So which parent's method wins is ambiguous</text>
    <text class="diamond-desc" x="280" y="166">Without a rule.</text>
  </g>
  <line class="diamond-line diamond-conn diamond-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#diamond-tip)"/>
  <g class="diamond-stage diamond-s2">
    <rect class="diamond-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="diamond-step" x="516" y="142">03</text>
    <text class="diamond-name" x="542" y="142">A linearisation orders every class consistently</text>
    <text class="diamond-desc" x="516" y="166">Each appearing before its own</text>
    <text class="diamond-desc" x="516" y="182">parents.</text>
  </g>
  <line class="diamond-line diamond-conn diamond-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#diamond-tip)"/>
  <g class="diamond-stage diamond-s3">
    <rect class="diamond-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="diamond-step" x="752" y="142">04</text>
    <text class="diamond-name" x="778" y="142">And delegating upward follows that order</text>
    <text class="diamond-desc" x="752" y="166">So every class in the chain runs</text>
    <text class="diamond-desc" x="752" y="182">once.</text>
  </g>
  <text class="diamond-sub" x="30" y="304">Delegating upward walking the linearisation rather than jumping to a named parent is what makes cooperative multiple inheritance work at all.</text>
</svg>
