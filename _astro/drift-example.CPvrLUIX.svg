<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Counts, then ages, then the guard.">
  <title>Reading a drift report</title>
  <style>
    .drift-example-bg   { fill: #f8fafc; }
    .drift-example-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drift-example-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drift-example-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drift-example-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drift-example-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drift-example-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .drift-example-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .drift-example-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .drift-example-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .drift-example-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .drift-example-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .drift-example-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .drift-example-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .drift-example-stage { opacity: 1; }

    .drift-example-s0 { animation-delay: 0.00s; }
    .drift-example-e0 { animation-delay: 0.00s; }
    .drift-example-s1 { animation-delay: 1.28s; }
    .drift-example-e1 { animation-delay: 1.28s; }
    .drift-example-s2 { animation-delay: 2.56s; }
    .drift-example-e2 { animation-delay: 2.56s; }
    .drift-example-s3 { animation-delay: 3.84s; }
    .drift-example-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .drift-example-conn  { animation: drift-example-trace 6.4s ease-in-out infinite; }
      .drift-example-stage { animation: drift-example-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes drift-example-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes drift-example-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .drift-example-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .drift-example-stage { animation: drift-example-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes drift-example-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="drift-example-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="drift-example-bg" width="980" height="322"/>
  <text class="drift-example-h1"  x="30" y="40">Reading a drift report</text>
  <text class="drift-example-sub" x="30" y="64">Counts, then ages, then the guard.</text>
  <g class="drift-example-stage drift-example-s0">
    <rect class="drift-example-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="drift-example-step" x="44" y="142">01</text>
    <text class="drift-example-name" x="70" y="142">Five documents, four categories</text>
    <text class="drift-example-desc" x="44" y="166">Classified over the union of</text>
    <text class="drift-example-desc" x="44" y="182">both id sets.</text>
  </g>
  <line class="drift-example-line drift-example-conn drift-example-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#drift-example-tip)"/>
  <g class="drift-example-stage drift-example-s1">
    <rect class="drift-example-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="drift-example-step" x="280" y="142">02</text>
    <text class="drift-example-name" x="306" y="142">One is not at the source at all</text>
    <text class="drift-example-desc" x="280" y="166">The orphan. Invisible to any</text>
    <text class="drift-example-desc" x="280" y="182">source-driven check.</text>
  </g>
  <line class="drift-example-line drift-example-conn drift-example-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#drift-example-tip)"/>
  <g class="drift-example-stage drift-example-s2">
    <rect class="drift-example-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="drift-example-step" x="516" y="142">03</text>
    <text class="drift-example-name" x="542" y="142">Two stale, one five times longer</text>
    <text class="drift-example-desc" x="516" y="166">The count says "two". The ages</text>
    <text class="drift-example-desc" x="516" y="182">say which one matters.</text>
    <text class="drift-example-edge" x="516" y="242">ages</text>
  </g>
  <line class="drift-example-line drift-example-conn drift-example-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#drift-example-tip)"/>
  <g class="drift-example-stage drift-example-s3">
    <rect class="drift-example-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="drift-example-step" x="752" y="142">04</text>
    <text class="drift-example-name" x="778" y="142">One orphan in four is 25%</text>
    <text class="drift-example-desc" x="752" y="166">At the guard threshold, and</text>
    <text class="drift-example-desc" x="752" y="182">permitted. All four would have</text>
    <text class="drift-example-desc" x="752" y="198">been refused.</text>
  </g>
  <text class="drift-example-sub" x="30" y="304">The last stage is the guard working as intended: a plausible fraction proceeds, and a fraction that could only be produced by a broken enumeration stops the run instead.</text>
</svg>
