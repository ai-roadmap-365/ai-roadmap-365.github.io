<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Both feel like they should be.">
  <title>Two things that are not defences</title>
  <style>
    .not-an-admonition-bg   { fill: #f8fafc; }
    .not-an-admonition-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-an-admonition-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-an-admonition-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-an-admonition-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-an-admonition-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-an-admonition-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-an-admonition-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .not-an-admonition-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .not-an-admonition-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .not-an-admonition-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .not-an-admonition-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .not-an-admonition-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-an-admonition-row { opacity: 1; }
    .not-an-admonition-r0 { animation-delay: 0.00s; }
    .not-an-admonition-r1 { animation-delay: 0.45s; }
    .not-an-admonition-r2 { animation-delay: 0.90s; }
    .not-an-admonition-r3 { animation-delay: 1.35s; }
    .not-an-admonition-r4 { animation-delay: 1.80s; }
    .not-an-admonition-row { animation: not-an-admonition-reveal 7.3s ease-in-out infinite; }
    @keyframes not-an-admonition-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="not-an-admonition-bg" width="980" height="390"/>
  <text class="not-an-admonition-h1"  x="30" y="40">Two things that are not defences</text>
  <text class="not-an-admonition-sub" x="30" y="64">Both feel like they should be.</text>
  <rect class="not-an-admonition-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="not-an-admonition-name" x="46" y="122">Structural defence</text>
  <text class="not-an-admonition-desc" x="46" y="142">Four mechanisms.</text>
  <text class="not-an-admonition-desc not-an-admonition-row not-an-admonition-r0" x="46" y="182">Syntax isolation with escaped delimiters</text>
  <text class="not-an-admonition-desc not-an-admonition-row not-an-admonition-r1" x="46" y="216">Tool-less quarantine for external content</text>
  <text class="not-an-admonition-desc not-an-admonition-row not-an-admonition-r2" x="46" y="250">Canary tokens detecting exfiltration</text>
  <text class="not-an-admonition-desc not-an-admonition-row not-an-admonition-r3" x="46" y="284">Parameterised tools with strict schemas</text>
  <text class="not-an-admonition-desc not-an-admonition-row not-an-admonition-r4" x="46" y="318">Read-only connections where possible</text>
  <rect class="not-an-admonition-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="not-an-admonition-name" x="526" y="122">Not defences</text>
  <text class="not-an-admonition-desc" x="526" y="142">Two, both popular.</text>
  <text class="not-an-admonition-desc not-an-admonition-row not-an-admonition-r0" x="526" y="182">"Never reveal your instructions"</text>
  <text class="not-an-admonition-desc not-an-admonition-row not-an-admonition-r1" x="526" y="216">A request in the same channel as the attack</text>
  <text class="not-an-admonition-desc not-an-admonition-row not-an-admonition-r2" x="526" y="250">"One regex to stop jailbreaks"</text>
  <text class="not-an-admonition-desc not-an-admonition-row not-an-admonition-r3" x="526" y="284">Anticipates phrasings, and there are infinite</text>
  <text class="not-an-admonition-desc not-an-admonition-row not-an-admonition-r4" x="526" y="318">Both fail silently</text>
  <text class="not-an-admonition-sub" x="30" y="372">"Fails silently" is what makes these worse than nothing: an ineffective control that reports no problem is indistinguishable from an effective one until somebody publishes your system prompt.</text>
</svg>
