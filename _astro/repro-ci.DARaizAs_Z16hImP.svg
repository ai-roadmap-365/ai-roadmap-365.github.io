<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Treating a model like a build.">
  <title>Continuous verification</title>
  <style>
    .repro-ci-bg   { fill: #f8fafc; }
    .repro-ci-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-ci-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-ci-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-ci-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-ci-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-ci-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .repro-ci-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .repro-ci-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .repro-ci-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .repro-ci-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .repro-ci-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .repro-ci-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .repro-ci-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .repro-ci-stage { opacity: 1; }

    .repro-ci-s0 { animation-delay: 0.00s; }
    .repro-ci-e0 { animation-delay: 0.00s; }
    .repro-ci-s1 { animation-delay: 1.28s; }
    .repro-ci-e1 { animation-delay: 1.28s; }
    .repro-ci-s2 { animation-delay: 2.56s; }
    .repro-ci-e2 { animation-delay: 2.56s; }
    .repro-ci-s3 { animation-delay: 3.84s; }
    .repro-ci-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .repro-ci-conn  { animation: repro-ci-trace 6.4s ease-in-out infinite; }
      .repro-ci-stage { animation: repro-ci-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes repro-ci-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes repro-ci-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .repro-ci-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .repro-ci-stage { animation: repro-ci-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes repro-ci-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="repro-ci-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="repro-ci-bg" width="980" height="322"/>
  <text class="repro-ci-h1"  x="30" y="40">Continuous verification</text>
  <text class="repro-ci-sub" x="30" y="64">Treating a model like a build.</text>
  <g class="repro-ci-stage repro-ci-s0">
    <rect class="repro-ci-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="repro-ci-step" x="44" y="142">01</text>
    <text class="repro-ci-name" x="70" y="142">A tiny training run on every change</text>
    <text class="repro-ci-desc" x="44" y="166">Minutes, not hours. It only has</text>
    <text class="repro-ci-desc" x="44" y="182">to prove nothing broke.</text>
  </g>
  <line class="repro-ci-line repro-ci-conn repro-ci-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#repro-ci-tip)"/>
  <g class="repro-ci-stage repro-ci-s1">
    <rect class="repro-ci-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="repro-ci-step" x="280" y="142">02</text>
    <text class="repro-ci-name" x="306" y="142">With asserted thresholds</text>
    <text class="repro-ci-desc" x="280" y="166">Loss below a value, shapes</text>
    <text class="repro-ci-desc" x="280" y="182">correct, no divergence.</text>
  </g>
  <line class="repro-ci-line repro-ci-conn repro-ci-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#repro-ci-tip)"/>
  <g class="repro-ci-stage repro-ci-s2">
    <rect class="repro-ci-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="repro-ci-step" x="516" y="142">03</text>
    <text class="repro-ci-name" x="542" y="142">In a pinned environment</text>
    <text class="repro-ci-desc" x="516" y="166">So a dependency update cannot</text>
    <text class="repro-ci-desc" x="516" y="182">silently change results.</text>
  </g>
  <line class="repro-ci-line repro-ci-conn repro-ci-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#repro-ci-tip)"/>
  <g class="repro-ci-stage repro-ci-s3">
    <rect class="repro-ci-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="repro-ci-step" x="752" y="142">04</text>
    <text class="repro-ci-name" x="778" y="142">And a failure blocks the change</text>
    <text class="repro-ci-desc" x="752" y="166">Which is what makes it a gate</text>
    <text class="repro-ci-desc" x="752" y="182">rather than a report.</text>
  </g>
  <text class="repro-ci-sub" x="30" y="304">A silent dependency upgrade changing training results is a genuinely difficult failure to diagnose after the fact, and pinning plus a smoke run catches it on the day it happens.</text>
</svg>
