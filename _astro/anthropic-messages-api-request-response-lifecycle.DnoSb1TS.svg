<svg role="img" aria-label="Anthropic Messages API request and response architecture diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>Anthropic Messages API Request-Response Lifecycle</title>
  <defs>
    <linearGradient id="bg253a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card253" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg253a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">ANTHROPIC MESSAGES API LIFECYCLE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Client SDK Construction, Parameter Schemas, and Typed Content Block Parsing</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card253)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Client Request -->
    <rect x="25" y="25" width="220" height="255" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="135" y="50" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">1. Client Request</text>
    <rect x="35" y="70" width="200" height="50" fill="#1e293b" rx="4"/>
    <text x="45" y="90" fill="#cbd5e1" font-size="8">client.messages.create()</text>
    <text x="45" y="108" fill="#94a3b8" font-size="7">model: claude-3-5-sonnet</text>
    
    <rect x="35" y="130" width="200" height="60" fill="#1e293b" rx="4"/>
    <text x="45" y="150" fill="#cbd5e1" font-size="8">Top-level system param</text>
    <text x="45" y="165" fill="#cbd5e1" font-size="8">messages: [{role, content}]</text>
    <text x="45" y="180" fill="#cbd5e1" font-size="8">max_tokens: 1024, temp: 0.2</text>
    <text x="135" y="245" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">HTTP POST /v1/messages</text>

    <!-- Cloud Gateway -->
    <rect x="270" y="25" width="220" height="255" fill="#0f172a" stroke="#fbbf24" rx="6"/>
    <text x="380" y="50" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">2. Anthropic Cloud Gateway</text>
    <rect x="280" y="70" width="200" height="60" fill="#1e293b" rx="4"/>
    <text x="290" y="90" fill="#fbbf24" font-size="8" font-weight="700">Auth &amp; Validation:</text>
    <text x="290" y="108" fill="#cbd5e1" font-size="7">• x-api-key verification</text>
    <text x="290" y="122" fill="#cbd5e1" font-size="7">• anthropic-version: 2023-06-01</text>

    <rect x="280" y="140" width="200" height="60" fill="#1e293b" rx="4"/>
    <text x="290" y="160" fill="#34d399" font-size="8" font-weight="700">KV Prefix Caching:</text>
    <text x="290" y="178" fill="#cbd5e1" font-size="7">• Cache breakpoint matching</text>
    <text x="290" y="192" fill="#cbd5e1" font-size="7">• Autoregressive decoding</text>
    <text x="380" y="245" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">Inference Execution</text>

    <!-- Response Structure -->
    <rect x="515" y="25" width="220" height="255" fill="#0f172a" stroke="#34d399" stroke-width="1.5" rx="6"/>
    <text x="625" y="50" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">3. Typed Response Message</text>
    <rect x="525" y="70" width="200" height="85" fill="#1e293b" rx="4"/>
    <text x="535" y="90" fill="#34d399" font-size="8" font-weight="700">content: [TextBlock]</text>
    <text x="535" y="108" fill="#cbd5e1" font-size="7">• type: "text"</text>
    <text x="535" y="122" fill="#cbd5e1" font-size="7">• text: "Response payload..."</text>
    <text x="535" y="138" fill="#cbd5e1" font-size="7">• stop_reason: "end_turn"</text>

    <rect x="525" y="165" width="200" height="60" fill="#1e293b" rx="4"/>
    <text x="535" y="185" fill="#c084fc" font-size="8" font-weight="700">usage telemetry:</text>
    <text x="535" y="202" fill="#cbd5e1" font-size="7">input_tokens, output_tokens</text>
    <text x="535" y="216" fill="#cbd5e1" font-size="7">cache_read_input_tokens</text>
    <text x="625" y="255" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Zero Deserialization Loss</text>
  </g>
</svg>
