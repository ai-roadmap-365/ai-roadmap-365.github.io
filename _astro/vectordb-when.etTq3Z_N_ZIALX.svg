<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when you do not.">
  <title>When you need a vector database</title>
  <style>
    .vectordb-when-bg   { fill: #f8fafc; }
    .vectordb-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vectordb-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vectordb-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vectordb-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vectordb-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vectordb-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vectordb-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .vectordb-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .vectordb-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .vectordb-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .vectordb-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .vectordb-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vectordb-when-row { opacity: 1; }
    .vectordb-when-r0 { animation-delay: 0.00s; }
    .vectordb-when-r1 { animation-delay: 0.45s; }
    .vectordb-when-r2 { animation-delay: 0.90s; }
    .vectordb-when-r3 { animation-delay: 1.35s; }
    .vectordb-when-r4 { animation-delay: 1.80s; }
    .vectordb-when-row { animation: vectordb-when-reveal 7.3s ease-in-out infinite; }
    @keyframes vectordb-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="vectordb-when-bg" width="980" height="390"/>
  <text class="vectordb-when-h1"  x="30" y="40">When you need a vector database</text>
  <text class="vectordb-when-sub" x="30" y="64">And when you do not.</text>
  <rect class="vectordb-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="vectordb-when-name" x="46" y="122">You need one</text>
  <text class="vectordb-when-desc" x="46" y="142">Four signals.</text>
  <text class="vectordb-when-desc vectordb-when-row vectordb-when-r0" x="46" y="182">Millions of vectors or more</text>
  <text class="vectordb-when-desc vectordb-when-row vectordb-when-r1" x="46" y="216">High sustained query rates</text>
  <text class="vectordb-when-desc vectordb-when-row vectordb-when-r2" x="46" y="250">Strict latency requirements</text>
  <text class="vectordb-when-desc vectordb-when-row vectordb-when-r3" x="46" y="284">Multi-tenant isolation needed</text>
  <text class="vectordb-when-desc vectordb-when-row vectordb-when-r4" x="46" y="318">And the corpus is mostly stable</text>
  <rect class="vectordb-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="vectordb-when-name" x="526" y="122">You do not</text>
  <text class="vectordb-when-desc" x="526" y="142">Also four.</text>
  <text class="vectordb-when-desc vectordb-when-row vectordb-when-r0" x="526" y="182">Under a million vectors</text>
  <text class="vectordb-when-desc vectordb-when-row vectordb-when-r1" x="526" y="216">An existing database with a vector extension</text>
  <text class="vectordb-when-desc vectordb-when-row vectordb-when-r2" x="526" y="250">Rapidly changing corpora</text>
  <text class="vectordb-when-desc vectordb-when-row vectordb-when-r3" x="526" y="284">Prototypes and evaluations</text>
  <text class="vectordb-when-desc vectordb-when-row vectordb-when-r4" x="526" y="318">Where an array in memory would do</text>
  <text class="vectordb-when-sub" x="30" y="372">An array of vectors in memory really does serve a surprising number of production systems, and it removes an entire service from the architecture.</text>
</svg>
