<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Three values never taken from a client.">
  <title>What the server must compute itself</title>
  <style>
    .trust-boundaries-bg   { fill: #f8fafc; }
    .trust-boundaries-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .trust-boundaries-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .trust-boundaries-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .trust-boundaries-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .trust-boundaries-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .trust-boundaries-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .trust-boundaries-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .trust-boundaries-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .trust-boundaries-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .trust-boundaries-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .trust-boundaries-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .trust-boundaries-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .trust-boundaries-row { opacity: 1; }
    .trust-boundaries-r0 { animation-delay: 0.00s; }
    .trust-boundaries-r1 { animation-delay: 0.45s; }
    .trust-boundaries-r2 { animation-delay: 0.90s; }
    .trust-boundaries-r3 { animation-delay: 1.35s; }
    .trust-boundaries-r4 { animation-delay: 1.80s; }
    .trust-boundaries-row { animation: trust-boundaries-reveal 7.3s ease-in-out infinite; }
    @keyframes trust-boundaries-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="trust-boundaries-bg" width="980" height="390"/>
  <text class="trust-boundaries-h1"  x="30" y="40">What the server must compute itself</text>
  <text class="trust-boundaries-sub" x="30" y="64">Three values never taken from a client.</text>
  <rect class="trust-boundaries-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="trust-boundaries-name" x="46" y="122">Server-computed</text>
  <text class="trust-boundaries-desc" x="46" y="142">From the provider's response.</text>
  <text class="trust-boundaries-desc trust-boundaries-row trust-boundaries-r0" x="46" y="182">Prompt, completion and cached token counts</text>
  <text class="trust-boundaries-desc trust-boundaries-row trust-boundaries-r1" x="46" y="216">The model actually used</text>
  <text class="trust-boundaries-desc trust-boundaries-row trust-boundaries-r2" x="46" y="250">The applicable price at that time</text>
  <text class="trust-boundaries-desc trust-boundaries-row trust-boundaries-r3" x="46" y="284">The tenant identity, from the key</text>
  <text class="trust-boundaries-desc trust-boundaries-row trust-boundaries-r4" x="46" y="318">Verifiable, and auditable</text>
  <rect class="trust-boundaries-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="trust-boundaries-name" x="526" y="122">Never from the client</text>
  <text class="trust-boundaries-desc" x="526" y="142">All three are free money.</text>
  <text class="trust-boundaries-desc trust-boundaries-row trust-boundaries-r0" x="526" y="182">"I used 50 tokens"</text>
  <text class="trust-boundaries-desc trust-boundaries-row trust-boundaries-r1" x="526" y="216">"I used the cheap model"</text>
  <text class="trust-boundaries-desc trust-boundaries-row trust-boundaries-r2" x="526" y="250">"I am on the enterprise tier"</text>
  <text class="trust-boundaries-desc trust-boundaries-row trust-boundaries-r3" x="526" y="284">Each is a trivially forged claim</text>
  <text class="trust-boundaries-desc trust-boundaries-row trust-boundaries-r4" x="526" y="318">And the meter becomes advisory</text>
  <text class="trust-boundaries-sub" x="30" y="372">Trusting client-reported usage is the billing equivalent of client-side validation: convenient, occasionally correct, and not a control of any kind.</text>
</svg>
