<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to reason Bayesian</title>
  <style>
    .bayes-when-bg   { fill: #f8fafc; }
    .bayes-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bayes-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bayes-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bayes-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bayes-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bayes-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bayes-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bayes-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bayes-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bayes-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bayes-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bayes-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bayes-when-row { opacity: 1; }
    .bayes-when-r0 { animation-delay: 0.00s; }
    .bayes-when-r1 { animation-delay: 0.45s; }
    .bayes-when-r2 { animation-delay: 0.90s; }
    .bayes-when-r3 { animation-delay: 1.35s; }
    .bayes-when-r4 { animation-delay: 1.80s; }
    .bayes-when-row { animation: bayes-when-reveal 7.3s ease-in-out infinite; }
    @keyframes bayes-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="bayes-when-bg" width="980" height="390"/>
  <text class="bayes-when-h1"  x="30" y="40">When to reason Bayesian</text>
  <text class="bayes-when-sub" x="30" y="64">And when not to.</text>
  <rect class="bayes-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="bayes-when-name" x="46" y="122">Use it</text>
  <text class="bayes-when-desc" x="46" y="142">Four cases.</text>
  <text class="bayes-when-desc bayes-when-row bayes-when-r0" x="46" y="182">Rare conditions and screening</text>
  <text class="bayes-when-desc bayes-when-row bayes-when-r1" x="46" y="216">Meaningful prior information exists</text>
  <text class="bayes-when-desc bayes-when-row bayes-when-r2" x="46" y="250">Sequential evidence arrives over time</text>
  <text class="bayes-when-desc bayes-when-row bayes-when-r3" x="46" y="284">Uncertainty must be quantified</text>
  <text class="bayes-when-desc bayes-when-row bayes-when-r4" x="46" y="318">Small samples with domain knowledge</text>
  <rect class="bayes-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="bayes-when-name" x="526" y="122">Be cautious</text>
  <text class="bayes-when-desc" x="526" y="142">Also four.</text>
  <text class="bayes-when-desc bayes-when-row bayes-when-r0" x="526" y="182">No defensible prior is available</text>
  <text class="bayes-when-desc bayes-when-row bayes-when-r1" x="526" y="216">Large data where it changes nothing</text>
  <text class="bayes-when-desc bayes-when-row bayes-when-r2" x="526" y="250">Where computation is prohibitive</text>
  <text class="bayes-when-desc bayes-when-row bayes-when-r3" x="526" y="284">Audiences expecting a simple verdict</text>
  <text class="bayes-when-desc bayes-when-row bayes-when-r4" x="526" y="318">Where the prior would be contested</text>
  <text class="bayes-when-sub" x="30" y="372">Large data making the prior irrelevant is worth knowing, because in that regime the Bayesian and frequentist answers usually agree to several decimal places.</text>
</svg>
