<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="Quantization Precision and Memory Comparison">
  <title>Quantization Precision and Memory Comparison</title>
  <rect width="100%" height="100%" fill="#f8fafc" />
  
    <style>
      .d278a-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d278a-header { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .d278a-text { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .d278a-accent { fill: #1d4ed8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .d278a-arrow { stroke: #1d4ed8; stroke-width: 2; stroke-linecap: round; marker-end: url(#d278a-arrowhead); }
      .d278a-pulse { animation: d278a-glow 2.5s infinite ease-in-out; }
      @keyframes d278a-glow {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(29, 78, 216, 0.2)); }
        50% { filter: drop-shadow(0 0 6px rgba(29, 78, 216, 0.6)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .d278a-pulse { animation: none; }
      }
    </style>
    
  
    <defs>
      <marker id="d278a-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8" />
      </marker>
    </defs>
    
  
  <g transform="translate(50, 40)">
    <rect class="d278a-box" x="0" y="0" width="200" height="240" />
    <text class="d278a-header" x="20" y="35">FP16 Full Precision</text>
    <text class="d278a-text" x="20" y="70">• 16 bits per weight</text>
    <text class="d278a-text" x="20" y="95">• 70B Model = 140 GB</text>
    <text class="d278a-text" x="20" y="120">• Bandwidth: 140 GB/tok</text>
    <text class="d278a-text" x="20" y="145">• Perplexity: Baseline (1.00x)</text>
    <text class="d278a-accent" x="20" y="195">Requires 2x A100 GPUs</text>
  </g>

  <g transform="translate(290, 40)">
    <rect class="d278a-box d278a-pulse" x="0" y="0" width="220" height="240" />
    <text class="d278a-header" x="20" y="35">INT8 (Q8_0) Quant</text>
    <text class="d278a-text" x="20" y="70">• 8 bits per weight</text>
    <text class="d278a-text" x="20" y="95">• 70B Model = ~72 GB</text>
    <text class="d278a-text" x="20" y="120">• Bandwidth: 50% Reduction</text>
    <text class="d278a-text" x="20" y="145">• Perplexity Loss: &lt;0.01</text>
    <text class="d278a-accent" x="20" y="195">Fits 1x 80GB GPU / Mac 128G</text>
  </g>

  <g transform="translate(540, 40)">
    <rect class="d278a-box d278a-pulse" x="0" y="0" width="220" height="240" />
    <text class="d278a-header" x="20" y="35">INT4 (Q4_K_M) K-Quant</text>
    <text class="d278a-text" x="20" y="70">• 4.5 bits avg per weight</text>
    <text class="d278a-text" x="20" y="95">• 70B Model = ~40 GB</text>
    <text class="d278a-text" x="20" y="120">• Bandwidth: 71% Reduction</text>
    <text class="d278a-text" x="20" y="145">• Perplexity Loss: ~0.05</text>
    <text class="d278a-accent" x="20" y="195">Fits Mac 64GB / 2x RTX 3090</text>
  </g>

</svg>