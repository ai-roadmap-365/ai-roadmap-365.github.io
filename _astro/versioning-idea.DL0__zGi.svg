<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four things.">
  <title>What must be versioned</title>
  <style>
    .versioning-idea-bg   { fill: #f8fafc; }
    .versioning-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .versioning-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .versioning-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .versioning-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .versioning-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .versioning-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .versioning-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .versioning-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .versioning-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .versioning-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .versioning-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .versioning-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .versioning-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .versioning-idea-stage { opacity: 1; }

    .versioning-idea-s0 { animation-delay: 0.00s; }
    .versioning-idea-e0 { animation-delay: 0.00s; }
    .versioning-idea-s1 { animation-delay: 1.28s; }
    .versioning-idea-e1 { animation-delay: 1.28s; }
    .versioning-idea-s2 { animation-delay: 2.56s; }
    .versioning-idea-e2 { animation-delay: 2.56s; }
    .versioning-idea-s3 { animation-delay: 3.84s; }
    .versioning-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .versioning-idea-conn  { animation: versioning-idea-trace 6.4s ease-in-out infinite; }
      .versioning-idea-stage { animation: versioning-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes versioning-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes versioning-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .versioning-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .versioning-idea-stage { animation: versioning-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes versioning-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="versioning-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="versioning-idea-bg" width="980" height="322"/>
  <text class="versioning-idea-h1"  x="30" y="40">What must be versioned</text>
  <text class="versioning-idea-sub" x="30" y="64">Four things.</text>
  <g class="versioning-idea-stage versioning-idea-s0">
    <rect class="versioning-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="versioning-idea-step" x="44" y="142">01</text>
    <text class="versioning-idea-name" x="70" y="142">The whole pipeline, not the estimator</text>
    <text class="versioning-idea-desc" x="44" y="166">Preprocessing included, as one</text>
    <text class="versioning-idea-desc" x="44" y="182">artefact.</text>
  </g>
  <line class="versioning-idea-line versioning-idea-conn versioning-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#versioning-idea-tip)"/>
  <g class="versioning-idea-stage versioning-idea-s1">
    <rect class="versioning-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="versioning-idea-step" x="280" y="142">02</text>
    <text class="versioning-idea-name" x="306" y="142">The training data version</text>
    <text class="versioning-idea-desc" x="280" y="166">By content hash, so it cannot be</text>
    <text class="versioning-idea-desc" x="280" y="182">confused.</text>
  </g>
  <line class="versioning-idea-line versioning-idea-conn versioning-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#versioning-idea-tip)"/>
  <g class="versioning-idea-stage versioning-idea-s2">
    <rect class="versioning-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="versioning-idea-step" x="516" y="142">03</text>
    <text class="versioning-idea-name" x="542" y="142">The environment</text>
    <text class="versioning-idea-desc" x="516" y="166">Library versions, pinned.</text>
    <text class="versioning-idea-desc" x="516" y="182">Results move with them.</text>
  </g>
  <line class="versioning-idea-line versioning-idea-conn versioning-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#versioning-idea-tip)"/>
  <g class="versioning-idea-stage versioning-idea-s3">
    <rect class="versioning-idea-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="versioning-idea-step" x="752" y="142">04</text>
    <text class="versioning-idea-name" x="778" y="142">And the evaluation record</text>
    <text class="versioning-idea-desc" x="752" y="166">What it scored, on what, at what</text>
    <text class="versioning-idea-desc" x="752" y="182">operating point.</text>
  </g>
  <text class="versioning-idea-sub" x="30" y="304">Versioning these four together is what makes a model reproducible; versioning only the weights makes it merely retrievable.</text>
</svg>
