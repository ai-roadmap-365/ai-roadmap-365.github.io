<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Computing distances efficiently</title>
  <style>
    .vectorised-distance-bg   { fill: #f8fafc; }
    .vectorised-distance-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vectorised-distance-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vectorised-distance-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vectorised-distance-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vectorised-distance-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vectorised-distance-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vectorised-distance-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .vectorised-distance-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .vectorised-distance-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .vectorised-distance-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .vectorised-distance-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .vectorised-distance-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .vectorised-distance-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .vectorised-distance-stage { opacity: 1; }

    .vectorised-distance-s0 { animation-delay: 0.00s; }
    .vectorised-distance-e0 { animation-delay: 0.00s; }
    .vectorised-distance-s1 { animation-delay: 1.28s; }
    .vectorised-distance-e1 { animation-delay: 1.28s; }
    .vectorised-distance-s2 { animation-delay: 2.56s; }
    .vectorised-distance-e2 { animation-delay: 2.56s; }
    .vectorised-distance-s3 { animation-delay: 3.84s; }
    .vectorised-distance-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .vectorised-distance-conn  { animation: vectorised-distance-trace 6.4s ease-in-out infinite; }
      .vectorised-distance-stage { animation: vectorised-distance-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes vectorised-distance-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes vectorised-distance-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .vectorised-distance-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .vectorised-distance-stage { animation: vectorised-distance-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes vectorised-distance-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="vectorised-distance-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="vectorised-distance-bg" width="980" height="322"/>
  <text class="vectorised-distance-h1"  x="30" y="40">Computing distances efficiently</text>
  <text class="vectorised-distance-sub" x="30" y="64">Four steps.</text>
  <g class="vectorised-distance-stage vectorised-distance-s0">
    <rect class="vectorised-distance-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="vectorised-distance-step" x="44" y="142">01</text>
    <text class="vectorised-distance-name" x="70" y="142">A loop over every pair is correct and very slow</text>
    <text class="vectorised-distance-desc" x="44" y="166">Especially in an interpreted</text>
    <text class="vectorised-distance-desc" x="44" y="182">language.</text>
  </g>
  <line class="vectorised-distance-line vectorised-distance-conn vectorised-distance-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#vectorised-distance-tip)"/>
  <g class="vectorised-distance-stage vectorised-distance-s1">
    <rect class="vectorised-distance-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="vectorised-distance-step" x="280" y="142">02</text>
    <text class="vectorised-distance-name" x="306" y="142">Expand the squared distance algebraically</text>
    <text class="vectorised-distance-desc" x="280" y="166">Into squared norms minus twice</text>
    <text class="vectorised-distance-desc" x="280" y="182">the dot product.</text>
  </g>
  <line class="vectorised-distance-line vectorised-distance-conn vectorised-distance-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#vectorised-distance-tip)"/>
  <g class="vectorised-distance-stage vectorised-distance-s2">
    <rect class="vectorised-distance-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="vectorised-distance-step" x="516" y="142">03</text>
    <text class="vectorised-distance-name" x="542" y="142">Which is one matrix multiplication</text>
    <text class="vectorised-distance-desc" x="516" y="166">Plus two vectors of norms.</text>
  </g>
  <line class="vectorised-distance-line vectorised-distance-conn vectorised-distance-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#vectorised-distance-tip)"/>
  <g class="vectorised-distance-stage vectorised-distance-s3">
    <rect class="vectorised-distance-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="vectorised-distance-step" x="752" y="142">04</text>
    <text class="vectorised-distance-name" x="778" y="142">Orders of magnitude faster</text>
    <text class="vectorised-distance-desc" x="752" y="166">The same trick that makes vector</text>
    <text class="vectorised-distance-desc" x="752" y="182">search viable.</text>
    <text class="vectorised-distance-edge" x="752" y="242">one operation</text>
  </g>
  <text class="vectorised-distance-sub" x="30" y="304">This is the same expansion that makes similarity search practical at scale, so it is worth doing once by hand — it recurs throughout retrieval.</text>
</svg>
