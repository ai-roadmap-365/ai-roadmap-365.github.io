<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Full-Stack AI Product System Topology">
  <title>Full-Stack AI Product System Topology</title>
  <defs>
    <style>
      .d316a-bg { fill: #f8fafc; }
      .d316a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d316a-cli { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d316a-gw { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d316a-orch { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 8px; }
      .d316a-rout { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d316a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d316a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d316a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d316a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d316a-bg" />
  
  <text x="40" y="40" class="d316a-title">Production Full-Stack AI System Architecture</text>
  <text x="40" y="65" class="d316a-subtitle">Full-Stack AI Product System Topology showing Client UI, Edge API Gateway (Auth &amp; Rate Limit), Streaming Orchestrator, Context &amp; Memory Store, Model Router, and LLM Providers</text>
  
  <!-- Tier 1: Client Frontends -->
  <rect x="40" y="110" width="180" height="270" class="d316a-cli" />
  <text x="55" y="140" class="d316a-header" fill="#1d4ed8">1. Client Tier</text>
  <text x="55" y="170" class="d316a-text">• React / Next.js SPA</text>
  <text x="55" y="190" class="d316a-text">• Mobile Apps (Flutter/iOS)</text>
  <text x="55" y="210" class="d316a-text">• SSE Stream Parser</text>
  <text x="55" y="230" class="d316a-text">• Optimistic UI Updates</text>
  <text x="55" y="260" class="d316a-text" font-weight="600">Protocol:</text>
  <text x="55" y="280" class="d316a-text">HTTP/2 + SSE Stream</text>
  
  <!-- Tier 2: Edge API Gateway -->
  <rect x="250" y="110" width="180" height="270" class="d316a-gw" />
  <text x="265" y="140" class="d316a-header" fill="#7e22ce">2. API Gateway</text>
  <text x="265" y="170" class="d316a-text">• JWT Auth &amp; Tenant ID</text>
  <text x="265" y="190" class="d316a-text">• Token Bucket Rate Limits</text>
  <text x="265" y="210" class="d316a-text">• Credit / Balance Check</text>
  <text x="265" y="230" class="d316a-text">• Input PII / Secret Scrub</text>
  <text x="265" y="260" class="d316a-text" font-weight="600">Throughput:</text>
  <text x="265" y="280" class="d316a-text">Edge TLS Termination</text>
  
  <!-- Tier 3: Orchestrator & Context -->
  <rect x="460" y="110" width="180" height="270" class="d316a-orch" />
  <text x="475" y="140" class="d316a-header" fill="#a16207">3. Orchestrator</text>
  <text x="475" y="170" class="d316a-text">• Prompt Template Engine</text>
  <text x="475" y="190" class="d316a-text">• Sliding Session Memory</text>
  <text x="475" y="210" class="d316a-text">• Vector RAG Retrieval</text>
  <text x="475" y="230" class="d316a-text">• Tool Call Dispatcher</text>
  <text x="475" y="260" class="d316a-text" font-weight="600">Storage:</text>
  <text x="475" y="280" class="d316a-text">Postgres + pgvector</text>
  
  <!-- Tier 4: Model Router & Inference -->
  <rect x="670" y="110" width="190" height="270" class="d316a-rout" />
  <text x="685" y="140" class="d316a-header" fill="#15803d">4. Model Router</text>
  <text x="685" y="170" class="d316a-text">• Multi-Provider Failover</text>
  <text x="685" y="190" class="d316a-text">• Anthropic / OpenAI / vLLM</text>
  <text x="685" y="210" class="d316a-text">• Prompt Caching Manager</text>
  <text x="685" y="230" class="d316a-text">• Token Telemetry Export</text>
  <text x="685" y="260" class="d316a-text" font-weight="600">SLA:</text>
  <text x="685" y="280" class="d316a-text">99.99% Availability</text>
</svg>