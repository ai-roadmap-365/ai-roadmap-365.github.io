<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780" role="img" aria-labelledby="d094aTitleId d094aDescId">
  <title id="d094aTitleId">Three layers guard a program: type checker, runtime validator, database constraint</title>
  <desc id="d094aDescId">Three stacked layers each catch a different class of bad data and each let a different class slip past: a static type checker before the program runs, a pydantic validator at the boundary as data arrives, and a database constraint as data is stored. A caption states that each layer catches what the others structurally cannot.</desc>

  <style>
    .d094a-bg      { fill: #f8fafc; }
    .d094a-title   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 600; fill: #1a202c; }
    .d094a-sub     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d094a-layer   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 600; fill: #1a202c; }
    .d094a-when    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-style: italic; fill: #475569; }
    .d094a-label   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #1a202c; }
    .d094a-code    { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 14px; fill: #1a202c; }
    .d094a-code-sm { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 14px; fill: #334155; }
    .d094a-caption { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; fill: #1d4ed8; }

    .d094a-box       { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d094a-layerbox  { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 2; }
    .d094a-catchbox  { fill: #ecfdf5; stroke: #047857; stroke-width: 1.5; }
    .d094a-slipbox   { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.5; }
  </style>

  <rect class="d094a-bg" x="0" y="0" width="1000" height="780" />

  <text class="d094a-title" x="32" y="42">Three layers guard a program</text>
  <text class="d094a-sub" x="32" y="64">Same bad record, three different chances to catch it — and three different blind spots.</text>

  <!-- Column headers -->
  <text class="d094a-label" x="330" y="98" text-anchor="middle">catches</text>
  <text class="d094a-label" x="700" y="98" text-anchor="middle">slips past</text>

  <!-- ===================== Layer 1 ===================== -->
  <rect class="d094a-layerbox" x="32" y="112" width="936" height="180" rx="10" />
  <text class="d094a-layer" x="52" y="140">1. Type checker — before it runs</text>
  <text class="d094a-when" x="52" y="160">(Day 75, static analysis, no data involved yet)</text>

  <rect class="d094a-catchbox" x="52" y="176" width="536" height="96" rx="8" />
  <text class="d094a-code" x="68" y="202">reading.pm25 + "12"</text>
  <text class="d094a-code-sm" x="68" y="224">an int and a str added —</text>
  <text class="d094a-code-sm" x="68" y="244">wrong at compile time,</text>
  <text class="d094a-code-sm" x="68" y="264">regardless of what data ever arrives.</text>

  <rect class="d094a-slipbox" x="604" y="176" width="364" height="96" rx="8" />
  <text class="d094a-code" x="620" y="202">{"pm2_5": "not-measured"}</text>
  <text class="d094a-code-sm" x="620" y="224">the annotation says float —</text>
  <text class="d094a-code-sm" x="620" y="244">the checker never sees the</text>
  <text class="d094a-code-sm" x="620" y="264">JSON file at all.</text>

  <!-- ===================== Layer 2 ===================== -->
  <rect class="d094a-layerbox" x="32" y="316" width="936" height="200" rx="10" />
  <text class="d094a-layer" x="52" y="344">2. Validator at the boundary — as data arrives</text>
  <text class="d094a-when" x="52" y="364">(Day 94, pydantic, runs once per incoming record)</text>

  <rect class="d094a-catchbox" x="52" y="380" width="536" height="116" rx="8" />
  <text class="d094a-code" x="68" y="406">pm2_5: "not-measured"</text>
  <text class="d094a-code-sm" x="68" y="426">-&gt; type=float_parsing, loc=("pm2_5",)</text>
  <text class="d094a-code" x="68" y="452">humidity_pct: 118</text>
  <text class="d094a-code-sm" x="68" y="472">-&gt; type=less_than_equal</text>

  <rect class="d094a-slipbox" x="604" y="380" width="364" height="116" rx="8" />
  <text class="d094a-code-sm" x="620" y="406">a duplicate reading_id written</text>
  <text class="d094a-code-sm" x="620" y="426">straight to the table by a</text>
  <text class="d094a-code-sm" x="620" y="446">migration script that never</text>
  <text class="d094a-code-sm" x="620" y="466">called the model.</text>

  <!-- ===================== Layer 3 ===================== -->
  <rect class="d094a-layerbox" x="32" y="540" width="936" height="180" rx="10" />
  <text class="d094a-layer" x="52" y="568">3. Database constraint — as data is stored</text>
  <text class="d094a-when" x="52" y="588">(Day 88, enforced by the engine, the last line of defense)</text>

  <rect class="d094a-catchbox" x="52" y="604" width="536" height="96" rx="8" />
  <text class="d094a-code-sm" x="68" y="630">UNIQUE(reading_id) rejects the</text>
  <text class="d094a-code-sm" x="68" y="650">second RD-0001.</text>
  <text class="d094a-code-sm" x="68" y="674">CHECK (humidity_pct BETWEEN 0 AND 100)</text>

  <rect class="d094a-slipbox" x="604" y="604" width="364" height="96" rx="8" />
  <text class="d094a-code-sm" x="620" y="630">nothing about data it never</text>
  <text class="d094a-code-sm" x="620" y="650">receives — it cannot see a request</text>
  <text class="d094a-code-sm" x="620" y="670">rejected upstream, and it cannot</text>
  <text class="d094a-code-sm" x="620" y="690">give a caller a field-level report.</text>

  <!-- Connectors between layers, amber, showing "slips past" continuing on -->
  <defs>
    <marker id="d094a-arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c" />
    </marker>
  </defs>
  <path d="M 786 272 L 786 316" stroke="#c2410c" stroke-width="2.5" fill="none" marker-end="url(#d094a-arrowAmber)" />
  <path d="M 786 496 L 786 540" stroke="#c2410c" stroke-width="2.5" fill="none" marker-end="url(#d094a-arrowAmber)" />

  <text class="d094a-caption" x="500" y="750" text-anchor="middle">Each layer catches what the others structurally cannot.</text>
</svg>
