<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The verb decides whether a retry is free or expensive.">
  <title>What retry logic must know</title>
  <style>
    .safe-idempotent-retry-bg   { fill: #f8fafc; }
    .safe-idempotent-retry-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safe-idempotent-retry-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safe-idempotent-retry-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safe-idempotent-retry-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safe-idempotent-retry-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safe-idempotent-retry-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .safe-idempotent-retry-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .safe-idempotent-retry-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .safe-idempotent-retry-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .safe-idempotent-retry-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .safe-idempotent-retry-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .safe-idempotent-retry-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .safe-idempotent-retry-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .safe-idempotent-retry-stage { opacity: 1; }

    .safe-idempotent-retry-s0 { animation-delay: 0.00s; }
    .safe-idempotent-retry-e0 { animation-delay: 0.00s; }
    .safe-idempotent-retry-s1 { animation-delay: 1.28s; }
    .safe-idempotent-retry-e1 { animation-delay: 1.28s; }
    .safe-idempotent-retry-s2 { animation-delay: 2.56s; }
    .safe-idempotent-retry-e2 { animation-delay: 2.56s; }
    .safe-idempotent-retry-s3 { animation-delay: 3.84s; }
    .safe-idempotent-retry-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .safe-idempotent-retry-conn  { animation: safe-idempotent-retry-trace 6.4s ease-in-out infinite; }
      .safe-idempotent-retry-stage { animation: safe-idempotent-retry-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes safe-idempotent-retry-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes safe-idempotent-retry-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .safe-idempotent-retry-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .safe-idempotent-retry-stage { animation: safe-idempotent-retry-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes safe-idempotent-retry-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="safe-idempotent-retry-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="safe-idempotent-retry-bg" width="980" height="322"/>
  <text class="safe-idempotent-retry-h1"  x="30" y="40">What retry logic must know</text>
  <text class="safe-idempotent-retry-sub" x="30" y="64">The verb decides whether a retry is free or expensive.</text>
  <g class="safe-idempotent-retry-stage safe-idempotent-retry-s0">
    <rect class="safe-idempotent-retry-good" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="safe-idempotent-retry-step" x="44" y="142">01</text>
    <text class="safe-idempotent-retry-name" x="70" y="142">GET — retry freely</text>
    <text class="safe-idempotent-retry-desc" x="44" y="166">Safe and idempotent. Nothing</text>
    <text class="safe-idempotent-retry-desc" x="44" y="182">changes however many times it</text>
    <text class="safe-idempotent-retry-desc" x="44" y="198">runs.</text>
    <text class="safe-idempotent-retry-edge" x="44" y="242">free</text>
  </g>
  <line class="safe-idempotent-retry-line safe-idempotent-retry-conn safe-idempotent-retry-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#safe-idempotent-retry-tip)"/>
  <g class="safe-idempotent-retry-stage safe-idempotent-retry-s1">
    <rect class="safe-idempotent-retry-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="safe-idempotent-retry-step" x="280" y="142">02</text>
    <text class="safe-idempotent-retry-name" x="306" y="142">PUT, DELETE — retry safely</text>
    <text class="safe-idempotent-retry-desc" x="280" y="166">Not safe, but idempotent. The</text>
    <text class="safe-idempotent-retry-desc" x="280" y="182">end state is the same either</text>
    <text class="safe-idempotent-retry-desc" x="280" y="198">way.</text>
    <text class="safe-idempotent-retry-edge" x="280" y="242">harmless</text>
  </g>
  <line class="safe-idempotent-retry-line safe-idempotent-retry-conn safe-idempotent-retry-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#safe-idempotent-retry-tip)"/>
  <g class="safe-idempotent-retry-stage safe-idempotent-retry-s2">
    <rect class="safe-idempotent-retry-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="safe-idempotent-retry-step" x="516" y="142">03</text>
    <text class="safe-idempotent-retry-name" x="542" y="142">POST — do not retry blindly</text>
    <text class="safe-idempotent-retry-desc" x="516" y="166">A timeout means the response was</text>
    <text class="safe-idempotent-retry-desc" x="516" y="182">lost, not that nothing happened.</text>
    <text class="safe-idempotent-retry-edge" x="516" y="242">may duplicate</text>
  </g>
  <line class="safe-idempotent-retry-line safe-idempotent-retry-conn safe-idempotent-retry-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#safe-idempotent-retry-tip)"/>
  <g class="safe-idempotent-retry-stage safe-idempotent-retry-s3">
    <rect class="safe-idempotent-retry-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="safe-idempotent-retry-step" x="752" y="142">04</text>
    <text class="safe-idempotent-retry-name" x="778" y="142">POST with an idempotency key</text>
    <text class="safe-idempotent-retry-desc" x="752" y="166">The server recognises the repeat</text>
    <text class="safe-idempotent-retry-desc" x="752" y="182">and returns the original result.</text>
    <text class="safe-idempotent-retry-edge" x="752" y="242">the fix</text>
  </g>
  <text class="safe-idempotent-retry-sub" x="30" y="304">This is not academic. It is the difference between a robust integration and a customer charged twice, and it is why retry code must branch on the method.</text>
</svg>
