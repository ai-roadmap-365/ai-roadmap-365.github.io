<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="End to End Feature Shipping Lifecycle">
  <title>End to End Feature Shipping Lifecycle</title>
  <defs>
    <style>
      .d308a-bg { fill: #f8fafc; }
      .d308a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d308a-s1 { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d308a-s2 { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d308a-s3 { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; rx: 8px; }
      .d308a-s4 { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d308a-s5 { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 8px; }
      .d308a-s6 { fill: #f1f5f9; stroke: #0f172a; stroke-width: 2px; rx: 8px; }
      .d308a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d308a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d308a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; }
      .d308a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d308a-bg" />
  
  <text x="40" y="40" class="d308a-title">The 6-Stage End-to-End Feature Shipping Playbook</text>
  <text x="40" y="65" class="d308a-subtitle">End to End Feature Shipping Lifecycle showing Spec, Plan Review, TDD Red Test, Implementation Green, Verification Gate, and PR Walkthrough</text>
  
  <!-- Stage 1: Spec -->
  <rect x="30" y="110" width="130" height="260" class="d308a-s1" />
  <text x="40" y="135" class="d308a-header" fill="#1d4ed8">1. Spec &amp; Scoping</text>
  <text x="40" y="160" class="d308a-text">• User story</text>
  <text x="40" y="180" class="d308a-text">• Target schemas</text>
  <text x="40" y="200" class="d308a-text">• Non-goals</text>
  <text x="40" y="220" class="d308a-text">• Context files</text>
  <text x="40" y="250" class="d308a-text" font-weight="600">Output:</text>
  <text x="40" y="270" class="d308a-text">Structured Prompt</text>
  
  <!-- Stage 2: Plan Review -->
  <rect x="175" y="110" width="130" height="260" class="d308a-s2" />
  <text x="185" y="135" class="d308a-header" fill="#7e22ce">2. Plan Review</text>
  <text x="185" y="160" class="d308a-text">• Model explores</text>
  <text x="185" y="180" class="d308a-text">• Emits plan doc</text>
  <text x="185" y="200" class="d308a-text">• Lists all files</text>
  <text x="185" y="220" class="d308a-text">• Catches flaws</text>
  <text x="185" y="250" class="d308a-text" font-weight="600">Gate:</text>
  <text x="185" y="270" class="d308a-text">Dev Approval</text>
  
  <!-- Stage 3: Failing Test -->
  <rect x="320" y="110" width="130" height="260" class="d308a-s3" />
  <text x="330" y="135" class="d308a-header" fill="#b91c1c">3. Red TDD Test</text>
  <text x="330" y="160" class="d308a-text">• Writes unit test</text>
  <text x="330" y="180" class="d308a-text">• Strict asserts</text>
  <text x="330" y="200" class="d308a-text">• Runs `pytest`</text>
  <text x="330" y="220" class="d308a-text">• Proves failure</text>
  <text x="330" y="250" class="d308a-text" font-weight="600">Status:</text>
  <text x="330" y="270" class="d308a-text">Red (Failing)</text>
  
  <!-- Stage 4: Implementation -->
  <rect x="465" y="110" width="130" height="260" class="d308a-s4" />
  <text x="475" y="135" class="d308a-header" fill="#15803d">4. Green Code</text>
  <text x="475" y="160" class="d308a-text">• Atomic edits</text>
  <text x="475" y="180" class="d308a-text">• Modifies logic</text>
  <text x="475" y="200" class="d308a-text">• Runs `pytest`</text>
  <text x="475" y="220" class="d308a-text">• Self-heals</text>
  <text x="475" y="250" class="d308a-text" font-weight="600">Status:</text>
  <text x="475" y="270" class="d308a-text">Green (Passing)</text>
  
  <!-- Stage 5: Quality Gate -->
  <rect x="610" y="110" width="130" height="260" class="d308a-s5" />
  <text x="620" y="135" class="d308a-header" fill="#a16207">5. Quality Gate</text>
  <text x="620" y="160" class="d308a-text">• `mypy --strict`</text>
  <text x="620" y="180" class="d308a-text">• `ruff check`</text>
  <text x="620" y="200" class="d308a-text">• Bandit security</text>
  <text x="620" y="220" class="d308a-text">• Full suite run</text>
  <text x="620" y="250" class="d308a-text" font-weight="600">Gate:</text>
  <text x="620" y="270" class="d308a-text">100% Green</text>
  
  <!-- Stage 6: Walkthrough & PR -->
  <rect x="755" y="110" width="125" height="260" class="d308a-s6" />
  <text x="765" y="135" class="d308a-header" fill="#0f172a">6. Ship PR</text>
  <text x="765" y="160" class="d308a-text">• Emits Walkthrough</text>
  <text x="765" y="180" class="d308a-text">• Updates docs</text>
  <text x="765" y="200" class="d308a-text">• Pushes branch</text>
  <text x="765" y="220" class="d308a-text">• Opens PR</text>
  <text x="765" y="250" class="d308a-text" font-weight="600">Outcome:</text>
  <text x="765" y="270" class="d308a-text">Production Merge</text>
</svg>