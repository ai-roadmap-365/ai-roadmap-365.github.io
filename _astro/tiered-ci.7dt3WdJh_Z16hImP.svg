<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Cost matched to cadence.">
  <title>Three CI stages</title>
  <style>
    .tiered-ci-bg   { fill: #f8fafc; }
    .tiered-ci-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tiered-ci-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tiered-ci-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tiered-ci-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tiered-ci-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tiered-ci-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tiered-ci-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tiered-ci-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tiered-ci-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tiered-ci-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tiered-ci-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tiered-ci-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tiered-ci-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tiered-ci-stage { opacity: 1; }

    .tiered-ci-s0 { animation-delay: 0.00s; }
    .tiered-ci-e0 { animation-delay: 0.00s; }
    .tiered-ci-s1 { animation-delay: 1.50s; }
    .tiered-ci-e1 { animation-delay: 1.50s; }
    .tiered-ci-s2 { animation-delay: 3.00s; }
    .tiered-ci-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .tiered-ci-conn  { animation: tiered-ci-trace 6s ease-in-out infinite; }
      .tiered-ci-stage { animation: tiered-ci-arrive 6s ease-in-out infinite; }
    }
    @keyframes tiered-ci-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tiered-ci-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tiered-ci-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tiered-ci-stage { animation: tiered-ci-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tiered-ci-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tiered-ci-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tiered-ci-bg" width="980" height="322"/>
  <text class="tiered-ci-h1"  x="30" y="40">Three CI stages</text>
  <text class="tiered-ci-sub" x="30" y="64">Cost matched to cadence.</text>
  <g class="tiered-ci-stage tiered-ci-s0">
    <rect class="tiered-ci-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="tiered-ci-step" x="44" y="142">01</text>
    <text class="tiered-ci-name" x="70" y="142">Pre-commit, under 5 seconds</text>
    <text class="tiered-ci-desc" x="44" y="166">Schema structure and regex invariants,</text>
    <text class="tiered-ci-desc" x="44" y="182">locally, before the commit.</text>
    <text class="tiered-ci-edge" x="44" y="242">free</text>
  </g>
  <line class="tiered-ci-line tiered-ci-conn tiered-ci-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#tiered-ci-tip)"/>
  <g class="tiered-ci-stage tiered-ci-s1">
    <rect class="tiered-ci-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="tiered-ci-step" x="359" y="142">02</text>
    <text class="tiered-ci-name" x="385" y="142">Pull request smoke, under 60 seconds</text>
    <text class="tiered-ci-desc" x="359" y="166">Fifty high-priority golden cases, in</text>
    <text class="tiered-ci-desc" x="359" y="182">parallel.</text>
    <text class="tiered-ci-edge" x="359" y="242">cheap</text>
  </g>
  <line class="tiered-ci-line tiered-ci-conn tiered-ci-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#tiered-ci-tip)"/>
  <g class="tiered-ci-stage tiered-ci-s2">
    <rect class="tiered-ci-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="tiered-ci-step" x="674" y="142">03</text>
    <text class="tiered-ci-name" x="700" y="142">Nightly matrix, under 10 minutes</text>
    <text class="tiered-ci-desc" x="674" y="166">A thousand cases across models, temperatures</text>
    <text class="tiered-ci-desc" x="674" y="182">and quantisations.</text>
    <text class="tiered-ci-edge" x="674" y="242">~$1.50</text>
  </g>
  <text class="tiered-ci-sub" x="30" y="304">Running everything on every push is how regression suites get disabled: at $50 a pull request the cost becomes the argument against the practice, and the tiering removes that argument.</text>
</svg>
