<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Opposite remedies.">
  <title>Underfitting against overfitting</title>
  <style>
    .bias-variance-diagnosis-bg   { fill: #f8fafc; }
    .bias-variance-diagnosis-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bias-variance-diagnosis-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bias-variance-diagnosis-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bias-variance-diagnosis-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bias-variance-diagnosis-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bias-variance-diagnosis-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bias-variance-diagnosis-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bias-variance-diagnosis-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bias-variance-diagnosis-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bias-variance-diagnosis-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bias-variance-diagnosis-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bias-variance-diagnosis-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bias-variance-diagnosis-row { opacity: 1; }
    .bias-variance-diagnosis-r0 { animation-delay: 0.00s; }
    .bias-variance-diagnosis-r1 { animation-delay: 0.45s; }
    .bias-variance-diagnosis-r2 { animation-delay: 0.90s; }
    .bias-variance-diagnosis-r3 { animation-delay: 1.35s; }
    .bias-variance-diagnosis-r4 { animation-delay: 1.80s; }
    .bias-variance-diagnosis-row { animation: bias-variance-diagnosis-reveal 7.3s ease-in-out infinite; }
    @keyframes bias-variance-diagnosis-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="bias-variance-diagnosis-bg" width="980" height="390"/>
  <text class="bias-variance-diagnosis-h1"  x="30" y="40">Underfitting against overfitting</text>
  <text class="bias-variance-diagnosis-sub" x="30" y="64">Opposite remedies.</text>
  <rect class="bias-variance-diagnosis-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="bias-variance-diagnosis-name" x="46" y="122">Underfitting</text>
  <text class="bias-variance-diagnosis-desc" x="46" y="142">High bias.</text>
  <text class="bias-variance-diagnosis-desc bias-variance-diagnosis-row bias-variance-diagnosis-r0" x="46" y="182">Training error is high</text>
  <text class="bias-variance-diagnosis-desc bias-variance-diagnosis-row bias-variance-diagnosis-r1" x="46" y="216">Validation error is close to it</text>
  <text class="bias-variance-diagnosis-desc bias-variance-diagnosis-row bias-variance-diagnosis-r2" x="46" y="250">Curves converge early, at a poor level</text>
  <text class="bias-variance-diagnosis-desc bias-variance-diagnosis-row bias-variance-diagnosis-r3" x="46" y="284">More data will not help</text>
  <text class="bias-variance-diagnosis-desc bias-variance-diagnosis-row bias-variance-diagnosis-r4" x="46" y="318">Fix: a richer model, or better features</text>
  <rect class="bias-variance-diagnosis-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="bias-variance-diagnosis-name" x="526" y="122">Overfitting</text>
  <text class="bias-variance-diagnosis-desc" x="526" y="142">High variance.</text>
  <text class="bias-variance-diagnosis-desc bias-variance-diagnosis-row bias-variance-diagnosis-r0" x="526" y="182">Training error is low</text>
  <text class="bias-variance-diagnosis-desc bias-variance-diagnosis-row bias-variance-diagnosis-r1" x="526" y="216">Validation error is much higher</text>
  <text class="bias-variance-diagnosis-desc bias-variance-diagnosis-row bias-variance-diagnosis-r2" x="526" y="250">A persistent gap between the curves</text>
  <text class="bias-variance-diagnosis-desc bias-variance-diagnosis-row bias-variance-diagnosis-r3" x="526" y="284">More data will help</text>
  <text class="bias-variance-diagnosis-desc bias-variance-diagnosis-row bias-variance-diagnosis-r4" x="526" y="318">Fix: regularisation, or simplification</text>
  <text class="bias-variance-diagnosis-sub" x="30" y="372">Reading the wrong one wastes the most time in practice: buying data for an underfitting model changes nothing, and simplifying an underfitting model makes it worse.</text>
</svg>
