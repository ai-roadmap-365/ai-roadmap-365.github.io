<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the result you need.">
  <title>Which group operation when</title>
  <style>
    .group-when-bg   { fill: #f8fafc; }
    .group-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .group-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .group-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .group-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .group-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .group-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .group-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .group-when-row { opacity: 1; }
    .group-when-r0 { animation-delay: 0.00s; }
    .group-when-r1 { animation-delay: 0.45s; }
    .group-when-r2 { animation-delay: 0.90s; }
    .group-when-r3 { animation-delay: 1.35s; }
    .group-when-r4 { animation-delay: 1.80s; }
    .group-when-row { animation: group-when-reveal 7.3s ease-in-out infinite; }
    @keyframes group-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="group-when-bg" width="980" height="390"/>
  <text class="group-when-h1"  x="30" y="40">Which group operation when</text>
  <text class="group-when-sub" x="30" y="64">By the result you need.</text>
  <rect class="group-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="group-when-name" x="46" y="122">What you need</text>
  <text class="group-when-desc" x="46" y="142">The result.</text>
  <text class="group-when-desc group-when-row group-when-r0" x="46" y="182">One summary row per category</text>
  <text class="group-when-desc group-when-row group-when-r1" x="46" y="216">Each row's value relative to its group</text>
  <text class="group-when-desc group-when-row group-when-r2" x="46" y="250">Only groups meeting a condition</text>
  <text class="group-when-desc group-when-row group-when-r3" x="46" y="284">Several statistics at once</text>
  <text class="group-when-desc group-when-row group-when-r4" x="46" y="318">Group counts including empty categories</text>
  <rect class="group-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="group-when-name" x="526" y="122">The operation</text>
  <text class="group-when-desc" x="526" y="142">What to use.</text>
  <text class="group-when-desc group-when-row group-when-r0" x="526" y="182">Aggregation</text>
  <text class="group-when-desc group-when-row group-when-r1" x="526" y="216">Transformation</text>
  <text class="group-when-desc group-when-row group-when-r2" x="526" y="250">Group filtering</text>
  <text class="group-when-desc group-when-row group-when-r3" x="526" y="284">Aggregation with several functions</text>
  <text class="group-when-desc group-when-row group-when-r4" x="526" y="318">Aggregation, then reindex on all categories</text>
  <text class="group-when-sub" x="30" y="372">Reindexing on the full set of categories is the fix for disappearing groups, and it makes reports comparable across periods rather than subtly different each time.</text>
</svg>
