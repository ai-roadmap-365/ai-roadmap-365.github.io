<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" font-family="system-ui, sans-serif">
  <title>The memory hierarchy pyramid with approximate sizes and latencies: registers, L1, L2, and L3 cache, RAM, SSD, HDD, and network storage</title>
  <rect x="0" y="0" width="800" height="600" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The memory hierarchy, level by level</text>

  <!-- Tier 1: Registers -->
  <polygon points="325,70 435,70 462,114 298,114" fill="#1d4ed8"/>
  <text x="380" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#f8fafc">Registers</text>
  <text x="474" y="98" font-size="14" fill="#1a202c">~1 KB total · ~0.5 ns</text>

  <!-- Tier 2: L1 cache -->
  <polygon points="293,122 467,122 494,166 266,166" fill="#2563eb"/>
  <text x="380" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#f8fafc">L1 cache</text>
  <text x="506" y="150" font-size="14" fill="#1a202c">~32–192 KB per core · ~1 ns</text>

  <!-- Tier 3: L2 cache -->
  <polygon points="261,174 499,174 526,218 234,218" fill="#3b82f6"/>
  <text x="380" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#f8fafc">L2 cache</text>
  <text x="538" y="202" font-size="14" fill="#1a202c">~0.25–16 MB · ~4 ns</text>

  <!-- Tier 4: L3 cache -->
  <polygon points="229,226 531,226 558,270 202,270" fill="#60a5fa"/>
  <text x="380" y="254" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">L3 cache</text>
  <text x="570" y="254" font-size="14" fill="#1a202c">~8–128 MB · ~15 ns</text>

  <!-- Tier 5: RAM -->
  <polygon points="197,278 563,278 590,322 170,322" fill="#93c5fd"/>
  <text x="380" y="306" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">RAM — ~8–192 GB · ~100 ns</text>

  <!-- Tier 6: SSD -->
  <polygon points="165,330 595,330 622,374 138,374" fill="#bfdbfe"/>
  <text x="380" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">SSD — ~0.25–8 TB · ~100 µs</text>

  <!-- Tier 7: HDD -->
  <polygon points="133,382 627,382 654,426 106,426" fill="#dbeafe"/>
  <text x="380" y="410" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Hard disk (HDD) — up to ~20 TB · ~5–10 ms</text>

  <!-- Tier 8: Network storage -->
  <polygon points="101,434 659,434 686,478 74,478" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="380" y="462" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Network storage — effectively unlimited · ~0.5 ms (datacenter) to ~100 ms (internet)</text>

  <!-- Speed arrow (left, pointing up) -->
  <line x1="52" y1="440" x2="52" y2="120" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="52,106 44,124 60,124" fill="#1d4ed8"/>
  <text x="40" y="280" font-size="14" font-weight="bold" fill="#1d4ed8" transform="rotate(-90 40 280)" text-anchor="middle">faster, smaller, costlier per byte</text>

  <!-- Capacity arrow (right, pointing down) -->
  <line x1="742" y1="120" x2="742" y2="440" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="742,454 734,436 750,436" fill="#1d4ed8"/>
  <text x="756" y="280" font-size="14" font-weight="bold" fill="#1d4ed8" transform="rotate(90 756 280)" text-anchor="middle">larger, slower, cheaper per byte</text>

  <text x="380" y="516" text-anchor="middle" font-size="15" fill="#1a202c">Every figure is an approximate order of magnitude — real parts vary by chip, generation, and workload.</text>
  <text x="380" y="544" text-anchor="middle" font-size="14" fill="#1a202c">Volatile levels (registers through RAM) lose their contents at power-off; SSD and below are persistent.</text>
</svg>
