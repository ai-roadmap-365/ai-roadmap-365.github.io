<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each was a day of this week.">
  <title>Five pillars of a production platform</title>
  <style>
    .five-pillars-bg   { fill: #f8fafc; }
    .five-pillars-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .five-pillars-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .five-pillars-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .five-pillars-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .five-pillars-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .five-pillars-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .five-pillars-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .five-pillars-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .five-pillars-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .five-pillars-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .five-pillars-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .five-pillars-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .five-pillars-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .five-pillars-stage { opacity: 1; }

    .five-pillars-s0 { animation-delay: 0.00s; }
    .five-pillars-e0 { animation-delay: 0.00s; }
    .five-pillars-s1 { animation-delay: 1.33s; }
    .five-pillars-e1 { animation-delay: 1.33s; }
    .five-pillars-s2 { animation-delay: 2.67s; }
    .five-pillars-e2 { animation-delay: 2.67s; }
    .five-pillars-s3 { animation-delay: 4.00s; }
    .five-pillars-e3 { animation-delay: 4.00s; }
    .five-pillars-s4 { animation-delay: 5.33s; }
    .five-pillars-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .five-pillars-conn  { animation: five-pillars-trace 8s ease-in-out infinite; }
      .five-pillars-stage { animation: five-pillars-arrive 8s ease-in-out infinite; }
    }
    @keyframes five-pillars-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes five-pillars-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .five-pillars-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .five-pillars-stage { animation: five-pillars-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes five-pillars-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="five-pillars-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="five-pillars-bg" width="980" height="322"/>
  <text class="five-pillars-h1"  x="30" y="40">Five pillars of a production platform</text>
  <text class="five-pillars-sub" x="30" y="64">Each was a day of this week.</text>
  <g class="five-pillars-stage five-pillars-s0">
    <rect class="five-pillars-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="five-pillars-step" x="44" y="142">01</text>
    <text class="five-pillars-name" x="70" y="142">Infrastructure as code</text>
    <text class="five-pillars-desc" x="44" y="166">The cluster, the network,</text>
    <text class="five-pillars-desc" x="44" y="182">the IAM roles — reviewed,</text>
    <text class="five-pillars-desc" x="44" y="198">not clicked.</text>
    <text class="five-pillars-edge" x="44" y="242">Day 337</text>
  </g>
  <line class="five-pillars-line five-pillars-conn five-pillars-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#five-pillars-tip)"/>
  <g class="five-pillars-stage five-pillars-s1">
    <rect class="five-pillars-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="five-pillars-step" x="233" y="142">02</text>
    <text class="five-pillars-name" x="259" y="142">GPU serving</text>
    <text class="five-pillars-desc" x="233" y="166">Dynamic batching, KV</text>
    <text class="five-pillars-desc" x="233" y="182">cache bounds, saturation</text>
    <text class="five-pillars-desc" x="233" y="198">you can see.</text>
    <text class="five-pillars-edge" x="233" y="242">Day 338</text>
  </g>
  <line class="five-pillars-line five-pillars-conn five-pillars-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#five-pillars-tip)"/>
  <g class="five-pillars-stage five-pillars-s2">
    <rect class="five-pillars-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="five-pillars-step" x="422" y="142">03</text>
    <text class="five-pillars-name" x="448" y="142">Observability</text>
    <text class="five-pillars-desc" x="422" y="166">TTFT and ITL percentiles,</text>
    <text class="five-pillars-desc" x="422" y="182">error budgets, alerts</text>
    <text class="five-pillars-desc" x="422" y="198">that mean something.</text>
    <text class="five-pillars-edge" x="422" y="242">Day 339</text>
  </g>
  <line class="five-pillars-line five-pillars-conn five-pillars-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#five-pillars-tip)"/>
  <g class="five-pillars-stage five-pillars-s3">
    <rect class="five-pillars-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="five-pillars-step" x="611" y="142">04</text>
    <text class="five-pillars-name" x="637" y="142">Privacy and cost ledger</text>
    <text class="five-pillars-desc" x="611" y="166">PII scrubbed in memory;</text>
    <text class="five-pillars-desc" x="611" y="182">tokens attributed per</text>
    <text class="five-pillars-desc" x="611" y="198">tenant.</text>
    <text class="five-pillars-edge" x="611" y="242">Day 340</text>
  </g>
  <line class="five-pillars-line five-pillars-conn five-pillars-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#five-pillars-tip)"/>
  <g class="five-pillars-stage five-pillars-s4">
    <rect class="five-pillars-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="five-pillars-step" x="800" y="142">05</text>
    <text class="five-pillars-name" x="826" y="142">Incident response</text>
    <text class="five-pillars-desc" x="800" y="166">Automated rollback in 500</text>
    <text class="five-pillars-desc" x="800" y="182">ms, then a blameless</text>
    <text class="five-pillars-desc" x="800" y="198">review.</text>
    <text class="five-pillars-edge" x="800" y="242">Day 342</text>
  </g>
  <text class="five-pillars-sub" x="30" y="304">Each pillar is individually useful and the value is in the joins: a latency alert that cannot be drilled into a log record, or a log record with no tenant on it, leaves you with an observation rather than an answer.</text>
</svg>
