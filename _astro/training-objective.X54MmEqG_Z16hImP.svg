<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps, and it is simple.">
  <title>The objective</title>
  <style>
    .training-objective-bg   { fill: #f8fafc; }
    .training-objective-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .training-objective-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .training-objective-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .training-objective-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .training-objective-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .training-objective-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .training-objective-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .training-objective-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .training-objective-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .training-objective-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .training-objective-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .training-objective-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .training-objective-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .training-objective-stage { opacity: 1; }

    .training-objective-s0 { animation-delay: 0.00s; }
    .training-objective-e0 { animation-delay: 0.00s; }
    .training-objective-s1 { animation-delay: 1.28s; }
    .training-objective-e1 { animation-delay: 1.28s; }
    .training-objective-s2 { animation-delay: 2.56s; }
    .training-objective-e2 { animation-delay: 2.56s; }
    .training-objective-s3 { animation-delay: 3.84s; }
    .training-objective-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .training-objective-conn  { animation: training-objective-trace 6.4s ease-in-out infinite; }
      .training-objective-stage { animation: training-objective-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes training-objective-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes training-objective-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .training-objective-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .training-objective-stage { animation: training-objective-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes training-objective-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="training-objective-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="training-objective-bg" width="980" height="322"/>
  <text class="training-objective-h1"  x="30" y="40">The objective</text>
  <text class="training-objective-sub" x="30" y="64">Four steps, and it is simple.</text>
  <g class="training-objective-stage training-objective-s0">
    <rect class="training-objective-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="training-objective-step" x="44" y="142">01</text>
    <text class="training-objective-name" x="70" y="142">Pick a random image and a random step</text>
    <text class="training-objective-desc" x="44" y="166">Uniformly.</text>
  </g>
  <line class="training-objective-line training-objective-conn training-objective-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#training-objective-tip)"/>
  <g class="training-objective-stage training-objective-s1">
    <rect class="training-objective-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="training-objective-step" x="280" y="142">02</text>
    <text class="training-objective-name" x="306" y="142">Add the corresponding amount of noise</text>
    <text class="training-objective-desc" x="280" y="166">In one calculation, and remember</text>
    <text class="training-objective-desc" x="280" y="182">what was added.</text>
  </g>
  <line class="training-objective-line training-objective-conn training-objective-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#training-objective-tip)"/>
  <g class="training-objective-stage training-objective-s2">
    <rect class="training-objective-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="training-objective-step" x="516" y="142">03</text>
    <text class="training-objective-name" x="542" y="142">Ask the model to predict that noise</text>
    <text class="training-objective-desc" x="516" y="166">Given the noisy image and the</text>
    <text class="training-objective-desc" x="516" y="182">step number.</text>
  </g>
  <line class="training-objective-line training-objective-conn training-objective-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#training-objective-tip)"/>
  <g class="training-objective-stage training-objective-s3">
    <rect class="training-objective-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="training-objective-step" x="752" y="142">04</text>
    <text class="training-objective-name" x="778" y="142">And take the squared error</text>
    <text class="training-objective-desc" x="752" y="166">That is the entire loss.</text>
  </g>
  <text class="training-objective-sub" x="30" y="304">The simplicity is the reason this scales where adversarial training did not: there is one stable objective and no second network whose failure can destabilise the first.</text>
</svg>
