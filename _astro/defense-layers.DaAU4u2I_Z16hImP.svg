<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each removes a different route.">
  <title>Four layers, no single fix</title>
  <style>
    .defense-layers-bg   { fill: #f8fafc; }
    .defense-layers-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .defense-layers-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .defense-layers-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .defense-layers-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .defense-layers-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .defense-layers-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .defense-layers-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .defense-layers-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .defense-layers-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .defense-layers-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .defense-layers-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .defense-layers-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .defense-layers-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .defense-layers-stage { opacity: 1; }

    .defense-layers-s0 { animation-delay: 0.00s; }
    .defense-layers-e0 { animation-delay: 0.00s; }
    .defense-layers-s1 { animation-delay: 1.28s; }
    .defense-layers-e1 { animation-delay: 1.28s; }
    .defense-layers-s2 { animation-delay: 2.56s; }
    .defense-layers-e2 { animation-delay: 2.56s; }
    .defense-layers-s3 { animation-delay: 3.84s; }
    .defense-layers-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .defense-layers-conn  { animation: defense-layers-trace 6.4s ease-in-out infinite; }
      .defense-layers-stage { animation: defense-layers-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes defense-layers-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes defense-layers-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .defense-layers-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .defense-layers-stage { animation: defense-layers-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes defense-layers-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="defense-layers-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="defense-layers-bg" width="980" height="322"/>
  <text class="defense-layers-h1"  x="30" y="40">Four layers, no single fix</text>
  <text class="defense-layers-sub" x="30" y="64">Each removes a different route.</text>
  <g class="defense-layers-stage defense-layers-s0">
    <rect class="defense-layers-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="defense-layers-step" x="44" y="142">01</text>
    <text class="defense-layers-name" x="70" y="142">Input heuristics</text>
    <text class="defense-layers-desc" x="44" y="166">Cheap, and defeated alone.</text>
    <text class="defense-layers-desc" x="44" y="182">Character substitutions, other</text>
    <text class="defense-layers-desc" x="44" y="198">languages, Base64.</text>
  </g>
  <line class="defense-layers-line defense-layers-conn defense-layers-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#defense-layers-tip)"/>
  <g class="defense-layers-stage defense-layers-s1">
    <rect class="defense-layers-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="defense-layers-step" x="280" y="142">02</text>
    <text class="defense-layers-name" x="306" y="142">Structural delimiters</text>
    <text class="defense-layers-desc" x="280" y="166">User data inside explicit tags,</text>
    <text class="defense-layers-desc" x="280" y="182">with the tag characters escaped.</text>
    <text class="defense-layers-edge" x="280" y="242">&lt;1 ms</text>
  </g>
  <line class="defense-layers-line defense-layers-conn defense-layers-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#defense-layers-tip)"/>
  <g class="defense-layers-stage defense-layers-s2">
    <rect class="defense-layers-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="defense-layers-step" x="516" y="142">03</text>
    <text class="defense-layers-name" x="542" y="142">Quarantine the untrusted</text>
    <text class="defense-layers-desc" x="516" y="166">External documents extracted by</text>
    <text class="defense-layers-desc" x="516" y="182">a model with zero tools.</text>
    <text class="defense-layers-edge" x="516" y="242">isolation</text>
  </g>
  <line class="defense-layers-line defense-layers-conn defense-layers-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#defense-layers-tip)"/>
  <g class="defense-layers-stage defense-layers-s3">
    <rect class="defense-layers-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="defense-layers-step" x="752" y="142">04</text>
    <text class="defense-layers-name" x="778" y="142">Canary tokens outbound</text>
    <text class="defense-layers-desc" x="752" y="166">A secret in the system prompt.</text>
    <text class="defense-layers-desc" x="752" y="182">If it leaves, drop the response.</text>
    <text class="defense-layers-edge" x="752" y="242">detection</text>
  </g>
  <text class="defense-layers-sub" x="30" y="304">The fourth layer is different in kind from the other three: prevention tells you nothing when it fails, and a canary is the only control here that reports a successful attack while you can still act on it.</text>
</svg>
