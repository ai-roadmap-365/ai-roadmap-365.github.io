<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The first hour is transformative. The tenth is a hobby.">
  <title>Configure four things, then stop</title>
  <style>
    .four-things-to-configure-bg   { fill: #f8fafc; }
    .four-things-to-configure-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-things-to-configure-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-things-to-configure-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-things-to-configure-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-things-to-configure-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-things-to-configure-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .four-things-to-configure-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .four-things-to-configure-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .four-things-to-configure-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .four-things-to-configure-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .four-things-to-configure-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .four-things-to-configure-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .four-things-to-configure-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .four-things-to-configure-stage { opacity: 1; }

    .four-things-to-configure-s0 { animation-delay: 0.00s; }
    .four-things-to-configure-e0 { animation-delay: 0.00s; }
    .four-things-to-configure-s1 { animation-delay: 1.28s; }
    .four-things-to-configure-e1 { animation-delay: 1.28s; }
    .four-things-to-configure-s2 { animation-delay: 2.56s; }
    .four-things-to-configure-e2 { animation-delay: 2.56s; }
    .four-things-to-configure-s3 { animation-delay: 3.84s; }
    .four-things-to-configure-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .four-things-to-configure-conn  { animation: four-things-to-configure-trace 6.4s ease-in-out infinite; }
      .four-things-to-configure-stage { animation: four-things-to-configure-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes four-things-to-configure-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes four-things-to-configure-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .four-things-to-configure-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .four-things-to-configure-stage { animation: four-things-to-configure-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes four-things-to-configure-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="four-things-to-configure-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="four-things-to-configure-bg" width="980" height="322"/>
  <text class="four-things-to-configure-h1"  x="30" y="40">Configure four things, then stop</text>
  <text class="four-things-to-configure-sub" x="30" y="64">The first hour is transformative. The tenth is a hobby.</text>
  <g class="four-things-to-configure-stage four-things-to-configure-s0">
    <rect class="four-things-to-configure-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="four-things-to-configure-step" x="44" y="142">01</text>
    <text class="four-things-to-configure-name" x="70" y="142">Your language's server</text>
    <text class="four-things-to-configure-desc" x="44" y="166">Everything else in this list</text>
    <text class="four-things-to-configure-desc" x="44" y="182">depends on it working.</text>
    <text class="four-things-to-configure-edge" x="44" y="242">first</text>
  </g>
  <line class="four-things-to-configure-line four-things-to-configure-conn four-things-to-configure-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#four-things-to-configure-tip)"/>
  <g class="four-things-to-configure-stage four-things-to-configure-s1">
    <rect class="four-things-to-configure-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="four-things-to-configure-step" x="280" y="142">02</text>
    <text class="four-things-to-configure-name" x="306" y="142">Format on save</text>
    <text class="four-things-to-configure-desc" x="280" y="166">Ends every formatting argument,</text>
    <text class="four-things-to-configure-desc" x="280" y="182">permanently.</text>
    <text class="four-things-to-configure-edge" x="280" y="242">formatOnSave</text>
  </g>
  <line class="four-things-to-configure-line four-things-to-configure-conn four-things-to-configure-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#four-things-to-configure-tip)"/>
  <g class="four-things-to-configure-stage four-things-to-configure-s2">
    <rect class="four-things-to-configure-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="four-things-to-configure-step" x="516" y="142">03</text>
    <text class="four-things-to-configure-name" x="542" y="142">A linter</text>
    <text class="four-things-to-configure-desc" x="516" y="166">Catches the class of mistake</text>
    <text class="four-things-to-configure-desc" x="516" y="182">that is not worth a human's</text>
    <text class="four-things-to-configure-desc" x="516" y="198">attention.</text>
  </g>
  <line class="four-things-to-configure-line four-things-to-configure-conn four-things-to-configure-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#four-things-to-configure-tip)"/>
  <g class="four-things-to-configure-stage four-things-to-configure-s3">
    <rect class="four-things-to-configure-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="four-things-to-configure-step" x="752" y="142">04</text>
    <text class="four-things-to-configure-name" x="778" y="142">.editorconfig, committed</text>
    <text class="four-things-to-configure-desc" x="752" y="166">The one your team shares, and</text>
    <text class="four-things-to-configure-desc" x="752" y="182">the only one that works across</text>
    <text class="four-things-to-configure-desc" x="752" y="198">editors.</text>
    <text class="four-things-to-configure-edge" x="752" y="242">shared</text>
  </g>
  <text class="four-things-to-configure-sub" x="30" y="304">Note the asymmetry: three of these are yours, and the fourth belongs to the project. That is the one that stops two people's editors generating diffs nobody can review.</text>
</svg>
