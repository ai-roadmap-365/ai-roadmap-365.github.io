<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Waiting or working.">
  <title>One cook, many dishes</title>
  <style>
    .kitchen-work-bg   { fill: #f8fafc; }
    .kitchen-work-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-work-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-work-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-work-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-work-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-work-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kitchen-work-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .kitchen-work-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .kitchen-work-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .kitchen-work-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .kitchen-work-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .kitchen-work-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kitchen-work-row { opacity: 1; }
    .kitchen-work-r0 { animation-delay: 0.00s; }
    .kitchen-work-r1 { animation-delay: 0.45s; }
    .kitchen-work-r2 { animation-delay: 0.90s; }
    .kitchen-work-r3 { animation-delay: 1.35s; }
    .kitchen-work-r4 { animation-delay: 1.80s; }
    .kitchen-work-row { animation: kitchen-work-reveal 7.3s ease-in-out infinite; }
    @keyframes kitchen-work-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="kitchen-work-bg" width="980" height="390"/>
  <text class="kitchen-work-h1"  x="30" y="40">One cook, many dishes</text>
  <text class="kitchen-work-sub" x="30" y="64">Waiting or working.</text>
  <rect class="kitchen-work-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="kitchen-work-name" x="46" y="122">Interleaved</text>
  <text class="kitchen-work-desc" x="46" y="142">Everything progresses.</text>
  <text class="kitchen-work-desc kitchen-work-row kitchen-work-r0" x="46" y="182">Start the pot, then chop while it heats</text>
  <text class="kitchen-work-desc kitchen-work-row kitchen-work-r1" x="46" y="216">Waiting time is used</text>
  <text class="kitchen-work-desc kitchen-work-row kitchen-work-r2" x="46" y="250">One cook, several dishes</text>
  <text class="kitchen-work-desc kitchen-work-row kitchen-work-r3" x="46" y="284">Nothing is done twice as fast</text>
  <text class="kitchen-work-desc kitchen-work-row kitchen-work-r4" x="46" y="318">This is asynchronous execution</text>
  <rect class="kitchen-work-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="kitchen-work-name" x="526" y="122">Sequential</text>
  <text class="kitchen-work-desc" x="526" y="142">One at a time.</text>
  <text class="kitchen-work-desc kitchen-work-row kitchen-work-r0" x="526" y="182">Stand and watch the pot</text>
  <text class="kitchen-work-desc kitchen-work-row kitchen-work-r1" x="526" y="216">Waiting time is wasted</text>
  <text class="kitchen-work-desc kitchen-work-row kitchen-work-r2" x="526" y="250">One cook, one dish</text>
  <text class="kitchen-work-desc kitchen-work-row kitchen-work-r3" x="526" y="284">Total time is the sum</text>
  <text class="kitchen-work-desc kitchen-work-row kitchen-work-r4" x="526" y="318">This is blocking code</text>
  <text class="kitchen-work-sub" x="30" y="372">Nothing being done twice as fast is the honest caveat: interleaving removes idle time, and it does not make any individual task quicker.</text>
</svg>
