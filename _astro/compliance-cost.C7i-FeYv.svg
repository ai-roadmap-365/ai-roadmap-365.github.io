<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Against the cost of not having it.">
  <title>The cost of governance</title>
  <style>
    .compliance-cost-bg   { fill: #f8fafc; }
    .compliance-cost-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compliance-cost-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compliance-cost-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compliance-cost-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compliance-cost-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compliance-cost-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .compliance-cost-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .compliance-cost-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .compliance-cost-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .compliance-cost-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .compliance-cost-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .compliance-cost-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .compliance-cost-row { opacity: 1; }
    .compliance-cost-r0 { animation-delay: 0.00s; }
    .compliance-cost-r1 { animation-delay: 0.45s; }
    .compliance-cost-r2 { animation-delay: 0.90s; }
    .compliance-cost-r3 { animation-delay: 1.35s; }
    .compliance-cost-r4 { animation-delay: 1.80s; }
    .compliance-cost-row { animation: compliance-cost-reveal 7.3s ease-in-out infinite; }
    @keyframes compliance-cost-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="compliance-cost-bg" width="980" height="390"/>
  <text class="compliance-cost-h1"  x="30" y="40">The cost of governance</text>
  <text class="compliance-cost-sub" x="30" y="64">Against the cost of not having it.</text>
  <rect class="compliance-cost-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="compliance-cost-name" x="46" y="122">Governance</text>
  <text class="compliance-cost-desc" x="46" y="142">Under 1% of engineering.</text>
  <text class="compliance-cost-desc compliance-cost-row compliance-cost-r0" x="46" y="182">A CI job computing fairness metrics</text>
  <text class="compliance-cost-desc compliance-cost-row compliance-cost-r1" x="46" y="216">A generated model card per release</text>
  <text class="compliance-cost-desc compliance-cost-row compliance-cost-r2" x="46" y="250">A risk tier recorded once, reviewed on change</text>
  <text class="compliance-cost-desc compliance-cost-row compliance-cost-r3" x="46" y="284">And enterprise deals close 3x faster</text>
  <text class="compliance-cost-desc compliance-cost-row compliance-cost-r4" x="46" y="318">Because the risk committee is already satisfied</text>
  <rect class="compliance-cost-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="compliance-cost-name" x="526" y="122">Non-compliance</text>
  <text class="compliance-cost-desc" x="526" y="142">Up to 7% of turnover.</text>
  <text class="compliance-cost-desc compliance-cost-row compliance-cost-r0" x="526" y="182">EU AI Act fines to 35 million euros</text>
  <text class="compliance-cost-desc compliance-cost-row compliance-cost-r1" x="526" y="216">Mandatory recall of deployed systems</text>
  <text class="compliance-cost-desc compliance-cost-row compliance-cost-r2" x="526" y="250">Six-month procurement reviews</text>
  <text class="compliance-cost-desc compliance-cost-row compliance-cost-r3" x="526" y="284">Or a deal that does not happen</text>
  <text class="compliance-cost-desc compliance-cost-row compliance-cost-r4" x="526" y="318">Reputational cost on top</text>
  <text class="compliance-cost-sub" x="30" y="372">The procurement point is the one that persuades a business fastest: certification and automated model cards turn a six-month enterprise security review into under forty-eight hours, which is a revenue argument rather than a risk one.</text>
</svg>
