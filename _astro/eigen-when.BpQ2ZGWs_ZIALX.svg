<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when it does not.">
  <title>When eigen-decomposition helps</title>
  <style>
    .eigen-when-bg   { fill: #f8fafc; }
    .eigen-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eigen-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eigen-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eigen-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eigen-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eigen-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eigen-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eigen-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eigen-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eigen-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eigen-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eigen-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eigen-when-row { opacity: 1; }
    .eigen-when-r0 { animation-delay: 0.00s; }
    .eigen-when-r1 { animation-delay: 0.45s; }
    .eigen-when-r2 { animation-delay: 0.90s; }
    .eigen-when-r3 { animation-delay: 1.35s; }
    .eigen-when-r4 { animation-delay: 1.80s; }
    .eigen-when-row { animation: eigen-when-reveal 7.3s ease-in-out infinite; }
    @keyframes eigen-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="eigen-when-bg" width="980" height="390"/>
  <text class="eigen-when-h1"  x="30" y="40">When eigen-decomposition helps</text>
  <text class="eigen-when-sub" x="30" y="64">And when it does not.</text>
  <rect class="eigen-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="eigen-when-name" x="46" y="122">Use it</text>
  <text class="eigen-when-desc" x="46" y="142">Four cases.</text>
  <text class="eigen-when-desc eigen-when-row eigen-when-r0" x="46" y="182">Dimensionality reduction on correlated features</text>
  <text class="eigen-when-desc eigen-when-row eigen-when-r1" x="46" y="216">Understanding a transformation's structure</text>
  <text class="eigen-when-desc eigen-when-row eigen-when-r2" x="46" y="250">Diagnosing numerical conditioning</text>
  <text class="eigen-when-desc eigen-when-row eigen-when-r3" x="46" y="284">Spectral clustering and graph analysis</text>
  <text class="eigen-when-desc eigen-when-row eigen-when-r4" x="46" y="318">Where only a few components are needed</text>
  <rect class="eigen-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="eigen-when-name" x="526" y="122">Use something else</text>
  <text class="eigen-when-desc" x="526" y="142">Also four.</text>
  <text class="eigen-when-desc eigen-when-row eigen-when-r0" x="526" y="182">Non-square matrices — use singular values instead</text>
  <text class="eigen-when-desc eigen-when-row eigen-when-r1" x="526" y="216">Where interpretability is required</text>
  <text class="eigen-when-desc eigen-when-row eigen-when-r2" x="526" y="250">Very large dense matrices</text>
  <text class="eigen-when-desc eigen-when-row eigen-when-r3" x="526" y="284">Categorical or sparse data</text>
  <text class="eigen-when-desc eigen-when-row eigen-when-r4" x="526" y="318">When a supervised method would do</text>
  <text class="eigen-when-sub" x="30" y="372">The first row of the second column matters in practice: real data matrices are rarely square, and the singular value decomposition is the general tool.</text>
</svg>
