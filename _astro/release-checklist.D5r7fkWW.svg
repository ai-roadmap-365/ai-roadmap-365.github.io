<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps, and the last is the one people forget.">
  <title>Cutting a release</title>
  <style>
    .release-checklist-bg   { fill: #f8fafc; }
    .release-checklist-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .release-checklist-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .release-checklist-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .release-checklist-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .release-checklist-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .release-checklist-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .release-checklist-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .release-checklist-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .release-checklist-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .release-checklist-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .release-checklist-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .release-checklist-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .release-checklist-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .release-checklist-stage { opacity: 1; }

    .release-checklist-s0 { animation-delay: 0.00s; }
    .release-checklist-e0 { animation-delay: 0.00s; }
    .release-checklist-s1 { animation-delay: 1.28s; }
    .release-checklist-e1 { animation-delay: 1.28s; }
    .release-checklist-s2 { animation-delay: 2.56s; }
    .release-checklist-e2 { animation-delay: 2.56s; }
    .release-checklist-s3 { animation-delay: 3.84s; }
    .release-checklist-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .release-checklist-conn  { animation: release-checklist-trace 6.4s ease-in-out infinite; }
      .release-checklist-stage { animation: release-checklist-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes release-checklist-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes release-checklist-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .release-checklist-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .release-checklist-stage { animation: release-checklist-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes release-checklist-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="release-checklist-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="release-checklist-bg" width="980" height="322"/>
  <text class="release-checklist-h1"  x="30" y="40">Cutting a release</text>
  <text class="release-checklist-sub" x="30" y="64">Four steps, and the last is the one people forget.</text>
  <g class="release-checklist-stage release-checklist-s0">
    <rect class="release-checklist-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="release-checklist-step" x="44" y="142">01</text>
    <text class="release-checklist-name" x="70" y="142">Decide the version</text>
    <text class="release-checklist-desc" x="44" y="166">From the commit log: any</text>
    <text class="release-checklist-desc" x="44" y="182">breaking change, any feature, or</text>
    <text class="release-checklist-desc" x="44" y="198">only fixes.</text>
    <text class="release-checklist-edge" x="44" y="242">semver</text>
  </g>
  <line class="release-checklist-line release-checklist-conn release-checklist-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#release-checklist-tip)"/>
  <g class="release-checklist-stage release-checklist-s1">
    <rect class="release-checklist-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="release-checklist-step" x="280" y="142">02</text>
    <text class="release-checklist-name" x="306" y="142">Tag it, annotated</text>
    <text class="release-checklist-desc" x="280" y="166">git tag -a v1.5.0 -m "..." —</text>
    <text class="release-checklist-desc" x="280" y="182">carries the tagger, the date and</text>
    <text class="release-checklist-desc" x="280" y="198">a message.</text>
    <text class="release-checklist-edge" x="280" y="242">-a</text>
  </g>
  <line class="release-checklist-line release-checklist-conn release-checklist-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#release-checklist-tip)"/>
  <g class="release-checklist-stage release-checklist-s2">
    <rect class="release-checklist-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="release-checklist-step" x="516" y="142">03</text>
    <text class="release-checklist-name" x="542" y="142">Write the changelog</text>
    <text class="release-checklist-desc" x="516" y="166">The commit log already contains</text>
    <text class="release-checklist-desc" x="516" y="182">it if the messages were written</text>
    <text class="release-checklist-desc" x="516" y="198">for a reader.</text>
  </g>
  <line class="release-checklist-line release-checklist-conn release-checklist-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#release-checklist-tip)"/>
  <g class="release-checklist-stage release-checklist-s3">
    <rect class="release-checklist-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="release-checklist-step" x="752" y="142">04</text>
    <text class="release-checklist-name" x="778" y="142">Push the tag</text>
    <text class="release-checklist-desc" x="752" y="166">Tags do NOT go with a normal</text>
    <text class="release-checklist-desc" x="752" y="182">push. git push --tags, or nobody</text>
    <text class="release-checklist-desc" x="752" y="198">sees it.</text>
    <text class="release-checklist-edge" x="752" y="242">--tags</text>
  </g>
  <text class="release-checklist-sub" x="30" y="304">That last step catches almost everyone once: the release exists locally, the version is decided, and the tag is nowhere the rest of the team can see it.</text>
</svg>
