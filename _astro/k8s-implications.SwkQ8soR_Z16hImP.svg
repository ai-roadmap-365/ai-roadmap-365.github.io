<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One of them relocates your security boundary.">
  <title>Five consequences of the loop</title>
  <style>
    .k8s-implications-bg   { fill: #f8fafc; }
    .k8s-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .k8s-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .k8s-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .k8s-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .k8s-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .k8s-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .k8s-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .k8s-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .k8s-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .k8s-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .k8s-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .k8s-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .k8s-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .k8s-implications-stage { opacity: 1; }

    .k8s-implications-s0 { animation-delay: 0.00s; }
    .k8s-implications-e0 { animation-delay: 0.00s; }
    .k8s-implications-s1 { animation-delay: 1.33s; }
    .k8s-implications-e1 { animation-delay: 1.33s; }
    .k8s-implications-s2 { animation-delay: 2.67s; }
    .k8s-implications-e2 { animation-delay: 2.67s; }
    .k8s-implications-s3 { animation-delay: 4.00s; }
    .k8s-implications-e3 { animation-delay: 4.00s; }
    .k8s-implications-s4 { animation-delay: 5.33s; }
    .k8s-implications-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .k8s-implications-conn  { animation: k8s-implications-trace 8s ease-in-out infinite; }
      .k8s-implications-stage { animation: k8s-implications-arrive 8s ease-in-out infinite; }
    }
    @keyframes k8s-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes k8s-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .k8s-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .k8s-implications-stage { animation: k8s-implications-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes k8s-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="k8s-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="k8s-implications-bg" width="980" height="322"/>
  <text class="k8s-implications-h1"  x="30" y="40">Five consequences of the loop</text>
  <text class="k8s-implications-sub" x="30" y="64">One of them relocates your security boundary.</text>
  <g class="k8s-implications-stage k8s-implications-s0">
    <rect class="k8s-implications-warn" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="k8s-implications-step" x="44" y="142">01</text>
    <text class="k8s-implications-name" x="70" y="142">Manual changes have a short half-life</text>
    <text class="k8s-implications-desc" x="44" y="166">The loop erases them.</text>
    <text class="k8s-implications-desc" x="44" y="182">Changing your manifests</text>
    <text class="k8s-implications-desc" x="44" y="198">is the permanent change.</text>
    <text class="k8s-implications-edge" x="44" y="242">security</text>
  </g>
  <line class="k8s-implications-line k8s-implications-conn k8s-implications-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#k8s-implications-tip)"/>
  <g class="k8s-implications-stage k8s-implications-s1">
    <rect class="k8s-implications-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="k8s-implications-step" x="233" y="142">02</text>
    <text class="k8s-implications-name" x="259" y="142">The manifest repo is production</text>
    <text class="k8s-implications-desc" x="233" y="166">With the review</text>
    <text class="k8s-implications-desc" x="233" y="182">requirements that</text>
    <text class="k8s-implications-desc" x="233" y="198">implies.</text>
  </g>
  <line class="k8s-implications-line k8s-implications-conn k8s-implications-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#k8s-implications-tip)"/>
  <g class="k8s-implications-stage k8s-implications-s2">
    <rect class="k8s-implications-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="k8s-implications-step" x="422" y="142">03</text>
    <text class="k8s-implications-name" x="448" y="142">Pending is the usual mystery</text>
    <text class="k8s-implications-desc" x="422" y="166">A pod that cannot be</text>
    <text class="k8s-implications-desc" x="422" y="182">placed stays Pending.</text>
    <text class="k8s-implications-desc" x="422" y="198">"Why is nothing</text>
    <text class="k8s-implications-edge" x="422" y="242">performance</text>
  </g>
  <line class="k8s-implications-line k8s-implications-conn k8s-implications-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#k8s-implications-tip)"/>
  <g class="k8s-implications-stage k8s-implications-s3">
    <rect class="k8s-implications-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="k8s-implications-step" x="611" y="142">04</text>
    <text class="k8s-implications-name" x="637" y="142">Scaling limits move elsewhere</text>
    <text class="k8s-implications-desc" x="611" y="166">Connection pools,</text>
    <text class="k8s-implications-desc" x="611" y="182">database capacity,</text>
    <text class="k8s-implications-desc" x="611" y="198">per-tenant quotas.</text>
    <text class="k8s-implications-edge" x="611" y="242">scalability</text>
  </g>
  <line class="k8s-implications-line k8s-implications-conn k8s-implications-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#k8s-implications-tip)"/>
  <g class="k8s-implications-stage k8s-implications-s4">
    <rect class="k8s-implications-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="k8s-implications-step" x="800" y="142">05</text>
    <text class="k8s-implications-name" x="826" y="142">Requests reserve whether used or not</text>
    <text class="k8s-implications-desc" x="800" y="166">Over-requesting is</text>
    <text class="k8s-implications-desc" x="800" y="182">invisible until someone</text>
    <text class="k8s-implications-desc" x="800" y="198">graphs requested against</text>
    <text class="k8s-implications-edge" x="800" y="242">money</text>
  </g>
  <text class="k8s-implications-sub" x="30" y="304">The asymmetry in the first two rows is the argument: an attacker who modifies a running pod has made a change that expires, and one who modifies a manifest has made one that persists and propagates.</text>
</svg>
