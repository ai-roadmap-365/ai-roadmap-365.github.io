<svg role="img" aria-label="Diagnostic decision flowchart for debugging neural network training failures mapping loss symptoms to root causes and fixes" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Neural Network Training Failure Diagnostic Decision Tree</title>
  <defs>
    <linearGradient id="bg209a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card209" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg209a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">NEURAL TRAINING FAILURE DIAGNOSTIC MATRIX</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Systematic Protocols for Diagnosing and Resolving Deep Learning Divergence</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card209)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Symptom 1: Loss is NaN -->
    <rect x="25" y="25" width="165" height="115" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" rx="6"/>
    <text x="107" y="48" fill="#fb7185" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Symptom: Loss is NaN</text>
    <text x="107" y="70" fill="#cbd5e1" font-size="8" text-anchor="middle">Root Cause: Exploding Grad,</text>
    <text x="107" y="85" fill="#cbd5e1" font-size="8" text-anchor="middle">Log(0), or Division by 0</text>
    <text x="107" y="108" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Fix: clip_grad_norm_(1.0),</text>
    <text x="107" y="122" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">torch.autocast, add eps</text>

    <!-- Symptom 2: Loss Stuck at ln(K) -->
    <rect x="210" y="25" width="165" height="115" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="292" y="48" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Symptom: Loss Stagnates</text>
    <text x="292" y="70" fill="#cbd5e1" font-size="8" text-anchor="middle">Root Cause: Dead ReLUs,</text>
    <text x="292" y="85" fill="#cbd5e1" font-size="8" text-anchor="middle">Zero Gradients, Low LR</text>
    <text x="292" y="108" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">Fix: He/Kaiming Init,</text>
    <text x="292" y="122" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">Add BatchNorm, Boost LR</text>

    <!-- Symptom 3: Overfitting Sanity Fails -->
    <rect x="395" y="25" width="165" height="115" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" rx="6"/>
    <text x="477" y="48" fill="#c084fc" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Symptom: Cannot Overfit 1 Batch</text>
    <text x="477" y="70" fill="#cbd5e1" font-size="8" text-anchor="middle">Root Cause: Broken Backprop,</text>
    <text x="477" y="85" fill="#cbd5e1" font-size="8" text-anchor="middle">Target Label Misalignment</text>
    <text x="477" y="108" fill="#f8fafc" font-size="8" font-weight="700" text-anchor="middle">Fix: Overfit 10 samples to 0.0</text>
    <text x="477" y="122" fill="#f8fafc" font-size="8" font-weight="700" text-anchor="middle">Verify optimizer.zero_grad()</text>

    <!-- Symptom 4: Generalization Gap -->
    <rect x="580" y="25" width="155" height="115" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="657" y="48" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Symptom: High Val Gap</text>
    <text x="657" y="70" fill="#cbd5e1" font-size="8" text-anchor="middle">Root Cause: Overfitting /</text>
    <text x="657" y="85" fill="#cbd5e1" font-size="8" text-anchor="middle">Distribution Shift</text>
    <text x="657" y="108" fill="#10b981" font-size="8" font-weight="700" text-anchor="middle">Fix: Add Dropout (0.3),</text>
    <text x="657" y="122" fill="#10b981" font-size="8" font-weight="700" text-anchor="middle">Weight Decay, Augmentation</text>

    <!-- Bottom Banner: Diagnostic Toolkit -->
    <rect x="25" y="160" width="710" height="110" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="380" y="185" fill="#34d399" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">The 4-Step Golden Debugging Protocol</text>
    <text x="380" y="210" fill="#f8fafc" font-size="10" text-anchor="middle">1. Overfit a single batch of 16 samples to exactly 0.000 loss (Proves math &amp; graph correctness)</text>
    <text x="380" y="230" fill="#cbd5e1" font-size="9" text-anchor="middle">2. Check initial loss equals theoretical baseline: -ln(1/K) for classification or Var(Y) for regression</text>
    <text x="380" y="250" fill="#cbd5e1" font-size="9" text-anchor="middle">3. Enable torch.autograd.set_detect_anomaly(True) to pinpoint exact NaN-generating graph operations</text>
  </g>
</svg>
