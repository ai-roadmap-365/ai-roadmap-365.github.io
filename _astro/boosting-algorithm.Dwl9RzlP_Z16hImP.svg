<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five steps, looped.">
  <title>The algorithm</title>
  <style>
    .boosting-algorithm-bg   { fill: #f8fafc; }
    .boosting-algorithm-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boosting-algorithm-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boosting-algorithm-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boosting-algorithm-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boosting-algorithm-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boosting-algorithm-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .boosting-algorithm-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .boosting-algorithm-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .boosting-algorithm-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .boosting-algorithm-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .boosting-algorithm-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .boosting-algorithm-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .boosting-algorithm-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .boosting-algorithm-stage { opacity: 1; }

    .boosting-algorithm-s0 { animation-delay: 0.00s; }
    .boosting-algorithm-e0 { animation-delay: 0.00s; }
    .boosting-algorithm-s1 { animation-delay: 1.33s; }
    .boosting-algorithm-e1 { animation-delay: 1.33s; }
    .boosting-algorithm-s2 { animation-delay: 2.67s; }
    .boosting-algorithm-e2 { animation-delay: 2.67s; }
    .boosting-algorithm-s3 { animation-delay: 4.00s; }
    .boosting-algorithm-e3 { animation-delay: 4.00s; }
    .boosting-algorithm-s4 { animation-delay: 5.33s; }
    .boosting-algorithm-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .boosting-algorithm-conn  { animation: boosting-algorithm-trace 8s ease-in-out infinite; }
      .boosting-algorithm-stage { animation: boosting-algorithm-arrive 8s ease-in-out infinite; }
    }
    @keyframes boosting-algorithm-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes boosting-algorithm-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .boosting-algorithm-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .boosting-algorithm-stage { animation: boosting-algorithm-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes boosting-algorithm-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="boosting-algorithm-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="boosting-algorithm-bg" width="980" height="322"/>
  <text class="boosting-algorithm-h1"  x="30" y="40">The algorithm</text>
  <text class="boosting-algorithm-sub" x="30" y="64">Five steps, looped.</text>
  <g class="boosting-algorithm-stage boosting-algorithm-s0">
    <rect class="boosting-algorithm-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="boosting-algorithm-step" x="44" y="142">01</text>
    <text class="boosting-algorithm-name" x="70" y="142">Predict with the ensemble so far</text>
    <text class="boosting-algorithm-desc" x="44" y="166">Which starts as a</text>
    <text class="boosting-algorithm-desc" x="44" y="182">constant.</text>
  </g>
  <line class="boosting-algorithm-line boosting-algorithm-conn boosting-algorithm-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#boosting-algorithm-tip)"/>
  <g class="boosting-algorithm-stage boosting-algorithm-s1">
    <rect class="boosting-algorithm-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="boosting-algorithm-step" x="233" y="142">02</text>
    <text class="boosting-algorithm-name" x="259" y="142">Compute the gradient at each training point</text>
    <text class="boosting-algorithm-desc" x="233" y="166">The direction each</text>
    <text class="boosting-algorithm-desc" x="233" y="182">prediction should move.</text>
  </g>
  <line class="boosting-algorithm-line boosting-algorithm-conn boosting-algorithm-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#boosting-algorithm-tip)"/>
  <g class="boosting-algorithm-stage boosting-algorithm-s2">
    <rect class="boosting-algorithm-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="boosting-algorithm-step" x="422" y="142">03</text>
    <text class="boosting-algorithm-name" x="448" y="142">Fit a shallow tree to those gradients</text>
    <text class="boosting-algorithm-desc" x="422" y="166">Depth three to six,</text>
    <text class="boosting-algorithm-desc" x="422" y="182">typically.</text>
  </g>
  <line class="boosting-algorithm-line boosting-algorithm-conn boosting-algorithm-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#boosting-algorithm-tip)"/>
  <g class="boosting-algorithm-stage boosting-algorithm-s3">
    <rect class="boosting-algorithm-good" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="boosting-algorithm-step" x="611" y="142">04</text>
    <text class="boosting-algorithm-name" x="637" y="142">Set each leaf to its optimal value</text>
    <text class="boosting-algorithm-desc" x="611" y="166">Using gradients and</text>
    <text class="boosting-algorithm-desc" x="611" y="182">curvature.</text>
  </g>
  <line class="boosting-algorithm-line boosting-algorithm-conn boosting-algorithm-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#boosting-algorithm-tip)"/>
  <g class="boosting-algorithm-stage boosting-algorithm-s4">
    <rect class="boosting-algorithm-warn" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="boosting-algorithm-step" x="800" y="142">05</text>
    <text class="boosting-algorithm-name" x="826" y="142">And add it, scaled by the learning rate</text>
    <text class="boosting-algorithm-desc" x="800" y="166">Small steps, many of</text>
    <text class="boosting-algorithm-desc" x="800" y="182">them.</text>
  </g>
  <text class="boosting-algorithm-sub" x="30" y="304">The learning rate and the number of trees trade against each other directly: halving the rate roughly doubles the trees needed for the same fit.</text>
</svg>
