<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Borrowed from the web.">
  <title>Four steps to streamed generation</title>
  <style>
    .streaming-history-bg   { fill: #f8fafc; }
    .streaming-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .streaming-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .streaming-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .streaming-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .streaming-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .streaming-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .streaming-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .streaming-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .streaming-history-stage { opacity: 1; }

    .streaming-history-s0 { animation-delay: 0.00s; }
    .streaming-history-e0 { animation-delay: 0.00s; }
    .streaming-history-s1 { animation-delay: 1.28s; }
    .streaming-history-e1 { animation-delay: 1.28s; }
    .streaming-history-s2 { animation-delay: 2.56s; }
    .streaming-history-e2 { animation-delay: 2.56s; }
    .streaming-history-s3 { animation-delay: 3.84s; }
    .streaming-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .streaming-history-conn  { animation: streaming-history-trace 6.4s ease-in-out infinite; }
      .streaming-history-stage { animation: streaming-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes streaming-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes streaming-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .streaming-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .streaming-history-stage { animation: streaming-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes streaming-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="streaming-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="streaming-history-bg" width="980" height="322"/>
  <text class="streaming-history-h1"  x="30" y="40">Four steps to streamed generation</text>
  <text class="streaming-history-sub" x="30" y="64">Borrowed from the web.</text>
  <g class="streaming-history-stage streaming-history-s0">
    <rect class="streaming-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="streaming-history-step" x="44" y="142">01</text>
    <text class="streaming-history-name" x="70" y="142">Responses sent complete</text>
    <text class="streaming-history-desc" x="44" y="166">The default for most of the</text>
    <text class="streaming-history-desc" x="44" y="182">web's history.</text>
  </g>
  <line class="streaming-history-line streaming-history-conn streaming-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#streaming-history-tip)"/>
  <g class="streaming-history-stage streaming-history-s1">
    <rect class="streaming-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="streaming-history-step" x="280" y="142">02</text>
    <text class="streaming-history-name" x="306" y="142">Chunked transfer</text>
    <text class="streaming-history-desc" x="280" y="166">Which allowed a response to</text>
    <text class="streaming-history-desc" x="280" y="182">begin before it was finished.</text>
  </g>
  <line class="streaming-history-line streaming-history-conn streaming-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#streaming-history-tip)"/>
  <g class="streaming-history-stage streaming-history-s2">
    <rect class="streaming-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="streaming-history-step" x="516" y="142">03</text>
    <text class="streaming-history-name" x="542" y="142">Server-sent events</text>
    <text class="streaming-history-desc" x="516" y="166">A simple one-way event stream</text>
    <text class="streaming-history-desc" x="516" y="182">over the same protocol.</text>
  </g>
  <line class="streaming-history-line streaming-history-conn streaming-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#streaming-history-tip)"/>
  <g class="streaming-history-stage streaming-history-s3">
    <rect class="streaming-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="streaming-history-step" x="752" y="142">04</text>
    <text class="streaming-history-name" x="778" y="142">Then model output over the same mechanism</text>
    <text class="streaming-history-desc" x="752" y="166">No new protocol was needed at</text>
    <text class="streaming-history-desc" x="752" y="182">all.</text>
  </g>
  <text class="streaming-history-sub" x="30" y="304">Nothing here was invented for language models: an existing web mechanism happened to fit a workload that produces its output incrementally.</text>
</svg>
