<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Where accuracy is meaningless.">
  <title>Searching for something rare</title>
  <style>
    .security-screening-bg   { fill: #f8fafc; }
    .security-screening-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .security-screening-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .security-screening-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .security-screening-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .security-screening-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .security-screening-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .security-screening-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .security-screening-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .security-screening-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .security-screening-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .security-screening-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .security-screening-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .security-screening-row { opacity: 1; }
    .security-screening-r0 { animation-delay: 0.00s; }
    .security-screening-r1 { animation-delay: 0.45s; }
    .security-screening-r2 { animation-delay: 0.90s; }
    .security-screening-r3 { animation-delay: 1.35s; }
    .security-screening-r4 { animation-delay: 1.80s; }
    .security-screening-row { animation: security-screening-reveal 7.3s ease-in-out infinite; }
    @keyframes security-screening-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="security-screening-bg" width="980" height="390"/>
  <text class="security-screening-h1"  x="30" y="40">Searching for something rare</text>
  <text class="security-screening-sub" x="30" y="64">Where accuracy is meaningless.</text>
  <rect class="security-screening-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="security-screening-name" x="46" y="122">Optimising accuracy</text>
  <text class="security-screening-desc" x="46" y="142">Wave everyone through.</text>
  <text class="security-screening-desc security-screening-row security-screening-r0" x="46" y="182">Almost everyone is harmless</text>
  <text class="security-screening-desc security-screening-row security-screening-r1" x="46" y="216">So passing everyone is highly accurate</text>
  <text class="security-screening-desc security-screening-row security-screening-r2" x="46" y="250">And catches nothing at all</text>
  <text class="security-screening-desc security-screening-row security-screening-r3" x="46" y="284">The metric endorses doing nothing</text>
  <text class="security-screening-desc security-screening-row security-screening-r4" x="46" y="318">This is unweighted training</text>
  <rect class="security-screening-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="security-screening-name" x="526" y="122">Optimising recall</text>
  <text class="security-screening-desc" x="526" y="142">Accept false alarms.</text>
  <text class="security-screening-desc security-screening-row security-screening-r0" x="526" y="182">Stop anything remotely suspicious</text>
  <text class="security-screening-desc security-screening-row security-screening-r1" x="526" y="216">Accuracy falls sharply</text>
  <text class="security-screening-desc security-screening-row security-screening-r2" x="526" y="250">But the rare case is caught</text>
  <text class="security-screening-desc security-screening-row security-screening-r3" x="526" y="284">The metric reflects the purpose</text>
  <text class="security-screening-desc security-screening-row security-screening-r4" x="526" y="318">This is cost-sensitive training</text>
  <text class="security-screening-sub" x="30" y="372">Any screening operation is run on the second column's logic, which is a useful reminder that the default metric encodes an assumption nobody stated.</text>
</svg>
