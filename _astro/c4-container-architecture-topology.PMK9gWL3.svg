<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="C4 Container Architecture Topology">
  <title>C4 Container Architecture Topology</title>
  <defs>
    <style>
      .d352a-bg { fill: #f8fafc; }
      .d352a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d352a-front { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d352a-back { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d352a-data { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d352a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d352a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d352a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d352a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d352a-bg" />
  
  <text x="40" y="40" class="d352a-title">Capstone Architecture: C4 Container Topology</text>
  <text x="40" y="65" class="d352a-subtitle">C4 Container Architecture Topology showing Client Layer, Next.js Gateway, FastAPI Orchestrator, Qdrant Vector DB, PostgreSQL, and LLM Serving Cluster</text>
  
  <!-- Frontend Container -->
  <rect x="40" y="110" width="250" height="280" class="d352a-front" />
  <text x="55" y="145" class="d352a-header" fill="#1d4ed8">1. Presentation Container</text>
  <text x="55" y="180" class="d352a-text">• Next.js 15 App Router</text>
  <text x="55" y="205" class="d352a-text">• Server-Sent Events (SSE)</text>
  <text x="55" y="230" class="d352a-text">• Markdown &amp; Citation Viewer</text>
  <text x="55" y="255" class="d352a-text">• Optimistic UI State Store</text>
  <text x="55" y="300" class="d352a-text" font-weight="600" fill="#1d4ed8">Protocol: HTTPS / WSS</text>
  
  <!-- Backend Container -->
  <rect x="315" y="110" width="270" height="280" class="d352a-back" />
  <text x="330" y="145" class="d352a-header" fill="#15803d">2. AI Orchestration API</text>
  <text x="330" y="180" class="d352a-text">• FastAPI Async Engine</text>
  <text x="330" y="205" class="d352a-text">• Zero-Knowledge PII Vault</text>
  <text x="330" y="230" class="d352a-text">• ReAct Agentic Loop &amp; Router</text>
  <text x="330" y="255" class="d352a-text">• OpenTelemetry Tracing</text>
  <text x="330" y="300" class="d352a-text" font-weight="600" fill="#15803d">Protocol: gRPC / HTTP</text>
  
  <!-- Data & Model Container -->
  <rect x="610" y="110" width="250" height="280" class="d352a-data" />
  <text x="625" y="145" class="d352a-header" fill="#7e22ce">3. Storage &amp; Inference</text>
  <text x="625" y="180" class="d352a-text">• Qdrant Hybrid Vector DB</text>
  <text x="625" y="205" class="d352a-text">• PostgreSQL Relational Store</text>
  <text x="625" y="230" class="d352a-text">• Redis Response Cache</text>
  <text x="625" y="255" class="d352a-text">• vLLM / Cloud LLM Cluster</text>
  <text x="625" y="300" class="d352a-text" font-weight="600" fill="#7e22ce">Protocol: TCP / mTLS</text>
</svg>