<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Checking between steps, or pouring it all in cold.">
  <title>Cooking a sauce</title>
  <style>
    .chef-analogy-bg   { fill: #f8fafc; }
    .chef-analogy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chef-analogy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chef-analogy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chef-analogy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chef-analogy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chef-analogy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chef-analogy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .chef-analogy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .chef-analogy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .chef-analogy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .chef-analogy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .chef-analogy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chef-analogy-row { opacity: 1; }
    .chef-analogy-r0 { animation-delay: 0.00s; }
    .chef-analogy-r1 { animation-delay: 0.45s; }
    .chef-analogy-r2 { animation-delay: 0.90s; }
    .chef-analogy-r3 { animation-delay: 1.35s; }
    .chef-analogy-r4 { animation-delay: 1.80s; }
    .chef-analogy-row { animation: chef-analogy-reveal 7.3s ease-in-out infinite; }
    @keyframes chef-analogy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="chef-analogy-bg" width="980" height="390"/>
  <text class="chef-analogy-h1"  x="30" y="40">Cooking a sauce</text>
  <text class="chef-analogy-sub" x="30" y="64">Checking between steps, or pouring it all in cold.</text>
  <rect class="chef-analogy-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="chef-analogy-name" x="46" y="122">Check between steps</text>
  <text class="chef-analogy-desc" x="46" y="142">Observe, then continue.</text>
  <text class="chef-analogy-desc chef-analogy-row chef-analogy-r0" x="46" y="182">Reduce the vinegar; check it is two tablespoons</text>
  <text class="chef-analogy-desc chef-analogy-row chef-analogy-r1" x="46" y="216">Then whisk the yolks over low steam</text>
  <text class="chef-analogy-desc chef-analogy-row chef-analogy-r2" x="46" y="250">Watch for the emulsion to thicken</text>
  <text class="chef-analogy-desc chef-analogy-row chef-analogy-r3" x="46" y="284">Each step conditioned on the last result</text>
  <text class="chef-analogy-desc chef-analogy-row chef-analogy-r4" x="46" y="318">The sauce holds</text>
  <rect class="chef-analogy-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="chef-analogy-name" x="526" y="122">All at once, cold</text>
  <text class="chef-analogy-desc" x="526" y="142">No intermediate check.</text>
  <text class="chef-analogy-desc chef-analogy-row chef-analogy-r0" x="526" y="182">Every ingredient into a cold pot</text>
  <text class="chef-analogy-desc chef-analogy-row chef-analogy-r1" x="526" y="216">No temperature checked</text>
  <text class="chef-analogy-desc chef-analogy-row chef-analogy-r2" x="526" y="250">No stage verified</text>
  <text class="chef-analogy-desc chef-analogy-row chef-analogy-r3" x="526" y="284">Errors compound invisibly</text>
  <text class="chef-analogy-desc chef-analogy-row chef-analogy-r4" x="526" y="318">The sauce splits</text>
  <text class="chef-analogy-sub" x="30" y="372">The split sauce is greedy myopia in a kitchen: nothing went wrong dramatically, and a sequence of unverified steps produced a result that cannot be recovered from.</text>
</svg>
