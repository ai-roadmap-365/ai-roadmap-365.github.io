<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Similar discipline, different assertions.">
  <title>Prompt testing against code testing</title>
  <style>
    .prompts-vs-code-bg   { fill: #f8fafc; }
    .prompts-vs-code-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompts-vs-code-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompts-vs-code-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompts-vs-code-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompts-vs-code-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompts-vs-code-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prompts-vs-code-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .prompts-vs-code-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .prompts-vs-code-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .prompts-vs-code-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .prompts-vs-code-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .prompts-vs-code-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prompts-vs-code-row { opacity: 1; }
    .prompts-vs-code-r0 { animation-delay: 0.00s; }
    .prompts-vs-code-r1 { animation-delay: 0.45s; }
    .prompts-vs-code-r2 { animation-delay: 0.90s; }
    .prompts-vs-code-r3 { animation-delay: 1.35s; }
    .prompts-vs-code-r4 { animation-delay: 1.80s; }
    .prompts-vs-code-row { animation: prompts-vs-code-reveal 7.3s ease-in-out infinite; }
    @keyframes prompts-vs-code-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="prompts-vs-code-bg" width="980" height="390"/>
  <text class="prompts-vs-code-h1"  x="30" y="40">Prompt testing against code testing</text>
  <text class="prompts-vs-code-sub" x="30" y="64">Similar discipline, different assertions.</text>
  <rect class="prompts-vs-code-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="prompts-vs-code-name" x="46" y="122">Code tests</text>
  <text class="prompts-vs-code-desc" x="46" y="142">Deterministic.</text>
  <text class="prompts-vs-code-desc prompts-vs-code-row prompts-vs-code-r0" x="46" y="182">Same input, same output, always</text>
  <text class="prompts-vs-code-desc prompts-vs-code-row prompts-vs-code-r1" x="46" y="216">Exact assertions</text>
  <text class="prompts-vs-code-desc prompts-vs-code-row prompts-vs-code-r2" x="46" y="250">Pass or fail</text>
  <text class="prompts-vs-code-desc prompts-vs-code-row prompts-vs-code-r3" x="46" y="284">Fast and free</text>
  <text class="prompts-vs-code-desc prompts-vs-code-row prompts-vs-code-r4" x="46" y="318">A failure means a defect</text>
  <rect class="prompts-vs-code-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="prompts-vs-code-name" x="526" y="122">Prompt tests</text>
  <text class="prompts-vs-code-desc" x="526" y="142">Statistical.</text>
  <text class="prompts-vs-code-desc prompts-vs-code-row prompts-vs-code-r0" x="526" y="182">Same input, different output</text>
  <text class="prompts-vs-code-desc prompts-vs-code-row prompts-vs-code-r1" x="526" y="216">Property assertions and thresholds</text>
  <text class="prompts-vs-code-desc prompts-vs-code-row prompts-vs-code-r2" x="526" y="250">A pass rate, not a pass</text>
  <text class="prompts-vs-code-desc prompts-vs-code-row prompts-vs-code-r3" x="526" y="284">Slow, and billed</text>
  <text class="prompts-vs-code-desc prompts-vs-code-row prompts-vs-code-r4" x="526" y="318">A failure may be variance</text>
  <text class="prompts-vs-code-sub" x="30" y="372">The move from pass to pass rate is the adjustment that matters, and it means a threshold has to be chosen deliberately rather than defaulting to everything passing.</text>
</svg>
