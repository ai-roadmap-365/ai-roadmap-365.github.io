<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="1280" height="700" role="img" aria-labelledby="d085f-title d085f-desc">
  <title id="d085f-title">The life of one SELECT: from SQL text through parsing, planning and bytecode to page reads and result rows</title>
  <desc id="d085f-desc">A left-to-right pipeline for a single SELECT statement. The SQL text is tokenized and parsed into a tree, the planner chooses how to find the rows, a bytecode program is produced, and a virtual machine runs it. Beneath the virtual machine, page requests go to the page cache and, on a miss, down to the four-kilobyte pages of the database file, with the pages travelling back up. Result rows return to the caller one at a time, one per step. Every label is present whether or not the picture is moving.</desc>

  <style>
    .d085f-bg     { fill: #f8fafc; }
    .d085f-title  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 22px; font-weight: 600; fill: #1a202c; }
    .d085f-lede   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #334155; }
    .d085f-label  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 600; fill: #1a202c; }
    .d085f-sub    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d085f-mono   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; fill: #1a202c; }
    .d085f-box    { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }

    /* Motion 3 — each stage lights up in turn. The resting fill is readable. */
    .d085f-stage  { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5;
                    animation: d085f-lift 8s ease-in-out infinite; }
    .d085f-s1 { animation-delay: 0.0s; }
    .d085f-s2 { animation-delay: 1.1s; }
    .d085f-s3 { animation-delay: 2.2s; }
    .d085f-s4 { animation-delay: 3.3s; }
    .d085f-s5 { animation-delay: 4.4s; }
    .d085f-s6 { animation-delay: 5.2s; }
    .d085f-s7 { animation-delay: 6.0s; }
    @keyframes d085f-lift {
      0%, 16%, 100% { fill: #e0e7ff; }
      5%, 11%       { fill: #bfdbfe; }
    }

    /* Motion 2 — the wires flow. Reduced motion makes them solid arrows. */
    .d085f-wire {
      fill: none; stroke: #1d4ed8; stroke-width: 2.5;
      stroke-dasharray: 10 8; animation: d085f-march 1.8s linear infinite;
    }
    .d085f-wiredown {
      fill: none; stroke: #7c3aed; stroke-width: 2.5;
      stroke-dasharray: 9 7; animation: d085f-march 2.2s linear infinite;
    }
    @keyframes d085f-march { to { stroke-dashoffset: -18; } }

    /* Motion 1 — the statement travels the pipeline, resting at the start. */
    .d085f-token { fill: #1d4ed8; animation: d085f-travel 8s ease-in-out infinite; }
    .d085f-tokentext { fill: #1d4ed8; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                       font-size: 14px; animation: d085f-travel 8s ease-in-out infinite; }
    @keyframes d085f-travel {
      0%, 6%    { transform: translateX(0);     opacity: 1; }
      62%, 100% { transform: translateX(954px); opacity: 1; }
    }

    /* The result path is emphasised once the rows are ready. */
    .d085f-result { stroke: #047857; stroke-width: 2.5; fill: none;
                    animation: d085f-reveal 8s ease-in-out infinite; }
    @keyframes d085f-reveal {
      0%, 70%   { opacity: 0.85; }
      78%, 100% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d085f-stage     { animation: none; fill: #e0e7ff; }
      .d085f-wire      { animation: none; stroke-dasharray: none; }
      .d085f-wiredown  { animation: none; stroke-dasharray: none; }
      .d085f-token     { animation: none; transform: none; opacity: 1; }
      .d085f-tokentext { animation: none; transform: none; opacity: 1; }
      .d085f-result    { animation: none; opacity: 1; }
    }
  </style>

  <defs>
    <marker id="d085f-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
    <marker id="d085f-arrowviolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed" />
    </marker>
    <marker id="d085f-arrowgreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857" />
    </marker>
  </defs>

  <rect class="d085f-bg" x="0" y="0" width="1280" height="700" />

  <text class="d085f-title" x="40" y="42">The life of one SELECT</text>
  <text class="d085f-lede" x="40" y="70">You wrote WHAT you wanted. Everything below is the engine deciding HOW — and doing it.</text>

  <!-- the travelling statement -->
  <circle class="d085f-token" cx="135" cy="132" r="9" />
  <text class="d085f-tokentext" x="152" y="137">SELECT title, author, year FROM books WHERE year &lt; 1980 ORDER BY year</text>

  <!-- ============ the five pipeline stages ============ -->
  <rect class="d085f-stage d085f-s1" x="40" y="170" width="190" height="92" rx="8" />
  <text class="d085f-label" x="135" y="200" text-anchor="middle">1. SQL text</text>
  <text class="d085f-sub" x="135" y="222" text-anchor="middle">a string, nothing more</text>
  <text class="d085f-sub" x="135" y="243" text-anchor="middle">no promise of validity</text>

  <path class="d085f-wire" d="M 234 216 L 266 216" marker-end="url(#d085f-arrow)" />

  <rect class="d085f-stage d085f-s2" x="272" y="170" width="206" height="92" rx="8" />
  <text class="d085f-label" x="375" y="200" text-anchor="middle">2. Tokenize + parse</text>
  <text class="d085f-sub" x="375" y="222" text-anchor="middle">text to tokens to a tree</text>
  <text class="d085f-sub" x="375" y="243" text-anchor="middle">a syntax error stops here</text>

  <path class="d085f-wire" d="M 482 216 L 514 216" marker-end="url(#d085f-arrow)" />

  <rect class="d085f-stage d085f-s3" x="520" y="170" width="190" height="92" rx="8" />
  <text class="d085f-label" x="615" y="200" text-anchor="middle">3. Plan</text>
  <text class="d085f-sub" x="615" y="222" text-anchor="middle">index or full scan?</text>
  <text class="d085f-sub" x="615" y="243" text-anchor="middle">which order, which join</text>

  <path class="d085f-wire" d="M 714 216 L 746 216" marker-end="url(#d085f-arrow)" />

  <rect class="d085f-stage d085f-s4" x="752" y="170" width="200" height="92" rx="8" />
  <text class="d085f-label" x="852" y="200" text-anchor="middle">4. Bytecode</text>
  <text class="d085f-sub" x="852" y="222" text-anchor="middle">a prepared statement</text>
  <text class="d085f-sub" x="852" y="243" text-anchor="middle">reusable with new values</text>

  <path class="d085f-wire" d="M 956 216 L 988 216" marker-end="url(#d085f-arrow)" />

  <rect class="d085f-stage d085f-s5" x="994" y="170" width="206" height="92" rx="8" />
  <text class="d085f-label" x="1097" y="200" text-anchor="middle">5. Virtual machine</text>
  <text class="d085f-sub" x="1097" y="222" text-anchor="middle">runs the instructions</text>
  <text class="d085f-sub" x="1097" y="243" text-anchor="middle">one step, one row</text>

  <!-- what the planner actually chose, printed as fact -->
  <text class="d085f-sub" x="520" y="292">EXPLAIN QUERY PLAN, with no index on year:</text>
  <text class="d085f-mono" x="520" y="313">SCAN books</text>
  <text class="d085f-mono" x="520" y="333">USE TEMP B-TREE FOR ORDER BY</text>
  <text class="d085f-sub" x="520" y="356">Add an index and it chooses differently:</text>
  <text class="d085f-mono" x="520" y="377">SEARCH books USING INDEX books_year</text>
  <text class="d085f-sub" x="520" y="400">Same four rows either way. Only the work changed.</text>

  <!-- ============ storage, beneath the machine ============ -->
  <path class="d085f-wiredown" d="M 1097 266 L 1097 306" marker-end="url(#d085f-arrowviolet)" />
  <text class="d085f-sub" x="1114" y="292">give me page 3</text>

  <rect class="d085f-stage d085f-s6" x="994" y="310" width="206" height="74" rx="8" />
  <text class="d085f-label" x="1097" y="338" text-anchor="middle">6. Page cache</text>
  <text class="d085f-sub" x="1097" y="360" text-anchor="middle">already in memory? done</text>

  <path class="d085f-wiredown" d="M 1097 388 L 1097 428" marker-end="url(#d085f-arrowviolet)" />
  <text class="d085f-sub" x="1114" y="414">on a miss only</text>

  <rect class="d085f-stage d085f-s7" x="994" y="432" width="206" height="74" rx="8" />
  <text class="d085f-label" x="1097" y="460" text-anchor="middle">7. B-tree pages</text>
  <text class="d085f-sub" x="1097" y="482" text-anchor="middle">4,096 bytes at a time</text>

  <path class="d085f-wiredown" d="M 1097 510 L 1097 546" marker-end="url(#d085f-arrowviolet)" />

  <rect class="d085f-box" x="964" y="550" width="266" height="46" rx="6" />
  <text class="d085f-sub" x="1097" y="578" text-anchor="middle">library.db — one ordinary file</text>

  <path class="d085f-wiredown" d="M 972 470 L 940 470 L 940 348 L 986 348" marker-end="url(#d085f-arrowviolet)" />
  <text class="d085f-sub" x="800" y="470">the page travels back up</text>

  <!-- ============ the rows come back ============ -->
  <path class="d085f-result" d="M 1040 266 L 1040 620 L 250 620 L 250 588" marker-end="url(#d085f-arrowgreen)" />

  <rect class="d085f-box" x="60" y="490" width="380" height="96" rx="8" />
  <text class="d085f-label" x="250" y="518" text-anchor="middle">Result rows, one at a time</text>
  <text class="d085f-mono" x="80" y="542">1968  The Art of Computer Programming</text>
  <text class="d085f-mono" x="80" y="562">1970  A Relational Model of Data</text>
  <text class="d085f-mono" x="80" y="578">1975 ... 1976 ...            4 rows total</text>

  <text class="d085f-sub" x="60" y="638">Each step returns one row. Nothing materialises the whole answer unless you ask it to.</text>

  <!-- resting-state honesty note -->
  <text class="d085f-sub" x="60" y="668">Resting state: all seven stages shaded, every arrow drawn, the statement at stage 1, all labels present.</text>
  <text class="d085f-sub" x="60" y="688">With reduced motion requested the animation stops and this resting state is the whole diagram.</text>

  <!-- the one thing you never wrote -->
  <text class="d085f-sub" x="40" y="292">You wrote stage 1.</text>
  <text class="d085f-sub" x="40" y="313">Stages 2 to 7 are the</text>
  <text class="d085f-sub" x="40" y="333">loop you would</text>
  <text class="d085f-sub" x="40" y="353">otherwise have written</text>
  <text class="d085f-sub" x="40" y="373">by hand — and the</text>
  <text class="d085f-sub" x="40" y="393">engine may write it</text>
  <text class="d085f-sub" x="40" y="413">differently tomorrow.</text>
</svg>
