<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things a pipeline is not</title>
  <style>
    .pipeline-not-bg   { fill: #f8fafc; }
    .pipeline-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pipeline-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pipeline-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pipeline-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pipeline-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pipeline-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pipeline-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pipeline-not-row { opacity: 1; }
    .pipeline-not-r0 { animation-delay: 0.00s; }
    .pipeline-not-r1 { animation-delay: 0.45s; }
    .pipeline-not-r2 { animation-delay: 0.90s; }
    .pipeline-not-r3 { animation-delay: 1.35s; }
    .pipeline-not-r4 { animation-delay: 1.80s; }
    .pipeline-not-row { animation: pipeline-not-reveal 7.3s ease-in-out infinite; }
    @keyframes pipeline-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="pipeline-not-bg" width="980" height="390"/>
  <text class="pipeline-not-h1"  x="30" y="40">Four things a pipeline is not</text>
  <text class="pipeline-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="pipeline-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="pipeline-not-name" x="46" y="122">The misconception</text>
  <text class="pipeline-not-desc" x="46" y="142">Commonly held.</text>
  <text class="pipeline-not-desc pipeline-not-row pipeline-not-r0" x="46" y="182">It runs once and is finished</text>
  <text class="pipeline-not-desc pipeline-not-row pipeline-not-r1" x="46" y="216">Sources keep their shape</text>
  <text class="pipeline-not-desc pipeline-not-row pipeline-not-r2" x="46" y="250">A successful exit means correct data</text>
  <text class="pipeline-not-desc pipeline-not-row pipeline-not-r3" x="46" y="284">Reruns are always safe</text>
  <text class="pipeline-not-desc pipeline-not-row pipeline-not-r4" x="46" y="318">Errors will be noticed</text>
  <rect class="pipeline-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="pipeline-not-name" x="526" y="122">What is true</text>
  <text class="pipeline-not-desc" x="526" y="142">Actually.</text>
  <text class="pipeline-not-desc pipeline-not-row pipeline-not-r0" x="526" y="182">It runs on a schedule, indefinitely</text>
  <text class="pipeline-not-desc pipeline-not-row pipeline-not-r1" x="526" y="216">They change without warning</text>
  <text class="pipeline-not-desc pipeline-not-row pipeline-not-r2" x="526" y="250">Check the counts, not just the code</text>
  <text class="pipeline-not-desc pipeline-not-row pipeline-not-r3" x="526" y="284">Only if loading is idempotent</text>
  <text class="pipeline-not-desc pipeline-not-row pipeline-not-r4" x="526" y="318">Only if something is watching</text>
  <text class="pipeline-not-sub" x="30" y="372">Sources changing without warning is the defining reality of pipeline work, and validation at the boundary is what turns a silent corruption into a clear failure.</text>
</svg>
