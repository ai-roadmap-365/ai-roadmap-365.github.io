<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Factorised attention</title>
  <style>
    .factorized-attention-bg   { fill: #f8fafc; }
    .factorized-attention-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .factorized-attention-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .factorized-attention-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .factorized-attention-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .factorized-attention-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .factorized-attention-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .factorized-attention-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .factorized-attention-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .factorized-attention-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .factorized-attention-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .factorized-attention-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .factorized-attention-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .factorized-attention-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .factorized-attention-stage { opacity: 1; }

    .factorized-attention-s0 { animation-delay: 0.00s; }
    .factorized-attention-e0 { animation-delay: 0.00s; }
    .factorized-attention-s1 { animation-delay: 1.28s; }
    .factorized-attention-e1 { animation-delay: 1.28s; }
    .factorized-attention-s2 { animation-delay: 2.56s; }
    .factorized-attention-e2 { animation-delay: 2.56s; }
    .factorized-attention-s3 { animation-delay: 3.84s; }
    .factorized-attention-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .factorized-attention-conn  { animation: factorized-attention-trace 6.4s ease-in-out infinite; }
      .factorized-attention-stage { animation: factorized-attention-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes factorized-attention-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes factorized-attention-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .factorized-attention-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .factorized-attention-stage { animation: factorized-attention-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes factorized-attention-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="factorized-attention-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="factorized-attention-bg" width="980" height="322"/>
  <text class="factorized-attention-h1"  x="30" y="40">Factorised attention</text>
  <text class="factorized-attention-sub" x="30" y="64">Four steps.</text>
  <g class="factorized-attention-stage factorized-attention-s0">
    <rect class="factorized-attention-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="factorized-attention-step" x="44" y="142">01</text>
    <text class="factorized-attention-name" x="70" y="142">Full attention over every position in every frame</text>
    <text class="factorized-attention-desc" x="44" y="166">Quadratic in frames multiplied</text>
    <text class="factorized-attention-desc" x="44" y="182">by pixels.</text>
  </g>
  <line class="factorized-attention-line factorized-attention-conn factorized-attention-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#factorized-attention-tip)"/>
  <g class="factorized-attention-stage factorized-attention-s1">
    <rect class="factorized-attention-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="factorized-attention-step" x="280" y="142">02</text>
    <text class="factorized-attention-name" x="306" y="142">Split it into two separate passes</text>
    <text class="factorized-attention-desc" x="280" y="166">Rather than one over everything.</text>
  </g>
  <line class="factorized-attention-line factorized-attention-conn factorized-attention-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#factorized-attention-tip)"/>
  <g class="factorized-attention-stage factorized-attention-s2">
    <rect class="factorized-attention-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="factorized-attention-step" x="516" y="142">03</text>
    <text class="factorized-attention-name" x="542" y="142">Attend within each frame, then across frames at each position</text>
    <text class="factorized-attention-desc" x="516" y="166">Spatial, then temporal.</text>
  </g>
  <line class="factorized-attention-line factorized-attention-conn factorized-attention-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#factorized-attention-tip)"/>
  <g class="factorized-attention-stage factorized-attention-s3">
    <rect class="factorized-attention-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="factorized-attention-step" x="752" y="142">04</text>
    <text class="factorized-attention-name" x="778" y="142">Which reduces the cost enormously</text>
    <text class="factorized-attention-desc" x="752" y="166">For a small loss in</text>
    <text class="factorized-attention-desc" x="752" y="182">expressiveness.</text>
    <text class="factorized-attention-edge" x="752" y="242">tractable</text>
  </g>
  <text class="factorized-attention-sub" x="30" y="304">The same factorisation trick recurs throughout deep learning — separable convolutions use it too — and it is almost always the first thing tried when a cost is quadratic.</text>
</svg>
