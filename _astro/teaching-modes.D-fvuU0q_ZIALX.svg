<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By what the learner is told.">
  <title>Three ways to teach</title>
  <style>
    .teaching-modes-bg   { fill: #f8fafc; }
    .teaching-modes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .teaching-modes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .teaching-modes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .teaching-modes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .teaching-modes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .teaching-modes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .teaching-modes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .teaching-modes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .teaching-modes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .teaching-modes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .teaching-modes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .teaching-modes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .teaching-modes-row { opacity: 1; }
    .teaching-modes-r0 { animation-delay: 0.00s; }
    .teaching-modes-r1 { animation-delay: 0.45s; }
    .teaching-modes-r2 { animation-delay: 0.90s; }
    .teaching-modes-r3 { animation-delay: 1.35s; }
    .teaching-modes-r4 { animation-delay: 1.80s; }
    .teaching-modes-row { animation: teaching-modes-reveal 7.3s ease-in-out infinite; }
    @keyframes teaching-modes-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="teaching-modes-bg" width="980" height="390"/>
  <text class="teaching-modes-h1"  x="30" y="40">Three ways to teach</text>
  <text class="teaching-modes-sub" x="30" y="64">By what the learner is told.</text>
  <rect class="teaching-modes-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="teaching-modes-name" x="46" y="122">The mode</text>
  <text class="teaching-modes-desc" x="46" y="142">What the learner gets.</text>
  <text class="teaching-modes-desc teaching-modes-row teaching-modes-r0" x="46" y="182">Worked answers to copy</text>
  <text class="teaching-modes-desc teaching-modes-row teaching-modes-r1" x="46" y="216">A pile of material and no questions</text>
  <text class="teaching-modes-desc teaching-modes-row teaching-modes-r2" x="46" y="250">A score after each attempt</text>
  <text class="teaching-modes-desc teaching-modes-row teaching-modes-r3" x="46" y="284">Nothing until the end of the year</text>
  <text class="teaching-modes-desc teaching-modes-row teaching-modes-r4" x="46" y="318">Which shapes what can be learned</text>
  <rect class="teaching-modes-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="teaching-modes-name" x="526" y="122">The paradigm</text>
  <text class="teaching-modes-desc" x="526" y="142">What it corresponds to.</text>
  <text class="teaching-modes-desc teaching-modes-row teaching-modes-r0" x="526" y="182">Supervised learning</text>
  <text class="teaching-modes-desc teaching-modes-row teaching-modes-r1" x="526" y="216">Unsupervised learning</text>
  <text class="teaching-modes-desc teaching-modes-row teaching-modes-r2" x="526" y="250">Reinforcement with immediate reward</text>
  <text class="teaching-modes-desc teaching-modes-row teaching-modes-r3" x="526" y="284">Reinforcement with delayed reward</text>
  <text class="teaching-modes-desc teaching-modes-row teaching-modes-r4" x="526" y="318">And how hard the learning is</text>
  <text class="teaching-modes-sub" x="30" y="372">The fourth row is the hardest in both settings, which is why credit assignment is the defining difficulty of reinforcement learning.</text>
</svg>
