<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward specialisation.">
  <title>Four steps in collection types</title>
  <style>
    .collections-history-bg   { fill: #f8fafc; }
    .collections-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collections-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collections-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collections-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collections-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collections-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .collections-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .collections-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .collections-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .collections-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .collections-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .collections-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .collections-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .collections-history-stage { opacity: 1; }

    .collections-history-s0 { animation-delay: 0.00s; }
    .collections-history-e0 { animation-delay: 0.00s; }
    .collections-history-s1 { animation-delay: 1.28s; }
    .collections-history-e1 { animation-delay: 1.28s; }
    .collections-history-s2 { animation-delay: 2.56s; }
    .collections-history-e2 { animation-delay: 2.56s; }
    .collections-history-s3 { animation-delay: 3.84s; }
    .collections-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .collections-history-conn  { animation: collections-history-trace 6.4s ease-in-out infinite; }
      .collections-history-stage { animation: collections-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes collections-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes collections-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .collections-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .collections-history-stage { animation: collections-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes collections-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="collections-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="collections-history-bg" width="980" height="322"/>
  <text class="collections-history-h1"  x="30" y="40">Four steps in collection types</text>
  <text class="collections-history-sub" x="30" y="64">Toward specialisation.</text>
  <g class="collections-history-stage collections-history-s0">
    <rect class="collections-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="collections-history-step" x="44" y="142">01</text>
    <text class="collections-history-name" x="70" y="142">One sequence type, used for everything</text>
    <text class="collections-history-desc" x="44" y="166">Which made every operation a</text>
    <text class="collections-history-desc" x="44" y="182">scan.</text>
  </g>
  <line class="collections-history-line collections-history-conn collections-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#collections-history-tip)"/>
  <g class="collections-history-stage collections-history-s1">
    <rect class="collections-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="collections-history-step" x="280" y="142">02</text>
    <text class="collections-history-name" x="306" y="142">Then distinct types for distinct access patterns</text>
    <text class="collections-history-desc" x="280" y="166">Ordered, keyed, unique.</text>
  </g>
  <line class="collections-history-line collections-history-conn collections-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#collections-history-tip)"/>
  <g class="collections-history-stage collections-history-s2">
    <rect class="collections-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="collections-history-step" x="516" y="142">03</text>
    <text class="collections-history-name" x="542" y="142">Hash-based containers made lookup constant</text>
    <text class="collections-history-desc" x="516" y="166">Which changed which algorithms</text>
    <text class="collections-history-desc" x="516" y="182">were practical.</text>
  </g>
  <line class="collections-history-line collections-history-conn collections-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#collections-history-tip)"/>
  <g class="collections-history-stage collections-history-s3">
    <rect class="collections-history-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="collections-history-step" x="752" y="142">04</text>
    <text class="collections-history-name" x="778" y="142">And specialised variants for specific costs</text>
    <text class="collections-history-desc" x="752" y="166">Deques, counters, ordered maps.</text>
  </g>
  <text class="collections-history-sub" x="30" y="304">The proliferation of container types is not complexity for its own sake: each exists because one access pattern was expensive in all the others.</text>
</svg>
