<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four reasons, mostly not technical.">
  <title>Why projects fail</title>
  <style>
    .lifecycle-idea-bg   { fill: #f8fafc; }
    .lifecycle-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lifecycle-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lifecycle-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lifecycle-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lifecycle-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lifecycle-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lifecycle-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .lifecycle-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .lifecycle-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .lifecycle-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .lifecycle-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .lifecycle-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .lifecycle-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .lifecycle-idea-stage { opacity: 1; }

    .lifecycle-idea-s0 { animation-delay: 0.00s; }
    .lifecycle-idea-e0 { animation-delay: 0.00s; }
    .lifecycle-idea-s1 { animation-delay: 1.28s; }
    .lifecycle-idea-e1 { animation-delay: 1.28s; }
    .lifecycle-idea-s2 { animation-delay: 2.56s; }
    .lifecycle-idea-e2 { animation-delay: 2.56s; }
    .lifecycle-idea-s3 { animation-delay: 3.84s; }
    .lifecycle-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .lifecycle-idea-conn  { animation: lifecycle-idea-trace 6.4s ease-in-out infinite; }
      .lifecycle-idea-stage { animation: lifecycle-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes lifecycle-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes lifecycle-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .lifecycle-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .lifecycle-idea-stage { animation: lifecycle-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes lifecycle-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="lifecycle-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="lifecycle-idea-bg" width="980" height="322"/>
  <text class="lifecycle-idea-h1"  x="30" y="40">Why projects fail</text>
  <text class="lifecycle-idea-sub" x="30" y="64">Four reasons, mostly not technical.</text>
  <g class="lifecycle-idea-stage lifecycle-idea-s0">
    <rect class="lifecycle-idea-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="lifecycle-idea-step" x="44" y="142">01</text>
    <text class="lifecycle-idea-name" x="70" y="142">Solving a problem nobody needed solved</text>
    <text class="lifecycle-idea-desc" x="44" y="166">Which no amount of accuracy</text>
    <text class="lifecycle-idea-desc" x="44" y="182">rescues.</text>
  </g>
  <line class="lifecycle-idea-line lifecycle-idea-conn lifecycle-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#lifecycle-idea-tip)"/>
  <g class="lifecycle-idea-stage lifecycle-idea-s1">
    <rect class="lifecycle-idea-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="lifecycle-idea-step" x="280" y="142">02</text>
    <text class="lifecycle-idea-name" x="306" y="142">Data that does not exist, or cannot be used</text>
    <text class="lifecycle-idea-desc" x="280" y="166">Discovered after the project</text>
    <text class="lifecycle-idea-desc" x="280" y="182">started.</text>
  </g>
  <line class="lifecycle-idea-line lifecycle-idea-conn lifecycle-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#lifecycle-idea-tip)"/>
  <g class="lifecycle-idea-stage lifecycle-idea-s2">
    <rect class="lifecycle-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="lifecycle-idea-step" x="516" y="142">03</text>
    <text class="lifecycle-idea-name" x="542" y="142">No route from a notebook to production</text>
    <text class="lifecycle-idea-desc" x="516" y="166">Which strands a working model.</text>
  </g>
  <line class="lifecycle-idea-line lifecycle-idea-conn lifecycle-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#lifecycle-idea-tip)"/>
  <g class="lifecycle-idea-stage lifecycle-idea-s3">
    <rect class="lifecycle-idea-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="lifecycle-idea-step" x="752" y="142">04</text>
    <text class="lifecycle-idea-name" x="778" y="142">And nobody owning it after launch</text>
    <text class="lifecycle-idea-desc" x="752" y="166">So it decays until it is</text>
    <text class="lifecycle-idea-desc" x="752" y="182">switched off.</text>
  </g>
  <text class="lifecycle-idea-sub" x="30" y="304">None of these four is a modelling failure, which is why a project plan that begins at the modelling stage is already most of the way to failing.</text>
</svg>
