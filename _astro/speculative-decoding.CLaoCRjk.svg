<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Draft, then verify in parallel.">
  <title>Speculative decoding</title>
  <style>
    .speculative-decoding-bg   { fill: #f8fafc; }
    .speculative-decoding-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speculative-decoding-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speculative-decoding-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speculative-decoding-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speculative-decoding-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speculative-decoding-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .speculative-decoding-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .speculative-decoding-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .speculative-decoding-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .speculative-decoding-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .speculative-decoding-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .speculative-decoding-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .speculative-decoding-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .speculative-decoding-stage { opacity: 1; }

    .speculative-decoding-s0 { animation-delay: 0.00s; }
    .speculative-decoding-e0 { animation-delay: 0.00s; }
    .speculative-decoding-s1 { animation-delay: 1.28s; }
    .speculative-decoding-e1 { animation-delay: 1.28s; }
    .speculative-decoding-s2 { animation-delay: 2.56s; }
    .speculative-decoding-e2 { animation-delay: 2.56s; }
    .speculative-decoding-s3 { animation-delay: 3.84s; }
    .speculative-decoding-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .speculative-decoding-conn  { animation: speculative-decoding-trace 6.4s ease-in-out infinite; }
      .speculative-decoding-stage { animation: speculative-decoding-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes speculative-decoding-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes speculative-decoding-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .speculative-decoding-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .speculative-decoding-stage { animation: speculative-decoding-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes speculative-decoding-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="speculative-decoding-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="speculative-decoding-bg" width="980" height="322"/>
  <text class="speculative-decoding-h1"  x="30" y="40">Speculative decoding</text>
  <text class="speculative-decoding-sub" x="30" y="64">Draft, then verify in parallel.</text>
  <g class="speculative-decoding-stage speculative-decoding-s0">
    <rect class="speculative-decoding-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="speculative-decoding-step" x="44" y="142">01</text>
    <text class="speculative-decoding-name" x="70" y="142">A small draft model proposes k tokens</text>
    <text class="speculative-decoding-desc" x="44" y="166">Cheap, and often right on</text>
    <text class="speculative-decoding-desc" x="44" y="182">predictable spans.</text>
  </g>
  <line class="speculative-decoding-line speculative-decoding-conn speculative-decoding-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#speculative-decoding-tip)"/>
  <g class="speculative-decoding-stage speculative-decoding-s1">
    <rect class="speculative-decoding-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="speculative-decoding-step" x="280" y="142">02</text>
    <text class="speculative-decoding-name" x="306" y="142">The target model verifies all k at once</text>
    <text class="speculative-decoding-desc" x="280" y="166">One forward pass. Verification</text>
    <text class="speculative-decoding-desc" x="280" y="182">is parallel, like prefill.</text>
    <text class="speculative-decoding-edge" x="280" y="242">one pass</text>
  </g>
  <line class="speculative-decoding-line speculative-decoding-conn speculative-decoding-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#speculative-decoding-tip)"/>
  <g class="speculative-decoding-stage speculative-decoding-s2">
    <rect class="speculative-decoding-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="speculative-decoding-step" x="516" y="142">03</text>
    <text class="speculative-decoding-name" x="542" y="142">The output is mathematically identical</text>
    <text class="speculative-decoding-desc" x="516" y="166">Rejection sampling draws from</text>
    <text class="speculative-decoding-desc" x="516" y="182">the target's own distribution.</text>
  </g>
  <line class="speculative-decoding-line speculative-decoding-conn speculative-decoding-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#speculative-decoding-tip)"/>
  <g class="speculative-decoding-stage speculative-decoding-s3">
    <rect class="speculative-decoding-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="speculative-decoding-step" x="752" y="142">04</text>
    <text class="speculative-decoding-name" x="778" y="142">The speedup is the acceptance rate</text>
    <text class="speculative-decoding-desc" x="752" y="166">Boilerplate accepts readily;</text>
    <text class="speculative-decoding-desc" x="752" y="182">genuinely uncertain spans do</text>
    <text class="speculative-decoding-desc" x="752" y="198">not.</text>
  </g>
  <text class="speculative-decoding-sub" x="30" y="304">The identical-output property is the one people disbelieve and it is what makes the technique usable: this is not an approximation trade, it is the same distribution reached with fewer sequential passes.</text>
</svg>
