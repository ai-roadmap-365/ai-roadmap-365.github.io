<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Analysis, not narrative.">
  <title>A pathology lab</title>
  <style>
    .pathology-lab-bg   { fill: #f8fafc; }
    .pathology-lab-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pathology-lab-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pathology-lab-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pathology-lab-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pathology-lab-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pathology-lab-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pathology-lab-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pathology-lab-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pathology-lab-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pathology-lab-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pathology-lab-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pathology-lab-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pathology-lab-row { opacity: 1; }
    .pathology-lab-r0 { animation-delay: 0.00s; }
    .pathology-lab-r1 { animation-delay: 0.45s; }
    .pathology-lab-r2 { animation-delay: 0.90s; }
    .pathology-lab-r3 { animation-delay: 1.35s; }
    .pathology-lab-r4 { animation-delay: 1.80s; }
    .pathology-lab-row { animation: pathology-lab-reveal 7.3s ease-in-out infinite; }
    @keyframes pathology-lab-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="pathology-lab-bg" width="980" height="390"/>
  <text class="pathology-lab-h1"  x="30" y="40">A pathology lab</text>
  <text class="pathology-lab-sub" x="30" y="64">Analysis, not narrative.</text>
  <rect class="pathology-lab-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="pathology-lab-name" x="46" y="122">The lab</text>
  <text class="pathology-lab-desc" x="46" y="142">Characterises a sample.</text>
  <text class="pathology-lab-desc pathology-lab-row pathology-lab-r0" x="46" y="182">Reads the whole sample at once</text>
  <text class="pathology-lab-desc pathology-lab-row pathology-lab-r1" x="46" y="216">Produces structured measurements</text>
  <text class="pathology-lab-desc pathology-lab-row pathology-lab-r2" x="46" y="250">Excellent at classification</text>
  <text class="pathology-lab-desc pathology-lab-row pathology-lab-r3" x="46" y="284">Does not write the case narrative</text>
  <text class="pathology-lab-desc pathology-lab-row pathology-lab-r4" x="46" y="318">This is an encoder</text>
  <rect class="pathology-lab-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="pathology-lab-name" x="526" y="122">The report writer</text>
  <text class="pathology-lab-desc" x="526" y="142">Produces prose.</text>
  <text class="pathology-lab-desc pathology-lab-row pathology-lab-r0" x="526" y="182">Writes one word after another</text>
  <text class="pathology-lab-desc pathology-lab-row pathology-lab-r1" x="526" y="216">Cannot see what it has not written</text>
  <text class="pathology-lab-desc pathology-lab-row pathology-lab-r2" x="526" y="250">Excellent at fluent output</text>
  <text class="pathology-lab-desc pathology-lab-row pathology-lab-r3" x="526" y="284">Does not measure anything</text>
  <text class="pathology-lab-desc pathology-lab-row pathology-lab-r4" x="526" y="318">This is a decoder</text>
  <text class="pathology-lab-sub" x="30" y="372">Both are needed and neither substitutes: a clinical report requires the measurements and the narrative, and the same is true of most language systems.</text>
</svg>
