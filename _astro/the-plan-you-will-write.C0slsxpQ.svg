<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="100%" height="100%" role="img" aria-label="The Plan You Will Write Today showing six modest commitments summing to more than three times the available hours">
  <title>The Plan You Will Write Today</title>
  <defs>
    <style>
      .d365a-bg { fill: #f8fafc; }
      .d365a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; }
      .d365a-have { fill: #dcfce7; stroke: #22c55e; stroke-width: 2px; }
      .d365a-over { fill: #fee2e2; stroke: #ef4444; stroke-width: 2px; }
      .d365a-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d365a-h { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .d365a-t { font-family: system-ui, sans-serif; font-size: 13px; fill: #334155; }
      .d365a-s { font-family: system-ui, sans-serif; font-size: 12px; fill: #64748b; }
      .d365a-big { font-family: system-ui, sans-serif; font-size: 24px; font-weight: 700; fill: #7f1d1d; }
      .d365a-line { stroke: #22c55e; stroke-width: 2.5px; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect class="d365a-bg" width="900" height="470" />
  <text class="d365a-title" x="30" y="38">The Plan You Will Write Today</text>
  <text class="d365a-s" x="30" y="60">Six commitments. Every one of them modest on its own.</text>

  <text class="d365a-t" x="30" y="102">evaluation harness</text>
  <rect class="d365a-card" x="230" y="86" width="90" height="22" rx="4" />
  <text class="d365a-s" x="330" y="102">3h/week</text>

  <text class="d365a-t" x="30" y="134">fine-tuning</text>
  <rect class="d365a-card" x="230" y="118" width="120" height="22" rx="4" />
  <text class="d365a-s" x="360" y="134">4h/week</text>

  <text class="d365a-t" x="30" y="166">open-source contribution</text>
  <rect class="d365a-card" x="230" y="150" width="60" height="22" rx="4" />
  <text class="d365a-s" x="300" y="166">2h/week</text>

  <text class="d365a-t" x="30" y="198">agent frameworks</text>
  <rect class="d365a-card" x="230" y="182" width="90" height="22" rx="4" />
  <text class="d365a-s" x="330" y="198">3h/week</text>

  <text class="d365a-t" x="30" y="230">writing about the work</text>
  <rect class="d365a-card" x="230" y="214" width="30" height="22" rx="4" />
  <text class="d365a-s" x="270" y="230">1h/week</text>

  <text class="d365a-t" x="30" y="262">systems and scaling</text>
  <rect class="d365a-card" x="230" y="246" width="120" height="22" rx="4" />
  <text class="d365a-s" x="360" y="262">4h/week</text>

  <line class="d365a-line" x1="230" y1="76" x2="230" y2="286" />
  <line class="d365a-line" x1="380" y1="76" x2="380" y2="286" />
  <text class="d365a-s" x="386" y="72" fill="#15803d">5h/week — what you actually have</text>

  <rect class="d365a-over" x="30" y="304" width="410" height="90" rx="8" />
  <text class="d365a-h" x="48" y="330">Added up</text>
  <text class="d365a-big" x="48" y="366">17h/week</text>
  <text class="d365a-t" x="200" y="362">against 5 available</text>
  <text class="d365a-s" x="48" y="386">3.40x over before week one</text>

  <rect class="d365a-over" x="460" y="304" width="410" height="90" rx="8" />
  <text class="d365a-h" x="478" y="330">Costed at your own 1.20x from day 364</text>
  <text class="d365a-big" x="478" y="366">20.4h/week</text>
  <text class="d365a-t" x="640" y="362">against 5 available</text>
  <text class="d365a-s" x="478" y="386">4.08x over</text>

  <rect class="d365a-card" x="30" y="410" width="840" height="46" rx="6" />
  <text class="d365a-t" x="48" y="432">This plan does not fail in week three because of discipline.</text>
  <text class="d365a-t" x="48" y="450">It was impossible on the day it was written, and nobody did the arithmetic.</text>
</svg>
