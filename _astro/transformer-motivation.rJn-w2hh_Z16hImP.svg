<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="All of them about sequence processing.">
  <title>Three problems attention solved</title>
  <style>
    .transformer-motivation-bg   { fill: #f8fafc; }
    .transformer-motivation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transformer-motivation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transformer-motivation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transformer-motivation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transformer-motivation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transformer-motivation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .transformer-motivation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .transformer-motivation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .transformer-motivation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .transformer-motivation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .transformer-motivation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .transformer-motivation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .transformer-motivation-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .transformer-motivation-stage { opacity: 1; }

    .transformer-motivation-s0 { animation-delay: 0.00s; }
    .transformer-motivation-e0 { animation-delay: 0.00s; }
    .transformer-motivation-s1 { animation-delay: 1.50s; }
    .transformer-motivation-e1 { animation-delay: 1.50s; }
    .transformer-motivation-s2 { animation-delay: 3.00s; }
    .transformer-motivation-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .transformer-motivation-conn  { animation: transformer-motivation-trace 6s ease-in-out infinite; }
      .transformer-motivation-stage { animation: transformer-motivation-arrive 6s ease-in-out infinite; }
    }
    @keyframes transformer-motivation-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes transformer-motivation-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .transformer-motivation-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .transformer-motivation-stage { animation: transformer-motivation-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes transformer-motivation-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="transformer-motivation-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="transformer-motivation-bg" width="980" height="322"/>
  <text class="transformer-motivation-h1"  x="30" y="40">Three problems attention solved</text>
  <text class="transformer-motivation-sub" x="30" y="64">All of them about sequence processing.</text>
  <g class="transformer-motivation-stage transformer-motivation-s0">
    <rect class="transformer-motivation-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="transformer-motivation-step" x="44" y="142">01</text>
    <text class="transformer-motivation-name" x="70" y="142">Sequential computation</text>
    <text class="transformer-motivation-desc" x="44" y="166">Recurrence cannot parallelise across time.</text>
    <text class="transformer-motivation-desc" x="44" y="182">Attention computes every position at once.</text>
    <text class="transformer-motivation-edge" x="44" y="242">parallel</text>
  </g>
  <line class="transformer-motivation-line transformer-motivation-conn transformer-motivation-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#transformer-motivation-tip)"/>
  <g class="transformer-motivation-stage transformer-motivation-s1">
    <rect class="transformer-motivation-good" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="transformer-motivation-step" x="359" y="142">02</text>
    <text class="transformer-motivation-name" x="385" y="142">Long-range dependencies</text>
    <text class="transformer-motivation-desc" x="359" y="166">Recurrence degrades over distance. Attention</text>
    <text class="transformer-motivation-desc" x="359" y="182">connects any two positions directly.</text>
  </g>
  <line class="transformer-motivation-line transformer-motivation-conn transformer-motivation-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#transformer-motivation-tip)"/>
  <g class="transformer-motivation-stage transformer-motivation-s2">
    <rect class="transformer-motivation-box" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="transformer-motivation-step" x="674" y="142">03</text>
    <text class="transformer-motivation-name" x="700" y="142">The fixed-size bottleneck</text>
    <text class="transformer-motivation-desc" x="674" y="166">No single vector must summarise the whole</text>
    <text class="transformer-motivation-desc" x="674" y="182">sequence.</text>
  </g>
  <text class="transformer-motivation-sub" x="30" y="304">The first is the one that mattered commercially: an architecture that saturates parallel hardware can be scaled by buying more of it, and a sequential one cannot.</text>
</svg>
