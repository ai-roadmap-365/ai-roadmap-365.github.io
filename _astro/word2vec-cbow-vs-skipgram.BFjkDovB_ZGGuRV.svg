<svg role="img" aria-label="Word2Vec architecture comparison showing Continuous Bag of Words CBOW predicting center word from context and Skip-Gram predicting context words from center word" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Word2Vec Architectures: CBOW vs Skip-Gram</title>
  <defs>
    <linearGradient id="bg219a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card219" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg219a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">WORD2VEC ARCHITECTURES: CBOW VS SKIP-GRAM</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Tomas Mikolov et al. (2013) Dense Distributed Semantic Vector Representations</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card219)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Model 1: CBOW -->
    <rect x="25" y="25" width="340" height="245" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="195" y="48" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Continuous Bag-of-Words (CBOW)</text>
    <rect x="40" y="65" width="310" height="190" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="195" y="90" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">Predict Center Word from Context</text>
    <text x="195" y="115" fill="#cbd5e1" font-size="9" text-anchor="middle">Input: [w(t-2), w(t-1), w(t+1), w(t+2)]</text>
    <text x="195" y="140" fill="#38bdf8" font-size="9" text-anchor="middle">Projection Layer: Sum / Average Vector</text>
    <text x="195" y="165" fill="#cbd5e1" font-size="9" text-anchor="middle">Output: Target Center Word w(t)</text>
    <text x="195" y="200" fill="#94a3b8" font-size="8" text-anchor="middle">• Fast to train (several times faster)</text>
    <text x="195" y="220" fill="#94a3b8" font-size="8" text-anchor="middle">• Smoothes over frequent words</text>
    <text x="195" y="240" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">Optimal for Frequent Words</text>

    <!-- Model 2: Skip-Gram -->
    <rect x="395" y="25" width="340" height="245" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="565" y="48" fill="#fbbf24" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Continuous Skip-Gram</text>
    <rect x="410" y="65" width="310" height="190" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="565" y="90" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">Predict Context Words from Center Word</text>
    <text x="565" y="115" fill="#cbd5e1" font-size="9" text-anchor="middle">Input: Center Word w(t)</text>
    <text x="565" y="140" fill="#fbbf24" font-size="9" text-anchor="middle">Projection Layer: Single Embedding Vector</text>
    <text x="565" y="165" fill="#cbd5e1" font-size="9" text-anchor="middle">Output: [w(t-2), w(t-1), w(t+1), w(t+2)]</text>
    <text x="565" y="200" fill="#94a3b8" font-size="8" text-anchor="middle">• Slower training runtime</text>
    <text x="565" y="220" fill="#94a3b8" font-size="8" text-anchor="middle">• Excels on rare words &amp; small datasets</text>
    <text x="565" y="240" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">High Semantic Fidelity</text>
  </g>
</svg>
