<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Without it, generation is quadratic per token.">
  <title>The key-value cache</title>
  <style>
    .kv-cache-bg   { fill: #f8fafc; }
    .kv-cache-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kv-cache-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kv-cache-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kv-cache-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kv-cache-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kv-cache-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kv-cache-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .kv-cache-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .kv-cache-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .kv-cache-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .kv-cache-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .kv-cache-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .kv-cache-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .kv-cache-stage { opacity: 1; }

    .kv-cache-s0 { animation-delay: 0.00s; }
    .kv-cache-e0 { animation-delay: 0.00s; }
    .kv-cache-s1 { animation-delay: 1.28s; }
    .kv-cache-e1 { animation-delay: 1.28s; }
    .kv-cache-s2 { animation-delay: 2.56s; }
    .kv-cache-e2 { animation-delay: 2.56s; }
    .kv-cache-s3 { animation-delay: 3.84s; }
    .kv-cache-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .kv-cache-conn  { animation: kv-cache-trace 6.4s ease-in-out infinite; }
      .kv-cache-stage { animation: kv-cache-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes kv-cache-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes kv-cache-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .kv-cache-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .kv-cache-stage { animation: kv-cache-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes kv-cache-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="kv-cache-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="kv-cache-bg" width="980" height="322"/>
  <text class="kv-cache-h1"  x="30" y="40">The key-value cache</text>
  <text class="kv-cache-sub" x="30" y="64">Without it, generation is quadratic per token.</text>
  <g class="kv-cache-stage kv-cache-s0">
    <rect class="kv-cache-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="kv-cache-step" x="44" y="142">01</text>
    <text class="kv-cache-name" x="70" y="142">Naively, every token recomputes everything</text>
    <text class="kv-cache-desc" x="44" y="166">Attention over the whole prefix,</text>
    <text class="kv-cache-desc" x="44" y="182">from scratch, per token.</text>
  </g>
  <line class="kv-cache-line kv-cache-conn kv-cache-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#kv-cache-tip)"/>
  <g class="kv-cache-stage kv-cache-s1">
    <rect class="kv-cache-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="kv-cache-step" x="280" y="142">02</text>
    <text class="kv-cache-name" x="306" y="142">But the prefix has not changed</text>
    <text class="kv-cache-desc" x="280" y="166">Its keys and values are</text>
    <text class="kv-cache-desc" x="280" y="182">identical to last step's.</text>
  </g>
  <line class="kv-cache-line kv-cache-conn kv-cache-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#kv-cache-tip)"/>
  <g class="kv-cache-stage kv-cache-s2">
    <rect class="kv-cache-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="kv-cache-step" x="516" y="142">03</text>
    <text class="kv-cache-name" x="542" y="142">So cache them</text>
    <text class="kv-cache-desc" x="516" y="166">Each new token computes one</text>
    <text class="kv-cache-desc" x="516" y="182">query against the cached keys.</text>
  </g>
  <line class="kv-cache-line kv-cache-conn kv-cache-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#kv-cache-tip)"/>
  <g class="kv-cache-stage kv-cache-s3">
    <rect class="kv-cache-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="kv-cache-step" x="752" y="142">04</text>
    <text class="kv-cache-name" x="778" y="142">At the cost of memory per token, per layer, per head</text>
    <text class="kv-cache-desc" x="752" y="166">Which becomes the binding</text>
    <text class="kv-cache-desc" x="752" y="182">constraint on concurrency.</text>
  </g>
  <text class="kv-cache-sub" x="30" y="304">The trade is compute for memory and it is overwhelmingly worth making, which is why the cache's size — and how to shrink it — has become a central serving concern.</text>
</svg>
