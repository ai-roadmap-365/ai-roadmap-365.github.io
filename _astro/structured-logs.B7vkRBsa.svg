<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Fields, not sentences.">
  <title>The most valuable decision you make about logs</title>
  <style>
    .structured-logs-bg   { fill: #f8fafc; }
    .structured-logs-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structured-logs-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structured-logs-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structured-logs-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structured-logs-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structured-logs-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .structured-logs-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .structured-logs-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .structured-logs-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .structured-logs-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .structured-logs-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .structured-logs-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .structured-logs-row { opacity: 1; }
    .structured-logs-r0 { animation-delay: 0.00s; }
    .structured-logs-r1 { animation-delay: 0.45s; }
    .structured-logs-r2 { animation-delay: 0.90s; }
    .structured-logs-r3 { animation-delay: 1.35s; }
    .structured-logs-r4 { animation-delay: 1.80s; }
    .structured-logs-row { animation: structured-logs-reveal 7.3s ease-in-out infinite; }
    @keyframes structured-logs-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="structured-logs-bg" width="980" height="390"/>
  <text class="structured-logs-h1"  x="30" y="40">The most valuable decision you make about logs</text>
  <text class="structured-logs-sub" x="30" y="64">Fields, not sentences.</text>
  <rect class="structured-logs-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="structured-logs-name" x="46" y="122">Plain text</text>
  <text class="structured-logs-desc" x="46" y="142">Readable by a person only.</text>
  <text class="structured-logs-desc structured-logs-row structured-logs-r0" x="46" y="182">"request for user 91 failed after 4200ms"</text>
  <text class="structured-logs-desc structured-logs-row structured-logs-r1" x="46" y="216">Querying it means writing regex</text>
  <text class="structured-logs-desc structured-logs-row structured-logs-r2" x="46" y="250">Which breaks when the wording changes</text>
  <text class="structured-logs-desc structured-logs-row structured-logs-r3" x="46" y="284">Cannot filter numerically at all</text>
  <text class="structured-logs-desc structured-logs-row structured-logs-r4" x="46" y="318">Aggregation is guesswork</text>
  <rect class="structured-logs-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="structured-logs-name" x="526" y="122">Structured</text>
  <text class="structured-logs-desc" x="526" y="142">Readable by a machine too.</text>
  <text class="structured-logs-desc structured-logs-row structured-logs-r0" x="526" y="182">{"event":"request_failed","user_id":91,...}</text>
  <text class="structured-logs-desc structured-logs-row structured-logs-r1" x="526" y="216">"every ERROR with latency_ms over 3000"</text>
  <text class="structured-logs-desc structured-logs-row structured-logs-r2" x="526" y="250">A precise query, not a pattern</text>
  <text class="structured-logs-desc structured-logs-row structured-logs-r3" x="526" y="284">Numeric fields compare properly</text>
  <text class="structured-logs-desc structured-logs-row structured-logs-r4" x="526" y="318">Group and count by any field</text>
  <text class="structured-logs-sub" x="30" y="372">Retrofitting structure onto an existing codebase is far more work than starting with it, which is why this belongs in the first line of code rather than the first incident.</text>
</svg>
