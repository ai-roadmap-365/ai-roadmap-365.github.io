<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four families.">
  <title>What the non-relational stores offer</title>
  <style>
    .nosql-idea-bg   { fill: #f8fafc; }
    .nosql-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nosql-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .nosql-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .nosql-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .nosql-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .nosql-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .nosql-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .nosql-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .nosql-idea-stage { opacity: 1; }

    .nosql-idea-s0 { animation-delay: 0.00s; }
    .nosql-idea-e0 { animation-delay: 0.00s; }
    .nosql-idea-s1 { animation-delay: 1.28s; }
    .nosql-idea-e1 { animation-delay: 1.28s; }
    .nosql-idea-s2 { animation-delay: 2.56s; }
    .nosql-idea-e2 { animation-delay: 2.56s; }
    .nosql-idea-s3 { animation-delay: 3.84s; }
    .nosql-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .nosql-idea-conn  { animation: nosql-idea-trace 6.4s ease-in-out infinite; }
      .nosql-idea-stage { animation: nosql-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes nosql-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes nosql-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .nosql-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .nosql-idea-stage { animation: nosql-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes nosql-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="nosql-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="nosql-idea-bg" width="980" height="322"/>
  <text class="nosql-idea-h1"  x="30" y="40">What the non-relational stores offer</text>
  <text class="nosql-idea-sub" x="30" y="64">Four families.</text>
  <g class="nosql-idea-stage nosql-idea-s0">
    <rect class="nosql-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="nosql-idea-step" x="44" y="142">01</text>
    <text class="nosql-idea-name" x="70" y="142">Key-value: one value per key, nothing else</text>
    <text class="nosql-idea-desc" x="44" y="166">Fast, and structureless.</text>
  </g>
  <line class="nosql-idea-line nosql-idea-conn nosql-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#nosql-idea-tip)"/>
  <g class="nosql-idea-stage nosql-idea-s1">
    <rect class="nosql-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="nosql-idea-step" x="280" y="142">02</text>
    <text class="nosql-idea-name" x="306" y="142">Document: nested records, queried by field</text>
    <text class="nosql-idea-desc" x="280" y="166">Flexible shape per record.</text>
  </g>
  <line class="nosql-idea-line nosql-idea-conn nosql-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#nosql-idea-tip)"/>
  <g class="nosql-idea-stage nosql-idea-s2">
    <rect class="nosql-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="nosql-idea-step" x="516" y="142">03</text>
    <text class="nosql-idea-name" x="542" y="142">Wide-column: rows with sparse, varying columns</text>
    <text class="nosql-idea-desc" x="516" y="166">Built for scale.</text>
  </g>
  <line class="nosql-idea-line nosql-idea-conn nosql-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#nosql-idea-tip)"/>
  <g class="nosql-idea-stage nosql-idea-s3">
    <rect class="nosql-idea-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="nosql-idea-step" x="752" y="142">04</text>
    <text class="nosql-idea-name" x="778" y="142">And graph: nodes and edges, traversed</text>
    <text class="nosql-idea-desc" x="752" y="166">For relationship-heavy</text>
    <text class="nosql-idea-desc" x="752" y="182">questions.</text>
  </g>
  <text class="nosql-idea-sub" x="30" y="304">These are four different answers to four different problems, which is why treating them as one category obscures more than it explains.</text>
</svg>
