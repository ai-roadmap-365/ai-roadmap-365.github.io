<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the data.">
  <title>Which measure when</title>
  <style>
    .norm-when-bg   { fill: #f8fafc; }
    .norm-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .norm-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .norm-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .norm-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .norm-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .norm-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .norm-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .norm-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .norm-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .norm-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .norm-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .norm-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .norm-when-row { opacity: 1; }
    .norm-when-r0 { animation-delay: 0.00s; }
    .norm-when-r1 { animation-delay: 0.45s; }
    .norm-when-r2 { animation-delay: 0.90s; }
    .norm-when-r3 { animation-delay: 1.35s; }
    .norm-when-r4 { animation-delay: 1.80s; }
    .norm-when-row { animation: norm-when-reveal 7.3s ease-in-out infinite; }
    @keyframes norm-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="norm-when-bg" width="980" height="390"/>
  <text class="norm-when-h1"  x="30" y="40">Which measure when</text>
  <text class="norm-when-sub" x="30" y="64">By the data.</text>
  <rect class="norm-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="norm-when-name" x="46" y="122">The situation</text>
  <text class="norm-when-desc" x="46" y="142">What you have.</text>
  <text class="norm-when-desc norm-when-row norm-when-r0" x="46" y="182">Continuous features, comparable units</text>
  <text class="norm-when-desc norm-when-row norm-when-r1" x="46" y="216">Text embeddings of varying length</text>
  <text class="norm-when-desc norm-when-row norm-when-r2" x="46" y="250">Sets, tags or presence data</text>
  <text class="norm-when-desc norm-when-row norm-when-r3" x="46" y="284">Correlated features with different spreads</text>
  <text class="norm-when-desc norm-when-row norm-when-r4" x="46" y="318">Very high dimensions</text>
  <rect class="norm-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="norm-when-name" x="526" y="122">The measure</text>
  <text class="norm-when-desc" x="526" y="142">What to use.</text>
  <text class="norm-when-desc norm-when-row norm-when-r0" x="526" y="182">Straight-line distance, after scaling</text>
  <text class="norm-when-desc norm-when-row norm-when-r1" x="526" y="216">Cosine similarity</text>
  <text class="norm-when-desc norm-when-row norm-when-r2" x="526" y="250">Set overlap</text>
  <text class="norm-when-desc norm-when-row norm-when-r3" x="526" y="284">Covariance-adjusted distance</text>
  <text class="norm-when-desc norm-when-row norm-when-r4" x="526" y="318">Grid distance, which degrades more slowly</text>
  <text class="norm-when-sub" x="30" y="372">Scaling appears in the first row as a condition rather than a step, because without it the straight-line distance is measuring units rather than similarity.</text>
</svg>
