<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>What makes time series different</title>
  <style>
    .ts-idea-bg   { fill: #f8fafc; }
    .ts-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ts-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ts-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ts-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ts-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ts-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ts-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ts-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ts-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ts-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ts-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ts-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .ts-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .ts-idea-stage { opacity: 1; }

    .ts-idea-s0 { animation-delay: 0.00s; }
    .ts-idea-e0 { animation-delay: 0.00s; }
    .ts-idea-s1 { animation-delay: 1.28s; }
    .ts-idea-e1 { animation-delay: 1.28s; }
    .ts-idea-s2 { animation-delay: 2.56s; }
    .ts-idea-e2 { animation-delay: 2.56s; }
    .ts-idea-s3 { animation-delay: 3.84s; }
    .ts-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .ts-idea-conn  { animation: ts-idea-trace 6.4s ease-in-out infinite; }
      .ts-idea-stage { animation: ts-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes ts-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes ts-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .ts-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ts-idea-stage { animation: ts-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes ts-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ts-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="ts-idea-bg" width="980" height="322"/>
  <text class="ts-idea-h1"  x="30" y="40">What makes time series different</text>
  <text class="ts-idea-sub" x="30" y="64">Four properties.</text>
  <g class="ts-idea-stage ts-idea-s0">
    <rect class="ts-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="ts-idea-step" x="44" y="142">01</text>
    <text class="ts-idea-name" x="70" y="142">The order matters: rows are not exchangeable</text>
    <text class="ts-idea-desc" x="44" y="166">Which most statistics assume</text>
    <text class="ts-idea-desc" x="44" y="182">they are.</text>
  </g>
  <line class="ts-idea-line ts-idea-conn ts-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#ts-idea-tip)"/>
  <g class="ts-idea-stage ts-idea-s1">
    <rect class="ts-idea-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="ts-idea-step" x="280" y="142">02</text>
    <text class="ts-idea-name" x="306" y="142">Nearby points are correlated</text>
    <text class="ts-idea-desc" x="280" y="166">So observations are not</text>
    <text class="ts-idea-desc" x="280" y="182">independent.</text>
  </g>
  <line class="ts-idea-line ts-idea-conn ts-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#ts-idea-tip)"/>
  <g class="ts-idea-stage ts-idea-s2">
    <rect class="ts-idea-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="ts-idea-step" x="516" y="142">03</text>
    <text class="ts-idea-name" x="542" y="142">The series decomposes into trend, season and remainder</text>
    <text class="ts-idea-desc" x="516" y="166">Which is the standard first</text>
    <text class="ts-idea-desc" x="516" y="182">move.</text>
  </g>
  <line class="ts-idea-line ts-idea-conn ts-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#ts-idea-tip)"/>
  <g class="ts-idea-stage ts-idea-s3">
    <rect class="ts-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="ts-idea-step" x="752" y="142">04</text>
    <text class="ts-idea-name" x="778" y="142">And the spacing may be irregular or have gaps</text>
    <text class="ts-idea-desc" x="752" y="166">Which many methods assume away.</text>
  </g>
  <text class="ts-idea-sub" x="30" y="304">Non-independence is the property that invalidates most standard statistics on time series, and it is why a naive confidence interval is far too narrow.</text>
</svg>
