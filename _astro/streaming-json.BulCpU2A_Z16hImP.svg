<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Parsing before it is complete.">
  <title>Streaming structured output</title>
  <style>
    .streaming-json-bg   { fill: #f8fafc; }
    .streaming-json-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-json-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-json-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-json-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-json-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-json-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .streaming-json-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .streaming-json-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .streaming-json-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .streaming-json-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .streaming-json-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .streaming-json-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .streaming-json-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .streaming-json-stage { opacity: 1; }

    .streaming-json-s0 { animation-delay: 0.00s; }
    .streaming-json-e0 { animation-delay: 0.00s; }
    .streaming-json-s1 { animation-delay: 1.28s; }
    .streaming-json-e1 { animation-delay: 1.28s; }
    .streaming-json-s2 { animation-delay: 2.56s; }
    .streaming-json-e2 { animation-delay: 2.56s; }
    .streaming-json-s3 { animation-delay: 3.84s; }
    .streaming-json-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .streaming-json-conn  { animation: streaming-json-trace 6.4s ease-in-out infinite; }
      .streaming-json-stage { animation: streaming-json-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes streaming-json-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes streaming-json-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .streaming-json-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .streaming-json-stage { animation: streaming-json-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes streaming-json-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="streaming-json-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="streaming-json-bg" width="980" height="322"/>
  <text class="streaming-json-h1"  x="30" y="40">Streaming structured output</text>
  <text class="streaming-json-sub" x="30" y="64">Parsing before it is complete.</text>
  <g class="streaming-json-stage streaming-json-s0">
    <rect class="streaming-json-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="streaming-json-step" x="44" y="142">01</text>
    <text class="streaming-json-name" x="70" y="142">Waiting for the closing brace is slow</text>
    <text class="streaming-json-desc" x="44" y="166">The user sees nothing for the</text>
    <text class="streaming-json-desc" x="44" y="182">whole generation.</text>
  </g>
  <line class="streaming-json-line streaming-json-conn streaming-json-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#streaming-json-tip)"/>
  <g class="streaming-json-stage streaming-json-s1">
    <rect class="streaming-json-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="streaming-json-step" x="280" y="142">02</text>
    <text class="streaming-json-name" x="306" y="142">Parse the partial document as it arrives</text>
    <text class="streaming-json-desc" x="280" y="166">Which yields completed fields</text>
    <text class="streaming-json-desc" x="280" y="182">early.</text>
  </g>
  <line class="streaming-json-line streaming-json-conn streaming-json-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#streaming-json-tip)"/>
  <g class="streaming-json-stage streaming-json-s2">
    <rect class="streaming-json-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="streaming-json-step" x="516" y="142">03</text>
    <text class="streaming-json-name" x="542" y="142">And render each field as it completes</text>
    <text class="streaming-json-desc" x="516" y="166">So the interface fills in</text>
    <text class="streaming-json-desc" x="516" y="182">progressively.</text>
  </g>
  <line class="streaming-json-line streaming-json-conn streaming-json-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#streaming-json-tip)"/>
  <g class="streaming-json-stage streaming-json-s3">
    <rect class="streaming-json-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="streaming-json-step" x="752" y="142">04</text>
    <text class="streaming-json-name" x="778" y="142">Validating fully only at the end</text>
    <text class="streaming-json-desc" x="752" y="166">Because a partial document is</text>
    <text class="streaming-json-desc" x="752" y="182">not yet valid.</text>
  </g>
  <text class="streaming-json-sub" x="30" y="304">Perceived latency improves far more than actual latency here, which is usually the more valuable of the two in an interactive product.</text>
</svg>
