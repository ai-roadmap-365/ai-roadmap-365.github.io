<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Parallel against sequential.">
  <title>Bagging against boosting</title>
  <style>
    .bagging-vs-boosting-bg   { fill: #f8fafc; }
    .bagging-vs-boosting-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bagging-vs-boosting-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bagging-vs-boosting-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bagging-vs-boosting-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bagging-vs-boosting-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bagging-vs-boosting-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bagging-vs-boosting-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bagging-vs-boosting-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bagging-vs-boosting-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bagging-vs-boosting-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bagging-vs-boosting-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bagging-vs-boosting-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bagging-vs-boosting-row { opacity: 1; }
    .bagging-vs-boosting-r0 { animation-delay: 0.00s; }
    .bagging-vs-boosting-r1 { animation-delay: 0.45s; }
    .bagging-vs-boosting-r2 { animation-delay: 0.90s; }
    .bagging-vs-boosting-r3 { animation-delay: 1.35s; }
    .bagging-vs-boosting-r4 { animation-delay: 1.80s; }
    .bagging-vs-boosting-row { animation: bagging-vs-boosting-reveal 7.3s ease-in-out infinite; }
    @keyframes bagging-vs-boosting-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="bagging-vs-boosting-bg" width="980" height="390"/>
  <text class="bagging-vs-boosting-h1"  x="30" y="40">Bagging against boosting</text>
  <text class="bagging-vs-boosting-sub" x="30" y="64">Parallel against sequential.</text>
  <rect class="bagging-vs-boosting-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="bagging-vs-boosting-name" x="46" y="122">Bagging</text>
  <text class="bagging-vs-boosting-desc" x="46" y="142">Reduces variance.</text>
  <text class="bagging-vs-boosting-desc bagging-vs-boosting-row bagging-vs-boosting-r0" x="46" y="182">Models fitted independently, in parallel</text>
  <text class="bagging-vs-boosting-desc bagging-vs-boosting-row bagging-vs-boosting-r1" x="46" y="216">Each sees a different resample</text>
  <text class="bagging-vs-boosting-desc bagging-vs-boosting-row bagging-vs-boosting-r2" x="46" y="250">Deep trees, deliberately overfitted</text>
  <text class="bagging-vs-boosting-desc bagging-vs-boosting-row bagging-vs-boosting-r3" x="46" y="284">Cannot overfit by adding models</text>
  <text class="bagging-vs-boosting-desc bagging-vs-boosting-row bagging-vs-boosting-r4" x="46" y="318">Robust to defaults</text>
  <rect class="bagging-vs-boosting-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="bagging-vs-boosting-name" x="526" y="122">Boosting</text>
  <text class="bagging-vs-boosting-desc" x="526" y="142">Reduces bias.</text>
  <text class="bagging-vs-boosting-desc bagging-vs-boosting-row bagging-vs-boosting-r0" x="526" y="182">Models fitted sequentially</text>
  <text class="bagging-vs-boosting-desc bagging-vs-boosting-row bagging-vs-boosting-r1" x="526" y="216">Each corrects the last one's errors</text>
  <text class="bagging-vs-boosting-desc bagging-vs-boosting-row bagging-vs-boosting-r2" x="526" y="250">Shallow trees, deliberately weak</text>
  <text class="bagging-vs-boosting-desc bagging-vs-boosting-row bagging-vs-boosting-r3" x="526" y="284">Can overfit with too many rounds</text>
  <text class="bagging-vs-boosting-desc bagging-vs-boosting-row bagging-vs-boosting-r4" x="526" y="318">Needs tuning to do well</text>
  <text class="bagging-vs-boosting-sub" x="30" y="372">The opposite tree depths follow from the opposite goals: bagging averages away the variance of overfitted trees, and boosting accumulates the signal of underfitted ones.</text>
</svg>
