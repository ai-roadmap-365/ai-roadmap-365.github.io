<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Rarely the right answer.">
  <title>Two escape hatches</title>
  <style>
    .global-nonlocal-bg   { fill: #f8fafc; }
    .global-nonlocal-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .global-nonlocal-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .global-nonlocal-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .global-nonlocal-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .global-nonlocal-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .global-nonlocal-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .global-nonlocal-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .global-nonlocal-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .global-nonlocal-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .global-nonlocal-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .global-nonlocal-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .global-nonlocal-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .global-nonlocal-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .global-nonlocal-stage { opacity: 1; }

    .global-nonlocal-s0 { animation-delay: 0.00s; }
    .global-nonlocal-e0 { animation-delay: 0.00s; }
    .global-nonlocal-s1 { animation-delay: 1.28s; }
    .global-nonlocal-e1 { animation-delay: 1.28s; }
    .global-nonlocal-s2 { animation-delay: 2.56s; }
    .global-nonlocal-e2 { animation-delay: 2.56s; }
    .global-nonlocal-s3 { animation-delay: 3.84s; }
    .global-nonlocal-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .global-nonlocal-conn  { animation: global-nonlocal-trace 6.4s ease-in-out infinite; }
      .global-nonlocal-stage { animation: global-nonlocal-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes global-nonlocal-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes global-nonlocal-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .global-nonlocal-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .global-nonlocal-stage { animation: global-nonlocal-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes global-nonlocal-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="global-nonlocal-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="global-nonlocal-bg" width="980" height="322"/>
  <text class="global-nonlocal-h1"  x="30" y="40">Two escape hatches</text>
  <text class="global-nonlocal-sub" x="30" y="64">Rarely the right answer.</text>
  <g class="global-nonlocal-stage global-nonlocal-s0">
    <rect class="global-nonlocal-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="global-nonlocal-step" x="44" y="142">01</text>
    <text class="global-nonlocal-name" x="70" y="142">Assigning to a name makes it local, by default</text>
    <text class="global-nonlocal-desc" x="44" y="166">Which is what protects the</text>
    <text class="global-nonlocal-desc" x="44" y="182">outside.</text>
  </g>
  <line class="global-nonlocal-line global-nonlocal-conn global-nonlocal-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#global-nonlocal-tip)"/>
  <g class="global-nonlocal-stage global-nonlocal-s1">
    <rect class="global-nonlocal-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="global-nonlocal-step" x="280" y="142">02</text>
    <text class="global-nonlocal-name" x="306" y="142">The global keyword redirects that to module scope</text>
    <text class="global-nonlocal-desc" x="280" y="166">Which makes the function's</text>
    <text class="global-nonlocal-desc" x="280" y="182">effects invisible at the call</text>
    <text class="global-nonlocal-desc" x="280" y="198">site.</text>
  </g>
  <line class="global-nonlocal-line global-nonlocal-conn global-nonlocal-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#global-nonlocal-tip)"/>
  <g class="global-nonlocal-stage global-nonlocal-s2">
    <rect class="global-nonlocal-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="global-nonlocal-step" x="516" y="142">03</text>
    <text class="global-nonlocal-name" x="542" y="142">The nonlocal keyword redirects it to the enclosing function</text>
    <text class="global-nonlocal-desc" x="516" y="166">Which is what stateful closures</text>
    <text class="global-nonlocal-desc" x="516" y="182">need.</text>
  </g>
  <line class="global-nonlocal-line global-nonlocal-conn global-nonlocal-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#global-nonlocal-tip)"/>
  <g class="global-nonlocal-stage global-nonlocal-s3">
    <rect class="global-nonlocal-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="global-nonlocal-step" x="752" y="142">04</text>
    <text class="global-nonlocal-name" x="778" y="142">Prefer returning a value to either</text>
    <text class="global-nonlocal-desc" x="752" y="166">Which keeps the effect visible.</text>
  </g>
  <text class="global-nonlocal-sub" x="30" y="304">A function that modifies module state gives its caller no indication that it did, which is why returning the new value is almost always clearer.</text>
</svg>
