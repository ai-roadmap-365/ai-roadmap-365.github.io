<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to use these</title>
  <style>
    .embedding-when-bg   { fill: #f8fafc; }
    .embedding-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .embedding-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .embedding-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .embedding-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .embedding-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .embedding-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .embedding-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .embedding-when-row { opacity: 1; }
    .embedding-when-r0 { animation-delay: 0.00s; }
    .embedding-when-r1 { animation-delay: 0.45s; }
    .embedding-when-r2 { animation-delay: 0.90s; }
    .embedding-when-r3 { animation-delay: 1.35s; }
    .embedding-when-r4 { animation-delay: 1.80s; }
    .embedding-when-row { animation: embedding-when-reveal 7.3s ease-in-out infinite; }
    @keyframes embedding-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="embedding-when-bg" width="980" height="390"/>
  <text class="embedding-when-h1"  x="30" y="40">When to use these</text>
  <text class="embedding-when-sub" x="30" y="64">And when not to.</text>
  <rect class="embedding-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="embedding-when-name" x="46" y="122">Use them</text>
  <text class="embedding-when-desc" x="46" y="142">Four cases.</text>
  <text class="embedding-when-desc embedding-when-row embedding-when-r0" x="46" y="182">Exploring an embedding space visually</text>
  <text class="embedding-when-desc embedding-when-row embedding-when-r1" x="46" y="216">Sanity-checking that clusters separate</text>
  <text class="embedding-when-desc embedding-when-row embedding-when-r2" x="46" y="250">Presenting structure to an audience</text>
  <text class="embedding-when-desc embedding-when-row embedding-when-r3" x="46" y="284">Finding obvious data problems</text>
  <text class="embedding-when-desc embedding-when-row embedding-when-r4" x="46" y="318">Comparing two models' representations</text>
  <rect class="embedding-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="embedding-when-name" x="526" y="122">Do not</text>
  <text class="embedding-when-desc" x="526" y="142">Also four.</text>
  <text class="embedding-when-desc embedding-when-row embedding-when-r0" x="526" y="182">As features for a downstream model</text>
  <text class="embedding-when-desc embedding-when-row embedding-when-r1" x="526" y="216">To measure distances or cluster sizes</text>
  <text class="embedding-when-desc embedding-when-row embedding-when-r2" x="526" y="250">As evidence of structure on their own</text>
  <text class="embedding-when-desc embedding-when-row embedding-when-r3" x="526" y="284">Where reproducibility is required</text>
  <text class="embedding-when-desc embedding-when-row embedding-when-r4" x="526" y="318">On the full dataset, if it is large</text>
  <text class="embedding-when-sub" x="30" y="372">Using the two-dimensional output as model input is the error to avoid outright: the coordinates are a layout, and they discard almost everything the model needs.</text>
</svg>
