<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Multi-Tenant Tier Quota Enforcement Matrix">
  <title>Multi-Tenant Tier Quota Enforcement Matrix</title>
  <defs>
    <style>
      .d319b-bg { fill: #f8fafc; }
      .d319b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d319b-free { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d319b-pro { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d319b-ent { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d319b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d319b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d319b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
      .d319b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d319b-bg" />
  
  <text x="40" y="40" class="d319a-title">Multi-Tenant Quota &amp; Rate Limit Tiers</text>
  <text x="40" y="65" class="d319a-subtitle">Multi-Tenant Tier Quota Enforcement Matrix comparing Free Tier (10 RPM, 20k TPM, Mini models), Pro Tier (100 RPM, 200k TPM, Sonnet models), and Enterprise Tier (Unlimited RPM, Custom TPM, Dedicated vLLM)</text>
  
  <!-- Tier 1: Free Tier -->
  <rect x="40" y="110" width="250" height="270" class="d319b-free" />
  <text x="60" y="145" class="d319b-header" fill="#1d4ed8">Free Tier ($0/mo)</text>
  <text x="60" y="180" class="d319b-text">• **RPM Limit:** 10 req/min</text>
  <text x="60" y="205" class="d319b-text">• **TPM Limit:** 20,000 tok/min</text>
  <text x="60" y="230" class="d319b-text">• **Daily Quota:** $1.00 credit</text>
  <text x="60" y="255" class="d319b-text">• **Models:** GPT-4o-mini / Haiku</text>
  <text x="60" y="280" class="d319b-text">• **Concurrency:** 1 stream</text>
  <text x="60" y="320" class="d319b-text" font-weight="600" fill="#1d4ed8">Target: Individual Trial</text>
  
  <!-- Tier 2: Pro Tier -->
  <rect x="325" y="110" width="250" height="270" class="d319b-pro" />
  <text x="345" y="145" class="d319b-header" fill="#7e22ce">Pro Tier ($29/mo)</text>
  <text x="345" y="180" class="d319b-text">• **RPM Limit:** 120 req/min</text>
  <text x="345" y="205" class="d319b-text">• **TPM Limit:** 300,000 tok/min</text>
  <text x="345" y="230" class="d319b-text">• **Monthly Quota:** $50.00 credit</text>
  <text x="345" y="255" class="d319b-text">• **Models:** Claude 3.5 Sonnet / GPT-4o</text>
  <text x="345" y="280" class="d319b-text">• **Concurrency:** 10 streams</text>
  <text x="345" y="320" class="d319b-text" font-weight="600" fill="#7e22ce">Target: Professional Devs</text>
  
  <!-- Tier 3: Enterprise Tier -->
  <rect x="610" y="110" width="250" height="270" class="d319b-ent" />
  <text x="630" y="145" class="d319b-header" fill="#15803d">Enterprise Tier (Custom)</text>
  <text x="630" y="180" class="d319b-text">• **RPM Limit:** 1,000+ req/min</text>
  <text x="630" y="205" class="d319b-text">• **TPM Limit:** 2,000,000 tok/min</text>
  <text x="630" y="230" class="d319b-text">• **Invoicing:** Post-paid Stripe net-30</text>
  <text x="630" y="255" class="d319b-text">• **Models:** All Frontier + vLLM</text>
  <text x="630" y="280" class="d319b-text">• **Concurrency:** 100+ streams</text>
  <text x="630" y="320" class="d319b-text" font-weight="600" fill="#15803d">Target: Enterprise Scale</text>
</svg>