<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each layer narrows the delivery.">
  <title>Three numbers to reach one program</title>
  <style>
    .address-port-program-bg   { fill: #f8fafc; }
    .address-port-program-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .address-port-program-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .address-port-program-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .address-port-program-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .address-port-program-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .address-port-program-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .address-port-program-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .address-port-program-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .address-port-program-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .address-port-program-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .address-port-program-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .address-port-program-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .address-port-program-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .address-port-program-stage { opacity: 1; }

    .address-port-program-s0 { animation-delay: 0.00s; }
    .address-port-program-e0 { animation-delay: 0.00s; }
    .address-port-program-s1 { animation-delay: 1.50s; }
    .address-port-program-e1 { animation-delay: 1.50s; }
    .address-port-program-s2 { animation-delay: 3.00s; }
    .address-port-program-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .address-port-program-conn  { animation: address-port-program-trace 6s ease-in-out infinite; }
      .address-port-program-stage { animation: address-port-program-arrive 6s ease-in-out infinite; }
    }
    @keyframes address-port-program-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes address-port-program-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .address-port-program-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .address-port-program-stage { animation: address-port-program-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes address-port-program-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="address-port-program-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="address-port-program-bg" width="980" height="322"/>
  <text class="address-port-program-h1"  x="30" y="40">Three numbers to reach one program</text>
  <text class="address-port-program-sub" x="30" y="64">Each layer narrows the delivery.</text>
  <g class="address-port-program-stage address-port-program-s0">
    <rect class="address-port-program-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="address-port-program-step" x="44" y="142">01</text>
    <text class="address-port-program-name" x="70" y="142">The address</text>
    <text class="address-port-program-desc" x="44" y="166">Gets the packet to the right machine, across</text>
    <text class="address-port-program-desc" x="44" y="182">as many networks as it takes.</text>
    <text class="address-port-program-edge" x="44" y="242">which host</text>
  </g>
  <line class="address-port-program-line address-port-program-conn address-port-program-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#address-port-program-tip)"/>
  <g class="address-port-program-stage address-port-program-s1">
    <rect class="address-port-program-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="address-port-program-step" x="359" y="142">02</text>
    <text class="address-port-program-name" x="385" y="142">The port</text>
    <text class="address-port-program-desc" x="359" y="166">Tells the kernel which of a hundred running</text>
    <text class="address-port-program-desc" x="359" y="182">programs the packet is for.</text>
    <text class="address-port-program-edge" x="359" y="242">which program</text>
  </g>
  <line class="address-port-program-line address-port-program-conn address-port-program-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#address-port-program-tip)"/>
  <g class="address-port-program-stage address-port-program-s2">
    <rect class="address-port-program-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="address-port-program-step" x="674" y="142">03</text>
    <text class="address-port-program-name" x="700" y="142">The socket</text>
    <text class="address-port-program-desc" x="674" y="166">The program's claim on that port. The kernel</text>
    <text class="address-port-program-desc" x="674" y="182">delivers matching packets here.</text>
    <text class="address-port-program-edge" x="674" y="242">delivered</text>
  </g>
  <text class="address-port-program-sub" x="30" y="304">A live connection needs four numbers, not two: both addresses and both ports. That is how one server holds thousands of connections on the same port.</text>
</svg>
