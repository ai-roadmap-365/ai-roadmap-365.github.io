<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three changes, and the field follows.">
  <title>From one unit to a network</title>
  <style>
    .perceptron-to-deep-bg   { fill: #f8fafc; }
    .perceptron-to-deep-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .perceptron-to-deep-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .perceptron-to-deep-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .perceptron-to-deep-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .perceptron-to-deep-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .perceptron-to-deep-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .perceptron-to-deep-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .perceptron-to-deep-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .perceptron-to-deep-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .perceptron-to-deep-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .perceptron-to-deep-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .perceptron-to-deep-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .perceptron-to-deep-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .perceptron-to-deep-stage { opacity: 1; }

    .perceptron-to-deep-s0 { animation-delay: 0.00s; }
    .perceptron-to-deep-e0 { animation-delay: 0.00s; }
    .perceptron-to-deep-s1 { animation-delay: 1.50s; }
    .perceptron-to-deep-e1 { animation-delay: 1.50s; }
    .perceptron-to-deep-s2 { animation-delay: 3.00s; }
    .perceptron-to-deep-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .perceptron-to-deep-conn  { animation: perceptron-to-deep-trace 6s ease-in-out infinite; }
      .perceptron-to-deep-stage { animation: perceptron-to-deep-arrive 6s ease-in-out infinite; }
    }
    @keyframes perceptron-to-deep-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes perceptron-to-deep-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .perceptron-to-deep-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .perceptron-to-deep-stage { animation: perceptron-to-deep-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes perceptron-to-deep-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="perceptron-to-deep-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="perceptron-to-deep-bg" width="980" height="322"/>
  <text class="perceptron-to-deep-h1"  x="30" y="40">From one unit to a network</text>
  <text class="perceptron-to-deep-sub" x="30" y="64">Three changes, and the field follows.</text>
  <g class="perceptron-to-deep-stage perceptron-to-deep-s0">
    <rect class="perceptron-to-deep-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="perceptron-to-deep-step" x="44" y="142">01</text>
    <text class="perceptron-to-deep-name" x="70" y="142">Stack them into layers</text>
    <text class="perceptron-to-deep-desc" x="44" y="166">Each layer's outputs become the next layer's</text>
    <text class="perceptron-to-deep-desc" x="44" y="182">inputs.</text>
  </g>
  <line class="perceptron-to-deep-line perceptron-to-deep-conn perceptron-to-deep-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#perceptron-to-deep-tip)"/>
  <g class="perceptron-to-deep-stage perceptron-to-deep-s1">
    <rect class="perceptron-to-deep-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="perceptron-to-deep-step" x="359" y="142">02</text>
    <text class="perceptron-to-deep-name" x="385" y="142">Replace the step with a smooth function</text>
    <text class="perceptron-to-deep-desc" x="359" y="166">So a derivative exists and gradients can</text>
    <text class="perceptron-to-deep-desc" x="359" y="182">flow.</text>
    <text class="perceptron-to-deep-edge" x="359" y="242">Day 198</text>
  </g>
  <line class="perceptron-to-deep-line perceptron-to-deep-conn perceptron-to-deep-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#perceptron-to-deep-tip)"/>
  <g class="perceptron-to-deep-stage perceptron-to-deep-s2">
    <rect class="perceptron-to-deep-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="perceptron-to-deep-step" x="674" y="142">03</text>
    <text class="perceptron-to-deep-name" x="700" y="142">Train by gradient descent</text>
    <text class="perceptron-to-deep-desc" x="674" y="166">Backpropagation computes every weight's</text>
    <text class="perceptron-to-deep-desc" x="674" y="182">contribution to the error.</text>
    <text class="perceptron-to-deep-edge" x="674" y="242">Day 200</text>
  </g>
  <text class="perceptron-to-deep-sub" x="30" y="304">The middle change is the one that had to come first: stacking step functions produces a network that cannot be trained, which is why 1969 to 1986 took seventeen years.</text>
</svg>
