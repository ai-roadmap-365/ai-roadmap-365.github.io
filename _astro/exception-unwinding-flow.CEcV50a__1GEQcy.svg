<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" font-family="system-ui, sans-serif">
  <title>How a raised exception unwinds the call stack: parse_record raises, and because its frame has no matching handler the interpreter abandons that frame and checks load_records, whose except RecordError clause matches, so the handler runs while the finally block of every abandoned frame still executes on the way out; the inset shows the try, except, else, finally execution order for both the raising and the non-raising path</title>
  <rect x="0" y="0" width="1000" height="720" fill="#f8fafc"/>
  <text x="500" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a202c">What happens when a raise unwinds three stack frames</text>
  <text x="500" y="58" text-anchor="middle" font-size="14" fill="#1a202c">The interpreter walks outward one frame at a time, asking each: do you have a handler that matches this type?</text>

  <!-- Column headings -->
  <text x="150" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">The call stack</text>
  <text x="560" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">What the interpreter does at that frame</text>

  <!-- Frame 3: parse_record (innermost) -->
  <rect x="30" y="104" width="240" height="86" fill="#fee2e2" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="150" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">frame 3 (innermost)</text>
  <text x="150" y="150" text-anchor="middle" font-size="15" fill="#1a202c">parse_record(line, 2)</text>
  <text x="150" y="172" text-anchor="middle" font-size="14" fill="#1a202c">raise RecordError(...) from err</text>

  <line x1="270" y1="147" x2="316" y2="147" stroke="#1a202c" stroke-width="2"/>
  <polygon points="316,147 306,142 306,152" fill="#1a202c"/>
  <rect x="320" y="104" width="500" height="86" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="6"/>
  <text x="336" y="128" font-size="14" fill="#1a202c">1. An exception object is created and raised here.</text>
  <text x="336" y="150" font-size="14" fill="#1a202c">2. This frame has no handler for RecordError, so the frame is</text>
  <text x="336" y="172" font-size="14" fill="#1a202c">    recorded in the traceback and abandoned. Search moves outward.</text>
  <text x="838" y="153" font-size="14" font-weight="bold" fill="#1d4ed8">no match</text>

  <!-- Arrow down -->
  <line x1="150" y1="190" x2="150" y2="216" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="150,222 143,208 157,208" fill="#1d4ed8"/>

  <!-- Frame 2: load_records -->
  <rect x="30" y="226" width="240" height="108" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="150" y="250" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">frame 2</text>
  <text x="150" y="272" text-anchor="middle" font-size="15" fill="#1a202c">load_records(path)</text>
  <text x="150" y="294" text-anchor="middle" font-size="14" fill="#1a202c">except RecordError as err:</text>
  <text x="150" y="316" text-anchor="middle" font-size="14" fill="#1a202c">finally: handle.close()</text>

  <line x1="270" y1="270" x2="316" y2="270" stroke="#1a202c" stroke-width="2"/>
  <polygon points="316,270 306,265 306,275" fill="#1a202c"/>
  <rect x="320" y="226" width="500" height="108" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="6"/>
  <text x="336" y="250" font-size="14" fill="#1a202c">3. This frame HAS a matching except clause. The search stops.</text>
  <text x="336" y="272" font-size="14" fill="#1a202c">4. The handler body runs: log the record, keep the loop going.</text>
  <text x="336" y="294" font-size="14" fill="#1a202c">5. The exception is now handled — it does not travel any further.</text>
  <text x="336" y="316" font-size="14" fill="#1a202c">6. The finally block still runs on the way out. It always does.</text>
  <text x="852" y="276" font-size="14" font-weight="bold" fill="#1d4ed8">MATCH</text>

  <!-- Frame 1: main, greyed -->
  <rect x="30" y="368" width="240" height="86" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" rx="6"/>
  <text x="150" y="392" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">frame 1 (outermost)</text>
  <text x="150" y="414" text-anchor="middle" font-size="15" fill="#1a202c">main(argv)</text>
  <text x="150" y="436" text-anchor="middle" font-size="14" fill="#1a202c">except FileNotFoundError:</text>

  <line x1="270" y1="411" x2="316" y2="411" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="320" y="368" width="500" height="86" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" rx="6"/>
  <text x="336" y="392" font-size="14" fill="#1a202c">Never reached by THIS exception — frame 2 already handled it.</text>
  <text x="336" y="414" font-size="14" fill="#1a202c">A FileNotFoundError from open() would find no handler in frame 2,</text>
  <text x="336" y="436" font-size="14" fill="#1a202c">unwind past it, and be caught here instead. Same walk, different match.</text>

  <text x="150" y="480" text-anchor="middle" font-size="14" fill="#1a202c">If NO frame matches, the walk</text>
  <text x="150" y="498" text-anchor="middle" font-size="14" fill="#1a202c">reaches the top, the interpreter</text>
  <text x="150" y="516" text-anchor="middle" font-size="14" fill="#1a202c">prints the collected frames as a</text>
  <text x="150" y="534" text-anchor="middle" font-size="14" fill="#1a202c">traceback, and exits with status 1.</text>

  <!-- Inset: try/except/else/finally order -->
  <rect x="320" y="470" width="640" height="228" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="640" y="496" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">Execution order inside one try statement</text>

  <text x="344" y="526" font-size="15" font-weight="bold" fill="#1a202c">Nothing raised</text>
  <rect x="344" y="536" width="112" height="34" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5" rx="5"/>
  <text x="400" y="558" text-anchor="middle" font-size="14" fill="#1a202c">try body</text>
  <line x1="456" y1="553" x2="486" y2="553" stroke="#1a202c" stroke-width="2"/>
  <polygon points="486,553 476,548 476,558" fill="#1a202c"/>
  <rect x="490" y="536" width="112" height="34" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5" rx="5"/>
  <text x="546" y="558" text-anchor="middle" font-size="14" fill="#1a202c">else</text>
  <line x1="602" y1="553" x2="632" y2="553" stroke="#1a202c" stroke-width="2"/>
  <polygon points="632,553 622,548 622,558" fill="#1a202c"/>
  <rect x="636" y="536" width="112" height="34" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5" rx="5"/>
  <text x="692" y="558" text-anchor="middle" font-size="14" fill="#1a202c">finally</text>
  <text x="762" y="558" font-size="14" fill="#1a202c">except is skipped entirely</text>

  <text x="344" y="602" font-size="15" font-weight="bold" fill="#1a202c">Something raised</text>
  <rect x="344" y="612" width="112" height="34" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5" rx="5"/>
  <text x="400" y="634" text-anchor="middle" font-size="14" fill="#1a202c">try body</text>
  <line x1="456" y1="629" x2="486" y2="629" stroke="#1a202c" stroke-width="2"/>
  <polygon points="486,629 476,624 476,634" fill="#1a202c"/>
  <rect x="490" y="612" width="112" height="34" fill="#fee2e2" stroke="#1d4ed8" stroke-width="1.5" rx="5"/>
  <text x="546" y="634" text-anchor="middle" font-size="14" fill="#1a202c">except</text>
  <line x1="602" y1="629" x2="632" y2="629" stroke="#1a202c" stroke-width="2"/>
  <polygon points="632,629 622,624 622,634" fill="#1a202c"/>
  <rect x="636" y="612" width="112" height="34" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5" rx="5"/>
  <text x="692" y="634" text-anchor="middle" font-size="14" fill="#1a202c">finally</text>
  <text x="762" y="634" font-size="14" fill="#1a202c">else is skipped entirely</text>

  <text x="344" y="676" font-size="14" font-weight="bold" fill="#1d4ed8">finally runs on every path out — normal end, handled exception, unhandled exception, break, or return.</text>
</svg>
