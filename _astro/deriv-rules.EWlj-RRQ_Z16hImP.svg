<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four rules.">
  <title>Computing derivatives</title>
  <style>
    .deriv-rules-bg   { fill: #f8fafc; }
    .deriv-rules-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deriv-rules-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deriv-rules-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deriv-rules-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deriv-rules-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deriv-rules-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .deriv-rules-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .deriv-rules-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .deriv-rules-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .deriv-rules-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .deriv-rules-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .deriv-rules-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .deriv-rules-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .deriv-rules-stage { opacity: 1; }

    .deriv-rules-s0 { animation-delay: 0.00s; }
    .deriv-rules-e0 { animation-delay: 0.00s; }
    .deriv-rules-s1 { animation-delay: 1.28s; }
    .deriv-rules-e1 { animation-delay: 1.28s; }
    .deriv-rules-s2 { animation-delay: 2.56s; }
    .deriv-rules-e2 { animation-delay: 2.56s; }
    .deriv-rules-s3 { animation-delay: 3.84s; }
    .deriv-rules-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .deriv-rules-conn  { animation: deriv-rules-trace 6.4s ease-in-out infinite; }
      .deriv-rules-stage { animation: deriv-rules-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes deriv-rules-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes deriv-rules-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .deriv-rules-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .deriv-rules-stage { animation: deriv-rules-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes deriv-rules-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="deriv-rules-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="deriv-rules-bg" width="980" height="322"/>
  <text class="deriv-rules-h1"  x="30" y="40">Computing derivatives</text>
  <text class="deriv-rules-sub" x="30" y="64">Four rules.</text>
  <g class="deriv-rules-stage deriv-rules-s0">
    <rect class="deriv-rules-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="deriv-rules-step" x="44" y="142">01</text>
    <text class="deriv-rules-name" x="70" y="142">Powers: bring the exponent down, reduce it by one</text>
    <text class="deriv-rules-desc" x="44" y="166">Which covers most polynomials.</text>
  </g>
  <line class="deriv-rules-line deriv-rules-conn deriv-rules-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#deriv-rules-tip)"/>
  <g class="deriv-rules-stage deriv-rules-s1">
    <rect class="deriv-rules-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="deriv-rules-step" x="280" y="142">02</text>
    <text class="deriv-rules-name" x="306" y="142">Sums differentiate term by term</text>
    <text class="deriv-rules-desc" x="280" y="166">Which makes long expressions</text>
    <text class="deriv-rules-desc" x="280" y="182">easy.</text>
  </g>
  <line class="deriv-rules-line deriv-rules-conn deriv-rules-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#deriv-rules-tip)"/>
  <g class="deriv-rules-stage deriv-rules-s2">
    <rect class="deriv-rules-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="deriv-rules-step" x="516" y="142">03</text>
    <text class="deriv-rules-name" x="542" y="142">Products need their own rule</text>
    <text class="deriv-rules-desc" x="516" y="166">It is not the product of the</text>
    <text class="deriv-rules-desc" x="516" y="182">derivatives.</text>
  </g>
  <line class="deriv-rules-line deriv-rules-conn deriv-rules-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#deriv-rules-tip)"/>
  <g class="deriv-rules-stage deriv-rules-s3">
    <rect class="deriv-rules-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="deriv-rules-step" x="752" y="142">04</text>
    <text class="deriv-rules-name" x="778" y="142">And composition needs the chain rule</text>
    <text class="deriv-rules-desc" x="752" y="166">Which is the one that matters</text>
    <text class="deriv-rules-desc" x="752" y="182">for networks.</text>
  </g>
  <text class="deriv-rules-sub" x="30" y="304">The product rule catching people out is worth stating plainly, because the intuitive guess — multiply the derivatives — is simply wrong.</text>
</svg>
