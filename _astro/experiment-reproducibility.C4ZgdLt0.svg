<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Three things must be pinned, not one.">
  <title>What makes a result reproducible</title>
  <style>
    .experiment-reproducibility-bg   { fill: #f8fafc; }
    .experiment-reproducibility-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .experiment-reproducibility-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .experiment-reproducibility-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .experiment-reproducibility-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .experiment-reproducibility-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .experiment-reproducibility-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .experiment-reproducibility-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .experiment-reproducibility-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .experiment-reproducibility-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .experiment-reproducibility-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .experiment-reproducibility-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .experiment-reproducibility-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .experiment-reproducibility-row { opacity: 1; }
    .experiment-reproducibility-r0 { animation-delay: 0.00s; }
    .experiment-reproducibility-r1 { animation-delay: 0.45s; }
    .experiment-reproducibility-r2 { animation-delay: 0.90s; }
    .experiment-reproducibility-r3 { animation-delay: 1.35s; }
    .experiment-reproducibility-r4 { animation-delay: 1.80s; }
    .experiment-reproducibility-row { animation: experiment-reproducibility-reveal 7.3s ease-in-out infinite; }
    @keyframes experiment-reproducibility-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="experiment-reproducibility-bg" width="980" height="390"/>
  <text class="experiment-reproducibility-h1"  x="30" y="40">What makes a result reproducible</text>
  <text class="experiment-reproducibility-sub" x="30" y="64">Three things must be pinned, not one.</text>
  <rect class="experiment-reproducibility-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="experiment-reproducibility-name" x="46" y="122">Not reproducible</text>
  <text class="experiment-reproducibility-desc" x="46" y="142">"It worked last Tuesday."</text>
  <text class="experiment-reproducibility-desc experiment-reproducibility-row experiment-reproducibility-r0" x="46" y="182">Code edited after the run</text>
  <text class="experiment-reproducibility-desc experiment-reproducibility-row experiment-reproducibility-r1" x="46" y="216">Hyperparameters changed in a notebook cell</text>
  <text class="experiment-reproducibility-desc experiment-reproducibility-row experiment-reproducibility-r2" x="46" y="250">Dataset overwritten in place</text>
  <text class="experiment-reproducibility-desc experiment-reproducibility-row experiment-reproducibility-r3" x="46" y="284">No record of which version produced what</text>
  <text class="experiment-reproducibility-desc experiment-reproducibility-row experiment-reproducibility-r4" x="46" y="318">The number is real; the path to it is gone</text>
  <rect class="experiment-reproducibility-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="experiment-reproducibility-name" x="526" y="122">Reproducible</text>
  <text class="experiment-reproducibility-desc" x="526" y="142">A commit hash and a result.</text>
  <text class="experiment-reproducibility-desc experiment-reproducibility-row experiment-reproducibility-r0" x="526" y="182">Code committed before the run</text>
  <text class="experiment-reproducibility-desc experiment-reproducibility-row experiment-reproducibility-r1" x="526" y="216">Config committed alongside it</text>
  <text class="experiment-reproducibility-desc experiment-reproducibility-row experiment-reproducibility-r2" x="526" y="250">Data versioned, or at least fingerprinted</text>
  <text class="experiment-reproducibility-desc experiment-reproducibility-row experiment-reproducibility-r3" x="526" y="284">The result records the commit that produced it</text>
  <text class="experiment-reproducibility-desc experiment-reproducibility-row experiment-reproducibility-r4" x="526" y="318">Anyone can return to that exact state</text>
  <text class="experiment-reproducibility-sub" x="30" y="372">Model weights do not belong in the repository, but the commit hash that produced them does. That one string is what turns a number in a table back into something you can defend.</text>
</svg>
