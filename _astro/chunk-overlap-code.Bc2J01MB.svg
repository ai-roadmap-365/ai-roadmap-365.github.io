<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four decisions in twenty lines.">
  <title>Chunking, concretely</title>
  <style>
    .chunk-overlap-code-bg   { fill: #f8fafc; }
    .chunk-overlap-code-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunk-overlap-code-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunk-overlap-code-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunk-overlap-code-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunk-overlap-code-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunk-overlap-code-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chunk-overlap-code-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .chunk-overlap-code-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .chunk-overlap-code-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .chunk-overlap-code-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .chunk-overlap-code-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .chunk-overlap-code-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .chunk-overlap-code-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .chunk-overlap-code-stage { opacity: 1; }

    .chunk-overlap-code-s0 { animation-delay: 0.00s; }
    .chunk-overlap-code-e0 { animation-delay: 0.00s; }
    .chunk-overlap-code-s1 { animation-delay: 1.28s; }
    .chunk-overlap-code-e1 { animation-delay: 1.28s; }
    .chunk-overlap-code-s2 { animation-delay: 2.56s; }
    .chunk-overlap-code-e2 { animation-delay: 2.56s; }
    .chunk-overlap-code-s3 { animation-delay: 3.84s; }
    .chunk-overlap-code-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .chunk-overlap-code-conn  { animation: chunk-overlap-code-trace 6.4s ease-in-out infinite; }
      .chunk-overlap-code-stage { animation: chunk-overlap-code-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes chunk-overlap-code-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes chunk-overlap-code-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .chunk-overlap-code-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .chunk-overlap-code-stage { animation: chunk-overlap-code-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes chunk-overlap-code-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="chunk-overlap-code-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="chunk-overlap-code-bg" width="980" height="322"/>
  <text class="chunk-overlap-code-h1"  x="30" y="40">Chunking, concretely</text>
  <text class="chunk-overlap-code-sub" x="30" y="64">Four decisions in twenty lines.</text>
  <g class="chunk-overlap-code-stage chunk-overlap-code-s0">
    <rect class="chunk-overlap-code-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="chunk-overlap-code-step" x="44" y="142">01</text>
    <text class="chunk-overlap-code-name" x="70" y="142">Split on words, not characters</text>
    <text class="chunk-overlap-code-desc" x="44" y="166">So a chunk never ends mid-word.</text>
  </g>
  <line class="chunk-overlap-code-line chunk-overlap-code-conn chunk-overlap-code-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#chunk-overlap-code-tip)"/>
  <g class="chunk-overlap-code-stage chunk-overlap-code-s1">
    <rect class="chunk-overlap-code-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="chunk-overlap-code-step" x="280" y="142">02</text>
    <text class="chunk-overlap-code-name" x="306" y="142">Target a size in words</text>
    <text class="chunk-overlap-code-desc" x="280" y="166">Which approximates tokens</text>
    <text class="chunk-overlap-code-desc" x="280" y="182">closely enough to start.</text>
  </g>
  <line class="chunk-overlap-code-line chunk-overlap-code-conn chunk-overlap-code-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#chunk-overlap-code-tip)"/>
  <g class="chunk-overlap-code-stage chunk-overlap-code-s2">
    <rect class="chunk-overlap-code-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="chunk-overlap-code-step" x="516" y="142">03</text>
    <text class="chunk-overlap-code-name" x="542" y="142">Overlap consecutive chunks</text>
    <text class="chunk-overlap-code-desc" x="516" y="166">So an answer spanning a boundary</text>
    <text class="chunk-overlap-code-desc" x="516" y="182">survives.</text>
  </g>
  <line class="chunk-overlap-code-line chunk-overlap-code-conn chunk-overlap-code-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#chunk-overlap-code-tip)"/>
  <g class="chunk-overlap-code-stage chunk-overlap-code-s3">
    <rect class="chunk-overlap-code-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="chunk-overlap-code-step" x="752" y="142">04</text>
    <text class="chunk-overlap-code-name" x="778" y="142">And record the source and position</text>
    <text class="chunk-overlap-code-desc" x="752" y="166">Which is what makes citation</text>
    <text class="chunk-overlap-code-desc" x="752" y="182">possible later.</text>
  </g>
  <text class="chunk-overlap-code-sub" x="30" y="304">Recording position at chunk time is the decision that is painful to retrofit: without it, an answer can name a document but never point at a passage.</text>
</svg>
