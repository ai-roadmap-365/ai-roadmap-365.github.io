<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d150f-title d150f-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="d150f-title">Five noise seeds, two wildly swinging coefficients, one steady sum and one steady set of predictions</title>
  <desc id="d150f-desc">Five seed groups, each showing a pair of diverging bars for the near-duplicate column's two coefficients, revealed left to right. The bars swing above and below zero and change sign between seeds, while a flat reference line beneath each seed marks their sum, which stays close to negative 1.09 throughout, and a second flat line marks that predictions barely move. Reduced motion shows every seed and every value at once.</desc>
  <style>
    .d150f-bg { fill: #f8fafc; }
    .d150f-text { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .d150f-mono { fill: #1a202c; font-family: "SFMono-Regular", Consolas, monospace; }
    .d150f-title-text { font-size: 22px; font-weight: 700; }
    .d150f-sub { font-size: 14px; fill: #475569; }
    .d150f-label { font-size: 14px; font-weight: 600; }
    .d150f-small { font-size: 13px; }
    .d150f-zero { stroke: #94a3b8; stroke-width: 1.5; }
    .d150f-bar-a { fill: #1d4ed8; opacity: 1; }
    .d150f-bar-b { fill: #fca5a5; stroke: #b91c1c; stroke-width: 1.5; opacity: 1; }
    .d150f-sum-line { stroke: #16a34a; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; }
    .d150f-pred-line { stroke: #7c3aed; stroke-width: 2.5; fill: none; }
    .d150f-seed { animation: d150f-reveal 8s ease-in-out infinite; opacity: 1; }
    .d150f-s0 { animation-delay: 0s; }
    .d150f-s1 { animation-delay: 1.1s; }
    .d150f-s2 { animation-delay: 2.2s; }
    .d150f-s3 { animation-delay: 3.3s; }
    .d150f-s4 { animation-delay: 4.4s; }
    @keyframes d150f-reveal {
      0%   { opacity: 0.18; }
      4%   { opacity: 1; }
      88%  { opacity: 1; }
      100% { opacity: 1; }
    }
    .d150f-wire {
      stroke: #16a34a; stroke-width: 2.5; fill: none;
      stroke-dasharray: 9 7; animation: d150f-march 1.8s linear infinite;
    }
    @keyframes d150f-march { to { stroke-dashoffset: -16; } }
    @media (prefers-reduced-motion: reduce) {
      .d150f-seed { animation: none; opacity: 1; }
      .d150f-wire { animation: none; stroke-dasharray: none; }
    }
  </style>

  <rect class="d150f-bg" x="0" y="0" width="1000" height="560" />

  <text class="d150f-text d150f-title-text" x="500" y="36" text-anchor="middle">Break the exact tie with 1% noise: five seeds, five different splits</text>
  <text class="d150f-text d150f-sub" x="500" y="58" text-anchor="middle">s1 duplicated plus a little noise, refit at five different seeds — coefficient a (blue) and coefficient b (red)</text>

  <!-- Zero baseline across the chart area -->
  <line class="d150f-zero" x1="80" y1="230" x2="920" y2="230" />
  <text class="d150f-text d150f-small" x="60" y="234" text-anchor="end">0</text>

  <!-- Scale: +/- 7 mapped to +/- 130px from y=230 -->
  <!-- Seed 0: coef a +0.7592, coef b -1.8451 -->
  <g class="d150f-seed d150f-s0">
    <rect class="d150f-bar-a" x="105" y="216" width="34" height="14" />
    <rect class="d150f-bar-b" x="145" y="230" width="34" height="34" />
    <text class="d150f-text d150f-small" x="140" y="192" text-anchor="middle">seed 0</text>
    <text class="d150f-mono d150f-small" x="122" y="206" text-anchor="middle" fill="#1d4ed8">+0.76</text>
    <text class="d150f-mono d150f-small" x="162" y="278" text-anchor="middle" fill="#b91c1c">−1.85</text>
  </g>

  <!-- Seed 1: coef a +4.9238, coef b -5.9881 -->
  <g class="d150f-seed d150f-s1">
    <rect class="d150f-bar-a" x="265" y="139" width="34" height="91" />
    <rect class="d150f-bar-b" x="305" y="230" width="34" height="110" />
    <text class="d150f-text d150f-small" x="300" y="192" text-anchor="middle">seed 1</text>
    <text class="d150f-mono d150f-small" x="282" y="130" text-anchor="middle" fill="#1d4ed8">+4.92</text>
    <text class="d150f-mono d150f-small" x="322" y="354" text-anchor="middle" fill="#b91c1c">−5.99</text>
  </g>

  <!-- Seed 2: coef a -1.6402, coef b +0.5508 -->
  <g class="d150f-seed d150f-s2">
    <rect class="d150f-bar-a" x="425" y="230" width="34" height="30" />
    <rect class="d150f-bar-b" x="465" y="220" width="34" height="10" />
    <text class="d150f-text d150f-small" x="460" y="192" text-anchor="middle">seed 2</text>
    <text class="d150f-mono d150f-small" x="442" y="284" text-anchor="middle" fill="#1d4ed8">−1.64</text>
    <text class="d150f-mono d150f-small" x="482" y="210" text-anchor="middle" fill="#b91c1c">+0.55</text>
  </g>

  <!-- Seed 3: coef a +3.6831, coef b -4.7727 -->
  <g class="d150f-seed d150f-s3">
    <rect class="d150f-bar-a" x="585" y="162" width="34" height="68" />
    <rect class="d150f-bar-b" x="625" y="230" width="34" height="88" />
    <text class="d150f-text d150f-small" x="620" y="192" text-anchor="middle">seed 3</text>
    <text class="d150f-mono d150f-small" x="602" y="153" text-anchor="middle" fill="#1d4ed8">+3.68</text>
    <text class="d150f-mono d150f-small" x="642" y="332" text-anchor="middle" fill="#b91c1c">−4.77</text>
  </g>

  <!-- Seed 4: coef a -5.6134, coef b +4.4931 -->
  <g class="d150f-seed d150f-s4">
    <rect class="d150f-bar-a" x="745" y="230" width="34" height="104" />
    <rect class="d150f-bar-b" x="785" y="146" width="34" height="84" />
    <text class="d150f-text d150f-small" x="780" y="192" text-anchor="middle">seed 4</text>
    <text class="d150f-mono d150f-small" x="762" y="348" text-anchor="middle" fill="#1d4ed8">−5.61</text>
    <text class="d150f-mono d150f-small" x="802" y="136" text-anchor="middle" fill="#b91c1c">+4.49</text>
  </g>

  <!-- Legend -->
  <rect x="80" y="380" width="18" height="14" class="d150f-bar-a" />
  <text class="d150f-text d150f-small" x="104" y="392">coefficient a (unstable)</text>
  <rect x="270" y="380" width="18" height="14" class="d150f-bar-b" />
  <text class="d150f-text d150f-small" x="294" y="392">coefficient b (unstable)</text>
  <line class="d150f-wire" x1="470" y1="387" x2="520" y2="387" />
  <text class="d150f-text d150f-small" x="530" y="392">sum ≈ −1.09 (steady)</text>

  <!-- Steady sum / predictions panel -->
  <rect x="80" y="420" width="840" height="110" rx="8" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" />
  <text class="d150f-text d150f-label" x="100" y="448">Meanwhile, across all five seeds:</text>
  <text class="d150f-mono d150f-small" x="100" y="474">sum of the two coefficients:  mean −1.0891,  sd 0.0144  (never far from −1.09)</text>
  <text class="d150f-mono d150f-small" x="100" y="496">largest single prediction move across all ten seeds tried:  6.59, on a target whose own spread is 77</text>
  <text class="d150f-mono d150f-small" x="100" y="518" font-weight="700">R2 stays within 0.5178 to 0.5186 the entire time</text>

  <text class="d150f-text d150f-sub" x="500" y="552" text-anchor="middle">Wild coefficients, stable predictions — that contrast is the whole lesson</text>
</svg>
