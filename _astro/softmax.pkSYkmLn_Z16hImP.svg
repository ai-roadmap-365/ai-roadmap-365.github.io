<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="It couples the outputs.">
  <title>Softmax is different in kind</title>
  <style>
    .softmax-bg   { fill: #f8fafc; }
    .softmax-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .softmax-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .softmax-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .softmax-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .softmax-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .softmax-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .softmax-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .softmax-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .softmax-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .softmax-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .softmax-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .softmax-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .softmax-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .softmax-stage { opacity: 1; }

    .softmax-s0 { animation-delay: 0.00s; }
    .softmax-e0 { animation-delay: 0.00s; }
    .softmax-s1 { animation-delay: 1.28s; }
    .softmax-e1 { animation-delay: 1.28s; }
    .softmax-s2 { animation-delay: 2.56s; }
    .softmax-e2 { animation-delay: 2.56s; }
    .softmax-s3 { animation-delay: 3.84s; }
    .softmax-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .softmax-conn  { animation: softmax-trace 6.4s ease-in-out infinite; }
      .softmax-stage { animation: softmax-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes softmax-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes softmax-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .softmax-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .softmax-stage { animation: softmax-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes softmax-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="softmax-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="softmax-bg" width="980" height="322"/>
  <text class="softmax-h1"  x="30" y="40">Softmax is different in kind</text>
  <text class="softmax-sub" x="30" y="64">It couples the outputs.</text>
  <g class="softmax-stage softmax-s0">
    <rect class="softmax-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="softmax-step" x="44" y="142">01</text>
    <text class="softmax-name" x="70" y="142">Exponentiate each logit</text>
    <text class="softmax-desc" x="44" y="166">Making everything positive, and</text>
    <text class="softmax-desc" x="44" y="182">amplifying differences.</text>
  </g>
  <line class="softmax-line softmax-conn softmax-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#softmax-tip)"/>
  <g class="softmax-stage softmax-s1">
    <rect class="softmax-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="softmax-step" x="280" y="142">02</text>
    <text class="softmax-name" x="306" y="142">Divide by the sum</text>
    <text class="softmax-desc" x="280" y="166">So the outputs total one.</text>
  </g>
  <line class="softmax-line softmax-conn softmax-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#softmax-tip)"/>
  <g class="softmax-stage softmax-s2">
    <rect class="softmax-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="softmax-step" x="516" y="142">03</text>
    <text class="softmax-name" x="542" y="142">Which couples every output</text>
    <text class="softmax-desc" x="516" y="166">Raising one necessarily lowers</text>
    <text class="softmax-desc" x="516" y="182">the others. Not element-wise.</text>
    <text class="softmax-edge" x="516" y="242">the difference</text>
  </g>
  <line class="softmax-line softmax-conn softmax-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#softmax-tip)"/>
  <g class="softmax-stage softmax-s3">
    <rect class="softmax-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="softmax-step" x="752" y="142">04</text>
    <text class="softmax-name" x="778" y="142">So it belongs at the end, once</text>
    <text class="softmax-desc" x="752" y="166">Never in a hidden layer.</text>
  </g>
  <text class="softmax-sub" x="30" y="304">The coupling is what makes it a distribution rather than a set of independent scores, and it is also why it is the wrong function anywhere a hidden representation is wanted.</text>
</svg>
