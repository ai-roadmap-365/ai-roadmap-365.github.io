<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" role="img" font-family="system-ui, sans-serif">
  <title>The architecture of a type check. On the left are the four things mypy reads: your own annotated source, typeshed's bundled stubs for the standard library, the type information shipped by third-party packages as a py.typed marker or a separate stub package, and the settings in the [tool.mypy] table of pyproject.toml. In the middle is the checker itself in three stages: parse each file into a syntax tree, build the import graph and load every stub the graph needs, then infer a type for every expression and compare each one against what the annotations promise. On the right is the first outcome, a report printed before anything runs, each line naming a file, a line number, a message and a bracketed error code, with a non-zero exit status. Along the bottom is the second, entirely separate outcome: whenever you actually run the file, the interpreter evaluates each annotation once, stores it in __annotations__ for tools to read, and never compares a value against one, so the report above changes nothing about what the program does.</title>
  <rect x="0" y="0" width="1000" height="790" fill="#f8fafc"/>

  <text x="500" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a202c">What a type checker reads, and the two outcomes it never mixes up</text>
  <text x="500" y="62" text-anchor="middle" font-size="14" fill="#1a202c">The checker's report happens before you run. The interpreter's behaviour is unaffected by it.</text>

  <text x="165" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">WHAT IT READS</text>
  <text x="500" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">THE CHECKER</text>
  <text x="835" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">OUTCOME 1 — BEFORE RUNNING</text>

  <!-- INPUTS -->
  <rect x="30" y="110" width="270" height="86" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="165" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">your source files</text>
  <text x="165" y="160" text-anchor="middle" font-size="14" fill="#1a202c">every def, class and assignment,</text>
  <text x="165" y="182" text-anchor="middle" font-size="14" fill="#1a202c">annotated or not</text>

  <rect x="30" y="212" width="270" height="86" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="165" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">typeshed</text>
  <text x="165" y="262" text-anchor="middle" font-size="14" fill="#1a202c">bundled stubs for the whole</text>
  <text x="165" y="284" text-anchor="middle" font-size="14" fill="#1a202c">standard library — json, pathlib, os</text>

  <rect x="30" y="314" width="270" height="108" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="165" y="342" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">third-party type information</text>
  <text x="165" y="364" text-anchor="middle" font-size="14" fill="#1a202c">a py.typed marker inside the package,</text>
  <text x="165" y="386" text-anchor="middle" font-size="14" fill="#1a202c">or a separate stub package of .pyi files,</text>
  <text x="165" y="408" text-anchor="middle" font-size="14" fill="#1a202c">or nothing at all</text>

  <rect x="30" y="438" width="270" height="108" fill="#fef9c3" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="165" y="466" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">pyproject.toml</text>
  <text x="165" y="488" text-anchor="middle" font-size="14" fill="#1a202c">the [tool.mypy] table: strict,</text>
  <text x="165" y="510" text-anchor="middle" font-size="14" fill="#1a202c">disallow_untyped_defs, warn_return_any,</text>
  <text x="165" y="532" text-anchor="middle" font-size="14" fill="#1a202c">warn_unused_ignores, per-module overrides</text>

  <!-- arrows into pipeline -->
  <line x1="300" y1="153" x2="356" y2="153" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="362,153 350,147 350,159" fill="#1d4ed8"/>
  <line x1="300" y1="255" x2="356" y2="255" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="362,255 350,249 350,261" fill="#1d4ed8"/>
  <line x1="300" y1="368" x2="356" y2="368" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="362,368 350,362 350,374" fill="#1d4ed8"/>
  <line x1="300" y1="492" x2="500" y2="492" stroke="#1a202c" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="500" y1="492" x2="500" y2="454" stroke="#1a202c" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="500,448 494,460 506,460" fill="#1a202c"/>
  <text x="560" y="516" text-anchor="middle" font-size="14" fill="#1a202c">settings apply to every stage</text>

  <!-- PIPELINE -->
  <rect x="362" y="110" width="276" height="86" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="500" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">1. parse</text>
  <text x="500" y="160" text-anchor="middle" font-size="14" fill="#1a202c">each file becomes a syntax tree.</text>
  <text x="500" y="182" text-anchor="middle" font-size="14" fill="#1a202c">Nothing is executed. Ever.</text>

  <line x1="500" y1="196" x2="500" y2="206" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="500,212 494,200 506,200" fill="#1d4ed8"/>

  <rect x="362" y="212" width="276" height="86" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="500" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">2. build</text>
  <text x="500" y="262" text-anchor="middle" font-size="14" fill="#1a202c">follow every import, load the stubs</text>
  <text x="500" y="284" text-anchor="middle" font-size="14" fill="#1a202c">the graph needs, cache the result</text>

  <line x1="500" y1="298" x2="500" y2="308" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="500,314 494,302 506,302" fill="#1d4ed8"/>

  <rect x="362" y="314" width="276" height="132" fill="#dcfce7" stroke="#1d4ed8" stroke-width="3" rx="8"/>
  <text x="500" y="342" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">3. infer, then check</text>
  <text x="500" y="364" text-anchor="middle" font-size="14" fill="#1a202c">give every expression a type, even ones</text>
  <text x="500" y="386" text-anchor="middle" font-size="14" fill="#1a202c">you never annotated, then compare each</text>
  <text x="500" y="408" text-anchor="middle" font-size="14" fill="#1a202c">call, return and assignment against</text>
  <text x="500" y="430" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">what the annotations promise</text>

  <line x1="638" y1="278" x2="694" y2="278" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="700,278 688,272 688,284" fill="#1d4ed8"/>

  <!-- OUTCOME 1 -->
  <rect x="700" y="110" width="270" height="336" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3" rx="8"/>
  <text x="835" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">a report, printed to your terminal</text>
  <text x="716" y="172" font-size="14" fill="#1a202c">catalog.py:63: error: Item "None"</text>
  <text x="716" y="192" font-size="14" fill="#1a202c">of "Model | None" has no attribute</text>
  <text x="716" y="212" font-size="14" fill="#1a202c">"name"  [union-attr]</text>
  <text x="716" y="240" font-size="14" fill="#1a202c">catalog.py:85: error: Argument 2 to</text>
  <text x="716" y="260" font-size="14" fill="#1a202c">"estimate_cost" has incompatible</text>
  <text x="716" y="280" font-size="14" fill="#1a202c">type "float"; expected "int"</text>
  <text x="716" y="300" font-size="14" fill="#1a202c">  [arg-type]</text>
  <text x="716" y="330" font-size="14" fill="#1a202c">Found 3 errors in 1 file</text>
  <text x="835" y="364" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">file · line · message · ERROR CODE</text>
  <text x="835" y="392" text-anchor="middle" font-size="14" fill="#1a202c">exit status 1, so a build step can fail</text>
  <text x="835" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">no code ran, no data was touched</text>

  <!-- OUTCOME 2 -->
  <text x="500" y="588" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">OUTCOME 2 — WHENEVER YOU ACTUALLY RUN THE FILE (a completely separate story)</text>

  <line x1="165" y1="196" x2="165" y2="212" stroke="#1a202c" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="16" y1="153" x2="16" y2="640" stroke="#1a202c" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="16" y1="153" x2="30" y2="153" stroke="#1a202c" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="16" y1="640" x2="44" y2="640" stroke="#1a202c" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="50,640 38,634 38,646" fill="#1a202c"/>

  <rect x="50" y="604" width="290" height="150" fill="#fef9c3" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="195" y="632" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">the interpreter reads the file</text>
  <text x="195" y="656" text-anchor="middle" font-size="14" fill="#1a202c">each def statement runs; each</text>
  <text x="195" y="678" text-anchor="middle" font-size="14" fill="#1a202c">annotation is evaluated once and</text>
  <text x="195" y="700" text-anchor="middle" font-size="14" fill="#1a202c">stored in __annotations__, where</text>
  <text x="195" y="722" text-anchor="middle" font-size="14" fill="#1a202c">@dataclass and other tools read it</text>

  <line x1="340" y1="679" x2="396" y2="679" stroke="#1a202c" stroke-width="2"/>
  <polygon points="402,679 390,673 390,685" fill="#1a202c"/>

  <rect x="402" y="604" width="290" height="150" fill="#fef9c3" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="547" y="632" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">no value is ever compared</text>
  <text x="547" y="656" text-anchor="middle" font-size="14" fill="#1a202c">against an annotation. A function</text>
  <text x="547" y="678" text-anchor="middle" font-size="14" fill="#1a202c">declared to return str can return a</text>
  <text x="547" y="700" text-anchor="middle" font-size="14" fill="#1a202c">float and nothing raises — exactly</text>
  <text x="547" y="722" text-anchor="middle" font-size="14" fill="#1a202c">what Day 69 proved by inspection</text>

  <line x1="692" y1="679" x2="748" y2="679" stroke="#1a202c" stroke-width="2"/>
  <polygon points="754,679 742,673 742,685" fill="#1a202c"/>

  <rect x="754" y="604" width="216" height="150" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3" rx="8"/>
  <text x="862" y="638" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">the program behaves</text>
  <text x="862" y="660" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">identically whether or</text>
  <text x="862" y="682" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">not you ran the checker</text>
  <text x="862" y="712" text-anchor="middle" font-size="14" fill="#1a202c">The value of the report is</text>
  <text x="862" y="734" text-anchor="middle" font-size="14" fill="#1a202c">that you read it first.</text>
</svg>
