<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Beyond ranking: calibration</title>
  <style>
    .calibration-metrics-bg   { fill: #f8fafc; }
    .calibration-metrics-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .calibration-metrics-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .calibration-metrics-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .calibration-metrics-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .calibration-metrics-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .calibration-metrics-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .calibration-metrics-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .calibration-metrics-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .calibration-metrics-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .calibration-metrics-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .calibration-metrics-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .calibration-metrics-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .calibration-metrics-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .calibration-metrics-stage { opacity: 1; }

    .calibration-metrics-s0 { animation-delay: 0.00s; }
    .calibration-metrics-e0 { animation-delay: 0.00s; }
    .calibration-metrics-s1 { animation-delay: 1.28s; }
    .calibration-metrics-e1 { animation-delay: 1.28s; }
    .calibration-metrics-s2 { animation-delay: 2.56s; }
    .calibration-metrics-e2 { animation-delay: 2.56s; }
    .calibration-metrics-s3 { animation-delay: 3.84s; }
    .calibration-metrics-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .calibration-metrics-conn  { animation: calibration-metrics-trace 6.4s ease-in-out infinite; }
      .calibration-metrics-stage { animation: calibration-metrics-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes calibration-metrics-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes calibration-metrics-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .calibration-metrics-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .calibration-metrics-stage { animation: calibration-metrics-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes calibration-metrics-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="calibration-metrics-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="calibration-metrics-bg" width="980" height="322"/>
  <text class="calibration-metrics-h1"  x="30" y="40">Beyond ranking: calibration</text>
  <text class="calibration-metrics-sub" x="30" y="64">Four steps.</text>
  <g class="calibration-metrics-stage calibration-metrics-s0">
    <rect class="calibration-metrics-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="calibration-metrics-step" x="44" y="142">01</text>
    <text class="calibration-metrics-name" x="70" y="142">Ranking and calibration are different properties</text>
    <text class="calibration-metrics-desc" x="44" y="166">A model can rank perfectly and</text>
    <text class="calibration-metrics-desc" x="44" y="182">be badly calibrated.</text>
  </g>
  <line class="calibration-metrics-line calibration-metrics-conn calibration-metrics-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#calibration-metrics-tip)"/>
  <g class="calibration-metrics-stage calibration-metrics-s1">
    <rect class="calibration-metrics-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="calibration-metrics-step" x="280" y="142">02</text>
    <text class="calibration-metrics-name" x="306" y="142">Group predictions into probability bins</text>
    <text class="calibration-metrics-desc" x="280" y="166">All the ones predicted around</text>
    <text class="calibration-metrics-desc" x="280" y="182">seventy percent, say.</text>
  </g>
  <line class="calibration-metrics-line calibration-metrics-conn calibration-metrics-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#calibration-metrics-tip)"/>
  <g class="calibration-metrics-stage calibration-metrics-s2">
    <rect class="calibration-metrics-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="calibration-metrics-step" x="516" y="142">03</text>
    <text class="calibration-metrics-name" x="542" y="142">And compare predicted against observed frequency</text>
    <text class="calibration-metrics-desc" x="516" y="166">They should match.</text>
  </g>
  <line class="calibration-metrics-line calibration-metrics-conn calibration-metrics-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#calibration-metrics-tip)"/>
  <g class="calibration-metrics-stage calibration-metrics-s3">
    <rect class="calibration-metrics-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="calibration-metrics-step" x="752" y="142">04</text>
    <text class="calibration-metrics-name" x="778" y="142">If they do not, recalibrate on held-out data</text>
    <text class="calibration-metrics-desc" x="752" y="166">Which fixes the probabilities</text>
    <text class="calibration-metrics-desc" x="752" y="182">without refitting the model.</text>
  </g>
  <text class="calibration-metrics-sub" x="30" y="304">Calibration matters wherever the probability itself is used — for expected-cost decisions or for combining models — rather than only the ranking.</text>
</svg>
