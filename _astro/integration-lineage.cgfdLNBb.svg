<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Integration, end-to-end, pipelines, and RAG's second lessons.">
  <title>Four ideas this rests on</title>
  <style>
    .integration-lineage-bg   { fill: #f8fafc; }
    .integration-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .integration-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .integration-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .integration-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .integration-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .integration-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .integration-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .integration-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .integration-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .integration-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .integration-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .integration-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .integration-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .integration-lineage-stage { opacity: 1; }

    .integration-lineage-s0 { animation-delay: 0.00s; }
    .integration-lineage-e0 { animation-delay: 0.00s; }
    .integration-lineage-s1 { animation-delay: 1.28s; }
    .integration-lineage-e1 { animation-delay: 1.28s; }
    .integration-lineage-s2 { animation-delay: 2.56s; }
    .integration-lineage-e2 { animation-delay: 2.56s; }
    .integration-lineage-s3 { animation-delay: 3.84s; }
    .integration-lineage-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .integration-lineage-conn  { animation: integration-lineage-trace 6.4s ease-in-out infinite; }
      .integration-lineage-stage { animation: integration-lineage-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes integration-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes integration-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .integration-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .integration-lineage-stage { animation: integration-lineage-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes integration-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="integration-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="integration-lineage-bg" width="980" height="322"/>
  <text class="integration-lineage-h1"  x="30" y="40">Four ideas this rests on</text>
  <text class="integration-lineage-sub" x="30" y="64">Integration, end-to-end, pipelines, and RAG's second lessons.</text>
  <g class="integration-lineage-stage integration-lineage-s0">
    <rect class="integration-lineage-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="integration-lineage-step" x="44" y="142">01</text>
    <text class="integration-lineage-name" x="70" y="142">Integration testing, 1970s</text>
    <text class="integration-lineage-desc" x="44" y="166">Components passing unit tests do</text>
    <text class="integration-lineage-desc" x="44" y="182">not compose. Interface</text>
    <text class="integration-lineage-desc" x="44" y="198">assumptions diverge silently.</text>
  </g>
  <line class="integration-lineage-line integration-lineage-conn integration-lineage-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#integration-lineage-tip)"/>
  <g class="integration-lineage-stage integration-lineage-s1">
    <rect class="integration-lineage-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="integration-lineage-step" x="280" y="142">02</text>
    <text class="integration-lineage-name" x="306" y="142">The end-to-end argument, 1984</text>
    <text class="integration-lineage-desc" x="280" y="166">Correctness belongs at the end</text>
    <text class="integration-lineage-desc" x="280" y="182">points. Verify erasure at the</text>
    <text class="integration-lineage-desc" x="280" y="198">request, not per store.</text>
  </g>
  <line class="integration-lineage-line integration-lineage-conn integration-lineage-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#integration-lineage-tip)"/>
  <g class="integration-lineage-stage integration-lineage-s2">
    <rect class="integration-lineage-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="integration-lineage-step" x="516" y="142">03</text>
    <text class="integration-lineage-name" x="542" y="142">Pipelines as products, 2010s</text>
    <text class="integration-lineage-desc" x="516" y="166">An owner, a service level, a</text>
    <text class="integration-lineage-desc" x="516" y="182">failure budget. Not a nightly</text>
    <text class="integration-lineage-desc" x="516" y="198">script.</text>
  </g>
  <line class="integration-lineage-line integration-lineage-conn integration-lineage-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#integration-lineage-tip)"/>
  <g class="integration-lineage-stage integration-lineage-s3">
    <rect class="integration-lineage-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="integration-lineage-step" x="752" y="142">04</text>
    <text class="integration-lineage-name" x="778" y="142">Production RAG, 2023</text>
    <text class="integration-lineage-desc" x="752" y="166">Incremental ingestion, deletion,</text>
    <text class="integration-lineage-desc" x="752" y="182">cost attribution and recall</text>
    <text class="integration-lineage-desc" x="752" y="198">arrived as second lessons.</text>
  </g>
  <text class="integration-lineage-sub" x="30" y="304">The second row is why erasure is verified by read-back: each store claiming to have deleted is exactly the middle-of-the-system assurance the end-to-end argument warns against.</text>
</svg>
