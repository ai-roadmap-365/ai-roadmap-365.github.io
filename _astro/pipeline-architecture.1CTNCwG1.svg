<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" width="1180" height="700" role="img" aria-labelledby="d126aTitleId d126aDescId">
  <title id="d126aTitleId">A reproducible pipeline's architecture: contracts at both boundaries, a checkpoint mid-pipeline, and a manifest collecting hashes off to one side</title>
  <desc id="d126aDescId">Raw input flows through an input contract gate, seven named steps in their declared order (parse currency amount, normalise region strings, deduplicate orders, impute missing amount, clip amount to a fixed ceiling, add amount z-score, sort deterministic), a Parquet checkpoint between the fourth and fifth steps, and an output contract gate, ending in clean output. A manifest box to the side collects four hashes and the step log: the input hash, the config hash, the per-step log, and the output hash.</desc>

  <style>
    .d126a-bg      { fill: #f8fafc; }
    .d126a-title   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; fill: #1a202c; }
    .d126a-sub     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d126a-stage   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; fill: #1d4ed8; letter-spacing: 0.5px; }
    .d126a-label   { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; fill: #1a202c; }
    .d126a-labelsm { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; fill: #1a202c; }
    .d126a-caption { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d126a-note    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; fill: #475569; }
    .d126a-box     { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.25; }
    .d126a-step    { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d126a-gate    { fill: #fef9c3; stroke: #b45309; stroke-width: 1.75; }
    .d126a-checkpoint { fill: #f0fdf4; stroke: #047857; stroke-width: 1.5; }
    .d126a-manifest { fill: #faf5ff; stroke: #7e22ce; stroke-width: 1.5; }
    .d126a-end     { fill: #dcfce7; stroke: #047857; stroke-width: 1.75; }
    .d126a-arrow   { stroke: #1d4ed8; stroke-width: 2; fill: none; marker-end: url(#d126a-arrowhead); }
    .d126a-dash    { stroke: #7e22ce; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; marker-end: url(#d126a-arrowhead-purple); }
  </style>

  <defs>
    <marker id="d126a-arrowhead" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#1d4ed8" />
    </marker>
    <marker id="d126a-arrowhead-purple" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#7e22ce" />
    </marker>
  </defs>

  <rect class="d126a-bg" x="0" y="0" width="1180" height="700" />

  <text class="d126a-title" x="24" y="34">A pipeline's architecture</text>
  <text class="d126a-sub" x="24" y="54">Contracts at both ends. A checkpoint mid-run. A manifest that ties output back to input.</text>

  <!-- ============================ RAW INPUT ============================ -->
  <rect class="d126a-box" x="20" y="100" width="110" height="60" rx="6" />
  <text class="d126a-stage" x="26" y="94">SOURCE</text>
  <text class="d126a-label" x="35" y="126">raw</text>
  <text class="d126a-label" x="35" y="142">orders</text>

  <!-- ============================ INPUT CONTRACT GATE ============================ -->
  <polygon class="d126a-gate" points="185,100 245,100 265,130 245,160 185,160 165,130" />
  <text class="d126a-labelsm" x="177" y="126">input</text>
  <text class="d126a-labelsm" x="172" y="140">contract</text>

  <line class="d126a-arrow" x1="130" y1="130" x2="163" y2="130" />

  <!-- ============================ SEVEN STEPS ============================ -->
  <!-- Step boxes laid out in two rows of the flow, left to right then wrapping -->
  <!-- Row 1: steps 1-4 -->
  <g>
    <rect class="d126a-step" x="300" y="95" width="150" height="70" rx="6" />
    <text class="d126a-labelsm" x="312" y="118">1. parse_currency</text>
    <text class="d126a-labelsm" x="312" y="132">_amount</text>
    <text class="d126a-note" x="312" y="152">"$120.50" -&gt; 120.50</text>
  </g>
  <line class="d126a-arrow" x1="265" y1="130" x2="298" y2="130" />

  <g>
    <rect class="d126a-step" x="475" y="95" width="150" height="70" rx="6" />
    <text class="d126a-labelsm" x="487" y="118">2. normalize_region</text>
    <text class="d126a-labelsm" x="487" y="132">_strings</text>
    <text class="d126a-note" x="487" y="152">" north" -&gt; "North"</text>
  </g>
  <line class="d126a-arrow" x1="450" y1="130" x2="473" y2="130" />

  <g>
    <rect class="d126a-step" x="650" y="95" width="150" height="70" rx="6" />
    <text class="d126a-labelsm" x="662" y="118">3. dedupe_orders</text>
    <text class="d126a-note" x="662" y="140">order_id 3 removed</text>
    <text class="d126a-note" x="662" y="154">(resubmission)</text>
  </g>
  <line class="d126a-arrow" x1="625" y1="130" x2="648" y2="130" />

  <g>
    <rect class="d126a-step" x="825" y="95" width="150" height="70" rx="6" />
    <text class="d126a-labelsm" x="837" y="118">4. impute_missing</text>
    <text class="d126a-labelsm" x="837" y="132">_amount</text>
    <text class="d126a-note" x="837" y="152">fills with mean</text>
  </g>
  <line class="d126a-arrow" x1="800" y1="130" x2="823" y2="130" />

  <!-- CHECKPOINT icon between row 1 and row 2 -->
  <g transform="translate(1000,80)">
    <rect class="d126a-checkpoint" x="0" y="15" width="130" height="90" rx="6" />
    <text class="d126a-stage" x="8" y="10">CHECKPOINT</text>
    <text class="d126a-labelsm" x="10" y="38">.parquet</text>
    <ellipse cx="65" cy="58" rx="40" ry="10" fill="#ffffff" stroke="#047857" stroke-width="1.25" />
    <path d="M25,58 L25,80 A40,10 0 0 0 105,80 L105,58" fill="#ffffff" stroke="#047857" stroke-width="1.25" />
    <text class="d126a-note" x="12" y="98">dtypes exact --</text>
  </g>
  <line class="d126a-arrow" x1="975" y1="130" x2="998" y2="130" />

  <!-- Turn down into row 2 -->
  <path class="d126a-arrow" d="M 1065 170 L 1065 210 L 975 210" fill="none" />

  <!-- Row 2: steps 5-7, right to left -->
  <g>
    <rect class="d126a-step" x="800" y="210" width="150" height="70" rx="6" />
    <text class="d126a-labelsm" x="812" y="233">5. clip_amount_to</text>
    <text class="d126a-labelsm" x="812" y="247">_fixed_ceiling</text>
    <text class="d126a-note" x="812" y="267">ceiling read from config</text>
  </g>
  <line class="d126a-arrow" x1="775" y1="245" x2="798" y2="245" />

  <g>
    <rect class="d126a-step" x="600" y="210" width="150" height="70" rx="6" />
    <text class="d126a-labelsm" x="612" y="233">6. add_amount</text>
    <text class="d126a-labelsm" x="612" y="247">_zscore</text>
    <text class="d126a-note" x="612" y="267">fixed reference mean/std</text>
  </g>
  <line class="d126a-arrow" x1="575" y1="245" x2="598" y2="245" />

  <g>
    <rect class="d126a-step" x="400" y="210" width="150" height="70" rx="6" />
    <text class="d126a-labelsm" x="412" y="233">7. sort_deterministic</text>
    <text class="d126a-note" x="412" y="253">amount, then order_id</text>
    <text class="d126a-note" x="412" y="267">(explicit tie-break)</text>
  </g>
  <line class="d126a-arrow" x1="375" y1="245" x2="398" y2="245" />

  <!-- ============================ OUTPUT CONTRACT GATE ============================ -->
  <polygon class="d126a-gate" points="250,215 310,215 330,245 310,275 250,275 230,245" />
  <text class="d126a-labelsm" x="242" y="241">output</text>
  <text class="d126a-labelsm" x="235" y="255">contract</text>
  <line class="d126a-arrow" x1="230" y1="245" x2="232" y2="245" />
  <line class="d126a-arrow" x1="398" y1="245" x2="330" y2="245" />

  <!-- ============================ CLEAN OUTPUT ============================ -->
  <rect class="d126a-end" x="60" y="215" width="110" height="60" rx="6" />
  <text class="d126a-stage" x="66" y="209">RESULT</text>
  <text class="d126a-label" x="75" y="241">clean</text>
  <text class="d126a-label" x="75" y="257">orders</text>
  <line class="d126a-arrow" x1="228" y1="245" x2="172" y2="245" />

  <!-- ============================ MANIFEST ============================ -->
  <rect class="d126a-manifest" x="820" y="360" width="330" height="220" rx="8" />
  <text class="d126a-stage" x="832" y="352">MANIFEST (manifest.json)</text>
  <text class="d126a-label" x="836" y="392">input_hash:   sha256(raw bytes)</text>
  <text class="d126a-label" x="836" y="416">config_hash:  sha256(config json)</text>
  <text class="d126a-label" x="836" y="440">steps: [</text>
  <text class="d126a-labelsm" x="852" y="458">{step: parse_currency_amount, ...},</text>
  <text class="d126a-labelsm" x="852" y="474">{step: normalize_region_strings, ...},</text>
  <text class="d126a-labelsm" x="852" y="490">{step: dedupe_orders, delta: -1},</text>
  <text class="d126a-labelsm" x="852" y="506">... (7 steps total)</text>
  <text class="d126a-label" x="836" y="524">]</text>
  <text class="d126a-label" x="836" y="548">output_hash:  sha256(output bytes)</text>

  <!-- dashed lines collecting hashes from input, config, log, output -->
  <path class="d126a-dash" d="M 75 160 C 300 320, 600 420, 818 430" />
  <path class="d126a-dash" d="M 300 420 L 818 460" />
  <path class="d126a-dash" d="M 500 280 C 650 340, 750 400, 818 490" />
  <path class="d126a-dash" d="M 115 275 C 200 420, 500 560, 818 540" />

  <rect class="d126a-box" x="260" y="380" width="120" height="50" rx="6" />
  <text class="d126a-labelsm" x="270" y="402">config.py</text>
  <text class="d126a-note" x="270" y="418">thresholds, mappings</text>

  <!-- ============================ CAPTION ============================ -->
  <rect x="20" y="610" width="1140" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text class="d126a-caption" x="36" y="634">Every step is a pure function, in a declared order. Contracts are gates the data must pass, not comments.</text>
  <text class="d126a-caption" x="36" y="656">The checkpoint means a failure after step 4 does not require re-running steps 1-4. The manifest is what makes</text>
  <text class="d126a-caption" x="36" y="676">"which data produced this number?" answerable months later -- without it, that question has no answer.</text>
</svg>
