<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Correctness against work avoided.">
  <title>Exact or approximate</title>
  <style>
    .exact-or-approximate-bg   { fill: #f8fafc; }
    .exact-or-approximate-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exact-or-approximate-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exact-or-approximate-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exact-or-approximate-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exact-or-approximate-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exact-or-approximate-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exact-or-approximate-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .exact-or-approximate-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .exact-or-approximate-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .exact-or-approximate-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .exact-or-approximate-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .exact-or-approximate-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exact-or-approximate-row { opacity: 1; }
    .exact-or-approximate-r0 { animation-delay: 0.00s; }
    .exact-or-approximate-r1 { animation-delay: 0.45s; }
    .exact-or-approximate-r2 { animation-delay: 0.90s; }
    .exact-or-approximate-r3 { animation-delay: 1.35s; }
    .exact-or-approximate-r4 { animation-delay: 1.80s; }
    .exact-or-approximate-row { animation: exact-or-approximate-reveal 7.3s ease-in-out infinite; }
    @keyframes exact-or-approximate-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="exact-or-approximate-bg" width="980" height="390"/>
  <text class="exact-or-approximate-h1"  x="30" y="40">Exact or approximate</text>
  <text class="exact-or-approximate-sub" x="30" y="64">Correctness against work avoided.</text>
  <rect class="exact-or-approximate-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="exact-or-approximate-name" x="46" y="122">Exact</text>
  <text class="exact-or-approximate-desc" x="46" y="142">Cannot be wrong.</text>
  <text class="exact-or-approximate-desc exact-or-approximate-row exact-or-approximate-r0" x="46" y="182">Compares against every vector</text>
  <text class="exact-or-approximate-desc exact-or-approximate-row exact-or-approximate-r1" x="46" y="216">Linear in corpus size</text>
  <text class="exact-or-approximate-desc exact-or-approximate-row exact-or-approximate-r2" x="46" y="250">Recall is 1.0, by definition</text>
  <text class="exact-or-approximate-desc exact-or-approximate-row exact-or-approximate-r3" x="46" y="284">No index to build or rebuild</text>
  <text class="exact-or-approximate-desc exact-or-approximate-row exact-or-approximate-r4" x="46" y="318">Viable to a few hundred thousand vectors</text>
  <rect class="exact-or-approximate-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="exact-or-approximate-name" x="526" y="122">Approximate</text>
  <text class="exact-or-approximate-desc" x="526" y="142">Probably the right ones.</text>
  <text class="exact-or-approximate-desc exact-or-approximate-row exact-or-approximate-r0" x="526" y="182">Compares against a chosen subset</text>
  <text class="exact-or-approximate-desc exact-or-approximate-row exact-or-approximate-r1" x="526" y="216">Sub-linear, at a tuning parameter</text>
  <text class="exact-or-approximate-desc exact-or-approximate-row exact-or-approximate-r2" x="526" y="250">Recall is less than 1.0, always</text>
  <text class="exact-or-approximate-desc exact-or-approximate-row exact-or-approximate-r3" x="526" y="284">An index to build and maintain</text>
  <text class="exact-or-approximate-desc exact-or-approximate-row exact-or-approximate-r4" x="526" y="318">And a recall loss nobody measured</text>
  <text class="exact-or-approximate-sub" x="30" y="372">"How much recall am I willing to lose, and what does that buy me?" is a product decision wearing an infrastructure costume, and it is routinely made by accepting a default.</text>
</svg>
