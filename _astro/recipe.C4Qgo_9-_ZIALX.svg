<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Versus cooking from memory.">
  <title>A written recipe</title>
  <style>
    .recipe-bg   { fill: #f8fafc; }
    .recipe-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recipe-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recipe-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recipe-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recipe-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recipe-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .recipe-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .recipe-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .recipe-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .recipe-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .recipe-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .recipe-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .recipe-row { opacity: 1; }
    .recipe-r0 { animation-delay: 0.00s; }
    .recipe-r1 { animation-delay: 0.45s; }
    .recipe-r2 { animation-delay: 0.90s; }
    .recipe-r3 { animation-delay: 1.35s; }
    .recipe-r4 { animation-delay: 1.80s; }
    .recipe-row { animation: recipe-reveal 7.3s ease-in-out infinite; }
    @keyframes recipe-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="recipe-bg" width="980" height="390"/>
  <text class="recipe-h1"  x="30" y="40">A written recipe</text>
  <text class="recipe-sub" x="30" y="64">Versus cooking from memory.</text>
  <rect class="recipe-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="recipe-name" x="46" y="122">Written down</text>
  <text class="recipe-desc" x="46" y="142">Repeatable by anyone.</text>
  <text class="recipe-desc recipe-row recipe-r0" x="46" y="182">Ingredients and quantities listed</text>
  <text class="recipe-desc recipe-row recipe-r1" x="46" y="216">Steps in order</text>
  <text class="recipe-desc recipe-row recipe-r2" x="46" y="250">Anyone can follow it</text>
  <text class="recipe-desc recipe-row recipe-r3" x="46" y="284">The same result each time</text>
  <text class="recipe-desc recipe-row recipe-r4" x="46" y="318">This is a cleaning pipeline</text>
  <rect class="recipe-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="recipe-name" x="526" y="122">From memory</text>
  <text class="recipe-desc" x="526" y="142">Repeatable by one person.</text>
  <text class="recipe-desc recipe-row recipe-r0" x="526" y="182">Quantities approximate</text>
  <text class="recipe-desc recipe-row recipe-r1" x="526" y="216">Order recalled differently</text>
  <text class="recipe-desc recipe-row recipe-r2" x="526" y="250">Only the cook can do it</text>
  <text class="recipe-desc recipe-row recipe-r3" x="526" y="284">Different result each time</text>
  <text class="recipe-desc recipe-row recipe-r4" x="526" y="318">This is manual cleaning</text>
  <text class="recipe-sub" x="30" y="372">Only the cook being able to do it is the organisational risk, and it is why an undocumented cleaning process is a single point of failure.</text>
</svg>
