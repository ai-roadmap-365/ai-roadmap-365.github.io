<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Both, in that order.">
  <title>From scratch, or from the library</title>
  <style>
    .scratch-or-library-bg   { fill: #f8fafc; }
    .scratch-or-library-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-or-library-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-or-library-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-or-library-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-or-library-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-or-library-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scratch-or-library-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scratch-or-library-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scratch-or-library-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scratch-or-library-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scratch-or-library-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scratch-or-library-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scratch-or-library-row { opacity: 1; }
    .scratch-or-library-r0 { animation-delay: 0.00s; }
    .scratch-or-library-r1 { animation-delay: 0.45s; }
    .scratch-or-library-r2 { animation-delay: 0.90s; }
    .scratch-or-library-r3 { animation-delay: 1.35s; }
    .scratch-or-library-r4 { animation-delay: 1.80s; }
    .scratch-or-library-row { animation: scratch-or-library-reveal 7.3s ease-in-out infinite; }
    @keyframes scratch-or-library-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="scratch-or-library-bg" width="980" height="390"/>
  <text class="scratch-or-library-h1"  x="30" y="40">From scratch, or from the library</text>
  <text class="scratch-or-library-sub" x="30" y="64">Both, in that order.</text>
  <rect class="scratch-or-library-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="scratch-or-library-name" x="46" y="122">From scratch</text>
  <text class="scratch-or-library-desc" x="46" y="142">To understand.</text>
  <text class="scratch-or-library-desc scratch-or-library-row scratch-or-library-r0" x="46" y="182">Every equation written out</text>
  <text class="scratch-or-library-desc scratch-or-library-row scratch-or-library-r1" x="46" y="216">Shapes and masks reasoned about directly</text>
  <text class="scratch-or-library-desc scratch-or-library-row scratch-or-library-r2" x="46" y="250">Errors are yours and findable</text>
  <text class="scratch-or-library-desc scratch-or-library-row scratch-or-library-r3" x="46" y="284">Slow, and entirely transparent</text>
  <text class="scratch-or-library-desc scratch-or-library-row scratch-or-library-r4" x="46" y="318">Do it once</text>
  <rect class="scratch-or-library-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="scratch-or-library-name" x="526" y="122">From the library</text>
  <text class="scratch-or-library-desc" x="526" y="142">To work.</text>
  <text class="scratch-or-library-desc scratch-or-library-row scratch-or-library-r0" x="526" y="182">Pretrained weights in one line</text>
  <text class="scratch-or-library-desc scratch-or-library-row scratch-or-library-r1" x="526" y="216">Optimised kernels and distribution</text>
  <text class="scratch-or-library-desc scratch-or-library-row scratch-or-library-r2" x="526" y="250">Standard interfaces across architectures</text>
  <text class="scratch-or-library-desc scratch-or-library-row scratch-or-library-r3" x="526" y="284">Still ordinary modules underneath</text>
  <text class="scratch-or-library-desc scratch-or-library-row scratch-or-library-r4" x="526" y="318">Inspect any weight, hook any layer</text>
  <text class="scratch-or-library-sub" x="30" y="372">The last row matters: these are not opaque wrappers but native modules, so everything learned from the scratch implementation applies directly to debugging the library version.</text>
</svg>
