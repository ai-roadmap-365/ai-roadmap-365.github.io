<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the feedback available.">
  <title>Which paradigm when</title>
  <style>
    .paradigm-when-bg   { fill: #f8fafc; }
    .paradigm-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .paradigm-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .paradigm-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .paradigm-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .paradigm-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .paradigm-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .paradigm-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .paradigm-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .paradigm-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .paradigm-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .paradigm-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .paradigm-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .paradigm-when-row { opacity: 1; }
    .paradigm-when-r0 { animation-delay: 0.00s; }
    .paradigm-when-r1 { animation-delay: 0.45s; }
    .paradigm-when-r2 { animation-delay: 0.90s; }
    .paradigm-when-r3 { animation-delay: 1.35s; }
    .paradigm-when-r4 { animation-delay: 1.80s; }
    .paradigm-when-row { animation: paradigm-when-reveal 7.3s ease-in-out infinite; }
    @keyframes paradigm-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="paradigm-when-bg" width="980" height="390"/>
  <text class="paradigm-when-h1"  x="30" y="40">Which paradigm when</text>
  <text class="paradigm-when-sub" x="30" y="64">By the feedback available.</text>
  <rect class="paradigm-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="paradigm-when-name" x="46" y="122">What you have</text>
  <text class="paradigm-when-desc" x="46" y="142">The feedback.</text>
  <text class="paradigm-when-desc paradigm-when-row paradigm-when-r0" x="46" y="182">Labelled examples of the right answer</text>
  <text class="paradigm-when-desc paradigm-when-row paradigm-when-r1" x="46" y="216">Data with no labels, and a vague goal</text>
  <text class="paradigm-when-desc paradigm-when-row paradigm-when-r2" x="46" y="250">An environment and a reward, no correct actions</text>
  <text class="paradigm-when-desc paradigm-when-row paradigm-when-r3" x="46" y="284">Abundant unlabelled data, structure within it</text>
  <text class="paradigm-when-desc paradigm-when-row paradigm-when-r4" x="46" y="318">A working policy's action log</text>
  <rect class="paradigm-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="paradigm-when-name" x="526" y="122">What to use</text>
  <text class="paradigm-when-desc" x="526" y="142">The paradigm.</text>
  <text class="paradigm-when-desc paradigm-when-row paradigm-when-r0" x="526" y="182">Supervised learning</text>
  <text class="paradigm-when-desc paradigm-when-row paradigm-when-r1" x="526" y="216">Unsupervised, with external validation</text>
  <text class="paradigm-when-desc paradigm-when-row paradigm-when-r2" x="526" y="250">Reinforcement learning</text>
  <text class="paradigm-when-desc paradigm-when-row paradigm-when-r3" x="526" y="284">Self-supervised pretraining</text>
  <text class="paradigm-when-desc paradigm-when-row paradigm-when-r4" x="526" y="318">Imitation, plus corrective data</text>
  <text class="paradigm-when-sub" x="30" y="372">The last row is where teams most often go wrong, by treating a log as a supervised dataset and discovering the compounding-error problem in production.</text>
</svg>
