<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Ranking metrics</title>
  <style>
    .ndcg-bg   { fill: #f8fafc; }
    .ndcg-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ndcg-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ndcg-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ndcg-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ndcg-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ndcg-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ndcg-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ndcg-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ndcg-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ndcg-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ndcg-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ndcg-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .ndcg-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .ndcg-stage { opacity: 1; }

    .ndcg-s0 { animation-delay: 0.00s; }
    .ndcg-e0 { animation-delay: 0.00s; }
    .ndcg-s1 { animation-delay: 1.28s; }
    .ndcg-e1 { animation-delay: 1.28s; }
    .ndcg-s2 { animation-delay: 2.56s; }
    .ndcg-e2 { animation-delay: 2.56s; }
    .ndcg-s3 { animation-delay: 3.84s; }
    .ndcg-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .ndcg-conn  { animation: ndcg-trace 6.4s ease-in-out infinite; }
      .ndcg-stage { animation: ndcg-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes ndcg-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes ndcg-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .ndcg-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ndcg-stage { animation: ndcg-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes ndcg-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ndcg-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="ndcg-bg" width="980" height="322"/>
  <text class="ndcg-h1"  x="30" y="40">Ranking metrics</text>
  <text class="ndcg-sub" x="30" y="64">Four steps.</text>
  <g class="ndcg-stage ndcg-s0">
    <rect class="ndcg-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="ndcg-step" x="44" y="142">01</text>
    <text class="ndcg-name" x="70" y="142">Each result has a graded relevance</text>
    <text class="ndcg-desc" x="44" y="166">Not merely relevant or not.</text>
  </g>
  <line class="ndcg-line ndcg-conn ndcg-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#ndcg-tip)"/>
  <g class="ndcg-stage ndcg-s1">
    <rect class="ndcg-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="ndcg-step" x="280" y="142">02</text>
    <text class="ndcg-name" x="306" y="142">Discounted by its position</text>
    <text class="ndcg-desc" x="280" y="166">A good result at rank one is</text>
    <text class="ndcg-desc" x="280" y="182">worth more than at rank ten.</text>
  </g>
  <line class="ndcg-line ndcg-conn ndcg-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#ndcg-tip)"/>
  <g class="ndcg-stage ndcg-s2">
    <rect class="ndcg-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="ndcg-step" x="516" y="142">03</text>
    <text class="ndcg-name" x="542" y="142">Accumulated across the top results</text>
    <text class="ndcg-desc" x="516" y="166">Giving one score for the whole</text>
    <text class="ndcg-desc" x="516" y="182">list.</text>
  </g>
  <line class="ndcg-line ndcg-conn ndcg-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#ndcg-tip)"/>
  <g class="ndcg-stage ndcg-s3">
    <rect class="ndcg-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="ndcg-step" x="752" y="142">04</text>
    <text class="ndcg-name" x="778" y="142">Then normalised by the ideal ordering</text>
    <text class="ndcg-desc" x="752" y="166">So it is comparable across</text>
    <text class="ndcg-desc" x="752" y="182">queries.</text>
    <text class="ndcg-edge" x="752" y="242">0 to 1</text>
  </g>
  <text class="ndcg-sub" x="30" y="304">Accuracy on a ranking problem measures almost nothing, because it ignores order entirely — and order is the only thing a ranking system controls.</text>
</svg>
