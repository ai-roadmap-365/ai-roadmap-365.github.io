<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Six states, and two of them end it.">
  <title>The agent as a state machine</title>
  <style>
    .state-machine-bg   { fill: #f8fafc; }
    .state-machine-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .state-machine-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .state-machine-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .state-machine-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .state-machine-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .state-machine-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .state-machine-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .state-machine-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .state-machine-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .state-machine-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .state-machine-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .state-machine-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .state-machine-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .state-machine-stage { opacity: 1; }

    .state-machine-s0 { animation-delay: 0.00s; }
    .state-machine-e0 { animation-delay: 0.00s; }
    .state-machine-s1 { animation-delay: 1.33s; }
    .state-machine-e1 { animation-delay: 1.33s; }
    .state-machine-s2 { animation-delay: 2.67s; }
    .state-machine-e2 { animation-delay: 2.67s; }
    .state-machine-s3 { animation-delay: 4.00s; }
    .state-machine-e3 { animation-delay: 4.00s; }
    .state-machine-s4 { animation-delay: 5.33s; }
    .state-machine-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .state-machine-conn  { animation: state-machine-trace 8s ease-in-out infinite; }
      .state-machine-stage { animation: state-machine-arrive 8s ease-in-out infinite; }
    }
    @keyframes state-machine-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes state-machine-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .state-machine-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .state-machine-stage { animation: state-machine-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes state-machine-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="state-machine-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="state-machine-bg" width="980" height="322"/>
  <text class="state-machine-h1"  x="30" y="40">The agent as a state machine</text>
  <text class="state-machine-sub" x="30" y="64">Six states, and two of them end it.</text>
  <g class="state-machine-stage state-machine-s0">
    <rect class="state-machine-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="state-machine-step" x="44" y="142">01</text>
    <text class="state-machine-name" x="70" y="142">THINKING</text>
    <text class="state-machine-desc" x="44" y="166">The model is producing a</text>
    <text class="state-machine-desc" x="44" y="182">thought and an action.</text>
  </g>
  <line class="state-machine-line state-machine-conn state-machine-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#state-machine-tip)"/>
  <g class="state-machine-stage state-machine-s1">
    <rect class="state-machine-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="state-machine-step" x="233" y="142">02</text>
    <text class="state-machine-name" x="259" y="142">TOOL_CALL</text>
    <text class="state-machine-desc" x="233" y="166">Arguments validated</text>
    <text class="state-machine-desc" x="233" y="182">against the schema, then</text>
    <text class="state-machine-desc" x="233" y="198">executed.</text>
  </g>
  <line class="state-machine-line state-machine-conn state-machine-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#state-machine-tip)"/>
  <g class="state-machine-stage state-machine-s2">
    <rect class="state-machine-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="state-machine-step" x="422" y="142">03</text>
    <text class="state-machine-name" x="448" y="142">OBSERVING</text>
    <text class="state-machine-desc" x="422" y="166">The result formatted for</text>
    <text class="state-machine-desc" x="422" y="182">the model to read.</text>
  </g>
  <line class="state-machine-line state-machine-conn state-machine-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#state-machine-tip)"/>
  <g class="state-machine-stage state-machine-s3">
    <rect class="state-machine-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="state-machine-step" x="611" y="142">04</text>
    <text class="state-machine-name" x="637" y="142">EVALUATING</text>
    <text class="state-machine-desc" x="611" y="166">Is the goal satisfied? Is</text>
    <text class="state-machine-desc" x="611" y="182">the budget spent? Is this</text>
    <text class="state-machine-desc" x="611" y="198">a cycle?</text>
    <text class="state-machine-edge" x="611" y="242">the predicate</text>
  </g>
  <line class="state-machine-line state-machine-conn state-machine-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#state-machine-tip)"/>
  <g class="state-machine-stage state-machine-s4">
    <rect class="state-machine-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="state-machine-step" x="800" y="142">05</text>
    <text class="state-machine-name" x="826" y="142">FINAL_ANSWER or TERMINATED</text>
    <text class="state-machine-desc" x="800" y="166">Success, or a bound was</text>
    <text class="state-machine-desc" x="800" y="182">hit. Both are terminal.</text>
  </g>
  <text class="state-machine-sub" x="30" y="304">Modelling this explicitly rather than as a while-loop with breaks is what makes an agent debuggable: every transition is loggable, and a stuck agent is stuck in a named state rather than somewhere in a function.</text>
</svg>
