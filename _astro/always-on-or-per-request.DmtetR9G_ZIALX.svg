<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Neither is better; traffic decides.">
  <title>Two billing shapes</title>
  <style>
    .always-on-or-per-request-bg   { fill: #f8fafc; }
    .always-on-or-per-request-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .always-on-or-per-request-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .always-on-or-per-request-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .always-on-or-per-request-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .always-on-or-per-request-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .always-on-or-per-request-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .always-on-or-per-request-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .always-on-or-per-request-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .always-on-or-per-request-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .always-on-or-per-request-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .always-on-or-per-request-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .always-on-or-per-request-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .always-on-or-per-request-row { opacity: 1; }
    .always-on-or-per-request-r0 { animation-delay: 0.00s; }
    .always-on-or-per-request-r1 { animation-delay: 0.45s; }
    .always-on-or-per-request-r2 { animation-delay: 0.90s; }
    .always-on-or-per-request-r3 { animation-delay: 1.35s; }
    .always-on-or-per-request-r4 { animation-delay: 1.80s; }
    .always-on-or-per-request-row { animation: always-on-or-per-request-reveal 7.3s ease-in-out infinite; }
    @keyframes always-on-or-per-request-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="always-on-or-per-request-bg" width="980" height="390"/>
  <text class="always-on-or-per-request-h1"  x="30" y="40">Two billing shapes</text>
  <text class="always-on-or-per-request-sub" x="30" y="64">Neither is better; traffic decides.</text>
  <rect class="always-on-or-per-request-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="always-on-or-per-request-name" x="46" y="122">Always-on</text>
  <text class="always-on-or-per-request-desc" x="46" y="142">Compute cost does not move.</text>
  <text class="always-on-or-per-request-desc always-on-or-per-request-row always-on-or-per-request-r0" x="46" y="182">$7.59 at 20k requests</text>
  <text class="always-on-or-per-request-desc always-on-or-per-request-row always-on-or-per-request-r1" x="46" y="216">$7.59 at 20M requests</text>
  <text class="always-on-or-per-request-desc always-on-or-per-request-row always-on-or-per-request-r2" x="46" y="250">Bills at 3am with no users</text>
  <text class="always-on-or-per-request-desc always-on-or-per-request-row always-on-or-per-request-r3" x="46" y="284">Predictable, and capped</text>
  <text class="always-on-or-per-request-desc always-on-or-per-request-row always-on-or-per-request-r4" x="46" y="318">Wins past the crossover</text>
  <rect class="always-on-or-per-request-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="always-on-or-per-request-name" x="526" y="122">Per-request</text>
  <text class="always-on-or-per-request-desc" x="526" y="142">Proportional, no ceiling.</text>
  <text class="always-on-or-per-request-desc always-on-or-per-request-row always-on-or-per-request-r0" x="526" y="182">$0.00 at zero traffic</text>
  <text class="always-on-or-per-request-desc always-on-or-per-request-row always-on-or-per-request-r1" x="526" y="216">$194.88 of compute at 20M</text>
  <text class="always-on-or-per-request-desc always-on-or-per-request-row always-on-or-per-request-r2" x="526" y="250">Scale-to-zero makes idle free</text>
  <text class="always-on-or-per-request-desc always-on-or-per-request-row always-on-or-per-request-r3" x="526" y="284">No capacity to size</text>
  <text class="always-on-or-per-request-desc always-on-or-per-request-row always-on-or-per-request-r4" x="526" y="318">Wins at launch, decisively</text>
  <text class="always-on-or-per-request-sub" x="30" y="372">The VM's identical compute figure at both traffic levels is the definition of always-on billing, and it is the entire reason the two lines cross rather than running parallel.</text>
</svg>
