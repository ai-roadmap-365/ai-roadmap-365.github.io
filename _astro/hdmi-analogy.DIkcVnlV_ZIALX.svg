<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A jungle of cables, or one plug.">
  <title>Before and after HDMI</title>
  <style>
    .hdmi-analogy-bg   { fill: #f8fafc; }
    .hdmi-analogy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hdmi-analogy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hdmi-analogy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hdmi-analogy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hdmi-analogy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hdmi-analogy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hdmi-analogy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hdmi-analogy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hdmi-analogy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hdmi-analogy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hdmi-analogy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hdmi-analogy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hdmi-analogy-row { opacity: 1; }
    .hdmi-analogy-r0 { animation-delay: 0.00s; }
    .hdmi-analogy-r1 { animation-delay: 0.45s; }
    .hdmi-analogy-r2 { animation-delay: 0.90s; }
    .hdmi-analogy-r3 { animation-delay: 1.35s; }
    .hdmi-analogy-r4 { animation-delay: 1.80s; }
    .hdmi-analogy-row { animation: hdmi-analogy-reveal 7.3s ease-in-out infinite; }
    @keyframes hdmi-analogy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="hdmi-analogy-bg" width="980" height="390"/>
  <text class="hdmi-analogy-h1"  x="30" y="40">Before and after HDMI</text>
  <text class="hdmi-analogy-sub" x="30" y="64">A jungle of cables, or one plug.</text>
  <rect class="hdmi-analogy-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="hdmi-analogy-name" x="46" y="122">Before</text>
  <text class="hdmi-analogy-desc" x="46" y="142">A cable per signal.</text>
  <text class="hdmi-analogy-desc hdmi-analogy-row hdmi-analogy-r0" x="46" y="182">VGA for video</text>
  <text class="hdmi-analogy-desc hdmi-analogy-row hdmi-analogy-r1" x="46" y="216">RCA for composite audio and video</text>
  <text class="hdmi-analogy-desc hdmi-analogy-row hdmi-analogy-r2" x="46" y="250">S-Video for higher resolution</text>
  <text class="hdmi-analogy-desc hdmi-analogy-row hdmi-analogy-r3" x="46" y="284">Optical for digital surround</text>
  <text class="hdmi-analogy-desc hdmi-analogy-row hdmi-analogy-r4" x="46" y="318">A new device meant new cables</text>
  <rect class="hdmi-analogy-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="hdmi-analogy-name" x="526" y="122">After</text>
  <text class="hdmi-analogy-desc" x="526" y="142">One plug, negotiated.</text>
  <text class="hdmi-analogy-desc hdmi-analogy-row hdmi-analogy-r0" x="526" y="182">Digital video and multi-channel audio</text>
  <text class="hdmi-analogy-desc hdmi-analogy-row hdmi-analogy-r1" x="526" y="216">Device power and remote signalling</text>
  <text class="hdmi-analogy-desc hdmi-analogy-row hdmi-analogy-r2" x="526" y="250">Capabilities negotiated automatically</text>
  <text class="hdmi-analogy-desc hdmi-analogy-row hdmi-analogy-r3" x="526" y="284">Any device, any display</text>
  <text class="hdmi-analogy-desc hdmi-analogy-row hdmi-analogy-r4" x="526" y="318">A new device just works</text>
  <text class="hdmi-analogy-sub" x="30" y="372">The negotiation is the part that maps onto MCP's handshake: both ends announce what they support and agree on a subset, which is what makes a new client work with an old server.</text>
</svg>
