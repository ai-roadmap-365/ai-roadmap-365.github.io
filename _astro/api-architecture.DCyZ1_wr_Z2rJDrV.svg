<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 860" role="img" font-family="system-ui, sans-serif">
  <title>The architecture of a FastAPI application, from the client on the left to your own domain code on the right. A client sends bytes over a socket to an ASGI server such as uvicorn, which owns the socket, speaks HTTP, and hands the application a plain request object. Inside the application a routing table matches the method and path to one path operation, or answers 404 or 405 without ever entering your code. Dependency resolution then calls each Depends function and collects what it returns, which is where storage, the clock and configuration arrive. Pydantic validation converts and checks the path parameters, the query parameters and the request body against the annotations, and this is the only place a 422 is produced, with a structured detail naming every offending field. Only then does your handler run, calling into the domain layer behind it. Response-model serialization filters what the handler returned down to the declared output fields, which is what stops an internal field leaving the process, and the status code and JSON body travel back out the same way they came. An unhandled exception anywhere in the handler or the domain layer becomes a 500 whose body is the five words Internal Server Error, with the traceback going to the server log and never to the client. Off the side, the same routing table and the same models feed the generated OpenAPI schema, served at slash openapi dot json and rendered at slash docs, which no human wrote.</title>
  <rect x="0" y="0" width="1120" height="860" fill="#f8fafc"/>

  <text x="560" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a202c">A FastAPI application, end to end</text>
  <text x="560" y="58" text-anchor="middle" font-size="14" fill="#1a202c">Where a 422 comes from, where a 500 comes from, and where the contract comes from</text>

  <!-- CLIENT -->
  <rect x="24" y="90" width="180" height="150" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="114" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">CLIENT</text>
  <text x="114" y="142" text-anchor="middle" font-size="14" fill="#1a202c">a machine, usually</text>
  <text x="114" y="164" text-anchor="middle" font-size="14" fill="#1a202c">POST /bookmarks</text>
  <text x="114" y="184" text-anchor="middle" font-size="14" fill="#1a202c">Content-Type: json</text>
  <text x="114" y="206" text-anchor="middle" font-size="14" fill="#1a202c">a body of bytes</text>
  <text x="114" y="228" text-anchor="middle" font-size="14" font-style="italic" fill="#1d4ed8">Day 78 was here</text>

  <line x1="204" y1="150" x2="256" y2="150" stroke="#1a202c" stroke-width="2"/>
  <polygon points="262,150 250,144 250,156" fill="#1a202c"/>

  <!-- ASGI SERVER -->
  <rect x="262" y="90" width="180" height="150" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="352" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">ASGI SERVER</text>
  <text x="352" y="140" text-anchor="middle" font-size="14" fill="#1a202c">uvicorn 0.51.0</text>
  <text x="352" y="164" text-anchor="middle" font-size="14" fill="#1a202c">owns the socket</text>
  <text x="352" y="184" text-anchor="middle" font-size="14" fill="#1a202c">speaks HTTP</text>
  <text x="352" y="204" text-anchor="middle" font-size="14" fill="#1a202c">runs the event loop</text>
  <text x="352" y="228" text-anchor="middle" font-size="14" font-style="italic" fill="#1d4ed8">TestClient replaces this</text>

  <line x1="442" y1="150" x2="494" y2="150" stroke="#1a202c" stroke-width="2"/>
  <polygon points="500,150 488,144 488,156" fill="#1a202c"/>
  <text x="470" y="140" text-anchor="middle" font-size="14" fill="#1a202c">scope</text>

  <!-- THE APPLICATION BOX -->
  <rect x="500" y="76" width="440" height="470" fill="#ffffff" stroke="#1d4ed8" stroke-width="3" rx="12"/>
  <text x="720" y="102" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d4ed8">THE FASTAPI APPLICATION</text>

  <rect x="520" y="116" width="400" height="76" fill="#dbeafe" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="720" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">1. ROUTING TABLE</text>
  <text x="720" y="162" text-anchor="middle" font-size="14" fill="#1a202c">method plus path pattern to one path operation</text>
  <text x="720" y="182" text-anchor="middle" font-size="14" fill="#1a202c">no match: 404 or 405, your code never runs</text>

  <line x1="720" y1="192" x2="720" y2="214" stroke="#1a202c" stroke-width="2"/>
  <polygon points="720,220 714,208 726,208" fill="#1a202c"/>

  <rect x="520" y="220" width="400" height="76" fill="#e0e7ff" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="720" y="244" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">2. DEPENDENCY RESOLUTION</text>
  <text x="720" y="266" text-anchor="middle" font-size="14" fill="#1a202c">each Depends function is called, its result passed in</text>
  <text x="720" y="286" text-anchor="middle" font-size="14" fill="#1a202c">storage, the clock, settings, the current user</text>

  <line x1="720" y1="296" x2="720" y2="318" stroke="#1a202c" stroke-width="2"/>
  <polygon points="720,324 714,312 726,312" fill="#1a202c"/>

  <rect x="520" y="324" width="400" height="86" fill="#fef9c3" stroke="#1a202c" stroke-width="3" rx="8"/>
  <text x="720" y="348" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">3. PYDANTIC VALIDATION</text>
  <text x="720" y="370" text-anchor="middle" font-size="14" fill="#1a202c">path, query and body converted and checked</text>
  <text x="720" y="390" text-anchor="middle" font-size="14" fill="#1a202c">against the annotations you wrote</text>
  <text x="720" y="404" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">the ONLY place a 422 is produced</text>

  <line x1="720" y1="410" x2="720" y2="432" stroke="#1a202c" stroke-width="2"/>
  <polygon points="720,438 714,426 726,426" fill="#1a202c"/>

  <rect x="520" y="438" width="400" height="44" fill="#dcfce7" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="720" y="466" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">4. YOUR HANDLER — the only code you wrote</text>

  <line x1="720" y1="482" x2="720" y2="504" stroke="#1a202c" stroke-width="2"/>
  <polygon points="720,510 714,498 726,498" fill="#1a202c"/>

  <rect x="520" y="500" width="400" height="34" fill="#dbeafe" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="720" y="522" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">5. RESPONSE-MODEL SERIALIZATION — the leak filter</text>

  <!-- 422 branch out to the left -->
  <line x1="520" y1="367" x2="452" y2="367" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="446,367 458,361 458,373" fill="#1d4ed8"/>
  <rect x="252" y="330" width="194" height="74" fill="#fef9c3" stroke="#1d4ed8" stroke-width="3" rx="8"/>
  <text x="349" y="354" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">422 to the client</text>
  <text x="349" y="376" text-anchor="middle" font-size="14" fill="#1a202c">structured detail naming</text>
  <text x="349" y="394" text-anchor="middle" font-size="14" fill="#1a202c">every offending field</text>

  <!-- 500 -->
  <line x1="720" y1="546" x2="720" y2="572" stroke="#1a202c" stroke-width="2"/>
  <polygon points="720,578 714,566 726,566" fill="#1a202c"/>
  <rect x="500" y="578" width="440" height="88" fill="#fee2e2" stroke="#1a202c" stroke-width="3" rx="10"/>
  <text x="720" y="602" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">AN UNHANDLED EXCEPTION ANYWHERE ABOVE: 500</text>
  <text x="720" y="624" text-anchor="middle" font-size="14" fill="#1a202c">body is five words — Internal Server Error</text>
  <text x="720" y="644" text-anchor="middle" font-size="14" fill="#1a202c">the traceback goes to the server log, never to the client</text>
  <text x="720" y="660" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">422 is their mistake; 500 is yours</text>

  <!-- DOMAIN LAYER -->
  <line x1="940" y1="460" x2="990" y2="460" stroke="#1a202c" stroke-width="2"/>
  <polygon points="996,460 984,454 984,466" fill="#1a202c"/>
  <rect x="996" y="400" width="104" height="130" fill="#dcfce7" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="1048" y="424" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">DOMAIN</text>
  <text x="1048" y="444" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">LAYER</text>
  <text x="1048" y="468" text-anchor="middle" font-size="14" fill="#1a202c">Days</text>
  <text x="1048" y="486" text-anchor="middle" font-size="14" fill="#1a202c">67 to 70</text>
  <text x="1048" y="510" text-anchor="middle" font-size="14" fill="#1a202c">no HTTP</text>
  <text x="1048" y="526" text-anchor="middle" font-size="14" fill="#1a202c">in here</text>

  <!-- OPENAPI off the side -->
  <line x1="720" y1="76" x2="720" y2="52" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="720" y1="52" x2="1000" y2="52" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="1000" y1="52" x2="1000" y2="90" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="1000,96 994,84 1006,84" fill="#1d4ed8"/>
  <rect x="944" y="96" width="156" height="180" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="1022" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">OPENAPI</text>
  <text x="1022" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">SCHEMA</text>
  <text x="1022" y="164" text-anchor="middle" font-size="14" fill="#1a202c">built from the</text>
  <text x="1022" y="182" text-anchor="middle" font-size="14" fill="#1a202c">same routes and</text>
  <text x="1022" y="200" text-anchor="middle" font-size="14" fill="#1a202c">the same models</text>
  <text x="1022" y="224" text-anchor="middle" font-size="14" fill="#1a202c">served at</text>
  <text x="1022" y="242" text-anchor="middle" font-size="14" fill="#1a202c">/openapi.json</text>
  <text x="1022" y="264" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">nobody wrote it</text>

  <!-- return path -->
  <line x1="500" y1="522" x2="114" y2="522" stroke="#1d4ed8" stroke-width="3"/>
  <line x1="114" y1="522" x2="114" y2="248" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="114,242 108,254 120,254" fill="#1d4ed8"/>
  <text x="300" y="514" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">status code + headers + JSON body, back out the way it came</text>

  <!-- footer band -->
  <rect x="24" y="700" width="1076" height="136" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="562" y="726" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Two things worth noticing about this whole picture</text>
  <text x="44" y="754" font-size="14" fill="#1a202c">1. Stages 1, 2, 3 and 5 are the framework. You wrote stage 4 and a handful of type annotations — and those annotations are what</text>
  <text x="44" y="774" font-size="14" fill="#1a202c">    generated stages 3 and 5 and the schema on the right. The annotation stopped being documentation and started doing work.</text>
  <text x="44" y="802" font-size="14" fill="#1a202c">2. In the lab there is no socket and no ASGI server: TestClient hands the request object to the application directly, in the same</text>
  <text x="44" y="822" font-size="14" fill="#1a202c">    process. Everything inside the white box happens identically. That is why an in-process test is a real test, not a simulation.</text>
</svg>
