<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each reads standard input and writes standard output. That is the entire contract.">
  <title>A pipeline is four small programs, none of which knows the others exist</title>
  <style>
    .pipeline-stages-bg   { fill: #f8fafc; }
    .pipeline-stages-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-stages-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-stages-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-stages-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-stages-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-stages-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pipeline-stages-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pipeline-stages-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pipeline-stages-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pipeline-stages-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pipeline-stages-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pipeline-stages-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pipeline-stages-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pipeline-stages-stage { opacity: 1; }

    .pipeline-stages-s0 { animation-delay: 0.00s; }
    .pipeline-stages-e0 { animation-delay: 0.00s; }
    .pipeline-stages-s1 { animation-delay: 1.33s; }
    .pipeline-stages-e1 { animation-delay: 1.33s; }
    .pipeline-stages-s2 { animation-delay: 2.67s; }
    .pipeline-stages-e2 { animation-delay: 2.67s; }
    .pipeline-stages-s3 { animation-delay: 4.00s; }
    .pipeline-stages-e3 { animation-delay: 4.00s; }
    .pipeline-stages-s4 { animation-delay: 5.33s; }
    .pipeline-stages-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .pipeline-stages-conn  { animation: pipeline-stages-trace 8s ease-in-out infinite; }
      .pipeline-stages-stage { animation: pipeline-stages-arrive 8s ease-in-out infinite; }
    }
    @keyframes pipeline-stages-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pipeline-stages-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pipeline-stages-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pipeline-stages-stage { animation: pipeline-stages-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pipeline-stages-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pipeline-stages-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pipeline-stages-bg" width="980" height="322"/>
  <text class="pipeline-stages-h1"  x="30" y="40">A pipeline is four small programs, none of which knows the others exist</text>
  <text class="pipeline-stages-sub" x="30" y="64">Each reads standard input and writes standard output. That is the entire contract.</text>
  <g class="pipeline-stages-stage pipeline-stages-s0">
    <rect class="pipeline-stages-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="pipeline-stages-step" x="44" y="142">01</text>
    <text class="pipeline-stages-name" x="70" y="142">access.log</text>
    <text class="pipeline-stages-desc" x="44" y="166">The whole file, every</text>
    <text class="pipeline-stages-desc" x="44" y="182">line.</text>
    <text class="pipeline-stages-edge" x="44" y="242">48,000 lines</text>
  </g>
  <line class="pipeline-stages-line pipeline-stages-conn pipeline-stages-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#pipeline-stages-tip)"/>
  <g class="pipeline-stages-stage pipeline-stages-s1">
    <rect class="pipeline-stages-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="pipeline-stages-step" x="233" y="142">02</text>
    <text class="pipeline-stages-name" x="259" y="142">grep 404</text>
    <text class="pipeline-stages-desc" x="233" y="166">Keeps only lines</text>
    <text class="pipeline-stages-desc" x="233" y="182">containing the pattern.</text>
    <text class="pipeline-stages-edge" x="233" y="242">1,240 lines</text>
  </g>
  <line class="pipeline-stages-line pipeline-stages-conn pipeline-stages-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#pipeline-stages-tip)"/>
  <g class="pipeline-stages-stage pipeline-stages-s2">
    <rect class="pipeline-stages-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="pipeline-stages-step" x="422" y="142">03</text>
    <text class="pipeline-stages-name" x="448" y="142">cut -d' ' -f7</text>
    <text class="pipeline-stages-desc" x="422" y="166">Keeps only the seventh</text>
    <text class="pipeline-stages-desc" x="422" y="182">field of each line.</text>
    <text class="pipeline-stages-edge" x="422" y="242">1,240 paths</text>
  </g>
  <line class="pipeline-stages-line pipeline-stages-conn pipeline-stages-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#pipeline-stages-tip)"/>
  <g class="pipeline-stages-stage pipeline-stages-s3">
    <rect class="pipeline-stages-hi" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="pipeline-stages-step" x="611" y="142">04</text>
    <text class="pipeline-stages-name" x="637" y="142">sort</text>
    <text class="pipeline-stages-desc" x="611" y="166">Brings identical values</text>
    <text class="pipeline-stages-desc" x="611" y="182">next to each other.</text>
    <text class="pipeline-stages-edge" x="611" y="242">required next</text>
  </g>
  <line class="pipeline-stages-line pipeline-stages-conn pipeline-stages-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#pipeline-stages-tip)"/>
  <g class="pipeline-stages-stage pipeline-stages-s4">
    <rect class="pipeline-stages-box" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="pipeline-stages-step" x="800" y="142">05</text>
    <text class="pipeline-stages-name" x="826" y="142">uniq -c</text>
    <text class="pipeline-stages-desc" x="800" y="166">Collapses adjacent</text>
    <text class="pipeline-stages-desc" x="800" y="182">duplicates and counts</text>
    <text class="pipeline-stages-desc" x="800" y="198">them.</text>
    <text class="pipeline-stages-edge" x="800" y="242">38 paths</text>
  </g>
  <text class="pipeline-stages-sub" x="30" y="304">uniq only collapses ADJACENT duplicates, which is the whole reason sort has to come first.</text>
</svg>
