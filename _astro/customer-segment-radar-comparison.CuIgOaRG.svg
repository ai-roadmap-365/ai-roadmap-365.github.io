<svg role="img" aria-label="Spider radar chart comparing four behavioral customer segments across Recency Frequency Monetary value and Tenure dimensions" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Customer Segment Radar Profile Comparison</title>
  <defs>
    <linearGradient id="bg189b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="radarCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg189b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">CUSTOMER SEGMENT RADAR PROFILE: RFM ATTRIBUTE DECOMPOSITION</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Multivariate normalized centroid comparison across Recency, Frequency, Monetary Value, and Tenure</text>
  <g transform="translate(60, 90)">
    <rect width="730" height="290" fill="url(#radarCard)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Radar concentric polygons -->
    <polygon points="365,60 485,145 365,230 245,145" fill="none" stroke="#64748b" stroke-width="1"/>
    <polygon points="365,90 445,145 365,200 285,145" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="365" y1="35" x2="365" y2="255" stroke="#64748b" stroke-width="1"/>
    <line x1="210" y1="145" x2="520" y2="145" stroke="#64748b" stroke-width="1"/>
    <text x="365" y="25" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Recency</text>
    <text x="545" y="150" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="700">Frequency</text>
    <text x="365" y="270" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Monetary Value</text>
    <text x="160" y="150" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="700">Tenure</text>
    <!-- VIP Profile (Green) -->
    <polygon points="365,70 475,145 365,225 295,145" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-width="2"/>
    <!-- At-Risk Churn Profile (Red) -->
    <polygon points="365,130 385,145 365,160 250,145" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="2"/>
    <!-- Legend -->
    <rect x="580" y="60" width="12" height="12" fill="#10b981"/>
    <text x="600" y="70" fill="#cbd5e1" font-family="system-ui" font-size="10">VIP High Value</text>
    <rect x="580" y="85" width="12" height="12" fill="#ef4444"/>
    <text x="600" y="95" fill="#cbd5e1" font-family="system-ui" font-size="10">At-Risk Churn</text>
  </g>
</svg>
