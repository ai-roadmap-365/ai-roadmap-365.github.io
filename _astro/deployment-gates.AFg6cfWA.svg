<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Five checks before production.">
  <title>The deployment gates</title>
  <style>
    .deployment-gates-bg   { fill: #f8fafc; }
    .deployment-gates-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deployment-gates-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deployment-gates-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deployment-gates-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deployment-gates-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deployment-gates-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .deployment-gates-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .deployment-gates-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .deployment-gates-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .deployment-gates-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .deployment-gates-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .deployment-gates-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .deployment-gates-row { opacity: 1; }
    .deployment-gates-r0 { animation-delay: 0.00s; }
    .deployment-gates-r1 { animation-delay: 0.45s; }
    .deployment-gates-r2 { animation-delay: 0.90s; }
    .deployment-gates-r3 { animation-delay: 1.35s; }
    .deployment-gates-r4 { animation-delay: 1.80s; }
    .deployment-gates-row { animation: deployment-gates-reveal 7.3s ease-in-out infinite; }
    @keyframes deployment-gates-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="deployment-gates-bg" width="980" height="390"/>
  <text class="deployment-gates-h1"  x="30" y="40">The deployment gates</text>
  <text class="deployment-gates-sub" x="30" y="64">Five checks before production.</text>
  <rect class="deployment-gates-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="deployment-gates-name" x="46" y="122">The gate</text>
  <text class="deployment-gates-desc" x="46" y="142">What is checked.</text>
  <text class="deployment-gates-desc deployment-gates-row deployment-gates-r0" x="46" y="182">Performance — beats the baseline on held-out data</text>
  <text class="deployment-gates-desc deployment-gates-row deployment-gates-r1" x="46" y="216">Fairness — measured per subgroup</text>
  <text class="deployment-gates-desc deployment-gates-row deployment-gates-r2" x="46" y="250">Robustness — behaviour on edge and missing inputs</text>
  <text class="deployment-gates-desc deployment-gates-row deployment-gates-r3" x="46" y="284">Operations — latency, cost, dependency health</text>
  <text class="deployment-gates-desc deployment-gates-row deployment-gates-r4" x="46" y="318">Documentation — a model card exists</text>
  <rect class="deployment-gates-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="deployment-gates-name" x="526" y="122">Why it exists</text>
  <text class="deployment-gates-desc" x="526" y="142">What it prevents.</text>
  <text class="deployment-gates-desc deployment-gates-row deployment-gates-r0" x="526" y="182">Shipping something worse than the current process</text>
  <text class="deployment-gates-desc deployment-gates-row deployment-gates-r1" x="526" y="216">Disparate impact discovered by users</text>
  <text class="deployment-gates-desc deployment-gates-row deployment-gates-r2" x="526" y="250">Failure on inputs nobody tested</text>
  <text class="deployment-gates-desc deployment-gates-row deployment-gates-r3" x="526" y="284">A model too slow or costly to run</text>
  <text class="deployment-gates-desc deployment-gates-row deployment-gates-r4" x="526" y="318">A model nobody can review or hand over</text>
  <text class="deployment-gates-sub" x="30" y="372">Making these explicit gates rather than a checklist someone remembers is what makes them effective, which is the recurring lesson of this whole course.</text>
</svg>
