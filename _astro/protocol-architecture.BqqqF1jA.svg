<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="d147a-title d147a-desc" width="1200" height="660">
  <title id="d147a-title">The eight-stage protocol for one classification project, with the number each stage actually produced</title>
  <desc id="d147a-desc">Eight boxes in reading order, left to right then wrapping to a second row: frame the problem; state a majority-class baseline of 0.6316; split 569 rows into 455 train and 114 test, stratified; sweep 36 candidate pipelines; cross-validate on train rows only and select LogisticRegression with C equal to 1 at a cross-validated accuracy of 0.9780; evaluate the test set exactly once through a gate, scoring 0.9825; read the confusion matrix, finding two false negatives and zero false positives; and state a verdict of a 95 percent interval from 0.9584 to 1.0066, distinguishable from the baseline. A highlighted panel beneath states that Day 144's formula predicted a selection optimism of 0.0326 for this sweep, while the measured drop averaged -0.0001 over twenty seeds, because the formula assumes independent zero-skill candidates and these 36 are neither.</desc>
  <style>
    .d147a-bg { fill: #f8fafc; }
    .d147a-title { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 23px; font-weight: 700; }
    .d147a-muted { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d147a-box { fill: #ffffff; stroke: #1d4ed8; stroke-width: 2; }
    .d147a-num { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; }
    .d147a-label { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; }
    .d147a-value { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d147a-arrow { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .d147a-note { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 2; }
    .d147a-notehead { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; }
    .d147a-notetext { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14.5px; }
  </style>
  <defs>
    <marker id="d147a-arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="d147a-bg" x="0" y="0" width="1200" height="660"/>

  <text class="d147a-title" x="600" y="34" text-anchor="middle">One classification project, run properly, once</text>
  <text class="d147a-muted" x="600" y="56" text-anchor="middle">Wisconsin breast-cancer set, 569 rows, chosen over iris and wine by measuring headroom for an interval</text>

  <!-- Row 1: stages 1-4 -->
  <g>
    <rect class="d147a-box" x="30" y="90" width="255" height="112" rx="8"/>
    <text class="d147a-num" x="48" y="114">1. FRAME</text>
    <text class="d147a-label" x="48" y="136">Malignant vs benign</text>
    <text class="d147a-value" x="48" y="158">30 features, 2 classes,</text>
    <text class="d147a-value" x="48" y="176">569 rows -- chosen by</text>
    <text class="d147a-value" x="48" y="194">measured headroom</text>
  </g>

  <path class="d147a-arrow" d="M 285 146 L 315 146" marker-end="url(#d147a-arrowhead)"/>

  <g>
    <rect class="d147a-box" x="315" y="90" width="255" height="112" rx="8"/>
    <text class="d147a-num" x="333" y="114">2. BASELINE</text>
    <text class="d147a-label" x="333" y="136">Majority class, no model</text>
    <text class="d147a-value" x="333" y="158">test accuracy = 0.6316</text>
    <text class="d147a-value" x="333" y="180">every later result must</text>
    <text class="d147a-value" x="333" y="198">clear this to matter</text>
  </g>

  <path class="d147a-arrow" d="M 570 146 L 600 146" marker-end="url(#d147a-arrowhead)"/>

  <g>
    <rect class="d147a-box" x="600" y="90" width="255" height="112" rx="8"/>
    <text class="d147a-num" x="618" y="114">3. SPLIT</text>
    <text class="d147a-label" x="618" y="136">Stratified, held back</text>
    <text class="d147a-value" x="618" y="158">455 train / 114 test</text>
    <text class="d147a-value" x="618" y="180">test rows untouched</text>
    <text class="d147a-value" x="618" y="198">until stage 6</text>
  </g>

  <path class="d147a-arrow" d="M 855 146 L 885 146" marker-end="url(#d147a-arrowhead)"/>

  <g>
    <rect class="d147a-box" x="885" y="90" width="285" height="112" rx="8"/>
    <text class="d147a-num" x="903" y="114">4. SWEEP</text>
    <text class="d147a-label" x="903" y="136">36 candidate pipelines</text>
    <text class="d147a-value" x="903" y="158">15 kNN, 11 logreg,</text>
    <text class="d147a-value" x="903" y="176">10 trees -- K counted</text>
    <text class="d147a-value" x="903" y="194">explicitly, before selecting</text>
  </g>

  <!-- wrap arrow from stage 4 down to stage 5 -->
  <path class="d147a-arrow" d="M 1027 202 L 1027 232 L 1027 232" marker-end="url(#d147a-arrowhead)"/>
  <path class="d147a-arrow" d="M 1027 232 L 855 232 L 855 262" marker-end="url(#d147a-arrowhead)"/>

  <!-- Row 2: stages 5-8 -->
  <g>
    <rect class="d147a-box" x="600" y="262" width="285" height="112" rx="8"/>
    <text class="d147a-num" x="618" y="286">5. CROSS-VALIDATE, SELECT</text>
    <text class="d147a-label" x="618" y="308">5-fold, train rows only</text>
    <text class="d147a-value" x="618" y="330">winner: LogisticRegression</text>
    <text class="d147a-value" x="618" y="348">(C=1), cv accuracy 0.9780</text>
    <text class="d147a-value" x="618" y="366">test rows never touched</text>
  </g>

  <path class="d147a-arrow" d="M 600 318 L 570 318" marker-end="url(#d147a-arrowhead)"/>

  <g>
    <rect class="d147a-box" x="315" y="262" width="255" height="112" rx="8"/>
    <text class="d147a-num" x="333" y="286">6. ONE TEST EVAL</text>
    <text class="d147a-label" x="333" y="308">GatedTestSet, one look</text>
    <text class="d147a-value" x="333" y="330">test accuracy = 0.9825</text>
    <text class="d147a-value" x="333" y="348">a second look raises</text>
    <text class="d147a-value" x="333" y="366">TestSetTouchedTwice</text>
  </g>

  <path class="d147a-arrow" d="M 315 318 L 285 318" marker-end="url(#d147a-arrowhead)"/>

  <g>
    <rect class="d147a-box" x="30" y="262" width="255" height="112" rx="8"/>
    <text class="d147a-num" x="48" y="286">7. ERROR ANALYSIS</text>
    <text class="d147a-label" x="48" y="308">Confusion matrix</text>
    <text class="d147a-value" x="48" y="330">2 false negatives</text>
    <text class="d147a-value" x="48" y="348">(malignant to benign)</text>
    <text class="d147a-value" x="48" y="366">0 false positives</text>
  </g>

  <!-- wrap arrow down to stage 8, centered below -->
  <path class="d147a-arrow" d="M 157 374 L 157 404 L 600 404 L 600 434" marker-end="url(#d147a-arrowhead)"/>

  <g>
    <rect class="d147a-box" x="450" y="434" width="300" height="112" rx="8"/>
    <text class="d147a-num" x="468" y="458">8. VERDICT, WITH AN INTERVAL</text>
    <text class="d147a-label" x="468" y="480">95 percent: [0.9584, 1.0066]</text>
    <text class="d147a-value" x="468" y="502">improvement +0.3509 over</text>
    <text class="d147a-value" x="468" y="520">baseline -- distinguishable,</text>
    <text class="d147a-value" x="468" y="538">clearly, not a close call</text>
  </g>

  <rect class="d147a-note" x="30" y="576" width="1140" height="66" rx="8"/>
  <text class="d147a-notehead" x="50" y="600">The closing measurement of the week</text>
  <text class="d147a-notetext" x="50" y="622">Day 144's formula predicted a selection optimism of 0.0326 for this 36-candidate sweep. Measured over twenty seeds, the</text>
  <text class="d147a-notetext" x="50" y="640">real drop averaged -0.0001 -- the formula assumes independent, zero-skill candidates, and these 36 are neither.</text>
</svg>
