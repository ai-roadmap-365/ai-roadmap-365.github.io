<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each targeting something different.">
  <title>Three dropout positions</title>
  <style>
    .dropout-placement-bg   { fill: #f8fafc; }
    .dropout-placement-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dropout-placement-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dropout-placement-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dropout-placement-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dropout-placement-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dropout-placement-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dropout-placement-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dropout-placement-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dropout-placement-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dropout-placement-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dropout-placement-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dropout-placement-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .dropout-placement-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .dropout-placement-stage { opacity: 1; }

    .dropout-placement-s0 { animation-delay: 0.00s; }
    .dropout-placement-e0 { animation-delay: 0.00s; }
    .dropout-placement-s1 { animation-delay: 1.50s; }
    .dropout-placement-e1 { animation-delay: 1.50s; }
    .dropout-placement-s2 { animation-delay: 3.00s; }
    .dropout-placement-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .dropout-placement-conn  { animation: dropout-placement-trace 6s ease-in-out infinite; }
      .dropout-placement-stage { animation: dropout-placement-arrive 6s ease-in-out infinite; }
    }
    @keyframes dropout-placement-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes dropout-placement-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .dropout-placement-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .dropout-placement-stage { animation: dropout-placement-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes dropout-placement-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="dropout-placement-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="dropout-placement-bg" width="980" height="322"/>
  <text class="dropout-placement-h1"  x="30" y="40">Three dropout positions</text>
  <text class="dropout-placement-sub" x="30" y="64">Each targeting something different.</text>
  <g class="dropout-placement-stage dropout-placement-s0">
    <rect class="dropout-placement-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="dropout-placement-step" x="44" y="142">01</text>
    <text class="dropout-placement-name" x="70" y="142">On attention weights</text>
    <text class="dropout-placement-desc" x="44" y="166">After the softmax. Prevents over-reliance on</text>
    <text class="dropout-placement-desc" x="44" y="182">any single position.</text>
  </g>
  <line class="dropout-placement-line dropout-placement-conn dropout-placement-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#dropout-placement-tip)"/>
  <g class="dropout-placement-stage dropout-placement-s1">
    <rect class="dropout-placement-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="dropout-placement-step" x="359" y="142">02</text>
    <text class="dropout-placement-name" x="385" y="142">On sublayer outputs</text>
    <text class="dropout-placement-desc" x="359" y="166">Before the residual addition, in both</text>
    <text class="dropout-placement-desc" x="359" y="182">sublayers.</text>
  </g>
  <line class="dropout-placement-line dropout-placement-conn dropout-placement-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#dropout-placement-tip)"/>
  <g class="dropout-placement-stage dropout-placement-s2">
    <rect class="dropout-placement-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="dropout-placement-step" x="674" y="142">03</text>
    <text class="dropout-placement-name" x="700" y="142">On embeddings</text>
    <text class="dropout-placement-desc" x="674" y="166">At the input, including positional</text>
    <text class="dropout-placement-desc" x="674" y="182">information.</text>
  </g>
  <text class="dropout-placement-sub" x="30" y="304">Attention dropout is the least intuitive and the most transformer-specific: it randomly removes attention edges, which forces the representation not to depend on one particular relationship.</text>
</svg>
