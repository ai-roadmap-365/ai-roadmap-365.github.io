<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Not the more modest one.">
  <title>Specificity is the stronger claim</title>
  <style>
    .adjectives-or-numbers-bg   { fill: #f8fafc; }
    .adjectives-or-numbers-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .adjectives-or-numbers-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .adjectives-or-numbers-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .adjectives-or-numbers-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .adjectives-or-numbers-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .adjectives-or-numbers-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .adjectives-or-numbers-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .adjectives-or-numbers-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .adjectives-or-numbers-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .adjectives-or-numbers-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .adjectives-or-numbers-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .adjectives-or-numbers-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .adjectives-or-numbers-row { opacity: 1; }
    .adjectives-or-numbers-r0 { animation-delay: 0.00s; }
    .adjectives-or-numbers-r1 { animation-delay: 0.45s; }
    .adjectives-or-numbers-r2 { animation-delay: 0.90s; }
    .adjectives-or-numbers-r3 { animation-delay: 1.35s; }
    .adjectives-or-numbers-r4 { animation-delay: 1.80s; }
    .adjectives-or-numbers-row { animation: adjectives-or-numbers-reveal 7.3s ease-in-out infinite; }
    @keyframes adjectives-or-numbers-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="adjectives-or-numbers-bg" width="980" height="390"/>
  <text class="adjectives-or-numbers-h1"  x="30" y="40">Specificity is the stronger claim</text>
  <text class="adjectives-or-numbers-sub" x="30" y="64">Not the more modest one.</text>
  <rect class="adjectives-or-numbers-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="adjectives-or-numbers-name" x="46" y="122">Adjectives</text>
  <text class="adjectives-or-numbers-desc" x="46" y="142">Asks to be believed.</text>
  <text class="adjectives-or-numbers-desc adjectives-or-numbers-row adjectives-or-numbers-r0" x="46" y="182">"State-of-the-art RAG system"</text>
  <text class="adjectives-or-numbers-desc adjectives-or-numbers-row adjectives-or-numbers-r1" x="46" y="216">"Blazing performance"</text>
  <text class="adjectives-or-numbers-desc adjectives-or-numbers-row adjectives-or-numbers-r2" x="46" y="250">"Significantly improved quality"</text>
  <text class="adjectives-or-numbers-desc adjectives-or-numbers-row adjectives-or-numbers-r3" x="46" y="284">Indistinguishable from forty others</text>
  <text class="adjectives-or-numbers-desc adjectives-or-numbers-row adjectives-or-numbers-r4" x="46" y="318">Nothing the reader can check</text>
  <rect class="adjectives-or-numbers-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="adjectives-or-numbers-name" x="526" y="122">Measurements</text>
  <text class="adjectives-or-numbers-desc" x="526" y="142">Offers to be checked.</text>
  <text class="adjectives-or-numbers-desc adjectives-or-numbers-row adjectives-or-numbers-r0" x="526" y="182">"recall@10 from 0.71 to 0.94"</text>
  <text class="adjectives-or-numbers-desc adjectives-or-numbers-row adjectives-or-numbers-r1" x="526" y="216">"p95 from 4.2s to 840ms"</text>
  <text class="adjectives-or-numbers-desc adjectives-or-numbers-row adjectives-or-numbers-r2" x="526" y="250">"by adding a reranking stage"</text>
  <text class="adjectives-or-numbers-desc adjectives-or-numbers-row adjectives-or-numbers-r3" x="526" y="284">"over 200 held-out questions"</text>
  <text class="adjectives-or-numbers-desc adjectives-or-numbers-row adjectives-or-numbers-r4" x="526" y="318">Every word is a checkable fact</text>
  <text class="adjectives-or-numbers-sub" x="30" y="372">The right-hand version is longer and none of it is padding: what changed, from what to what, by what mechanism, over what sample, done by whom — five facts a reader can use.</text>
</svg>
