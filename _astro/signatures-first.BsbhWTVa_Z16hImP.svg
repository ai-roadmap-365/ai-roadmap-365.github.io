<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Signatures first</title>
  <style>
    .signatures-first-bg   { fill: #f8fafc; }
    .signatures-first-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .signatures-first-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .signatures-first-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .signatures-first-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .signatures-first-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .signatures-first-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .signatures-first-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .signatures-first-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .signatures-first-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .signatures-first-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .signatures-first-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .signatures-first-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .signatures-first-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .signatures-first-stage { opacity: 1; }

    .signatures-first-s0 { animation-delay: 0.00s; }
    .signatures-first-e0 { animation-delay: 0.00s; }
    .signatures-first-s1 { animation-delay: 1.28s; }
    .signatures-first-e1 { animation-delay: 1.28s; }
    .signatures-first-s2 { animation-delay: 2.56s; }
    .signatures-first-e2 { animation-delay: 2.56s; }
    .signatures-first-s3 { animation-delay: 3.84s; }
    .signatures-first-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .signatures-first-conn  { animation: signatures-first-trace 6.4s ease-in-out infinite; }
      .signatures-first-stage { animation: signatures-first-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes signatures-first-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes signatures-first-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .signatures-first-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .signatures-first-stage { animation: signatures-first-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes signatures-first-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="signatures-first-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="signatures-first-bg" width="980" height="322"/>
  <text class="signatures-first-h1"  x="30" y="40">Signatures first</text>
  <text class="signatures-first-sub" x="30" y="64">Four steps.</text>
  <g class="signatures-first-stage signatures-first-s0">
    <rect class="signatures-first-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="signatures-first-step" x="44" y="142">01</text>
    <text class="signatures-first-name" x="70" y="142">Name the operations before writing them</text>
    <text class="signatures-first-desc" x="44" y="166">Which forces you to say what</text>
    <text class="signatures-first-desc" x="44" y="182">they are.</text>
  </g>
  <line class="signatures-first-line signatures-first-conn signatures-first-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#signatures-first-tip)"/>
  <g class="signatures-first-stage signatures-first-s1">
    <rect class="signatures-first-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="signatures-first-step" x="280" y="142">02</text>
    <text class="signatures-first-name" x="306" y="142">Decide what each takes and returns</text>
    <text class="signatures-first-desc" x="280" y="166">Which exposes muddled thinking</text>
    <text class="signatures-first-desc" x="280" y="182">early.</text>
  </g>
  <line class="signatures-first-line signatures-first-conn signatures-first-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#signatures-first-tip)"/>
  <g class="signatures-first-stage signatures-first-s2">
    <rect class="signatures-first-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="signatures-first-step" x="516" y="142">03</text>
    <text class="signatures-first-name" x="542" y="142">Write the docstring as the contract</text>
    <text class="signatures-first-desc" x="516" y="166">Before there is anything to</text>
    <text class="signatures-first-desc" x="516" y="182">describe.</text>
  </g>
  <line class="signatures-first-line signatures-first-conn signatures-first-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#signatures-first-tip)"/>
  <g class="signatures-first-stage signatures-first-s3">
    <rect class="signatures-first-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="signatures-first-step" x="752" y="142">04</text>
    <text class="signatures-first-name" x="778" y="142">Then implement against it</text>
    <text class="signatures-first-desc" x="752" y="166">Which is the easy part, by</text>
    <text class="signatures-first-desc" x="752" y="182">comparison.</text>
  </g>
  <text class="signatures-first-sub" x="30" y="304">Writing the docstring first is a design activity rather than a documentation one: a contract you cannot state clearly is usually a design that is not yet clear.</text>
</svg>
