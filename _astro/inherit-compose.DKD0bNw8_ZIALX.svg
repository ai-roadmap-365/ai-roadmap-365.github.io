<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Is-a against has-a.">
  <title>Inheritance against composition</title>
  <style>
    .inherit-compose-bg   { fill: #f8fafc; }
    .inherit-compose-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inherit-compose-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inherit-compose-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inherit-compose-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inherit-compose-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inherit-compose-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .inherit-compose-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .inherit-compose-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .inherit-compose-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .inherit-compose-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .inherit-compose-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .inherit-compose-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .inherit-compose-row { opacity: 1; }
    .inherit-compose-r0 { animation-delay: 0.00s; }
    .inherit-compose-r1 { animation-delay: 0.45s; }
    .inherit-compose-r2 { animation-delay: 0.90s; }
    .inherit-compose-r3 { animation-delay: 1.35s; }
    .inherit-compose-r4 { animation-delay: 1.80s; }
    .inherit-compose-row { animation: inherit-compose-reveal 7.3s ease-in-out infinite; }
    @keyframes inherit-compose-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="inherit-compose-bg" width="980" height="390"/>
  <text class="inherit-compose-h1"  x="30" y="40">Inheritance against composition</text>
  <text class="inherit-compose-sub" x="30" y="64">Is-a against has-a.</text>
  <rect class="inherit-compose-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="inherit-compose-name" x="46" y="122">Inheritance</text>
  <text class="inherit-compose-desc" x="46" y="142">Is a kind of.</text>
  <text class="inherit-compose-desc inherit-compose-row inherit-compose-r0" x="46" y="182">The subclass is a specialised parent</text>
  <text class="inherit-compose-desc inherit-compose-row inherit-compose-r1" x="46" y="216">Everything is inherited, wanted or not</text>
  <text class="inherit-compose-desc inherit-compose-row inherit-compose-r2" x="46" y="250">Changing the parent changes every child</text>
  <text class="inherit-compose-desc inherit-compose-row inherit-compose-r3" x="46" y="284">Tight, permanent coupling</text>
  <text class="inherit-compose-desc inherit-compose-row inherit-compose-r4" x="46" y="318">Right when the relationship is genuinely is-a</text>
  <rect class="inherit-compose-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="inherit-compose-name" x="526" y="122">Composition</text>
  <text class="inherit-compose-desc" x="526" y="142">Has a.</text>
  <text class="inherit-compose-desc inherit-compose-row inherit-compose-r0" x="526" y="182">The object holds another and uses it</text>
  <text class="inherit-compose-desc inherit-compose-row inherit-compose-r1" x="526" y="216">Only what you delegate is exposed</text>
  <text class="inherit-compose-desc inherit-compose-row inherit-compose-r2" x="526" y="250">The held object can be swapped</text>
  <text class="inherit-compose-desc inherit-compose-row inherit-compose-r3" x="526" y="284">Loose coupling</text>
  <text class="inherit-compose-desc inherit-compose-row inherit-compose-r4" x="526" y="318">Right almost everywhere else</text>
  <text class="inherit-compose-sub" x="30" y="372">Inheriting everything whether wanted or not is the structural problem: a subclass is committed to its parent's whole interface, including parts that make no sense for it.</text>
</svg>
