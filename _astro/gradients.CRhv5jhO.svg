<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which turns out to be simple.">
  <title>The gradient</title>
  <style>
    .gradients-bg   { fill: #f8fafc; }
    .gradients-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradients-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradients-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradients-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradients-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradients-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gradients-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gradients-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gradients-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gradients-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gradients-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gradients-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .gradients-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .gradients-stage { opacity: 1; }

    .gradients-s0 { animation-delay: 0.00s; }
    .gradients-e0 { animation-delay: 0.00s; }
    .gradients-s1 { animation-delay: 1.28s; }
    .gradients-e1 { animation-delay: 1.28s; }
    .gradients-s2 { animation-delay: 2.56s; }
    .gradients-e2 { animation-delay: 2.56s; }
    .gradients-s3 { animation-delay: 3.84s; }
    .gradients-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .gradients-conn  { animation: gradients-trace 6.4s ease-in-out infinite; }
      .gradients-stage { animation: gradients-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes gradients-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes gradients-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .gradients-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .gradients-stage { animation: gradients-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes gradients-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="gradients-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="gradients-bg" width="980" height="322"/>
  <text class="gradients-h1"  x="30" y="40">The gradient</text>
  <text class="gradients-sub" x="30" y="64">Which turns out to be simple.</text>
  <g class="gradients-stage gradients-s0">
    <rect class="gradients-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="gradients-step" x="44" y="142">01</text>
    <text class="gradients-name" x="70" y="142">Compute predicted minus actual</text>
    <text class="gradients-desc" x="44" y="166">Which is the error for each</text>
    <text class="gradients-desc" x="44" y="182">example.</text>
  </g>
  <line class="gradients-line gradients-conn gradients-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#gradients-tip)"/>
  <g class="gradients-stage gradients-s1">
    <rect class="gradients-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="gradients-step" x="280" y="142">02</text>
    <text class="gradients-name" x="306" y="142">Multiply by the feature values</text>
    <text class="gradients-desc" x="280" y="166">So features present in wrong</text>
    <text class="gradients-desc" x="280" y="182">predictions move most.</text>
  </g>
  <line class="gradients-line gradients-conn gradients-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#gradients-tip)"/>
  <g class="gradients-stage gradients-s2">
    <rect class="gradients-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="gradients-step" x="516" y="142">03</text>
    <text class="gradients-name" x="542" y="142">Average across the dataset</text>
    <text class="gradients-desc" x="516" y="166">Giving the gradient for each</text>
    <text class="gradients-desc" x="516" y="182">weight.</text>
  </g>
  <line class="gradients-line gradients-conn gradients-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#gradients-tip)"/>
  <g class="gradients-stage gradients-s3">
    <rect class="gradients-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="gradients-step" x="752" y="142">04</text>
    <text class="gradients-name" x="778" y="142">And step against it</text>
    <text class="gradients-desc" x="752" y="166">Which is identical to linear</text>
    <text class="gradients-desc" x="752" y="182">regression's update.</text>
  </g>
  <text class="gradients-sub" x="30" y="304">The gradient being the same form as linear regression's, despite the sigmoid and a different loss, is not a coincidence — the two cancel exactly.</text>
</svg>
