<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five steps, and each can fail.">
  <title>The path from prompt to trusted object</title>
  <style>
    .schema-first-flow-bg   { fill: #f8fafc; }
    .schema-first-flow-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-first-flow-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-first-flow-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-first-flow-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-first-flow-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-first-flow-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .schema-first-flow-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .schema-first-flow-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .schema-first-flow-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .schema-first-flow-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .schema-first-flow-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .schema-first-flow-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .schema-first-flow-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .schema-first-flow-stage { opacity: 1; }

    .schema-first-flow-s0 { animation-delay: 0.00s; }
    .schema-first-flow-e0 { animation-delay: 0.00s; }
    .schema-first-flow-s1 { animation-delay: 1.33s; }
    .schema-first-flow-e1 { animation-delay: 1.33s; }
    .schema-first-flow-s2 { animation-delay: 2.67s; }
    .schema-first-flow-e2 { animation-delay: 2.67s; }
    .schema-first-flow-s3 { animation-delay: 4.00s; }
    .schema-first-flow-e3 { animation-delay: 4.00s; }
    .schema-first-flow-s4 { animation-delay: 5.33s; }
    .schema-first-flow-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .schema-first-flow-conn  { animation: schema-first-flow-trace 8s ease-in-out infinite; }
      .schema-first-flow-stage { animation: schema-first-flow-arrive 8s ease-in-out infinite; }
    }
    @keyframes schema-first-flow-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes schema-first-flow-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .schema-first-flow-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .schema-first-flow-stage { animation: schema-first-flow-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes schema-first-flow-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="schema-first-flow-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="schema-first-flow-bg" width="980" height="322"/>
  <text class="schema-first-flow-h1"  x="30" y="40">The path from prompt to trusted object</text>
  <text class="schema-first-flow-sub" x="30" y="64">Five steps, and each can fail.</text>
  <g class="schema-first-flow-stage schema-first-flow-s0">
    <rect class="schema-first-flow-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="schema-first-flow-step" x="44" y="142">01</text>
    <text class="schema-first-flow-name" x="70" y="142">Assemble the prompt</text>
    <text class="schema-first-flow-desc" x="44" y="166">Question, retrieved</text>
    <text class="schema-first-flow-desc" x="44" y="182">context, and the schema</text>
    <text class="schema-first-flow-desc" x="44" y="198">you require.</text>
  </g>
  <line class="schema-first-flow-line schema-first-flow-conn schema-first-flow-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#schema-first-flow-tip)"/>
  <g class="schema-first-flow-stage schema-first-flow-s1">
    <rect class="schema-first-flow-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="schema-first-flow-step" x="233" y="142">02</text>
    <text class="schema-first-flow-name" x="259" y="142">Generate</text>
    <text class="schema-first-flow-desc" x="233" y="166">Can be slow, refuse, or</text>
    <text class="schema-first-flow-desc" x="233" y="182">return the wrong shape.</text>
    <text class="schema-first-flow-edge" x="233" y="242">the call</text>
  </g>
  <line class="schema-first-flow-line schema-first-flow-conn schema-first-flow-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#schema-first-flow-tip)"/>
  <g class="schema-first-flow-stage schema-first-flow-s2">
    <rect class="schema-first-flow-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="schema-first-flow-step" x="422" y="142">03</text>
    <text class="schema-first-flow-name" x="448" y="142">Strip the fence</text>
    <text class="schema-first-flow-desc" x="422" y="166">Markdown wrapping is</text>
    <text class="schema-first-flow-desc" x="422" y="182">normal and is not JSON.</text>
    <text class="schema-first-flow-edge" x="422" y="242">```json</text>
  </g>
  <line class="schema-first-flow-line schema-first-flow-conn schema-first-flow-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#schema-first-flow-tip)"/>
  <g class="schema-first-flow-stage schema-first-flow-s3">
    <rect class="schema-first-flow-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="schema-first-flow-step" x="611" y="142">04</text>
    <text class="schema-first-flow-name" x="637" y="142">Parse</text>
    <text class="schema-first-flow-desc" x="611" y="166">Catching the error rather</text>
    <text class="schema-first-flow-desc" x="611" y="182">than assuming success.</text>
  </g>
  <line class="schema-first-flow-line schema-first-flow-conn schema-first-flow-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#schema-first-flow-tip)"/>
  <g class="schema-first-flow-stage schema-first-flow-s4">
    <rect class="schema-first-flow-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="schema-first-flow-step" x="800" y="142">05</text>
    <text class="schema-first-flow-name" x="826" y="142">Validate against the schema</text>
    <text class="schema-first-flow-desc" x="800" y="166">Only now is it an object</text>
    <text class="schema-first-flow-desc" x="800" y="182">your code may act on.</text>
    <text class="schema-first-flow-edge" x="800" y="242">trusted</text>
  </g>
  <text class="schema-first-flow-sub" x="30" y="304">Each step has its own failure and its own response. Collapsing them into one try/except is why a malformed response and an empty response so often produce the same unhelpful error.</text>
</svg>
