<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The rule that makes a program composable.">
  <title>Results on one stream, commentary on the other</title>
  <style>
    .stdout-or-stderr-bg   { fill: #f8fafc; }
    .stdout-or-stderr-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stdout-or-stderr-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stdout-or-stderr-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stdout-or-stderr-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stdout-or-stderr-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stdout-or-stderr-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stdout-or-stderr-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stdout-or-stderr-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stdout-or-stderr-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stdout-or-stderr-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stdout-or-stderr-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stdout-or-stderr-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stdout-or-stderr-row { opacity: 1; }
    .stdout-or-stderr-r0 { animation-delay: 0.00s; }
    .stdout-or-stderr-r1 { animation-delay: 0.45s; }
    .stdout-or-stderr-r2 { animation-delay: 0.90s; }
    .stdout-or-stderr-r3 { animation-delay: 1.35s; }
    .stdout-or-stderr-r4 { animation-delay: 1.80s; }
    .stdout-or-stderr-row { animation: stdout-or-stderr-reveal 7.3s ease-in-out infinite; }
    @keyframes stdout-or-stderr-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="stdout-or-stderr-bg" width="980" height="390"/>
  <text class="stdout-or-stderr-h1"  x="30" y="40">Results on one stream, commentary on the other</text>
  <text class="stdout-or-stderr-sub" x="30" y="64">The rule that makes a program composable.</text>
  <rect class="stdout-or-stderr-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="stdout-or-stderr-name" x="46" y="122">stdout</text>
  <text class="stdout-or-stderr-desc" x="46" y="142">The result.</text>
  <text class="stdout-or-stderr-desc stdout-or-stderr-row stdout-or-stderr-r0" x="46" y="182">What the program was asked to produce</text>
  <text class="stdout-or-stderr-desc stdout-or-stderr-row stdout-or-stderr-r1" x="46" y="216">This is what a pipe carries</text>
  <text class="stdout-or-stderr-desc stdout-or-stderr-row stdout-or-stderr-r2" x="46" y="250">This is what &gt; captures</text>
  <text class="stdout-or-stderr-desc stdout-or-stderr-row stdout-or-stderr-r3" x="46" y="284">Should be clean and parseable</text>
  <text class="stdout-or-stderr-desc stdout-or-stderr-row stdout-or-stderr-r4" x="46" y="318">print() writes here by default</text>
  <rect class="stdout-or-stderr-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="stdout-or-stderr-name" x="526" y="122">stderr</text>
  <text class="stdout-or-stderr-desc" x="526" y="142">Everything else.</text>
  <text class="stdout-or-stderr-desc stdout-or-stderr-row stdout-or-stderr-r0" x="526" y="182">Progress, warnings, diagnostics</text>
  <text class="stdout-or-stderr-desc stdout-or-stderr-row stdout-or-stderr-r1" x="526" y="216">NOT carried by a plain pipe</text>
  <text class="stdout-or-stderr-desc stdout-or-stderr-row stdout-or-stderr-r2" x="526" y="250">Still reaches the screen mid-pipeline</text>
  <text class="stdout-or-stderr-desc stdout-or-stderr-row stdout-or-stderr-r3" x="526" y="284">print(..., file=sys.stderr)</text>
  <text class="stdout-or-stderr-desc stdout-or-stderr-row stdout-or-stderr-r4" x="526" y="318">Redirected separately with 2&gt;</text>
  <text class="stdout-or-stderr-sub" x="30" y="372">Getting this wrong is invisible in a terminal, where both appear together, and obvious the moment someone pipes your program — which is usually in production.</text>
</svg>
