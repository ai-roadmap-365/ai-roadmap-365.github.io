<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five parts.">
  <title>What a request contains</title>
  <style>
    .request-anatomy-bg   { fill: #f8fafc; }
    .request-anatomy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .request-anatomy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .request-anatomy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .request-anatomy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .request-anatomy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .request-anatomy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .request-anatomy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .request-anatomy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .request-anatomy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .request-anatomy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .request-anatomy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .request-anatomy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .request-anatomy-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .request-anatomy-stage { opacity: 1; }

    .request-anatomy-s0 { animation-delay: 0.00s; }
    .request-anatomy-e0 { animation-delay: 0.00s; }
    .request-anatomy-s1 { animation-delay: 1.33s; }
    .request-anatomy-e1 { animation-delay: 1.33s; }
    .request-anatomy-s2 { animation-delay: 2.67s; }
    .request-anatomy-e2 { animation-delay: 2.67s; }
    .request-anatomy-s3 { animation-delay: 4.00s; }
    .request-anatomy-e3 { animation-delay: 4.00s; }
    .request-anatomy-s4 { animation-delay: 5.33s; }
    .request-anatomy-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .request-anatomy-conn  { animation: request-anatomy-trace 8s ease-in-out infinite; }
      .request-anatomy-stage { animation: request-anatomy-arrive 8s ease-in-out infinite; }
    }
    @keyframes request-anatomy-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes request-anatomy-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .request-anatomy-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .request-anatomy-stage { animation: request-anatomy-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes request-anatomy-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="request-anatomy-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="request-anatomy-bg" width="980" height="322"/>
  <text class="request-anatomy-h1"  x="30" y="40">What a request contains</text>
  <text class="request-anatomy-sub" x="30" y="64">Five parts.</text>
  <g class="request-anatomy-stage request-anatomy-s0">
    <rect class="request-anatomy-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="request-anatomy-step" x="44" y="142">01</text>
    <text class="request-anatomy-name" x="70" y="142">The model identifier</text>
    <text class="request-anatomy-desc" x="44" y="166">Pinned to a version, not</text>
    <text class="request-anatomy-desc" x="44" y="182">to a moving alias.</text>
  </g>
  <line class="request-anatomy-line request-anatomy-conn request-anatomy-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#request-anatomy-tip)"/>
  <g class="request-anatomy-stage request-anatomy-s1">
    <rect class="request-anatomy-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="request-anatomy-step" x="233" y="142">02</text>
    <text class="request-anatomy-name" x="259" y="142">The system instructions</text>
    <text class="request-anatomy-desc" x="233" y="166">Sent separately from the</text>
    <text class="request-anatomy-desc" x="233" y="182">conversation, and</text>
    <text class="request-anatomy-desc" x="233" y="198">cacheable.</text>
  </g>
  <line class="request-anatomy-line request-anatomy-conn request-anatomy-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#request-anatomy-tip)"/>
  <g class="request-anatomy-stage request-anatomy-s2">
    <rect class="request-anatomy-good" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="request-anatomy-step" x="422" y="142">03</text>
    <text class="request-anatomy-name" x="448" y="142">The message list</text>
    <text class="request-anatomy-desc" x="422" y="166">Alternating roles,</text>
    <text class="request-anatomy-desc" x="422" y="182">carrying the whole</text>
    <text class="request-anatomy-desc" x="422" y="198">conversation each time.</text>
  </g>
  <line class="request-anatomy-line request-anatomy-conn request-anatomy-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#request-anatomy-tip)"/>
  <g class="request-anatomy-stage request-anatomy-s3">
    <rect class="request-anatomy-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="request-anatomy-step" x="611" y="142">04</text>
    <text class="request-anatomy-name" x="637" y="142">The sampling parameters</text>
    <text class="request-anatomy-desc" x="611" y="166">Temperature and</text>
    <text class="request-anatomy-desc" x="611" y="182">truncation, defaulted for</text>
    <text class="request-anatomy-desc" x="611" y="198">conversation.</text>
  </g>
  <line class="request-anatomy-line request-anatomy-conn request-anatomy-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#request-anatomy-tip)"/>
  <g class="request-anatomy-stage request-anatomy-s4">
    <rect class="request-anatomy-box" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="request-anatomy-step" x="800" y="142">05</text>
    <text class="request-anatomy-name" x="826" y="142">And a maximum output length</text>
    <text class="request-anatomy-desc" x="800" y="166">Which is a cost control</text>
    <text class="request-anatomy-desc" x="800" y="182">as well as a safety</text>
    <text class="request-anatomy-desc" x="800" y="198">valve.</text>
    <text class="request-anatomy-edge" x="800" y="242">required</text>
  </g>
  <text class="request-anatomy-sub" x="30" y="304">Resending the whole conversation on every request is the detail that surprises people coming from stateful APIs, and it is why context grows into a cost problem.</text>
</svg>
