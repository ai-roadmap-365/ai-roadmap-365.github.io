<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four benefits.">
  <title>Sessions and connection reuse</title>
  <style>
    .sessions-bg   { fill: #f8fafc; }
    .sessions-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sessions-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sessions-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sessions-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sessions-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sessions-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sessions-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sessions-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sessions-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sessions-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sessions-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sessions-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .sessions-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .sessions-stage { opacity: 1; }

    .sessions-s0 { animation-delay: 0.00s; }
    .sessions-e0 { animation-delay: 0.00s; }
    .sessions-s1 { animation-delay: 1.28s; }
    .sessions-e1 { animation-delay: 1.28s; }
    .sessions-s2 { animation-delay: 2.56s; }
    .sessions-e2 { animation-delay: 2.56s; }
    .sessions-s3 { animation-delay: 3.84s; }
    .sessions-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .sessions-conn  { animation: sessions-trace 6.4s ease-in-out infinite; }
      .sessions-stage { animation: sessions-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes sessions-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes sessions-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .sessions-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .sessions-stage { animation: sessions-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes sessions-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="sessions-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="sessions-bg" width="980" height="322"/>
  <text class="sessions-h1"  x="30" y="40">Sessions and connection reuse</text>
  <text class="sessions-sub" x="30" y="64">Four benefits.</text>
  <g class="sessions-stage sessions-s0">
    <rect class="sessions-good" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="sessions-step" x="44" y="142">01</text>
    <text class="sessions-name" x="70" y="142">The connection is reused across calls</text>
    <text class="sessions-desc" x="44" y="166">Skipping the handshake each</text>
    <text class="sessions-desc" x="44" y="182">time.</text>
  </g>
  <line class="sessions-line sessions-conn sessions-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#sessions-tip)"/>
  <g class="sessions-stage sessions-s1">
    <rect class="sessions-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="sessions-step" x="280" y="142">02</text>
    <text class="sessions-name" x="306" y="142">Headers are set once</text>
    <text class="sessions-desc" x="280" y="166">Authentication, user agent,</text>
    <text class="sessions-desc" x="280" y="182">content type.</text>
  </g>
  <line class="sessions-line sessions-conn sessions-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#sessions-tip)"/>
  <g class="sessions-stage sessions-s2">
    <rect class="sessions-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="sessions-step" x="516" y="142">03</text>
    <text class="sessions-name" x="542" y="142">Cookies persist across requests</text>
    <text class="sessions-desc" x="516" y="166">Which some interactions require.</text>
  </g>
  <line class="sessions-line sessions-conn sessions-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#sessions-tip)"/>
  <g class="sessions-stage sessions-s3">
    <rect class="sessions-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="sessions-step" x="752" y="142">04</text>
    <text class="sessions-name" x="778" y="142">And retry policy is configured in one place</text>
    <text class="sessions-desc" x="752" y="166">Rather than per call.</text>
    <text class="sessions-edge" x="752" y="242">one object</text>
  </g>
  <text class="sessions-sub" x="30" y="304">Connection reuse is a substantial saving on repeated calls, since the setup handshake often costs more than the request itself.</text>
</svg>
