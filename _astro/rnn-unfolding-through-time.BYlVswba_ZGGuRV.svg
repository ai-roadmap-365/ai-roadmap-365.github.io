<svg role="img" aria-label="Recurrent neural network folded loop representation unrolled into an explicit sequence of time steps with shared weight matrices" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Recurrent Neural Network: Folded vs Unfolded Through Time</title>
  <defs>
    <linearGradient id="bg220a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card220" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg220a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">RECURRENT NEURAL NETWORK (RNN) COMPUTATION GRAPH</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Unfolding the Recurrent Loop Across Sequential Time Steps with Shared Weight Matrices (W_xh, W_hh, W_hy)</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card220)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Left: Folded Representation -->
    <rect x="25" y="25" width="200" height="245" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="125" y="48" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Folded Representation</text>
    
    <circle cx="125" cy="85" r="18" fill="#f43f5e"/>
    <text x="125" y="89" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">y_t</text>
    
    <line x1="125" y1="130" x2="125" y2="103" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="145" y="118" fill="#cbd5e1" font-size="8">W_hy</text>
    
    <circle cx="125" cy="150" r="20" fill="#38bdf8"/>
    <text x="125" y="154" fill="#0f172a" font-size="10" font-weight="700" text-anchor="middle">h_t</text>
    
    <!-- Recurrent self loop -->
    <path d="M 145,150 C 185,130 185,170 145,155" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="195" y="154" fill="#38bdf8" font-size="8" font-weight="700">W_hh</text>
    
    <line x1="125" y1="215" x2="125" y2="170" stroke="#94a3b8" stroke-width="2"/>
    <text x="145" y="195" fill="#cbd5e1" font-size="8">W_xh</text>
    
    <circle cx="125" cy="235" r="18" fill="#10b981"/>
    <text x="125" y="239" fill="#0f172a" font-size="10" font-weight="700" text-anchor="middle">x_t</text>

    <!-- Right: Unfolded Representation -->
    <rect x="245" y="25" width="490" height="245" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="490" y="48" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Unfolded Over Time Steps (t = 1, 2, 3)</text>
    
    <!-- Step t=1 -->
    <circle cx="310" cy="235" r="16" fill="#10b981"/>
    <text x="310" y="239" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">x_1</text>
    <line x1="310" y1="219" x2="310" y2="170" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="310" cy="150" r="18" fill="#38bdf8"/>
    <text x="310" y="154" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">h_1</text>
    <line x1="310" y1="132" x2="310" y2="103" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="310" cy="85" r="16" fill="#f43f5e"/>
    <text x="310" y="89" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">y_1</text>

    <!-- Horizontal arrow t1 -> t2 -->
    <line x1="328" y1="150" x2="472" y2="150" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="400" y="142" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">W_hh</text>

    <!-- Step t=2 -->
    <circle cx="490" cy="235" r="16" fill="#10b981"/>
    <text x="490" y="239" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">x_2</text>
    <line x1="490" y1="219" x2="490" y2="170" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="490" cy="150" r="18" fill="#38bdf8"/>
    <text x="490" y="154" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">h_2</text>
    <line x1="490" y1="132" x2="490" y2="103" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="490" cy="85" r="16" fill="#f43f5e"/>
    <text x="490" y="89" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">y_2</text>

    <!-- Horizontal arrow t2 -> t3 -->
    <line x1="508" y1="150" x2="652" y2="150" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="580" y="142" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">W_hh</text>

    <!-- Step t=3 -->
    <circle cx="670" cy="235" r="16" fill="#10b981"/>
    <text x="670" y="239" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">x_3</text>
    <line x1="670" y1="219" x2="670" y2="170" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="670" cy="150" r="18" fill="#38bdf8"/>
    <text x="670" y="154" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">h_3</text>
    <line x1="670" y1="132" x2="670" y2="103" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="670" cy="85" r="16" fill="#f43f5e"/>
    <text x="670" y="89" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">y_3</text>
  </g>
</svg>
