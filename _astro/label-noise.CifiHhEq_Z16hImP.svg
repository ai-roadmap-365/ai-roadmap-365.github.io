<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Disagreement between model and label.">
  <title>Finding mislabelled data automatically</title>
  <style>
    .label-noise-bg   { fill: #f8fafc; }
    .label-noise-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .label-noise-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .label-noise-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .label-noise-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .label-noise-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .label-noise-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .label-noise-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .label-noise-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .label-noise-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .label-noise-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .label-noise-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .label-noise-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .label-noise-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .label-noise-stage { opacity: 1; }

    .label-noise-s0 { animation-delay: 0.00s; }
    .label-noise-e0 { animation-delay: 0.00s; }
    .label-noise-s1 { animation-delay: 1.28s; }
    .label-noise-e1 { animation-delay: 1.28s; }
    .label-noise-s2 { animation-delay: 2.56s; }
    .label-noise-e2 { animation-delay: 2.56s; }
    .label-noise-s3 { animation-delay: 3.84s; }
    .label-noise-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .label-noise-conn  { animation: label-noise-trace 6.4s ease-in-out infinite; }
      .label-noise-stage { animation: label-noise-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes label-noise-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes label-noise-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .label-noise-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .label-noise-stage { animation: label-noise-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes label-noise-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="label-noise-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="label-noise-bg" width="980" height="322"/>
  <text class="label-noise-h1"  x="30" y="40">Finding mislabelled data automatically</text>
  <text class="label-noise-sub" x="30" y="64">Disagreement between model and label.</text>
  <g class="label-noise-stage label-noise-s0">
    <rect class="label-noise-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="label-noise-step" x="44" y="142">01</text>
    <text class="label-noise-name" x="70" y="142">Human annotators disagree on 3-10%</text>
    <text class="label-noise-desc" x="44" y="166">Of real-world image labels. This</text>
    <text class="label-noise-desc" x="44" y="182">is normal, not exceptional.</text>
  </g>
  <line class="label-noise-line label-noise-conn label-noise-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#label-noise-tip)"/>
  <g class="label-noise-stage label-noise-s1">
    <rect class="label-noise-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="label-noise-step" x="280" y="142">02</text>
    <text class="label-noise-name" x="306" y="142">Predict every sample out of fold</text>
    <text class="label-noise-desc" x="280" y="166">So the model never saw the</text>
    <text class="label-noise-desc" x="280" y="182">sample it is judging.</text>
  </g>
  <line class="label-noise-line label-noise-conn label-noise-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#label-noise-tip)"/>
  <g class="label-noise-stage label-noise-s2">
    <rect class="label-noise-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="label-noise-step" x="516" y="142">03</text>
    <text class="label-noise-name" x="542" y="142">Flag confident disagreement</text>
    <text class="label-noise-desc" x="516" y="166">High-confidence prediction of a</text>
    <text class="label-noise-desc" x="516" y="182">different class than the label.</text>
  </g>
  <line class="label-noise-line label-noise-conn label-noise-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#label-noise-tip)"/>
  <g class="label-noise-stage label-noise-s3">
    <rect class="label-noise-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="label-noise-step" x="752" y="142">04</text>
    <text class="label-noise-name" x="778" y="142">Send those for human review</text>
    <text class="label-noise-desc" x="752" y="166">A short list rather than the</text>
    <text class="label-noise-desc" x="752" y="182">whole dataset.</text>
  </g>
  <text class="label-noise-sub" x="30" y="304">Reviewing a flagged shortlist rather than the whole dataset is what makes label auditing affordable, and correcting a few percent of labels often moves accuracy more than any architectural change.</text>
</svg>
