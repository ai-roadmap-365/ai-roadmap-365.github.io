<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One is yours; one belongs to the project.">
  <title>Two levels of editor settings</title>
  <style>
    .workspace-settings-bg   { fill: #f8fafc; }
    .workspace-settings-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workspace-settings-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workspace-settings-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workspace-settings-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workspace-settings-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workspace-settings-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .workspace-settings-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .workspace-settings-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .workspace-settings-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .workspace-settings-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .workspace-settings-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .workspace-settings-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .workspace-settings-row { opacity: 1; }
    .workspace-settings-r0 { animation-delay: 0.00s; }
    .workspace-settings-r1 { animation-delay: 0.45s; }
    .workspace-settings-r2 { animation-delay: 0.90s; }
    .workspace-settings-r3 { animation-delay: 1.35s; }
    .workspace-settings-r4 { animation-delay: 1.80s; }
    .workspace-settings-row { animation: workspace-settings-reveal 7.3s ease-in-out infinite; }
    @keyframes workspace-settings-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="workspace-settings-bg" width="980" height="390"/>
  <text class="workspace-settings-h1"  x="30" y="40">Two levels of editor settings</text>
  <text class="workspace-settings-sub" x="30" y="64">One is yours; one belongs to the project.</text>
  <rect class="workspace-settings-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="workspace-settings-name" x="46" y="122">User settings</text>
  <text class="workspace-settings-desc" x="46" y="142">Yours, everywhere.</text>
  <text class="workspace-settings-desc workspace-settings-row workspace-settings-r0" x="46" y="182">Font, theme, keybindings</text>
  <text class="workspace-settings-desc workspace-settings-row workspace-settings-r1" x="46" y="216">Apply to every project you open</text>
  <text class="workspace-settings-desc workspace-settings-row workspace-settings-r2" x="46" y="250">Never committed</text>
  <text class="workspace-settings-desc workspace-settings-row workspace-settings-r3" x="46" y="284">Nobody else is affected</text>
  <text class="workspace-settings-desc workspace-settings-row workspace-settings-r4" x="46" y="318">Personal preference belongs here</text>
  <rect class="workspace-settings-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="workspace-settings-name" x="526" y="122">Workspace settings</text>
  <text class="workspace-settings-desc" x="526" y="142">The project's, for everyone.</text>
  <text class="workspace-settings-desc workspace-settings-row workspace-settings-r0" x="526" y="182">Formatter, linter, interpreter path</text>
  <text class="workspace-settings-desc workspace-settings-row workspace-settings-r1" x="526" y="216">Apply only inside this project</text>
  <text class="workspace-settings-desc workspace-settings-row workspace-settings-r2" x="526" y="250">Committed with the code</text>
  <text class="workspace-settings-desc workspace-settings-row workspace-settings-r3" x="526" y="284">Everyone gets the same behaviour</text>
  <text class="workspace-settings-desc workspace-settings-row workspace-settings-r4" x="526" y="318">Project decisions belong here</text>
  <text class="workspace-settings-sub" x="30" y="372">Putting a formatter choice in user settings is why two people's editors fight over a file. It is a property of the project, not of the person, and committing it settles the question once.</text>
</svg>
