<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Inspected, or not.">
  <title>A production line</title>
  <style>
    .production-line-bg   { fill: #f8fafc; }
    .production-line-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .production-line-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .production-line-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .production-line-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .production-line-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .production-line-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .production-line-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .production-line-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .production-line-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .production-line-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .production-line-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .production-line-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .production-line-row { opacity: 1; }
    .production-line-r0 { animation-delay: 0.00s; }
    .production-line-r1 { animation-delay: 0.45s; }
    .production-line-r2 { animation-delay: 0.90s; }
    .production-line-r3 { animation-delay: 1.35s; }
    .production-line-r4 { animation-delay: 1.80s; }
    .production-line-row { animation: production-line-reveal 7.3s ease-in-out infinite; }
    @keyframes production-line-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="production-line-bg" width="980" height="390"/>
  <text class="production-line-h1"  x="30" y="40">A production line</text>
  <text class="production-line-sub" x="30" y="64">Inspected, or not.</text>
  <rect class="production-line-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="production-line-name" x="46" y="122">With inspection</text>
  <text class="production-line-desc" x="46" y="142">Faults caught early.</text>
  <text class="production-line-desc production-line-row production-line-r0" x="46" y="182">Materials checked on arrival</text>
  <text class="production-line-desc production-line-row production-line-r1" x="46" y="216">Counts recorded at each stage</text>
  <text class="production-line-desc production-line-row production-line-r2" x="46" y="250">A fault stops the line</text>
  <text class="production-line-desc production-line-row production-line-r3" x="46" y="284">Rework is local and cheap</text>
  <text class="production-line-desc production-line-row production-line-r4" x="46" y="318">This is a validated pipeline</text>
  <rect class="production-line-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="production-line-name" x="526" y="122">Without</text>
  <text class="production-line-desc" x="526" y="142">Faults caught late.</text>
  <text class="production-line-desc production-line-row production-line-r0" x="526" y="182">Anything is accepted</text>
  <text class="production-line-desc production-line-row production-line-r1" x="526" y="216">No counts kept</text>
  <text class="production-line-desc production-line-row production-line-r2" x="526" y="250">Faults pass through</text>
  <text class="production-line-desc production-line-row production-line-r3" x="526" y="284">Discovered by the customer</text>
  <text class="production-line-desc production-line-row production-line-r4" x="526" y="318">This is an unvalidated pipeline</text>
  <text class="production-line-sub" x="30" y="372">Discovery by the customer is the expensive case, and in data work the customer is whoever makes a decision on the basis of a wrong number.</text>
</svg>
