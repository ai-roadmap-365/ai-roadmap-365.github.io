<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Why one won.">
  <title>Diffusion against adversarial training</title>
  <style>
    .diffusion-vs-gan-bg   { fill: #f8fafc; }
    .diffusion-vs-gan-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diffusion-vs-gan-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diffusion-vs-gan-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diffusion-vs-gan-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diffusion-vs-gan-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diffusion-vs-gan-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .diffusion-vs-gan-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .diffusion-vs-gan-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .diffusion-vs-gan-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .diffusion-vs-gan-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .diffusion-vs-gan-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .diffusion-vs-gan-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .diffusion-vs-gan-row { opacity: 1; }
    .diffusion-vs-gan-r0 { animation-delay: 0.00s; }
    .diffusion-vs-gan-r1 { animation-delay: 0.45s; }
    .diffusion-vs-gan-r2 { animation-delay: 0.90s; }
    .diffusion-vs-gan-r3 { animation-delay: 1.35s; }
    .diffusion-vs-gan-r4 { animation-delay: 1.80s; }
    .diffusion-vs-gan-row { animation: diffusion-vs-gan-reveal 7.3s ease-in-out infinite; }
    @keyframes diffusion-vs-gan-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="diffusion-vs-gan-bg" width="980" height="390"/>
  <text class="diffusion-vs-gan-h1"  x="30" y="40">Diffusion against adversarial training</text>
  <text class="diffusion-vs-gan-sub" x="30" y="64">Why one won.</text>
  <rect class="diffusion-vs-gan-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="diffusion-vs-gan-name" x="46" y="122">Adversarial</text>
  <text class="diffusion-vs-gan-desc" x="46" y="142">A contest.</text>
  <text class="diffusion-vs-gan-desc diffusion-vs-gan-row diffusion-vs-gan-r0" x="46" y="182">Two networks competing</text>
  <text class="diffusion-vs-gan-desc diffusion-vs-gan-row diffusion-vs-gan-r1" x="46" y="216">Unstable, and hard to tune</text>
  <text class="diffusion-vs-gan-desc diffusion-vs-gan-row diffusion-vs-gan-r2" x="46" y="250">Collapses to a few outputs</text>
  <text class="diffusion-vs-gan-desc diffusion-vs-gan-row diffusion-vs-gan-r3" x="46" y="284">One forward pass to generate</text>
  <text class="diffusion-vs-gan-desc diffusion-vs-gan-row diffusion-vs-gan-r4" x="46" y="318">Very fast at inference</text>
  <rect class="diffusion-vs-gan-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="diffusion-vs-gan-name" x="526" y="122">Diffusion</text>
  <text class="diffusion-vs-gan-desc" x="526" y="142">A regression.</text>
  <text class="diffusion-vs-gan-desc diffusion-vs-gan-row diffusion-vs-gan-r0" x="526" y="182">One network, one objective</text>
  <text class="diffusion-vs-gan-desc diffusion-vs-gan-row diffusion-vs-gan-r1" x="526" y="216">Stable, and scales predictably</text>
  <text class="diffusion-vs-gan-desc diffusion-vs-gan-row diffusion-vs-gan-r2" x="526" y="250">Covers the full distribution</text>
  <text class="diffusion-vs-gan-desc diffusion-vs-gan-row diffusion-vs-gan-r3" x="526" y="284">Many steps to generate</text>
  <text class="diffusion-vs-gan-desc diffusion-vs-gan-row diffusion-vs-gan-r4" x="526" y="318">Much slower at inference</text>
  <text class="diffusion-vs-gan-sub" x="30" y="372">Diffusion won on stability and coverage while being far slower, which is why so much subsequent work has gone into reducing the step count.</text>
</svg>
