<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The cost is nanoseconds; the benefit is the next reader.">
  <title>Structure is not overhead</title>
  <style>
    .structure-costs-nothing-bg   { fill: #f8fafc; }
    .structure-costs-nothing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structure-costs-nothing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structure-costs-nothing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structure-costs-nothing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structure-costs-nothing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .structure-costs-nothing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .structure-costs-nothing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .structure-costs-nothing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .structure-costs-nothing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .structure-costs-nothing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .structure-costs-nothing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .structure-costs-nothing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .structure-costs-nothing-row { opacity: 1; }
    .structure-costs-nothing-r0 { animation-delay: 0.00s; }
    .structure-costs-nothing-r1 { animation-delay: 0.45s; }
    .structure-costs-nothing-r2 { animation-delay: 0.90s; }
    .structure-costs-nothing-r3 { animation-delay: 1.35s; }
    .structure-costs-nothing-r4 { animation-delay: 1.80s; }
    .structure-costs-nothing-row { animation: structure-costs-nothing-reveal 7.3s ease-in-out infinite; }
    @keyframes structure-costs-nothing-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="structure-costs-nothing-bg" width="980" height="390"/>
  <text class="structure-costs-nothing-h1"  x="30" y="40">Structure is not overhead</text>
  <text class="structure-costs-nothing-sub" x="30" y="64">The cost is nanoseconds; the benefit is the next reader.</text>
  <rect class="structure-costs-nothing-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="structure-costs-nothing-name" x="46" y="122">What structure costs</text>
  <text class="structure-costs-nothing-desc" x="46" y="142">Almost nothing measurable.</text>
  <text class="structure-costs-nothing-desc structure-costs-nothing-row structure-costs-nothing-r0" x="46" y="182">A function call is nanoseconds</text>
  <text class="structure-costs-nothing-desc structure-costs-nothing-row structure-costs-nothing-r1" x="46" y="216">Usually FEWER lines, not more</text>
  <text class="structure-costs-nothing-desc structure-costs-nothing-row structure-costs-nothing-r2" x="46" y="250">Repetition becomes one named thing</text>
  <text class="structure-costs-nothing-desc structure-costs-nothing-row structure-costs-nothing-r3" x="46" y="284">No memory overhead worth naming</text>
  <text class="structure-costs-nothing-desc structure-costs-nothing-row structure-costs-nothing-r4" x="46" y="318">Irrelevant beside any I/O in the program</text>
  <rect class="structure-costs-nothing-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="structure-costs-nothing-name" x="526" y="122">What no structure costs</text>
  <text class="structure-costs-nothing-desc" x="526" y="142">Everything that matters later.</text>
  <text class="structure-costs-nothing-desc structure-costs-nothing-row structure-costs-nothing-r0" x="526" y="182">Nothing can be tested in isolation</text>
  <text class="structure-costs-nothing-desc structure-costs-nothing-row structure-costs-nothing-r1" x="526" y="216">Nothing can be reused</text>
  <text class="structure-costs-nothing-desc structure-costs-nothing-row structure-costs-nothing-r2" x="526" y="250">A reader must hold it all at once</text>
  <text class="structure-costs-nothing-desc structure-costs-nothing-row structure-costs-nothing-r3" x="526" y="284">A change risks the whole file</text>
  <text class="structure-costs-nothing-desc structure-costs-nothing-row structure-costs-nothing-r4" x="526" y="318">And so it gets rewritten instead</text>
  <text class="structure-costs-nothing-sub" x="30" y="372">The scarce resource is comprehension, not cycles. A program nobody can safely change has a real cost that never appears in a profiler and dominates every other number in the project.</text>
</svg>
