<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Selection stability</title>
  <style>
    .selection-stability-bg   { fill: #f8fafc; }
    .selection-stability-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .selection-stability-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .selection-stability-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .selection-stability-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .selection-stability-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .selection-stability-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .selection-stability-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .selection-stability-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .selection-stability-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .selection-stability-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .selection-stability-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .selection-stability-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .selection-stability-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .selection-stability-stage { opacity: 1; }

    .selection-stability-s0 { animation-delay: 0.00s; }
    .selection-stability-e0 { animation-delay: 0.00s; }
    .selection-stability-s1 { animation-delay: 1.28s; }
    .selection-stability-e1 { animation-delay: 1.28s; }
    .selection-stability-s2 { animation-delay: 2.56s; }
    .selection-stability-e2 { animation-delay: 2.56s; }
    .selection-stability-s3 { animation-delay: 3.84s; }
    .selection-stability-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .selection-stability-conn  { animation: selection-stability-trace 6.4s ease-in-out infinite; }
      .selection-stability-stage { animation: selection-stability-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes selection-stability-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes selection-stability-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .selection-stability-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .selection-stability-stage { animation: selection-stability-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes selection-stability-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="selection-stability-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="selection-stability-bg" width="980" height="322"/>
  <text class="selection-stability-h1"  x="30" y="40">Selection stability</text>
  <text class="selection-stability-sub" x="30" y="64">Four steps.</text>
  <g class="selection-stability-stage selection-stability-s0">
    <rect class="selection-stability-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="selection-stability-step" x="44" y="142">01</text>
    <text class="selection-stability-name" x="70" y="142">Run the selection separately in every fold</text>
    <text class="selection-stability-desc" x="44" y="166">Which gives a different subset</text>
    <text class="selection-stability-desc" x="44" y="182">each time.</text>
  </g>
  <line class="selection-stability-line selection-stability-conn selection-stability-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#selection-stability-tip)"/>
  <g class="selection-stability-stage selection-stability-s1">
    <rect class="selection-stability-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="selection-stability-step" x="280" y="142">02</text>
    <text class="selection-stability-name" x="306" y="142">Count how often each feature is chosen</text>
    <text class="selection-stability-desc" x="280" y="166">Across all folds.</text>
  </g>
  <line class="selection-stability-line selection-stability-conn selection-stability-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#selection-stability-tip)"/>
  <g class="selection-stability-stage selection-stability-s2">
    <rect class="selection-stability-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="selection-stability-step" x="516" y="142">03</text>
    <text class="selection-stability-name" x="542" y="142">Features chosen every time are reliable</text>
    <text class="selection-stability-desc" x="516" y="166">Those chosen once are</text>
    <text class="selection-stability-desc" x="516" y="182">fold-specific noise.</text>
  </g>
  <line class="selection-stability-line selection-stability-conn selection-stability-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#selection-stability-tip)"/>
  <g class="selection-stability-stage selection-stability-s3">
    <rect class="selection-stability-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="selection-stability-step" x="752" y="142">04</text>
    <text class="selection-stability-name" x="778" y="142">Keep the stable ones</text>
    <text class="selection-stability-desc" x="752" y="166">Which generalises better than</text>
    <text class="selection-stability-desc" x="752" y="182">any single fold's subset.</text>
  </g>
  <text class="selection-stability-sub" x="30" y="304">Stability is a stronger criterion than importance because it distinguishes a feature that genuinely helps from one that happened to help on a particular sample.</text>
</svg>
