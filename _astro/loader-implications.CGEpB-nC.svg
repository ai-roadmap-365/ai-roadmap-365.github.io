<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are memory.">
  <title>Four operational consequences</title>
  <style>
    .loader-implications-bg   { fill: #f8fafc; }
    .loader-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loader-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loader-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loader-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loader-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loader-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .loader-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .loader-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .loader-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .loader-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .loader-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .loader-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .loader-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .loader-implications-stage { opacity: 1; }

    .loader-implications-s0 { animation-delay: 0.00s; }
    .loader-implications-e0 { animation-delay: 0.00s; }
    .loader-implications-s1 { animation-delay: 1.28s; }
    .loader-implications-e1 { animation-delay: 1.28s; }
    .loader-implications-s2 { animation-delay: 2.56s; }
    .loader-implications-e2 { animation-delay: 2.56s; }
    .loader-implications-s3 { animation-delay: 3.84s; }
    .loader-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .loader-implications-conn  { animation: loader-implications-trace 6.4s ease-in-out infinite; }
      .loader-implications-stage { animation: loader-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes loader-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes loader-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .loader-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .loader-implications-stage { animation: loader-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes loader-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="loader-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="loader-implications-bg" width="980" height="322"/>
  <text class="loader-implications-h1"  x="30" y="40">Four operational consequences</text>
  <text class="loader-implications-sub" x="30" y="64">Two are memory.</text>
  <g class="loader-implications-stage loader-implications-s0">
    <rect class="loader-implications-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="loader-implications-step" x="44" y="142">01</text>
    <text class="loader-implications-name" x="70" y="142">A starved accelerator looks like a slow model</text>
    <text class="loader-implications-desc" x="44" y="166">Check utilisation before</text>
    <text class="loader-implications-desc" x="44" y="182">optimising the network.</text>
  </g>
  <line class="loader-implications-line loader-implications-conn loader-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#loader-implications-tip)"/>
  <g class="loader-implications-stage loader-implications-s1">
    <rect class="loader-implications-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="loader-implications-step" x="280" y="142">02</text>
    <text class="loader-implications-name" x="306" y="142">Workers duplicate the dataset object</text>
    <text class="loader-implications-desc" x="280" y="166">Heavy objects in the dataset</text>
    <text class="loader-implications-desc" x="280" y="182">multiply across processes.</text>
  </g>
  <line class="loader-implications-line loader-implications-conn loader-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#loader-implications-tip)"/>
  <g class="loader-implications-stage loader-implications-s2">
    <rect class="loader-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="loader-implications-step" x="516" y="142">03</text>
    <text class="loader-implications-name" x="542" y="142">Worker seeds need setting</text>
    <text class="loader-implications-desc" x="516" y="166">Or every worker generates the</text>
    <text class="loader-implications-desc" x="516" y="182">same augmentation randomness.</text>
  </g>
  <line class="loader-implications-line loader-implications-conn loader-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#loader-implications-tip)"/>
  <g class="loader-implications-stage loader-implications-s3">
    <rect class="loader-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="loader-implications-step" x="752" y="142">04</text>
    <text class="loader-implications-name" x="778" y="142">Zero workers for debugging</text>
    <text class="loader-implications-desc" x="752" y="166">Exceptions in a worker process</text>
    <text class="loader-implications-desc" x="752" y="182">are much harder to read.</text>
  </g>
  <text class="loader-implications-sub" x="30" y="304">The seed point produces a subtle and expensive bug: with unseeded workers, four processes apply identical random crops, and the augmentation you thought was diversifying the data is doing a quarter as much.</text>
</svg>
