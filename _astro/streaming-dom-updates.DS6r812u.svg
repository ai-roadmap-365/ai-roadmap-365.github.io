<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Append, or re-render — the difference is felt immediately.">
  <title>Streaming tokens into a page</title>
  <style>
    .streaming-dom-updates-bg   { fill: #f8fafc; }
    .streaming-dom-updates-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-dom-updates-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-dom-updates-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-dom-updates-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-dom-updates-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-dom-updates-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .streaming-dom-updates-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .streaming-dom-updates-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .streaming-dom-updates-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .streaming-dom-updates-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .streaming-dom-updates-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .streaming-dom-updates-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .streaming-dom-updates-row { opacity: 1; }
    .streaming-dom-updates-r0 { animation-delay: 0.00s; }
    .streaming-dom-updates-r1 { animation-delay: 0.45s; }
    .streaming-dom-updates-r2 { animation-delay: 0.90s; }
    .streaming-dom-updates-r3 { animation-delay: 1.35s; }
    .streaming-dom-updates-r4 { animation-delay: 1.80s; }
    .streaming-dom-updates-row { animation: streaming-dom-updates-reveal 7.3s ease-in-out infinite; }
    @keyframes streaming-dom-updates-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="streaming-dom-updates-bg" width="980" height="390"/>
  <text class="streaming-dom-updates-h1"  x="30" y="40">Streaming tokens into a page</text>
  <text class="streaming-dom-updates-sub" x="30" y="64">Append, or re-render — the difference is felt immediately.</text>
  <rect class="streaming-dom-updates-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="streaming-dom-updates-name" x="46" y="122">Re-render per token</text>
  <text class="streaming-dom-updates-desc" x="46" y="142">Rebuild the panel each time.</text>
  <text class="streaming-dom-updates-desc streaming-dom-updates-row streaming-dom-updates-r0" x="46" y="182">The whole subtree is replaced</text>
  <text class="streaming-dom-updates-desc streaming-dom-updates-row streaming-dom-updates-r1" x="46" y="216">Layout runs across all of it, per token</text>
  <text class="streaming-dom-updates-desc streaming-dom-updates-row streaming-dom-updates-r2" x="46" y="250">Selection and scroll position are lost</text>
  <text class="streaming-dom-updates-desc streaming-dom-updates-row streaming-dom-updates-r3" x="46" y="284">Frame rate collapses on long outputs</text>
  <text class="streaming-dom-updates-desc streaming-dom-updates-row streaming-dom-updates-r4" x="46" y="318">Feels worse the better the model gets</text>
  <rect class="streaming-dom-updates-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="streaming-dom-updates-name" x="526" y="122">Append per token</text>
  <text class="streaming-dom-updates-desc" x="526" y="142">Add to the existing text node.</text>
  <text class="streaming-dom-updates-desc streaming-dom-updates-row streaming-dom-updates-r0" x="526" y="182">Only the changed node is touched</text>
  <text class="streaming-dom-updates-desc streaming-dom-updates-row streaming-dom-updates-r1" x="526" y="216">Layout work stays proportional to the change</text>
  <text class="streaming-dom-updates-desc streaming-dom-updates-row streaming-dom-updates-r2" x="526" y="250">Selection and scroll survive</text>
  <text class="streaming-dom-updates-desc streaming-dom-updates-row streaming-dom-updates-r3" x="526" y="284">Smooth regardless of output length</text>
  <text class="streaming-dom-updates-desc streaming-dom-updates-row streaming-dom-updates-r4" x="526" y="318">Batch a few tokens per frame for more headroom</text>
  <text class="streaming-dom-updates-sub" x="30" y="372">The model generates at the same speed either way. Everything the user experiences as "fast" or "janky" here is decided on the front end.</text>
</svg>
