<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Calibrated on real defects.">
  <title>A bean sorting machine</title>
  <style>
    .coffee-sorter-bg   { fill: #f8fafc; }
    .coffee-sorter-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .coffee-sorter-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .coffee-sorter-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .coffee-sorter-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .coffee-sorter-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .coffee-sorter-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .coffee-sorter-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .coffee-sorter-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .coffee-sorter-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .coffee-sorter-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .coffee-sorter-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .coffee-sorter-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .coffee-sorter-row { opacity: 1; }
    .coffee-sorter-r0 { animation-delay: 0.00s; }
    .coffee-sorter-r1 { animation-delay: 0.45s; }
    .coffee-sorter-r2 { animation-delay: 0.90s; }
    .coffee-sorter-r3 { animation-delay: 1.35s; }
    .coffee-sorter-r4 { animation-delay: 1.80s; }
    .coffee-sorter-row { animation: coffee-sorter-reveal 7.3s ease-in-out infinite; }
    @keyframes coffee-sorter-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="coffee-sorter-bg" width="980" height="390"/>
  <text class="coffee-sorter-h1"  x="30" y="40">A bean sorting machine</text>
  <text class="coffee-sorter-sub" x="30" y="64">Calibrated on real defects.</text>
  <rect class="coffee-sorter-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="coffee-sorter-name" x="46" y="122">Catalogue images</text>
  <text class="coffee-sorter-desc" x="46" y="142">Clean, and unrepresentative.</text>
  <text class="coffee-sorter-desc coffee-sorter-row coffee-sorter-r0" x="46" y="182">Perfect lighting, centred subject</text>
  <text class="coffee-sorter-desc coffee-sorter-row coffee-sorter-r1" x="46" y="216">Every defect clearly visible</text>
  <text class="coffee-sorter-desc coffee-sorter-row coffee-sorter-r2" x="46" y="250">Works beautifully in the demonstration</text>
  <text class="coffee-sorter-desc coffee-sorter-row coffee-sorter-r3" x="46" y="284">Fails on the actual production line</text>
  <text class="coffee-sorter-desc coffee-sorter-row coffee-sorter-r4" x="46" y="318">Different camera, different lighting</text>
  <rect class="coffee-sorter-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="coffee-sorter-name" x="526" y="122">Real production output</text>
  <text class="coffee-sorter-desc" x="526" y="142">Messy, and representative.</text>
  <text class="coffee-sorter-desc coffee-sorter-row coffee-sorter-r0" x="526" y="182">The actual camera and conveyor</text>
  <text class="coffee-sorter-desc coffee-sorter-row coffee-sorter-r1" x="526" y="216">Real occlusion and glare</text>
  <text class="coffee-sorter-desc coffee-sorter-row coffee-sorter-r2" x="526" y="250">Genuinely ambiguous borderline cases</text>
  <text class="coffee-sorter-desc coffee-sorter-row coffee-sorter-r3" x="526" y="284">Which is what the machine will see</text>
  <text class="coffee-sorter-desc coffee-sorter-row coffee-sorter-r4" x="526" y="318">And what it must be calibrated on</text>
  <text class="coffee-sorter-sub" x="30" y="372">Collecting data from the deployment environment rather than from an idealised source is the single most reliable predictor of whether a custom vision model works in production.</text>
</svg>
