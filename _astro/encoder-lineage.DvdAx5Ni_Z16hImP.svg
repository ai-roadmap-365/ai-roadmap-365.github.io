<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Data, parameters, position, and efficiency.">
  <title>Four refinements after BERT</title>
  <style>
    .encoder-lineage-bg   { fill: #f8fafc; }
    .encoder-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoder-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoder-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoder-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoder-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoder-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .encoder-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .encoder-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .encoder-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .encoder-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .encoder-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .encoder-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .encoder-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .encoder-lineage-stage { opacity: 1; }

    .encoder-lineage-s0 { animation-delay: 0.00s; }
    .encoder-lineage-e0 { animation-delay: 0.00s; }
    .encoder-lineage-s1 { animation-delay: 1.28s; }
    .encoder-lineage-e1 { animation-delay: 1.28s; }
    .encoder-lineage-s2 { animation-delay: 2.56s; }
    .encoder-lineage-e2 { animation-delay: 2.56s; }
    .encoder-lineage-s3 { animation-delay: 3.84s; }
    .encoder-lineage-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .encoder-lineage-conn  { animation: encoder-lineage-trace 6.4s ease-in-out infinite; }
      .encoder-lineage-stage { animation: encoder-lineage-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes encoder-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes encoder-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .encoder-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .encoder-lineage-stage { animation: encoder-lineage-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes encoder-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="encoder-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="encoder-lineage-bg" width="980" height="322"/>
  <text class="encoder-lineage-h1"  x="30" y="40">Four refinements after BERT</text>
  <text class="encoder-lineage-sub" x="30" y="64">Data, parameters, position, and efficiency.</text>
  <g class="encoder-lineage-stage encoder-lineage-s0">
    <rect class="encoder-lineage-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="encoder-lineage-step" x="44" y="142">01</text>
    <text class="encoder-lineage-name" x="70" y="142">Better training, same architecture</text>
    <text class="encoder-lineage-desc" x="44" y="166">More data, longer training,</text>
    <text class="encoder-lineage-desc" x="44" y="182">dynamic masking, no</text>
    <text class="encoder-lineage-desc" x="44" y="198">sentence-pair objective.</text>
  </g>
  <line class="encoder-lineage-line encoder-lineage-conn encoder-lineage-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#encoder-lineage-tip)"/>
  <g class="encoder-lineage-stage encoder-lineage-s1">
    <rect class="encoder-lineage-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="encoder-lineage-step" x="280" y="142">02</text>
    <text class="encoder-lineage-name" x="306" y="142">Parameter sharing</text>
    <text class="encoder-lineage-desc" x="280" y="166">Reuse weights across layers to</text>
    <text class="encoder-lineage-desc" x="280" y="182">shrink the memory footprint.</text>
  </g>
  <line class="encoder-lineage-line encoder-lineage-conn encoder-lineage-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#encoder-lineage-tip)"/>
  <g class="encoder-lineage-stage encoder-lineage-s2">
    <rect class="encoder-lineage-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="encoder-lineage-step" x="516" y="142">03</text>
    <text class="encoder-lineage-name" x="542" y="142">Disentangled position</text>
    <text class="encoder-lineage-desc" x="516" y="166">Separate content and position</text>
    <text class="encoder-lineage-desc" x="516" y="182">vectors in the attention</text>
    <text class="encoder-lineage-desc" x="516" y="198">computation.</text>
  </g>
  <line class="encoder-lineage-line encoder-lineage-conn encoder-lineage-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#encoder-lineage-tip)"/>
  <g class="encoder-lineage-stage encoder-lineage-s3">
    <rect class="encoder-lineage-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="encoder-lineage-step" x="752" y="142">04</text>
    <text class="encoder-lineage-name" x="778" y="142">Replaced-token detection</text>
    <text class="encoder-lineage-desc" x="752" y="166">A loss on every token rather</text>
    <text class="encoder-lineage-desc" x="752" y="182">than the masked fifteen percent.</text>
    <text class="encoder-lineage-edge" x="752" y="242">efficiency</text>
  </g>
  <text class="encoder-lineage-sub" x="30" y="304">The first row is the most instructive: a large share of BERT's headroom was in the training recipe rather than the architecture, which is a pattern that recurred repeatedly afterwards.</text>
</svg>
