<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Mostly, it removed choices that could be made badly.">
  <title>What TLS 1.3 removed</title>
  <style>
    .tls13-versus-tls12-bg   { fill: #f8fafc; }
    .tls13-versus-tls12-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tls13-versus-tls12-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tls13-versus-tls12-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tls13-versus-tls12-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tls13-versus-tls12-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tls13-versus-tls12-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tls13-versus-tls12-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tls13-versus-tls12-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tls13-versus-tls12-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tls13-versus-tls12-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tls13-versus-tls12-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tls13-versus-tls12-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tls13-versus-tls12-row { opacity: 1; }
    .tls13-versus-tls12-r0 { animation-delay: 0.00s; }
    .tls13-versus-tls12-r1 { animation-delay: 0.45s; }
    .tls13-versus-tls12-r2 { animation-delay: 0.90s; }
    .tls13-versus-tls12-r3 { animation-delay: 1.35s; }
    .tls13-versus-tls12-r4 { animation-delay: 1.80s; }
    .tls13-versus-tls12-row { animation: tls13-versus-tls12-reveal 7.3s ease-in-out infinite; }
    @keyframes tls13-versus-tls12-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tls13-versus-tls12-bg" width="980" height="390"/>
  <text class="tls13-versus-tls12-h1"  x="30" y="40">What TLS 1.3 removed</text>
  <text class="tls13-versus-tls12-sub" x="30" y="64">Mostly, it removed choices that could be made badly.</text>
  <rect class="tls13-versus-tls12-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tls13-versus-tls12-name" x="46" y="122">TLS 1.2 (2008)</text>
  <text class="tls13-versus-tls12-desc" x="46" y="142">Flexible, and flexible was the problem.</text>
  <text class="tls13-versus-tls12-desc tls13-versus-tls12-row tls13-versus-tls12-r0" x="46" y="182">Two round trips to establish</text>
  <text class="tls13-versus-tls12-desc tls13-versus-tls12-row tls13-versus-tls12-r1" x="46" y="216">Dozens of cipher suites, some weak</text>
  <text class="tls13-versus-tls12-desc tls13-versus-tls12-row tls13-versus-tls12-r2" x="46" y="250">Forward secrecy optional</text>
  <text class="tls13-versus-tls12-desc tls13-versus-tls12-row tls13-versus-tls12-r3" x="46" y="284">Most of the handshake in the clear</text>
  <text class="tls13-versus-tls12-desc tls13-versus-tls12-row tls13-versus-tls12-r4" x="46" y="318">Downgrade attacks were possible</text>
  <rect class="tls13-versus-tls12-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tls13-versus-tls12-name" x="526" y="122">TLS 1.3 (2018)</text>
  <text class="tls13-versus-tls12-desc" x="526" y="142">Fewer options, none of them bad.</text>
  <text class="tls13-versus-tls12-desc tls13-versus-tls12-row tls13-versus-tls12-r0" x="526" y="182">One round trip; zero on resumption</text>
  <text class="tls13-versus-tls12-desc tls13-versus-tls12-row tls13-versus-tls12-r1" x="526" y="216">Five cipher suites, all sound</text>
  <text class="tls13-versus-tls12-desc tls13-versus-tls12-row tls13-versus-tls12-r2" x="526" y="250">Forward secrecy mandatory</text>
  <text class="tls13-versus-tls12-desc tls13-versus-tls12-row tls13-versus-tls12-r3" x="526" y="284">Handshake encrypted as early as possible</text>
  <text class="tls13-versus-tls12-desc tls13-versus-tls12-row tls13-versus-tls12-r4" x="526" y="318">Legacy negotiation removed entirely</text>
  <text class="tls13-versus-tls12-sub" x="30" y="372">The old "HTTPS makes sites slow" argument was true of TLS 1.2 on a bad day and has not been true since. Security and speed moved the same direction here.</text>
</svg>
