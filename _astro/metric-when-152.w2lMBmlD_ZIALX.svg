<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the decision.">
  <title>Which metric when</title>
  <style>
    .metric-when-152-bg   { fill: #f8fafc; }
    .metric-when-152-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-when-152-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-when-152-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-when-152-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-when-152-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-when-152-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .metric-when-152-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .metric-when-152-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .metric-when-152-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .metric-when-152-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .metric-when-152-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .metric-when-152-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .metric-when-152-row { opacity: 1; }
    .metric-when-152-r0 { animation-delay: 0.00s; }
    .metric-when-152-r1 { animation-delay: 0.45s; }
    .metric-when-152-r2 { animation-delay: 0.90s; }
    .metric-when-152-r3 { animation-delay: 1.35s; }
    .metric-when-152-r4 { animation-delay: 1.80s; }
    .metric-when-152-row { animation: metric-when-152-reveal 7.3s ease-in-out infinite; }
    @keyframes metric-when-152-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="metric-when-152-bg" width="980" height="390"/>
  <text class="metric-when-152-h1"  x="30" y="40">Which metric when</text>
  <text class="metric-when-152-sub" x="30" y="64">By the decision.</text>
  <rect class="metric-when-152-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="metric-when-152-name" x="46" y="122">The situation</text>
  <text class="metric-when-152-desc" x="46" y="142">What you need.</text>
  <text class="metric-when-152-desc metric-when-152-row metric-when-152-r0" x="46" y="182">Large errors are disproportionately costly</text>
  <text class="metric-when-152-desc metric-when-152-row metric-when-152-r1" x="46" y="216">All errors cost proportionally</text>
  <text class="metric-when-152-desc metric-when-152-row metric-when-152-r2" x="46" y="250">Comparing across different problems</text>
  <text class="metric-when-152-desc metric-when-152-row metric-when-152-r3" x="46" y="284">Communicating to a non-technical audience</text>
  <text class="metric-when-152-desc metric-when-152-row metric-when-152-r4" x="46" y="318">Costs known in real units</text>
  <rect class="metric-when-152-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="metric-when-152-name" x="526" y="122">The metric</text>
  <text class="metric-when-152-desc" x="526" y="142">What to use.</text>
  <text class="metric-when-152-desc metric-when-152-row metric-when-152-r0" x="526" y="182">Root mean squared error</text>
  <text class="metric-when-152-desc metric-when-152-row metric-when-152-r1" x="526" y="216">Mean absolute error</text>
  <text class="metric-when-152-desc metric-when-152-row metric-when-152-r2" x="526" y="250">The fit statistic, with the caveat stated</text>
  <text class="metric-when-152-desc metric-when-152-row metric-when-152-r3" x="526" y="284">Absolute error, in the target's units</text>
  <text class="metric-when-152-desc metric-when-152-row metric-when-152-r4" x="526" y="318">Expected cost, directly</text>
  <text class="metric-when-152-sub" x="30" y="372">Reporting a held-out error in the target's own units is the single most useful line in a regression report, and it is frequently the one that is missing.</text>
</svg>
