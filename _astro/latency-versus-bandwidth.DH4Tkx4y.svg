<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Only one of them is fixed by paying more.">
  <title>Latency and bandwidth are different problems</title>
  <style>
    .latency-versus-bandwidth-bg   { fill: #f8fafc; }
    .latency-versus-bandwidth-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-versus-bandwidth-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-versus-bandwidth-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-versus-bandwidth-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-versus-bandwidth-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-versus-bandwidth-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .latency-versus-bandwidth-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .latency-versus-bandwidth-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .latency-versus-bandwidth-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .latency-versus-bandwidth-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .latency-versus-bandwidth-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .latency-versus-bandwidth-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .latency-versus-bandwidth-row { opacity: 1; }
    .latency-versus-bandwidth-r0 { animation-delay: 0.00s; }
    .latency-versus-bandwidth-r1 { animation-delay: 0.45s; }
    .latency-versus-bandwidth-r2 { animation-delay: 0.90s; }
    .latency-versus-bandwidth-r3 { animation-delay: 1.35s; }
    .latency-versus-bandwidth-r4 { animation-delay: 1.80s; }
    .latency-versus-bandwidth-row { animation: latency-versus-bandwidth-reveal 7.3s ease-in-out infinite; }
    @keyframes latency-versus-bandwidth-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="latency-versus-bandwidth-bg" width="980" height="390"/>
  <text class="latency-versus-bandwidth-h1"  x="30" y="40">Latency and bandwidth are different problems</text>
  <text class="latency-versus-bandwidth-sub" x="30" y="64">Only one of them is fixed by paying more.</text>
  <rect class="latency-versus-bandwidth-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="latency-versus-bandwidth-name" x="46" y="122">Latency</text>
  <text class="latency-versus-bandwidth-desc" x="46" y="142">How long one round trip takes.</text>
  <text class="latency-versus-bandwidth-desc latency-versus-bandwidth-row latency-versus-bandwidth-r0" x="46" y="182">Measured in milliseconds</text>
  <text class="latency-versus-bandwidth-desc latency-versus-bandwidth-row latency-versus-bandwidth-r1" x="46" y="216">Bounded by the speed of light and distance</text>
  <text class="latency-versus-bandwidth-desc latency-versus-bandwidth-row latency-versus-bandwidth-r2" x="46" y="250">A faster connection does not reduce it</text>
  <text class="latency-versus-bandwidth-desc latency-versus-bandwidth-row latency-versus-bandwidth-r3" x="46" y="284">Fixed only by moving physically closer</text>
  <text class="latency-versus-bandwidth-desc latency-versus-bandwidth-row latency-versus-bandwidth-r4" x="46" y="318">Dominates the FIRST visit to a site</text>
  <rect class="latency-versus-bandwidth-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="latency-versus-bandwidth-name" x="526" y="122">Bandwidth</text>
  <text class="latency-versus-bandwidth-desc" x="526" y="142">How much can flow per second.</text>
  <text class="latency-versus-bandwidth-desc latency-versus-bandwidth-row latency-versus-bandwidth-r0" x="526" y="182">Measured in megabits per second</text>
  <text class="latency-versus-bandwidth-desc latency-versus-bandwidth-row latency-versus-bandwidth-r1" x="526" y="216">Bounded by the equipment on the path</text>
  <text class="latency-versus-bandwidth-desc latency-versus-bandwidth-row latency-versus-bandwidth-r2" x="526" y="250">Upgrading your plan does raise it</text>
  <text class="latency-versus-bandwidth-desc latency-versus-bandwidth-row latency-versus-bandwidth-r3" x="526" y="284">Fixed by paying, usually</text>
  <text class="latency-versus-bandwidth-desc latency-versus-bandwidth-row latency-versus-bandwidth-r4" x="526" y="318">Dominates large downloads</text>
  <text class="latency-versus-bandwidth-sub" x="30" y="372">Doubling your bandwidth does nothing for a page made of many small requests. Halving your distance to the server changes everything.</text>
</svg>
