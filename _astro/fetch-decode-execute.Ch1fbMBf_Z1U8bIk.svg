<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" font-family="system-ui, sans-serif">
  <title>The fetch-decode-execute cycle that a CPU repeats billions of times per second</title>
  <rect x="0" y="0" width="700" height="420" fill="#f8fafc"/>
  <text x="350" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The fetch-decode-execute cycle</text>

  <!-- Boxes -->
  <rect x="40" y="80" width="180" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="130" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">1. Fetch</text>
  <text x="130" y="132" text-anchor="middle" font-size="14" fill="#1a202c">instruction from memory</text>

  <rect x="260" y="80" width="180" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="350" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">2. Decode</text>
  <text x="350" y="132" text-anchor="middle" font-size="14" fill="#1a202c">in the control unit</text>

  <rect x="480" y="80" width="180" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="570" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">3. Execute</text>
  <text x="570" y="132" text-anchor="middle" font-size="14" fill="#1a202c">in the ALU</text>

  <rect x="480" y="230" width="180" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="570" y="260" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">4. Write result</text>
  <text x="570" y="282" text-anchor="middle" font-size="14" fill="#1a202c">to a register or memory</text>

  <!-- Arrows between boxes -->
  <line x1="220" y1="115" x2="252" y2="115" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="260,115 246,108 246,122" fill="#1d4ed8"/>

  <line x1="440" y1="115" x2="472" y2="115" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="480,115 466,108 466,122" fill="#1d4ed8"/>

  <line x1="570" y1="150" x2="570" y2="222" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="570,230 563,216 577,216" fill="#1d4ed8"/>

  <!-- Loop back arrow -->
  <line x1="480" y1="265" x2="130" y2="265" stroke="#1d4ed8" stroke-width="3"/>
  <line x1="130" y1="265" x2="130" y2="158" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="130,150 123,164 137,164" fill="#1d4ed8"/>
  <text x="300" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">repeat: back to fetch, billions of times per second</text>

  <!-- Program counter note -->
  <rect x="40" y="330" width="620" height="60" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="350" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Program counter (PC)</text>
  <text x="350" y="376" text-anchor="middle" font-size="14" fill="#1a202c">A register that holds the memory address of the next instruction; it advances after each fetch.</text>
</svg>
