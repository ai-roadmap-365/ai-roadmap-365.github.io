<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Numbers need context.">
  <title>A reading without a scale</title>
  <style>
    .thermometer-bg   { fill: #f8fafc; }
    .thermometer-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .thermometer-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .thermometer-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .thermometer-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .thermometer-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .thermometer-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .thermometer-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .thermometer-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .thermometer-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .thermometer-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .thermometer-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .thermometer-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .thermometer-row { opacity: 1; }
    .thermometer-r0 { animation-delay: 0.00s; }
    .thermometer-r1 { animation-delay: 0.45s; }
    .thermometer-r2 { animation-delay: 0.90s; }
    .thermometer-r3 { animation-delay: 1.35s; }
    .thermometer-r4 { animation-delay: 1.80s; }
    .thermometer-row { animation: thermometer-reveal 7.3s ease-in-out infinite; }
    @keyframes thermometer-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="thermometer-bg" width="980" height="390"/>
  <text class="thermometer-h1"  x="30" y="40">A reading without a scale</text>
  <text class="thermometer-sub" x="30" y="64">Numbers need context.</text>
  <rect class="thermometer-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="thermometer-name" x="46" y="122">A unitless score</text>
  <text class="thermometer-desc" x="46" y="142">Comparable, and abstract.</text>
  <text class="thermometer-desc thermometer-row thermometer-r0" x="46" y="182">0.83, on a scale to one</text>
  <text class="thermometer-desc thermometer-row thermometer-r1" x="46" y="216">Comparable across problems</text>
  <text class="thermometer-desc thermometer-row thermometer-r2" x="46" y="250">Says nothing about consequences</text>
  <text class="thermometer-desc thermometer-row thermometer-r3" x="46" y="284">Cannot be checked against a requirement</text>
  <text class="thermometer-desc thermometer-row thermometer-r4" x="46" y="318">This is the fit statistic</text>
  <rect class="thermometer-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="thermometer-name" x="526" y="122">Real units</text>
  <text class="thermometer-desc" x="526" y="142">Concrete, and specific.</text>
  <text class="thermometer-desc thermometer-row thermometer-r0" x="526" y="182">Wrong by 54 units, on average</text>
  <text class="thermometer-desc thermometer-row thermometer-r1" x="526" y="216">Not comparable across problems</text>
  <text class="thermometer-desc thermometer-row thermometer-r2" x="526" y="250">Directly meaningful</text>
  <text class="thermometer-desc thermometer-row thermometer-r3" x="526" y="284">Can be checked against a requirement</text>
  <text class="thermometer-desc thermometer-row thermometer-r4" x="526" y="318">This is root mean squared error</text>
  <text class="thermometer-sub" x="30" y="372">The right column is what a decision needs, which is why a report should carry both rather than choosing between them.</text>
</svg>
