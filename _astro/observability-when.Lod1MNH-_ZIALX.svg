<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And where a print statement is fine.">
  <title>Where full observability belongs</title>
  <style>
    .observability-when-bg   { fill: #f8fafc; }
    .observability-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .observability-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .observability-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .observability-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .observability-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .observability-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .observability-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .observability-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .observability-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .observability-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .observability-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .observability-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .observability-when-row { opacity: 1; }
    .observability-when-r0 { animation-delay: 0.00s; }
    .observability-when-r1 { animation-delay: 0.45s; }
    .observability-when-r2 { animation-delay: 0.90s; }
    .observability-when-r3 { animation-delay: 1.35s; }
    .observability-when-r4 { animation-delay: 1.80s; }
    .observability-when-row { animation: observability-when-reveal 7.3s ease-in-out infinite; }
    @keyframes observability-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="observability-when-bg" width="980" height="390"/>
  <text class="observability-when-h1"  x="30" y="40">Where full observability belongs</text>
  <text class="observability-when-sub" x="30" y="64">And where a print statement is fine.</text>
  <rect class="observability-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="observability-when-name" x="46" y="122">Instrument fully</text>
  <text class="observability-when-desc" x="46" y="142">Anything customer-facing.</text>
  <text class="observability-when-desc observability-when-row observability-when-r0" x="46" y="182">Production AI serving systems</text>
  <text class="observability-when-desc observability-when-row observability-when-r1" x="46" y="216">Customer-facing LLM endpoints</text>
  <text class="observability-when-desc observability-when-row observability-when-r2" x="46" y="250">Mission-critical RAG pipelines</text>
  <text class="observability-when-desc observability-when-row observability-when-r3" x="46" y="284">Multi-tenant agent platforms</text>
  <text class="observability-when-desc observability-when-row observability-when-r4" x="46" y="318">Anywhere an SLO has been promised</text>
  <rect class="observability-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="observability-when-name" x="526" y="122">Do not</text>
  <text class="observability-when-desc" x="526" y="142">No users, no SLO.</text>
  <text class="observability-when-desc observability-when-row observability-when-r0" x="526" y="182">Offline batch training jobs</text>
  <text class="observability-when-desc observability-when-row observability-when-r1" x="526" y="216">Exploratory research scripts</text>
  <text class="observability-when-desc observability-when-row observability-when-r2" x="526" y="250">A Prometheus cluster for a notebook</text>
  <text class="observability-when-desc observability-when-row observability-when-r3" x="526" y="284">But record latencies anyway</text>
  <text class="observability-when-desc observability-when-row observability-when-r4" x="526" y="318">You cannot analyse what you did not capture</text>
  <text class="observability-when-sub" x="30" y="372">The last row is the same caveat as Day 360's: the tooling is optional and the recording is not, because a field added later does not backfill the traffic that already happened.</text>
</svg>
