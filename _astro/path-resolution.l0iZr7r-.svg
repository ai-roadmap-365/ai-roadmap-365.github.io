<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" font-family="system-ui, sans-serif">
  <title>How the shell searches each PATH directory in order until it finds a command</title>
  <rect x="0" y="0" width="720" height="520" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">How the shell finds a command in PATH</text>

  <!-- You type a command -->
  <rect x="250" y="54" width="220" height="52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="360" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">You type: python3</text>
  <text x="360" y="98" text-anchor="middle" font-size="14" fill="#1a202c">(no slash, so search PATH)</text>

  <line x1="360" y1="106" x2="360" y2="130" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="360,138 353,124 367,124" fill="#1d4ed8"/>

  <text x="360" y="158" text-anchor="middle" font-size="14" fill="#1a202c">PATH = /usr/local/bin : /usr/bin : /bin</text>

  <!-- Step 1 -->
  <rect x="70" y="180" width="360" height="46" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="90" y="208" font-size="14" fill="#1a202c">1. Is there /usr/local/bin/python3 ?</text>
  <rect x="450" y="180" width="90" height="46" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" rx="8"/>
  <text x="495" y="208" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">No</text>
  <line x1="495" y1="226" x2="495" y2="252" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="495,260 488,246 502,246" fill="#1d4ed8"/>
  <text x="560" y="208" font-size="13" fill="#1a202c">try next dir</text>

  <!-- Step 2 -->
  <rect x="70" y="262" width="360" height="46" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="90" y="290" font-size="14" fill="#1a202c">2. Is there /usr/bin/python3 ?</text>
  <rect x="450" y="262" width="90" height="46" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" rx="8"/>
  <text x="495" y="290" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">No</text>
  <line x1="495" y1="308" x2="495" y2="334" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="495,342 488,328 502,328" fill="#1d4ed8"/>
  <text x="560" y="290" font-size="13" fill="#1a202c">try next dir</text>

  <!-- Step 3 -->
  <rect x="70" y="344" width="360" height="46" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="90" y="372" font-size="14" fill="#1a202c">3. Is there /bin/python3 ?</text>
  <rect x="450" y="344" width="90" height="46" fill="#dcfce7" stroke="#15803d" stroke-width="2" rx="8"/>
  <text x="495" y="372" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">Yes</text>

  <line x1="360" y1="390" x2="360" y2="416" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="360,424 353,410 367,410" fill="#1d4ed8"/>

  <!-- Run -->
  <rect x="210" y="426" width="300" height="46" fill="#dcfce7" stroke="#15803d" stroke-width="2" rx="8"/>
  <text x="360" y="454" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Run the first match: /bin/python3</text>

  <text x="360" y="500" text-anchor="middle" font-size="14" fill="#1a202c">If no directory contains it, the shell reports: command not found</text>
</svg>
