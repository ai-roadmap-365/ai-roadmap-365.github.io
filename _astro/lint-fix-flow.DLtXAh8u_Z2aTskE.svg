<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" font-family="system-ui, sans-serif">
  <title>The life of a lint finding: detect it, classify it by rule code, then route it to a safe automatic fix, an unsafe fix a human approves, a manual rewrite, or an explicit suppression comment naming the code, then re-check until the file is clean — with a separate continuous-integration branch where check mode fails the build instead of fixing anything</title>
  <rect x="0" y="0" width="900" height="760" fill="#f8fafc"/>

  <text x="450" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a202c">The life of a finding</text>
  <text x="450" y="60" text-anchor="middle" font-size="15" fill="#1a202c">Four exits, and only one of them is the tool's decision to make.</text>

  <!-- Detect -->
  <rect x="330" y="84" width="240" height="56" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="450" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">1. DETECT</text>
  <text x="450" y="129" text-anchor="middle" font-size="14" fill="#1a202c">ruff check receipts.py</text>
  <line x1="450" y1="140" x2="450" y2="164" stroke="#1a202c" stroke-width="2"/>
  <polygon points="450,168 444,154 456,154" fill="#1a202c"/>

  <!-- Classify -->
  <rect x="270" y="170" width="360" height="80" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="450" y="194" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">2. CLASSIFY BY RULE CODE</text>
  <text x="450" y="216" text-anchor="middle" font-size="14" fill="#1a202c">F401 unused-import · B006 mutable-argument-default</text>
  <text x="450" y="238" text-anchor="middle" font-size="14" fill="#1a202c">[*] marks a fix Ruff considers safe</text>

  <!-- Fan out -->
  <line x1="450" y1="250" x2="450" y2="272" stroke="#1a202c" stroke-width="2"/>
  <line x1="120" y1="272" x2="780" y2="272" stroke="#1a202c" stroke-width="2"/>
  <line x1="120" y1="272" x2="120" y2="298" stroke="#1a202c" stroke-width="2"/>
  <polygon points="120,302 114,288 126,288" fill="#1a202c"/>
  <line x1="340" y1="272" x2="340" y2="298" stroke="#1a202c" stroke-width="2"/>
  <polygon points="340,302 334,288 346,288" fill="#1a202c"/>
  <line x1="560" y1="272" x2="560" y2="298" stroke="#1a202c" stroke-width="2"/>
  <polygon points="560,302 554,288 566,288" fill="#1a202c"/>
  <line x1="780" y1="272" x2="780" y2="298" stroke="#1a202c" stroke-width="2"/>
  <polygon points="780,302 774,288 786,288" fill="#1a202c"/>

  <!-- Route A: safe autofix -->
  <rect x="20" y="304" width="200" height="150" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="120" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">3a. SAFE AUTOFIX</text>
  <text x="34" y="352" font-size="14" fill="#1a202c">--fix</text>
  <text x="34" y="374" font-size="14" fill="#1a202c">Ruff can prove the</text>
  <text x="34" y="392" font-size="14" fill="#1a202c">rewrite preserves</text>
  <text x="34" y="410" font-size="14" fill="#1a202c">behaviour.</text>
  <text x="34" y="434" font-size="14" font-style="italic" fill="#1a202c">F401, I001</text>

  <!-- Route B: unsafe fix -->
  <rect x="240" y="304" width="200" height="150" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="340" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">3b. UNSAFE FIX</text>
  <text x="254" y="352" font-size="14" fill="#1a202c">--diff, then</text>
  <text x="254" y="370" font-size="14" fill="#1a202c">--fix --unsafe-fixes</text>
  <text x="254" y="392" font-size="14" fill="#1a202c">May change what the</text>
  <text x="254" y="410" font-size="14" fill="#1a202c">program does. A human</text>
  <text x="254" y="428" font-size="14" fill="#1a202c">reads it and says yes.</text>
  <text x="254" y="448" font-size="14" font-style="italic" fill="#1a202c">B006, E711</text>

  <!-- Route C: manual -->
  <rect x="460" y="304" width="200" height="150" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="560" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">3c. MANUAL REWRITE</text>
  <text x="474" y="352" font-size="14" fill="#1a202c">No fix offered, or the</text>
  <text x="474" y="370" font-size="14" fill="#1a202c">offered one is wrong</text>
  <text x="474" y="388" font-size="14" fill="#1a202c">for this code.</text>
  <text x="474" y="412" font-size="14" fill="#1a202c">You edit the file and</text>
  <text x="474" y="430" font-size="14" fill="#1a202c">the test that pinned</text>
  <text x="474" y="448" font-size="14" fill="#1a202c">the old behaviour.</text>

  <!-- Route D: suppression -->
  <rect x="680" y="304" width="200" height="150" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="780" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">3d. SUPPRESS</text>
  <text x="694" y="352" font-size="14" fill="#1a202c"># noqa: F401 — reason</text>
  <text x="694" y="374" font-size="14" fill="#1a202c">Name the code. Give</text>
  <text x="694" y="392" font-size="14" fill="#1a202c">the reason. One line.</text>
  <text x="694" y="416" font-size="14" fill="#1a202c">A bare # noqa hides</text>
  <text x="694" y="434" font-size="14" fill="#1a202c">every rule, including</text>
  <text x="694" y="452" font-size="14" fill="#1a202c">ones not yet written.</text>

  <!-- Converge -->
  <line x1="120" y1="466" x2="120" y2="490" stroke="#1a202c" stroke-width="2"/>
  <line x1="340" y1="466" x2="340" y2="490" stroke="#1a202c" stroke-width="2"/>
  <line x1="560" y1="466" x2="560" y2="490" stroke="#1a202c" stroke-width="2"/>
  <line x1="780" y1="466" x2="780" y2="490" stroke="#1a202c" stroke-width="2"/>
  <line x1="120" y1="490" x2="780" y2="490" stroke="#1a202c" stroke-width="2"/>
  <line x1="450" y1="490" x2="450" y2="514" stroke="#1a202c" stroke-width="2"/>
  <polygon points="450,518 444,504 456,504" fill="#1a202c"/>

  <!-- Re-check -->
  <rect x="290" y="520" width="320" height="76" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="450" y="544" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">4. RE-CHECK, THEN RE-TEST</text>
  <text x="450" y="566" text-anchor="middle" font-size="14" fill="#1a202c">ruff check . &amp;&amp; ruff format . &amp;&amp; pytest -q</text>
  <text x="450" y="586" text-anchor="middle" font-size="14" fill="#1a202c">findings remaining? go back to step 2</text>

  <!-- loop back arrow -->
  <path d="M 290 558 L 246 558 L 246 210 L 270 210" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="274,210 260,204 260,216" fill="#1d4ed8"/>

  <line x1="450" y1="596" x2="450" y2="618" stroke="#1a202c" stroke-width="2"/>
  <polygon points="450,622 444,608 456,608" fill="#1a202c"/>

  <!-- Clean -->
  <rect x="310" y="624" width="280" height="52" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="450" y="656" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">CLEAN — All checks passed!</text>

  <!-- CI branch -->
  <rect x="620" y="600" width="260" height="130" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="750" y="624" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">The CI branch</text>
  <text x="634" y="648" font-size="14" fill="#1a202c">ruff format --check .</text>
  <text x="634" y="668" font-size="14" fill="#1a202c">ruff check --no-fix .</text>
  <text x="634" y="692" font-size="14" fill="#1a202c">Never edits. Exits 1 and</text>
  <text x="634" y="710" font-size="14" fill="#1a202c">fails the build instead.</text>
  <line x1="590" y1="650" x2="616" y2="650" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="620,650 606,644 606,656" fill="#1d4ed8"/>

  <!-- Left note -->
  <rect x="20" y="600" width="260" height="130" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="150" y="624" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">The one rule of the loop</text>
  <text x="34" y="650" font-size="14" fill="#1a202c">Run the test suite before</text>
  <text x="34" y="668" font-size="14" fill="#1a202c">and after every pass.</text>
  <text x="34" y="692" font-size="14" fill="#1a202c">A green suite is your only</text>
  <text x="34" y="710" font-size="14" fill="#1a202c">evidence nothing moved.</text>
</svg>
