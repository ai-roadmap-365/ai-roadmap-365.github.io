<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One is continuous; three are a cycle.">
  <title>The four NIST functions</title>
  <style>
    .nist-functions-bg   { fill: #f8fafc; }
    .nist-functions-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nist-functions-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nist-functions-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nist-functions-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nist-functions-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nist-functions-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nist-functions-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .nist-functions-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .nist-functions-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .nist-functions-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .nist-functions-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .nist-functions-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nist-functions-row { opacity: 1; }
    .nist-functions-r0 { animation-delay: 0.00s; }
    .nist-functions-r1 { animation-delay: 0.45s; }
    .nist-functions-r2 { animation-delay: 0.90s; }
    .nist-functions-r3 { animation-delay: 1.35s; }
    .nist-functions-r4 { animation-delay: 1.80s; }
    .nist-functions-row { animation: nist-functions-reveal 7.3s ease-in-out infinite; }
    @keyframes nist-functions-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="nist-functions-bg" width="980" height="390"/>
  <text class="nist-functions-h1"  x="30" y="40">The four NIST functions</text>
  <text class="nist-functions-sub" x="30" y="64">One is continuous; three are a cycle.</text>
  <rect class="nist-functions-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="nist-functions-name" x="46" y="122">GOVERN</text>
  <text class="nist-functions-desc" x="46" y="142">Continuous, and organisational.</text>
  <text class="nist-functions-desc nist-functions-row nist-functions-r0" x="46" y="182">Policies ratified by leadership</text>
  <text class="nist-functions-desc nist-functions-row nist-functions-r1" x="46" y="216">Roles and accountability defined</text>
  <text class="nist-functions-desc nist-functions-row nist-functions-r2" x="46" y="250">Applies across every system</text>
  <text class="nist-functions-desc nist-functions-row nist-functions-r3" x="46" y="284">Not per-project</text>
  <text class="nist-functions-desc nist-functions-row nist-functions-r4" x="46" y="318">The function the other three run inside</text>
  <rect class="nist-functions-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="nist-functions-name" x="526" y="122">MAP, MEASURE, MANAGE</text>
  <text class="nist-functions-desc" x="526" y="142">A cycle, per system.</text>
  <text class="nist-functions-desc nist-functions-row nist-functions-r0" x="526" y="182">MAP: context, purpose, who is affected</text>
  <text class="nist-functions-desc nist-functions-row nist-functions-r1" x="526" y="216">MEASURE: bias, robustness, performance</text>
  <text class="nist-functions-desc nist-functions-row nist-functions-r2" x="526" y="250">MANAGE: mitigate, monitor, respond</text>
  <text class="nist-functions-desc nist-functions-row nist-functions-r3" x="526" y="284">Repeated as the system changes</text>
  <text class="nist-functions-desc nist-functions-row nist-functions-r4" x="526" y="318">Each produces an artefact</text>
  <text class="nist-functions-sub" x="30" y="372">Treating GOVERN as a project deliverable is the common misreading: it is the standing structure that gives the other three somewhere to report, and without it each cycle produces findings with no owner.</text>
</svg>
