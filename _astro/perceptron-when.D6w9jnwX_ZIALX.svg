<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what to reach for instead.">
  <title>Where a perceptron still fits</title>
  <style>
    .perceptron-when-bg   { fill: #f8fafc; }
    .perceptron-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .perceptron-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .perceptron-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .perceptron-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .perceptron-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .perceptron-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .perceptron-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .perceptron-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .perceptron-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .perceptron-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .perceptron-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .perceptron-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .perceptron-when-row { opacity: 1; }
    .perceptron-when-r0 { animation-delay: 0.00s; }
    .perceptron-when-r1 { animation-delay: 0.45s; }
    .perceptron-when-r2 { animation-delay: 0.90s; }
    .perceptron-when-r3 { animation-delay: 1.35s; }
    .perceptron-when-r4 { animation-delay: 1.80s; }
    .perceptron-when-row { animation: perceptron-when-reveal 7.3s ease-in-out infinite; }
    @keyframes perceptron-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="perceptron-when-bg" width="980" height="390"/>
  <text class="perceptron-when-h1"  x="30" y="40">Where a perceptron still fits</text>
  <text class="perceptron-when-sub" x="30" y="64">And what to reach for instead.</text>
  <rect class="perceptron-when-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="perceptron-when-name" x="46" y="122">Use it</text>
  <text class="perceptron-when-desc" x="46" y="142">Rarely, and deliberately.</text>
  <text class="perceptron-when-desc perceptron-when-row perceptron-when-r0" x="46" y="182">Teaching the mechanics of learning</text>
  <text class="perceptron-when-desc perceptron-when-row perceptron-when-r1" x="46" y="216">Genuinely linearly separable data</text>
  <text class="perceptron-when-desc perceptron-when-row perceptron-when-r2" x="46" y="250">Extremely constrained compute</text>
  <text class="perceptron-when-desc perceptron-when-row perceptron-when-r3" x="46" y="284">Online updates on a stream</text>
  <text class="perceptron-when-desc perceptron-when-row perceptron-when-r4" x="46" y="318">A baseline nobody should beat by much</text>
  <rect class="perceptron-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="perceptron-when-name" x="526" y="122">Use something else</text>
  <text class="perceptron-when-desc" x="526" y="142">Almost always.</text>
  <text class="perceptron-when-desc perceptron-when-row perceptron-when-r0" x="526" y="182">Logistic regression for probabilities</text>
  <text class="perceptron-when-desc perceptron-when-row perceptron-when-r1" x="526" y="216">And a smooth loss surface</text>
  <text class="perceptron-when-desc perceptron-when-row perceptron-when-r2" x="526" y="250">An MLP for anything non-linear</text>
  <text class="perceptron-when-desc perceptron-when-row perceptron-when-r3" x="526" y="284">Which is most real problems</text>
  <text class="perceptron-when-desc perceptron-when-row perceptron-when-r4" x="526" y="318">Same idea, differentiable</text>
  <text class="perceptron-when-sub" x="30" y="372">Logistic regression is the perceptron with the step replaced by a sigmoid, which turns it into something trainable by gradient descent and able to express uncertainty.</text>
</svg>
