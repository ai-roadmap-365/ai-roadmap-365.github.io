<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" role="img" font-family="system-ui, sans-serif">
  <title>A map of the Python standard library grouped by the need it serves: files and paths (pathlib, os.path, shutil, glob), data structures (collections with Counter, defaultdict, namedtuple, and itertools), dates and time (datetime, time, calendar), math and numbers (math, statistics, random, decimal), text and data formats (json, csv, re, string), and system and runtime (os, sys, argparse, subprocess)</title>
  <rect x="0" y="0" width="820" height="540" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">A map of the standard library — grouped by need</text>

  <!-- Banner -->
  <rect x="30" y="52" width="760" height="44" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="410" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">The Python standard library — installed with Python itself, no pip, no network, no version to chase</text>

  <!-- Card 1: Files & paths -->
  <rect x="30" y="120" width="240" height="170" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="150" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Files &amp; paths</text>
  <text x="150" y="168" text-anchor="middle" font-size="14" fill="#1d4ed8">read, write, walk the disk</text>
  <text x="150" y="196" text-anchor="middle" font-size="14" fill="#1a202c">pathlib — object paths</text>
  <text x="150" y="218" text-anchor="middle" font-size="14" fill="#1a202c">os.path — legacy paths</text>
  <text x="150" y="240" text-anchor="middle" font-size="14" fill="#1a202c">shutil — copy, move, trees</text>
  <text x="150" y="262" text-anchor="middle" font-size="14" fill="#1a202c">glob — match by pattern</text>

  <!-- Card 2: Data structures -->
  <rect x="290" y="120" width="240" height="170" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="410" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Data structures</text>
  <text x="410" y="168" text-anchor="middle" font-size="14" fill="#1d4ed8">tally, group, combine</text>
  <text x="410" y="196" text-anchor="middle" font-size="14" fill="#1a202c">collections.Counter</text>
  <text x="410" y="218" text-anchor="middle" font-size="14" fill="#1a202c">collections.defaultdict</text>
  <text x="410" y="240" text-anchor="middle" font-size="14" fill="#1a202c">collections.namedtuple</text>
  <text x="410" y="262" text-anchor="middle" font-size="14" fill="#1a202c">itertools — lazy pipelines</text>

  <!-- Card 3: Dates & time -->
  <rect x="550" y="120" width="240" height="170" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="670" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Dates &amp; time</text>
  <text x="670" y="168" text-anchor="middle" font-size="14" fill="#1d4ed8">stamp and measure time</text>
  <text x="670" y="196" text-anchor="middle" font-size="14" fill="#1a202c">datetime — dates, times</text>
  <text x="670" y="218" text-anchor="middle" font-size="14" fill="#1a202c">time — clocks, sleep</text>
  <text x="670" y="240" text-anchor="middle" font-size="14" fill="#1a202c">calendar — weekdays</text>
  <text x="670" y="262" text-anchor="middle" font-size="14" fill="#1a202c">zoneinfo — time zones</text>

  <!-- Card 4: Math & numbers -->
  <rect x="30" y="310" width="240" height="170" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="150" y="336" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Math &amp; numbers</text>
  <text x="150" y="358" text-anchor="middle" font-size="14" fill="#1d4ed8">compute, sample, summarise</text>
  <text x="150" y="386" text-anchor="middle" font-size="14" fill="#1a202c">math — sqrt, floor, pi</text>
  <text x="150" y="408" text-anchor="middle" font-size="14" fill="#1a202c">statistics — mean, stdev</text>
  <text x="150" y="430" text-anchor="middle" font-size="14" fill="#1a202c">random — sample, shuffle</text>
  <text x="150" y="452" text-anchor="middle" font-size="14" fill="#1a202c">decimal — exact money</text>

  <!-- Card 5: Text & formats -->
  <rect x="290" y="310" width="240" height="170" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="410" y="336" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Text &amp; data formats</text>
  <text x="410" y="358" text-anchor="middle" font-size="14" fill="#1d4ed8">parse and emit structure</text>
  <text x="410" y="386" text-anchor="middle" font-size="14" fill="#1a202c">json — objects and lists</text>
  <text x="410" y="408" text-anchor="middle" font-size="14" fill="#1a202c">csv — tabular rows</text>
  <text x="410" y="430" text-anchor="middle" font-size="14" fill="#1a202c">re — regular expressions</text>
  <text x="410" y="452" text-anchor="middle" font-size="14" fill="#1a202c">string, textwrap</text>

  <!-- Card 6: System & runtime -->
  <rect x="550" y="310" width="240" height="170" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="670" y="336" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">System &amp; runtime</text>
  <text x="670" y="358" text-anchor="middle" font-size="14" fill="#1d4ed8">talk to the OS and shell</text>
  <text x="670" y="386" text-anchor="middle" font-size="14" fill="#1a202c">os — environment, files</text>
  <text x="670" y="408" text-anchor="middle" font-size="14" fill="#1a202c">sys — argv, exit, streams</text>
  <text x="670" y="430" text-anchor="middle" font-size="14" fill="#1a202c">argparse — CLI parsing</text>
  <text x="670" y="452" text-anchor="middle" font-size="14" fill="#1a202c">subprocess — run programs</text>

  <text x="410" y="512" text-anchor="middle" font-size="14" fill="#1a202c">Reach across the row that matches your need first; only leave this map when a third-party package clearly pays.</text>
</svg>
