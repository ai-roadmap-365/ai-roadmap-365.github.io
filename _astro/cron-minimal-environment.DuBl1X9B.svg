<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The single most common reason a working script fails on a schedule.">
  <title>cron does not run in your shell</title>
  <style>
    .cron-minimal-environment-bg   { fill: #f8fafc; }
    .cron-minimal-environment-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cron-minimal-environment-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cron-minimal-environment-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cron-minimal-environment-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cron-minimal-environment-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cron-minimal-environment-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cron-minimal-environment-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cron-minimal-environment-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cron-minimal-environment-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cron-minimal-environment-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cron-minimal-environment-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cron-minimal-environment-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cron-minimal-environment-row { opacity: 1; }
    .cron-minimal-environment-r0 { animation-delay: 0.00s; }
    .cron-minimal-environment-r1 { animation-delay: 0.45s; }
    .cron-minimal-environment-r2 { animation-delay: 0.90s; }
    .cron-minimal-environment-r3 { animation-delay: 1.35s; }
    .cron-minimal-environment-r4 { animation-delay: 1.80s; }
    .cron-minimal-environment-row { animation: cron-minimal-environment-reveal 7.3s ease-in-out infinite; }
    @keyframes cron-minimal-environment-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cron-minimal-environment-bg" width="980" height="390"/>
  <text class="cron-minimal-environment-h1"  x="30" y="40">cron does not run in your shell</text>
  <text class="cron-minimal-environment-sub" x="30" y="64">The single most common reason a working script fails on a schedule.</text>
  <rect class="cron-minimal-environment-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cron-minimal-environment-name" x="46" y="122">Your terminal</text>
  <text class="cron-minimal-environment-desc" x="46" y="142">Everything you configured.</text>
  <text class="cron-minimal-environment-desc cron-minimal-environment-row cron-minimal-environment-r0" x="46" y="182">Full PATH, including Homebrew and virtualenvs</text>
  <text class="cron-minimal-environment-desc cron-minimal-environment-row cron-minimal-environment-r1" x="46" y="216">​.zshrc and .bashrc have been read</text>
  <text class="cron-minimal-environment-desc cron-minimal-environment-row cron-minimal-environment-r2" x="46" y="250">Working directory is wherever you are</text>
  <text class="cron-minimal-environment-desc cron-minimal-environment-row cron-minimal-environment-r3" x="46" y="284">Output appears on your screen</text>
  <text class="cron-minimal-environment-desc cron-minimal-environment-row cron-minimal-environment-r4" x="46" y="318">Your aliases and functions exist</text>
  <rect class="cron-minimal-environment-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cron-minimal-environment-name" x="526" y="122">cron</text>
  <text class="cron-minimal-environment-desc" x="526" y="142">Almost nothing.</text>
  <text class="cron-minimal-environment-desc cron-minimal-environment-row cron-minimal-environment-r0" x="526" y="182">A short PATH — often just /usr/bin:/bin</text>
  <text class="cron-minimal-environment-desc cron-minimal-environment-row cron-minimal-environment-r1" x="526" y="216">No config files are read at all</text>
  <text class="cron-minimal-environment-desc cron-minimal-environment-row cron-minimal-environment-r2" x="526" y="250">Working directory is your home, not the project</text>
  <text class="cron-minimal-environment-desc cron-minimal-environment-row cron-minimal-environment-r3" x="526" y="284">Output is mailed, or lost entirely</text>
  <text class="cron-minimal-environment-desc cron-minimal-environment-row cron-minimal-environment-r4" x="526" y="318">No aliases, no functions, no virtualenv</text>
  <text class="cron-minimal-environment-sub" x="30" y="372">The fix is to assume nothing: absolute paths for every command and file, and set the variables the script needs at the top of the script itself.</text>
</svg>
