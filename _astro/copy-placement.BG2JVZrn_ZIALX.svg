<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The whole lesson, in two orderings.">
  <title>Where the COPY line goes</title>
  <style>
    .copy-placement-bg   { fill: #f8fafc; }
    .copy-placement-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .copy-placement-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .copy-placement-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .copy-placement-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .copy-placement-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .copy-placement-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .copy-placement-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .copy-placement-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .copy-placement-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .copy-placement-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .copy-placement-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .copy-placement-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .copy-placement-row { opacity: 1; }
    .copy-placement-r0 { animation-delay: 0.00s; }
    .copy-placement-r1 { animation-delay: 0.45s; }
    .copy-placement-r2 { animation-delay: 0.90s; }
    .copy-placement-r3 { animation-delay: 1.35s; }
    .copy-placement-r4 { animation-delay: 1.80s; }
    .copy-placement-row { animation: copy-placement-reveal 7.3s ease-in-out infinite; }
    @keyframes copy-placement-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="copy-placement-bg" width="980" height="390"/>
  <text class="copy-placement-h1"  x="30" y="40">Where the COPY line goes</text>
  <text class="copy-placement-sub" x="30" y="64">The whole lesson, in two orderings.</text>
  <rect class="copy-placement-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="copy-placement-name" x="46" y="122">COPY . . then install</text>
  <text class="copy-placement-desc" x="46" y="142">76 seconds per edit.</text>
  <text class="copy-placement-desc copy-placement-row copy-placement-r0" x="46" y="182">The install sits below the copy</text>
  <text class="copy-placement-desc copy-placement-row copy-placement-r1" x="46" y="216">Editing one line invalidates the install</text>
  <text class="copy-placement-desc copy-placement-row copy-placement-r2" x="46" y="250">Editing the README costs the same</text>
  <text class="copy-placement-desc copy-placement-row copy-placement-r3" x="46" y="284">2 of 6 layers cached</text>
  <text class="copy-placement-desc copy-placement-row copy-placement-r4" x="46" y="318">Cold build: 76.0s</text>
  <rect class="copy-placement-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="copy-placement-name" x="526" y="122">Manifest, install, then source</text>
  <text class="copy-placement-desc" x="526" y="142">1 second per edit.</text>
  <text class="copy-placement-desc copy-placement-row copy-placement-r0" x="526" y="182">The install sits above the copy</text>
  <text class="copy-placement-desc copy-placement-row copy-placement-r1" x="526" y="216">The install layer depends on the manifest alone</text>
  <text class="copy-placement-desc copy-placement-row copy-placement-r2" x="526" y="250">It survives every source edit</text>
  <text class="copy-placement-desc copy-placement-row copy-placement-r3" x="526" y="284">4 of 8 layers cached</text>
  <text class="copy-placement-desc copy-placement-row copy-placement-r4" x="526" y="318">Cold build: 77.0s</text>
  <text class="copy-placement-sub" x="30" y="372">The cold builds are 76.0s and 77.0s, which is what makes this an easy decision: correct ordering costs nothing on a first build and returns the whole install on every build after it.</text>
</svg>
