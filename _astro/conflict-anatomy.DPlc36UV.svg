<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three lines divide the file into two candidate versions.">
  <title>Reading conflict markers</title>
  <style>
    .conflict-anatomy-bg   { fill: #f8fafc; }
    .conflict-anatomy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conflict-anatomy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conflict-anatomy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conflict-anatomy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conflict-anatomy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conflict-anatomy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .conflict-anatomy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .conflict-anatomy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .conflict-anatomy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .conflict-anatomy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .conflict-anatomy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .conflict-anatomy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .conflict-anatomy-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .conflict-anatomy-stage { opacity: 1; }

    .conflict-anatomy-s0 { animation-delay: 0.00s; }
    .conflict-anatomy-e0 { animation-delay: 0.00s; }
    .conflict-anatomy-s1 { animation-delay: 1.28s; }
    .conflict-anatomy-e1 { animation-delay: 1.28s; }
    .conflict-anatomy-s2 { animation-delay: 2.56s; }
    .conflict-anatomy-e2 { animation-delay: 2.56s; }
    .conflict-anatomy-s3 { animation-delay: 3.84s; }
    .conflict-anatomy-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .conflict-anatomy-conn  { animation: conflict-anatomy-trace 6.4s ease-in-out infinite; }
      .conflict-anatomy-stage { animation: conflict-anatomy-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes conflict-anatomy-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes conflict-anatomy-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .conflict-anatomy-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .conflict-anatomy-stage { animation: conflict-anatomy-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes conflict-anatomy-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="conflict-anatomy-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="conflict-anatomy-bg" width="980" height="322"/>
  <text class="conflict-anatomy-h1"  x="30" y="40">Reading conflict markers</text>
  <text class="conflict-anatomy-sub" x="30" y="64">Three lines divide the file into two candidate versions.</text>
  <g class="conflict-anatomy-stage conflict-anatomy-s0">
    <rect class="conflict-anatomy-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="conflict-anatomy-step" x="44" y="142">01</text>
    <text class="conflict-anatomy-name" x="70" y="142">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text>
    <text class="conflict-anatomy-desc" x="44" y="166">Everything below this is YOUR</text>
    <text class="conflict-anatomy-desc" x="44" y="182">current branch's version.</text>
    <text class="conflict-anatomy-edge" x="44" y="242">ours</text>
  </g>
  <line class="conflict-anatomy-line conflict-anatomy-conn conflict-anatomy-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#conflict-anatomy-tip)"/>
  <g class="conflict-anatomy-stage conflict-anatomy-s1">
    <rect class="conflict-anatomy-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="conflict-anatomy-step" x="280" y="142">02</text>
    <text class="conflict-anatomy-name" x="306" y="142">=======</text>
    <text class="conflict-anatomy-desc" x="280" y="166">The divider. Nothing to keep</text>
    <text class="conflict-anatomy-desc" x="280" y="182">here.</text>
    <text class="conflict-anatomy-edge" x="280" y="242">divider</text>
  </g>
  <line class="conflict-anatomy-line conflict-anatomy-conn conflict-anatomy-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#conflict-anatomy-tip)"/>
  <g class="conflict-anatomy-stage conflict-anatomy-s2">
    <rect class="conflict-anatomy-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="conflict-anatomy-step" x="516" y="142">03</text>
    <text class="conflict-anatomy-name" x="542" y="142">&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature</text>
    <text class="conflict-anatomy-desc" x="516" y="166">Everything above this, below the</text>
    <text class="conflict-anatomy-desc" x="516" y="182">divider, is the INCOMING</text>
    <text class="conflict-anatomy-desc" x="516" y="198">version.</text>
    <text class="conflict-anatomy-edge" x="516" y="242">theirs</text>
  </g>
  <line class="conflict-anatomy-line conflict-anatomy-conn conflict-anatomy-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#conflict-anatomy-tip)"/>
  <g class="conflict-anatomy-stage conflict-anatomy-s3">
    <rect class="conflict-anatomy-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="conflict-anatomy-step" x="752" y="142">04</text>
    <text class="conflict-anatomy-name" x="778" y="142">Delete all three lines</text>
    <text class="conflict-anatomy-desc" x="752" y="166">It is resolved only when no</text>
    <text class="conflict-anatomy-desc" x="752" y="182">markers remain. Then git add,</text>
    <text class="conflict-anatomy-desc" x="752" y="198">then git commit.</text>
    <text class="conflict-anatomy-edge" x="752" y="242">resolved</text>
  </g>
  <text class="conflict-anatomy-sub" x="30" y="304">Search for &lt;&lt;&lt;&lt;&lt;&lt;&lt; before staging, every time. A committed marker line is a syntax error in most languages and an embarrassment in all of them.</text>
</svg>
