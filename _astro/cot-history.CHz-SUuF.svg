<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each surprisingly simple.">
  <title>Four steps to reasoning prompts</title>
  <style>
    .cot-history-bg   { fill: #f8fafc; }
    .cot-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cot-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cot-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cot-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cot-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cot-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cot-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cot-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cot-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cot-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cot-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cot-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cot-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cot-history-stage { opacity: 1; }

    .cot-history-s0 { animation-delay: 0.00s; }
    .cot-history-e0 { animation-delay: 0.00s; }
    .cot-history-s1 { animation-delay: 1.28s; }
    .cot-history-e1 { animation-delay: 1.28s; }
    .cot-history-s2 { animation-delay: 2.56s; }
    .cot-history-e2 { animation-delay: 2.56s; }
    .cot-history-s3 { animation-delay: 3.84s; }
    .cot-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cot-history-conn  { animation: cot-history-trace 6.4s ease-in-out infinite; }
      .cot-history-stage { animation: cot-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cot-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cot-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cot-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cot-history-stage { animation: cot-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cot-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cot-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cot-history-bg" width="980" height="322"/>
  <text class="cot-history-h1"  x="30" y="40">Four steps to reasoning prompts</text>
  <text class="cot-history-sub" x="30" y="64">Each surprisingly simple.</text>
  <g class="cot-history-stage cot-history-s0">
    <rect class="cot-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cot-history-step" x="44" y="142">01</text>
    <text class="cot-history-name" x="70" y="142">Examples in the prompt</text>
    <text class="cot-history-desc" x="44" y="166">Which turned out to teach tasks</text>
    <text class="cot-history-desc" x="44" y="182">without training.</text>
  </g>
  <line class="cot-history-line cot-history-conn cot-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cot-history-tip)"/>
  <g class="cot-history-stage cot-history-s1">
    <rect class="cot-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cot-history-step" x="280" y="142">02</text>
    <text class="cot-history-name" x="306" y="142">Examples that showed the reasoning</text>
    <text class="cot-history-desc" x="280" y="166">Which raised accuracy sharply on</text>
    <text class="cot-history-desc" x="280" y="182">multi-step problems.</text>
  </g>
  <line class="cot-history-line cot-history-conn cot-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cot-history-tip)"/>
  <g class="cot-history-stage cot-history-s2">
    <rect class="cot-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cot-history-step" x="516" y="142">03</text>
    <text class="cot-history-name" x="542" y="142">Then a single instruction to think step by step</text>
    <text class="cot-history-desc" x="516" y="166">Which achieved much of the same</text>
    <text class="cot-history-desc" x="516" y="182">with no examples at all.</text>
  </g>
  <line class="cot-history-line cot-history-conn cot-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cot-history-tip)"/>
  <g class="cot-history-stage cot-history-s3">
    <rect class="cot-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cot-history-step" x="752" y="142">04</text>
    <text class="cot-history-name" x="778" y="142">And now models trained to reason before answering</text>
    <text class="cot-history-desc" x="752" y="166">Where the technique has moved</text>
    <text class="cot-history-desc" x="752" y="182">inside the model.</text>
  </g>
  <text class="cot-history-sub" x="30" y="304">That a short instruction recovered most of the benefit of carefully written exemplars is one of the odder findings in this area, and it made the technique universally applicable.</text>
</svg>
