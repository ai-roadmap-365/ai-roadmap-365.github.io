<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Catalogue number, ledger, repairs bin.">
  <title>Two librarians, one crate</title>
  <style>
    .librarian-bg   { fill: #f8fafc; }
    .librarian-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .librarian-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .librarian-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .librarian-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .librarian-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .librarian-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .librarian-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .librarian-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .librarian-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .librarian-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .librarian-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .librarian-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .librarian-row { opacity: 1; }
    .librarian-r0 { animation-delay: 0.00s; }
    .librarian-r1 { animation-delay: 0.45s; }
    .librarian-r2 { animation-delay: 0.90s; }
    .librarian-r3 { animation-delay: 1.35s; }
    .librarian-r4 { animation-delay: 1.80s; }
    .librarian-row { animation: librarian-reveal 7.3s ease-in-out infinite; }
    @keyframes librarian-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="librarian-bg" width="980" height="390"/>
  <text class="librarian-h1"  x="30" y="40">Two librarians, one crate</text>
  <text class="librarian-sub" x="30" y="64">Catalogue number, ledger, repairs bin.</text>
  <rect class="librarian-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="librarian-name" x="46" y="122">From memory</text>
  <text class="librarian-desc" x="46" y="142">Interrupted, and lost.</text>
  <text class="librarian-desc librarian-row librarian-r0" x="46" y="182">Position kept in the librarian's head</text>
  <text class="librarian-desc librarian-row librarian-r1" x="46" y="216">An interruption means starting the crate again</text>
  <text class="librarian-desc librarian-row librarian-r2" x="46" y="250">Already-shelved books get a second copy</text>
  <text class="librarian-desc librarian-row librarian-r3" x="46" y="284">A broken spine stops the whole crate</text>
  <text class="librarian-desc librarian-row librarian-r4" x="46" y="318">The aisle stays blocked all day</text>
  <rect class="librarian-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="librarian-name" x="526" y="122">With a system</text>
  <text class="librarian-desc" x="526" y="142">Three artefacts.</text>
  <text class="librarian-desc librarian-row librarian-r0" x="526" y="182">A catalogue number derived from the book</text>
  <text class="librarian-desc librarian-row librarian-r1" x="526" y="216">Re-shelving returns it to its own slot</text>
  <text class="librarian-desc librarian-row librarian-r2" x="526" y="250">A ledger of the last crate completed</text>
  <text class="librarian-desc librarian-row librarian-r3" x="526" y="284">The broken book goes to the repairs bin</text>
  <text class="librarian-desc librarian-row librarian-r4" x="526" y="318">The rest of the crate proceeds</text>
  <text class="librarian-sub" x="30" y="372">The second librarian is not more talented — they have a catalogue number, a ledger and a repairs bin, which are stable ids, a checkpoint and a dead-letter queue.</text>
</svg>
