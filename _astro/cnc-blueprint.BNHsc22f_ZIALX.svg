<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The machine executes either one precisely.">
  <title>A napkin sketch, or a CAD file</title>
  <style>
    .cnc-blueprint-bg   { fill: #f8fafc; }
    .cnc-blueprint-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cnc-blueprint-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cnc-blueprint-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cnc-blueprint-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cnc-blueprint-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cnc-blueprint-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cnc-blueprint-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cnc-blueprint-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cnc-blueprint-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cnc-blueprint-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cnc-blueprint-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cnc-blueprint-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cnc-blueprint-row { opacity: 1; }
    .cnc-blueprint-r0 { animation-delay: 0.00s; }
    .cnc-blueprint-r1 { animation-delay: 0.45s; }
    .cnc-blueprint-r2 { animation-delay: 0.90s; }
    .cnc-blueprint-r3 { animation-delay: 1.35s; }
    .cnc-blueprint-r4 { animation-delay: 1.80s; }
    .cnc-blueprint-row { animation: cnc-blueprint-reveal 7.3s ease-in-out infinite; }
    @keyframes cnc-blueprint-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cnc-blueprint-bg" width="980" height="390"/>
  <text class="cnc-blueprint-h1"  x="30" y="40">A napkin sketch, or a CAD file</text>
  <text class="cnc-blueprint-sub" x="30" y="64">The machine executes either one precisely.</text>
  <rect class="cnc-blueprint-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cnc-blueprint-name" x="46" y="122">The napkin sketch</text>
  <text class="cnc-blueprint-desc" x="46" y="142">Interpreted, then cut.</text>
  <text class="cnc-blueprint-desc cnc-blueprint-row cnc-blueprint-r0" x="46" y="182">Approximate dimensions</text>
  <text class="cnc-blueprint-desc cnc-blueprint-row cnc-blueprint-r1" x="46" y="216">No tolerances stated</text>
  <text class="cnc-blueprint-desc cnc-blueprint-row cnc-blueprint-r2" x="46" y="250">No tool speed or feed rate</text>
  <text class="cnc-blueprint-desc cnc-blueprint-row cnc-blueprint-r3" x="46" y="284">The machine cuts exactly what it read</text>
  <text class="cnc-blueprint-desc cnc-blueprint-row cnc-blueprint-r4" x="46" y="318">An expensive billet, ruined</text>
  <rect class="cnc-blueprint-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cnc-blueprint-name" x="526" y="122">The CAD file</text>
  <text class="cnc-blueprint-desc" x="526" y="142">Nothing left to interpret.</text>
  <text class="cnc-blueprint-desc cnc-blueprint-row cnc-blueprint-r0" x="526" y="182">Millimetre tolerances</text>
  <text class="cnc-blueprint-desc cnc-blueprint-row cnc-blueprint-r1" x="526" y="216">Tool speeds and cooling rates</text>
  <text class="cnc-blueprint-desc cnc-blueprint-row cnc-blueprint-r2" x="526" y="250">Every constraint stated</text>
  <text class="cnc-blueprint-desc cnc-blueprint-row cnc-blueprint-r3" x="526" y="284">The machine cuts exactly what it read</text>
  <text class="cnc-blueprint-desc cnc-blueprint-row cnc-blueprint-r4" x="526" y="318">A flawless part in seconds</text>
  <text class="cnc-blueprint-sub" x="30" y="372">The machine behaves identically in both columns, which is the useful part of the analogy: precision is a property of the instruction, and speed only makes an imprecise instruction expensive faster.</text>
</svg>
