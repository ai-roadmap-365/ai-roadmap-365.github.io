<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Databases, clouds, then models.">
  <title>Three eras of vendor abstraction</title>
  <style>
    .abstraction-lineage-bg   { fill: #f8fafc; }
    .abstraction-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .abstraction-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .abstraction-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .abstraction-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .abstraction-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .abstraction-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .abstraction-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .abstraction-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .abstraction-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .abstraction-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .abstraction-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .abstraction-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .abstraction-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .abstraction-lineage-stage { opacity: 1; }

    .abstraction-lineage-s0 { animation-delay: 0.00s; }
    .abstraction-lineage-e0 { animation-delay: 0.00s; }
    .abstraction-lineage-s1 { animation-delay: 1.50s; }
    .abstraction-lineage-e1 { animation-delay: 1.50s; }
    .abstraction-lineage-s2 { animation-delay: 3.00s; }
    .abstraction-lineage-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .abstraction-lineage-conn  { animation: abstraction-lineage-trace 6s ease-in-out infinite; }
      .abstraction-lineage-stage { animation: abstraction-lineage-arrive 6s ease-in-out infinite; }
    }
    @keyframes abstraction-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes abstraction-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .abstraction-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .abstraction-lineage-stage { animation: abstraction-lineage-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes abstraction-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="abstraction-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="abstraction-lineage-bg" width="980" height="322"/>
  <text class="abstraction-lineage-h1"  x="30" y="40">Three eras of vendor abstraction</text>
  <text class="abstraction-lineage-sub" x="30" y="64">Databases, clouds, then models.</text>
  <g class="abstraction-lineage-stage abstraction-lineage-s0">
    <rect class="abstraction-lineage-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="abstraction-lineage-step" x="44" y="142">01</text>
    <text class="abstraction-lineage-name" x="70" y="142">Database drivers, 2000-2015</text>
    <text class="abstraction-lineage-desc" x="44" y="166">JDBC and ODBC. Switch database without</text>
    <text class="abstraction-lineage-desc" x="44" y="182">rewriting business logic.</text>
  </g>
  <line class="abstraction-lineage-line abstraction-lineage-conn abstraction-lineage-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#abstraction-lineage-tip)"/>
  <g class="abstraction-lineage-stage abstraction-lineage-s1">
    <rect class="abstraction-lineage-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="abstraction-lineage-step" x="359" y="142">02</text>
    <text class="abstraction-lineage-name" x="385" y="142">Multi-cloud, 2015-2022</text>
    <text class="abstraction-lineage-desc" x="359" y="166">Terraform and Kubernetes decoupling</text>
    <text class="abstraction-lineage-desc" x="359" y="182">deployment from provider.</text>
  </g>
  <line class="abstraction-lineage-line abstraction-lineage-conn abstraction-lineage-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#abstraction-lineage-tip)"/>
  <g class="abstraction-lineage-stage abstraction-lineage-s2">
    <rect class="abstraction-lineage-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="abstraction-lineage-step" x="674" y="142">03</text>
    <text class="abstraction-lineage-name" x="700" y="142">LLM gateways, 2023</text>
    <text class="abstraction-lineage-desc" x="674" y="166">Standardised invocation across a hundred</text>
    <text class="abstraction-lineage-desc" x="674" y="182">providers, with routing and failover.</text>
  </g>
  <text class="abstraction-lineage-sub" x="30" y="304">Each era abstracted whatever had become both essential and volatile, and models are currently the most volatile dependency most AI products have.</text>
</svg>
