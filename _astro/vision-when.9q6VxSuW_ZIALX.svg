<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when something else is better.">
  <title>When to use vision input</title>
  <style>
    .vision-when-bg   { fill: #f8fafc; }
    .vision-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vision-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vision-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vision-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vision-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vision-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vision-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .vision-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .vision-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .vision-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .vision-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .vision-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vision-when-row { opacity: 1; }
    .vision-when-r0 { animation-delay: 0.00s; }
    .vision-when-r1 { animation-delay: 0.45s; }
    .vision-when-r2 { animation-delay: 0.90s; }
    .vision-when-r3 { animation-delay: 1.35s; }
    .vision-when-r4 { animation-delay: 1.80s; }
    .vision-when-row { animation: vision-when-reveal 7.3s ease-in-out infinite; }
    @keyframes vision-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="vision-when-bg" width="980" height="390"/>
  <text class="vision-when-h1"  x="30" y="40">When to use vision input</text>
  <text class="vision-when-sub" x="30" y="64">And when something else is better.</text>
  <rect class="vision-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="vision-when-name" x="46" y="122">Use vision</text>
  <text class="vision-when-desc" x="46" y="142">Four cases.</text>
  <text class="vision-when-desc vision-when-row vision-when-r0" x="46" y="182">Scanned or photographed documents</text>
  <text class="vision-when-desc vision-when-row vision-when-r1" x="46" y="216">Charts, diagrams and screenshots</text>
  <text class="vision-when-desc vision-when-row vision-when-r2" x="46" y="250">Varied or unpredictable layouts</text>
  <text class="vision-when-desc vision-when-row vision-when-r3" x="46" y="284">Handwriting</text>
  <text class="vision-when-desc vision-when-row vision-when-r4" x="46" y="318">Where structure matters as much as text</text>
  <rect class="vision-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="vision-when-name" x="526" y="122">Use something else</text>
  <text class="vision-when-desc" x="526" y="142">Also four.</text>
  <text class="vision-when-desc vision-when-row vision-when-r0" x="526" y="182">Digital documents with extractable text</text>
  <text class="vision-when-desc vision-when-row vision-when-r1" x="526" y="216">Fixed forms at very high volume</text>
  <text class="vision-when-desc vision-when-row vision-when-r2" x="526" y="250">Where character-level exactness is required</text>
  <text class="vision-when-desc vision-when-row vision-when-r3" x="526" y="284">Real-time video at scale</text>
  <text class="vision-when-desc vision-when-row vision-when-r4" x="526" y="318">Where a parser is cheaper and exact</text>
  <text class="vision-when-sub" x="30" y="372">Extracting text from a digital document rather than rendering it to an image is the most commonly missed saving, and the text version is exact where the image version is inferred.</text>
</svg>
