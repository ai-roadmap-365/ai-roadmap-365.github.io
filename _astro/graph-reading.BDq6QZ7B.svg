<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Everything useful follows from that.">
  <title>Read the workflow as a graph</title>
  <style>
    .graph-reading-bg   { fill: #f8fafc; }
    .graph-reading-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .graph-reading-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .graph-reading-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .graph-reading-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .graph-reading-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .graph-reading-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .graph-reading-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .graph-reading-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .graph-reading-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .graph-reading-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .graph-reading-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .graph-reading-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .graph-reading-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .graph-reading-stage { opacity: 1; }

    .graph-reading-s0 { animation-delay: 0.00s; }
    .graph-reading-e0 { animation-delay: 0.00s; }
    .graph-reading-s1 { animation-delay: 1.28s; }
    .graph-reading-e1 { animation-delay: 1.28s; }
    .graph-reading-s2 { animation-delay: 2.56s; }
    .graph-reading-e2 { animation-delay: 2.56s; }
    .graph-reading-s3 { animation-delay: 3.84s; }
    .graph-reading-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .graph-reading-conn  { animation: graph-reading-trace 6.4s ease-in-out infinite; }
      .graph-reading-stage { animation: graph-reading-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes graph-reading-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes graph-reading-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .graph-reading-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .graph-reading-stage { animation: graph-reading-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes graph-reading-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="graph-reading-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="graph-reading-bg" width="980" height="322"/>
  <text class="graph-reading-h1"  x="30" y="40">Read the workflow as a graph</text>
  <text class="graph-reading-sub" x="30" y="64">Everything useful follows from that.</text>
  <g class="graph-reading-stage graph-reading-s0">
    <rect class="graph-reading-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="graph-reading-step" x="44" y="142">01</text>
    <text class="graph-reading-name" x="70" y="142">A job starts when its needs finish</text>
    <text class="graph-reading-desc" x="44" y="166">Finish time is the latest</text>
    <text class="graph-reading-desc" x="44" y="182">dependency plus its own</text>
    <text class="graph-reading-desc" x="44" y="198">duration.</text>
  </g>
  <line class="graph-reading-line graph-reading-conn graph-reading-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#graph-reading-tip)"/>
  <g class="graph-reading-stage graph-reading-s1">
    <rect class="graph-reading-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="graph-reading-step" x="280" y="142">02</text>
    <text class="graph-reading-name" x="306" y="142">Wall clock is the critical path</text>
    <text class="graph-reading-desc" x="280" y="166">checkout, install, integration,</text>
    <text class="graph-reading-desc" x="280" y="182">deploy: 12.7 minutes.</text>
    <text class="graph-reading-edge" x="280" y="242">waiting</text>
  </g>
  <line class="graph-reading-line graph-reading-conn graph-reading-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#graph-reading-tip)"/>
  <g class="graph-reading-stage graph-reading-s2">
    <rect class="graph-reading-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="graph-reading-step" x="516" y="142">03</text>
    <text class="graph-reading-name" x="542" y="142">Runner minutes are the sum</text>
    <text class="graph-reading-desc" x="516" y="166">22.2 minutes. The 9.5-minute gap</text>
    <text class="graph-reading-desc" x="516" y="182">is parallel work.</text>
    <text class="graph-reading-edge" x="516" y="242">billing</text>
  </g>
  <line class="graph-reading-line graph-reading-conn graph-reading-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#graph-reading-tip)"/>
  <g class="graph-reading-stage graph-reading-s3">
    <rect class="graph-reading-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="graph-reading-step" x="752" y="142">04</text>
    <text class="graph-reading-name" x="778" y="142">Different fixes for each</text>
    <text class="graph-reading-desc" x="752" y="166">Shorten the path to go faster;</text>
    <text class="graph-reading-desc" x="752" y="182">remove work anywhere to go</text>
    <text class="graph-reading-desc" x="752" y="198">cheaper.</text>
  </g>
  <text class="graph-reading-sub" x="30" y="304">Confusing the two is why a satisfying afternoon of pipeline cleanup leaves the pipeline feeling exactly as slow as it was: the deleted jobs were never on the path anyone was waiting for.</text>
</svg>
