<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Rather than how to find it.">
  <title>Asking for what you want</title>
  <style>
    .library-request-bg   { fill: #f8fafc; }
    .library-request-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-request-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-request-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-request-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-request-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-request-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .library-request-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .library-request-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .library-request-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .library-request-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .library-request-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .library-request-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .library-request-row { opacity: 1; }
    .library-request-r0 { animation-delay: 0.00s; }
    .library-request-r1 { animation-delay: 0.45s; }
    .library-request-r2 { animation-delay: 0.90s; }
    .library-request-r3 { animation-delay: 1.35s; }
    .library-request-r4 { animation-delay: 1.80s; }
    .library-request-row { animation: library-request-reveal 7.3s ease-in-out infinite; }
    @keyframes library-request-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="library-request-bg" width="980" height="390"/>
  <text class="library-request-h1"  x="30" y="40">Asking for what you want</text>
  <text class="library-request-sub" x="30" y="64">Rather than how to find it.</text>
  <rect class="library-request-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="library-request-name" x="46" y="122">Describe the result</text>
  <text class="library-request-desc" x="46" y="142">The expert chooses how.</text>
  <text class="library-request-desc library-request-row library-request-r0" x="46" y="182">'Everything on this topic since last year'</text>
  <text class="library-request-desc library-request-row library-request-r1" x="46" y="216">The method is chosen for you</text>
  <text class="library-request-desc library-request-row library-request-r2" x="46" y="250">It improves as the catalogue improves</text>
  <text class="library-request-desc library-request-row library-request-r3" x="46" y="284">You need not know the shelving</text>
  <text class="library-request-desc library-request-row library-request-r4" x="46" y="318">This is a declarative query</text>
  <rect class="library-request-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="library-request-name" x="526" y="122">Describe the search</text>
  <text class="library-request-desc" x="526" y="142">You choose how.</text>
  <text class="library-request-desc library-request-row library-request-r0" x="526" y="182">'Start at shelf four, walk left'</text>
  <text class="library-request-desc library-request-row library-request-r1" x="526" y="216">The method is fixed by you</text>
  <text class="library-request-desc library-request-row library-request-r2" x="526" y="250">It breaks when shelving changes</text>
  <text class="library-request-desc library-request-row library-request-r3" x="526" y="284">You must know the layout</text>
  <text class="library-request-desc library-request-row library-request-r4" x="526" y="318">This is a hand-written loop</text>
  <text class="library-request-sub" x="30" y="372">Improving as the catalogue improves is the real payoff, and it is why declarative queries have outlasted every access method underneath them.</text>
</svg>
