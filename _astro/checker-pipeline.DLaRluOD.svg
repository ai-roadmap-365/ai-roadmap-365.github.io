<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Facts about the project, then the README against them.">
  <title>How the checker works</title>
  <style>
    .checker-pipeline-bg   { fill: #f8fafc; }
    .checker-pipeline-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .checker-pipeline-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .checker-pipeline-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .checker-pipeline-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .checker-pipeline-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .checker-pipeline-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .checker-pipeline-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .checker-pipeline-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .checker-pipeline-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .checker-pipeline-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .checker-pipeline-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .checker-pipeline-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .checker-pipeline-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .checker-pipeline-stage { opacity: 1; }

    .checker-pipeline-s0 { animation-delay: 0.00s; }
    .checker-pipeline-e0 { animation-delay: 0.00s; }
    .checker-pipeline-s1 { animation-delay: 1.33s; }
    .checker-pipeline-e1 { animation-delay: 1.33s; }
    .checker-pipeline-s2 { animation-delay: 2.67s; }
    .checker-pipeline-e2 { animation-delay: 2.67s; }
    .checker-pipeline-s3 { animation-delay: 4.00s; }
    .checker-pipeline-e3 { animation-delay: 4.00s; }
    .checker-pipeline-s4 { animation-delay: 5.33s; }
    .checker-pipeline-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .checker-pipeline-conn  { animation: checker-pipeline-trace 8s ease-in-out infinite; }
      .checker-pipeline-stage { animation: checker-pipeline-arrive 8s ease-in-out infinite; }
    }
    @keyframes checker-pipeline-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes checker-pipeline-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .checker-pipeline-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .checker-pipeline-stage { animation: checker-pipeline-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes checker-pipeline-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="checker-pipeline-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="checker-pipeline-bg" width="980" height="322"/>
  <text class="checker-pipeline-h1"  x="30" y="40">How the checker works</text>
  <text class="checker-pipeline-sub" x="30" y="64">Facts about the project, then the README against them.</text>
  <g class="checker-pipeline-stage checker-pipeline-s0">
    <rect class="checker-pipeline-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="checker-pipeline-step" x="44" y="142">01</text>
    <text class="checker-pipeline-name" x="70" y="142">Collect the facts</text>
    <text class="checker-pipeline-desc" x="44" y="166">Commands provided,</text>
    <text class="checker-pipeline-desc" x="44" y="182">outputs actually</text>
    <text class="checker-pipeline-desc" x="44" y="198">captured, limitations</text>
  </g>
  <line class="checker-pipeline-line checker-pipeline-conn checker-pipeline-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#checker-pipeline-tip)"/>
  <g class="checker-pipeline-stage checker-pipeline-s1">
    <rect class="checker-pipeline-warn" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="checker-pipeline-step" x="233" y="142">02</text>
    <text class="checker-pipeline-name" x="259" y="142">Extract commands from tagged blocks</text>
    <text class="checker-pipeline-desc" x="233" y="166">Only shell-tagged blocks</text>
    <text class="checker-pipeline-desc" x="233" y="182">are instructions. An</text>
    <text class="checker-pipeline-desc" x="233" y="198">untagged block is output.</text>
    <text class="checker-pipeline-edge" x="233" y="242">the bug</text>
  </g>
  <line class="checker-pipeline-line checker-pipeline-conn checker-pipeline-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#checker-pipeline-tip)"/>
  <g class="checker-pipeline-stage checker-pipeline-s2">
    <rect class="checker-pipeline-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="checker-pipeline-step" x="422" y="142">03</text>
    <text class="checker-pipeline-name" x="448" y="142">Match outputs by convention</text>
    <text class="checker-pipeline-desc" x="422" y="166">A line ending in an arrow</text>
    <text class="checker-pipeline-desc" x="422" y="182">names the command; the</text>
    <text class="checker-pipeline-desc" x="422" y="198">block after it is its</text>
  </g>
  <line class="checker-pipeline-line checker-pipeline-conn checker-pipeline-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#checker-pipeline-tip)"/>
  <g class="checker-pipeline-stage checker-pipeline-s3">
    <rect class="checker-pipeline-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="checker-pipeline-step" x="611" y="142">04</text>
    <text class="checker-pipeline-name" x="637" y="142">Run the five checks</text>
    <text class="checker-pipeline-desc" x="611" y="166">Sections, commands,</text>
    <text class="checker-pipeline-desc" x="611" y="182">outputs, placeholders,</text>
    <text class="checker-pipeline-desc" x="611" y="198">limitations.</text>
  </g>
  <line class="checker-pipeline-line checker-pipeline-conn checker-pipeline-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#checker-pipeline-tip)"/>
  <g class="checker-pipeline-stage checker-pipeline-s4">
    <rect class="checker-pipeline-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="checker-pipeline-step" x="800" y="142">05</text>
    <text class="checker-pipeline-name" x="826" y="142">Fail on wrong, warn on incomplete</text>
    <text class="checker-pipeline-desc" x="800" y="166">A wrongly documented</text>
    <text class="checker-pipeline-desc" x="800" y="182">command misleads. An</text>
    <text class="checker-pipeline-desc" x="800" y="198">undocumented one is a</text>
    <text class="checker-pipeline-edge" x="800" y="242">the distinction</text>
  </g>
  <text class="checker-pipeline-sub" x="30" y="304">The second step was a real defect in this lab before the tests caught it: without the tag rule, the checker read the document's own captured output back as commands and reported them as unknown.</text>
</svg>
