<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three quantities, one formula.">
  <title>The Laplace mechanism</title>
  <style>
    .laplace-mechanism-bg   { fill: #f8fafc; }
    .laplace-mechanism-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .laplace-mechanism-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .laplace-mechanism-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .laplace-mechanism-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .laplace-mechanism-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .laplace-mechanism-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .laplace-mechanism-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .laplace-mechanism-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .laplace-mechanism-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .laplace-mechanism-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .laplace-mechanism-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .laplace-mechanism-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .laplace-mechanism-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .laplace-mechanism-stage { opacity: 1; }

    .laplace-mechanism-s0 { animation-delay: 0.00s; }
    .laplace-mechanism-e0 { animation-delay: 0.00s; }
    .laplace-mechanism-s1 { animation-delay: 1.28s; }
    .laplace-mechanism-e1 { animation-delay: 1.28s; }
    .laplace-mechanism-s2 { animation-delay: 2.56s; }
    .laplace-mechanism-e2 { animation-delay: 2.56s; }
    .laplace-mechanism-s3 { animation-delay: 3.84s; }
    .laplace-mechanism-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .laplace-mechanism-conn  { animation: laplace-mechanism-trace 6.4s ease-in-out infinite; }
      .laplace-mechanism-stage { animation: laplace-mechanism-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes laplace-mechanism-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes laplace-mechanism-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .laplace-mechanism-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .laplace-mechanism-stage { animation: laplace-mechanism-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes laplace-mechanism-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="laplace-mechanism-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="laplace-mechanism-bg" width="980" height="322"/>
  <text class="laplace-mechanism-h1"  x="30" y="40">The Laplace mechanism</text>
  <text class="laplace-mechanism-sub" x="30" y="64">Three quantities, one formula.</text>
  <g class="laplace-mechanism-stage laplace-mechanism-s0">
    <rect class="laplace-mechanism-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="laplace-mechanism-step" x="44" y="142">01</text>
    <text class="laplace-mechanism-name" x="70" y="142">Sensitivity</text>
    <text class="laplace-mechanism-desc" x="44" y="166">How much one person's record can</text>
    <text class="laplace-mechanism-desc" x="44" y="182">change the answer. The L1</text>
    <text class="laplace-mechanism-desc" x="44" y="198">maximum.</text>
  </g>
  <line class="laplace-mechanism-line laplace-mechanism-conn laplace-mechanism-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#laplace-mechanism-tip)"/>
  <g class="laplace-mechanism-stage laplace-mechanism-s1">
    <rect class="laplace-mechanism-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="laplace-mechanism-step" x="280" y="142">02</text>
    <text class="laplace-mechanism-name" x="306" y="142">Epsilon</text>
    <text class="laplace-mechanism-desc" x="280" y="166">Your privacy budget. Smaller</text>
    <text class="laplace-mechanism-desc" x="280" y="182">means more noise and stronger</text>
    <text class="laplace-mechanism-desc" x="280" y="198">privacy.</text>
    <text class="laplace-mechanism-edge" x="280" y="242">0.5 - 2.0</text>
  </g>
  <line class="laplace-mechanism-line laplace-mechanism-conn laplace-mechanism-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#laplace-mechanism-tip)"/>
  <g class="laplace-mechanism-stage laplace-mechanism-s2">
    <rect class="laplace-mechanism-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="laplace-mechanism-step" x="516" y="142">03</text>
    <text class="laplace-mechanism-name" x="542" y="142">Noise scale = sensitivity / epsilon</text>
    <text class="laplace-mechanism-desc" x="516" y="166">Drawn from a Laplace</text>
    <text class="laplace-mechanism-desc" x="516" y="182">distribution centred at zero.</text>
  </g>
  <line class="laplace-mechanism-line laplace-mechanism-conn laplace-mechanism-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#laplace-mechanism-tip)"/>
  <g class="laplace-mechanism-stage laplace-mechanism-s3">
    <rect class="laplace-mechanism-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="laplace-mechanism-step" x="752" y="142">04</text>
    <text class="laplace-mechanism-name" x="778" y="142">The guarantee</text>
    <text class="laplace-mechanism-desc" x="752" y="166">An observer cannot tell whether</text>
    <text class="laplace-mechanism-desc" x="752" y="182">any one individual was in the</text>
    <text class="laplace-mechanism-desc" x="752" y="198">dataset.</text>
    <text class="laplace-mechanism-edge" x="752" y="242">provable</text>
  </g>
  <text class="laplace-mechanism-sub" x="30" y="304">Sensitivity is where the analysis actually happens: a count has sensitivity one, and an unbounded sum has unbounded sensitivity, which is why real deployments clip contributions before they aggregate.</text>
</svg>
