<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="It propagates silently through every operation.">
  <title>Why one nan ruins everything downstream</title>
  <style>
    .nan-propagates-bg   { fill: #f8fafc; }
    .nan-propagates-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nan-propagates-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nan-propagates-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nan-propagates-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nan-propagates-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nan-propagates-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nan-propagates-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .nan-propagates-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .nan-propagates-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .nan-propagates-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .nan-propagates-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .nan-propagates-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .nan-propagates-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .nan-propagates-stage { opacity: 1; }

    .nan-propagates-s0 { animation-delay: 0.00s; }
    .nan-propagates-e0 { animation-delay: 0.00s; }
    .nan-propagates-s1 { animation-delay: 1.28s; }
    .nan-propagates-e1 { animation-delay: 1.28s; }
    .nan-propagates-s2 { animation-delay: 2.56s; }
    .nan-propagates-e2 { animation-delay: 2.56s; }
    .nan-propagates-s3 { animation-delay: 3.84s; }
    .nan-propagates-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .nan-propagates-conn  { animation: nan-propagates-trace 6.4s ease-in-out infinite; }
      .nan-propagates-stage { animation: nan-propagates-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes nan-propagates-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes nan-propagates-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .nan-propagates-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .nan-propagates-stage { animation: nan-propagates-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes nan-propagates-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="nan-propagates-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="nan-propagates-bg" width="980" height="322"/>
  <text class="nan-propagates-h1"  x="30" y="40">Why one nan ruins everything downstream</text>
  <text class="nan-propagates-sub" x="30" y="64">It propagates silently through every operation.</text>
  <g class="nan-propagates-stage nan-propagates-s0">
    <rect class="nan-propagates-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="nan-propagates-step" x="44" y="142">01</text>
    <text class="nan-propagates-name" x="70" y="142">One nan appears</text>
    <text class="nan-propagates-desc" x="44" y="166">From 0/0, inf - inf, or the log</text>
    <text class="nan-propagates-desc" x="44" y="182">of a negative.</text>
  </g>
  <line class="nan-propagates-line nan-propagates-conn nan-propagates-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#nan-propagates-tip)"/>
  <g class="nan-propagates-stage nan-propagates-s1">
    <rect class="nan-propagates-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="nan-propagates-step" x="280" y="142">02</text>
    <text class="nan-propagates-name" x="306" y="142">Every operation involving it gives nan</text>
    <text class="nan-propagates-desc" x="280" y="166">A sum, a mean, a max — all nan,</text>
    <text class="nan-propagates-desc" x="280" y="182">from one bad value.</text>
    <text class="nan-propagates-edge" x="280" y="242">spreads</text>
  </g>
  <line class="nan-propagates-line nan-propagates-conn nan-propagates-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#nan-propagates-tip)"/>
  <g class="nan-propagates-stage nan-propagates-s2">
    <rect class="nan-propagates-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="nan-propagates-step" x="516" y="142">03</text>
    <text class="nan-propagates-name" x="542" y="142">And it is equal to nothing</text>
    <text class="nan-propagates-desc" x="516" y="166">Including itself. nan == nan is</text>
    <text class="nan-propagates-desc" x="516" y="182">False, by design.</text>
    <text class="nan-propagates-edge" x="516" y="242">x != x</text>
  </g>
  <line class="nan-propagates-line nan-propagates-conn nan-propagates-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#nan-propagates-tip)"/>
  <g class="nan-propagates-stage nan-propagates-s3">
    <rect class="nan-propagates-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="nan-propagates-step" x="752" y="142">04</text>
    <text class="nan-propagates-name" x="778" y="142">So use math.isnan</text>
    <text class="nan-propagates-desc" x="752" y="166">Explicitly, and check early —</text>
    <text class="nan-propagates-desc" x="752" y="182">before it has spread.</text>
    <text class="nan-propagates-edge" x="752" y="242">isnan</text>
  </g>
  <text class="nan-propagates-sub" x="30" y="304">This is why a training loss becomes nan at step 4,000 and stays nan forever after. The cause was one operation thousands of steps earlier, and every number since has been carrying it.</text>
</svg>
