<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three mechanisms, one identity.">
  <title>Proving where an artefact came from</title>
  <style>
    .slsa-rekor-bg   { fill: #f8fafc; }
    .slsa-rekor-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .slsa-rekor-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .slsa-rekor-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .slsa-rekor-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .slsa-rekor-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .slsa-rekor-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .slsa-rekor-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .slsa-rekor-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .slsa-rekor-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .slsa-rekor-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .slsa-rekor-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .slsa-rekor-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .slsa-rekor-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .slsa-rekor-stage { opacity: 1; }

    .slsa-rekor-s0 { animation-delay: 0.00s; }
    .slsa-rekor-e0 { animation-delay: 0.00s; }
    .slsa-rekor-s1 { animation-delay: 1.50s; }
    .slsa-rekor-e1 { animation-delay: 1.50s; }
    .slsa-rekor-s2 { animation-delay: 3.00s; }
    .slsa-rekor-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .slsa-rekor-conn  { animation: slsa-rekor-trace 6s ease-in-out infinite; }
      .slsa-rekor-stage { animation: slsa-rekor-arrive 6s ease-in-out infinite; }
    }
    @keyframes slsa-rekor-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes slsa-rekor-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .slsa-rekor-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .slsa-rekor-stage { animation: slsa-rekor-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes slsa-rekor-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="slsa-rekor-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="slsa-rekor-bg" width="980" height="322"/>
  <text class="slsa-rekor-h1"  x="30" y="40">Proving where an artefact came from</text>
  <text class="slsa-rekor-sub" x="30" y="64">Three mechanisms, one identity.</text>
  <g class="slsa-rekor-stage slsa-rekor-s0">
    <rect class="slsa-rekor-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="slsa-rekor-step" x="44" y="142">01</text>
    <text class="slsa-rekor-name" x="70" y="142">SLSA Level 3 provenance</text>
    <text class="slsa-rekor-desc" x="44" y="166">Commit SHA, base image digest, dataset</text>
    <text class="slsa-rekor-desc" x="44" y="182">manifest hash, builder identity.</text>
    <text class="slsa-rekor-desc" x="44" y="198">Non-falsifiable.</text>
  </g>
  <line class="slsa-rekor-line slsa-rekor-conn slsa-rekor-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#slsa-rekor-tip)"/>
  <g class="slsa-rekor-stage slsa-rekor-s1">
    <rect class="slsa-rekor-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="slsa-rekor-step" x="359" y="142">02</text>
    <text class="slsa-rekor-name" x="385" y="142">Rekor transparency log</text>
    <text class="slsa-rekor-desc" x="359" y="166">Signatures committed to an append-only ledger</text>
    <text class="slsa-rekor-desc" x="359" y="182">with a timestamped inclusion proof.</text>
    <text class="slsa-rekor-edge" x="359" y="242">append-only</text>
  </g>
  <line class="slsa-rekor-line slsa-rekor-conn slsa-rekor-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#slsa-rekor-tip)"/>
  <g class="slsa-rekor-stage slsa-rekor-s2">
    <rect class="slsa-rekor-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="slsa-rekor-step" x="674" y="142">03</text>
    <text class="slsa-rekor-name" x="700" y="142">Verify against an OIDC identity</text>
    <text class="slsa-rekor-desc" x="674" y="166">The workflow that was allowed to sign.</text>
    <text class="slsa-rekor-desc" x="674" y="182">Anything else is rejected.</text>
  </g>
  <text class="slsa-rekor-sub" x="30" y="304">The identity check is the part that turns a signature into a control: a valid signature from an unexpected signer is exactly the situation an attacker with any signing key produces.</text>
</svg>
