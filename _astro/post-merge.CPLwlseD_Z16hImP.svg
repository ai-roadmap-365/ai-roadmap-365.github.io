<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four post-merge steps.">
  <title>Shipping does not end at merge</title>
  <style>
    .post-merge-bg   { fill: #f8fafc; }
    .post-merge-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .post-merge-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .post-merge-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .post-merge-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .post-merge-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .post-merge-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .post-merge-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .post-merge-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .post-merge-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .post-merge-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .post-merge-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .post-merge-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .post-merge-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .post-merge-stage { opacity: 1; }

    .post-merge-s0 { animation-delay: 0.00s; }
    .post-merge-e0 { animation-delay: 0.00s; }
    .post-merge-s1 { animation-delay: 1.28s; }
    .post-merge-e1 { animation-delay: 1.28s; }
    .post-merge-s2 { animation-delay: 2.56s; }
    .post-merge-e2 { animation-delay: 2.56s; }
    .post-merge-s3 { animation-delay: 3.84s; }
    .post-merge-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .post-merge-conn  { animation: post-merge-trace 6.4s ease-in-out infinite; }
      .post-merge-stage { animation: post-merge-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes post-merge-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes post-merge-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .post-merge-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .post-merge-stage { animation: post-merge-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes post-merge-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="post-merge-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="post-merge-bg" width="980" height="322"/>
  <text class="post-merge-h1"  x="30" y="40">Shipping does not end at merge</text>
  <text class="post-merge-sub" x="30" y="64">Four post-merge steps.</text>
  <g class="post-merge-stage post-merge-s0">
    <rect class="post-merge-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="post-merge-step" x="44" y="142">01</text>
    <text class="post-merge-name" x="70" y="142">Canary at 5%</text>
    <text class="post-merge-desc" x="44" y="166">A fraction of production traffic</text>
    <text class="post-merge-desc" x="44" y="182">sees the new code.</text>
  </g>
  <line class="post-merge-line post-merge-conn post-merge-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#post-merge-tip)"/>
  <g class="post-merge-stage post-merge-s1">
    <rect class="post-merge-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="post-merge-step" x="280" y="142">02</text>
    <text class="post-merge-name" x="306" y="142">Monitor telemetry</text>
    <text class="post-merge-desc" x="280" y="166">Error rates, latency</text>
    <text class="post-merge-desc" x="280" y="182">percentiles, trace spans.</text>
  </g>
  <line class="post-merge-line post-merge-conn post-merge-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#post-merge-tip)"/>
  <g class="post-merge-stage post-merge-s2">
    <rect class="post-merge-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="post-merge-step" x="516" y="142">03</text>
    <text class="post-merge-name" x="542" y="142">Roll back automatically</text>
    <text class="post-merge-desc" x="516" y="166">Error rate above 0.1% or p99 up</text>
    <text class="post-merge-desc" x="516" y="182">50ms, and an incident ticket is</text>
    <text class="post-merge-desc" x="516" y="198">filed.</text>
  </g>
  <line class="post-merge-line post-merge-conn post-merge-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#post-merge-tip)"/>
  <g class="post-merge-stage post-merge-s3">
    <rect class="post-merge-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="post-merge-step" x="752" y="142">04</text>
    <text class="post-merge-name" x="778" y="142">Promote at 100%</text>
    <text class="post-merge-desc" x="752" y="166">After fifteen green minutes.</text>
  </g>
  <text class="post-merge-sub" x="30" y="304">Linking the incident ticket back to the agent's walkthrough closes the loop usefully: whoever investigates starts with the intent rather than reverse-engineering it from a diff.</text>
</svg>
