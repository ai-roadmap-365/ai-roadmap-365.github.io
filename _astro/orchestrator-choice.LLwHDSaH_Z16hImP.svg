<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three thresholds.">
  <title>When to adopt an orchestrator</title>
  <style>
    .orchestrator-choice-bg   { fill: #f8fafc; }
    .orchestrator-choice-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orchestrator-choice-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orchestrator-choice-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orchestrator-choice-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orchestrator-choice-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orchestrator-choice-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .orchestrator-choice-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .orchestrator-choice-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .orchestrator-choice-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .orchestrator-choice-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .orchestrator-choice-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .orchestrator-choice-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .orchestrator-choice-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .orchestrator-choice-stage { opacity: 1; }

    .orchestrator-choice-s0 { animation-delay: 0.00s; }
    .orchestrator-choice-e0 { animation-delay: 0.00s; }
    .orchestrator-choice-s1 { animation-delay: 1.50s; }
    .orchestrator-choice-e1 { animation-delay: 1.50s; }
    .orchestrator-choice-s2 { animation-delay: 3.00s; }
    .orchestrator-choice-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .orchestrator-choice-conn  { animation: orchestrator-choice-trace 6s ease-in-out infinite; }
      .orchestrator-choice-stage { animation: orchestrator-choice-arrive 6s ease-in-out infinite; }
    }
    @keyframes orchestrator-choice-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes orchestrator-choice-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .orchestrator-choice-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .orchestrator-choice-stage { animation: orchestrator-choice-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes orchestrator-choice-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="orchestrator-choice-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="orchestrator-choice-bg" width="980" height="322"/>
  <text class="orchestrator-choice-h1"  x="30" y="40">When to adopt an orchestrator</text>
  <text class="orchestrator-choice-sub" x="30" y="64">Three thresholds.</text>
  <g class="orchestrator-choice-stage orchestrator-choice-s0">
    <rect class="orchestrator-choice-good" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="orchestrator-choice-step" x="44" y="142">01</text>
    <text class="orchestrator-choice-name" x="70" y="142">Hand-rolled</text>
    <text class="orchestrator-choice-desc" x="44" y="166">One source, modest volume. No operational</text>
    <text class="orchestrator-choice-desc" x="44" y="182">dependencies, and readable end to end.</text>
  </g>
  <line class="orchestrator-choice-line orchestrator-choice-conn orchestrator-choice-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#orchestrator-choice-tip)"/>
  <g class="orchestrator-choice-stage orchestrator-choice-s1">
    <rect class="orchestrator-choice-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="orchestrator-choice-step" x="359" y="142">02</text>
    <text class="orchestrator-choice-name" x="385" y="142">An orchestrator</text>
    <text class="orchestrator-choice-desc" x="359" y="166">Scheduling, retries, run history, alerting.</text>
    <text class="orchestrator-choice-desc" x="359" y="182">Adopt at several pipelines.</text>
    <text class="orchestrator-choice-edge" x="359" y="242">operate it</text>
  </g>
  <line class="orchestrator-choice-line orchestrator-choice-conn orchestrator-choice-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#orchestrator-choice-tip)"/>
  <g class="orchestrator-choice-stage orchestrator-choice-s2">
    <rect class="orchestrator-choice-box" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="orchestrator-choice-step" x="674" y="142">03</text>
    <text class="orchestrator-choice-name" x="700" y="142">A connector platform</text>
    <text class="orchestrator-choice-desc" x="674" y="166">Worth it for the long tail of sources you</text>
    <text class="orchestrator-choice-desc" x="674" y="182">would otherwise write yourself.</text>
  </g>
  <text class="orchestrator-choice-sub" x="30" y="304">Reading the upsert semantics of any convenience library before depending on it is the specific caution: several ingestion helpers track hashes and differ in what they actually guarantee on a second write.</text>
</svg>
