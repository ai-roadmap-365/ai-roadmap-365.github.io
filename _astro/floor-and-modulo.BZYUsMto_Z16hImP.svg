<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And two of them surprise people once.">
  <title>Division has three answers in Python</title>
  <style>
    .floor-and-modulo-bg   { fill: #f8fafc; }
    .floor-and-modulo-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .floor-and-modulo-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .floor-and-modulo-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .floor-and-modulo-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .floor-and-modulo-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .floor-and-modulo-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .floor-and-modulo-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .floor-and-modulo-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .floor-and-modulo-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .floor-and-modulo-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .floor-and-modulo-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .floor-and-modulo-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .floor-and-modulo-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .floor-and-modulo-stage { opacity: 1; }

    .floor-and-modulo-s0 { animation-delay: 0.00s; }
    .floor-and-modulo-e0 { animation-delay: 0.00s; }
    .floor-and-modulo-s1 { animation-delay: 1.28s; }
    .floor-and-modulo-e1 { animation-delay: 1.28s; }
    .floor-and-modulo-s2 { animation-delay: 2.56s; }
    .floor-and-modulo-e2 { animation-delay: 2.56s; }
    .floor-and-modulo-s3 { animation-delay: 3.84s; }
    .floor-and-modulo-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .floor-and-modulo-conn  { animation: floor-and-modulo-trace 6.4s ease-in-out infinite; }
      .floor-and-modulo-stage { animation: floor-and-modulo-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes floor-and-modulo-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes floor-and-modulo-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .floor-and-modulo-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .floor-and-modulo-stage { animation: floor-and-modulo-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes floor-and-modulo-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="floor-and-modulo-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="floor-and-modulo-bg" width="980" height="322"/>
  <text class="floor-and-modulo-h1"  x="30" y="40">Division has three answers in Python</text>
  <text class="floor-and-modulo-sub" x="30" y="64">And two of them surprise people once.</text>
  <g class="floor-and-modulo-stage floor-and-modulo-s0">
    <rect class="floor-and-modulo-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="floor-and-modulo-step" x="44" y="142">01</text>
    <text class="floor-and-modulo-name" x="70" y="142">/ gives a float</text>
    <text class="floor-and-modulo-desc" x="44" y="166">Always. 6 / 3 is 2.0, not 2.</text>
    <text class="floor-and-modulo-edge" x="44" y="242">float</text>
  </g>
  <line class="floor-and-modulo-line floor-and-modulo-conn floor-and-modulo-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#floor-and-modulo-tip)"/>
  <g class="floor-and-modulo-stage floor-and-modulo-s1">
    <rect class="floor-and-modulo-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="floor-and-modulo-step" x="280" y="142">02</text>
    <text class="floor-and-modulo-name" x="306" y="142">// floors</text>
    <text class="floor-and-modulo-desc" x="280" y="166">Towards NEGATIVE infinity. -7 //</text>
    <text class="floor-and-modulo-desc" x="280" y="182">2 is -4, not -3.</text>
    <text class="floor-and-modulo-edge" x="280" y="242">-4</text>
  </g>
  <line class="floor-and-modulo-line floor-and-modulo-conn floor-and-modulo-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#floor-and-modulo-tip)"/>
  <g class="floor-and-modulo-stage floor-and-modulo-s2">
    <rect class="floor-and-modulo-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="floor-and-modulo-step" x="516" y="142">03</text>
    <text class="floor-and-modulo-name" x="542" y="142">% follows from that</text>
    <text class="floor-and-modulo-desc" x="516" y="166">So -7 % 2 is 1. The sign follows</text>
    <text class="floor-and-modulo-desc" x="516" y="182">the DIVISOR, not the dividend.</text>
    <text class="floor-and-modulo-edge" x="516" y="242">1</text>
  </g>
  <line class="floor-and-modulo-line floor-and-modulo-conn floor-and-modulo-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#floor-and-modulo-tip)"/>
  <g class="floor-and-modulo-stage floor-and-modulo-s3">
    <rect class="floor-and-modulo-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="floor-and-modulo-step" x="752" y="142">04</text>
    <text class="floor-and-modulo-name" x="778" y="142">round() goes to even</text>
    <text class="floor-and-modulo-desc" x="752" y="166">round(0.5) is 0 and round(1.5)</text>
    <text class="floor-and-modulo-desc" x="752" y="182">is 2. Banker's rounding.</text>
    <text class="floor-and-modulo-edge" x="752" y="242">to even</text>
  </g>
  <text class="floor-and-modulo-sub" x="30" y="304">Rounding halves to even is deliberate: always rounding up biases a long series of sums upward, and going to the nearest even cancels that bias out across many values.</text>
</svg>
