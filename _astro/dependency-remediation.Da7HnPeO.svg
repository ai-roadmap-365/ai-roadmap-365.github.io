<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps, and a measured outcome.">
  <title>Automated vulnerability patching</title>
  <style>
    .dependency-remediation-bg   { fill: #f8fafc; }
    .dependency-remediation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dependency-remediation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dependency-remediation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dependency-remediation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dependency-remediation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dependency-remediation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dependency-remediation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dependency-remediation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dependency-remediation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dependency-remediation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dependency-remediation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dependency-remediation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .dependency-remediation-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .dependency-remediation-stage { opacity: 1; }

    .dependency-remediation-s0 { animation-delay: 0.00s; }
    .dependency-remediation-e0 { animation-delay: 0.00s; }
    .dependency-remediation-s1 { animation-delay: 1.28s; }
    .dependency-remediation-e1 { animation-delay: 1.28s; }
    .dependency-remediation-s2 { animation-delay: 2.56s; }
    .dependency-remediation-e2 { animation-delay: 2.56s; }
    .dependency-remediation-s3 { animation-delay: 3.84s; }
    .dependency-remediation-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .dependency-remediation-conn  { animation: dependency-remediation-trace 6.4s ease-in-out infinite; }
      .dependency-remediation-stage { animation: dependency-remediation-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes dependency-remediation-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes dependency-remediation-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .dependency-remediation-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .dependency-remediation-stage { animation: dependency-remediation-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes dependency-remediation-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="dependency-remediation-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="dependency-remediation-bg" width="980" height="322"/>
  <text class="dependency-remediation-h1"  x="30" y="40">Automated vulnerability patching</text>
  <text class="dependency-remediation-sub" x="30" y="64">Four steps, and a measured outcome.</text>
  <g class="dependency-remediation-stage dependency-remediation-s0">
    <rect class="dependency-remediation-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="dependency-remediation-step" x="44" y="142">01</text>
    <text class="dependency-remediation-name" x="70" y="142">A security alert arrives</text>
    <text class="dependency-remediation-desc" x="44" y="166">A CVE in a transitive</text>
    <text class="dependency-remediation-desc" x="44" y="182">dependency, across eighty</text>
    <text class="dependency-remediation-desc" x="44" y="198">services.</text>
  </g>
  <line class="dependency-remediation-line dependency-remediation-conn dependency-remediation-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#dependency-remediation-tip)"/>
  <g class="dependency-remediation-stage dependency-remediation-s1">
    <rect class="dependency-remediation-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="dependency-remediation-step" x="280" y="142">02</text>
    <text class="dependency-remediation-name" x="306" y="142">Bump and test</text>
    <text class="dependency-remediation-desc" x="280" y="166">A branch, a version bump, the</text>
    <text class="dependency-remediation-desc" x="280" y="182">full suite in an ephemeral</text>
    <text class="dependency-remediation-desc" x="280" y="198">container.</text>
  </g>
  <line class="dependency-remediation-line dependency-remediation-conn dependency-remediation-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#dependency-remediation-tip)"/>
  <g class="dependency-remediation-stage dependency-remediation-s2">
    <rect class="dependency-remediation-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="dependency-remediation-step" x="516" y="142">03</text>
    <text class="dependency-remediation-name" x="542" y="142">A PR with evidence</text>
    <text class="dependency-remediation-desc" x="516" y="166">Test results attached, for a</text>
    <text class="dependency-remediation-desc" x="516" y="182">human to approve.</text>
  </g>
  <line class="dependency-remediation-line dependency-remediation-conn dependency-remediation-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#dependency-remediation-tip)"/>
  <g class="dependency-remediation-stage dependency-remediation-s3">
    <rect class="dependency-remediation-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="dependency-remediation-step" x="752" y="142">04</text>
    <text class="dependency-remediation-name" x="778" y="142">92% resolved without a developer</text>
    <text class="dependency-remediation-desc" x="752" y="166">Dwell time from 18 days to under</text>
    <text class="dependency-remediation-desc" x="752" y="182">40 minutes.</text>
    <text class="dependency-remediation-edge" x="752" y="242">measured</text>
  </g>
  <text class="dependency-remediation-sub" x="30" y="304">Dwell time is the right metric for this because it is what an attacker is racing: the vulnerability is public from the moment the alert exists, and eighteen days is the window it stayed open.</text>
</svg>
