<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things HTTP calls are not</title>
  <style>
    .http-not-bg   { fill: #f8fafc; }
    .http-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .http-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .http-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .http-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .http-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .http-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .http-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .http-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .http-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .http-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .http-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .http-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .http-not-row { opacity: 1; }
    .http-not-r0 { animation-delay: 0.00s; }
    .http-not-r1 { animation-delay: 0.45s; }
    .http-not-r2 { animation-delay: 0.90s; }
    .http-not-r3 { animation-delay: 1.35s; }
    .http-not-r4 { animation-delay: 1.80s; }
    .http-not-row { animation: http-not-reveal 7.3s ease-in-out infinite; }
    @keyframes http-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="http-not-bg" width="980" height="390"/>
  <text class="http-not-h1"  x="30" y="40">Four things HTTP calls are not</text>
  <text class="http-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="http-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="http-not-name" x="46" y="122">The misconception</text>
  <text class="http-not-desc" x="46" y="142">Commonly held.</text>
  <text class="http-not-desc http-not-row http-not-r0" x="46" y="182">A default timeout exists</text>
  <text class="http-not-desc http-not-row http-not-r1" x="46" y="216">A two hundred means success</text>
  <text class="http-not-desc http-not-row http-not-r2" x="46" y="250">Retrying is always safe</text>
  <text class="http-not-desc http-not-row http-not-r3" x="46" y="284">Errors are exceptional</text>
  <text class="http-not-desc http-not-row http-not-r4" x="46" y="318">One request is like another</text>
  <rect class="http-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="http-not-name" x="526" y="122">What is true</text>
  <text class="http-not-desc" x="526" y="142">Actually.</text>
  <text class="http-not-desc http-not-row http-not-r0" x="526" y="182">There is none; the call can hang forever</text>
  <text class="http-not-desc http-not-row http-not-r1" x="526" y="216">The body may still report a failure</text>
  <text class="http-not-desc http-not-row http-not-r2" x="526" y="250">Retrying a non-idempotent write duplicates it</text>
  <text class="http-not-desc http-not-row http-not-r3" x="526" y="284">At volume they are routine</text>
  <text class="http-not-desc http-not-row http-not-r4" x="526" y="318">Sessions reuse connections and settings</text>
  <text class="http-not-sub" x="30" y="372">Retrying a non-idempotent write is the one that causes real damage: a retried payment or order can be applied twice with no error anywhere.</text>
</svg>
