<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward type-driven models.">
  <title>Four steps in Python validation</title>
  <style>
    .validation-history-bg   { fill: #f8fafc; }
    .validation-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validation-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validation-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validation-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validation-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validation-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .validation-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .validation-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .validation-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .validation-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .validation-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .validation-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .validation-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .validation-history-stage { opacity: 1; }

    .validation-history-s0 { animation-delay: 0.00s; }
    .validation-history-e0 { animation-delay: 0.00s; }
    .validation-history-s1 { animation-delay: 1.28s; }
    .validation-history-e1 { animation-delay: 1.28s; }
    .validation-history-s2 { animation-delay: 2.56s; }
    .validation-history-e2 { animation-delay: 2.56s; }
    .validation-history-s3 { animation-delay: 3.84s; }
    .validation-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .validation-history-conn  { animation: validation-history-trace 6.4s ease-in-out infinite; }
      .validation-history-stage { animation: validation-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes validation-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes validation-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .validation-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .validation-history-stage { animation: validation-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes validation-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="validation-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="validation-history-bg" width="980" height="322"/>
  <text class="validation-history-h1"  x="30" y="40">Four steps in Python validation</text>
  <text class="validation-history-sub" x="30" y="64">Toward type-driven models.</text>
  <g class="validation-history-stage validation-history-s0">
    <rect class="validation-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="validation-history-step" x="44" y="142">01</text>
    <text class="validation-history-name" x="70" y="142">Checks written by hand at the top of functions</text>
    <text class="validation-history-desc" x="44" y="166">Repetitive, and inconsistent.</text>
  </g>
  <line class="validation-history-line validation-history-conn validation-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#validation-history-tip)"/>
  <g class="validation-history-stage validation-history-s1">
    <rect class="validation-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="validation-history-step" x="280" y="142">02</text>
    <text class="validation-history-name" x="306" y="142">Then schema libraries with their own declarations</text>
    <text class="validation-history-desc" x="280" y="166">Separate from the code's types.</text>
  </g>
  <line class="validation-history-line validation-history-conn validation-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#validation-history-tip)"/>
  <g class="validation-history-stage validation-history-s2">
    <rect class="validation-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="validation-history-step" x="516" y="142">03</text>
    <text class="validation-history-name" x="542" y="142">Then type annotations became standard</text>
    <text class="validation-history-desc" x="516" y="166">Describing shape in the language</text>
    <text class="validation-history-desc" x="516" y="182">itself.</text>
  </g>
  <line class="validation-history-line validation-history-conn validation-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#validation-history-tip)"/>
  <g class="validation-history-stage validation-history-s3">
    <rect class="validation-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="validation-history-step" x="752" y="142">04</text>
    <text class="validation-history-name" x="778" y="142">And models that validate from those annotations</text>
    <text class="validation-history-desc" x="752" y="166">One declaration serving both.</text>
  </g>
  <text class="validation-history-sub" x="30" y="304">One declaration serving both static checking and runtime validation is what removed the duplication, and duplication was what made earlier approaches drift.</text>
</svg>
