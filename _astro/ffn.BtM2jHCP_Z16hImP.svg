<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Where most of the parameters live.">
  <title>The feedforward network</title>
  <style>
    .ffn-bg   { fill: #f8fafc; }
    .ffn-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ffn-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ffn-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ffn-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ffn-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ffn-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ffn-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ffn-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ffn-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ffn-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ffn-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ffn-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .ffn-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .ffn-stage { opacity: 1; }

    .ffn-s0 { animation-delay: 0.00s; }
    .ffn-e0 { animation-delay: 0.00s; }
    .ffn-s1 { animation-delay: 1.28s; }
    .ffn-e1 { animation-delay: 1.28s; }
    .ffn-s2 { animation-delay: 2.56s; }
    .ffn-e2 { animation-delay: 2.56s; }
    .ffn-s3 { animation-delay: 3.84s; }
    .ffn-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .ffn-conn  { animation: ffn-trace 6.4s ease-in-out infinite; }
      .ffn-stage { animation: ffn-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes ffn-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes ffn-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .ffn-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ffn-stage { animation: ffn-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes ffn-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ffn-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="ffn-bg" width="980" height="322"/>
  <text class="ffn-h1"  x="30" y="40">The feedforward network</text>
  <text class="ffn-sub" x="30" y="64">Where most of the parameters live.</text>
  <g class="ffn-stage ffn-s0">
    <rect class="ffn-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="ffn-step" x="44" y="142">01</text>
    <text class="ffn-name" x="70" y="142">Expand the dimension</text>
    <text class="ffn-desc" x="44" y="166">Typically by four. A wide</text>
    <text class="ffn-desc" x="44" y="182">intermediate representation.</text>
  </g>
  <line class="ffn-line ffn-conn ffn-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#ffn-tip)"/>
  <g class="ffn-stage ffn-s1">
    <rect class="ffn-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="ffn-step" x="280" y="142">02</text>
    <text class="ffn-name" x="306" y="142">Apply a non-linearity</text>
    <text class="ffn-desc" x="280" y="166">GeLU or a gated variant.</text>
  </g>
  <line class="ffn-line ffn-conn ffn-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#ffn-tip)"/>
  <g class="ffn-stage ffn-s2">
    <rect class="ffn-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="ffn-step" x="516" y="142">03</text>
    <text class="ffn-name" x="542" y="142">Project back down</text>
    <text class="ffn-desc" x="516" y="166">To the model dimension, so the</text>
    <text class="ffn-desc" x="516" y="182">shape is preserved.</text>
  </g>
  <line class="ffn-line ffn-conn ffn-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#ffn-tip)"/>
  <g class="ffn-stage ffn-s3">
    <rect class="ffn-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="ffn-step" x="752" y="142">04</text>
    <text class="ffn-name" x="778" y="142">Which is most of the parameters</text>
    <text class="ffn-desc" x="752" y="166">Roughly two thirds of a standard</text>
    <text class="ffn-desc" x="752" y="182">block.</text>
    <text class="ffn-edge" x="752" y="242">~2/3</text>
  </g>
  <text class="ffn-sub" x="30" y="304">The parameter share explains where sparse routing is applied: replacing this sublayer with a set of experts adds capacity without adding per-token computation.</text>
</svg>
