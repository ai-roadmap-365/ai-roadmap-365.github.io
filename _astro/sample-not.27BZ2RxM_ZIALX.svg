<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things sampling is not</title>
  <style>
    .sample-not-bg   { fill: #f8fafc; }
    .sample-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sample-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sample-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sample-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sample-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sample-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sample-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sample-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sample-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sample-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sample-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sample-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sample-not-row { opacity: 1; }
    .sample-not-r0 { animation-delay: 0.00s; }
    .sample-not-r1 { animation-delay: 0.45s; }
    .sample-not-r2 { animation-delay: 0.90s; }
    .sample-not-r3 { animation-delay: 1.35s; }
    .sample-not-r4 { animation-delay: 1.80s; }
    .sample-not-row { animation: sample-not-reveal 7.3s ease-in-out infinite; }
    @keyframes sample-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="sample-not-bg" width="980" height="390"/>
  <text class="sample-not-h1"  x="30" y="40">Four things sampling is not</text>
  <text class="sample-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="sample-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="sample-not-name" x="46" y="122">The misconception</text>
  <text class="sample-not-desc" x="46" y="142">Commonly held.</text>
  <text class="sample-not-desc sample-not-row sample-not-r0" x="46" y="182">A bigger sample is always better</text>
  <text class="sample-not-desc sample-not-row sample-not-r1" x="46" y="216">The sample must be a large fraction</text>
  <text class="sample-not-desc sample-not-row sample-not-r2" x="46" y="250">The theorem makes data normal</text>
  <text class="sample-not-desc sample-not-row sample-not-r3" x="46" y="284">A convenience sample is fine if large</text>
  <text class="sample-not-desc sample-not-row sample-not-r4" x="46" y="318">More data removes bias</text>
  <rect class="sample-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="sample-not-name" x="526" y="122">What is true</text>
  <text class="sample-not-desc" x="526" y="142">Actually.</text>
  <text class="sample-not-desc sample-not-row sample-not-r0" x="526" y="182">A representative sample matters more</text>
  <text class="sample-not-desc sample-not-row sample-not-r1" x="526" y="216">Absolute size matters, not the fraction</text>
  <text class="sample-not-desc sample-not-row sample-not-r2" x="526" y="250">It makes sample means normal</text>
  <text class="sample-not-desc sample-not-row sample-not-r3" x="526" y="284">It supports no inference at all</text>
  <text class="sample-not-desc sample-not-row sample-not-r4" x="526" y="318">It only reduces random error</text>
  <text class="sample-not-sub" x="30" y="372">The absolute size mattering rather than the fraction surprises people: a well-drawn sample of a thousand works equally well for a city or a country.</text>
</svg>
