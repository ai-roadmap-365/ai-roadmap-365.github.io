<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when to cut it short.">
  <title>When to follow the full process</title>
  <style>
    .project-when-bg   { fill: #f8fafc; }
    .project-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .project-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .project-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .project-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .project-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .project-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .project-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .project-when-row { opacity: 1; }
    .project-when-r0 { animation-delay: 0.00s; }
    .project-when-r1 { animation-delay: 0.45s; }
    .project-when-r2 { animation-delay: 0.90s; }
    .project-when-r3 { animation-delay: 1.35s; }
    .project-when-r4 { animation-delay: 1.80s; }
    .project-when-row { animation: project-when-reveal 7.3s ease-in-out infinite; }
    @keyframes project-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="project-when-bg" width="980" height="390"/>
  <text class="project-when-h1"  x="30" y="40">When to follow the full process</text>
  <text class="project-when-sub" x="30" y="64">And when to cut it short.</text>
  <rect class="project-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="project-when-name" x="46" y="122">Full process</text>
  <text class="project-when-desc" x="46" y="142">Four signals.</text>
  <text class="project-when-desc project-when-row project-when-r0" x="46" y="182">Anything going to production</text>
  <text class="project-when-desc project-when-row project-when-r1" x="46" y="216">Where decisions affect people</text>
  <text class="project-when-desc project-when-row project-when-r2" x="46" y="250">Regulated or audited domains</text>
  <text class="project-when-desc project-when-row project-when-r3" x="46" y="284">Where the result will be defended</text>
  <text class="project-when-desc project-when-row project-when-r4" x="46" y="318">Any model with a maintenance life</text>
  <rect class="project-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="project-when-name" x="526" y="122">Lighter</text>
  <text class="project-when-desc" x="526" y="142">Also four.</text>
  <text class="project-when-desc project-when-row project-when-r0" x="526" y="182">Exploratory feasibility checks</text>
  <text class="project-when-desc project-when-row project-when-r1" x="526" y="216">Deciding whether a problem is tractable</text>
  <text class="project-when-desc project-when-row project-when-r2" x="526" y="250">Teaching and learning exercises</text>
  <text class="project-when-desc project-when-row project-when-r3" x="526" y="284">Throwaway analysis</text>
  <text class="project-when-desc project-when-row project-when-r4" x="526" y="318">But keep the split discipline regardless</text>
  <text class="project-when-sub" x="30" y="372">The split discipline is the one part to keep even in the lightest exploration, because a leaked estimate will mislead the decision about whether to proceed at all.</text>
</svg>
