<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>A fairness check on the target range</title>
  <style>
    .high-value-bg   { fill: #f8fafc; }
    .high-value-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .high-value-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .high-value-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .high-value-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .high-value-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .high-value-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .high-value-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .high-value-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .high-value-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .high-value-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .high-value-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .high-value-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .high-value-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .high-value-stage { opacity: 1; }

    .high-value-s0 { animation-delay: 0.00s; }
    .high-value-e0 { animation-delay: 0.00s; }
    .high-value-s1 { animation-delay: 1.28s; }
    .high-value-e1 { animation-delay: 1.28s; }
    .high-value-s2 { animation-delay: 2.56s; }
    .high-value-e2 { animation-delay: 2.56s; }
    .high-value-s3 { animation-delay: 3.84s; }
    .high-value-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .high-value-conn  { animation: high-value-trace 6.4s ease-in-out infinite; }
      .high-value-stage { animation: high-value-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes high-value-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes high-value-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .high-value-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .high-value-stage { animation: high-value-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes high-value-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="high-value-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="high-value-bg" width="980" height="322"/>
  <text class="high-value-h1"  x="30" y="40">A fairness check on the target range</text>
  <text class="high-value-sub" x="30" y="64">Four steps.</text>
  <g class="high-value-stage high-value-s0">
    <rect class="high-value-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="high-value-step" x="44" y="142">01</text>
    <text class="high-value-name" x="70" y="142">Split the test set by target value</text>
    <text class="high-value-desc" x="44" y="166">Low, middle and high.</text>
  </g>
  <line class="high-value-line high-value-conn high-value-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#high-value-tip)"/>
  <g class="high-value-stage high-value-s1">
    <rect class="high-value-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="high-value-step" x="280" y="142">02</text>
    <text class="high-value-name" x="306" y="142">Compute the error within each slice</text>
    <text class="high-value-desc" x="280" y="166">Rather than only overall.</text>
  </g>
  <line class="high-value-line high-value-conn high-value-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#high-value-tip)"/>
  <g class="high-value-stage high-value-s2">
    <rect class="high-value-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="high-value-step" x="516" y="142">03</text>
    <text class="high-value-name" x="542" y="142">And compare: is the model worse where it matters most</text>
    <text class="high-value-desc" x="516" y="166">Which the aggregate cannot show.</text>
  </g>
  <line class="high-value-line high-value-conn high-value-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#high-value-tip)"/>
  <g class="high-value-stage high-value-s3">
    <rect class="high-value-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="high-value-step" x="752" y="142">04</text>
    <text class="high-value-name" x="778" y="142">Measured rather than assumed either way</text>
    <text class="high-value-desc" x="752" y="166">Which is the discipline.</text>
  </g>
  <text class="high-value-sub" x="30" y="304">This is the regression equivalent of subgroup fairness auditing, applied to the target's own range rather than to a demographic attribute.</text>
</svg>
