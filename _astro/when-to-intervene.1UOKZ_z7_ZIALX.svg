<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The failure type decides.">
  <title>Let it run, or step in</title>
  <style>
    .when-to-intervene-bg   { fill: #f8fafc; }
    .when-to-intervene-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .when-to-intervene-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .when-to-intervene-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .when-to-intervene-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .when-to-intervene-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .when-to-intervene-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .when-to-intervene-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .when-to-intervene-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .when-to-intervene-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .when-to-intervene-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .when-to-intervene-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .when-to-intervene-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .when-to-intervene-row { opacity: 1; }
    .when-to-intervene-r0 { animation-delay: 0.00s; }
    .when-to-intervene-r1 { animation-delay: 0.45s; }
    .when-to-intervene-r2 { animation-delay: 0.90s; }
    .when-to-intervene-r3 { animation-delay: 1.35s; }
    .when-to-intervene-r4 { animation-delay: 1.80s; }
    .when-to-intervene-row { animation: when-to-intervene-reveal 7.3s ease-in-out infinite; }
    @keyframes when-to-intervene-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="when-to-intervene-bg" width="980" height="390"/>
  <text class="when-to-intervene-h1"  x="30" y="40">Let it run, or step in</text>
  <text class="when-to-intervene-sub" x="30" y="64">The failure type decides.</text>
  <rect class="when-to-intervene-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="when-to-intervene-name" x="46" y="122">Let it run</text>
  <text class="when-to-intervene-desc" x="46" y="142">Mechanical failures.</text>
  <text class="when-to-intervene-desc when-to-intervene-row when-to-intervene-r0" x="46" y="182">A syntax typo</text>
  <text class="when-to-intervene-desc when-to-intervene-row when-to-intervene-r1" x="46" y="216">A missing import</text>
  <text class="when-to-intervene-desc when-to-intervene-row when-to-intervene-r2" x="46" y="250">One assertion value mismatch</text>
  <text class="when-to-intervene-desc when-to-intervene-row when-to-intervene-r3" x="46" y="284">The traceback names the fix</text>
  <text class="when-to-intervene-desc when-to-intervene-row when-to-intervene-r4" x="46" y="318">Turns one to three</text>
  <rect class="when-to-intervene-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="when-to-intervene-name" x="526" y="122">Step in</text>
  <text class="when-to-intervene-desc" x="526" y="142">Structural confusion.</text>
  <text class="when-to-intervene-desc when-to-intervene-row when-to-intervene-r0" x="526" y="182">Changes to unrelated functions</text>
  <text class="when-to-intervene-desc when-to-intervene-row when-to-intervene-r1" x="526" y="216">Altering the database schema</text>
  <text class="when-to-intervene-desc when-to-intervene-row when-to-intervene-r2" x="526" y="250">A fundamental architectural misreading</text>
  <text class="when-to-intervene-desc when-to-intervene-row when-to-intervene-r3" x="526" y="284">Turn three onward, generally</text>
  <text class="when-to-intervene-desc when-to-intervene-row when-to-intervene-r4" x="526" y="318">Interrupt and re-specify</text>
  <text class="when-to-intervene-sub" x="30" y="372">The signal to watch is scope rather than repetition: an agent making the same file smaller and smaller is converging, and an agent reaching into new files is not.</text>
</svg>
