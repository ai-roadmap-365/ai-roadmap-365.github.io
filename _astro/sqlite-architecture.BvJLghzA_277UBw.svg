<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1020" width="1040" height="1020" role="img" aria-labelledby="d085a-title d085a-desc">
  <title id="d085a-title">The architecture of SQLite: an application calling a library, its compiler and backend layers, and one database file with its journal</title>
  <desc id="d085a-desc">A vertical stack. At the top an application — your Python program or the sqlite3 shell — calls into the SQLite library through its C interface. Inside the library, a front end of tokenizer, parser and code generator turns SQL text into a bytecode program, which a virtual machine executes. Below the virtual machine, a B-tree layer turns rows into pages, a pager caches pages and owns the transaction, and an OS interface performs the actual reads, writes and locks. Underneath the library sit the two files on disk: the single database file, and its rollback journal or write-ahead log.</desc>

  <style>
    .d085a-bg      { fill: #f8fafc; }
    .d085a-title   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 22px; font-weight: 600; fill: #1a202c; }
    .d085a-lede    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #334155; }
    .d085a-label   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 600; fill: #1a202c; }
    .d085a-sub     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d085a-note    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d085a-group   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; fill: #1d4ed8; }
    .d085a-box     { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d085a-accent  { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 2; }
    .d085a-outer   { fill: none; stroke: #1d4ed8; stroke-width: 2; stroke-dasharray: 8 6; }
    .d085a-band    { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1.5; }
    .d085a-disk    { fill: #ffffff; stroke: #047857; stroke-width: 2; }
    .d085a-arrow   { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .d085a-thin    { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 5; }
  </style>

  <defs>
    <marker id="d085a-arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
    <marker id="d085a-arrowgreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857" />
    </marker>
  </defs>

  <rect class="d085a-bg" x="0" y="0" width="1040" height="1020" />

  <text class="d085a-title" x="40" y="46">Inside SQLite: one library, seven layers, one file</text>
  <text class="d085a-lede" x="40" y="74">There is no server anywhere in this picture. Every box below runs inside your own process.</text>

  <!-- ================= application ================= -->
  <rect class="d085a-box" x="300" y="98" width="360" height="62" rx="8" />
  <text class="d085a-label" x="480" y="124" text-anchor="middle">Your application</text>
  <text class="d085a-sub" x="480" y="146" text-anchor="middle">a Python program, or the sqlite3 shell</text>

  <text class="d085a-note" x="700" y="126">One process. The database code is</text>
  <text class="d085a-note" x="700" y="146">a function call away, not a network hop.</text>

  <path class="d085a-arrow" d="M 480 160 L 480 196" marker-end="url(#d085a-arrowhead)" />

  <!-- ================= the library ================= -->
  <rect class="d085a-outer" x="230" y="200" width="500" height="768" rx="12" />
  <text class="d085a-group" x="250" y="226">The SQLite library — linked into your process</text>

  <rect class="d085a-box" x="270" y="240" width="420" height="58" rx="8" />
  <text class="d085a-label" x="480" y="264" text-anchor="middle">C interface</text>
  <text class="d085a-sub" x="480" y="285" text-anchor="middle">prepare, bind, step, finalize</text>
  <text class="d085a-note" x="750" y="270">What Python's sqlite3 module</text>
  <text class="d085a-note" x="750" y="290">and every other binding calls.</text>

  <path class="d085a-arrow" d="M 480 298 L 480 328" marker-end="url(#d085a-arrowhead)" />

  <!-- front end -->
  <rect class="d085a-band" x="252" y="332" width="456" height="222" rx="10" />
  <text class="d085a-group" x="268" y="354">Front end: SQL text becomes a program</text>

  <rect class="d085a-box" x="272" y="364" width="416" height="52" rx="8" />
  <text class="d085a-label" x="480" y="386" text-anchor="middle">Tokenizer</text>
  <text class="d085a-sub" x="480" y="406" text-anchor="middle">splits the text into keywords, names and literals</text>

  <path class="d085a-arrow" d="M 480 416 L 480 434" marker-end="url(#d085a-arrowhead)" />

  <rect class="d085a-box" x="272" y="438" width="416" height="52" rx="8" />
  <text class="d085a-label" x="480" y="460" text-anchor="middle">Parser</text>
  <text class="d085a-sub" x="480" y="480" text-anchor="middle">builds a tree; rejects what is not valid SQL</text>

  <path class="d085a-arrow" d="M 480 490 L 480 508" marker-end="url(#d085a-arrowhead)" />

  <rect class="d085a-box" x="272" y="512" width="416" height="52" rx="8" />
  <text class="d085a-label" x="480" y="534" text-anchor="middle">Code generator and query planner</text>
  <text class="d085a-sub" x="480" y="554" text-anchor="middle">chooses HOW: which index, which order</text>

  <text class="d085a-note" x="750" y="396">This is where declarative</text>
  <text class="d085a-note" x="750" y="416">becomes procedural. You said</text>
  <text class="d085a-note" x="750" y="436">what you wanted; the planner</text>
  <text class="d085a-note" x="750" y="456">decides the steps, and may</text>
  <text class="d085a-note" x="750" y="476">decide differently tomorrow</text>
  <text class="d085a-note" x="750" y="496">as the data changes.</text>
  <text class="d085a-note" x="750" y="524">EXPLAIN QUERY PLAN prints</text>
  <text class="d085a-note" x="750" y="544">the choice it made.</text>

  <path class="d085a-arrow" d="M 480 564 L 480 584" marker-end="url(#d085a-arrowhead)" />

  <!-- bytecode -->
  <rect class="d085a-accent" x="272" y="588" width="416" height="52" rx="8" />
  <text class="d085a-label" x="480" y="610" text-anchor="middle">Bytecode program</text>
  <text class="d085a-sub" x="480" y="630" text-anchor="middle">the prepared statement — reusable, bindable</text>

  <path class="d085a-arrow" d="M 480 640 L 480 660" marker-end="url(#d085a-arrowhead)" />

  <!-- back end -->
  <rect class="d085a-box" x="272" y="664" width="416" height="52" rx="8" />
  <text class="d085a-label" x="480" y="686" text-anchor="middle">Bytecode virtual machine</text>
  <text class="d085a-sub" x="480" y="706" text-anchor="middle">runs the program one instruction at a time</text>

  <path class="d085a-arrow" d="M 480 716 L 480 730" marker-end="url(#d085a-arrowhead)" />

  <rect class="d085a-box" x="272" y="734" width="416" height="52" rx="8" />
  <text class="d085a-label" x="480" y="756" text-anchor="middle">B-tree layer</text>
  <text class="d085a-sub" x="480" y="776" text-anchor="middle">tables and indexes as ordered trees of pages</text>

  <text class="d085a-note" x="750" y="676">Rows go in and out here.</text>
  <text class="d085a-note" x="750" y="696">Step once, get one row.</text>
  <text class="d085a-note" x="750" y="746">Ordered, so a lookup is a</text>
  <text class="d085a-note" x="750" y="766">descent, not a scan. This is</text>
  <text class="d085a-note" x="750" y="786">what an index actually is.</text>

  <path class="d085a-arrow" d="M 480 786 L 480 826" marker-end="url(#d085a-arrowhead)" />

  <!-- pager sits below the library box on purpose: it owns durability -->
  <rect class="d085a-accent" x="272" y="830" width="416" height="56" rx="8" />
  <text class="d085a-label" x="480" y="854" text-anchor="middle">Pager</text>
  <text class="d085a-sub" x="480" y="875" text-anchor="middle">page cache, locking, rollback — the A, C, I and D</text>

  <text class="d085a-note" x="750" y="846">Every ACID guarantee is made</text>
  <text class="d085a-note" x="750" y="866">here. Above this line nothing</text>
  <text class="d085a-note" x="750" y="886">knows what a transaction is.</text>

  <path class="d085a-arrow" d="M 480 886 L 480 906" marker-end="url(#d085a-arrowhead)" />

  <rect class="d085a-box" x="272" y="910" width="416" height="48" rx="8" />
  <text class="d085a-label" x="480" y="932" text-anchor="middle">OS interface</text>
  <text class="d085a-sub" x="480" y="950" text-anchor="middle">open, read, write, fsync, lock — one file at a time</text>

  <!-- ================= disk ================= -->
  <path class="d085a-arrow" d="M 380 958 L 380 982" marker-end="url(#d085a-arrowgreen)" stroke="#047857" />
  <path class="d085a-arrow" d="M 590 958 L 590 982" marker-end="url(#d085a-arrowgreen)" stroke="#047857" />

  <rect class="d085a-disk" x="250" y="984" width="264" height="28" rx="6" />
  <text class="d085a-sub" x="382" y="1003" text-anchor="middle">library.db — the whole database, one file</text>

  <rect class="d085a-disk" x="530" y="984" width="264" height="28" rx="6" />
  <text class="d085a-sub" x="662" y="1003" text-anchor="middle">-journal or -wal — how a crash is survived</text>

  <!-- left-hand rail: what is NOT here -->
  <path class="d085a-thin" d="M 200 240 L 200 958" />
  <text class="d085a-note" x="40" y="266">Not in this picture,</text>
  <text class="d085a-note" x="40" y="286">on purpose:</text>
  <text class="d085a-note" x="40" y="316">no server process</text>
  <text class="d085a-note" x="40" y="336">no network socket</text>
  <text class="d085a-note" x="40" y="356">no port number</text>
  <text class="d085a-note" x="40" y="376">no user accounts</text>
  <text class="d085a-note" x="40" y="396">no password</text>
  <text class="d085a-note" x="40" y="416">no configuration file</text>
  <text class="d085a-note" x="40" y="446">SQLite says it competes</text>
  <text class="d085a-note" x="40" y="466">with fopen, not with a</text>
  <text class="d085a-note" x="40" y="486">client-server database.</text>
  <text class="d085a-note" x="40" y="516">Everything above runs</text>
  <text class="d085a-note" x="40" y="536">at the privilege of the</text>
  <text class="d085a-note" x="40" y="556">program that called it,</text>
  <text class="d085a-note" x="40" y="576">so filesystem permissions</text>
  <text class="d085a-note" x="40" y="596">are the access control.</text>
  <text class="d085a-note" x="40" y="640">The two version numbers</text>
  <text class="d085a-note" x="40" y="660">on your machine come from</text>
  <text class="d085a-note" x="40" y="680">two separate copies of this</text>
  <text class="d085a-note" x="40" y="700">whole stack: one linked into</text>
  <text class="d085a-note" x="40" y="720">the shell, one into Python.</text>
  <text class="d085a-note" x="40" y="740">Both write the same file</text>
  <text class="d085a-note" x="40" y="760">format, which is the point.</text>
</svg>
