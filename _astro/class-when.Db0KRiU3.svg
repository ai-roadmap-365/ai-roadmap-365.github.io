<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to write a class</title>
  <style>
    .class-when-bg   { fill: #f8fafc; }
    .class-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .class-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .class-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .class-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .class-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .class-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .class-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .class-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .class-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .class-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .class-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .class-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .class-when-row { opacity: 1; }
    .class-when-r0 { animation-delay: 0.00s; }
    .class-when-r1 { animation-delay: 0.45s; }
    .class-when-r2 { animation-delay: 0.90s; }
    .class-when-r3 { animation-delay: 1.35s; }
    .class-when-r4 { animation-delay: 1.80s; }
    .class-when-row { animation: class-when-reveal 7.3s ease-in-out infinite; }
    @keyframes class-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="class-when-bg" width="980" height="390"/>
  <text class="class-when-h1"  x="30" y="40">When to write a class</text>
  <text class="class-when-sub" x="30" y="64">And when not to.</text>
  <rect class="class-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="class-when-name" x="46" y="122">Write a class</text>
  <text class="class-when-desc" x="46" y="142">Four signals.</text>
  <text class="class-when-desc class-when-row class-when-r0" x="46" y="182">State and behaviour genuinely belong together</text>
  <text class="class-when-desc class-when-row class-when-r1" x="46" y="216">Several instances with independent state</text>
  <text class="class-when-desc class-when-row class-when-r2" x="46" y="250">Something with a lifecycle</text>
  <text class="class-when-desc class-when-row class-when-r3" x="46" y="284">A protocol a framework expects</text>
  <text class="class-when-desc class-when-row class-when-r4" x="46" y="318">Where a domain concept wants a name</text>
  <rect class="class-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="class-when-name" x="526" y="122">Use something else</text>
  <text class="class-when-desc" x="526" y="142">Also four.</text>
  <text class="class-when-desc class-when-row class-when-r0" x="526" y="182">A function, if there is no state</text>
  <text class="class-when-desc class-when-row class-when-r1" x="526" y="216">A dataclass, for a plain record</text>
  <text class="class-when-desc class-when-row class-when-r2" x="526" y="250">A dictionary, for loose structured data</text>
  <text class="class-when-desc class-when-row class-when-r3" x="526" y="284">A module, for a namespace of functions</text>
  <text class="class-when-desc class-when-row class-when-r4" x="526" y="318">A class with one method is a function</text>
  <text class="class-when-sub" x="30" y="372">A class with one method and no state is the clearest case of over-structuring, and it is a function that has been given ceremony it does not need.</text>
</svg>
