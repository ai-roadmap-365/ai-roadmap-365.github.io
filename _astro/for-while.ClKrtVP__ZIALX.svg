<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By whether you know the count.">
  <title>For against while</title>
  <style>
    .for-while-bg   { fill: #f8fafc; }
    .for-while-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .for-while-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .for-while-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .for-while-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .for-while-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .for-while-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .for-while-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .for-while-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .for-while-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .for-while-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .for-while-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .for-while-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .for-while-row { opacity: 1; }
    .for-while-r0 { animation-delay: 0.00s; }
    .for-while-r1 { animation-delay: 0.45s; }
    .for-while-r2 { animation-delay: 0.90s; }
    .for-while-r3 { animation-delay: 1.35s; }
    .for-while-r4 { animation-delay: 1.80s; }
    .for-while-row { animation: for-while-reveal 7.3s ease-in-out infinite; }
    @keyframes for-while-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="for-while-bg" width="980" height="390"/>
  <text class="for-while-h1"  x="30" y="40">For against while</text>
  <text class="for-while-sub" x="30" y="64">By whether you know the count.</text>
  <rect class="for-while-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="for-while-name" x="46" y="122">For</text>
  <text class="for-while-desc" x="46" y="142">A known collection.</text>
  <text class="for-while-desc for-while-row for-while-r0" x="46" y="182">Iterates over something that ends</text>
  <text class="for-while-desc for-while-row for-while-r1" x="46" y="216">Termination is guaranteed</text>
  <text class="for-while-desc for-while-row for-while-r2" x="46" y="250">No counter to maintain</text>
  <text class="for-while-desc for-while-row for-while-r3" x="46" y="284">The common case by far</text>
  <text class="for-while-desc for-while-row for-while-r4" x="46" y="318">Cannot loop forever</text>
  <rect class="for-while-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="for-while-name" x="526" y="122">While</text>
  <text class="for-while-desc" x="526" y="142">An unknown condition.</text>
  <text class="for-while-desc for-while-row for-while-r0" x="526" y="182">Repeats until a condition changes</text>
  <text class="for-while-desc for-while-row for-while-r1" x="526" y="216">Termination is your responsibility</text>
  <text class="for-while-desc for-while-row for-while-r2" x="526" y="250">State must be updated inside</text>
  <text class="for-while-desc for-while-row for-while-r3" x="526" y="284">Retries, polling, convergence</text>
  <text class="for-while-desc for-while-row for-while-r4" x="526" y="318">Can loop forever if the condition never changes</text>
  <text class="for-while-sub" x="30" y="372">The right column's last row is why a while loop deserves more scrutiny: nothing structural guarantees it ends, so the update has to be checked by eye.</text>
</svg>
