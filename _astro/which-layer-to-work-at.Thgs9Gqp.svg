<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Go down one level only when a measurement tells you to.">
  <title>Work at the highest layer that solves the problem</title>
  <style>
    .which-layer-to-work-at-bg   { fill: #f8fafc; }
    .which-layer-to-work-at-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .which-layer-to-work-at-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .which-layer-to-work-at-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .which-layer-to-work-at-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .which-layer-to-work-at-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .which-layer-to-work-at-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .which-layer-to-work-at-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .which-layer-to-work-at-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .which-layer-to-work-at-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .which-layer-to-work-at-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .which-layer-to-work-at-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .which-layer-to-work-at-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .which-layer-to-work-at-row { opacity: 1; }
    .which-layer-to-work-at-r0 { animation-delay: 0.00s; }
    .which-layer-to-work-at-r1 { animation-delay: 0.45s; }
    .which-layer-to-work-at-r2 { animation-delay: 0.90s; }
    .which-layer-to-work-at-r3 { animation-delay: 1.35s; }
    .which-layer-to-work-at-r4 { animation-delay: 1.80s; }
    .which-layer-to-work-at-row { animation: which-layer-to-work-at-reveal 7.3s ease-in-out infinite; }
    @keyframes which-layer-to-work-at-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="which-layer-to-work-at-bg" width="980" height="390"/>
  <text class="which-layer-to-work-at-h1"  x="30" y="40">Work at the highest layer that solves the problem</text>
  <text class="which-layer-to-work-at-sub" x="30" y="64">Go down one level only when a measurement tells you to.</text>
  <rect class="which-layer-to-work-at-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="which-layer-to-work-at-name" x="46" y="122">Reason about the hardware</text>
  <text class="which-layer-to-work-at-desc" x="46" y="142">The model earns its keep</text>
  <text class="which-layer-to-work-at-desc which-layer-to-work-at-row which-layer-to-work-at-r0" x="46" y="182">Something is slower than it should be</text>
  <text class="which-layer-to-work-at-desc which-layer-to-work-at-row which-layer-to-work-at-r1" x="46" y="216">A program will not fit in memory</text>
  <text class="which-layer-to-work-at-desc which-layer-to-work-at-row which-layer-to-work-at-r2" x="46" y="250">You are choosing hardware to buy or rent</text>
  <text class="which-layer-to-work-at-desc which-layer-to-work-at-row which-layer-to-work-at-r3" x="46" y="284">Explaining why it runs here and not there</text>
  <text class="which-layer-to-work-at-desc which-layer-to-work-at-row which-layer-to-work-at-r4" x="46" y="318">A measurement pointed downward</text>
  <rect class="which-layer-to-work-at-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="which-layer-to-work-at-name" x="526" y="122">Ignore it</text>
  <text class="which-layer-to-work-at-desc" x="526" y="142">The layers exist so you can</text>
  <text class="which-layer-to-work-at-desc which-layer-to-work-at-row which-layer-to-work-at-r0" x="526" y="182">Writing ordinary application code</text>
  <text class="which-layer-to-work-at-desc which-layer-to-work-at-row which-layer-to-work-at-r1" x="526" y="216">Getting a first version working at all</text>
  <text class="which-layer-to-work-at-desc which-layer-to-work-at-row which-layer-to-work-at-r2" x="526" y="250">Reasoning about cache lines in a loading script</text>
  <text class="which-layer-to-work-at-desc which-layer-to-work-at-row which-layer-to-work-at-r3" x="526" y="284">Optimising before anything was measured</text>
  <text class="which-layer-to-work-at-desc which-layer-to-work-at-row which-layer-to-work-at-r4" x="526" y="318">This is how code gets written badly and slowly</text>
  <text class="which-layer-to-work-at-sub" x="30" y="372">The layers below are an abstraction you are meant to forget — until performance makes you remember.</text>
</svg>
