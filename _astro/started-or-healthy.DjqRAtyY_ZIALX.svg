<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Three conditions; the default tells you nothing.">
  <title>Started is not healthy</title>
  <style>
    .started-or-healthy-bg   { fill: #f8fafc; }
    .started-or-healthy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .started-or-healthy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .started-or-healthy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .started-or-healthy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .started-or-healthy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .started-or-healthy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .started-or-healthy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .started-or-healthy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .started-or-healthy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .started-or-healthy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .started-or-healthy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .started-or-healthy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .started-or-healthy-row { opacity: 1; }
    .started-or-healthy-r0 { animation-delay: 0.00s; }
    .started-or-healthy-r1 { animation-delay: 0.45s; }
    .started-or-healthy-r2 { animation-delay: 0.90s; }
    .started-or-healthy-r3 { animation-delay: 1.35s; }
    .started-or-healthy-r4 { animation-delay: 1.80s; }
    .started-or-healthy-row { animation: started-or-healthy-reveal 7.3s ease-in-out infinite; }
    @keyframes started-or-healthy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="started-or-healthy-bg" width="980" height="390"/>
  <text class="started-or-healthy-h1"  x="30" y="40">Started is not healthy</text>
  <text class="started-or-healthy-sub" x="30" y="64">Three conditions; the default tells you nothing.</text>
  <rect class="started-or-healthy-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="started-or-healthy-name" x="46" y="122">service_started</text>
  <text class="started-or-healthy-desc" x="46" y="142">The default.</text>
  <text class="started-or-healthy-desc started-or-healthy-row started-or-healthy-r0" x="46" y="182">The container exists</text>
  <text class="started-or-healthy-desc started-or-healthy-row started-or-healthy-r1" x="46" y="216">Says nothing about readiness</text>
  <text class="started-or-healthy-desc started-or-healthy-row started-or-healthy-r2" x="46" y="250">api usable at 1.2s, postgres at 4.4s</text>
  <text class="started-or-healthy-desc started-or-healthy-row started-or-healthy-r3" x="46" y="284">The first query fails</text>
  <text class="started-or-healthy-desc started-or-healthy-row started-or-healthy-r4" x="46" y="318">Passes on a warm laptop, fails in cold CI</text>
  <rect class="started-or-healthy-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="started-or-healthy-name" x="526" y="122">service_healthy</text>
  <text class="started-or-healthy-desc" x="526" y="142">What "wait for the database" means.</text>
  <text class="started-or-healthy-desc started-or-healthy-row started-or-healthy-r0" x="526" y="182">The healthcheck passed</text>
  <text class="started-or-healthy-desc started-or-healthy-row started-or-healthy-r1" x="526" y="216">Requires an actual healthcheck to exist</text>
  <text class="started-or-healthy-desc started-or-healthy-row started-or-healthy-r2" x="526" y="250">api usable at 5.2s</text>
  <text class="started-or-healthy-desc started-or-healthy-row started-or-healthy-r3" x="526" y="284">Four seconds slower, and it works</text>
  <text class="started-or-healthy-desc started-or-healthy-row started-or-healthy-r4" x="526" y="318">service_completed_successfully for one-shot jobs</text>
  <text class="started-or-healthy-sub" x="30" y="372">The 1.2s figure was never a measurement of when the stack was usable — it was a measurement of when the container existed, and those are different quantities that happen to share a unit.</text>
</svg>
