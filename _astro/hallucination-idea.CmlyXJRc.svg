<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps, none of them a bug.">
  <title>Why models make things up</title>
  <style>
    .hallucination-idea-bg   { fill: #f8fafc; }
    .hallucination-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hallucination-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hallucination-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hallucination-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hallucination-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hallucination-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hallucination-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hallucination-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hallucination-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hallucination-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hallucination-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hallucination-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .hallucination-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .hallucination-idea-stage { opacity: 1; }

    .hallucination-idea-s0 { animation-delay: 0.00s; }
    .hallucination-idea-e0 { animation-delay: 0.00s; }
    .hallucination-idea-s1 { animation-delay: 1.28s; }
    .hallucination-idea-e1 { animation-delay: 1.28s; }
    .hallucination-idea-s2 { animation-delay: 2.56s; }
    .hallucination-idea-e2 { animation-delay: 2.56s; }
    .hallucination-idea-s3 { animation-delay: 3.84s; }
    .hallucination-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .hallucination-idea-conn  { animation: hallucination-idea-trace 6.4s ease-in-out infinite; }
      .hallucination-idea-stage { animation: hallucination-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes hallucination-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes hallucination-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .hallucination-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .hallucination-idea-stage { animation: hallucination-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes hallucination-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="hallucination-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="hallucination-idea-bg" width="980" height="322"/>
  <text class="hallucination-idea-h1"  x="30" y="40">Why models make things up</text>
  <text class="hallucination-idea-sub" x="30" y="64">Four steps, none of them a bug.</text>
  <g class="hallucination-idea-stage hallucination-idea-s0">
    <rect class="hallucination-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="hallucination-idea-step" x="44" y="142">01</text>
    <text class="hallucination-idea-name" x="70" y="142">The model was trained to produce probable text</text>
    <text class="hallucination-idea-desc" x="44" y="166">Never to produce true text.</text>
    <text class="hallucination-idea-desc" x="44" y="182">These differ.</text>
  </g>
  <line class="hallucination-idea-line hallucination-idea-conn hallucination-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#hallucination-idea-tip)"/>
  <g class="hallucination-idea-stage hallucination-idea-s1">
    <rect class="hallucination-idea-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="hallucination-idea-step" x="280" y="142">02</text>
    <text class="hallucination-idea-name" x="306" y="142">A plausible false statement scores well</text>
    <text class="hallucination-idea-desc" x="280" y="166">Because it looks exactly like a</text>
    <text class="hallucination-idea-desc" x="280" y="182">true one.</text>
  </g>
  <line class="hallucination-idea-line hallucination-idea-conn hallucination-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#hallucination-idea-tip)"/>
  <g class="hallucination-idea-stage hallucination-idea-s2">
    <rect class="hallucination-idea-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="hallucination-idea-step" x="516" y="142">03</text>
    <text class="hallucination-idea-name" x="542" y="142">And nothing in the model represents not knowing</text>
    <text class="hallucination-idea-desc" x="516" y="166">There is no internal signal to</text>
    <text class="hallucination-idea-desc" x="516" y="182">check.</text>
  </g>
  <line class="hallucination-idea-line hallucination-idea-conn hallucination-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#hallucination-idea-tip)"/>
  <g class="hallucination-idea-stage hallucination-idea-s3">
    <rect class="hallucination-idea-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="hallucination-idea-step" x="752" y="142">04</text>
    <text class="hallucination-idea-name" x="778" y="142">So the output is fluent and confident either way</text>
    <text class="hallucination-idea-desc" x="752" y="166">Which is what makes it</text>
    <text class="hallucination-idea-desc" x="752" y="182">dangerous.</text>
  </g>
  <text class="hallucination-idea-sub" x="30" y="304">The absence of an internal not-knowing signal is the crux: this is not a model declining to admit uncertainty but one that has no distinct state for it.</text>
</svg>
