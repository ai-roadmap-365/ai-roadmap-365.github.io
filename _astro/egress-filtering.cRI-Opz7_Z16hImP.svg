<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four checks, in order.">
  <title>Filtering egress before the request</title>
  <style>
    .egress-filtering-bg   { fill: #f8fafc; }
    .egress-filtering-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .egress-filtering-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .egress-filtering-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .egress-filtering-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .egress-filtering-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .egress-filtering-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .egress-filtering-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .egress-filtering-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .egress-filtering-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .egress-filtering-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .egress-filtering-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .egress-filtering-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .egress-filtering-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .egress-filtering-stage { opacity: 1; }

    .egress-filtering-s0 { animation-delay: 0.00s; }
    .egress-filtering-e0 { animation-delay: 0.00s; }
    .egress-filtering-s1 { animation-delay: 1.28s; }
    .egress-filtering-e1 { animation-delay: 1.28s; }
    .egress-filtering-s2 { animation-delay: 2.56s; }
    .egress-filtering-e2 { animation-delay: 2.56s; }
    .egress-filtering-s3 { animation-delay: 3.84s; }
    .egress-filtering-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .egress-filtering-conn  { animation: egress-filtering-trace 6.4s ease-in-out infinite; }
      .egress-filtering-stage { animation: egress-filtering-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes egress-filtering-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes egress-filtering-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .egress-filtering-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .egress-filtering-stage { animation: egress-filtering-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes egress-filtering-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="egress-filtering-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="egress-filtering-bg" width="980" height="322"/>
  <text class="egress-filtering-h1"  x="30" y="40">Filtering egress before the request</text>
  <text class="egress-filtering-sub" x="30" y="64">Four checks, in order.</text>
  <g class="egress-filtering-stage egress-filtering-s0">
    <rect class="egress-filtering-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="egress-filtering-step" x="44" y="142">01</text>
    <text class="egress-filtering-name" x="70" y="142">Resolve the hostname first</text>
    <text class="egress-filtering-desc" x="44" y="166">Filtering on the string lets a</text>
    <text class="egress-filtering-desc" x="44" y="182">name resolve to anything.</text>
  </g>
  <line class="egress-filtering-line egress-filtering-conn egress-filtering-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#egress-filtering-tip)"/>
  <g class="egress-filtering-stage egress-filtering-s1">
    <rect class="egress-filtering-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="egress-filtering-step" x="280" y="142">02</text>
    <text class="egress-filtering-name" x="306" y="142">Reject private ranges</text>
    <text class="egress-filtering-desc" x="280" y="166">10.0.0.0/8, 192.168.0.0/16,</text>
    <text class="egress-filtering-desc" x="280" y="182">172.16.0.0/12, loopback.</text>
    <text class="egress-filtering-edge" x="280" y="242">RFC 1918</text>
  </g>
  <line class="egress-filtering-line egress-filtering-conn egress-filtering-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#egress-filtering-tip)"/>
  <g class="egress-filtering-stage egress-filtering-s2">
    <rect class="egress-filtering-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="egress-filtering-step" x="516" y="142">03</text>
    <text class="egress-filtering-name" x="542" y="142">Block the metadata endpoint</text>
    <text class="egress-filtering-desc" x="516" y="166">169.254.169.254 returns cloud</text>
    <text class="egress-filtering-desc" x="516" y="182">credentials to anything inside</text>
    <text class="egress-filtering-desc" x="516" y="198">the VPC.</text>
  </g>
  <line class="egress-filtering-line egress-filtering-conn egress-filtering-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#egress-filtering-tip)"/>
  <g class="egress-filtering-stage egress-filtering-s3">
    <rect class="egress-filtering-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="egress-filtering-step" x="752" y="142">04</text>
    <text class="egress-filtering-name" x="778" y="142">Allowlist protocols</text>
    <text class="egress-filtering-desc" x="752" y="166">https only. No file://, no</text>
    <text class="egress-filtering-desc" x="752" y="182">gopher://, no redirects to</text>
    <text class="egress-filtering-desc" x="752" y="198">either.</text>
  </g>
  <text class="egress-filtering-sub" x="30" y="304">Resolving before checking is the step people omit: a hostname that passes a string filter and resolves to a private address defeats the whole control, and that is the standard SSRF bypass.</text>
</svg>
