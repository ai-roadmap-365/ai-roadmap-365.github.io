<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Stacking</title>
  <style>
    .stacking-bg   { fill: #f8fafc; }
    .stacking-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stacking-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stacking-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stacking-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stacking-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stacking-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stacking-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stacking-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stacking-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stacking-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stacking-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stacking-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .stacking-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .stacking-stage { opacity: 1; }

    .stacking-s0 { animation-delay: 0.00s; }
    .stacking-e0 { animation-delay: 0.00s; }
    .stacking-s1 { animation-delay: 1.28s; }
    .stacking-e1 { animation-delay: 1.28s; }
    .stacking-s2 { animation-delay: 2.56s; }
    .stacking-e2 { animation-delay: 2.56s; }
    .stacking-s3 { animation-delay: 3.84s; }
    .stacking-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .stacking-conn  { animation: stacking-trace 6.4s ease-in-out infinite; }
      .stacking-stage { animation: stacking-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes stacking-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes stacking-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .stacking-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .stacking-stage { animation: stacking-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes stacking-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="stacking-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="stacking-bg" width="980" height="322"/>
  <text class="stacking-h1"  x="30" y="40">Stacking</text>
  <text class="stacking-sub" x="30" y="64">Four steps.</text>
  <g class="stacking-stage stacking-s0">
    <rect class="stacking-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="stacking-step" x="44" y="142">01</text>
    <text class="stacking-name" x="70" y="142">Train several different base models</text>
    <text class="stacking-desc" x="44" y="166">Different families, so they err</text>
    <text class="stacking-desc" x="44" y="182">differently.</text>
  </g>
  <line class="stacking-line stacking-conn stacking-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#stacking-tip)"/>
  <g class="stacking-stage stacking-s1">
    <rect class="stacking-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="stacking-step" x="280" y="142">02</text>
    <text class="stacking-name" x="306" y="142">Collect their out-of-fold predictions</text>
    <text class="stacking-desc" x="280" y="166">Each row predicted by a model</text>
    <text class="stacking-desc" x="280" y="182">that did not train on it.</text>
  </g>
  <line class="stacking-line stacking-conn stacking-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#stacking-tip)"/>
  <g class="stacking-stage stacking-s2">
    <rect class="stacking-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="stacking-step" x="516" y="142">03</text>
    <text class="stacking-name" x="542" y="142">Train a simple meta-model on those predictions</text>
    <text class="stacking-desc" x="516" y="166">Learning when to trust which</text>
    <text class="stacking-desc" x="516" y="182">base model.</text>
  </g>
  <line class="stacking-line stacking-conn stacking-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#stacking-tip)"/>
  <g class="stacking-stage stacking-s3">
    <rect class="stacking-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="stacking-step" x="752" y="142">04</text>
    <text class="stacking-name" x="778" y="142">Which beats any single base model</text>
    <text class="stacking-desc" x="752" y="166">Provided they are genuinely</text>
    <text class="stacking-desc" x="752" y="182">diverse.</text>
  </g>
  <text class="stacking-sub" x="30" y="304">Using in-fold rather than out-of-fold predictions is the classic stacking mistake: the meta-model then learns to trust whichever base model memorised best.</text>
</svg>
