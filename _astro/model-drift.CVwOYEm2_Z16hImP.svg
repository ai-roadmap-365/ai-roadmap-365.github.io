<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Testing a model upgrade</title>
  <style>
    .model-drift-bg   { fill: #f8fafc; }
    .model-drift-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-drift-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-drift-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-drift-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-drift-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-drift-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .model-drift-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .model-drift-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .model-drift-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .model-drift-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .model-drift-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .model-drift-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .model-drift-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .model-drift-stage { opacity: 1; }

    .model-drift-s0 { animation-delay: 0.00s; }
    .model-drift-e0 { animation-delay: 0.00s; }
    .model-drift-s1 { animation-delay: 1.28s; }
    .model-drift-e1 { animation-delay: 1.28s; }
    .model-drift-s2 { animation-delay: 2.56s; }
    .model-drift-e2 { animation-delay: 2.56s; }
    .model-drift-s3 { animation-delay: 3.84s; }
    .model-drift-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .model-drift-conn  { animation: model-drift-trace 6.4s ease-in-out infinite; }
      .model-drift-stage { animation: model-drift-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes model-drift-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes model-drift-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .model-drift-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .model-drift-stage { animation: model-drift-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes model-drift-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="model-drift-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="model-drift-bg" width="980" height="322"/>
  <text class="model-drift-h1"  x="30" y="40">Testing a model upgrade</text>
  <text class="model-drift-sub" x="30" y="64">Four steps.</text>
  <g class="model-drift-stage model-drift-s0">
    <rect class="model-drift-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="model-drift-step" x="44" y="142">01</text>
    <text class="model-drift-name" x="70" y="142">A new model version is announced</text>
    <text class="model-drift-desc" x="44" y="166">Or an existing name silently</text>
    <text class="model-drift-desc" x="44" y="182">starts pointing elsewhere.</text>
  </g>
  <line class="model-drift-line model-drift-conn model-drift-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#model-drift-tip)"/>
  <g class="model-drift-stage model-drift-s1">
    <rect class="model-drift-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="model-drift-step" x="280" y="142">02</text>
    <text class="model-drift-name" x="306" y="142">Run the full suite against both</text>
    <text class="model-drift-desc" x="280" y="166">Same prompts, same cases, side</text>
    <text class="model-drift-desc" x="280" y="182">by side.</text>
  </g>
  <line class="model-drift-line model-drift-conn model-drift-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#model-drift-tip)"/>
  <g class="model-drift-stage model-drift-s2">
    <rect class="model-drift-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="model-drift-step" x="516" y="142">03</text>
    <text class="model-drift-name" x="542" y="142">Review every case that changed</text>
    <text class="model-drift-desc" x="516" y="166">Improvements as well as</text>
    <text class="model-drift-desc" x="516" y="182">regressions.</text>
  </g>
  <line class="model-drift-line model-drift-conn model-drift-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#model-drift-tip)"/>
  <g class="model-drift-stage model-drift-s3">
    <rect class="model-drift-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="model-drift-step" x="752" y="142">04</text>
    <text class="model-drift-name" x="778" y="142">Then cut over gradually</text>
    <text class="model-drift-desc" x="752" y="166">With the old version still</text>
    <text class="model-drift-desc" x="752" y="182">reachable.</text>
  </g>
  <text class="model-drift-sub" x="30" y="304">Reviewing improvements as well as regressions matters more than it sounds: a change that helps on average can break the one case a large customer depends on.</text>
</svg>
