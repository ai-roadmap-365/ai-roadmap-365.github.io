<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when it is not.">
  <title>When sampling is sound</title>
  <style>
    .sample-when-bg   { fill: #f8fafc; }
    .sample-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sample-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sample-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sample-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sample-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sample-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sample-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sample-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sample-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sample-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sample-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sample-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sample-when-row { opacity: 1; }
    .sample-when-r0 { animation-delay: 0.00s; }
    .sample-when-r1 { animation-delay: 0.45s; }
    .sample-when-r2 { animation-delay: 0.90s; }
    .sample-when-r3 { animation-delay: 1.35s; }
    .sample-when-r4 { animation-delay: 1.80s; }
    .sample-when-row { animation: sample-when-reveal 7.3s ease-in-out infinite; }
    @keyframes sample-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="sample-when-bg" width="980" height="390"/>
  <text class="sample-when-h1"  x="30" y="40">When sampling is sound</text>
  <text class="sample-when-sub" x="30" y="64">And when it is not.</text>
  <rect class="sample-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="sample-when-name" x="46" y="122">Sound</text>
  <text class="sample-when-desc" x="46" y="142">Four cases.</text>
  <text class="sample-when-desc sample-when-row sample-when-r0" x="46" y="182">Random selection from a defined population</text>
  <text class="sample-when-desc sample-when-row sample-when-r1" x="46" y="216">Adequate size for the precision needed</text>
  <text class="sample-when-desc sample-when-row sample-when-r2" x="46" y="250">High and unbiased response</text>
  <text class="sample-when-desc sample-when-row sample-when-r3" x="46" y="284">Independent observations</text>
  <text class="sample-when-desc sample-when-row sample-when-r4" x="46" y="318">Clearly stated target population</text>
  <rect class="sample-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="sample-when-name" x="526" y="122">Not sound</text>
  <text class="sample-when-desc" x="526" y="142">Also four.</text>
  <text class="sample-when-desc sample-when-row sample-when-r0" x="526" y="182">Volunteers and convenience samples</text>
  <text class="sample-when-desc sample-when-row sample-when-r1" x="526" y="216">Strong non-response bias</text>
  <text class="sample-when-desc sample-when-row sample-when-r2" x="526" y="250">Clustered or dependent observations</text>
  <text class="sample-when-desc sample-when-row sample-when-r3" x="526" y="284">Undefined population</text>
  <text class="sample-when-desc sample-when-row sample-when-r4" x="526" y="318">Sampling one group, concluding about another</text>
  <text class="sample-when-sub" x="30" y="372">Clustered observations are the technical trap: a thousand measurements from ten sites carry far less information than a thousand independent ones.</text>
</svg>
