<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the project.">
  <title>Which gates when</title>
  <style>
    .gates-when-bg   { fill: #f8fafc; }
    .gates-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gates-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gates-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gates-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gates-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gates-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gates-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gates-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gates-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gates-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gates-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gates-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gates-when-row { opacity: 1; }
    .gates-when-r0 { animation-delay: 0.00s; }
    .gates-when-r1 { animation-delay: 0.45s; }
    .gates-when-r2 { animation-delay: 0.90s; }
    .gates-when-r3 { animation-delay: 1.35s; }
    .gates-when-r4 { animation-delay: 1.80s; }
    .gates-when-row { animation: gates-when-reveal 7.3s ease-in-out infinite; }
    @keyframes gates-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="gates-when-bg" width="980" height="390"/>
  <text class="gates-when-h1"  x="30" y="40">Which gates when</text>
  <text class="gates-when-sub" x="30" y="64">By the project.</text>
  <rect class="gates-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="gates-when-name" x="46" y="122">The project</text>
  <text class="gates-when-desc" x="46" y="142">What it is.</text>
  <text class="gates-when-desc gates-when-row gates-when-r0" x="46" y="182">A shared library</text>
  <text class="gates-when-desc gates-when-row gates-when-r1" x="46" y="216">A production service</text>
  <text class="gates-when-desc gates-when-row gates-when-r2" x="46" y="250">A one-person tool</text>
  <text class="gates-when-desc gates-when-row gates-when-r3" x="46" y="284">An exploratory notebook</text>
  <text class="gates-when-desc gates-when-row gates-when-r4" x="46" y="318">A teaching example</text>
  <rect class="gates-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="gates-when-name" x="526" y="122">The gates</text>
  <text class="gates-when-desc" x="526" y="142">What to run.</text>
  <text class="gates-when-desc gates-when-row gates-when-r0" x="526" y="182">All of them, strictly</text>
  <text class="gates-when-desc gates-when-row gates-when-r1" x="526" y="216">All, plus security scanning</text>
  <text class="gates-when-desc gates-when-row gates-when-r2" x="526" y="250">Formatting and tests</text>
  <text class="gates-when-desc gates-when-row gates-when-r3" x="526" y="284">Formatting only</text>
  <text class="gates-when-desc gates-when-row gates-when-r4" x="526" y="318">Formatting, and clarity over rules</text>
  <text class="gates-when-sub" x="30" y="372">Even the lightest column keeps the formatter, because it costs nothing to run and removes an entire category of pointless discussion.</text>
</svg>
