<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Subcontractors report, and the contractor routes.">
  <title>A general contractor</title>
  <style>
    .contractor-bg   { fill: #f8fafc; }
    .contractor-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .contractor-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .contractor-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .contractor-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .contractor-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .contractor-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .contractor-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .contractor-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .contractor-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .contractor-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .contractor-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .contractor-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .contractor-row { opacity: 1; }
    .contractor-r0 { animation-delay: 0.00s; }
    .contractor-r1 { animation-delay: 0.45s; }
    .contractor-r2 { animation-delay: 0.90s; }
    .contractor-r3 { animation-delay: 1.35s; }
    .contractor-r4 { animation-delay: 1.80s; }
    .contractor-row { animation: contractor-reveal 7.3s ease-in-out infinite; }
    @keyframes contractor-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="contractor-bg" width="980" height="390"/>
  <text class="contractor-h1"  x="30" y="40">A general contractor</text>
  <text class="contractor-sub" x="30" y="64">Subcontractors report, and the contractor routes.</text>
  <rect class="contractor-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="contractor-name" x="46" y="122">With a contractor</text>
  <text class="contractor-desc" x="46" y="142">One coordinator.</text>
  <text class="contractor-desc contractor-row contractor-r0" x="46" y="182">Reads the blueprint, holds the plan</text>
  <text class="contractor-desc contractor-row contractor-r1" x="46" y="216">Subcontractors report their services</text>
  <text class="contractor-desc contractor-row contractor-r2" x="46" y="250">Routes each job to the right trade</text>
  <text class="contractor-desc contractor-row contractor-r3" x="46" y="284">Inspects the result before continuing</text>
  <text class="contractor-desc contractor-row contractor-r4" x="46" y="318">Records progress in one log</text>
  <rect class="contractor-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="contractor-name" x="526" y="122">Without one</text>
  <text class="contractor-desc" x="526" y="142">Everyone talks to everyone.</text>
  <text class="contractor-desc contractor-row contractor-r0" x="526" y="182">The architect calls each trade directly</text>
  <text class="contractor-desc contractor-row contractor-r1" x="526" y="216">No single record of what was done</text>
  <text class="contractor-desc contractor-row contractor-r2" x="526" y="250">Nobody checks work before the next stage</text>
  <text class="contractor-desc contractor-row contractor-r3" x="526" y="284">Scheduling conflicts surface late</text>
  <text class="contractor-desc contractor-row contractor-r4" x="526" y="318">The blueprint drifts from the building</text>
  <text class="contractor-sub" x="30" y="372">The single log is the part that maps onto the audit requirement: because every instruction went through one place, there is one record of what was asked and what came back.</text>
</svg>
