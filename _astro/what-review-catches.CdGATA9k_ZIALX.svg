<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Automate the first column so reviewers can spend their attention on the second.">
  <title>What a machine can check, and what only a person can</title>
  <style>
    .what-review-catches-bg   { fill: #f8fafc; }
    .what-review-catches-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-review-catches-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-review-catches-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-review-catches-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-review-catches-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-review-catches-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .what-review-catches-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .what-review-catches-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .what-review-catches-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .what-review-catches-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .what-review-catches-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .what-review-catches-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .what-review-catches-row { opacity: 1; }
    .what-review-catches-r0 { animation-delay: 0.00s; }
    .what-review-catches-r1 { animation-delay: 0.45s; }
    .what-review-catches-r2 { animation-delay: 0.90s; }
    .what-review-catches-r3 { animation-delay: 1.35s; }
    .what-review-catches-r4 { animation-delay: 1.80s; }
    .what-review-catches-row { animation: what-review-catches-reveal 7.3s ease-in-out infinite; }
    @keyframes what-review-catches-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="what-review-catches-bg" width="980" height="390"/>
  <text class="what-review-catches-h1"  x="30" y="40">What a machine can check, and what only a person can</text>
  <text class="what-review-catches-sub" x="30" y="64">Automate the first column so reviewers can spend their attention on the second.</text>
  <rect class="what-review-catches-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="what-review-catches-name" x="46" y="122">A machine checks this</text>
  <text class="what-review-catches-desc" x="46" y="142">On every push, for free</text>
  <text class="what-review-catches-desc what-review-catches-row what-review-catches-r0" x="46" y="182">Does it compile, do the tests pass</text>
  <text class="what-review-catches-desc what-review-catches-row what-review-catches-r1" x="46" y="216">Formatting and style consistency</text>
  <text class="what-review-catches-desc what-review-catches-row what-review-catches-r2" x="46" y="250">Type errors and known bad patterns</text>
  <text class="what-review-catches-desc what-review-catches-row what-review-catches-r3" x="46" y="284">Security scanners and dependency alerts</text>
  <text class="what-review-catches-desc what-review-catches-row what-review-catches-r4" x="46" y="318">Coverage did not fall</text>
  <rect class="what-review-catches-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="what-review-catches-name" x="526" y="122">Only a person checks this</text>
  <text class="what-review-catches-desc" x="526" y="142">Where the real risk is</text>
  <text class="what-review-catches-desc what-review-catches-row what-review-catches-r0" x="526" y="182">Is this the right approach at all</text>
  <text class="what-review-catches-desc what-review-catches-row what-review-catches-r1" x="526" y="216">Was the scaler fitted on training rows only</text>
  <text class="what-review-catches-desc what-review-catches-row what-review-catches-r2" x="526" y="250">Does the split respect time or group boundaries</text>
  <text class="what-review-catches-desc what-review-catches-row what-review-catches-r3" x="526" y="284">Was the test set touched more than once</text>
  <text class="what-review-catches-desc what-review-catches-row what-review-catches-r4" x="526" y="318">None of these raises an error</text>
  <text class="what-review-catches-sub" x="30" y="372">Machine-learning code can be entirely correct and still produce a meaningless number. That is what review is for.</text>
</svg>
