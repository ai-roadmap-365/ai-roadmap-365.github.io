<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By what they receive.">
  <title>Three kinds of method</title>
  <style>
    .method-kinds-bg   { fill: #f8fafc; }
    .method-kinds-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .method-kinds-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .method-kinds-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .method-kinds-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .method-kinds-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .method-kinds-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .method-kinds-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .method-kinds-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .method-kinds-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .method-kinds-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .method-kinds-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .method-kinds-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .method-kinds-row { opacity: 1; }
    .method-kinds-r0 { animation-delay: 0.00s; }
    .method-kinds-r1 { animation-delay: 0.45s; }
    .method-kinds-r2 { animation-delay: 0.90s; }
    .method-kinds-r3 { animation-delay: 1.35s; }
    .method-kinds-r4 { animation-delay: 1.80s; }
    .method-kinds-row { animation: method-kinds-reveal 7.3s ease-in-out infinite; }
    @keyframes method-kinds-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="method-kinds-bg" width="980" height="390"/>
  <text class="method-kinds-h1"  x="30" y="40">Three kinds of method</text>
  <text class="method-kinds-sub" x="30" y="64">By what they receive.</text>
  <rect class="method-kinds-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="method-kinds-name" x="46" y="122">The kind</text>
  <text class="method-kinds-desc" x="46" y="142">What it receives.</text>
  <text class="method-kinds-desc method-kinds-row method-kinds-r0" x="46" y="182">Instance method — the instance</text>
  <text class="method-kinds-desc method-kinds-row method-kinds-r1" x="46" y="216">Class method — the class</text>
  <text class="method-kinds-desc method-kinds-row method-kinds-r2" x="46" y="250">Static method — nothing</text>
  <text class="method-kinds-desc method-kinds-row method-kinds-r3" x="46" y="284">All three live on the class</text>
  <text class="method-kinds-desc method-kinds-row method-kinds-r4" x="46" y="318">Chosen by what they need</text>
  <rect class="method-kinds-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="method-kinds-name" x="526" y="122">What it is for</text>
  <text class="method-kinds-desc" x="526" y="142">When to use it.</text>
  <text class="method-kinds-desc method-kinds-row method-kinds-r0" x="526" y="182">Anything using the object's state</text>
  <text class="method-kinds-desc method-kinds-row method-kinds-r1" x="526" y="216">Alternative constructors, and subclass-aware behaviour</text>
  <text class="method-kinds-desc method-kinds-row method-kinds-r2" x="526" y="250">A helper that belongs here by topic only</text>
  <text class="method-kinds-desc method-kinds-row method-kinds-r3" x="526" y="284">Grouping, rather than mechanism</text>
  <text class="method-kinds-desc method-kinds-row method-kinds-r4" x="526" y="318">A static method is often a module function</text>
  <text class="method-kinds-sub" x="30" y="372">Alternative constructors are the clearest use of a class method, because they need the class in order to work correctly when subclassed.</text>
</svg>
