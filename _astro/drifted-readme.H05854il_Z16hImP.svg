<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="None of them dramatic.">
  <title>Five ordinary failures</title>
  <style>
    .drifted-readme-bg   { fill: #f8fafc; }
    .drifted-readme-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drifted-readme-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drifted-readme-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drifted-readme-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drifted-readme-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drifted-readme-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .drifted-readme-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .drifted-readme-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .drifted-readme-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .drifted-readme-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .drifted-readme-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .drifted-readme-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .drifted-readme-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .drifted-readme-stage { opacity: 1; }

    .drifted-readme-s0 { animation-delay: 0.00s; }
    .drifted-readme-e0 { animation-delay: 0.00s; }
    .drifted-readme-s1 { animation-delay: 1.33s; }
    .drifted-readme-e1 { animation-delay: 1.33s; }
    .drifted-readme-s2 { animation-delay: 2.67s; }
    .drifted-readme-e2 { animation-delay: 2.67s; }
    .drifted-readme-s3 { animation-delay: 4.00s; }
    .drifted-readme-e3 { animation-delay: 4.00s; }
    .drifted-readme-s4 { animation-delay: 5.33s; }
    .drifted-readme-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .drifted-readme-conn  { animation: drifted-readme-trace 8s ease-in-out infinite; }
      .drifted-readme-stage { animation: drifted-readme-arrive 8s ease-in-out infinite; }
    }
    @keyframes drifted-readme-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes drifted-readme-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .drifted-readme-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .drifted-readme-stage { animation: drifted-readme-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes drifted-readme-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="drifted-readme-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="drifted-readme-bg" width="980" height="322"/>
  <text class="drifted-readme-h1"  x="30" y="40">Five ordinary failures</text>
  <text class="drifted-readme-sub" x="30" y="64">None of them dramatic.</text>
  <g class="drifted-readme-stage drifted-readme-s0">
    <rect class="drifted-readme-warn" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="drifted-readme-step" x="44" y="142">01</text>
    <text class="drifted-readme-name" x="70" y="142">make setup, make serve</text>
    <text class="drifted-readme-desc" x="44" y="166">Renamed once. The reader</text>
    <text class="drifted-readme-desc" x="44" y="182">pastes a command that</text>
    <text class="drifted-readme-desc" x="44" y="198">does not exist.</text>
    <text class="drifted-readme-edge" x="44" y="242">first contact</text>
  </g>
  <line class="drifted-readme-line drifted-readme-conn drifted-readme-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#drifted-readme-tip)"/>
  <g class="drifted-readme-stage drifted-readme-s1">
    <rect class="drifted-readme-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="drifted-readme-step" x="233" y="142">02</text>
    <text class="drifted-readme-name" x="259" y="142">The claimed output is stale</text>
    <text class="drifted-readme-desc" x="233" y="166">Says 0.0.0.0:9000; the</text>
    <text class="drifted-readme-desc" x="233" y="182">service prints</text>
    <text class="drifted-readme-desc" x="233" y="198">127.0.0.1:8080.</text>
  </g>
  <line class="drifted-readme-line drifted-readme-conn drifted-readme-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#drifted-readme-tip)"/>
  <g class="drifted-readme-stage drifted-readme-s2">
    <rect class="drifted-readme-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="drifted-readme-step" x="422" y="142">03</text>
    <text class="drifted-readme-name" x="448" y="142">Architecture: "to be written"</text>
    <text class="drifted-readme-desc" x="422" y="166">Honest, and it tells the</text>
    <text class="drifted-readme-desc" x="422" y="182">reader the document was</text>
    <text class="drifted-readme-desc" x="422" y="198">abandoned.</text>
  </g>
  <line class="drifted-readme-line drifted-readme-conn drifted-readme-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#drifted-readme-tip)"/>
  <g class="drifted-readme-stage drifted-readme-s3">
    <rect class="drifted-readme-warn" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="drifted-readme-step" x="611" y="142">04</text>
    <text class="drifted-readme-name" x="637" y="142">Limitations: simply gone</text>
    <text class="drifted-readme-desc" x="611" y="166">Still English only, still</text>
    <text class="drifted-readme-desc" x="611" y="182">no tenant isolation. Only</text>
    <text class="drifted-readme-desc" x="611" y="198">the sentence was removed.</text>
  </g>
  <line class="drifted-readme-line drifted-readme-conn drifted-readme-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#drifted-readme-tip)"/>
  <g class="drifted-readme-stage drifted-readme-s4">
    <rect class="drifted-readme-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="drifted-readme-step" x="800" y="142">05</text>
    <text class="drifted-readme-name" x="826" y="142">Three commands undocumented</text>
    <text class="drifted-readme-desc" x="800" y="166">A gap, so a warning</text>
    <text class="drifted-readme-desc" x="800" y="182">rather than a failure.</text>
    <text class="drifted-readme-edge" x="800" y="242">warn</text>
  </g>
  <text class="drifted-readme-sub" x="30" y="304">The first is the one that does the most damage: a reader's first interaction with the project is a failure they cannot diagnose, and everything after that is read with suspicion.</text>
</svg>
