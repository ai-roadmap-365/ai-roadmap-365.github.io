<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Lookahead checks what follows, and does not take it.">
  <title>Matching without consuming</title>
  <style>
    .lookahead-bg   { fill: #f8fafc; }
    .lookahead-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lookahead-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lookahead-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lookahead-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lookahead-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lookahead-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lookahead-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .lookahead-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .lookahead-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .lookahead-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .lookahead-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .lookahead-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .lookahead-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .lookahead-stage { opacity: 1; }

    .lookahead-s0 { animation-delay: 0.00s; }
    .lookahead-e0 { animation-delay: 0.00s; }
    .lookahead-s1 { animation-delay: 1.28s; }
    .lookahead-e1 { animation-delay: 1.28s; }
    .lookahead-s2 { animation-delay: 2.56s; }
    .lookahead-e2 { animation-delay: 2.56s; }
    .lookahead-s3 { animation-delay: 3.84s; }
    .lookahead-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .lookahead-conn  { animation: lookahead-trace 6.4s ease-in-out infinite; }
      .lookahead-stage { animation: lookahead-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes lookahead-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes lookahead-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .lookahead-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .lookahead-stage { animation: lookahead-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes lookahead-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="lookahead-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="lookahead-bg" width="980" height="322"/>
  <text class="lookahead-h1"  x="30" y="40">Matching without consuming</text>
  <text class="lookahead-sub" x="30" y="64">Lookahead checks what follows, and does not take it.</text>
  <g class="lookahead-stage lookahead-s0">
    <rect class="lookahead-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="lookahead-step" x="44" y="142">01</text>
    <text class="lookahead-name" x="70" y="142">(?=...) positive lookahead</text>
    <text class="lookahead-desc" x="44" y="166">"Followed by this" — but the</text>
    <text class="lookahead-desc" x="44" y="182">match position does not advance</text>
    <text class="lookahead-desc" x="44" y="198">past it.</text>
    <text class="lookahead-edge" x="44" y="242">(?=)</text>
  </g>
  <line class="lookahead-line lookahead-conn lookahead-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#lookahead-tip)"/>
  <g class="lookahead-stage lookahead-s1">
    <rect class="lookahead-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="lookahead-step" x="280" y="142">02</text>
    <text class="lookahead-name" x="306" y="142">(?!...) negative lookahead</text>
    <text class="lookahead-desc" x="280" y="166">"NOT followed by this." Same</text>
    <text class="lookahead-desc" x="280" y="182">non-consuming behaviour.</text>
    <text class="lookahead-edge" x="280" y="242">(?!)</text>
  </g>
  <line class="lookahead-line lookahead-conn lookahead-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#lookahead-tip)"/>
  <g class="lookahead-stage lookahead-s2">
    <rect class="lookahead-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="lookahead-step" x="516" y="142">03</text>
    <text class="lookahead-name" x="542" y="142">Nothing is captured</text>
    <text class="lookahead-desc" x="516" y="166">Like an anchor, it asserts about</text>
    <text class="lookahead-desc" x="516" y="182">a position rather than matching</text>
    <text class="lookahead-desc" x="516" y="198">text.</text>
  </g>
  <line class="lookahead-line lookahead-conn lookahead-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#lookahead-tip)"/>
  <g class="lookahead-stage lookahead-s3">
    <rect class="lookahead-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="lookahead-step" x="752" y="142">04</text>
    <text class="lookahead-name" x="778" y="142">Useful for exclusion</text>
    <text class="lookahead-desc" x="752" y="166">foo(?!bar) matches foo</text>
    <text class="lookahead-desc" x="752" y="182">everywhere except in foobar.</text>
  </g>
  <text class="lookahead-sub" x="30" y="304">Lookahead is not supported in every flavour — basic grep lacks it entirely — which is one more reason a pattern that works in your editor may not work in a shell pipeline.</text>
</svg>
