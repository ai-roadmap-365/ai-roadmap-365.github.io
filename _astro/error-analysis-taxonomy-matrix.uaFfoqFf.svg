<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <title>Error Analysis Taxonomy Matrix</title>
  <style>
    .bg { fill: var(--bg-surface, #0f172a); }
    .box { fill: var(--bg-subtle, #1e293b); stroke: var(--border-subtle, #334155); stroke-width: 2; rx: 8; }
    .box-step { fill: #1e1b4b; stroke: #6366f1; stroke-width: 2; rx: 8; }
    .text-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: var(--text-primary, #f8fafc); text-anchor: middle; }
    .text-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: var(--text-secondary, #94a3b8); text-anchor: middle; }
    .text-head { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: var(--text-primary, #f8fafc); text-anchor: middle; }
    .wire-active { stroke: #6366f1; stroke-width: 2; fill: none; stroke-dasharray: 6; animation: dash 2s linear infinite; marker-end: url(#arrow-accent); }
    @keyframes dash { to { stroke-dashoffset: -12; } }
    @media (prefers-reduced-motion: reduce) {
      .wire-active { animation: none !important; stroke-dasharray: none; }
    }
  </style>
  <defs>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1" />
    </marker>
  </defs>

  <rect width="900" height="500" class="bg" rx="12" />

  <text x="450" y="40" class="text-head">Andrew Ng's Systematic Error Analysis Workflow</text>
  <text x="450" y="65" class="text-sub">Data-Centric AI: Prioritizing Engineering Effort by Maximum Achievable Ceiling</text>

  <!-- Step 1: Sample Errors -->
  <rect x="50" y="110" width="230" height="150" class="box-step" />
  <text x="165" y="140" class="text-title">1. Sample Errors</text>
  <text x="165" y="170" class="text-sub">Extract 100-500 misclassified</text>
  <text x="165" y="195" class="text-sub">validation samples</text>
  <text x="165" y="220" class="text-sub">(y_true != y_pred)</text>

  <!-- Step 2: Tag Taxonomy -->
  <rect x="335" y="110" width="230" height="150" class="box-step" />
  <text x="450" y="140" class="text-title">2. Tag Taxonomy</text>
  <text x="450" y="170" class="text-sub">Manually inspect and assign</text>
  <text x="450" y="195" class="text-sub">error category tags</text>
  <text x="450" y="220" class="text-sub">(e.g. Label Noise, Blurry)</text>

  <!-- Step 3: Compute Ceilings -->
  <rect x="620" y="110" width="230" height="150" class="box-step" />
  <text x="735" y="140" class="text-title">3. Compute Ceilings</text>
  <text x="735" y="170" class="text-sub">Calculate % of Total Errors</text>
  <text x="735" y="195" class="text-sub">and Max Accuracy Gain:</text>
  <text x="735" y="220" class="text-sub">Delta = Errors_cat / N_total</text>

  <!-- Arrows -->
  <path d="M 280 185 L 335 185" class="wire-active" />
  <path d="M 565 185 L 620 185" class="wire-active" />

  <!-- Bottom: Actionable Outcome -->
  <rect x="100" y="300" width="700" height="150" class="box" />
  <text x="450" y="335" class="text-title">Engineering Decision Matrix</text>
  <text x="130" y="370" class="text-sub" style="text-anchor: start; font-weight: 700; fill: #10b981;">1. High Gain, High Feasibility:</text>
  <text x="350" y="370" class="text-sub" style="text-anchor: start;">Fix label noise in training data (Yields +4.5% accuracy immediately).</text>
  <text x="130" y="405" class="text-sub" style="text-anchor: start; font-weight: 700; fill: #f59e0b;">2. Low Gain, High Effort:</text>
  <text x="350" y="405" class="text-sub" style="text-anchor: start;">Do NOT spend 3 months training a 10B parameter model for a +0.2% gain.</text>
</svg>
