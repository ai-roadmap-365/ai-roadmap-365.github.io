<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Copying the folder works, briefly.">
  <title>The system everyone invents first</title>
  <style>
    .folder-versioning-bg   { fill: #f8fafc; }
    .folder-versioning-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .folder-versioning-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .folder-versioning-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .folder-versioning-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .folder-versioning-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .folder-versioning-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .folder-versioning-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .folder-versioning-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .folder-versioning-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .folder-versioning-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .folder-versioning-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .folder-versioning-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .folder-versioning-row { opacity: 1; }
    .folder-versioning-r0 { animation-delay: 0.00s; }
    .folder-versioning-r1 { animation-delay: 0.45s; }
    .folder-versioning-r2 { animation-delay: 0.90s; }
    .folder-versioning-r3 { animation-delay: 1.35s; }
    .folder-versioning-r4 { animation-delay: 1.80s; }
    .folder-versioning-row { animation: folder-versioning-reveal 7.3s ease-in-out infinite; }
    @keyframes folder-versioning-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="folder-versioning-bg" width="980" height="390"/>
  <text class="folder-versioning-h1"  x="30" y="40">The system everyone invents first</text>
  <text class="folder-versioning-sub" x="30" y="64">Copying the folder works, briefly.</text>
  <rect class="folder-versioning-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="folder-versioning-name" x="46" y="122">Dated copies</text>
  <text class="folder-versioning-desc" x="46" y="142">report_final_v2_ACTUAL.docx</text>
  <text class="folder-versioning-desc folder-versioning-row folder-versioning-r0" x="46" y="182">No record of WHY anything changed</text>
  <text class="folder-versioning-desc folder-versioning-row folder-versioning-r1" x="46" y="216">No way to see what differs between two</text>
  <text class="folder-versioning-desc folder-versioning-row folder-versioning-r2" x="46" y="250">Disk usage grows with every full copy</text>
  <text class="folder-versioning-desc folder-versioning-row folder-versioning-r3" x="46" y="284">Two people produce two divergent trees</text>
  <text class="folder-versioning-desc folder-versioning-row folder-versioning-r4" x="46" y="318">Merging is manual, and by eye</text>
  <rect class="folder-versioning-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="folder-versioning-name" x="526" y="122">Version control</text>
  <text class="folder-versioning-desc" x="526" y="142">One folder, all of history.</text>
  <text class="folder-versioning-desc folder-versioning-row folder-versioning-r0" x="526" y="182">Every change carries a message</text>
  <text class="folder-versioning-desc folder-versioning-row folder-versioning-r1" x="526" y="216">A diff shows exactly what differs</text>
  <text class="folder-versioning-desc folder-versioning-row folder-versioning-r2" x="526" y="250">Only the changes are stored</text>
  <text class="folder-versioning-desc folder-versioning-row folder-versioning-r3" x="526" y="284">Two people can work at once, deliberately</text>
  <text class="folder-versioning-desc folder-versioning-row folder-versioning-r4" x="526" y="318">Merging is assisted, and conflicts are explicit</text>
  <text class="folder-versioning-sub" x="30" y="372">The folder-copy method is not stupid — it is the right instinct, implemented by hand. Version control is that instinct with the bookkeeping automated.</text>
</svg>
