<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 830" width="1120" height="830" role="img" aria-labelledby="d127aTitleId d127aDescId">
  <title id="d127aTitleId">The Cleveland-McGill accuracy ladder, with the same pair of values drawn in every channel</title>
  <desc id="d127aDescId">Seven rungs from most to least accurately judged, each showing the same two values, 40 and 60, encoded in that channel: position on a common scale, position on non-aligned scales, length, angle, area, volume, and colour saturation. Reading down the ladder the same one-and-a-half-to-one ratio becomes progressively harder to recover from the picture.</desc>

  <style>
    .d127a-bg       { fill: #f8fafc; }
    .d127a-title    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 21px; font-weight: 700; fill: #1a202c; }
    .d127a-sub      { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14.5px; fill: #334155; }
    .d127a-name     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 600; fill: #1a202c; }
    .d127a-note     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d127a-rank     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .d127a-tick     { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; fill: #475569; }
    .d127a-caption  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14.5px; fill: #334155; }
    .d127a-axis     { stroke: #64748b; stroke-width: 2; fill: none; }
    .d127a-row      { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
    .d127a-rowalt   { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 1; }
    .d127a-badge    { fill: #1d4ed8; }
    .d127a-badgedim { fill: #94a3b8; }
    .d127a-mark     { fill: #1d4ed8; }
    .d127a-mark2    { fill: #b45309; }
    .d127a-shape    { fill: #bfdbfe; stroke: #1d4ed8; stroke-width: 1.5; }
    .d127a-shape2   { fill: #fde68a; stroke: #b45309; stroke-width: 1.5; }
    .d127a-facetop  { fill: #93c5fd; stroke: #1d4ed8; stroke-width: 1.25; }
    .d127a-faceside { fill: #60a5fa; stroke: #1d4ed8; stroke-width: 1.25; }
    .d127a-facetop2 { fill: #fcd34d; stroke: #b45309; stroke-width: 1.25; }
    .d127a-faceside2{ fill: #f59e0b; stroke: #b45309; stroke-width: 1.25; }
    .d127a-arrow    { stroke: #1d4ed8; stroke-width: 3; fill: none; }
    .d127a-scale    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13.5px; font-weight: 600; fill: #1d4ed8; }
    .d127a-capbox   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.5; }
  </style>

  <defs>
    <marker id="d127a-arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
  </defs>

  <rect class="d127a-bg" x="0" y="0" width="1120" height="830" />

  <text class="d127a-title" x="40" y="42">The same two values, 40 and 60, drawn seven ways</text>
  <text class="d127a-sub" x="40" y="68">Cleveland and McGill ranked these channels by how accurately people read magnitudes off them. Reading down, the ratio gets harder to recover.</text>

  <!-- accuracy arrow down the left edge -->
  <line class="d127a-arrow" x1="24" y1="118" x2="24" y2="722" marker-end="url(#d127a-arrowhead)" />
  <text class="d127a-scale" x="0" y="0" transform="translate(18,300) rotate(-90)">accuracy falls</text>

  <!-- ================= rung 1: position on a common scale ================= -->
  <rect class="d127a-row" x="44" y="108" width="1052" height="84" rx="6" />
  <circle class="d127a-badge" cx="72" cy="150" r="17" /><text class="d127a-rank" x="72" y="156" text-anchor="middle">1</text>
  <text class="d127a-name" x="100" y="145">Position, common scale</text>
  <text class="d127a-note" x="100" y="167">one axis, both marks on it</text>
  <line class="d127a-axis" x1="350" y1="160" x2="662" y2="160" />
  <line class="d127a-axis" x1="350" y1="155" x2="350" y2="165" />
  <line class="d127a-axis" x1="506" y1="155" x2="506" y2="165" />
  <line class="d127a-axis" x1="662" y1="155" x2="662" y2="165" />
  <text class="d127a-tick" x="350" y="182" text-anchor="middle">0</text>
  <text class="d127a-tick" x="506" y="182" text-anchor="middle">40</text>
  <text class="d127a-tick" x="662" y="182" text-anchor="middle">80</text>
  <circle class="d127a-mark" cx="506" cy="141" r="8" />
  <circle class="d127a-mark2" cx="584" cy="141" r="8" />
  <text class="d127a-note" x="720" y="146">Read the ratio off the axis. This is the most</text>
  <text class="d127a-note" x="720" y="166">accurate judgement human vision makes.</text>

  <!-- ================= rung 2: position, non-aligned scales ================= -->
  <rect class="d127a-rowalt" x="44" y="198" width="1052" height="84" rx="6" />
  <circle class="d127a-badge" cx="72" cy="240" r="17" /><text class="d127a-rank" x="72" y="246" text-anchor="middle">2</text>
  <text class="d127a-name" x="100" y="235">Position, separate scales</text>
  <text class="d127a-note" x="100" y="257">small multiples, one axis each</text>
  <line class="d127a-axis" x1="350" y1="252" x2="500" y2="252" />
  <circle class="d127a-mark" cx="425" cy="234" r="8" />
  <line class="d127a-axis" x1="530" y1="232" x2="680" y2="232" />
  <circle class="d127a-mark2" cx="642" cy="214" r="8" />
  <text class="d127a-note" x="720" y="236">Still position, but the eye must carry a value</text>
  <text class="d127a-note" x="720" y="256">from one panel to the next.</text>

  <!-- ================= rung 3: length ================= -->
  <rect class="d127a-row" x="44" y="288" width="1052" height="84" rx="6" />
  <circle class="d127a-badge" cx="72" cy="330" r="17" /><text class="d127a-rank" x="72" y="336" text-anchor="middle">3</text>
  <text class="d127a-name" x="100" y="325">Length</text>
  <text class="d127a-note" x="100" y="347">bars with no shared baseline</text>
  <rect class="d127a-shape" x="360" y="308" width="120" height="20" rx="2" />
  <rect class="d127a-shape2" x="520" y="332" width="180" height="20" rx="2" />
  <text class="d127a-note" x="720" y="326">Comparable, but the reader now measures two</text>
  <text class="d127a-note" x="720" y="346">lengths instead of reading two positions.</text>

  <!-- ================= rung 4: angle and slope ================= -->
  <rect class="d127a-rowalt" x="44" y="378" width="1052" height="84" rx="6" />
  <circle class="d127a-badgedim" cx="72" cy="420" r="17" /><text class="d127a-rank" x="72" y="426" text-anchor="middle">4</text>
  <text class="d127a-name" x="100" y="415">Angle and slope</text>
  <text class="d127a-note" x="100" y="437">pie slices, line steepness</text>
  <circle cx="420" cy="420" r="30" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25" />
  <path class="d127a-shape" d="M 420 420 L 450 420 A 30 30 0 0 1 395.73 437.63 Z" />
  <circle cx="560" cy="420" r="30" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25" />
  <path class="d127a-shape2" d="M 560 420 L 590 420 A 30 30 0 1 1 535.73 402.37 Z" />
  <text class="d127a-note" x="720" y="416">This is the pie chart. Judging angle is measurably</text>
  <text class="d127a-note" x="720" y="436">worse than judging position, and there is no fix.</text>

  <!-- ================= rung 5: area ================= -->
  <rect class="d127a-row" x="44" y="468" width="1052" height="84" rx="6" />
  <circle class="d127a-badgedim" cx="72" cy="510" r="17" /><text class="d127a-rank" x="72" y="516" text-anchor="middle">5</text>
  <text class="d127a-name" x="100" y="505">Area</text>
  <text class="d127a-note" x="100" y="527">bubbles, treemap tiles</text>
  <circle class="d127a-shape" cx="420" cy="510" r="26.1" />
  <circle class="d127a-shape2" cx="545" cy="510" r="32" />
  <text class="d127a-note" x="720" y="506">Scale the AREA and the ratio is honest. Scale the</text>
  <text class="d127a-note" x="720" y="526">radius instead and every ratio comes out squared.</text>

  <!-- ================= rung 6: volume ================= -->
  <rect class="d127a-rowalt" x="44" y="558" width="1052" height="84" rx="6" />
  <circle class="d127a-badgedim" cx="72" cy="600" r="17" /><text class="d127a-rank" x="72" y="606" text-anchor="middle">6</text>
  <text class="d127a-name" x="100" y="595">Volume</text>
  <text class="d127a-note" x="100" y="617">3-D bars, spheres</text>
  <polygon class="d127a-facetop" points="400,583.6 415.4,568.2 453.8,568.2 438.4,583.6" />
  <polygon class="d127a-faceside" points="438.4,583.6 453.8,568.2 453.8,606.6 438.4,622" />
  <rect class="d127a-shape" x="400" y="583.6" width="38.4" height="38.4" />
  <polygon class="d127a-facetop2" points="520,578 537.6,560.4 581.6,560.4 564,578" />
  <polygon class="d127a-faceside2" points="564,578 581.6,560.4 581.6,604 564,622" />
  <rect class="d127a-shape2" x="520" y="578" width="44" height="44" />
  <text class="d127a-note" x="720" y="596">A cubed ratio, plus perspective. Nobody reads a</text>
  <text class="d127a-note" x="720" y="616">quantity off a 3-D bar; they read the label.</text>

  <!-- ================= rung 7: colour saturation ================= -->
  <rect class="d127a-row" x="44" y="648" width="1052" height="84" rx="6" />
  <circle class="d127a-badgedim" cx="72" cy="690" r="17" /><text class="d127a-rank" x="72" y="696" text-anchor="middle">7</text>
  <text class="d127a-name" x="100" y="685">Colour saturation</text>
  <text class="d127a-note" x="100" y="707">heatmap intensity, shading</text>
  <rect x="400" y="672" width="60" height="36" rx="3" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.25" />
  <rect x="520" y="672" width="60" height="36" rx="3" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.25" />
  <text class="d127a-note" x="720" y="686">Good for "roughly where is it dense". Never for</text>
  <text class="d127a-note" x="720" y="706">"is this one one-and-a-half times that one".</text>

  <!-- ================= caption band ================= -->
  <rect class="d127a-capbox" x="44" y="748" width="1052" height="60" rx="8" />
  <text class="d127a-caption" x="66" y="772">Every rung above carries the identical fact: 60 is one and a half times 40. Only the top of the ladder lets a reader recover it.</text>
  <text class="d127a-caption" x="66" y="794">"Bar beats pie" is rung 1 against rung 4 — an experimental result about human vision, not a matter of taste.</text>
</svg>
