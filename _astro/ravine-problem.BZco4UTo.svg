<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Steep across, gentle along.">
  <title>The ill-conditioned ravine</title>
  <style>
    .ravine-problem-bg   { fill: #f8fafc; }
    .ravine-problem-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ravine-problem-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ravine-problem-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ravine-problem-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ravine-problem-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ravine-problem-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ravine-problem-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ravine-problem-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ravine-problem-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ravine-problem-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ravine-problem-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ravine-problem-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ravine-problem-row { opacity: 1; }
    .ravine-problem-r0 { animation-delay: 0.00s; }
    .ravine-problem-r1 { animation-delay: 0.45s; }
    .ravine-problem-r2 { animation-delay: 0.90s; }
    .ravine-problem-r3 { animation-delay: 1.35s; }
    .ravine-problem-r4 { animation-delay: 1.80s; }
    .ravine-problem-row { animation: ravine-problem-reveal 7.3s ease-in-out infinite; }
    @keyframes ravine-problem-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="ravine-problem-bg" width="980" height="390"/>
  <text class="ravine-problem-h1"  x="30" y="40">The ill-conditioned ravine</text>
  <text class="ravine-problem-sub" x="30" y="64">Steep across, gentle along.</text>
  <rect class="ravine-problem-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="ravine-problem-name" x="46" y="122">Vanilla descent</text>
  <text class="ravine-problem-desc" x="46" y="142">Bounces off the walls.</text>
  <text class="ravine-problem-desc ravine-problem-row ravine-problem-r0" x="46" y="182">Steepest descent points across the ravine</text>
  <text class="ravine-problem-desc ravine-problem-row ravine-problem-r1" x="46" y="216">Each step overshoots to the other wall</text>
  <text class="ravine-problem-desc ravine-problem-row ravine-problem-r2" x="46" y="250">Progress along the floor is minimal</text>
  <text class="ravine-problem-desc ravine-problem-row ravine-problem-r3" x="46" y="284">A smaller step rate helps and is slower still</text>
  <text class="ravine-problem-desc ravine-problem-row ravine-problem-r4" x="46" y="318">Most of the movement is wasted</text>
  <rect class="ravine-problem-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="ravine-problem-name" x="526" y="122">With momentum</text>
  <text class="ravine-problem-desc" x="526" y="142">Rolls along the floor.</text>
  <text class="ravine-problem-desc ravine-problem-row ravine-problem-r0" x="526" y="182">Cross-ravine components cancel between steps</text>
  <text class="ravine-problem-desc ravine-problem-row ravine-problem-r1" x="526" y="216">Along-floor components accumulate</text>
  <text class="ravine-problem-desc ravine-problem-row ravine-problem-r2" x="526" y="250">Effective step along the valley grows</text>
  <text class="ravine-problem-desc ravine-problem-row ravine-problem-r3" x="526" y="284">The oscillation damps out</text>
  <text class="ravine-problem-desc ravine-problem-row ravine-problem-r4" x="526" y="318">Progress where progress is possible</text>
  <text class="ravine-problem-sub" x="30" y="372">Ravines are the normal shape of a deep network's loss surface rather than a pathological case, which is why momentum is a default rather than a fix applied when training goes wrong.</text>
</svg>
