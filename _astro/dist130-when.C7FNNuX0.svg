<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the question.">
  <title>Which view when</title>
  <style>
    .dist130-when-bg   { fill: #f8fafc; }
    .dist130-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dist130-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dist130-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dist130-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dist130-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dist130-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dist130-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dist130-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dist130-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dist130-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dist130-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dist130-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dist130-when-row { opacity: 1; }
    .dist130-when-r0 { animation-delay: 0.00s; }
    .dist130-when-r1 { animation-delay: 0.45s; }
    .dist130-when-r2 { animation-delay: 0.90s; }
    .dist130-when-r3 { animation-delay: 1.35s; }
    .dist130-when-r4 { animation-delay: 1.80s; }
    .dist130-when-row { animation: dist130-when-reveal 7.3s ease-in-out infinite; }
    @keyframes dist130-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="dist130-when-bg" width="980" height="390"/>
  <text class="dist130-when-h1"  x="30" y="40">Which view when</text>
  <text class="dist130-when-sub" x="30" y="64">By the question.</text>
  <rect class="dist130-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="dist130-when-name" x="46" y="122">The question</text>
  <text class="dist130-when-desc" x="46" y="142">What you want to know.</text>
  <text class="dist130-when-desc dist130-when-row dist130-when-r0" x="46" y="182">What does this variable look like?</text>
  <text class="dist130-when-desc dist130-when-row dist130-when-r1" x="46" y="216">Do these two move together?</text>
  <text class="dist130-when-desc dist130-when-row dist130-when-r2" x="46" y="250">Does it differ by group?</text>
  <text class="dist130-when-desc dist130-when-row dist130-when-r3" x="46" y="284">Which pairs are worth examining?</text>
  <text class="dist130-when-desc dist130-when-row dist130-when-r4" x="46" y="318">Are there distinct clusters?</text>
  <rect class="dist130-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="dist130-when-name" x="526" y="122">The view</text>
  <text class="dist130-when-desc" x="526" y="142">What to plot.</text>
  <text class="dist130-when-desc dist130-when-row dist130-when-r0" x="526" y="182">A histogram or density plot</text>
  <text class="dist130-when-desc dist130-when-row dist130-when-r1" x="526" y="216">A scatter plot</text>
  <text class="dist130-when-desc dist130-when-row dist130-when-r2" x="526" y="250">A grouped box or violin plot</text>
  <text class="dist130-when-desc dist130-when-row dist130-when-r3" x="526" y="284">A pair plot or correlation matrix</text>
  <text class="dist130-when-desc dist130-when-row dist130-when-r4" x="526" y="318">A scatter plot, coloured by a candidate group</text>
  <text class="dist130-when-sub" x="30" y="372">Colouring a scatter by a candidate grouping is the quickest way to test whether an apparent single population is actually two.</text>
</svg>
