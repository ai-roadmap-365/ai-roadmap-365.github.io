<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Pairwise Evaluation and Position Bias Mitigation">
  <title>Pairwise Evaluation and Position Bias Mitigation</title>
  <defs>
    <style>
      .d311f-bg { fill: #f8fafc; }
      .d311f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d311f-pass1 { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d311f-pass2 { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d311f-ver { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d311f-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d311f-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d311f-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d311f-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d311f-bg" />
  
  <text x="40" y="40" class="d311a-title">Pairwise Evaluation with Positional Bias Mitigation</text>
  <text x="40" y="65" class="d311a-subtitle">Pairwise Evaluation and Position Bias Mitigation showing Forward Pass (A vs B), Swapped Pass (B vs A), Consistency Check, and Final Calibrated Winner</text>
  
  <!-- Pass 1: A vs B -->
  <rect x="40" y="110" width="260" height="270" class="d311f-pass1" />
  <text x="60" y="140" class="d311f-header" fill="#1d4ed8">Pass 1: Forward Ordering</text>
  <text x="60" y="170" class="d311f-text">• Option A = Candidate Model</text>
  <text x="60" y="190" class="d311f-text">• Option B = Baseline Model</text>
  <text x="60" y="220" class="d311f-text" font-weight="600">Judge Prompt:</text>
  <text x="60" y="240" class="d311f-text">"Compare Response A and B."</text>
  <text x="60" y="270" class="d311f-text" font-weight="600">Result 1:</text>
  <text x="60" y="290" class="d311f-text" fill="#1d4ed8">Winner = Option A (Candidate)</text>
  
  <!-- Pass 2: B vs A (Swapped) -->
  <rect x="320" y="110" width="260" height="270" class="d311f-pass2" />
  <text x="340" y="140" class="d311f-header" fill="#7e22ce">Pass 2: Swapped Ordering</text>
  <text x="340" y="170" class="d311f-text">• Option A = Baseline Model</text>
  <text x="340" y="190" class="d311f-text">• Option B = Candidate Model</text>
  <text x="340" y="220" class="d311f-text" font-weight="600">Judge Prompt:</text>
  <text x="340" y="240" class="d311f-text">"Compare Response A and B."</text>
  <text x="340" y="270" class="d311f-text" font-weight="600">Result 2:</text>
  <text x="340" y="290" class="d311f-text" fill="#7e22ce">Winner = Option B (Candidate)</text>
  
  <!-- Verification & Synthesis -->
  <rect x="600" y="110" width="260" height="270" class="d311f-ver" />
  <text x="620" y="140" class="d311f-header" fill="#15803d">Calibrated Synthesis</text>
  <text x="620" y="170" class="d311f-text">• Pass 1 Winner: Candidate</text>
  <text x="620" y="190" class="d311f-text">• Pass 2 Winner: Candidate</text>
  <text x="620" y="220" class="d311f-text" font-weight="600">Consistency Check:</text>
  <text x="620" y="240" class="d311f-text">Consistent (Zero position bias)</text>
  <text x="620" y="270" class="d311f-text" font-weight="600">Final Decision:</text>
  <text x="620" y="290" class="d311f-text" fill="#15803d" font-weight="700">Candidate Wins Pairwise Match</text>
</svg>