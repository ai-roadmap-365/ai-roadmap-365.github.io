<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>Why lexical scoring still matters</title>
  <style>
    .bm25-bg   { fill: #f8fafc; }
    .bm25-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bm25-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bm25-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bm25-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bm25-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bm25-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bm25-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bm25-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bm25-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bm25-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bm25-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bm25-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .bm25-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .bm25-stage { opacity: 1; }

    .bm25-s0 { animation-delay: 0.00s; }
    .bm25-e0 { animation-delay: 0.00s; }
    .bm25-s1 { animation-delay: 1.28s; }
    .bm25-e1 { animation-delay: 1.28s; }
    .bm25-s2 { animation-delay: 2.56s; }
    .bm25-e2 { animation-delay: 2.56s; }
    .bm25-s3 { animation-delay: 3.84s; }
    .bm25-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .bm25-conn  { animation: bm25-trace 6.4s ease-in-out infinite; }
      .bm25-stage { animation: bm25-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes bm25-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes bm25-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .bm25-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .bm25-stage { animation: bm25-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes bm25-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="bm25-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="bm25-bg" width="980" height="322"/>
  <text class="bm25-h1"  x="30" y="40">Why lexical scoring still matters</text>
  <text class="bm25-sub" x="30" y="64">Four properties.</text>
  <g class="bm25-stage bm25-s0">
    <rect class="bm25-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="bm25-step" x="44" y="142">01</text>
    <text class="bm25-name" x="70" y="142">A term appearing more often scores higher</text>
    <text class="bm25-desc" x="44" y="166">With diminishing returns, not</text>
    <text class="bm25-desc" x="44" y="182">linearly.</text>
  </g>
  <line class="bm25-line bm25-conn bm25-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#bm25-tip)"/>
  <g class="bm25-stage bm25-s1">
    <rect class="bm25-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="bm25-step" x="280" y="142">02</text>
    <text class="bm25-name" x="306" y="142">Rare terms weigh more than common ones</text>
    <text class="bm25-desc" x="280" y="166">Which is what makes an unusual</text>
    <text class="bm25-desc" x="280" y="182">word decisive.</text>
  </g>
  <line class="bm25-line bm25-conn bm25-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#bm25-tip)"/>
  <g class="bm25-stage bm25-s2">
    <rect class="bm25-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="bm25-step" x="516" y="142">03</text>
    <text class="bm25-name" x="542" y="142">Normalised by document length</text>
    <text class="bm25-desc" x="516" y="166">So long documents do not win by</text>
    <text class="bm25-desc" x="516" y="182">containing everything.</text>
  </g>
  <line class="bm25-line bm25-conn bm25-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#bm25-tip)"/>
  <g class="bm25-stage bm25-s3">
    <rect class="bm25-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="bm25-step" x="752" y="142">04</text>
    <text class="bm25-name" x="778" y="142">And it finds exactly what embeddings miss</text>
    <text class="bm25-desc" x="752" y="166">Part numbers, names, error</text>
    <text class="bm25-desc" x="752" y="182">codes, quotations.</text>
    <text class="bm25-edge" x="752" y="242">complementary</text>
  </g>
  <text class="bm25-sub" x="30" y="304">The complementarity is the entire argument for hybrid retrieval: a decades-old statistical method finds precisely the queries where dense retrieval is weakest.</text>
</svg>
