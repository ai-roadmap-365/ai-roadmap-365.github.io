<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Aliases, plugins, then a daemon.">
  <title>Three eras of personal tooling</title>
  <style>
    .personal-tooling-eras-bg   { fill: #f8fafc; }
    .personal-tooling-eras-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .personal-tooling-eras-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .personal-tooling-eras-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .personal-tooling-eras-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .personal-tooling-eras-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .personal-tooling-eras-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .personal-tooling-eras-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .personal-tooling-eras-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .personal-tooling-eras-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .personal-tooling-eras-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .personal-tooling-eras-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .personal-tooling-eras-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .personal-tooling-eras-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .personal-tooling-eras-stage { opacity: 1; }

    .personal-tooling-eras-s0 { animation-delay: 0.00s; }
    .personal-tooling-eras-e0 { animation-delay: 0.00s; }
    .personal-tooling-eras-s1 { animation-delay: 1.50s; }
    .personal-tooling-eras-e1 { animation-delay: 1.50s; }
    .personal-tooling-eras-s2 { animation-delay: 3.00s; }
    .personal-tooling-eras-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .personal-tooling-eras-conn  { animation: personal-tooling-eras-trace 6s ease-in-out infinite; }
      .personal-tooling-eras-stage { animation: personal-tooling-eras-arrive 6s ease-in-out infinite; }
    }
    @keyframes personal-tooling-eras-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes personal-tooling-eras-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .personal-tooling-eras-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .personal-tooling-eras-stage { animation: personal-tooling-eras-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes personal-tooling-eras-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="personal-tooling-eras-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="personal-tooling-eras-bg" width="980" height="322"/>
  <text class="personal-tooling-eras-h1"  x="30" y="40">Three eras of personal tooling</text>
  <text class="personal-tooling-eras-sub" x="30" y="64">Aliases, plugins, then a daemon.</text>
  <g class="personal-tooling-eras-stage personal-tooling-eras-s0">
    <rect class="personal-tooling-eras-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="personal-tooling-eras-step" x="44" y="142">01</text>
    <text class="personal-tooling-eras-name" x="70" y="142">Dotfiles and aliases, 1990-2020</text>
    <text class="personal-tooling-eras-desc" x="44" y="166">Personal shortcuts in a shell profile.</text>
    <text class="personal-tooling-eras-desc" x="44" y="182">Terminal only.</text>
  </g>
  <line class="personal-tooling-eras-line personal-tooling-eras-conn personal-tooling-eras-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#personal-tooling-eras-tip)"/>
  <g class="personal-tooling-eras-stage personal-tooling-eras-s1">
    <rect class="personal-tooling-eras-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="personal-tooling-eras-step" x="359" y="142">02</text>
    <text class="personal-tooling-eras-name" x="385" y="142">Editor extensions, 2015-2023</text>
    <text class="personal-tooling-eras-desc" x="359" y="166">Local data into an editor — and a separate</text>
    <text class="personal-tooling-eras-desc" x="359" y="182">codebase per editor.</text>
  </g>
  <line class="personal-tooling-eras-line personal-tooling-eras-conn personal-tooling-eras-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#personal-tooling-eras-tip)"/>
  <g class="personal-tooling-eras-stage personal-tooling-eras-s2">
    <rect class="personal-tooling-eras-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="personal-tooling-eras-step" x="674" y="142">03</text>
    <text class="personal-tooling-eras-name" x="700" y="142">MCP daemons, 2024</text>
    <text class="personal-tooling-eras-desc" x="674" y="166">One server, every client, no editor lock-in.</text>
  </g>
  <text class="personal-tooling-eras-sub" x="30" y="304">The middle era's cost was duplication rather than difficulty: writing the extension was straightforward, and writing it three times for three editors is what stopped most people bothering.</text>
</svg>
