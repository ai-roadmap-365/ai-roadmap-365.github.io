<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Two stages, wrong order</title>
  <style>
    .transposed-bg   { fill: #f8fafc; }
    .transposed-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transposed-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transposed-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transposed-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transposed-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transposed-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .transposed-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .transposed-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .transposed-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .transposed-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .transposed-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .transposed-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .transposed-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .transposed-stage { opacity: 1; }

    .transposed-s0 { animation-delay: 0.00s; }
    .transposed-e0 { animation-delay: 0.00s; }
    .transposed-s1 { animation-delay: 1.28s; }
    .transposed-e1 { animation-delay: 1.28s; }
    .transposed-s2 { animation-delay: 2.56s; }
    .transposed-e2 { animation-delay: 2.56s; }
    .transposed-s3 { animation-delay: 3.84s; }
    .transposed-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .transposed-conn  { animation: transposed-trace 6.4s ease-in-out infinite; }
      .transposed-stage { animation: transposed-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes transposed-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes transposed-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .transposed-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .transposed-stage { animation: transposed-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes transposed-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="transposed-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="transposed-bg" width="980" height="322"/>
  <text class="transposed-h1"  x="30" y="40">Two stages, wrong order</text>
  <text class="transposed-sub" x="30" y="64">Four steps.</text>
  <g class="transposed-stage transposed-s0">
    <rect class="transposed-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="transposed-step" x="44" y="142">01</text>
    <text class="transposed-name" x="70" y="142">Split first, then fit the preprocessing</text>
    <text class="transposed-desc" x="44" y="166">Which is the correct order.</text>
  </g>
  <line class="transposed-line transposed-conn transposed-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#transposed-tip)"/>
  <g class="transposed-stage transposed-s1">
    <rect class="transposed-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="transposed-step" x="280" y="142">02</text>
    <text class="transposed-name" x="306" y="142">Transposed, the preprocessing sees every row</text>
    <text class="transposed-desc" x="280" y="166">Including the held-out ones.</text>
  </g>
  <line class="transposed-line transposed-conn transposed-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#transposed-tip)"/>
  <g class="transposed-stage transposed-s2">
    <rect class="transposed-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="transposed-step" x="516" y="142">03</text>
    <text class="transposed-name" x="542" y="142">So the reported score rises</text>
    <text class="transposed-desc" x="516" y="166">Measurably, and not implausibly.</text>
  </g>
  <line class="transposed-line transposed-conn transposed-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#transposed-tip)"/>
  <g class="transposed-stage transposed-s3">
    <rect class="transposed-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="transposed-step" x="752" y="142">04</text>
    <text class="transposed-name" x="778" y="142">Which is a leak produced purely by ordering</text>
    <text class="transposed-desc" x="752" y="166">With no other mistake anywhere.</text>
  </g>
  <text class="transposed-sub" x="30" y="304">That ordering alone produces the inflation is what makes this worth measuring: nothing else in the code is wrong, and the result is still not true.</text>
</svg>
