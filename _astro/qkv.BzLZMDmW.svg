<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A soft database lookup.">
  <title>Queries, keys and values</title>
  <style>
    .qkv-bg   { fill: #f8fafc; }
    .qkv-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .qkv-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .qkv-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .qkv-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .qkv-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .qkv-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .qkv-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .qkv-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .qkv-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .qkv-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .qkv-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .qkv-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .qkv-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .qkv-stage { opacity: 1; }

    .qkv-s0 { animation-delay: 0.00s; }
    .qkv-e0 { animation-delay: 0.00s; }
    .qkv-s1 { animation-delay: 1.28s; }
    .qkv-e1 { animation-delay: 1.28s; }
    .qkv-s2 { animation-delay: 2.56s; }
    .qkv-e2 { animation-delay: 2.56s; }
    .qkv-s3 { animation-delay: 3.84s; }
    .qkv-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .qkv-conn  { animation: qkv-trace 6.4s ease-in-out infinite; }
      .qkv-stage { animation: qkv-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes qkv-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes qkv-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .qkv-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .qkv-stage { animation: qkv-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes qkv-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="qkv-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="qkv-bg" width="980" height="322"/>
  <text class="qkv-h1"  x="30" y="40">Queries, keys and values</text>
  <text class="qkv-sub" x="30" y="64">A soft database lookup.</text>
  <g class="qkv-stage qkv-s0">
    <rect class="qkv-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="qkv-step" x="44" y="142">01</text>
    <text class="qkv-name" x="70" y="142">Query: what am I looking for?</text>
    <text class="qkv-desc" x="44" y="166">Projected from the position</text>
    <text class="qkv-desc" x="44" y="182">doing the attending.</text>
  </g>
  <line class="qkv-line qkv-conn qkv-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#qkv-tip)"/>
  <g class="qkv-stage qkv-s1">
    <rect class="qkv-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="qkv-step" x="280" y="142">02</text>
    <text class="qkv-name" x="306" y="142">Key: what do I offer?</text>
    <text class="qkv-desc" x="280" y="166">Projected from every position</text>
    <text class="qkv-desc" x="280" y="182">that could be attended to.</text>
  </g>
  <line class="qkv-line qkv-conn qkv-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#qkv-tip)"/>
  <g class="qkv-stage qkv-s2">
    <rect class="qkv-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="qkv-step" x="516" y="142">03</text>
    <text class="qkv-name" x="542" y="142">Value: what do I contribute?</text>
    <text class="qkv-desc" x="516" y="166">The content returned if attended</text>
    <text class="qkv-desc" x="516" y="182">to.</text>
    <text class="qkv-edge" x="516" y="242">content</text>
  </g>
  <line class="qkv-line qkv-conn qkv-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#qkv-tip)"/>
  <g class="qkv-stage qkv-s3">
    <rect class="qkv-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="qkv-step" x="752" y="142">04</text>
    <text class="qkv-name" x="778" y="142">Soft lookup: weighted by match</text>
    <text class="qkv-desc" x="752" y="166">Every value returned, weighted</text>
    <text class="qkv-desc" x="752" y="182">by how well its key matched.</text>
  </g>
  <text class="qkv-sub" x="30" y="304">Separating keys from values is what makes this more than similarity search: what makes a position findable and what it contributes when found are learned independently.</text>
</svg>
