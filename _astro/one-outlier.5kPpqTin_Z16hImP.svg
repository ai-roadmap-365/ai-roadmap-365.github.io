<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>One outlier, three fits</title>
  <style>
    .one-outlier-bg   { fill: #f8fafc; }
    .one-outlier-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-outlier-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-outlier-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-outlier-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-outlier-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-outlier-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .one-outlier-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .one-outlier-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .one-outlier-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .one-outlier-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .one-outlier-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .one-outlier-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .one-outlier-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .one-outlier-stage { opacity: 1; }

    .one-outlier-s0 { animation-delay: 0.00s; }
    .one-outlier-e0 { animation-delay: 0.00s; }
    .one-outlier-s1 { animation-delay: 1.28s; }
    .one-outlier-e1 { animation-delay: 1.28s; }
    .one-outlier-s2 { animation-delay: 2.56s; }
    .one-outlier-e2 { animation-delay: 2.56s; }
    .one-outlier-s3 { animation-delay: 3.84s; }
    .one-outlier-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .one-outlier-conn  { animation: one-outlier-trace 6.4s ease-in-out infinite; }
      .one-outlier-stage { animation: one-outlier-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes one-outlier-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes one-outlier-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .one-outlier-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .one-outlier-stage { animation: one-outlier-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes one-outlier-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="one-outlier-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="one-outlier-bg" width="980" height="322"/>
  <text class="one-outlier-h1"  x="30" y="40">One outlier, three fits</text>
  <text class="one-outlier-sub" x="30" y="64">Four steps.</text>
  <g class="one-outlier-stage one-outlier-s0">
    <rect class="one-outlier-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="one-outlier-step" x="44" y="142">01</text>
    <text class="one-outlier-name" x="70" y="142">Fit three losses to clean data</text>
    <text class="one-outlier-desc" x="44" y="166">They agree closely.</text>
  </g>
  <line class="one-outlier-line one-outlier-conn one-outlier-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#one-outlier-tip)"/>
  <g class="one-outlier-stage one-outlier-s1">
    <rect class="one-outlier-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="one-outlier-step" x="280" y="142">02</text>
    <text class="one-outlier-name" x="306" y="142">Add one extreme point</text>
    <text class="one-outlier-desc" x="280" y="166">A single row, far from the rest.</text>
  </g>
  <line class="one-outlier-line one-outlier-conn one-outlier-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#one-outlier-tip)"/>
  <g class="one-outlier-stage one-outlier-s2">
    <rect class="one-outlier-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="one-outlier-step" x="516" y="142">03</text>
    <text class="one-outlier-name" x="542" y="142">Squared error swings toward it; absolute error barely moves</text>
    <text class="one-outlier-desc" x="516" y="166">And the hybrid sits between</text>
    <text class="one-outlier-desc" x="516" y="182">them.</text>
  </g>
  <line class="one-outlier-line one-outlier-conn one-outlier-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#one-outlier-tip)"/>
  <g class="one-outlier-stage one-outlier-s3">
    <rect class="one-outlier-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="one-outlier-step" x="752" y="142">04</text>
    <text class="one-outlier-name" x="778" y="142">So robustness is a property of the loss</text>
    <text class="one-outlier-desc" x="752" y="166">Not of the algorithm or the</text>
    <text class="one-outlier-desc" x="752" y="182">data.</text>
  </g>
  <text class="one-outlier-sub" x="30" y="304">Locating robustness in the loss rather than in the method is the transferable idea, and it applies unchanged to every model trained by minimising something.</text>
</svg>
