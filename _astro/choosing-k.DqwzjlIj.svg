<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Choosing k</title>
  <style>
    .choosing-k-bg   { fill: #f8fafc; }
    .choosing-k-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .choosing-k-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .choosing-k-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .choosing-k-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .choosing-k-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .choosing-k-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .choosing-k-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .choosing-k-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .choosing-k-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .choosing-k-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .choosing-k-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .choosing-k-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .choosing-k-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .choosing-k-stage { opacity: 1; }

    .choosing-k-s0 { animation-delay: 0.00s; }
    .choosing-k-e0 { animation-delay: 0.00s; }
    .choosing-k-s1 { animation-delay: 1.28s; }
    .choosing-k-e1 { animation-delay: 1.28s; }
    .choosing-k-s2 { animation-delay: 2.56s; }
    .choosing-k-e2 { animation-delay: 2.56s; }
    .choosing-k-s3 { animation-delay: 3.84s; }
    .choosing-k-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .choosing-k-conn  { animation: choosing-k-trace 6.4s ease-in-out infinite; }
      .choosing-k-stage { animation: choosing-k-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes choosing-k-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes choosing-k-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .choosing-k-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .choosing-k-stage { animation: choosing-k-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes choosing-k-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="choosing-k-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="choosing-k-bg" width="980" height="322"/>
  <text class="choosing-k-h1"  x="30" y="40">Choosing k</text>
  <text class="choosing-k-sub" x="30" y="64">Four steps.</text>
  <g class="choosing-k-stage choosing-k-s0">
    <rect class="choosing-k-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="choosing-k-step" x="44" y="142">01</text>
    <text class="choosing-k-name" x="70" y="142">One neighbour fits the training data perfectly</text>
    <text class="choosing-k-desc" x="44" y="166">And is extremely sensitive to</text>
    <text class="choosing-k-desc" x="44" y="182">noise.</text>
  </g>
  <line class="choosing-k-line choosing-k-conn choosing-k-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#choosing-k-tip)"/>
  <g class="choosing-k-stage choosing-k-s1">
    <rect class="choosing-k-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="choosing-k-step" x="280" y="142">02</text>
    <text class="choosing-k-name" x="306" y="142">Many neighbours smooth the boundary</text>
    <text class="choosing-k-desc" x="280" y="166">Until it ignores real local</text>
    <text class="choosing-k-desc" x="280" y="182">structure.</text>
  </g>
  <line class="choosing-k-line choosing-k-conn choosing-k-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#choosing-k-tip)"/>
  <g class="choosing-k-stage choosing-k-s2">
    <rect class="choosing-k-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="choosing-k-step" x="516" y="142">03</text>
    <text class="choosing-k-name" x="542" y="142">So k controls the bias-variance balance directly</text>
    <text class="choosing-k-desc" x="516" y="166">More visibly than in almost any</text>
    <text class="choosing-k-desc" x="516" y="182">other model.</text>
  </g>
  <line class="choosing-k-line choosing-k-conn choosing-k-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#choosing-k-tip)"/>
  <g class="choosing-k-stage choosing-k-s3">
    <rect class="choosing-k-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="choosing-k-step" x="752" y="142">04</text>
    <text class="choosing-k-name" x="778" y="142">Choose it by cross-validation</text>
    <text class="choosing-k-desc" x="752" y="166">And prefer an odd value for two</text>
    <text class="choosing-k-desc" x="752" y="182">classes.</text>
    <text class="choosing-k-edge" x="752" y="242">one parameter</text>
  </g>
  <text class="choosing-k-sub" x="30" y="304">Nowhere else is the bias-variance trade-off controlled by a single interpretable integer, which makes this the best place to build intuition for it.</text>
</svg>
