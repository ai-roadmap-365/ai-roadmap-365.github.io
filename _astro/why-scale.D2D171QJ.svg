<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Softmax saturation.">
  <title>Why the scaling factor exists</title>
  <style>
    .why-scale-bg   { fill: #f8fafc; }
    .why-scale-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-scale-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-scale-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-scale-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-scale-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-scale-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .why-scale-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .why-scale-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .why-scale-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .why-scale-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .why-scale-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .why-scale-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .why-scale-row { opacity: 1; }
    .why-scale-r0 { animation-delay: 0.00s; }
    .why-scale-r1 { animation-delay: 0.45s; }
    .why-scale-r2 { animation-delay: 0.90s; }
    .why-scale-r3 { animation-delay: 1.35s; }
    .why-scale-r4 { animation-delay: 1.80s; }
    .why-scale-row { animation: why-scale-reveal 7.3s ease-in-out infinite; }
    @keyframes why-scale-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="why-scale-bg" width="980" height="390"/>
  <text class="why-scale-h1"  x="30" y="40">Why the scaling factor exists</text>
  <text class="why-scale-sub" x="30" y="64">Softmax saturation.</text>
  <rect class="why-scale-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="why-scale-name" x="46" y="122">Unscaled</text>
  <text class="why-scale-desc" x="46" y="142">Scores grow with dimension.</text>
  <text class="why-scale-desc why-scale-row why-scale-r0" x="46" y="182">Dot products of high-dimensional vectors are large</text>
  <text class="why-scale-desc why-scale-row why-scale-r1" x="46" y="216">Softmax pushes to zero and one</text>
  <text class="why-scale-desc why-scale-row why-scale-r2" x="46" y="250">Which is where its derivative is near zero</text>
  <text class="why-scale-desc why-scale-row why-scale-r3" x="46" y="284">Gradients vanish immediately</text>
  <text class="why-scale-desc why-scale-row why-scale-r4" x="46" y="318">Training does not start</text>
  <rect class="why-scale-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="why-scale-name" x="526" y="122">Scaled</text>
  <text class="why-scale-desc" x="526" y="142">Variance held near one.</text>
  <text class="why-scale-desc why-scale-row why-scale-r0" x="526" y="182">Divide by the square root of the key dimension</text>
  <text class="why-scale-desc why-scale-row why-scale-r1" x="526" y="216">Scores stay in a moderate range</text>
  <text class="why-scale-desc why-scale-row why-scale-r2" x="526" y="250">Softmax retains useful gradient</text>
  <text class="why-scale-desc why-scale-row why-scale-r3" x="526" y="284">Attention distributions stay soft early</text>
  <text class="why-scale-desc why-scale-row why-scale-r4" x="526" y="318">Which is why it is in the name</text>
  <text class="why-scale-sub" x="30" y="372">The variance argument is the derivation: a dot product of d independent unit-variance components has variance d, so dividing by its square root restores unit variance regardless of dimension.</text>
</svg>
