<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Prices fell, usage rose.">
  <title>Four steps in model economics</title>
  <style>
    .cost-history-bg   { fill: #f8fafc; }
    .cost-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cost-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cost-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cost-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cost-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cost-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cost-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cost-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cost-history-stage { opacity: 1; }

    .cost-history-s0 { animation-delay: 0.00s; }
    .cost-history-e0 { animation-delay: 0.00s; }
    .cost-history-s1 { animation-delay: 1.28s; }
    .cost-history-e1 { animation-delay: 1.28s; }
    .cost-history-s2 { animation-delay: 2.56s; }
    .cost-history-e2 { animation-delay: 2.56s; }
    .cost-history-s3 { animation-delay: 3.84s; }
    .cost-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cost-history-conn  { animation: cost-history-trace 6.4s ease-in-out infinite; }
      .cost-history-stage { animation: cost-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cost-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cost-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cost-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cost-history-stage { animation: cost-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cost-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cost-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cost-history-bg" width="980" height="322"/>
  <text class="cost-history-h1"  x="30" y="40">Four steps in model economics</text>
  <text class="cost-history-sub" x="30" y="64">Prices fell, usage rose.</text>
  <g class="cost-history-stage cost-history-s0">
    <rect class="cost-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cost-history-step" x="44" y="142">01</text>
    <text class="cost-history-name" x="70" y="142">Prices high enough to prohibit most uses</text>
    <text class="cost-history-desc" x="44" y="166">Which limited deployment more</text>
    <text class="cost-history-desc" x="44" y="182">than capability did.</text>
  </g>
  <line class="cost-history-line cost-history-conn cost-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cost-history-tip)"/>
  <g class="cost-history-stage cost-history-s1">
    <rect class="cost-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cost-history-step" x="280" y="142">02</text>
    <text class="cost-history-name" x="306" y="142">Falling steadily with competition and efficiency</text>
    <text class="cost-history-desc" x="280" y="166">By orders of magnitude within a</text>
    <text class="cost-history-desc" x="280" y="182">few years.</text>
  </g>
  <line class="cost-history-line cost-history-conn cost-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cost-history-tip)"/>
  <g class="cost-history-stage cost-history-s2">
    <rect class="cost-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cost-history-step" x="516" y="142">03</text>
    <text class="cost-history-name" x="542" y="142">Then caching and batch tiers</text>
    <text class="cost-history-desc" x="516" y="166">Which were about structure</text>
    <text class="cost-history-desc" x="516" y="182">rather than rate.</text>
  </g>
  <line class="cost-history-line cost-history-conn cost-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cost-history-tip)"/>
  <g class="cost-history-stage cost-history-s3">
    <rect class="cost-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cost-history-step" x="752" y="142">04</text>
    <text class="cost-history-name" x="778" y="142">And cost engineering as its own discipline</text>
    <text class="cost-history-desc" x="752" y="166">Routing, caching, model</text>
    <text class="cost-history-desc" x="752" y="182">selection, prompt budgeting.</text>
  </g>
  <text class="cost-history-sub" x="30" y="304">Cheaper tokens did not reduce spending: usage grew faster than prices fell, which is the usual outcome when a constraint is relaxed.</text>
</svg>
