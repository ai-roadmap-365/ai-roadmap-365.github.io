<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Weighting the two errors</title>
  <style>
    .fbeta-bg   { fill: #f8fafc; }
    .fbeta-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fbeta-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fbeta-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fbeta-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fbeta-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fbeta-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fbeta-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fbeta-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fbeta-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fbeta-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fbeta-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fbeta-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .fbeta-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .fbeta-stage { opacity: 1; }

    .fbeta-s0 { animation-delay: 0.00s; }
    .fbeta-e0 { animation-delay: 0.00s; }
    .fbeta-s1 { animation-delay: 1.28s; }
    .fbeta-e1 { animation-delay: 1.28s; }
    .fbeta-s2 { animation-delay: 2.56s; }
    .fbeta-e2 { animation-delay: 2.56s; }
    .fbeta-s3 { animation-delay: 3.84s; }
    .fbeta-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .fbeta-conn  { animation: fbeta-trace 6.4s ease-in-out infinite; }
      .fbeta-stage { animation: fbeta-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes fbeta-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes fbeta-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .fbeta-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .fbeta-stage { animation: fbeta-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes fbeta-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="fbeta-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="fbeta-bg" width="980" height="322"/>
  <text class="fbeta-h1"  x="30" y="40">Weighting the two errors</text>
  <text class="fbeta-sub" x="30" y="64">Four steps.</text>
  <g class="fbeta-stage fbeta-s0">
    <rect class="fbeta-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="fbeta-step" x="44" y="142">01</text>
    <text class="fbeta-name" x="70" y="142">The unweighted score treats both errors equally</text>
    <text class="fbeta-desc" x="44" y="166">Which assumes their costs match.</text>
  </g>
  <line class="fbeta-line fbeta-conn fbeta-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#fbeta-tip)"/>
  <g class="fbeta-stage fbeta-s1">
    <rect class="fbeta-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="fbeta-step" x="280" y="142">02</text>
    <text class="fbeta-name" x="306" y="142">A weighting parameter changes that</text>
    <text class="fbeta-desc" x="280" y="166">One number, scaling recall's</text>
    <text class="fbeta-desc" x="280" y="182">importance.</text>
  </g>
  <line class="fbeta-line fbeta-conn fbeta-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#fbeta-tip)"/>
  <g class="fbeta-stage fbeta-s2">
    <rect class="fbeta-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="fbeta-step" x="516" y="142">03</text>
    <text class="fbeta-name" x="542" y="142">Below one favours precision</text>
    <text class="fbeta-desc" x="516" y="166">Above one favours recall.</text>
  </g>
  <line class="fbeta-line fbeta-conn fbeta-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#fbeta-tip)"/>
  <g class="fbeta-stage fbeta-s3">
    <rect class="fbeta-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="fbeta-step" x="752" y="142">04</text>
    <text class="fbeta-name" x="778" y="142">Chosen from the actual cost ratio</text>
    <text class="fbeta-desc" x="752" y="166">Not from convention.</text>
  </g>
  <text class="fbeta-sub" x="30" y="304">Setting the weight from the measured cost ratio rather than picking a round number is what makes this a decision tool rather than another arbitrary metric.</text>
</svg>
