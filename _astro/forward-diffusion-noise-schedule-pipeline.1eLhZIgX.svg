<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-label="Forward Diffusion Noise Schedule Pipeline">
  <title>Forward Diffusion Noise Schedule Pipeline</title>
  <rect width="100%" height="100%" fill="#f8fafc" />
  
    <style>
      .d281a-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d281a-header { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .d281a-text { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .d281a-accent { fill: #1d4ed8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .d281a-arrow { stroke: #1d4ed8; stroke-width: 2; stroke-linecap: round; marker-end: url(#d281a-arrowhead); }
      .d281a-pulse { animation: d281a-glow 2.5s infinite ease-in-out; }
      @keyframes d281a-glow {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(29, 78, 216, 0.2)); }
        50% { filter: drop-shadow(0 0 6px rgba(29, 78, 216, 0.6)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .d281a-pulse { animation: none; }
      }
    </style>
    
  
    <defs>
      <marker id="d281a-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8" />
      </marker>
    </defs>
    
  
  <g transform="translate(40, 40)">
    <rect class="d281a-box" x="0" y="0" width="200" height="180" />
    <text class="d281a-header" x="15" y="30">Clean Image x0</text>
    <text class="d281a-text" x="15" y="60">• High entropy signal</text>
    <text class="d281a-text" x="15" y="85">• Clear object edges</text>
    <text class="d281a-accent" x="15" y="140">t = 0 (Data space)</text>

    <path class="d281a-arrow" d="M 200 90 L 280 90" />

    <rect class="d281a-box d281a-pulse" x="280" y="0" width="220" height="180" />
    <text class="d281a-header" x="15" y="30">Forward Diffusion q(xt|x0)</text>
    <text class="d281a-text" x="15" y="60">• Gaussian noise addition</text>
    <text class="d281a-text" x="15" y="85">• Closed-form: sqrt(alpha_t)*x0</text>
    <text class="d281a-accent" x="15" y="140">t = 1 ... T (Noise schedule)</text>

    <path class="d281a-arrow" d="M 500 90 L 580 90" />

    <rect class="d281a-box" x="580" y="0" width="200" height="180" />
    <text class="d281a-header" x="15" y="30">Pure Noise xT</text>
    <text class="d281a-text" x="15" y="60">• N(0, I) Distribution</text>
    <text class="d281a-text" x="15" y="85">• Zero semantic data</text>
    <text class="d281a-accent" x="15" y="140">t = T (Prior space)</text>
  </g>

</svg>