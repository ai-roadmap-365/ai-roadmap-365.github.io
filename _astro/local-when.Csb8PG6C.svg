<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when to use a hosted model.">
  <title>When to run locally</title>
  <style>
    .local-when-bg   { fill: #f8fafc; }
    .local-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .local-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .local-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .local-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .local-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .local-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .local-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .local-when-row { opacity: 1; }
    .local-when-r0 { animation-delay: 0.00s; }
    .local-when-r1 { animation-delay: 0.45s; }
    .local-when-r2 { animation-delay: 0.90s; }
    .local-when-r3 { animation-delay: 1.35s; }
    .local-when-r4 { animation-delay: 1.80s; }
    .local-when-row { animation: local-when-reveal 7.3s ease-in-out infinite; }
    @keyframes local-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="local-when-bg" width="980" height="390"/>
  <text class="local-when-h1"  x="30" y="40">When to run locally</text>
  <text class="local-when-sub" x="30" y="64">And when to use a hosted model.</text>
  <rect class="local-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="local-when-name" x="46" y="122">Run locally</text>
  <text class="local-when-desc" x="46" y="142">Four cases.</text>
  <text class="local-when-desc local-when-row local-when-r0" x="46" y="182">Data that cannot leave the machine</text>
  <text class="local-when-desc local-when-row local-when-r1" x="46" y="216">Offline or air-gapped work</text>
  <text class="local-when-desc local-when-row local-when-r2" x="46" y="250">Development and experimentation</text>
  <text class="local-when-desc local-when-row local-when-r3" x="46" y="284">High-volume batch processing</text>
  <text class="local-when-desc local-when-row local-when-r4" x="46" y="318">Where the task is within local capability</text>
  <rect class="local-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="local-when-name" x="526" y="122">Use a hosted model</text>
  <text class="local-when-desc" x="526" y="142">Also four.</text>
  <text class="local-when-desc local-when-row local-when-r0" x="526" y="182">Frontier capability needed</text>
  <text class="local-when-desc local-when-row local-when-r1" x="526" y="216">Serving many concurrent users</text>
  <text class="local-when-desc local-when-row local-when-r2" x="526" y="250">No suitable local hardware</text>
  <text class="local-when-desc local-when-row local-when-r3" x="526" y="284">Spiky or unpredictable load</text>
  <text class="local-when-desc local-when-row local-when-r4" x="526" y="318">Where operations are not wanted</text>
  <text class="local-when-sub" x="30" y="372">Development against a local model and production against a hosted one is a common and sensible split, and the shared API shape is what makes it cost nothing.</text>
</svg>
