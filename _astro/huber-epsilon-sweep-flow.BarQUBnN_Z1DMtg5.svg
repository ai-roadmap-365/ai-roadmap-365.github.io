<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" role="img" aria-labelledby="d149f-title d149f-desc" width="1040" height="660">
  <title id="d149f-title">Huber's epsilon sweeping from absolute-error-like toward the exact least-squares answer</title>
  <desc id="d149f-desc">A bar chart with one bar per value of Huber's epsilon parameter, on data where a single point has been moved 80 units off the line. The bars climb steadily from a slope of 3.0064 at epsilon 1.0 to 3.8010 at epsilon 20 and 100, landing exactly on a dashed reference line marking the plain least-squares slope on the same contaminated data.</desc>
  <style>
    .d149f-bg { fill: #f8fafc; }
    .d149f-title { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 24px; font-weight: 700; }
    .d149f-head { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; }
    .d149f-label { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; }
    .d149f-muted { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d149f-tick { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; }
    .d149f-val { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; }
    .d149f-bar { fill: #93c5fd; stroke: #1d4ed8; stroke-width: 2; }
    .d149f-axis { stroke: #1a202c; stroke-width: 2; }
    .d149f-ols-line { stroke: #1d4ed8; stroke-width: 2; stroke-dasharray: 7 5; }
    .d149f-note { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 2; }
    .d149f-b0 { animation: d149f-rise 7s ease-out 0.00s infinite; }
    .d149f-b1 { animation: d149f-rise 7s ease-out 0.55s infinite; }
    .d149f-b2 { animation: d149f-rise 7s ease-out 1.10s infinite; }
    .d149f-b3 { animation: d149f-rise 7s ease-out 1.65s infinite; }
    .d149f-b4 { animation: d149f-rise 7s ease-out 2.20s infinite; }
    .d149f-b5 { animation: d149f-rise 7s ease-out 2.75s infinite; }
    .d149f-b6 { animation: d149f-rise 7s ease-out 3.30s infinite; }
    @keyframes d149f-rise {
      0%   { opacity: 0.15; }
      8%   { opacity: 1; }
      100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .d149f-b0 { animation: none; opacity: 1; }
      .d149f-b1 { animation: none; opacity: 1; }
      .d149f-b2 { animation: none; opacity: 1; }
      .d149f-b3 { animation: none; opacity: 1; }
      .d149f-b4 { animation: none; opacity: 1; }
      .d149f-b5 { animation: none; opacity: 1; }
      .d149f-b6 { animation: none; opacity: 1; }
    }
  </style>
  <rect class="d149f-bg" x="0" y="0" width="1040" height="660"/>

  <text class="d149f-title" x="520" y="40" text-anchor="middle">One parameter, sliding a fit from absolute-error-like to squared-error-like</text>
  <text class="d149f-muted" x="520" y="66" text-anchor="middle">Same 60-row dataset, same single point moved 80 units off the line, for every value of epsilon shown.</text>

  <line class="d149f-axis" x1="96" y1="470" x2="1000" y2="470"/>
  <line class="d149f-ols-line" x1="96" y1="172.7" x2="1000" y2="172.7"/>
  <text class="d149f-muted" x="96" y="164.7">plain least squares on the same data: slope 3.8010</text>

  <rect class="d149f-bar d149f-b0" x="140" y="434.9" width="70" height="35.1" rx="3"/>
  <rect class="d149f-bar d149f-b1" x="264" y="426.8" width="70" height="43.2" rx="3"/>
  <rect class="d149f-bar d149f-b2" x="388" y="420.3" width="70" height="49.7" rx="3"/>
  <rect class="d149f-bar d149f-b3" x="512" y="407.1" width="70" height="62.9" rx="3"/>
  <rect class="d149f-bar d149f-b4" x="636" y="387.1" width="70" height="82.9" rx="3"/>
  <rect class="d149f-bar d149f-b5" x="760" y="172.7" width="70" height="297.3" rx="3"/>
  <rect class="d149f-bar d149f-b6" x="884" y="172.7" width="70" height="297.3" rx="3"/>

  <text class="d149f-val d149f-b0" x="175" y="424.9" text-anchor="middle">3.0064</text>
  <text class="d149f-val d149f-b1" x="299" y="416.8" text-anchor="middle">3.0308</text>
  <text class="d149f-val d149f-b2" x="423" y="410.3" text-anchor="middle">3.0505</text>
  <text class="d149f-val d149f-b3" x="547" y="397.1" text-anchor="middle">3.0906</text>
  <text class="d149f-val d149f-b4" x="671" y="377.1" text-anchor="middle">3.1511</text>
  <text class="d149f-val d149f-b5" x="795" y="162.7" text-anchor="middle">3.8010</text>
  <text class="d149f-val d149f-b6" x="919" y="162.7" text-anchor="middle">3.8010</text>

  <text class="d149f-tick" x="175" y="494" text-anchor="middle">1.0</text>
  <text class="d149f-tick" x="299" y="494" text-anchor="middle">1.35</text>
  <text class="d149f-tick" x="423" y="494" text-anchor="middle">1.5</text>
  <text class="d149f-tick" x="547" y="494" text-anchor="middle">2.0</text>
  <text class="d149f-tick" x="671" y="494" text-anchor="middle">5.0</text>
  <text class="d149f-tick" x="795" y="494" text-anchor="middle">20</text>
  <text class="d149f-tick" x="919" y="494" text-anchor="middle">100</text>
  <text class="d149f-label" x="548" y="520" text-anchor="middle">Huber's epsilon (threshold between the two loss regimes)</text>

  <rect class="d149f-bar" x="120" y="120" width="26" height="18" rx="3"/>
  <text class="d149f-head" x="156" y="135">fitted slope at that epsilon, on the outlier-contaminated data</text>

  <rect class="d149f-note" x="96" y="536" width="904" height="102" rx="10"/>
  <text class="d149f-label" x="548" y="566" text-anchor="middle">Small epsilon leans on absolute error and barely reacts to the outlier; large epsilon leans on squared error and reacts fully.</text>
  <text class="d149f-label" x="548" y="590" text-anchor="middle">The climb is continuous, not a switch between two modes, and at epsilon 20 and 100 it lands exactly on the OLS slope --</text>
  <text class="d149f-label" x="548" y="614" text-anchor="middle">confirming that Huber's loss becomes squared error exactly once every residual falls inside its threshold.</text>
  <text class="d149f-muted" x="548" y="634" text-anchor="middle">With motion switched off, every bar and every number is already in its final position.</text>
</svg>
