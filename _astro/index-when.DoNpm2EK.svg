<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to add an index</title>
  <style>
    .index-when-bg   { fill: #f8fafc; }
    .index-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .index-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .index-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .index-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .index-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .index-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .index-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .index-when-row { opacity: 1; }
    .index-when-r0 { animation-delay: 0.00s; }
    .index-when-r1 { animation-delay: 0.45s; }
    .index-when-r2 { animation-delay: 0.90s; }
    .index-when-r3 { animation-delay: 1.35s; }
    .index-when-r4 { animation-delay: 1.80s; }
    .index-when-row { animation: index-when-reveal 7.3s ease-in-out infinite; }
    @keyframes index-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="index-when-bg" width="980" height="390"/>
  <text class="index-when-h1"  x="30" y="40">When to add an index</text>
  <text class="index-when-sub" x="30" y="64">And when not to.</text>
  <rect class="index-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="index-when-name" x="46" y="122">Add one</text>
  <text class="index-when-desc" x="46" y="142">Four cases.</text>
  <text class="index-when-desc index-when-row index-when-r0" x="46" y="182">A slow query filters on the column</text>
  <text class="index-when-desc index-when-row index-when-r1" x="46" y="216">A join key is unindexed</text>
  <text class="index-when-desc index-when-row index-when-r2" x="46" y="250">A frequent sort matches its order</text>
  <text class="index-when-desc index-when-row index-when-r3" x="46" y="284">The column is selective</text>
  <text class="index-when-desc index-when-row index-when-r4" x="46" y="318">And you measured before and after</text>
  <rect class="index-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="index-when-name" x="526" y="122">Do not</text>
  <text class="index-when-desc" x="526" y="142">Also four.</text>
  <text class="index-when-desc index-when-row index-when-r0" x="526" y="182">A small table — scanning is fine</text>
  <text class="index-when-desc index-when-row index-when-r1" x="526" y="216">A column with very few distinct values</text>
  <text class="index-when-desc index-when-row index-when-r2" x="526" y="250">A write-heavy table with rare reads</text>
  <text class="index-when-desc index-when-row index-when-r3" x="526" y="284">Speculatively, without measuring</text>
  <text class="index-when-desc index-when-row index-when-r4" x="526" y="318">Where one already covers the columns</text>
  <text class="index-when-sub" x="30" y="372">Measuring before and after is the discipline that separates indexing from guesswork, and the query plan is the measurement that actually answers the question.</text>
</svg>
