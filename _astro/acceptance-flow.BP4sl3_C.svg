<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" role="img"
     aria-labelledby="d140f-title d140f-desc">
  <title id="d140f-title">A study directory passing through the eight acceptance gates, with one gate failing</title>
  <desc id="d140f-desc">A study directory on the left feeds into a column of eight gates. Seven are green
    and one, the uncertainty gate, is red. A token travels down the column in order, and each gate brightens
    as it is reached. The verdict on the right reads NOT ACCEPTED and quotes the finding.</desc>

  <style>
    .d140f-bg    { fill: #f8fafc; }
    .d140f-t     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a202c; }
    .d140f-head  { font-size: 21px; font-weight: 700; }
    .d140f-sub   { font-size: 14px; fill: #475569; }
    .d140f-dir   { fill: #ffffff; stroke: #1d4ed8; stroke-width: 1.6; }
    .d140f-dirn  { font-size: 15px; font-weight: 600; }
    .d140f-file  { font-size: 14px; fill: #334155; }
    .d140f-gname { font-size: 15px; font-weight: 600; }
    .d140f-mark  { font-size: 15px; font-weight: 700; }
    .d140f-vbox  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.8; }
    .d140f-vhead { font-size: 17px; font-weight: 700; fill: #7f1d1d; }
    .d140f-vtext { font-size: 14px; fill: #1a202c; }

    .d140f-pass  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .d140f-fail  { fill: #fecaca; stroke: #b91c1c; stroke-width: 1.8; }

    /* A flowing connection: the study entering the harness. */
    .d140f-wire  { stroke: #1d4ed8; stroke-width: 2.4; fill: none;
                   stroke-dasharray: 10 8;
                   animation: d140f-march 1.6s linear infinite; }
    @keyframes d140f-march { to { stroke-dashoffset: -18 } }

    /* The token walking down the gate column, one gate per second. */
    .d140f-token { animation: d140f-walk 8s linear infinite; }
    @keyframes d140f-walk {
      0%   { transform: translateY(0) }
      100% { transform: translateY(434px) }
    }

    /* Each gate brightens as the token reaches it. The resting fill already
       says pass or fail, so the still frame loses nothing. */
    .d140f-lit      { animation: d140f-liftpass 8s ease-in-out infinite; }
    .d140f-litfail  { animation: d140f-liftfail 8s ease-in-out infinite; }
    @keyframes d140f-liftpass {
      0%, 8%, 100% { fill: #dcfce7 }
      2%, 6%       { fill: #86efac }
    }
    @keyframes d140f-liftfail {
      0%, 8%, 100% { fill: #fecaca }
      2%, 6%       { fill: #fca5a5 }
    }
    .d140f-g1 { animation-delay: 0s }
    .d140f-g2 { animation-delay: 1s }
    .d140f-g3 { animation-delay: 2s }
    .d140f-g4 { animation-delay: 3s }
    .d140f-g5 { animation-delay: 4s }
    .d140f-g6 { animation-delay: 5s }
    .d140f-g7 { animation-delay: 6s }
    .d140f-g8 { animation-delay: 7s }

    /* The verdict settles at the end of each cycle. */
    .d140f-settle { animation: d140f-settle 8s ease-in-out infinite; }
    @keyframes d140f-settle {
      0%, 88%, 100% { stroke-width: 1.8 }
      92%, 96%      { stroke-width: 3.4 }
    }

    @media (prefers-reduced-motion: reduce) {
      .d140f-wire     { animation: none; stroke-dasharray: none }
      .d140f-token    { animation: none; transform: none }
      .d140f-lit      { animation: none; fill: #dcfce7 }
      .d140f-litfail  { animation: none; fill: #fecaca }
      .d140f-settle   { animation: none; stroke-width: 1.8 }
    }
  </style>

  <rect class="d140f-bg" x="0" y="0" width="980" height="700"/>

  <text class="d140f-t d140f-head" x="36" y="40">check_study — eight gates, and a verdict you can act on</text>
  <text class="d140f-t d140f-sub" x="36" y="63">Every gate runs. The harness never stops at the first failure, because a verdict is a task list, not an exception.</text>

  <defs>
    <marker id="d140f-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- The study directory -->
  <rect class="d140f-dir" x="36" y="92" width="212" height="304" rx="6"/>
  <text class="d140f-t d140f-dirn" x="52" y="118">study/</text>
  <text class="d140f-t d140f-file" x="52" y="144">QUESTION.md</text>
  <text class="d140f-t d140f-file" x="52" y="166">SOURCE.json</text>
  <text class="d140f-t d140f-file" x="52" y="188">INGEST.json</text>
  <text class="d140f-t d140f-file" x="52" y="210">CLEANING.md</text>
  <text class="d140f-t d140f-file" x="52" y="232">RESEARCH_LOG.md</text>
  <text class="d140f-t d140f-file" x="52" y="254">FIGURES.json</text>
  <text class="d140f-t d140f-file" x="52" y="276">REPORT.md</text>
  <text class="d140f-t d140f-file" x="52" y="298">MANIFEST.json</text>
  <text class="d140f-t d140f-file" x="52" y="320">data/</text>
  <text class="d140f-t d140f-file" x="52" y="342">figures/</text>
  <text class="d140f-t d140f-sub"  x="52" y="374">read, never executed</text>

  <path class="d140f-wire" d="M 248 244 L 286 244 L 286 118 L 316 118"
        marker-end="url(#d140f-arrow)"/>

  <!-- The eight gates -->
  <rect class="d140f-pass d140f-lit d140f-g1" x="324" y="96" width="352" height="44" rx="6"/>
  <text class="d140f-t d140f-gname" x="344" y="124">1. question_recorded</text>
  <text class="d140f-t d140f-mark" x="652" y="124" text-anchor="end" fill="#15803d">PASS</text>

  <rect class="d140f-pass d140f-lit d140f-g2" x="324" y="158" width="352" height="44" rx="6"/>
  <text class="d140f-t d140f-gname" x="344" y="186">2. provenance_complete</text>
  <text class="d140f-t d140f-mark" x="652" y="186" text-anchor="end" fill="#15803d">PASS</text>

  <rect class="d140f-pass d140f-lit d140f-g3" x="324" y="220" width="352" height="44" rx="6"/>
  <text class="d140f-t d140f-gname" x="344" y="248">3. grain_asserted</text>
  <text class="d140f-t d140f-mark" x="652" y="248" text-anchor="end" fill="#15803d">PASS</text>

  <rect class="d140f-pass d140f-lit d140f-g4" x="324" y="282" width="352" height="44" rx="6"/>
  <text class="d140f-t d140f-gname" x="344" y="310">4. damage_report_quantified</text>
  <text class="d140f-t d140f-mark" x="652" y="310" text-anchor="end" fill="#15803d">PASS</text>

  <rect class="d140f-pass d140f-lit d140f-g5" x="324" y="344" width="352" height="44" rx="6"/>
  <text class="d140f-t d140f-gname" x="344" y="372">5. confirmation_untouched</text>
  <text class="d140f-t d140f-mark" x="652" y="372" text-anchor="end" fill="#15803d">PASS</text>

  <rect class="d140f-fail d140f-litfail d140f-g6" x="324" y="406" width="352" height="44" rx="6"/>
  <text class="d140f-t d140f-gname" x="344" y="434">6. uncertainty_reported</text>
  <text class="d140f-t d140f-mark" x="652" y="434" text-anchor="end" fill="#b91c1c">FAIL</text>

  <rect class="d140f-pass d140f-lit d140f-g7" x="324" y="468" width="352" height="44" rx="6"/>
  <text class="d140f-t d140f-gname" x="344" y="496">7. figures_documented</text>
  <text class="d140f-t d140f-mark" x="652" y="496" text-anchor="end" fill="#15803d">PASS</text>

  <rect class="d140f-pass d140f-lit d140f-g8" x="324" y="530" width="352" height="44" rx="6"/>
  <text class="d140f-t d140f-gname" x="344" y="558">8. outputs_reproducible</text>
  <text class="d140f-t d140f-mark" x="652" y="558" text-anchor="end" fill="#15803d">PASS</text>

  <!-- The token walking the column -->
  <circle class="d140f-token" cx="306" cy="118" r="9" fill="#1d4ed8"/>

  <!-- The verdict -->
  <path class="d140f-wire" d="M 676 328 L 712 328" marker-end="url(#d140f-arrow)"/>
  <rect class="d140f-vbox d140f-settle" x="720" y="228" width="228" height="200" rx="8"/>
  <text class="d140f-t d140f-vhead"  x="736" y="258">NOT ACCEPTED</text>
  <text class="d140f-t d140f-vtext"  x="736" y="284">7 of 8 gates pass.</text>
  <text class="d140f-t d140f-vtext"  x="736" y="308">One finding:</text>
  <text class="d140f-t d140f-vtext"  x="736" y="334">REPORT.md: estimate</text>
  <text class="d140f-t d140f-vtext"  x="736" y="354">reported without an</text>
  <text class="d140f-t d140f-vtext"  x="736" y="374">interval —</text>
  <text class="d140f-t d140f-vtext"  x="736" y="394">“Roadside stations</text>
  <text class="d140f-t d140f-vtext"  x="736" y="414">recorded a mean...”</text>

  <text class="d140f-t d140f-sub" x="36" y="618">A harness that only ever passes teaches nothing. This one names the file, and then the sentence inside it.</text>
  <text class="d140f-t d140f-sub" x="36" y="642">Fix that one sentence and the same study is accepted — which is the point: the finding is a task, not a grade.</text>
</svg>
