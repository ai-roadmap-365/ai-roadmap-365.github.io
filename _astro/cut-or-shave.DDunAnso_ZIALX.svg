<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Six things at two-thirds finishes none.">
  <title>Cut whole commitments, never shave</title>
  <style>
    .cut-or-shave-bg   { fill: #f8fafc; }
    .cut-or-shave-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cut-or-shave-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cut-or-shave-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cut-or-shave-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cut-or-shave-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cut-or-shave-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cut-or-shave-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cut-or-shave-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cut-or-shave-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cut-or-shave-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cut-or-shave-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cut-or-shave-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cut-or-shave-row { opacity: 1; }
    .cut-or-shave-r0 { animation-delay: 0.00s; }
    .cut-or-shave-r1 { animation-delay: 0.45s; }
    .cut-or-shave-r2 { animation-delay: 0.90s; }
    .cut-or-shave-r3 { animation-delay: 1.35s; }
    .cut-or-shave-r4 { animation-delay: 1.80s; }
    .cut-or-shave-row { animation: cut-or-shave-reveal 7.3s ease-in-out infinite; }
    @keyframes cut-or-shave-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cut-or-shave-bg" width="980" height="390"/>
  <text class="cut-or-shave-h1"  x="30" y="40">Cut whole commitments, never shave</text>
  <text class="cut-or-shave-sub" x="30" y="64">Six things at two-thirds finishes none.</text>
  <rect class="cut-or-shave-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cut-or-shave-name" x="46" y="122">Cut</text>
  <text class="cut-or-shave-desc" x="46" y="142">Fewer things, finished.</text>
  <text class="cut-or-shave-desc cut-or-shave-row cut-or-shave-r0" x="46" y="182">Two commitments at full hours</text>
  <text class="cut-or-shave-desc cut-or-shave-row cut-or-shave-r1" x="46" y="216">Each produces its artifact</text>
  <text class="cut-or-shave-desc cut-or-shave-row cut-or-shave-r2" x="46" y="250">Progress is visible in week three</text>
  <text class="cut-or-shave-desc cut-or-shave-row cut-or-shave-r3" x="46" y="284">The dropped items are named</text>
  <text class="cut-or-shave-desc cut-or-shave-row cut-or-shave-r4" x="46" y="318">You know what you chose not to do</text>
  <rect class="cut-or-shave-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cut-or-shave-name" x="526" y="122">Shave</text>
  <text class="cut-or-shave-desc" x="526" y="142">Six things, none finished.</text>
  <text class="cut-or-shave-desc cut-or-shave-row cut-or-shave-r0" x="526" y="182">Every commitment at two-thirds</text>
  <text class="cut-or-shave-desc cut-or-shave-row cut-or-shave-r1" x="526" y="216">No artifact reaches completion</text>
  <text class="cut-or-shave-desc cut-or-shave-row cut-or-shave-r2" x="526" y="250">Behind on all six simultaneously</text>
  <text class="cut-or-shave-desc cut-or-shave-row cut-or-shave-r3" x="526" y="284">Nothing was formally dropped</text>
  <text class="cut-or-shave-desc cut-or-shave-row cut-or-shave-r4" x="526" y="318">The cut happens later, by accident</text>
  <text class="cut-or-shave-sub" x="30" y="372">Avoiding the cut does not prevent it. It moves it to week three and hands the choice to whichever week happened to be busy, which is a worse selection process than any you would design.</text>
</svg>
