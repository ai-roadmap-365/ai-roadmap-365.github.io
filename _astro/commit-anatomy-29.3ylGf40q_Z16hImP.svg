<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A snapshot, and everything needed to place it in history.">
  <title>What one commit records</title>
  <style>
    .commit-anatomy-29-bg   { fill: #f8fafc; }
    .commit-anatomy-29-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .commit-anatomy-29-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .commit-anatomy-29-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .commit-anatomy-29-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .commit-anatomy-29-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .commit-anatomy-29-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .commit-anatomy-29-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .commit-anatomy-29-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .commit-anatomy-29-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .commit-anatomy-29-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .commit-anatomy-29-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .commit-anatomy-29-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .commit-anatomy-29-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .commit-anatomy-29-stage { opacity: 1; }

    .commit-anatomy-29-s0 { animation-delay: 0.00s; }
    .commit-anatomy-29-e0 { animation-delay: 0.00s; }
    .commit-anatomy-29-s1 { animation-delay: 1.28s; }
    .commit-anatomy-29-e1 { animation-delay: 1.28s; }
    .commit-anatomy-29-s2 { animation-delay: 2.56s; }
    .commit-anatomy-29-e2 { animation-delay: 2.56s; }
    .commit-anatomy-29-s3 { animation-delay: 3.84s; }
    .commit-anatomy-29-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .commit-anatomy-29-conn  { animation: commit-anatomy-29-trace 6.4s ease-in-out infinite; }
      .commit-anatomy-29-stage { animation: commit-anatomy-29-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes commit-anatomy-29-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes commit-anatomy-29-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .commit-anatomy-29-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .commit-anatomy-29-stage { animation: commit-anatomy-29-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes commit-anatomy-29-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="commit-anatomy-29-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="commit-anatomy-29-bg" width="980" height="322"/>
  <text class="commit-anatomy-29-h1"  x="30" y="40">What one commit records</text>
  <text class="commit-anatomy-29-sub" x="30" y="64">A snapshot, and everything needed to place it in history.</text>
  <g class="commit-anatomy-29-stage commit-anatomy-29-s0">
    <rect class="commit-anatomy-29-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="commit-anatomy-29-step" x="44" y="142">01</text>
    <text class="commit-anatomy-29-name" x="70" y="142">The snapshot</text>
    <text class="commit-anatomy-29-desc" x="44" y="166">The state of every tracked file</text>
    <text class="commit-anatomy-29-desc" x="44" y="182">at this moment. Not a diff — a</text>
    <text class="commit-anatomy-29-desc" x="44" y="198">full picture.</text>
    <text class="commit-anatomy-29-edge" x="44" y="242">contents</text>
  </g>
  <line class="commit-anatomy-29-line commit-anatomy-29-conn commit-anatomy-29-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#commit-anatomy-29-tip)"/>
  <g class="commit-anatomy-29-stage commit-anatomy-29-s1">
    <rect class="commit-anatomy-29-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="commit-anatomy-29-step" x="280" y="142">02</text>
    <text class="commit-anatomy-29-name" x="306" y="142">Author and time</text>
    <text class="commit-anatomy-29-desc" x="280" y="166">Who made it and when. Permanent,</text>
    <text class="commit-anatomy-29-desc" x="280" y="182">and public in an open</text>
    <text class="commit-anatomy-29-desc" x="280" y="198">repository.</text>
  </g>
  <line class="commit-anatomy-29-line commit-anatomy-29-conn commit-anatomy-29-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#commit-anatomy-29-tip)"/>
  <g class="commit-anatomy-29-stage commit-anatomy-29-s2">
    <rect class="commit-anatomy-29-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="commit-anatomy-29-step" x="516" y="142">03</text>
    <text class="commit-anatomy-29-name" x="542" y="142">The message</text>
    <text class="commit-anatomy-29-desc" x="516" y="166">Why. The one part a machine</text>
    <text class="commit-anatomy-29-desc" x="516" y="182">cannot reconstruct later.</text>
    <text class="commit-anatomy-29-edge" x="516" y="242">why</text>
  </g>
  <line class="commit-anatomy-29-line commit-anatomy-29-conn commit-anatomy-29-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#commit-anatomy-29-tip)"/>
  <g class="commit-anatomy-29-stage commit-anatomy-29-s3">
    <rect class="commit-anatomy-29-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="commit-anatomy-29-step" x="752" y="142">04</text>
    <text class="commit-anatomy-29-name" x="778" y="142">The parent</text>
    <text class="commit-anatomy-29-desc" x="752" y="166">The commit immediately before.</text>
    <text class="commit-anatomy-29-desc" x="752" y="182">This link is what turns</text>
    <text class="commit-anatomy-29-desc" x="752" y="198">snapshots into history.</text>
    <text class="commit-anatomy-29-edge" x="752" y="242">parent</text>
  </g>
  <text class="commit-anatomy-29-sub" x="30" y="304">The parent pointer is the whole structure: because every commit names the one before it, the chain of pointers IS the history, and no separate index of order is needed.</text>
</svg>
