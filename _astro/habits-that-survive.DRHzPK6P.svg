<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The cheap ones, ranked.">
  <title>Which habits survive without a course</title>
  <style>
    .habits-that-survive-bg   { fill: #f8fafc; }
    .habits-that-survive-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .habits-that-survive-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .habits-that-survive-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .habits-that-survive-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .habits-that-survive-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .habits-that-survive-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .habits-that-survive-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .habits-that-survive-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .habits-that-survive-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .habits-that-survive-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .habits-that-survive-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .habits-that-survive-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .habits-that-survive-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .habits-that-survive-stage { opacity: 1; }

    .habits-that-survive-s0 { animation-delay: 0.00s; }
    .habits-that-survive-e0 { animation-delay: 0.00s; }
    .habits-that-survive-s1 { animation-delay: 1.28s; }
    .habits-that-survive-e1 { animation-delay: 1.28s; }
    .habits-that-survive-s2 { animation-delay: 2.56s; }
    .habits-that-survive-e2 { animation-delay: 2.56s; }
    .habits-that-survive-s3 { animation-delay: 3.84s; }
    .habits-that-survive-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .habits-that-survive-conn  { animation: habits-that-survive-trace 6.4s ease-in-out infinite; }
      .habits-that-survive-stage { animation: habits-that-survive-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes habits-that-survive-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes habits-that-survive-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .habits-that-survive-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .habits-that-survive-stage { animation: habits-that-survive-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes habits-that-survive-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="habits-that-survive-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="habits-that-survive-bg" width="980" height="322"/>
  <text class="habits-that-survive-h1"  x="30" y="40">Which habits survive without a course</text>
  <text class="habits-that-survive-sub" x="30" y="64">The cheap ones, ranked.</text>
  <g class="habits-that-survive-stage habits-that-survive-s0">
    <rect class="habits-that-survive-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="habits-that-survive-step" x="44" y="142">01</text>
    <text class="habits-that-survive-name" x="70" y="142">Scan history before publishing</text>
    <text class="habits-that-survive-desc" x="44" y="166">Going public exposes every</text>
    <text class="habits-that-survive-desc" x="44" y="182">commit, not the current tree.</text>
    <text class="habits-that-survive-desc" x="44" y="198">Failures are permanent.</text>
    <text class="habits-that-survive-edge" x="44" y="242">highest value</text>
  </g>
  <line class="habits-that-survive-line habits-that-survive-conn habits-that-survive-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#habits-that-survive-tip)"/>
  <g class="habits-that-survive-stage habits-that-survive-s1">
    <rect class="habits-that-survive-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="habits-that-survive-step" x="280" y="142">02</text>
    <text class="habits-that-survive-name" x="306" y="142">A spend cap on anything metered</text>
    <text class="habits-that-survive-desc" x="280" y="166">Cheapest control, and the attack</text>
    <text class="habits-that-survive-desc" x="280" y="182">that needs no vulnerability.</text>
  </g>
  <line class="habits-that-survive-line habits-that-survive-conn habits-that-survive-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#habits-that-survive-tip)"/>
  <g class="habits-that-survive-stage habits-that-survive-s2">
    <rect class="habits-that-survive-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="habits-that-survive-step" x="516" y="142">03</text>
    <text class="habits-that-survive-name" x="542" y="142">Untrusted input stays untrusted</text>
    <text class="habits-that-survive-desc" x="516" y="166">Delimited, never concatenated,</text>
    <text class="habits-that-survive-desc" x="516" y="182">never granted authority.</text>
  </g>
  <line class="habits-that-survive-line habits-that-survive-conn habits-that-survive-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#habits-that-survive-tip)"/>
  <g class="habits-that-survive-stage habits-that-survive-s3">
    <rect class="habits-that-survive-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="habits-that-survive-step" x="752" y="142">04</text>
    <text class="habits-that-survive-name" x="778" y="142">Keep them because they are cheap</text>
    <text class="habits-that-survive-desc" x="752" y="166">A habit that costs more than the</text>
    <text class="habits-that-survive-desc" x="752" y="182">smallest commitment gets dropped</text>
    <text class="habits-that-survive-desc" x="752" y="198">first.</text>
    <text class="habits-that-survive-edge" x="752" y="242">minutes</text>
  </g>
  <text class="habits-that-survive-sub" x="30" y="304">The ordering is by permanence rather than by likelihood: a spend spike costs money and ends, and a secret in published history is in someone's clone before you notice it is there.</text>
</svg>
