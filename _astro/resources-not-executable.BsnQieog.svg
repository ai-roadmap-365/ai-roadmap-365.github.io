<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two boundaries worth enforcing.">
  <title>What each primitive cannot do</title>
  <style>
    .resources-not-executable-bg   { fill: #f8fafc; }
    .resources-not-executable-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resources-not-executable-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resources-not-executable-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resources-not-executable-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resources-not-executable-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resources-not-executable-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .resources-not-executable-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .resources-not-executable-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .resources-not-executable-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .resources-not-executable-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .resources-not-executable-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .resources-not-executable-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .resources-not-executable-row { opacity: 1; }
    .resources-not-executable-r0 { animation-delay: 0.00s; }
    .resources-not-executable-r1 { animation-delay: 0.45s; }
    .resources-not-executable-r2 { animation-delay: 0.90s; }
    .resources-not-executable-r3 { animation-delay: 1.35s; }
    .resources-not-executable-r4 { animation-delay: 1.80s; }
    .resources-not-executable-row { animation: resources-not-executable-reveal 7.3s ease-in-out infinite; }
    @keyframes resources-not-executable-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="resources-not-executable-bg" width="980" height="390"/>
  <text class="resources-not-executable-h1"  x="30" y="40">What each primitive cannot do</text>
  <text class="resources-not-executable-sub" x="30" y="64">Two boundaries worth enforcing.</text>
  <rect class="resources-not-executable-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="resources-not-executable-name" x="46" y="122">What they are</text>
  <text class="resources-not-executable-desc" x="46" y="142">Passive and discoverable.</text>
  <text class="resources-not-executable-desc resources-not-executable-row resources-not-executable-r0" x="46" y="182">Resources: read-only, URI-addressed, MIME-typed</text>
  <text class="resources-not-executable-desc resources-not-executable-row resources-not-executable-r1" x="46" y="216">Subscribable, with update notifications</text>
  <text class="resources-not-executable-desc resources-not-executable-row resources-not-executable-r2" x="46" y="250">Prompts: parameterised message arrays</text>
  <text class="resources-not-executable-desc resources-not-executable-row resources-not-executable-r3" x="46" y="284">Discovered from servers at run time</text>
  <text class="resources-not-executable-desc resources-not-executable-row resources-not-executable-r4" x="46" y="318">Both surfaced by the client, not the model</text>
  <rect class="resources-not-executable-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="resources-not-executable-name" x="526" y="122">What they are not</text>
  <text class="resources-not-executable-desc" x="526" y="142">Two deliberate limits.</text>
  <text class="resources-not-executable-desc resources-not-executable-row resources-not-executable-r0" x="526" y="182">Resources take no dynamic arguments</text>
  <text class="resources-not-executable-desc resources-not-executable-row resources-not-executable-r1" x="526" y="216">And cannot cause a write</text>
  <text class="resources-not-executable-desc resources-not-executable-row resources-not-executable-r2" x="526" y="250">Prompts are not hardcoded in the client</text>
  <text class="resources-not-executable-desc resources-not-executable-row resources-not-executable-r3" x="526" y="284">So an organisation can change them centrally</text>
  <text class="resources-not-executable-desc resources-not-executable-row resources-not-executable-r4" x="526" y="318">Neither replaces a tool</text>
  <text class="resources-not-executable-sub" x="30" y="372">The read-only guarantee is what lets a client attach a resource without asking permission: nothing a resource read can do requires a human to approve it, which is precisely why the primitive is separate.</text>
</svg>
