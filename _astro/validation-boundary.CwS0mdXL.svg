<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Validating at the boundary</title>
  <style>
    .validation-boundary-bg   { fill: #f8fafc; }
    .validation-boundary-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validation-boundary-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validation-boundary-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validation-boundary-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validation-boundary-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validation-boundary-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .validation-boundary-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .validation-boundary-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .validation-boundary-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .validation-boundary-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .validation-boundary-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .validation-boundary-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .validation-boundary-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .validation-boundary-stage { opacity: 1; }

    .validation-boundary-s0 { animation-delay: 0.00s; }
    .validation-boundary-e0 { animation-delay: 0.00s; }
    .validation-boundary-s1 { animation-delay: 1.28s; }
    .validation-boundary-e1 { animation-delay: 1.28s; }
    .validation-boundary-s2 { animation-delay: 2.56s; }
    .validation-boundary-e2 { animation-delay: 2.56s; }
    .validation-boundary-s3 { animation-delay: 3.84s; }
    .validation-boundary-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .validation-boundary-conn  { animation: validation-boundary-trace 6.4s ease-in-out infinite; }
      .validation-boundary-stage { animation: validation-boundary-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes validation-boundary-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes validation-boundary-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .validation-boundary-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .validation-boundary-stage { animation: validation-boundary-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes validation-boundary-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="validation-boundary-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="validation-boundary-bg" width="980" height="322"/>
  <text class="validation-boundary-h1"  x="30" y="40">Validating at the boundary</text>
  <text class="validation-boundary-sub" x="30" y="64">Four steps.</text>
  <g class="validation-boundary-stage validation-boundary-s0">
    <rect class="validation-boundary-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="validation-boundary-step" x="44" y="142">01</text>
    <text class="validation-boundary-name" x="70" y="142">Data arrives from outside: a request, a file, an interface</text>
    <text class="validation-boundary-desc" x="44" y="166">Untrusted, and unshaped.</text>
  </g>
  <line class="validation-boundary-line validation-boundary-conn validation-boundary-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#validation-boundary-tip)"/>
  <g class="validation-boundary-stage validation-boundary-s1">
    <rect class="validation-boundary-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="validation-boundary-step" x="280" y="142">02</text>
    <text class="validation-boundary-name" x="306" y="142">It is validated once, at the point of entry</text>
    <text class="validation-boundary-desc" x="280" y="166">And rejected there if wrong.</text>
  </g>
  <line class="validation-boundary-line validation-boundary-conn validation-boundary-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#validation-boundary-tip)"/>
  <g class="validation-boundary-stage validation-boundary-s2">
    <rect class="validation-boundary-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="validation-boundary-step" x="516" y="142">03</text>
    <text class="validation-boundary-name" x="542" y="142">So everything inside works with known-good values</text>
    <text class="validation-boundary-desc" x="516" y="166">With no defensive checks.</text>
  </g>
  <line class="validation-boundary-line validation-boundary-conn validation-boundary-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#validation-boundary-tip)"/>
  <g class="validation-boundary-stage validation-boundary-s3">
    <rect class="validation-boundary-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="validation-boundary-step" x="752" y="142">04</text>
    <text class="validation-boundary-name" x="778" y="142">Without a boundary, every function checks again</text>
    <text class="validation-boundary-desc" x="752" y="166">And some forget.</text>
  </g>
  <text class="validation-boundary-sub" x="30" y="304">Some functions forgetting is exactly how a null reaches the middle of a calculation, and it is why a single boundary beats scattered defensive checks.</text>
</svg>
