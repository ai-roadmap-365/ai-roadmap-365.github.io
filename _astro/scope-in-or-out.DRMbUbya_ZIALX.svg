<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The boundary that keeps it finishable.">
  <title>What a capstone is, and is not</title>
  <style>
    .scope-in-or-out-bg   { fill: #f8fafc; }
    .scope-in-or-out-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-in-or-out-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-in-or-out-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-in-or-out-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-in-or-out-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-in-or-out-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scope-in-or-out-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scope-in-or-out-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scope-in-or-out-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scope-in-or-out-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scope-in-or-out-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scope-in-or-out-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scope-in-or-out-row { opacity: 1; }
    .scope-in-or-out-r0 { animation-delay: 0.00s; }
    .scope-in-or-out-r1 { animation-delay: 0.45s; }
    .scope-in-or-out-r2 { animation-delay: 0.90s; }
    .scope-in-or-out-r3 { animation-delay: 1.35s; }
    .scope-in-or-out-r4 { animation-delay: 1.80s; }
    .scope-in-or-out-row { animation: scope-in-or-out-reveal 7.3s ease-in-out infinite; }
    @keyframes scope-in-or-out-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="scope-in-or-out-bg" width="980" height="390"/>
  <text class="scope-in-or-out-h1"  x="30" y="40">What a capstone is, and is not</text>
  <text class="scope-in-or-out-sub" x="30" y="64">The boundary that keeps it finishable.</text>
  <rect class="scope-in-or-out-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="scope-in-or-out-name" x="46" y="122">In scope</text>
  <text class="scope-in-or-out-desc" x="46" y="142">A working system, end to end.</text>
  <text class="scope-in-or-out-desc scope-in-or-out-row scope-in-or-out-r0" x="46" y="182">One clearly stated user problem</text>
  <text class="scope-in-or-out-desc scope-in-or-out-row scope-in-or-out-r1" x="46" y="216">Retrieval, generation, and a UI</text>
  <text class="scope-in-or-out-desc scope-in-or-out-row scope-in-or-out-r2" x="46" y="250">Evaluation with real numbers</text>
  <text class="scope-in-or-out-desc scope-in-or-out-row scope-in-or-out-r3" x="46" y="284">Deployed, monitored, and costed</text>
  <text class="scope-in-or-out-desc scope-in-or-out-row scope-in-or-out-r4" x="46" y="318">Documented well enough to hand over</text>
  <rect class="scope-in-or-out-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="scope-in-or-out-name" x="526" y="122">Out of scope</text>
  <text class="scope-in-or-out-desc" x="526" y="142">Interesting, and not this.</text>
  <text class="scope-in-or-out-desc scope-in-or-out-row scope-in-or-out-r0" x="526" y="182">Training a foundation model</text>
  <text class="scope-in-or-out-desc scope-in-or-out-row scope-in-or-out-r1" x="526" y="216">Novel architecture research</text>
  <text class="scope-in-or-out-desc scope-in-or-out-row scope-in-or-out-r2" x="526" y="250">Beating a benchmark</text>
  <text class="scope-in-or-out-desc scope-in-or-out-row scope-in-or-out-r3" x="526" y="284">Multi-tenant enterprise features</text>
  <text class="scope-in-or-out-desc scope-in-or-out-row scope-in-or-out-r4" x="526" y="318">Anything needing a team and a quarter</text>
  <text class="scope-in-or-out-sub" x="30" y="372">Every item on the right is a legitimate piece of work and none of them can be finished in the time available. Scope is not ambition management; it is the difference between a finished project and an abandoned one.</text>
</svg>
