<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two different questions about the same wave.">
  <title>Sample rate and bit depth are independent</title>
  <style>
    .two-audio-axes-bg   { fill: #f8fafc; }
    .two-audio-axes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-audio-axes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-audio-axes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-audio-axes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-audio-axes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-audio-axes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .two-audio-axes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .two-audio-axes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .two-audio-axes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .two-audio-axes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .two-audio-axes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .two-audio-axes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .two-audio-axes-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .two-audio-axes-stage { opacity: 1; }

    .two-audio-axes-s0 { animation-delay: 0.00s; }
    .two-audio-axes-e0 { animation-delay: 0.00s; }
    .two-audio-axes-s1 { animation-delay: 1.28s; }
    .two-audio-axes-e1 { animation-delay: 1.28s; }
    .two-audio-axes-s2 { animation-delay: 2.56s; }
    .two-audio-axes-e2 { animation-delay: 2.56s; }
    .two-audio-axes-s3 { animation-delay: 3.84s; }
    .two-audio-axes-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .two-audio-axes-conn  { animation: two-audio-axes-trace 6.4s ease-in-out infinite; }
      .two-audio-axes-stage { animation: two-audio-axes-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes two-audio-axes-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes two-audio-axes-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .two-audio-axes-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .two-audio-axes-stage { animation: two-audio-axes-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes two-audio-axes-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="two-audio-axes-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="two-audio-axes-bg" width="980" height="322"/>
  <text class="two-audio-axes-h1"  x="30" y="40">Sample rate and bit depth are independent</text>
  <text class="two-audio-axes-sub" x="30" y="64">Two different questions about the same wave.</text>
  <g class="two-audio-axes-stage two-audio-axes-s0">
    <rect class="two-audio-axes-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="two-audio-axes-step" x="44" y="142">01</text>
    <text class="two-audio-axes-name" x="70" y="142">Sample rate</text>
    <text class="two-audio-axes-desc" x="44" y="166">How OFTEN you measure. 44,100</text>
    <text class="two-audio-axes-desc" x="44" y="182">times a second for CD audio.</text>
    <text class="two-audio-axes-edge" x="44" y="242">kHz</text>
  </g>
  <line class="two-audio-axes-line two-audio-axes-conn two-audio-axes-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#two-audio-axes-tip)"/>
  <g class="two-audio-axes-stage two-audio-axes-s1">
    <rect class="two-audio-axes-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="two-audio-axes-step" x="280" y="142">02</text>
    <text class="two-audio-axes-name" x="306" y="142">It sets the highest frequency</text>
    <text class="two-audio-axes-desc" x="280" y="166">You can capture up to half the</text>
    <text class="two-audio-axes-desc" x="280" y="182">sample rate — the Nyquist limit.</text>
  </g>
  <line class="two-audio-axes-line two-audio-axes-conn two-audio-axes-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#two-audio-axes-tip)"/>
  <g class="two-audio-axes-stage two-audio-axes-s2">
    <rect class="two-audio-axes-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="two-audio-axes-step" x="516" y="142">03</text>
    <text class="two-audio-axes-name" x="542" y="142">Bit depth</text>
    <text class="two-audio-axes-desc" x="516" y="166">How PRECISELY each measurement</text>
    <text class="two-audio-axes-desc" x="516" y="182">is recorded. 16 bits gives</text>
    <text class="two-audio-axes-desc" x="516" y="198">65,536 levels.</text>
    <text class="two-audio-axes-edge" x="516" y="242">bits</text>
  </g>
  <line class="two-audio-axes-line two-audio-axes-conn two-audio-axes-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#two-audio-axes-tip)"/>
  <g class="two-audio-axes-stage two-audio-axes-s3">
    <rect class="two-audio-axes-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="two-audio-axes-step" x="752" y="142">04</text>
    <text class="two-audio-axes-name" x="778" y="142">It sets the noise floor</text>
    <text class="two-audio-axes-desc" x="752" y="166">More bits means quieter detail</text>
    <text class="two-audio-axes-desc" x="752" y="182">survives rounding.</text>
    <text class="two-audio-axes-edge" x="752" y="242">dynamic range</text>
  </g>
  <text class="two-audio-axes-sub" x="30" y="304">Confusing them leads to the wrong fix: raising the bit depth does nothing for a recording that is missing high frequencies, and raising the sample rate does nothing for one that sounds noisy.</text>
</svg>
