<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four cells, everything else derived.">
  <title>The confusion matrix</title>
  <style>
    .confusion-matrix-bg   { fill: #f8fafc; }
    .confusion-matrix-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .confusion-matrix-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .confusion-matrix-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .confusion-matrix-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .confusion-matrix-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .confusion-matrix-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .confusion-matrix-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .confusion-matrix-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .confusion-matrix-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .confusion-matrix-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .confusion-matrix-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .confusion-matrix-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .confusion-matrix-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .confusion-matrix-stage { opacity: 1; }

    .confusion-matrix-s0 { animation-delay: 0.00s; }
    .confusion-matrix-e0 { animation-delay: 0.00s; }
    .confusion-matrix-s1 { animation-delay: 1.28s; }
    .confusion-matrix-e1 { animation-delay: 1.28s; }
    .confusion-matrix-s2 { animation-delay: 2.56s; }
    .confusion-matrix-e2 { animation-delay: 2.56s; }
    .confusion-matrix-s3 { animation-delay: 3.84s; }
    .confusion-matrix-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .confusion-matrix-conn  { animation: confusion-matrix-trace 6.4s ease-in-out infinite; }
      .confusion-matrix-stage { animation: confusion-matrix-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes confusion-matrix-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes confusion-matrix-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .confusion-matrix-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .confusion-matrix-stage { animation: confusion-matrix-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes confusion-matrix-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="confusion-matrix-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="confusion-matrix-bg" width="980" height="322"/>
  <text class="confusion-matrix-h1"  x="30" y="40">The confusion matrix</text>
  <text class="confusion-matrix-sub" x="30" y="64">Four cells, everything else derived.</text>
  <g class="confusion-matrix-stage confusion-matrix-s0">
    <rect class="confusion-matrix-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="confusion-matrix-step" x="44" y="142">01</text>
    <text class="confusion-matrix-name" x="70" y="142">True positives</text>
    <text class="confusion-matrix-desc" x="44" y="166">Predicted positive, and correct.</text>
  </g>
  <line class="confusion-matrix-line confusion-matrix-conn confusion-matrix-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#confusion-matrix-tip)"/>
  <g class="confusion-matrix-stage confusion-matrix-s1">
    <rect class="confusion-matrix-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="confusion-matrix-step" x="280" y="142">02</text>
    <text class="confusion-matrix-name" x="306" y="142">False positives</text>
    <text class="confusion-matrix-desc" x="280" y="166">Predicted positive, and wrong. A</text>
    <text class="confusion-matrix-desc" x="280" y="182">false alarm.</text>
  </g>
  <line class="confusion-matrix-line confusion-matrix-conn confusion-matrix-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#confusion-matrix-tip)"/>
  <g class="confusion-matrix-stage confusion-matrix-s2">
    <rect class="confusion-matrix-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="confusion-matrix-step" x="516" y="142">03</text>
    <text class="confusion-matrix-name" x="542" y="142">False negatives</text>
    <text class="confusion-matrix-desc" x="516" y="166">Predicted negative, and wrong. A</text>
    <text class="confusion-matrix-desc" x="516" y="182">miss.</text>
  </g>
  <line class="confusion-matrix-line confusion-matrix-conn confusion-matrix-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#confusion-matrix-tip)"/>
  <g class="confusion-matrix-stage confusion-matrix-s3">
    <rect class="confusion-matrix-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="confusion-matrix-step" x="752" y="142">04</text>
    <text class="confusion-matrix-name" x="778" y="142">True negatives</text>
    <text class="confusion-matrix-desc" x="752" y="166">Predicted negative, and correct.</text>
  </g>
  <text class="confusion-matrix-sub" x="30" y="304">Every scalar metric in this lesson is a ratio of these four numbers, so reading the matrix directly tells you more than any single score does.</text>
</svg>
