<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Systematic error analysis</title>
  <style>
    .error-analysis-method-bg   { fill: #f8fafc; }
    .error-analysis-method-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .error-analysis-method-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .error-analysis-method-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .error-analysis-method-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .error-analysis-method-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .error-analysis-method-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .error-analysis-method-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .error-analysis-method-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .error-analysis-method-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .error-analysis-method-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .error-analysis-method-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .error-analysis-method-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .error-analysis-method-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .error-analysis-method-stage { opacity: 1; }

    .error-analysis-method-s0 { animation-delay: 0.00s; }
    .error-analysis-method-e0 { animation-delay: 0.00s; }
    .error-analysis-method-s1 { animation-delay: 1.28s; }
    .error-analysis-method-e1 { animation-delay: 1.28s; }
    .error-analysis-method-s2 { animation-delay: 2.56s; }
    .error-analysis-method-e2 { animation-delay: 2.56s; }
    .error-analysis-method-s3 { animation-delay: 3.84s; }
    .error-analysis-method-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .error-analysis-method-conn  { animation: error-analysis-method-trace 6.4s ease-in-out infinite; }
      .error-analysis-method-stage { animation: error-analysis-method-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes error-analysis-method-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes error-analysis-method-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .error-analysis-method-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .error-analysis-method-stage { animation: error-analysis-method-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes error-analysis-method-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="error-analysis-method-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="error-analysis-method-bg" width="980" height="322"/>
  <text class="error-analysis-method-h1"  x="30" y="40">Systematic error analysis</text>
  <text class="error-analysis-method-sub" x="30" y="64">Four steps.</text>
  <g class="error-analysis-method-stage error-analysis-method-s0">
    <rect class="error-analysis-method-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="error-analysis-method-step" x="44" y="142">01</text>
    <text class="error-analysis-method-name" x="70" y="142">Take a hundred errors from the validation set</text>
    <text class="error-analysis-method-desc" x="44" y="166">At random, not the interesting</text>
    <text class="error-analysis-method-desc" x="44" y="182">ones.</text>
  </g>
  <line class="error-analysis-method-line error-analysis-method-conn error-analysis-method-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#error-analysis-method-tip)"/>
  <g class="error-analysis-method-stage error-analysis-method-s1">
    <rect class="error-analysis-method-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="error-analysis-method-step" x="280" y="142">02</text>
    <text class="error-analysis-method-name" x="306" y="142">Read them, and group them by cause</text>
    <text class="error-analysis-method-desc" x="280" y="166">By hand. This is the work.</text>
  </g>
  <line class="error-analysis-method-line error-analysis-method-conn error-analysis-method-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#error-analysis-method-tip)"/>
  <g class="error-analysis-method-stage error-analysis-method-s2">
    <rect class="error-analysis-method-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="error-analysis-method-step" x="516" y="142">03</text>
    <text class="error-analysis-method-name" x="542" y="142">Count each category</text>
    <text class="error-analysis-method-desc" x="516" y="166">Which converts impressions into</text>
    <text class="error-analysis-method-desc" x="516" y="182">a ranked list.</text>
  </g>
  <line class="error-analysis-method-line error-analysis-method-conn error-analysis-method-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#error-analysis-method-tip)"/>
  <g class="error-analysis-method-stage error-analysis-method-s3">
    <rect class="error-analysis-method-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="error-analysis-method-step" x="752" y="142">04</text>
    <text class="error-analysis-method-name" x="778" y="142">And fix the largest category first</text>
    <text class="error-analysis-method-desc" x="752" y="166">Which is usually data quality,</text>
    <text class="error-analysis-method-desc" x="752" y="182">not the model.</text>
  </g>
  <text class="error-analysis-method-sub" x="30" y="304">Sampling at random rather than picking interesting failures is what makes the counts meaningful, and it is the step most often done wrong.</text>
</svg>
