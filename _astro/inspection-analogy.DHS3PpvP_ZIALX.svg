<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The inspector walks the building with a list.">
  <title>A safety inspection, not a burglary</title>
  <style>
    .inspection-analogy-bg   { fill: #f8fafc; }
    .inspection-analogy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inspection-analogy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inspection-analogy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inspection-analogy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inspection-analogy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inspection-analogy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .inspection-analogy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .inspection-analogy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .inspection-analogy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .inspection-analogy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .inspection-analogy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .inspection-analogy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .inspection-analogy-row { opacity: 1; }
    .inspection-analogy-r0 { animation-delay: 0.00s; }
    .inspection-analogy-r1 { animation-delay: 0.45s; }
    .inspection-analogy-r2 { animation-delay: 0.90s; }
    .inspection-analogy-r3 { animation-delay: 1.35s; }
    .inspection-analogy-r4 { animation-delay: 1.80s; }
    .inspection-analogy-row { animation: inspection-analogy-reveal 7.3s ease-in-out infinite; }
    @keyframes inspection-analogy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="inspection-analogy-bg" width="980" height="390"/>
  <text class="inspection-analogy-h1"  x="30" y="40">A safety inspection, not a burglary</text>
  <text class="inspection-analogy-sub" x="30" y="64">The inspector walks the building with a list.</text>
  <rect class="inspection-analogy-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="inspection-analogy-name" x="46" y="122">The inspection</text>
  <text class="inspection-analogy-desc" x="46" y="142">Boring, and it saves lives.</text>
  <text class="inspection-analogy-desc inspection-analogy-row inspection-analogy-r0" x="46" y="182">Walk the building with a list</text>
  <text class="inspection-analogy-desc inspection-analogy-row inspection-analogy-r1" x="46" y="216">Fire doors, alarms, certification, exits</text>
  <text class="inspection-analogy-desc inspection-analogy-row inspection-analogy-r2" x="46" y="250">A propped-open door outranks a clever lock</text>
  <text class="inspection-analogy-desc inspection-analogy-row inspection-analogy-r3" x="46" y="284">Record how to fix, not only what is wrong</text>
  <text class="inspection-analogy-desc inspection-analogy-row inspection-analogy-r4" x="46" y="318">Inspectors are themselves tested</text>
  <rect class="inspection-analogy-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="inspection-analogy-name" x="526" y="122">The break-in attempt</text>
  <text class="inspection-analogy-desc" x="526" y="142">Finds one path, not the list.</text>
  <text class="inspection-analogy-desc inspection-analogy-row inspection-analogy-r0" x="526" y="182">Try to get in</text>
  <text class="inspection-analogy-desc inspection-analogy-row inspection-analogy-r1" x="526" y="216">Proves one route works</text>
  <text class="inspection-analogy-desc inspection-analogy-row inspection-analogy-r2" x="526" y="250">Says nothing about the others</text>
  <text class="inspection-analogy-desc inspection-analogy-row inspection-analogy-r3" x="526" y="284">No remediation, only a result</text>
  <text class="inspection-analogy-desc inspection-analogy-row inspection-analogy-r4" x="526" y="318">Nobody checks the burglar</text>
  <text class="inspection-analogy-sub" x="30" y="372">The last row on the left is the one people skip: a regime that never tests its inspectors cannot tell a thorough inspection from a lucky one, and from outside they look identical.</text>
</svg>
