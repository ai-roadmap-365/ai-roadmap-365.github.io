<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And each has exactly one place to look.">
  <title>Three status codes cover most AI failures</title>
  <style>
    .api-error-triage-bg   { fill: #f8fafc; }
    .api-error-triage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-error-triage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-error-triage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-error-triage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-error-triage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-error-triage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .api-error-triage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .api-error-triage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .api-error-triage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .api-error-triage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .api-error-triage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .api-error-triage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .api-error-triage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .api-error-triage-stage { opacity: 1; }

    .api-error-triage-s0 { animation-delay: 0.00s; }
    .api-error-triage-e0 { animation-delay: 0.00s; }
    .api-error-triage-s1 { animation-delay: 1.28s; }
    .api-error-triage-e1 { animation-delay: 1.28s; }
    .api-error-triage-s2 { animation-delay: 2.56s; }
    .api-error-triage-e2 { animation-delay: 2.56s; }
    .api-error-triage-s3 { animation-delay: 3.84s; }
    .api-error-triage-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .api-error-triage-conn  { animation: api-error-triage-trace 6.4s ease-in-out infinite; }
      .api-error-triage-stage { animation: api-error-triage-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes api-error-triage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes api-error-triage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .api-error-triage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .api-error-triage-stage { animation: api-error-triage-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes api-error-triage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="api-error-triage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="api-error-triage-bg" width="980" height="322"/>
  <text class="api-error-triage-h1"  x="30" y="40">Three status codes cover most AI failures</text>
  <text class="api-error-triage-sub" x="30" y="64">And each has exactly one place to look.</text>
  <g class="api-error-triage-stage api-error-triage-s0">
    <rect class="api-error-triage-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="api-error-triage-step" x="44" y="142">01</text>
    <text class="api-error-triage-name" x="70" y="142">401</text>
    <text class="api-error-triage-desc" x="44" y="166">Your key. Missing, expired,</text>
    <text class="api-error-triage-desc" x="44" y="182">wrong environment, or missing</text>
    <text class="api-error-triage-desc" x="44" y="198">the Bearer prefix.</text>
    <text class="api-error-triage-edge" x="44" y="242">the key</text>
  </g>
  <line class="api-error-triage-line api-error-triage-conn api-error-triage-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#api-error-triage-tip)"/>
  <g class="api-error-triage-stage api-error-triage-s1">
    <rect class="api-error-triage-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="api-error-triage-step" x="280" y="142">02</text>
    <text class="api-error-triage-name" x="306" y="142">400</text>
    <text class="api-error-triage-desc" x="280" y="166">Your payload. The body usually</text>
    <text class="api-error-triage-desc" x="280" y="182">names the offending field — read</text>
    <text class="api-error-triage-desc" x="280" y="198">it.</text>
    <text class="api-error-triage-edge" x="280" y="242">the body</text>
  </g>
  <line class="api-error-triage-line api-error-triage-conn api-error-triage-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#api-error-triage-tip)"/>
  <g class="api-error-triage-stage api-error-triage-s2">
    <rect class="api-error-triage-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="api-error-triage-step" x="516" y="142">03</text>
    <text class="api-error-triage-name" x="542" y="142">429</text>
    <text class="api-error-triage-desc" x="516" y="166">Your rate. Back off; Retry-After</text>
    <text class="api-error-triage-desc" x="516" y="182">often says exactly how long.</text>
    <text class="api-error-triage-edge" x="516" y="242">the rate</text>
  </g>
  <line class="api-error-triage-line api-error-triage-conn api-error-triage-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#api-error-triage-tip)"/>
  <g class="api-error-triage-stage api-error-triage-s3">
    <rect class="api-error-triage-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="api-error-triage-step" x="752" y="142">04</text>
    <text class="api-error-triage-name" x="778" y="142">5xx</text>
    <text class="api-error-triage-desc" x="752" y="166">Their server. Retry with</text>
    <text class="api-error-triage-desc" x="752" y="182">backoff. Nothing in your request</text>
    <text class="api-error-triage-desc" x="752" y="198">needs changing.</text>
    <text class="api-error-triage-edge" x="752" y="242">their side</text>
  </g>
  <text class="api-error-triage-sub" x="30" y="304">Run the provider's documented curl example first, before writing any code. If it works and your code does not, the difference is in your code — and you have a working reference to diff against.</text>
</svg>
