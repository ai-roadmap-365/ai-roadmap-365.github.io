<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Tuning across the whole pipeline</title>
  <style>
    .nested-tuning-bg   { fill: #f8fafc; }
    .nested-tuning-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nested-tuning-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nested-tuning-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nested-tuning-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nested-tuning-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nested-tuning-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nested-tuning-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .nested-tuning-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .nested-tuning-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .nested-tuning-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .nested-tuning-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .nested-tuning-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .nested-tuning-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .nested-tuning-stage { opacity: 1; }

    .nested-tuning-s0 { animation-delay: 0.00s; }
    .nested-tuning-e0 { animation-delay: 0.00s; }
    .nested-tuning-s1 { animation-delay: 1.28s; }
    .nested-tuning-e1 { animation-delay: 1.28s; }
    .nested-tuning-s2 { animation-delay: 2.56s; }
    .nested-tuning-e2 { animation-delay: 2.56s; }
    .nested-tuning-s3 { animation-delay: 3.84s; }
    .nested-tuning-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .nested-tuning-conn  { animation: nested-tuning-trace 6.4s ease-in-out infinite; }
      .nested-tuning-stage { animation: nested-tuning-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes nested-tuning-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes nested-tuning-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .nested-tuning-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .nested-tuning-stage { animation: nested-tuning-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes nested-tuning-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="nested-tuning-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="nested-tuning-bg" width="980" height="322"/>
  <text class="nested-tuning-h1"  x="30" y="40">Tuning across the whole pipeline</text>
  <text class="nested-tuning-sub" x="30" y="64">Four steps.</text>
  <g class="nested-tuning-stage nested-tuning-s0">
    <rect class="nested-tuning-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="nested-tuning-step" x="44" y="142">01</text>
    <text class="nested-tuning-name" x="70" y="142">Parameters are addressed by step name</text>
    <text class="nested-tuning-desc" x="44" y="166">So preprocessing options are</text>
    <text class="nested-tuning-desc" x="44" y="182">tunable too.</text>
  </g>
  <line class="nested-tuning-line nested-tuning-conn nested-tuning-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#nested-tuning-tip)"/>
  <g class="nested-tuning-stage nested-tuning-s1">
    <rect class="nested-tuning-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="nested-tuning-step" x="280" y="142">02</text>
    <text class="nested-tuning-name" x="306" y="142">The search space spans transforms and model together</text>
    <text class="nested-tuning-desc" x="280" y="166">Which scaler, and which model</text>
    <text class="nested-tuning-desc" x="280" y="182">parameters.</text>
  </g>
  <line class="nested-tuning-line nested-tuning-conn nested-tuning-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#nested-tuning-tip)"/>
  <g class="nested-tuning-stage nested-tuning-s2">
    <rect class="nested-tuning-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="nested-tuning-step" x="516" y="142">03</text>
    <text class="nested-tuning-name" x="542" y="142">Every candidate refits the whole pipeline per fold</text>
    <text class="nested-tuning-desc" x="516" y="166">Which is what keeps it</text>
    <text class="nested-tuning-desc" x="516" y="182">leak-free.</text>
  </g>
  <line class="nested-tuning-line nested-tuning-conn nested-tuning-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#nested-tuning-tip)"/>
  <g class="nested-tuning-stage nested-tuning-s3">
    <rect class="nested-tuning-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="nested-tuning-step" x="752" y="142">04</text>
    <text class="nested-tuning-name" x="778" y="142">Finding combinations separate tuning would miss</text>
    <text class="nested-tuning-desc" x="752" y="166">Because the best preprocessing</text>
    <text class="nested-tuning-desc" x="752" y="182">depends on the model.</text>
  </g>
  <text class="nested-tuning-sub" x="30" y="304">The best scaler genuinely depends on the model that follows it, so tuning them separately optimises each against an assumption about the other.</text>
</svg>
