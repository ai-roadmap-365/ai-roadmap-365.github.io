<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five stages, ending in a report.">
  <title>The audit, in order</title>
  <style>
    .audit-workflow-bg   { fill: #f8fafc; }
    .audit-workflow-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .audit-workflow-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .audit-workflow-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .audit-workflow-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .audit-workflow-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .audit-workflow-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .audit-workflow-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .audit-workflow-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .audit-workflow-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .audit-workflow-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .audit-workflow-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .audit-workflow-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .audit-workflow-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .audit-workflow-stage { opacity: 1; }

    .audit-workflow-s0 { animation-delay: 0.00s; }
    .audit-workflow-e0 { animation-delay: 0.00s; }
    .audit-workflow-s1 { animation-delay: 1.33s; }
    .audit-workflow-e1 { animation-delay: 1.33s; }
    .audit-workflow-s2 { animation-delay: 2.67s; }
    .audit-workflow-e2 { animation-delay: 2.67s; }
    .audit-workflow-s3 { animation-delay: 4.00s; }
    .audit-workflow-e3 { animation-delay: 4.00s; }
    .audit-workflow-s4 { animation-delay: 5.33s; }
    .audit-workflow-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .audit-workflow-conn  { animation: audit-workflow-trace 8s ease-in-out infinite; }
      .audit-workflow-stage { animation: audit-workflow-arrive 8s ease-in-out infinite; }
    }
    @keyframes audit-workflow-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes audit-workflow-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .audit-workflow-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .audit-workflow-stage { animation: audit-workflow-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes audit-workflow-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="audit-workflow-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="audit-workflow-bg" width="980" height="322"/>
  <text class="audit-workflow-h1"  x="30" y="40">The audit, in order</text>
  <text class="audit-workflow-sub" x="30" y="64">Five stages, ending in a report.</text>
  <g class="audit-workflow-stage audit-workflow-s0">
    <rect class="audit-workflow-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="audit-workflow-step" x="44" y="142">01</text>
    <text class="audit-workflow-name" x="70" y="142">Model the threats</text>
    <text class="audit-workflow-desc" x="44" y="166">Boundaries and STRIDE,</text>
    <text class="audit-workflow-desc" x="44" y="182">before anything is</text>
    <text class="audit-workflow-desc" x="44" y="198">scanned.</text>
  </g>
  <line class="audit-workflow-line audit-workflow-conn audit-workflow-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#audit-workflow-tip)"/>
  <g class="audit-workflow-stage audit-workflow-s1">
    <rect class="audit-workflow-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="audit-workflow-step" x="233" y="142">02</text>
    <text class="audit-workflow-name" x="259" y="142">Scan the supply chain</text>
    <text class="audit-workflow-desc" x="233" y="166">AST inspection over every</text>
    <text class="audit-workflow-desc" x="233" y="182">artefact in the bundle.</text>
  </g>
  <line class="audit-workflow-line audit-workflow-conn audit-workflow-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#audit-workflow-tip)"/>
  <g class="audit-workflow-stage audit-workflow-s2">
    <rect class="audit-workflow-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="audit-workflow-step" x="422" y="142">03</text>
    <text class="audit-workflow-name" x="448" y="142">Run the red team suite</text>
    <text class="audit-workflow-desc" x="422" y="166">Per-category ASR, against</text>
    <text class="audit-workflow-desc" x="422" y="182">the system as configured.</text>
  </g>
  <line class="audit-workflow-line audit-workflow-conn audit-workflow-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#audit-workflow-tip)"/>
  <g class="audit-workflow-stage audit-workflow-s3">
    <rect class="audit-workflow-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="audit-workflow-step" x="611" y="142">04</text>
    <text class="audit-workflow-name" x="637" y="142">Score with DREAD</text>
    <text class="audit-workflow-desc" x="611" y="166">A composite risk figure,</text>
    <text class="audit-workflow-desc" x="611" y="182">ranked for remediation.</text>
    <text class="audit-workflow-edge" x="611" y="242">under 4.0</text>
  </g>
  <line class="audit-workflow-line audit-workflow-conn audit-workflow-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#audit-workflow-tip)"/>
  <g class="audit-workflow-stage audit-workflow-s4">
    <rect class="audit-workflow-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="audit-workflow-step" x="800" y="142">05</text>
    <text class="audit-workflow-name" x="826" y="142">Generate the report</text>
    <text class="audit-workflow-desc" x="800" y="166">Executive summary,</text>
    <text class="audit-workflow-desc" x="800" y="182">findings, remediations,</text>
    <text class="audit-workflow-desc" x="800" y="198">evidence.</text>
  </g>
  <text class="audit-workflow-sub" x="30" y="304">Threat modelling comes first for a reason that holds across the whole week: the scan and the red team suite can only test the boundaries somebody drew, so a boundary nobody drew is untested by both.</text>
</svg>
