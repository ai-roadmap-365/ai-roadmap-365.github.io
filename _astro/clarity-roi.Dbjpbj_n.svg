<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Measured against what it costs.">
  <title>What an hour of design buys</title>
  <style>
    .clarity-roi-bg   { fill: #f8fafc; }
    .clarity-roi-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clarity-roi-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clarity-roi-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clarity-roi-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clarity-roi-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clarity-roi-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .clarity-roi-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .clarity-roi-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .clarity-roi-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .clarity-roi-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .clarity-roi-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .clarity-roi-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .clarity-roi-row { opacity: 1; }
    .clarity-roi-r0 { animation-delay: 0.00s; }
    .clarity-roi-r1 { animation-delay: 0.45s; }
    .clarity-roi-r2 { animation-delay: 0.90s; }
    .clarity-roi-r3 { animation-delay: 1.35s; }
    .clarity-roi-r4 { animation-delay: 1.80s; }
    .clarity-roi-row { animation: clarity-roi-reveal 7.3s ease-in-out infinite; }
    @keyframes clarity-roi-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="clarity-roi-bg" width="980" height="390"/>
  <text class="clarity-roi-h1"  x="30" y="40">What an hour of design buys</text>
  <text class="clarity-roi-sub" x="30" y="64">Measured against what it costs.</text>
  <rect class="clarity-roi-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="clarity-roi-name" x="46" y="122">What it costs</text>
  <text class="clarity-roi-desc" x="46" y="142">An hour, maybe two.</text>
  <text class="clarity-roi-desc clarity-roi-row clarity-roi-r0" x="46" y="182">Two diagrams, drawn roughly</text>
  <text class="clarity-roi-desc clarity-roi-row clarity-roi-r1" x="46" y="216">A latency budget, allocated</text>
  <text class="clarity-roi-desc clarity-roi-row clarity-roi-r2" x="46" y="250">The contracts written as schemas</text>
  <text class="clarity-roi-desc clarity-roi-row clarity-roi-r3" x="46" y="284">A page of failure decisions</text>
  <text class="clarity-roi-desc clarity-roi-row clarity-roi-r4" x="46" y="318">Updated when something changes</text>
  <rect class="clarity-roi-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="clarity-roi-name" x="526" y="122">What it prevents</text>
  <text class="clarity-roi-desc" x="526" y="142">Days, reliably.</text>
  <text class="clarity-roi-desc clarity-roi-row clarity-roi-r0" x="526" y="182">An integration mismatch found at the deadline</text>
  <text class="clarity-roi-desc clarity-roi-row clarity-roi-r1" x="526" y="216">A design too slow to meet its target</text>
  <text class="clarity-roi-desc clarity-roi-row clarity-roi-r2" x="526" y="250">A rewrite because two parts assumed differently</text>
  <text class="clarity-roi-desc clarity-roi-row clarity-roi-r3" x="526" y="284">A failure path invented under pressure</text>
  <text class="clarity-roi-desc clarity-roi-row clarity-roi-r4" x="526" y="318">Explaining the system repeatedly, in person</text>
  <text class="clarity-roi-sub" x="30" y="372">The return is not in the document; it is in the decisions it forces you to make while they are still cheap. Most of the value is realised before anyone reads it.</text>
</svg>
