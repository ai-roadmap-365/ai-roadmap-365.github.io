<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two different reads.">
  <title>A proofreader and an editor</title>
  <style>
    .proofreader-bg   { fill: #f8fafc; }
    .proofreader-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .proofreader-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .proofreader-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .proofreader-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .proofreader-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .proofreader-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .proofreader-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .proofreader-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .proofreader-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .proofreader-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .proofreader-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .proofreader-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .proofreader-row { opacity: 1; }
    .proofreader-r0 { animation-delay: 0.00s; }
    .proofreader-r1 { animation-delay: 0.45s; }
    .proofreader-r2 { animation-delay: 0.90s; }
    .proofreader-r3 { animation-delay: 1.35s; }
    .proofreader-r4 { animation-delay: 1.80s; }
    .proofreader-row { animation: proofreader-reveal 7.3s ease-in-out infinite; }
    @keyframes proofreader-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="proofreader-bg" width="980" height="390"/>
  <text class="proofreader-h1"  x="30" y="40">A proofreader and an editor</text>
  <text class="proofreader-sub" x="30" y="64">Two different reads.</text>
  <rect class="proofreader-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="proofreader-name" x="46" y="122">Proofreading</text>
  <text class="proofreader-desc" x="46" y="142">Mechanical.</text>
  <text class="proofreader-desc proofreader-row proofreader-r0" x="46" y="182">Spelling, spacing, punctuation</text>
  <text class="proofreader-desc proofreader-row proofreader-r1" x="46" y="216">Rules with clear answers</text>
  <text class="proofreader-desc proofreader-row proofreader-r2" x="46" y="250">Can be automated entirely</text>
  <text class="proofreader-desc proofreader-row proofreader-r3" x="46" y="284">No judgment required</text>
  <text class="proofreader-desc proofreader-row proofreader-r4" x="46" y="318">This is formatting</text>
  <rect class="proofreader-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="proofreader-name" x="526" y="122">Editing</text>
  <text class="proofreader-desc" x="526" y="142">Judgment.</text>
  <text class="proofreader-desc proofreader-row proofreader-r0" x="526" y="182">Clarity, structure, argument</text>
  <text class="proofreader-desc proofreader-row proofreader-r1" x="526" y="216">Rules with exceptions</text>
  <text class="proofreader-desc proofreader-row proofreader-r2" x="526" y="250">Needs a person</text>
  <text class="proofreader-desc proofreader-row proofreader-r3" x="526" y="284">Judgment throughout</text>
  <text class="proofreader-desc proofreader-row proofreader-r4" x="526" y="318">This is code review</text>
  <text class="proofreader-sub" x="30" y="372">Automating the proofreading is what frees the editor to do the work only a person can, which is the same argument for formatters in code review.</text>
</svg>
