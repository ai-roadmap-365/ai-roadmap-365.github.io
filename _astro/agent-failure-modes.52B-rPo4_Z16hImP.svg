<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are security; one is money.">
  <title>Three consequences of actuation</title>
  <style>
    .agent-failure-modes-bg   { fill: #f8fafc; }
    .agent-failure-modes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-failure-modes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-failure-modes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-failure-modes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-failure-modes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-failure-modes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .agent-failure-modes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .agent-failure-modes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .agent-failure-modes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .agent-failure-modes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .agent-failure-modes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .agent-failure-modes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .agent-failure-modes-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .agent-failure-modes-stage { opacity: 1; }

    .agent-failure-modes-s0 { animation-delay: 0.00s; }
    .agent-failure-modes-e0 { animation-delay: 0.00s; }
    .agent-failure-modes-s1 { animation-delay: 1.50s; }
    .agent-failure-modes-e1 { animation-delay: 1.50s; }
    .agent-failure-modes-s2 { animation-delay: 3.00s; }
    .agent-failure-modes-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .agent-failure-modes-conn  { animation: agent-failure-modes-trace 6s ease-in-out infinite; }
      .agent-failure-modes-stage { animation: agent-failure-modes-arrive 6s ease-in-out infinite; }
    }
    @keyframes agent-failure-modes-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes agent-failure-modes-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .agent-failure-modes-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .agent-failure-modes-stage { animation: agent-failure-modes-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes agent-failure-modes-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="agent-failure-modes-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="agent-failure-modes-bg" width="980" height="322"/>
  <text class="agent-failure-modes-h1"  x="30" y="40">Three consequences of actuation</text>
  <text class="agent-failure-modes-sub" x="30" y="64">Two are security; one is money.</text>
  <g class="agent-failure-modes-stage agent-failure-modes-s0">
    <rect class="agent-failure-modes-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="agent-failure-modes-step" x="44" y="142">01</text>
    <text class="agent-failure-modes-name" x="70" y="142">Indirect injection</text>
    <text class="agent-failure-modes-desc" x="44" y="166">Scraped text becomes instructions. Separate</text>
    <text class="agent-failure-modes-desc" x="44" y="182">the instruction channel from the data</text>
    <text class="agent-failure-modes-desc" x="44" y="198">channel.</text>
    <text class="agent-failure-modes-edge" x="44" y="242">Day 344</text>
  </g>
  <line class="agent-failure-modes-line agent-failure-modes-conn agent-failure-modes-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#agent-failure-modes-tip)"/>
  <g class="agent-failure-modes-stage agent-failure-modes-s1">
    <rect class="agent-failure-modes-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="agent-failure-modes-step" x="359" y="142">02</text>
    <text class="agent-failure-modes-name" x="385" y="142">Exfiltration through a tool</text>
    <text class="agent-failure-modes-desc" x="359" y="166">An environment variable read, then sent by an</text>
    <text class="agent-failure-modes-desc" x="359" y="182">outbound call. Allowlist egress.</text>
    <text class="agent-failure-modes-edge" x="359" y="242">privacy</text>
  </g>
  <line class="agent-failure-modes-line agent-failure-modes-conn agent-failure-modes-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#agent-failure-modes-tip)"/>
  <g class="agent-failure-modes-stage agent-failure-modes-s2">
    <rect class="agent-failure-modes-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="agent-failure-modes-step" x="674" y="142">03</text>
    <text class="agent-failure-modes-name" x="700" y="142">Cost scales with depth</text>
    <text class="agent-failure-modes-desc" x="674" y="166">Ten steps at 500 output tokens each, over a</text>
    <text class="agent-failure-modes-desc" x="674" y="182">20,000-token expanding scratchpad.</text>
    <text class="agent-failure-modes-edge" x="674" y="242">money</text>
  </g>
  <text class="agent-failure-modes-sub" x="30" y="304">The second row is the one that turns injection from an embarrassment into a breach: without tools the model can only say something wrong, and with an outbound HTTP tool it can send something real.</text>
</svg>
