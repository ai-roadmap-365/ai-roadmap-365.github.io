<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Specificity wins, explicitly.">
  <title>Resolving conflicting rules</title>
  <style>
    .rule-precedence-bg   { fill: #f8fafc; }
    .rule-precedence-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rule-precedence-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rule-precedence-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rule-precedence-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rule-precedence-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rule-precedence-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rule-precedence-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rule-precedence-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rule-precedence-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rule-precedence-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rule-precedence-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rule-precedence-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rule-precedence-row { opacity: 1; }
    .rule-precedence-r0 { animation-delay: 0.00s; }
    .rule-precedence-r1 { animation-delay: 0.45s; }
    .rule-precedence-r2 { animation-delay: 0.90s; }
    .rule-precedence-r3 { animation-delay: 1.35s; }
    .rule-precedence-r4 { animation-delay: 1.80s; }
    .rule-precedence-row { animation: rule-precedence-reveal 7.3s ease-in-out infinite; }
    @keyframes rule-precedence-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="rule-precedence-bg" width="980" height="390"/>
  <text class="rule-precedence-h1"  x="30" y="40">Resolving conflicting rules</text>
  <text class="rule-precedence-sub" x="30" y="64">Specificity wins, explicitly.</text>
  <rect class="rule-precedence-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="rule-precedence-name" x="46" y="122">Explicit precedence</text>
  <text class="rule-precedence-desc" x="46" y="142">Specificity wins.</text>
  <text class="rule-precedence-desc rule-precedence-row rule-precedence-r0" x="46" y="182">A task non-goal overrides a repository default</text>
  <text class="rule-precedence-desc rule-precedence-row rule-precedence-r1" x="46" y="216">A repository AGENTS.md overrides a user preference</text>
  <text class="rule-precedence-desc rule-precedence-row rule-precedence-r2" x="46" y="250">Skills execute within those boundaries</text>
  <text class="rule-precedence-desc rule-precedence-row rule-precedence-r3" x="46" y="284">Conflicts resolve deterministically</text>
  <text class="rule-precedence-desc rule-precedence-row rule-precedence-r4" x="46" y="318">And the resolution is documented</text>
  <rect class="rule-precedence-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="rule-precedence-name" x="526" y="122">Unresolved</text>
  <text class="rule-precedence-desc" x="526" y="142">The model chooses.</text>
  <text class="rule-precedence-desc rule-precedence-row rule-precedence-r0" x="526" y="182">Two rules contradict</text>
  <text class="rule-precedence-desc rule-precedence-row rule-precedence-r1" x="526" y="216">Neither is marked as more specific</text>
  <text class="rule-precedence-desc rule-precedence-row rule-precedence-r2" x="526" y="250">The model picks, plausibly</text>
  <text class="rule-precedence-desc rule-precedence-row rule-precedence-r3" x="526" y="284">Different answer next session</text>
  <text class="rule-precedence-desc rule-precedence-row rule-precedence-r4" x="526" y="318">And nobody can say why</text>
  <text class="rule-precedence-sub" x="30" y="372">Writing the precedence down matters more as the number of rule sources grows: with three layers the conflicts are rare and the resolutions are arbitrary, which is the worst combination for reproducibility.</text>
</svg>
