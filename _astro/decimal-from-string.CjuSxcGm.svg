<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="From a float, the error is already baked in.">
  <title>Construct Decimal from a string</title>
  <style>
    .decimal-from-string-bg   { fill: #f8fafc; }
    .decimal-from-string-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decimal-from-string-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decimal-from-string-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decimal-from-string-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decimal-from-string-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decimal-from-string-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .decimal-from-string-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .decimal-from-string-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .decimal-from-string-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .decimal-from-string-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .decimal-from-string-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .decimal-from-string-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .decimal-from-string-row { opacity: 1; }
    .decimal-from-string-r0 { animation-delay: 0.00s; }
    .decimal-from-string-r1 { animation-delay: 0.45s; }
    .decimal-from-string-r2 { animation-delay: 0.90s; }
    .decimal-from-string-r3 { animation-delay: 1.35s; }
    .decimal-from-string-r4 { animation-delay: 1.80s; }
    .decimal-from-string-row { animation: decimal-from-string-reveal 7.3s ease-in-out infinite; }
    @keyframes decimal-from-string-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="decimal-from-string-bg" width="980" height="390"/>
  <text class="decimal-from-string-h1"  x="30" y="40">Construct Decimal from a string</text>
  <text class="decimal-from-string-sub" x="30" y="64">From a float, the error is already baked in.</text>
  <rect class="decimal-from-string-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="decimal-from-string-name" x="46" y="122">Decimal(0.1)</text>
  <text class="decimal-from-string-desc" x="46" y="142">Inherits the float's error.</text>
  <text class="decimal-from-string-desc decimal-from-string-row decimal-from-string-r0" x="46" y="182">The float is rounded BEFORE Decimal sees it</text>
  <text class="decimal-from-string-desc decimal-from-string-row decimal-from-string-r1" x="46" y="216">You get 0.1000000000000000055511151231...</text>
  <text class="decimal-from-string-desc decimal-from-string-row decimal-from-string-r2" x="46" y="250">Decimal faithfully preserves the wrong value</text>
  <text class="decimal-from-string-desc decimal-from-string-row decimal-from-string-r3" x="46" y="284">Exact arithmetic on an inexact input</text>
  <text class="decimal-from-string-desc decimal-from-string-row decimal-from-string-r4" x="46" y="318">Defeats the entire point</text>
  <rect class="decimal-from-string-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="decimal-from-string-name" x="526" y="122">Decimal("0.1")</text>
  <text class="decimal-from-string-desc" x="526" y="142">Exactly one tenth.</text>
  <text class="decimal-from-string-desc decimal-from-string-row decimal-from-string-r0" x="526" y="182">The string is parsed as decimal directly</text>
  <text class="decimal-from-string-desc decimal-from-string-row decimal-from-string-r1" x="526" y="216">No float is involved at any point</text>
  <text class="decimal-from-string-desc decimal-from-string-row decimal-from-string-r2" x="526" y="250">Decimal("0.1") + Decimal("0.2") is exactly 0.3</text>
  <text class="decimal-from-string-desc decimal-from-string-row decimal-from-string-r3" x="526" y="284">Exact arithmetic on an exact input</text>
  <text class="decimal-from-string-desc decimal-from-string-row decimal-from-string-r4" x="526" y="318">This is the form to use, always</text>
  <text class="decimal-from-string-sub" x="30" y="372">The failure is quiet: both constructions produce a Decimal and both do exact arithmetic afterwards. Only the starting value differs, and only by a rounding nobody sees.</text>
</svg>
