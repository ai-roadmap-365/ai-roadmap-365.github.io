<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Scanned at every hop.">
  <title>A parcel tracking barcode</title>
  <style>
    .parcel-tracking-bg   { fill: #f8fafc; }
    .parcel-tracking-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parcel-tracking-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parcel-tracking-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parcel-tracking-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parcel-tracking-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parcel-tracking-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .parcel-tracking-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .parcel-tracking-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .parcel-tracking-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .parcel-tracking-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .parcel-tracking-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .parcel-tracking-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .parcel-tracking-row { opacity: 1; }
    .parcel-tracking-r0 { animation-delay: 0.00s; }
    .parcel-tracking-r1 { animation-delay: 0.45s; }
    .parcel-tracking-r2 { animation-delay: 0.90s; }
    .parcel-tracking-r3 { animation-delay: 1.35s; }
    .parcel-tracking-r4 { animation-delay: 1.80s; }
    .parcel-tracking-row { animation: parcel-tracking-reveal 7.3s ease-in-out infinite; }
    @keyframes parcel-tracking-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="parcel-tracking-bg" width="980" height="390"/>
  <text class="parcel-tracking-h1"  x="30" y="40">A parcel tracking barcode</text>
  <text class="parcel-tracking-sub" x="30" y="64">Scanned at every hop.</text>
  <rect class="parcel-tracking-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="parcel-tracking-name" x="46" y="122">Untracked</text>
  <text class="parcel-tracking-desc" x="46" y="142">Five days of silence.</text>
  <text class="parcel-tracking-desc parcel-tracking-row parcel-tracking-r0" x="46" y="182">It was sent</text>
  <text class="parcel-tracking-desc parcel-tracking-row parcel-tracking-r1" x="46" y="216">It has not arrived</text>
  <text class="parcel-tracking-desc parcel-tracking-row parcel-tracking-r2" x="46" y="250">Nothing between those two facts</text>
  <text class="parcel-tracking-desc parcel-tracking-row parcel-tracking-r3" x="46" y="284">A delay is undiagnosable</text>
  <text class="parcel-tracking-desc parcel-tracking-row parcel-tracking-r4" x="46" y="318">"It is somewhere"</text>
  <rect class="parcel-tracking-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="parcel-tracking-name" x="526" y="122">Scanned</text>
  <text class="parcel-tracking-desc" x="526" y="142">Every hop recorded.</text>
  <text class="parcel-tracking-desc parcel-tracking-row parcel-tracking-r0" x="526" y="182">Packed at the fulfilment centre</text>
  <text class="parcel-tracking-desc parcel-tracking-row parcel-tracking-r1" x="526" y="216">Scanned into the sorting hub</text>
  <text class="parcel-tracking-desc parcel-tracking-row parcel-tracking-r2" x="526" y="250">Onto the local van</text>
  <text class="parcel-tracking-desc parcel-tracking-row parcel-tracking-r3" x="526" y="284">The delay is at a named hub</text>
  <text class="parcel-tracking-desc parcel-tracking-row parcel-tracking-r4" x="526" y="318">And you can see which</text>
  <text class="parcel-tracking-sub" x="30" y="372">The barcode is the trace ID and the scans are spans, and the useful property is the same: the value is not in any single scan but in being able to see where the sequence stopped.</text>
</svg>
