<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when something simpler works.">
  <title>When to build this pipeline</title>
  <style>
    .rag-when-bg   { fill: #f8fafc; }
    .rag-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rag-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rag-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rag-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rag-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rag-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rag-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rag-when-row { opacity: 1; }
    .rag-when-r0 { animation-delay: 0.00s; }
    .rag-when-r1 { animation-delay: 0.45s; }
    .rag-when-r2 { animation-delay: 0.90s; }
    .rag-when-r3 { animation-delay: 1.35s; }
    .rag-when-r4 { animation-delay: 1.80s; }
    .rag-when-row { animation: rag-when-reveal 7.3s ease-in-out infinite; }
    @keyframes rag-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="rag-when-bg" width="980" height="390"/>
  <text class="rag-when-h1"  x="30" y="40">When to build this pipeline</text>
  <text class="rag-when-sub" x="30" y="64">And when something simpler works.</text>
  <rect class="rag-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="rag-when-name" x="46" y="122">Build the pipeline</text>
  <text class="rag-when-desc" x="46" y="142">Four signals.</text>
  <text class="rag-when-desc rag-when-row rag-when-r0" x="46" y="182">A large or growing document corpus</text>
  <text class="rag-when-desc rag-when-row rag-when-r1" x="46" y="216">Answers must cite sources</text>
  <text class="rag-when-desc rag-when-row rag-when-r2" x="46" y="250">Content changes regularly</text>
  <text class="rag-when-desc rag-when-row rag-when-r3" x="46" y="284">Permissions vary by user</text>
  <text class="rag-when-desc rag-when-row rag-when-r4" x="46" y="318">And questions are open-ended</text>
  <rect class="rag-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="rag-when-name" x="526" y="122">Do something simpler</text>
  <text class="rag-when-desc" x="526" y="142">Also four.</text>
  <text class="rag-when-desc rag-when-row rag-when-r0" x="526" y="182">A corpus that fits in the context window</text>
  <text class="rag-when-desc rag-when-row rag-when-r1" x="526" y="216">A handful of static documents</text>
  <text class="rag-when-desc rag-when-row rag-when-r2" x="526" y="250">Where a search box would do</text>
  <text class="rag-when-desc rag-when-row rag-when-r3" x="526" y="284">Where a person already knows where to look</text>
  <text class="rag-when-desc rag-when-row rag-when-r4" x="526" y="318">And nothing needs citing</text>
  <text class="rag-when-sub" x="30" y="372">A corpus small enough to fit in the context window needs no retrieval system at all, and building one anyway is a common and expensive false start.</text>
</svg>
