<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Unquoted, the shell splits and expands your value before the program sees it.">
  <title>The one rule that prevents most shell disasters</title>
  <style>
    .quote-your-variables-bg   { fill: #f8fafc; }
    .quote-your-variables-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quote-your-variables-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quote-your-variables-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quote-your-variables-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quote-your-variables-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quote-your-variables-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .quote-your-variables-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .quote-your-variables-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .quote-your-variables-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .quote-your-variables-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .quote-your-variables-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .quote-your-variables-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .quote-your-variables-row { opacity: 1; }
    .quote-your-variables-r0 { animation-delay: 0.00s; }
    .quote-your-variables-r1 { animation-delay: 0.45s; }
    .quote-your-variables-r2 { animation-delay: 0.90s; }
    .quote-your-variables-r3 { animation-delay: 1.35s; }
    .quote-your-variables-r4 { animation-delay: 1.80s; }
    .quote-your-variables-row { animation: quote-your-variables-reveal 7.3s ease-in-out infinite; }
    @keyframes quote-your-variables-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="quote-your-variables-bg" width="980" height="390"/>
  <text class="quote-your-variables-h1"  x="30" y="40">The one rule that prevents most shell disasters</text>
  <text class="quote-your-variables-sub" x="30" y="64">Unquoted, the shell splits and expands your value before the program sees it.</text>
  <rect class="quote-your-variables-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="quote-your-variables-name" x="46" y="122">rm $file</text>
  <text class="quote-your-variables-desc" x="46" y="142">file="my notes.txt"</text>
  <text class="quote-your-variables-desc quote-your-variables-row quote-your-variables-r0" x="46" y="182">The shell splits the value at spaces</text>
  <text class="quote-your-variables-desc quote-your-variables-row quote-your-variables-r1" x="46" y="216">rm receives TWO arguments: my and notes.txt</text>
  <text class="quote-your-variables-desc quote-your-variables-row quote-your-variables-r2" x="46" y="250">Neither file exists; the real one survives</text>
  <text class="quote-your-variables-desc quote-your-variables-row quote-your-variables-r3" x="46" y="284">If the value were *, it expands to every file</text>
  <text class="quote-your-variables-desc quote-your-variables-row quote-your-variables-r4" x="46" y="318">Fails loudly here — and silently elsewhere</text>
  <rect class="quote-your-variables-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="quote-your-variables-name" x="526" y="122">rm "$file"</text>
  <text class="quote-your-variables-desc" x="526" y="142">The same variable, quoted.</text>
  <text class="quote-your-variables-desc quote-your-variables-row quote-your-variables-r0" x="526" y="182">No word splitting</text>
  <text class="quote-your-variables-desc quote-your-variables-row quote-your-variables-r1" x="526" y="216">rm receives ONE argument: my notes.txt</text>
  <text class="quote-your-variables-desc quote-your-variables-row quote-your-variables-r2" x="526" y="250">The intended file is removed</text>
  <text class="quote-your-variables-desc quote-your-variables-row quote-your-variables-r3" x="526" y="284">A * is passed through literally</text>
  <text class="quote-your-variables-desc quote-your-variables-row quote-your-variables-r4" x="526" y="318">Quote every expansion unless you mean not to</text>
  <text class="quote-your-variables-sub" x="30" y="372">Almost every shell-scripting disaster you will read about traces back to a missing pair of quotes.</text>
</svg>
