<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The operating system decides. You learn the commands.">
  <title>Which manager, and why you do not choose</title>
  <style>
    .three-managers-bg   { fill: #f8fafc; }
    .three-managers-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-managers-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-managers-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-managers-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-managers-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-managers-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-managers-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-managers-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-managers-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-managers-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-managers-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-managers-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-managers-row { opacity: 1; }
    .three-managers-r0 { animation-delay: 0.00s; }
    .three-managers-r1 { animation-delay: 0.45s; }
    .three-managers-r2 { animation-delay: 0.90s; }
    .three-managers-r3 { animation-delay: 1.35s; }
    .three-managers-r4 { animation-delay: 1.80s; }
    .three-managers-row { animation: three-managers-reveal 7.3s ease-in-out infinite; }
    @keyframes three-managers-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="three-managers-bg" width="980" height="390"/>
  <text class="three-managers-h1"  x="30" y="40">Which manager, and why you do not choose</text>
  <text class="three-managers-sub" x="30" y="64">The operating system decides. You learn the commands.</text>
  <rect class="three-managers-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="three-managers-name" x="46" y="122">Homebrew (macOS)</text>
  <text class="three-managers-desc" x="46" y="142">Installs into your user space.</text>
  <text class="three-managers-desc three-managers-row three-managers-r0" x="46" y="182">brew search / install / list</text>
  <text class="three-managers-desc three-managers-row three-managers-r1" x="46" y="216">No sudo for everyday use</text>
  <text class="three-managers-desc three-managers-row three-managers-r2" x="46" y="250">Also runs on Linux</text>
  <text class="three-managers-desc three-managers-row three-managers-r3" x="46" y="284">Casks install graphical applications</text>
  <text class="three-managers-desc three-managers-row three-managers-r4" x="46" y="318">brew upgrade updates everything</text>
  <rect class="three-managers-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="three-managers-name" x="526" y="122">apt (Debian, Ubuntu)</text>
  <text class="three-managers-desc" x="526" y="142">Installs system-wide.</text>
  <text class="three-managers-desc three-managers-row three-managers-r0" x="526" y="182">apt search / install / list --installed</text>
  <text class="three-managers-desc three-managers-row three-managers-r1" x="526" y="216">sudo required for anything that changes</text>
  <text class="three-managers-desc three-managers-row three-managers-r2" x="526" y="250">The built-in manager; do not fight it</text>
  <text class="three-managers-desc three-managers-row three-managers-r3" x="526" y="284">apt update refreshes the LOCAL index first</text>
  <text class="three-managers-desc three-managers-row three-managers-r4" x="526" y="318">apt upgrade then applies it</text>
  <text class="three-managers-sub" x="30" y="372">winget follows the same shape on Windows 10 and 11. And one layer down, pip and npm do this for libraries rather than whole programs.</text>
</svg>
