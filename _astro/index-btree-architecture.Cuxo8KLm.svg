<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 800" width="1060" height="800" role="img" aria-labelledby="d089a-title d089a-desc">
  <title id="d089a-title">The architecture of an index: the table's own B-tree beside an index B-tree holding sorted keys and rowids that point back into the table, with a covering index that never needs the pointer</title>
  <desc id="d089a-desc">A static architecture diagram in three parts. On the left, the events table drawn as a B-tree of fixed-size pages keyed by rowid, with a root page and two leaf pages holding whole rows. On the right, the index ix_run drawn as a second B-tree keyed by run_id, whose leaf pages hold only a run_id and a rowid, sorted by run_id, with arrows pointing from index entries back to the table pages that hold the rest of each row. Across the bottom, a covering index ix_run_score whose leaf entries carry the score as well, so the query is answered from the index alone and the arrow back to the table is drawn crossed out. A footer records the page size, the depth of the tree at several row counts, and the measured cost of the index in pages.</desc>

  <style>
    .d089a-bg      { fill: #f8fafc; }
    .d089a-title   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 21px; font-weight: 600; fill: #1a202c; }
    .d089a-head    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 600; fill: #1a202c; }
    .d089a-label   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #1a202c; }
    .d089a-small   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d089a-mono    { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 14px; fill: #1a202c; }
    .d089a-monoblue{ font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 14px; fill: #1d4ed8; }
    .d089a-page    { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d089a-idxpage { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d089a-covpage { fill: #dcfce7; stroke: #047857; stroke-width: 1.5; }
    .d089a-group   { fill: none; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .d089a-edge    { fill: none; stroke: #64748b; stroke-width: 2; }
    .d089a-point   { fill: none; stroke: #1d4ed8; stroke-width: 2; stroke-dasharray: 7 5; }
    .d089a-dead    { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 5; }
    .d089a-cross   { stroke: #b91c1c; stroke-width: 3; }
  </style>

  <rect class="d089a-bg" x="0" y="0" width="1060" height="800" />

  <defs>
    <marker id="d089a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <marker id="d089a-arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
    <marker id="d089a-arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
  </defs>

  <text class="d089a-title" x="32" y="40">An index is a second, sorted copy of some columns — plus a pointer home</text>
  <text class="d089a-small" x="32" y="66">Both structures are B-trees of 4,096-byte pages. The table is keyed by rowid; the index is keyed by the columns you named.</text>

  <!-- ============================ THE TABLE ============================ -->
  <rect class="d089a-group" x="26" y="84" width="488" height="330" rx="10" />
  <text class="d089a-head" x="44" y="110">The table: events, a B-tree keyed by rowid</text>
  <text class="d089a-small" x="44" y="132">400,000 rows in 7,392 pages. Every page holds whole rows.</text>

  <rect class="d089a-page" x="164" y="146" width="216" height="52" rx="6" />
  <text class="d089a-small" x="272" y="166" text-anchor="middle">root page</text>
  <text class="d089a-mono" x="272" y="186" text-anchor="middle">rowid &lt; 200000 | &gt;= 200000</text>

  <path class="d089a-edge" d="M 230 200 L 140 236" marker-end="url(#d089a-arrow)" />
  <path class="d089a-edge" d="M 314 200 L 404 236" marker-end="url(#d089a-arrow)" />

  <rect class="d089a-page" x="44" y="242" width="196" height="150" rx="6" />
  <text class="d089a-small" x="56" y="262">leaf page 3</text>
  <text class="d089a-mono" x="56" y="288">41 | run 1 | ok | 0.42</text>
  <text class="d089a-mono" x="56" y="310">42 | run 1 | ok | 0.91</text>
  <text class="d089a-mono" x="56" y="332">43 | run 2 | fail | 0.07</text>
  <text class="d089a-small" x="56" y="360">whole rows, every column</text>
  <text class="d089a-small" x="56" y="380">in rowid order</text>

  <rect class="d089a-page" x="300" y="242" width="196" height="150" rx="6" />
  <text class="d089a-small" x="312" y="262">leaf page 6,118</text>
  <text class="d089a-mono" x="312" y="288">288301 | run 2884 | ok</text>
  <text class="d089a-mono" x="312" y="310">288302 | run 2884 | ok</text>
  <text class="d089a-mono" x="312" y="332">288303 | run 2884 | fail</text>
  <text class="d089a-small" x="312" y="360">a scan reads all 7,392</text>
  <text class="d089a-small" x="312" y="380">of these, in order</text>

  <!-- ============================ THE INDEX ============================ -->
  <rect class="d089a-group" x="546" y="84" width="488" height="330" rx="10" />
  <text class="d089a-head" x="564" y="110">The index: ix_run, a second B-tree keyed by run_id</text>
  <text class="d089a-small" x="564" y="132">The same 400,000 keys in 1,070 pages. Two values per entry.</text>

  <rect class="d089a-idxpage" x="684" y="146" width="216" height="52" rx="6" />
  <text class="d089a-small" x="792" y="166" text-anchor="middle">root page</text>
  <text class="d089a-mono" x="792" y="186" text-anchor="middle">run_id &lt; 2000 | &gt;= 2000</text>

  <path class="d089a-edge" d="M 750 200 L 660 236" marker-end="url(#d089a-arrow)" />
  <path class="d089a-edge" d="M 834 200 L 924 236" marker-end="url(#d089a-arrow)" />

  <rect class="d089a-idxpage" x="564" y="242" width="196" height="150" rx="6" />
  <text class="d089a-small" x="576" y="262">leaf page</text>
  <text class="d089a-mono" x="576" y="288">run 1    -&gt; rowid 41</text>
  <text class="d089a-mono" x="576" y="310">run 1    -&gt; rowid 42</text>
  <text class="d089a-mono" x="576" y="332">run 2    -&gt; rowid 43</text>
  <text class="d089a-small" x="576" y="360">sorted by run_id,</text>
  <text class="d089a-small" x="576" y="380">then by rowid</text>

  <rect class="d089a-idxpage" x="820" y="242" width="196" height="150" rx="6" />
  <text class="d089a-small" x="832" y="262">leaf page</text>
  <text class="d089a-mono" x="832" y="288">run 2884 -&gt; 288301</text>
  <text class="d089a-mono" x="832" y="310">run 2884 -&gt; 288302</text>
  <text class="d089a-mono" x="832" y="332">run 2884 -&gt; 288303</text>
  <text class="d089a-small" x="832" y="360">no title, no status,</text>
  <text class="d089a-small" x="832" y="380">no score: just the key</text>

  <!-- pointers back into the table -->
  <path class="d089a-point" d="M 564 300 C 500 300 300 420 244 300" marker-end="url(#d089a-arrowBlue)" />
  <path class="d089a-point" d="M 820 320 C 700 470 520 470 400 396" marker-end="url(#d089a-arrowBlue)" />
  <text class="d089a-monoblue" x="530" y="440" text-anchor="middle">the rowid is the way back</text>

  <!-- ============================ COVERING ============================ -->
  <rect class="d089a-group" x="26" y="470" width="1008" height="196" rx="10" />
  <text class="d089a-head" x="44" y="498">The covering case: ix_run_score, an index on (run_id, score)</text>
  <text class="d089a-small" x="44" y="520">Same tree, one more value per entry — and now the query never needs the trip back.</text>

  <rect class="d089a-covpage" x="44" y="534" width="286" height="112" rx="6" />
  <text class="d089a-small" x="56" y="554">leaf page</text>
  <text class="d089a-mono" x="56" y="580">run 1 | 0.42 -&gt; rowid 41</text>
  <text class="d089a-mono" x="56" y="602">run 1 | 0.91 -&gt; rowid 42</text>
  <text class="d089a-mono" x="56" y="624">run 2 | 0.07 -&gt; rowid 43</text>

  <path class="d089a-dead" d="M 340 590 L 452 590" marker-end="url(#d089a-arrowGrey)" />
  <line class="d089a-cross" x1="378" y1="572" x2="414" y2="608" />
  <line class="d089a-cross" x1="414" y1="572" x2="378" y2="608" />
  <text class="d089a-small" x="396" y="632" text-anchor="middle">not needed</text>

  <rect class="d089a-page" x="466" y="534" width="168" height="112" rx="6" />
  <text class="d089a-small" x="550" y="580" text-anchor="middle">the table</text>
  <text class="d089a-small" x="550" y="604" text-anchor="middle">never opened</text>

  <text class="d089a-mono" x="662" y="562">SELECT score FROM events</text>
  <text class="d089a-mono" x="662" y="584">WHERE run_id = 1;</text>
  <text class="d089a-monoblue" x="662" y="614">SEARCH events USING</text>
  <text class="d089a-monoblue" x="662" y="634">COVERING INDEX ix_run_score</text>

  <!-- ============================ FOOTER ============================ -->
  <text class="d089a-label" x="32" y="700">Why the depth barely grows: with roughly 100 entries per page, one page holds 100 keys, two levels hold 10,000, three hold 1,000,000.</text>
  <text class="d089a-small" x="32" y="724">A seek reads one page per level, so a million-row table is a handful of page reads — while a scan of the same table reads every one of its pages.</text>
  <text class="d089a-small" x="32" y="748">Measured here on 400,000 rows: the table is 7,392 pages; the index on run_id added 1,070 pages, 14% of the table; a partial index over the 9.9% of rows</text>
  <text class="d089a-small" x="32" y="772">that failed cost 186 pages against 1,857 for the full one. Every index is also work on every insert, update and delete — about 12x slower here with five of them.</text>
</svg>
