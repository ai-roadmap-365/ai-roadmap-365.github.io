<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Testing included.">
  <title>Four consequences of sampling</title>
  <style>
    .sampling-implications-bg   { fill: #f8fafc; }
    .sampling-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sampling-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sampling-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sampling-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sampling-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sampling-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sampling-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sampling-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sampling-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sampling-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sampling-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sampling-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .sampling-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .sampling-implications-stage { opacity: 1; }

    .sampling-implications-s0 { animation-delay: 0.00s; }
    .sampling-implications-e0 { animation-delay: 0.00s; }
    .sampling-implications-s1 { animation-delay: 1.28s; }
    .sampling-implications-e1 { animation-delay: 1.28s; }
    .sampling-implications-s2 { animation-delay: 2.56s; }
    .sampling-implications-e2 { animation-delay: 2.56s; }
    .sampling-implications-s3 { animation-delay: 3.84s; }
    .sampling-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .sampling-implications-conn  { animation: sampling-implications-trace 6.4s ease-in-out infinite; }
      .sampling-implications-stage { animation: sampling-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes sampling-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes sampling-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .sampling-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .sampling-implications-stage { animation: sampling-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes sampling-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="sampling-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="sampling-implications-bg" width="980" height="322"/>
  <text class="sampling-implications-h1"  x="30" y="40">Four consequences of sampling</text>
  <text class="sampling-implications-sub" x="30" y="64">Testing included.</text>
  <g class="sampling-implications-stage sampling-implications-s0">
    <rect class="sampling-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="sampling-implications-step" x="44" y="142">01</text>
    <text class="sampling-implications-name" x="70" y="142">Identical input gives different output</text>
    <text class="sampling-implications-desc" x="44" y="166">By design, unless temperature is</text>
    <text class="sampling-implications-desc" x="44" y="182">zero.</text>
  </g>
  <line class="sampling-implications-line sampling-implications-conn sampling-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#sampling-implications-tip)"/>
  <g class="sampling-implications-stage sampling-implications-s1">
    <rect class="sampling-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="sampling-implications-step" x="280" y="142">02</text>
    <text class="sampling-implications-name" x="306" y="142">Which makes exact-match tests useless</text>
    <text class="sampling-implications-desc" x="280" y="166">Assert properties, not strings.</text>
  </g>
  <line class="sampling-implications-line sampling-implications-conn sampling-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#sampling-implications-tip)"/>
  <g class="sampling-implications-stage sampling-implications-s2">
    <rect class="sampling-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="sampling-implications-step" x="516" y="142">03</text>
    <text class="sampling-implications-name" x="542" y="142">Output length drives cost</text>
    <text class="sampling-implications-desc" x="516" y="166">So an instruction to be brief is</text>
    <text class="sampling-implications-desc" x="516" y="182">a cost control.</text>
  </g>
  <line class="sampling-implications-line sampling-implications-conn sampling-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#sampling-implications-tip)"/>
  <g class="sampling-implications-stage sampling-implications-s3">
    <rect class="sampling-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="sampling-implications-step" x="752" y="142">04</text>
    <text class="sampling-implications-name" x="778" y="142">And rare bad outputs exist at any temperature</text>
    <text class="sampling-implications-desc" x="752" y="166">Which is what output filtering</text>
    <text class="sampling-implications-desc" x="752" y="182">is for.</text>
  </g>
  <text class="sampling-implications-sub" x="30" y="304">Designing tests around properties rather than exact strings is the practical adjustment, and it is the single biggest difference between testing this and testing ordinary code.</text>
</svg>
