<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Or it is measuring its own agreeableness.">
  <title>A judge must be calibrated against people</title>
  <style>
    .judge-calibration-bg   { fill: #f8fafc; }
    .judge-calibration-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-calibration-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-calibration-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-calibration-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-calibration-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-calibration-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .judge-calibration-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .judge-calibration-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .judge-calibration-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .judge-calibration-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .judge-calibration-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .judge-calibration-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .judge-calibration-row { opacity: 1; }
    .judge-calibration-r0 { animation-delay: 0.00s; }
    .judge-calibration-r1 { animation-delay: 0.45s; }
    .judge-calibration-r2 { animation-delay: 0.90s; }
    .judge-calibration-r3 { animation-delay: 1.35s; }
    .judge-calibration-r4 { animation-delay: 1.80s; }
    .judge-calibration-row { animation: judge-calibration-reveal 7.3s ease-in-out infinite; }
    @keyframes judge-calibration-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="judge-calibration-bg" width="980" height="390"/>
  <text class="judge-calibration-h1"  x="30" y="40">A judge must be calibrated against people</text>
  <text class="judge-calibration-sub" x="30" y="64">Or it is measuring its own agreeableness.</text>
  <rect class="judge-calibration-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="judge-calibration-name" x="46" y="122">Uncalibrated</text>
  <text class="judge-calibration-desc" x="46" y="142">Confident, and uninformative.</text>
  <text class="judge-calibration-desc judge-calibration-row judge-calibration-r0" x="46" y="182">"Is this answer good?" — usually yes</text>
  <text class="judge-calibration-desc judge-calibration-row judge-calibration-r1" x="46" y="216">Agrees with whatever it is shown</text>
  <text class="judge-calibration-desc judge-calibration-row judge-calibration-r2" x="46" y="250">Scores cluster near the top</text>
  <text class="judge-calibration-desc judge-calibration-row judge-calibration-r3" x="46" y="284">Cannot distinguish good from adequate</text>
  <text class="judge-calibration-desc judge-calibration-row judge-calibration-r4" x="46" y="318">A number that moves for the wrong reasons</text>
  <rect class="judge-calibration-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="judge-calibration-name" x="526" y="122">Calibrated</text>
  <text class="judge-calibration-desc" x="526" y="142">Checked against human judgement.</text>
  <text class="judge-calibration-desc judge-calibration-row judge-calibration-r0" x="526" y="182">Label 50 examples by hand, once</text>
  <text class="judge-calibration-desc judge-calibration-row judge-calibration-r1" x="526" y="216">Measure the judge's agreement with them</text>
  <text class="judge-calibration-desc judge-calibration-row judge-calibration-r2" x="526" y="250">A specific rubric, not "is it good"</text>
  <text class="judge-calibration-desc judge-calibration-row judge-calibration-r3" x="526" y="284">Grounded in retrieved evidence</text>
  <text class="judge-calibration-desc judge-calibration-row judge-calibration-r4" x="526" y="318">Now the number means something</text>
  <text class="judge-calibration-sub" x="30" y="372">The fifty hand-labelled examples are the unglamorous step that makes everything downstream trustworthy, and skipping it produces a dashboard that is confidently measuring nothing.</text>
</svg>
