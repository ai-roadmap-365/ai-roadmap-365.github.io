<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One of them scales.">
  <title>A card index, or organised shelves</title>
  <style>
    .library-shelving-bg   { fill: #f8fafc; }
    .library-shelving-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-shelving-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-shelving-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-shelving-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-shelving-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-shelving-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .library-shelving-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .library-shelving-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .library-shelving-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .library-shelving-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .library-shelving-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .library-shelving-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .library-shelving-row { opacity: 1; }
    .library-shelving-r0 { animation-delay: 0.00s; }
    .library-shelving-r1 { animation-delay: 0.45s; }
    .library-shelving-r2 { animation-delay: 0.90s; }
    .library-shelving-r3 { animation-delay: 1.35s; }
    .library-shelving-r4 { animation-delay: 1.80s; }
    .library-shelving-row { animation: library-shelving-reveal 7.3s ease-in-out infinite; }
    @keyframes library-shelving-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="library-shelving-bg" width="980" height="390"/>
  <text class="library-shelving-h1"  x="30" y="40">A card index, or organised shelves</text>
  <text class="library-shelving-sub" x="30" y="64">One of them scales.</text>
  <rect class="library-shelving-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="library-shelving-name" x="46" y="122">Checking every shelf</text>
  <text class="library-shelving-desc" x="46" y="142">Certain, and slow.</text>
  <text class="library-shelving-desc library-shelving-row library-shelving-r0" x="46" y="182">You will find it if it is there</text>
  <text class="library-shelving-desc library-shelving-row library-shelving-r1" x="46" y="216">Time grows with the collection</text>
  <text class="library-shelving-desc library-shelving-row library-shelving-r2" x="46" y="250">No catalogue to maintain</text>
  <text class="library-shelving-desc library-shelving-row library-shelving-r3" x="46" y="284">New books need no filing</text>
  <text class="library-shelving-desc library-shelving-row library-shelving-r4" x="46" y="318">This is exact search</text>
  <rect class="library-shelving-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="library-shelving-name" x="526" y="122">An organised catalogue</text>
  <text class="library-shelving-desc" x="526" y="142">Fast, and imperfect.</text>
  <text class="library-shelving-desc library-shelving-row library-shelving-r0" x="526" y="182">Straight to roughly the right place</text>
  <text class="library-shelving-desc library-shelving-row library-shelving-r1" x="526" y="216">Time barely grows with the collection</text>
  <text class="library-shelving-desc library-shelving-row library-shelving-r2" x="526" y="250">The catalogue must be maintained</text>
  <text class="library-shelving-desc library-shelving-row library-shelving-r3" x="526" y="284">Misfiled books are effectively lost</text>
  <text class="library-shelving-desc library-shelving-row library-shelving-r4" x="526" y="318">This is an approximate index</text>
  <text class="library-shelving-sub" x="30" y="372">Misfiled books being effectively lost is exactly the recall trade: the item is present and the search structure will not lead you to it.</text>
</svg>
