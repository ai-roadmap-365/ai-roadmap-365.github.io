<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>What an embedding is</title>
  <style>
    .embedding-idea-bg   { fill: #f8fafc; }
    .embedding-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .embedding-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .embedding-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .embedding-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .embedding-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .embedding-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .embedding-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .embedding-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .embedding-idea-stage { opacity: 1; }

    .embedding-idea-s0 { animation-delay: 0.00s; }
    .embedding-idea-e0 { animation-delay: 0.00s; }
    .embedding-idea-s1 { animation-delay: 1.28s; }
    .embedding-idea-e1 { animation-delay: 1.28s; }
    .embedding-idea-s2 { animation-delay: 2.56s; }
    .embedding-idea-e2 { animation-delay: 2.56s; }
    .embedding-idea-s3 { animation-delay: 3.84s; }
    .embedding-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .embedding-idea-conn  { animation: embedding-idea-trace 6.4s ease-in-out infinite; }
      .embedding-idea-stage { animation: embedding-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes embedding-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes embedding-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .embedding-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .embedding-idea-stage { animation: embedding-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes embedding-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="embedding-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="embedding-idea-bg" width="980" height="322"/>
  <text class="embedding-idea-h1"  x="30" y="40">What an embedding is</text>
  <text class="embedding-idea-sub" x="30" y="64">Four properties.</text>
  <g class="embedding-idea-stage embedding-idea-s0">
    <rect class="embedding-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="embedding-idea-step" x="44" y="142">01</text>
    <text class="embedding-idea-name" x="70" y="142">A list of numbers, of fixed length</text>
    <text class="embedding-idea-desc" x="44" y="166">Hundreds to thousands of them,</text>
    <text class="embedding-idea-desc" x="44" y="182">for any input.</text>
  </g>
  <line class="embedding-idea-line embedding-idea-conn embedding-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#embedding-idea-tip)"/>
  <g class="embedding-idea-stage embedding-idea-s1">
    <rect class="embedding-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="embedding-idea-step" x="280" y="142">02</text>
    <text class="embedding-idea-name" x="306" y="142">Positioned so that similar meanings are near each other</text>
    <text class="embedding-idea-desc" x="280" y="166">Which is the whole property that</text>
    <text class="embedding-idea-desc" x="280" y="182">matters.</text>
  </g>
  <line class="embedding-idea-line embedding-idea-conn embedding-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#embedding-idea-tip)"/>
  <g class="embedding-idea-stage embedding-idea-s2">
    <rect class="embedding-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="embedding-idea-step" x="516" y="142">03</text>
    <text class="embedding-idea-name" x="542" y="142">Learned by pulling related texts together</text>
    <text class="embedding-idea-desc" x="516" y="166">And pushing unrelated ones</text>
    <text class="embedding-idea-desc" x="516" y="182">apart.</text>
  </g>
  <line class="embedding-idea-line embedding-idea-conn embedding-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#embedding-idea-tip)"/>
  <g class="embedding-idea-stage embedding-idea-s3">
    <rect class="embedding-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="embedding-idea-step" x="752" y="142">04</text>
    <text class="embedding-idea-name" x="778" y="142">So meaning becomes distance</text>
    <text class="embedding-idea-desc" x="752" y="166">And search becomes arithmetic.</text>
    <text class="embedding-idea-edge" x="752" y="242">the point</text>
  </g>
  <text class="embedding-idea-sub" x="30" y="304">Turning a question about meaning into a question about geometry is the move that makes everything downstream possible, and it is the entire contribution of the technique.</text>
</svg>
