<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Not by copying the folder.">
  <title>How an environment travels</title>
  <style>
    .pin-and-rebuild-bg   { fill: #f8fafc; }
    .pin-and-rebuild-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pin-and-rebuild-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pin-and-rebuild-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pin-and-rebuild-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pin-and-rebuild-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pin-and-rebuild-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pin-and-rebuild-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pin-and-rebuild-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pin-and-rebuild-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pin-and-rebuild-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pin-and-rebuild-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pin-and-rebuild-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pin-and-rebuild-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pin-and-rebuild-stage { opacity: 1; }

    .pin-and-rebuild-s0 { animation-delay: 0.00s; }
    .pin-and-rebuild-e0 { animation-delay: 0.00s; }
    .pin-and-rebuild-s1 { animation-delay: 1.28s; }
    .pin-and-rebuild-e1 { animation-delay: 1.28s; }
    .pin-and-rebuild-s2 { animation-delay: 2.56s; }
    .pin-and-rebuild-e2 { animation-delay: 2.56s; }
    .pin-and-rebuild-s3 { animation-delay: 3.84s; }
    .pin-and-rebuild-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .pin-and-rebuild-conn  { animation: pin-and-rebuild-trace 6.4s ease-in-out infinite; }
      .pin-and-rebuild-stage { animation: pin-and-rebuild-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes pin-and-rebuild-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pin-and-rebuild-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pin-and-rebuild-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pin-and-rebuild-stage { animation: pin-and-rebuild-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pin-and-rebuild-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pin-and-rebuild-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pin-and-rebuild-bg" width="980" height="322"/>
  <text class="pin-and-rebuild-h1"  x="30" y="40">How an environment travels</text>
  <text class="pin-and-rebuild-sub" x="30" y="64">Not by copying the folder.</text>
  <g class="pin-and-rebuild-stage pin-and-rebuild-s0">
    <rect class="pin-and-rebuild-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="pin-and-rebuild-step" x="44" y="142">01</text>
    <text class="pin-and-rebuild-name" x="70" y="142">Install what you need</text>
    <text class="pin-and-rebuild-desc" x="44" y="166">pip resolves and fetches, into</text>
    <text class="pin-and-rebuild-desc" x="44" y="182">this environment only.</text>
  </g>
  <line class="pin-and-rebuild-line pin-and-rebuild-conn pin-and-rebuild-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#pin-and-rebuild-tip)"/>
  <g class="pin-and-rebuild-stage pin-and-rebuild-s1">
    <rect class="pin-and-rebuild-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="pin-and-rebuild-step" x="280" y="142">02</text>
    <text class="pin-and-rebuild-name" x="306" y="142">pip freeze</text>
    <text class="pin-and-rebuild-desc" x="280" y="166">Every package with its EXACT</text>
    <text class="pin-and-rebuild-desc" x="280" y="182">version — requests==2.32.3, not</text>
    <text class="pin-and-rebuild-desc" x="280" y="198">a range.</text>
    <text class="pin-and-rebuild-edge" x="280" y="242">pinned</text>
  </g>
  <line class="pin-and-rebuild-line pin-and-rebuild-conn pin-and-rebuild-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#pin-and-rebuild-tip)"/>
  <g class="pin-and-rebuild-stage pin-and-rebuild-s2">
    <rect class="pin-and-rebuild-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="pin-and-rebuild-step" x="516" y="142">03</text>
    <text class="pin-and-rebuild-name" x="542" y="142">Commit the file</text>
    <text class="pin-and-rebuild-desc" x="516" y="166">Not the folder. The folder is</text>
    <text class="pin-and-rebuild-desc" x="516" y="182">gigabytes and machine-specific.</text>
    <text class="pin-and-rebuild-edge" x="516" y="242">one file</text>
  </g>
  <line class="pin-and-rebuild-line pin-and-rebuild-conn pin-and-rebuild-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#pin-and-rebuild-tip)"/>
  <g class="pin-and-rebuild-stage pin-and-rebuild-s3">
    <rect class="pin-and-rebuild-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="pin-and-rebuild-step" x="752" y="142">04</text>
    <text class="pin-and-rebuild-name" x="778" y="142">Rebuild anywhere</text>
    <text class="pin-and-rebuild-desc" x="752" y="166">A fresh venv plus pip install -r</text>
    <text class="pin-and-rebuild-desc" x="752" y="182">gives the identical set.</text>
    <text class="pin-and-rebuild-edge" x="752" y="242">identical</text>
  </g>
  <text class="pin-and-rebuild-sub" x="30" y="304">The pin is what makes it identical rather than merely similar: an unpinned requirement installs whatever is current on the day, which is how a project that worked last year stops working today.</text>
</svg>
