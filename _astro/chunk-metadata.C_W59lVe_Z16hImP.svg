<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four fields that earn their place.">
  <title>What to store with each chunk</title>
  <style>
    .chunk-metadata-bg   { fill: #f8fafc; }
    .chunk-metadata-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunk-metadata-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunk-metadata-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunk-metadata-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunk-metadata-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunk-metadata-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chunk-metadata-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .chunk-metadata-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .chunk-metadata-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .chunk-metadata-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .chunk-metadata-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .chunk-metadata-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .chunk-metadata-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .chunk-metadata-stage { opacity: 1; }

    .chunk-metadata-s0 { animation-delay: 0.00s; }
    .chunk-metadata-e0 { animation-delay: 0.00s; }
    .chunk-metadata-s1 { animation-delay: 1.28s; }
    .chunk-metadata-e1 { animation-delay: 1.28s; }
    .chunk-metadata-s2 { animation-delay: 2.56s; }
    .chunk-metadata-e2 { animation-delay: 2.56s; }
    .chunk-metadata-s3 { animation-delay: 3.84s; }
    .chunk-metadata-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .chunk-metadata-conn  { animation: chunk-metadata-trace 6.4s ease-in-out infinite; }
      .chunk-metadata-stage { animation: chunk-metadata-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes chunk-metadata-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes chunk-metadata-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .chunk-metadata-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .chunk-metadata-stage { animation: chunk-metadata-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes chunk-metadata-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="chunk-metadata-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="chunk-metadata-bg" width="980" height="322"/>
  <text class="chunk-metadata-h1"  x="30" y="40">What to store with each chunk</text>
  <text class="chunk-metadata-sub" x="30" y="64">Four fields that earn their place.</text>
  <g class="chunk-metadata-stage chunk-metadata-s0">
    <rect class="chunk-metadata-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="chunk-metadata-step" x="44" y="142">01</text>
    <text class="chunk-metadata-name" x="70" y="142">Source document and a link</text>
    <text class="chunk-metadata-desc" x="44" y="166">So the answer can be cited and</text>
    <text class="chunk-metadata-desc" x="44" y="182">verified.</text>
  </g>
  <line class="chunk-metadata-line chunk-metadata-conn chunk-metadata-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#chunk-metadata-tip)"/>
  <g class="chunk-metadata-stage chunk-metadata-s1">
    <rect class="chunk-metadata-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="chunk-metadata-step" x="280" y="142">02</text>
    <text class="chunk-metadata-name" x="306" y="142">Position and section heading</text>
    <text class="chunk-metadata-desc" x="280" y="166">For expanding to the parent, and</text>
    <text class="chunk-metadata-desc" x="280" y="182">for display.</text>
  </g>
  <line class="chunk-metadata-line chunk-metadata-conn chunk-metadata-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#chunk-metadata-tip)"/>
  <g class="chunk-metadata-stage chunk-metadata-s2">
    <rect class="chunk-metadata-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="chunk-metadata-step" x="516" y="142">03</text>
    <text class="chunk-metadata-name" x="542" y="142">A timestamp</text>
    <text class="chunk-metadata-desc" x="516" y="166">So stale content can be filtered</text>
    <text class="chunk-metadata-desc" x="516" y="182">or down-weighted.</text>
  </g>
  <line class="chunk-metadata-line chunk-metadata-conn chunk-metadata-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#chunk-metadata-tip)"/>
  <g class="chunk-metadata-stage chunk-metadata-s3">
    <rect class="chunk-metadata-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="chunk-metadata-step" x="752" y="142">04</text>
    <text class="chunk-metadata-name" x="778" y="142">And access permissions</text>
    <text class="chunk-metadata-desc" x="752" y="166">Enforced in the query filter,</text>
    <text class="chunk-metadata-desc" x="752" y="182">not after retrieval.</text>
  </g>
  <text class="chunk-metadata-sub" x="30" y="304">Permissions in the filter rather than applied afterwards is the same lesson as filtered vector search: post-filtering an approximate result quietly returns the wrong thing.</text>
</svg>
