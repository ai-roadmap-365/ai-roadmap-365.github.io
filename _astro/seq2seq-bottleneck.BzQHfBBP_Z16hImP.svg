<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One vector for a whole sentence.">
  <title>The bottleneck attention removed</title>
  <style>
    .seq2seq-bottleneck-bg   { fill: #f8fafc; }
    .seq2seq-bottleneck-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .seq2seq-bottleneck-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .seq2seq-bottleneck-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .seq2seq-bottleneck-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .seq2seq-bottleneck-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .seq2seq-bottleneck-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .seq2seq-bottleneck-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .seq2seq-bottleneck-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .seq2seq-bottleneck-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .seq2seq-bottleneck-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .seq2seq-bottleneck-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .seq2seq-bottleneck-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .seq2seq-bottleneck-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .seq2seq-bottleneck-stage { opacity: 1; }

    .seq2seq-bottleneck-s0 { animation-delay: 0.00s; }
    .seq2seq-bottleneck-e0 { animation-delay: 0.00s; }
    .seq2seq-bottleneck-s1 { animation-delay: 1.28s; }
    .seq2seq-bottleneck-e1 { animation-delay: 1.28s; }
    .seq2seq-bottleneck-s2 { animation-delay: 2.56s; }
    .seq2seq-bottleneck-e2 { animation-delay: 2.56s; }
    .seq2seq-bottleneck-s3 { animation-delay: 3.84s; }
    .seq2seq-bottleneck-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .seq2seq-bottleneck-conn  { animation: seq2seq-bottleneck-trace 6.4s ease-in-out infinite; }
      .seq2seq-bottleneck-stage { animation: seq2seq-bottleneck-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes seq2seq-bottleneck-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes seq2seq-bottleneck-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .seq2seq-bottleneck-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .seq2seq-bottleneck-stage { animation: seq2seq-bottleneck-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes seq2seq-bottleneck-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="seq2seq-bottleneck-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="seq2seq-bottleneck-bg" width="980" height="322"/>
  <text class="seq2seq-bottleneck-h1"  x="30" y="40">The bottleneck attention removed</text>
  <text class="seq2seq-bottleneck-sub" x="30" y="64">One vector for a whole sentence.</text>
  <g class="seq2seq-bottleneck-stage seq2seq-bottleneck-s0">
    <rect class="seq2seq-bottleneck-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="seq2seq-bottleneck-step" x="44" y="142">01</text>
    <text class="seq2seq-bottleneck-name" x="70" y="142">The encoder reads the whole source</text>
    <text class="seq2seq-bottleneck-desc" x="44" y="166">Producing a hidden state per</text>
    <text class="seq2seq-bottleneck-desc" x="44" y="182">position.</text>
  </g>
  <line class="seq2seq-bottleneck-line seq2seq-bottleneck-conn seq2seq-bottleneck-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#seq2seq-bottleneck-tip)"/>
  <g class="seq2seq-bottleneck-stage seq2seq-bottleneck-s1">
    <rect class="seq2seq-bottleneck-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="seq2seq-bottleneck-step" x="280" y="142">02</text>
    <text class="seq2seq-bottleneck-name" x="306" y="142">And compresses to one final vector</text>
    <text class="seq2seq-bottleneck-desc" x="280" y="166">Which is all the decoder</text>
    <text class="seq2seq-bottleneck-desc" x="280" y="182">receives.</text>
    <text class="seq2seq-bottleneck-edge" x="280" y="242">the bottleneck</text>
  </g>
  <line class="seq2seq-bottleneck-line seq2seq-bottleneck-conn seq2seq-bottleneck-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#seq2seq-bottleneck-tip)"/>
  <g class="seq2seq-bottleneck-stage seq2seq-bottleneck-s2">
    <rect class="seq2seq-bottleneck-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="seq2seq-bottleneck-step" x="516" y="142">03</text>
    <text class="seq2seq-bottleneck-name" x="542" y="142">The decoder generates from that alone</text>
    <text class="seq2seq-bottleneck-desc" x="516" y="166">Every output word conditioned on</text>
    <text class="seq2seq-bottleneck-desc" x="516" y="182">one fixed-size summary.</text>
  </g>
  <line class="seq2seq-bottleneck-line seq2seq-bottleneck-conn seq2seq-bottleneck-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#seq2seq-bottleneck-tip)"/>
  <g class="seq2seq-bottleneck-stage seq2seq-bottleneck-s3">
    <rect class="seq2seq-bottleneck-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="seq2seq-bottleneck-step" x="752" y="142">04</text>
    <text class="seq2seq-bottleneck-name" x="778" y="142">So quality collapses with length</text>
    <text class="seq2seq-bottleneck-desc" x="752" y="166">A long sentence does not fit in</text>
    <text class="seq2seq-bottleneck-desc" x="752" y="182">a fixed vector.</text>
  </g>
  <text class="seq2seq-bottleneck-sub" x="30" y="304">The observation that translation quality degraded sharply with sentence length is what motivated attention, and it is a clean example of a measurement pointing directly at an architectural fix.</text>
</svg>
