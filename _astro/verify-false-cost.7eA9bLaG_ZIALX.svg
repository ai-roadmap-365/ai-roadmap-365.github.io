<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Not a warning. The identity half of the protocol.">
  <title>What verify=False actually turns off</title>
  <style>
    .verify-false-cost-bg   { fill: #f8fafc; }
    .verify-false-cost-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .verify-false-cost-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .verify-false-cost-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .verify-false-cost-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .verify-false-cost-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .verify-false-cost-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .verify-false-cost-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .verify-false-cost-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .verify-false-cost-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .verify-false-cost-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .verify-false-cost-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .verify-false-cost-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .verify-false-cost-row { opacity: 1; }
    .verify-false-cost-r0 { animation-delay: 0.00s; }
    .verify-false-cost-r1 { animation-delay: 0.45s; }
    .verify-false-cost-r2 { animation-delay: 0.90s; }
    .verify-false-cost-r3 { animation-delay: 1.35s; }
    .verify-false-cost-r4 { animation-delay: 1.80s; }
    .verify-false-cost-row { animation: verify-false-cost-reveal 7.3s ease-in-out infinite; }
    @keyframes verify-false-cost-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="verify-false-cost-bg" width="980" height="390"/>
  <text class="verify-false-cost-h1"  x="30" y="40">What verify=False actually turns off</text>
  <text class="verify-false-cost-sub" x="30" y="64">Not a warning. The identity half of the protocol.</text>
  <rect class="verify-false-cost-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="verify-false-cost-name" x="46" y="122">Verification on</text>
  <text class="verify-false-cost-desc" x="46" y="142">The default, and correct.</text>
  <text class="verify-false-cost-desc verify-false-cost-row verify-false-cost-r0" x="46" y="182">You know which server answered</text>
  <text class="verify-false-cost-desc verify-false-cost-row verify-false-cost-r1" x="46" y="216">An interceptor produces a visible error</text>
  <text class="verify-false-cost-desc verify-false-cost-row verify-false-cost-r2" x="46" y="250">Your API key reaches only the real endpoint</text>
  <text class="verify-false-cost-desc verify-false-cost-row verify-false-cost-r3" x="46" y="284">A compromised network is detected</text>
  <text class="verify-false-cost-desc verify-false-cost-row verify-false-cost-r4" x="46" y="318">Costs nothing</text>
  <rect class="verify-false-cost-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="verify-false-cost-name" x="526" y="122">verify=False / -k</text>
  <text class="verify-false-cost-desc" x="526" y="142">Encrypted to whoever answered.</text>
  <text class="verify-false-cost-desc verify-false-cost-row verify-false-cost-r0" x="526" y="182">Anyone who answers is accepted</text>
  <text class="verify-false-cost-desc verify-false-cost-row verify-false-cost-r1" x="526" y="216">Interception becomes silent and invisible</text>
  <text class="verify-false-cost-desc verify-false-cost-row verify-false-cost-r2" x="526" y="250">Your API key goes wherever it was routed</text>
  <text class="verify-false-cost-desc verify-false-cost-row verify-false-cost-r3" x="526" y="284">A compromised network is undetectable</text>
  <text class="verify-false-cost-desc verify-false-cost-row verify-false-cost-r4" x="526" y="318">Fails open, permanently, and nobody notices</text>
  <text class="verify-false-cost-sub" x="30" y="372">On a corporate network the right fix is installing the organisation's root certificate properly. The wrong fix is the one that also works everywhere else.</text>
</svg>
