<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The difference is who decides the sequence.">
  <title>An agent, or a pipeline</title>
  <style>
    .agent-or-pipeline-bg   { fill: #f8fafc; }
    .agent-or-pipeline-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-or-pipeline-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-or-pipeline-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-or-pipeline-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-or-pipeline-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-or-pipeline-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .agent-or-pipeline-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .agent-or-pipeline-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .agent-or-pipeline-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .agent-or-pipeline-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .agent-or-pipeline-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .agent-or-pipeline-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .agent-or-pipeline-row { opacity: 1; }
    .agent-or-pipeline-r0 { animation-delay: 0.00s; }
    .agent-or-pipeline-r1 { animation-delay: 0.45s; }
    .agent-or-pipeline-r2 { animation-delay: 0.90s; }
    .agent-or-pipeline-r3 { animation-delay: 1.35s; }
    .agent-or-pipeline-r4 { animation-delay: 1.80s; }
    .agent-or-pipeline-row { animation: agent-or-pipeline-reveal 7.3s ease-in-out infinite; }
    @keyframes agent-or-pipeline-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="agent-or-pipeline-bg" width="980" height="390"/>
  <text class="agent-or-pipeline-h1"  x="30" y="40">An agent, or a pipeline</text>
  <text class="agent-or-pipeline-sub" x="30" y="64">The difference is who decides the sequence.</text>
  <rect class="agent-or-pipeline-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="agent-or-pipeline-name" x="46" y="122">An agent</text>
  <text class="agent-or-pipeline-desc" x="46" y="142">The model chooses.</text>
  <text class="agent-or-pipeline-desc agent-or-pipeline-row agent-or-pipeline-r0" x="46" y="182">The next action depends on the last observation</text>
  <text class="agent-or-pipeline-desc agent-or-pipeline-row agent-or-pipeline-r1" x="46" y="216">Branching decided at run time</text>
  <text class="agent-or-pipeline-desc agent-or-pipeline-row agent-or-pipeline-r2" x="46" y="250">Can retry, adjust and abandon</text>
  <text class="agent-or-pipeline-desc agent-or-pipeline-row agent-or-pipeline-r3" x="46" y="284">Needs stopping predicates and budgets</text>
  <text class="agent-or-pipeline-desc agent-or-pipeline-row agent-or-pipeline-r4" x="46" y="318">Variable cost per query</text>
  <rect class="agent-or-pipeline-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="agent-or-pipeline-name" x="526" y="122">A prompt chain</text>
  <text class="agent-or-pipeline-desc" x="526" y="142">You chose.</text>
  <text class="agent-or-pipeline-desc agent-or-pipeline-row agent-or-pipeline-r0" x="526" y="182">A fixed DAG of model calls</text>
  <text class="agent-or-pipeline-desc agent-or-pipeline-row agent-or-pipeline-r1" x="526" y="216">Same steps every time</text>
  <text class="agent-or-pipeline-desc agent-or-pipeline-row agent-or-pipeline-r2" x="526" y="250">No branching on results</text>
  <text class="agent-or-pipeline-desc agent-or-pipeline-row agent-or-pipeline-r3" x="526" y="284">Bounded by construction</text>
  <text class="agent-or-pipeline-desc agent-or-pipeline-row agent-or-pipeline-r4" x="526" y="318">Predictable cost per query</text>
  <text class="agent-or-pipeline-sub" x="30" y="372">Neither is better and calling a pipeline an agent is a common inflation: the pipeline is cheaper, more predictable and easier to test, and it is the right choice whenever the sequence is genuinely known.</text>
</svg>
