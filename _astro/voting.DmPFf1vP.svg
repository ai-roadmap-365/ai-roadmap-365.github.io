<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four options.">
  <title>How the neighbours vote</title>
  <style>
    .voting-bg   { fill: #f8fafc; }
    .voting-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .voting-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .voting-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .voting-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .voting-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .voting-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .voting-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .voting-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .voting-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .voting-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .voting-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .voting-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .voting-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .voting-stage { opacity: 1; }

    .voting-s0 { animation-delay: 0.00s; }
    .voting-e0 { animation-delay: 0.00s; }
    .voting-s1 { animation-delay: 1.28s; }
    .voting-e1 { animation-delay: 1.28s; }
    .voting-s2 { animation-delay: 2.56s; }
    .voting-e2 { animation-delay: 2.56s; }
    .voting-s3 { animation-delay: 3.84s; }
    .voting-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .voting-conn  { animation: voting-trace 6.4s ease-in-out infinite; }
      .voting-stage { animation: voting-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes voting-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes voting-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .voting-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .voting-stage { animation: voting-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes voting-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="voting-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="voting-bg" width="980" height="322"/>
  <text class="voting-h1"  x="30" y="40">How the neighbours vote</text>
  <text class="voting-sub" x="30" y="64">Four options.</text>
  <g class="voting-stage voting-s0">
    <rect class="voting-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="voting-step" x="44" y="142">01</text>
    <text class="voting-name" x="70" y="142">Majority vote</text>
    <text class="voting-desc" x="44" y="166">Each neighbour counts equally.</text>
    <text class="voting-desc" x="44" y="182">The default.</text>
  </g>
  <line class="voting-line voting-conn voting-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#voting-tip)"/>
  <g class="voting-stage voting-s1">
    <rect class="voting-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="voting-step" x="280" y="142">02</text>
    <text class="voting-name" x="306" y="142">Weighted by inverse distance</text>
    <text class="voting-desc" x="280" y="166">Nearer neighbours count more.</text>
  </g>
  <line class="voting-line voting-conn voting-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#voting-tip)"/>
  <g class="voting-stage voting-s2">
    <rect class="voting-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="voting-step" x="516" y="142">03</text>
    <text class="voting-name" x="542" y="142">Mean of the neighbours' values</text>
    <text class="voting-desc" x="516" y="166">Which turns the same method into</text>
    <text class="voting-desc" x="516" y="182">regression.</text>
  </g>
  <line class="voting-line voting-conn voting-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#voting-tip)"/>
  <g class="voting-stage voting-s3">
    <rect class="voting-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="voting-step" x="752" y="142">04</text>
    <text class="voting-name" x="778" y="142">Or the class proportion among them</text>
    <text class="voting-desc" x="752" y="166">Giving a crude probability</text>
    <text class="voting-desc" x="752" y="182">estimate.</text>
    <text class="voting-edge" x="752" y="242">granularity</text>
  </g>
  <text class="voting-sub" x="30" y="304">The probability estimate is coarse by construction: with five neighbours it can only take six values, which is why it calibrates poorly.</text>
</svg>
