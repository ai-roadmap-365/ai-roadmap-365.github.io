<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Exactness or range. You cannot have both in 64 bits.">
  <title>Two number systems, two different promises</title>
  <style>
    .exact-or-approximate-bg   { fill: #f8fafc; }
    .exact-or-approximate-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exact-or-approximate-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exact-or-approximate-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exact-or-approximate-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exact-or-approximate-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exact-or-approximate-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exact-or-approximate-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .exact-or-approximate-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .exact-or-approximate-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .exact-or-approximate-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .exact-or-approximate-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .exact-or-approximate-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exact-or-approximate-row { opacity: 1; }
    .exact-or-approximate-r0 { animation-delay: 0.00s; }
    .exact-or-approximate-r1 { animation-delay: 0.45s; }
    .exact-or-approximate-r2 { animation-delay: 0.90s; }
    .exact-or-approximate-r3 { animation-delay: 1.35s; }
    .exact-or-approximate-r4 { animation-delay: 1.80s; }
    .exact-or-approximate-row { animation: exact-or-approximate-reveal 7.3s ease-in-out infinite; }
    @keyframes exact-or-approximate-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="exact-or-approximate-bg" width="980" height="390"/>
  <text class="exact-or-approximate-h1"  x="30" y="40">Two number systems, two different promises</text>
  <text class="exact-or-approximate-sub" x="30" y="64">Exactness or range. You cannot have both in 64 bits.</text>
  <rect class="exact-or-approximate-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="exact-or-approximate-name" x="46" y="122">int</text>
  <text class="exact-or-approximate-desc" x="46" y="142">Exact, and unbounded.</text>
  <text class="exact-or-approximate-desc exact-or-approximate-row exact-or-approximate-r0" x="46" y="182">Grows until memory runs out</text>
  <text class="exact-or-approximate-desc exact-or-approximate-row exact-or-approximate-r1" x="46" y="216">2**1000 is computed exactly</text>
  <text class="exact-or-approximate-desc exact-or-approximate-row exact-or-approximate-r2" x="46" y="250">No rounding, ever</text>
  <text class="exact-or-approximate-desc exact-or-approximate-row exact-or-approximate-r3" x="46" y="284">== means what you expect</text>
  <text class="exact-or-approximate-desc exact-or-approximate-row exact-or-approximate-r4" x="46" y="318">Slower on very large values</text>
  <rect class="exact-or-approximate-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="exact-or-approximate-name" x="526" y="122">float</text>
  <text class="exact-or-approximate-desc" x="526" y="142">Approximate, and vast.</text>
  <text class="exact-or-approximate-desc exact-or-approximate-row exact-or-approximate-r0" x="526" y="182">Fixed 64 bits, always</text>
  <text class="exact-or-approximate-desc exact-or-approximate-row exact-or-approximate-r1" x="526" y="216">Covers 10^-308 to 10^308</text>
  <text class="exact-or-approximate-desc exact-or-approximate-row exact-or-approximate-r2" x="526" y="250">Rounds on almost every operation</text>
  <text class="exact-or-approximate-desc exact-or-approximate-row exact-or-approximate-r3" x="526" y="284">== asks the wrong question</text>
  <text class="exact-or-approximate-desc exact-or-approximate-row exact-or-approximate-r4" x="526" y="318">What the hardware accelerates</text>
  <text class="exact-or-approximate-sub" x="30" y="372">Python quietly gives you unbounded integers, which most languages do not. That is why a factorial never overflows here and why the surprise, when it comes, is always on the float side.</text>
</svg>
