<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four phases, in that order.">
  <title>Plan, test, implement, verify</title>
  <style>
    .plan-then-execute-bg   { fill: #f8fafc; }
    .plan-then-execute-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .plan-then-execute-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .plan-then-execute-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .plan-then-execute-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .plan-then-execute-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .plan-then-execute-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .plan-then-execute-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .plan-then-execute-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .plan-then-execute-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .plan-then-execute-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .plan-then-execute-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .plan-then-execute-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .plan-then-execute-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .plan-then-execute-stage { opacity: 1; }

    .plan-then-execute-s0 { animation-delay: 0.00s; }
    .plan-then-execute-e0 { animation-delay: 0.00s; }
    .plan-then-execute-s1 { animation-delay: 1.28s; }
    .plan-then-execute-e1 { animation-delay: 1.28s; }
    .plan-then-execute-s2 { animation-delay: 2.56s; }
    .plan-then-execute-e2 { animation-delay: 2.56s; }
    .plan-then-execute-s3 { animation-delay: 3.84s; }
    .plan-then-execute-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .plan-then-execute-conn  { animation: plan-then-execute-trace 6.4s ease-in-out infinite; }
      .plan-then-execute-stage { animation: plan-then-execute-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes plan-then-execute-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes plan-then-execute-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .plan-then-execute-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .plan-then-execute-stage { animation: plan-then-execute-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes plan-then-execute-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="plan-then-execute-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="plan-then-execute-bg" width="980" height="322"/>
  <text class="plan-then-execute-h1"  x="30" y="40">Plan, test, implement, verify</text>
  <text class="plan-then-execute-sub" x="30" y="64">Four phases, in that order.</text>
  <g class="plan-then-execute-stage plan-then-execute-s0">
    <rect class="plan-then-execute-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="plan-then-execute-step" x="44" y="142">01</text>
    <text class="plan-then-execute-name" x="70" y="142">Explore and plan</text>
    <text class="plan-then-execute-desc" x="44" y="166">Read dependencies, emit a plan.</text>
    <text class="plan-then-execute-desc" x="44" y="182">No code yet.</text>
    <text class="plan-then-execute-edge" x="44" y="242">reviewable</text>
  </g>
  <line class="plan-then-execute-line plan-then-execute-conn plan-then-execute-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#plan-then-execute-tip)"/>
  <g class="plan-then-execute-stage plan-then-execute-s1">
    <rect class="plan-then-execute-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="plan-then-execute-step" x="280" y="142">02</text>
    <text class="plan-then-execute-name" x="306" y="142">Author the failing test</text>
    <text class="plan-then-execute-desc" x="280" y="166">The acceptance criterion, as an</text>
    <text class="plan-then-execute-desc" x="280" y="182">executable.</text>
  </g>
  <line class="plan-then-execute-line plan-then-execute-conn plan-then-execute-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#plan-then-execute-tip)"/>
  <g class="plan-then-execute-stage plan-then-execute-s2">
    <rect class="plan-then-execute-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="plan-then-execute-step" x="516" y="142">03</text>
    <text class="plan-then-execute-name" x="542" y="142">Implement</text>
    <text class="plan-then-execute-desc" x="516" y="166">Chunked edits across whatever</text>
    <text class="plan-then-execute-desc" x="516" y="182">files the plan named.</text>
  </g>
  <line class="plan-then-execute-line plan-then-execute-conn plan-then-execute-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#plan-then-execute-tip)"/>
  <g class="plan-then-execute-stage plan-then-execute-s3">
    <rect class="plan-then-execute-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="plan-then-execute-step" x="752" y="142">04</text>
    <text class="plan-then-execute-name" x="778" y="142">Run, read the traceback, repeat</text>
    <text class="plan-then-execute-desc" x="752" y="166">Until green, or until the</text>
    <text class="plan-then-execute-desc" x="752" y="182">iteration cap.</text>
    <text class="plan-then-execute-edge" x="752" y="242">k &lt;= 4</text>
  </g>
  <text class="plan-then-execute-sub" x="30" y="304">Reviewing the plan before any code exists is the highest-leverage minute in the workflow: a wrong plan caught here costs a sentence, and caught after implementation costs the whole diff.</text>
</svg>
