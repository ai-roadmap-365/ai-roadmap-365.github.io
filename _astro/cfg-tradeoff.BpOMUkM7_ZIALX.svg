<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Diversity against adherence.">
  <title>Low guidance against high</title>
  <style>
    .cfg-tradeoff-bg   { fill: #f8fafc; }
    .cfg-tradeoff-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cfg-tradeoff-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cfg-tradeoff-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cfg-tradeoff-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cfg-tradeoff-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cfg-tradeoff-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cfg-tradeoff-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cfg-tradeoff-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cfg-tradeoff-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cfg-tradeoff-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cfg-tradeoff-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cfg-tradeoff-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cfg-tradeoff-row { opacity: 1; }
    .cfg-tradeoff-r0 { animation-delay: 0.00s; }
    .cfg-tradeoff-r1 { animation-delay: 0.45s; }
    .cfg-tradeoff-r2 { animation-delay: 0.90s; }
    .cfg-tradeoff-r3 { animation-delay: 1.35s; }
    .cfg-tradeoff-r4 { animation-delay: 1.80s; }
    .cfg-tradeoff-row { animation: cfg-tradeoff-reveal 7.3s ease-in-out infinite; }
    @keyframes cfg-tradeoff-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cfg-tradeoff-bg" width="980" height="390"/>
  <text class="cfg-tradeoff-h1"  x="30" y="40">Low guidance against high</text>
  <text class="cfg-tradeoff-sub" x="30" y="64">Diversity against adherence.</text>
  <rect class="cfg-tradeoff-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cfg-tradeoff-name" x="46" y="122">Low guidance</text>
  <text class="cfg-tradeoff-desc" x="46" y="142">Loose, and varied.</text>
  <text class="cfg-tradeoff-desc cfg-tradeoff-row cfg-tradeoff-r0" x="46" y="182">Follows the prompt approximately</text>
  <text class="cfg-tradeoff-desc cfg-tradeoff-row cfg-tradeoff-r1" x="46" y="216">Natural colour and composition</text>
  <text class="cfg-tradeoff-desc cfg-tradeoff-row cfg-tradeoff-r2" x="46" y="250">High variation between seeds</text>
  <text class="cfg-tradeoff-desc cfg-tradeoff-row cfg-tradeoff-r3" x="46" y="284">Ignores details you specified</text>
  <text class="cfg-tradeoff-desc cfg-tradeoff-row cfg-tradeoff-r4" x="46" y="318">Right for exploration</text>
  <rect class="cfg-tradeoff-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cfg-tradeoff-name" x="526" y="122">High guidance</text>
  <text class="cfg-tradeoff-desc" x="526" y="142">Literal, and rigid.</text>
  <text class="cfg-tradeoff-desc cfg-tradeoff-row cfg-tradeoff-r0" x="526" y="182">Follows the prompt closely</text>
  <text class="cfg-tradeoff-desc cfg-tradeoff-row cfg-tradeoff-r1" x="526" y="216">Saturated colour, harder edges</text>
  <text class="cfg-tradeoff-desc cfg-tradeoff-row cfg-tradeoff-r2" x="526" y="250">Low variation between seeds</text>
  <text class="cfg-tradeoff-desc cfg-tradeoff-row cfg-tradeoff-r3" x="526" y="284">Artefacts at extreme settings</text>
  <text class="cfg-tradeoff-desc cfg-tradeoff-row cfg-tradeoff-r4" x="526" y="318">Right when the prompt is exact</text>
  <text class="cfg-tradeoff-sub" x="30" y="372">There is no correct setting, only a correct setting for a purpose — which is why it is exposed as a control rather than tuned once and fixed.</text>
</svg>
