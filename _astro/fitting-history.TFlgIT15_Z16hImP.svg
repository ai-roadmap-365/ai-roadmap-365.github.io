<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And one surprise.">
  <title>Four steps in understanding fit</title>
  <style>
    .fitting-history-bg   { fill: #f8fafc; }
    .fitting-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fitting-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fitting-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fitting-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fitting-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fitting-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fitting-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fitting-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fitting-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fitting-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fitting-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fitting-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .fitting-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .fitting-history-stage { opacity: 1; }

    .fitting-history-s0 { animation-delay: 0.00s; }
    .fitting-history-e0 { animation-delay: 0.00s; }
    .fitting-history-s1 { animation-delay: 1.28s; }
    .fitting-history-e1 { animation-delay: 1.28s; }
    .fitting-history-s2 { animation-delay: 2.56s; }
    .fitting-history-e2 { animation-delay: 2.56s; }
    .fitting-history-s3 { animation-delay: 3.84s; }
    .fitting-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .fitting-history-conn  { animation: fitting-history-trace 6.4s ease-in-out infinite; }
      .fitting-history-stage { animation: fitting-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes fitting-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes fitting-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .fitting-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .fitting-history-stage { animation: fitting-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes fitting-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="fitting-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="fitting-history-bg" width="980" height="322"/>
  <text class="fitting-history-h1"  x="30" y="40">Four steps in understanding fit</text>
  <text class="fitting-history-sub" x="30" y="64">And one surprise.</text>
  <g class="fitting-history-stage fitting-history-s0">
    <rect class="fitting-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="fitting-history-step" x="44" y="142">01</text>
    <text class="fitting-history-name" x="70" y="142">The classical bias-variance trade-off</text>
    <text class="fitting-history-desc" x="44" y="166">Which organised the field for</text>
    <text class="fitting-history-desc" x="44" y="182">decades.</text>
  </g>
  <line class="fitting-history-line fitting-history-conn fitting-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#fitting-history-tip)"/>
  <g class="fitting-history-stage fitting-history-s1">
    <rect class="fitting-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="fitting-history-step" x="280" y="142">02</text>
    <text class="fitting-history-name" x="306" y="142">Regularisation gave a way to move along it</text>
    <text class="fitting-history-desc" x="280" y="166">Continuously, rather than by</text>
    <text class="fitting-history-desc" x="280" y="182">changing model.</text>
  </g>
  <line class="fitting-history-line fitting-history-conn fitting-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#fitting-history-tip)"/>
  <g class="fitting-history-stage fitting-history-s2">
    <rect class="fitting-history-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="fitting-history-step" x="516" y="142">03</text>
    <text class="fitting-history-name" x="542" y="142">Then very large models generalised anyway</text>
    <text class="fitting-history-desc" x="516" y="166">Which the classical picture</text>
    <text class="fitting-history-desc" x="516" y="182">forbade.</text>
  </g>
  <line class="fitting-history-line fitting-history-conn fitting-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#fitting-history-tip)"/>
  <g class="fitting-history-stage fitting-history-s3">
    <rect class="fitting-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="fitting-history-step" x="752" y="142">04</text>
    <text class="fitting-history-name" x="778" y="142">And the second descent explained why</text>
    <text class="fitting-history-desc" x="752" y="166">Extending the curve rather than</text>
    <text class="fitting-history-desc" x="752" y="182">replacing it.</text>
  </g>
  <text class="fitting-history-sub" x="30" y="304">The classical picture was not wrong, only incomplete: it described the region anyone had looked at, and the surprise was past its right-hand edge.</text>
</svg>
