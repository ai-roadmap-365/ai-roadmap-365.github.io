<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Rules, skills, memory.">
  <title>Three configuration subsystems</title>
  <style>
    .config-layers-bg   { fill: #f8fafc; }
    .config-layers-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .config-layers-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .config-layers-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .config-layers-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .config-layers-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .config-layers-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .config-layers-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .config-layers-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .config-layers-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .config-layers-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .config-layers-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .config-layers-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .config-layers-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .config-layers-stage { opacity: 1; }

    .config-layers-s0 { animation-delay: 0.00s; }
    .config-layers-e0 { animation-delay: 0.00s; }
    .config-layers-s1 { animation-delay: 1.50s; }
    .config-layers-e1 { animation-delay: 1.50s; }
    .config-layers-s2 { animation-delay: 3.00s; }
    .config-layers-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .config-layers-conn  { animation: config-layers-trace 6s ease-in-out infinite; }
      .config-layers-stage { animation: config-layers-arrive 6s ease-in-out infinite; }
    }
    @keyframes config-layers-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes config-layers-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .config-layers-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .config-layers-stage { animation: config-layers-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes config-layers-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="config-layers-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="config-layers-bg" width="980" height="322"/>
  <text class="config-layers-h1"  x="30" y="40">Three configuration subsystems</text>
  <text class="config-layers-sub" x="30" y="64">Rules, skills, memory.</text>
  <g class="config-layers-stage config-layers-s0">
    <rect class="config-layers-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="config-layers-step" x="44" y="142">01</text>
    <text class="config-layers-name" x="70" y="142">Rules</text>
    <text class="config-layers-desc" x="44" y="166">Build commands, style, architectural</text>
    <text class="config-layers-desc" x="44" y="182">invariants. Injected every turn.</text>
    <text class="config-layers-edge" x="44" y="242">always on</text>
  </g>
  <line class="config-layers-line config-layers-conn config-layers-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#config-layers-tip)"/>
  <g class="config-layers-stage config-layers-s1">
    <rect class="config-layers-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="config-layers-step" x="359" y="142">02</text>
    <text class="config-layers-name" x="385" y="142">Skills</text>
    <text class="config-layers-desc" x="359" y="166">Packaged workflows with helper scripts.</text>
    <text class="config-layers-desc" x="359" y="182">Loaded when triggered.</text>
    <text class="config-layers-edge" x="359" y="242">lazy</text>
  </g>
  <line class="config-layers-line config-layers-conn config-layers-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#config-layers-tip)"/>
  <g class="config-layers-stage config-layers-s2">
    <rect class="config-layers-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="config-layers-step" x="674" y="142">03</text>
    <text class="config-layers-name" x="700" y="142">Memory</text>
    <text class="config-layers-desc" x="674" y="166">Post-mortems and decisions, so a fixed bug is</text>
    <text class="config-layers-desc" x="674" y="182">not reintroduced.</text>
  </g>
  <text class="config-layers-sub" x="30" y="304">The always-on versus lazy split is the design decision that makes this scale: rules are small and universally relevant, and skills are large and relevant occasionally, so they load differently.</text>
</svg>
