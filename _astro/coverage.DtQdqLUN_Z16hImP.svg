<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Attending to the same source twice.">
  <title>Repetition, and coverage</title>
  <style>
    .coverage-bg   { fill: #f8fafc; }
    .coverage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .coverage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .coverage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .coverage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .coverage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .coverage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .coverage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .coverage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .coverage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .coverage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .coverage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .coverage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .coverage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .coverage-stage { opacity: 1; }

    .coverage-s0 { animation-delay: 0.00s; }
    .coverage-e0 { animation-delay: 0.00s; }
    .coverage-s1 { animation-delay: 1.50s; }
    .coverage-e1 { animation-delay: 1.50s; }
    .coverage-s2 { animation-delay: 3.00s; }
    .coverage-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .coverage-conn  { animation: coverage-trace 6s ease-in-out infinite; }
      .coverage-stage { animation: coverage-arrive 6s ease-in-out infinite; }
    }
    @keyframes coverage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes coverage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .coverage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .coverage-stage { animation: coverage-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes coverage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="coverage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="coverage-bg" width="980" height="322"/>
  <text class="coverage-h1"  x="30" y="40">Repetition, and coverage</text>
  <text class="coverage-sub" x="30" y="64">Attending to the same source twice.</text>
  <g class="coverage-stage coverage-s0">
    <rect class="coverage-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="coverage-step" x="44" y="142">01</text>
    <text class="coverage-name" x="70" y="142">The model repeats phrases</text>
    <text class="coverage-desc" x="44" y="166">A well-known failure of early attention</text>
    <text class="coverage-desc" x="44" y="182">models.</text>
  </g>
  <line class="coverage-line coverage-conn coverage-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#coverage-tip)"/>
  <g class="coverage-stage coverage-s1">
    <rect class="coverage-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="coverage-step" x="359" y="142">02</text>
    <text class="coverage-name" x="385" y="142">Because nothing tracks what was used</text>
    <text class="coverage-desc" x="359" y="166">The same source positions can be attended to</text>
    <text class="coverage-desc" x="359" y="182">again and again.</text>
  </g>
  <line class="coverage-line coverage-conn coverage-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#coverage-tip)"/>
  <g class="coverage-stage coverage-s2">
    <rect class="coverage-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="coverage-step" x="674" y="142">03</text>
    <text class="coverage-name" x="700" y="142">Coverage accumulates past attention</text>
    <text class="coverage-desc" x="674" y="166">And penalises attending where the model has</text>
    <text class="coverage-desc" x="674" y="182">already looked.</text>
  </g>
  <text class="coverage-sub" x="30" y="304">Repetition remains a visible failure mode in modern generation, which is why sampling strategies and repetition penalties exist: the underlying cause is the same absence of a used-already signal.</text>
</svg>
