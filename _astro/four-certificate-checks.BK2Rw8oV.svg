<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Naming the failed check turns an hour into a minute.">
  <title>Four checks, and the error tells you which failed</title>
  <style>
    .four-certificate-checks-bg   { fill: #f8fafc; }
    .four-certificate-checks-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-certificate-checks-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-certificate-checks-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-certificate-checks-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-certificate-checks-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-certificate-checks-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .four-certificate-checks-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .four-certificate-checks-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .four-certificate-checks-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .four-certificate-checks-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .four-certificate-checks-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .four-certificate-checks-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .four-certificate-checks-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .four-certificate-checks-stage { opacity: 1; }

    .four-certificate-checks-s0 { animation-delay: 0.00s; }
    .four-certificate-checks-e0 { animation-delay: 0.00s; }
    .four-certificate-checks-s1 { animation-delay: 1.28s; }
    .four-certificate-checks-e1 { animation-delay: 1.28s; }
    .four-certificate-checks-s2 { animation-delay: 2.56s; }
    .four-certificate-checks-e2 { animation-delay: 2.56s; }
    .four-certificate-checks-s3 { animation-delay: 3.84s; }
    .four-certificate-checks-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .four-certificate-checks-conn  { animation: four-certificate-checks-trace 6.4s ease-in-out infinite; }
      .four-certificate-checks-stage { animation: four-certificate-checks-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes four-certificate-checks-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes four-certificate-checks-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .four-certificate-checks-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .four-certificate-checks-stage { animation: four-certificate-checks-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes four-certificate-checks-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="four-certificate-checks-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="four-certificate-checks-bg" width="980" height="322"/>
  <text class="four-certificate-checks-h1"  x="30" y="40">Four checks, and the error tells you which failed</text>
  <text class="four-certificate-checks-sub" x="30" y="64">Naming the failed check turns an hour into a minute.</text>
  <g class="four-certificate-checks-stage four-certificate-checks-s0">
    <rect class="four-certificate-checks-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="four-certificate-checks-step" x="44" y="142">01</text>
    <text class="four-certificate-checks-name" x="70" y="142">Is the chain trusted?</text>
    <text class="four-certificate-checks-desc" x="44" y="166">Signed by an authority in your</text>
    <text class="four-certificate-checks-desc" x="44" y="182">trust store, through valid</text>
    <text class="four-certificate-checks-desc" x="44" y="198">intermediates.</text>
    <text class="four-certificate-checks-edge" x="44" y="242">unknown issuer</text>
  </g>
  <line class="four-certificate-checks-line four-certificate-checks-conn four-certificate-checks-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#four-certificate-checks-tip)"/>
  <g class="four-certificate-checks-stage four-certificate-checks-s1">
    <rect class="four-certificate-checks-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="four-certificate-checks-step" x="280" y="142">02</text>
    <text class="four-certificate-checks-name" x="306" y="142">Is it still valid?</text>
    <text class="four-certificate-checks-desc" x="280" y="166">Within notBefore and notAfter.</text>
    <text class="four-certificate-checks-desc" x="280" y="182">The most common outage there is.</text>
    <text class="four-certificate-checks-edge" x="280" y="242">expired</text>
  </g>
  <line class="four-certificate-checks-line four-certificate-checks-conn four-certificate-checks-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#four-certificate-checks-tip)"/>
  <g class="four-certificate-checks-stage four-certificate-checks-s2">
    <rect class="four-certificate-checks-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="four-certificate-checks-step" x="516" y="142">03</text>
    <text class="four-certificate-checks-name" x="542" y="142">Does the name match?</text>
    <text class="four-certificate-checks-desc" x="516" y="166">The certificate must cover the</text>
    <text class="four-certificate-checks-desc" x="516" y="182">hostname you actually asked for.</text>
    <text class="four-certificate-checks-edge" x="516" y="242">mismatch</text>
  </g>
  <line class="four-certificate-checks-line four-certificate-checks-conn four-certificate-checks-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#four-certificate-checks-tip)"/>
  <g class="four-certificate-checks-stage four-certificate-checks-s3">
    <rect class="four-certificate-checks-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="four-certificate-checks-step" x="752" y="142">04</text>
    <text class="four-certificate-checks-name" x="778" y="142">Is it complete?</text>
    <text class="four-certificate-checks-desc" x="752" y="166">The server must send its</text>
    <text class="four-certificate-checks-desc" x="752" y="182">intermediate. Browsers cache</text>
    <text class="four-certificate-checks-desc" x="752" y="198">them; curl does not.</text>
    <text class="four-certificate-checks-edge" x="752" y="242">local issuer</text>
  </g>
  <text class="four-certificate-checks-sub" x="30" y="304">Read the error before changing anything. Each of these four has a different fix, and none of them is disabling verification.</text>
</svg>
