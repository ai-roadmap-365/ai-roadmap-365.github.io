<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Follow a change from your editor into history.">
  <title>One file, three areas, two commands</title>
  <style>
    .file-journey-bg   { fill: #f8fafc; }
    .file-journey-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-journey-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-journey-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-journey-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-journey-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-journey-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .file-journey-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .file-journey-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .file-journey-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .file-journey-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .file-journey-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .file-journey-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .file-journey-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .file-journey-stage { opacity: 1; }

    .file-journey-s0 { animation-delay: 0.00s; }
    .file-journey-e0 { animation-delay: 0.00s; }
    .file-journey-s1 { animation-delay: 1.28s; }
    .file-journey-e1 { animation-delay: 1.28s; }
    .file-journey-s2 { animation-delay: 2.56s; }
    .file-journey-e2 { animation-delay: 2.56s; }
    .file-journey-s3 { animation-delay: 3.84s; }
    .file-journey-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .file-journey-conn  { animation: file-journey-trace 6.4s ease-in-out infinite; }
      .file-journey-stage { animation: file-journey-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes file-journey-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes file-journey-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .file-journey-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .file-journey-stage { animation: file-journey-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes file-journey-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="file-journey-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="file-journey-bg" width="980" height="322"/>
  <text class="file-journey-h1"  x="30" y="40">One file, three areas, two commands</text>
  <text class="file-journey-sub" x="30" y="64">Follow a change from your editor into history.</text>
  <g class="file-journey-stage file-journey-s0">
    <rect class="file-journey-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="file-journey-step" x="44" y="142">01</text>
    <text class="file-journey-name" x="70" y="142">You edit it</text>
    <text class="file-journey-desc" x="44" y="166">In the working directory. Git</text>
    <text class="file-journey-desc" x="44" y="182">sees the change and records</text>
    <text class="file-journey-desc" x="44" y="198">nothing.</text>
    <text class="file-journey-edge" x="44" y="242">?? or _M</text>
  </g>
  <line class="file-journey-line file-journey-conn file-journey-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#file-journey-tip)"/>
  <g class="file-journey-stage file-journey-s1">
    <rect class="file-journey-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="file-journey-step" x="280" y="142">02</text>
    <text class="file-journey-name" x="306" y="142">git add</text>
    <text class="file-journey-desc" x="280" y="166">Promotes it to the staging area.</text>
    <text class="file-journey-desc" x="280" y="182">You are assembling the next</text>
    <text class="file-journey-desc" x="280" y="198">snapshot.</text>
    <text class="file-journey-edge" x="280" y="242">A_ or M_</text>
  </g>
  <line class="file-journey-line file-journey-conn file-journey-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#file-journey-tip)"/>
  <g class="file-journey-stage file-journey-s2">
    <rect class="file-journey-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="file-journey-step" x="516" y="142">03</text>
    <text class="file-journey-name" x="542" y="142">git commit</text>
    <text class="file-journey-desc" x="516" y="166">Writes the staged snapshot into</text>
    <text class="file-journey-desc" x="516" y="182">the repository, permanently.</text>
    <text class="file-journey-edge" x="516" y="242">712412c</text>
  </g>
  <line class="file-journey-line file-journey-conn file-journey-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#file-journey-tip)"/>
  <g class="file-journey-stage file-journey-s3">
    <rect class="file-journey-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="file-journey-step" x="752" y="142">04</text>
    <text class="file-journey-name" x="778" y="142">Staging clears</text>
    <text class="file-journey-desc" x="752" y="166">Ready for the next round. The</text>
    <text class="file-journey-desc" x="752" y="182">working directory is unchanged.</text>
    <text class="file-journey-edge" x="752" y="242">clean</text>
  </g>
  <text class="file-journey-sub" x="30" y="304">Almost every Git command you will learn is a variation on moving content between these three places, or on looking at what is in each of them.</text>
</svg>
