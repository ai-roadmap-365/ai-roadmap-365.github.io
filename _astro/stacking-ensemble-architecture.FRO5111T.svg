<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="Stacking Ensemble Architecture Diagram">
  <title>Stacking Ensemble Architecture</title>
  <defs>
    <style>
      .d168f-bg { fill: #f8fafc; }
      .d168f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d168f-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; }
      .d168f-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
      .d168f-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 11px; font-weight: 600; }
      .d168f-arrow { stroke: #2563eb; stroke-width: 2; marker-end: url(#d168f-arr); fill: none; }
    </style>
    <marker id="d168f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="d168f-bg" />

  <text x="40" y="45" class="d168f-title" font-size="22">Multi-Model Stacking Ensemble Architecture</text>
  <text x="40" y="70" class="d168f-text" font-size="13">Generating Out-of-Fold Matrix Z (N, M) ➔ Training Level-1 Meta-Learner</text>

  <!-- Level 0 Box -->
  <rect x="40" y="100" width="480" height="340" class="d168f-card" fill="#eff6ff" stroke="#3b82f6" stroke-dasharray="4 2" />
  <text x="60" y="130" class="d168f-title" fill="#1d4ed8">LEVEL 0: Diverse Base Models (K-Fold OOF Predictions)</text>

  <!-- Model 1: LightGBM -->
  <rect x="60" y="150" width="440" height="60" class="d168f-card" />
  <text x="75" y="175" class="d168f-title" font-size="13" fill="#15803d">Base Model 1: LightGBM (Histogram Tree)</text>
  <text x="75" y="195" class="d168f-math">Generates Out-of-Fold Column: Z[:, 0]</text>

  <!-- Model 2: XGBoost -->
  <rect x="60" y="225" width="440" height="60" class="d168f-card" />
  <text x="75" y="250" class="d168f-title" font-size="13" fill="#b91c1c">Base Model 2: XGBoost (Exact Second-Order)</text>
  <text x="75" y="270" class="d168f-math">Generates Out-of-Fold Column: Z[:, 1]</text>

  <!-- Model 3: Random Forest / Neural -->
  <rect x="60" y="300" width="440" height="60" class="d168f-card" />
  <text x="75" y="325" class="d168f-title" font-size="13" fill="#7c3aed">Base Model 3: Random Forest / Neural Tabular</text>
  <text x="75" y="345" class="d168f-math">Generates Out-of-Fold Column: Z[:, 2]</text>

  <text x="60" y="415" class="d168f-text" font-weight="700">Combined Meta-Feature Matrix: Z ∈ ℝ^{N × 3} (Zero Data Leakage!)</text>

  <!-- Arrow to Level 1 -->
  <path d="M 520 270 L 590 270" class="d168f-arrow" stroke-width="3" />

  <!-- Level 1 Box -->
  <rect x="590" y="100" width="270" height="340" class="d168f-card" fill="#fdf2f8" stroke="#ec4899" />
  <text x="610" y="130" class="d168f-title" fill="#9d174d">LEVEL 1: Meta-Learner</text>

  <rect x="610" y="160" width="230" height="110" class="d168f-card" />
  <text x="625" y="185" class="d168f-title" font-size="13">Ridge / Logistic Regression</text>
  <text x="625" y="210" class="d168f-math">ŷ = σ(w₁z₁ + w₂z₂ + w₃z₃ + b)</text>
  <text x="625" y="235" class="d168f-text">• Learns optimal blend weights.</text>
  <text x="625" y="255" class="d168f-text">• Regularization prevents overfit.</text>

  <rect x="610" y="290" width="230" height="120" class="d168f-card" fill="#f0fdf4" stroke="#22c55e" />
  <text x="625" y="315" class="d168f-title" font-size="13" fill="#15803d">Final Ensemble Output</text>
  <text x="625" y="340" class="d168f-text">Cancels individual base model blind spots.</text>
  <text x="625" y="365" class="d168f-text">Delivers +1% to +3% higher AUC on real-world enterprise tables.</text>
</svg>
