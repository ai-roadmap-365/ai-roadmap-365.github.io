<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four things production adds.">
  <title>What the minimal version leaves out</title>
  <style>
    .scratch-implications-bg   { fill: #f8fafc; }
    .scratch-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scratch-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scratch-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scratch-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scratch-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scratch-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scratch-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .scratch-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .scratch-implications-stage { opacity: 1; }

    .scratch-implications-s0 { animation-delay: 0.00s; }
    .scratch-implications-e0 { animation-delay: 0.00s; }
    .scratch-implications-s1 { animation-delay: 1.28s; }
    .scratch-implications-e1 { animation-delay: 1.28s; }
    .scratch-implications-s2 { animation-delay: 2.56s; }
    .scratch-implications-e2 { animation-delay: 2.56s; }
    .scratch-implications-s3 { animation-delay: 3.84s; }
    .scratch-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .scratch-implications-conn  { animation: scratch-implications-trace 6.4s ease-in-out infinite; }
      .scratch-implications-stage { animation: scratch-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes scratch-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes scratch-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .scratch-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .scratch-implications-stage { animation: scratch-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes scratch-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="scratch-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="scratch-implications-bg" width="980" height="322"/>
  <text class="scratch-implications-h1"  x="30" y="40">What the minimal version leaves out</text>
  <text class="scratch-implications-sub" x="30" y="64">Four things production adds.</text>
  <g class="scratch-implications-stage scratch-implications-s0">
    <rect class="scratch-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="scratch-implications-step" x="44" y="142">01</text>
    <text class="scratch-implications-name" x="70" y="142">Scale</text>
    <text class="scratch-implications-desc" x="44" y="166">Exact search stops being viable</text>
    <text class="scratch-implications-desc" x="44" y="182">somewhere past a million chunks.</text>
  </g>
  <line class="scratch-implications-line scratch-implications-conn scratch-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#scratch-implications-tip)"/>
  <g class="scratch-implications-stage scratch-implications-s1">
    <rect class="scratch-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="scratch-implications-step" x="280" y="142">02</text>
    <text class="scratch-implications-name" x="306" y="142">Incremental updates</text>
    <text class="scratch-implications-desc" x="280" y="166">Rebuilding everything on each</text>
    <text class="scratch-implications-desc" x="280" y="182">change does not survive a real</text>
    <text class="scratch-implications-desc" x="280" y="198">corpus.</text>
  </g>
  <line class="scratch-implications-line scratch-implications-conn scratch-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#scratch-implications-tip)"/>
  <g class="scratch-implications-stage scratch-implications-s2">
    <rect class="scratch-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="scratch-implications-step" x="516" y="142">03</text>
    <text class="scratch-implications-name" x="542" y="142">Permissions</text>
    <text class="scratch-implications-desc" x="516" y="166">Filtering by who is allowed to</text>
    <text class="scratch-implications-desc" x="516" y="182">see what.</text>
  </g>
  <line class="scratch-implications-line scratch-implications-conn scratch-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#scratch-implications-tip)"/>
  <g class="scratch-implications-stage scratch-implications-s3">
    <rect class="scratch-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="scratch-implications-step" x="752" y="142">04</text>
    <text class="scratch-implications-name" x="778" y="142">And observability</text>
    <text class="scratch-implications-desc" x="752" y="166">Traces, metrics and evaluation</text>
    <text class="scratch-implications-desc" x="752" y="182">on live traffic.</text>
  </g>
  <text class="scratch-implications-sub" x="30" y="304">None of these change the algorithm, which is the reassuring part: the production system is this one with operations around it, not a different design.</text>
</svg>
