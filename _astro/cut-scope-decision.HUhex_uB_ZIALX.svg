<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The outcome that saves the project.">
  <title>Cutting scope at the review</title>
  <style>
    .cut-scope-decision-bg   { fill: #f8fafc; }
    .cut-scope-decision-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cut-scope-decision-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cut-scope-decision-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cut-scope-decision-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cut-scope-decision-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cut-scope-decision-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cut-scope-decision-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cut-scope-decision-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cut-scope-decision-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cut-scope-decision-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cut-scope-decision-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cut-scope-decision-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cut-scope-decision-row { opacity: 1; }
    .cut-scope-decision-r0 { animation-delay: 0.00s; }
    .cut-scope-decision-r1 { animation-delay: 0.45s; }
    .cut-scope-decision-r2 { animation-delay: 0.90s; }
    .cut-scope-decision-r3 { animation-delay: 1.35s; }
    .cut-scope-decision-r4 { animation-delay: 1.80s; }
    .cut-scope-decision-row { animation: cut-scope-decision-reveal 7.3s ease-in-out infinite; }
    @keyframes cut-scope-decision-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cut-scope-decision-bg" width="980" height="390"/>
  <text class="cut-scope-decision-h1"  x="30" y="40">Cutting scope at the review</text>
  <text class="cut-scope-decision-sub" x="30" y="64">The outcome that saves the project.</text>
  <rect class="cut-scope-decision-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cut-scope-decision-name" x="46" y="122">Cut at the milestone</text>
  <text class="cut-scope-decision-desc" x="46" y="142">A decision, taken calmly.</text>
  <text class="cut-scope-decision-desc cut-scope-decision-row cut-scope-decision-r0" x="46" y="182">Half the time remains</text>
  <text class="cut-scope-decision-desc cut-scope-decision-row cut-scope-decision-r1" x="46" y="216">The removed feature is written down as future work</text>
  <text class="cut-scope-decision-desc cut-scope-decision-row cut-scope-decision-r2" x="46" y="250">The rest gets finished properly</text>
  <text class="cut-scope-decision-desc cut-scope-decision-row cut-scope-decision-r3" x="46" y="284">The demo is complete and honest</text>
  <text class="cut-scope-decision-desc cut-scope-decision-row cut-scope-decision-r4" x="46" y="318">Nobody works the last night</text>
  <rect class="cut-scope-decision-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cut-scope-decision-name" x="526" y="122">Cut at the deadline</text>
  <text class="cut-scope-decision-desc" x="526" y="142">Not a decision — a consequence.</text>
  <text class="cut-scope-decision-desc cut-scope-decision-row cut-scope-decision-r0" x="526" y="182">Everything is half-built</text>
  <text class="cut-scope-decision-desc cut-scope-decision-row cut-scope-decision-r1" x="526" y="216">Nothing is finished enough to show</text>
  <text class="cut-scope-decision-desc cut-scope-decision-row cut-scope-decision-r2" x="526" y="250">Documentation and tests are what get dropped</text>
  <text class="cut-scope-decision-desc cut-scope-decision-row cut-scope-decision-r3" x="526" y="284">The demo has visible gaps</text>
  <text class="cut-scope-decision-desc cut-scope-decision-row cut-scope-decision-r4" x="526" y="318">And the last night is worked anyway</text>
  <text class="cut-scope-decision-sub" x="30" y="372">A capstone judged on a finished smaller system beats one judged on an ambitious unfinished one, every time — and the milestone review is the last point at which that choice is still yours to make.</text>
</svg>
