<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Different jobs.">
  <title>Docstrings against comments</title>
  <style>
    .docstrings-bg   { fill: #f8fafc; }
    .docstrings-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docstrings-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docstrings-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docstrings-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docstrings-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docstrings-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .docstrings-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .docstrings-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .docstrings-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .docstrings-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .docstrings-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .docstrings-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .docstrings-row { opacity: 1; }
    .docstrings-r0 { animation-delay: 0.00s; }
    .docstrings-r1 { animation-delay: 0.45s; }
    .docstrings-r2 { animation-delay: 0.90s; }
    .docstrings-r3 { animation-delay: 1.35s; }
    .docstrings-r4 { animation-delay: 1.80s; }
    .docstrings-row { animation: docstrings-reveal 7.3s ease-in-out infinite; }
    @keyframes docstrings-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="docstrings-bg" width="980" height="390"/>
  <text class="docstrings-h1"  x="30" y="40">Docstrings against comments</text>
  <text class="docstrings-sub" x="30" y="64">Different jobs.</text>
  <rect class="docstrings-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="docstrings-name" x="46" y="122">A docstring</text>
  <text class="docstrings-desc" x="46" y="142">What and how to use it.</text>
  <text class="docstrings-desc docstrings-row docstrings-r0" x="46" y="182">Describes the contract</text>
  <text class="docstrings-desc docstrings-row docstrings-r1" x="46" y="216">Read by users of the function</text>
  <text class="docstrings-desc docstrings-row docstrings-r2" x="46" y="250">Available at runtime and in help</text>
  <text class="docstrings-desc docstrings-row docstrings-r3" x="46" y="284">Says what, not how</text>
  <text class="docstrings-desc docstrings-row docstrings-r4" x="46" y="318">Belongs on anything public</text>
  <rect class="docstrings-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="docstrings-name" x="526" y="122">A comment</text>
  <text class="docstrings-desc" x="526" y="142">Why it is like this.</text>
  <text class="docstrings-desc docstrings-row docstrings-r0" x="526" y="182">Explains a non-obvious decision</text>
  <text class="docstrings-desc docstrings-row docstrings-r1" x="526" y="216">Read by maintainers of the code</text>
  <text class="docstrings-desc docstrings-row docstrings-r2" x="526" y="250">Stripped from the running program</text>
  <text class="docstrings-desc docstrings-row docstrings-r3" x="526" y="284">Should say why, never what</text>
  <text class="docstrings-desc docstrings-row docstrings-r4" x="526" y="318">Belongs where the code surprises</text>
  <text class="docstrings-sub" x="30" y="372">A comment that restates the code is the one to avoid: it adds nothing and it will eventually contradict the line beneath it.</text>
</svg>
