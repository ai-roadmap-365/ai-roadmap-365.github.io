<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By how much they cost.">
  <title>Three families of selection</title>
  <style>
    .selection-families-bg   { fill: #f8fafc; }
    .selection-families-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .selection-families-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .selection-families-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .selection-families-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .selection-families-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .selection-families-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .selection-families-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .selection-families-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .selection-families-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .selection-families-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .selection-families-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .selection-families-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .selection-families-row { opacity: 1; }
    .selection-families-r0 { animation-delay: 0.00s; }
    .selection-families-r1 { animation-delay: 0.45s; }
    .selection-families-r2 { animation-delay: 0.90s; }
    .selection-families-r3 { animation-delay: 1.35s; }
    .selection-families-r4 { animation-delay: 1.80s; }
    .selection-families-row { animation: selection-families-reveal 7.3s ease-in-out infinite; }
    @keyframes selection-families-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="selection-families-bg" width="980" height="390"/>
  <text class="selection-families-h1"  x="30" y="40">Three families of selection</text>
  <text class="selection-families-sub" x="30" y="64">By how much they cost.</text>
  <rect class="selection-families-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="selection-families-name" x="46" y="122">The family</text>
  <text class="selection-families-desc" x="46" y="142">How it selects.</text>
  <text class="selection-families-desc selection-families-row selection-families-r0" x="46" y="182">Filter — score each feature independently</text>
  <text class="selection-families-desc selection-families-row selection-families-r1" x="46" y="216">Wrapper — train models on subsets</text>
  <text class="selection-families-desc selection-families-row selection-families-r2" x="46" y="250">Embedded — the model selects while fitting</text>
  <text class="selection-families-desc selection-families-row selection-families-r3" x="46" y="284">Filters ignore interactions entirely</text>
  <text class="selection-families-desc selection-families-row selection-families-r4" x="46" y="318">Wrappers are exhaustive and expensive</text>
  <rect class="selection-families-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="selection-families-name" x="526" y="122">The trade</text>
  <text class="selection-families-desc" x="526" y="142">What it costs.</text>
  <text class="selection-families-desc selection-families-row selection-families-r0" x="526" y="182">Fast, model-agnostic, crude</text>
  <text class="selection-families-desc selection-families-row selection-families-r1" x="526" y="216">Slow, model-specific, thorough</text>
  <text class="selection-families-desc selection-families-row selection-families-r2" x="526" y="250">One fit, and usually the best value</text>
  <text class="selection-families-desc selection-families-row selection-families-r3" x="526" y="284">Miss features that only matter jointly</text>
  <text class="selection-families-desc selection-families-row selection-families-r4" x="526" y="318">Cost grows with the feature count</text>
  <text class="selection-families-sub" x="30" y="372">Filters missing jointly-useful features is their defining weakness: two features that are useless alone and decisive together will both be discarded.</text>
</svg>
