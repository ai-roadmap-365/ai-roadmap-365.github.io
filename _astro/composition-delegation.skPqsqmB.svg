<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Delegation</title>
  <style>
    .composition-delegation-bg   { fill: #f8fafc; }
    .composition-delegation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .composition-delegation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .composition-delegation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .composition-delegation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .composition-delegation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .composition-delegation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .composition-delegation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .composition-delegation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .composition-delegation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .composition-delegation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .composition-delegation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .composition-delegation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .composition-delegation-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .composition-delegation-stage { opacity: 1; }

    .composition-delegation-s0 { animation-delay: 0.00s; }
    .composition-delegation-e0 { animation-delay: 0.00s; }
    .composition-delegation-s1 { animation-delay: 1.28s; }
    .composition-delegation-e1 { animation-delay: 1.28s; }
    .composition-delegation-s2 { animation-delay: 2.56s; }
    .composition-delegation-e2 { animation-delay: 2.56s; }
    .composition-delegation-s3 { animation-delay: 3.84s; }
    .composition-delegation-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .composition-delegation-conn  { animation: composition-delegation-trace 6.4s ease-in-out infinite; }
      .composition-delegation-stage { animation: composition-delegation-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes composition-delegation-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes composition-delegation-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .composition-delegation-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .composition-delegation-stage { animation: composition-delegation-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes composition-delegation-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="composition-delegation-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="composition-delegation-bg" width="980" height="322"/>
  <text class="composition-delegation-h1"  x="30" y="40">Delegation</text>
  <text class="composition-delegation-sub" x="30" y="64">Four steps.</text>
  <g class="composition-delegation-stage composition-delegation-s0">
    <rect class="composition-delegation-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="composition-delegation-step" x="44" y="142">01</text>
    <text class="composition-delegation-name" x="70" y="142">The object holds another</text>
    <text class="composition-delegation-desc" x="44" y="166">Passed in, rather than</text>
    <text class="composition-delegation-desc" x="44" y="182">inherited.</text>
  </g>
  <line class="composition-delegation-line composition-delegation-conn composition-delegation-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#composition-delegation-tip)"/>
  <g class="composition-delegation-stage composition-delegation-s1">
    <rect class="composition-delegation-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="composition-delegation-step" x="280" y="142">02</text>
    <text class="composition-delegation-name" x="306" y="142">And forwards the calls it wants to expose</text>
    <text class="composition-delegation-desc" x="280" y="166">Explicitly, one method at a</text>
    <text class="composition-delegation-desc" x="280" y="182">time.</text>
  </g>
  <line class="composition-delegation-line composition-delegation-conn composition-delegation-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#composition-delegation-tip)"/>
  <g class="composition-delegation-stage composition-delegation-s2">
    <rect class="composition-delegation-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="composition-delegation-step" x="516" y="142">03</text>
    <text class="composition-delegation-name" x="542" y="142">So the interface is exactly what you chose</text>
    <text class="composition-delegation-desc" x="516" y="166">Not everything the other object</text>
    <text class="composition-delegation-desc" x="516" y="182">offers.</text>
  </g>
  <line class="composition-delegation-line composition-delegation-conn composition-delegation-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#composition-delegation-tip)"/>
  <g class="composition-delegation-stage composition-delegation-s3">
    <rect class="composition-delegation-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="composition-delegation-step" x="752" y="142">04</text>
    <text class="composition-delegation-name" x="778" y="142">And the held object can be replaced</text>
    <text class="composition-delegation-desc" x="752" y="166">Including by a test double.</text>
  </g>
  <text class="composition-delegation-sub" x="30" y="304">Substitutability is the practical payoff: a composed dependency can be swapped for a fake in a test, and an inherited one cannot.</text>
</svg>
