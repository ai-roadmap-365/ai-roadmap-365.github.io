<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="All answerable in ten seconds.">
  <title>Five checks before you press Enter</title>
  <style>
    .spec-checklist-bg   { fill: #f8fafc; }
    .spec-checklist-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spec-checklist-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spec-checklist-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spec-checklist-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spec-checklist-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spec-checklist-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .spec-checklist-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .spec-checklist-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .spec-checklist-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .spec-checklist-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .spec-checklist-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .spec-checklist-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .spec-checklist-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .spec-checklist-stage { opacity: 1; }

    .spec-checklist-s0 { animation-delay: 0.00s; }
    .spec-checklist-e0 { animation-delay: 0.00s; }
    .spec-checklist-s1 { animation-delay: 1.33s; }
    .spec-checklist-e1 { animation-delay: 1.33s; }
    .spec-checklist-s2 { animation-delay: 2.67s; }
    .spec-checklist-e2 { animation-delay: 2.67s; }
    .spec-checklist-s3 { animation-delay: 4.00s; }
    .spec-checklist-e3 { animation-delay: 4.00s; }
    .spec-checklist-s4 { animation-delay: 5.33s; }
    .spec-checklist-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .spec-checklist-conn  { animation: spec-checklist-trace 8s ease-in-out infinite; }
      .spec-checklist-stage { animation: spec-checklist-arrive 8s ease-in-out infinite; }
    }
    @keyframes spec-checklist-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes spec-checklist-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .spec-checklist-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .spec-checklist-stage { animation: spec-checklist-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes spec-checklist-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="spec-checklist-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="spec-checklist-bg" width="980" height="322"/>
  <text class="spec-checklist-h1"  x="30" y="40">Five checks before you press Enter</text>
  <text class="spec-checklist-sub" x="30" y="64">All answerable in ten seconds.</text>
  <g class="spec-checklist-stage spec-checklist-s0">
    <rect class="spec-checklist-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="spec-checklist-step" x="44" y="142">01</text>
    <text class="spec-checklist-name" x="70" y="142">Exact file paths</text>
    <text class="spec-checklist-desc" x="44" y="166">Relative, and complete.</text>
  </g>
  <line class="spec-checklist-line spec-checklist-conn spec-checklist-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#spec-checklist-tip)"/>
  <g class="spec-checklist-stage spec-checklist-s1">
    <rect class="spec-checklist-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="spec-checklist-step" x="233" y="142">02</text>
    <text class="spec-checklist-name" x="259" y="142">Type signatures for inputs and outputs</text>
    <text class="spec-checklist-desc" x="233" y="166">Pydantic or TypeScript,</text>
    <text class="spec-checklist-desc" x="233" y="182">included in the prompt.</text>
  </g>
  <line class="spec-checklist-line spec-checklist-conn spec-checklist-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#spec-checklist-tip)"/>
  <g class="spec-checklist-stage spec-checklist-s2">
    <rect class="spec-checklist-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="spec-checklist-step" x="422" y="142">03</text>
    <text class="spec-checklist-name" x="448" y="142">Hard invariants</text>
    <text class="spec-checklist-desc" x="422" y="166">Error codes, status</text>
    <text class="spec-checklist-desc" x="422" y="182">returns, edge cases.</text>
  </g>
  <line class="spec-checklist-line spec-checklist-conn spec-checklist-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#spec-checklist-tip)"/>
  <g class="spec-checklist-stage spec-checklist-s3">
    <rect class="spec-checklist-warn" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="spec-checklist-step" x="611" y="142">04</text>
    <text class="spec-checklist-name" x="637" y="142">Explicit non-goals</text>
    <text class="spec-checklist-desc" x="611" y="166">No unrelated files, no</text>
    <text class="spec-checklist-desc" x="611" y="182">signature changes, no new</text>
    <text class="spec-checklist-desc" x="611" y="198">dependencies.</text>
  </g>
  <line class="spec-checklist-line spec-checklist-conn spec-checklist-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#spec-checklist-tip)"/>
  <g class="spec-checklist-stage spec-checklist-s4">
    <rect class="spec-checklist-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="spec-checklist-step" x="800" y="142">05</text>
    <text class="spec-checklist-name" x="826" y="142">A deterministic verification gate</text>
    <text class="spec-checklist-desc" x="800" y="166">The exact command, so the</text>
    <text class="spec-checklist-desc" x="800" y="182">agent self-verifies.</text>
  </g>
  <text class="spec-checklist-sub" x="30" y="304">Running through five questions costs less than reviewing one bad diff, which is the whole economic case: the checklist is cheaper than the failure it prevents, every time.</text>
</svg>
