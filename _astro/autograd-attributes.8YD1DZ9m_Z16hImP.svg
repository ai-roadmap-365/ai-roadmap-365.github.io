<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which decide what autograd does.">
  <title>Three tensor attributes</title>
  <style>
    .autograd-attributes-bg   { fill: #f8fafc; }
    .autograd-attributes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .autograd-attributes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .autograd-attributes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .autograd-attributes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .autograd-attributes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .autograd-attributes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .autograd-attributes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .autograd-attributes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .autograd-attributes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .autograd-attributes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .autograd-attributes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .autograd-attributes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .autograd-attributes-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .autograd-attributes-stage { opacity: 1; }

    .autograd-attributes-s0 { animation-delay: 0.00s; }
    .autograd-attributes-e0 { animation-delay: 0.00s; }
    .autograd-attributes-s1 { animation-delay: 1.50s; }
    .autograd-attributes-e1 { animation-delay: 1.50s; }
    .autograd-attributes-s2 { animation-delay: 3.00s; }
    .autograd-attributes-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .autograd-attributes-conn  { animation: autograd-attributes-trace 6s ease-in-out infinite; }
      .autograd-attributes-stage { animation: autograd-attributes-arrive 6s ease-in-out infinite; }
    }
    @keyframes autograd-attributes-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes autograd-attributes-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .autograd-attributes-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .autograd-attributes-stage { animation: autograd-attributes-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes autograd-attributes-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="autograd-attributes-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="autograd-attributes-bg" width="980" height="322"/>
  <text class="autograd-attributes-h1"  x="30" y="40">Three tensor attributes</text>
  <text class="autograd-attributes-sub" x="30" y="64">Which decide what autograd does.</text>
  <g class="autograd-attributes-stage autograd-attributes-s0">
    <rect class="autograd-attributes-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="autograd-attributes-step" x="44" y="142">01</text>
    <text class="autograd-attributes-name" x="70" y="142">requires_grad</text>
    <text class="autograd-attributes-desc" x="44" y="166">Whether operations on this tensor are</text>
    <text class="autograd-attributes-desc" x="44" y="182">recorded at all. True for parameters.</text>
  </g>
  <line class="autograd-attributes-line autograd-attributes-conn autograd-attributes-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#autograd-attributes-tip)"/>
  <g class="autograd-attributes-stage autograd-attributes-s1">
    <rect class="autograd-attributes-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="autograd-attributes-step" x="359" y="142">02</text>
    <text class="autograd-attributes-name" x="385" y="142">is_leaf</text>
    <text class="autograd-attributes-desc" x="359" y="166">Created by you, not by an operation. Only</text>
    <text class="autograd-attributes-desc" x="359" y="182">leaves keep a persistent gradient.</text>
    <text class="autograd-attributes-edge" x="359" y="242">where .grad lives</text>
  </g>
  <line class="autograd-attributes-line autograd-attributes-conn autograd-attributes-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#autograd-attributes-tip)"/>
  <g class="autograd-attributes-stage autograd-attributes-s2">
    <rect class="autograd-attributes-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="autograd-attributes-step" x="674" y="142">03</text>
    <text class="autograd-attributes-name" x="700" y="142">grad_fn</text>
    <text class="autograd-attributes-desc" x="674" y="166">The operation that produced this tensor, and</text>
    <text class="autograd-attributes-desc" x="674" y="182">how to differentiate it.</text>
  </g>
  <text class="autograd-attributes-sub" x="30" y="304">The leaf distinction explains a common confusion: an intermediate tensor's gradient is computed and then discarded, so inspecting it requires asking for it to be retained.</text>
</svg>
