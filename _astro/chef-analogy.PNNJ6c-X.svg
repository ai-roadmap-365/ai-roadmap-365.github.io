<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Technique transfers; the menu does not.">
  <title>An experienced chef, retrained</title>
  <style>
    .chef-analogy-bg   { fill: #f8fafc; }
    .chef-analogy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chef-analogy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chef-analogy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chef-analogy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chef-analogy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chef-analogy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chef-analogy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .chef-analogy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .chef-analogy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .chef-analogy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .chef-analogy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .chef-analogy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chef-analogy-row { opacity: 1; }
    .chef-analogy-r0 { animation-delay: 0.00s; }
    .chef-analogy-r1 { animation-delay: 0.45s; }
    .chef-analogy-r2 { animation-delay: 0.90s; }
    .chef-analogy-r3 { animation-delay: 1.35s; }
    .chef-analogy-r4 { animation-delay: 1.80s; }
    .chef-analogy-row { animation: chef-analogy-reveal 7.3s ease-in-out infinite; }
    @keyframes chef-analogy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="chef-analogy-bg" width="980" height="390"/>
  <text class="chef-analogy-h1"  x="30" y="40">An experienced chef, retrained</text>
  <text class="chef-analogy-sub" x="30" y="64">Technique transfers; the menu does not.</text>
  <rect class="chef-analogy-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="chef-analogy-name" x="46" y="122">An experienced chef</text>
  <text class="chef-analogy-desc" x="46" y="142">Technique already learned.</text>
  <text class="chef-analogy-desc chef-analogy-row chef-analogy-r0" x="46" y="182">Knife skills, heat, timing, seasoning</text>
  <text class="chef-analogy-desc chef-analogy-row chef-analogy-r1" x="46" y="216">Learned over years, elsewhere</text>
  <text class="chef-analogy-desc chef-analogy-row chef-analogy-r2" x="46" y="250">Learns a new cuisine in weeks</text>
  <text class="chef-analogy-desc chef-analogy-row chef-analogy-r3" x="46" y="284">Correct the specifics, keep the fundamentals</text>
  <text class="chef-analogy-desc chef-analogy-row chef-analogy-r4" x="46" y="318">This is transfer learning</text>
  <rect class="chef-analogy-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="chef-analogy-name" x="526" y="122">From nothing</text>
  <text class="chef-analogy-desc" x="526" y="142">Everything, again.</text>
  <text class="chef-analogy-desc chef-analogy-row chef-analogy-r0" x="526" y="182">Every fundamental relearned</text>
  <text class="chef-analogy-desc chef-analogy-row chef-analogy-r1" x="526" y="216">Years, and a great deal of material</text>
  <text class="chef-analogy-desc chef-analogy-row chef-analogy-r2" x="526" y="250">Reaches the same place, eventually</text>
  <text class="chef-analogy-desc chef-analogy-row chef-analogy-r3" x="526" y="284">Only worth it if nothing transfers</text>
  <text class="chef-analogy-desc chef-analogy-row chef-analogy-r4" x="526" y="318">This is training from scratch</text>
  <text class="chef-analogy-sub" x="30" y="372">"Correct the specifics, keep the fundamentals" describes the two-phase protocol precisely: the new head learns the specifics, and the backbone is adjusted only gently afterwards.</text>
</svg>
