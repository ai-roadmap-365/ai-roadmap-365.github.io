<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four points.">
  <title>What a confidence interval says</title>
  <style>
    .interval-how-bg   { fill: #f8fafc; }
    .interval-how-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interval-how-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interval-how-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interval-how-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interval-how-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interval-how-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .interval-how-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .interval-how-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .interval-how-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .interval-how-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .interval-how-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .interval-how-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .interval-how-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .interval-how-stage { opacity: 1; }

    .interval-how-s0 { animation-delay: 0.00s; }
    .interval-how-e0 { animation-delay: 0.00s; }
    .interval-how-s1 { animation-delay: 1.28s; }
    .interval-how-e1 { animation-delay: 1.28s; }
    .interval-how-s2 { animation-delay: 2.56s; }
    .interval-how-e2 { animation-delay: 2.56s; }
    .interval-how-s3 { animation-delay: 3.84s; }
    .interval-how-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .interval-how-conn  { animation: interval-how-trace 6.4s ease-in-out infinite; }
      .interval-how-stage { animation: interval-how-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes interval-how-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes interval-how-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .interval-how-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .interval-how-stage { animation: interval-how-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes interval-how-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="interval-how-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="interval-how-bg" width="980" height="322"/>
  <text class="interval-how-h1"  x="30" y="40">What a confidence interval says</text>
  <text class="interval-how-sub" x="30" y="64">Four points.</text>
  <g class="interval-how-stage interval-how-s0">
    <rect class="interval-how-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="interval-how-step" x="44" y="142">01</text>
    <text class="interval-how-name" x="70" y="142">A point estimate from the sample</text>
    <text class="interval-how-desc" x="44" y="166">Which will not be exactly right.</text>
  </g>
  <line class="interval-how-line interval-how-conn interval-how-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#interval-how-tip)"/>
  <g class="interval-how-stage interval-how-s1">
    <rect class="interval-how-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="interval-how-step" x="280" y="142">02</text>
    <text class="interval-how-name" x="306" y="142">A range constructed around it</text>
    <text class="interval-how-desc" x="280" y="166">By a defined procedure.</text>
  </g>
  <line class="interval-how-line interval-how-conn interval-how-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#interval-how-tip)"/>
  <g class="interval-how-stage interval-how-s2">
    <rect class="interval-how-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="interval-how-step" x="516" y="142">03</text>
    <text class="interval-how-name" x="542" y="142">The procedure captures the true value at the stated rate</text>
    <text class="interval-how-desc" x="516" y="166">Across repeated samples.</text>
  </g>
  <line class="interval-how-line interval-how-conn interval-how-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#interval-how-tip)"/>
  <g class="interval-how-stage interval-how-s3">
    <rect class="interval-how-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="interval-how-step" x="752" y="142">04</text>
    <text class="interval-how-name" x="778" y="142">Which is not a probability about this one interval</text>
    <text class="interval-how-desc" x="752" y="166">A common and understandable</text>
    <text class="interval-how-desc" x="752" y="182">misreading.</text>
  </g>
  <text class="interval-how-sub" x="30" y="304">Intervals are usually more informative than tests because they show the size of an effect and its precision, rather than a single yes-or-no verdict.</text>
</svg>
