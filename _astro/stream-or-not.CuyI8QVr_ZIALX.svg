<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And the cases where a spinner wins.">
  <title>When streaming is right</title>
  <style>
    .stream-or-not-bg   { fill: #f8fafc; }
    .stream-or-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stream-or-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stream-or-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stream-or-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stream-or-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stream-or-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stream-or-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stream-or-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stream-or-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stream-or-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stream-or-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stream-or-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stream-or-not-row { opacity: 1; }
    .stream-or-not-r0 { animation-delay: 0.00s; }
    .stream-or-not-r1 { animation-delay: 0.45s; }
    .stream-or-not-r2 { animation-delay: 0.90s; }
    .stream-or-not-r3 { animation-delay: 1.35s; }
    .stream-or-not-r4 { animation-delay: 1.80s; }
    .stream-or-not-row { animation: stream-or-not-reveal 7.3s ease-in-out infinite; }
    @keyframes stream-or-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="stream-or-not-bg" width="980" height="390"/>
  <text class="stream-or-not-h1"  x="30" y="40">When streaming is right</text>
  <text class="stream-or-not-sub" x="30" y="64">And the cases where a spinner wins.</text>
  <rect class="stream-or-not-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="stream-or-not-name" x="46" y="122">Stream</text>
  <text class="stream-or-not-desc" x="46" y="142">Most AI interfaces.</text>
  <text class="stream-or-not-desc stream-or-not-row stream-or-not-r0" x="46" y="182">Responses take more than a second</text>
  <text class="stream-or-not-desc stream-or-not-row stream-or-not-r1" x="46" y="216">Output is text read in order</text>
  <text class="stream-or-not-desc stream-or-not-row stream-or-not-r2" x="46" y="250">Partial output is useful alone</text>
  <text class="stream-or-not-desc stream-or-not-row stream-or-not-r3" x="46" y="284">The user may want to stop it</text>
  <text class="stream-or-not-desc stream-or-not-row stream-or-not-r4" x="46" y="318">Time to first token can be kept low</text>
  <rect class="stream-or-not-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="stream-or-not-name" x="526" y="122">Wait, then show</text>
  <text class="stream-or-not-desc" x="526" y="142">Where partials mislead.</text>
  <text class="stream-or-not-desc stream-or-not-row stream-or-not-r0" x="526" y="182">Content requiring moderation</text>
  <text class="stream-or-not-desc stream-or-not-row stream-or-not-r1" x="526" y="216">A structured payload, meaningless partial</text>
  <text class="stream-or-not-desc stream-or-not-row stream-or-not-r2" x="526" y="250">A number or a decision, not prose</text>
  <text class="stream-or-not-desc stream-or-not-row stream-or-not-r3" x="526" y="284">Output that will be post-processed</text>
  <text class="stream-or-not-desc stream-or-not-row stream-or-not-r4" x="526" y="318">Show a spinner and mean it</text>
  <text class="stream-or-not-sub" x="30" y="372">Cancellation belongs on both sides. It is the control users reach for most and the one prototypes most often lack, and it is worth implementing whether or not you stream.</text>
</svg>
