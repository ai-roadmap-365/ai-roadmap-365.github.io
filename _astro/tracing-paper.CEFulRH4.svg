<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Which grid you follow decides the result.">
  <title>Tracing through a grid</title>
  <style>
    .tracing-paper-bg   { fill: #f8fafc; }
    .tracing-paper-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracing-paper-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracing-paper-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracing-paper-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracing-paper-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracing-paper-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tracing-paper-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tracing-paper-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tracing-paper-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tracing-paper-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tracing-paper-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tracing-paper-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tracing-paper-row { opacity: 1; }
    .tracing-paper-r0 { animation-delay: 0.00s; }
    .tracing-paper-r1 { animation-delay: 0.45s; }
    .tracing-paper-r2 { animation-delay: 0.90s; }
    .tracing-paper-r3 { animation-delay: 1.35s; }
    .tracing-paper-r4 { animation-delay: 1.80s; }
    .tracing-paper-row { animation: tracing-paper-reveal 7.3s ease-in-out infinite; }
    @keyframes tracing-paper-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tracing-paper-bg" width="980" height="390"/>
  <text class="tracing-paper-h1"  x="30" y="40">Tracing through a grid</text>
  <text class="tracing-paper-sub" x="30" y="64">Which grid you follow decides the result.</text>
  <rect class="tracing-paper-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tracing-paper-name" x="46" y="122">Working from the source</text>
  <text class="tracing-paper-desc" x="46" y="142">Gaps appear.</text>
  <text class="tracing-paper-desc tracing-paper-row tracing-paper-r0" x="46" y="182">Copy each source square somewhere</text>
  <text class="tracing-paper-desc tracing-paper-row tracing-paper-r1" x="46" y="216">Some destination squares get two</text>
  <text class="tracing-paper-desc tracing-paper-row tracing-paper-r2" x="46" y="250">Others get none</text>
  <text class="tracing-paper-desc tracing-paper-row tracing-paper-r3" x="46" y="284">Holes in the result</text>
  <text class="tracing-paper-desc tracing-paper-row tracing-paper-r4" x="46" y="318">This is forward mapping</text>
  <rect class="tracing-paper-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tracing-paper-name" x="526" y="122">Working from the destination</text>
  <text class="tracing-paper-desc" x="526" y="142">Complete.</text>
  <text class="tracing-paper-desc tracing-paper-row tracing-paper-r0" x="526" y="182">Fill each destination square in turn</text>
  <text class="tracing-paper-desc tracing-paper-row tracing-paper-r1" x="526" y="216">Look back to find its source</text>
  <text class="tracing-paper-desc tracing-paper-row tracing-paper-r2" x="526" y="250">Every square gets exactly one value</text>
  <text class="tracing-paper-desc tracing-paper-row tracing-paper-r3" x="526" y="284">No holes possible</text>
  <text class="tracing-paper-desc tracing-paper-row tracing-paper-r4" x="526" y="318">This is inverse mapping</text>
  <text class="tracing-paper-sub" x="30" y="372">Anyone who has copied a drawing square by square has met this: working from the blank page rather than the original is what guarantees nothing is left empty.</text>
</svg>
