<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The failure liveness cannot see.">
  <title>Green, and completely broken</title>
  <style>
    .live-but-not-ready-bg   { fill: #f8fafc; }
    .live-but-not-ready-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .live-but-not-ready-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .live-but-not-ready-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .live-but-not-ready-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .live-but-not-ready-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .live-but-not-ready-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .live-but-not-ready-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .live-but-not-ready-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .live-but-not-ready-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .live-but-not-ready-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .live-but-not-ready-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .live-but-not-ready-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .live-but-not-ready-row { opacity: 1; }
    .live-but-not-ready-r0 { animation-delay: 0.00s; }
    .live-but-not-ready-r1 { animation-delay: 0.45s; }
    .live-but-not-ready-r2 { animation-delay: 0.90s; }
    .live-but-not-ready-r3 { animation-delay: 1.35s; }
    .live-but-not-ready-r4 { animation-delay: 1.80s; }
    .live-but-not-ready-row { animation: live-but-not-ready-reveal 7.3s ease-in-out infinite; }
    @keyframes live-but-not-ready-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="live-but-not-ready-bg" width="980" height="390"/>
  <text class="live-but-not-ready-h1"  x="30" y="40">Green, and completely broken</text>
  <text class="live-but-not-ready-sub" x="30" y="64">The failure liveness cannot see.</text>
  <rect class="live-but-not-ready-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="live-but-not-ready-name" x="46" y="122">Liveness says yes</text>
  <text class="live-but-not-ready-desc" x="46" y="142">The process started.</text>
  <text class="live-but-not-ready-desc live-but-not-ready-row live-but-not-ready-r0" x="46" y="182">The container is running</text>
  <text class="live-but-not-ready-desc live-but-not-ready-row live-but-not-ready-r1" x="46" y="216">The orchestrator reports green</text>
  <text class="live-but-not-ready-desc live-but-not-ready-row live-but-not-ready-r2" x="46" y="250">Traffic is routed to it</text>
  <text class="live-but-not-ready-desc live-but-not-ready-row live-but-not-ready-r3" x="46" y="284">The model never loaded</text>
  <text class="live-but-not-ready-desc live-but-not-ready-row live-but-not-ready-r4" x="46" y="318">Every request fails</text>
  <rect class="live-but-not-ready-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="live-but-not-ready-name" x="526" y="122">Readiness says no</text>
  <text class="live-but-not-ready-desc" x="526" y="142">It cannot serve.</text>
  <text class="live-but-not-ready-desc live-but-not-ready-row live-but-not-ready-r0" x="526" y="182">Model weights loaded?</text>
  <text class="live-but-not-ready-desc live-but-not-ready-row live-but-not-ready-r1" x="526" y="216">Index warm?</text>
  <text class="live-but-not-ready-desc live-but-not-ready-row live-but-not-ready-r2" x="526" y="250">Dependencies reachable?</text>
  <text class="live-but-not-ready-desc live-but-not-ready-row live-but-not-ready-r3" x="526" y="284">Fails, so no traffic is routed</text>
  <text class="live-but-not-ready-desc live-but-not-ready-row live-but-not-ready-r4" x="526" y="318">Rolled back with no user impact</text>
  <text class="live-but-not-ready-sub" x="30" y="372">This is the third lab case, and the most common way a deployment goes green while being entirely broken: a system that is live but not ready keeps receiving requests it cannot answer.</text>
</svg>
