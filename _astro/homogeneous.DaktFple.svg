<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Homogeneous coordinates</title>
  <style>
    .homogeneous-bg   { fill: #f8fafc; }
    .homogeneous-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .homogeneous-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .homogeneous-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .homogeneous-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .homogeneous-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .homogeneous-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .homogeneous-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .homogeneous-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .homogeneous-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .homogeneous-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .homogeneous-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .homogeneous-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .homogeneous-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .homogeneous-stage { opacity: 1; }

    .homogeneous-s0 { animation-delay: 0.00s; }
    .homogeneous-e0 { animation-delay: 0.00s; }
    .homogeneous-s1 { animation-delay: 1.28s; }
    .homogeneous-e1 { animation-delay: 1.28s; }
    .homogeneous-s2 { animation-delay: 2.56s; }
    .homogeneous-e2 { animation-delay: 2.56s; }
    .homogeneous-s3 { animation-delay: 3.84s; }
    .homogeneous-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .homogeneous-conn  { animation: homogeneous-trace 6.4s ease-in-out infinite; }
      .homogeneous-stage { animation: homogeneous-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes homogeneous-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes homogeneous-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .homogeneous-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .homogeneous-stage { animation: homogeneous-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes homogeneous-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="homogeneous-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="homogeneous-bg" width="980" height="322"/>
  <text class="homogeneous-h1"  x="30" y="40">Homogeneous coordinates</text>
  <text class="homogeneous-sub" x="30" y="64">Four steps.</text>
  <g class="homogeneous-stage homogeneous-s0">
    <rect class="homogeneous-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="homogeneous-step" x="44" y="142">01</text>
    <text class="homogeneous-name" x="70" y="142">Translation moves the origin</text>
    <text class="homogeneous-desc" x="44" y="166">So it is not a linear</text>
    <text class="homogeneous-desc" x="44" y="182">transformation.</text>
  </g>
  <line class="homogeneous-line homogeneous-conn homogeneous-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#homogeneous-tip)"/>
  <g class="homogeneous-stage homogeneous-s1">
    <rect class="homogeneous-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="homogeneous-step" x="280" y="142">02</text>
    <text class="homogeneous-name" x="306" y="142">And cannot be written as a matrix multiplication</text>
    <text class="homogeneous-desc" x="280" y="166">In the original dimensions.</text>
  </g>
  <line class="homogeneous-line homogeneous-conn homogeneous-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#homogeneous-tip)"/>
  <g class="homogeneous-stage homogeneous-s2">
    <rect class="homogeneous-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="homogeneous-step" x="516" y="142">03</text>
    <text class="homogeneous-name" x="542" y="142">Add a coordinate fixed at one</text>
    <text class="homogeneous-desc" x="516" y="166">And translation becomes a shear</text>
    <text class="homogeneous-desc" x="516" y="182">in the larger space.</text>
  </g>
  <line class="homogeneous-line homogeneous-conn homogeneous-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#homogeneous-tip)"/>
  <g class="homogeneous-stage homogeneous-s3">
    <rect class="homogeneous-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="homogeneous-step" x="752" y="142">04</text>
    <text class="homogeneous-name" x="778" y="142">So every transformation composes as one matrix</text>
    <text class="homogeneous-desc" x="752" y="166">Which is why graphics uses this</text>
    <text class="homogeneous-desc" x="752" y="182">everywhere.</text>
  </g>
  <text class="homogeneous-sub" x="30" y="304">Making translation composable with rotation and scaling is what allows a chain of operations to collapse into a single matrix, which is both faster and more accurate.</text>
</svg>
