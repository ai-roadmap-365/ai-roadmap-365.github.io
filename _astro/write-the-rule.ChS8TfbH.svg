<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four signals.">
  <title>When not to use machine learning</title>
  <style>
    .write-the-rule-bg   { fill: #f8fafc; }
    .write-the-rule-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .write-the-rule-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .write-the-rule-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .write-the-rule-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .write-the-rule-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .write-the-rule-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .write-the-rule-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .write-the-rule-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .write-the-rule-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .write-the-rule-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .write-the-rule-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .write-the-rule-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .write-the-rule-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .write-the-rule-stage { opacity: 1; }

    .write-the-rule-s0 { animation-delay: 0.00s; }
    .write-the-rule-e0 { animation-delay: 0.00s; }
    .write-the-rule-s1 { animation-delay: 1.28s; }
    .write-the-rule-e1 { animation-delay: 1.28s; }
    .write-the-rule-s2 { animation-delay: 2.56s; }
    .write-the-rule-e2 { animation-delay: 2.56s; }
    .write-the-rule-s3 { animation-delay: 3.84s; }
    .write-the-rule-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .write-the-rule-conn  { animation: write-the-rule-trace 6.4s ease-in-out infinite; }
      .write-the-rule-stage { animation: write-the-rule-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes write-the-rule-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes write-the-rule-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .write-the-rule-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .write-the-rule-stage { animation: write-the-rule-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes write-the-rule-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="write-the-rule-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="write-the-rule-bg" width="980" height="322"/>
  <text class="write-the-rule-h1"  x="30" y="40">When not to use machine learning</text>
  <text class="write-the-rule-sub" x="30" y="64">Four signals.</text>
  <g class="write-the-rule-stage write-the-rule-s0">
    <rect class="write-the-rule-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="write-the-rule-step" x="44" y="142">01</text>
    <text class="write-the-rule-name" x="70" y="142">The logic is known and can be stated</text>
    <text class="write-the-rule-desc" x="44" y="166">Tax bands, eligibility criteria,</text>
    <text class="write-the-rule-desc" x="44" y="182">physical limits.</text>
  </g>
  <line class="write-the-rule-line write-the-rule-conn write-the-rule-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#write-the-rule-tip)"/>
  <g class="write-the-rule-stage write-the-rule-s1">
    <rect class="write-the-rule-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="write-the-rule-step" x="280" y="142">02</text>
    <text class="write-the-rule-name" x="306" y="142">The decision must be auditable exactly</text>
    <text class="write-the-rule-desc" x="280" y="166">Which a rule is and a model is</text>
    <text class="write-the-rule-desc" x="280" y="182">not.</text>
  </g>
  <line class="write-the-rule-line write-the-rule-conn write-the-rule-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#write-the-rule-tip)"/>
  <g class="write-the-rule-stage write-the-rule-s2">
    <rect class="write-the-rule-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="write-the-rule-step" x="516" y="142">03</text>
    <text class="write-the-rule-name" x="542" y="142">The rule is stable over time</text>
    <text class="write-the-rule-desc" x="516" y="166">So there is nothing to keep</text>
    <text class="write-the-rule-desc" x="516" y="182">relearning.</text>
  </g>
  <line class="write-the-rule-line write-the-rule-conn write-the-rule-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#write-the-rule-tip)"/>
  <g class="write-the-rule-stage write-the-rule-s3">
    <rect class="write-the-rule-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="write-the-rule-step" x="752" y="142">04</text>
    <text class="write-the-rule-name" x="778" y="142">And it costs almost nothing to build or run</text>
    <text class="write-the-rule-desc" x="752" y="166">With no data, training or</text>
    <text class="write-the-rule-desc" x="752" y="182">monitoring.</text>
  </g>
  <text class="write-the-rule-sub" x="30" y="304">Reaching for a model where a stated rule exists adds cost, opacity and a maintenance obligation in exchange for approximating something already known exactly.</text>
</svg>
