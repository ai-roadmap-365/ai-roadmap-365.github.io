<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things it is not</title>
  <style>
    .tdd-not-bg   { fill: #f8fafc; }
    .tdd-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tdd-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tdd-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tdd-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tdd-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tdd-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tdd-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tdd-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tdd-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tdd-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tdd-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tdd-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tdd-not-row { opacity: 1; }
    .tdd-not-r0 { animation-delay: 0.00s; }
    .tdd-not-r1 { animation-delay: 0.45s; }
    .tdd-not-r2 { animation-delay: 0.90s; }
    .tdd-not-r3 { animation-delay: 1.35s; }
    .tdd-not-r4 { animation-delay: 1.80s; }
    .tdd-not-row { animation: tdd-not-reveal 7.3s ease-in-out infinite; }
    @keyframes tdd-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tdd-not-bg" width="980" height="390"/>
  <text class="tdd-not-h1"  x="30" y="40">Four things it is not</text>
  <text class="tdd-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="tdd-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tdd-not-name" x="46" y="122">The misconception</text>
  <text class="tdd-not-desc" x="46" y="142">Commonly held.</text>
  <text class="tdd-not-desc tdd-not-row tdd-not-r0" x="46" y="182">It is a testing technique</text>
  <text class="tdd-not-desc tdd-not-row tdd-not-r1" x="46" y="216">It guarantees good design</text>
  <text class="tdd-not-desc tdd-not-row tdd-not-r2" x="46" y="250">It suits every kind of work</text>
  <text class="tdd-not-desc tdd-not-row tdd-not-r3" x="46" y="284">The tests are the deliverable</text>
  <text class="tdd-not-desc tdd-not-row tdd-not-r4" x="46" y="318">It means no design thinking</text>
  <rect class="tdd-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tdd-not-name" x="526" y="122">What is true</text>
  <text class="tdd-not-desc" x="526" y="142">Actually.</text>
  <text class="tdd-not-desc tdd-not-row tdd-not-r0" x="526" y="182">It is a design technique that leaves tests behind</text>
  <text class="tdd-not-desc tdd-not-row tdd-not-r1" x="526" y="216">It applies pressure; judgment still decides</text>
  <text class="tdd-not-desc tdd-not-row tdd-not-r2" x="526" y="250">It is poor for exploration and interfaces</text>
  <text class="tdd-not-desc tdd-not-row tdd-not-r3" x="526" y="284">The working, changeable code is</text>
  <text class="tdd-not-desc tdd-not-row tdd-not-r4" x="526" y="318">It front-loads the interface decisions</text>
  <text class="tdd-not-sub" x="30" y="372">Calling it a design technique is the framing that makes sense of it: the tests are a by-product, and the value is in being forced to state the interface first.</text>
</svg>
