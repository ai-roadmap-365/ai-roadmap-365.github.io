<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things visualisation is not</title>
  <style>
    .viz127-not-bg   { fill: #f8fafc; }
    .viz127-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz127-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz127-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz127-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz127-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz127-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .viz127-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .viz127-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .viz127-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .viz127-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .viz127-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .viz127-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .viz127-not-row { opacity: 1; }
    .viz127-not-r0 { animation-delay: 0.00s; }
    .viz127-not-r1 { animation-delay: 0.45s; }
    .viz127-not-r2 { animation-delay: 0.90s; }
    .viz127-not-r3 { animation-delay: 1.35s; }
    .viz127-not-r4 { animation-delay: 1.80s; }
    .viz127-not-row { animation: viz127-not-reveal 7.3s ease-in-out infinite; }
    @keyframes viz127-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="viz127-not-bg" width="980" height="390"/>
  <text class="viz127-not-h1"  x="30" y="40">Four things visualisation is not</text>
  <text class="viz127-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="viz127-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="viz127-not-name" x="46" y="122">The misconception</text>
  <text class="viz127-not-desc" x="46" y="142">Commonly held.</text>
  <text class="viz127-not-desc viz127-not-row viz127-not-r0" x="46" y="182">A chart is decoration for a report</text>
  <text class="viz127-not-desc viz127-not-row viz127-not-r1" x="46" y="216">More elaborate charts communicate more</text>
  <text class="viz127-not-desc viz127-not-row viz127-not-r2" x="46" y="250">Any chart is better than a table</text>
  <text class="viz127-not-desc viz127-not-row viz127-not-r3" x="46" y="284">Charts are objective</text>
  <text class="viz127-not-desc viz127-not-row viz127-not-r4" x="46" y="318">Colour makes charts clearer</text>
  <rect class="viz127-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="viz127-not-name" x="526" y="122">What is true</text>
  <text class="viz127-not-desc" x="526" y="142">Actually.</text>
  <text class="viz127-not-desc viz127-not-row viz127-not-r0" x="526" y="182">It is analysis; you see what summaries hide</text>
  <text class="viz127-not-desc viz127-not-row viz127-not-r1" x="526" y="216">Simpler encodings are read more accurately</text>
  <text class="viz127-not-desc viz127-not-row viz127-not-r2" x="526" y="250">For a few precise values, a table is better</text>
  <text class="viz127-not-desc viz127-not-row viz127-not-r3" x="526" y="284">Every choice frames the comparison</text>
  <text class="viz127-not-desc viz127-not-row viz127-not-r4" x="526" y="318">Poor colour choices actively mislead</text>
  <text class="viz127-not-sub" x="30" y="372">Charts being analysis rather than presentation is the reframing that matters, and it is why plotting comes before summarising rather than after.</text>
</svg>
