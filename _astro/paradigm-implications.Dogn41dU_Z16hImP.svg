<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are practical.">
  <title>Four consequences of the paradigm choice</title>
  <style>
    .paradigm-implications-bg   { fill: #f8fafc; }
    .paradigm-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .paradigm-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .paradigm-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .paradigm-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .paradigm-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .paradigm-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .paradigm-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .paradigm-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .paradigm-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .paradigm-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .paradigm-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .paradigm-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .paradigm-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .paradigm-implications-stage { opacity: 1; }

    .paradigm-implications-s0 { animation-delay: 0.00s; }
    .paradigm-implications-e0 { animation-delay: 0.00s; }
    .paradigm-implications-s1 { animation-delay: 1.28s; }
    .paradigm-implications-e1 { animation-delay: 1.28s; }
    .paradigm-implications-s2 { animation-delay: 2.56s; }
    .paradigm-implications-e2 { animation-delay: 2.56s; }
    .paradigm-implications-s3 { animation-delay: 3.84s; }
    .paradigm-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .paradigm-implications-conn  { animation: paradigm-implications-trace 6.4s ease-in-out infinite; }
      .paradigm-implications-stage { animation: paradigm-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes paradigm-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes paradigm-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .paradigm-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .paradigm-implications-stage { animation: paradigm-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes paradigm-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="paradigm-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="paradigm-implications-bg" width="980" height="322"/>
  <text class="paradigm-implications-h1"  x="30" y="40">Four consequences of the paradigm choice</text>
  <text class="paradigm-implications-sub" x="30" y="64">Two are practical.</text>
  <g class="paradigm-implications-stage paradigm-implications-s0">
    <rect class="paradigm-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="paradigm-implications-step" x="44" y="142">01</text>
    <text class="paradigm-implications-name" x="70" y="142">Each demands a different kind of data</text>
    <text class="paradigm-implications-desc" x="44" y="166">Labels, none, or an environment</text>
    <text class="paradigm-implications-desc" x="44" y="182">to act in.</text>
  </g>
  <line class="paradigm-implications-line paradigm-implications-conn paradigm-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#paradigm-implications-tip)"/>
  <g class="paradigm-implications-stage paradigm-implications-s1">
    <rect class="paradigm-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="paradigm-implications-step" x="280" y="142">02</text>
    <text class="paradigm-implications-name" x="306" y="142">And evaluation gets harder as feedback weakens</text>
    <text class="paradigm-implications-desc" x="280" y="166">Supervised is easy,</text>
    <text class="paradigm-implications-desc" x="280" y="182">reinforcement is not.</text>
  </g>
  <line class="paradigm-implications-line paradigm-implications-conn paradigm-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#paradigm-implications-tip)"/>
  <g class="paradigm-implications-stage paradigm-implications-s2">
    <rect class="paradigm-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="paradigm-implications-step" x="516" y="142">03</text>
    <text class="paradigm-implications-name" x="542" y="142">With cost rising the same way</text>
    <text class="paradigm-implications-desc" x="516" y="166">An environment is far more</text>
    <text class="paradigm-implications-desc" x="516" y="182">expensive than a labelled set.</text>
  </g>
  <line class="paradigm-implications-line paradigm-implications-conn paradigm-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#paradigm-implications-tip)"/>
  <g class="paradigm-implications-stage paradigm-implications-s3">
    <rect class="paradigm-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="paradigm-implications-step" x="752" y="142">04</text>
    <text class="paradigm-implications-name" x="778" y="142">While reward design is a specification risk</text>
    <text class="paradigm-implications-desc" x="752" y="166">A reward optimised literally is</text>
    <text class="paradigm-implications-desc" x="752" y="182">rarely what was meant.</text>
  </g>
  <text class="paradigm-implications-sub" x="30" y="304">Reward specification failing in unintended ways is a documented and recurring outcome, and it is the same phenomenon as reward hacking in alignment.</text>
</svg>
