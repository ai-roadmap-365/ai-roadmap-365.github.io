<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Loading data properly</title>
  <style>
    .load-idea-bg   { fill: #f8fafc; }
    .load-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .load-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .load-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .load-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .load-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .load-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .load-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .load-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .load-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .load-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .load-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .load-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .load-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .load-idea-stage { opacity: 1; }

    .load-idea-s0 { animation-delay: 0.00s; }
    .load-idea-e0 { animation-delay: 0.00s; }
    .load-idea-s1 { animation-delay: 1.28s; }
    .load-idea-e1 { animation-delay: 1.28s; }
    .load-idea-s2 { animation-delay: 2.56s; }
    .load-idea-e2 { animation-delay: 2.56s; }
    .load-idea-s3 { animation-delay: 3.84s; }
    .load-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .load-idea-conn  { animation: load-idea-trace 6.4s ease-in-out infinite; }
      .load-idea-stage { animation: load-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes load-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes load-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .load-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .load-idea-stage { animation: load-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes load-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="load-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="load-idea-bg" width="980" height="322"/>
  <text class="load-idea-h1"  x="30" y="40">Loading data properly</text>
  <text class="load-idea-sub" x="30" y="64">Four steps.</text>
  <g class="load-idea-stage load-idea-s0">
    <rect class="load-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="load-idea-step" x="44" y="142">01</text>
    <text class="load-idea-name" x="70" y="142">Read the file, specifying the format's details</text>
    <text class="load-idea-desc" x="44" y="166">Separator, encoding, header.</text>
  </g>
  <line class="load-idea-line load-idea-conn load-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#load-idea-tip)"/>
  <g class="load-idea-stage load-idea-s1">
    <rect class="load-idea-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="load-idea-step" x="280" y="142">02</text>
    <text class="load-idea-name" x="306" y="142">Types are inferred, sometimes wrongly</text>
    <text class="load-idea-desc" x="280" y="166">Identifiers become numbers.</text>
  </g>
  <line class="load-idea-line load-idea-conn load-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#load-idea-tip)"/>
  <g class="load-idea-stage load-idea-s2">
    <rect class="load-idea-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="load-idea-step" x="516" y="142">03</text>
    <text class="load-idea-name" x="542" y="142">So verify the shape, types and missing counts</text>
    <text class="load-idea-desc" x="516" y="166">Before anything else.</text>
  </g>
  <line class="load-idea-line load-idea-conn load-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#load-idea-tip)"/>
  <g class="load-idea-stage load-idea-s3">
    <rect class="load-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="load-idea-step" x="752" y="142">04</text>
    <text class="load-idea-name" x="778" y="142">Then look at actual rows, not just summaries</text>
    <text class="load-idea-desc" x="752" y="166">Which reveals what summaries</text>
    <text class="load-idea-desc" x="752" y="182">hide.</text>
  </g>
  <text class="load-idea-sub" x="30" y="304">Identifiers being inferred as numbers is the classic loading bug: leading zeros vanish and codes silently become arithmetic values.</text>
</svg>
