<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Distance stands for similarity.">
  <title>A map of meaning</title>
  <style>
    .map-cities-bg   { fill: #f8fafc; }
    .map-cities-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-cities-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-cities-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-cities-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-cities-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-cities-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .map-cities-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .map-cities-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .map-cities-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .map-cities-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .map-cities-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .map-cities-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .map-cities-row { opacity: 1; }
    .map-cities-r0 { animation-delay: 0.00s; }
    .map-cities-r1 { animation-delay: 0.45s; }
    .map-cities-r2 { animation-delay: 0.90s; }
    .map-cities-r3 { animation-delay: 1.35s; }
    .map-cities-r4 { animation-delay: 1.80s; }
    .map-cities-row { animation: map-cities-reveal 7.3s ease-in-out infinite; }
    @keyframes map-cities-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="map-cities-bg" width="980" height="390"/>
  <text class="map-cities-h1"  x="30" y="40">A map of meaning</text>
  <text class="map-cities-sub" x="30" y="64">Distance stands for similarity.</text>
  <rect class="map-cities-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="map-cities-name" x="46" y="122">A list of names</text>
  <text class="map-cities-desc" x="46" y="142">No relationships.</text>
  <text class="map-cities-desc map-cities-row map-cities-r0" x="46" y="182">Alphabetical, or arbitrary</text>
  <text class="map-cities-desc map-cities-row map-cities-r1" x="46" y="216">Nearby entries unrelated</text>
  <text class="map-cities-desc map-cities-row map-cities-r2" x="46" y="250">Finding what is close requires checking all</text>
  <text class="map-cities-desc map-cities-row map-cities-r3" x="46" y="284">No notion of between</text>
  <text class="map-cities-desc map-cities-row map-cities-r4" x="46" y="318">This is a keyword index</text>
  <rect class="map-cities-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="map-cities-name" x="526" y="122">A map</text>
  <text class="map-cities-desc" x="526" y="142">Position carries meaning.</text>
  <text class="map-cities-desc map-cities-row map-cities-r0" x="526" y="182">Related places near each other</text>
  <text class="map-cities-desc map-cities-row map-cities-r1" x="526" y="216">Distance is meaningful</text>
  <text class="map-cities-desc map-cities-row map-cities-r2" x="526" y="250">Nearest neighbours found directly</text>
  <text class="map-cities-desc map-cities-row map-cities-r3" x="526" y="284">Regions and clusters visible</text>
  <text class="map-cities-desc map-cities-row map-cities-r4" x="526" y="318">This is an embedding space</text>
  <text class="map-cities-sub" x="30" y="372">The analogy holds well except in one respect: this map has hundreds of dimensions rather than two, and human intuition about distance stops being reliable well before that.</text>
</svg>
