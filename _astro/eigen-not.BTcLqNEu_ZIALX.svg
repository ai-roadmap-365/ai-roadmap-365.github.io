<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things eigenvectors are not</title>
  <style>
    .eigen-not-bg   { fill: #f8fafc; }
    .eigen-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eigen-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eigen-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eigen-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eigen-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eigen-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eigen-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eigen-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eigen-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eigen-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eigen-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eigen-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eigen-not-row { opacity: 1; }
    .eigen-not-r0 { animation-delay: 0.00s; }
    .eigen-not-r1 { animation-delay: 0.45s; }
    .eigen-not-r2 { animation-delay: 0.90s; }
    .eigen-not-r3 { animation-delay: 1.35s; }
    .eigen-not-r4 { animation-delay: 1.80s; }
    .eigen-not-row { animation: eigen-not-reveal 7.3s ease-in-out infinite; }
    @keyframes eigen-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="eigen-not-bg" width="980" height="390"/>
  <text class="eigen-not-h1"  x="30" y="40">Four things eigenvectors are not</text>
  <text class="eigen-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="eigen-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="eigen-not-name" x="46" y="122">The misconception</text>
  <text class="eigen-not-desc" x="46" y="142">Commonly held.</text>
  <text class="eigen-not-desc eigen-not-row eigen-not-r0" x="46" y="182">Every matrix has a full set of them</text>
  <text class="eigen-not-desc eigen-not-row eigen-not-r1" x="46" y="216">The signs are meaningful</text>
  <text class="eigen-not-desc eigen-not-row eigen-not-r2" x="46" y="250">They are always real</text>
  <text class="eigen-not-desc eigen-not-row eigen-not-r3" x="46" y="284">The zero vector is an eigenvector</text>
  <text class="eigen-not-desc eigen-not-row eigen-not-r4" x="46" y="318">They require a square matrix to be symmetric</text>
  <rect class="eigen-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="eigen-not-name" x="526" y="122">What is true</text>
  <text class="eigen-not-desc" x="526" y="142">Actually.</text>
  <text class="eigen-not-desc eigen-not-row eigen-not-r0" x="526" y="182">Only some do; symmetric ones always</text>
  <text class="eigen-not-desc eigen-not-row eigen-not-r1" x="526" y="216">The sign is an arbitrary implementation choice</text>
  <text class="eigen-not-desc eigen-not-row eigen-not-r2" x="526" y="250">Non-symmetric matrices can have complex ones</text>
  <text class="eigen-not-desc eigen-not-row eigen-not-r3" x="526" y="284">It is excluded, or every scalar would qualify</text>
  <text class="eigen-not-desc eigen-not-row eigen-not-r4" x="526" y="318">Square is required; symmetric is the nice case</text>
  <text class="eigen-not-sub" x="30" y="372">Excluding the zero vector is a definitional necessity rather than a technicality: without it, every number would be an eigenvalue of every matrix.</text>
</svg>
