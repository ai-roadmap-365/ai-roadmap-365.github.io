<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One maps; one probes.">
  <title>Threat model or red team</title>
  <style>
    .model-or-redteam-bg   { fill: #f8fafc; }
    .model-or-redteam-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-or-redteam-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-or-redteam-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-or-redteam-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-or-redteam-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-or-redteam-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .model-or-redteam-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .model-or-redteam-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .model-or-redteam-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .model-or-redteam-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .model-or-redteam-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .model-or-redteam-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .model-or-redteam-row { opacity: 1; }
    .model-or-redteam-r0 { animation-delay: 0.00s; }
    .model-or-redteam-r1 { animation-delay: 0.45s; }
    .model-or-redteam-r2 { animation-delay: 0.90s; }
    .model-or-redteam-r3 { animation-delay: 1.35s; }
    .model-or-redteam-r4 { animation-delay: 1.80s; }
    .model-or-redteam-row { animation: model-or-redteam-reveal 7.3s ease-in-out infinite; }
    @keyframes model-or-redteam-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="model-or-redteam-bg" width="980" height="390"/>
  <text class="model-or-redteam-h1"  x="30" y="40">Threat model or red team</text>
  <text class="model-or-redteam-sub" x="30" y="64">One maps; one probes.</text>
  <rect class="model-or-redteam-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="model-or-redteam-name" x="46" y="122">Threat model</text>
  <text class="model-or-redteam-desc" x="46" y="142">Maps the boundaries.</text>
  <text class="model-or-redteam-desc model-or-redteam-row model-or-redteam-r0" x="46" y="182">Runs before code exists</text>
  <text class="model-or-redteam-desc model-or-redteam-row model-or-redteam-r1" x="46" y="216">Finds boundaries nobody drew</text>
  <text class="model-or-redteam-desc model-or-redteam-row model-or-redteam-r2" x="46" y="250">Produces a ranked backlog</text>
  <text class="model-or-redteam-desc model-or-redteam-row model-or-redteam-r3" x="46" y="284">Cheap, and repeatable on every change</text>
  <text class="model-or-redteam-desc model-or-redteam-row model-or-redteam-r4" x="46" y="318">Cannot prove an exploit works</text>
  <rect class="model-or-redteam-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="model-or-redteam-name" x="526" y="122">Red teaming</text>
  <text class="model-or-redteam-desc" x="526" y="142">Probes the running system.</text>
  <text class="model-or-redteam-desc model-or-redteam-row model-or-redteam-r0" x="526" y="182">Garak, PyRIT, jailbreak fuzzing</text>
  <text class="model-or-redteam-desc model-or-redteam-row model-or-redteam-r1" x="526" y="216">Finds phrasings that get through today</text>
  <text class="model-or-redteam-desc model-or-redteam-row model-or-redteam-r2" x="526" y="250">Produces evidence, not architecture</text>
  <text class="model-or-redteam-desc model-or-redteam-row model-or-redteam-r3" x="526" y="284">Runs against a deployment</text>
  <text class="model-or-redteam-desc model-or-redteam-row model-or-redteam-r4" x="526" y="318">Cannot find a missing boundary</text>
  <text class="model-or-redteam-sub" x="30" y="372">They fail in opposite directions, which is the argument for both: a red team cannot tell you a tool has too much authority, and a threat model cannot tell you which jailbreak works this month.</text>
</svg>
