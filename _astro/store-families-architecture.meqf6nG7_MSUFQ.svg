<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 980" width="1280" height="980" role="img" aria-labelledby="d092a-title d092a-desc">
  <title id="d092a-title">One book in four shapes: relational rows, a key and an opaque value, a nested document, and a graph of nodes and edges</title>
  <desc id="d092a-desc">The same library record — The C Programming Language, published 1978, shelf A3, credited to Brian W. Kernighan and Dennis M. Ritchie — drawn four ways. As relational rows it is a books row, two book_authors junction rows keyed on the pair, and two authors rows, with foreign keys drawn as arrows. As a key-value pair it is the single key book:101 addressing one opaque blob the store never looks inside. As a document it is one nested JSON value with the authors as a list. As a graph it is a Book node with two CREDITED edges to Author nodes and one SHELVED_ON edge to a Shelf node. A table across the foot compares the four on six questions: fetching one book by id, listing every book on shelf A3, finding who wrote it, what happens to a misspelled field name, what each shape gave up, and what it got in exchange.</desc>

  <style>
    .d092a-bg     { fill: #f8fafc; }
    .d092a-h1     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 600; fill: #1a202c; }
    .d092a-sub    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d092a-fam    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 600; fill: #ffffff; }
    .d092a-cap    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d092a-tname  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #1d4ed8; }
    .d092a-row    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1a202c; }
    .d092a-mono   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1a202c; }
    .d092a-warn   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #b45309; }
    .d092a-good   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #047857; }
    .d092a-edge   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #1d4ed8; }
    .d092a-hdr    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #1a202c; }
    .d092a-band   { fill: #1d4ed8; }
    .d092a-box    { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d092a-boxk   { fill: #ffffff; stroke: #1d4ed8; stroke-width: 2.5; }
    .d092a-blob   { fill: #e2e8f0; stroke: #64748b; stroke-width: 1.5; }
    .d092a-node   { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d092a-link   { fill: none; stroke: #1d4ed8; stroke-width: 2; }
    .d092a-panel  { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d092a-cell   { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
    .d092a-cellhd { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5; }
  </style>

  <defs>
    <marker id="d092a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
  </defs>

  <rect class="d092a-bg" x="0" y="0" width="1280" height="980" />

  <text class="d092a-h1"  x="32" y="38">One record, four shapes — and the same record every time</text>
  <text class="d092a-sub" x="32" y="62">The C Programming Language · book_id 101 · published 1978 · shelf A3 · credited to Brian W. Kernighan and Dennis M. Ritchie</text>
  <text class="d092a-sub" x="32" y="82">Nothing below differs in the data. Everything below differs in what the store will let you ask.</text>

  <!-- =============== 1. RELATIONAL =============== -->
  <rect class="d092a-band" x="32" y="104" width="268" height="34" rx="6" />
  <text class="d092a-fam" x="166" y="127" text-anchor="middle">1 · Relational</text>
  <text class="d092a-cap" x="166" y="158" text-anchor="middle">rows, and a key that points</text>

  <rect class="d092a-box" x="44" y="172" width="244" height="70" rx="6" />
  <text class="d092a-tname" x="56" y="192">books</text>
  <text class="d092a-mono"  x="56" y="212">101 | The C Programming La…</text>
  <text class="d092a-mono"  x="56" y="232">1978 | A3</text>

  <path class="d092a-link" d="M 166 292 L 166 250" marker-end="url(#d092a-arrow)" />
  <text class="d092a-edge" x="176" y="276">FK</text>

  <rect class="d092a-boxk" x="44" y="298" width="244" height="70" rx="6" />
  <text class="d092a-tname" x="56" y="318">book_authors  (PK: the pair)</text>
  <text class="d092a-mono"  x="56" y="338">101 → 1</text>
  <text class="d092a-mono"  x="56" y="358">101 → 2</text>

  <path class="d092a-link" d="M 166 376 L 166 418" marker-end="url(#d092a-arrow)" />
  <text class="d092a-edge" x="176" y="402">FK</text>

  <rect class="d092a-box" x="44" y="424" width="244" height="70" rx="6" />
  <text class="d092a-tname" x="56" y="444">authors</text>
  <text class="d092a-mono"  x="56" y="464">1 | Brian W. Kernighan</text>
  <text class="d092a-mono"  x="56" y="484">2 | Dennis M. Ritchie</text>

  <text class="d092a-cap" x="44" y="514">A column holds one value, so the</text>
  <text class="d092a-cap" x="44" y="532">author list needs a third table.</text>

  <!-- =============== 2. KEY-VALUE =============== -->
  <rect class="d092a-band" x="348" y="104" width="268" height="34" rx="6" />
  <text class="d092a-fam" x="482" y="127" text-anchor="middle">2 · Key-value</text>
  <text class="d092a-cap" x="482" y="158" text-anchor="middle">one key, one opaque value</text>

  <rect class="d092a-boxk" x="360" y="172" width="244" height="48" rx="6" />
  <text class="d092a-tname" x="372" y="192">the key</text>
  <text class="d092a-mono"  x="372" y="212">book:101</text>

  <path class="d092a-link" d="M 482 228 L 482 264" marker-end="url(#d092a-arrow)" />

  <rect class="d092a-blob" x="360" y="270" width="244" height="130" rx="6" />
  <text class="d092a-tname" x="372" y="292">the value</text>
  <text class="d092a-mono"  x="372" y="314">7b 22 62 6f 6f 6b 5f 69 64</text>
  <text class="d092a-mono"  x="372" y="334">22 3a 31 30 31 2c 22 74 69</text>
  <text class="d092a-mono"  x="372" y="354">74 6c 65 22 3a 22 54 68 65</text>
  <text class="d092a-warn"  x="372" y="382">130 bytes. Opaque.</text>

  <text class="d092a-cap" x="360" y="424">The store never looks inside. JSON</text>
  <text class="d092a-cap" x="360" y="442">here is your choice, not its rule —</text>
  <text class="d092a-cap" x="360" y="460">a pickle or a JPEG would do as well.</text>
  <text class="d092a-cap" x="360" y="486">Shelf A3? Inside the blob.</text>
  <text class="d092a-cap" x="360" y="504">Authors? Inside the blob.</text>
  <text class="d092a-cap" x="360" y="532">Both invisible until YOU decode it.</text>

  <!-- =============== 3. DOCUMENT =============== -->
  <rect class="d092a-band" x="664" y="104" width="268" height="34" rx="6" />
  <text class="d092a-fam" x="798" y="127" text-anchor="middle">3 · Document</text>
  <text class="d092a-cap" x="798" y="158" text-anchor="middle">one nested value, and the store reads it</text>

  <rect class="d092a-boxk" x="676" y="172" width="244" height="228" rx="6" />
  <text class="d092a-tname" x="688" y="192">key: book:101</text>
  <text class="d092a-mono"  x="688" y="216">{</text>
  <text class="d092a-mono"  x="688" y="236">  "book_id": 101,</text>
  <text class="d092a-mono"  x="688" y="256">  "title": "The C Prog…",</text>
  <text class="d092a-mono"  x="688" y="276">  "published_year": 1978,</text>
  <text class="d092a-mono"  x="688" y="296">  "shelf": "A3",</text>
  <text class="d092a-mono"  x="688" y="316">  "authors": [</text>
  <text class="d092a-mono"  x="688" y="336">    "Brian W. Kernighan",</text>
  <text class="d092a-mono"  x="688" y="356">    "Dennis M. Ritchie"</text>
  <text class="d092a-mono"  x="688" y="376">  ]</text>
  <text class="d092a-mono"  x="688" y="396">}</text>

  <text class="d092a-cap" x="676" y="424">The list that could not live on a row</text>
  <text class="d092a-cap" x="676" y="442">is just a field. That is the pitch.</text>
  <text class="d092a-cap" x="676" y="468">The store can filter on any field it</text>
  <text class="d092a-cap" x="676" y="486">can parse — and can index one, if you</text>
  <text class="d092a-cap" x="676" y="504">name the exact expression to index.</text>
  <text class="d092a-cap" x="676" y="532">Nothing checks the field NAMES.</text>

  <!-- =============== 4. GRAPH =============== -->
  <rect class="d092a-band" x="980" y="104" width="268" height="34" rx="6" />
  <text class="d092a-fam" x="1114" y="127" text-anchor="middle">4 · Graph</text>
  <text class="d092a-cap" x="1114" y="158" text-anchor="middle">the relationship is the record</text>

  <rect class="d092a-node" x="1046" y="176" width="136" height="52" rx="8" />
  <text class="d092a-tname" x="1114" y="197" text-anchor="middle">:Book</text>
  <text class="d092a-mono"  x="1114" y="217" text-anchor="middle">title, year 1978</text>

  <path class="d092a-link" d="M 1074 230 L 1022 292" marker-end="url(#d092a-arrow)" />
  <path class="d092a-link" d="M 1154 230 L 1206 292" marker-end="url(#d092a-arrow)" />
  <text class="d092a-edge" x="1010" y="262" text-anchor="middle">CREDITED</text>
  <text class="d092a-edge" x="1222" y="262" text-anchor="middle">CREDITED</text>

  <rect class="d092a-node" x="964" y="298" width="124" height="52" rx="8" />
  <text class="d092a-tname" x="1026" y="319" text-anchor="middle">:Author</text>
  <text class="d092a-mono"  x="1026" y="339" text-anchor="middle">Kernighan</text>

  <rect class="d092a-node" x="1140" y="298" width="124" height="52" rx="8" />
  <text class="d092a-tname" x="1202" y="319" text-anchor="middle">:Author</text>
  <text class="d092a-mono"  x="1202" y="339" text-anchor="middle">Ritchie</text>

  <path class="d092a-link" d="M 1114 230 L 1114 386" marker-end="url(#d092a-arrow)" />
  <text class="d092a-edge" x="1122" y="372">SHELVED_ON</text>

  <rect class="d092a-node" x="1046" y="392" width="136" height="44" rx="8" />
  <text class="d092a-tname" x="1114" y="420" text-anchor="middle">:Shelf  A3</text>

  <text class="d092a-cap" x="980" y="468">No junction table: the edge itself is</text>
  <text class="d092a-cap" x="980" y="486">stored, named, and can carry its own</text>
  <text class="d092a-cap" x="980" y="504">properties — such as credit order.</text>
  <text class="d092a-cap" x="980" y="532">Built for hops, not for bulk scans.</text>

  <!-- =============== COMPARISON TABLE =============== -->
  <text class="d092a-h1" x="32" y="586">The same six questions, asked of all four</text>

  <rect class="d092a-cellhd" x="32"   y="600" width="232" height="44" />
  <rect class="d092a-cellhd" x="264"  y="600" width="248" height="44" />
  <rect class="d092a-cellhd" x="512"  y="600" width="248" height="44" />
  <rect class="d092a-cellhd" x="760"  y="600" width="248" height="44" />
  <rect class="d092a-cellhd" x="1008" y="600" width="240" height="44" />
  <text class="d092a-hdr" x="44"   y="628">the question</text>
  <text class="d092a-hdr" x="276"  y="628">relational</text>
  <text class="d092a-hdr" x="524"  y="628">key-value</text>
  <text class="d092a-hdr" x="772"  y="628">document</text>
  <text class="d092a-hdr" x="1020" y="628">graph</text>

  <rect class="d092a-cell" x="32"   y="644" width="232" height="46" />
  <rect class="d092a-cell" x="264"  y="644" width="248" height="46" />
  <rect class="d092a-cell" x="512"  y="644" width="248" height="46" />
  <rect class="d092a-cell" x="760"  y="644" width="248" height="46" />
  <rect class="d092a-cell" x="1008" y="644" width="240" height="46" />
  <text class="d092a-row" x="44"   y="672">get book 101</text>
  <text class="d092a-good" x="276"  y="672">one lookup</text>
  <text class="d092a-good" x="524"  y="672">one lookup — its whole job</text>
  <text class="d092a-good" x="772"  y="672">one lookup</text>
  <text class="d092a-good" x="1020" y="672">one lookup</text>

  <rect class="d092a-cell" x="32"   y="690" width="232" height="46" />
  <rect class="d092a-cell" x="264"  y="690" width="248" height="46" />
  <rect class="d092a-cell" x="512"  y="690" width="248" height="46" />
  <rect class="d092a-cell" x="760"  y="690" width="248" height="46" />
  <rect class="d092a-cell" x="1008" y="690" width="240" height="46" />
  <text class="d092a-row" x="44"   y="718">every book on shelf A3</text>
  <text class="d092a-row" x="276"  y="718">WHERE shelf = 'A3'</text>
  <text class="d092a-warn" x="524"  y="718">scan every key, in your code</text>
  <text class="d092a-row" x="772"  y="718">a field query, indexable</text>
  <text class="d092a-row" x="1020" y="718">walk SHELVED_ON</text>

  <rect class="d092a-cell" x="32"   y="736" width="232" height="46" />
  <rect class="d092a-cell" x="264"  y="736" width="248" height="46" />
  <rect class="d092a-cell" x="512"  y="736" width="248" height="46" />
  <rect class="d092a-cell" x="760"  y="736" width="248" height="46" />
  <rect class="d092a-cell" x="1008" y="736" width="240" height="46" />
  <text class="d092a-row" x="44"   y="764">who wrote it</text>
  <text class="d092a-row" x="276"  y="764">two JOINs, in the engine</text>
  <text class="d092a-warn" x="524"  y="764">decode, then your own loop</text>
  <text class="d092a-good" x="772"  y="764">read the field — it is there</text>
  <text class="d092a-good" x="1020" y="764">one hop per edge</text>

  <rect class="d092a-cell" x="32"   y="782" width="232" height="46" />
  <rect class="d092a-cell" x="264"  y="782" width="248" height="46" />
  <rect class="d092a-cell" x="512"  y="782" width="248" height="46" />
  <rect class="d092a-cell" x="760"  y="782" width="248" height="46" />
  <rect class="d092a-cell" x="1008" y="782" width="240" height="46" />
  <text class="d092a-row" x="44"   y="810">a field typed "titel"</text>
  <text class="d092a-good" x="276"  y="810">REFUSED, now, by name</text>
  <text class="d092a-warn" x="524"  y="810">accepted, silently</text>
  <text class="d092a-warn" x="772"  y="810">accepted, silently</text>
  <text class="d092a-warn" x="1020" y="810">accepted, silently</text>

  <rect class="d092a-cell" x="32"   y="828" width="232" height="58" />
  <rect class="d092a-cell" x="264"  y="828" width="248" height="58" />
  <rect class="d092a-cell" x="512"  y="828" width="248" height="58" />
  <rect class="d092a-cell" x="760"  y="828" width="248" height="58" />
  <rect class="d092a-cell" x="1008" y="828" width="240" height="58" />
  <text class="d092a-row" x="44"   y="852">what it gave up</text>
  <text class="d092a-row" x="276"  y="852">nothing — this is the</text>
  <text class="d092a-row" x="276"  y="872">baseline you compare to</text>
  <text class="d092a-row" x="524"  y="852">every query except</text>
  <text class="d092a-row" x="524"  y="872">the one by key</text>
  <text class="d092a-row" x="772"  y="852">schema enforcement,</text>
  <text class="d092a-row" x="772"  y="872">and joins across documents</text>
  <text class="d092a-row" x="1020" y="852">schema, and easy</text>
  <text class="d092a-row" x="1020" y="872">splitting across machines</text>

  <rect class="d092a-cell" x="32"   y="886" width="232" height="58" />
  <rect class="d092a-cell" x="264"  y="886" width="248" height="58" />
  <rect class="d092a-cell" x="512"  y="886" width="248" height="58" />
  <rect class="d092a-cell" x="760"  y="886" width="248" height="58" />
  <rect class="d092a-cell" x="1008" y="886" width="240" height="58" />
  <text class="d092a-row" x="44"   y="910">what it got for it</text>
  <text class="d092a-row" x="276"  y="910">integrity, joins, and any</text>
  <text class="d092a-row" x="276"  y="930">question you think of later</text>
  <text class="d092a-row" x="524"  y="910">the simplest contract</text>
  <text class="d092a-row" x="524"  y="930">there is, and easy splitting</text>
  <text class="d092a-row" x="772"  y="910">the record's own shape,</text>
  <text class="d092a-row" x="772"  y="930">stored and fetched whole</text>
  <text class="d092a-row" x="1020" y="910">relationships as first-class</text>
  <text class="d092a-row" x="1020" y="930">things you can traverse</text>

  <text class="d092a-sub" x="32" y="966">Read the fourth row across. Only one shape had anything to say about the typo — and it said it at the moment of the mistake.</text>
</svg>
