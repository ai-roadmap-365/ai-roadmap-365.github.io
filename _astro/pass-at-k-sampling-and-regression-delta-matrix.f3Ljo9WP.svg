<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Pass at k Sampling and Regression Delta Matrix">
  <title>Pass at k Sampling and Regression Delta Matrix</title>
  <defs>
    <style>
      .d312f-bg { fill: #f8fafc; }
      .d312f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d312f-row1 { fill: #eff6ff; }
      .d312f-row2 { fill: #f0fdf4; }
      .d312f-row3 { fill: #fef2f2; }
      .d312f-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d312f-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d312f-header { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #1e293b; }
      .d312f-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d312f-bg" />
  
  <text x="40" y="40" class="d312a-title">Pass@k Sampling and Regression Matrix</text>
  <text x="40" y="65" class="d312a-subtitle">Pass at k Sampling and Regression Delta Matrix showing Stochastic Sampling across k=1 and k=5, Metric Deltas, and Category Breakdown</text>
  
  <rect x="40" y="100" width="820" height="290" class="d312f-card" />
  
  <!-- Table Header -->
  <rect x="40" y="100" width="820" height="40" fill="#e2e8f0" rx="8" />
  <text x="60" y="125" class="d312f-header">Dataset Category</text>
  <text x="260" y="125" class="d312f-header">Baseline (Pass@1)</text>
  <text x="420" y="125" class="d312f-header">Candidate (Pass@1)</text>
  <text x="580" y="125" class="d312f-header">Delta (%)</text>
  <text x="720" y="125" class="d312f-header">Gate Decision</text>
  
  <!-- Row 1: Core Domain Tasks -->
  <rect x="42" y="145" width="816" height="50" class="d312f-row2" />
  <text x="60" y="175" class="d312f-text" font-weight="600">Core Happy Path Invariants</text>
  <text x="260" y="175" class="d312f-text">92.0% (46/50)</text>
  <text x="420" y="175" class="d312f-text">96.0% (48/50)</text>
  <text x="580" y="175" class="d312f-text" fill="#15803d" font-weight="700">+4.0%</text>
  <text x="720" y="175" class="d312f-text" fill="#15803d" font-weight="700">PASS</text>
  
  <!-- Row 2: Hard Negatives -->
  <rect x="42" y="200" width="816" height="50" class="d312f-row2" />
  <text x="60" y="230" class="d312f-text" font-weight="600">Hard Negatives (Abstention)</text>
  <text x="260" y="230" class="d312f-text">84.0% (21/25)</text>
  <text x="420" y="230" class="d312f-text">88.0% (22/25)</text>
  <text x="580" y="230" class="d312f-text" fill="#15803d" font-weight="700">+4.0%</text>
  <text x="720" y="230" class="d312f-text" fill="#15803d" font-weight="700">PASS</text>
  
  <!-- Row 3: Schema Boundary Conditions -->
  <rect x="42" y="255" width="816" height="50" class="d312f-row1" />
  <text x="60" y="285" class="d312f-text" font-weight="600">JSON Schema Boundaries</text>
  <text x="260" y="285" class="d312f-text">100.0% (15/15)</text>
  <text x="420" y="285" class="d312f-text">100.0% (15/15)</text>
  <text x="580" y="285" class="d312f-text" fill="#64748b">0.0%</text>
  <text x="720" y="285" class="d312f-text" fill="#15803d" font-weight="700">PASS</text>
  
  <!-- Row 4: Adversarial Injection -->
  <rect x="42" y="310" width="816" height="50" class="d312f-row2" />
  <text x="60" y="340" class="d312f-text" font-weight="600">Adversarial Jailbreak Refusal</text>
  <text x="260" y="340" class="d312f-text">100.0% (10/10)</text>
  <text x="420" y="340" class="d312f-text">100.0% (10/10)</text>
  <text x="580" y="340" class="d312f-text" fill="#64748b">0.0%</text>
  <text x="720" y="340" class="d312f-text" fill="#15803d" font-weight="700">PASS</text>
</svg>