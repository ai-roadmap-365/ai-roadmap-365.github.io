<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" font-family="system-ui, sans-serif">
  <title>Decoding the permission string dash r w x r dash x r dash dash into user, group, and other, and into the octal number 754</title>
  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Reading a permission string</text>
  <text x="360" y="58" text-anchor="middle" font-size="14" fill="#1a202c">The first column of `ls -l`, decoded field by field</text>

  <!-- The raw string, each char in a cell -->
  <g font-family="ui-monospace, monospace">
    <rect x="60" y="82" width="40" height="46" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="80" y="113" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a202c">-</text>

    <rect x="110" y="82" width="40" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="130" y="113" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a202c">r</text>
    <rect x="150" y="82" width="40" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="170" y="113" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a202c">w</text>
    <rect x="190" y="82" width="40" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="210" y="113" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a202c">x</text>

    <rect x="230" y="82" width="40" height="46" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="250" y="113" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a202c">r</text>
    <rect x="270" y="82" width="40" height="46" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="290" y="113" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a202c">-</text>
    <rect x="310" y="82" width="40" height="46" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="330" y="113" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a202c">x</text>

    <rect x="350" y="82" width="40" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="370" y="113" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a202c">r</text>
    <rect x="390" y="82" width="40" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="410" y="113" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a202c">-</text>
    <rect x="430" y="82" width="40" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="450" y="113" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a202c">-</text>
  </g>

  <!-- Field labels -->
  <text x="80" y="150" text-anchor="middle" font-size="13" fill="#1a202c">type</text>
  <text x="80" y="166" text-anchor="middle" font-size="12" fill="#1a202c">(- = file)</text>
  <text x="170" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">user (owner)</text>
  <text x="290" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">group</text>
  <text x="410" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">other</text>

  <!-- Binary + octal per triad -->
  <g font-family="ui-monospace, monospace">
    <rect x="110" y="196" width="120" height="80" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
    <text x="170" y="222" text-anchor="middle" font-size="15" fill="#1a202c">r w x</text>
    <text x="170" y="244" text-anchor="middle" font-size="15" fill="#1a202c">1 1 1</text>
    <text x="170" y="268" text-anchor="middle" font-size="22" font-weight="bold" fill="#1d4ed8">7</text>

    <rect x="230" y="196" width="120" height="80" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
    <text x="290" y="222" text-anchor="middle" font-size="15" fill="#1a202c">r - x</text>
    <text x="290" y="244" text-anchor="middle" font-size="15" fill="#1a202c">1 0 1</text>
    <text x="290" y="268" text-anchor="middle" font-size="22" font-weight="bold" fill="#1d4ed8">5</text>

    <rect x="350" y="196" width="120" height="80" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
    <text x="410" y="222" text-anchor="middle" font-size="15" fill="#1a202c">r - -</text>
    <text x="410" y="244" text-anchor="middle" font-size="15" fill="#1a202c">1 0 0</text>
    <text x="410" y="268" text-anchor="middle" font-size="22" font-weight="bold" fill="#1d4ed8">4</text>
  </g>

  <text x="120" y="248" text-anchor="middle" font-size="13" fill="#1a202c">4+2+1</text>
  <text x="500" y="240" font-size="14" fill="#1a202c">Each bit is worth</text>
  <text x="500" y="260" font-size="14" fill="#1a202c">r = 4, w = 2, x = 1</text>

  <!-- Octal result -->
  <rect x="230" y="312" width="260" height="54" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="360" y="346" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a202c">octal 754</text>
  <line x1="170" y1="276" x2="330" y2="312" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="290" y1="276" x2="360" y2="312" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="410" y1="276" x2="390" y2="312" stroke="#1d4ed8" stroke-width="2"/>

  <text x="360" y="404" text-anchor="middle" font-size="14" fill="#1a202c">chmod 754 file  sets exactly these bits: owner rwx, group r-x, other r--.</text>
</svg>
