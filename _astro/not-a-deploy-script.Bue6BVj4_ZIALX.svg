<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Asking what it does first means the model has not landed.">
  <title>Not a deployment script</title>
  <style>
    .not-a-deploy-script-bg   { fill: #f8fafc; }
    .not-a-deploy-script-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-deploy-script-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-deploy-script-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-deploy-script-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-deploy-script-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-deploy-script-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-a-deploy-script-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .not-a-deploy-script-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .not-a-deploy-script-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .not-a-deploy-script-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .not-a-deploy-script-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .not-a-deploy-script-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-a-deploy-script-row { opacity: 1; }
    .not-a-deploy-script-r0 { animation-delay: 0.00s; }
    .not-a-deploy-script-r1 { animation-delay: 0.45s; }
    .not-a-deploy-script-r2 { animation-delay: 0.90s; }
    .not-a-deploy-script-r3 { animation-delay: 1.35s; }
    .not-a-deploy-script-r4 { animation-delay: 1.80s; }
    .not-a-deploy-script-row { animation: not-a-deploy-script-reveal 7.3s ease-in-out infinite; }
    @keyframes not-a-deploy-script-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="not-a-deploy-script-bg" width="980" height="390"/>
  <text class="not-a-deploy-script-h1"  x="30" y="40">Not a deployment script</text>
  <text class="not-a-deploy-script-sub" x="30" y="64">Asking what it does first means the model has not landed.</text>
  <rect class="not-a-deploy-script-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="not-a-deploy-script-name" x="46" y="122">What it is</text>
  <text class="not-a-deploy-script-desc" x="46" y="142">Controllers closing gaps.</text>
  <text class="not-a-deploy-script-desc not-a-deploy-script-row not-a-deploy-script-r0" x="46" y="182">Declarative — you describe an outcome</text>
  <text class="not-a-deploy-script-desc not-a-deploy-script-row not-a-deploy-script-r1" x="46" y="216">Self-correcting, whatever caused the gap</text>
  <text class="not-a-deploy-script-desc not-a-deploy-script-row not-a-deploy-script-r2" x="46" y="250">A scheduler plus a control plane</text>
  <text class="not-a-deploy-script-desc not-a-deploy-script-row not-a-deploy-script-r3" x="46" y="284">Safe to interrupt at any point</text>
  <text class="not-a-deploy-script-desc not-a-deploy-script-row not-a-deploy-script-r4" x="46" y="318">Deleting a pod is not destructive</text>
  <rect class="not-a-deploy-script-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="not-a-deploy-script-name" x="526" y="122">What it is not</text>
  <text class="not-a-deploy-script-desc" x="526" y="142">Three misconceptions.</text>
  <text class="not-a-deploy-script-desc not-a-deploy-script-row not-a-deploy-script-r0" x="526" y="182">Not a sequence of steps</text>
  <text class="not-a-deploy-script-desc not-a-deploy-script-row not-a-deploy-script-r1" x="526" y="216">Not a way to make an app reliable</text>
  <text class="not-a-deploy-script-desc not-a-deploy-script-row not-a-deploy-script-r2" x="526" y="250">It restarts things, faster and more often</text>
  <text class="not-a-deploy-script-desc not-a-deploy-script-row not-a-deploy-script-r3" x="526" y="284">Not required — one VM is a real architecture</text>
  <text class="not-a-deploy-script-desc not-a-deploy-script-row not-a-deploy-script-r4" x="526" y="318">Often the better one, for one instance</text>
  <text class="not-a-deploy-script-sub" x="30" y="372">"An application that corrupts data when killed will corrupt data more often" is the sharpest form of the second point: reliability of the platform and reliability of the workload are independent properties.</text>
</svg>
