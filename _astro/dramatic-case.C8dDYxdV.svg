<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four results.">
  <title>The measured disagreement</title>
  <style>
    .dramatic-case-bg   { fill: #f8fafc; }
    .dramatic-case-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dramatic-case-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dramatic-case-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dramatic-case-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dramatic-case-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dramatic-case-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dramatic-case-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dramatic-case-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dramatic-case-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dramatic-case-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dramatic-case-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dramatic-case-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .dramatic-case-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .dramatic-case-stage { opacity: 1; }

    .dramatic-case-s0 { animation-delay: 0.00s; }
    .dramatic-case-e0 { animation-delay: 0.00s; }
    .dramatic-case-s1 { animation-delay: 1.28s; }
    .dramatic-case-e1 { animation-delay: 1.28s; }
    .dramatic-case-s2 { animation-delay: 2.56s; }
    .dramatic-case-e2 { animation-delay: 2.56s; }
    .dramatic-case-s3 { animation-delay: 3.84s; }
    .dramatic-case-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .dramatic-case-conn  { animation: dramatic-case-trace 6.4s ease-in-out infinite; }
      .dramatic-case-stage { animation: dramatic-case-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes dramatic-case-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes dramatic-case-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .dramatic-case-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .dramatic-case-stage { animation: dramatic-case-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes dramatic-case-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="dramatic-case-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="dramatic-case-bg" width="980" height="322"/>
  <text class="dramatic-case-h1"  x="30" y="40">The measured disagreement</text>
  <text class="dramatic-case-sub" x="30" y="64">Four results.</text>
  <g class="dramatic-case-stage dramatic-case-s0">
    <rect class="dramatic-case-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="dramatic-case-step" x="44" y="142">01</text>
    <text class="dramatic-case-name" x="70" y="142">Add a column that nearly duplicates another</text>
    <text class="dramatic-case-desc" x="44" y="166">Which is common in real data.</text>
  </g>
  <line class="dramatic-case-line dramatic-case-conn dramatic-case-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#dramatic-case-tip)"/>
  <g class="dramatic-case-stage dramatic-case-s1">
    <rect class="dramatic-case-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="dramatic-case-step" x="280" y="142">02</text>
    <text class="dramatic-case-name" x="306" y="142">The normal equations give coefficients of +196,747 and -196,742</text>
    <text class="dramatic-case-desc" x="280" y="166">Enormous, and nearly cancelling.</text>
  </g>
  <line class="dramatic-case-line dramatic-case-conn dramatic-case-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#dramatic-case-tip)"/>
  <g class="dramatic-case-stage dramatic-case-s2">
    <rect class="dramatic-case-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="dramatic-case-step" x="516" y="142">03</text>
    <text class="dramatic-case-name" x="542" y="142">The decomposition route gives 2.501 and 2.501</text>
    <text class="dramatic-case-desc" x="516" y="166">Modest, and stable.</text>
  </g>
  <line class="dramatic-case-line dramatic-case-conn dramatic-case-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#dramatic-case-tip)"/>
  <g class="dramatic-case-stage dramatic-case-s3">
    <rect class="dramatic-case-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="dramatic-case-step" x="752" y="142">04</text>
    <text class="dramatic-case-name" x="778" y="142">Both fit the training data equally well</text>
    <text class="dramatic-case-desc" x="752" y="166">Which is why the failure is</text>
    <text class="dramatic-case-desc" x="752" y="182">invisible in the score.</text>
  </g>
  <text class="dramatic-case-sub" x="30" y="304">Both solutions fitting equally well is what makes this dangerous: nothing in the usual diagnostics distinguishes the meaningless answer from the sensible one.</text>
</svg>
