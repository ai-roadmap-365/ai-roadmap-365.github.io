<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" width="1080" height="760" role="img" aria-labelledby="d124fTitleId d124fDescId">
  <title id="d124fTitleId">indicator=True in motion -- left_only, right_only, both, and a duplicated key multiplying</title>
  <desc id="d124fDescId">Keys from a left table and a right table travel toward a central merge point. A matched key settles into a green both bucket. An unmatched left key settles into an amber left_only bucket. An unmatched right key settles into a blue right_only bucket. Below, a duplicated key on both sides is shown producing four output rows from one pair of source rows, all landing in the both bucket. A caption states that the three bucket counts must sum to the total output row count. With motion disabled every bucket, count and label is still shown in its final state.</desc>

  <style>
    .d124f-bg      { fill: #f8fafc; }
    .d124f-title   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; fill: #1a202c; }
    .d124f-sub     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13.5px; fill: #334155; }
    .d124f-stage   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; font-weight: 700; fill: #1d4ed8; letter-spacing: 0.5px; }
    .d124f-label   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14.5px; font-weight: 700; fill: #1a202c; }
    .d124f-small   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #334155; }
    .d124f-mono    { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; fill: #1a202c; }
    .d124f-count   { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; fill: #1a202c; }
    .d124f-caption { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13.5px; fill: #334155; }
    .d124f-src     { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
    .d124f-merge   { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 1.75; }

    /* Motion 3: stage lighting on the three destination buckets, staggered. */
    .d124f-bucket        { stroke-width: 1.75; animation: d124f-lift 6s ease-in-out infinite; }
    .d124f-bucket-left    { fill: #fef3c7; stroke: #b45309; animation-delay: 1.2s; }
    .d124f-bucket-both    { fill: #dcfce7; stroke: #047857; animation-delay: 2.2s; }
    .d124f-bucket-right   { fill: #dbeafe; stroke: #1d4ed8; animation-delay: 1.6s; }
    @keyframes d124f-lift {
      0%, 22%, 100% { filter: none; }
      8%, 16%       { filter: brightness(1.12); }
    }

    /* Motion 2: marching-dash wires. */
    .d124f-wire      { stroke-width: 2.25; fill: none; stroke-dasharray: 9 7; animation: d124f-march 1.5s linear infinite; }
    .d124f-wire-in    { stroke: #64748b; }
    .d124f-wire-left  { stroke: #b45309; }
    .d124f-wire-both  { stroke: #047857; }
    .d124f-wire-right { stroke: #1d4ed8; }
    @keyframes d124f-march { to { stroke-dashoffset: -16; } }

    /* Motion 1: tokens travelling the tracks, resting visible at their start. */
    .d124f-token       { animation: d124f-travel-a 6s ease-in-out infinite; }
    .d124f-token-b      { animation: d124f-travel-b 6s ease-in-out infinite; }
    @keyframes d124f-travel-a {
      0%   { transform: translateX(0);      opacity: 1; }
      8%   { transform: translateX(0);      opacity: 1; }
      45%  { transform: translateX(300px);  opacity: 1; }
      100% { transform: translateX(300px);  opacity: 1; }
    }
    @keyframes d124f-travel-b {
      0%, 45%   { transform: translateX(0);     opacity: 0.9; }
      55%       { transform: translateX(0);     opacity: 1; }
      92%       { transform: translateX(260px); opacity: 1; }
      100%      { transform: translateX(260px); opacity: 1; }
    }

    /* Duplicated-key vignette: four output tokens, each a touch later than the last. */
    .d124f-dup        { animation: d124f-travel-dup 6s ease-in-out infinite; }
    .d124f-dup1 { animation-delay: 0s; }
    .d124f-dup2 { animation-delay: 0.35s; }
    .d124f-dup3 { animation-delay: 0.7s; }
    .d124f-dup4 { animation-delay: 1.05s; }
    @keyframes d124f-travel-dup {
      0%, 40%  { transform: translateX(0);     opacity: 0.9; }
      70%      { transform: translateX(220px); opacity: 1; }
      100%     { transform: translateX(220px); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d124f-bucket { animation: none; filter: none; }
      .d124f-wire   { animation: none; stroke-dasharray: none; }
      .d124f-token, .d124f-token-b, .d124f-dup {
        animation: none; transform: translateX(0); opacity: 1;
      }
    }
  </style>

  <defs>
    <marker id="d124f-arrow-grey" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#64748b" />
    </marker>
    <marker id="d124f-arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#b45309" />
    </marker>
    <marker id="d124f-arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#047857" />
    </marker>
    <marker id="d124f-arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#1d4ed8" />
    </marker>
  </defs>

  <rect class="d124f-bg" x="0" y="0" width="1080" height="760" />

  <text class="d124f-title" x="24" y="34">indicator=True, watched as a process</text>
  <text class="d124f-sub" x="24" y="54">left_keys.merge(right_keys, on="cust_id", how="outer", indicator=True)</text>

  <!-- ===================== TOP: THREE OUTCOMES ===================== -->
  <text class="d124f-stage" x="24" y="86">1. WHERE EACH KEY LANDS</text>

  <rect class="d124f-src" x="40" y="130" width="170" height="64" rx="8" />
  <text class="d124f-label" x="125" y="156" text-anchor="middle">left keys</text>
  <text class="d124f-mono" x="125" y="178" text-anchor="middle">A  B  C  D</text>

  <rect class="d124f-src" x="40" y="380" width="170" height="64" rx="8" />
  <text class="d124f-label" x="125" y="406" text-anchor="middle">right keys</text>
  <text class="d124f-mono" x="125" y="428" text-anchor="middle">B  C  D  E</text>

  <path class="d124f-merge" d="M 490 250 L 560 300 L 490 350 L 420 300 Z" />
  <text class="d124f-small" x="500" y="380" text-anchor="middle">merge on</text>
  <text class="d124f-mono" x="500" y="398" text-anchor="middle">cust_id</text>

  <!-- inbound wires: source -> merge point -->
  <path class="d124f-wire d124f-wire-in" d="M 210 162 C 320 162 360 260 480 292" marker-end="url(#d124f-arrow-grey)" />
  <path class="d124f-wire d124f-wire-in" d="M 210 412 C 320 412 360 340 480 308" marker-end="url(#d124f-arrow-grey)" />

  <circle class="d124f-token" cx="176" cy="162" r="8" fill="#64748b" />
  <circle class="d124f-token" cx="176" cy="412" r="8" fill="#64748b" />

  <!-- outbound wires: merge point -> three buckets -->
  <path class="d124f-wire d124f-wire-left" d="M 560 285 C 660 220 720 150 780 118" marker-end="url(#d124f-arrow-amber)" />
  <path class="d124f-wire d124f-wire-both" d="M 560 300 C 660 300 720 300 780 300" marker-end="url(#d124f-arrow-green)" />
  <path class="d124f-wire d124f-wire-right" d="M 560 315 C 660 380 720 450 780 480" marker-end="url(#d124f-arrow-blue)" />

  <circle class="d124f-token-b" cx="576" cy="292" r="7" fill="#b45309" />
  <circle class="d124f-token-b" cx="576" cy="300" r="7" fill="#047857" />
  <circle class="d124f-token-b" cx="576" cy="308" r="7" fill="#1d4ed8" />

  <rect class="d124f-bucket d124f-bucket-left" x="780" y="70" width="260" height="96" rx="10" />
  <text class="d124f-label" x="800" y="98">left_only</text>
  <text class="d124f-mono" x="800" y="120">A</text>
  <text class="d124f-count" x="1000" y="152" text-anchor="end">n = 1</text>

  <rect class="d124f-bucket d124f-bucket-both" x="780" y="240" width="260" height="120" rx="10" />
  <text class="d124f-label" x="800" y="268">both</text>
  <text class="d124f-mono" x="800" y="290">B, C, D</text>
  <text class="d124f-count" x="1000" y="342" text-anchor="end">n = 3</text>

  <rect class="d124f-bucket d124f-bucket-right" x="780" y="432" width="260" height="96" rx="10" />
  <text class="d124f-label" x="800" y="460">right_only</text>
  <text class="d124f-mono" x="800" y="482">E</text>
  <text class="d124f-count" x="1000" y="514" text-anchor="end">n = 1</text>

  <text class="d124f-caption" x="24" y="558">1 (left_only) + 1 (right_only) + 3 (both) = 5 output rows -- the</text>
  <text class="d124f-caption" x="24" y="578">same total left_keys.merge(right_keys, how="outer") produces.</text>

  <!-- ===================== BOTTOM: DUPLICATED KEY ===================== -->
  <text class="d124f-stage" x="24" y="622">2. A DUPLICATED KEY MULTIPLIES</text>
  <text class="d124f-sub" x="24" y="640">the same cust_id twice on each side does not produce 2 matched rows -- it produces 4</text>

  <rect class="d124f-src" x="40" y="660" width="150" height="56" rx="8" />
  <text class="d124f-small" x="115" y="682" text-anchor="middle">left: A, A</text>
  <text class="d124f-mono" x="115" y="702" text-anchor="middle">(2 rows)</text>

  <rect class="d124f-src" x="230" y="660" width="150" height="56" rx="8" />
  <text class="d124f-small" x="305" y="682" text-anchor="middle">right: A, A</text>
  <text class="d124f-mono" x="305" y="702" text-anchor="middle">(2 rows)</text>

  <path class="d124f-wire d124f-wire-both" d="M 390 688 C 460 688 500 688 560 688" marker-end="url(#d124f-arrow-green)" />

  <circle class="d124f-dup d124f-dup1" cx="410" cy="678" r="7" fill="#047857" />
  <circle class="d124f-dup d124f-dup2" cx="410" cy="684" r="7" fill="#047857" />
  <circle class="d124f-dup d124f-dup3" cx="410" cy="692" r="7" fill="#047857" />
  <circle class="d124f-dup d124f-dup4" cx="410" cy="698" r="7" fill="#047857" />

  <rect class="d124f-bucket d124f-bucket-both" x="620" y="654" width="420" height="68" rx="10" />
  <text class="d124f-label" x="640" y="682">both, from one duplicated key</text>
  <text class="d124f-count" x="1020" y="705" text-anchor="end">4 rows</text>

  <text class="d124f-caption" x="24" y="742">2 left rows &#215; 2 right rows = 4 output rows -- the exact mechanism behind this lesson's opening explosion.</text>
</svg>
