<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Cost, memory, precision and correctness.">
  <title>Four consequences of the backward pass</title>
  <style>
    .backprop-implications-bg   { fill: #f8fafc; }
    .backprop-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backprop-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backprop-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backprop-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backprop-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backprop-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .backprop-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .backprop-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .backprop-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .backprop-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .backprop-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .backprop-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .backprop-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .backprop-implications-stage { opacity: 1; }

    .backprop-implications-s0 { animation-delay: 0.00s; }
    .backprop-implications-e0 { animation-delay: 0.00s; }
    .backprop-implications-s1 { animation-delay: 1.28s; }
    .backprop-implications-e1 { animation-delay: 1.28s; }
    .backprop-implications-s2 { animation-delay: 2.56s; }
    .backprop-implications-e2 { animation-delay: 2.56s; }
    .backprop-implications-s3 { animation-delay: 3.84s; }
    .backprop-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .backprop-implications-conn  { animation: backprop-implications-trace 6.4s ease-in-out infinite; }
      .backprop-implications-stage { animation: backprop-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes backprop-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes backprop-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .backprop-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .backprop-implications-stage { animation: backprop-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes backprop-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="backprop-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="backprop-implications-bg" width="980" height="322"/>
  <text class="backprop-implications-h1"  x="30" y="40">Four consequences of the backward pass</text>
  <text class="backprop-implications-sub" x="30" y="64">Cost, memory, precision and correctness.</text>
  <g class="backprop-implications-stage backprop-implications-s0">
    <rect class="backprop-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="backprop-implications-step" x="44" y="142">01</text>
    <text class="backprop-implications-name" x="70" y="142">Roughly twice a forward pass</text>
    <text class="backprop-implications-desc" x="44" y="166">Which is why a training step</text>
    <text class="backprop-implications-desc" x="44" y="182">costs about three forward</text>
    <text class="backprop-implications-desc" x="44" y="198">passes.</text>
    <text class="backprop-implications-edge" x="44" y="242">~2x</text>
  </g>
  <line class="backprop-implications-line backprop-implications-conn backprop-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#backprop-implications-tip)"/>
  <g class="backprop-implications-stage backprop-implications-s1">
    <rect class="backprop-implications-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="backprop-implications-step" x="280" y="142">02</text>
    <text class="backprop-implications-name" x="306" y="142">It consumes the activation cache</text>
    <text class="backprop-implications-desc" x="280" y="166">The memory the forward pass</text>
    <text class="backprop-implications-desc" x="280" y="182">spent is released as the sweep</text>
    <text class="backprop-implications-desc" x="280" y="198">proceeds.</text>
  </g>
  <line class="backprop-implications-line backprop-implications-conn backprop-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#backprop-implications-tip)"/>
  <g class="backprop-implications-stage backprop-implications-s2">
    <rect class="backprop-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="backprop-implications-step" x="516" y="142">03</text>
    <text class="backprop-implications-name" x="542" y="142">Precision matters more here</text>
    <text class="backprop-implications-desc" x="516" y="166">Gradients are small; half</text>
    <text class="backprop-implications-desc" x="516" y="182">precision needs loss scaling —</text>
    <text class="backprop-implications-desc" x="516" y="198">Day 233.</text>
  </g>
  <line class="backprop-implications-line backprop-implications-conn backprop-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#backprop-implications-tip)"/>
  <g class="backprop-implications-stage backprop-implications-s3">
    <rect class="backprop-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="backprop-implications-step" x="752" y="142">04</text>
    <text class="backprop-implications-name" x="778" y="142">Gradient checking is the correctness test</text>
    <text class="backprop-implications-desc" x="752" y="166">Finite differences on a tiny</text>
    <text class="backprop-implications-desc" x="752" y="182">network, compared against the</text>
    <text class="backprop-implications-desc" x="752" y="198">analytical result.</text>
  </g>
  <text class="backprop-implications-sub" x="30" y="304">The last is the only reliable way to know a hand-written backward pass is right: a wrong gradient still trains, just toward something other than the loss you specified.</text>
</svg>
