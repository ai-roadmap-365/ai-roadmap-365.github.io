<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="When you want the fix and not the branch.">
  <title>Taking one commit from another branch</title>
  <style>
    .cherry-pick-bg   { fill: #f8fafc; }
    .cherry-pick-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cherry-pick-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cherry-pick-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cherry-pick-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cherry-pick-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cherry-pick-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cherry-pick-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cherry-pick-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cherry-pick-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cherry-pick-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cherry-pick-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cherry-pick-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cherry-pick-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cherry-pick-stage { opacity: 1; }

    .cherry-pick-s0 { animation-delay: 0.00s; }
    .cherry-pick-e0 { animation-delay: 0.00s; }
    .cherry-pick-s1 { animation-delay: 1.28s; }
    .cherry-pick-e1 { animation-delay: 1.28s; }
    .cherry-pick-s2 { animation-delay: 2.56s; }
    .cherry-pick-e2 { animation-delay: 2.56s; }
    .cherry-pick-s3 { animation-delay: 3.84s; }
    .cherry-pick-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cherry-pick-conn  { animation: cherry-pick-trace 6.4s ease-in-out infinite; }
      .cherry-pick-stage { animation: cherry-pick-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cherry-pick-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cherry-pick-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cherry-pick-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cherry-pick-stage { animation: cherry-pick-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cherry-pick-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cherry-pick-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cherry-pick-bg" width="980" height="322"/>
  <text class="cherry-pick-h1"  x="30" y="40">Taking one commit from another branch</text>
  <text class="cherry-pick-sub" x="30" y="64">When you want the fix and not the branch.</text>
  <g class="cherry-pick-stage cherry-pick-s0">
    <rect class="cherry-pick-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cherry-pick-step" x="44" y="142">01</text>
    <text class="cherry-pick-name" x="70" y="142">A fix exists on another branch</text>
    <text class="cherry-pick-desc" x="44" y="166">Along with twenty commits you do</text>
    <text class="cherry-pick-desc" x="44" y="182">not want.</text>
  </g>
  <line class="cherry-pick-line cherry-pick-conn cherry-pick-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cherry-pick-tip)"/>
  <g class="cherry-pick-stage cherry-pick-s1">
    <rect class="cherry-pick-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cherry-pick-step" x="280" y="142">02</text>
    <text class="cherry-pick-name" x="306" y="142">git cherry-pick &lt;hash&gt;</text>
    <text class="cherry-pick-desc" x="280" y="166">Applies just that commit's</text>
    <text class="cherry-pick-desc" x="280" y="182">changes to your current branch.</text>
    <text class="cherry-pick-edge" x="280" y="242">one commit</text>
  </g>
  <line class="cherry-pick-line cherry-pick-conn cherry-pick-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cherry-pick-tip)"/>
  <g class="cherry-pick-stage cherry-pick-s2">
    <rect class="cherry-pick-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cherry-pick-step" x="516" y="142">03</text>
    <text class="cherry-pick-name" x="542" y="142">It creates a NEW commit</text>
    <text class="cherry-pick-desc" x="516" y="166">Same changes, different hash —</text>
    <text class="cherry-pick-desc" x="516" y="182">like a rebase, for one commit.</text>
    <text class="cherry-pick-edge" x="516" y="242">new hash</text>
  </g>
  <line class="cherry-pick-line cherry-pick-conn cherry-pick-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cherry-pick-tip)"/>
  <g class="cherry-pick-stage cherry-pick-s3">
    <rect class="cherry-pick-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cherry-pick-step" x="752" y="142">04</text>
    <text class="cherry-pick-name" x="778" y="142">So the change now exists twice</text>
    <text class="cherry-pick-desc" x="752" y="166">Which is fine, and which merging</text>
    <text class="cherry-pick-desc" x="752" y="182">the branches later will handle.</text>
    <text class="cherry-pick-edge" x="752" y="242">duplicated</text>
  </g>
  <text class="cherry-pick-sub" x="30" y="304">The classic use is a hotfix on a release branch: take the one commit into the supported version without dragging along everything else that has landed on main since.</text>
</svg>
