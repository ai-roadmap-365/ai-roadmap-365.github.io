<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>A retry decorator</title>
  <style>
    .retry-bg   { fill: #f8fafc; }
    .retry-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retry-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retry-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retry-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retry-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retry-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .retry-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .retry-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .retry-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .retry-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .retry-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .retry-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .retry-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .retry-stage { opacity: 1; }

    .retry-s0 { animation-delay: 0.00s; }
    .retry-e0 { animation-delay: 0.00s; }
    .retry-s1 { animation-delay: 1.28s; }
    .retry-e1 { animation-delay: 1.28s; }
    .retry-s2 { animation-delay: 2.56s; }
    .retry-e2 { animation-delay: 2.56s; }
    .retry-s3 { animation-delay: 3.84s; }
    .retry-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .retry-conn  { animation: retry-trace 6.4s ease-in-out infinite; }
      .retry-stage { animation: retry-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes retry-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes retry-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .retry-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .retry-stage { animation: retry-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes retry-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="retry-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="retry-bg" width="980" height="322"/>
  <text class="retry-h1"  x="30" y="40">A retry decorator</text>
  <text class="retry-sub" x="30" y="64">Four properties.</text>
  <g class="retry-stage retry-s0">
    <rect class="retry-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="retry-step" x="44" y="142">01</text>
    <text class="retry-name" x="70" y="142">Retry only the exceptions that are transient</text>
    <text class="retry-desc" x="44" y="166">Never a bad request or a bad</text>
    <text class="retry-desc" x="44" y="182">value.</text>
  </g>
  <line class="retry-line retry-conn retry-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#retry-tip)"/>
  <g class="retry-stage retry-s1">
    <rect class="retry-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="retry-step" x="280" y="142">02</text>
    <text class="retry-name" x="306" y="142">Wait longer after each attempt</text>
    <text class="retry-desc" x="280" y="166">So a struggling service is not</text>
    <text class="retry-desc" x="280" y="182">hammered.</text>
  </g>
  <line class="retry-line retry-conn retry-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#retry-tip)"/>
  <g class="retry-stage retry-s2">
    <rect class="retry-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="retry-step" x="516" y="142">03</text>
    <text class="retry-name" x="542" y="142">With randomness added to the delay</text>
    <text class="retry-desc" x="516" y="166">Or every client retries in</text>
    <text class="retry-desc" x="516" y="182">unison.</text>
  </g>
  <line class="retry-line retry-conn retry-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#retry-tip)"/>
  <g class="retry-stage retry-s3">
    <rect class="retry-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="retry-step" x="752" y="142">04</text>
    <text class="retry-name" x="778" y="142">And a hard limit on attempts</text>
    <text class="retry-desc" x="752" y="166">After which the exception</text>
    <text class="retry-desc" x="752" y="182">propagates.</text>
  </g>
  <text class="retry-sub" x="30" y="304">Retrying a non-transient exception is the mistake that turns one failure into a delayed failure, and it is why the exception type matters more than the count.</text>
</svg>
