<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One at a time, in order.">
  <title>Items along a line</title>
  <style>
    .production-line-bg   { fill: #f8fafc; }
    .production-line-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .production-line-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .production-line-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .production-line-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .production-line-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .production-line-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .production-line-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .production-line-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .production-line-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .production-line-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .production-line-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .production-line-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .production-line-row { opacity: 1; }
    .production-line-r0 { animation-delay: 0.00s; }
    .production-line-r1 { animation-delay: 0.45s; }
    .production-line-r2 { animation-delay: 0.90s; }
    .production-line-r3 { animation-delay: 1.35s; }
    .production-line-r4 { animation-delay: 1.80s; }
    .production-line-row { animation: production-line-reveal 7.3s ease-in-out infinite; }
    @keyframes production-line-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="production-line-bg" width="980" height="390"/>
  <text class="production-line-h1"  x="30" y="40">Items along a line</text>
  <text class="production-line-sub" x="30" y="64">One at a time, in order.</text>
  <rect class="production-line-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="production-line-name" x="46" y="122">One at a time</text>
  <text class="production-line-desc" x="46" y="142">Sequential.</text>
  <text class="production-line-desc production-line-row production-line-r0" x="46" y="182">Each item handled in turn</text>
  <text class="production-line-desc production-line-row production-line-r1" x="46" y="216">Order is preserved</text>
  <text class="production-line-desc production-line-row production-line-r2" x="46" y="250">Different logic per item is possible</text>
  <text class="production-line-desc production-line-row production-line-r3" x="46" y="284">Slow when the logic is uniform</text>
  <text class="production-line-desc production-line-row production-line-r4" x="46" y="318">This is a loop</text>
  <rect class="production-line-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="production-line-name" x="526" y="122">All at once</text>
  <text class="production-line-desc" x="526" y="142">Bulk.</text>
  <text class="production-line-desc production-line-row production-line-r0" x="526" y="182">The whole collection handled together</text>
  <text class="production-line-desc production-line-row production-line-r1" x="526" y="216">Order preserved, no explicit stepping</text>
  <text class="production-line-desc production-line-row production-line-r2" x="526" y="250">The same logic for every item</text>
  <text class="production-line-desc production-line-row production-line-r3" x="526" y="284">Far faster when the logic is uniform</text>
  <text class="production-line-desc production-line-row production-line-r4" x="526" y="318">This is a vectorised operation</text>
  <text class="production-line-sub" x="30" y="372">The uniformity of the logic is what decides which is appropriate, and numerical work is nearly always uniform — which is why loops there are a mistake.</text>
</svg>
