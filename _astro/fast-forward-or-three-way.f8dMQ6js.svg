<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The question is whether the target moved.">
  <title>Two kinds of merge, and Git picks</title>
  <style>
    .fast-forward-or-three-way-bg   { fill: #f8fafc; }
    .fast-forward-or-three-way-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fast-forward-or-three-way-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fast-forward-or-three-way-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fast-forward-or-three-way-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fast-forward-or-three-way-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fast-forward-or-three-way-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fast-forward-or-three-way-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fast-forward-or-three-way-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fast-forward-or-three-way-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fast-forward-or-three-way-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fast-forward-or-three-way-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fast-forward-or-three-way-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fast-forward-or-three-way-row { opacity: 1; }
    .fast-forward-or-three-way-r0 { animation-delay: 0.00s; }
    .fast-forward-or-three-way-r1 { animation-delay: 0.45s; }
    .fast-forward-or-three-way-r2 { animation-delay: 0.90s; }
    .fast-forward-or-three-way-r3 { animation-delay: 1.35s; }
    .fast-forward-or-three-way-r4 { animation-delay: 1.80s; }
    .fast-forward-or-three-way-row { animation: fast-forward-or-three-way-reveal 7.3s ease-in-out infinite; }
    @keyframes fast-forward-or-three-way-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="fast-forward-or-three-way-bg" width="980" height="390"/>
  <text class="fast-forward-or-three-way-h1"  x="30" y="40">Two kinds of merge, and Git picks</text>
  <text class="fast-forward-or-three-way-sub" x="30" y="64">The question is whether the target moved.</text>
  <rect class="fast-forward-or-three-way-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="fast-forward-or-three-way-name" x="46" y="122">Fast-forward</text>
  <text class="fast-forward-or-three-way-desc" x="46" y="142">The target did not move.</text>
  <text class="fast-forward-or-three-way-desc fast-forward-or-three-way-row fast-forward-or-three-way-r0" x="46" y="182">Nothing to combine</text>
  <text class="fast-forward-or-three-way-desc fast-forward-or-three-way-row fast-forward-or-three-way-r1" x="46" y="216">Git just slides the pointer forward</text>
  <text class="fast-forward-or-three-way-desc fast-forward-or-three-way-row fast-forward-or-three-way-r2" x="46" y="250">No merge commit is created</text>
  <text class="fast-forward-or-three-way-desc fast-forward-or-three-way-row fast-forward-or-three-way-r3" x="46" y="284">History stays a straight line</text>
  <text class="fast-forward-or-three-way-desc fast-forward-or-three-way-row fast-forward-or-three-way-r4" x="46" y="318">Common for short branches</text>
  <rect class="fast-forward-or-three-way-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="fast-forward-or-three-way-name" x="526" y="122">Three-way</text>
  <text class="fast-forward-or-three-way-desc" x="526" y="142">Both branches advanced.</text>
  <text class="fast-forward-or-three-way-desc fast-forward-or-three-way-row fast-forward-or-three-way-r0" x="526" y="182">Merge base plus two branch tips</text>
  <text class="fast-forward-or-three-way-desc fast-forward-or-three-way-row fast-forward-or-three-way-r1" x="526" y="216">Git works out what each side changed</text>
  <text class="fast-forward-or-three-way-desc fast-forward-or-three-way-row fast-forward-or-three-way-r2" x="526" y="250">A merge commit with TWO parents</text>
  <text class="fast-forward-or-three-way-desc fast-forward-or-three-way-row fast-forward-or-three-way-r3" x="526" y="284">History shows a diamond</text>
  <text class="fast-forward-or-three-way-desc fast-forward-or-three-way-row fast-forward-or-three-way-r4" x="526" y="318">Usually automatic and silent</text>
  <text class="fast-forward-or-three-way-sub" x="30" y="372">You do not choose between them. Git determines which applies from the shape of the history, and the two-parent commit is how you tell afterwards which one happened.</text>
</svg>
