<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="No single best model.">
  <title>Sweeps and the frontier</title>
  <style>
    .sweeps-bg   { fill: #f8fafc; }
    .sweeps-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sweeps-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sweeps-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sweeps-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sweeps-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sweeps-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sweeps-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sweeps-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sweeps-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sweeps-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sweeps-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sweeps-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .sweeps-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .sweeps-stage { opacity: 1; }

    .sweeps-s0 { animation-delay: 0.00s; }
    .sweeps-e0 { animation-delay: 0.00s; }
    .sweeps-s1 { animation-delay: 1.28s; }
    .sweeps-e1 { animation-delay: 1.28s; }
    .sweeps-s2 { animation-delay: 2.56s; }
    .sweeps-e2 { animation-delay: 2.56s; }
    .sweeps-s3 { animation-delay: 3.84s; }
    .sweeps-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .sweeps-conn  { animation: sweeps-trace 6.4s ease-in-out infinite; }
      .sweeps-stage { animation: sweeps-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes sweeps-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes sweeps-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .sweeps-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .sweeps-stage { animation: sweeps-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes sweeps-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="sweeps-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="sweeps-bg" width="980" height="322"/>
  <text class="sweeps-h1"  x="30" y="40">Sweeps and the frontier</text>
  <text class="sweeps-sub" x="30" y="64">No single best model.</text>
  <g class="sweeps-stage sweeps-s0">
    <rect class="sweeps-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="sweeps-step" x="44" y="142">01</text>
    <text class="sweeps-name" x="70" y="142">Define the search space</text>
    <text class="sweeps-desc" x="44" y="166">Ranges, not single values, for</text>
    <text class="sweeps-desc" x="44" y="182">each hyperparameter.</text>
  </g>
  <line class="sweeps-line sweeps-conn sweeps-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#sweeps-tip)"/>
  <g class="sweeps-stage sweeps-s1">
    <rect class="sweeps-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="sweeps-step" x="280" y="142">02</text>
    <text class="sweeps-name" x="306" y="142">Run many configurations</text>
    <text class="sweeps-desc" x="280" y="166">Independently, in parallel.</text>
    <text class="sweeps-desc" x="280" y="182">Embarrassingly so.</text>
  </g>
  <line class="sweeps-line sweeps-conn sweeps-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#sweeps-tip)"/>
  <g class="sweeps-stage sweeps-s2">
    <rect class="sweeps-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="sweeps-step" x="516" y="142">03</text>
    <text class="sweeps-name" x="542" y="142">Plot accuracy against cost and latency</text>
    <text class="sweeps-desc" x="516" y="166">Most runs are dominated. A few</text>
    <text class="sweeps-desc" x="516" y="182">are not.</text>
  </g>
  <line class="sweeps-line sweeps-conn sweeps-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#sweeps-tip)"/>
  <g class="sweeps-stage sweeps-s3">
    <rect class="sweeps-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="sweeps-step" x="752" y="142">04</text>
    <text class="sweeps-name" x="778" y="142">Choose from the frontier</text>
    <text class="sweeps-desc" x="752" y="166">Which is a product decision, not</text>
    <text class="sweeps-desc" x="752" y="182">a technical one.</text>
    <text class="sweeps-edge" x="752" y="242">trade-off</text>
  </g>
  <text class="sweeps-sub" x="30" y="304">Framing selection as a frontier rather than a maximum is what stops teams shipping a model that is half a point better and four times more expensive to serve.</text>
</svg>
