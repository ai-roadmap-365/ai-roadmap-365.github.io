<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A state machine over tokens.">
  <title>How constrained decoding works</title>
  <style>
    .fsm-masking-bg   { fill: #f8fafc; }
    .fsm-masking-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fsm-masking-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fsm-masking-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fsm-masking-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fsm-masking-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fsm-masking-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fsm-masking-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fsm-masking-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fsm-masking-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fsm-masking-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fsm-masking-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fsm-masking-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .fsm-masking-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .fsm-masking-stage { opacity: 1; }

    .fsm-masking-s0 { animation-delay: 0.00s; }
    .fsm-masking-e0 { animation-delay: 0.00s; }
    .fsm-masking-s1 { animation-delay: 1.28s; }
    .fsm-masking-e1 { animation-delay: 1.28s; }
    .fsm-masking-s2 { animation-delay: 2.56s; }
    .fsm-masking-e2 { animation-delay: 2.56s; }
    .fsm-masking-s3 { animation-delay: 3.84s; }
    .fsm-masking-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .fsm-masking-conn  { animation: fsm-masking-trace 6.4s ease-in-out infinite; }
      .fsm-masking-stage { animation: fsm-masking-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes fsm-masking-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes fsm-masking-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .fsm-masking-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .fsm-masking-stage { animation: fsm-masking-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes fsm-masking-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="fsm-masking-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="fsm-masking-bg" width="980" height="322"/>
  <text class="fsm-masking-h1"  x="30" y="40">How constrained decoding works</text>
  <text class="fsm-masking-sub" x="30" y="64">A state machine over tokens.</text>
  <g class="fsm-masking-stage fsm-masking-s0">
    <rect class="fsm-masking-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="fsm-masking-step" x="44" y="142">01</text>
    <text class="fsm-masking-name" x="70" y="142">Compile the schema into a state machine</text>
    <text class="fsm-masking-desc" x="44" y="166">Which knows what may come next</text>
    <text class="fsm-masking-desc" x="44" y="182">at every point.</text>
  </g>
  <line class="fsm-masking-line fsm-masking-conn fsm-masking-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#fsm-masking-tip)"/>
  <g class="fsm-masking-stage fsm-masking-s1">
    <rect class="fsm-masking-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="fsm-masking-step" x="280" y="142">02</text>
    <text class="fsm-masking-name" x="306" y="142">At each step, ask which tokens are legal</text>
    <text class="fsm-masking-desc" x="280" y="166">Given the state the output is</text>
    <text class="fsm-masking-desc" x="280" y="182">currently in.</text>
  </g>
  <line class="fsm-masking-line fsm-masking-conn fsm-masking-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#fsm-masking-tip)"/>
  <g class="fsm-masking-stage fsm-masking-s2">
    <rect class="fsm-masking-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="fsm-masking-step" x="516" y="142">03</text>
    <text class="fsm-masking-name" x="542" y="142">Set every other token's score to negative infinity</text>
    <text class="fsm-masking-desc" x="516" y="166">So it cannot be sampled at all.</text>
  </g>
  <line class="fsm-masking-line fsm-masking-conn fsm-masking-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#fsm-masking-tip)"/>
  <g class="fsm-masking-stage fsm-masking-s3">
    <rect class="fsm-masking-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="fsm-masking-step" x="752" y="142">04</text>
    <text class="fsm-masking-name" x="778" y="142">Then sample from what remains</text>
    <text class="fsm-masking-desc" x="752" y="166">The result is valid by</text>
    <text class="fsm-masking-desc" x="752" y="182">construction.</text>
    <text class="fsm-masking-edge" x="752" y="242">guaranteed</text>
  </g>
  <text class="fsm-masking-sub" x="30" y="304">This is a hard guarantee rather than a strong tendency, which is the property that matters: the parser downstream can drop its error path entirely.</text>
</svg>
