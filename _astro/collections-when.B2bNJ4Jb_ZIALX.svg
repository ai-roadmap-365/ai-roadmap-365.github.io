<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the access pattern.">
  <title>Which collection when</title>
  <style>
    .collections-when-bg   { fill: #f8fafc; }
    .collections-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collections-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collections-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collections-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collections-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collections-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .collections-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .collections-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .collections-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .collections-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .collections-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .collections-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .collections-when-row { opacity: 1; }
    .collections-when-r0 { animation-delay: 0.00s; }
    .collections-when-r1 { animation-delay: 0.45s; }
    .collections-when-r2 { animation-delay: 0.90s; }
    .collections-when-r3 { animation-delay: 1.35s; }
    .collections-when-r4 { animation-delay: 1.80s; }
    .collections-when-row { animation: collections-when-reveal 7.3s ease-in-out infinite; }
    @keyframes collections-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="collections-when-bg" width="980" height="390"/>
  <text class="collections-when-h1"  x="30" y="40">Which collection when</text>
  <text class="collections-when-sub" x="30" y="64">By the access pattern.</text>
  <rect class="collections-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="collections-when-name" x="46" y="122">The access pattern</text>
  <text class="collections-when-desc" x="46" y="142">What you do with it.</text>
  <text class="collections-when-desc collections-when-row collections-when-r0" x="46" y="182">Iterate in order, append often</text>
  <text class="collections-when-desc collections-when-row collections-when-r1" x="46" y="216">Look up by a meaningful key</text>
  <text class="collections-when-desc collections-when-row collections-when-r2" x="46" y="250">Test membership repeatedly</text>
  <text class="collections-when-desc collections-when-row collections-when-r3" x="46" y="284">Fixed record, known fields</text>
  <text class="collections-when-desc collections-when-row collections-when-r4" x="46" y="318">Needs to be a dictionary key</text>
  <rect class="collections-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="collections-when-name" x="526" y="122">The collection</text>
  <text class="collections-when-desc" x="526" y="142">What to use.</text>
  <text class="collections-when-desc collections-when-row collections-when-r0" x="526" y="182">A list</text>
  <text class="collections-when-desc collections-when-row collections-when-r1" x="526" y="216">A dictionary</text>
  <text class="collections-when-desc collections-when-row collections-when-r2" x="526" y="250">A set</text>
  <text class="collections-when-desc collections-when-row collections-when-r3" x="526" y="284">A dataclass, or a named tuple</text>
  <text class="collections-when-desc collections-when-row collections-when-r4" x="526" y="318">A tuple or a frozenset</text>
  <text class="collections-when-sub" x="30" y="372">Naming the access pattern first, before choosing the container, is what makes this a decision rather than a habit.</text>
</svg>
