<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward the protocol.">
  <title>Four steps in iteration</title>
  <style>
    .loop-history-bg   { fill: #f8fafc; }
    .loop-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .loop-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .loop-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .loop-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .loop-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .loop-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .loop-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .loop-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .loop-history-stage { opacity: 1; }

    .loop-history-s0 { animation-delay: 0.00s; }
    .loop-history-e0 { animation-delay: 0.00s; }
    .loop-history-s1 { animation-delay: 1.28s; }
    .loop-history-e1 { animation-delay: 1.28s; }
    .loop-history-s2 { animation-delay: 2.56s; }
    .loop-history-e2 { animation-delay: 2.56s; }
    .loop-history-s3 { animation-delay: 3.84s; }
    .loop-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .loop-history-conn  { animation: loop-history-trace 6.4s ease-in-out infinite; }
      .loop-history-stage { animation: loop-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes loop-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes loop-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .loop-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .loop-history-stage { animation: loop-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes loop-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="loop-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="loop-history-bg" width="980" height="322"/>
  <text class="loop-history-h1"  x="30" y="40">Four steps in iteration</text>
  <text class="loop-history-sub" x="30" y="64">Toward the protocol.</text>
  <g class="loop-history-stage loop-history-s0">
    <rect class="loop-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="loop-history-step" x="44" y="142">01</text>
    <text class="loop-history-name" x="70" y="142">Counted loops with an explicit index</text>
    <text class="loop-history-desc" x="44" y="166">Which is where off-by-one errors</text>
    <text class="loop-history-desc" x="44" y="182">come from.</text>
  </g>
  <line class="loop-history-line loop-history-conn loop-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#loop-history-tip)"/>
  <g class="loop-history-stage loop-history-s1">
    <rect class="loop-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="loop-history-step" x="280" y="142">02</text>
    <text class="loop-history-name" x="306" y="142">Then iteration over a collection directly</text>
    <text class="loop-history-desc" x="280" y="166">No index to get wrong.</text>
  </g>
  <line class="loop-history-line loop-history-conn loop-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#loop-history-tip)"/>
  <g class="loop-history-stage loop-history-s2">
    <rect class="loop-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="loop-history-step" x="516" y="142">03</text>
    <text class="loop-history-name" x="542" y="142">Formalised as a protocol any object can implement</text>
    <text class="loop-history-desc" x="516" y="166">Which decoupled looping from</text>
    <text class="loop-history-desc" x="516" y="182">collections.</text>
  </g>
  <line class="loop-history-line loop-history-conn loop-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#loop-history-tip)"/>
  <g class="loop-history-stage loop-history-s3">
    <rect class="loop-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="loop-history-step" x="752" y="142">04</text>
    <text class="loop-history-name" x="778" y="142">And generators made it lazy</text>
    <text class="loop-history-desc" x="752" y="166">So sequences larger than memory</text>
    <text class="loop-history-desc" x="752" y="182">became iterable.</text>
  </g>
  <text class="loop-history-sub" x="30" y="304">Decoupling iteration from collections is what allows a file, a network stream and a training batch loader to all be looped over identically.</text>
</svg>
