<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Distance that accounts for the data</title>
  <style>
    .mahalanobis-bg   { fill: #f8fafc; }
    .mahalanobis-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mahalanobis-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mahalanobis-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mahalanobis-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mahalanobis-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mahalanobis-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mahalanobis-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mahalanobis-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mahalanobis-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mahalanobis-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mahalanobis-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mahalanobis-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .mahalanobis-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .mahalanobis-stage { opacity: 1; }

    .mahalanobis-s0 { animation-delay: 0.00s; }
    .mahalanobis-e0 { animation-delay: 0.00s; }
    .mahalanobis-s1 { animation-delay: 1.28s; }
    .mahalanobis-e1 { animation-delay: 1.28s; }
    .mahalanobis-s2 { animation-delay: 2.56s; }
    .mahalanobis-e2 { animation-delay: 2.56s; }
    .mahalanobis-s3 { animation-delay: 3.84s; }
    .mahalanobis-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .mahalanobis-conn  { animation: mahalanobis-trace 6.4s ease-in-out infinite; }
      .mahalanobis-stage { animation: mahalanobis-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes mahalanobis-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes mahalanobis-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .mahalanobis-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .mahalanobis-stage { animation: mahalanobis-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes mahalanobis-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="mahalanobis-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="mahalanobis-bg" width="980" height="322"/>
  <text class="mahalanobis-h1"  x="30" y="40">Distance that accounts for the data</text>
  <text class="mahalanobis-sub" x="30" y="64">Four steps.</text>
  <g class="mahalanobis-stage mahalanobis-s0">
    <rect class="mahalanobis-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="mahalanobis-step" x="44" y="142">01</text>
    <text class="mahalanobis-name" x="70" y="142">Straight-line distance treats every direction alike</text>
    <text class="mahalanobis-desc" x="44" y="166">Even where the data spreads far</text>
    <text class="mahalanobis-desc" x="44" y="182">more in one.</text>
  </g>
  <line class="mahalanobis-line mahalanobis-conn mahalanobis-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#mahalanobis-tip)"/>
  <g class="mahalanobis-stage mahalanobis-s1">
    <rect class="mahalanobis-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="mahalanobis-step" x="280" y="142">02</text>
    <text class="mahalanobis-name" x="306" y="142">So compute the data's covariance</text>
    <text class="mahalanobis-desc" x="280" y="166">Which records the spread and the</text>
    <text class="mahalanobis-desc" x="280" y="182">correlations.</text>
  </g>
  <line class="mahalanobis-line mahalanobis-conn mahalanobis-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#mahalanobis-tip)"/>
  <g class="mahalanobis-stage mahalanobis-s2">
    <rect class="mahalanobis-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="mahalanobis-step" x="516" y="142">03</text>
    <text class="mahalanobis-name" x="542" y="142">And measure distance after undoing it</text>
    <text class="mahalanobis-desc" x="516" y="166">Scaling each direction by its</text>
    <text class="mahalanobis-desc" x="516" y="182">own variability.</text>
  </g>
  <line class="mahalanobis-line mahalanobis-conn mahalanobis-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#mahalanobis-tip)"/>
  <g class="mahalanobis-stage mahalanobis-s3">
    <rect class="mahalanobis-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="mahalanobis-step" x="752" y="142">04</text>
    <text class="mahalanobis-name" x="778" y="142">So a point unusual for this data is far</text>
    <text class="mahalanobis-desc" x="752" y="166">Rather than one far in raw</text>
    <text class="mahalanobis-desc" x="752" y="182">units.</text>
  </g>
  <text class="mahalanobis-sub" x="30" y="304">This is the right notion of distance for outlier detection, because it asks how surprising a point is rather than how far away it is in arbitrary units.</text>
</svg>
