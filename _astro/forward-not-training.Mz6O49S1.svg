<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And not a recurrent loop.">
  <title>A forward pass is not training</title>
  <style>
    .forward-not-training-bg   { fill: #f8fafc; }
    .forward-not-training-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forward-not-training-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forward-not-training-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forward-not-training-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forward-not-training-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forward-not-training-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .forward-not-training-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .forward-not-training-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .forward-not-training-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .forward-not-training-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .forward-not-training-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .forward-not-training-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .forward-not-training-row { opacity: 1; }
    .forward-not-training-r0 { animation-delay: 0.00s; }
    .forward-not-training-r1 { animation-delay: 0.45s; }
    .forward-not-training-r2 { animation-delay: 0.90s; }
    .forward-not-training-r3 { animation-delay: 1.35s; }
    .forward-not-training-r4 { animation-delay: 1.80s; }
    .forward-not-training-row { animation: forward-not-training-reveal 7.3s ease-in-out infinite; }
    @keyframes forward-not-training-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="forward-not-training-bg" width="980" height="390"/>
  <text class="forward-not-training-h1"  x="30" y="40">A forward pass is not training</text>
  <text class="forward-not-training-sub" x="30" y="64">And not a recurrent loop.</text>
  <rect class="forward-not-training-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="forward-not-training-name" x="46" y="122">What it does</text>
  <text class="forward-not-training-desc" x="46" y="142">Computes.</text>
  <text class="forward-not-training-desc forward-not-training-row forward-not-training-r0" x="46" y="182">A deterministic composite function</text>
  <text class="forward-not-training-desc forward-not-training-row forward-not-training-r1" x="46" y="216">Vectorised across a batch</text>
  <text class="forward-not-training-desc forward-not-training-row forward-not-training-r2" x="46" y="250">Caches intermediates for later</text>
  <text class="forward-not-training-desc forward-not-training-row forward-not-training-r3" x="46" y="284">Produces predictions and a loss</text>
  <text class="forward-not-training-desc forward-not-training-row forward-not-training-r4" x="46" y="318">Identical at training and inference</text>
  <rect class="forward-not-training-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="forward-not-training-name" x="526" y="122">What it does not</text>
  <text class="forward-not-training-desc" x="526" y="142">Two confusions.</text>
  <text class="forward-not-training-desc forward-not-training-row forward-not-training-r0" x="526" y="182">Does not update any weight</text>
  <text class="forward-not-training-desc forward-not-training-row forward-not-training-r1" x="526" y="216">That is backpropagation and an optimiser</text>
  <text class="forward-not-training-desc forward-not-training-row forward-not-training-r2" x="526" y="250">Does not loop back on itself</text>
  <text class="forward-not-training-desc forward-not-training-row forward-not-training-r3" x="526" y="284">Activations flow strictly forward</text>
  <text class="forward-not-training-desc forward-not-training-row forward-not-training-r4" x="526" y="318">Recurrence is a different architecture</text>
  <text class="forward-not-training-sub" x="30" y="372">Keeping these separate matters when debugging: a network that predicts badly may have a forward pass bug or a training bug, and they are found in entirely different ways.</text>
</svg>
