<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are risks.">
  <title>Four consequences of logging</title>
  <style>
    .logging-implications-bg   { fill: #f8fafc; }
    .logging-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .logging-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .logging-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .logging-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .logging-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .logging-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .logging-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .logging-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .logging-implications-stage { opacity: 1; }

    .logging-implications-s0 { animation-delay: 0.00s; }
    .logging-implications-e0 { animation-delay: 0.00s; }
    .logging-implications-s1 { animation-delay: 1.28s; }
    .logging-implications-e1 { animation-delay: 1.28s; }
    .logging-implications-s2 { animation-delay: 2.56s; }
    .logging-implications-e2 { animation-delay: 2.56s; }
    .logging-implications-s3 { animation-delay: 3.84s; }
    .logging-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .logging-implications-conn  { animation: logging-implications-trace 6.4s ease-in-out infinite; }
      .logging-implications-stage { animation: logging-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes logging-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes logging-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .logging-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .logging-implications-stage { animation: logging-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes logging-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="logging-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="logging-implications-bg" width="980" height="322"/>
  <text class="logging-implications-h1"  x="30" y="40">Four consequences of logging</text>
  <text class="logging-implications-sub" x="30" y="64">Two are risks.</text>
  <g class="logging-implications-stage logging-implications-s0">
    <rect class="logging-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="logging-implications-step" x="44" y="142">01</text>
    <text class="logging-implications-name" x="70" y="142">Problems can be diagnosed after the fact</text>
    <text class="logging-implications-desc" x="44" y="166">Which is the entire purpose.</text>
  </g>
  <line class="logging-implications-line logging-implications-conn logging-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#logging-implications-tip)"/>
  <g class="logging-implications-stage logging-implications-s1">
    <rect class="logging-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="logging-implications-step" x="280" y="142">02</text>
    <text class="logging-implications-name" x="306" y="142">But anything logged is stored and readable</text>
    <text class="logging-implications-desc" x="280" y="166">So never log secrets or personal</text>
    <text class="logging-implications-desc" x="280" y="182">data.</text>
  </g>
  <line class="logging-implications-line logging-implications-conn logging-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#logging-implications-tip)"/>
  <g class="logging-implications-stage logging-implications-s2">
    <rect class="logging-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="logging-implications-step" x="516" y="142">03</text>
    <text class="logging-implications-name" x="542" y="142">And log volume costs real money at scale</text>
    <text class="logging-implications-desc" x="516" y="166">Storage, transfer, indexing.</text>
  </g>
  <line class="logging-implications-line logging-implications-conn logging-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#logging-implications-tip)"/>
  <g class="logging-implications-stage logging-implications-s3">
    <rect class="logging-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="logging-implications-step" x="752" y="142">04</text>
    <text class="logging-implications-name" x="778" y="142">While logging in a hot loop costs time</text>
    <text class="logging-implications-desc" x="752" y="166">Guard it with a level check.</text>
  </g>
  <text class="logging-implications-sub" x="30" y="304">The privacy point is a genuine compliance matter and not merely tidiness, because logs are frequently retained longer than the records they describe.</text>
</svg>
