<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four rules.">
  <title>Structuring the steps</title>
  <style>
    .pipe-how-bg   { fill: #f8fafc; }
    .pipe-how-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipe-how-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipe-how-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipe-how-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipe-how-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipe-how-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pipe-how-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pipe-how-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pipe-how-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pipe-how-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pipe-how-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pipe-how-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pipe-how-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pipe-how-stage { opacity: 1; }

    .pipe-how-s0 { animation-delay: 0.00s; }
    .pipe-how-e0 { animation-delay: 0.00s; }
    .pipe-how-s1 { animation-delay: 1.28s; }
    .pipe-how-e1 { animation-delay: 1.28s; }
    .pipe-how-s2 { animation-delay: 2.56s; }
    .pipe-how-e2 { animation-delay: 2.56s; }
    .pipe-how-s3 { animation-delay: 3.84s; }
    .pipe-how-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .pipe-how-conn  { animation: pipe-how-trace 6.4s ease-in-out infinite; }
      .pipe-how-stage { animation: pipe-how-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes pipe-how-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pipe-how-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pipe-how-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pipe-how-stage { animation: pipe-how-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pipe-how-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pipe-how-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pipe-how-bg" width="980" height="322"/>
  <text class="pipe-how-h1"  x="30" y="40">Structuring the steps</text>
  <text class="pipe-how-sub" x="30" y="64">Four rules.</text>
  <g class="pipe-how-stage pipe-how-s0">
    <rect class="pipe-how-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="pipe-how-step" x="44" y="142">01</text>
    <text class="pipe-how-name" x="70" y="142">Each step a function: frame in, frame out</text>
    <text class="pipe-how-desc" x="44" y="166">With no hidden state.</text>
  </g>
  <line class="pipe-how-line pipe-how-conn pipe-how-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#pipe-how-tip)"/>
  <g class="pipe-how-stage pipe-how-s1">
    <rect class="pipe-how-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="pipe-how-step" x="280" y="142">02</text>
    <text class="pipe-how-name" x="306" y="142">One concern per step, named for what it does</text>
    <text class="pipe-how-desc" x="280" y="166">So the sequence reads as a</text>
    <text class="pipe-how-desc" x="280" y="182">description.</text>
  </g>
  <line class="pipe-how-line pipe-how-conn pipe-how-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#pipe-how-tip)"/>
  <g class="pipe-how-stage pipe-how-s2">
    <rect class="pipe-how-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="pipe-how-step" x="516" y="142">03</text>
    <text class="pipe-how-name" x="542" y="142">Row counts logged at every boundary</text>
    <text class="pipe-how-desc" x="516" y="166">So silent drops are visible.</text>
  </g>
  <line class="pipe-how-line pipe-how-conn pipe-how-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#pipe-how-tip)"/>
  <g class="pipe-how-stage pipe-how-s3">
    <rect class="pipe-how-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="pipe-how-step" x="752" y="142">04</text>
    <text class="pipe-how-name" x="778" y="142">And assertions stating what must hold afterwards</text>
    <text class="pipe-how-desc" x="752" y="166">Which fail loudly when the data</text>
    <text class="pipe-how-desc" x="752" y="182">changes.</text>
  </g>
  <text class="pipe-how-sub" x="30" y="304">Assertions are what turn a cleaning script into a quality gate: a source that changes shape stops the run instead of quietly producing different numbers.</text>
</svg>
