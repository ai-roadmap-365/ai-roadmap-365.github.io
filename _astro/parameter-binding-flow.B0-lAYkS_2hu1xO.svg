<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" width="1280" height="920" role="img" aria-labelledby="d090f-title d090f-desc">
  <title id="d090f-title">One crafted input, two paths: concatenated it reaches the parser as code, bound it stops at the boundary and arrives as a value</title>
  <desc id="d090f-desc">An animated diagram with two lanes carrying the same input, the text Ada apostrophe space OR space quote one quote equals quote one. In the upper lane the value is concatenated into the SQL string, so the statement the parser receives becomes SELECT name, email, pin FROM members WHERE name equals quote Ada quote OR quote one quote equals quote one quote — the apostrophe inside the value closed the string early and the rest became code, the WHERE clause is now true for every row, and three private rows are returned. In the lower lane the same value is passed as a second argument to execute, a dashed boundary stops it, the parser compiles only the statement containing a question-mark placeholder, and the value travels a separate lower track and is bound to the already-compiled statement, so it is compared as ordinary text and no member matches: zero rows. Every label, statement and result is present whether or not the picture is moving.</desc>

  <style>
    .d090f-bg      { fill: #f8fafc; }
    .d090f-title   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 23px; font-weight: 600; fill: #1a202c; }
    .d090f-lede    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #334155; }
    .d090f-lane    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 600; fill: #1a202c; }
    .d090f-label   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 600; fill: #1a202c; }
    .d090f-sub     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d090f-mono    { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; fill: #1a202c; }
    .d090f-monosm  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #334155; }
    .d090f-box     { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d090f-bad     { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; }
    .d090f-good    { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .d090f-badtext { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; fill: #b91c1c; }
    .d090f-goodtext{ font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; fill: #047857; }
    .d090f-wall    { fill: none; stroke: #047857; stroke-width: 3; stroke-dasharray: 9 6; }
    .d090f-caretbad { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                      font-size: 15px; font-weight: 600; fill: #b91c1c; }
    .d090f-caretgood{ font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                      font-size: 15px; font-weight: 600; fill: #047857; }

    /* Motion 3 — the stages of each lane light up in order.
       The resting fill is the readable state. */
    .d090f-stage   { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5;
                     animation: d090f-lift 8s ease-in-out infinite; }
    .d090f-a1 { animation-delay: 0.0s; }
    .d090f-a2 { animation-delay: 0.9s; }
    .d090f-a3 { animation-delay: 1.8s; }
    .d090f-b1 { animation-delay: 4.0s; }
    .d090f-b2 { animation-delay: 4.9s; }
    .d090f-b3 { animation-delay: 5.8s; }
    @keyframes d090f-lift {
      0%, 16%, 100% { fill: #e0e7ff; }
      5%, 11%       { fill: #bfdbfe; }
    }

    /* Motion 2 — flowing connections. Reduced motion makes them solid. */
    .d090f-wire    { fill: none; stroke: #1d4ed8; stroke-width: 2.5;
                     stroke-dasharray: 10 8; animation: d090f-march 1.8s linear infinite; }
    .d090f-wirered { fill: none; stroke: #b91c1c; stroke-width: 2.5;
                     stroke-dasharray: 10 8; animation: d090f-march 1.8s linear infinite; }
    .d090f-wireval { fill: none; stroke: #b45309; stroke-width: 2.5;
                     stroke-dasharray: 9 7; animation: d090f-march 2.2s linear infinite; }
    @keyframes d090f-march { to { stroke-dashoffset: -18; } }

    /* Motion 1 — tokens travelling, each resting visible at its start. */
    .d090f-tokena  { fill: #b91c1c; animation: d090f-travela 8s ease-in-out infinite; }
    .d090f-labela  { fill: #b91c1c; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                     font-size: 13px; animation: d090f-travela 8s ease-in-out infinite; }
    @keyframes d090f-travela {
      0%, 4%    { transform: translateX(0);     opacity: 1; }
      44%, 100% { transform: translateX(742px); opacity: 1; }
    }

    .d090f-tokenb  { fill: #1d4ed8; animation: d090f-travelb 8s ease-in-out infinite; }
    .d090f-labelb  { fill: #1d4ed8; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                     font-size: 13px; animation: d090f-travelb 8s ease-in-out infinite; }
    @keyframes d090f-travelb {
      0%, 52%   { transform: translateX(0);     opacity: 1; }
      92%, 100% { transform: translateX(742px); opacity: 1; }
    }

    /* The value in the lower lane travels its own track, below the parser. */
    .d090f-tokenv  { fill: #b45309; animation: d090f-travelv 8s ease-in-out infinite; }
    .d090f-labelv  { fill: #b45309; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                     font-size: 13px; animation: d090f-travelv 8s ease-in-out infinite; }
    @keyframes d090f-travelv {
      0%, 56%   { transform: translateX(0);     opacity: 1; }
      94%, 100% { transform: translateX(506px); opacity: 1; }
    }

    /* Each result is emphasised once its lane has finished. */
    .d090f-resulta { animation: d090f-reveala 8s ease-in-out infinite; }
    @keyframes d090f-reveala { 0%, 40% { opacity: 0.88; } 48%, 100% { opacity: 1; } }
    .d090f-resultb { animation: d090f-revealb 8s ease-in-out infinite; }
    @keyframes d090f-revealb { 0%, 88% { opacity: 0.88; } 96%, 100% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .d090f-stage   { animation: none; fill: #e0e7ff; }
      .d090f-wire,
      .d090f-wirered,
      .d090f-wireval { animation: none; stroke-dasharray: none; }
      .d090f-tokena, .d090f-labela,
      .d090f-tokenb, .d090f-labelb,
      .d090f-tokenv, .d090f-labelv { animation: none; transform: none; opacity: 1; }
      .d090f-resulta, .d090f-resultb { animation: none; opacity: 1; }
    }
  </style>

  <rect class="d090f-bg" x="0" y="0" width="1280" height="920" />
  <text class="d090f-title" x="32" y="44">The same value, twice: once as code, once as data</text>
  <text class="d090f-lede" x="32" y="70">One input. One schema. One character of difference in the program. Every label below is present whether or not the picture is moving.</text>

  <defs>
    <marker id="d090f-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
    <marker id="d090f-arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c" />
    </marker>
    <marker id="d090f-arrowval" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309" />
    </marker>
  </defs>

  <!-- the input -->
  <rect class="d090f-box" x="32" y="150" width="272" height="150" rx="8" />
  <text class="d090f-label" x="168" y="180" text-anchor="middle">The input</text>
  <text class="d090f-mono" x="168" y="210" text-anchor="middle">Ada' OR '1'='1</text>
  <text class="d090f-sub" x="168" y="238" text-anchor="middle">from a search box, a CSV</text>
  <text class="d090f-sub" x="168" y="256" text-anchor="middle">column, a query string, or a</text>
  <text class="d090f-sub" x="168" y="274" text-anchor="middle">model asked to name an author</text>
  <text class="d090f-sub" x="168" y="292" text-anchor="middle">— it is text either way</text>

  <path class="d090f-wirered" d="M 304 200 L 340 200 L 340 172 L 348 172" marker-end="url(#d090f-arrowred)" />
  <path class="d090f-wire" d="M 304 250 L 340 250 L 340 552 L 348 552" marker-end="url(#d090f-arrow)" />

  <!-- ================= LANE A ================= -->
  <text class="d090f-lane" x="352" y="122">PATH A — concatenated into the SQL string</text>

  <rect class="d090f-stage d090f-a1" x="352" y="136" width="180" height="92" rx="8" />
  <text class="d090f-label" x="442" y="168" text-anchor="middle">Build</text>
  <text class="d090f-monosm" x="442" y="190" text-anchor="middle">"... name = '"</text>
  <text class="d090f-monosm" x="442" y="208" text-anchor="middle">+ value + "'"</text>

  <path class="d090f-wirered" d="M 532 182 L 574 182" marker-end="url(#d090f-arrowred)" />

  <rect class="d090f-stage d090f-a2" x="580" y="136" width="240" height="92" rx="8" />
  <text class="d090f-label" x="700" y="168" text-anchor="middle">Parse</text>
  <text class="d090f-sub" x="700" y="190" text-anchor="middle">the parser reads the whole</text>
  <text class="d090f-sub" x="700" y="208" text-anchor="middle">string, value included</text>

  <path class="d090f-wirered" d="M 820 182 L 846 182" marker-end="url(#d090f-arrowred)" />

  <rect class="d090f-stage d090f-a3" x="852" y="136" width="200" height="92" rx="8" />
  <text class="d090f-label" x="952" y="168" text-anchor="middle">Plan and run</text>
  <text class="d090f-sub" x="952" y="190" text-anchor="middle">the WHERE clause is now</text>
  <text class="d090f-sub" x="952" y="208" text-anchor="middle">true for every row</text>

  <path class="d090f-wirered" d="M 1052 182 L 1072 182" marker-end="url(#d090f-arrowred)" />

  <rect class="d090f-bad d090f-resulta" x="1078" y="136" width="170" height="92" rx="8" />
  <text class="d090f-badtext" x="1163" y="170" text-anchor="middle">3 rows</text>
  <text class="d090f-sub" x="1163" y="192" text-anchor="middle">every member, with</text>
  <text class="d090f-sub" x="1163" y="210" text-anchor="middle">address and PIN</text>

  <circle class="d090f-tokena" cx="320" cy="108" r="8" />
  <text class="d090f-labela" x="336" y="112">value travelling as part of the statement</text>

  <text class="d090f-sub" x="352" y="256">What the parser actually receives:</text>
  <text class="d090f-mono" x="352" y="284">SELECT name, email, pin FROM members WHERE name = 'Ada' OR '1'='1'</text>
  <text class="d090f-caretbad" x="352" y="306" xml:space="preserve">                                                      ^ the apostrophe in the value closed the string; the rest is code</text>
  <text class="d090f-sub" x="352" y="332">The value did not "escape" anything. It was inside the statement before the parser started, so it IS the statement.</text>
  <text class="d090f-sub" x="352" y="354">Nothing here is a bug in SQLite, in Python, or in the schema. The program handed the engine a different question.</text>

  <line x1="32" y1="392" x2="1248" y2="392" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- ================= LANE B ================= -->
  <text class="d090f-lane" x="352" y="440">PATH B — passed as a parameter</text>

  <rect class="d090f-stage d090f-b1" x="352" y="506" width="180" height="92" rx="8" />
  <text class="d090f-label" x="442" y="538" text-anchor="middle">execute</text>
  <text class="d090f-monosm" x="442" y="560" text-anchor="middle">execute(statement,</text>
  <text class="d090f-monosm" x="442" y="578" text-anchor="middle">(value,))</text>

  <!-- the boundary -->
  <path class="d090f-wall" d="M 556 452 L 556 706" />
  <text class="d090f-goodtext" x="556" y="470" text-anchor="middle">the boundary</text>

  <path class="d090f-wire" d="M 532 552 L 574 552" marker-end="url(#d090f-arrow)" />

  <rect class="d090f-stage d090f-b2" x="580" y="506" width="240" height="92" rx="8" />
  <text class="d090f-label" x="700" y="538" text-anchor="middle">Compile</text>
  <text class="d090f-sub" x="700" y="560" text-anchor="middle">the parser sees the statement</text>
  <text class="d090f-sub" x="700" y="578" text-anchor="middle">only — never the value</text>

  <path class="d090f-wire" d="M 820 552 L 846 552" marker-end="url(#d090f-arrow)" />

  <rect class="d090f-stage d090f-b3" x="852" y="506" width="200" height="92" rx="8" />
  <text class="d090f-label" x="952" y="538" text-anchor="middle">Bind and run</text>
  <text class="d090f-sub" x="952" y="560" text-anchor="middle">the value is attached to an</text>
  <text class="d090f-sub" x="952" y="578" text-anchor="middle">already-compiled statement</text>

  <path class="d090f-wire" d="M 1052 552 L 1072 552" marker-end="url(#d090f-arrow)" />

  <rect class="d090f-good d090f-resultb" x="1078" y="506" width="170" height="92" rx="8" />
  <text class="d090f-goodtext" x="1163" y="540" text-anchor="middle">0 rows</text>
  <text class="d090f-sub" x="1163" y="562" text-anchor="middle">no member is called</text>
  <text class="d090f-sub" x="1163" y="580" text-anchor="middle">that. Nothing changed</text>

  <circle class="d090f-tokenb" cx="320" cy="478" r="8" />
  <text class="d090f-labelb" x="336" y="482">statement travelling on its own</text>

  <!-- the value's own track, below the parser -->
  <path class="d090f-wireval" d="M 442 598 L 442 664 L 952 664 L 952 602" marker-end="url(#d090f-arrowval)" />
  <circle class="d090f-tokenv" cx="446" cy="686" r="8" />
  <text class="d090f-labelv" x="462" y="690">the value, going round the parser and arriving as data</text>

  <text class="d090f-sub" x="352" y="732">What the parser actually receives:</text>
  <text class="d090f-mono" x="352" y="760">SELECT name, email, pin FROM members WHERE name = ?</text>
  <text class="d090f-caretgood" x="352" y="782" xml:space="preserve">                                                  ^ one placeholder, compiled before any value exists</text>
  <text class="d090f-sub" x="352" y="808">The value never reaches the tokenizer or the parser. It is attached afterwards and compared to a column, so an</text>
  <text class="d090f-sub" x="352" y="830">apostrophe is just a character in a string. Binding cannot change the shape of a statement that is already compiled.</text>

  <text class="d090f-sub" x="32" y="864">Resting state: both lanes drawn in full, all six stages shaded, both statements and both results printed, each token at the start of its path.</text>
  <text class="d090f-sub" x="32" y="886">With reduced motion requested the animation stops and that resting state is the whole diagram — no fact is carried by the movement.</text>
  <text class="d090f-sub" x="32" y="908">Placeholders stand in for values only. A column or table name that has to vary is chosen from an allow-list you wrote, never bound.</text>
</svg>
