<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And knowing what to throw away.">
  <title>Compressing a photograph</title>
  <style>
    .photo-compression-bg   { fill: #f8fafc; }
    .photo-compression-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .photo-compression-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .photo-compression-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .photo-compression-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .photo-compression-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .photo-compression-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .photo-compression-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .photo-compression-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .photo-compression-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .photo-compression-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .photo-compression-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .photo-compression-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .photo-compression-row { opacity: 1; }
    .photo-compression-r0 { animation-delay: 0.00s; }
    .photo-compression-r1 { animation-delay: 0.45s; }
    .photo-compression-r2 { animation-delay: 0.90s; }
    .photo-compression-r3 { animation-delay: 1.35s; }
    .photo-compression-r4 { animation-delay: 1.80s; }
    .photo-compression-row { animation: photo-compression-reveal 7.3s ease-in-out infinite; }
    @keyframes photo-compression-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="photo-compression-bg" width="980" height="390"/>
  <text class="photo-compression-h1"  x="30" y="40">Compressing a photograph</text>
  <text class="photo-compression-sub" x="30" y="64">And knowing what to throw away.</text>
  <rect class="photo-compression-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="photo-compression-name" x="46" y="122">Uncompressed</text>
  <text class="photo-compression-desc" x="46" y="142">Every pixel exact.</text>
  <text class="photo-compression-desc photo-compression-row photo-compression-r0" x="46" y="182">Perfect fidelity</text>
  <text class="photo-compression-desc photo-compression-row photo-compression-r1" x="46" y="216">Enormous files</text>
  <text class="photo-compression-desc photo-compression-row photo-compression-r2" x="46" y="250">Slow to send</text>
  <text class="photo-compression-desc photo-compression-row photo-compression-r3" x="46" y="284">Detail nobody can perceive</text>
  <text class="photo-compression-desc photo-compression-row photo-compression-r4" x="46" y="318">This is full precision</text>
  <rect class="photo-compression-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="photo-compression-name" x="526" y="122">Compressed</text>
  <text class="photo-compression-desc" x="526" y="142">Every pixel close enough.</text>
  <text class="photo-compression-desc photo-compression-row photo-compression-r0" x="526" y="182">Detail dropped where the eye cannot see it</text>
  <text class="photo-compression-desc photo-compression-row photo-compression-r1" x="526" y="216">A fraction of the size</text>
  <text class="photo-compression-desc photo-compression-row photo-compression-r2" x="526" y="250">Fast to send</text>
  <text class="photo-compression-desc photo-compression-row photo-compression-r3" x="526" y="284">Indistinguishable in practice</text>
  <text class="photo-compression-desc photo-compression-row photo-compression-r4" x="526" y="318">This is quantisation</text>
  <text class="photo-compression-sub" x="30" y="372">The parallel is exact in the important respect: both work because the original representation carried far more precision than the consumer of it could actually use.</text>
</svg>
