<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two ways to be wrong.">
  <title>A screening test</title>
  <style>
    .medical-screening-bg   { fill: #f8fafc; }
    .medical-screening-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .medical-screening-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .medical-screening-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .medical-screening-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .medical-screening-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .medical-screening-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .medical-screening-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .medical-screening-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .medical-screening-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .medical-screening-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .medical-screening-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .medical-screening-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .medical-screening-row { opacity: 1; }
    .medical-screening-r0 { animation-delay: 0.00s; }
    .medical-screening-r1 { animation-delay: 0.45s; }
    .medical-screening-r2 { animation-delay: 0.90s; }
    .medical-screening-r3 { animation-delay: 1.35s; }
    .medical-screening-r4 { animation-delay: 1.80s; }
    .medical-screening-row { animation: medical-screening-reveal 7.3s ease-in-out infinite; }
    @keyframes medical-screening-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="medical-screening-bg" width="980" height="390"/>
  <text class="medical-screening-h1"  x="30" y="40">A screening test</text>
  <text class="medical-screening-sub" x="30" y="64">Two ways to be wrong.</text>
  <rect class="medical-screening-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="medical-screening-name" x="46" y="122">A false alarm</text>
  <text class="medical-screening-desc" x="46" y="142">Says yes, wrongly.</text>
  <text class="medical-screening-desc medical-screening-row medical-screening-r0" x="46" y="182">Further tests, anxiety, expense</text>
  <text class="medical-screening-desc medical-screening-row medical-screening-r1" x="46" y="216">Recoverable, and unpleasant</text>
  <text class="medical-screening-desc medical-screening-row medical-screening-r2" x="46" y="250">Reduced by raising the threshold</text>
  <text class="medical-screening-desc medical-screening-row medical-screening-r3" x="46" y="284">Costs money and distress</text>
  <text class="medical-screening-desc medical-screening-row medical-screening-r4" x="46" y="318">This is low precision</text>
  <rect class="medical-screening-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="medical-screening-name" x="526" y="122">A miss</text>
  <text class="medical-screening-desc" x="526" y="142">Says no, wrongly.</text>
  <text class="medical-screening-desc medical-screening-row medical-screening-r0" x="526" y="182">The condition goes untreated</text>
  <text class="medical-screening-desc medical-screening-row medical-screening-r1" x="526" y="216">Sometimes not recoverable</text>
  <text class="medical-screening-desc medical-screening-row medical-screening-r2" x="526" y="250">Reduced by lowering the threshold</text>
  <text class="medical-screening-desc medical-screening-row medical-screening-r3" x="526" y="284">Costs far more</text>
  <text class="medical-screening-desc medical-screening-row medical-screening-r4" x="526" y="318">This is low recall</text>
  <text class="medical-screening-sub" x="30" y="372">Screening programmes deliberately accept many false alarms to avoid misses, which is a threshold choice made from costs — exactly what this lesson formalises.</text>
</svg>
