<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Nothing breaks; the answers get worse.">
  <title>The failure mode with no error</title>
  <style>
    .silent-regression-bg   { fill: #f8fafc; }
    .silent-regression-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .silent-regression-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .silent-regression-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .silent-regression-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .silent-regression-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .silent-regression-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .silent-regression-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .silent-regression-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .silent-regression-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .silent-regression-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .silent-regression-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .silent-regression-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .silent-regression-row { opacity: 1; }
    .silent-regression-r0 { animation-delay: 0.00s; }
    .silent-regression-r1 { animation-delay: 0.45s; }
    .silent-regression-r2 { animation-delay: 0.90s; }
    .silent-regression-r3 { animation-delay: 1.35s; }
    .silent-regression-r4 { animation-delay: 1.80s; }
    .silent-regression-row { animation: silent-regression-reveal 7.3s ease-in-out infinite; }
    @keyframes silent-regression-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="silent-regression-bg" width="980" height="390"/>
  <text class="silent-regression-h1"  x="30" y="40">The failure mode with no error</text>
  <text class="silent-regression-sub" x="30" y="64">Nothing breaks; the answers get worse.</text>
  <rect class="silent-regression-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="silent-regression-name" x="46" y="122">Without an evaluation set</text>
  <text class="silent-regression-desc" x="46" y="142">Discovered by a user, eventually.</text>
  <text class="silent-regression-desc silent-regression-row silent-regression-r0" x="46" y="182">A prompt tweak degrades grounding</text>
  <text class="silent-regression-desc silent-regression-row silent-regression-r1" x="46" y="216">No exception, no alert, no metric moves</text>
  <text class="silent-regression-desc silent-regression-row silent-regression-r2" x="46" y="250">Latency and error rate stay perfect</text>
  <text class="silent-regression-desc silent-regression-row silent-regression-r3" x="46" y="284">Weeks pass</text>
  <text class="silent-regression-desc silent-regression-row silent-regression-r4" x="46" y="318">Someone complains, and nobody knows when it started</text>
  <rect class="silent-regression-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="silent-regression-name" x="526" y="122">With one</text>
  <text class="silent-regression-desc" x="526" y="142">Discovered in the pull request.</text>
  <text class="silent-regression-desc silent-regression-row silent-regression-r0" x="526" y="182">The score drops on the same 20 queries</text>
  <text class="silent-regression-desc silent-regression-row silent-regression-r1" x="526" y="216">The build fails before merge</text>
  <text class="silent-regression-desc silent-regression-row silent-regression-r2" x="526" y="250">The diff that caused it is right there</text>
  <text class="silent-regression-desc silent-regression-row silent-regression-r3" x="526" y="284">Fixed in minutes, not weeks</text>
  <text class="silent-regression-desc silent-regression-row silent-regression-r4" x="526" y="318">And the case joins the set permanently</text>
  <text class="silent-regression-sub" x="30" y="372">Day 40's point in its sharpest form: a model does not crash, it degrades, so every system signal stays green while the thing the product exists to do gets worse.</text>
</svg>
