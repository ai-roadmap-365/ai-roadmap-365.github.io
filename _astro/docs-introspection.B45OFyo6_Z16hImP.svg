<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four tools.">
  <title>Finding out what exists</title>
  <style>
    .docs-introspection-bg   { fill: #f8fafc; }
    .docs-introspection-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docs-introspection-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docs-introspection-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docs-introspection-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docs-introspection-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docs-introspection-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .docs-introspection-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .docs-introspection-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .docs-introspection-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .docs-introspection-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .docs-introspection-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .docs-introspection-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .docs-introspection-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .docs-introspection-stage { opacity: 1; }

    .docs-introspection-s0 { animation-delay: 0.00s; }
    .docs-introspection-e0 { animation-delay: 0.00s; }
    .docs-introspection-s1 { animation-delay: 1.28s; }
    .docs-introspection-e1 { animation-delay: 1.28s; }
    .docs-introspection-s2 { animation-delay: 2.56s; }
    .docs-introspection-e2 { animation-delay: 2.56s; }
    .docs-introspection-s3 { animation-delay: 3.84s; }
    .docs-introspection-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .docs-introspection-conn  { animation: docs-introspection-trace 6.4s ease-in-out infinite; }
      .docs-introspection-stage { animation: docs-introspection-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes docs-introspection-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes docs-introspection-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .docs-introspection-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .docs-introspection-stage { animation: docs-introspection-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes docs-introspection-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="docs-introspection-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="docs-introspection-bg" width="980" height="322"/>
  <text class="docs-introspection-h1"  x="30" y="40">Finding out what exists</text>
  <text class="docs-introspection-sub" x="30" y="64">Four tools.</text>
  <g class="docs-introspection-stage docs-introspection-s0">
    <rect class="docs-introspection-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="docs-introspection-step" x="44" y="142">01</text>
    <text class="docs-introspection-name" x="70" y="142">The documentation, which is unusually good</text>
    <text class="docs-introspection-desc" x="44" y="166">And organised by task as well as</text>
    <text class="docs-introspection-desc" x="44" y="182">by module.</text>
  </g>
  <line class="docs-introspection-line docs-introspection-conn docs-introspection-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#docs-introspection-tip)"/>
  <g class="docs-introspection-stage docs-introspection-s1">
    <rect class="docs-introspection-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="docs-introspection-step" x="280" y="142">02</text>
    <text class="docs-introspection-name" x="306" y="142">Listing an object's attributes</text>
    <text class="docs-introspection-desc" x="280" y="166">Which shows what it can do.</text>
  </g>
  <line class="docs-introspection-line docs-introspection-conn docs-introspection-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#docs-introspection-tip)"/>
  <g class="docs-introspection-stage docs-introspection-s2">
    <rect class="docs-introspection-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="docs-introspection-step" x="516" y="142">03</text>
    <text class="docs-introspection-name" x="542" y="142">The built-in help, which prints the docstring</text>
    <text class="docs-introspection-desc" x="516" y="166">Without leaving the session.</text>
  </g>
  <line class="docs-introspection-line docs-introspection-conn docs-introspection-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#docs-introspection-tip)"/>
  <g class="docs-introspection-stage docs-introspection-s3">
    <rect class="docs-introspection-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="docs-introspection-step" x="752" y="142">04</text>
    <text class="docs-introspection-name" x="778" y="142">And the source itself, which is readable</text>
    <text class="docs-introspection-desc" x="752" y="166">Being written in Python for the</text>
    <text class="docs-introspection-desc" x="752" y="182">most part.</text>
  </g>
  <text class="docs-introspection-sub" x="30" y="304">Reading the standard library's own source is an underused way to learn idiomatic code, and it is far more accessible than most people expect.</text>
</svg>
