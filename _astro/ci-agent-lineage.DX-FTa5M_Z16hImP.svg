<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Gates, then bots, then agents.">
  <title>Three phases of CI automation</title>
  <style>
    .ci-agent-lineage-bg   { fill: #f8fafc; }
    .ci-agent-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-agent-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-agent-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-agent-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-agent-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-agent-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ci-agent-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ci-agent-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ci-agent-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ci-agent-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ci-agent-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ci-agent-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .ci-agent-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .ci-agent-lineage-stage { opacity: 1; }

    .ci-agent-lineage-s0 { animation-delay: 0.00s; }
    .ci-agent-lineage-e0 { animation-delay: 0.00s; }
    .ci-agent-lineage-s1 { animation-delay: 1.50s; }
    .ci-agent-lineage-e1 { animation-delay: 1.50s; }
    .ci-agent-lineage-s2 { animation-delay: 3.00s; }
    .ci-agent-lineage-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .ci-agent-lineage-conn  { animation: ci-agent-lineage-trace 6s ease-in-out infinite; }
      .ci-agent-lineage-stage { animation: ci-agent-lineage-arrive 6s ease-in-out infinite; }
    }
    @keyframes ci-agent-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes ci-agent-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .ci-agent-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ci-agent-lineage-stage { animation: ci-agent-lineage-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes ci-agent-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ci-agent-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="ci-agent-lineage-bg" width="980" height="322"/>
  <text class="ci-agent-lineage-h1"  x="30" y="40">Three phases of CI automation</text>
  <text class="ci-agent-lineage-sub" x="30" y="64">Gates, then bots, then agents.</text>
  <g class="ci-agent-lineage-stage ci-agent-lineage-s0">
    <rect class="ci-agent-lineage-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="ci-agent-lineage-step" x="44" y="142">01</text>
    <text class="ci-agent-lineage-name" x="70" y="142">Test and lint gates, 2000s</text>
    <text class="ci-agent-lineage-desc" x="44" y="166">Automated quality enforcement on every push.</text>
    <text class="ci-agent-lineage-desc" x="44" y="182">Pass or fail, nothing more.</text>
  </g>
  <line class="ci-agent-lineage-line ci-agent-lineage-conn ci-agent-lineage-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#ci-agent-lineage-tip)"/>
  <g class="ci-agent-lineage-stage ci-agent-lineage-s1">
    <rect class="ci-agent-lineage-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="ci-agent-lineage-step" x="359" y="142">02</text>
    <text class="ci-agent-lineage-name" x="385" y="142">Static analysis bots, 2010s</text>
    <text class="ci-agent-lineage-desc" x="359" y="166">Automated PR comments, bounded by rigid</text>
    <text class="ci-agent-lineage-desc" x="359" y="182">rules. No multi-file fixes.</text>
  </g>
  <line class="ci-agent-lineage-line ci-agent-lineage-conn ci-agent-lineage-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#ci-agent-lineage-tip)"/>
  <g class="ci-agent-lineage-stage ci-agent-lineage-s2">
    <rect class="ci-agent-lineage-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="ci-agent-lineage-step" x="674" y="142">03</text>
    <text class="ci-agent-lineage-name" x="700" y="142">Headless SWE agents, 2024</text>
    <text class="ci-agent-lineage-desc" x="674" y="166">Container sandboxes solving real issues end</text>
    <text class="ci-agent-lineage-desc" x="674" y="182">to end.</text>
  </g>
  <text class="ci-agent-lineage-sub" x="30" y="304">The middle phase established the interaction pattern that the third one filled in: bots already commented on pull requests, and what changed is that the comment can now be a patch.</text>
</svg>
