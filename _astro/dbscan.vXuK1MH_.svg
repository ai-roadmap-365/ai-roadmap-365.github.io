<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Density-based clustering</title>
  <style>
    .dbscan-bg   { fill: #f8fafc; }
    .dbscan-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dbscan-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dbscan-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dbscan-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dbscan-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dbscan-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dbscan-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dbscan-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dbscan-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dbscan-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dbscan-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dbscan-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .dbscan-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .dbscan-stage { opacity: 1; }

    .dbscan-s0 { animation-delay: 0.00s; }
    .dbscan-e0 { animation-delay: 0.00s; }
    .dbscan-s1 { animation-delay: 1.28s; }
    .dbscan-e1 { animation-delay: 1.28s; }
    .dbscan-s2 { animation-delay: 2.56s; }
    .dbscan-e2 { animation-delay: 2.56s; }
    .dbscan-s3 { animation-delay: 3.84s; }
    .dbscan-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .dbscan-conn  { animation: dbscan-trace 6.4s ease-in-out infinite; }
      .dbscan-stage { animation: dbscan-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes dbscan-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes dbscan-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .dbscan-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .dbscan-stage { animation: dbscan-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes dbscan-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="dbscan-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="dbscan-bg" width="980" height="322"/>
  <text class="dbscan-h1"  x="30" y="40">Density-based clustering</text>
  <text class="dbscan-sub" x="30" y="64">Four steps.</text>
  <g class="dbscan-stage dbscan-s0">
    <rect class="dbscan-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="dbscan-step" x="44" y="142">01</text>
    <text class="dbscan-name" x="70" y="142">Two parameters: a radius, and a minimum neighbour count</text>
    <text class="dbscan-desc" x="44" y="166">Which together define dense.</text>
  </g>
  <line class="dbscan-line dbscan-conn dbscan-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#dbscan-tip)"/>
  <g class="dbscan-stage dbscan-s1">
    <rect class="dbscan-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="dbscan-step" x="280" y="142">02</text>
    <text class="dbscan-name" x="306" y="142">A point with enough neighbours within the radius is a core point</text>
    <text class="dbscan-desc" x="280" y="166">Which seeds a cluster.</text>
  </g>
  <line class="dbscan-line dbscan-conn dbscan-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#dbscan-tip)"/>
  <g class="dbscan-stage dbscan-s2">
    <rect class="dbscan-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="dbscan-step" x="516" y="142">03</text>
    <text class="dbscan-name" x="542" y="142">Clusters grow by chaining through core points</text>
    <text class="dbscan-desc" x="516" y="166">Which is how arbitrary shapes</text>
    <text class="dbscan-desc" x="516" y="182">are found.</text>
  </g>
  <line class="dbscan-line dbscan-conn dbscan-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#dbscan-tip)"/>
  <g class="dbscan-stage dbscan-s3">
    <rect class="dbscan-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="dbscan-step" x="752" y="142">04</text>
    <text class="dbscan-name" x="778" y="142">And points in no dense region are noise</text>
    <text class="dbscan-desc" x="752" y="166">Explicitly labelled, not forced</text>
    <text class="dbscan-desc" x="752" y="182">into a cluster.</text>
  </g>
  <text class="dbscan-sub" x="30" y="304">Chaining through core points is what lets this trace a crescent or a spiral, which no centroid-based method can represent at all.</text>
</svg>
