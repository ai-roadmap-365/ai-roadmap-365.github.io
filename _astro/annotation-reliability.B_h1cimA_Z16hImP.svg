<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three practices before scaling.">
  <title>Making human labels reliable</title>
  <style>
    .annotation-reliability-bg   { fill: #f8fafc; }
    .annotation-reliability-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .annotation-reliability-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .annotation-reliability-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .annotation-reliability-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .annotation-reliability-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .annotation-reliability-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .annotation-reliability-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .annotation-reliability-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .annotation-reliability-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .annotation-reliability-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .annotation-reliability-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .annotation-reliability-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .annotation-reliability-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .annotation-reliability-stage { opacity: 1; }

    .annotation-reliability-s0 { animation-delay: 0.00s; }
    .annotation-reliability-e0 { animation-delay: 0.00s; }
    .annotation-reliability-s1 { animation-delay: 1.50s; }
    .annotation-reliability-e1 { animation-delay: 1.50s; }
    .annotation-reliability-s2 { animation-delay: 3.00s; }
    .annotation-reliability-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .annotation-reliability-conn  { animation: annotation-reliability-trace 6s ease-in-out infinite; }
      .annotation-reliability-stage { animation: annotation-reliability-arrive 6s ease-in-out infinite; }
    }
    @keyframes annotation-reliability-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes annotation-reliability-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .annotation-reliability-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .annotation-reliability-stage { animation: annotation-reliability-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes annotation-reliability-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="annotation-reliability-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="annotation-reliability-bg" width="980" height="322"/>
  <text class="annotation-reliability-h1"  x="30" y="40">Making human labels reliable</text>
  <text class="annotation-reliability-sub" x="30" y="64">Three practices before scaling.</text>
  <g class="annotation-reliability-stage annotation-reliability-s0">
    <rect class="annotation-reliability-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="annotation-reliability-step" x="44" y="142">01</text>
    <text class="annotation-reliability-name" x="70" y="142">Write the guidelines first</text>
    <text class="annotation-reliability-desc" x="44" y="166">Positive and negative examples for every</text>
    <text class="annotation-reliability-desc" x="44" y="182">category.</text>
  </g>
  <line class="annotation-reliability-line annotation-reliability-conn annotation-reliability-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#annotation-reliability-tip)"/>
  <g class="annotation-reliability-stage annotation-reliability-s1">
    <rect class="annotation-reliability-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="annotation-reliability-step" x="359" y="142">02</text>
    <text class="annotation-reliability-name" x="385" y="142">Run a calibration batch</text>
    <text class="annotation-reliability-desc" x="359" y="166">All annotators grade the same twenty, then</text>
    <text class="annotation-reliability-desc" x="359" y="182">compute agreement.</text>
    <text class="annotation-reliability-edge" x="359" y="242">Cohen's kappa</text>
  </g>
  <line class="annotation-reliability-line annotation-reliability-conn annotation-reliability-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#annotation-reliability-tip)"/>
  <g class="annotation-reliability-stage annotation-reliability-s2">
    <rect class="annotation-reliability-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="annotation-reliability-step" x="674" y="142">03</text>
    <text class="annotation-reliability-name" x="700" y="142">Arbitrate disagreements</text>
    <text class="annotation-reliability-desc" x="674" y="166">Route to a senior lead, and feed the</text>
    <text class="annotation-reliability-desc" x="674" y="182">resolution back into the guidelines.</text>
  </g>
  <text class="annotation-reliability-sub" x="30" y="304">Measuring agreement before scaling is what prevents an expensive annotation run producing a dataset whose ground truth two experts would disagree about, which is a dataset that cannot grade anything.</text>
</svg>
