<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each for a specific constraint.">
  <title>Three advanced techniques</title>
  <style>
    .advanced-regularisation-bg   { fill: #f8fafc; }
    .advanced-regularisation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .advanced-regularisation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .advanced-regularisation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .advanced-regularisation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .advanced-regularisation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .advanced-regularisation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .advanced-regularisation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .advanced-regularisation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .advanced-regularisation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .advanced-regularisation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .advanced-regularisation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .advanced-regularisation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .advanced-regularisation-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .advanced-regularisation-stage { opacity: 1; }

    .advanced-regularisation-s0 { animation-delay: 0.00s; }
    .advanced-regularisation-e0 { animation-delay: 0.00s; }
    .advanced-regularisation-s1 { animation-delay: 1.50s; }
    .advanced-regularisation-e1 { animation-delay: 1.50s; }
    .advanced-regularisation-s2 { animation-delay: 3.00s; }
    .advanced-regularisation-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .advanced-regularisation-conn  { animation: advanced-regularisation-trace 6s ease-in-out infinite; }
      .advanced-regularisation-stage { animation: advanced-regularisation-arrive 6s ease-in-out infinite; }
    }
    @keyframes advanced-regularisation-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes advanced-regularisation-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .advanced-regularisation-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .advanced-regularisation-stage { animation: advanced-regularisation-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes advanced-regularisation-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="advanced-regularisation-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="advanced-regularisation-bg" width="980" height="322"/>
  <text class="advanced-regularisation-h1"  x="30" y="40">Three advanced techniques</text>
  <text class="advanced-regularisation-sub" x="30" y="64">Each for a specific constraint.</text>
  <g class="advanced-regularisation-stage advanced-regularisation-s0">
    <rect class="advanced-regularisation-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="advanced-regularisation-step" x="44" y="142">01</text>
    <text class="advanced-regularisation-name" x="70" y="142">Group normalisation</text>
    <text class="advanced-regularisation-desc" x="44" y="166">Channels split into groups, normalised per</text>
    <text class="advanced-regularisation-desc" x="44" y="182">sample. For batch sizes of two or four.</text>
    <text class="advanced-regularisation-edge" x="44" y="242">small batches</text>
  </g>
  <line class="advanced-regularisation-line advanced-regularisation-conn advanced-regularisation-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#advanced-regularisation-tip)"/>
  <g class="advanced-regularisation-stage advanced-regularisation-s1">
    <rect class="advanced-regularisation-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="advanced-regularisation-step" x="359" y="142">02</text>
    <text class="advanced-regularisation-name" x="385" y="142">Label smoothing</text>
    <text class="advanced-regularisation-desc" x="359" y="166">Soft targets instead of hard one-hot, so the</text>
    <text class="advanced-regularisation-desc" x="359" y="182">model stops driving logits to extremes.</text>
    <text class="advanced-regularisation-edge" x="359" y="242">calibration</text>
  </g>
  <line class="advanced-regularisation-line advanced-regularisation-conn advanced-regularisation-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#advanced-regularisation-tip)"/>
  <g class="advanced-regularisation-stage advanced-regularisation-s2">
    <rect class="advanced-regularisation-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="advanced-regularisation-step" x="674" y="142">03</text>
    <text class="advanced-regularisation-name" x="700" y="142">Stochastic depth</text>
    <text class="advanced-regularisation-desc" x="674" y="166">Randomly skip whole residual blocks during</text>
    <text class="advanced-regularisation-desc" x="674" y="182">training.</text>
    <text class="advanced-regularisation-edge" x="674" y="242">very deep nets</text>
  </g>
  <text class="advanced-regularisation-sub" x="30" y="304">Label smoothing is worth adopting more widely than it is: overconfident models are poorly calibrated, and a model that says 99.9% when it is right 90% of the time is misleading downstream.</text>
</svg>
