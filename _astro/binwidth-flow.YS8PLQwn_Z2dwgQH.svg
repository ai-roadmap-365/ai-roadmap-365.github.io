<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" width="1080" height="620" role="img" aria-labelledby="d130fTitleId d130fDescId">
  <title id="d130fTitleId">The same 500 points binned three ways as the bin width grows -- a second mode appears at the right width and dissolves once the bins grow too wide</title>
  <desc id="d130fDescId">The identical 500-point sample flows down into three histogram panels arranged left to right by increasing bin width. The first panel, 100 narrow bins, shows a jagged row of mostly tiny bars with no clear pattern, captioned noise, not structure. The second panel, 13 bins chosen by the Freedman-Diaconis rule, shows two clearly separated tall bars with a gap between them, captioned the real two-cluster structure, appearing. The third panel, 5 wide bins, shows one smooth tall hump, captioned the same two clusters, now merged into one. A wire with marching dashes connects the three panels in order and each panel's border glows briefly in sequence, narrow first, then chosen, then wide, showing the second mode appearing at the chosen width and dissolving again as the bins widen further. A bottom caption states that with motion disabled, all three panels, their bars and their captions are already fully drawn and none of the diagram's meaning depends on the animation playing.</desc>

  <style>
    .d130f-bg      { fill: #f8fafc; }
    .d130f-title   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; fill: #1a202c; }
    .d130f-sub     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13.5px; fill: #334155; }
    .d130f-name    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; fill: #1a202c; }
    .d130f-small   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12.5px; fill: #334155; }
    .d130f-caption { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #334155; }
    .d130f-mono    { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; fill: #1d4ed8; font-weight: 700; }
    .d130f-axis    { stroke: #94a3b8; stroke-width: 1.25; }
    .d130f-bar     { fill: #93c5fd; stroke: #1d4ed8; stroke-width: 1.25; }

    .d130f-panel   { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; animation: d130f-lift 9s ease-in-out infinite; }
    .d130f-p1 { animation-delay: 0s; }
    .d130f-p2 { animation-delay: 3s; }
    .d130f-p3 { animation-delay: 6s; }
    @keyframes d130f-lift {
      0%, 22%, 100% { stroke: #cbd5e1; }
      6%, 16%       { stroke: #1d4ed8; }
    }

    .d130f-wire {
      fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 9 7;
      animation: d130f-march 1.4s linear infinite;
    }
    @keyframes d130f-march { to { stroke-dashoffset: -16; } }

    .d130f-token { fill: #1d4ed8; animation: d130f-fall 9s ease-in-out infinite; }
    .d130f-t1 { animation-delay: 0s; }
    .d130f-t2 { animation-delay: 3s; }
    .d130f-t3 { animation-delay: 6s; }
    @keyframes d130f-fall {
      0%   { transform: translateY(0);   opacity: 1; }
      6%   { transform: translateY(0);   opacity: 1; }
      20%  { transform: translateY(58px); opacity: 1; }
      100% { transform: translateY(58px); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d130f-panel { animation: none; stroke: #cbd5e1; }
      .d130f-wire  { animation: none; stroke-dasharray: none; }
      .d130f-token { animation: none; transform: translateY(58px); opacity: 1; }
    }
  </style>

  <rect class="d130f-bg" x="0" y="0" width="1080" height="620" />
  <text class="d130f-title" x="32" y="42">The same sample, three bin widths</text>
  <text class="d130f-sub" x="32" y="66">500 points fall into three histograms of increasing bin width. Watch each panel's border light up in turn as the story it tells changes.</text>

  <!-- sample row (the 500 points, shown as a compact block of tokens above the panels) -->
  <text class="d130f-small" x="32" y="104">the sample (500 points)</text>
  <g>
    <circle class="d130f-token d130f-t1" cx="80"  cy="120" r="5" />
    <circle class="d130f-token d130f-t1" cx="96"  cy="120" r="5" />
    <circle class="d130f-token d130f-t2" cx="440" cy="120" r="5" />
    <circle class="d130f-token d130f-t2" cx="456" cy="120" r="5" />
    <circle class="d130f-token d130f-t3" cx="800" cy="120" r="5" />
    <circle class="d130f-token d130f-t3" cx="816" cy="120" r="5" />
  </g>

  <!-- connecting wire -->
  <path class="d130f-wire" d="M 300 190 L 356 190" />
  <path class="d130f-wire" d="M 660 190 L 716 190" />

  <!-- PANEL 1: narrow (100 bins, noise) -->
  <rect class="d130f-panel d130f-p1" x="32" y="190" width="268" height="330" rx="8" />
  <text class="d130f-name" x="52" y="220">100 bins -- narrow</text>
  <text class="d130f-mono" x="52" y="240">too many, too thin</text>
  <line class="d130f-axis" x1="52" y1="430" x2="280" y2="430" />
  <line class="d130f-axis" x1="52" y1="260" x2="52" y2="430" />
  <g class="d130f-bar">
    <rect x="58"  y="410" width="4" height="20" /><rect x="64"  y="395" width="4" height="35" /><rect x="70"  y="420" width="4" height="10" />
    <rect x="76"  y="400" width="4" height="30" /><rect x="82"  y="415" width="4" height="15" /><rect x="88"  y="405" width="4" height="25" />
    <rect x="94"  y="425" width="4" height="5"  /><rect x="100" y="390" width="4" height="40" /><rect x="106" y="418" width="4" height="12" />
    <rect x="112" y="408" width="4" height="22" /><rect x="118" y="398" width="4" height="32" /><rect x="124" y="422" width="4" height="8"  />
    <rect x="130" y="402" width="4" height="28" /><rect x="136" y="412" width="4" height="18" /><rect x="142" y="392" width="4" height="38" />
    <rect x="148" y="420" width="4" height="10" /><rect x="154" y="405" width="4" height="25" /><rect x="160" y="415" width="4" height="15" />
    <rect x="166" y="398" width="4" height="32" /><rect x="172" y="424" width="4" height="6"  /><rect x="178" y="400" width="4" height="30" />
    <rect x="184" y="410" width="4" height="20" /><rect x="190" y="395" width="4" height="35" /><rect x="196" y="418" width="4" height="12" />
    <rect x="202" y="406" width="4" height="24" /><rect x="208" y="422" width="4" height="8"  /><rect x="214" y="396" width="4" height="34" />
    <rect x="220" y="414" width="4" height="16" /><rect x="226" y="404" width="4" height="26" /><rect x="232" y="420" width="4" height="10" />
    <rect x="238" y="400" width="4" height="30" /><rect x="244" y="416" width="4" height="14" /><rect x="250" y="408" width="4" height="22" />
    <rect x="256" y="424" width="4" height="6"  /><rect x="262" y="398" width="4" height="32" /><rect x="268" y="412" width="4" height="18" />
  </g>
  <text class="d130f-small" x="52" y="452">more than 20 spurious bumps --</text>
  <text class="d130f-small" x="52" y="468">this lab's own capture found 23.</text>
  <text class="d130f-small" x="52" y="490">neither cluster is visible on</text>
  <text class="d130f-small" x="52" y="506">purpose; every bar is sampling</text>
  <text class="d130f-small" x="52" y="522">noise mistaken for structure.</text>

  <!-- PANEL 2: chosen (13 bins, Freedman-Diaconis, two modes) -->
  <rect class="d130f-panel d130f-p2" x="392" y="190" width="268" height="330" rx="8" />
  <text class="d130f-name" x="412" y="220">13 bins -- Freedman-Diaconis</text>
  <text class="d130f-mono" x="412" y="240">chosen from the IQR</text>
  <line class="d130f-axis" x1="412" y1="430" x2="640" y2="430" />
  <line class="d130f-axis" x1="412" y1="260" x2="412" y2="430" />
  <g class="d130f-bar">
    <rect x="420" y="415" width="12" height="15" /><rect x="434" y="390" width="12" height="40" /><rect x="448" y="360" width="12" height="70" />
    <rect x="462" y="410" width="12" height="20" /><rect x="476" y="422" width="12" height="8"  /><rect x="490" y="424" width="12" height="6"  />
    <rect x="504" y="422" width="12" height="8"  /><rect x="518" y="405" width="12" height="25" /><rect x="532" y="365" width="12" height="65" />
    <rect x="546" y="380" width="12" height="50" /><rect x="560" y="405" width="12" height="25" /><rect x="574" y="418" width="12" height="12" />
    <rect x="588" y="424" width="12" height="6"  />
  </g>
  <text class="d130f-small" x="412" y="452">two tall bars, a real gap</text>
  <text class="d130f-small" x="412" y="468">between them -- this is the</text>
  <text class="d130f-small" x="412" y="484">actual structure, recovered</text>
  <text class="d130f-small" x="412" y="500">automatically. the second</text>
  <text class="d130f-small" x="412" y="516">mode appears here.</text>

  <!-- PANEL 3: wide (5 bins, one hump) -->
  <rect class="d130f-panel d130f-p3" x="752" y="190" width="268" height="330" rx="8" />
  <text class="d130f-name" x="772" y="220">5 bins -- wide</text>
  <text class="d130f-mono" x="772" y="240">too few, too thick</text>
  <line class="d130f-axis" x1="772" y1="430" x2="1000" y2="430" />
  <line class="d130f-axis" x1="772" y1="260" x2="772" y2="430" />
  <g class="d130f-bar">
    <rect x="780" y="380" width="38" height="50" /><rect x="822" y="330" width="38" height="100" /><rect x="864" y="345" width="38" height="85" />
    <rect x="906" y="395" width="38" height="35" /><rect x="948" y="418" width="38" height="12" />
  </g>
  <text class="d130f-small" x="772" y="452">one smooth hump. the</text>
  <text class="d130f-small" x="772" y="468">two clusters from panel 2</text>
  <text class="d130f-small" x="772" y="484">are still there in the raw</text>
  <text class="d130f-small" x="772" y="500">data -- the wide bins just</text>
  <text class="d130f-small" x="772" y="516">dissolved the gap between</text>
  <text class="d130f-small" x="772" y="532">them. the mode dissolves.</text>

  <rect x="32" y="552" width="988" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text class="d130f-caption" x="52" y="574">With motion disabled, all three panels, every bar, and every caption above are already fully drawn.</text>
  <text class="d130f-caption" x="52" y="592">Nothing about this diagram's meaning depends on the animation actually playing.</text>
</svg>
