<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Different risks.">
  <title>Two caches, two purposes</title>
  <style>
    .two-caches-bg   { fill: #f8fafc; }
    .two-caches-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-caches-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-caches-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-caches-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-caches-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-caches-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .two-caches-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .two-caches-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .two-caches-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .two-caches-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .two-caches-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .two-caches-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .two-caches-row { opacity: 1; }
    .two-caches-r0 { animation-delay: 0.00s; }
    .two-caches-r1 { animation-delay: 0.45s; }
    .two-caches-r2 { animation-delay: 0.90s; }
    .two-caches-r3 { animation-delay: 1.35s; }
    .two-caches-r4 { animation-delay: 1.80s; }
    .two-caches-row { animation: two-caches-reveal 7.3s ease-in-out infinite; }
    @keyframes two-caches-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="two-caches-bg" width="980" height="390"/>
  <text class="two-caches-h1"  x="30" y="40">Two caches, two purposes</text>
  <text class="two-caches-sub" x="30" y="64">Different risks.</text>
  <rect class="two-caches-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="two-caches-name" x="46" y="122">Cache the retrieval</text>
  <text class="two-caches-desc" x="46" y="142">Safer.</text>
  <text class="two-caches-desc two-caches-row two-caches-r0" x="46" y="182">Keyed on the query embedding</text>
  <text class="two-caches-desc two-caches-row two-caches-r1" x="46" y="216">The model still writes the answer</text>
  <text class="two-caches-desc two-caches-row two-caches-r2" x="46" y="250">Saves the search, not the generation</text>
  <text class="two-caches-desc two-caches-row two-caches-r3" x="46" y="284">Wrong cache hit still gets a fresh answer</text>
  <text class="two-caches-desc two-caches-row two-caches-r4" x="46" y="318">Invalidated when the index changes</text>
  <rect class="two-caches-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="two-caches-name" x="526" y="122">Cache the answer</text>
  <text class="two-caches-desc" x="526" y="142">Cheaper, riskier.</text>
  <text class="two-caches-desc two-caches-row two-caches-r0" x="526" y="182">Keyed on the query</text>
  <text class="two-caches-desc two-caches-row two-caches-r1" x="526" y="216">Saves the entire request</text>
  <text class="two-caches-desc two-caches-row two-caches-r2" x="526" y="250">Much larger saving</text>
  <text class="two-caches-desc two-caches-row two-caches-r3" x="526" y="284">A near-miss returns the wrong answer</text>
  <text class="two-caches-desc two-caches-row two-caches-r4" x="526" y="318">Must be invalidated on document change</text>
  <text class="two-caches-sub" x="30" y="372">Answer caching needs invalidation tied to the documents it drew on, which is the part usually missed — a cached answer outlives the page it was based on.</text>
</svg>
