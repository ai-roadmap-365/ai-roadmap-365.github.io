<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Defaults that work.">
  <title>A control panel</title>
  <style>
    .control-panel-bg   { fill: #f8fafc; }
    .control-panel-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .control-panel-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .control-panel-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .control-panel-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .control-panel-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .control-panel-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .control-panel-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .control-panel-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .control-panel-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .control-panel-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .control-panel-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .control-panel-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .control-panel-row { opacity: 1; }
    .control-panel-r0 { animation-delay: 0.00s; }
    .control-panel-r1 { animation-delay: 0.45s; }
    .control-panel-r2 { animation-delay: 0.90s; }
    .control-panel-r3 { animation-delay: 1.35s; }
    .control-panel-r4 { animation-delay: 1.80s; }
    .control-panel-row { animation: control-panel-reveal 7.3s ease-in-out infinite; }
    @keyframes control-panel-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="control-panel-bg" width="980" height="390"/>
  <text class="control-panel-h1"  x="30" y="40">A control panel</text>
  <text class="control-panel-sub" x="30" y="64">Defaults that work.</text>
  <rect class="control-panel-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="control-panel-name" x="46" y="122">Everything must be set</text>
  <text class="control-panel-desc" x="46" y="142">Nothing works until it is.</text>
  <text class="control-panel-desc control-panel-row control-panel-r0" x="46" y="182">Every dial must be positioned</text>
  <text class="control-panel-desc control-panel-row control-panel-r1" x="46" y="216">No sensible starting point</text>
  <text class="control-panel-desc control-panel-row control-panel-r2" x="46" y="250">The manual is required</text>
  <text class="control-panel-desc control-panel-row control-panel-r3" x="46" y="284">Most users give up</text>
  <text class="control-panel-desc control-panel-row control-panel-r4" x="46" y="318">This is an over-configured tool</text>
  <rect class="control-panel-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="control-panel-name" x="526" y="122">Sensible defaults</text>
  <text class="control-panel-desc" x="526" y="142">Works immediately.</text>
  <text class="control-panel-desc control-panel-row control-panel-r0" x="526" y="182">Runs correctly out of the box</text>
  <text class="control-panel-desc control-panel-row control-panel-r1" x="526" y="216">Dials available when needed</text>
  <text class="control-panel-desc control-panel-row control-panel-r2" x="526" y="250">The manual is optional</text>
  <text class="control-panel-desc control-panel-row control-panel-r3" x="526" y="284">Most users never touch them</text>
  <text class="control-panel-desc control-panel-row control-panel-r4" x="526" y="318">This is a well-designed tool</text>
  <text class="control-panel-sub" x="30" y="372">The manual being optional is the mark of good defaults, and it is what determines whether a tool is adopted beyond its author.</text>
</svg>
