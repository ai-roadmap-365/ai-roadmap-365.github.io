<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each added a new kind of adversary.">
  <title>Three paradigms of threat modelling</title>
  <style>
    .threat-model-eras-bg   { fill: #f8fafc; }
    .threat-model-eras-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .threat-model-eras-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .threat-model-eras-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .threat-model-eras-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .threat-model-eras-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .threat-model-eras-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .threat-model-eras-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .threat-model-eras-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .threat-model-eras-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .threat-model-eras-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .threat-model-eras-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .threat-model-eras-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .threat-model-eras-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .threat-model-eras-stage { opacity: 1; }

    .threat-model-eras-s0 { animation-delay: 0.00s; }
    .threat-model-eras-e0 { animation-delay: 0.00s; }
    .threat-model-eras-s1 { animation-delay: 1.50s; }
    .threat-model-eras-e1 { animation-delay: 1.50s; }
    .threat-model-eras-s2 { animation-delay: 3.00s; }
    .threat-model-eras-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .threat-model-eras-conn  { animation: threat-model-eras-trace 6s ease-in-out infinite; }
      .threat-model-eras-stage { animation: threat-model-eras-arrive 6s ease-in-out infinite; }
    }
    @keyframes threat-model-eras-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes threat-model-eras-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .threat-model-eras-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .threat-model-eras-stage { animation: threat-model-eras-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes threat-model-eras-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="threat-model-eras-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="threat-model-eras-bg" width="980" height="322"/>
  <text class="threat-model-eras-h1"  x="30" y="40">Three paradigms of threat modelling</text>
  <text class="threat-model-eras-sub" x="30" y="64">Each added a new kind of adversary.</text>
  <g class="threat-model-eras-stage threat-model-eras-s0">
    <rect class="threat-model-eras-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="threat-model-eras-step" x="44" y="142">01</text>
    <text class="threat-model-eras-name" x="70" y="142">STRIDE, 2000-2015</text>
    <text class="threat-model-eras-desc" x="44" y="166">Deterministic architectures. Six categories</text>
    <text class="threat-model-eras-desc" x="44" y="182">that still apply.</text>
  </g>
  <line class="threat-model-eras-line threat-model-eras-conn threat-model-eras-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#threat-model-eras-tip)"/>
  <g class="threat-model-eras-stage threat-model-eras-s1">
    <rect class="threat-model-eras-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="threat-model-eras-step" x="359" y="142">02</text>
    <text class="threat-model-eras-name" x="385" y="142">Cloud and microservices, 2016-2022</text>
    <text class="threat-model-eras-desc" x="359" y="166">Container isolation, IAM boundaries, API</text>
    <text class="threat-model-eras-desc" x="359" y="182">perimeters.</text>
  </g>
  <line class="threat-model-eras-line threat-model-eras-conn threat-model-eras-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#threat-model-eras-tip)"/>
  <g class="threat-model-eras-stage threat-model-eras-s2">
    <rect class="threat-model-eras-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="threat-model-eras-step" x="674" y="142">03</text>
    <text class="threat-model-eras-name" x="700" y="142">OWASP for LLMs, 2023</text>
    <text class="threat-model-eras-desc" x="674" y="166">Indirect injection, embedding denial of</text>
    <text class="threat-model-eras-desc" x="674" y="182">service, autonomous tool abuse.</text>
    <text class="threat-model-eras-edge" x="674" y="242">non-deterministic</text>
  </g>
  <text class="threat-model-eras-sub" x="30" y="304">STRIDE did not become obsolete — the six categories map cleanly onto AI systems — what changed is that one of the data flows now contains an adversary's instructions rather than an adversary's input.</text>
</svg>
