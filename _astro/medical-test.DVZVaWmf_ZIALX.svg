<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One test is not enough.">
  <title>Diagnosing where it hurts</title>
  <style>
    .medical-test-bg   { fill: #f8fafc; }
    .medical-test-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .medical-test-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .medical-test-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .medical-test-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .medical-test-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .medical-test-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .medical-test-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .medical-test-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .medical-test-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .medical-test-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .medical-test-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .medical-test-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .medical-test-row { opacity: 1; }
    .medical-test-r0 { animation-delay: 0.00s; }
    .medical-test-r1 { animation-delay: 0.45s; }
    .medical-test-r2 { animation-delay: 0.90s; }
    .medical-test-r3 { animation-delay: 1.35s; }
    .medical-test-r4 { animation-delay: 1.80s; }
    .medical-test-row { animation: medical-test-reveal 7.3s ease-in-out infinite; }
    @keyframes medical-test-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="medical-test-bg" width="980" height="390"/>
  <text class="medical-test-h1"  x="30" y="40">Diagnosing where it hurts</text>
  <text class="medical-test-sub" x="30" y="64">One test is not enough.</text>
  <rect class="medical-test-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="medical-test-name" x="46" y="122">One overall score</text>
  <text class="medical-test-desc" x="46" y="142">Something is wrong.</text>
  <text class="medical-test-desc medical-test-row medical-test-r0" x="46" y="182">A single number for the whole system</text>
  <text class="medical-test-desc medical-test-row medical-test-r1" x="46" y="216">Falls when anything breaks</text>
  <text class="medical-test-desc medical-test-row medical-test-r2" x="46" y="250">Says nothing about which part</text>
  <text class="medical-test-desc medical-test-row medical-test-r3" x="46" y="284">Every fix is a guess</text>
  <text class="medical-test-desc medical-test-row medical-test-r4" x="46" y="318">This is end-to-end accuracy</text>
  <rect class="medical-test-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="medical-test-name" x="526" y="122">Separate measurements</text>
  <text class="medical-test-desc" x="526" y="142">This part is wrong.</text>
  <text class="medical-test-desc medical-test-row medical-test-r0" x="526" y="182">One measurement per stage</text>
  <text class="medical-test-desc medical-test-row medical-test-r1" x="526" y="216">Identifies which stage failed</text>
  <text class="medical-test-desc medical-test-row medical-test-r2" x="526" y="250">Points at the fix directly</text>
  <text class="medical-test-desc medical-test-row medical-test-r3" x="526" y="284">Improvements are verifiable</text>
  <text class="medical-test-desc medical-test-row medical-test-r4" x="526" y="318">This is the retrieval triad</text>
  <text class="medical-test-sub" x="30" y="372">The diagnostic principle is identical in both settings: an aggregate number establishes that a problem exists and targeted measurements establish where.</text>
</svg>
