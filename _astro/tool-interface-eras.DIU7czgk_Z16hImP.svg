<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From regex to a protocol.">
  <title>Three eras of the tool interface</title>
  <style>
    .tool-interface-eras-bg   { fill: #f8fafc; }
    .tool-interface-eras-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-interface-eras-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-interface-eras-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-interface-eras-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-interface-eras-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-interface-eras-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tool-interface-eras-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tool-interface-eras-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tool-interface-eras-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tool-interface-eras-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tool-interface-eras-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tool-interface-eras-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tool-interface-eras-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tool-interface-eras-stage { opacity: 1; }

    .tool-interface-eras-s0 { animation-delay: 0.00s; }
    .tool-interface-eras-e0 { animation-delay: 0.00s; }
    .tool-interface-eras-s1 { animation-delay: 1.50s; }
    .tool-interface-eras-e1 { animation-delay: 1.50s; }
    .tool-interface-eras-s2 { animation-delay: 3.00s; }
    .tool-interface-eras-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .tool-interface-eras-conn  { animation: tool-interface-eras-trace 6s ease-in-out infinite; }
      .tool-interface-eras-stage { animation: tool-interface-eras-arrive 6s ease-in-out infinite; }
    }
    @keyframes tool-interface-eras-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tool-interface-eras-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tool-interface-eras-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tool-interface-eras-stage { animation: tool-interface-eras-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tool-interface-eras-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tool-interface-eras-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tool-interface-eras-bg" width="980" height="322"/>
  <text class="tool-interface-eras-h1"  x="30" y="40">Three eras of the tool interface</text>
  <text class="tool-interface-eras-sub" x="30" y="64">From regex to a protocol.</text>
  <g class="tool-interface-eras-stage tool-interface-eras-s0">
    <rect class="tool-interface-eras-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="tool-interface-eras-step" x="44" y="142">01</text>
    <text class="tool-interface-eras-name" x="70" y="142">Regex scraping, 2022</text>
    <text class="tool-interface-eras-desc" x="44" y="166">Action: Search[Tokyo population]. Broken by</text>
    <text class="tool-interface-eras-desc" x="44" y="182">brackets, commas and newlines.</text>
  </g>
  <line class="tool-interface-eras-line tool-interface-eras-conn tool-interface-eras-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#tool-interface-eras-tip)"/>
  <g class="tool-interface-eras-stage tool-interface-eras-s1">
    <rect class="tool-interface-eras-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="tool-interface-eras-step" x="359" y="142">02</text>
    <text class="tool-interface-eras-name" x="385" y="142">Function calling, June 2023</text>
    <text class="tool-interface-eras-desc" x="359" y="166">Models trained to emit JSON Schema-conformant</text>
    <text class="tool-interface-eras-desc" x="359" y="182">calls. Adopted industry-wide.</text>
  </g>
  <line class="tool-interface-eras-line tool-interface-eras-conn tool-interface-eras-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#tool-interface-eras-tip)"/>
  <g class="tool-interface-eras-stage tool-interface-eras-s2">
    <rect class="tool-interface-eras-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="tool-interface-eras-step" x="674" y="142">03</text>
    <text class="tool-interface-eras-name" x="700" y="142">MCP, 2024</text>
    <text class="tool-interface-eras-desc" x="674" y="166">JSON-RPC 2.0. One tool server serves any</text>
    <text class="tool-interface-eras-desc" x="674" y="182">client, without SDK lock-in.</text>
  </g>
  <text class="tool-interface-eras-sub" x="30" y="304">The second step moved schema compliance from prompt engineering into the model itself, which is why tool reliability improved discontinuously rather than gradually around mid-2023.</text>
</svg>
