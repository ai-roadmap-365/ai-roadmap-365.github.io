<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And two things it must never be.">
  <title>What the dataset must be</title>
  <style>
    .dataset-not-scrape-bg   { fill: #f8fafc; }
    .dataset-not-scrape-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataset-not-scrape-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataset-not-scrape-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataset-not-scrape-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataset-not-scrape-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataset-not-scrape-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dataset-not-scrape-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dataset-not-scrape-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dataset-not-scrape-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dataset-not-scrape-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dataset-not-scrape-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dataset-not-scrape-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dataset-not-scrape-row { opacity: 1; }
    .dataset-not-scrape-r0 { animation-delay: 0.00s; }
    .dataset-not-scrape-r1 { animation-delay: 0.45s; }
    .dataset-not-scrape-r2 { animation-delay: 0.90s; }
    .dataset-not-scrape-r3 { animation-delay: 1.35s; }
    .dataset-not-scrape-r4 { animation-delay: 1.80s; }
    .dataset-not-scrape-row { animation: dataset-not-scrape-reveal 7.3s ease-in-out infinite; }
    @keyframes dataset-not-scrape-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="dataset-not-scrape-bg" width="980" height="390"/>
  <text class="dataset-not-scrape-h1"  x="30" y="40">What the dataset must be</text>
  <text class="dataset-not-scrape-sub" x="30" y="64">And two things it must never be.</text>
  <rect class="dataset-not-scrape-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="dataset-not-scrape-name" x="46" y="122">Curated</text>
  <text class="dataset-not-scrape-desc" x="46" y="142">Versioned and living.</text>
  <text class="dataset-not-scrape-desc dataset-not-scrape-row dataset-not-scrape-r0" x="46" y="182">Structured JSONL: input, target, tags, difficulty</text>
  <text class="dataset-not-scrape-desc dataset-not-scrape-row dataset-not-scrape-r1" x="46" y="216">Balanced across the four strata</text>
  <text class="dataset-not-scrape-desc dataset-not-scrape-row dataset-not-scrape-r2" x="46" y="250">Version-controlled and immutable per release</text>
  <text class="dataset-not-scrape-desc dataset-not-scrape-row dataset-not-scrape-r3" x="46" y="284">Updated from production failures</text>
  <text class="dataset-not-scrape-desc dataset-not-scrape-row dataset-not-scrape-r4" x="46" y="318">Every example verified</text>
  <rect class="dataset-not-scrape-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="dataset-not-scrape-name" x="526" y="122">Two failure modes</text>
  <text class="dataset-not-scrape-desc" x="526" y="142">Both silently useless.</text>
  <text class="dataset-not-scrape-desc dataset-not-scrape-row dataset-not-scrape-r0" x="526" y="182">An unverified web scrape</text>
  <text class="dataset-not-scrape-desc dataset-not-scrape-row dataset-not-scrape-r1" x="526" y="216">Ground truth nobody checked</text>
  <text class="dataset-not-scrape-desc dataset-not-scrape-row dataset-not-scrape-r2" x="526" y="250">Leakage from training or few-shot examples</text>
  <text class="dataset-not-scrape-desc dataset-not-scrape-row dataset-not-scrape-r3" x="526" y="284">The score measures memorisation</text>
  <text class="dataset-not-scrape-desc dataset-not-scrape-row dataset-not-scrape-r4" x="526" y="318">And it looks excellent</text>
  <text class="dataset-not-scrape-sub" x="30" y="372">Contamination is worse than a small dataset because it is invisible: the suite reports high scores, the scores are real, and they say nothing about performance on anything unseen.</text>
</svg>
