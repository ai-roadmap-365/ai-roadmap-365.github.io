<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four hazards.">
  <title>Where concurrency goes wrong</title>
  <style>
    .concurrency-hazards-bg   { fill: #f8fafc; }
    .concurrency-hazards-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .concurrency-hazards-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .concurrency-hazards-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .concurrency-hazards-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .concurrency-hazards-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .concurrency-hazards-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .concurrency-hazards-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .concurrency-hazards-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .concurrency-hazards-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .concurrency-hazards-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .concurrency-hazards-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .concurrency-hazards-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .concurrency-hazards-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .concurrency-hazards-stage { opacity: 1; }

    .concurrency-hazards-s0 { animation-delay: 0.00s; }
    .concurrency-hazards-e0 { animation-delay: 0.00s; }
    .concurrency-hazards-s1 { animation-delay: 1.28s; }
    .concurrency-hazards-e1 { animation-delay: 1.28s; }
    .concurrency-hazards-s2 { animation-delay: 2.56s; }
    .concurrency-hazards-e2 { animation-delay: 2.56s; }
    .concurrency-hazards-s3 { animation-delay: 3.84s; }
    .concurrency-hazards-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .concurrency-hazards-conn  { animation: concurrency-hazards-trace 6.4s ease-in-out infinite; }
      .concurrency-hazards-stage { animation: concurrency-hazards-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes concurrency-hazards-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes concurrency-hazards-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .concurrency-hazards-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .concurrency-hazards-stage { animation: concurrency-hazards-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes concurrency-hazards-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="concurrency-hazards-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="concurrency-hazards-bg" width="980" height="322"/>
  <text class="concurrency-hazards-h1"  x="30" y="40">Where concurrency goes wrong</text>
  <text class="concurrency-hazards-sub" x="30" y="64">Four hazards.</text>
  <g class="concurrency-hazards-stage concurrency-hazards-s0">
    <rect class="concurrency-hazards-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="concurrency-hazards-step" x="44" y="142">01</text>
    <text class="concurrency-hazards-name" x="70" y="142">Two threads updating shared state race</text>
    <text class="concurrency-hazards-desc" x="44" y="166">Producing results that depend on</text>
    <text class="concurrency-hazards-desc" x="44" y="182">timing.</text>
  </g>
  <line class="concurrency-hazards-line concurrency-hazards-conn concurrency-hazards-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#concurrency-hazards-tip)"/>
  <g class="concurrency-hazards-stage concurrency-hazards-s1">
    <rect class="concurrency-hazards-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="concurrency-hazards-step" x="280" y="142">02</text>
    <text class="concurrency-hazards-name" x="306" y="142">Locks taken in different orders deadlock</text>
    <text class="concurrency-hazards-desc" x="280" y="166">And everything stops.</text>
  </g>
  <line class="concurrency-hazards-line concurrency-hazards-conn concurrency-hazards-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#concurrency-hazards-tip)"/>
  <g class="concurrency-hazards-stage concurrency-hazards-s2">
    <rect class="concurrency-hazards-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="concurrency-hazards-step" x="516" y="142">03</text>
    <text class="concurrency-hazards-name" x="542" y="142">One blocking call stalls an entire event loop</text>
    <text class="concurrency-hazards-desc" x="516" y="166">Silently.</text>
  </g>
  <line class="concurrency-hazards-line concurrency-hazards-conn concurrency-hazards-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#concurrency-hazards-tip)"/>
  <g class="concurrency-hazards-stage concurrency-hazards-s3">
    <rect class="concurrency-hazards-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="concurrency-hazards-step" x="752" y="142">04</text>
    <text class="concurrency-hazards-name" x="778" y="142">And errors in background tasks can vanish</text>
    <text class="concurrency-hazards-desc" x="752" y="166">Unless the result is awaited.</text>
  </g>
  <text class="concurrency-hazards-sub" x="30" y="304">Vanishing errors are the hazard specific to concurrency: a task that fails and whose result nobody checks leaves no trace at all.</text>
</svg>
