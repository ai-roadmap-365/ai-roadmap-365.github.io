<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="What survives the retelling.">
  <title>Reading a description, or seeing it</title>
  <style>
    .describing-bg   { fill: #f8fafc; }
    .describing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .describing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .describing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .describing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .describing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .describing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .describing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .describing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .describing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .describing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .describing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .describing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .describing-row { opacity: 1; }
    .describing-r0 { animation-delay: 0.00s; }
    .describing-r1 { animation-delay: 0.45s; }
    .describing-r2 { animation-delay: 0.90s; }
    .describing-r3 { animation-delay: 1.35s; }
    .describing-r4 { animation-delay: 1.80s; }
    .describing-row { animation: describing-reveal 7.3s ease-in-out infinite; }
    @keyframes describing-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="describing-bg" width="980" height="390"/>
  <text class="describing-h1"  x="30" y="40">Reading a description, or seeing it</text>
  <text class="describing-sub" x="30" y="64">What survives the retelling.</text>
  <rect class="describing-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="describing-name" x="46" y="122">A description</text>
  <text class="describing-desc" x="46" y="142">Someone chose what mattered.</text>
  <text class="describing-desc describing-row describing-r0" x="46" y="182">Only what the describer noticed</text>
  <text class="describing-desc describing-row describing-r1" x="46" y="216">Spatial relationships mostly lost</text>
  <text class="describing-desc describing-row describing-r2" x="46" y="250">Cannot be questioned further</text>
  <text class="describing-desc describing-row describing-r3" x="46" y="284">Fixed before the question was asked</text>
  <text class="describing-desc describing-row describing-r4" x="46" y="318">This is a caption pipeline</text>
  <rect class="describing-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="describing-name" x="526" y="122">Seeing it</text>
  <text class="describing-desc" x="526" y="142">Everything is available.</text>
  <text class="describing-desc describing-row describing-r0" x="526" y="182">The whole image attended to</text>
  <text class="describing-desc describing-row describing-r1" x="526" y="216">Position and layout preserved</text>
  <text class="describing-desc describing-row describing-r2" x="526" y="250">Any detail available on demand</text>
  <text class="describing-desc describing-row describing-r3" x="526" y="284">Questions answered after the fact</text>
  <text class="describing-desc describing-row describing-r4" x="526" y="318">This is a vision-language model</text>
  <text class="describing-sub" x="30" y="372">The description being fixed before the question is the crux: no captioner can anticipate every question, and everything it omitted is permanently unavailable.</text>
</svg>
