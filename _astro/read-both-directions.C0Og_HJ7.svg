<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Once for what broke, once for what you can change.">
  <title>Read a traceback twice, in both directions</title>
  <style>
    .read-both-directions-bg   { fill: #f8fafc; }
    .read-both-directions-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .read-both-directions-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .read-both-directions-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .read-both-directions-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .read-both-directions-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .read-both-directions-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .read-both-directions-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .read-both-directions-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .read-both-directions-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .read-both-directions-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .read-both-directions-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .read-both-directions-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .read-both-directions-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .read-both-directions-stage { opacity: 1; }

    .read-both-directions-s0 { animation-delay: 0.00s; }
    .read-both-directions-e0 { animation-delay: 0.00s; }
    .read-both-directions-s1 { animation-delay: 1.28s; }
    .read-both-directions-e1 { animation-delay: 1.28s; }
    .read-both-directions-s2 { animation-delay: 2.56s; }
    .read-both-directions-e2 { animation-delay: 2.56s; }
    .read-both-directions-s3 { animation-delay: 3.84s; }
    .read-both-directions-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .read-both-directions-conn  { animation: read-both-directions-trace 6.4s ease-in-out infinite; }
      .read-both-directions-stage { animation: read-both-directions-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes read-both-directions-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes read-both-directions-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .read-both-directions-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .read-both-directions-stage { animation: read-both-directions-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes read-both-directions-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="read-both-directions-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="read-both-directions-bg" width="980" height="322"/>
  <text class="read-both-directions-h1"  x="30" y="40">Read a traceback twice, in both directions</text>
  <text class="read-both-directions-sub" x="30" y="64">Once for what broke, once for what you can change.</text>
  <g class="read-both-directions-stage read-both-directions-s0">
    <rect class="read-both-directions-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="read-both-directions-step" x="44" y="142">01</text>
    <text class="read-both-directions-name" x="70" y="142">Read the header</text>
    <text class="read-both-directions-desc" x="44" y="166">"Most recent call last" tells</text>
    <text class="read-both-directions-desc" x="44" y="182">you which way round it is.</text>
    <text class="read-both-directions-edge" x="44" y="242">orientation</text>
  </g>
  <line class="read-both-directions-line read-both-directions-conn read-both-directions-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#read-both-directions-tip)"/>
  <g class="read-both-directions-stage read-both-directions-s1">
    <rect class="read-both-directions-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="read-both-directions-step" x="280" y="142">02</text>
    <text class="read-both-directions-name" x="306" y="142">Bottom line: WHAT broke</text>
    <text class="read-both-directions-desc" x="280" y="166">The exception type and its</text>
    <text class="read-both-directions-desc" x="280" y="182">value. The category and the</text>
    <text class="read-both-directions-desc" x="280" y="198">specific.</text>
    <text class="read-both-directions-edge" x="280" y="242">the error</text>
  </g>
  <line class="read-both-directions-line read-both-directions-conn read-both-directions-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#read-both-directions-tip)"/>
  <g class="read-both-directions-stage read-both-directions-s2">
    <rect class="read-both-directions-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="read-both-directions-step" x="516" y="142">03</text>
    <text class="read-both-directions-name" x="542" y="142">Upward: HOW you got there</text>
    <text class="read-both-directions-desc" x="516" y="166">Each frame is one call, oldest</text>
    <text class="read-both-directions-desc" x="516" y="182">at the top.</text>
  </g>
  <line class="read-both-directions-line read-both-directions-conn read-both-directions-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#read-both-directions-tip)"/>
  <g class="read-both-directions-stage read-both-directions-s3">
    <rect class="read-both-directions-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="read-both-directions-step" x="752" y="142">04</text>
    <text class="read-both-directions-name" x="778" y="142">Downward: YOUR last frame</text>
    <text class="read-both-directions-desc" x="752" y="166">In a library traceback, that is</text>
    <text class="read-both-directions-desc" x="752" y="182">the only line you can change.</text>
    <text class="read-both-directions-edge" x="752" y="242">your line</text>
  </g>
  <text class="read-both-directions-sub" x="30" y="304">Most people read the last line and stop, which discards two thirds of the information. The frames are what turn "a dictionary lacked a key" into "this call passed the wrong rows".</text>
</svg>
