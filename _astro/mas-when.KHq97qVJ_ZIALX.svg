<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to split the agent</title>
  <style>
    .mas-when-bg   { fill: #f8fafc; }
    .mas-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mas-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mas-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mas-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mas-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mas-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mas-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mas-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mas-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mas-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mas-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mas-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mas-when-row { opacity: 1; }
    .mas-when-r0 { animation-delay: 0.00s; }
    .mas-when-r1 { animation-delay: 0.45s; }
    .mas-when-r2 { animation-delay: 0.90s; }
    .mas-when-r3 { animation-delay: 1.35s; }
    .mas-when-r4 { animation-delay: 1.80s; }
    .mas-when-row { animation: mas-when-reveal 7.3s ease-in-out infinite; }
    @keyframes mas-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="mas-when-bg" width="980" height="390"/>
  <text class="mas-when-h1"  x="30" y="40">When to split the agent</text>
  <text class="mas-when-sub" x="30" y="64">And when not to.</text>
  <rect class="mas-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="mas-when-name" x="46" y="122">Split it</text>
  <text class="mas-when-desc" x="46" y="142">Distinct expertise or tools.</text>
  <text class="mas-when-desc mas-when-row mas-when-r0" x="46" y="182">More tools than one agent selects well among</text>
  <text class="mas-when-desc mas-when-row mas-when-r1" x="46" y="216">Genuinely distinct domains of expertise</text>
  <text class="mas-when-desc mas-when-row mas-when-r2" x="46" y="250">A critic that must be independent</text>
  <text class="mas-when-desc mas-when-row mas-when-r3" x="46" y="284">Independent sub-tasks that can run in parallel</text>
  <text class="mas-when-desc mas-when-row mas-when-r4" x="46" y="318">High-stakes decisions needing consensus</text>
  <rect class="mas-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="mas-when-name" x="526" y="122">Keep it single</text>
  <text class="mas-when-desc" x="526" y="142">Most tasks.</text>
  <text class="mas-when-desc mas-when-row mas-when-r0" x="526" y="182">A straightforward query</text>
  <text class="mas-when-desc mas-when-row mas-when-r1" x="526" y="216">One domain, few tools</text>
  <text class="mas-when-desc mas-when-row mas-when-r2" x="526" y="250">Latency matters</text>
  <text class="mas-when-desc mas-when-row mas-when-r3" x="526" y="284">Cost matters</text>
  <text class="mas-when-desc mas-when-row mas-when-r4" x="526" y="318">Single agents are more reliable here</text>
  <text class="mas-when-sub" x="30" y="372">"More tools than one agent selects well among" is the most usable trigger, because it is measurable: when tool-selection errors start appearing in traces, the tool inventory has outgrown one context.</text>
</svg>
