<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things recursion is not</title>
  <style>
    .recursion-not-bg   { fill: #f8fafc; }
    .recursion-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recursion-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recursion-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recursion-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recursion-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recursion-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .recursion-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .recursion-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .recursion-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .recursion-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .recursion-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .recursion-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .recursion-not-row { opacity: 1; }
    .recursion-not-r0 { animation-delay: 0.00s; }
    .recursion-not-r1 { animation-delay: 0.45s; }
    .recursion-not-r2 { animation-delay: 0.90s; }
    .recursion-not-r3 { animation-delay: 1.35s; }
    .recursion-not-r4 { animation-delay: 1.80s; }
    .recursion-not-row { animation: recursion-not-reveal 7.3s ease-in-out infinite; }
    @keyframes recursion-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="recursion-not-bg" width="980" height="390"/>
  <text class="recursion-not-h1"  x="30" y="40">Four things recursion is not</text>
  <text class="recursion-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="recursion-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="recursion-not-name" x="46" y="122">The misconception</text>
  <text class="recursion-not-desc" x="46" y="142">Commonly held.</text>
  <text class="recursion-not-desc recursion-not-row recursion-not-r0" x="46" y="182">Recursion is always elegant</text>
  <text class="recursion-not-desc recursion-not-row recursion-not-r1" x="46" y="216">It is inherently slow</text>
  <text class="recursion-not-desc recursion-not-row recursion-not-r2" x="46" y="250">Python optimises tail calls</text>
  <text class="recursion-not-desc recursion-not-row recursion-not-r3" x="46" y="284">Any loop can be written recursively and should</text>
  <text class="recursion-not-desc recursion-not-row recursion-not-r4" x="46" y="318">Deep recursion is fine</text>
  <rect class="recursion-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="recursion-not-name" x="526" y="122">What is true</text>
  <text class="recursion-not-desc" x="526" y="142">Actually.</text>
  <text class="recursion-not-desc recursion-not-row recursion-not-r0" x="526" y="182">It is elegant for recursive structures only</text>
  <text class="recursion-not-desc recursion-not-row recursion-not-r1" x="526" y="216">Naive tree recursion is; the shape is the problem</text>
  <text class="recursion-not-desc recursion-not-row recursion-not-r2" x="526" y="250">It does not; the stack still grows</text>
  <text class="recursion-not-desc recursion-not-row recursion-not-r3" x="526" y="284">It can be, and usually should not</text>
  <text class="recursion-not-desc recursion-not-row recursion-not-r4" x="526" y="318">The limit is about a thousand frames</text>
  <text class="recursion-not-sub" x="30" y="372">The absence of tail-call optimisation is a deliberate design decision, and it means deep linear recursion should be written as a loop.</text>
</svg>
