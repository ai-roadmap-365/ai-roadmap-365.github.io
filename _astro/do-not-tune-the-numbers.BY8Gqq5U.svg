<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Adjusting the hours until it passes.">
  <title>The one way to make this worse</title>
  <style>
    .do-not-tune-the-numbers-bg   { fill: #f8fafc; }
    .do-not-tune-the-numbers-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .do-not-tune-the-numbers-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .do-not-tune-the-numbers-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .do-not-tune-the-numbers-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .do-not-tune-the-numbers-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .do-not-tune-the-numbers-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .do-not-tune-the-numbers-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .do-not-tune-the-numbers-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .do-not-tune-the-numbers-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .do-not-tune-the-numbers-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .do-not-tune-the-numbers-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .do-not-tune-the-numbers-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .do-not-tune-the-numbers-row { opacity: 1; }
    .do-not-tune-the-numbers-r0 { animation-delay: 0.00s; }
    .do-not-tune-the-numbers-r1 { animation-delay: 0.45s; }
    .do-not-tune-the-numbers-r2 { animation-delay: 0.90s; }
    .do-not-tune-the-numbers-r3 { animation-delay: 1.35s; }
    .do-not-tune-the-numbers-r4 { animation-delay: 1.80s; }
    .do-not-tune-the-numbers-row { animation: do-not-tune-the-numbers-reveal 7.3s ease-in-out infinite; }
    @keyframes do-not-tune-the-numbers-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="do-not-tune-the-numbers-bg" width="980" height="390"/>
  <text class="do-not-tune-the-numbers-h1"  x="30" y="40">The one way to make this worse</text>
  <text class="do-not-tune-the-numbers-sub" x="30" y="64">Adjusting the hours until it passes.</text>
  <rect class="do-not-tune-the-numbers-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="do-not-tune-the-numbers-name" x="46" y="122">Honest use</text>
  <text class="do-not-tune-the-numbers-desc" x="46" y="142">An uncomfortable constraint.</text>
  <text class="do-not-tune-the-numbers-desc do-not-tune-the-numbers-row do-not-tune-the-numbers-r0" x="46" y="182">Available hours from what last month contained</text>
  <text class="do-not-tune-the-numbers-desc do-not-tune-the-numbers-row do-not-tune-the-numbers-r1" x="46" y="216">Calibration from what you measured</text>
  <text class="do-not-tune-the-numbers-desc do-not-tune-the-numbers-row do-not-tune-the-numbers-r2" x="46" y="250">Run it when the plan feels fine</text>
  <text class="do-not-tune-the-numbers-desc do-not-tune-the-numbers-row do-not-tune-the-numbers-r3" x="46" y="284">A plan that feels fine can be 3x over</text>
  <text class="do-not-tune-the-numbers-desc do-not-tune-the-numbers-row do-not-tune-the-numbers-r4" x="46" y="318">Re-run every quarter, ratio updated</text>
  <rect class="do-not-tune-the-numbers-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="do-not-tune-the-numbers-name" x="526" y="122">Tuned until it passes</text>
  <text class="do-not-tune-the-numbers-desc" x="526" y="142">A false reassurance.</text>
  <text class="do-not-tune-the-numbers-desc do-not-tune-the-numbers-row do-not-tune-the-numbers-r0" x="526" y="182">Available hours raised to fit</text>
  <text class="do-not-tune-the-numbers-desc do-not-tune-the-numbers-row do-not-tune-the-numbers-r1" x="526" y="216">Calibration quietly set to 1.0</text>
  <text class="do-not-tune-the-numbers-desc do-not-tune-the-numbers-row do-not-tune-the-numbers-r2" x="526" y="250">Run only when doubt has already set in</text>
  <text class="do-not-tune-the-numbers-desc do-not-tune-the-numbers-row do-not-tune-the-numbers-r3" x="526" y="284">The feeling is not the check</text>
  <text class="do-not-tune-the-numbers-desc do-not-tune-the-numbers-row do-not-tune-the-numbers-r4" x="526" y="318">Worse than not doing it at all</text>
  <text class="do-not-tune-the-numbers-sub" x="30" y="372">It is worse than skipping the process because it converts an honest constraint into a reassurance you will then act on — and the failure still arrives in week three, now with a document saying it should not have.</text>
</svg>
