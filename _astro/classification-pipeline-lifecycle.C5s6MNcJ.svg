<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="Classification Pipeline Lifecycle">
  <title>The 8-Phase Classification Project Lifecycle</title>
  <defs>
    <style>
      .d161a-bg { fill: #f8fafc; }
      .d161a-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 6; }
      .d161a-header { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; }
      .d161a-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
      .d161a-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
      .d161a-arrow { stroke: #2563eb; stroke-width: 2; marker-end: url(#d161a-arr); fill: none; }
      .d161a-gate { fill: #fef2f2; stroke: #ef4444; stroke-width: 2; rx: 6; }
    </style>
    <marker id="d161a-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="d161a-bg" />

  <text x="40" y="45" class="d161a-header" font-size="22">The 8-Phase Disciplined Classification Lifecycle</text>
  <text x="40" y="70" class="d161a-text" font-size="13">Strict isolation boundaries preventing data leakage and ensuring production reliability</text>

  <!-- Row 1: Phases 1 to 4 -->
  <!-- Phase 1 -->
  <rect x="40" y="110" width="180" height="130" class="d161a-box" />
  <text x="55" y="135" class="d161a-title" fill="#1e40af">1. Framing &amp; Baseline</text>
  <text x="55" y="160" class="d161a-text">• Problem definition</text>
  <text x="55" y="180" class="d161a-text">• Majority class rate</text>
  <text x="55" y="200" class="d161a-text">• Asymmetric cost definition</text>

  <path d="M 220 175 L 255 175" class="d161a-arrow" />

  <!-- Phase 2 -->
  <rect x="260" y="110" width="180" height="130" class="d161a-box" />
  <text x="275" y="135" class="d161a-title" fill="#1e40af">2. Stratified 3-Way Split</text>
  <text x="275" y="160" class="d161a-text">• 60% Train / 20% Val</text>
  <text x="275" y="180" class="d161a-text">• 20% Untouched Test</text>
  <text x="275" y="200" class="d161a-text">• Preserves class ratio</text>

  <path d="M 440 175 L 475 175" class="d161a-arrow" />

  <!-- Phase 3 -->
  <rect x="480" y="110" width="180" height="130" class="d161a-box" />
  <text x="495" y="135" class="d161a-title" fill="#1e40af">3. Scaling Isolation</text>
  <text x="495" y="160" class="d161a-text">• Fit scaler on Train only</text>
  <text x="495" y="180" class="d161a-text">• Transform Val and Test</text>
  <text x="495" y="200" class="d161a-text">• Zero distribution leakage</text>

  <path d="M 660 175 L 695 175" class="d161a-arrow" />

  <!-- Phase 4 -->
  <rect x="700" y="110" width="160" height="130" class="d161a-box" />
  <text x="715" y="135" class="d161a-title" fill="#1e40af">4. Model Benchmark</text>
  <text x="715" y="160" class="d161a-text">• Stratified 5-Fold CV</text>
  <text x="715" y="180" class="d161a-text">• LR vs KNN vs NB</text>
  <text x="715" y="200" class="d161a-text">• Paired fold comparison</text>

  <!-- Transition Arrow to Row 2 -->
  <path d="M 780 240 L 780 275 L 700 275" class="d161a-arrow" />

  <!-- Row 2: Phases 5 to 8 -->
  <!-- Phase 5 -->
  <rect x="40" y="290" width="180" height="130" class="d161a-box" />
  <text x="55" y="315" class="d161a-title" fill="#15803d">5. Threshold Tuning</text>
  <text x="55" y="340" class="d161a-text">• Calibrate on Val split</text>
  <text x="55" y="360" class="d161a-text">• Minimize C_FP + C_FN</text>
  <text x="55" y="380" class="d161a-text">• Find optimal tau*</text>

  <path d="M 220 355 L 255 355" class="d161a-arrow" />

  <!-- Phase 6 -->
  <rect x="260" y="290" width="180" height="130" class="d161a-gate" />
  <text x="275" y="315" class="d161a-title" fill="#991b1b">6. Gated Test Evaluation</text>
  <text x="275" y="340" class="d161a-text">• ONE single execution</text>
  <text x="275" y="360" class="d161a-text">• Unbiased test metrics</text>
  <text x="275" y="380" class="d161a-text">• Absolute sign-off check</text>

  <path d="M 440 355 L 475 355" class="d161a-arrow" />

  <!-- Phase 7 -->
  <rect x="480" y="290" width="180" height="130" class="d161a-box" />
  <text x="495" y="315" class="d161a-title" fill="#1e40af">7. Error Diagnostics</text>
  <text x="495" y="340" class="d161a-text">• False positive review</text>
  <text x="495" y="360" class="d161a-text">• False negative audit</text>
  <text x="495" y="380" class="d161a-text">• Subgroup fairness checks</text>

  <path d="M 660 355 L 695 355" class="d161a-arrow" />

  <!-- Phase 8 -->
  <rect x="700" y="290" width="160" height="130" class="d161a-box" fill="#f0fdf4" stroke="#86efac" />
  <text x="715" y="315" class="d161a-title" fill="#166534">8. Deployment</text>
  <text x="715" y="340" class="d161a-text">• Export pipeline artifact</text>
  <text x="715" y="360" class="d161a-text">• Latency benchmark</text>
  <text x="715" y="380" class="d161a-text">• Production endpoint</text>
</svg>
