<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Same four steps whatever the style.">
  <title>The pagination loop, and where it goes wrong</title>
  <style>
    .pagination-loop-bg   { fill: #f8fafc; }
    .pagination-loop-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pagination-loop-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pagination-loop-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pagination-loop-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pagination-loop-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pagination-loop-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pagination-loop-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pagination-loop-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pagination-loop-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pagination-loop-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pagination-loop-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pagination-loop-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pagination-loop-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pagination-loop-stage { opacity: 1; }

    .pagination-loop-s0 { animation-delay: 0.00s; }
    .pagination-loop-e0 { animation-delay: 0.00s; }
    .pagination-loop-s1 { animation-delay: 1.28s; }
    .pagination-loop-e1 { animation-delay: 1.28s; }
    .pagination-loop-s2 { animation-delay: 2.56s; }
    .pagination-loop-e2 { animation-delay: 2.56s; }
    .pagination-loop-s3 { animation-delay: 3.84s; }
    .pagination-loop-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .pagination-loop-conn  { animation: pagination-loop-trace 6.4s ease-in-out infinite; }
      .pagination-loop-stage { animation: pagination-loop-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes pagination-loop-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pagination-loop-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pagination-loop-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pagination-loop-stage { animation: pagination-loop-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pagination-loop-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pagination-loop-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pagination-loop-bg" width="980" height="322"/>
  <text class="pagination-loop-h1"  x="30" y="40">The pagination loop, and where it goes wrong</text>
  <text class="pagination-loop-sub" x="30" y="64">Same four steps whatever the style.</text>
  <g class="pagination-loop-stage pagination-loop-s0">
    <rect class="pagination-loop-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="pagination-loop-step" x="44" y="142">01</text>
    <text class="pagination-loop-name" x="70" y="142">Request a page</text>
    <text class="pagination-loop-desc" x="44" y="166">With an offset, a page number,</text>
    <text class="pagination-loop-desc" x="44" y="182">or a cursor.</text>
  </g>
  <line class="pagination-loop-line pagination-loop-conn pagination-loop-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#pagination-loop-tip)"/>
  <g class="pagination-loop-stage pagination-loop-s1">
    <rect class="pagination-loop-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="pagination-loop-step" x="280" y="142">02</text>
    <text class="pagination-loop-name" x="306" y="142">Collect the items</text>
    <text class="pagination-loop-desc" x="280" y="166">Append them. Do not process here</text>
    <text class="pagination-loop-desc" x="280" y="182">if you can help it.</text>
  </g>
  <line class="pagination-loop-line pagination-loop-conn pagination-loop-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#pagination-loop-tip)"/>
  <g class="pagination-loop-stage pagination-loop-s2">
    <rect class="pagination-loop-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="pagination-loop-step" x="516" y="142">03</text>
    <text class="pagination-loop-name" x="542" y="142">Find the next signal</text>
    <text class="pagination-loop-desc" x="516" y="166">A next page number, a Link</text>
    <text class="pagination-loop-desc" x="516" y="182">header, or a cursor in the body.</text>
    <text class="pagination-loop-edge" x="516" y="242">next</text>
  </g>
  <line class="pagination-loop-line pagination-loop-conn pagination-loop-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#pagination-loop-tip)"/>
  <g class="pagination-loop-stage pagination-loop-s3">
    <rect class="pagination-loop-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="pagination-loop-step" x="752" y="142">04</text>
    <text class="pagination-loop-name" x="778" y="142">Stop on empty — or on the cap</text>
    <text class="pagination-loop-desc" x="752" y="166">An exhausted collection, OR a</text>
    <text class="pagination-loop-desc" x="752" y="182">maximum page count you set.</text>
    <text class="pagination-loop-edge" x="752" y="242">both</text>
  </g>
  <text class="pagination-loop-sub" x="30" y="304">The cap is the part people omit. A buggy or hostile next link that points at itself will loop forever, and the ceiling costs one line.</text>
</svg>
