<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what to leave real.">
  <title>What to double</title>
  <style>
    .mock-when-bg   { fill: #f8fafc; }
    .mock-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mock-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mock-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mock-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mock-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mock-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mock-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mock-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mock-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mock-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mock-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mock-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mock-when-row { opacity: 1; }
    .mock-when-r0 { animation-delay: 0.00s; }
    .mock-when-r1 { animation-delay: 0.45s; }
    .mock-when-r2 { animation-delay: 0.90s; }
    .mock-when-r3 { animation-delay: 1.35s; }
    .mock-when-r4 { animation-delay: 1.80s; }
    .mock-when-row { animation: mock-when-reveal 7.3s ease-in-out infinite; }
    @keyframes mock-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="mock-when-bg" width="980" height="390"/>
  <text class="mock-when-h1"  x="30" y="40">What to double</text>
  <text class="mock-when-sub" x="30" y="64">And what to leave real.</text>
  <rect class="mock-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="mock-when-name" x="46" y="122">Use a double</text>
  <text class="mock-when-desc" x="46" y="142">Four cases.</text>
  <text class="mock-when-desc mock-when-row mock-when-r0" x="46" y="182">Network and external APIs</text>
  <text class="mock-when-desc mock-when-row mock-when-r1" x="46" y="216">Model calls, always</text>
  <text class="mock-when-desc mock-when-row mock-when-r2" x="46" y="250">The clock and randomness</text>
  <text class="mock-when-desc mock-when-row mock-when-r3" x="46" y="284">Anything slow or costly</text>
  <text class="mock-when-desc mock-when-row mock-when-r4" x="46" y="318">Anything with side effects you cannot undo</text>
  <rect class="mock-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="mock-when-name" x="526" y="122">Leave it real</text>
  <text class="mock-when-desc" x="526" y="142">Also four.</text>
  <text class="mock-when-desc mock-when-row mock-when-r0" x="526" y="182">Your own logic under test</text>
  <text class="mock-when-desc mock-when-row mock-when-r1" x="526" y="216">Pure functions</text>
  <text class="mock-when-desc mock-when-row mock-when-r2" x="526" y="250">Fast in-memory structures</text>
  <text class="mock-when-desc mock-when-row mock-when-r3" x="526" y="284">A lightweight fake, in preference to a mock</text>
  <text class="mock-when-desc mock-when-row mock-when-r4" x="526" y="318">Which keeps the test honest</text>
  <text class="mock-when-sub" x="30" y="372">Preferring a fake to a mock wherever one is practical is the single change that most reduces test brittleness in an existing suite.</text>
</svg>
