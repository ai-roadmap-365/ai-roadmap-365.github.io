<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Sparse and meaningless, or dense and learned.">
  <title>One-hot, or embedded</title>
  <style>
    .onehot-or-embedding-bg   { fill: #f8fafc; }
    .onehot-or-embedding-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .onehot-or-embedding-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .onehot-or-embedding-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .onehot-or-embedding-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .onehot-or-embedding-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .onehot-or-embedding-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .onehot-or-embedding-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .onehot-or-embedding-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .onehot-or-embedding-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .onehot-or-embedding-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .onehot-or-embedding-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .onehot-or-embedding-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .onehot-or-embedding-row { opacity: 1; }
    .onehot-or-embedding-r0 { animation-delay: 0.00s; }
    .onehot-or-embedding-r1 { animation-delay: 0.45s; }
    .onehot-or-embedding-r2 { animation-delay: 0.90s; }
    .onehot-or-embedding-r3 { animation-delay: 1.35s; }
    .onehot-or-embedding-r4 { animation-delay: 1.80s; }
    .onehot-or-embedding-row { animation: onehot-or-embedding-reveal 7.3s ease-in-out infinite; }
    @keyframes onehot-or-embedding-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="onehot-or-embedding-bg" width="980" height="390"/>
  <text class="onehot-or-embedding-h1"  x="30" y="40">One-hot, or embedded</text>
  <text class="onehot-or-embedding-sub" x="30" y="64">Sparse and meaningless, or dense and learned.</text>
  <rect class="onehot-or-embedding-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="onehot-or-embedding-name" x="46" y="122">One-hot</text>
  <text class="onehot-or-embedding-desc" x="46" y="142">A vector per vocabulary entry.</text>
  <text class="onehot-or-embedding-desc onehot-or-embedding-row onehot-or-embedding-r0" x="46" y="182">Fifty thousand dimensions, one non-zero</text>
  <text class="onehot-or-embedding-desc onehot-or-embedding-row onehot-or-embedding-r1" x="46" y="216">Every pair of words equidistant</text>
  <text class="onehot-or-embedding-desc onehot-or-embedding-row onehot-or-embedding-r2" x="46" y="250">No notion of similarity at all</text>
  <text class="onehot-or-embedding-desc onehot-or-embedding-row onehot-or-embedding-r3" x="46" y="284">Enormous first-layer weight matrix</text>
  <text class="onehot-or-embedding-desc onehot-or-embedding-row onehot-or-embedding-r4" x="46" y="318">And nothing shared between related words</text>
  <rect class="onehot-or-embedding-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="onehot-or-embedding-name" x="526" y="122">Embedded</text>
  <text class="onehot-or-embedding-desc" x="526" y="142">A few hundred dimensions.</text>
  <text class="onehot-or-embedding-desc onehot-or-embedding-row onehot-or-embedding-r0" x="526" y="182">Dense, learned values</text>
  <text class="onehot-or-embedding-desc onehot-or-embedding-row onehot-or-embedding-r1" x="526" y="216">Similar words are geometrically close</text>
  <text class="onehot-or-embedding-desc onehot-or-embedding-row onehot-or-embedding-r2" x="526" y="250">Similarity is computable</text>
  <text class="onehot-or-embedding-desc onehot-or-embedding-row onehot-or-embedding-r3" x="526" y="284">A compact lookup table</text>
  <text class="onehot-or-embedding-desc onehot-or-embedding-row onehot-or-embedding-r4" x="526" y="318">And knowledge shared across related words</text>
  <text class="onehot-or-embedding-sub" x="30" y="372">The sharing is what produces the generalisation: a model that learns something about one word gets part of it for free for every word nearby in the embedding space.</text>
</svg>
