<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One word at a time, committed.">
  <title>A storyteller improvising</title>
  <style>
    .autopilot-bg   { fill: #f8fafc; }
    .autopilot-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .autopilot-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .autopilot-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .autopilot-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .autopilot-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .autopilot-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .autopilot-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .autopilot-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .autopilot-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .autopilot-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .autopilot-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .autopilot-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .autopilot-row { opacity: 1; }
    .autopilot-r0 { animation-delay: 0.00s; }
    .autopilot-r1 { animation-delay: 0.45s; }
    .autopilot-r2 { animation-delay: 0.90s; }
    .autopilot-r3 { animation-delay: 1.35s; }
    .autopilot-r4 { animation-delay: 1.80s; }
    .autopilot-row { animation: autopilot-reveal 7.3s ease-in-out infinite; }
    @keyframes autopilot-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="autopilot-bg" width="980" height="390"/>
  <text class="autopilot-h1"  x="30" y="40">A storyteller improvising</text>
  <text class="autopilot-sub" x="30" y="64">One word at a time, committed.</text>
  <rect class="autopilot-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="autopilot-name" x="46" y="122">Improvising live</text>
  <text class="autopilot-desc" x="46" y="142">Committed, word by word.</text>
  <text class="autopilot-desc autopilot-row autopilot-r0" x="46" y="182">Each word spoken cannot be taken back</text>
  <text class="autopilot-desc autopilot-row autopilot-r1" x="46" y="216">The next word conditioned on what was said</text>
  <text class="autopilot-desc autopilot-row autopilot-r2" x="46" y="250">No planning ahead beyond a phrase</text>
  <text class="autopilot-desc autopilot-row autopilot-r3" x="46" y="284">A bad choice must be built on</text>
  <text class="autopilot-desc autopilot-row autopilot-r4" x="46" y="318">This is autoregressive generation</text>
  <rect class="autopilot-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="autopilot-name" x="526" y="122">Writing with revision</text>
  <text class="autopilot-desc" x="526" y="142">Nothing is final.</text>
  <text class="autopilot-desc autopilot-row autopilot-r0" x="526" y="182">Draft, then reconsider</text>
  <text class="autopilot-desc autopilot-row autopilot-r1" x="526" y="216">Later text can change earlier text</text>
  <text class="autopilot-desc autopilot-row autopilot-r2" x="526" y="250">Global structure planned first</text>
  <text class="autopilot-desc autopilot-row autopilot-r3" x="526" y="284">Mistakes edited out</text>
  <text class="autopilot-desc autopilot-row autopilot-r4" x="526" y="318">Which a decoder cannot do</text>
  <text class="autopilot-sub" x="30" y="372">The inability to revise is a real architectural constraint and it is why chain-of-thought prompting helps: writing intermediate reasoning gives the model tokens to condition on that it would otherwise have had to plan silently.</text>
</svg>
