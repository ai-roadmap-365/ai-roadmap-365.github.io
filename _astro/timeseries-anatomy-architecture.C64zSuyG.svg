<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="d131aTitleId d131aDescId">
  <title id="d131aTitleId">Anatomy of a time series chart: trend, a seasonal cycle, an annotated event, a genuine gap, and a trailing window's lag against a centred window over the same peak</title>
  <desc id="d131aDescId">A static diagram in two stacked panels. The top panel draws one time series with a rising trend, a repeating seasonal wiggle riding on it, a vertical dashed line marking an annotated event, and a real gap where the line stops and resumes later with no interpolation drawn across it. The bottom panel isolates one peak and draws three curves over it: the true raw shape, a centred rolling mean that peaks in exactly the same place, and a trailing rolling mean whose peak is visibly shifted to the right, with a labelled arrow measuring that lag.</desc>

  <style>
    .d131a-bg      { fill: #f8fafc; }
    .d131a-title   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 19px; font-weight: 600; fill: #1a202c; }
    .d131a-panel   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; fill: #1a202c; }
    .d131a-label   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1a202c; }
    .d131a-small   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d131a-axis    { stroke: #94a3b8; stroke-width: 1.5; }
    .d131a-series  { fill: none; stroke: #1d4ed8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .d131a-raw     { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 4 4; }
    .d131a-trail   { fill: none; stroke: #b91c1c; stroke-width: 2.5; }
    .d131a-cent    { fill: none; stroke: #047857; stroke-width: 2.5; }
    .d131a-event   { stroke: #b91c1c; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .d131a-gapbox  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1; }
    .d131a-box     { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.25; }
    .d131a-dot     { fill: #1d4ed8; }
    .d131a-dotR    { fill: #b91c1c; }
    .d131a-dotG    { fill: #047857; }
  </style>

  <rect class="d131a-bg" x="0" y="0" width="960" height="620" />
  <text class="d131a-title" x="32" y="36">Anatomy of a time series -- what one honest chart carries</text>

  <!-- ===================== Panel A: one series, annotated ===================== -->
  <text class="d131a-panel" x="32" y="66">Trend, season, event and a genuine gap</text>
  <line class="d131a-axis" x1="40" y1="300" x2="920" y2="300" />
  <line class="d131a-axis" x1="40" y1="80" x2="40" y2="300" />
  <text class="d131a-small" x="44" y="94">value</text>
  <text class="d131a-small" x="860" y="316">time (parsed datetime axis)</text>

  <!-- Trend guide (dashed straight-ish reference under the real curve) -->
  <path class="d131a-raw" d="M 40,300 L 920,118" />
  <text class="d131a-small" x="620" y="150" fill="#64748b">trend (dashed guide)</text>

  <!-- The real series: segment 1, gap, segment 2, drawn from the computed points below -->
  <path class="d131a-series" d="M 40.0,300.0 L 54.9,285.1 L 69.8,271.4 L 84.7,259.7 L 99.7,251.0 L 114.6,245.8 L 129.5,244.2 L 144.4,246.0 L 159.3,250.8 L 174.2,257.8 L 189.2,266.0 L 204.1,274.2 L 219.0,281.4 L 233.9,286.5 L 248.8,288.7 L 263.7,287.5 L 278.6,282.6 L 293.6,274.3 L 308.5,262.9" />
  <path class="d131a-series" d="M 517.3,213.6 L 532.2,219.0 L 547.1,221.5 L 562.0,220.7 L 576.9,216.2 L 591.9,208.2 L 606.8,197.1 L 621.7,183.7 L 636.6,169.0 L 651.5,154.0 L 666.4,139.9 L 681.4,127.8 L 696.3,118.4 L 711.2,112.4 L 726.1,110.0 L 741.0,111.1 L 755.9,115.4 L 770.8,122.0 L 785.8,130.0 L 800.7,138.3 L 815.6,145.8 L 830.5,151.4 L 845.4,154.3 L 860.3,153.8 L 875.3,149.7 L 890.2,142.1 L 905.1,131.3 L 920.0,118.1" />

  <!-- Seasonal-cycle callout on one visible rise-fall-rise -->
  <path class="d131a-axis" stroke="#1d4ed8" stroke-dasharray="2 3" d="M 129.5,244.2 L 129.5,262" />
  <path class="d131a-axis" stroke="#1d4ed8" stroke-dasharray="2 3" d="M 248.8,288.7 L 248.8,262" />
  <line x1="129.5" y1="262" x2="248.8" y2="262" class="d131a-axis" stroke="#1d4ed8" />
  <text class="d131a-small" x="140" y="256" fill="#1d4ed8">one seasonal cycle</text>

  <!-- Genuine gap: shaded box across the blank stretch, no line drawn inside it -->
  <rect class="d131a-gapbox" x="308.5" y="86" width="208.8" height="208" rx="6" />
  <text class="d131a-small" x="330" y="106" fill="#991b1b">genuine gap</text>
  <text class="d131a-small" x="330" y="124" fill="#991b1b">no observation here --</text>
  <text class="d131a-small" x="330" y="140" fill="#991b1b">nothing is drawn across it</text>
  <circle class="d131a-dot" cx="308.5" cy="262.9" r="4.5" />
  <circle class="d131a-dot" cx="517.3" cy="213.6" r="4.5" />

  <!-- Annotated event -->
  <line class="d131a-event" x1="726.1" y1="80" x2="726.1" y2="300" />
  <rect class="d131a-box" x="646" y="86" width="164" height="42" rx="6" />
  <text class="d131a-label" x="654" y="103">Annotated event:</text>
  <text class="d131a-label" x="654" y="121">product launch</text>

  <!-- ===================== Panel B: trailing vs centred window ===================== -->
  <text class="d131a-panel" x="32" y="358">Same peak, two rolling means</text>
  <line class="d131a-axis" x1="40" y1="540" x2="920" y2="540" />
  <line class="d131a-axis" x1="40" y1="380" x2="40" y2="540" />
  <text class="d131a-small" x="44" y="394">value</text>

  <path class="d131a-raw" d="M 40.0,520.0 L 114.6,519.9 L 189.2,518.4 L 263.7,506.6 L 338.3,462.4 L 412.9,396.5 L 457.6,380.0 L 502.4,396.5 L 576.9,462.4 L 651.5,506.6 L 726.1,518.4 L 800.7,519.9 L 875.3,520.0 L 920.0,520.0" />
  <text class="d131a-small" x="46" y="534" fill="#64748b">raw signal (dashed)</text>

  <path class="d131a-cent" d="M 40.0,519.1 L 114.6,512.4 L 189.2,491.7 L 263.7,454.1 L 338.3,412.5 L 412.9,384.9 L 457.6,380.0 L 502.4,384.9 L 576.9,412.5 L 651.5,454.1 L 726.1,491.7 L 800.7,512.4 L 875.3,519.1 L 920.0,520.0" />
  <path class="d131a-trail" d="M 40.0,520.0 L 114.6,519.2 L 189.2,514.4 L 263.7,497.1 L 338.3,462.4 L 412.9,420.2 L 457.6,405.4 L 502.4,384.9 L 547.1,380.0 L 591.9,384.9 L 666.4,412.5 L 741.0,454.0 L 815.6,491.5 L 890.2,512.2 L 920.0,516.0" />

  <line class="d131a-axis" stroke="#047857" stroke-dasharray="3 3" x1="457.6" y1="378" x2="457.6" y2="540" />
  <line class="d131a-axis" stroke="#b91c1c" stroke-dasharray="3 3" x1="547.1" y1="378" x2="547.1" y2="540" />
  <circle class="d131a-dotG" cx="457.6" cy="380.0" r="5" />
  <circle class="d131a-dotR" cx="547.1" cy="380.0" r="5" />

  <line class="d131a-axis" x1="457.6" y1="400" x2="547.1" y2="400" marker-end="url(#d131a-arrow)" marker-start="url(#d131a-arrowStart)" />
  <text class="d131a-small" x="462" y="418" fill="#b91c1c">trailing window's peak arrives LATE</text>

  <rect class="d131a-box" x="620" y="440" width="270" height="86" rx="6" />
  <circle class="d131a-dotG" cx="636" cy="460" r="5" />
  <text class="d131a-label" x="650" y="465">centred window: peak at the</text>
  <text class="d131a-label" x="650" y="483">SAME date as the true peak</text>
  <circle class="d131a-dotR" cx="636" cy="500" r="5" />
  <text class="d131a-label" x="650" y="505">trailing window: peak shifted</text>
  <text class="d131a-label" x="650" y="519">later by roughly half the window</text>

  <defs>
    <marker id="d131a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c" />
    </marker>
    <marker id="d131a-arrowStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#b91c1c" />
    </marker>
  </defs>

  <text class="d131a-small" x="32" y="600" fill="#64748b">Trend, season, event and gap: real observations only. Peak comparison: a 30-unit-wide rolling mean, trailing versus centred, over one identical peak.</text>
</svg>
