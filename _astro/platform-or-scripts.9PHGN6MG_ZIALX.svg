<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two properties separate them.">
  <title>A platform, not a pile of scripts</title>
  <style>
    .platform-or-scripts-bg   { fill: #f8fafc; }
    .platform-or-scripts-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .platform-or-scripts-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .platform-or-scripts-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .platform-or-scripts-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .platform-or-scripts-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .platform-or-scripts-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .platform-or-scripts-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .platform-or-scripts-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .platform-or-scripts-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .platform-or-scripts-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .platform-or-scripts-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .platform-or-scripts-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .platform-or-scripts-row { opacity: 1; }
    .platform-or-scripts-r0 { animation-delay: 0.00s; }
    .platform-or-scripts-r1 { animation-delay: 0.45s; }
    .platform-or-scripts-r2 { animation-delay: 0.90s; }
    .platform-or-scripts-r3 { animation-delay: 1.35s; }
    .platform-or-scripts-r4 { animation-delay: 1.80s; }
    .platform-or-scripts-row { animation: platform-or-scripts-reveal 7.3s ease-in-out infinite; }
    @keyframes platform-or-scripts-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="platform-or-scripts-bg" width="980" height="390"/>
  <text class="platform-or-scripts-h1"  x="30" y="40">A platform, not a pile of scripts</text>
  <text class="platform-or-scripts-sub" x="30" y="64">Two properties separate them.</text>
  <rect class="platform-or-scripts-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="platform-or-scripts-name" x="46" y="122">A platform</text>
  <text class="platform-or-scripts-desc" x="46" y="142">Correlated and self-healing.</text>
  <text class="platform-or-scripts-desc platform-or-scripts-row platform-or-scripts-r0" x="46" y="182">One trace ID across every service</text>
  <text class="platform-or-scripts-desc platform-or-scripts-row platform-or-scripts-r1" x="46" y="216">Alerts drill into log records</text>
  <text class="platform-or-scripts-desc platform-or-scripts-row platform-or-scripts-r2" x="46" y="250">Rollback happens without a human</text>
  <text class="platform-or-scripts-desc platform-or-scripts-row platform-or-scripts-r3" x="46" y="284">Costs attributed as they are incurred</text>
  <text class="platform-or-scripts-desc platform-or-scripts-row platform-or-scripts-r4" x="46" y="318">Each part knows about the others</text>
  <rect class="platform-or-scripts-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="platform-or-scripts-name" x="526" y="122">A pile of parts</text>
  <text class="platform-or-scripts-desc" x="526" y="142">Each works; none joins up.</text>
  <text class="platform-or-scripts-desc platform-or-scripts-row platform-or-scripts-r0" x="526" y="182">Metrics in Prometheus, logs in files, billing in Stripe</text>
  <text class="platform-or-scripts-desc platform-or-scripts-row platform-or-scripts-r1" x="526" y="216">No shared identifier</text>
  <text class="platform-or-scripts-desc platform-or-scripts-row platform-or-scripts-r2" x="526" y="250">Triage is timestamp matching by hand</text>
  <text class="platform-or-scripts-desc platform-or-scripts-row platform-or-scripts-r3" x="526" y="284">A spike has no owner</text>
  <text class="platform-or-scripts-desc platform-or-scripts-row platform-or-scripts-r4" x="526" y="318">Every part is green during the outage</text>
  <text class="platform-or-scripts-sub" x="30" y="372">"Every part is green during the outage" is the specific failure of siloed telemetry: nothing is technically wrong anywhere, and the system as a whole is not working.</text>
</svg>
