<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which half the model learns from.">
  <title>Loss masking</title>
  <style>
    .loss-masking-bg   { fill: #f8fafc; }
    .loss-masking-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-masking-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-masking-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-masking-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-masking-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-masking-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .loss-masking-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .loss-masking-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .loss-masking-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .loss-masking-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .loss-masking-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .loss-masking-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .loss-masking-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .loss-masking-stage { opacity: 1; }

    .loss-masking-s0 { animation-delay: 0.00s; }
    .loss-masking-e0 { animation-delay: 0.00s; }
    .loss-masking-s1 { animation-delay: 1.28s; }
    .loss-masking-e1 { animation-delay: 1.28s; }
    .loss-masking-s2 { animation-delay: 2.56s; }
    .loss-masking-e2 { animation-delay: 2.56s; }
    .loss-masking-s3 { animation-delay: 3.84s; }
    .loss-masking-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .loss-masking-conn  { animation: loss-masking-trace 6.4s ease-in-out infinite; }
      .loss-masking-stage { animation: loss-masking-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes loss-masking-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes loss-masking-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .loss-masking-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .loss-masking-stage { animation: loss-masking-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes loss-masking-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="loss-masking-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="loss-masking-bg" width="980" height="322"/>
  <text class="loss-masking-h1"  x="30" y="40">Loss masking</text>
  <text class="loss-masking-sub" x="30" y="64">Which half the model learns from.</text>
  <g class="loss-masking-stage loss-masking-s0">
    <rect class="loss-masking-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="loss-masking-step" x="44" y="142">01</text>
    <text class="loss-masking-name" x="70" y="142">By default the model learns every token</text>
    <text class="loss-masking-desc" x="44" y="166">Prompt and response alike.</text>
  </g>
  <line class="loss-masking-line loss-masking-conn loss-masking-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#loss-masking-tip)"/>
  <g class="loss-masking-stage loss-masking-s1">
    <rect class="loss-masking-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="loss-masking-step" x="280" y="142">02</text>
    <text class="loss-masking-name" x="306" y="142">So it learns to generate your prompts</text>
    <text class="loss-masking-desc" x="280" y="166">Which is not the task, and</text>
    <text class="loss-masking-desc" x="280" y="182">wastes capacity.</text>
  </g>
  <line class="loss-masking-line loss-masking-conn loss-masking-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#loss-masking-tip)"/>
  <g class="loss-masking-stage loss-masking-s2">
    <rect class="loss-masking-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="loss-masking-step" x="516" y="142">03</text>
    <text class="loss-masking-name" x="542" y="142">Mask the prompt tokens out of the loss</text>
    <text class="loss-masking-desc" x="516" y="166">They stay as context, and</text>
    <text class="loss-masking-desc" x="516" y="182">contribute no gradient.</text>
  </g>
  <line class="loss-masking-line loss-masking-conn loss-masking-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#loss-masking-tip)"/>
  <g class="loss-masking-stage loss-masking-s3">
    <rect class="loss-masking-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="loss-masking-step" x="752" y="142">04</text>
    <text class="loss-masking-name" x="778" y="142">So it learns only how to respond</text>
    <text class="loss-masking-desc" x="752" y="166">Which is what was wanted.</text>
  </g>
  <text class="loss-masking-sub" x="30" y="304">Omitting the mask produces a model that works but is measurably worse, with no error and no obvious symptom — which is why it is the most common quiet mistake here.</text>
</svg>
