<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when it is pure overhead.">
  <title>When this infrastructure pays</title>
  <style>
    .gpu-serving-when-bg   { fill: #f8fafc; }
    .gpu-serving-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gpu-serving-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gpu-serving-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gpu-serving-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gpu-serving-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gpu-serving-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gpu-serving-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gpu-serving-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gpu-serving-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gpu-serving-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gpu-serving-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gpu-serving-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gpu-serving-when-row { opacity: 1; }
    .gpu-serving-when-r0 { animation-delay: 0.00s; }
    .gpu-serving-when-r1 { animation-delay: 0.45s; }
    .gpu-serving-when-r2 { animation-delay: 0.90s; }
    .gpu-serving-when-r3 { animation-delay: 1.35s; }
    .gpu-serving-when-r4 { animation-delay: 1.80s; }
    .gpu-serving-when-row { animation: gpu-serving-when-reveal 7.3s ease-in-out infinite; }
    @keyframes gpu-serving-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="gpu-serving-when-bg" width="980" height="390"/>
  <text class="gpu-serving-when-h1"  x="30" y="40">When this infrastructure pays</text>
  <text class="gpu-serving-when-sub" x="30" y="64">And when it is pure overhead.</text>
  <rect class="gpu-serving-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="gpu-serving-when-name" x="46" y="122">Deploy it</text>
  <text class="gpu-serving-when-desc" x="46" y="142">Where the GPU is the cost.</text>
  <text class="gpu-serving-when-desc gpu-serving-when-row gpu-serving-when-r0" x="46" y="182">High-throughput multi-model platforms</text>
  <text class="gpu-serving-when-desc gpu-serving-when-row gpu-serving-when-r1" x="46" y="216">Embedding generation APIs</text>
  <text class="gpu-serving-when-desc gpu-serving-when-row gpu-serving-when-r2" x="46" y="250">Real-time vision pipelines</text>
  <text class="gpu-serving-when-desc gpu-serving-when-row gpu-serving-when-r3" x="46" y="284">Multi-GPU LLM clusters</text>
  <text class="gpu-serving-when-desc gpu-serving-when-row gpu-serving-when-r4" x="46" y="318">Where utilisation is the economic metric</text>
  <rect class="gpu-serving-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="gpu-serving-when-name" x="526" y="122">Do not</text>
  <text class="gpu-serving-when-desc" x="526" y="142">Where it is not.</text>
  <text class="gpu-serving-when-desc gpu-serving-when-row gpu-serving-when-r0" x="526" y="182">scikit-learn models on CPU</text>
  <text class="gpu-serving-when-desc gpu-serving-when-row gpu-serving-when-r1" x="526" y="216">A single low-traffic endpoint</text>
  <text class="gpu-serving-when-desc gpu-serving-when-row gpu-serving-when-r2" x="526" y="250">A demo with one user</text>
  <text class="gpu-serving-when-desc gpu-serving-when-row gpu-serving-when-r3" x="526" y="284">Triton config for one model, one client</text>
  <text class="gpu-serving-when-desc gpu-serving-when-row gpu-serving-when-r4" x="526" y="318">The complexity buys nothing</text>
  <text class="gpu-serving-when-sub" x="30" y="372">The deciding question is whether the GPU is idle between requests: if it is, batching and scheduling are the whole game, and if there is only ever one request in flight there is nothing for either to do.</text>
</svg>
