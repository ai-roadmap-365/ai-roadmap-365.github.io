<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four consequences.">
  <title>The pipeline is an estimator</title>
  <style>
    .pipeline-estimator-bg   { fill: #f8fafc; }
    .pipeline-estimator-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-estimator-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-estimator-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-estimator-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-estimator-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-estimator-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pipeline-estimator-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pipeline-estimator-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pipeline-estimator-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pipeline-estimator-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pipeline-estimator-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pipeline-estimator-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pipeline-estimator-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pipeline-estimator-stage { opacity: 1; }

    .pipeline-estimator-s0 { animation-delay: 0.00s; }
    .pipeline-estimator-e0 { animation-delay: 0.00s; }
    .pipeline-estimator-s1 { animation-delay: 1.28s; }
    .pipeline-estimator-e1 { animation-delay: 1.28s; }
    .pipeline-estimator-s2 { animation-delay: 2.56s; }
    .pipeline-estimator-e2 { animation-delay: 2.56s; }
    .pipeline-estimator-s3 { animation-delay: 3.84s; }
    .pipeline-estimator-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .pipeline-estimator-conn  { animation: pipeline-estimator-trace 6.4s ease-in-out infinite; }
      .pipeline-estimator-stage { animation: pipeline-estimator-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes pipeline-estimator-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pipeline-estimator-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pipeline-estimator-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pipeline-estimator-stage { animation: pipeline-estimator-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pipeline-estimator-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pipeline-estimator-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pipeline-estimator-bg" width="980" height="322"/>
  <text class="pipeline-estimator-h1"  x="30" y="40">The pipeline is an estimator</text>
  <text class="pipeline-estimator-sub" x="30" y="64">Four consequences.</text>
  <g class="pipeline-estimator-stage pipeline-estimator-s0">
    <rect class="pipeline-estimator-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="pipeline-estimator-step" x="44" y="142">01</text>
    <text class="pipeline-estimator-name" x="70" y="142">A pipeline implements fit and predict</text>
    <text class="pipeline-estimator-desc" x="44" y="166">So anything accepting an</text>
    <text class="pipeline-estimator-desc" x="44" y="182">estimator accepts one.</text>
  </g>
  <line class="pipeline-estimator-line pipeline-estimator-conn pipeline-estimator-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#pipeline-estimator-tip)"/>
  <g class="pipeline-estimator-stage pipeline-estimator-s1">
    <rect class="pipeline-estimator-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="pipeline-estimator-step" x="280" y="142">02</text>
    <text class="pipeline-estimator-name" x="306" y="142">Including other pipelines</text>
    <text class="pipeline-estimator-desc" x="280" y="166">Which nest without special</text>
    <text class="pipeline-estimator-desc" x="280" y="182">handling.</text>
  </g>
  <line class="pipeline-estimator-line pipeline-estimator-conn pipeline-estimator-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#pipeline-estimator-tip)"/>
  <g class="pipeline-estimator-stage pipeline-estimator-s2">
    <rect class="pipeline-estimator-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="pipeline-estimator-step" x="516" y="142">03</text>
    <text class="pipeline-estimator-name" x="542" y="142">And searches, which tune across every step</text>
    <text class="pipeline-estimator-desc" x="516" y="166">Preprocessing and model</text>
    <text class="pipeline-estimator-desc" x="516" y="182">together.</text>
  </g>
  <line class="pipeline-estimator-line pipeline-estimator-conn pipeline-estimator-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#pipeline-estimator-tip)"/>
  <g class="pipeline-estimator-stage pipeline-estimator-s3">
    <rect class="pipeline-estimator-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="pipeline-estimator-step" x="752" y="142">04</text>
    <text class="pipeline-estimator-name" x="778" y="142">And serialisation, which stores the whole chain</text>
    <text class="pipeline-estimator-desc" x="752" y="166">As the one artefact that must be</text>
    <text class="pipeline-estimator-desc" x="752" y="182">deployed.</text>
  </g>
  <text class="pipeline-estimator-sub" x="30" y="304">Composability is what makes the contract valuable rather than merely tidy: a single convention lets preprocessing, models and searches all substitute for one another.</text>
</svg>
