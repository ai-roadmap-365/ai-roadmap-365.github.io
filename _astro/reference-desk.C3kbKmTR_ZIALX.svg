<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="That knows its own limits.">
  <title>A reference desk</title>
  <style>
    .reference-desk-bg   { fill: #f8fafc; }
    .reference-desk-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reference-desk-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reference-desk-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reference-desk-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reference-desk-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reference-desk-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .reference-desk-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .reference-desk-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .reference-desk-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .reference-desk-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .reference-desk-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .reference-desk-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .reference-desk-row { opacity: 1; }
    .reference-desk-r0 { animation-delay: 0.00s; }
    .reference-desk-r1 { animation-delay: 0.45s; }
    .reference-desk-r2 { animation-delay: 0.90s; }
    .reference-desk-r3 { animation-delay: 1.35s; }
    .reference-desk-r4 { animation-delay: 1.80s; }
    .reference-desk-row { animation: reference-desk-reveal 7.3s ease-in-out infinite; }
    @keyframes reference-desk-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="reference-desk-bg" width="980" height="390"/>
  <text class="reference-desk-h1"  x="30" y="40">A reference desk</text>
  <text class="reference-desk-sub" x="30" y="64">That knows its own limits.</text>
  <rect class="reference-desk-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="reference-desk-name" x="46" y="122">Always answers</text>
  <text class="reference-desk-desc" x="46" y="142">Confident throughout.</text>
  <text class="reference-desk-desc reference-desk-row reference-desk-r0" x="46" y="182">Something for every question</text>
  <text class="reference-desk-desc reference-desk-row reference-desk-r1" x="46" y="216">Includes questions outside its material</text>
  <text class="reference-desk-desc reference-desk-row reference-desk-r2" x="46" y="250">No way to tell which is which</text>
  <text class="reference-desk-desc reference-desk-row reference-desk-r3" x="46" y="284">Users learn to distrust all of it</text>
  <text class="reference-desk-desc reference-desk-row reference-desk-r4" x="46" y="318">This is an ungated system</text>
  <rect class="reference-desk-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="reference-desk-name" x="526" y="122">Knows its limits</text>
  <text class="reference-desk-desc" x="526" y="142">Answers, or says so.</text>
  <text class="reference-desk-desc reference-desk-row reference-desk-r0" x="526" y="182">Answers what its sources cover</text>
  <text class="reference-desk-desc reference-desk-row reference-desk-r1" x="526" y="216">Says plainly when they do not</text>
  <text class="reference-desk-desc reference-desk-row reference-desk-r2" x="526" y="250">Points elsewhere when it cannot help</text>
  <text class="reference-desk-desc reference-desk-row reference-desk-r3" x="526" y="284">Users learn to trust what it does say</text>
  <text class="reference-desk-desc reference-desk-row reference-desk-r4" x="526" y="318">This is a gated system</text>
  <text class="reference-desk-sub" x="30" y="372">Trust is built by the refusals rather than by the answers: a system that declines appropriately makes its answers credible in a way no accuracy claim can.</text>
</svg>
