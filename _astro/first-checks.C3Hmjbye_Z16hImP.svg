<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Before writing any code.">
  <title>Four things to do in a new project</title>
  <style>
    .first-checks-bg   { fill: #f8fafc; }
    .first-checks-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .first-checks-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .first-checks-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .first-checks-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .first-checks-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .first-checks-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .first-checks-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .first-checks-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .first-checks-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .first-checks-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .first-checks-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .first-checks-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .first-checks-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .first-checks-stage { opacity: 1; }

    .first-checks-s0 { animation-delay: 0.00s; }
    .first-checks-e0 { animation-delay: 0.00s; }
    .first-checks-s1 { animation-delay: 1.28s; }
    .first-checks-e1 { animation-delay: 1.28s; }
    .first-checks-s2 { animation-delay: 2.56s; }
    .first-checks-e2 { animation-delay: 2.56s; }
    .first-checks-s3 { animation-delay: 3.84s; }
    .first-checks-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .first-checks-conn  { animation: first-checks-trace 6.4s ease-in-out infinite; }
      .first-checks-stage { animation: first-checks-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes first-checks-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes first-checks-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .first-checks-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .first-checks-stage { animation: first-checks-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes first-checks-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="first-checks-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="first-checks-bg" width="980" height="322"/>
  <text class="first-checks-h1"  x="30" y="40">Four things to do in a new project</text>
  <text class="first-checks-sub" x="30" y="64">Before writing any code.</text>
  <g class="first-checks-stage first-checks-s0">
    <rect class="first-checks-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="first-checks-step" x="44" y="142">01</text>
    <text class="first-checks-name" x="70" y="142">Create the environment</text>
    <text class="first-checks-desc" x="44" y="166">From the first file, not once</text>
    <text class="first-checks-desc" x="44" y="182">the project is "real".</text>
  </g>
  <line class="first-checks-line first-checks-conn first-checks-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#first-checks-tip)"/>
  <g class="first-checks-stage first-checks-s1">
    <rect class="first-checks-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="first-checks-step" x="280" y="142">02</text>
    <text class="first-checks-name" x="306" y="142">Add .venv/ to .gitignore</text>
    <text class="first-checks-desc" x="280" y="166">Before the first commit, per Day</text>
    <text class="first-checks-desc" x="280" y="182">30 — afterwards is too late.</text>
    <text class="first-checks-edge" x="280" y="242">first</text>
  </g>
  <line class="first-checks-line first-checks-conn first-checks-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#first-checks-tip)"/>
  <g class="first-checks-stage first-checks-s2">
    <rect class="first-checks-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="first-checks-step" x="516" y="142">03</text>
    <text class="first-checks-name" x="542" y="142">Activate before installing</text>
    <text class="first-checks-desc" x="516" y="166">And check which python when</text>
    <text class="first-checks-desc" x="516" y="182">anything surprises you.</text>
  </g>
  <line class="first-checks-line first-checks-conn first-checks-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#first-checks-tip)"/>
  <g class="first-checks-stage first-checks-s3">
    <rect class="first-checks-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="first-checks-step" x="752" y="142">04</text>
    <text class="first-checks-name" x="778" y="142">Pin before sharing</text>
    <text class="first-checks-desc" x="752" y="166">pip freeze &gt; requirements.txt,</text>
    <text class="first-checks-desc" x="752" y="182">committed alongside the code.</text>
  </g>
  <text class="first-checks-sub" x="30" y="304">All four take under a minute together, and each one prevents a problem that costs considerably more than a minute to diagnose later.</text>
</svg>
