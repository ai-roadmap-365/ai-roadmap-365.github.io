<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Hundreds of boxes to one per object.">
  <title>Non-maximum suppression</title>
  <style>
    .nms-bg   { fill: #f8fafc; }
    .nms-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nms-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nms-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nms-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nms-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nms-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nms-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .nms-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .nms-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .nms-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .nms-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .nms-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .nms-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .nms-stage { opacity: 1; }

    .nms-s0 { animation-delay: 0.00s; }
    .nms-e0 { animation-delay: 0.00s; }
    .nms-s1 { animation-delay: 1.28s; }
    .nms-e1 { animation-delay: 1.28s; }
    .nms-s2 { animation-delay: 2.56s; }
    .nms-e2 { animation-delay: 2.56s; }
    .nms-s3 { animation-delay: 3.84s; }
    .nms-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .nms-conn  { animation: nms-trace 6.4s ease-in-out infinite; }
      .nms-stage { animation: nms-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes nms-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes nms-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .nms-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .nms-stage { animation: nms-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes nms-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="nms-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="nms-bg" width="980" height="322"/>
  <text class="nms-h1"  x="30" y="40">Non-maximum suppression</text>
  <text class="nms-sub" x="30" y="64">Hundreds of boxes to one per object.</text>
  <g class="nms-stage nms-s0">
    <rect class="nms-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="nms-step" x="44" y="142">01</text>
    <text class="nms-name" x="70" y="142">Detectors produce hundreds of boxes</text>
    <text class="nms-desc" x="44" y="166">Many overlapping proposals for</text>
    <text class="nms-desc" x="44" y="182">the same object.</text>
  </g>
  <line class="nms-line nms-conn nms-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#nms-tip)"/>
  <g class="nms-stage nms-s1">
    <rect class="nms-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="nms-step" x="280" y="142">02</text>
    <text class="nms-name" x="306" y="142">Sort by confidence</text>
    <text class="nms-desc" x="280" y="166">Take the highest first.</text>
  </g>
  <line class="nms-line nms-conn nms-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#nms-tip)"/>
  <g class="nms-stage nms-s2">
    <rect class="nms-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="nms-step" x="516" y="142">03</text>
    <text class="nms-name" x="542" y="142">Suppress overlapping candidates</text>
    <text class="nms-desc" x="516" y="166">Any box overlapping it above a</text>
    <text class="nms-desc" x="516" y="182">threshold is removed.</text>
    <text class="nms-edge" x="516" y="242">greedy</text>
  </g>
  <line class="nms-line nms-conn nms-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#nms-tip)"/>
  <g class="nms-stage nms-s3">
    <rect class="nms-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="nms-step" x="752" y="142">04</text>
    <text class="nms-name" x="778" y="142">The threshold trades misses against duplicates</text>
    <text class="nms-desc" x="752" y="166">Too strict merges nearby</text>
    <text class="nms-desc" x="752" y="182">objects; too loose keeps</text>
    <text class="nms-desc" x="752" y="198">duplicates.</text>
  </g>
  <text class="nms-sub" x="30" y="304">The failure at a strict threshold is worth knowing: two genuinely adjacent objects — cars in traffic, cells in tissue — get merged into one detection by an aggressive suppression setting.</text>
</svg>
