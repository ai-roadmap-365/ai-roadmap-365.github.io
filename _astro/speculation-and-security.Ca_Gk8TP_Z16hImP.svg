<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Spectre and Meltdown: isolation and speed turned out not to be independent.">
  <title>How a performance trick became a security hole</title>
  <style>
    .speculation-and-security-bg   { fill: #f8fafc; }
    .speculation-and-security-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speculation-and-security-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speculation-and-security-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speculation-and-security-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speculation-and-security-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .speculation-and-security-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .speculation-and-security-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .speculation-and-security-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .speculation-and-security-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .speculation-and-security-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .speculation-and-security-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .speculation-and-security-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .speculation-and-security-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .speculation-and-security-stage { opacity: 1; }

    .speculation-and-security-s0 { animation-delay: 0.00s; }
    .speculation-and-security-e0 { animation-delay: 0.00s; }
    .speculation-and-security-s1 { animation-delay: 1.28s; }
    .speculation-and-security-e1 { animation-delay: 1.28s; }
    .speculation-and-security-s2 { animation-delay: 2.56s; }
    .speculation-and-security-e2 { animation-delay: 2.56s; }
    .speculation-and-security-s3 { animation-delay: 3.84s; }
    .speculation-and-security-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .speculation-and-security-conn  { animation: speculation-and-security-trace 6.4s ease-in-out infinite; }
      .speculation-and-security-stage { animation: speculation-and-security-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes speculation-and-security-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes speculation-and-security-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .speculation-and-security-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .speculation-and-security-stage { animation: speculation-and-security-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes speculation-and-security-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="speculation-and-security-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="speculation-and-security-bg" width="980" height="322"/>
  <text class="speculation-and-security-h1"  x="30" y="40">How a performance trick became a security hole</text>
  <text class="speculation-and-security-sub" x="30" y="64">Spectre and Meltdown: isolation and speed turned out not to be independent.</text>
  <g class="speculation-and-security-stage speculation-and-security-s0">
    <rect class="speculation-and-security-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="speculation-and-security-step" x="44" y="142">01</text>
    <text class="speculation-and-security-name" x="70" y="142">Guess the branch</text>
    <text class="speculation-and-security-desc" x="44" y="166">Rather than stall, the chip</text>
    <text class="speculation-and-security-desc" x="44" y="182">predicts which way it goes.</text>
    <text class="speculation-and-security-edge" x="44" y="242">speed</text>
  </g>
  <line class="speculation-and-security-line speculation-and-security-conn speculation-and-security-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#speculation-and-security-tip)"/>
  <g class="speculation-and-security-stage speculation-and-security-s1">
    <rect class="speculation-and-security-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="speculation-and-security-step" x="280" y="142">02</text>
    <text class="speculation-and-security-name" x="306" y="142">Run ahead</text>
    <text class="speculation-and-security-desc" x="280" y="166">Work is done on the guessed path</text>
    <text class="speculation-and-security-desc" x="280" y="182">before it is confirmed.</text>
    <text class="speculation-and-security-edge" x="280" y="242">speculation</text>
  </g>
  <line class="speculation-and-security-line speculation-and-security-conn speculation-and-security-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#speculation-and-security-tip)"/>
  <g class="speculation-and-security-stage speculation-and-security-s2">
    <rect class="speculation-and-security-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="speculation-and-security-step" x="516" y="142">03</text>
    <text class="speculation-and-security-name" x="542" y="142">Discard the result</text>
    <text class="speculation-and-security-desc" x="516" y="166">If wrong, the architectural</text>
    <text class="speculation-and-security-desc" x="516" y="182">result is thrown away.</text>
    <text class="speculation-and-security-edge" x="516" y="242">but not the cache</text>
  </g>
  <line class="speculation-and-security-line speculation-and-security-conn speculation-and-security-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#speculation-and-security-tip)"/>
  <g class="speculation-and-security-stage speculation-and-security-s3">
    <rect class="speculation-and-security-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="speculation-and-security-step" x="752" y="142">04</text>
    <text class="speculation-and-security-name" x="778" y="142">Time the cache</text>
    <text class="speculation-and-security-desc" x="752" y="166">An attacker measures what is now</text>
    <text class="speculation-and-security-desc" x="752" y="182">fast to read.</text>
    <text class="speculation-and-security-edge" x="752" y="242">the leak</text>
  </g>
  <text class="speculation-and-security-sub" x="30" y="304">The values were never returned. Their effect on cache timing was enough.</text>
</svg>
