<svg role="img" aria-label="MNIST neural network training curves showing cross entropy loss decay and validation accuracy reaching 96 percent across training epochs" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>MNIST Training Loss Convergence and Accuracy Curves</title>
  <defs>
    <linearGradient id="bg203b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="chartCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg203b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">MNIST TRAINING DYNAMICS &amp; ACCURACY BENCHMARK</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Pure NumPy Mini-Batch SGD with Momentum on 60,000 Training Images</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#chartCard)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Left Plot: Loss -->
    <rect x="25" y="25" width="335" height="245" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" rx="6"/>
    <text x="192" y="50" fill="#fb7185" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Cross-Entropy Loss vs Epochs</text>
    <!-- Loss curve -->
    <path d="M 55 75 C 90 140, 150 200, 330 225" fill="none" stroke="#fb7185" stroke-width="2.5"/>
    <text x="65" y="70" fill="#94a3b8" font-size="8">Epoch 1: 2.302 (ln 10)</text>
    <text x="310" y="245" fill="#34d399" font-size="8">Epoch 20: 0.145</text>
    <line x1="55" y1="230" x2="330" y2="230" stroke="#475569" stroke-width="1"/>
    <line x1="55" y1="60" x2="55" y2="230" stroke="#475569" stroke-width="1"/>

    <!-- Right Plot: Accuracy -->
    <rect x="395" y="25" width="340" height="245" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="565" y="50" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Test Accuracy (%) vs Epochs</text>
    <!-- Accuracy curve -->
    <path d="M 425 220 C 465 140, 520 85, 705 75" fill="none" stroke="#34d399" stroke-width="2.5"/>
    <!-- 95% threshold line -->
    <line x1="425" y1="88" x2="705" y2="88" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="660" y="105" fill="#fbbf24" font-size="8">Target: 95.0%</text>
    <text x="435" y="235" fill="#94a3b8" font-size="8">Epoch 1: 82.4%</text>
    <text x="670" y="65" fill="#34d399" font-size="9" font-weight="700">Epoch 20: 96.4%</text>
  </g>
</svg>
