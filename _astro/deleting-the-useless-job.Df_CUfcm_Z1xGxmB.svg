<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%" role="img" aria-label="Deleting the Useless Job Saves Nothing showing two off-path jobs saving zero wall clock against one cache saving 3.7 minutes">
  <title>Deleting the Useless Job Saves Nothing</title>
  <defs>
    <style>
      .d335b-bg { fill: #f8fafc; }
      .d335b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; }
      .d335b-none { fill: #fee2e2; stroke: #ef4444; stroke-width: 2px; }
      .d335b-win { fill: #dcfce7; stroke: #22c55e; stroke-width: 2px; }
      .d335b-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d335b-h { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .d335b-t { font-family: system-ui, sans-serif; font-size: 13px; fill: #334155; }
      .d335b-s { font-family: system-ui, sans-serif; font-size: 12px; fill: #64748b; }
      .d335b-big { font-family: system-ui, sans-serif; font-size: 30px; font-weight: 700; }
    </style>
  </defs>
  <rect class="d335b-bg" width="900" height="400" />
  <text class="d335b-title" x="30" y="36">Deleting the Useless Job Saves Nothing</text>
  <text class="d335b-s" x="30" y="58">Two changes to the same pipeline. Both worth making. Only one answers the complaint.</text>

  <rect class="d335b-none" x="30" y="84" width="410" height="180" rx="8" />
  <text class="d335b-h" x="48" y="112">Delete the gates that never fire</text>
  <text class="d335b-t" x="48" y="140">licence-scan  2.4 min, never failed</text>
  <text class="d335b-t" x="48" y="162">docs-build    3.1 min, never failed</text>
  <text class="d335b-big" x="48" y="206" fill="#7f1d1d">0.0 min</text>
  <text class="d335b-t" x="168" y="204">faster</text>
  <text class="d335b-s" x="48" y="230">neither is on the critical path —</text>
  <text class="d335b-s" x="48" y="248">nothing was waiting for them</text>

  <rect class="d335b-win" x="460" y="84" width="410" height="180" rx="8" />
  <text class="d335b-h" x="478" y="112">Cache the install</text>
  <text class="d335b-t" x="478" y="140">install  4.5 min, nothing cached</text>
  <text class="d335b-t" x="478" y="162">everything else waits for it</text>
  <text class="d335b-big" x="478" y="206" fill="#15803d">3.7 min</text>
  <text class="d335b-t" x="598" y="204">faster</text>
  <text class="d335b-s" x="478" y="230">wall clock 12.7 → 9.0, every run,</text>
  <text class="d335b-s" x="478" y="248">for everyone</text>

  <rect class="d335b-card" x="30" y="280" width="840" height="46" rx="6" />
  <text class="d335b-t" x="48" y="309">Deleting the two gates does save 5.5 runner minutes per run — real money, and not what anyone complained about.</text>

  <rect class="d335b-card" x="30" y="338" width="840" height="50" rx="6" />
  <text class="d335b-h" x="48" y="362">The annoying job and the slow job are rarely the same job.</text>
  <text class="d335b-s" x="48" y="380">Annoyance is not a measurement of delay. Compute the critical path before you optimise.</text>
</svg>
