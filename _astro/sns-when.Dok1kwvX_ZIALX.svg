<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the chart.">
  <title>Which layer when</title>
  <style>
    .sns-when-bg   { fill: #f8fafc; }
    .sns-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sns-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sns-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sns-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sns-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sns-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sns-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sns-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sns-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sns-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sns-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sns-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sns-when-row { opacity: 1; }
    .sns-when-r0 { animation-delay: 0.00s; }
    .sns-when-r1 { animation-delay: 0.45s; }
    .sns-when-r2 { animation-delay: 0.90s; }
    .sns-when-r3 { animation-delay: 1.35s; }
    .sns-when-r4 { animation-delay: 1.80s; }
    .sns-when-row { animation: sns-when-reveal 7.3s ease-in-out infinite; }
    @keyframes sns-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="sns-when-bg" width="980" height="390"/>
  <text class="sns-when-h1"  x="30" y="40">Which layer when</text>
  <text class="sns-when-sub" x="30" y="64">By the chart.</text>
  <rect class="sns-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="sns-when-name" x="46" y="122">Statistical layer</text>
  <text class="sns-when-desc" x="46" y="142">Four cases.</text>
  <text class="sns-when-desc sns-when-row sns-when-r0" x="46" y="182">Standard statistical charts</text>
  <text class="sns-when-desc sns-when-row sns-when-r1" x="46" y="216">Faceted comparisons</text>
  <text class="sns-when-desc sns-when-row sns-when-r2" x="46" y="250">Quick exploration of a data frame</text>
  <text class="sns-when-desc sns-when-row sns-when-r3" x="46" y="284">Distributions across categories</text>
  <text class="sns-when-desc sns-when-row sns-when-r4" x="46" y="318">Where the defaults are good enough</text>
  <rect class="sns-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="sns-when-name" x="526" y="122">Low-level library</text>
  <text class="sns-when-desc" x="526" y="142">Also four.</text>
  <text class="sns-when-desc sns-when-row sns-when-r0" x="526" y="182">Unusual chart types</text>
  <text class="sns-when-desc sns-when-row sns-when-r1" x="526" y="216">Precise control of every element</text>
  <text class="sns-when-desc sns-when-row sns-when-r2" x="526" y="250">Complex multi-panel layouts</text>
  <text class="sns-when-desc sns-when-row sns-when-r3" x="526" y="284">Publication figures with exact specifications</text>
  <text class="sns-when-desc sns-when-row sns-when-r4" x="526" y="318">Annotations and custom elements</text>
  <text class="sns-when-sub" x="30" y="372">The two are complementary rather than competing, and the usual workflow is to build with the statistical layer then adjust the underlying objects.</text>
</svg>
