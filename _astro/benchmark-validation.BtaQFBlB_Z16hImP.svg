<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>How a test set decays</title>
  <style>
    .benchmark-validation-bg   { fill: #f8fafc; }
    .benchmark-validation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .benchmark-validation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .benchmark-validation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .benchmark-validation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .benchmark-validation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .benchmark-validation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .benchmark-validation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .benchmark-validation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .benchmark-validation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .benchmark-validation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .benchmark-validation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .benchmark-validation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .benchmark-validation-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .benchmark-validation-stage { opacity: 1; }

    .benchmark-validation-s0 { animation-delay: 0.00s; }
    .benchmark-validation-e0 { animation-delay: 0.00s; }
    .benchmark-validation-s1 { animation-delay: 1.28s; }
    .benchmark-validation-e1 { animation-delay: 1.28s; }
    .benchmark-validation-s2 { animation-delay: 2.56s; }
    .benchmark-validation-e2 { animation-delay: 2.56s; }
    .benchmark-validation-s3 { animation-delay: 3.84s; }
    .benchmark-validation-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .benchmark-validation-conn  { animation: benchmark-validation-trace 6.4s ease-in-out infinite; }
      .benchmark-validation-stage { animation: benchmark-validation-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes benchmark-validation-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes benchmark-validation-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .benchmark-validation-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .benchmark-validation-stage { animation: benchmark-validation-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes benchmark-validation-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="benchmark-validation-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="benchmark-validation-bg" width="980" height="322"/>
  <text class="benchmark-validation-h1"  x="30" y="40">How a test set decays</text>
  <text class="benchmark-validation-sub" x="30" y="64">Four steps.</text>
  <g class="benchmark-validation-stage benchmark-validation-s0">
    <rect class="benchmark-validation-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="benchmark-validation-step" x="44" y="142">01</text>
    <text class="benchmark-validation-name" x="70" y="142">A benchmark is published, held out and clean</text>
    <text class="benchmark-validation-desc" x="44" y="166">An honest estimate for anyone</text>
    <text class="benchmark-validation-desc" x="44" y="182">who uses it once.</text>
  </g>
  <line class="benchmark-validation-line benchmark-validation-conn benchmark-validation-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#benchmark-validation-tip)"/>
  <g class="benchmark-validation-stage benchmark-validation-s1">
    <rect class="benchmark-validation-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="benchmark-validation-step" x="280" y="142">02</text>
    <text class="benchmark-validation-name" x="306" y="142">But everyone reports against it, repeatedly</text>
    <text class="benchmark-validation-desc" x="280" y="166">And publishes what scored well.</text>
  </g>
  <line class="benchmark-validation-line benchmark-validation-conn benchmark-validation-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#benchmark-validation-tip)"/>
  <g class="benchmark-validation-stage benchmark-validation-s2">
    <rect class="benchmark-validation-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="benchmark-validation-step" x="516" y="142">03</text>
    <text class="benchmark-validation-name" x="542" y="142">So the community collectively selects against it</text>
    <text class="benchmark-validation-desc" x="516" y="166">Which is validation, spread over</text>
    <text class="benchmark-validation-desc" x="516" y="182">many teams.</text>
  </g>
  <line class="benchmark-validation-line benchmark-validation-conn benchmark-validation-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#benchmark-validation-tip)"/>
  <g class="benchmark-validation-stage benchmark-validation-s3">
    <rect class="benchmark-validation-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="benchmark-validation-step" x="752" y="142">04</text>
    <text class="benchmark-validation-name" x="778" y="142">And the benchmark stops measuring generalisation</text>
    <text class="benchmark-validation-desc" x="752" y="166">Which is why new ones keep being</text>
    <text class="benchmark-validation-desc" x="752" y="182">needed.</text>
  </g>
  <text class="benchmark-validation-sub" x="30" y="304">This is the same selection bias as tuning against a test set, distributed across a field rather than a single project — and it explains the churn in benchmarks.</text>
</svg>
