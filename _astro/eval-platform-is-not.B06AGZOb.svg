<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Detecting change, not proving quality.">
  <title>What an evaluation set is for</title>
  <style>
    .eval-platform-is-not-bg   { fill: #f8fafc; }
    .eval-platform-is-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-platform-is-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-platform-is-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-platform-is-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-platform-is-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-platform-is-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eval-platform-is-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eval-platform-is-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eval-platform-is-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eval-platform-is-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eval-platform-is-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eval-platform-is-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eval-platform-is-not-row { opacity: 1; }
    .eval-platform-is-not-r0 { animation-delay: 0.00s; }
    .eval-platform-is-not-r1 { animation-delay: 0.45s; }
    .eval-platform-is-not-r2 { animation-delay: 0.90s; }
    .eval-platform-is-not-r3 { animation-delay: 1.35s; }
    .eval-platform-is-not-r4 { animation-delay: 1.80s; }
    .eval-platform-is-not-row { animation: eval-platform-is-not-reveal 7.3s ease-in-out infinite; }
    @keyframes eval-platform-is-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="eval-platform-is-not-bg" width="980" height="390"/>
  <text class="eval-platform-is-not-h1"  x="30" y="40">What an evaluation set is for</text>
  <text class="eval-platform-is-not-sub" x="30" y="64">Detecting change, not proving quality.</text>
  <rect class="eval-platform-is-not-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="eval-platform-is-not-name" x="46" y="122">It tells you</text>
  <text class="eval-platform-is-not-desc" x="46" y="142">Relative, and reliable.</text>
  <text class="eval-platform-is-not-desc eval-platform-is-not-row eval-platform-is-not-r0" x="46" y="182">Did this change make things worse?</text>
  <text class="eval-platform-is-not-desc eval-platform-is-not-row eval-platform-is-not-r1" x="46" y="216">Which component regressed</text>
  <text class="eval-platform-is-not-desc eval-platform-is-not-row eval-platform-is-not-r2" x="46" y="250">Whether a cheaper model is good enough</text>
  <text class="eval-platform-is-not-desc eval-platform-is-not-row eval-platform-is-not-r3" x="46" y="284">Whether reranking earned its latency</text>
  <text class="eval-platform-is-not-desc eval-platform-is-not-row eval-platform-is-not-r4" x="46" y="318">A number you can put in a pull request</text>
  <rect class="eval-platform-is-not-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="eval-platform-is-not-name" x="526" y="122">It does not tell you</text>
  <text class="eval-platform-is-not-desc" x="526" y="142">Where judgement is still required.</text>
  <text class="eval-platform-is-not-desc eval-platform-is-not-row eval-platform-is-not-r0" x="526" y="182">Whether the product is good</text>
  <text class="eval-platform-is-not-desc eval-platform-is-not-row eval-platform-is-not-r1" x="526" y="216">How it behaves on questions not in the set</text>
  <text class="eval-platform-is-not-desc eval-platform-is-not-row eval-platform-is-not-r2" x="526" y="250">Whether users will trust it</text>
  <text class="eval-platform-is-not-desc eval-platform-is-not-row eval-platform-is-not-r3" x="526" y="284">Anything about the cases you did not think of</text>
  <text class="eval-platform-is-not-desc eval-platform-is-not-row eval-platform-is-not-r4" x="526" y="318">A score is a comparison, not a verdict</text>
  <text class="eval-platform-is-not-sub" x="30" y="372">This is why the first version is worth building small: twenty realistic queries that catch regressions beat two hundred that were never curated and are never read.</text>
</svg>
