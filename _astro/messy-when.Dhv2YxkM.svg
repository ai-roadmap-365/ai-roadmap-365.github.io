<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Scaled to the corpus.">
  <title>How much extraction effort</title>
  <style>
    .messy-when-bg   { fill: #f8fafc; }
    .messy-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .messy-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .messy-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .messy-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .messy-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .messy-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .messy-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .messy-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .messy-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .messy-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .messy-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .messy-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .messy-when-row { opacity: 1; }
    .messy-when-r0 { animation-delay: 0.00s; }
    .messy-when-r1 { animation-delay: 0.45s; }
    .messy-when-r2 { animation-delay: 0.90s; }
    .messy-when-r3 { animation-delay: 1.35s; }
    .messy-when-r4 { animation-delay: 1.80s; }
    .messy-when-row { animation: messy-when-reveal 7.3s ease-in-out infinite; }
    @keyframes messy-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="messy-when-bg" width="980" height="390"/>
  <text class="messy-when-h1"  x="30" y="40">How much extraction effort</text>
  <text class="messy-when-sub" x="30" y="64">Scaled to the corpus.</text>
  <rect class="messy-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="messy-when-name" x="46" y="122">Invest heavily</text>
  <text class="messy-when-desc" x="46" y="142">Four signals.</text>
  <text class="messy-when-desc messy-when-row messy-when-r0" x="46" y="182">Scanned or photographed archives</text>
  <text class="messy-when-desc messy-when-row messy-when-r1" x="46" y="216">Multi-column technical or legal documents</text>
  <text class="messy-when-desc messy-when-row messy-when-r2" x="46" y="250">Tables carrying the actual content</text>
  <text class="messy-when-desc messy-when-row messy-when-r3" x="46" y="284">Mixed formats from many sources</text>
  <text class="messy-when-desc messy-when-row messy-when-r4" x="46" y="318">Where coverage must be demonstrable</text>
  <rect class="messy-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="messy-when-name" x="526" y="122">Keep it simple</text>
  <text class="messy-when-desc" x="526" y="142">Also four.</text>
  <text class="messy-when-desc messy-when-row messy-when-r0" x="526" y="182">Documents you generate yourself</text>
  <text class="messy-when-desc messy-when-row messy-when-r1" x="526" y="216">A single well-behaved format</text>
  <text class="messy-when-desc messy-when-row messy-when-r2" x="526" y="250">Text already in a database</text>
  <text class="messy-when-desc messy-when-row messy-when-r3" x="526" y="284">Small corpora a person could check</text>
  <text class="messy-when-desc messy-when-row messy-when-r4" x="526" y="318">Where a simple extractor already yields well</text>
  <text class="messy-when-sub" x="30" y="372">Measuring yield on a sample before building anything is the cheap way to decide, and it frequently shows that a simple extractor is already sufficient.</text>
</svg>
