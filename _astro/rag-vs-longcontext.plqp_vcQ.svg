<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Selecting, or supplying everything.">
  <title>Retrieval against a long context</title>
  <style>
    .rag-vs-longcontext-bg   { fill: #f8fafc; }
    .rag-vs-longcontext-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-vs-longcontext-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-vs-longcontext-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-vs-longcontext-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-vs-longcontext-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rag-vs-longcontext-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rag-vs-longcontext-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rag-vs-longcontext-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rag-vs-longcontext-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rag-vs-longcontext-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rag-vs-longcontext-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rag-vs-longcontext-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rag-vs-longcontext-row { opacity: 1; }
    .rag-vs-longcontext-r0 { animation-delay: 0.00s; }
    .rag-vs-longcontext-r1 { animation-delay: 0.45s; }
    .rag-vs-longcontext-r2 { animation-delay: 0.90s; }
    .rag-vs-longcontext-r3 { animation-delay: 1.35s; }
    .rag-vs-longcontext-r4 { animation-delay: 1.80s; }
    .rag-vs-longcontext-row { animation: rag-vs-longcontext-reveal 7.3s ease-in-out infinite; }
    @keyframes rag-vs-longcontext-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="rag-vs-longcontext-bg" width="980" height="390"/>
  <text class="rag-vs-longcontext-h1"  x="30" y="40">Retrieval against a long context</text>
  <text class="rag-vs-longcontext-sub" x="30" y="64">Selecting, or supplying everything.</text>
  <rect class="rag-vs-longcontext-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="rag-vs-longcontext-name" x="46" y="122">Retrieval</text>
  <text class="rag-vs-longcontext-desc" x="46" y="142">Select, then answer.</text>
  <text class="rag-vs-longcontext-desc rag-vs-longcontext-row rag-vs-longcontext-r0" x="46" y="182">Only relevant passages supplied</text>
  <text class="rag-vs-longcontext-desc rag-vs-longcontext-row rag-vs-longcontext-r1" x="46" y="216">Cost roughly flat as the corpus grows</text>
  <text class="rag-vs-longcontext-desc rag-vs-longcontext-row rag-vs-longcontext-r2" x="46" y="250">Scales to millions of documents</text>
  <text class="rag-vs-longcontext-desc rag-vs-longcontext-row rag-vs-longcontext-r3" x="46" y="284">Citations follow naturally</text>
  <text class="rag-vs-longcontext-desc rag-vs-longcontext-row rag-vs-longcontext-r4" x="46" y="318">Needs an index to build and maintain</text>
  <rect class="rag-vs-longcontext-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="rag-vs-longcontext-name" x="526" y="122">Long context</text>
  <text class="rag-vs-longcontext-desc" x="526" y="142">Supply everything.</text>
  <text class="rag-vs-longcontext-desc rag-vs-longcontext-row rag-vs-longcontext-r0" x="526" y="182">The whole corpus in the prompt</text>
  <text class="rag-vs-longcontext-desc rag-vs-longcontext-row rag-vs-longcontext-r1" x="526" y="216">Cost scales with corpus size</text>
  <text class="rag-vs-longcontext-desc rag-vs-longcontext-row rag-vs-longcontext-r2" x="526" y="250">Limited by the context window</text>
  <text class="rag-vs-longcontext-desc rag-vs-longcontext-row rag-vs-longcontext-r3" x="526" y="284">Attention degrades in the middle</text>
  <text class="rag-vs-longcontext-desc rag-vs-longcontext-row rag-vs-longcontext-r4" x="526" y="318">No infrastructure at all</text>
  <text class="rag-vs-longcontext-sub" x="30" y="372">Long context did not remove the need for retrieval and changed where the threshold sits: below a few hundred pages, supplying everything is now genuinely simpler.</text>
</svg>
