<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what is never optional.">
  <title>Where the controls are mandatory</title>
  <style>
    .mcp-security-when-bg   { fill: #f8fafc; }
    .mcp-security-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-security-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-security-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-security-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-security-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-security-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mcp-security-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mcp-security-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mcp-security-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mcp-security-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mcp-security-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mcp-security-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mcp-security-when-row { opacity: 1; }
    .mcp-security-when-r0 { animation-delay: 0.00s; }
    .mcp-security-when-r1 { animation-delay: 0.45s; }
    .mcp-security-when-r2 { animation-delay: 0.90s; }
    .mcp-security-when-r3 { animation-delay: 1.35s; }
    .mcp-security-when-r4 { animation-delay: 1.80s; }
    .mcp-security-when-row { animation: mcp-security-when-reveal 7.3s ease-in-out infinite; }
    @keyframes mcp-security-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="mcp-security-when-bg" width="980" height="390"/>
  <text class="mcp-security-when-h1"  x="30" y="40">Where the controls are mandatory</text>
  <text class="mcp-security-when-sub" x="30" y="64">And what is never optional.</text>
  <rect class="mcp-security-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="mcp-security-when-name" x="46" y="122">Full controls</text>
  <text class="mcp-security-when-desc" x="46" y="142">Real access, real data.</text>
  <text class="mcp-security-when-desc mcp-security-when-row mcp-security-when-r0" x="46" y="182">Filesystem writes</text>
  <text class="mcp-security-when-desc mcp-security-when-row mcp-security-when-r1" x="46" y="216">Database mutations</text>
  <text class="mcp-security-when-desc mcp-security-when-row mcp-security-when-r2" x="46" y="250">External network communication</text>
  <text class="mcp-security-when-desc mcp-security-when-row mcp-security-when-r3" x="46" y="284">Enterprise tools handling proprietary IP</text>
  <text class="mcp-security-when-desc mcp-security-when-row mcp-security-when-r4" x="46" y="318">Anything touching customer data</text>
  <rect class="mcp-security-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="mcp-security-when-name" x="526" y="122">Never disable</text>
  <text class="mcp-security-when-desc" x="526" y="142">Two, at any scale.</text>
  <text class="mcp-security-when-desc mcp-security-when-row mcp-security-when-r0" x="526" y="182">Path canonicalisation</text>
  <text class="mcp-security-when-desc mcp-security-when-row mcp-security-when-r1" x="526" y="216">Parameterised queries and safe APIs</text>
  <text class="mcp-security-when-desc mcp-security-when-row mcp-security-when-r2" x="526" y="250">Not in development either</text>
  <text class="mcp-security-when-desc mcp-security-when-row mcp-security-when-r3" x="526" y="284">The habits are what carry into production</text>
  <text class="mcp-security-when-desc mcp-security-when-row mcp-security-when-r4" x="526" y="318">And a local machine holds your credentials</text>
  <text class="mcp-security-when-sub" x="30" y="372">The right-hand column is deliberately absolute: these two cost nothing, and the failure they prevent — arbitrary read or arbitrary execution — is not recoverable by any later control.</text>
</svg>
