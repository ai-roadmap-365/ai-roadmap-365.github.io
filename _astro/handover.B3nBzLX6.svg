<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Not handing over a result.">
  <title>Handing over a working system</title>
  <style>
    .handover-bg   { fill: #f8fafc; }
    .handover-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .handover-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .handover-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .handover-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .handover-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .handover-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .handover-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .handover-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .handover-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .handover-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .handover-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .handover-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .handover-row { opacity: 1; }
    .handover-r0 { animation-delay: 0.00s; }
    .handover-r1 { animation-delay: 0.45s; }
    .handover-r2 { animation-delay: 0.90s; }
    .handover-r3 { animation-delay: 1.35s; }
    .handover-r4 { animation-delay: 1.80s; }
    .handover-row { animation: handover-reveal 7.3s ease-in-out infinite; }
    @keyframes handover-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="handover-bg" width="980" height="390"/>
  <text class="handover-h1"  x="30" y="40">Handing over a working system</text>
  <text class="handover-sub" x="30" y="64">Not handing over a result.</text>
  <rect class="handover-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="handover-name" x="46" y="122">A result</text>
  <text class="handover-desc" x="46" y="142">A finding.</text>
  <text class="handover-desc handover-row handover-r0" x="46" y="182">A number, and a description</text>
  <text class="handover-desc handover-row handover-r1" x="46" y="216">Reproducible only by its author</text>
  <text class="handover-desc handover-row handover-r2" x="46" y="250">No route to using it</text>
  <text class="handover-desc handover-row handover-r3" x="46" y="284">Degrades the moment it is filed</text>
  <text class="handover-desc handover-row handover-r4" x="46" y="318">This is an analysis</text>
  <rect class="handover-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="handover-name" x="526" y="122">A system</text>
  <text class="handover-desc" x="526" y="142">Something that runs.</text>
  <text class="handover-desc handover-row handover-r0" x="526" y="182">Code, artefacts, contracts, documentation</text>
  <text class="handover-desc handover-row handover-r1" x="526" y="216">Reproducible by anyone who reads it</text>
  <text class="handover-desc handover-row handover-r2" x="526" y="250">Already in use</text>
  <text class="handover-desc handover-row handover-r3" x="526" y="284">Monitored, and maintained</text>
  <text class="handover-desc handover-row handover-r4" x="526" y="318">This is a service</text>
  <text class="handover-sub" x="30" y="372">The distinction is what the recipient can do the next day, and it is the difference between work that is remembered and work that is used.</text>
</svg>
