<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Where it fits, and where it does not.">
  <title>A straight edge through scattered points</title>
  <style>
    .straight-edge-bg   { fill: #f8fafc; }
    .straight-edge-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .straight-edge-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .straight-edge-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .straight-edge-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .straight-edge-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .straight-edge-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .straight-edge-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .straight-edge-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .straight-edge-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .straight-edge-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .straight-edge-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .straight-edge-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .straight-edge-row { opacity: 1; }
    .straight-edge-r0 { animation-delay: 0.00s; }
    .straight-edge-r1 { animation-delay: 0.45s; }
    .straight-edge-r2 { animation-delay: 0.90s; }
    .straight-edge-r3 { animation-delay: 1.35s; }
    .straight-edge-r4 { animation-delay: 1.80s; }
    .straight-edge-row { animation: straight-edge-reveal 7.3s ease-in-out infinite; }
    @keyframes straight-edge-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="straight-edge-bg" width="980" height="390"/>
  <text class="straight-edge-h1"  x="30" y="40">A straight edge through scattered points</text>
  <text class="straight-edge-sub" x="30" y="64">Where it fits, and where it does not.</text>
  <rect class="straight-edge-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="straight-edge-name" x="46" y="122">Genuinely straight</text>
  <text class="straight-edge-desc" x="46" y="142">The line is the truth.</text>
  <text class="straight-edge-desc straight-edge-row straight-edge-r0" x="46" y="182">Points scatter evenly about a line</text>
  <text class="straight-edge-desc straight-edge-row straight-edge-r1" x="46" y="216">Residuals show no pattern</text>
  <text class="straight-edge-desc straight-edge-row straight-edge-r2" x="46" y="250">The slope means what it says</text>
  <text class="straight-edge-desc straight-edge-row straight-edge-r3" x="46" y="284">Prediction is trustworthy within range</text>
  <text class="straight-edge-desc straight-edge-row straight-edge-r4" x="46" y="318">This is a valid fit</text>
  <rect class="straight-edge-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="straight-edge-name" x="526" y="122">Actually curved</text>
  <text class="straight-edge-desc" x="526" y="142">The line is a compromise.</text>
  <text class="straight-edge-desc straight-edge-row straight-edge-r0" x="526" y="182">Points follow a curve</text>
  <text class="straight-edge-desc straight-edge-row straight-edge-r1" x="526" y="216">Residuals show a clear arc</text>
  <text class="straight-edge-desc straight-edge-row straight-edge-r2" x="526" y="250">The slope averages two different regimes</text>
  <text class="straight-edge-desc straight-edge-row straight-edge-r3" x="526" y="284">Prediction is wrong at both ends</text>
  <text class="straight-edge-desc straight-edge-row straight-edge-r4" x="526" y="318">This is a misspecified fit</text>
  <text class="straight-edge-sub" x="30" y="372">Both can report a respectable fit statistic, which is why the residual plot rather than the score is the diagnostic that separates them.</text>
</svg>
