<svg role="img" aria-label="Course 04 completion roadmap diagram highlighting foundational supervised algorithms unsupervised learning and production ML deployment engineering" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Course 04 Machine Learning Mastery Architecture</title>
  <defs>
    <linearGradient id="bg196b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="courseCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg196b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">COURSE 04: MACHINE LEARNING MASTERY RECAPITULATION</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">From Mathematical First Principles to Production-Grade Enterprise ML Systems</text>
  <g transform="translate(50, 85)">
    <rect width="750" height="295" fill="url(#courseCard)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Track 1 -->
    <rect x="30" y="30" width="210" height="235" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="135" y="55" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">1. Supervised Learning</text>
    <text x="45" y="85" fill="#cbd5e1" font-family="system-ui" font-size="9">• Linear &amp; Logistic Regression</text>
    <text x="45" y="110" fill="#cbd5e1" font-family="system-ui" font-size="9">• Decision Trees &amp; Random Forests</text>
    <text x="45" y="135" fill="#cbd5e1" font-family="system-ui" font-size="9">• Gradient Boosting (LightGBM)</text>
    <text x="45" y="160" fill="#cbd5e1" font-family="system-ui" font-size="9">• SVMs &amp; Kernel Methods</text>
    <text x="45" y="185" fill="#cbd5e1" font-family="system-ui" font-size="9">• Bias-Variance &amp; Regularization</text>
    <text x="135" y="240" fill="#7dd3fc" font-family="system-ui" font-size="9" text-anchor="middle">Weeks 21 – 26</text>
    <!-- Track 2 -->
    <rect x="270" y="30" width="210" height="235" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" rx="6"/>
    <text x="375" y="55" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">2. Unsupervised Learning</text>
    <text x="285" y="85" fill="#cbd5e1" font-family="system-ui" font-size="9">• K-Means &amp; K-Means++</text>
    <text x="285" y="110" fill="#cbd5e1" font-family="system-ui" font-size="9">• Hierarchical &amp; DBSCAN</text>
    <text x="285" y="135" fill="#cbd5e1" font-family="system-ui" font-size="9">• PCA &amp; SVD Decomposition</text>
    <text x="285" y="160" fill="#cbd5e1" font-family="system-ui" font-size="9">• t-SNE &amp; UMAP Manifolds</text>
    <text x="285" y="185" fill="#cbd5e1" font-family="system-ui" font-size="9">• Anomaly &amp; Recommenders</text>
    <text x="375" y="240" fill="#fde68a" font-family="system-ui" font-size="9" text-anchor="middle">Week 27</text>
    <!-- Track 3 -->
    <rect x="510" y="30" width="210" height="235" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="615" y="55" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">3. ML in Practice (MLOps)</text>
    <text x="525" y="85" fill="#cbd5e1" font-family="system-ui" font-size="9">• Project Lifecycle &amp; Gates</text>
    <text x="525" y="110" fill="#cbd5e1" font-family="system-ui" font-size="9">• Data Curation &amp; Weak Superv.</text>
    <text x="525" y="135" fill="#cbd5e1" font-family="system-ui" font-size="9">• Time Series &amp; Autoregression</text>
    <text x="525" y="160" fill="#cbd5e1" font-family="system-ui" font-size="9">• Registries &amp; Provenance</text>
    <text x="525" y="185" fill="#cbd5e1" font-family="system-ui" font-size="9">• FastAPI Serving &amp; Drift PSI</text>
    <text x="615" y="240" fill="#a7f3d0" font-family="system-ui" font-size="9" text-anchor="middle">Week 28 (Capstone)</text>
  </g>
</svg>
