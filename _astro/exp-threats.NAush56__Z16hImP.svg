<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four of them.">
  <title>Threats to a valid result</title>
  <style>
    .exp-threats-bg   { fill: #f8fafc; }
    .exp-threats-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exp-threats-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exp-threats-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exp-threats-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exp-threats-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exp-threats-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exp-threats-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .exp-threats-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .exp-threats-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .exp-threats-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .exp-threats-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .exp-threats-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .exp-threats-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .exp-threats-stage { opacity: 1; }

    .exp-threats-s0 { animation-delay: 0.00s; }
    .exp-threats-e0 { animation-delay: 0.00s; }
    .exp-threats-s1 { animation-delay: 1.28s; }
    .exp-threats-e1 { animation-delay: 1.28s; }
    .exp-threats-s2 { animation-delay: 2.56s; }
    .exp-threats-e2 { animation-delay: 2.56s; }
    .exp-threats-s3 { animation-delay: 3.84s; }
    .exp-threats-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .exp-threats-conn  { animation: exp-threats-trace 6.4s ease-in-out infinite; }
      .exp-threats-stage { animation: exp-threats-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes exp-threats-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes exp-threats-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .exp-threats-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .exp-threats-stage { animation: exp-threats-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes exp-threats-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="exp-threats-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="exp-threats-bg" width="980" height="322"/>
  <text class="exp-threats-h1"  x="30" y="40">Threats to a valid result</text>
  <text class="exp-threats-sub" x="30" y="64">Four of them.</text>
  <g class="exp-threats-stage exp-threats-s0">
    <rect class="exp-threats-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="exp-threats-step" x="44" y="142">01</text>
    <text class="exp-threats-name" x="70" y="142">Assignment that was not truly random</text>
    <text class="exp-threats-desc" x="44" y="166">Which reintroduces confounding.</text>
  </g>
  <line class="exp-threats-line exp-threats-conn exp-threats-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#exp-threats-tip)"/>
  <g class="exp-threats-stage exp-threats-s1">
    <rect class="exp-threats-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="exp-threats-step" x="280" y="142">02</text>
    <text class="exp-threats-name" x="306" y="142">Participants dropping out unevenly</text>
    <text class="exp-threats-desc" x="280" y="166">Which unbalances the groups.</text>
  </g>
  <line class="exp-threats-line exp-threats-conn exp-threats-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#exp-threats-tip)"/>
  <g class="exp-threats-stage exp-threats-s2">
    <rect class="exp-threats-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="exp-threats-step" x="516" y="142">03</text>
    <text class="exp-threats-name" x="542" y="142">The treatment leaking into the control group</text>
    <text class="exp-threats-desc" x="516" y="166">Which shrinks the measured</text>
    <text class="exp-threats-desc" x="516" y="182">effect.</text>
  </g>
  <line class="exp-threats-line exp-threats-conn exp-threats-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#exp-threats-tip)"/>
  <g class="exp-threats-stage exp-threats-s3">
    <rect class="exp-threats-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="exp-threats-step" x="752" y="142">04</text>
    <text class="exp-threats-name" x="778" y="142">And repeatedly checking results as data arrives</text>
    <text class="exp-threats-desc" x="752" y="166">Which inflates false positives.</text>
  </g>
  <text class="exp-threats-sub" x="30" y="304">Peeking is the most common failure in online experimentation, and it is why sequential testing methods exist as a principled alternative.</text>
</svg>
