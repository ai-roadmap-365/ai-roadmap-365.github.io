<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Because sooner or later, it will run twice.">
  <title>A job you can safely run twice</title>
  <style>
    .idempotence-bg   { fill: #f8fafc; }
    .idempotence-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .idempotence-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .idempotence-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .idempotence-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .idempotence-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .idempotence-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .idempotence-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .idempotence-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .idempotence-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .idempotence-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .idempotence-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .idempotence-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .idempotence-row { opacity: 1; }
    .idempotence-r0 { animation-delay: 0.00s; }
    .idempotence-r1 { animation-delay: 0.45s; }
    .idempotence-r2 { animation-delay: 0.90s; }
    .idempotence-r3 { animation-delay: 1.35s; }
    .idempotence-r4 { animation-delay: 1.80s; }
    .idempotence-row { animation: idempotence-reveal 7.3s ease-in-out infinite; }
    @keyframes idempotence-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="idempotence-bg" width="980" height="390"/>
  <text class="idempotence-h1"  x="30" y="40">A job you can safely run twice</text>
  <text class="idempotence-sub" x="30" y="64">Because sooner or later, it will run twice.</text>
  <rect class="idempotence-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="idempotence-name" x="46" y="122">Unsafe to repeat</text>
  <text class="idempotence-desc" x="46" y="142">The second run does harm.</text>
  <text class="idempotence-desc idempotence-row idempotence-r0" x="46" y="182">Appends the same rows again</text>
  <text class="idempotence-desc idempotence-row idempotence-r1" x="46" y="216">Re-downloads what is already there</text>
  <text class="idempotence-desc idempotence-row idempotence-r2" x="46" y="250">Sends the notification twice</text>
  <text class="idempotence-desc idempotence-row idempotence-r3" x="46" y="284">Deletes based on a count, not a date</text>
  <text class="idempotence-desc idempotence-row idempotence-r4" x="46" y="318">Assumes it is the first run, always</text>
  <rect class="idempotence-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="idempotence-name" x="526" y="122">Idempotent</text>
  <text class="idempotence-desc" x="526" y="142">The second run is a no-op.</text>
  <text class="idempotence-desc idempotence-row idempotence-r0" x="526" y="182">Checks whether the row exists first</text>
  <text class="idempotence-desc idempotence-row idempotence-r1" x="526" y="216">Skips files already present and complete</text>
  <text class="idempotence-desc idempotence-row idempotence-r2" x="526" y="250">Records what it has already sent</text>
  <text class="idempotence-desc idempotence-row idempotence-r3" x="526" y="284">Deletes by an absolute rule, not a relative one</text>
  <text class="idempotence-desc idempotence-row idempotence-r4" x="526" y="318">Safe to re-run after any failure</text>
  <text class="idempotence-sub" x="30" y="372">Overlap is the case people forget: a job scheduled every five minutes that sometimes takes six will run alongside itself. A lock file is the usual answer.</text>
</svg>
