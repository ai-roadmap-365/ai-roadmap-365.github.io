<svg role="img" aria-label="Taxonomy of computer vision data augmentation techniques categorized into geometric transformations photometric alterations and advanced mixing strategies" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Computer Vision Data Augmentation Taxonomy</title>
  <defs>
    <linearGradient id="bg214a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card214" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg214a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">COMPUTER VISION DATA AUGMENTATION TAXONOMY</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Synthesizing Visual Invariances to Prevent Overfitting and Boost Generalization</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card214)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Category 1: Geometric Transforms -->
    <rect x="25" y="25" width="220" height="245" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="135" y="48" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">1. Geometric Transforms</text>
    <rect x="40" y="65" width="190" height="190" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="135" y="90" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">Spatial Coordinate Mapping</text>
    <text x="135" y="115" fill="#cbd5e1" font-size="8" text-anchor="middle">• Random Horizontal Flip (p=0.5)</text>
    <text x="135" y="135" fill="#cbd5e1" font-size="8" text-anchor="middle">• Random Resized Crop (Scale: 0.8-1.0)</text>
    <text x="135" y="155" fill="#cbd5e1" font-size="8" text-anchor="middle">• Random Rotation (+/- 15 deg)</text>
    <text x="135" y="175" fill="#cbd5e1" font-size="8" text-anchor="middle">• Random Affine &amp; Shear</text>
    <text x="135" y="195" fill="#cbd5e1" font-size="8" text-anchor="middle">• Perspective Distortion</text>
    <text x="135" y="235" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">Invariance: Viewpoint &amp; Scale</text>

    <!-- Category 2: Photometric Alterations -->
    <rect x="270" y="25" width="220" height="245" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="380" y="48" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">2. Photometric Alterations</text>
    <rect x="285" y="65" width="190" height="190" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="380" y="90" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">Pixel Intensity Modulation</text>
    <text x="380" y="115" fill="#cbd5e1" font-size="8" text-anchor="middle">• Color Jitter (Brightness/Contrast)</text>
    <text x="380" y="135" fill="#cbd5e1" font-size="8" text-anchor="middle">• Saturation &amp; Hue Shift</text>
    <text x="380" y="155" fill="#cbd5e1" font-size="8" text-anchor="middle">• Gaussian Blur &amp; Sharpness</text>
    <text x="380" y="175" fill="#cbd5e1" font-size="8" text-anchor="middle">• Random Grayscale (p=0.1)</text>
    <text x="380" y="195" fill="#cbd5e1" font-size="8" text-anchor="middle">• Random Solarization &amp; Posterize</text>
    <text x="380" y="235" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">Invariance: Illumination &amp; Camera</text>

    <!-- Category 3: Advanced Mixing & Masking -->
    <rect x="515" y="25" width="220" height="245" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="625" y="48" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">3. Advanced Mixing &amp; Erasing</text>
    <rect x="530" y="65" width="190" height="190" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="625" y="90" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">Cross-Sample Regularization</text>
    <text x="625" y="115" fill="#cbd5e1" font-size="8" text-anchor="middle">• Cutout / Random Erasing</text>
    <text x="625" y="135" fill="#cbd5e1" font-size="8" text-anchor="middle">• MixUp (Linear Blend: lambda*x1 + (1-lambda)*x2)</text>
    <text x="625" y="155" fill="#cbd5e1" font-size="8" text-anchor="middle">• CutMix (Patch Pasting)</text>
    <text x="625" y="175" fill="#cbd5e1" font-size="8" text-anchor="middle">• AutoAugment &amp; RandAugment</text>
    <text x="625" y="195" fill="#cbd5e1" font-size="8" text-anchor="middle">• Mosaic (4-Image Grid for YOLO)</text>
    <text x="625" y="235" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Invariance: Occlusion &amp; Linearity</text>
  </g>
</svg>
