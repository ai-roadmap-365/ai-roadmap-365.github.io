<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="PAIR Automated Jailbreak Feedback Loop">
  <title>PAIR Automated Jailbreak Feedback Loop</title>
  <defs>
    <style>
      .d349a-bg { fill: #f8fafc; }
      .d349a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d349a-atk { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; rx: 8px; }
      .d349a-tgt { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d349a-jdg { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d349a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d349a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d349a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d349a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d349a-bg" />
  
  <text x="40" y="40" class="d349a-title">PAIR: Automated Iterative Jailbreak Fuzzing</text>
  <text x="40" y="65" class="d349a-subtitle">PAIR Automated Jailbreak Feedback Loop showing Attacker LLM candidate mutation, Target AI System execution, Safety Judge scoring, and iterative refinement loop</text>
  
  <!-- 1. Attacker LLM -->
  <rect x="40" y="110" width="240" height="270" class="d349a-atk" />
  <text x="55" y="145" class="d349a-header" fill="#b91c1c">1. Attacker LLM (Fuzzer)</text>
  <text x="55" y="180" class="d349a-text">• Receives malicious objective</text>
  <text x="55" y="205" class="d349a-text">• Mutates semantic phrasing</text>
  <text x="55" y="230" class="d349a-text">• Applies persona framing</text>
  <text x="55" y="255" class="d349a-text">• Injects obfuscation ciphers</text>
  <text x="55" y="295" class="d349a-text" font-weight="600" fill="#b91c1c">Iterative Prompt Generator</text>
  <text x="55" y="320" class="d349a-text">Optimizes toward bypass</text>
  
  <!-- 2. Target System -->
  <rect x="315" y="110" width="240" height="270" class="d349a-tgt" />
  <text x="330" y="145" class="d349a-header" fill="#1d4ed8">2. Target AI System</text>
  <text x="330" y="180" class="d349a-text">• System Prompt &amp; Context</text>
  <text x="330" y="205" class="d349a-text">• Gateway Prompt Firewall</text>
  <text x="330" y="230" class="d349a-text">• Model Inference Engine</text>
  <text x="330" y="255" class="d349a-text">• Agent Tool Execution</text>
  <text x="330" y="295" class="d349a-text" font-weight="600" fill="#1d4ed8">System Under Test</text>
  <text x="330" y="320" class="d349a-text">Returns completion or refusal</text>
  
  <!-- 3. Safety Judge -->
  <rect x="590" y="110" width="270" height="270" class="d349a-jdg" />
  <text x="605" y="145" class="d349a-header" fill="#7e22ce">3. LLM-as-a-Judge Evaluator</text>
  <text x="605" y="180" class="d349a-text">• Evaluates completion safety</text>
  <text x="605" y="205" class="d349a-text">• Classifies: Refusal vs Jailbreak</text>
  <text x="605" y="230" class="d349a-text">• Scores bypass: 1 (Safe) - 10 (Breach)</text>
  <text x="605" y="255" class="d349a-text">• Provides feedback to Attacker</text>
  <text x="605" y="295" class="d349a-text" font-weight="600" fill="#7e22ce">Automated Scoring Feedback</text>
  <text x="605" y="320" class="d349a-text">Calculates Attack Success Rate</text>
</svg>