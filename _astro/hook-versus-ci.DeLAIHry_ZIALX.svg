<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One is a courtesy to you. The other is a guarantee to everyone else.">
  <title>The same check, run in two places, for two different reasons</title>
  <style>
    .hook-versus-ci-bg   { fill: #f8fafc; }
    .hook-versus-ci-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hook-versus-ci-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hook-versus-ci-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hook-versus-ci-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hook-versus-ci-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hook-versus-ci-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hook-versus-ci-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hook-versus-ci-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hook-versus-ci-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hook-versus-ci-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hook-versus-ci-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hook-versus-ci-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hook-versus-ci-row { opacity: 1; }
    .hook-versus-ci-r0 { animation-delay: 0.00s; }
    .hook-versus-ci-r1 { animation-delay: 0.45s; }
    .hook-versus-ci-r2 { animation-delay: 0.90s; }
    .hook-versus-ci-r3 { animation-delay: 1.35s; }
    .hook-versus-ci-r4 { animation-delay: 1.80s; }
    .hook-versus-ci-row { animation: hook-versus-ci-reveal 7.3s ease-in-out infinite; }
    @keyframes hook-versus-ci-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="hook-versus-ci-bg" width="980" height="390"/>
  <text class="hook-versus-ci-h1"  x="30" y="40">The same check, run in two places, for two different reasons</text>
  <text class="hook-versus-ci-sub" x="30" y="64">One is a courtesy to you. The other is a guarantee to everyone else.</text>
  <rect class="hook-versus-ci-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="hook-versus-ci-name" x="46" y="122">Pre-commit hook</text>
  <text class="hook-versus-ci-desc" x="46" y="142">Fast, local, skippable</text>
  <text class="hook-versus-ci-desc hook-versus-ci-row hook-versus-ci-r0" x="46" y="182">Feedback in a second, before the commit exists</text>
  <text class="hook-versus-ci-desc hook-versus-ci-row hook-versus-ci-r1" x="46" y="216">Runs only on the files you staged</text>
  <text class="hook-versus-ci-desc hook-versus-ci-row hook-versus-ci-r2" x="46" y="250">--no-verify skips it entirely</text>
  <text class="hook-versus-ci-desc hook-versus-ci-row hook-versus-ci-r3" x="46" y="284">Not installed on a new clone unless someone does it</text>
  <text class="hook-versus-ci-desc hook-versus-ci-row hook-versus-ci-r4" x="46" y="318">A courtesy to the person typing</text>
  <rect class="hook-versus-ci-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="hook-versus-ci-name" x="526" y="122">The same check in CI</text>
  <text class="hook-versus-ci-desc" x="526" y="142">Slower, shared, binding</text>
  <text class="hook-versus-ci-desc hook-versus-ci-row hook-versus-ci-r0" x="526" y="182">Runs for everyone, on every push</text>
  <text class="hook-versus-ci-desc hook-versus-ci-row hook-versus-ci-r1" x="526" y="216">Runs on the whole repository</text>
  <text class="hook-versus-ci-desc hook-versus-ci-row hook-versus-ci-r2" x="526" y="250">Cannot be individually bypassed</text>
  <text class="hook-versus-ci-desc hook-versus-ci-row hook-versus-ci-r3" x="526" y="284">Branch protection makes its verdict binding</text>
  <text class="hook-versus-ci-desc hook-versus-ci-row hook-versus-ci-r4" x="526" y="318">A guarantee to everyone else</text>
  <text class="hook-versus-ci-sub" x="30" y="372">Both, not either. The hook catches it early; CI is what makes it true.</text>
</svg>
