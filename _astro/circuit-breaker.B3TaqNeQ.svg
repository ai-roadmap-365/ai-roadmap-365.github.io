<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Trips in milliseconds, contains the fault.">
  <title>A household circuit breaker</title>
  <style>
    .circuit-breaker-bg   { fill: #f8fafc; }
    .circuit-breaker-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .circuit-breaker-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .circuit-breaker-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .circuit-breaker-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .circuit-breaker-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .circuit-breaker-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .circuit-breaker-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .circuit-breaker-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .circuit-breaker-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .circuit-breaker-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .circuit-breaker-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .circuit-breaker-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .circuit-breaker-row { opacity: 1; }
    .circuit-breaker-r0 { animation-delay: 0.00s; }
    .circuit-breaker-r1 { animation-delay: 0.45s; }
    .circuit-breaker-r2 { animation-delay: 0.90s; }
    .circuit-breaker-r3 { animation-delay: 1.35s; }
    .circuit-breaker-r4 { animation-delay: 1.80s; }
    .circuit-breaker-row { animation: circuit-breaker-reveal 7.3s ease-in-out infinite; }
    @keyframes circuit-breaker-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="circuit-breaker-bg" width="980" height="390"/>
  <text class="circuit-breaker-h1"  x="30" y="40">A household circuit breaker</text>
  <text class="circuit-breaker-sub" x="30" y="64">Trips in milliseconds, contains the fault.</text>
  <rect class="circuit-breaker-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="circuit-breaker-name" x="46" y="122">Protected</text>
  <text class="circuit-breaker-desc" x="46" y="142">Contained in milliseconds.</text>
  <text class="circuit-breaker-desc circuit-breaker-row circuit-breaker-r0" x="46" y="182">Normal appliances draw power normally</text>
  <text class="circuit-breaker-desc circuit-breaker-row circuit-breaker-r1" x="46" y="216">A short circuit is detected instantly</text>
  <text class="circuit-breaker-desc circuit-breaker-row circuit-breaker-r2" x="46" y="250">The breaker trips before wires heat</text>
  <text class="circuit-breaker-desc circuit-breaker-row circuit-breaker-r3" x="46" y="284">The rest of the house stays on</text>
  <text class="circuit-breaker-desc circuit-breaker-row circuit-breaker-r4" x="46" y="318">Nobody had to be watching</text>
  <rect class="circuit-breaker-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="circuit-breaker-name" x="526" y="122">Unprotected</text>
  <text class="circuit-breaker-desc" x="526" y="142">Nothing intervenes.</text>
  <text class="circuit-breaker-desc circuit-breaker-row circuit-breaker-r0" x="526" y="182">Everything works, until it does not</text>
  <text class="circuit-breaker-desc circuit-breaker-row circuit-breaker-r1" x="526" y="216">The fault draws current unchecked</text>
  <text class="circuit-breaker-desc circuit-breaker-row circuit-breaker-r2" x="526" y="250">Wires overheat</text>
  <text class="circuit-breaker-desc circuit-breaker-row circuit-breaker-r3" x="526" y="284">The whole house is at risk</text>
  <text class="circuit-breaker-desc circuit-breaker-row circuit-breaker-r4" x="526" y="318">Discovered by the smoke</text>
  <text class="circuit-breaker-sub" x="30" y="372">"The rest of the house stays on" is the property worth designing for: a guardrail should refuse one request, not degrade the service, which is why safe fallbacks matter as much as detection.</text>
</svg>
