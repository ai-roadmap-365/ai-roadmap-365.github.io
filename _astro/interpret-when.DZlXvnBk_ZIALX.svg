<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the question.">
  <title>Which interpretability tool when</title>
  <style>
    .interpret-when-bg   { fill: #f8fafc; }
    .interpret-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interpret-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interpret-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interpret-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interpret-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interpret-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .interpret-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .interpret-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .interpret-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .interpret-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .interpret-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .interpret-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .interpret-when-row { opacity: 1; }
    .interpret-when-r0 { animation-delay: 0.00s; }
    .interpret-when-r1 { animation-delay: 0.45s; }
    .interpret-when-r2 { animation-delay: 0.90s; }
    .interpret-when-r3 { animation-delay: 1.35s; }
    .interpret-when-r4 { animation-delay: 1.80s; }
    .interpret-when-row { animation: interpret-when-reveal 7.3s ease-in-out infinite; }
    @keyframes interpret-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="interpret-when-bg" width="980" height="390"/>
  <text class="interpret-when-h1"  x="30" y="40">Which interpretability tool when</text>
  <text class="interpret-when-sub" x="30" y="64">By the question.</text>
  <rect class="interpret-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="interpret-when-name" x="46" y="122">The question</text>
  <text class="interpret-when-desc" x="46" y="142">What you need.</text>
  <text class="interpret-when-desc interpret-when-row interpret-when-r0" x="46" y="182">Why was this one case decided so?</text>
  <text class="interpret-when-desc interpret-when-row interpret-when-r1" x="46" y="216">What does the model rely on overall?</text>
  <text class="interpret-when-desc interpret-when-row interpret-when-r2" x="46" y="250">How does this feature affect predictions?</text>
  <text class="interpret-when-desc interpret-when-row interpret-when-r3" x="46" y="284">Is there leakage in the features?</text>
  <text class="interpret-when-desc interpret-when-row interpret-when-r4" x="46" y="318">Does the model treat groups differently?</text>
  <rect class="interpret-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="interpret-when-name" x="526" y="122">The method</text>
  <text class="interpret-when-desc" x="526" y="142">What to use.</text>
  <text class="interpret-when-desc interpret-when-row interpret-when-r0" x="526" y="182">Local attribution for that prediction</text>
  <text class="interpret-when-desc interpret-when-row interpret-when-r1" x="526" y="216">Permutation importance on held-out data</text>
  <text class="interpret-when-desc interpret-when-row interpret-when-r2" x="526" y="250">Partial dependence, with individual curves</text>
  <text class="interpret-when-desc interpret-when-row interpret-when-r3" x="526" y="284">Attribution, looking for implausible dominance</text>
  <text class="interpret-when-desc interpret-when-row interpret-when-r4" x="526" y="318">Attribution aggregated per subgroup</text>
  <text class="interpret-when-sub" x="30" y="372">The last row is how fairness auditing is actually done in practice, and it reuses the same machinery rather than requiring a separate toolkit.</text>
</svg>
