<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And its flaw.">
  <title>Weighing independent testimony</title>
  <style>
    .nb-analogy-detail-bg   { fill: #f8fafc; }
    .nb-analogy-detail-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-analogy-detail-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-analogy-detail-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-analogy-detail-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-analogy-detail-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-analogy-detail-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nb-analogy-detail-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .nb-analogy-detail-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .nb-analogy-detail-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .nb-analogy-detail-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .nb-analogy-detail-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .nb-analogy-detail-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .nb-analogy-detail-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .nb-analogy-detail-stage { opacity: 1; }

    .nb-analogy-detail-s0 { animation-delay: 0.00s; }
    .nb-analogy-detail-e0 { animation-delay: 0.00s; }
    .nb-analogy-detail-s1 { animation-delay: 1.28s; }
    .nb-analogy-detail-e1 { animation-delay: 1.28s; }
    .nb-analogy-detail-s2 { animation-delay: 2.56s; }
    .nb-analogy-detail-e2 { animation-delay: 2.56s; }
    .nb-analogy-detail-s3 { animation-delay: 3.84s; }
    .nb-analogy-detail-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .nb-analogy-detail-conn  { animation: nb-analogy-detail-trace 6.4s ease-in-out infinite; }
      .nb-analogy-detail-stage { animation: nb-analogy-detail-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes nb-analogy-detail-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes nb-analogy-detail-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .nb-analogy-detail-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .nb-analogy-detail-stage { animation: nb-analogy-detail-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes nb-analogy-detail-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="nb-analogy-detail-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="nb-analogy-detail-bg" width="980" height="322"/>
  <text class="nb-analogy-detail-h1"  x="30" y="40">Weighing independent testimony</text>
  <text class="nb-analogy-detail-sub" x="30" y="64">And its flaw.</text>
  <g class="nb-analogy-detail-stage nb-analogy-detail-s0">
    <rect class="nb-analogy-detail-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="nb-analogy-detail-step" x="44" y="142">01</text>
    <text class="nb-analogy-detail-name" x="70" y="142">Several independent witnesses agree</text>
    <text class="nb-analogy-detail-desc" x="44" y="166">Each adds genuinely new</text>
    <text class="nb-analogy-detail-desc" x="44" y="182">evidence.</text>
  </g>
  <line class="nb-analogy-detail-line nb-analogy-detail-conn nb-analogy-detail-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#nb-analogy-detail-tip)"/>
  <g class="nb-analogy-detail-stage nb-analogy-detail-s1">
    <rect class="nb-analogy-detail-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="nb-analogy-detail-step" x="280" y="142">02</text>
    <text class="nb-analogy-detail-name" x="306" y="142">So confidence accumulates quickly</text>
    <text class="nb-analogy-detail-desc" x="280" y="166">Which is correct when they are</text>
    <text class="nb-analogy-detail-desc" x="280" y="182">independent.</text>
  </g>
  <line class="nb-analogy-detail-line nb-analogy-detail-conn nb-analogy-detail-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#nb-analogy-detail-tip)"/>
  <g class="nb-analogy-detail-stage nb-analogy-detail-s2">
    <rect class="nb-analogy-detail-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="nb-analogy-detail-step" x="516" y="142">03</text>
    <text class="nb-analogy-detail-name" x="542" y="142">But if they all heard it from one source</text>
    <text class="nb-analogy-detail-desc" x="516" y="166">They are one witness counted</text>
    <text class="nb-analogy-detail-desc" x="516" y="182">several times.</text>
  </g>
  <line class="nb-analogy-detail-line nb-analogy-detail-conn nb-analogy-detail-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#nb-analogy-detail-tip)"/>
  <g class="nb-analogy-detail-stage nb-analogy-detail-s3">
    <rect class="nb-analogy-detail-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="nb-analogy-detail-step" x="752" y="142">04</text>
    <text class="nb-analogy-detail-name" x="778" y="142">And confidence becomes badly overstated</text>
    <text class="nb-analogy-detail-desc" x="752" y="166">Which is exactly what correlated</text>
    <text class="nb-analogy-detail-desc" x="752" y="182">features do.</text>
  </g>
  <text class="nb-analogy-detail-sub" x="30" y="304">The analogy explains the failure mode precisely: correlated features are witnesses repeating a single rumour, and the model treats each repetition as fresh evidence.</text>
</svg>
