<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One is not the other.">
  <title>A blueprint and a building</title>
  <style>
    .blueprint-building-bg   { fill: #f8fafc; }
    .blueprint-building-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blueprint-building-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blueprint-building-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blueprint-building-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blueprint-building-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blueprint-building-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .blueprint-building-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .blueprint-building-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .blueprint-building-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .blueprint-building-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .blueprint-building-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .blueprint-building-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .blueprint-building-row { opacity: 1; }
    .blueprint-building-r0 { animation-delay: 0.00s; }
    .blueprint-building-r1 { animation-delay: 0.45s; }
    .blueprint-building-r2 { animation-delay: 0.90s; }
    .blueprint-building-r3 { animation-delay: 1.35s; }
    .blueprint-building-r4 { animation-delay: 1.80s; }
    .blueprint-building-row { animation: blueprint-building-reveal 7.3s ease-in-out infinite; }
    @keyframes blueprint-building-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="blueprint-building-bg" width="980" height="390"/>
  <text class="blueprint-building-h1"  x="30" y="40">A blueprint and a building</text>
  <text class="blueprint-building-sub" x="30" y="64">One is not the other.</text>
  <rect class="blueprint-building-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="blueprint-building-name" x="46" y="122">The blueprint</text>
  <text class="blueprint-building-desc" x="46" y="142">The template.</text>
  <text class="blueprint-building-desc blueprint-building-row blueprint-building-r0" x="46" y="182">One document</text>
  <text class="blueprint-building-desc blueprint-building-row blueprint-building-r1" x="46" y="216">Describes what a building will have</text>
  <text class="blueprint-building-desc blueprint-building-row blueprint-building-r2" x="46" y="250">Nobody lives in it</text>
  <text class="blueprint-building-desc blueprint-building-row blueprint-building-r3" x="46" y="284">Changing it affects future buildings</text>
  <text class="blueprint-building-desc blueprint-building-row blueprint-building-r4" x="46" y="318">This is the class</text>
  <rect class="blueprint-building-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="blueprint-building-name" x="526" y="122">A building</text>
  <text class="blueprint-building-desc" x="526" y="142">An instance.</text>
  <text class="blueprint-building-desc blueprint-building-row blueprint-building-r0" x="526" y="182">Many, from one blueprint</text>
  <text class="blueprint-building-desc blueprint-building-row blueprint-building-r1" x="526" y="216">Has its own address and contents</text>
  <text class="blueprint-building-desc blueprint-building-row blueprint-building-r2" x="526" y="250">People live in it</text>
  <text class="blueprint-building-desc blueprint-building-row blueprint-building-r3" x="526" y="284">Changing one affects only it</text>
  <text class="blueprint-building-desc blueprint-building-row blueprint-building-r4" x="526" y="318">This is an instance</text>
  <text class="blueprint-building-sub" x="30" y="372">The last row of each column is where class attributes surprise people: changing the blueprint after the buildings exist does affect them, which the analogy does not.</text>
</svg>
