<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when a script is fine.">
  <title>When the harness is worth building</title>
  <style>
    .harness-when-bg   { fill: #f8fafc; }
    .harness-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .harness-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .harness-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .harness-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .harness-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .harness-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .harness-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .harness-when-row { opacity: 1; }
    .harness-when-r0 { animation-delay: 0.00s; }
    .harness-when-r1 { animation-delay: 0.45s; }
    .harness-when-r2 { animation-delay: 0.90s; }
    .harness-when-r3 { animation-delay: 1.35s; }
    .harness-when-r4 { animation-delay: 1.80s; }
    .harness-when-row { animation: harness-when-reveal 7.3s ease-in-out infinite; }
    @keyframes harness-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="harness-when-bg" width="980" height="390"/>
  <text class="harness-when-h1"  x="30" y="40">When the harness is worth building</text>
  <text class="harness-when-sub" x="30" y="64">And when a script is fine.</text>
  <rect class="harness-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="harness-when-name" x="46" y="122">Build the harness</text>
  <text class="harness-when-desc" x="46" y="142">Anything you will repeat.</text>
  <text class="harness-when-desc harness-when-row harness-when-r0" x="46" y="182">Multi-day training runs</text>
  <text class="harness-when-desc harness-when-row harness-when-r1" x="46" y="216">Experiments you must compare</text>
  <text class="harness-when-desc harness-when-row harness-when-r2" x="46" y="250">Anything that will be deployed</text>
  <text class="harness-when-desc harness-when-row harness-when-r3" x="46" y="284">Anything a colleague will reproduce</text>
  <text class="harness-when-desc harness-when-row harness-when-r4" x="46" y="318">Anything with a compute budget worth protecting</text>
  <rect class="harness-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="harness-when-name" x="526" y="122">A script is fine</text>
  <text class="harness-when-desc" x="526" y="142">Once, and thrown away.</text>
  <text class="harness-when-desc harness-when-row harness-when-r0" x="526" y="182">A five-minute sanity check</text>
  <text class="harness-when-desc harness-when-row harness-when-r1" x="526" y="216">Exploring an idea before committing</text>
  <text class="harness-when-desc harness-when-row harness-when-r2" x="526" y="250">No comparison to make</text>
  <text class="harness-when-desc harness-when-row harness-when-r3" x="526" y="284">But seed it anyway</text>
  <text class="harness-when-desc harness-when-row harness-when-r4" x="526" y="318">And save more than the weights</text>
  <text class="harness-when-sub" x="30" y="372">The two carve-outs on the right cost almost nothing and prevent the most common regret: an exploratory run that produced a surprisingly good result nobody can reproduce.</text>
</svg>
