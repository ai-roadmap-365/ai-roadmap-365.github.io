<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what each cannot see.">
  <title>What each retriever is good at</title>
  <style>
    .dense-or-keyword-bg   { fill: #f8fafc; }
    .dense-or-keyword-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dense-or-keyword-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dense-or-keyword-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dense-or-keyword-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dense-or-keyword-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dense-or-keyword-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dense-or-keyword-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dense-or-keyword-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dense-or-keyword-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dense-or-keyword-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dense-or-keyword-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dense-or-keyword-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dense-or-keyword-row { opacity: 1; }
    .dense-or-keyword-r0 { animation-delay: 0.00s; }
    .dense-or-keyword-r1 { animation-delay: 0.45s; }
    .dense-or-keyword-r2 { animation-delay: 0.90s; }
    .dense-or-keyword-r3 { animation-delay: 1.35s; }
    .dense-or-keyword-r4 { animation-delay: 1.80s; }
    .dense-or-keyword-row { animation: dense-or-keyword-reveal 7.3s ease-in-out infinite; }
    @keyframes dense-or-keyword-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="dense-or-keyword-bg" width="980" height="390"/>
  <text class="dense-or-keyword-h1"  x="30" y="40">What each retriever is good at</text>
  <text class="dense-or-keyword-sub" x="30" y="64">And what each cannot see.</text>
  <rect class="dense-or-keyword-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="dense-or-keyword-name" x="46" y="122">Dense (embeddings)</text>
  <text class="dense-or-keyword-desc" x="46" y="142">Meaning, not letters.</text>
  <text class="dense-or-keyword-desc dense-or-keyword-row dense-or-keyword-r0" x="46" y="182">Finds paraphrases and synonyms</text>
  <text class="dense-or-keyword-desc dense-or-keyword-row dense-or-keyword-r1" x="46" y="216">"How do I cancel?" finds "terminating a subscription"</text>
  <text class="dense-or-keyword-desc dense-or-keyword-row dense-or-keyword-r2" x="46" y="250">Blind to exact identifiers</text>
  <text class="dense-or-keyword-desc dense-or-keyword-row dense-or-keyword-r3" x="46" y="284">Blurs rare product codes and names</text>
  <text class="dense-or-keyword-desc dense-or-keyword-row dense-or-keyword-r4" x="46" y="318">Strong on natural questions</text>
  <rect class="dense-or-keyword-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="dense-or-keyword-name" x="526" y="122">Keyword (BM25)</text>
  <text class="dense-or-keyword-desc" x="526" y="142">Letters, not meaning.</text>
  <text class="dense-or-keyword-desc dense-or-keyword-row dense-or-keyword-r0" x="526" y="182">Finds exact terms reliably</text>
  <text class="dense-or-keyword-desc dense-or-keyword-row dense-or-keyword-r1" x="526" y="216">"ERR-4021" finds exactly that</text>
  <text class="dense-or-keyword-desc dense-or-keyword-row dense-or-keyword-r2" x="526" y="250">Misses every paraphrase</text>
  <text class="dense-or-keyword-desc dense-or-keyword-row dense-or-keyword-r3" x="526" y="284">No notion of synonymy</text>
  <text class="dense-or-keyword-desc dense-or-keyword-row dense-or-keyword-r4" x="526" y="318">Strong on identifiers and jargon</text>
  <text class="dense-or-keyword-sub" x="30" y="372">The complementarity is the point: their failure modes barely overlap, which is why combining them raises recall far more than improving either one alone would.</text>
</svg>
