<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Different transforms per column</title>
  <style>
    .column-transformer-bg   { fill: #f8fafc; }
    .column-transformer-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .column-transformer-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .column-transformer-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .column-transformer-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .column-transformer-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .column-transformer-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .column-transformer-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .column-transformer-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .column-transformer-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .column-transformer-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .column-transformer-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .column-transformer-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .column-transformer-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .column-transformer-stage { opacity: 1; }

    .column-transformer-s0 { animation-delay: 0.00s; }
    .column-transformer-e0 { animation-delay: 0.00s; }
    .column-transformer-s1 { animation-delay: 1.28s; }
    .column-transformer-e1 { animation-delay: 1.28s; }
    .column-transformer-s2 { animation-delay: 2.56s; }
    .column-transformer-e2 { animation-delay: 2.56s; }
    .column-transformer-s3 { animation-delay: 3.84s; }
    .column-transformer-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .column-transformer-conn  { animation: column-transformer-trace 6.4s ease-in-out infinite; }
      .column-transformer-stage { animation: column-transformer-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes column-transformer-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes column-transformer-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .column-transformer-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .column-transformer-stage { animation: column-transformer-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes column-transformer-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="column-transformer-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="column-transformer-bg" width="980" height="322"/>
  <text class="column-transformer-h1"  x="30" y="40">Different transforms per column</text>
  <text class="column-transformer-sub" x="30" y="64">Four steps.</text>
  <g class="column-transformer-stage column-transformer-s0">
    <rect class="column-transformer-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="column-transformer-step" x="44" y="142">01</text>
    <text class="column-transformer-name" x="70" y="142">A tabular dataset has mixed column types</text>
    <text class="column-transformer-desc" x="44" y="166">Numeric, categorical, text,</text>
    <text class="column-transformer-desc" x="44" y="182">dates.</text>
  </g>
  <line class="column-transformer-line column-transformer-conn column-transformer-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#column-transformer-tip)"/>
  <g class="column-transformer-stage column-transformer-s1">
    <rect class="column-transformer-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="column-transformer-step" x="280" y="142">02</text>
    <text class="column-transformer-name" x="306" y="142">Each needs different preprocessing</text>
    <text class="column-transformer-desc" x="280" y="166">Scaling for one, encoding for</text>
    <text class="column-transformer-desc" x="280" y="182">another.</text>
  </g>
  <line class="column-transformer-line column-transformer-conn column-transformer-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#column-transformer-tip)"/>
  <g class="column-transformer-stage column-transformer-s2">
    <rect class="column-transformer-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="column-transformer-step" x="516" y="142">03</text>
    <text class="column-transformer-name" x="542" y="142">So route column groups to their own transforms</text>
    <text class="column-transformer-desc" x="516" y="166">Applied in parallel.</text>
  </g>
  <line class="column-transformer-line column-transformer-conn column-transformer-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#column-transformer-tip)"/>
  <g class="column-transformer-stage column-transformer-s3">
    <rect class="column-transformer-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="column-transformer-step" x="752" y="142">04</text>
    <text class="column-transformer-name" x="778" y="142">And concatenate the results</text>
    <text class="column-transformer-desc" x="752" y="166">Into one feature matrix for the</text>
    <text class="column-transformer-desc" x="752" y="182">model.</text>
    <text class="column-transformer-edge" x="752" y="242">one object</text>
  </g>
  <text class="column-transformer-sub" x="30" y="304">Selecting columns by data type rather than by name makes the pipeline robust to schema changes, which is worth doing even though naming them is easier to read.</text>
</svg>
