<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>What aggregation does</title>
  <style>
    .aggregates-bg   { fill: #f8fafc; }
    .aggregates-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .aggregates-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .aggregates-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .aggregates-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .aggregates-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .aggregates-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .aggregates-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .aggregates-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .aggregates-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .aggregates-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .aggregates-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .aggregates-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .aggregates-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .aggregates-stage { opacity: 1; }

    .aggregates-s0 { animation-delay: 0.00s; }
    .aggregates-e0 { animation-delay: 0.00s; }
    .aggregates-s1 { animation-delay: 1.28s; }
    .aggregates-e1 { animation-delay: 1.28s; }
    .aggregates-s2 { animation-delay: 2.56s; }
    .aggregates-e2 { animation-delay: 2.56s; }
    .aggregates-s3 { animation-delay: 3.84s; }
    .aggregates-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .aggregates-conn  { animation: aggregates-trace 6.4s ease-in-out infinite; }
      .aggregates-stage { animation: aggregates-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes aggregates-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes aggregates-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .aggregates-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .aggregates-stage { animation: aggregates-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes aggregates-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="aggregates-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="aggregates-bg" width="980" height="322"/>
  <text class="aggregates-h1"  x="30" y="40">What aggregation does</text>
  <text class="aggregates-sub" x="30" y="64">Four steps.</text>
  <g class="aggregates-stage aggregates-s0">
    <rect class="aggregates-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="aggregates-step" x="44" y="142">01</text>
    <text class="aggregates-name" x="70" y="142">Rows are bucketed by the grouping key</text>
    <text class="aggregates-desc" x="44" y="166">One bucket per distinct value.</text>
  </g>
  <line class="aggregates-line aggregates-conn aggregates-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#aggregates-tip)"/>
  <g class="aggregates-stage aggregates-s1">
    <rect class="aggregates-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="aggregates-step" x="280" y="142">02</text>
    <text class="aggregates-name" x="306" y="142">Each bucket collapses to a single row</text>
    <text class="aggregates-desc" x="280" y="166">So individual rows are gone.</text>
  </g>
  <line class="aggregates-line aggregates-conn aggregates-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#aggregates-tip)"/>
  <g class="aggregates-stage aggregates-s2">
    <rect class="aggregates-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="aggregates-step" x="516" y="142">03</text>
    <text class="aggregates-name" x="542" y="142">Summary functions describe each bucket</text>
    <text class="aggregates-desc" x="516" y="166">Counts, sums, averages.</text>
  </g>
  <line class="aggregates-line aggregates-conn aggregates-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#aggregates-tip)"/>
  <g class="aggregates-stage aggregates-s3">
    <rect class="aggregates-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="aggregates-step" x="752" y="142">04</text>
    <text class="aggregates-name" x="778" y="142">And missing values are skipped, not treated as zero</text>
    <text class="aggregates-desc" x="752" y="166">Which changes averages.</text>
  </g>
  <text class="aggregates-sub" x="30" y="304">Missing values being skipped rather than zeroed is a real trap: an average over a column with gaps is an average of the present values only.</text>
</svg>
