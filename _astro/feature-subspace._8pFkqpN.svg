<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Random feature selection</title>
  <style>
    .feature-subspace-bg   { fill: #f8fafc; }
    .feature-subspace-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feature-subspace-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feature-subspace-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feature-subspace-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feature-subspace-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feature-subspace-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .feature-subspace-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .feature-subspace-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .feature-subspace-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .feature-subspace-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .feature-subspace-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .feature-subspace-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .feature-subspace-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .feature-subspace-stage { opacity: 1; }

    .feature-subspace-s0 { animation-delay: 0.00s; }
    .feature-subspace-e0 { animation-delay: 0.00s; }
    .feature-subspace-s1 { animation-delay: 1.28s; }
    .feature-subspace-e1 { animation-delay: 1.28s; }
    .feature-subspace-s2 { animation-delay: 2.56s; }
    .feature-subspace-e2 { animation-delay: 2.56s; }
    .feature-subspace-s3 { animation-delay: 3.84s; }
    .feature-subspace-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .feature-subspace-conn  { animation: feature-subspace-trace 6.4s ease-in-out infinite; }
      .feature-subspace-stage { animation: feature-subspace-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes feature-subspace-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes feature-subspace-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .feature-subspace-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .feature-subspace-stage { animation: feature-subspace-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes feature-subspace-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="feature-subspace-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="feature-subspace-bg" width="980" height="322"/>
  <text class="feature-subspace-h1"  x="30" y="40">Random feature selection</text>
  <text class="feature-subspace-sub" x="30" y="64">Four steps.</text>
  <g class="feature-subspace-stage feature-subspace-s0">
    <rect class="feature-subspace-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="feature-subspace-step" x="44" y="142">01</text>
    <text class="feature-subspace-name" x="70" y="142">One strong feature dominates every tree's first split</text>
    <text class="feature-subspace-desc" x="44" y="166">So every tree starts the same</text>
    <text class="feature-subspace-desc" x="44" y="182">way.</text>
  </g>
  <line class="feature-subspace-line feature-subspace-conn feature-subspace-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#feature-subspace-tip)"/>
  <g class="feature-subspace-stage feature-subspace-s1">
    <rect class="feature-subspace-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="feature-subspace-step" x="280" y="142">02</text>
    <text class="feature-subspace-name" x="306" y="142">Which makes the trees highly correlated</text>
    <text class="feature-subspace-desc" x="280" y="166">And bagging alone cannot fix it.</text>
  </g>
  <line class="feature-subspace-line feature-subspace-conn feature-subspace-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#feature-subspace-tip)"/>
  <g class="feature-subspace-stage feature-subspace-s2">
    <rect class="feature-subspace-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="feature-subspace-step" x="516" y="142">03</text>
    <text class="feature-subspace-name" x="542" y="142">So consider only a random subset of features per split</text>
    <text class="feature-subspace-desc" x="516" y="166">Forcing other features to be</text>
    <text class="feature-subspace-desc" x="516" y="182">used.</text>
  </g>
  <line class="feature-subspace-line feature-subspace-conn feature-subspace-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#feature-subspace-tip)"/>
  <g class="feature-subspace-stage feature-subspace-s3">
    <rect class="feature-subspace-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="feature-subspace-step" x="752" y="142">04</text>
    <text class="feature-subspace-name" x="778" y="142">Individual trees get worse, the ensemble gets better</text>
    <text class="feature-subspace-desc" x="752" y="166">Which is the counter-intuitive</text>
    <text class="feature-subspace-desc" x="752" y="182">core of the method.</text>
  </g>
  <text class="feature-subspace-sub" x="30" y="304">Deliberately weakening each tree to strengthen the ensemble is the idea that separates a random forest from plain bagging, and it is worth sitting with.</text>
</svg>
