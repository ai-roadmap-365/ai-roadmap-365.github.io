<svg role="img" aria-label="Comparison of character level word level and subword tokenization strategies showing vocabulary size out of vocabulary handling and sequence length tradeoffs" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Tokenization Strategies: Word vs Character vs Subword</title>
  <defs>
    <linearGradient id="bg218a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card218" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg218a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">TOKENIZATION PARADIGMS &amp; TRADEOFFS</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Comparing Word-Level, Character-Level, and Modern Subword (BPE / WordPiece) Tokenization</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card218)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Strategy 1: Word-Level -->
    <rect x="25" y="25" width="220" height="245" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" rx="6"/>
    <text x="135" y="48" fill="#fb7185" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">1. Word-Level</text>
    <rect x="35" y="65" width="200" height="190" fill="#1e293b" stroke="#f43f5e" rx="4"/>
    <text x="135" y="88" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">Whitespace / Punctuation</text>
    <text x="135" y="110" fill="#cbd5e1" font-size="8" text-anchor="middle">"unbelievable" -> ["unbelievable"]</text>
    <text x="135" y="135" fill="#cbd5e1" font-size="8" text-anchor="middle">• Vocab: Huge (500k+ tokens)</text>
    <text x="135" y="155" fill="#cbd5e1" font-size="8" text-anchor="middle">• OOV Rate: Very High (&lt;unk&gt;)</text>
    <text x="135" y="175" fill="#cbd5e1" font-size="8" text-anchor="middle">• Sequence Length: Short</text>
    <text x="135" y="195" fill="#cbd5e1" font-size="8" text-anchor="middle">• Morphological Blindness</text>
    <text x="135" y="235" fill="#fb7185" font-size="8" font-weight="700" text-anchor="middle">Massive Sparsity</text>

    <!-- Strategy 2: Character-Level -->
    <rect x="270" y="25" width="220" height="245" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="380" y="48" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">2. Character-Level</text>
    <rect x="280" y="65" width="200" height="190" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="380" y="88" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">Raw Unicode Chars</text>
    <text x="380" y="110" fill="#cbd5e1" font-size="8" text-anchor="middle">"unbelievable" -> ['u','n','b',...]</text>
    <text x="380" y="135" fill="#cbd5e1" font-size="8" text-anchor="middle">• Vocab: Tiny (256-1,000)</text>
    <text x="380" y="155" fill="#cbd5e1" font-size="8" text-anchor="middle">• OOV Rate: Zero</text>
    <text x="380" y="175" fill="#cbd5e1" font-size="8" text-anchor="middle">• Sequence Length: Extremely Long</text>
    <text x="380" y="195" fill="#cbd5e1" font-size="8" text-anchor="middle">• High Compute / Memory Cost</text>
    <text x="380" y="235" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">Context Dilution</text>

    <!-- Strategy 3: Subword (BPE / WordPiece) -->
    <rect x="515" y="25" width="220" height="245" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="625" y="48" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">3. Subword (BPE / Modern)</text>
    <rect x="525" y="65" width="200" height="190" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="625" y="88" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">Frequency Merge Units</text>
    <text x="625" y="110" fill="#cbd5e1" font-size="8" text-anchor="middle">"unbelievable" -> ["un", "believ", "able"]</text>
    <text x="625" y="135" fill="#cbd5e1" font-size="8" text-anchor="middle">• Vocab: Optimal (32k - 100k)</text>
    <text x="625" y="155" fill="#cbd5e1" font-size="8" text-anchor="middle">• OOV Rate: Zero (falls to bytes)</text>
    <text x="625" y="175" fill="#cbd5e1" font-size="8" text-anchor="middle">• Sequence Length: Compact</text>
    <text x="625" y="195" fill="#cbd5e1" font-size="8" text-anchor="middle">• Captures Roots &amp; Morphemes</text>
    <text x="625" y="235" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Gold Standard for LLMs</text>
  </g>
</svg>
