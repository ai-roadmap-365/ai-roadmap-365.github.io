<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" role="img" aria-labelledby="d119f-title d119f-desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
  <title id="d119f-title">Two failures that look like success: the split drifting off 50/50 and tripping the mismatch check, then every segment pointing one way while the pooled total points the other</title>
  <desc id="d119f-desc">An animated two-panel diagram. The top panel shows a marker sliding from a planned 50/50 split toward an observed 48/52 split, where a mismatch badge lights up. The bottom panel shows three segment rows each lighting up with a downward, negative arrow in sequence, followed by a pooled row lighting up with an upward, positive arrow -- the opposite direction from every segment that produced it.</desc>

  <style>
    .d119f-bg { fill: #f8fafc; }
    .d119f-panel { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d119f-title-text { fill: #1a202c; font-weight: 700; font-size: 20px; }
    .d119f-heading { fill: #1a202c; font-weight: 700; font-size: 16px; }
    .d119f-body { fill: #1a202c; font-size: 14px; }
    .d119f-caption { fill: #1a202c; font-size: 13.5px; font-style: italic; }
    .d119f-track { stroke: #94a3b8; stroke-width: 3; }
    .d119f-tick { stroke: #64748b; stroke-width: 2; }
    .d119f-planned { fill: #1d4ed8; }

    /* Motion 1: the observed-split marker sliding from 50% to 48% and back */
    .d119f-marker {
      animation: d119f-drift 6s ease-in-out infinite;
    }
    @keyframes d119f-drift {
      0%, 15% { transform: translateX(0px); }
      55%, 85% { transform: translateX(-40px); }
      100% { transform: translateX(0px); }
    }

    /* the FAIL badge pulses in sync with the marker reaching 48% */
    .d119f-fail-badge {
      opacity: 0.15;
      animation: d119f-badge 6s ease-in-out infinite;
    }
    @keyframes d119f-badge {
      0%, 15% { opacity: 0.15; }
      35%, 85% { opacity: 1; }
      100% { opacity: 0.15; }
    }

    /* Motion 3: segment rows lighting up in sequence, then the pooled row */
    .d119f-row-arrow { animation: d119f-lift 6s ease-in-out infinite; }
    .d119f-r1 { animation-delay: 0s; }
    .d119f-r2 { animation-delay: 0.6s; }
    .d119f-r3 { animation-delay: 1.2s; }
    .d119f-r4 { animation-delay: 2.2s; }
    @keyframes d119f-lift {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      10%, 90% { opacity: 1; transform: scale(1.08); }
    }

    @media (prefers-reduced-motion: reduce) {
      .d119f-marker { animation: none; transform: translateX(-40px); }
      .d119f-fail-badge { animation: none; opacity: 1; }
      .d119f-row-arrow { animation: none; opacity: 1; transform: scale(1); }
    }
  </style>

  <rect class="d119f-bg" x="0" y="0" width="1000" height="900" />
  <text x="500" y="38" text-anchor="middle" class="d119f-title-text">Two failures that look like success</text>

  <!-- ================= PANEL 1: SRM ================= -->
  <rect class="d119f-panel" x="40" y="60" width="920" height="330" rx="10" />
  <text x="70" y="94" class="d119f-heading">1. Did the randomization actually work?</text>
  <text x="70" y="118" class="d119f-body">Planned split: 50% control / 50% treatment. n = 20,000.</text>

  <!-- scale track -->
  <line class="d119f-track" x1="140" y1="220" x2="860" y2="220" />
  <line class="d119f-tick" x1="500" y1="205" x2="500" y2="235" />
  <text x="500" y="255" text-anchor="middle" class="d119f-body">50%</text>
  <line class="d119f-tick" x1="140" y1="210" x2="140" y2="230" />
  <text x="140" y="255" text-anchor="middle" class="d119f-body">40%</text>
  <line class="d119f-tick" x1="860" y1="210" x2="860" y2="230" />
  <text x="860" y="255" text-anchor="middle" class="d119f-body">60%</text>

  <!-- planned marker, fixed at 50% -->
  <circle class="d119f-planned" cx="500" cy="220" r="9" />
  <text x="500" y="180" text-anchor="middle" class="d119f-body">planned split</text>

  <!-- observed marker, animated drifting toward 48% (2% left of center on this scale) -->
  <g class="d119f-marker">
    <circle cx="540" cy="220" r="10" fill="#dc2626" />
  </g>
  <text x="500" y="300" text-anchor="middle" class="d119f-body">observed control share drifts from 50% toward 48%</text>

  <!-- FAIL badge -->
  <g class="d119f-fail-badge">
    <rect x="700" y="90" width="220" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
    <text x="810" y="115" text-anchor="middle" fill="#991b1b" font-weight="700" font-size="15">SRM CHECK: FAIL</text>
    <text x="810" y="136" text-anchor="middle" fill="#991b1b" font-size="12">observed 48/52, p = 1.5e-8</text>
  </g>

  <text x="500" y="360" text-anchor="middle" class="d119f-caption">A drift this small, at this sample size, is not noise -- it is testable, and it fails.</text>

  <!-- connector -->
  <line x1="500" y1="390" x2="500" y2="430" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#d119f-arrow)" />

  <defs>
    <marker id="d119f-arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1d4ed8" />
    </marker>
  </defs>

  <!-- ================= PANEL 2: Simpson's paradox ================= -->
  <rect class="d119f-panel" x="40" y="440" width="920" height="430" rx="10" />
  <text x="70" y="474" class="d119f-heading">2. Every segment says one thing. The total says the opposite.</text>
  <text x="70" y="498" class="d119f-body">Same dataset. Segment mix confounded with group assignment.</text>

  <!-- Segment rows -->
  <!-- Row: desktop -->
  <g class="d119f-row-arrow d119f-r1">
    <rect x="70" y="530" width="860" height="60" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
    <text x="90" y="567" class="d119f-body">desktop</text>
    <path d="M 480 545 L 480 575" stroke="#dc2626" stroke-width="4" marker-end="url(#d119f-down)" />
    <text x="520" y="567" fill="#991b1b" font-weight="700" font-size="14">-3.56 pp (negative)</text>
  </g>

  <!-- Row: mobile -->
  <g class="d119f-row-arrow d119f-r2">
    <rect x="70" y="600" width="860" height="60" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
    <text x="90" y="637" class="d119f-body">mobile</text>
    <path d="M 480 615 L 480 645" stroke="#dc2626" stroke-width="4" marker-end="url(#d119f-down)" />
    <text x="520" y="637" fill="#991b1b" font-weight="700" font-size="14">-2.48 pp (negative)</text>
  </g>

  <!-- Row: tablet -->
  <g class="d119f-row-arrow d119f-r3">
    <rect x="70" y="670" width="860" height="60" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
    <text x="90" y="707" class="d119f-body">tablet</text>
    <path d="M 480 685 L 480 715" stroke="#dc2626" stroke-width="4" marker-end="url(#d119f-down)" />
    <text x="520" y="707" fill="#991b1b" font-weight="700" font-size="14">-4.30 pp (negative)</text>
  </g>

  <defs>
    <marker id="d119f-down" markerWidth="10" markerHeight="10" refX="3" refY="6" orient="auto">
      <path d="M0,0 L6,0 L3,6 Z" fill="#dc2626" />
    </marker>
    <marker id="d119f-up" markerWidth="10" markerHeight="10" refX="3" refY="0" orient="auto">
      <path d="M0,6 L6,6 L3,0 Z" fill="#166534" />
    </marker>
  </defs>

  <!-- Row: pooled -->
  <g class="d119f-row-arrow d119f-r4">
    <rect x="70" y="750" width="860" height="70" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="2" />
    <text x="90" y="792" class="d119f-heading" fill="#14532d">POOLED (all segments combined)</text>
    <path d="M 560 800 L 560 765" stroke="#166534" stroke-width="5" marker-end="url(#d119f-up)" />
    <text x="600" y="792" fill="#14532d" font-weight="700" font-size="15">+3.89 pp (positive)</text>
  </g>

  <text x="500" y="850" text-anchor="middle" class="d119f-caption">Every segment got worse under treatment. Pooled, treatment looks better -- because it got a larger share of the segment that already converts more.</text>
</svg>
