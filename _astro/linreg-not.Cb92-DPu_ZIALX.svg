<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things linear regression is not</title>
  <style>
    .linreg-not-bg   { fill: #f8fafc; }
    .linreg-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linreg-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linreg-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linreg-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linreg-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linreg-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .linreg-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .linreg-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .linreg-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .linreg-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .linreg-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .linreg-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .linreg-not-row { opacity: 1; }
    .linreg-not-r0 { animation-delay: 0.00s; }
    .linreg-not-r1 { animation-delay: 0.45s; }
    .linreg-not-r2 { animation-delay: 0.90s; }
    .linreg-not-r3 { animation-delay: 1.35s; }
    .linreg-not-r4 { animation-delay: 1.80s; }
    .linreg-not-row { animation: linreg-not-reveal 7.3s ease-in-out infinite; }
    @keyframes linreg-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="linreg-not-bg" width="980" height="390"/>
  <text class="linreg-not-h1"  x="30" y="40">Four things linear regression is not</text>
  <text class="linreg-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="linreg-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="linreg-not-name" x="46" y="122">The misconception</text>
  <text class="linreg-not-desc" x="46" y="142">Commonly held.</text>
  <text class="linreg-not-desc linreg-not-row linreg-not-r0" x="46" y="182">Coefficients show causal effects</text>
  <text class="linreg-not-desc linreg-not-row linreg-not-r1" x="46" y="216">Linear means it fits only straight lines</text>
  <text class="linreg-not-desc linreg-not-row linreg-not-r2" x="46" y="250">A good fit statistic means the model is right</text>
  <text class="linreg-not-desc linreg-not-row linreg-not-r3" x="46" y="284">It requires normally distributed inputs</text>
  <text class="linreg-not-desc linreg-not-row linreg-not-r4" x="46" y="318">It is too simple to be useful</text>
  <rect class="linreg-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="linreg-not-name" x="526" y="122">What is true</text>
  <text class="linreg-not-desc" x="526" y="142">Actually.</text>
  <text class="linreg-not-desc linreg-not-row linreg-not-r0" x="526" y="182">They show association, conditional on the model</text>
  <text class="linreg-not-desc linreg-not-row linreg-not-r1" x="526" y="216">Linear in the parameters; features can curve</text>
  <text class="linreg-not-desc linreg-not-row linreg-not-r2" x="526" y="250">Residual plots can contradict a good score</text>
  <text class="linreg-not-desc linreg-not-row linreg-not-r3" x="526" y="284">The assumption concerns the residuals</text>
  <text class="linreg-not-desc linreg-not-row linreg-not-r4" x="526" y="318">It is the baseline everything is measured against</text>
  <text class="linreg-not-sub" x="30" y="372">The normality assumption applying to residuals rather than to inputs is a persistent confusion, and it changes which diagnostic is the right one to run.</text>
</svg>
