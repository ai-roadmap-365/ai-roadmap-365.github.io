<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" role="img" font-family="system-ui, sans-serif">
  <title>The four layers that can make something happen later — an in-process sleep loop, an in-process scheduler, the operating system's scheduler, and an external queue or managed scheduler — each labelled with what it survives and what it does not, beside the five operational concerns that apply at every layer</title>
  <rect x="0" y="0" width="920" height="700" fill="#f8fafc"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Where a scheduled job can live — and what each layer survives</text>
  <text x="460" y="56" text-anchor="middle" font-size="14" fill="#1a202c">Moving down the stack buys survival and costs simplicity. Moving right is not optional at any layer.</text>

  <!-- Layer 1 -->
  <rect x="28" y="72" width="560" height="112" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="46" y="96" font-size="15" font-weight="bold" fill="#1a202c">1 · In-process sleep loop</text>
  <text x="46" y="118" font-size="14" fill="#1a202c">while True: work(); time.sleep(interval)</text>
  <text x="46" y="140" font-size="14" fill="#1a202c">survives: nothing. Drifts by the work duration every run.</text>
  <text x="46" y="162" font-size="14" fill="#1d4ed8">dies with: the process, the terminal, the deploy, the reboot</text>

  <!-- Layer 2 -->
  <rect x="28" y="194" width="560" height="112" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="46" y="218" font-size="15" font-weight="bold" fill="#1a202c">2 · In-process scheduler</text>
  <text x="46" y="240" font-size="14" fill="#1a202c">sched.scheduler(timefunc, delayfunc) · threading.Timer</text>
  <text x="46" y="262" font-size="14" fill="#1a202c">survives: a slow run, because it schedules to a deadline</text>
  <text x="46" y="284" font-size="14" fill="#1d4ed8">dies with: the process. Legitimate inside a long-lived service.</text>

  <!-- Layer 3 -->
  <rect x="28" y="316" width="560" height="140" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3" rx="8"/>
  <text x="46" y="340" font-size="15" font-weight="bold" fill="#1a202c">3 · The operating system's scheduler — where real work goes</text>
  <text x="46" y="362" font-size="14" fill="#1a202c">cron (everywhere) · launchd (macOS) · systemd timers (Linux)</text>
  <text x="46" y="384" font-size="14" fill="#1a202c">survives: process exit, log-out, reboot</text>
  <text x="46" y="406" font-size="14" fill="#1a202c">catch-up after downtime: no (cron) · yes (systemd Persistent=true)</text>
  <text x="46" y="428" font-size="14" fill="#1d4ed8">dies with: the machine. Gives the job almost no environment.</text>
  <text x="46" y="448" font-size="14" fill="#1a202c">The single most common bug here: it works in your terminal and not in cron.</text>

  <!-- Layer 4 -->
  <rect x="28" y="466" width="560" height="118" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="46" y="490" font-size="15" font-weight="bold" fill="#1a202c">4 · External queue or managed scheduler</text>
  <text x="46" y="512" font-size="14" fill="#1a202c">Celery with a broker · a cloud scheduler · a workflow engine</text>
  <text x="46" y="534" font-size="14" fill="#1a202c">survives: the machine. Retries, concurrency limits and history included.</text>
  <text x="46" y="556" font-size="14" fill="#1d4ed8">costs: another service to run, monitor, secure and pay for</text>
  <text x="46" y="576" font-size="14" fill="#1a202c">Worth it when the job matters more than the operational burden.</text>

  <!-- Arrows down the stack -->
  <line x1="308" y1="184" x2="308" y2="192" stroke="#1a202c" stroke-width="2"/>
  <line x1="308" y1="306" x2="308" y2="314" stroke="#1a202c" stroke-width="2"/>
  <line x1="308" y1="456" x2="308" y2="464" stroke="#1a202c" stroke-width="2"/>

  <!-- Concerns column -->
  <rect x="612" y="72" width="280" height="512" fill="#ffffff" stroke="#1a202c" stroke-width="3" rx="10"/>
  <text x="752" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Every layer needs all five</text>

  <rect x="628" y="112" width="248" height="86" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="644" y="134" font-size="14" font-weight="bold" fill="#1d4ed8">Idempotence</text>
  <text x="644" y="156" font-size="14" fill="#1a202c">Twice must equal once.</text>
  <text x="644" y="176" font-size="14" fill="#1a202c">Retries and catch-up runs</text>
  <text x="644" y="192" font-size="14" fill="#1a202c">both mean run it twice.</text>

  <rect x="628" y="208" width="248" height="86" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="644" y="230" font-size="14" font-weight="bold" fill="#1d4ed8">Locking</text>
  <text x="644" y="252" font-size="14" fill="#1a202c">flock, non-blocking.</text>
  <text x="644" y="272" font-size="14" fill="#1a202c">A run longer than the</text>
  <text x="644" y="288" font-size="14" fill="#1a202c">interval overlaps itself.</text>

  <rect x="628" y="304" width="248" height="86" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="644" y="326" font-size="14" font-weight="bold" fill="#1d4ed8">Timeout</text>
  <text x="644" y="348" font-size="14" fill="#1a202c">A hang holds the lock,</text>
  <text x="644" y="368" font-size="14" fill="#1a202c">so every later run is</text>
  <text x="644" y="384" font-size="14" fill="#1a202c">skipped, in silence.</text>

  <rect x="628" y="400" width="248" height="86" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="644" y="422" font-size="14" font-weight="bold" fill="#1d4ed8">Logging and exit codes</text>
  <text x="644" y="444" font-size="14" fill="#1a202c">One structured line per</text>
  <text x="644" y="464" font-size="14" fill="#1a202c">run. You will not be</text>
  <text x="644" y="480" font-size="14" fill="#1a202c">watching when it fails.</text>

  <rect x="628" y="496" width="248" height="76" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="644" y="518" font-size="14" font-weight="bold" fill="#1d4ed8">Alert on silence</text>
  <text x="644" y="540" font-size="14" fill="#1a202c">A job that stops running</text>
  <text x="644" y="560" font-size="14" fill="#1a202c">raises no error at all.</text>

  <!-- Footer -->
  <rect x="28" y="600" width="864" height="76" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="46" y="624" font-size="14" font-weight="bold" fill="#1a202c">The clock is a boundary at every layer.</text>
  <text x="46" y="646" font-size="14" fill="#1a202c">Inject it, and the schedule logic, the staleness check and the daylight-saving cases all become tests that run in milliseconds.</text>
  <text x="46" y="666" font-size="14" fill="#1a202c">Read it from inside the job, and the only way to find out what happens on 1 November is to wait until 1 November.</text>
</svg>
