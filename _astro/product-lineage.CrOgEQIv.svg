<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Web, wrapper, then compound.">
  <title>Three architectural eras</title>
  <style>
    .product-lineage-bg   { fill: #f8fafc; }
    .product-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .product-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .product-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .product-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .product-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .product-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .product-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .product-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .product-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .product-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .product-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .product-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .product-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .product-lineage-stage { opacity: 1; }

    .product-lineage-s0 { animation-delay: 0.00s; }
    .product-lineage-e0 { animation-delay: 0.00s; }
    .product-lineage-s1 { animation-delay: 1.50s; }
    .product-lineage-e1 { animation-delay: 1.50s; }
    .product-lineage-s2 { animation-delay: 3.00s; }
    .product-lineage-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .product-lineage-conn  { animation: product-lineage-trace 6s ease-in-out infinite; }
      .product-lineage-stage { animation: product-lineage-arrive 6s ease-in-out infinite; }
    }
    @keyframes product-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes product-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .product-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .product-lineage-stage { animation: product-lineage-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes product-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="product-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="product-lineage-bg" width="980" height="322"/>
  <text class="product-lineage-h1"  x="30" y="40">Three architectural eras</text>
  <text class="product-lineage-sub" x="30" y="64">Web, wrapper, then compound.</text>
  <g class="product-lineage-stage product-lineage-s0">
    <rect class="product-lineage-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="product-lineage-step" x="44" y="142">01</text>
    <text class="product-lineage-name" x="70" y="142">Three-tier web, 2000-2020</text>
    <text class="product-lineage-desc" x="44" y="166">Client, stateless app server, relational</text>
    <text class="product-lineage-desc" x="44" y="182">database.</text>
  </g>
  <line class="product-lineage-line product-lineage-conn product-lineage-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#product-lineage-tip)"/>
  <g class="product-lineage-stage product-lineage-s1">
    <rect class="product-lineage-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="product-lineage-step" x="359" y="142">02</text>
    <text class="product-lineage-name" x="385" y="142">LLM wrappers, 2022-2023</text>
    <text class="product-lineage-desc" x="359" y="166">Direct provider calls bolted onto REST</text>
    <text class="product-lineage-desc" x="359" y="182">endpoints. Spinners and leaked keys.</text>
  </g>
  <line class="product-lineage-line product-lineage-conn product-lineage-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#product-lineage-tip)"/>
  <g class="product-lineage-stage product-lineage-s2">
    <rect class="product-lineage-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="product-lineage-step" x="674" y="142">03</text>
    <text class="product-lineage-name" x="700" y="142">Compound AI, 2024</text>
    <text class="product-lineage-desc" x="674" y="166">Streaming gateways, context stores, caching</text>
    <text class="product-lineage-desc" x="674" y="182">proxies, neutral routers.</text>
  </g>
  <text class="product-lineage-sub" x="30" y="304">The wrapper era was not a mistake so much as a discovery: the architecture that worked for a hundred-millisecond request does not survive contact with a twelve-second one.</text>
</svg>
