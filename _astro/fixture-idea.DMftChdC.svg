<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>What a fixture is</title>
  <style>
    .fixture-idea-bg   { fill: #f8fafc; }
    .fixture-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fixture-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fixture-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fixture-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fixture-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fixture-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fixture-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fixture-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fixture-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fixture-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fixture-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fixture-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .fixture-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .fixture-idea-stage { opacity: 1; }

    .fixture-idea-s0 { animation-delay: 0.00s; }
    .fixture-idea-e0 { animation-delay: 0.00s; }
    .fixture-idea-s1 { animation-delay: 1.28s; }
    .fixture-idea-e1 { animation-delay: 1.28s; }
    .fixture-idea-s2 { animation-delay: 2.56s; }
    .fixture-idea-e2 { animation-delay: 2.56s; }
    .fixture-idea-s3 { animation-delay: 3.84s; }
    .fixture-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .fixture-idea-conn  { animation: fixture-idea-trace 6.4s ease-in-out infinite; }
      .fixture-idea-stage { animation: fixture-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes fixture-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes fixture-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .fixture-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .fixture-idea-stage { animation: fixture-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes fixture-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="fixture-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="fixture-idea-bg" width="980" height="322"/>
  <text class="fixture-idea-h1"  x="30" y="40">What a fixture is</text>
  <text class="fixture-idea-sub" x="30" y="64">Four properties.</text>
  <g class="fixture-idea-stage fixture-idea-s0">
    <rect class="fixture-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="fixture-idea-step" x="44" y="142">01</text>
    <text class="fixture-idea-name" x="70" y="142">A function that produces what a test needs</text>
    <text class="fixture-idea-desc" x="44" y="166">A database, a client, a</text>
    <text class="fixture-idea-desc" x="44" y="182">temporary directory.</text>
  </g>
  <line class="fixture-idea-line fixture-idea-conn fixture-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#fixture-idea-tip)"/>
  <g class="fixture-idea-stage fixture-idea-s1">
    <rect class="fixture-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="fixture-idea-step" x="280" y="142">02</text>
    <text class="fixture-idea-name" x="306" y="142">Requested by naming it as a parameter</text>
    <text class="fixture-idea-desc" x="280" y="166">Which is dependency injection.</text>
  </g>
  <line class="fixture-idea-line fixture-idea-conn fixture-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#fixture-idea-tip)"/>
  <g class="fixture-idea-stage fixture-idea-s2">
    <rect class="fixture-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="fixture-idea-step" x="516" y="142">03</text>
    <text class="fixture-idea-name" x="542" y="142">With teardown after the yield</text>
    <text class="fixture-idea-desc" x="516" y="166">Run whether the test passed or</text>
    <text class="fixture-idea-desc" x="516" y="182">failed.</text>
  </g>
  <line class="fixture-idea-line fixture-idea-conn fixture-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#fixture-idea-tip)"/>
  <g class="fixture-idea-stage fixture-idea-s3">
    <rect class="fixture-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="fixture-idea-step" x="752" y="142">04</text>
    <text class="fixture-idea-name" x="778" y="142">And shared across every test that asks for it</text>
    <text class="fixture-idea-desc" x="752" y="166">Which removes duplicated setup.</text>
    <text class="fixture-idea-edge" x="752" y="242">one definition</text>
  </g>
  <text class="fixture-idea-sub" x="30" y="304">Requesting by parameter name is what makes the dependency visible in the test's signature, which is more readable than setup hidden in a base class.</text>
</svg>
