<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By what the features are.">
  <title>Three variants</title>
  <style>
    .nb-variants-bg   { fill: #f8fafc; }
    .nb-variants-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-variants-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-variants-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-variants-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-variants-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-variants-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nb-variants-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .nb-variants-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .nb-variants-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .nb-variants-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .nb-variants-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .nb-variants-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nb-variants-row { opacity: 1; }
    .nb-variants-r0 { animation-delay: 0.00s; }
    .nb-variants-r1 { animation-delay: 0.45s; }
    .nb-variants-r2 { animation-delay: 0.90s; }
    .nb-variants-r3 { animation-delay: 1.35s; }
    .nb-variants-r4 { animation-delay: 1.80s; }
    .nb-variants-row { animation: nb-variants-reveal 7.3s ease-in-out infinite; }
    @keyframes nb-variants-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="nb-variants-bg" width="980" height="390"/>
  <text class="nb-variants-h1"  x="30" y="40">Three variants</text>
  <text class="nb-variants-sub" x="30" y="64">By what the features are.</text>
  <rect class="nb-variants-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="nb-variants-name" x="46" y="122">The variant</text>
  <text class="nb-variants-desc" x="46" y="142">By feature type.</text>
  <text class="nb-variants-desc nb-variants-row nb-variants-r0" x="46" y="182">Multinomial — counts</text>
  <text class="nb-variants-desc nb-variants-row nb-variants-r1" x="46" y="216">Bernoulli — presence or absence</text>
  <text class="nb-variants-desc nb-variants-row nb-variants-r2" x="46" y="250">Gaussian — continuous values</text>
  <text class="nb-variants-desc nb-variants-row nb-variants-r3" x="46" y="284">Complement — imbalanced text</text>
  <text class="nb-variants-desc nb-variants-row nb-variants-r4" x="46" y="318">Each assumes a different distribution</text>
  <rect class="nb-variants-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="nb-variants-name" x="526" y="122">Where it fits</text>
  <text class="nb-variants-desc" x="526" y="142">Chosen by the data.</text>
  <text class="nb-variants-desc nb-variants-row nb-variants-r0" x="526" y="182">Word frequencies in documents</text>
  <text class="nb-variants-desc nb-variants-row nb-variants-r1" x="526" y="216">Short texts where repetition adds little</text>
  <text class="nb-variants-desc nb-variants-row nb-variants-r2" x="526" y="250">Measurements such as height or pressure</text>
  <text class="nb-variants-desc nb-variants-row nb-variants-r3" x="526" y="284">Where one class dominates heavily</text>
  <text class="nb-variants-desc nb-variants-row nb-variants-r4" x="526" y="318">Mismatching them degrades accuracy quietly</text>
  <text class="nb-variants-sub" x="30" y="372">Choosing the wrong variant is a quiet failure: the model trains and predicts, and it is modelling a distribution the data does not follow.</text>
</svg>
