<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Rather than one that refuses.">
  <title>A mailroom that sorts</title>
  <style>
    .mailroom-bg   { fill: #f8fafc; }
    .mailroom-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mailroom-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mailroom-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mailroom-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mailroom-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mailroom-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mailroom-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mailroom-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mailroom-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mailroom-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mailroom-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mailroom-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mailroom-row { opacity: 1; }
    .mailroom-r0 { animation-delay: 0.00s; }
    .mailroom-r1 { animation-delay: 0.45s; }
    .mailroom-r2 { animation-delay: 0.90s; }
    .mailroom-r3 { animation-delay: 1.35s; }
    .mailroom-r4 { animation-delay: 1.80s; }
    .mailroom-row { animation: mailroom-reveal 7.3s ease-in-out infinite; }
    @keyframes mailroom-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="mailroom-bg" width="980" height="390"/>
  <text class="mailroom-h1"  x="30" y="40">A mailroom that sorts</text>
  <text class="mailroom-sub" x="30" y="64">Rather than one that refuses.</text>
  <rect class="mailroom-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="mailroom-name" x="46" y="122">Accept or reject</text>
  <text class="mailroom-desc" x="46" y="142">Two outcomes.</text>
  <text class="mailroom-desc mailroom-row mailroom-r0" x="46" y="182">Anything unusual is refused</text>
  <text class="mailroom-desc mailroom-row mailroom-r1" x="46" y="216">Partially readable items discarded</text>
  <text class="mailroom-desc mailroom-row mailroom-r2" x="46" y="250">No record of what was lost</text>
  <text class="mailroom-desc mailroom-row mailroom-r3" x="46" y="284">Volume looks fine, coverage does not</text>
  <text class="mailroom-desc mailroom-row mailroom-r4" x="46" y="318">This is a naive pipeline</text>
  <rect class="mailroom-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="mailroom-name" x="526" y="122">Sorted by handling</text>
  <text class="mailroom-desc" x="526" y="142">Four outcomes.</text>
  <text class="mailroom-desc mailroom-row mailroom-r0" x="526" y="182">Each item routed by what it needs</text>
  <text class="mailroom-desc mailroom-row mailroom-r1" x="526" y="216">Partial content still used</text>
  <text class="mailroom-desc mailroom-row mailroom-r2" x="526" y="250">Exceptions recorded and counted</text>
  <text class="mailroom-desc mailroom-row mailroom-r3" x="526" y="284">Coverage measurable</text>
  <text class="mailroom-desc mailroom-row mailroom-r4" x="526" y="318">This is triage</text>
  <text class="mailroom-sub" x="30" y="372">The coverage point is the practical one: a pipeline that silently drops difficult documents reports success while quietly failing to answer questions about them.</text>
</svg>
