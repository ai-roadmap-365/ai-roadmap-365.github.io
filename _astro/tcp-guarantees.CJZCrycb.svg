<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four guarantees, each costing something you sometimes do not want.">
  <title>What you get for the handshake</title>
  <style>
    .tcp-guarantees-bg   { fill: #f8fafc; }
    .tcp-guarantees-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tcp-guarantees-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tcp-guarantees-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tcp-guarantees-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tcp-guarantees-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tcp-guarantees-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tcp-guarantees-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tcp-guarantees-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tcp-guarantees-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tcp-guarantees-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tcp-guarantees-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tcp-guarantees-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tcp-guarantees-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tcp-guarantees-stage { opacity: 1; }

    .tcp-guarantees-s0 { animation-delay: 0.00s; }
    .tcp-guarantees-e0 { animation-delay: 0.00s; }
    .tcp-guarantees-s1 { animation-delay: 1.28s; }
    .tcp-guarantees-e1 { animation-delay: 1.28s; }
    .tcp-guarantees-s2 { animation-delay: 2.56s; }
    .tcp-guarantees-e2 { animation-delay: 2.56s; }
    .tcp-guarantees-s3 { animation-delay: 3.84s; }
    .tcp-guarantees-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tcp-guarantees-conn  { animation: tcp-guarantees-trace 6.4s ease-in-out infinite; }
      .tcp-guarantees-stage { animation: tcp-guarantees-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tcp-guarantees-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tcp-guarantees-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tcp-guarantees-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tcp-guarantees-stage { animation: tcp-guarantees-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tcp-guarantees-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tcp-guarantees-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tcp-guarantees-bg" width="980" height="322"/>
  <text class="tcp-guarantees-h1"  x="30" y="40">What you get for the handshake</text>
  <text class="tcp-guarantees-sub" x="30" y="64">Four guarantees, each costing something you sometimes do not want.</text>
  <g class="tcp-guarantees-stage tcp-guarantees-s0">
    <rect class="tcp-guarantees-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tcp-guarantees-step" x="44" y="142">01</text>
    <text class="tcp-guarantees-name" x="70" y="142">Reliability</text>
    <text class="tcp-guarantees-desc" x="44" y="166">Every byte numbered and</text>
    <text class="tcp-guarantees-desc" x="44" y="182">acknowledged; anything missing</text>
    <text class="tcp-guarantees-desc" x="44" y="198">is retransmitted.</text>
    <text class="tcp-guarantees-edge" x="44" y="242">waiting</text>
  </g>
  <line class="tcp-guarantees-line tcp-guarantees-conn tcp-guarantees-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tcp-guarantees-tip)"/>
  <g class="tcp-guarantees-stage tcp-guarantees-s1">
    <rect class="tcp-guarantees-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tcp-guarantees-step" x="280" y="142">02</text>
    <text class="tcp-guarantees-name" x="306" y="142">Ordering</text>
    <text class="tcp-guarantees-desc" x="280" y="166">Reassembled in the order sent,</text>
    <text class="tcp-guarantees-desc" x="280" y="182">however scrambled the arrival.</text>
    <text class="tcp-guarantees-edge" x="280" y="242">buffering</text>
  </g>
  <line class="tcp-guarantees-line tcp-guarantees-conn tcp-guarantees-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tcp-guarantees-tip)"/>
  <g class="tcp-guarantees-stage tcp-guarantees-s2">
    <rect class="tcp-guarantees-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tcp-guarantees-step" x="516" y="142">03</text>
    <text class="tcp-guarantees-name" x="542" y="142">Flow control</text>
    <text class="tcp-guarantees-desc" x="516" y="166">The receiver advertises its</text>
    <text class="tcp-guarantees-desc" x="516" y="182">buffer, so a fast sender cannot</text>
    <text class="tcp-guarantees-desc" x="516" y="198">swamp a slow one.</text>
    <text class="tcp-guarantees-edge" x="516" y="242">throttling</text>
  </g>
  <line class="tcp-guarantees-line tcp-guarantees-conn tcp-guarantees-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tcp-guarantees-tip)"/>
  <g class="tcp-guarantees-stage tcp-guarantees-s3">
    <rect class="tcp-guarantees-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tcp-guarantees-step" x="752" y="142">04</text>
    <text class="tcp-guarantees-name" x="778" y="142">Congestion control</text>
    <text class="tcp-guarantees-desc" x="752" y="166">Slows on loss, probes cautiously</text>
    <text class="tcp-guarantees-desc" x="752" y="182">back up. Shares the internet</text>
    <text class="tcp-guarantees-desc" x="752" y="198">among millions.</text>
    <text class="tcp-guarantees-edge" x="752" y="242">fairness</text>
  </g>
  <text class="tcp-guarantees-sub" x="30" y="304">For live video, every one of these costs is wrong: a frame retransmitted is a frame that arrived too late to show. That is the entire case for UDP.</text>
</svg>
