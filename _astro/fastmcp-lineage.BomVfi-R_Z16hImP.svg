<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Flask, then OpenAPI, then FastMCP.">
  <title>Three steps to the decorator</title>
  <style>
    .fastmcp-lineage-bg   { fill: #f8fafc; }
    .fastmcp-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fastmcp-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fastmcp-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fastmcp-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fastmcp-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fastmcp-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fastmcp-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fastmcp-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fastmcp-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fastmcp-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fastmcp-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fastmcp-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .fastmcp-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .fastmcp-lineage-stage { opacity: 1; }

    .fastmcp-lineage-s0 { animation-delay: 0.00s; }
    .fastmcp-lineage-e0 { animation-delay: 0.00s; }
    .fastmcp-lineage-s1 { animation-delay: 1.50s; }
    .fastmcp-lineage-e1 { animation-delay: 1.50s; }
    .fastmcp-lineage-s2 { animation-delay: 3.00s; }
    .fastmcp-lineage-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .fastmcp-lineage-conn  { animation: fastmcp-lineage-trace 6s ease-in-out infinite; }
      .fastmcp-lineage-stage { animation: fastmcp-lineage-arrive 6s ease-in-out infinite; }
    }
    @keyframes fastmcp-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes fastmcp-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .fastmcp-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .fastmcp-lineage-stage { animation: fastmcp-lineage-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes fastmcp-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="fastmcp-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="fastmcp-lineage-bg" width="980" height="322"/>
  <text class="fastmcp-lineage-h1"  x="30" y="40">Three steps to the decorator</text>
  <text class="fastmcp-lineage-sub" x="30" y="64">Flask, then OpenAPI, then FastMCP.</text>
  <g class="fastmcp-lineage-stage fastmcp-lineage-s0">
    <rect class="fastmcp-lineage-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="fastmcp-lineage-step" x="44" y="142">01</text>
    <text class="fastmcp-lineage-name" x="70" y="142">Decorator routing, 2010-2018</text>
    <text class="fastmcp-lineage-desc" x="44" y="166">Flask and FastAPI. Routing tables derived</text>
    <text class="fastmcp-lineage-desc" x="44" y="182">rather than written.</text>
  </g>
  <line class="fastmcp-lineage-line fastmcp-lineage-conn fastmcp-lineage-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#fastmcp-lineage-tip)"/>
  <g class="fastmcp-lineage-stage fastmcp-lineage-s1">
    <rect class="fastmcp-lineage-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="fastmcp-lineage-step" x="359" y="142">02</text>
    <text class="fastmcp-lineage-name" x="385" y="142">OpenAPI generation, 2018-2023</text>
    <text class="fastmcp-lineage-desc" x="359" y="166">Annotations as one source of truth for</text>
    <text class="fastmcp-lineage-desc" x="359" y="182">execution and documentation.</text>
  </g>
  <line class="fastmcp-lineage-line fastmcp-lineage-conn fastmcp-lineage-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#fastmcp-lineage-tip)"/>
  <g class="fastmcp-lineage-stage fastmcp-lineage-s2">
    <rect class="fastmcp-lineage-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="fastmcp-lineage-step" x="674" y="142">03</text>
    <text class="fastmcp-lineage-name" x="700" y="142">FastMCP, 2024</text>
    <text class="fastmcp-lineage-desc" x="674" y="166">One decorator handles schema, coercion,</text>
    <text class="fastmcp-lineage-desc" x="674" y="182">framing and error serialisation.</text>
  </g>
  <text class="fastmcp-lineage-sub" x="30" y="304">Each step removed a hand-maintained artefact, and the pattern is the same every time: the thing developers were keeping in sync was derivable from code they had already written.</text>
</svg>
