<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1000" role="img" font-family="system-ui, sans-serif">
  <title>One POST request traced from raw bytes to a response, showing exactly where validation branches. A client sends the bytes of POST slash bookmarks with a JSON body. Routing matches the method and path to one path operation, or answers 404 or 405 without entering your code. Body parsing turns the bytes into a Python dictionary, and malformed JSON is rejected here. Pydantic validation checks that dictionary against the create model, and this is the branch that matters: if any field is wrong the request stops, your handler is never entered, nothing is stored, and the caller receives a 422 whose detail is a list with one entry per problem, each carrying a type such as string underscore too underscore short, a loc naming the exact field, a human-readable msg, and the input that was rejected. If every field is right, dependency resolution calls each Depends function so that storage, the clock and the id source arrive as arguments, then your handler runs with real typed Python objects and calls into the domain layer. Response-model serialization filters what the handler returned down to the declared output fields, dropping the internal owner token, and the response leaves as a status code plus headers plus a JSON body. A panel at the bottom records that a static type checker ran before any of this, on the source rather than on the data, and checked something completely different: mypy asks whether your code contradicts its own annotations, pydantic asks whether the stranger's data satisfies them, and an API needs both because the caller is a stranger.</title>
  <rect x="0" y="0" width="1040" height="1000" fill="#f8fafc"/>

  <text x="520" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a202c">One POST, from raw bytes to a response</text>
  <text x="520" y="58" text-anchor="middle" font-size="14" fill="#1a202c">and the single branch where a 422 is decided</text>

  <!-- 1 -->
  <rect x="300" y="80" width="440" height="72" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="520" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">1. RAW BYTES ARRIVE</text>
  <text x="520" y="126" text-anchor="middle" font-size="14" fill="#1a202c">POST /bookmarks   Content-Type: application/json</text>
  <text x="520" y="144" text-anchor="middle" font-size="14" fill="#1a202c">everything is text at this point — nothing is a Python object yet</text>

  <line x1="520" y1="152" x2="520" y2="174" stroke="#1a202c" stroke-width="2"/>
  <polygon points="520,180 514,168 526,168" fill="#1a202c"/>

  <!-- 2 -->
  <rect x="300" y="180" width="440" height="66" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="520" y="204" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">2. ROUTING</text>
  <text x="520" y="226" text-anchor="middle" font-size="14" fill="#1a202c">method + path pattern matched to one path operation</text>
  <text x="520" y="242" text-anchor="middle" font-size="14" fill="#1a202c">no match: 404, or 405 if the path exists with another method</text>

  <line x1="520" y1="246" x2="520" y2="268" stroke="#1a202c" stroke-width="2"/>
  <polygon points="520,274 514,262 526,262" fill="#1a202c"/>

  <!-- 3 -->
  <rect x="300" y="274" width="440" height="60" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="520" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">3. BODY PARSING</text>
  <text x="520" y="320" text-anchor="middle" font-size="14" fill="#1a202c">bytes to a Python dict — malformed JSON is rejected right here</text>

  <line x1="520" y1="334" x2="520" y2="356" stroke="#1a202c" stroke-width="2"/>
  <polygon points="520,362 514,350 526,350" fill="#1a202c"/>

  <!-- 4 the branch -->
  <rect x="280" y="362" width="480" height="94" fill="#fef9c3" stroke="#1d4ed8" stroke-width="3" rx="10"/>
  <text x="520" y="388" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">4. PYDANTIC VALIDATION — the branch</text>
  <text x="520" y="412" text-anchor="middle" font-size="14" fill="#1a202c">the dict is checked against BookmarkCreate: is title 1 to 80 characters,</text>
  <text x="520" y="430" text-anchor="middle" font-size="14" fill="#1a202c">is url really a URL, is every field one the model declares</text>
  <text x="520" y="450" text-anchor="middle" font-size="14" font-style="italic" fill="#1d4ed8">this is an annotation causing work to happen at runtime</text>

  <!-- branch arrows -->
  <line x1="280" y1="409" x2="230" y2="409" stroke="#1d4ed8" stroke-width="3"/>
  <line x1="230" y1="409" x2="230" y2="470" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="230,476 224,464 236,464" fill="#1d4ed8"/>
  <text x="196" y="402" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">INVALID</text>

  <line x1="520" y1="456" x2="520" y2="600" stroke="#1a202c" stroke-width="3"/>
  <polygon points="520,606 514,594 526,594" fill="#1a202c"/>
  <text x="576" y="480" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">VALID</text>

  <!-- 422 panel -->
  <rect x="24" y="476" width="412" height="196" fill="#fef9c3" stroke="#1d4ed8" stroke-width="3" rx="10"/>
  <text x="230" y="500" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">422 — and the request STOPS</text>
  <text x="40" y="524" font-size="14" fill="#1a202c">the handler is never entered · nothing is stored</text>
  <text x="40" y="546" font-size="14" font-weight="bold" fill="#1d4ed8">detail is a LIST — one entry per problem, all at once:</text>
  <text x="40" y="572" font-size="14" fill="#1a202c">  "type": "string_too_short"      what rule was broken</text>
  <text x="40" y="594" font-size="14" fill="#1a202c">  "loc": "body", "title"          exactly which field</text>
  <text x="40" y="616" font-size="14" fill="#1a202c">  "msg": "String should have ..."  for a human</text>
  <text x="40" y="638" font-size="14" fill="#1a202c">  "input": ""                     what was rejected</text>
  <text x="230" y="662" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">a machine can act on this; prose cannot</text>

  <!-- 5 -->
  <rect x="300" y="606" width="440" height="66" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="520" y="630" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">5. DEPENDENCY RESOLUTION</text>
  <text x="520" y="652" text-anchor="middle" font-size="14" fill="#1a202c">storage, the clock, the id source — each Depends called</text>
  <text x="520" y="668" text-anchor="middle" font-size="14" fill="#1a202c">a test swaps any of them without touching a handler</text>

  <line x1="520" y1="672" x2="520" y2="694" stroke="#1a202c" stroke-width="2"/>
  <polygon points="520,700 514,688 526,688" fill="#1a202c"/>

  <!-- 6 -->
  <rect x="300" y="700" width="440" height="66" fill="#dcfce7" stroke="#1a202c" stroke-width="3" rx="8"/>
  <text x="520" y="724" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">6. YOUR HANDLER RUNS</text>
  <text x="520" y="746" text-anchor="middle" font-size="14" fill="#1a202c">every argument is already a real, typed, checked Python object</text>
  <text x="520" y="762" text-anchor="middle" font-size="14" fill="#1a202c">it calls the domain layer and returns an object</text>

  <line x1="520" y1="766" x2="520" y2="788" stroke="#1a202c" stroke-width="2"/>
  <polygon points="520,794 514,782 526,782" fill="#1a202c"/>

  <!-- 7 -->
  <rect x="300" y="794" width="440" height="66" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="520" y="818" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">7. RESPONSE-MODEL SERIALIZATION</text>
  <text x="520" y="840" text-anchor="middle" font-size="14" fill="#1a202c">filtered down to the declared output fields</text>
  <text x="520" y="856" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">owner_token is dropped here — this is the leak filter</text>

  <line x1="740" y1="827" x2="800" y2="827" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="806,827 794,821 794,833" fill="#1d4ed8"/>
  <rect x="806" y="778" width="210" height="98" fill="#dcfce7" stroke="#1d4ed8" stroke-width="3" rx="8"/>
  <text x="911" y="802" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">201 Created</text>
  <text x="911" y="824" text-anchor="middle" font-size="14" fill="#1a202c">Location: /bookmarks/...</text>
  <text x="911" y="846" text-anchor="middle" font-size="14" fill="#1a202c">a JSON body with</text>
  <text x="911" y="864" text-anchor="middle" font-size="14" fill="#1a202c">exactly five fields</text>

  <!-- static checker panel -->
  <rect x="770" y="80" width="246" height="376" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4" rx="10"/>
  <text x="893" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">BEFORE ANY OF THIS</text>
  <text x="893" y="130" text-anchor="middle" font-size="14" fill="#1a202c">a static type checker ran</text>
  <text x="893" y="150" text-anchor="middle" font-size="14" fill="#1a202c">on the SOURCE, not the data</text>
  <text x="786" y="182" font-size="14" font-weight="bold" fill="#1d4ed8">mypy asked:</text>
  <text x="786" y="204" font-size="14" fill="#1a202c">does this code contradict</text>
  <text x="786" y="222" font-size="14" fill="#1a202c">its own annotations?</text>
  <text x="786" y="240" font-size="14" fill="#1a202c">It never saw a value.</text>
  <text x="786" y="272" font-size="14" font-weight="bold" fill="#1d4ed8">pydantic asks:</text>
  <text x="786" y="294" font-size="14" fill="#1a202c">does this stranger's data</text>
  <text x="786" y="312" font-size="14" fill="#1a202c">satisfy them?</text>
  <text x="786" y="330" font-size="14" fill="#1a202c">It holds the actual bytes.</text>
  <text x="786" y="362" font-size="14" fill="#1a202c">Same annotations.</text>
  <text x="786" y="382" font-size="14" fill="#1a202c">Different question.</text>
  <text x="786" y="402" font-size="14" fill="#1a202c">Different moment.</text>
  <text x="786" y="430" font-size="14" font-weight="bold" fill="#1d4ed8">An API needs both,</text>
  <text x="786" y="448" font-size="14" font-weight="bold" fill="#1d4ed8">because the caller</text>
  <text x="893" y="466" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">is a stranger.</text>

  <!-- bottom note -->
  <rect x="24" y="900" width="992" height="80" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="520" y="926" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">The stage you did not write is the one that saves you</text>
  <text x="44" y="950" font-size="14" fill="#1a202c">Stages 2, 3, 4, 5 and 7 are the framework, generated from your annotations. You wrote stage 6 and the models. Every field the</text>
  <text x="44" y="970" font-size="14" fill="#1a202c">handler receives is already checked, so the first line of your code is business logic rather than fourteen lines of defensive parsing.</text>
</svg>
