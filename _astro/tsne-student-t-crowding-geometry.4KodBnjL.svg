<svg role="img" aria-label="Crowding problem illustration contrasting Gaussian high dimensional tails with Student t heavy low dimensional distribution tails" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>t-SNE Student-t Distribution and Crowding Resolution</title>
  <defs>
    <linearGradient id="bg186a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card186" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg186a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">t-SNE: RESOLVING THE CROWDING PROBLEM VIA STUDENT-t TAILS</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Gaussian probabilities in high dimensions vs Cauchy/Student-t (1-dof) in 2D embedding</text>
  <g transform="translate(60, 90)">
    <rect width="730" height="290" fill="url(#card186)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <line x1="80" y1="240" x2="650" y2="240" stroke="#64748b" stroke-width="1"/>
    <line x1="365" y1="260" x2="365" y2="40" stroke="#64748b" stroke-width="1"/>
    <path d="M 120 240 Q 300 238 340 120 Q 365 45 390 120 Q 430 238 610 240" fill="none" stroke="#ef4444" stroke-width="2.5"/>
    <text x="540" y="225" fill="#ef4444" font-family="system-ui" font-size="11" font-weight="700">Gaussian (exp(-d^2))</text>
    <path d="M 80 230 Q 280 210 335 130 Q 365 50 395 130 Q 450 210 650 230" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <text x="570" y="195" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700">Student-t ((1+d^2)^-1)</text>
    <text x="365" y="275" fill="#cbd5e1" font-family="system-ui" font-size="11" text-anchor="middle">Heavy tails prevent moderate-distance points from collapsing into a dense central sphere</text>
  </g>
</svg>
