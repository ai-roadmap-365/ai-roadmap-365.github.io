<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The unstated assumption</title>
  <style>
    .iid-assumption-bg   { fill: #f8fafc; }
    .iid-assumption-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .iid-assumption-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .iid-assumption-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .iid-assumption-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .iid-assumption-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .iid-assumption-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .iid-assumption-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .iid-assumption-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .iid-assumption-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .iid-assumption-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .iid-assumption-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .iid-assumption-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .iid-assumption-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .iid-assumption-stage { opacity: 1; }

    .iid-assumption-s0 { animation-delay: 0.00s; }
    .iid-assumption-e0 { animation-delay: 0.00s; }
    .iid-assumption-s1 { animation-delay: 1.28s; }
    .iid-assumption-e1 { animation-delay: 1.28s; }
    .iid-assumption-s2 { animation-delay: 2.56s; }
    .iid-assumption-e2 { animation-delay: 2.56s; }
    .iid-assumption-s3 { animation-delay: 3.84s; }
    .iid-assumption-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .iid-assumption-conn  { animation: iid-assumption-trace 6.4s ease-in-out infinite; }
      .iid-assumption-stage { animation: iid-assumption-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes iid-assumption-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes iid-assumption-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .iid-assumption-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .iid-assumption-stage { animation: iid-assumption-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes iid-assumption-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="iid-assumption-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="iid-assumption-bg" width="980" height="322"/>
  <text class="iid-assumption-h1"  x="30" y="40">The unstated assumption</text>
  <text class="iid-assumption-sub" x="30" y="64">Four steps.</text>
  <g class="iid-assumption-stage iid-assumption-s0">
    <rect class="iid-assumption-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="iid-assumption-step" x="44" y="142">01</text>
    <text class="iid-assumption-name" x="70" y="142">Future data will resemble past data</text>
    <text class="iid-assumption-desc" x="44" y="166">Drawn from the same process.</text>
  </g>
  <line class="iid-assumption-line iid-assumption-conn iid-assumption-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#iid-assumption-tip)"/>
  <g class="iid-assumption-stage iid-assumption-s1">
    <rect class="iid-assumption-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="iid-assumption-step" x="280" y="142">02</text>
    <text class="iid-assumption-name" x="306" y="142">Without it, nothing learned from the past applies</text>
    <text class="iid-assumption-desc" x="280" y="166">There would be nothing to</text>
    <text class="iid-assumption-desc" x="280" y="182">generalise to.</text>
  </g>
  <line class="iid-assumption-line iid-assumption-conn iid-assumption-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#iid-assumption-tip)"/>
  <g class="iid-assumption-stage iid-assumption-s2">
    <rect class="iid-assumption-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="iid-assumption-step" x="516" y="142">03</text>
    <text class="iid-assumption-name" x="542" y="142">But populations shift, behaviour changes, regimes break</text>
    <text class="iid-assumption-desc" x="516" y="166">So the assumption fails,</text>
    <text class="iid-assumption-desc" x="516" y="182">gradually or suddenly.</text>
  </g>
  <line class="iid-assumption-line iid-assumption-conn iid-assumption-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#iid-assumption-tip)"/>
  <g class="iid-assumption-stage iid-assumption-s3">
    <rect class="iid-assumption-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="iid-assumption-step" x="752" y="142">04</text>
    <text class="iid-assumption-name" x="778" y="142">Which is exactly why deployed models need monitoring</text>
    <text class="iid-assumption-desc" x="752" y="166">The assumption is a claim about</text>
    <text class="iid-assumption-desc" x="752" y="182">the future.</text>
    <text class="iid-assumption-edge" x="752" y="242">day 195</text>
  </g>
  <text class="iid-assumption-sub" x="30" y="304">Naming this assumption early is what makes model decay comprehensible later: the model did not break, the assumption it rested on stopped holding.</text>
</svg>
