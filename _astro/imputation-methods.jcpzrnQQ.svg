<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By cost and fidelity.">
  <title>Four imputation methods</title>
  <style>
    .imputation-methods-bg   { fill: #f8fafc; }
    .imputation-methods-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .imputation-methods-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .imputation-methods-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .imputation-methods-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .imputation-methods-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .imputation-methods-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .imputation-methods-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .imputation-methods-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .imputation-methods-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .imputation-methods-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .imputation-methods-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .imputation-methods-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .imputation-methods-row { opacity: 1; }
    .imputation-methods-r0 { animation-delay: 0.00s; }
    .imputation-methods-r1 { animation-delay: 0.45s; }
    .imputation-methods-r2 { animation-delay: 0.90s; }
    .imputation-methods-r3 { animation-delay: 1.35s; }
    .imputation-methods-r4 { animation-delay: 1.80s; }
    .imputation-methods-row { animation: imputation-methods-reveal 7.3s ease-in-out infinite; }
    @keyframes imputation-methods-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="imputation-methods-bg" width="980" height="390"/>
  <text class="imputation-methods-h1"  x="30" y="40">Four imputation methods</text>
  <text class="imputation-methods-sub" x="30" y="64">By cost and fidelity.</text>
  <rect class="imputation-methods-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="imputation-methods-name" x="46" y="122">The method</text>
  <text class="imputation-methods-desc" x="46" y="142">What it does.</text>
  <text class="imputation-methods-desc imputation-methods-row imputation-methods-r0" x="46" y="182">Mean or median — a constant per column</text>
  <text class="imputation-methods-desc imputation-methods-row imputation-methods-r1" x="46" y="216">Neighbour-based — the average of similar rows</text>
  <text class="imputation-methods-desc imputation-methods-row imputation-methods-r2" x="46" y="250">Iterative — model each column from the others</text>
  <text class="imputation-methods-desc imputation-methods-row imputation-methods-r3" x="46" y="284">Constant sentinel — a value outside the range</text>
  <text class="imputation-methods-desc imputation-methods-row imputation-methods-r4" x="46" y="318">Native handling — the model decides</text>
  <rect class="imputation-methods-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="imputation-methods-name" x="526" y="122">The trade</text>
  <text class="imputation-methods-desc" x="526" y="142">What it costs.</text>
  <text class="imputation-methods-desc imputation-methods-row imputation-methods-r0" x="526" y="182">Instant; shrinks variance and distorts distributions</text>
  <text class="imputation-methods-desc imputation-methods-row imputation-methods-r1" x="526" y="216">Slow; preserves relationships between columns</text>
  <text class="imputation-methods-desc imputation-methods-row imputation-methods-r2" x="526" y="250">Slowest; the most faithful</text>
  <text class="imputation-methods-desc imputation-methods-row imputation-methods-r3" x="526" y="284">Only safe for tree models</text>
  <text class="imputation-methods-desc imputation-methods-row imputation-methods-r4" x="526" y="318">Best where available</text>
  <text class="imputation-methods-sub" x="30" y="372">Mean imputation shrinking variance is its quiet defect: every imputed row sits exactly at the centre, which understates spread and biases anything computed from it.</text>
</svg>
