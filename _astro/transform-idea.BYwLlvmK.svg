<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>A matrix is a transformation</title>
  <style>
    .transform-idea-bg   { fill: #f8fafc; }
    .transform-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transform-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transform-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transform-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transform-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transform-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .transform-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .transform-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .transform-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .transform-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .transform-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .transform-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .transform-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .transform-idea-stage { opacity: 1; }

    .transform-idea-s0 { animation-delay: 0.00s; }
    .transform-idea-e0 { animation-delay: 0.00s; }
    .transform-idea-s1 { animation-delay: 1.28s; }
    .transform-idea-e1 { animation-delay: 1.28s; }
    .transform-idea-s2 { animation-delay: 2.56s; }
    .transform-idea-e2 { animation-delay: 2.56s; }
    .transform-idea-s3 { animation-delay: 3.84s; }
    .transform-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .transform-idea-conn  { animation: transform-idea-trace 6.4s ease-in-out infinite; }
      .transform-idea-stage { animation: transform-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes transform-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes transform-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .transform-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .transform-idea-stage { animation: transform-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes transform-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="transform-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="transform-idea-bg" width="980" height="322"/>
  <text class="transform-idea-h1"  x="30" y="40">A matrix is a transformation</text>
  <text class="transform-idea-sub" x="30" y="64">Four steps.</text>
  <g class="transform-idea-stage transform-idea-s0">
    <rect class="transform-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="transform-idea-step" x="44" y="142">01</text>
    <text class="transform-idea-name" x="70" y="142">A matrix maps every point to another point</text>
    <text class="transform-idea-desc" x="44" y="166">The whole space at once.</text>
  </g>
  <line class="transform-idea-line transform-idea-conn transform-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#transform-idea-tip)"/>
  <g class="transform-idea-stage transform-idea-s1">
    <rect class="transform-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="transform-idea-step" x="280" y="142">02</text>
    <text class="transform-idea-name" x="306" y="142">Straight lines stay straight, and the origin stays put</text>
    <text class="transform-idea-desc" x="280" y="166">Which is what linear means.</text>
  </g>
  <line class="transform-idea-line transform-idea-conn transform-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#transform-idea-tip)"/>
  <g class="transform-idea-stage transform-idea-s2">
    <rect class="transform-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="transform-idea-step" x="516" y="142">03</text>
    <text class="transform-idea-name" x="542" y="142">So a square grid becomes a grid of parallelograms</text>
    <text class="transform-idea-desc" x="516" y="166">Never a curve.</text>
  </g>
  <line class="transform-idea-line transform-idea-conn transform-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#transform-idea-tip)"/>
  <g class="transform-idea-stage transform-idea-s3">
    <rect class="transform-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="transform-idea-step" x="752" y="142">04</text>
    <text class="transform-idea-name" x="778" y="142">And the whole map is fixed by where the basis vectors land</text>
    <text class="transform-idea-desc" x="752" y="166">Which is a very small amount of</text>
    <text class="transform-idea-desc" x="752" y="182">information.</text>
    <text class="transform-idea-edge" x="752" y="242">the key fact</text>
  </g>
  <text class="transform-idea-sub" x="30" y="304">The entire transformation being determined by a handful of landing places is what makes matrices readable rather than arbitrary grids of numbers.</text>
</svg>
