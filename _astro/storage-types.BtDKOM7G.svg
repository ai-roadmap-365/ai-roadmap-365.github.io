<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" font-family="system-ui, sans-serif">
  <title>Four storage types compared: a file, a relational database, an object store, and a cache, each drawn with its characteristic shape and its best use</title>
  <rect x="0" y="0" width="820" height="480" fill="#f8fafc"/>
  <text x="410" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Four ways software stores data</text>

  <!-- FILE -->
  <rect x="30" y="70" width="170" height="330" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="115" y="98" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d4ed8">File</text>
  <!-- document glyph -->
  <path d="M75 120 h55 l20 20 v70 h-75 z" fill="#eff6ff" stroke="#1a202c" stroke-width="1.5"/>
  <path d="M130 120 v20 h20" fill="none" stroke="#1a202c" stroke-width="1.5"/>
  <line x1="85" y1="150" x2="140" y2="150" stroke="#1a202c" stroke-width="1.5"/>
  <line x1="85" y1="164" x2="140" y2="164" stroke="#1a202c" stroke-width="1.5"/>
  <line x1="85" y1="178" x2="125" y2="178" stroke="#1a202c" stroke-width="1.5"/>
  <text x="115" y="245" text-anchor="middle" font-size="14" fill="#1a202c">A named blob of</text>
  <text x="115" y="263" text-anchor="middle" font-size="14" fill="#1a202c">bytes in a folder</text>
  <text x="115" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Best for:</text>
  <text x="115" y="350" text-anchor="middle" font-size="14" fill="#1a202c">config, logs,</text>
  <text x="115" y="368" text-anchor="middle" font-size="14" fill="#1a202c">one small dataset</text>

  <!-- RELATIONAL DATABASE -->
  <rect x="215" y="70" width="170" height="330" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="300" y="98" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d4ed8">Relational DB</text>
  <!-- table glyph -->
  <rect x="245" y="120" width="110" height="75" fill="#eff6ff" stroke="#1a202c" stroke-width="1.5"/>
  <rect x="245" y="120" width="110" height="18" fill="#bfdbfe" stroke="#1a202c" stroke-width="1.5"/>
  <line x1="282" y1="120" x2="282" y2="195" stroke="#1a202c" stroke-width="1.5"/>
  <line x1="318" y1="120" x2="318" y2="195" stroke="#1a202c" stroke-width="1.5"/>
  <line x1="245" y1="157" x2="355" y2="157" stroke="#1a202c" stroke-width="1.5"/>
  <line x1="245" y1="176" x2="355" y2="176" stroke="#1a202c" stroke-width="1.5"/>
  <text x="300" y="245" text-anchor="middle" font-size="14" fill="#1a202c">Tables, rows,</text>
  <text x="300" y="263" text-anchor="middle" font-size="14" fill="#1a202c">SQL, indexes, ACID</text>
  <text x="300" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Best for:</text>
  <text x="300" y="350" text-anchor="middle" font-size="14" fill="#1a202c">users, orders,</text>
  <text x="300" y="368" text-anchor="middle" font-size="14" fill="#1a202c">related, queried data</text>

  <!-- OBJECT STORAGE -->
  <rect x="400" y="70" width="170" height="330" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="485" y="98" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d4ed8">Object store</text>
  <!-- bucket glyph -->
  <path d="M450 120 h70 l-8 70 h-54 z" fill="#eff6ff" stroke="#1a202c" stroke-width="1.5"/>
  <ellipse cx="485" cy="120" rx="35" ry="8" fill="#bfdbfe" stroke="#1a202c" stroke-width="1.5"/>
  <text x="485" y="165" text-anchor="middle" font-size="12" fill="#1a202c">key &#8594; blob</text>
  <text x="485" y="245" text-anchor="middle" font-size="14" fill="#1a202c">Flat buckets of huge,</text>
  <text x="485" y="263" text-anchor="middle" font-size="14" fill="#1a202c">cheap, immutable blobs</text>
  <text x="485" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Best for:</text>
  <text x="485" y="350" text-anchor="middle" font-size="14" fill="#1a202c">datasets, media,</text>
  <text x="485" y="368" text-anchor="middle" font-size="14" fill="#1a202c">backups, model files</text>

  <!-- CACHE -->
  <rect x="585" y="70" width="205" height="330" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="687" y="98" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d4ed8">Cache</text>
  <!-- lightning glyph -->
  <polygon points="690,118 668,160 686,160 682,196 710,150 690,150" fill="#bfdbfe" stroke="#1a202c" stroke-width="1.5"/>
  <text x="687" y="245" text-anchor="middle" font-size="14" fill="#1a202c">Fast, volatile copy</text>
  <text x="687" y="263" text-anchor="middle" font-size="14" fill="#1a202c">in front of a slow store</text>
  <text x="687" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Best for:</text>
  <text x="687" y="350" text-anchor="middle" font-size="14" fill="#1a202c">hot, repeated reads</text>
  <text x="687" y="368" text-anchor="middle" font-size="14" fill="#1a202c">(never the only copy)</text>

  <text x="410" y="435" text-anchor="middle" font-size="15" fill="#1a202c">Speed and cost rise left-to-right for reads; capacity per dollar is highest in the object store.</text>
  <text x="410" y="459" text-anchor="middle" font-size="14" fill="#1a202c">A single app often uses all four at once, each for the job that matches its trade-offs.</text>
</svg>
