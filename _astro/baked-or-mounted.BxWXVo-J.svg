<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One is simpler; one is smaller.">
  <title>Baked in, or mounted</title>
  <style>
    .baked-or-mounted-bg   { fill: #f8fafc; }
    .baked-or-mounted-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baked-or-mounted-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baked-or-mounted-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baked-or-mounted-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baked-or-mounted-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baked-or-mounted-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .baked-or-mounted-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .baked-or-mounted-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .baked-or-mounted-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .baked-or-mounted-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .baked-or-mounted-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .baked-or-mounted-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .baked-or-mounted-row { opacity: 1; }
    .baked-or-mounted-r0 { animation-delay: 0.00s; }
    .baked-or-mounted-r1 { animation-delay: 0.45s; }
    .baked-or-mounted-r2 { animation-delay: 0.90s; }
    .baked-or-mounted-r3 { animation-delay: 1.35s; }
    .baked-or-mounted-r4 { animation-delay: 1.80s; }
    .baked-or-mounted-row { animation: baked-or-mounted-reveal 7.3s ease-in-out infinite; }
    @keyframes baked-or-mounted-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="baked-or-mounted-bg" width="980" height="390"/>
  <text class="baked-or-mounted-h1"  x="30" y="40">Baked in, or mounted</text>
  <text class="baked-or-mounted-sub" x="30" y="64">One is simpler; one is smaller.</text>
  <rect class="baked-or-mounted-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="baked-or-mounted-name" x="46" y="122">Baked in</text>
  <text class="baked-or-mounted-desc" x="46" y="142">Simpler and reproducible.</text>
  <text class="baked-or-mounted-desc baked-or-mounted-row baked-or-mounted-r0" x="46" y="182">The image is the whole system</text>
  <text class="baked-or-mounted-desc baked-or-mounted-row baked-or-mounted-r1" x="46" y="216">One artefact to deploy</text>
  <text class="baked-or-mounted-desc baked-or-mounted-row baked-or-mounted-r2" x="46" y="250">Nothing to verify at startup</text>
  <text class="baked-or-mounted-desc baked-or-mounted-row baked-or-mounted-r3" x="46" y="284">Defensible below a few hundred MB</text>
  <text class="baked-or-mounted-desc baked-or-mounted-row baked-or-mounted-r4" x="46" y="318">Couples code and weight lifecycles</text>
  <rect class="baked-or-mounted-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="baked-or-mounted-name" x="526" y="122">Mounted</text>
  <text class="baked-or-mounted-desc" x="526" y="142">Smaller and decoupled.</text>
  <text class="baked-or-mounted-desc baked-or-mounted-row baked-or-mounted-r0" x="526" y="182">Weights versioned separately</text>
  <text class="baked-or-mounted-desc baked-or-mounted-row baked-or-mounted-r1" x="526" y="216">A one-line fix does not re-pull 13.5 GB</text>
  <text class="baked-or-mounted-desc baked-or-mounted-row baked-or-mounted-r2" x="526" y="250">Adds a supply-chain input to verify</text>
  <text class="baked-or-mounted-desc baked-or-mounted-row baked-or-mounted-r3" x="526" y="284">Wins above roughly a gigabyte</text>
  <text class="baked-or-mounted-desc baked-or-mounted-row baked-or-mounted-r4" x="526" y="318">Needs a checksum on load</text>
  <text class="baked-or-mounted-sub" x="30" y="372">The lab's small-model entry exists so you can check the arithmetic yourself: a few hundred megabytes in an image you want to be one self-contained artefact is a genuine trade rather than a mistake.</text>
</svg>
