<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two very different privacy positions.">
  <title>A local daemon, or a SaaS integration</title>
  <style>
    .local-or-saas-bg   { fill: #f8fafc; }
    .local-or-saas-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-or-saas-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-or-saas-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-or-saas-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-or-saas-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-or-saas-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .local-or-saas-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .local-or-saas-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .local-or-saas-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .local-or-saas-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .local-or-saas-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .local-or-saas-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .local-or-saas-row { opacity: 1; }
    .local-or-saas-r0 { animation-delay: 0.00s; }
    .local-or-saas-r1 { animation-delay: 0.45s; }
    .local-or-saas-r2 { animation-delay: 0.90s; }
    .local-or-saas-r3 { animation-delay: 1.35s; }
    .local-or-saas-r4 { animation-delay: 1.80s; }
    .local-or-saas-row { animation: local-or-saas-reveal 7.3s ease-in-out infinite; }
    @keyframes local-or-saas-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="local-or-saas-bg" width="980" height="390"/>
  <text class="local-or-saas-h1"  x="30" y="40">A local daemon, or a SaaS integration</text>
  <text class="local-or-saas-sub" x="30" y="64">Two very different privacy positions.</text>
  <rect class="local-or-saas-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="local-or-saas-name" x="46" y="122">Local daemon</text>
  <text class="local-or-saas-desc" x="46" y="142">Private by construction.</text>
  <text class="local-or-saas-desc local-or-saas-row local-or-saas-r0" x="46" y="182">SQLite on your machine</text>
  <text class="local-or-saas-desc local-or-saas-row local-or-saas-r1" x="46" y="216">No network, no tokens</text>
  <text class="local-or-saas-desc local-or-saas-row local-or-saas-r2" x="46" y="250">Works offline</text>
  <text class="local-or-saas-desc local-or-saas-row local-or-saas-r3" x="46" y="284">Universal across clients</text>
  <text class="local-or-saas-desc local-or-saas-row local-or-saas-r4" x="46" y="318">Low setup: one Python file</text>
  <rect class="local-or-saas-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="local-or-saas-name" x="526" y="122">Hosted integrations</text>
  <text class="local-or-saas-desc" x="526" y="142">Convenient, and remote.</text>
  <text class="local-or-saas-desc local-or-saas-row local-or-saas-r0" x="526" y="182">Notion, Obsidian sync, issue trackers</text>
  <text class="local-or-saas-desc local-or-saas-row local-or-saas-r1" x="526" y="216">API tokens and network required</text>
  <text class="local-or-saas-desc local-or-saas-row local-or-saas-r2" x="526" y="250">Their availability is your availability</text>
  <text class="local-or-saas-desc local-or-saas-row local-or-saas-r3" x="526" y="284">Data lives on their infrastructure</text>
  <text class="local-or-saas-desc local-or-saas-row local-or-saas-r4" x="526" y="318">Right when the data is already there</text>
  <text class="local-or-saas-sub" x="30" y="372">Neither is wrong and they answer different questions: a hosted service is right for data that is already shared, and a local daemon is right for the notes and diffs that were never meant to leave.</text>
</svg>
