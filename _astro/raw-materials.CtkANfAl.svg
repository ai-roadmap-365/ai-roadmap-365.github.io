<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Which limits the result.">
  <title>The materials, not the tools</title>
  <style>
    .raw-materials-bg   { fill: #f8fafc; }
    .raw-materials-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .raw-materials-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .raw-materials-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .raw-materials-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .raw-materials-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .raw-materials-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .raw-materials-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .raw-materials-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .raw-materials-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .raw-materials-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .raw-materials-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .raw-materials-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .raw-materials-row { opacity: 1; }
    .raw-materials-r0 { animation-delay: 0.00s; }
    .raw-materials-r1 { animation-delay: 0.45s; }
    .raw-materials-r2 { animation-delay: 0.90s; }
    .raw-materials-r3 { animation-delay: 1.35s; }
    .raw-materials-r4 { animation-delay: 1.80s; }
    .raw-materials-row { animation: raw-materials-reveal 7.3s ease-in-out infinite; }
    @keyframes raw-materials-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="raw-materials-bg" width="980" height="390"/>
  <text class="raw-materials-h1"  x="30" y="40">The materials, not the tools</text>
  <text class="raw-materials-sub" x="30" y="64">Which limits the result.</text>
  <rect class="raw-materials-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="raw-materials-name" x="46" y="122">Better tools</text>
  <text class="raw-materials-desc" x="46" y="142">Marginal gains.</text>
  <text class="raw-materials-desc raw-materials-row raw-materials-r0" x="46" y="182">A sharper instrument works faster</text>
  <text class="raw-materials-desc raw-materials-row raw-materials-r1" x="46" y="216">The result is a little better</text>
  <text class="raw-materials-desc raw-materials-row raw-materials-r2" x="46" y="250">Diminishing returns quickly</text>
  <text class="raw-materials-desc raw-materials-row raw-materials-r3" x="46" y="284">Cannot exceed what the material allows</text>
  <text class="raw-materials-desc raw-materials-row raw-materials-r4" x="46" y="318">This is model choice</text>
  <rect class="raw-materials-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="raw-materials-name" x="526" y="122">Better materials</text>
  <text class="raw-materials-desc" x="526" y="142">A different ceiling.</text>
  <text class="raw-materials-desc raw-materials-row raw-materials-r0" x="526" y="182">Poor material limits any craftsman</text>
  <text class="raw-materials-desc raw-materials-row raw-materials-r1" x="526" y="216">Good material raises the whole range</text>
  <text class="raw-materials-desc raw-materials-row raw-materials-r2" x="526" y="250">Returns keep coming</text>
  <text class="raw-materials-desc raw-materials-row raw-materials-r3" x="526" y="284">Changes what is achievable at all</text>
  <text class="raw-materials-desc raw-materials-row raw-materials-r4" x="526" y="318">This is feature quality</text>
  <text class="raw-materials-sub" x="30" y="372">The ceiling being set by the material rather than the tool is exactly the information-content argument, and it is why the analogy holds rather than merely illustrating.</text>
</svg>
