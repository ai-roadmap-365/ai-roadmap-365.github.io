<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are risks.">
  <title>Four consequences of using pretrained weights</title>
  <style>
    .transfer-implications-bg   { fill: #f8fafc; }
    .transfer-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transfer-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transfer-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transfer-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transfer-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transfer-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .transfer-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .transfer-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .transfer-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .transfer-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .transfer-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .transfer-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .transfer-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .transfer-implications-stage { opacity: 1; }

    .transfer-implications-s0 { animation-delay: 0.00s; }
    .transfer-implications-e0 { animation-delay: 0.00s; }
    .transfer-implications-s1 { animation-delay: 1.28s; }
    .transfer-implications-e1 { animation-delay: 1.28s; }
    .transfer-implications-s2 { animation-delay: 2.56s; }
    .transfer-implications-e2 { animation-delay: 2.56s; }
    .transfer-implications-s3 { animation-delay: 3.84s; }
    .transfer-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .transfer-implications-conn  { animation: transfer-implications-trace 6.4s ease-in-out infinite; }
      .transfer-implications-stage { animation: transfer-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes transfer-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes transfer-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .transfer-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .transfer-implications-stage { animation: transfer-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes transfer-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="transfer-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="transfer-implications-bg" width="980" height="322"/>
  <text class="transfer-implications-h1"  x="30" y="40">Four consequences of using pretrained weights</text>
  <text class="transfer-implications-sub" x="30" y="64">Two are risks.</text>
  <g class="transfer-implications-stage transfer-implications-s0">
    <rect class="transfer-implications-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="transfer-implications-step" x="44" y="142">01</text>
    <text class="transfer-implications-name" x="70" y="142">Weights carry a licence</text>
    <text class="transfer-implications-desc" x="44" y="166">Some pretrained models are not</text>
    <text class="transfer-implications-desc" x="44" y="182">permitted in commercial</text>
    <text class="transfer-implications-desc" x="44" y="198">products.</text>
  </g>
  <line class="transfer-implications-line transfer-implications-conn transfer-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#transfer-implications-tip)"/>
  <g class="transfer-implications-stage transfer-implications-s1">
    <rect class="transfer-implications-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="transfer-implications-step" x="280" y="142">02</text>
    <text class="transfer-implications-name" x="306" y="142">And inherited bias</text>
    <text class="transfer-implications-desc" x="280" y="166">Whatever the pretraining corpus</text>
    <text class="transfer-implications-desc" x="280" y="182">over-represented arrives with</text>
    <text class="transfer-implications-desc" x="280" y="198">the features.</text>
  </g>
  <line class="transfer-implications-line transfer-implications-conn transfer-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#transfer-implications-tip)"/>
  <g class="transfer-implications-stage transfer-implications-s2">
    <rect class="transfer-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="transfer-implications-step" x="516" y="142">03</text>
    <text class="transfer-implications-name" x="542" y="142">Distribution shift limits transfer</text>
    <text class="transfer-implications-desc" x="516" y="166">Natural photographs to radar or</text>
    <text class="transfer-implications-desc" x="516" y="182">genomics may need mid-level</text>
    <text class="transfer-implications-desc" x="516" y="198">retraining.</text>
  </g>
  <line class="transfer-implications-line transfer-implications-conn transfer-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#transfer-implications-tip)"/>
  <g class="transfer-implications-stage transfer-implications-s3">
    <rect class="transfer-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="transfer-implications-step" x="752" y="142">04</text>
    <text class="transfer-implications-name" x="778" y="142">Inference cost is the backbone's</text>
    <text class="transfer-implications-desc" x="752" y="166">Fine-tuning does not make a</text>
    <text class="transfer-implications-desc" x="752" y="182">large model smaller.</text>
  </g>
  <text class="transfer-implications-sub" x="30" y="304">The licence check is a genuine and frequently skipped step: a model trained for research release may carry terms that a commercial deployment cannot satisfy.</text>
</svg>
