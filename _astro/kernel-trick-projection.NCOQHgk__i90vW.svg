<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="Kernel Trick Projection Diagram">
  <title>The Kernel Trick: Non-Linear Mapping</title>
  <defs>
    <style>
      .d169f-bg { fill: #f8fafc; }
      .d169f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d169f-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; }
      .d169f-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .d169f-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 12px; font-weight: 600; }
      .d169f-arrow { stroke: #2563eb; stroke-width: 2.5; marker-end: url(#d169f-arr); fill: none; }
    </style>
    <marker id="d169f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="d169f-bg" />

  <text x="40" y="45" class="d169f-title" font-size="22">The Kernel Trick (Mercer Theorem)</text>
  <text x="40" y="70" class="d169f-text">Implicit Non-Linear Mapping: Φ(x) without explicit high-dimensional feature computation</text>

  <!-- Left: 2D Input Space (Non-linearly separable) -->
  <rect x="60" y="110" width="340" height="320" class="d169f-card" />
  <text x="80" y="140" class="d169f-title" fill="#b91c1c">1. 2D Input Space ℝ² (Non-Separable)</text>
  <text x="80" y="165" class="d169f-text">Concentric Circles: No straight line can separate them!</text>

  <!-- Center Circle (Red) -->
  <circle cx="230" cy="280" r="10" fill="#ef4444" opacity="0.3" />
  <circle cx="225" cy="275" r="4" fill="#ef4444" />
  <circle cx="235" cy="285" r="4" fill="#ef4444" />
  <circle cx="230" cy="280" r="4" fill="#ef4444" />

  <!-- Outer Ring (Blue) -->
  <circle cx="230" cy="280" r="60" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 2" />
  <circle cx="170" cy="280" r="4" fill="#3b82f6" />
  <circle cx="290" cy="280" r="4" fill="#3b82f6" />
  <circle cx="230" cy="220" r="4" fill="#3b82f6" />
  <circle cx="230" cy="340" r="4" fill="#3b82f6" />
  <circle cx="190" cy="240" r="4" fill="#3b82f6" />
  <circle cx="270" cy="320" r="4" fill="#3b82f6" />

  <text x="80" y="395" class="d169f-math" fill="#dc2626">Linear Separator Fails (Accuracy = 50%)</text>

  <!-- Arrow: Phi mapping -->
  <path d="M 410 270 L 480 270" class="d169f-arrow" />
  <text x="415" y="255" class="d169f-math" fill="#2563eb">Φ(x)</text>

  <!-- Right: 3D Feature Space (Linearly separable via Hyperplane) -->
  <rect x="490" y="110" width="350" height="320" class="d169f-card" fill="#f0fdf4" stroke="#22c55e" />
  <text x="510" y="140" class="d169f-title" fill="#15803d">2. High-Dimensional Space ℝ³ (Linearly Separable)</text>
  <text x="510" y="165" class="d169f-text">Mapping: Φ(x₁, x₂) = (x₁, x₂, x₁² + x₂²)</text>

  <!-- Parabolic Elevation -->
  <!-- Red points elevated at bottom of bowl -->
  <circle cx="660" cy="340" r="5" fill="#ef4444" />
  <circle cx="670" cy="345" r="5" fill="#ef4444" />
  <circle cx="650" cy="342" r="5" fill="#ef4444" />

  <!-- Linear Separating Plane (Green line slice) -->
  <line x1="530" y1="300" x2="800" y2="300" stroke="#16a34a" stroke-width="3" />
  <text x="540" y="290" class="d169f-math" fill="#15803d">Linear Hyperplane Slice: z = c</text>

  <!-- Blue points elevated high on the rim -->
  <circle cx="560" cy="220" r="5" fill="#3b82f6" />
  <circle cx="760" cy="220" r="5" fill="#3b82f6" />
  <circle cx="610" cy="240" r="5" fill="#3b82f6" />
  <circle cx="710" cy="240" r="5" fill="#3b82f6" />

  <text x="510" y="395" class="d169f-math" fill="#15803d">K(x, z) = exp(-γ||x-z||²) (Accuracy = 100%)</text>
</svg>
