<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Interrupting cleanly</title>
  <style>
    .signal-handling-bg   { fill: #f8fafc; }
    .signal-handling-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .signal-handling-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .signal-handling-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .signal-handling-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .signal-handling-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .signal-handling-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .signal-handling-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .signal-handling-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .signal-handling-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .signal-handling-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .signal-handling-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .signal-handling-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .signal-handling-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .signal-handling-stage { opacity: 1; }

    .signal-handling-s0 { animation-delay: 0.00s; }
    .signal-handling-e0 { animation-delay: 0.00s; }
    .signal-handling-s1 { animation-delay: 1.28s; }
    .signal-handling-e1 { animation-delay: 1.28s; }
    .signal-handling-s2 { animation-delay: 2.56s; }
    .signal-handling-e2 { animation-delay: 2.56s; }
    .signal-handling-s3 { animation-delay: 3.84s; }
    .signal-handling-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .signal-handling-conn  { animation: signal-handling-trace 6.4s ease-in-out infinite; }
      .signal-handling-stage { animation: signal-handling-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes signal-handling-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes signal-handling-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .signal-handling-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .signal-handling-stage { animation: signal-handling-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes signal-handling-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="signal-handling-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="signal-handling-bg" width="980" height="322"/>
  <text class="signal-handling-h1"  x="30" y="40">Interrupting cleanly</text>
  <text class="signal-handling-sub" x="30" y="64">Four steps.</text>
  <g class="signal-handling-stage signal-handling-s0">
    <rect class="signal-handling-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="signal-handling-step" x="44" y="142">01</text>
    <text class="signal-handling-name" x="70" y="142">The user interrupts mid-generation</text>
    <text class="signal-handling-desc" x="44" y="166">Which must not terminate the</text>
    <text class="signal-handling-desc" x="44" y="182">program.</text>
  </g>
  <line class="signal-handling-line signal-handling-conn signal-handling-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#signal-handling-tip)"/>
  <g class="signal-handling-stage signal-handling-s1">
    <rect class="signal-handling-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="signal-handling-step" x="280" y="142">02</text>
    <text class="signal-handling-name" x="306" y="142">Cancel the stream and close the connection</text>
    <text class="signal-handling-desc" x="280" y="166">Rather than abandoning it to</text>
    <text class="signal-handling-desc" x="280" y="182">time out.</text>
  </g>
  <line class="signal-handling-line signal-handling-conn signal-handling-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#signal-handling-tip)"/>
  <g class="signal-handling-stage signal-handling-s2">
    <rect class="signal-handling-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="signal-handling-step" x="516" y="142">03</text>
    <text class="signal-handling-name" x="542" y="142">Record what was produced</text>
    <text class="signal-handling-desc" x="516" y="166">Marked as interrupted, so the</text>
    <text class="signal-handling-desc" x="516" y="182">history stays truthful.</text>
  </g>
  <line class="signal-handling-line signal-handling-conn signal-handling-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#signal-handling-tip)"/>
  <g class="signal-handling-stage signal-handling-s3">
    <rect class="signal-handling-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="signal-handling-step" x="752" y="142">04</text>
    <text class="signal-handling-name" x="778" y="142">And return to the prompt</text>
    <text class="signal-handling-desc" x="752" y="166">With the session intact.</text>
  </g>
  <text class="signal-handling-sub" x="30" y="304">Recording the partial output as interrupted matters for the next turn: a truncated answer stored as complete becomes context the model will treat as its own finished work.</text>
</svg>
