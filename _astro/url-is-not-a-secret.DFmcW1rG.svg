<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Anyone who learns it can post to it.">
  <title>A secret URL is not a credential</title>
  <style>
    .url-is-not-a-secret-bg   { fill: #f8fafc; }
    .url-is-not-a-secret-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .url-is-not-a-secret-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .url-is-not-a-secret-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .url-is-not-a-secret-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .url-is-not-a-secret-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .url-is-not-a-secret-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .url-is-not-a-secret-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .url-is-not-a-secret-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .url-is-not-a-secret-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .url-is-not-a-secret-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .url-is-not-a-secret-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .url-is-not-a-secret-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .url-is-not-a-secret-row { opacity: 1; }
    .url-is-not-a-secret-r0 { animation-delay: 0.00s; }
    .url-is-not-a-secret-r1 { animation-delay: 0.45s; }
    .url-is-not-a-secret-r2 { animation-delay: 0.90s; }
    .url-is-not-a-secret-r3 { animation-delay: 1.35s; }
    .url-is-not-a-secret-r4 { animation-delay: 1.80s; }
    .url-is-not-a-secret-row { animation: url-is-not-a-secret-reveal 7.3s ease-in-out infinite; }
    @keyframes url-is-not-a-secret-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="url-is-not-a-secret-bg" width="980" height="390"/>
  <text class="url-is-not-a-secret-h1"  x="30" y="40">A secret URL is not a credential</text>
  <text class="url-is-not-a-secret-sub" x="30" y="64">Anyone who learns it can post to it.</text>
  <rect class="url-is-not-a-secret-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="url-is-not-a-secret-name" x="46" y="122">An unguessable URL</text>
  <text class="url-is-not-a-secret-desc" x="46" y="142">Obscurity, not security.</text>
  <text class="url-is-not-a-secret-desc url-is-not-a-secret-row url-is-not-a-secret-r0" x="46" y="182">Appears in your own logs</text>
  <text class="url-is-not-a-secret-desc url-is-not-a-secret-row url-is-not-a-secret-r1" x="46" y="216">And in the sender's dashboard</text>
  <text class="url-is-not-a-secret-desc url-is-not-a-secret-row url-is-not-a-secret-r2" x="46" y="250">And in any proxy on the path</text>
  <text class="url-is-not-a-secret-desc url-is-not-a-secret-row url-is-not-a-secret-r3" x="46" y="284">Cannot be rotated without re-registering</text>
  <text class="url-is-not-a-secret-desc url-is-not-a-secret-row url-is-not-a-secret-r4" x="46" y="318">Proves nothing about who called</text>
  <rect class="url-is-not-a-secret-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="url-is-not-a-secret-name" x="526" y="122">An HMAC signature</text>
  <text class="url-is-not-a-secret-desc" x="526" y="142">Proof, checkable by you.</text>
  <text class="url-is-not-a-secret-desc url-is-not-a-secret-row url-is-not-a-secret-r0" x="526" y="182">The sender knows the shared secret</text>
  <text class="url-is-not-a-secret-desc url-is-not-a-secret-row url-is-not-a-secret-r1" x="526" y="216">The body was not altered in transit</text>
  <text class="url-is-not-a-secret-desc url-is-not-a-secret-row url-is-not-a-secret-r2" x="526" y="250">One changed byte changes it completely</text>
  <text class="url-is-not-a-secret-desc url-is-not-a-secret-row url-is-not-a-secret-r3" x="526" y="284">The secret rotates without changing the URL</text>
  <text class="url-is-not-a-secret-desc url-is-not-a-secret-row url-is-not-a-secret-r4" x="526" y="318">Verified before any work is done</text>
  <text class="url-is-not-a-secret-sub" x="30" y="372">Forging a "payment succeeded" event to obtain goods for free is the standard attack, and it is defeated entirely by the check most people skip.</text>
</svg>
