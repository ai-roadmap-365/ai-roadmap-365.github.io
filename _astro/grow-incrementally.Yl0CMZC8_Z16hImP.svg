<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Growing incrementally</title>
  <style>
    .grow-incrementally-bg   { fill: #f8fafc; }
    .grow-incrementally-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grow-incrementally-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grow-incrementally-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grow-incrementally-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grow-incrementally-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grow-incrementally-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .grow-incrementally-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .grow-incrementally-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .grow-incrementally-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .grow-incrementally-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .grow-incrementally-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .grow-incrementally-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .grow-incrementally-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .grow-incrementally-stage { opacity: 1; }

    .grow-incrementally-s0 { animation-delay: 0.00s; }
    .grow-incrementally-e0 { animation-delay: 0.00s; }
    .grow-incrementally-s1 { animation-delay: 1.28s; }
    .grow-incrementally-e1 { animation-delay: 1.28s; }
    .grow-incrementally-s2 { animation-delay: 2.56s; }
    .grow-incrementally-e2 { animation-delay: 2.56s; }
    .grow-incrementally-s3 { animation-delay: 3.84s; }
    .grow-incrementally-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .grow-incrementally-conn  { animation: grow-incrementally-trace 6.4s ease-in-out infinite; }
      .grow-incrementally-stage { animation: grow-incrementally-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes grow-incrementally-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes grow-incrementally-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .grow-incrementally-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .grow-incrementally-stage { animation: grow-incrementally-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes grow-incrementally-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="grow-incrementally-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="grow-incrementally-bg" width="980" height="322"/>
  <text class="grow-incrementally-h1"  x="30" y="40">Growing incrementally</text>
  <text class="grow-incrementally-sub" x="30" y="64">Four steps.</text>
  <g class="grow-incrementally-stage grow-incrementally-s0">
    <rect class="grow-incrementally-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="grow-incrementally-step" x="44" y="142">01</text>
    <text class="grow-incrementally-name" x="70" y="142">Build the smallest version that does something</text>
    <text class="grow-incrementally-desc" x="44" y="166">End to end, however crudely.</text>
  </g>
  <line class="grow-incrementally-line grow-incrementally-conn grow-incrementally-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#grow-incrementally-tip)"/>
  <g class="grow-incrementally-stage grow-incrementally-s1">
    <rect class="grow-incrementally-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="grow-incrementally-step" x="280" y="142">02</text>
    <text class="grow-incrementally-name" x="306" y="142">Keep it working at every step</text>
    <text class="grow-incrementally-desc" x="280" y="166">So there is always something to</text>
    <text class="grow-incrementally-desc" x="280" y="182">fall back to.</text>
  </g>
  <line class="grow-incrementally-line grow-incrementally-conn grow-incrementally-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#grow-incrementally-tip)"/>
  <g class="grow-incrementally-stage grow-incrementally-s2">
    <rect class="grow-incrementally-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="grow-incrementally-step" x="516" y="142">03</text>
    <text class="grow-incrementally-name" x="542" y="142">Add structure only when a real need appears</text>
    <text class="grow-incrementally-desc" x="516" y="166">Not in anticipation of one.</text>
  </g>
  <line class="grow-incrementally-line grow-incrementally-conn grow-incrementally-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#grow-incrementally-tip)"/>
  <g class="grow-incrementally-stage grow-incrementally-s3">
    <rect class="grow-incrementally-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="grow-incrementally-step" x="752" y="142">04</text>
    <text class="grow-incrementally-name" x="778" y="142">And stop when it is good enough</text>
    <text class="grow-incrementally-desc" x="752" y="166">Which is a judgment, and a</text>
    <text class="grow-incrementally-desc" x="752" y="182">skill.</text>
  </g>
  <text class="grow-incrementally-sub" x="30" y="304">Adding structure only on a real need is what prevents the elaborate abstractions that make small programs hard to follow for no eventual benefit.</text>
</svg>
