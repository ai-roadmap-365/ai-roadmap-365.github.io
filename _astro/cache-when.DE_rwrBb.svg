<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when it costs.">
  <title>When caching pays</title>
  <style>
    .cache-when-bg   { fill: #f8fafc; }
    .cache-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cache-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cache-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cache-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cache-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cache-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cache-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cache-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cache-when-row { opacity: 1; }
    .cache-when-r0 { animation-delay: 0.00s; }
    .cache-when-r1 { animation-delay: 0.45s; }
    .cache-when-r2 { animation-delay: 0.90s; }
    .cache-when-r3 { animation-delay: 1.35s; }
    .cache-when-r4 { animation-delay: 1.80s; }
    .cache-when-row { animation: cache-when-reveal 7.3s ease-in-out infinite; }
    @keyframes cache-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cache-when-bg" width="980" height="390"/>
  <text class="cache-when-h1"  x="30" y="40">When caching pays</text>
  <text class="cache-when-sub" x="30" y="64">And when it costs.</text>
  <rect class="cache-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cache-when-name" x="46" y="122">Cache</text>
  <text class="cache-when-desc" x="46" y="142">Stable prefix, steady traffic.</text>
  <text class="cache-when-desc cache-when-row cache-when-r0" x="46" y="182">A long system prompt or example set</text>
  <text class="cache-when-desc cache-when-row cache-when-r1" x="46" y="216">Documents reused across requests</text>
  <text class="cache-when-desc cache-when-row cache-when-r2" x="46" y="250">Sustained traffic within the expiry window</text>
  <text class="cache-when-desc cache-when-row cache-when-r3" x="46" y="284">Multi-turn conversations</text>
  <text class="cache-when-desc cache-when-row cache-when-r4" x="46" y="318">Where the prefix never varies</text>
  <rect class="cache-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cache-when-name" x="526" y="122">Do not</text>
  <text class="cache-when-desc" x="526" y="142">Four cases.</text>
  <text class="cache-when-desc cache-when-row cache-when-r0" x="526" y="182">Short prompts</text>
  <text class="cache-when-desc cache-when-row cache-when-r1" x="526" y="216">Occasional or bursty calls</text>
  <text class="cache-when-desc cache-when-row cache-when-r2" x="526" y="250">Anything variable near the start</text>
  <text class="cache-when-desc cache-when-row cache-when-r3" x="526" y="284">Prefixes that change per request</text>
  <text class="cache-when-desc cache-when-row cache-when-r4" x="526" y="318">Where the write premium exceeds the saving</text>
  <text class="cache-when-sub" x="30" y="372">Anything variable near the start is the mistake that silently disables caching entirely — a timestamp or a user identifier in the first line costs nothing to move and everything to leave.</text>
</svg>
