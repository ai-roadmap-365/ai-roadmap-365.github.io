<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Beyond the accuracy figure.">
  <title>Three things this benchmark teaches</title>
  <style>
    .mnist-implications-bg   { fill: #f8fafc; }
    .mnist-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mnist-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mnist-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mnist-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mnist-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mnist-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mnist-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mnist-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mnist-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mnist-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mnist-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mnist-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .mnist-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .mnist-implications-stage { opacity: 1; }

    .mnist-implications-s0 { animation-delay: 0.00s; }
    .mnist-implications-e0 { animation-delay: 0.00s; }
    .mnist-implications-s1 { animation-delay: 1.50s; }
    .mnist-implications-e1 { animation-delay: 1.50s; }
    .mnist-implications-s2 { animation-delay: 3.00s; }
    .mnist-implications-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .mnist-implications-conn  { animation: mnist-implications-trace 6s ease-in-out infinite; }
      .mnist-implications-stage { animation: mnist-implications-arrive 6s ease-in-out infinite; }
    }
    @keyframes mnist-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes mnist-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .mnist-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .mnist-implications-stage { animation: mnist-implications-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes mnist-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="mnist-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="mnist-implications-bg" width="980" height="322"/>
  <text class="mnist-implications-h1"  x="30" y="40">Three things this benchmark teaches</text>
  <text class="mnist-implications-sub" x="30" y="64">Beyond the accuracy figure.</text>
  <g class="mnist-implications-stage mnist-implications-s0">
    <rect class="mnist-implications-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="mnist-implications-step" x="44" y="142">01</text>
    <text class="mnist-implications-name" x="70" y="142">The confusion matrix is the finding</text>
    <text class="mnist-implications-desc" x="44" y="166">Which digits are mistaken for which, and</text>
    <text class="mnist-implications-desc" x="44" y="182">whether a human would agree.</text>
  </g>
  <line class="mnist-implications-line mnist-implications-conn mnist-implications-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#mnist-implications-tip)"/>
  <g class="mnist-implications-stage mnist-implications-s1">
    <rect class="mnist-implications-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="mnist-implications-step" x="359" y="142">02</text>
    <text class="mnist-implications-name" x="385" y="142">Normalisation is load-bearing</text>
    <text class="mnist-implications-desc" x="359" y="166">Unscaled 0-255 inputs saturate activations</text>
    <text class="mnist-implications-desc" x="359" y="182">and stall training.</text>
  </g>
  <line class="mnist-implications-line mnist-implications-conn mnist-implications-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#mnist-implications-tip)"/>
  <g class="mnist-implications-stage mnist-implications-s2">
    <rect class="mnist-implications-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="mnist-implications-step" x="674" y="142">03</text>
    <text class="mnist-implications-name" x="700" y="142">And the benchmark is easy</text>
    <text class="mnist-implications-desc" x="674" y="166">Centred, uniform, clean. Real images are none</text>
    <text class="mnist-implications-desc" x="674" y="182">of those.</text>
  </g>
  <text class="mnist-implications-sub" x="30" y="304">The last point is worth holding onto when a result transfers badly: MNIST digits are centred and size-normalised, and a model that relies on that has learned something the real world will not provide.</text>
</svg>
