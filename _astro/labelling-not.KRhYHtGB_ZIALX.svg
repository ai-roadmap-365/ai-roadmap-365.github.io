<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What labelling is not</title>
  <style>
    .labelling-not-bg   { fill: #f8fafc; }
    .labelling-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .labelling-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .labelling-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .labelling-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .labelling-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .labelling-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .labelling-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .labelling-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .labelling-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .labelling-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .labelling-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .labelling-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .labelling-not-row { opacity: 1; }
    .labelling-not-r0 { animation-delay: 0.00s; }
    .labelling-not-r1 { animation-delay: 0.45s; }
    .labelling-not-r2 { animation-delay: 0.90s; }
    .labelling-not-r3 { animation-delay: 1.35s; }
    .labelling-not-r4 { animation-delay: 1.80s; }
    .labelling-not-row { animation: labelling-not-reveal 7.3s ease-in-out infinite; }
    @keyframes labelling-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="labelling-not-bg" width="980" height="390"/>
  <text class="labelling-not-h1"  x="30" y="40">What labelling is not</text>
  <text class="labelling-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="labelling-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="labelling-not-name" x="46" y="122">The misconception</text>
  <text class="labelling-not-desc" x="46" y="142">Commonly held.</text>
  <text class="labelling-not-desc labelling-not-row labelling-not-r0" x="46" y="182">More labels always beat better labels</text>
  <text class="labelling-not-desc labelling-not-row labelling-not-r1" x="46" y="216">Labelling is unskilled work</text>
  <text class="labelling-not-desc labelling-not-row labelling-not-r2" x="46" y="250">Guidelines can be written once</text>
  <text class="labelling-not-desc labelling-not-row labelling-not-r3" x="46" y="284">One annotator per example is enough</text>
  <text class="labelling-not-desc labelling-not-row labelling-not-r4" x="46" y="318">Benchmark labels are correct</text>
  <rect class="labelling-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="labelling-not-name" x="526" y="122">What is true</text>
  <text class="labelling-not-desc" x="526" y="142">Actually.</text>
  <text class="labelling-not-desc labelling-not-row labelling-not-r0" x="526" y="182">Systematic label error caps accuracy regardless</text>
  <text class="labelling-not-desc labelling-not-row labelling-not-r1" x="526" y="216">Ambiguous cases need real judgment</text>
  <text class="labelling-not-desc labelling-not-row labelling-not-r2" x="526" y="250">They need revision as edge cases surface</text>
  <text class="labelling-not-desc labelling-not-row labelling-not-r3" x="526" y="284">Double-label a sample, always</text>
  <text class="labelling-not-desc labelling-not-row labelling-not-r4" x="526" y="318">Several well-known benchmarks have measurable error rates</text>
  <text class="labelling-not-sub" x="30" y="372">Treating guidelines as a living document is the practical habit: every ambiguous case an annotator raises is a gap that will otherwise be resolved inconsistently.</text>
</svg>
