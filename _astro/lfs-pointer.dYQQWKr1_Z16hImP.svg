<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A pointer in the repository, the bytes elsewhere.">
  <title>What Git LFS actually stores</title>
  <style>
    .lfs-pointer-bg   { fill: #f8fafc; }
    .lfs-pointer-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lfs-pointer-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lfs-pointer-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lfs-pointer-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lfs-pointer-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lfs-pointer-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lfs-pointer-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .lfs-pointer-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .lfs-pointer-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .lfs-pointer-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .lfs-pointer-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .lfs-pointer-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .lfs-pointer-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .lfs-pointer-stage { opacity: 1; }

    .lfs-pointer-s0 { animation-delay: 0.00s; }
    .lfs-pointer-e0 { animation-delay: 0.00s; }
    .lfs-pointer-s1 { animation-delay: 1.28s; }
    .lfs-pointer-e1 { animation-delay: 1.28s; }
    .lfs-pointer-s2 { animation-delay: 2.56s; }
    .lfs-pointer-e2 { animation-delay: 2.56s; }
    .lfs-pointer-s3 { animation-delay: 3.84s; }
    .lfs-pointer-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .lfs-pointer-conn  { animation: lfs-pointer-trace 6.4s ease-in-out infinite; }
      .lfs-pointer-stage { animation: lfs-pointer-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes lfs-pointer-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes lfs-pointer-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .lfs-pointer-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .lfs-pointer-stage { animation: lfs-pointer-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes lfs-pointer-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="lfs-pointer-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="lfs-pointer-bg" width="980" height="322"/>
  <text class="lfs-pointer-h1"  x="30" y="40">What Git LFS actually stores</text>
  <text class="lfs-pointer-sub" x="30" y="64">A pointer in the repository, the bytes elsewhere.</text>
  <g class="lfs-pointer-stage lfs-pointer-s0">
    <rect class="lfs-pointer-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="lfs-pointer-step" x="44" y="142">01</text>
    <text class="lfs-pointer-name" x="70" y="142">You commit a large file</text>
    <text class="lfs-pointer-desc" x="44" y="166">LFS intercepts it before it</text>
    <text class="lfs-pointer-desc" x="44" y="182">enters the history.</text>
  </g>
  <line class="lfs-pointer-line lfs-pointer-conn lfs-pointer-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#lfs-pointer-tip)"/>
  <g class="lfs-pointer-stage lfs-pointer-s1">
    <rect class="lfs-pointer-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="lfs-pointer-step" x="280" y="142">02</text>
    <text class="lfs-pointer-name" x="306" y="142">A tiny pointer goes in the repo</text>
    <text class="lfs-pointer-desc" x="280" y="166">A few lines of text naming a</text>
    <text class="lfs-pointer-desc" x="280" y="182">hash. That is what gets</text>
    <text class="lfs-pointer-desc" x="280" y="198">versioned.</text>
    <text class="lfs-pointer-edge" x="280" y="242">~130 bytes</text>
  </g>
  <line class="lfs-pointer-line lfs-pointer-conn lfs-pointer-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#lfs-pointer-tip)"/>
  <g class="lfs-pointer-stage lfs-pointer-s2">
    <rect class="lfs-pointer-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="lfs-pointer-step" x="516" y="142">03</text>
    <text class="lfs-pointer-name" x="542" y="142">The bytes go to a separate store</text>
    <text class="lfs-pointer-desc" x="516" y="166">Fetched on demand, not on every</text>
    <text class="lfs-pointer-desc" x="516" y="182">clone.</text>
  </g>
  <line class="lfs-pointer-line lfs-pointer-conn lfs-pointer-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#lfs-pointer-tip)"/>
  <g class="lfs-pointer-stage lfs-pointer-s3">
    <rect class="lfs-pointer-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="lfs-pointer-step" x="752" y="142">04</text>
    <text class="lfs-pointer-name" x="778" y="142">So a clone stays small</text>
    <text class="lfs-pointer-desc" x="752" y="166">You get the pointers, and only</text>
    <text class="lfs-pointer-desc" x="752" y="182">the versions you check out.</text>
    <text class="lfs-pointer-edge" x="752" y="242">fast clone</text>
  </g>
  <text class="lfs-pointer-sub" x="30" y="304">This matters because a repository keeps every version of every file forever. Without LFS, ten revisions of a 500 MB checkpoint is 5 GB that every future clone downloads.</text>
</svg>
