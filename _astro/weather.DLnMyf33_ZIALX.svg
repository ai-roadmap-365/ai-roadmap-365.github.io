<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Confidence falls with horizon.">
  <title>Forecasting weather</title>
  <style>
    .weather-bg   { fill: #f8fafc; }
    .weather-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weather-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weather-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weather-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weather-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weather-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .weather-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .weather-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .weather-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .weather-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .weather-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .weather-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .weather-row { opacity: 1; }
    .weather-r0 { animation-delay: 0.00s; }
    .weather-r1 { animation-delay: 0.45s; }
    .weather-r2 { animation-delay: 0.90s; }
    .weather-r3 { animation-delay: 1.35s; }
    .weather-r4 { animation-delay: 1.80s; }
    .weather-row { animation: weather-reveal 7.3s ease-in-out infinite; }
    @keyframes weather-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="weather-bg" width="980" height="390"/>
  <text class="weather-h1"  x="30" y="40">Forecasting weather</text>
  <text class="weather-sub" x="30" y="64">Confidence falls with horizon.</text>
  <rect class="weather-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="weather-name" x="46" y="122">Tomorrow</text>
  <text class="weather-desc" x="46" y="142">Reliable.</text>
  <text class="weather-desc weather-row weather-r0" x="46" y="182">Current conditions dominate</text>
  <text class="weather-desc weather-row weather-r1" x="46" y="216">Narrow uncertainty range</text>
  <text class="weather-desc weather-row weather-r2" x="46" y="250">Actionable with confidence</text>
  <text class="weather-desc weather-row weather-r3" x="46" y="284">Errors are small</text>
  <text class="weather-desc weather-row weather-r4" x="46" y="318">This is a short horizon</text>
  <rect class="weather-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="weather-name" x="526" y="122">Three weeks out</text>
  <text class="weather-desc" x="526" y="142">Barely useful.</text>
  <text class="weather-desc weather-row weather-r0" x="526" y="182">Current conditions barely matter</text>
  <text class="weather-desc weather-row weather-r1" x="526" y="216">Very wide uncertainty range</text>
  <text class="weather-desc weather-row weather-r2" x="526" y="250">Only the seasonal average is reliable</text>
  <text class="weather-desc weather-row weather-r3" x="526" y="284">Errors compound</text>
  <text class="weather-desc weather-row weather-r4" x="526" y="318">This is a long horizon</text>
  <text class="weather-sub" x="30" y="372">Quoting a forecast without its horizon and interval is the equivalent of a weather forecast with no date, and it invites exactly the wrong kind of confidence.</text>
</svg>
