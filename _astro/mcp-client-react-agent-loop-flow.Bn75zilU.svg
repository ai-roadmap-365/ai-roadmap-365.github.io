<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="MCP Client ReAct Agent Loop Flow">
  <title>MCP Client ReAct Agent Loop Flow</title>
  <defs>
    <style>
      .d299f-bg { fill: #f8fafc; }
      .d299f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d299f-step { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d299f-call { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 8px; }
      .d299f-obs { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d299f-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d299f-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d299f-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d299f-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
      .d299f-flow { stroke: #64748b; stroke-width: 2px; stroke-dasharray: 4,4; fill: none; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d299f-bg" />
  
  <text x="40" y="40" class="d299f-title">MCP Client: Autonomous ReAct Loop Integration</text>
  <text x="40" y="65" class="d299f-subtitle">MCP Client ReAct Agent Loop Flow showing model reasoning turn, tool selection, MCP JSON-RPC dispatch, and observation integration</text>
  
  <!-- Step 1: User Request -->
  <rect x="40" y="110" width="180" height="120" class="d299f-step" />
  <text x="55" y="140" class="d299f-header" fill="#1d4ed8">1. Prompt &amp; Schemas</text>
  <text x="55" y="165" class="d299f-text">• Ingests User Goal</text>
  <text x="55" y="185" class="d299f-text">• Injects MCP tools list</text>
  <text x="55" y="205" class="d299f-text">• Sends to LLM API</text>
  
  <!-- Step 2: Model Decision -->
  <rect x="260" y="110" width="180" height="120" class="d299f-call" />
  <text x="275" y="140" class="d299f-header" fill="#a16207">2. Model Decision</text>
  <text x="275" y="165" class="d299f-text">• Generates Thought</text>
  <text x="275" y="185" class="d299f-text">• Selects tool: `sql_query`</text>
  <text x="275" y="205" class="d299f-text">• Emits JSON parameters</text>
  
  <!-- Step 3: MCP Dispatch -->
  <rect x="480" y="110" width="180" height="120" class="d299f-card" />
  <text x="495" y="140" class="d299f-header">3. Client Dispatch</text>
  <text x="495" y="165" class="d299f-text">• Looks up routing table</text>
  <text x="495" y="185" class="d299f-text">• Sends `tools/call` JSON-RPC</text>
  <text x="495" y="205" class="d299f-text">• Reads stdio response</text>
  
  <!-- Step 4: Observation Integration -->
  <rect x="700" y="110" width="160" height="120" class="d299f-obs" />
  <text x="715" y="140" class="d299f-header" fill="#15803d">4. Observation</text>
  <text x="715" y="165" class="d299f-text">• Appends tool output</text>
  <text x="715" y="185" class="d299f-text">• Next reasoning turn</text>
  <text x="715" y="205" class="d299f-text">• Emits Final Answer</text>
  
  <!-- Loop Arrow -->
  <path d="M 780 230 L 780 320 L 130 320 L 130 230" class="d299f-flow" />
  <text x="400" y="340" class="d299f-text" font-weight="600">Iterate ReAct Loop until Goal Satisfied</text>
</svg>