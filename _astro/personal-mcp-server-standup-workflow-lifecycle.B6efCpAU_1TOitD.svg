<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Personal MCP Server Standup Workflow Lifecycle">
  <title>Personal MCP Server Standup Workflow Lifecycle</title>
  <defs>
    <style>
      .d301f-bg { fill: #f8fafc; }
      .d301f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d301f-step { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d301f-data { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d301f-done { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d301f-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d301f-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d301f-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d301f-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
      .d301f-flow { stroke: #3b82f6; stroke-width: 2px; marker-end: url(#d301f-m); fill: none; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d301f-bg" />
  
  <text x="40" y="40" class="d301a-title">Personal MCP Server: Daily Standup Workflow Flow</text>
  <text x="40" y="65" class="d301a-subtitle">Personal MCP Server Standup Workflow Lifecycle showing prompt invocation, git commit retrieval, SQLite todo fetch, and standup summary synthesis</text>
  
  <rect x="40" y="110" width="180" height="260" class="d301f-step" />
  <text x="55" y="140" class="d301f-header" fill="#1d4ed8">1. Trigger Prompt</text>
  <text x="55" y="170" class="d301f-text">• User types `/standup`</text>
  <text x="55" y="190" class="d301f-text">• Client sends</text>
  <text x="55" y="210" class="d301f-text">  `prompts/get` to</text>
  <text x="55" y="230" class="d301f-text">  Personal MCP Server</text>
  <text x="55" y="260" class="d301f-text" font-weight="600">Arguments:</text>
  <text x="55" y="280" class="d301f-text">`days_back: 1`</text>
  
  <rect x="250" y="110" width="190" height="260" class="d301f-data" />
  <text x="265" y="140" class="d301f-header" fill="#7e22ce">2. Aggregate Context</text>
  <text x="265" y="170" class="d301f-text">• Reads Git log:</text>
  <text x="265" y="190" class="d301f-text">  `git log --since="24h"`</text>
  <text x="265" y="220" class="d301f-text">• Queries SQLite:</text>
  <text x="265" y="240" class="d301f-text">  `SELECT * FROM todos`</text>
  <text x="265" y="270" class="d301f-text">• Reads System status:</text>
  <text x="265" y="290" class="d301f-text">  `sys://telemetry`</text>
  
  <rect x="470" y="110" width="180" height="260" class="d301f-card" />
  <text x="485" y="140" class="d301f-header">3. Compile Prompt</text>
  <text x="485" y="170" class="d301f-text">• Injects git diffs</text>
  <text x="485" y="190" class="d301f-text">• Injects active todos</text>
  <text x="485" y="210" class="d301f-text">• Formats instructions:</text>
  <text x="485" y="230" class="d301f-text">  "Generate a 3-part</text>
  <text x="485" y="250" class="d301f-text">  standup: Done, Doing,</text>
  <text x="485" y="270" class="d301f-text">  and Blockers"</text>
  
  <rect x="680" y="110" width="180" height="260" class="d301f-done" />
  <text x="695" y="140" class="d301f-header" fill="#15803d">4. Executive Output</text>
  <text x="695" y="170" class="d301f-text">• AI generates:</text>
  <text x="695" y="195" class="d301f-text">  **Yesterday:**</text>
  <text x="695" y="210" class="d301f-text">  - Shipped MCP server</text>
  <text x="695" y="235" class="d301f-text">  **Today:**</text>
  <text x="695" y="250" class="d301f-text">  - Complete test suite</text>
  <text x="695" y="275" class="d301f-text">  **Blockers:** None</text>
</svg>