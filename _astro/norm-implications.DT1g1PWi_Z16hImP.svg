<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are practical.">
  <title>Four consequences</title>
  <style>
    .norm-implications-bg   { fill: #f8fafc; }
    .norm-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .norm-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .norm-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .norm-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .norm-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .norm-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .norm-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .norm-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .norm-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .norm-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .norm-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .norm-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .norm-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .norm-implications-stage { opacity: 1; }

    .norm-implications-s0 { animation-delay: 0.00s; }
    .norm-implications-e0 { animation-delay: 0.00s; }
    .norm-implications-s1 { animation-delay: 1.28s; }
    .norm-implications-e1 { animation-delay: 1.28s; }
    .norm-implications-s2 { animation-delay: 2.56s; }
    .norm-implications-e2 { animation-delay: 2.56s; }
    .norm-implications-s3 { animation-delay: 3.84s; }
    .norm-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .norm-implications-conn  { animation: norm-implications-trace 6.4s ease-in-out infinite; }
      .norm-implications-stage { animation: norm-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes norm-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes norm-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .norm-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .norm-implications-stage { animation: norm-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes norm-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="norm-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="norm-implications-bg" width="980" height="322"/>
  <text class="norm-implications-h1"  x="30" y="40">Four consequences</text>
  <text class="norm-implications-sub" x="30" y="64">Two are practical.</text>
  <g class="norm-implications-stage norm-implications-s0">
    <rect class="norm-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="norm-implications-step" x="44" y="142">01</text>
    <text class="norm-implications-name" x="70" y="142">The norm decides which items count as similar</text>
    <text class="norm-implications-desc" x="44" y="166">So it changes retrieval results</text>
    <text class="norm-implications-desc" x="44" y="182">directly.</text>
  </g>
  <line class="norm-implications-line norm-implications-conn norm-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#norm-implications-tip)"/>
  <g class="norm-implications-stage norm-implications-s1">
    <rect class="norm-implications-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="norm-implications-step" x="280" y="142">02</text>
    <text class="norm-implications-name" x="306" y="142">And as a penalty it decides whether coefficients reach zero</text>
    <text class="norm-implications-desc" x="280" y="166">Which is feature selection.</text>
  </g>
  <line class="norm-implications-line norm-implications-conn norm-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#norm-implications-tip)"/>
  <g class="norm-implications-stage norm-implications-s2">
    <rect class="norm-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="norm-implications-step" x="516" y="142">03</text>
    <text class="norm-implications-name" x="542" y="142">All of them degrade in high dimensions</text>
    <text class="norm-implications-desc" x="516" y="166">Though at different rates.</text>
  </g>
  <line class="norm-implications-line norm-implications-conn norm-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#norm-implications-tip)"/>
  <g class="norm-implications-stage norm-implications-s3">
    <rect class="norm-implications-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="norm-implications-step" x="752" y="142">04</text>
    <text class="norm-implications-name" x="778" y="142">While unscaled features make any of them meaningless</text>
    <text class="norm-implications-desc" x="752" y="166">Which is the precondition for</text>
    <text class="norm-implications-desc" x="752" y="182">all of it.</text>
  </g>
  <text class="norm-implications-sub" x="30" y="304">Scaling being a precondition rather than a refinement is the practical summary: no choice of norm rescues a comparison across incomparable units.</text>
</svg>
