<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Two-Stage Hybrid Retrieval and Reranking Pipeline">
  <title>Two-Stage Hybrid Retrieval and Reranking Pipeline</title>
  <defs>
    <style>
      .d353a-bg { fill: #f8fafc; }
      .d353a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d353a-ing { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d353a-ret { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d353a-rer { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d353a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d353a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d353a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d353a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d353a-bg" />
  
  <text x="40" y="40" class="d353a-title">Two-Stage Hybrid Retrieval &amp; Reranking Pipeline</text>
  <text x="40" y="65" class="d353a-subtitle">Two-Stage Hybrid Retrieval and Reranking Pipeline showing Document Ingestion, Dense/Sparse Indexing, Reciprocal Rank Fusion, Cross-Encoder Scoring, and Top-K Context Selection</text>
  
  <!-- Ingestion -->
  <rect x="40" y="110" width="250" height="280" class="d353a-ing" />
  <text x="55" y="145" class="d353a-header" fill="#1d4ed8">1. Chunking &amp; Ingestion</text>
  <text x="55" y="180" class="d353a-text">• Markdown / PDF / JSON</text>
  <text x="55" y="205" class="d353a-text">• Semantic Boundary Split</text>
  <text x="55" y="230" class="d353a-text">• SHA256 Chunk Hashing</text>
  <text x="55" y="255" class="d353a-text">• Metadata Tagging (ID, source)</text>
  <text x="55" y="300" class="d353a-text" font-weight="600" fill="#1d4ed8">Idempotent Upserts</text>
  
  <!-- First Stage Retrieval -->
  <rect x="315" y="110" width="270" height="280" class="d353a-ret" />
  <text x="330" y="145" class="d353a-header" fill="#15803d">2. Parallel Stage-1 Search</text>
  <text x="330" y="180" class="d353a-text">• Dense Vector Index (Cosine)</text>
  <text x="330" y="205" class="d353a-text">• Sparse BM25 Keyword Search</text>
  <text x="330" y="230" class="d353a-text">• Reciprocal Rank Fusion (RRF)</text>
  <text x="330" y="255" class="d353a-text">• Top-50 Candidates Pool</text>
  <text x="330" y="300" class="d353a-text" font-weight="600" fill="#15803d">Latency: under 35ms</text>
  
  <!-- Second Stage Reranking -->
  <rect x="610" y="110" width="250" height="280" class="d353a-rer" />
  <text x="625" y="145" class="d353a-header" fill="#7e22ce">3. Stage-2 Cross-Encoder</text>
  <text x="625" y="180" class="d353a-text">• Joint Query-Doc Attention</text>
  <text x="625" y="205" class="d353a-text">• Fine-Grained Relevance Score</text>
  <text x="625" y="230" class="d353a-text">• Top-5 Filter &amp; Token Budget</text>
  <text x="625" y="255" class="d353a-text">• Grounded Context Payload</text>
  <text x="625" y="300" class="d353a-text" font-weight="600" fill="#7e22ce">Context Recall: &gt; 92%</text>
</svg>