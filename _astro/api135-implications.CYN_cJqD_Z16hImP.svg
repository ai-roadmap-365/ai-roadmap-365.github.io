<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are dependencies.">
  <title>Four consequences of programmatic access</title>
  <style>
    .api135-implications-bg   { fill: #f8fafc; }
    .api135-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api135-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api135-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api135-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api135-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api135-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .api135-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .api135-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .api135-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .api135-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .api135-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .api135-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .api135-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .api135-implications-stage { opacity: 1; }

    .api135-implications-s0 { animation-delay: 0.00s; }
    .api135-implications-e0 { animation-delay: 0.00s; }
    .api135-implications-s1 { animation-delay: 1.28s; }
    .api135-implications-e1 { animation-delay: 1.28s; }
    .api135-implications-s2 { animation-delay: 2.56s; }
    .api135-implications-e2 { animation-delay: 2.56s; }
    .api135-implications-s3 { animation-delay: 3.84s; }
    .api135-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .api135-implications-conn  { animation: api135-implications-trace 6.4s ease-in-out infinite; }
      .api135-implications-stage { animation: api135-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes api135-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes api135-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .api135-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .api135-implications-stage { animation: api135-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes api135-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="api135-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="api135-implications-bg" width="980" height="322"/>
  <text class="api135-implications-h1"  x="30" y="40">Four consequences of programmatic access</text>
  <text class="api135-implications-sub" x="30" y="64">Two are dependencies.</text>
  <g class="api135-implications-stage api135-implications-s0">
    <rect class="api135-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="api135-implications-step" x="44" y="142">01</text>
    <text class="api135-implications-name" x="70" y="142">Data is current rather than a stale snapshot</text>
    <text class="api135-implications-desc" x="44" y="166">Which is the main reason to use</text>
    <text class="api135-implications-desc" x="44" y="182">it.</text>
  </g>
  <line class="api135-implications-line api135-implications-conn api135-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#api135-implications-tip)"/>
  <g class="api135-implications-stage api135-implications-s1">
    <rect class="api135-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="api135-implications-step" x="280" y="142">02</text>
    <text class="api135-implications-name" x="306" y="142">But you now depend on the provider's availability</text>
    <text class="api135-implications-desc" x="280" y="166">And on their terms.</text>
  </g>
  <line class="api135-implications-line api135-implications-conn api135-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#api135-implications-tip)"/>
  <g class="api135-implications-stage api135-implications-s2">
    <rect class="api135-implications-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="api135-implications-step" x="516" y="142">03</text>
    <text class="api135-implications-name" x="542" y="142">And repeated fetching consumes quota and money</text>
    <text class="api135-implications-desc" x="516" y="166">Which caching mitigates.</text>
  </g>
  <line class="api135-implications-line api135-implications-conn api135-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#api135-implications-tip)"/>
  <g class="api135-implications-stage api135-implications-s3">
    <rect class="api135-implications-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="api135-implications-step" x="752" y="142">04</text>
    <text class="api135-implications-name" x="778" y="142">While a live source makes results hard to reproduce</text>
    <text class="api135-implications-desc" x="752" y="166">Unless the response is archived.</text>
  </g>
  <text class="api135-implications-sub" x="30" y="304">Archiving raw responses is what makes analysis over live data reproducible, and it costs almost nothing compared with the fetch itself.</text>
</svg>
