<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Hallucinated Dependency Attack Vector">
  <title>Hallucinated Dependency Attack Vector</title>
  <defs>
    <style>
      .d306f-bg { fill: #f8fafc; }
      .d306f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d306f-hall { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d306f-att { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; rx: 8px; }
      .d306f-dev { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 8px; }
      .d306f-rce { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d306f-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d306f-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d306f-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d306f-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
      .d306f-arrow { stroke: #ef4444; stroke-width: 2px; fill: none; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d306f-bg" />
  
  <text x="40" y="40" class="d306a-title">Threat Model: Package Slopsquatting Lifecycle</text>
  <text x="40" y="65" class="d306a-subtitle">Hallucinated Dependency Attack Vector diagram showing LLM Hallucination, Attacker Registry Squatting, Developer Install, and Remote Code Execution</text>
  
  <!-- Step 1: LLM Hallucination -->
  <rect x="40" y="110" width="180" height="260" class="d306f-hall" />
  <text x="55" y="140" class="d306f-header" fill="#1d4ed8">1. LLM Hallucination</text>
  <text x="55" y="170" class="d306f-text">• Agent writes code:</text>
  <text x="55" y="190" class="d306f-text">  `import fast_jwt_crypt`</text>
  <text x="55" y="215" class="d306f-text">• Package does NOT exist</text>
  <text x="55" y="235" class="d306f-text">  on PyPI registry</text>
  <text x="55" y="260" class="d306f-text" font-weight="600">Vulnerability:</text>
  <text x="55" y="280" class="d306f-text">Phantom namespace</text>
  
  <!-- Step 2: Attacker Squats -->
  <rect x="250" y="110" width="180" height="260" class="d306f-att" />
  <text x="265" y="140" class="d306f-header" fill="#b91c1c">2. Slopsquatting</text>
  <text x="265" y="170" class="d306f-text">• Attacker mines public</text>
  <text x="265" y="190" class="d306f-text">  AI hallucinations</text>
  <text x="265" y="215" class="d306f-text">• Publishes malicious</text>
  <text x="265" y="235" class="d306f-text">  `fast_jwt_crypt` to PyPI</text>
  <text x="265" y="260" class="d306f-text" font-weight="600">Payload:</text>
  <text x="265" y="280" class="d306f-text">setup.py trojan script</text>
  
  <!-- Step 3: Developer / CI Runs -->
  <rect x="460" y="110" width="180" height="260" class="d306f-dev" />
  <text x="475" y="140" class="d306f-header" fill="#a16207">3. Ingestion &amp; Install</text>
  <text x="475" y="170" class="d306f-text">• Dev merges AI PR</text>
  <text x="475" y="190" class="d306f-text">• CI runs `pip install`</text>
  <text x="475" y="215" class="d306f-text">• `fast_jwt_crypt` pulled</text>
  <text x="475" y="235" class="d306f-text">  from public PyPI</text>
  <text x="475" y="260" class="d306f-text" font-weight="600">Action:</text>
  <text x="475" y="280" class="d306f-text">Executes setup script</text>
  
  <!-- Step 4: Exploitation -->
  <rect x="670" y="110" width="190" height="260" class="d306f-rce" />
  <text x="685" y="140" class="d306f-header" fill="#7e22ce">4. Compromise</text>
  <text x="685" y="170" class="d306f-text">• Exfiltrates ENV secrets</text>
  <text x="685" y="190" class="d306f-text">• AWS credentials stolen</text>
  <text x="685" y="215" class="d306f-text">• Production backdoor</text>
  <text x="685" y="245" class="d306f-text" font-weight="600">Mitigation:</text>
  <text x="685" y="265" class="d306f-text">Lockfiles &amp; strict audit</text>
</svg>