<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1560" role="img" aria-labelledby="d119a-title d119a-desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
  <title id="d119a-title">The eight-step experiment analysis pipeline, each step with its guarding check and the failure it catches</title>
  <desc id="d119a-desc">A vertical pipeline of eight stacked cards, each naming one analysis step, the check that guards it, and the failure mode it catches, connected top to bottom by a single arrow.</desc>

  <style>
    .d119a-bg { fill: #f8fafc; }
    .d119a-card { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; }
    .d119a-num-circle { fill: #1d4ed8; }
    .d119a-num-text { fill: #f8fafc; font-weight: 700; font-size: 22px; text-anchor: middle; }
    .d119a-title-text { fill: #1a202c; font-weight: 700; font-size: 20px; }
    .d119a-label { fill: #1d4ed8; font-weight: 700; font-size: 13px; }
    .d119a-body { fill: #1a202c; font-size: 14.5px; }
    .d119a-wire { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .d119a-caption { fill: #1a202c; font-size: 15px; font-style: italic; }
  </style>

  <rect class="d119a-bg" x="0" y="0" width="1000" height="1560" />

  <text x="500" y="42" text-anchor="middle" class="d119a-title-text" font-size="24">Analyzing one experiment, end to end</text>
  <text x="500" y="68" text-anchor="middle" class="d119a-caption" font-size="14">Every card names the check that guards its step, and the failure that check catches.</text>

  <!-- connecting spine -->
  <line class="d119a-wire" x1="90" y1="100" x2="90" y2="1470" />

  <!-- Step template repeated 8 times, y offsets 100..1470 step ~172 -->

  <!-- Step 1 -->
  <g>
    <circle class="d119a-num-circle" cx="90" cy="118" r="24" />
    <text x="90" y="126" class="d119a-num-text">1</text>
    <rect class="d119a-card" x="150" y="88" width="800" height="150" rx="10" />
    <text x="172" y="118" class="d119a-title-text">The question and the decision it feeds</text>
    <text x="172" y="146" class="d119a-label">CHECK</text>
    <text x="172" y="166" class="d119a-body">Can this experiment's result actually change what you do next?</text>
    <text x="172" y="196" class="d119a-label">CATCHES</text>
    <text x="172" y="216" class="d119a-body">An experiment run and trusted with no decision attached to its answer.</text>
  </g>

  <!-- Step 2 -->
  <g>
    <circle class="d119a-num-circle" cx="90" cy="290" r="24" />
    <text x="90" y="298" class="d119a-num-text">2</text>
    <rect class="d119a-card" x="150" y="260" width="800" height="150" rx="10" />
    <text x="172" y="290" class="d119a-title-text">One primary metric, chosen before the data exists</text>
    <text x="172" y="318" class="d119a-label">CHECK</text>
    <text x="172" y="338" class="d119a-body">The headline metric and its guardrails are written down first.</text>
    <text x="172" y="368" class="d119a-label">CATCHES</text>
    <text x="172" y="388" class="d119a-body">Metric shopping -- picking the metric that came back significant.</text>
  </g>

  <!-- Step 3 -->
  <g>
    <circle class="d119a-num-circle" cx="90" cy="462" r="24" />
    <text x="90" y="470" class="d119a-num-text">3</text>
    <rect class="d119a-card" x="150" y="432" width="800" height="150" rx="10" />
    <text x="172" y="462" class="d119a-title-text">The analysis plan, written in advance</text>
    <text x="172" y="490" class="d119a-label">CHECK</text>
    <text x="172" y="510" class="d119a-body">Test, alpha, sample size from a power calculation, stopping rule -- fixed.</text>
    <text x="172" y="540" class="d119a-label">CATCHES</text>
    <text x="172" y="560" class="d119a-body">A stopping rule bent after seeing how the data look so far.</text>
  </g>

  <!-- Step 4 -->
  <g>
    <circle class="d119a-num-circle" cx="90" cy="634" r="24" />
    <text x="90" y="642" class="d119a-num-text">4</text>
    <rect class="d119a-card" x="150" y="604" width="800" height="150" rx="10" fill="#dbeafe" />
    <text x="172" y="634" class="d119a-title-text">Randomization, checked -- the SRM test</text>
    <text x="172" y="662" class="d119a-label">CHECK</text>
    <text x="172" y="682" class="d119a-body">A one-shot chi-squared test on final group counts vs the planned split.</text>
    <text x="172" y="712" class="d119a-label">CATCHES</text>
    <text x="172" y="732" class="d119a-body">Broken randomization -- the single most valuable, most-skipped check here.</text>
  </g>

  <!-- Step 5 -->
  <g>
    <circle class="d119a-num-circle" cx="90" cy="806" r="24" />
    <text x="90" y="814" class="d119a-num-text">5</text>
    <rect class="d119a-card" x="150" y="776" width="800" height="150" rx="10" />
    <text x="172" y="806" class="d119a-title-text">Look before you test</text>
    <text x="172" y="834" class="d119a-label">CHECK</text>
    <text x="172" y="854" class="d119a-body">Distributions, missing values, mean vs median on every group.</text>
    <text x="172" y="884" class="d119a-label">CATCHES</text>
    <text x="172" y="904" class="d119a-body">A mean dragged away from where most users sit by a few outliers.</text>
  </g>

  <!-- Step 6 -->
  <g>
    <circle class="d119a-num-circle" cx="90" cy="978" r="24" />
    <text x="90" y="986" class="d119a-num-text">6</text>
    <rect class="d119a-card" x="150" y="948" width="800" height="150" rx="10" />
    <text x="172" y="978" class="d119a-title-text">The test and the interval, together</text>
    <text x="172" y="1006" class="d119a-label">CHECK</text>
    <text x="172" y="1026" class="d119a-body">p-value AND confidence interval AND effect size in real units.</text>
    <text x="172" y="1056" class="d119a-label">CATCHES</text>
    <text x="172" y="1076" class="d119a-body">A bare p-value that says "surprising" but never says "how much".</text>
  </g>

  <!-- Step 7 -->
  <g>
    <circle class="d119a-num-circle" cx="90" cy="1150" r="24" />
    <text x="90" y="1158" class="d119a-num-text">7</text>
    <rect class="d119a-card" x="150" y="1120" width="800" height="150" rx="10" fill="#dbeafe" />
    <text x="172" y="1150" class="d119a-title-text">Segments, carefully</text>
    <text x="172" y="1178" class="d119a-label">CHECK</text>
    <text x="172" y="1198" class="d119a-body">Per-segment sign compared against the pooled sign, flagged not concluded.</text>
    <text x="172" y="1228" class="d119a-label">CATCHES</text>
    <text x="172" y="1248" class="d119a-body">Simpson's paradox -- every segment negative, the pool positive.</text>
  </g>

  <!-- Step 8 -->
  <g>
    <circle class="d119a-num-circle" cx="90" cy="1322" r="24" />
    <text x="90" y="1330" class="d119a-num-text">8</text>
    <rect class="d119a-card" x="150" y="1292" width="800" height="150" rx="10" />
    <text x="172" y="1322" class="d119a-title-text">The verdict, in plain language</text>
    <text x="172" y="1350" class="d119a-label">CHECK</text>
    <text x="172" y="1370" class="d119a-body">Estimate, interval, what would have flipped the decision -- or refuse.</text>
    <text x="172" y="1400" class="d119a-label">CATCHES</text>
    <text x="172" y="1420" class="d119a-body">A forced ship/no-ship call when the honest answer is "inconclusive".</text>
  </g>

  <text x="500" y="1500" text-anchor="middle" class="d119a-caption">Every card's arithmetic can be correct in isolation. The pipeline is what makes the conclusion trustworthy.</text>
  <text x="500" y="1525" text-anchor="middle" class="d119a-caption" font-size="13">Steps 4 and 7 (shaded) are the two checks a clean-looking result is most likely to skip.</text>
</svg>
