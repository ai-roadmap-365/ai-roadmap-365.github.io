<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The naive assumption</title>
  <style>
    .independence-bg   { fill: #f8fafc; }
    .independence-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .independence-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .independence-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .independence-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .independence-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .independence-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .independence-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .independence-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .independence-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .independence-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .independence-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .independence-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .independence-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .independence-stage { opacity: 1; }

    .independence-s0 { animation-delay: 0.00s; }
    .independence-e0 { animation-delay: 0.00s; }
    .independence-s1 { animation-delay: 1.28s; }
    .independence-e1 { animation-delay: 1.28s; }
    .independence-s2 { animation-delay: 2.56s; }
    .independence-e2 { animation-delay: 2.56s; }
    .independence-s3 { animation-delay: 3.84s; }
    .independence-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .independence-conn  { animation: independence-trace 6.4s ease-in-out infinite; }
      .independence-stage { animation: independence-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes independence-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes independence-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .independence-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .independence-stage { animation: independence-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes independence-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="independence-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="independence-bg" width="980" height="322"/>
  <text class="independence-h1"  x="30" y="40">The naive assumption</text>
  <text class="independence-sub" x="30" y="64">Four steps.</text>
  <g class="independence-stage independence-s0">
    <rect class="independence-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="independence-step" x="44" y="142">01</text>
    <text class="independence-name" x="70" y="142">The joint probability of all features is uncountable</text>
    <text class="independence-desc" x="44" y="166">There are too many combinations.</text>
  </g>
  <line class="independence-line independence-conn independence-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#independence-tip)"/>
  <g class="independence-stage independence-s1">
    <rect class="independence-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="independence-step" x="280" y="142">02</text>
    <text class="independence-name" x="306" y="142">So assume each feature is independent given the class</text>
    <text class="independence-desc" x="280" y="166">Turning a product of many terms</text>
    <text class="independence-desc" x="280" y="182">into many simple counts.</text>
  </g>
  <line class="independence-line independence-conn independence-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#independence-tip)"/>
  <g class="independence-stage independence-s2">
    <rect class="independence-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="independence-step" x="516" y="142">03</text>
    <text class="independence-name" x="542" y="142">Which is plainly false for real data</text>
    <text class="independence-desc" x="516" y="166">Words in text are heavily</text>
    <text class="independence-desc" x="516" y="182">correlated.</text>
  </g>
  <line class="independence-line independence-conn independence-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#independence-tip)"/>
  <g class="independence-stage independence-s3">
    <rect class="independence-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="independence-step" x="752" y="142">04</text>
    <text class="independence-name" x="778" y="142">But the ranking of classes usually survives</text>
    <text class="independence-desc" x="752" y="166">Probabilities are wrong, the</text>
    <text class="independence-desc" x="752" y="182">argmax is right.</text>
  </g>
  <text class="independence-sub" x="30" y="304">The distinction between a wrong probability and a wrong decision is the whole reason this model persists: it is badly calibrated and frequently accurate.</text>
</svg>
