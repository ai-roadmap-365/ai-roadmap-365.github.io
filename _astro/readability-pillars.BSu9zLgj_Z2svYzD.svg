<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" font-family="system-ui, sans-serif">
  <title>The five pillars of readable code — meaningful names, small functions, docstrings and comments, PEP 8 formatting, and type hints — hold up a roof labelled readable code, which in turn supports reviewable and reproducible work; all five stand on a shared foundation of PEP 8, PEP 257, and PEP 20 (the Zen of Python)</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The five pillars of readable code</text>

  <!-- Roof / entablature -->
  <rect x="40" y="60" width="680" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Readable code — code humans and tools can read</text>
  <text x="380" y="107" text-anchor="middle" font-size="14" fill="#1a202c">supports work that is reviewable, reproducible, and AI-friendly</text>

  <!-- Pillars -->
  <!-- Pillar 1: Names -->
  <rect x="44" y="140" width="120" height="228" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="104" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Names</text>
  <text x="104" y="206" text-anchor="middle" font-size="14" fill="#1a202c">meaningful,</text>
  <text x="104" y="226" text-anchor="middle" font-size="14" fill="#1a202c">searchable</text>

  <!-- Pillar 2: Small functions -->
  <rect x="184" y="140" width="120" height="228" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="244" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Small</text>
  <text x="244" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">functions</text>
  <text x="244" y="226" text-anchor="middle" font-size="14" fill="#1a202c">one job each</text>

  <!-- Pillar 3: Docstrings -->
  <rect x="324" y="140" width="120" height="228" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="384" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Docstrings</text>
  <text x="384" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">&amp; comments</text>
  <text x="384" y="226" text-anchor="middle" font-size="14" fill="#1a202c">say WHY,</text>
  <text x="384" y="246" text-anchor="middle" font-size="14" fill="#1a202c">not what</text>

  <!-- Pillar 4: Formatting -->
  <rect x="464" y="140" width="120" height="228" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="524" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Formatting</text>
  <text x="524" y="206" text-anchor="middle" font-size="14" fill="#1a202c">PEP 8 layout,</text>
  <text x="524" y="226" text-anchor="middle" font-size="14" fill="#1a202c">consistent</text>

  <!-- Pillar 5: Type hints -->
  <rect x="604" y="140" width="120" height="228" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="664" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Type hints</text>
  <text x="664" y="206" text-anchor="middle" font-size="14" fill="#1a202c">docs tools</text>
  <text x="664" y="226" text-anchor="middle" font-size="14" fill="#1a202c">can check</text>

  <!-- Foundation -->
  <rect x="40" y="388" width="680" height="58" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="414" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Shared foundation</text>
  <text x="380" y="434" text-anchor="middle" font-size="14" fill="#1a202c">PEP 8 (style) · PEP 257 (docstrings) · PEP 20 (the Zen of Python)</text>
</svg>
