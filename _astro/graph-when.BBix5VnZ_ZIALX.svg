<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when a for-loop is simpler.">
  <title>When a graph is worth it</title>
  <style>
    .graph-when-bg   { fill: #f8fafc; }
    .graph-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .graph-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .graph-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .graph-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .graph-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .graph-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .graph-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .graph-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .graph-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .graph-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .graph-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .graph-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .graph-when-row { opacity: 1; }
    .graph-when-r0 { animation-delay: 0.00s; }
    .graph-when-r1 { animation-delay: 0.45s; }
    .graph-when-r2 { animation-delay: 0.90s; }
    .graph-when-r3 { animation-delay: 1.35s; }
    .graph-when-r4 { animation-delay: 1.80s; }
    .graph-when-row { animation: graph-when-reveal 7.3s ease-in-out infinite; }
    @keyframes graph-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="graph-when-bg" width="980" height="390"/>
  <text class="graph-when-h1"  x="30" y="40">When a graph is worth it</text>
  <text class="graph-when-sub" x="30" y="64">And when a for-loop is simpler.</text>
  <rect class="graph-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="graph-when-name" x="46" y="122">Use a graph</text>
  <text class="graph-when-desc" x="46" y="142">Cycles, gates and resumption.</text>
  <text class="graph-when-desc graph-when-row graph-when-r0" x="46" y="182">Retry loops and reflection gates</text>
  <text class="graph-when-desc graph-when-row graph-when-r1" x="46" y="216">Multi-step error recovery</text>
  <text class="graph-when-desc graph-when-row graph-when-r2" x="46" y="250">Human approval before a risky action</text>
  <text class="graph-when-desc graph-when-row graph-when-r3" x="46" y="284">Time-travel debugging</text>
  <text class="graph-when-desc graph-when-row graph-when-r4" x="46" y="318">Long-term state resumption</text>
  <rect class="graph-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="graph-when-name" x="526" y="122">Use control flow</text>
  <text class="graph-when-desc" x="526" y="142">Two steps and a condition.</text>
  <text class="graph-when-desc graph-when-row graph-when-r0" x="526" y="182">A single-turn API call</text>
  <text class="graph-when-desc graph-when-row graph-when-r1" x="526" y="216">A linear two-step chain</text>
  <text class="graph-when-desc graph-when-row graph-when-r2" x="526" y="250">A CLI script</text>
  <text class="graph-when-desc graph-when-row graph-when-r3" x="526" y="284">for and if are simpler and clearer</text>
  <text class="graph-when-desc graph-when-row graph-when-r4" x="526" y="318">And need no checkpoint store</text>
  <text class="graph-when-sub" x="30" y="372">Adopting a graph for a linear pipeline is a common early mistake: the machinery is real and the benefit is entirely in the capabilities on the left, none of which a straight line uses.</text>
</svg>
