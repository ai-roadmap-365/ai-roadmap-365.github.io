<svg role="img" aria-label="End to end lifecycle cycle diagram illustrating Problem Scoping Data Engine Modeling Validation Deployment and Continuous Monitoring stages" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>The Machine Learning Project Lifecycle Framework</title>
  <defs>
    <linearGradient id="bg190a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card190" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg190a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">THE PRODUCTION ML PROJECT LIFECYCLE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">From Business Problem Formulation to Continuous Feedback Loops and Governance</text>
  <g transform="translate(40, 85)">
    <rect width="770" height="295" fill="url(#card190)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Stage 1 -->
    <rect x="25" y="40" width="105" height="110" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="77" y="70" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">1. Scoping</text>
    <text x="77" y="95" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">Business ROI</text>
    <text x="77" y="115" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">Metric Framing</text>
    <line x1="130" y1="95" x2="155" y2="95" stroke="#64748b" stroke-width="2"/>
    <!-- Stage 2 -->
    <rect x="155" y="40" width="105" height="110" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="207" y="70" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">2. Data Engine</text>
    <text x="207" y="95" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">Collection</text>
    <text x="207" y="115" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">Labeling &amp; QA</text>
    <line x1="260" y1="95" x2="285" y2="95" stroke="#64748b" stroke-width="2"/>
    <!-- Stage 3 -->
    <rect x="285" y="40" width="105" height="110" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" rx="6"/>
    <text x="337" y="70" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">3. Modeling</text>
    <text x="337" y="95" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">Baselines</text>
    <text x="337" y="115" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">H-Param Tuning</text>
    <line x1="390" y1="95" x2="415" y2="95" stroke="#64748b" stroke-width="2"/>
    <!-- Stage 4 -->
    <rect x="415" y="40" width="105" height="110" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" rx="6"/>
    <text x="467" y="70" fill="#f472b6" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">4. Validation</text>
    <text x="467" y="95" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">Slicing &amp; SHAP</text>
    <text x="467" y="115" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">Model Card</text>
    <line x1="520" y1="95" x2="545" y2="95" stroke="#64748b" stroke-width="2"/>
    <!-- Stage 5 -->
    <rect x="545" y="40" width="105" height="110" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" rx="6"/>
    <text x="597" y="70" fill="#c084fc" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">5. Deployment</text>
    <text x="597" y="95" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">FastAPI / Triton</text>
    <text x="597" y="115" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">Canary Rollout</text>
    <line x1="650" y1="95" x2="675" y2="95" stroke="#64748b" stroke-width="2"/>
    <!-- Stage 6 -->
    <rect x="675" y="40" width="80" height="110" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" rx="6"/>
    <text x="715" y="70" fill="#22d3ee" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">6. Monitor</text>
    <text x="715" y="95" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">PSI Drift</text>
    <text x="715" y="115" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">Alerting</text>
    <!-- Feedback Arc -->
    <path d="M 715 160 Q 400 240 77 160" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="390" y="225" fill="#cbd5e1" font-family="system-ui" font-size="11" text-anchor="middle">Continuous Feedback Loop: Data Flywheel &amp; Automated Retraining Trigger</text>
  </g>
</svg>
