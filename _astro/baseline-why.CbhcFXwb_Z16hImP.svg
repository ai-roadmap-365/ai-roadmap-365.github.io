<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four problems.">
  <title>What baselines solve</title>
  <style>
    .baseline-why-bg   { fill: #f8fafc; }
    .baseline-why-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baseline-why-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baseline-why-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baseline-why-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baseline-why-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baseline-why-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .baseline-why-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .baseline-why-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .baseline-why-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .baseline-why-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .baseline-why-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .baseline-why-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .baseline-why-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .baseline-why-stage { opacity: 1; }

    .baseline-why-s0 { animation-delay: 0.00s; }
    .baseline-why-e0 { animation-delay: 0.00s; }
    .baseline-why-s1 { animation-delay: 1.28s; }
    .baseline-why-e1 { animation-delay: 1.28s; }
    .baseline-why-s2 { animation-delay: 2.56s; }
    .baseline-why-e2 { animation-delay: 2.56s; }
    .baseline-why-s3 { animation-delay: 3.84s; }
    .baseline-why-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .baseline-why-conn  { animation: baseline-why-trace 6.4s ease-in-out infinite; }
      .baseline-why-stage { animation: baseline-why-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes baseline-why-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes baseline-why-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .baseline-why-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .baseline-why-stage { animation: baseline-why-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes baseline-why-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="baseline-why-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="baseline-why-bg" width="980" height="322"/>
  <text class="baseline-why-h1"  x="30" y="40">What baselines solve</text>
  <text class="baseline-why-sub" x="30" y="64">Four problems.</text>
  <g class="baseline-why-stage baseline-why-s0">
    <rect class="baseline-why-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="baseline-why-step" x="44" y="142">01</text>
    <text class="baseline-why-name" x="70" y="142">A score with nothing to compare it to</text>
    <text class="baseline-why-desc" x="44" y="166">Which cannot support a decision.</text>
  </g>
  <line class="baseline-why-line baseline-why-conn baseline-why-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#baseline-why-tip)"/>
  <g class="baseline-why-stage baseline-why-s1">
    <rect class="baseline-why-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="baseline-why-step" x="280" y="142">02</text>
    <text class="baseline-why-name" x="306" y="142">Effort spent on whatever seems interesting</text>
    <text class="baseline-why-desc" x="280" y="166">Rather than on the largest error</text>
    <text class="baseline-why-desc" x="280" y="182">category.</text>
  </g>
  <line class="baseline-why-line baseline-why-conn baseline-why-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#baseline-why-tip)"/>
  <g class="baseline-why-stage baseline-why-s2">
    <rect class="baseline-why-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="baseline-why-step" x="516" y="142">03</text>
    <text class="baseline-why-name" x="542" y="142">Optimisation continuing past the point of return</text>
    <text class="baseline-why-desc" x="516" y="166">With no criterion for stopping.</text>
  </g>
  <line class="baseline-why-line baseline-why-conn baseline-why-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#baseline-why-tip)"/>
  <g class="baseline-why-stage baseline-why-s3">
    <rect class="baseline-why-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="baseline-why-step" x="752" y="142">04</text>
    <text class="baseline-why-name" x="778" y="142">And promises made before the ceiling is known</text>
    <text class="baseline-why-desc" x="752" y="166">Which are then not met.</text>
  </g>
  <text class="baseline-why-sub" x="30" y="304">Each of these is an organisational failure rather than a technical one, which is why the remedy is a practice rather than a method.</text>
</svg>
