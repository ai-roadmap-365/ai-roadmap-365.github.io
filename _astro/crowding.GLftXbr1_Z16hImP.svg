<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The crowding problem</title>
  <style>
    .crowding-bg   { fill: #f8fafc; }
    .crowding-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .crowding-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .crowding-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .crowding-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .crowding-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .crowding-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .crowding-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .crowding-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .crowding-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .crowding-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .crowding-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .crowding-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .crowding-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .crowding-stage { opacity: 1; }

    .crowding-s0 { animation-delay: 0.00s; }
    .crowding-e0 { animation-delay: 0.00s; }
    .crowding-s1 { animation-delay: 1.28s; }
    .crowding-e1 { animation-delay: 1.28s; }
    .crowding-s2 { animation-delay: 2.56s; }
    .crowding-e2 { animation-delay: 2.56s; }
    .crowding-s3 { animation-delay: 3.84s; }
    .crowding-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .crowding-conn  { animation: crowding-trace 6.4s ease-in-out infinite; }
      .crowding-stage { animation: crowding-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes crowding-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes crowding-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .crowding-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .crowding-stage { animation: crowding-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes crowding-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="crowding-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="crowding-bg" width="980" height="322"/>
  <text class="crowding-h1"  x="30" y="40">The crowding problem</text>
  <text class="crowding-sub" x="30" y="64">Four steps.</text>
  <g class="crowding-stage crowding-s0">
    <rect class="crowding-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="crowding-step" x="44" y="142">01</text>
    <text class="crowding-name" x="70" y="142">Two dimensions have far less room than fifty</text>
    <text class="crowding-desc" x="44" y="166">Volume grows exponentially with</text>
    <text class="crowding-desc" x="44" y="182">dimension.</text>
  </g>
  <line class="crowding-line crowding-conn crowding-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#crowding-tip)"/>
  <g class="crowding-stage crowding-s1">
    <rect class="crowding-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="crowding-step" x="280" y="142">02</text>
    <text class="crowding-name" x="306" y="142">So moderately-distant points cannot all be placed correctly</text>
    <text class="crowding-desc" x="280" y="166">They crowd toward the centre.</text>
  </g>
  <line class="crowding-line crowding-conn crowding-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#crowding-tip)"/>
  <g class="crowding-stage crowding-s2">
    <rect class="crowding-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="crowding-step" x="516" y="142">03</text>
    <text class="crowding-name" x="542" y="142">Using a heavy-tailed distribution in two dimensions helps</text>
    <text class="crowding-desc" x="516" y="166">It permits larger distances at</text>
    <text class="crowding-desc" x="516" y="182">the same similarity.</text>
  </g>
  <line class="crowding-line crowding-conn crowding-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#crowding-tip)"/>
  <g class="crowding-stage crowding-s3">
    <rect class="crowding-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="crowding-step" x="752" y="142">04</text>
    <text class="crowding-name" x="778" y="142">Which pushes dissimilar clusters apart</text>
    <text class="crowding-desc" x="752" y="166">And produces the separated blobs</text>
    <text class="crowding-desc" x="752" y="182">these plots show.</text>
  </g>
  <text class="crowding-sub" x="30" y="304">The visually satisfying gaps between clusters are partly an artefact of this correction, which is one reason inter-cluster distances should not be read as meaningful.</text>
</svg>
