<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not.">
  <title>When derivatives help</title>
  <style>
    .deriv-when-bg   { fill: #f8fafc; }
    .deriv-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deriv-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deriv-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deriv-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deriv-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deriv-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .deriv-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .deriv-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .deriv-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .deriv-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .deriv-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .deriv-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .deriv-when-row { opacity: 1; }
    .deriv-when-r0 { animation-delay: 0.00s; }
    .deriv-when-r1 { animation-delay: 0.45s; }
    .deriv-when-r2 { animation-delay: 0.90s; }
    .deriv-when-r3 { animation-delay: 1.35s; }
    .deriv-when-r4 { animation-delay: 1.80s; }
    .deriv-when-row { animation: deriv-when-reveal 7.3s ease-in-out infinite; }
    @keyframes deriv-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="deriv-when-bg" width="980" height="390"/>
  <text class="deriv-when-h1"  x="30" y="40">When derivatives help</text>
  <text class="deriv-when-sub" x="30" y="64">And when not.</text>
  <rect class="deriv-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="deriv-when-name" x="46" y="122">They apply</text>
  <text class="deriv-when-desc" x="46" y="142">Four cases.</text>
  <text class="deriv-when-desc deriv-when-row deriv-when-r0" x="46" y="182">A smooth objective to minimise</text>
  <text class="deriv-when-desc deriv-when-row deriv-when-r1" x="46" y="216">Continuous parameters</text>
  <text class="deriv-when-desc deriv-when-row deriv-when-r2" x="46" y="250">Sensitivity questions</text>
  <text class="deriv-when-desc deriv-when-row deriv-when-r3" x="46" y="284">Gradient-based training</text>
  <text class="deriv-when-desc deriv-when-row deriv-when-r4" x="46" y="318">Where the function can be differentiated</text>
  <rect class="deriv-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="deriv-when-name" x="526" y="122">They do not</text>
  <text class="deriv-when-desc" x="526" y="142">Also four.</text>
  <text class="deriv-when-desc deriv-when-row deriv-when-r0" x="526" y="182">Discrete choices</text>
  <text class="deriv-when-desc deriv-when-row deriv-when-r1" x="526" y="216">Non-smooth objectives with corners</text>
  <text class="deriv-when-desc deriv-when-row deriv-when-r2" x="526" y="250">Black-box functions you cannot differentiate</text>
  <text class="deriv-when-desc deriv-when-row deriv-when-r3" x="526" y="284">Combinatorial search</text>
  <text class="deriv-when-desc deriv-when-row deriv-when-r4" x="526" y="318">Where evaluation itself is very costly</text>
  <text class="deriv-when-sub" x="30" y="372">Discrete choices are the important exclusion, and they are why techniques like tree search and integer programming exist alongside gradient methods.</text>
</svg>
