<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each caught by a different signal.">
  <title>Three problems, zero errors</title>
  <style>
    .three-hidden-problems-bg   { fill: #f8fafc; }
    .three-hidden-problems-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-hidden-problems-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-hidden-problems-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-hidden-problems-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-hidden-problems-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-hidden-problems-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-hidden-problems-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-hidden-problems-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-hidden-problems-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-hidden-problems-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-hidden-problems-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-hidden-problems-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .three-hidden-problems-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .three-hidden-problems-stage { opacity: 1; }

    .three-hidden-problems-s0 { animation-delay: 0.00s; }
    .three-hidden-problems-e0 { animation-delay: 0.00s; }
    .three-hidden-problems-s1 { animation-delay: 1.28s; }
    .three-hidden-problems-e1 { animation-delay: 1.28s; }
    .three-hidden-problems-s2 { animation-delay: 2.56s; }
    .three-hidden-problems-e2 { animation-delay: 2.56s; }
    .three-hidden-problems-s3 { animation-delay: 3.84s; }
    .three-hidden-problems-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .three-hidden-problems-conn  { animation: three-hidden-problems-trace 6.4s ease-in-out infinite; }
      .three-hidden-problems-stage { animation: three-hidden-problems-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes three-hidden-problems-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes three-hidden-problems-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .three-hidden-problems-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .three-hidden-problems-stage { animation: three-hidden-problems-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes three-hidden-problems-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="three-hidden-problems-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="three-hidden-problems-bg" width="980" height="322"/>
  <text class="three-hidden-problems-h1"  x="30" y="40">Three problems, zero errors</text>
  <text class="three-hidden-problems-sub" x="30" y="64">Each caught by a different signal.</text>
  <g class="three-hidden-problems-stage three-hidden-problems-s0">
    <rect class="three-hidden-problems-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="three-hidden-problems-step" x="44" y="142">01</text>
    <text class="three-hidden-problems-name" x="70" y="142">Window 3: p95 of 8,573 ms</text>
    <text class="three-hidden-problems-desc" x="44" y="166">Latency SLO of 4,000 ms</text>
    <text class="three-hidden-problems-desc" x="44" y="182">breached. Errors still zero.</text>
    <text class="three-hidden-problems-edge" x="44" y="242">latency</text>
  </g>
  <line class="three-hidden-problems-line three-hidden-problems-conn three-hidden-problems-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#three-hidden-problems-tip)"/>
  <g class="three-hidden-problems-stage three-hidden-problems-s1">
    <rect class="three-hidden-problems-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="three-hidden-problems-step" x="280" y="142">02</text>
    <text class="three-hidden-problems-name" x="306" y="142">Window 4: 40% ungrounded</text>
    <text class="three-hidden-problems-desc" x="280" y="166">Latency fine, errors zero, spend</text>
    <text class="three-hidden-problems-desc" x="280" y="182">normal. Half the users got</text>
    <text class="three-hidden-problems-desc" x="280" y="198">invented text.</text>
    <text class="three-hidden-problems-edge" x="280" y="242">quality</text>
  </g>
  <line class="three-hidden-problems-line three-hidden-problems-conn three-hidden-problems-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#three-hidden-problems-tip)"/>
  <g class="three-hidden-problems-stage three-hidden-problems-s2">
    <rect class="three-hidden-problems-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="three-hidden-problems-step" x="516" y="142">03</text>
    <text class="three-hidden-problems-name" x="542" y="142">Window 5: $0.40 spend</text>
    <text class="three-hidden-problems-desc" x="516" y="166">13.3x the $0.03 baseline. Not</text>
    <text class="three-hidden-problems-desc" x="516" y="182">obviously wrong in isolation.</text>
    <text class="three-hidden-problems-edge" x="516" y="242">cost</text>
  </g>
  <line class="three-hidden-problems-line three-hidden-problems-conn three-hidden-problems-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#three-hidden-problems-tip)"/>
  <g class="three-hidden-problems-stage three-hidden-problems-s3">
    <rect class="three-hidden-problems-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="three-hidden-problems-step" x="752" y="142">04</text>
    <text class="three-hidden-problems-name" x="778" y="142">Error rate: 0% throughout</text>
    <text class="three-hidden-problems-desc" x="752" y="166">Not one of the three would have</text>
    <text class="three-hidden-problems-desc" x="752" y="182">been noticed by availability</text>
    <text class="three-hidden-problems-desc" x="752" y="198">monitoring.</text>
    <text class="three-hidden-problems-edge" x="752" y="242">the point</text>
  </g>
  <text class="three-hidden-problems-sub" x="30" y="304">The fourth window is the one to sit with: every conventional dashboard was green while the system returned fluent, ungrounded text to two out of five users, and nothing in the availability signal could have said so.</text>
</svg>
