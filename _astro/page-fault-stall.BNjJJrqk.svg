<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A machine that is swapping feels broken rather than slow, and this is why.">
  <title>What happens when RAM runs out</title>
  <style>
    .page-fault-stall-bg   { fill: #f8fafc; }
    .page-fault-stall-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .page-fault-stall-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .page-fault-stall-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .page-fault-stall-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .page-fault-stall-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .page-fault-stall-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .page-fault-stall-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .page-fault-stall-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .page-fault-stall-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .page-fault-stall-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .page-fault-stall-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .page-fault-stall-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .page-fault-stall-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .page-fault-stall-stage { opacity: 1; }

    .page-fault-stall-s0 { animation-delay: 0.00s; }
    .page-fault-stall-e0 { animation-delay: 0.00s; }
    .page-fault-stall-s1 { animation-delay: 1.28s; }
    .page-fault-stall-e1 { animation-delay: 1.28s; }
    .page-fault-stall-s2 { animation-delay: 2.56s; }
    .page-fault-stall-e2 { animation-delay: 2.56s; }
    .page-fault-stall-s3 { animation-delay: 3.84s; }
    .page-fault-stall-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .page-fault-stall-conn  { animation: page-fault-stall-trace 6.4s ease-in-out infinite; }
      .page-fault-stall-stage { animation: page-fault-stall-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes page-fault-stall-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes page-fault-stall-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .page-fault-stall-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .page-fault-stall-stage { animation: page-fault-stall-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes page-fault-stall-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="page-fault-stall-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="page-fault-stall-bg" width="980" height="322"/>
  <text class="page-fault-stall-h1"  x="30" y="40">What happens when RAM runs out</text>
  <text class="page-fault-stall-sub" x="30" y="64">A machine that is swapping feels broken rather than slow, and this is why.</text>
  <g class="page-fault-stall-stage page-fault-stall-s0">
    <rect class="page-fault-stall-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="page-fault-stall-step" x="44" y="142">01</text>
    <text class="page-fault-stall-name" x="70" y="142">RAM fills</text>
    <text class="page-fault-stall-desc" x="44" y="166">More is wanted than the machine</text>
    <text class="page-fault-stall-desc" x="44" y="182">has.</text>
    <text class="page-fault-stall-edge" x="44" y="242">pressure</text>
  </g>
  <line class="page-fault-stall-line page-fault-stall-conn page-fault-stall-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#page-fault-stall-tip)"/>
  <g class="page-fault-stall-stage page-fault-stall-s1">
    <rect class="page-fault-stall-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="page-fault-stall-step" x="280" y="142">02</text>
    <text class="page-fault-stall-name" x="306" y="142">Evict to disk</text>
    <text class="page-fault-stall-desc" x="280" y="166">Least-recently-used pages are</text>
    <text class="page-fault-stall-desc" x="280" y="182">written out.</text>
    <text class="page-fault-stall-edge" x="280" y="242">swap</text>
  </g>
  <line class="page-fault-stall-line page-fault-stall-conn page-fault-stall-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#page-fault-stall-tip)"/>
  <g class="page-fault-stall-stage page-fault-stall-s2">
    <rect class="page-fault-stall-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="page-fault-stall-step" x="516" y="142">03</text>
    <text class="page-fault-stall-name" x="542" y="142">Touch the page</text>
    <text class="page-fault-stall-desc" x="516" y="166">The program reads an address</text>
    <text class="page-fault-stall-desc" x="516" y="182">that is no longer resident.</text>
    <text class="page-fault-stall-edge" x="516" y="242">page fault</text>
  </g>
  <line class="page-fault-stall-line page-fault-stall-conn page-fault-stall-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#page-fault-stall-tip)"/>
  <g class="page-fault-stall-stage page-fault-stall-s3">
    <rect class="page-fault-stall-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="page-fault-stall-step" x="752" y="142">04</text>
    <text class="page-fault-stall-name" x="778" y="142">Stall</text>
    <text class="page-fault-stall-desc" x="752" y="166">Everything waits for an SSD</text>
    <text class="page-fault-stall-desc" x="752" y="182">access to bring it back.</text>
    <text class="page-fault-stall-edge" x="752" y="242">~1000x a RAM read</text>
  </g>
  <text class="page-fault-stall-sub" x="30" y="304">The program did nothing wrong. It touched a variable, and paid a thousandfold for it.</text>
</svg>
