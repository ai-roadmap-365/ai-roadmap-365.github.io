<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%" role="img" aria-label="Cheapest Today, Expensive Tomorrow showing serverless and a VM crossing over at forty-five times launch traffic">
  <title>Cheapest Today, Expensive Tomorrow</title>
  <defs>
    <style>
      .d334b-bg { fill: #f8fafc; }
      .d334b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; }
      .d334b-srv { stroke: #3b82f6; stroke-width: 3px; fill: none; }
      .d334b-vm { stroke: #f59e0b; stroke-width: 3px; fill: none; }
      .d334b-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d334b-h { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .d334b-t { font-family: system-ui, sans-serif; font-size: 13px; fill: #334155; }
      .d334b-s { font-family: system-ui, sans-serif; font-size: 12px; fill: #64748b; }
      .d334b-ax { stroke: #94a3b8; stroke-width: 1.5px; }
      .d334b-dash { stroke: #ef4444; stroke-width: 2px; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect class="d334b-bg" width="900" height="420" />
  <text class="d334b-title" x="30" y="36">Cheapest Today, Expensive Tomorrow</text>
  <text class="d334b-s" x="30" y="58">Monthly cost against traffic. Measured by the day 334 lab.</text>

  <line class="d334b-ax" x1="120" y1="280" x2="850" y2="280" />
  <line class="d334b-ax" x1="120" y1="80" x2="120" y2="280" />
  <text class="d334b-s" x="104" y="90">$</text>
  <text class="d334b-s" x="112" y="300">1x</text>
  <text class="d334b-s" x="380" y="300">45x</text>
  <text class="d334b-s" x="600" y="300">200x</text>
  <text class="d334b-s" x="800" y="300">1000x</text>

  <path class="d334b-srv" d="M120 276 L400 210 L620 150 L840 92" />
  <path class="d334b-vm" d="M120 214 L400 210 L620 196 L840 172" />

  <line class="d334b-dash" x1="400" y1="80" x2="400" y2="280" />
  <text class="d334b-s" x="408" y="76" fill="#7f1d1d">crossover — 899,599 requests/month</text>

  <text class="d334b-s" x="856" y="92" fill="#1d4ed8">serverless</text>
  <text class="d334b-s" x="856" y="176" fill="#b45309">small-vm</text>

  <rect class="d334b-card" x="30" y="322" width="270" height="76" rx="8" />
  <text class="d334b-h" x="48" y="348">At launch</text>
  <text class="d334b-t" x="48" y="372">serverless $0.00</text>
  <text class="d334b-t" x="48" y="390">small-vm  $7.79</text>

  <rect class="d334b-card" x="315" y="322" width="270" height="76" rx="8" />
  <text class="d334b-h" x="333" y="348">At the crossover</text>
  <text class="d334b-t" x="333" y="372">serverless $8.66</text>
  <text class="d334b-t" x="333" y="390">small-vm  $8.67</text>

  <rect class="d334b-card" x="600" y="322" width="270" height="76" rx="8" />
  <text class="d334b-h" x="618" y="348">At 1000x</text>
  <text class="d334b-t" x="618" y="372">serverless $295.88</text>
  <text class="d334b-t" x="618" y="390">small-vm   $90.77</text>
</svg>
