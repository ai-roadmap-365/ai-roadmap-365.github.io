<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="cron is universal. It is rarely the best remaining option.">
  <title>cron, and what replaced it</title>
  <style>
    .cron-alternatives-bg   { fill: #f8fafc; }
    .cron-alternatives-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cron-alternatives-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cron-alternatives-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cron-alternatives-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cron-alternatives-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cron-alternatives-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cron-alternatives-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cron-alternatives-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cron-alternatives-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cron-alternatives-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cron-alternatives-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cron-alternatives-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cron-alternatives-row { opacity: 1; }
    .cron-alternatives-r0 { animation-delay: 0.00s; }
    .cron-alternatives-r1 { animation-delay: 0.45s; }
    .cron-alternatives-r2 { animation-delay: 0.90s; }
    .cron-alternatives-r3 { animation-delay: 1.35s; }
    .cron-alternatives-r4 { animation-delay: 1.80s; }
    .cron-alternatives-row { animation: cron-alternatives-reveal 7.3s ease-in-out infinite; }
    @keyframes cron-alternatives-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cron-alternatives-bg" width="980" height="390"/>
  <text class="cron-alternatives-h1"  x="30" y="40">cron, and what replaced it</text>
  <text class="cron-alternatives-sub" x="30" y="64">cron is universal. It is rarely the best remaining option.</text>
  <rect class="cron-alternatives-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cron-alternatives-name" x="46" y="122">cron</text>
  <text class="cron-alternatives-desc" x="46" y="142">Everywhere, and unchanged since 1975.</text>
  <text class="cron-alternatives-desc cron-alternatives-row cron-alternatives-r0" x="46" y="182">Present on every Unix machine</text>
  <text class="cron-alternatives-desc cron-alternatives-row cron-alternatives-r1" x="46" y="216">A missed run is simply missed</text>
  <text class="cron-alternatives-desc cron-alternatives-row cron-alternatives-r2" x="46" y="250">No logging unless you add it</text>
  <text class="cron-alternatives-desc cron-alternatives-row cron-alternatives-r3" x="46" y="284">No concept of one job needing another</text>
  <text class="cron-alternatives-desc cron-alternatives-row cron-alternatives-r4" x="46" y="318">No retry, no alerting, no history</text>
  <rect class="cron-alternatives-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cron-alternatives-name" x="526" y="122">systemd timers / launchd</text>
  <text class="cron-alternatives-desc" x="526" y="142">The platform-native replacements.</text>
  <text class="cron-alternatives-desc cron-alternatives-row cron-alternatives-r0" x="526" y="182">Linux and macOS respectively</text>
  <text class="cron-alternatives-desc cron-alternatives-row cron-alternatives-r1" x="526" y="216">Can catch up a run missed while asleep</text>
  <text class="cron-alternatives-desc cron-alternatives-row cron-alternatives-r2" x="526" y="250">Output captured to the system journal</text>
  <text class="cron-alternatives-desc cron-alternatives-row cron-alternatives-r3" x="526" y="284">Real dependency ordering between units</text>
  <text class="cron-alternatives-desc cron-alternatives-row cron-alternatives-r4" x="526" y="318">Status, history and restart policies</text>
  <text class="cron-alternatives-sub" x="30" y="372">For anything beyond one machine, the answer changes again: a workflow orchestrator, or your CI system's scheduled pipelines.</text>
</svg>
