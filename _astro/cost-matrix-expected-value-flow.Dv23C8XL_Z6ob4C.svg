<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <title>Cost Matrix Expected Value Flow</title>
  <style>
    .bg { fill: var(--bg-surface, #0f172a); }
    .box { fill: var(--bg-subtle, #1e293b); stroke: var(--border-subtle, #334155); stroke-width: 2; rx: 8; }
    .box-hi { fill: var(--accent-subtle, #1e1b4b); stroke: var(--accent, #6366f1); stroke-width: 2; rx: 8; }
    .cost-fn { fill: #7f1d1d; stroke: #ef4444; stroke-width: 2; rx: 6; }
    .cost-fp { fill: #78350f; stroke: #f59e0b; stroke-width: 2; rx: 6; }
    .cost-ok { fill: #064e3b; stroke: #10b981; stroke-width: 2; rx: 6; }
    .text-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: var(--text-primary, #f8fafc); text-anchor: middle; }
    .text-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: var(--text-secondary, #94a3b8); text-anchor: middle; }
    .text-head { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: var(--text-primary, #f8fafc); text-anchor: middle; }
    .wire { stroke: var(--border-subtle, #475569); stroke-width: 2; fill: none; }
    .wire-active { stroke: var(--accent, #6366f1); stroke-width: 2; fill: none; stroke-dasharray: 6; animation: dash 2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -12; } }
    @media (prefers-reduced-motion: reduce) {
      .wire-active { animation: none !important; stroke-dasharray: none; }
    }
  </style>

  <rect width="900" height="500" class="bg" rx="12" />

  <text x="450" y="40" class="text-head">Expected Financial Cost Optimization Loop</text>
  <text x="450" y="65" class="text-sub">Mapping Model Probabilities through a Financial Cost Matrix to Find Threshold T*</text>

  <!-- Probabilities -->
  <rect x="50" y="110" width="220" height="150" class="box-hi" />
  <text x="160" y="140" class="text-title">Predicted Probabilities</text>
  <text x="160" y="165" class="text-sub">p_i = P(Y=1 | x_i)</text>
  <text x="160" y="195" class="text-sub">Threshold Sweep: T in [0, 1]</text>
  <text x="160" y="225" class="text-sub">Decision: y_hat = [p_i &gt;= T]</text>

  <!-- Flow to Confusion Matrix -->
  <path d="M 270 185 L 350 185" class="wire-active" />

  <!-- Confusion Matrix with Costs -->
  <rect x="350" y="100" width="260" height="260" class="box" />
  <text x="480" y="125" class="text-title">Cost-Weighted Confusion Matrix</text>

  <!-- TP -->
  <rect x="370" y="145" width="105" height="90" class="cost-ok" />
  <text x="422" y="180" class="text-title">TP</text>
  <text x="422" y="205" class="text-sub">Cost: $0</text>

  <!-- FP -->
  <rect x="485" y="145" width="105" height="90" class="cost-fp" />
  <text x="537" y="180" class="text-title">FP</text>
  <text x="537" y="205" class="text-sub">Cost: $50</text>

  <!-- FN -->
  <rect x="370" y="245" width="105" height="90" class="cost-fn" />
  <text x="422" y="280" class="text-title">FN (Fraud Missed)</text>
  <text x="422" y="305" class="text-sub">Cost: $500</text>

  <!-- TN -->
  <rect x="485" y="245" width="105" height="90" class="cost-ok" />
  <text x="537" y="280" class="text-title">TN</text>
  <text x="537" y="305" class="text-sub">Cost: $0</text>

  <!-- Flow to Expected Value -->
  <path d="M 610 230 L 680 230" class="wire-active" />

  <!-- Expected Cost Engine -->
  <rect x="680" y="110" width="180" height="150" class="box-hi" />
  <text x="770" y="140" class="text-title">Expected Cost</text>
  <text x="770" y="170" class="text-sub">Total = 50*FP + 500*FN</text>
  <text x="770" y="210" class="text-title" fill="#10b981">Optimal T* = 0.22</text>
  <text x="770" y="235" class="text-sub">Minimizes Loss</text>

  <!-- Bottom explanation -->
  <rect x="150" y="400" width="600" height="65" class="box" />
  <text x="450" y="425" class="text-title">The Business Invariant: Standard 0.50 Threshold is Rarely Cost-Optimal</text>
  <text x="450" y="445" class="text-sub">Asymmetric real-world error costs demand tuning decision thresholds directly against business profit/loss.</text>
</svg>
