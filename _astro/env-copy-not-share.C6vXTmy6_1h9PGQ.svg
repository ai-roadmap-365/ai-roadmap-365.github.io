<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 356" role="img"
     aria-label="Which is why a script cannot change your shell's directory.">
  <title>Children inherit a copy, not a connection</title>
  <style>
    .env-copy-not-share-bg   { fill: #f8fafc; }
    .env-copy-not-share-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .env-copy-not-share-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .env-copy-not-share-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .env-copy-not-share-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .env-copy-not-share-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .env-copy-not-share-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .env-copy-not-share-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .env-copy-not-share-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .env-copy-not-share-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .env-copy-not-share-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .env-copy-not-share-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .env-copy-not-share-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .env-copy-not-share-row { opacity: 1; }
    .env-copy-not-share-r0 { animation-delay: 0.00s; }
    .env-copy-not-share-r1 { animation-delay: 0.45s; }
    .env-copy-not-share-r2 { animation-delay: 0.90s; }
    .env-copy-not-share-r3 { animation-delay: 1.35s; }
    .env-copy-not-share-row { animation: env-copy-not-share-reveal 6.8s ease-in-out infinite; }
    @keyframes env-copy-not-share-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="env-copy-not-share-bg" width="980" height="356"/>
  <text class="env-copy-not-share-h1"  x="30" y="40">Children inherit a copy, not a connection</text>
  <text class="env-copy-not-share-sub" x="30" y="64">Which is why a script cannot change your shell's directory.</text>
  <rect class="env-copy-not-share-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="env-copy-not-share-name" x="46" y="122">Downward, at start</text>
  <text class="env-copy-not-share-desc" x="46" y="142">The child gets a snapshot.</text>
  <text class="env-copy-not-share-desc env-copy-not-share-row env-copy-not-share-r0" x="46" y="182">Copied when the process is created</text>
  <text class="env-copy-not-share-desc env-copy-not-share-row env-copy-not-share-r1" x="46" y="216">Every descendant inherits it too</text>
  <text class="env-copy-not-share-desc env-copy-not-share-row env-copy-not-share-r2" x="46" y="250">Changing the parent later does not update children</text>
  <text class="env-copy-not-share-desc env-copy-not-share-row env-copy-not-share-r3" x="46" y="284">This is how configuration reaches programs</text>
  <rect class="env-copy-not-share-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="env-copy-not-share-name" x="526" y="122">Never upward</text>
  <text class="env-copy-not-share-desc" x="526" y="142">The parent learns nothing.</text>
  <text class="env-copy-not-share-desc env-copy-not-share-row env-copy-not-share-r0" x="526" y="182">A child's export dies with the child</text>
  <text class="env-copy-not-share-desc env-copy-not-share-row env-copy-not-share-r1" x="526" y="216">A script cannot cd your shell</text>
  <text class="env-copy-not-share-desc env-copy-not-share-row env-copy-not-share-r2" x="526" y="250">A script cannot set your PATH</text>
  <text class="env-copy-not-share-desc env-copy-not-share-row env-copy-not-share-r3" x="526" y="284">Which is why you source a script instead of running it</text>
  <text class="env-copy-not-share-sub" x="30" y="338">source runs the file in your CURRENT shell rather than a child, which is exactly why config files are sourced and not executed.</text>
</svg>
