<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Sampling measures pressure on a clock; bit depth decides how precisely.">
  <title>Turning a sound wave into numbers</title>
  <style>
    .audio-sampling-bg   { fill: #f8fafc; }
    .audio-sampling-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .audio-sampling-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .audio-sampling-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .audio-sampling-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .audio-sampling-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .audio-sampling-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .audio-sampling-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .audio-sampling-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .audio-sampling-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .audio-sampling-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .audio-sampling-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .audio-sampling-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .audio-sampling-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .audio-sampling-stage { opacity: 1; }

    .audio-sampling-s0 { animation-delay: 0.00s; }
    .audio-sampling-e0 { animation-delay: 0.00s; }
    .audio-sampling-s1 { animation-delay: 1.28s; }
    .audio-sampling-e1 { animation-delay: 1.28s; }
    .audio-sampling-s2 { animation-delay: 2.56s; }
    .audio-sampling-e2 { animation-delay: 2.56s; }
    .audio-sampling-s3 { animation-delay: 3.84s; }
    .audio-sampling-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .audio-sampling-conn  { animation: audio-sampling-trace 6.4s ease-in-out infinite; }
      .audio-sampling-stage { animation: audio-sampling-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes audio-sampling-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes audio-sampling-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .audio-sampling-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .audio-sampling-stage { animation: audio-sampling-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes audio-sampling-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="audio-sampling-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="audio-sampling-bg" width="980" height="322"/>
  <text class="audio-sampling-h1"  x="30" y="40">Turning a sound wave into numbers</text>
  <text class="audio-sampling-sub" x="30" y="64">Sampling measures pressure on a clock; bit depth decides how precisely.</text>
  <g class="audio-sampling-stage audio-sampling-s0">
    <rect class="audio-sampling-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="audio-sampling-step" x="44" y="142">01</text>
    <text class="audio-sampling-name" x="70" y="142">A pressure wave</text>
    <text class="audio-sampling-desc" x="44" y="166">Continuous. Infinitely detailed.</text>
    <text class="audio-sampling-desc" x="44" y="182">Not storable as it is.</text>
  </g>
  <line class="audio-sampling-line audio-sampling-conn audio-sampling-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#audio-sampling-tip)"/>
  <g class="audio-sampling-stage audio-sampling-s1">
    <rect class="audio-sampling-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="audio-sampling-step" x="280" y="142">02</text>
    <text class="audio-sampling-name" x="306" y="142">Sample the clock</text>
    <text class="audio-sampling-desc" x="280" y="166">Measure 44,100 times per second.</text>
    <text class="audio-sampling-edge" x="280" y="242">44.1 kHz</text>
  </g>
  <line class="audio-sampling-line audio-sampling-conn audio-sampling-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#audio-sampling-tip)"/>
  <g class="audio-sampling-stage audio-sampling-s2">
    <rect class="audio-sampling-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="audio-sampling-step" x="516" y="142">03</text>
    <text class="audio-sampling-name" x="542" y="142">Round each measurement</text>
    <text class="audio-sampling-desc" x="516" y="166">16 bits gives 65,536 possible</text>
    <text class="audio-sampling-desc" x="516" y="182">levels.</text>
    <text class="audio-sampling-edge" x="516" y="242">2 bytes</text>
  </g>
  <line class="audio-sampling-line audio-sampling-conn audio-sampling-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#audio-sampling-tip)"/>
  <g class="audio-sampling-stage audio-sampling-s3">
    <rect class="audio-sampling-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="audio-sampling-step" x="752" y="142">04</text>
    <text class="audio-sampling-name" x="778" y="142">Store the run of numbers</text>
    <text class="audio-sampling-desc" x="752" y="166">Stereo doubles it. One minute of</text>
    <text class="audio-sampling-desc" x="752" y="182">CD audio.</text>
    <text class="audio-sampling-edge" x="752" y="242">10.6 MB</text>
  </g>
  <text class="audio-sampling-sub" x="30" y="304">Sample rate must exceed twice the highest frequency you want to keep — the Nyquist limit, and why 44,100 was chosen for hearing that stops near 20 kHz.</text>
</svg>
