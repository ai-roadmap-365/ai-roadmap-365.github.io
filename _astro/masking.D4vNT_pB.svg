<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Set scores to negative infinity.">
  <title>Two masks, one mechanism</title>
  <style>
    .masking-bg   { fill: #f8fafc; }
    .masking-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .masking-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .masking-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .masking-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .masking-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .masking-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .masking-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .masking-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .masking-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .masking-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .masking-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .masking-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .masking-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .masking-stage { opacity: 1; }

    .masking-s0 { animation-delay: 0.00s; }
    .masking-e0 { animation-delay: 0.00s; }
    .masking-s1 { animation-delay: 1.28s; }
    .masking-e1 { animation-delay: 1.28s; }
    .masking-s2 { animation-delay: 2.56s; }
    .masking-e2 { animation-delay: 2.56s; }
    .masking-s3 { animation-delay: 3.84s; }
    .masking-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .masking-conn  { animation: masking-trace 6.4s ease-in-out infinite; }
      .masking-stage { animation: masking-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes masking-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes masking-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .masking-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .masking-stage { animation: masking-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes masking-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="masking-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="masking-bg" width="980" height="322"/>
  <text class="masking-h1"  x="30" y="40">Two masks, one mechanism</text>
  <text class="masking-sub" x="30" y="64">Set scores to negative infinity.</text>
  <g class="masking-stage masking-s0">
    <rect class="masking-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="masking-step" x="44" y="142">01</text>
    <text class="masking-name" x="70" y="142">Padding mask</text>
    <text class="masking-desc" x="44" y="166">Positions that are not real</text>
    <text class="masking-desc" x="44" y="182">text. Set their scores to</text>
    <text class="masking-desc" x="44" y="198">negative infinity.</text>
  </g>
  <line class="masking-line masking-conn masking-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#masking-tip)"/>
  <g class="masking-stage masking-s1">
    <rect class="masking-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="masking-step" x="280" y="142">02</text>
    <text class="masking-name" x="306" y="142">Which softmax maps to zero</text>
    <text class="masking-desc" x="280" y="166">So no attention weight reaches</text>
    <text class="masking-desc" x="280" y="182">them at all.</text>
    <text class="masking-edge" x="280" y="242">clean</text>
  </g>
  <line class="masking-line masking-conn masking-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#masking-tip)"/>
  <g class="masking-stage masking-s2">
    <rect class="masking-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="masking-step" x="516" y="142">03</text>
    <text class="masking-name" x="542" y="142">Causal mask</text>
    <text class="masking-desc" x="516" y="166">Every position after the current</text>
    <text class="masking-desc" x="516" y="182">one, masked the same way.</text>
  </g>
  <line class="masking-line masking-conn masking-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#masking-tip)"/>
  <g class="masking-stage masking-s3">
    <rect class="masking-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="masking-step" x="752" y="142">04</text>
    <text class="masking-name" x="778" y="142">Which is the whole difference between encoder and decoder</text>
    <text class="masking-desc" x="752" y="166">One triangular mask.</text>
  </g>
  <text class="masking-sub" x="30" y="304">The last point is worth dwelling on: an encoder and a decoder differ by a mask rather than by architecture, which is why the same implementation serves both.</text>
</svg>
