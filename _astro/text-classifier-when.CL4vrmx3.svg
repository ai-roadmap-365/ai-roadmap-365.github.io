<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Latency and length decide.">
  <title>Choosing a text classifier</title>
  <style>
    .text-classifier-when-bg   { fill: #f8fafc; }
    .text-classifier-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .text-classifier-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .text-classifier-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .text-classifier-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .text-classifier-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .text-classifier-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .text-classifier-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .text-classifier-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .text-classifier-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .text-classifier-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .text-classifier-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .text-classifier-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .text-classifier-when-row { opacity: 1; }
    .text-classifier-when-r0 { animation-delay: 0.00s; }
    .text-classifier-when-r1 { animation-delay: 0.45s; }
    .text-classifier-when-r2 { animation-delay: 0.90s; }
    .text-classifier-when-r3 { animation-delay: 1.35s; }
    .text-classifier-when-r4 { animation-delay: 1.80s; }
    .text-classifier-when-row { animation: text-classifier-when-reveal 7.3s ease-in-out infinite; }
    @keyframes text-classifier-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="text-classifier-when-bg" width="980" height="390"/>
  <text class="text-classifier-when-h1"  x="30" y="40">Choosing a text classifier</text>
  <text class="text-classifier-when-sub" x="30" y="64">Latency and length decide.</text>
  <rect class="text-classifier-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="text-classifier-when-name" x="46" y="122">Lightweight</text>
  <text class="text-classifier-when-desc" x="46" y="142">Sub-millisecond, at scale.</text>
  <text class="text-classifier-when-desc text-classifier-when-row text-classifier-when-r0" x="46" y="182">Millions of daily queries</text>
  <text class="text-classifier-when-desc text-classifier-when-row text-classifier-when-r1" x="46" y="216">Latency budgets under a few milliseconds</text>
  <text class="text-classifier-when-desc text-classifier-when-row text-classifier-when-r2" x="46" y="250">CPU-only serving</text>
  <text class="text-classifier-when-desc text-classifier-when-row text-classifier-when-r3" x="46" y="284">Short texts and clear categories</text>
  <text class="text-classifier-when-desc text-classifier-when-row text-classifier-when-r4" x="46" y="318">Trains in minutes</text>
  <rect class="text-classifier-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="text-classifier-when-name" x="526" y="122">A transformer</text>
  <text class="text-classifier-when-desc" x="526" y="142">Where nuance matters.</text>
  <text class="text-classifier-when-desc text-classifier-when-row text-classifier-when-r0" x="526" y="182">Multi-paragraph documents</text>
  <text class="text-classifier-when-desc text-classifier-when-row text-classifier-when-r1" x="526" y="216">Ambiguity and sarcasm</text>
  <text class="text-classifier-when-desc text-classifier-when-row text-classifier-when-r2" x="526" y="250">Question answering or reasoning</text>
  <text class="text-classifier-when-desc text-classifier-when-row text-classifier-when-r3" x="526" y="284">Where accuracy justifies the cost</text>
  <text class="text-classifier-when-desc text-classifier-when-row text-classifier-when-r4" x="526" y="318">Orders of magnitude more compute</text>
  <text class="text-classifier-when-sub" x="30" y="372">The left-hand column is chosen far less often than it should be: for high-volume routing and filtering, a model that runs in a fifth of a millisecond on a CPU is frequently the correct engineering answer.</text>
</svg>
