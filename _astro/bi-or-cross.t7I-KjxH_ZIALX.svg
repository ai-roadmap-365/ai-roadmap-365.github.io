<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Scalable, or accurate.">
  <title>Bi-encoder, or cross-encoder</title>
  <style>
    .bi-or-cross-bg   { fill: #f8fafc; }
    .bi-or-cross-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bi-or-cross-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bi-or-cross-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bi-or-cross-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bi-or-cross-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bi-or-cross-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bi-or-cross-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bi-or-cross-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bi-or-cross-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bi-or-cross-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bi-or-cross-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bi-or-cross-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bi-or-cross-row { opacity: 1; }
    .bi-or-cross-r0 { animation-delay: 0.00s; }
    .bi-or-cross-r1 { animation-delay: 0.45s; }
    .bi-or-cross-r2 { animation-delay: 0.90s; }
    .bi-or-cross-r3 { animation-delay: 1.35s; }
    .bi-or-cross-r4 { animation-delay: 1.80s; }
    .bi-or-cross-row { animation: bi-or-cross-reveal 7.3s ease-in-out infinite; }
    @keyframes bi-or-cross-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="bi-or-cross-bg" width="980" height="390"/>
  <text class="bi-or-cross-h1"  x="30" y="40">Bi-encoder, or cross-encoder</text>
  <text class="bi-or-cross-sub" x="30" y="64">Scalable, or accurate.</text>
  <rect class="bi-or-cross-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="bi-or-cross-name" x="46" y="122">Bi-encoder</text>
  <text class="bi-or-cross-desc" x="46" y="142">Encode independently.</text>
  <text class="bi-or-cross-desc bi-or-cross-row bi-or-cross-r0" x="46" y="182">Query and document embedded separately</text>
  <text class="bi-or-cross-desc bi-or-cross-row bi-or-cross-r1" x="46" y="216">Documents embedded once, offline</text>
  <text class="bi-or-cross-desc bi-or-cross-row bi-or-cross-r2" x="46" y="250">Search is a vector similarity lookup</text>
  <text class="bi-or-cross-desc bi-or-cross-row bi-or-cross-r3" x="46" y="284">Scales to millions of documents</text>
  <text class="bi-or-cross-desc bi-or-cross-row bi-or-cross-r4" x="46" y="318">Less accurate — no interaction between them</text>
  <rect class="bi-or-cross-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="bi-or-cross-name" x="526" y="122">Cross-encoder</text>
  <text class="bi-or-cross-desc" x="526" y="142">Encode together.</text>
  <text class="bi-or-cross-desc bi-or-cross-row bi-or-cross-r0" x="526" y="182">Query and document read as one input</text>
  <text class="bi-or-cross-desc bi-or-cross-row bi-or-cross-r1" x="526" y="216">Full attention between them</text>
  <text class="bi-or-cross-desc bi-or-cross-row bi-or-cross-r2" x="526" y="250">Substantially more accurate</text>
  <text class="bi-or-cross-desc bi-or-cross-row bi-or-cross-r3" x="526" y="284">One forward pass per candidate</text>
  <text class="bi-or-cross-desc bi-or-cross-row bi-or-cross-r4" x="526" y="318">Only viable on a shortlist</text>
  <text class="bi-or-cross-sub" x="30" y="372">Using both is the standard arrangement: a bi-encoder retrieves a few dozen candidates from millions, and a cross-encoder reranks that shortlist properly.</text>
</svg>
