<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>Slicing</title>
  <style>
    .slicing-bg   { fill: #f8fafc; }
    .slicing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .slicing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .slicing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .slicing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .slicing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .slicing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .slicing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .slicing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .slicing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .slicing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .slicing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .slicing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .slicing-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .slicing-stage { opacity: 1; }

    .slicing-s0 { animation-delay: 0.00s; }
    .slicing-e0 { animation-delay: 0.00s; }
    .slicing-s1 { animation-delay: 1.28s; }
    .slicing-e1 { animation-delay: 1.28s; }
    .slicing-s2 { animation-delay: 2.56s; }
    .slicing-e2 { animation-delay: 2.56s; }
    .slicing-s3 { animation-delay: 3.84s; }
    .slicing-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .slicing-conn  { animation: slicing-trace 6.4s ease-in-out infinite; }
      .slicing-stage { animation: slicing-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes slicing-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes slicing-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .slicing-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .slicing-stage { animation: slicing-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes slicing-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="slicing-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="slicing-bg" width="980" height="322"/>
  <text class="slicing-h1"  x="30" y="40">Slicing</text>
  <text class="slicing-sub" x="30" y="64">Four properties.</text>
  <g class="slicing-stage slicing-s0">
    <rect class="slicing-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="slicing-step" x="44" y="142">01</text>
    <text class="slicing-name" x="70" y="142">The range includes the start and excludes the end</text>
    <text class="slicing-desc" x="44" y="166">Which makes lengths subtract</text>
    <text class="slicing-desc" x="44" y="182">cleanly.</text>
  </g>
  <line class="slicing-line slicing-conn slicing-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#slicing-tip)"/>
  <g class="slicing-stage slicing-s1">
    <rect class="slicing-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="slicing-step" x="280" y="142">02</text>
    <text class="slicing-name" x="306" y="142">A slice returns a new list</text>
    <text class="slicing-desc" x="280" y="166">A shallow copy, not a view.</text>
  </g>
  <line class="slicing-line slicing-conn slicing-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#slicing-tip)"/>
  <g class="slicing-stage slicing-s2">
    <rect class="slicing-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="slicing-step" x="516" y="142">03</text>
    <text class="slicing-name" x="542" y="142">Negative indices count from the end</text>
    <text class="slicing-desc" x="516" y="166">Which avoids arithmetic on the</text>
    <text class="slicing-desc" x="516" y="182">length.</text>
  </g>
  <line class="slicing-line slicing-conn slicing-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#slicing-tip)"/>
  <g class="slicing-stage slicing-s3">
    <rect class="slicing-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="slicing-step" x="752" y="142">04</text>
    <text class="slicing-name" x="778" y="142">And a step can skip or reverse</text>
    <text class="slicing-desc" x="752" y="166">Which is how a list is reversed</text>
    <text class="slicing-desc" x="752" y="182">in one expression.</text>
  </g>
  <text class="slicing-sub" x="30" y="304">Slicing copying rather than viewing is the opposite of the array behaviour two courses later, and confusing the two is a genuine source of bugs.</text>
</svg>
