<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Evaluating without answers</title>
  <style>
    .no-answer-key-bg   { fill: #f8fafc; }
    .no-answer-key-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .no-answer-key-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .no-answer-key-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .no-answer-key-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .no-answer-key-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .no-answer-key-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .no-answer-key-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .no-answer-key-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .no-answer-key-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .no-answer-key-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .no-answer-key-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .no-answer-key-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .no-answer-key-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .no-answer-key-stage { opacity: 1; }

    .no-answer-key-s0 { animation-delay: 0.00s; }
    .no-answer-key-e0 { animation-delay: 0.00s; }
    .no-answer-key-s1 { animation-delay: 1.28s; }
    .no-answer-key-e1 { animation-delay: 1.28s; }
    .no-answer-key-s2 { animation-delay: 2.56s; }
    .no-answer-key-e2 { animation-delay: 2.56s; }
    .no-answer-key-s3 { animation-delay: 3.84s; }
    .no-answer-key-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .no-answer-key-conn  { animation: no-answer-key-trace 6.4s ease-in-out infinite; }
      .no-answer-key-stage { animation: no-answer-key-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes no-answer-key-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes no-answer-key-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .no-answer-key-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .no-answer-key-stage { animation: no-answer-key-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes no-answer-key-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="no-answer-key-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="no-answer-key-bg" width="980" height="322"/>
  <text class="no-answer-key-h1"  x="30" y="40">Evaluating without answers</text>
  <text class="no-answer-key-sub" x="30" y="64">Four steps.</text>
  <g class="no-answer-key-stage no-answer-key-s0">
    <rect class="no-answer-key-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="no-answer-key-step" x="44" y="142">01</text>
    <text class="no-answer-key-name" x="70" y="142">There is no correct answer to compare against</text>
    <text class="no-answer-key-desc" x="44" y="166">By definition of the setting.</text>
  </g>
  <line class="no-answer-key-line no-answer-key-conn no-answer-key-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#no-answer-key-tip)"/>
  <g class="no-answer-key-stage no-answer-key-s1">
    <rect class="no-answer-key-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="no-answer-key-step" x="280" y="142">02</text>
    <text class="no-answer-key-name" x="306" y="142">So internal measures score the geometry instead</text>
    <text class="no-answer-key-desc" x="280" y="166">Compactness, separation,</text>
    <text class="no-answer-key-desc" x="280" y="182">stability.</text>
  </g>
  <line class="no-answer-key-line no-answer-key-conn no-answer-key-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#no-answer-key-tip)"/>
  <g class="no-answer-key-stage no-answer-key-s2">
    <rect class="no-answer-key-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="no-answer-key-step" x="516" y="142">03</text>
    <text class="no-answer-key-name" x="542" y="142">Each of which assumes a cluster shape</text>
    <text class="no-answer-key-desc" x="516" y="166">And rewards whatever matches</text>
    <text class="no-answer-key-desc" x="516" y="182">that assumption.</text>
  </g>
  <line class="no-answer-key-line no-answer-key-conn no-answer-key-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#no-answer-key-tip)"/>
  <g class="no-answer-key-stage no-answer-key-s3">
    <rect class="no-answer-key-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="no-answer-key-step" x="752" y="142">04</text>
    <text class="no-answer-key-name" x="778" y="142">Only an external check settles it</text>
    <text class="no-answer-key-desc" x="752" y="166">A downstream task, or a human</text>
    <text class="no-answer-key-desc" x="752" y="182">judgment.</text>
  </g>
  <text class="no-answer-key-sub" x="30" y="304">Internal measures rewarding their own shape assumption is why a high score can accompany a useless clustering, and why external validation is not optional here.</text>
</svg>
