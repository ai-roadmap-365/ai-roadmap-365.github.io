<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward first-class values.">
  <title>Four steps in function design</title>
  <style>
    .function-history-bg   { fill: #f8fafc; }
    .function-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .function-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .function-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .function-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .function-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .function-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .function-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .function-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .function-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .function-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .function-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .function-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .function-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .function-history-stage { opacity: 1; }

    .function-history-s0 { animation-delay: 0.00s; }
    .function-history-e0 { animation-delay: 0.00s; }
    .function-history-s1 { animation-delay: 1.28s; }
    .function-history-e1 { animation-delay: 1.28s; }
    .function-history-s2 { animation-delay: 2.56s; }
    .function-history-e2 { animation-delay: 2.56s; }
    .function-history-s3 { animation-delay: 3.84s; }
    .function-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .function-history-conn  { animation: function-history-trace 6.4s ease-in-out infinite; }
      .function-history-stage { animation: function-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes function-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes function-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .function-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .function-history-stage { animation: function-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes function-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="function-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="function-history-bg" width="980" height="322"/>
  <text class="function-history-h1"  x="30" y="40">Four steps in function design</text>
  <text class="function-history-sub" x="30" y="64">Toward first-class values.</text>
  <g class="function-history-stage function-history-s0">
    <rect class="function-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="function-history-step" x="44" y="142">01</text>
    <text class="function-history-name" x="70" y="142">A reusable block, jumped to and returned from</text>
    <text class="function-history-desc" x="44" y="166">With no isolation of names.</text>
  </g>
  <line class="function-history-line function-history-conn function-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#function-history-tip)"/>
  <g class="function-history-stage function-history-s1">
    <rect class="function-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="function-history-step" x="280" y="142">02</text>
    <text class="function-history-name" x="306" y="142">Then procedures with their own scope</text>
    <text class="function-history-desc" x="280" y="166">Which made reuse safe.</text>
  </g>
  <line class="function-history-line function-history-conn function-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#function-history-tip)"/>
  <g class="function-history-stage function-history-s2">
    <rect class="function-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="function-history-step" x="516" y="142">03</text>
    <text class="function-history-name" x="542" y="142">Then functions as values that can be passed around</text>
    <text class="function-history-desc" x="516" y="166">Which is what enables decorators</text>
    <text class="function-history-desc" x="516" y="182">and callbacks.</text>
  </g>
  <line class="function-history-line function-history-conn function-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#function-history-tip)"/>
  <g class="function-history-stage function-history-s3">
    <rect class="function-history-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="function-history-step" x="752" y="142">04</text>
    <text class="function-history-name" x="778" y="142">And signatures annotated with types</text>
    <text class="function-history-desc" x="752" y="166">Which tools can check.</text>
  </g>
  <text class="function-history-sub" x="30" y="304">Functions being values is what makes the framework patterns in later lessons possible: a callback is only a function passed as an argument.</text>
</svg>
