<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From word overlap to grounded rubrics.">
  <title>Three eras of evaluating generated text</title>
  <style>
    .eval-three-eras-bg   { fill: #f8fafc; }
    .eval-three-eras-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-three-eras-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-three-eras-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-three-eras-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-three-eras-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-three-eras-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eval-three-eras-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eval-three-eras-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eval-three-eras-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eval-three-eras-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eval-three-eras-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eval-three-eras-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .eval-three-eras-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .eval-three-eras-stage { opacity: 1; }

    .eval-three-eras-s0 { animation-delay: 0.00s; }
    .eval-three-eras-e0 { animation-delay: 0.00s; }
    .eval-three-eras-s1 { animation-delay: 1.50s; }
    .eval-three-eras-e1 { animation-delay: 1.50s; }
    .eval-three-eras-s2 { animation-delay: 3.00s; }
    .eval-three-eras-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .eval-three-eras-conn  { animation: eval-three-eras-trace 6s ease-in-out infinite; }
      .eval-three-eras-stage { animation: eval-three-eras-arrive 6s ease-in-out infinite; }
    }
    @keyframes eval-three-eras-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes eval-three-eras-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .eval-three-eras-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .eval-three-eras-stage { animation: eval-three-eras-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes eval-three-eras-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="eval-three-eras-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="eval-three-eras-bg" width="980" height="322"/>
  <text class="eval-three-eras-h1"  x="30" y="40">Three eras of evaluating generated text</text>
  <text class="eval-three-eras-sub" x="30" y="64">From word overlap to grounded rubrics.</text>
  <g class="eval-three-eras-stage eval-three-eras-s0">
    <rect class="eval-three-eras-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="eval-three-eras-step" x="44" y="142">01</text>
    <text class="eval-three-eras-name" x="70" y="142">N-gram overlap, 2018-2022</text>
    <text class="eval-three-eras-desc" x="44" y="166">BLEU and ROUGE. Measured word overlap with a</text>
    <text class="eval-three-eras-desc" x="44" y="182">reference, not correctness.</text>
    <text class="eval-three-eras-edge" x="44" y="242">overlap</text>
  </g>
  <line class="eval-three-eras-line eval-three-eras-conn eval-three-eras-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#eval-three-eras-tip)"/>
  <g class="eval-three-eras-stage eval-three-eras-s1">
    <rect class="eval-three-eras-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="eval-three-eras-step" x="359" y="142">02</text>
    <text class="eval-three-eras-name" x="385" y="142">Uncalibrated judges, 2023-2024</text>
    <text class="eval-three-eras-desc" x="359" y="166">Ask a model if it is good. It usually says</text>
    <text class="eval-three-eras-desc" x="359" y="182">yes.</text>
    <text class="eval-three-eras-edge" x="359" y="242">agreeable</text>
  </g>
  <line class="eval-three-eras-line eval-three-eras-conn eval-three-eras-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#eval-three-eras-tip)"/>
  <g class="eval-three-eras-stage eval-three-eras-s2">
    <rect class="eval-three-eras-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="eval-three-eras-step" x="674" y="142">03</text>
    <text class="eval-three-eras-name" x="700" y="142">Grounded rubrics, 2025-</text>
    <text class="eval-three-eras-desc" x="674" y="166">Specific criteria, checked against retrieved</text>
    <text class="eval-three-eras-desc" x="674" y="182">evidence, calibrated against human labels.</text>
    <text class="eval-three-eras-edge" x="674" y="242">grounded</text>
  </g>
  <text class="eval-three-eras-sub" x="30" y="304">The middle era failed for a measurable reason: an uncalibrated judge's agreement with human raters was barely better than chance on the cases that mattered, while reading as confident on all of them.</text>
</svg>
