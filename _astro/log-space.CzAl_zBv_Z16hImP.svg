<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Working in log space</title>
  <style>
    .log-space-bg   { fill: #f8fafc; }
    .log-space-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .log-space-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .log-space-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .log-space-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .log-space-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .log-space-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .log-space-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .log-space-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .log-space-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .log-space-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .log-space-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .log-space-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .log-space-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .log-space-stage { opacity: 1; }

    .log-space-s0 { animation-delay: 0.00s; }
    .log-space-e0 { animation-delay: 0.00s; }
    .log-space-s1 { animation-delay: 1.28s; }
    .log-space-e1 { animation-delay: 1.28s; }
    .log-space-s2 { animation-delay: 2.56s; }
    .log-space-e2 { animation-delay: 2.56s; }
    .log-space-s3 { animation-delay: 3.84s; }
    .log-space-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .log-space-conn  { animation: log-space-trace 6.4s ease-in-out infinite; }
      .log-space-stage { animation: log-space-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes log-space-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes log-space-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .log-space-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .log-space-stage { animation: log-space-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes log-space-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="log-space-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="log-space-bg" width="980" height="322"/>
  <text class="log-space-h1"  x="30" y="40">Working in log space</text>
  <text class="log-space-sub" x="30" y="64">Four steps.</text>
  <g class="log-space-stage log-space-s0">
    <rect class="log-space-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="log-space-step" x="44" y="142">01</text>
    <text class="log-space-name" x="70" y="142">The prediction multiplies many small probabilities</text>
    <text class="log-space-desc" x="44" y="166">One per feature.</text>
  </g>
  <line class="log-space-line log-space-conn log-space-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#log-space-tip)"/>
  <g class="log-space-stage log-space-s1">
    <rect class="log-space-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="log-space-step" x="280" y="142">02</text>
    <text class="log-space-name" x="306" y="142">Which underflows to exactly zero</text>
    <text class="log-space-desc" x="280" y="166">After a few hundred terms, in</text>
    <text class="log-space-desc" x="280" y="182">any float format.</text>
  </g>
  <line class="log-space-line log-space-conn log-space-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#log-space-tip)"/>
  <g class="log-space-stage log-space-s2">
    <rect class="log-space-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="log-space-step" x="516" y="142">03</text>
    <text class="log-space-name" x="542" y="142">So take logarithms</text>
    <text class="log-space-desc" x="516" y="166">Turning the product into a sum.</text>
  </g>
  <line class="log-space-line log-space-conn log-space-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#log-space-tip)"/>
  <g class="log-space-stage log-space-s3">
    <rect class="log-space-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="log-space-step" x="752" y="142">04</text>
    <text class="log-space-name" x="778" y="142">And compare sums instead</text>
    <text class="log-space-desc" x="752" y="166">Which preserves the ordering</text>
    <text class="log-space-desc" x="752" y="182">exactly.</text>
  </g>
  <text class="log-space-sub" x="30" y="304">This is a numerical necessity rather than an optimisation: the direct formulation returns zero for every class on any realistic document.</text>
</svg>
