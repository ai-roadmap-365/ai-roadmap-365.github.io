<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A long-run claim.">
  <title>A forecast</title>
  <style>
    .weather-forecast-bg   { fill: #f8fafc; }
    .weather-forecast-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weather-forecast-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weather-forecast-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weather-forecast-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weather-forecast-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weather-forecast-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .weather-forecast-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .weather-forecast-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .weather-forecast-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .weather-forecast-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .weather-forecast-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .weather-forecast-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .weather-forecast-row { opacity: 1; }
    .weather-forecast-r0 { animation-delay: 0.00s; }
    .weather-forecast-r1 { animation-delay: 0.45s; }
    .weather-forecast-r2 { animation-delay: 0.90s; }
    .weather-forecast-r3 { animation-delay: 1.35s; }
    .weather-forecast-r4 { animation-delay: 1.80s; }
    .weather-forecast-row { animation: weather-forecast-reveal 7.3s ease-in-out infinite; }
    @keyframes weather-forecast-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="weather-forecast-bg" width="980" height="390"/>
  <text class="weather-forecast-h1"  x="30" y="40">A forecast</text>
  <text class="weather-forecast-sub" x="30" y="64">A long-run claim.</text>
  <rect class="weather-forecast-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="weather-forecast-name" x="46" y="122">Probabilistic</text>
  <text class="weather-forecast-desc" x="46" y="142">Checkable over many days.</text>
  <text class="weather-forecast-desc weather-forecast-row weather-forecast-r0" x="46" y="182">'A thirty per cent chance of rain'</text>
  <text class="weather-forecast-desc weather-forecast-row weather-forecast-r1" x="46" y="216">Cannot be wrong on any single day</text>
  <text class="weather-forecast-desc weather-forecast-row weather-forecast-r2" x="46" y="250">Assessed over many forecasts</text>
  <text class="weather-forecast-desc weather-forecast-row weather-forecast-r3" x="46" y="284">Honest about uncertainty</text>
  <text class="weather-forecast-desc weather-forecast-row weather-forecast-r4" x="46" y="318">This is a probability</text>
  <rect class="weather-forecast-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="weather-forecast-name" x="526" y="122">Definite</text>
  <text class="weather-forecast-desc" x="526" y="142">Checkable today.</text>
  <text class="weather-forecast-desc weather-forecast-row weather-forecast-r0" x="526" y="182">'It will rain'</text>
  <text class="weather-forecast-desc weather-forecast-row weather-forecast-r1" x="526" y="216">Wrong if it does not</text>
  <text class="weather-forecast-desc weather-forecast-row weather-forecast-r2" x="526" y="250">Assessed immediately</text>
  <text class="weather-forecast-desc weather-forecast-row weather-forecast-r3" x="526" y="284">Hides uncertainty</text>
  <text class="weather-forecast-desc weather-forecast-row weather-forecast-r4" x="526" y="318">This is a prediction</text>
  <text class="weather-forecast-sub" x="30" y="372">Assessment over many forecasts is what calibration means, and it is the only sensible way to judge whether a probability was any good.</text>
</svg>
