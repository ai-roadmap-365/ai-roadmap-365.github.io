<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are money.">
  <title>Four consequences of progressive release</title>
  <style>
    .rollout-implications-bg   { fill: #f8fafc; }
    .rollout-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rollout-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rollout-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rollout-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rollout-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rollout-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rollout-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rollout-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rollout-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rollout-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rollout-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rollout-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .rollout-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .rollout-implications-stage { opacity: 1; }

    .rollout-implications-s0 { animation-delay: 0.00s; }
    .rollout-implications-e0 { animation-delay: 0.00s; }
    .rollout-implications-s1 { animation-delay: 1.28s; }
    .rollout-implications-e1 { animation-delay: 1.28s; }
    .rollout-implications-s2 { animation-delay: 2.56s; }
    .rollout-implications-e2 { animation-delay: 2.56s; }
    .rollout-implications-s3 { animation-delay: 3.84s; }
    .rollout-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .rollout-implications-conn  { animation: rollout-implications-trace 6.4s ease-in-out infinite; }
      .rollout-implications-stage { animation: rollout-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes rollout-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes rollout-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .rollout-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .rollout-implications-stage { animation: rollout-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes rollout-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="rollout-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="rollout-implications-bg" width="980" height="322"/>
  <text class="rollout-implications-h1"  x="30" y="40">Four consequences of progressive release</text>
  <text class="rollout-implications-sub" x="30" y="64">Two are money.</text>
  <g class="rollout-implications-stage rollout-implications-s0">
    <rect class="rollout-implications-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="rollout-implications-step" x="44" y="142">01</text>
    <text class="rollout-implications-name" x="70" y="142">Shadow responses stay in memory</text>
    <text class="rollout-implications-desc" x="44" y="166">Discarded, never returned.</text>
    <text class="rollout-implications-edge" x="44" y="242">safety</text>
  </g>
  <line class="rollout-implications-line rollout-implications-conn rollout-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#rollout-implications-tip)"/>
  <g class="rollout-implications-stage rollout-implications-s1">
    <rect class="rollout-implications-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="rollout-implications-step" x="280" y="142">02</text>
    <text class="rollout-implications-name" x="306" y="142">Mirror rate is a budget</text>
    <text class="rollout-implications-desc" x="280" y="166">5-10% validates stability at a</text>
    <text class="rollout-implications-desc" x="280" y="182">tenth of the compute.</text>
    <text class="rollout-implications-edge" x="280" y="242">money</text>
  </g>
  <line class="rollout-implications-line rollout-implications-conn rollout-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#rollout-implications-tip)"/>
  <g class="rollout-implications-stage rollout-implications-s2">
    <rect class="rollout-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="rollout-implications-step" x="516" y="142">03</text>
    <text class="rollout-implications-name" x="542" y="142">Flag evaluation must be sub-millisecond</text>
    <text class="rollout-implications-desc" x="516" y="166">It sits on every request. A</text>
    <text class="rollout-implications-desc" x="516" y="182">network call here is a latency</text>
    <text class="rollout-implications-desc" x="516" y="198">regression.</text>
    <text class="rollout-implications-edge" x="516" y="242">performance</text>
  </g>
  <line class="rollout-implications-line rollout-implications-conn rollout-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#rollout-implications-tip)"/>
  <g class="rollout-implications-stage rollout-implications-s3">
    <rect class="rollout-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="rollout-implications-step" x="752" y="142">04</text>
    <text class="rollout-implications-name" x="778" y="142">Sample size before significance</text>
    <text class="rollout-implications-desc" x="752" y="166">Two-proportion z-test for</text>
    <text class="rollout-implications-desc" x="752" y="182">conversions; require p below</text>
    <text class="rollout-implications-desc" x="752" y="198">0.01.</text>
    <text class="rollout-implications-edge" x="752" y="242">statistics</text>
  </g>
  <text class="rollout-implications-sub" x="30" y="304">The fourth is what stops an experiment being declared won on a good afternoon: the required sample size is computable in advance, and computing it is the difference between a result and an anecdote.</text>
</svg>
