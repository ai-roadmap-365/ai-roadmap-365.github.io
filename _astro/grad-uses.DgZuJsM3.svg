<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four readings.">
  <title>What a gradient tells you</title>
  <style>
    .grad-uses-bg   { fill: #f8fafc; }
    .grad-uses-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grad-uses-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grad-uses-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grad-uses-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grad-uses-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grad-uses-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .grad-uses-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .grad-uses-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .grad-uses-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .grad-uses-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .grad-uses-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .grad-uses-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .grad-uses-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .grad-uses-stage { opacity: 1; }

    .grad-uses-s0 { animation-delay: 0.00s; }
    .grad-uses-e0 { animation-delay: 0.00s; }
    .grad-uses-s1 { animation-delay: 1.28s; }
    .grad-uses-e1 { animation-delay: 1.28s; }
    .grad-uses-s2 { animation-delay: 2.56s; }
    .grad-uses-e2 { animation-delay: 2.56s; }
    .grad-uses-s3 { animation-delay: 3.84s; }
    .grad-uses-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .grad-uses-conn  { animation: grad-uses-trace 6.4s ease-in-out infinite; }
      .grad-uses-stage { animation: grad-uses-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes grad-uses-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes grad-uses-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .grad-uses-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .grad-uses-stage { animation: grad-uses-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes grad-uses-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="grad-uses-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="grad-uses-bg" width="980" height="322"/>
  <text class="grad-uses-h1"  x="30" y="40">What a gradient tells you</text>
  <text class="grad-uses-sub" x="30" y="64">Four readings.</text>
  <g class="grad-uses-stage grad-uses-s0">
    <rect class="grad-uses-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="grad-uses-step" x="44" y="142">01</text>
    <text class="grad-uses-name" x="70" y="142">Its direction: which way is uphill</text>
    <text class="grad-uses-desc" x="44" y="166">Steepest ascent.</text>
  </g>
  <line class="grad-uses-line grad-uses-conn grad-uses-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#grad-uses-tip)"/>
  <g class="grad-uses-stage grad-uses-s1">
    <rect class="grad-uses-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="grad-uses-step" x="280" y="142">02</text>
    <text class="grad-uses-name" x="306" y="142">Its magnitude: how steep</text>
    <text class="grad-uses-desc" x="280" y="166">Which scales the step you take.</text>
  </g>
  <line class="grad-uses-line grad-uses-conn grad-uses-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#grad-uses-tip)"/>
  <g class="grad-uses-stage grad-uses-s2">
    <rect class="grad-uses-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="grad-uses-step" x="516" y="142">03</text>
    <text class="grad-uses-name" x="542" y="142">A zero gradient: a flat point</text>
    <text class="grad-uses-desc" x="516" y="166">Minimum, maximum or saddle.</text>
  </g>
  <line class="grad-uses-line grad-uses-conn grad-uses-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#grad-uses-tip)"/>
  <g class="grad-uses-stage grad-uses-s3">
    <rect class="grad-uses-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="grad-uses-step" x="752" y="142">04</text>
    <text class="grad-uses-name" x="778" y="142">And each component: how much that input matters</text>
    <text class="grad-uses-desc" x="752" y="166">Locally, at this point.</text>
  </g>
  <text class="grad-uses-sub" x="30" y="304">Reading individual components as local importance is genuinely useful for interpretation, provided you remember that it holds only near the current point.</text>
</svg>
