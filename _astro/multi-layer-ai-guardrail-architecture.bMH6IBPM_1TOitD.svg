<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Multi Layer AI Guardrail Architecture">
  <title>Multi Layer AI Guardrail Architecture</title>
  <defs>
    <style>
      .d313a-bg { fill: #f8fafc; }
      .d313a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d313a-in { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d313a-llm { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d313a-out { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 8px; }
      .d313a-res { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d313a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d313a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d313a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d313a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d313a-bg" />
  
  <text x="40" y="40" class="d313a-title">Multi-Layer AI Guardrail Defense Topology</text>
  <text x="40" y="65" class="d313a-subtitle">Multi Layer AI Guardrail Architecture showing User Request, Input Guardrails (PII Masking, Prompt Injection Filter, Topical Classifier), Foundation Model, Output Guardrails (Hallucination Check, Toxicity &amp; PII Leak Scanner), and Sanitized Response</text>
  
  <!-- Step 1: Input Guardrails -->
  <rect x="40" y="110" width="180" height="270" class="d313a-in" />
  <text x="55" y="140" class="d313a-header" fill="#1d4ed8">1. Input Guardrails</text>
  <text x="55" y="170" class="d313a-text">• PII Masking &amp; Redaction</text>
  <text x="55" y="190" class="d313a-text">• Prompt Injection Scanner</text>
  <text x="55" y="210" class="d313a-text">• Topical Domain Classifier</text>
  <text x="55" y="230" class="d313a-text">• Input Length / Rate Limit</text>
  <text x="55" y="260" class="d313a-text" font-weight="600">Action:</text>
  <text x="55" y="280" class="d313a-text">Sanitize or Block</text>
  
  <!-- Step 2: Foundation LLM -->
  <rect x="250" y="110" width="180" height="270" class="d313a-llm" />
  <text x="265" y="140" class="d313a-header" fill="#7e22ce">2. Execution Engine</text>
  <text x="265" y="170" class="d313a-text">• Foundation Model</text>
  <text x="265" y="190" class="d313a-text">• RAG Vector Retrieval</text>
  <text x="265" y="210" class="d313a-text">• Sandboxed Tool Calling</text>
  <text x="265" y="230" class="d313a-text">• System Prompt Invariants</text>
  <text x="265" y="260" class="d313a-text" font-weight="600">Output:</text>
  <text x="265" y="280" class="d313a-text">Raw Generated Text</text>
  
  <!-- Step 3: Output Guardrails -->
  <rect x="460" y="110" width="180" height="270" class="d313a-out" />
  <text x="475" y="140" class="d313a-header" fill="#a16207">3. Output Guardrails</text>
  <text x="475" y="170" class="d313a-text">• Secret &amp; API Key Leaks</text>
  <text x="475" y="190" class="d313a-text">• Hallucination Verifier</text>
  <text x="475" y="210" class="d313a-text">• Toxicity &amp; Hate Scanner</text>
  <text x="475" y="230" class="d313a-text">• JSON Schema Validator</text>
  <text x="475" y="260" class="d313a-text" font-weight="600">Action:</text>
  <text x="475" y="280" class="d313a-text">Filter or Fallback</text>
  
  <!-- Step 4: Final Sanitized Output -->
  <rect x="670" y="110" width="190" height="270" class="d313a-res" />
  <text x="685" y="140" class="d313a-header" fill="#15803d">4. Delivered Response</text>
  <text x="685" y="170" class="d313a-text">• Verified Safe Response</text>
  <text x="685" y="190" class="d313a-text">• Unmasked PII (if auth)</text>
  <text x="685" y="210" class="d313a-text">• Structured JSON Payload</text>
  <text x="685" y="230" class="d313a-text">• Safe Fallback on Block</text>
  <text x="685" y="260" class="d313a-text" font-weight="600">Result:</text>
  <text x="685" y="280" class="d313a-text" fill="#15803d" font-weight="700">100% Compliant Delivery</text>
</svg>