<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties, three seconds.">
  <title>Surviving a region</title>
  <style>
    .multi-region-dr-bg   { fill: #f8fafc; }
    .multi-region-dr-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multi-region-dr-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multi-region-dr-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multi-region-dr-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multi-region-dr-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multi-region-dr-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .multi-region-dr-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .multi-region-dr-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .multi-region-dr-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .multi-region-dr-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .multi-region-dr-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .multi-region-dr-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .multi-region-dr-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .multi-region-dr-stage { opacity: 1; }

    .multi-region-dr-s0 { animation-delay: 0.00s; }
    .multi-region-dr-e0 { animation-delay: 0.00s; }
    .multi-region-dr-s1 { animation-delay: 1.28s; }
    .multi-region-dr-e1 { animation-delay: 1.28s; }
    .multi-region-dr-s2 { animation-delay: 2.56s; }
    .multi-region-dr-e2 { animation-delay: 2.56s; }
    .multi-region-dr-s3 { animation-delay: 3.84s; }
    .multi-region-dr-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .multi-region-dr-conn  { animation: multi-region-dr-trace 6.4s ease-in-out infinite; }
      .multi-region-dr-stage { animation: multi-region-dr-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes multi-region-dr-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes multi-region-dr-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .multi-region-dr-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .multi-region-dr-stage { animation: multi-region-dr-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes multi-region-dr-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="multi-region-dr-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="multi-region-dr-bg" width="980" height="322"/>
  <text class="multi-region-dr-h1"  x="30" y="40">Surviving a region</text>
  <text class="multi-region-dr-sub" x="30" y="64">Four properties, three seconds.</text>
  <g class="multi-region-dr-stage multi-region-dr-s0">
    <rect class="multi-region-dr-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="multi-region-dr-step" x="44" y="142">01</text>
    <text class="multi-region-dr-name" x="70" y="142">Two regions, both live</text>
    <text class="multi-region-dr-desc" x="44" y="166">Identical definitions, applied</text>
    <text class="multi-region-dr-desc" x="44" y="182">twice. Not a standby nobody has</text>
    <text class="multi-region-dr-desc" x="44" y="198">tested.</text>
  </g>
  <line class="multi-region-dr-line multi-region-dr-conn multi-region-dr-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#multi-region-dr-tip)"/>
  <g class="multi-region-dr-stage multi-region-dr-s1">
    <rect class="multi-region-dr-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="multi-region-dr-step" x="280" y="142">02</text>
    <text class="multi-region-dr-name" x="306" y="142">Geo-DNS routes to the nearest</text>
    <text class="multi-region-dr-desc" x="280" y="166">Lowest latency for each user, in</text>
    <text class="multi-region-dr-desc" x="280" y="182">normal operation.</text>
  </g>
  <line class="multi-region-dr-line multi-region-dr-conn multi-region-dr-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#multi-region-dr-tip)"/>
  <g class="multi-region-dr-stage multi-region-dr-s2">
    <rect class="multi-region-dr-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="multi-region-dr-step" x="516" y="142">03</text>
    <text class="multi-region-dr-name" x="542" y="142">Health probes fail in 3 seconds</text>
    <text class="multi-region-dr-desc" x="516" y="166">Traffic shifts entirely to the</text>
    <text class="multi-region-dr-desc" x="516" y="182">survivor.</text>
    <text class="multi-region-dr-edge" x="516" y="242">3s</text>
  </g>
  <line class="multi-region-dr-line multi-region-dr-conn multi-region-dr-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#multi-region-dr-tip)"/>
  <g class="multi-region-dr-stage multi-region-dr-s3">
    <rect class="multi-region-dr-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="multi-region-dr-step" x="752" y="142">04</text>
    <text class="multi-region-dr-name" x="778" y="142">Ledgers replicate asynchronously</text>
    <text class="multi-region-dr-desc" x="752" y="166">Over private backbones, so</text>
    <text class="multi-region-dr-desc" x="752" y="182">billing stays globally</text>
    <text class="multi-region-dr-desc" x="752" y="198">consistent.</text>
  </g>
  <text class="multi-region-dr-sub" x="30" y="304">Active-active rather than active-standby is the important choice: a standby region that has never served traffic is a hypothesis, and the failover is the first time anyone finds out whether it was true.</text>
</svg>
