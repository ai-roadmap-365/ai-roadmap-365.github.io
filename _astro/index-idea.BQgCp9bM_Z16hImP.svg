<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>What an index is</title>
  <style>
    .index-idea-bg   { fill: #f8fafc; }
    .index-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .index-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .index-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .index-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .index-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .index-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .index-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .index-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .index-idea-stage { opacity: 1; }

    .index-idea-s0 { animation-delay: 0.00s; }
    .index-idea-e0 { animation-delay: 0.00s; }
    .index-idea-s1 { animation-delay: 1.28s; }
    .index-idea-e1 { animation-delay: 1.28s; }
    .index-idea-s2 { animation-delay: 2.56s; }
    .index-idea-e2 { animation-delay: 2.56s; }
    .index-idea-s3 { animation-delay: 3.84s; }
    .index-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .index-idea-conn  { animation: index-idea-trace 6.4s ease-in-out infinite; }
      .index-idea-stage { animation: index-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes index-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes index-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .index-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .index-idea-stage { animation: index-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes index-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="index-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="index-idea-bg" width="980" height="322"/>
  <text class="index-idea-h1"  x="30" y="40">What an index is</text>
  <text class="index-idea-sub" x="30" y="64">Four properties.</text>
  <g class="index-idea-stage index-idea-s0">
    <rect class="index-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="index-idea-step" x="44" y="142">01</text>
    <text class="index-idea-name" x="70" y="142">A sorted structure over one or more columns</text>
    <text class="index-idea-desc" x="44" y="166">Held alongside the table.</text>
  </g>
  <line class="index-idea-line index-idea-conn index-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#index-idea-tip)"/>
  <g class="index-idea-stage index-idea-s1">
    <rect class="index-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="index-idea-step" x="280" y="142">02</text>
    <text class="index-idea-name" x="306" y="142">Which turns a full scan into a direct lookup</text>
    <text class="index-idea-desc" x="280" y="166">From every row to a handful.</text>
  </g>
  <line class="index-idea-line index-idea-conn index-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#index-idea-tip)"/>
  <g class="index-idea-stage index-idea-s2">
    <rect class="index-idea-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="index-idea-step" x="516" y="142">03</text>
    <text class="index-idea-name" x="542" y="142">Paid for in storage and write cost</text>
    <text class="index-idea-desc" x="516" y="166">Every write updates every index.</text>
  </g>
  <line class="index-idea-line index-idea-conn index-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#index-idea-tip)"/>
  <g class="index-idea-stage index-idea-s3">
    <rect class="index-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="index-idea-step" x="752" y="142">04</text>
    <text class="index-idea-name" x="778" y="142">And maintained automatically by the engine</text>
    <text class="index-idea-desc" x="752" y="166">You declare it; it stays</text>
    <text class="index-idea-desc" x="752" y="182">correct.</text>
    <text class="index-idea-edge" x="752" y="242">automatic</text>
  </g>
  <text class="index-idea-sub" x="30" y="304">The write cost is what makes indexes a trade rather than a free win: a table with eight indexes does eight extra pieces of work on every insert.</text>
</svg>
