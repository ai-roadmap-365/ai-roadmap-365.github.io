<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Every issued certificate is published, so you can notice one you did not ask for.">
  <title>Who watches the certificate authorities</title>
  <style>
    .certificate-transparency-bg   { fill: #f8fafc; }
    .certificate-transparency-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .certificate-transparency-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .certificate-transparency-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .certificate-transparency-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .certificate-transparency-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .certificate-transparency-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .certificate-transparency-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .certificate-transparency-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .certificate-transparency-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .certificate-transparency-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .certificate-transparency-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .certificate-transparency-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .certificate-transparency-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .certificate-transparency-stage { opacity: 1; }

    .certificate-transparency-s0 { animation-delay: 0.00s; }
    .certificate-transparency-e0 { animation-delay: 0.00s; }
    .certificate-transparency-s1 { animation-delay: 1.28s; }
    .certificate-transparency-e1 { animation-delay: 1.28s; }
    .certificate-transparency-s2 { animation-delay: 2.56s; }
    .certificate-transparency-e2 { animation-delay: 2.56s; }
    .certificate-transparency-s3 { animation-delay: 3.84s; }
    .certificate-transparency-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .certificate-transparency-conn  { animation: certificate-transparency-trace 6.4s ease-in-out infinite; }
      .certificate-transparency-stage { animation: certificate-transparency-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes certificate-transparency-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes certificate-transparency-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .certificate-transparency-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .certificate-transparency-stage { animation: certificate-transparency-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes certificate-transparency-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="certificate-transparency-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="certificate-transparency-bg" width="980" height="322"/>
  <text class="certificate-transparency-h1"  x="30" y="40">Who watches the certificate authorities</text>
  <text class="certificate-transparency-sub" x="30" y="64">Every issued certificate is published, so you can notice one you did not ask for.</text>
  <g class="certificate-transparency-stage certificate-transparency-s0">
    <rect class="certificate-transparency-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="certificate-transparency-step" x="44" y="142">01</text>
    <text class="certificate-transparency-name" x="70" y="142">A CA issues a certificate</text>
    <text class="certificate-transparency-desc" x="44" y="166">For any domain it is willing to</text>
    <text class="certificate-transparency-desc" x="44" y="182">sign for.</text>
  </g>
  <line class="certificate-transparency-line certificate-transparency-conn certificate-transparency-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#certificate-transparency-tip)"/>
  <g class="certificate-transparency-stage certificate-transparency-s1">
    <rect class="certificate-transparency-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="certificate-transparency-step" x="280" y="142">02</text>
    <text class="certificate-transparency-name" x="306" y="142">It must be logged publicly</text>
    <text class="certificate-transparency-desc" x="280" y="166">Appended to append-only</text>
    <text class="certificate-transparency-desc" x="280" y="182">transparency logs anyone can</text>
    <text class="certificate-transparency-desc" x="280" y="198">read.</text>
    <text class="certificate-transparency-edge" x="280" y="242">public</text>
  </g>
  <line class="certificate-transparency-line certificate-transparency-conn certificate-transparency-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#certificate-transparency-tip)"/>
  <g class="certificate-transparency-stage certificate-transparency-s2">
    <rect class="certificate-transparency-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="certificate-transparency-step" x="516" y="142">03</text>
    <text class="certificate-transparency-name" x="542" y="142">Browsers require the proof</text>
    <text class="certificate-transparency-desc" x="516" y="166">A certificate without log</text>
    <text class="certificate-transparency-desc" x="516" y="182">inclusion is rejected.</text>
  </g>
  <line class="certificate-transparency-line certificate-transparency-conn certificate-transparency-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#certificate-transparency-tip)"/>
  <g class="certificate-transparency-stage certificate-transparency-s3">
    <rect class="certificate-transparency-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="certificate-transparency-step" x="752" y="142">04</text>
    <text class="certificate-transparency-name" x="778" y="142">Owners can monitor</text>
    <text class="certificate-transparency-desc" x="752" y="166">Search the logs for your own</text>
    <text class="certificate-transparency-desc" x="752" y="182">domain and see everything issued</text>
    <text class="certificate-transparency-desc" x="752" y="198">for it.</text>
    <text class="certificate-transparency-edge" x="752" y="242">detectable</text>
  </g>
  <text class="certificate-transparency-sub" x="30" y="304">This does not prevent a compromised authority from issuing a certificate for your domain. It makes it impossible to do so quietly, which turned out to be enough.</text>
</svg>
