<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two commands, in this order.">
  <title>Finding what filled the disk</title>
  <style>
    .finding-what-fills-a-disk-bg   { fill: #f8fafc; }
    .finding-what-fills-a-disk-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finding-what-fills-a-disk-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finding-what-fills-a-disk-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finding-what-fills-a-disk-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finding-what-fills-a-disk-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finding-what-fills-a-disk-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .finding-what-fills-a-disk-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .finding-what-fills-a-disk-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .finding-what-fills-a-disk-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .finding-what-fills-a-disk-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .finding-what-fills-a-disk-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .finding-what-fills-a-disk-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .finding-what-fills-a-disk-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .finding-what-fills-a-disk-stage { opacity: 1; }

    .finding-what-fills-a-disk-s0 { animation-delay: 0.00s; }
    .finding-what-fills-a-disk-e0 { animation-delay: 0.00s; }
    .finding-what-fills-a-disk-s1 { animation-delay: 1.28s; }
    .finding-what-fills-a-disk-e1 { animation-delay: 1.28s; }
    .finding-what-fills-a-disk-s2 { animation-delay: 2.56s; }
    .finding-what-fills-a-disk-e2 { animation-delay: 2.56s; }
    .finding-what-fills-a-disk-s3 { animation-delay: 3.84s; }
    .finding-what-fills-a-disk-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .finding-what-fills-a-disk-conn  { animation: finding-what-fills-a-disk-trace 6.4s ease-in-out infinite; }
      .finding-what-fills-a-disk-stage { animation: finding-what-fills-a-disk-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes finding-what-fills-a-disk-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes finding-what-fills-a-disk-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .finding-what-fills-a-disk-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .finding-what-fills-a-disk-stage { animation: finding-what-fills-a-disk-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes finding-what-fills-a-disk-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="finding-what-fills-a-disk-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="finding-what-fills-a-disk-bg" width="980" height="322"/>
  <text class="finding-what-fills-a-disk-h1"  x="30" y="40">Finding what filled the disk</text>
  <text class="finding-what-fills-a-disk-sub" x="30" y="64">Two commands, in this order.</text>
  <g class="finding-what-fills-a-disk-stage finding-what-fills-a-disk-s0">
    <rect class="finding-what-fills-a-disk-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="finding-what-fills-a-disk-step" x="44" y="142">01</text>
    <text class="finding-what-fills-a-disk-name" x="70" y="142">df -h</text>
    <text class="finding-what-fills-a-disk-desc" x="44" y="166">Which filesystem is full, and</text>
    <text class="finding-what-fills-a-disk-desc" x="44" y="182">how full. Start here, not with</text>
    <text class="finding-what-fills-a-disk-desc" x="44" y="198">du.</text>
    <text class="finding-what-fills-a-disk-edge" x="44" y="242">df</text>
  </g>
  <line class="finding-what-fills-a-disk-line finding-what-fills-a-disk-conn finding-what-fills-a-disk-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#finding-what-fills-a-disk-tip)"/>
  <g class="finding-what-fills-a-disk-stage finding-what-fills-a-disk-s1">
    <rect class="finding-what-fills-a-disk-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="finding-what-fills-a-disk-step" x="280" y="142">02</text>
    <text class="finding-what-fills-a-disk-name" x="306" y="142">du -sh *</text>
    <text class="finding-what-fills-a-disk-desc" x="280" y="166">Size of each thing in the</text>
    <text class="finding-what-fills-a-disk-desc" x="280" y="182">current directory. Summarised,</text>
    <text class="finding-what-fills-a-disk-desc" x="280" y="198">human-readable.</text>
    <text class="finding-what-fills-a-disk-edge" x="280" y="242">du</text>
  </g>
  <line class="finding-what-fills-a-disk-line finding-what-fills-a-disk-conn finding-what-fills-a-disk-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#finding-what-fills-a-disk-tip)"/>
  <g class="finding-what-fills-a-disk-stage finding-what-fills-a-disk-s2">
    <rect class="finding-what-fills-a-disk-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="finding-what-fills-a-disk-step" x="516" y="142">03</text>
    <text class="finding-what-fills-a-disk-name" x="542" y="142">Descend into the biggest</text>
    <text class="finding-what-fills-a-disk-desc" x="516" y="166">Repeat. Three or four levels</text>
    <text class="finding-what-fills-a-disk-desc" x="516" y="182">usually finds it.</text>
  </g>
  <line class="finding-what-fills-a-disk-line finding-what-fills-a-disk-conn finding-what-fills-a-disk-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#finding-what-fills-a-disk-tip)"/>
  <g class="finding-what-fills-a-disk-stage finding-what-fills-a-disk-s3">
    <rect class="finding-what-fills-a-disk-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="finding-what-fills-a-disk-step" x="752" y="142">04</text>
    <text class="finding-what-fills-a-disk-name" x="778" y="142">Usually a cache or a log</text>
    <text class="finding-what-fills-a-disk-desc" x="752" y="166">~/.cache, a model download</text>
    <text class="finding-what-fills-a-disk-desc" x="752" y="182">directory, or a log nobody</text>
    <text class="finding-what-fills-a-disk-desc" x="752" y="198">rotated.</text>
  </g>
  <text class="finding-what-fills-a-disk-sub" x="30" y="304">du on a whole disk is slow and often the wrong tool; df tells you which filesystem to look at in a fraction of a second, and narrows the search before you start walking directories.</text>
</svg>
