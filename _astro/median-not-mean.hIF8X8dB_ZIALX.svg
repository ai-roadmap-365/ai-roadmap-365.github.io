<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One task should not decide the finding.">
  <title>Median, not mean</title>
  <style>
    .median-not-mean-bg   { fill: #f8fafc; }
    .median-not-mean-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .median-not-mean-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .median-not-mean-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .median-not-mean-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .median-not-mean-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .median-not-mean-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .median-not-mean-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .median-not-mean-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .median-not-mean-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .median-not-mean-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .median-not-mean-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .median-not-mean-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .median-not-mean-row { opacity: 1; }
    .median-not-mean-r0 { animation-delay: 0.00s; }
    .median-not-mean-r1 { animation-delay: 0.45s; }
    .median-not-mean-r2 { animation-delay: 0.90s; }
    .median-not-mean-r3 { animation-delay: 1.35s; }
    .median-not-mean-r4 { animation-delay: 1.80s; }
    .median-not-mean-row { animation: median-not-mean-reveal 7.3s ease-in-out infinite; }
    @keyframes median-not-mean-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="median-not-mean-bg" width="980" height="390"/>
  <text class="median-not-mean-h1"  x="30" y="40">Median, not mean</text>
  <text class="median-not-mean-sub" x="30" y="64">One task should not decide the finding.</text>
  <rect class="median-not-mean-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="median-not-mean-name" x="46" y="122">Median</text>
  <text class="median-not-mean-desc" x="46" y="142">Resists one extreme.</text>
  <text class="median-not-mean-desc median-not-mean-row median-not-mean-r0" x="46" y="182">One task at 8x is a story</text>
  <text class="median-not-mean-desc median-not-mean-row median-not-mean-r1" x="46" y="216">It does not become your typical error</text>
  <text class="median-not-mean-desc median-not-mean-row median-not-mean-r2" x="46" y="250">The number describes most tasks</text>
  <text class="median-not-mean-desc median-not-mean-row median-not-mean-r3" x="46" y="284">Same argument as a spend baseline</text>
  <text class="median-not-mean-desc median-not-mean-row median-not-mean-r4" x="46" y="318">Skewed distributions are the normal case</text>
  <rect class="median-not-mean-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="median-not-mean-name" x="526" y="122">Mean</text>
  <text class="median-not-mean-desc" x="526" y="142">One task dominates.</text>
  <text class="median-not-mean-desc median-not-mean-row median-not-mean-r0" x="526" y="182">The 8x task drags everything up</text>
  <text class="median-not-mean-desc median-not-mean-row median-not-mean-r1" x="526" y="216">Well-estimated work looks bad</text>
  <text class="median-not-mean-desc median-not-mean-row median-not-mean-r2" x="526" y="250">The number describes no actual task</text>
  <text class="median-not-mean-desc median-not-mean-row median-not-mean-r3" x="526" y="284">Hides the shape entirely</text>
  <text class="median-not-mean-desc median-not-mean-row median-not-mean-r4" x="526" y="318">And is what most tools show by default</text>
  <text class="median-not-mean-sub" x="30" y="372">This is the third time this argument appears in the course — spend baselines, latency percentiles and now calibration — because the underlying condition is the same: durations and ratios are not symmetric.</text>
</svg>
