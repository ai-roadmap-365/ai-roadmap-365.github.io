<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each verifiable.">
  <title>Six gates before go-live</title>
  <style>
    .readiness-gates-bg   { fill: #f8fafc; }
    .readiness-gates-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readiness-gates-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readiness-gates-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readiness-gates-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readiness-gates-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readiness-gates-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .readiness-gates-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .readiness-gates-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .readiness-gates-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .readiness-gates-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .readiness-gates-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .readiness-gates-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .readiness-gates-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .readiness-gates-stage { opacity: 1; }

    .readiness-gates-s0 { animation-delay: 0.00s; }
    .readiness-gates-e0 { animation-delay: 0.00s; }
    .readiness-gates-s1 { animation-delay: 1.37s; }
    .readiness-gates-e1 { animation-delay: 1.37s; }
    .readiness-gates-s2 { animation-delay: 2.74s; }
    .readiness-gates-e2 { animation-delay: 2.74s; }
    .readiness-gates-s3 { animation-delay: 4.11s; }
    .readiness-gates-e3 { animation-delay: 4.11s; }
    .readiness-gates-s4 { animation-delay: 5.49s; }
    .readiness-gates-e4 { animation-delay: 5.49s; }
    .readiness-gates-s5 { animation-delay: 6.86s; }
    .readiness-gates-e5 { animation-delay: 6.86s; }
    @media (prefers-reduced-motion: no-preference) {
      .readiness-gates-conn  { animation: readiness-gates-trace 9.600000000000001s ease-in-out infinite; }
      .readiness-gates-stage { animation: readiness-gates-arrive 9.600000000000001s ease-in-out infinite; }
    }
    @keyframes readiness-gates-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes readiness-gates-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .readiness-gates-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .readiness-gates-stage { animation: readiness-gates-settle 9.600000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes readiness-gates-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="readiness-gates-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="readiness-gates-bg" width="980" height="322"/>
  <text class="readiness-gates-h1"  x="30" y="40">Six gates before go-live</text>
  <text class="readiness-gates-sub" x="30" y="64">Each verifiable.</text>
  <g class="readiness-gates-stage readiness-gates-s0">
    <rect class="readiness-gates-box" x="30" y="118" width="131" height="104" rx="10"/>
    <text class="readiness-gates-step" x="44" y="142">01</text>
    <text class="readiness-gates-name" x="70" y="142">Zero plaintext auth</text>
    <text class="readiness-gates-desc" x="44" y="166">Hashed keys; tenant</text>
    <text class="readiness-gates-desc" x="44" y="182">isolation enforced</text>
    <text class="readiness-gates-desc" x="44" y="198">at the query layer.</text>
  </g>
  <line class="readiness-gates-line readiness-gates-conn readiness-gates-e0" x1="163" y1="170" x2="185" y2="170" marker-end="url(#readiness-gates-tip)"/>
  <g class="readiness-gates-stage readiness-gates-s1">
    <rect class="readiness-gates-box" x="187" y="118" width="131" height="104" rx="10"/>
    <text class="readiness-gates-step" x="201" y="142">02</text>
    <text class="readiness-gates-name" x="227" y="142">Pre-authorisation holds</text>
    <text class="readiness-gates-desc" x="201" y="166">Reserved before</text>
    <text class="readiness-gates-desc" x="201" y="182">computation; settled</text>
    <text class="readiness-gates-desc" x="201" y="198">to micro-dollar</text>
  </g>
  <line class="readiness-gates-line readiness-gates-conn readiness-gates-e1" x1="320" y1="170" x2="342" y2="170" marker-end="url(#readiness-gates-tip)"/>
  <g class="readiness-gates-stage readiness-gates-s2">
    <rect class="readiness-gates-box" x="344" y="118" width="131" height="104" rx="10"/>
    <text class="readiness-gates-step" x="358" y="142">03</text>
    <text class="readiness-gates-name" x="384" y="142">Dual rate limits</text>
    <text class="readiness-gates-desc" x="358" y="166">Requests for</text>
    <text class="readiness-gates-desc" x="358" y="182">connections, tokens</text>
    <text class="readiness-gates-desc" x="358" y="198">for capacity.</text>
  </g>
  <line class="readiness-gates-line readiness-gates-conn readiness-gates-e2" x1="477" y1="170" x2="499" y2="170" marker-end="url(#readiness-gates-tip)"/>
  <g class="readiness-gates-stage readiness-gates-s3">
    <rect class="readiness-gates-warn" x="501" y="118" width="131" height="104" rx="10"/>
    <text class="readiness-gates-step" x="515" y="142">04</text>
    <text class="readiness-gates-name" x="541" y="142">Tenant-scoped caching</text>
    <text class="readiness-gates-desc" x="515" y="166">Both tiers. No</text>
    <text class="readiness-gates-desc" x="515" y="182">cross-tenant hits.</text>
  </g>
  <line class="readiness-gates-line readiness-gates-conn readiness-gates-e3" x1="634" y1="170" x2="656" y2="170" marker-end="url(#readiness-gates-tip)"/>
  <g class="readiness-gates-stage readiness-gates-s4">
    <rect class="readiness-gates-box" x="658" y="118" width="131" height="104" rx="10"/>
    <text class="readiness-gates-step" x="672" y="142">05</text>
    <text class="readiness-gates-name" x="698" y="142">Failover verified</text>
    <text class="readiness-gates-desc" x="672" y="166">Under simulated</text>
    <text class="readiness-gates-desc" x="672" y="182">503s, not in theory.</text>
    <text class="readiness-gates-edge" x="672" y="242">tested</text>
  </g>
  <line class="readiness-gates-line readiness-gates-conn readiness-gates-e4" x1="791" y1="170" x2="813" y2="170" marker-end="url(#readiness-gates-tip)"/>
  <g class="readiness-gates-stage readiness-gates-s5">
    <rect class="readiness-gates-good" x="815" y="118" width="131" height="104" rx="10"/>
    <text class="readiness-gates-step" x="829" y="142">06</text>
    <text class="readiness-gates-name" x="855" y="142">Client resilience</text>
    <text class="readiness-gates-desc" x="829" y="166">Streaming, markdown</text>
    <text class="readiness-gates-desc" x="829" y="182">safety, scroll</text>
    <text class="readiness-gates-desc" x="829" y="198">behaviour, abort.</text>
  </g>
  <text class="readiness-gates-sub" x="30" y="304">The fifth gate is the one usually accepted on configuration alone, and Day 342's chaos-injection argument applies: a failover path nobody has exercised is a hypothesis.</text>
</svg>
