<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Winters included.">
  <title>Four steps in machine learning</title>
  <style>
    .ml-history-bg   { fill: #f8fafc; }
    .ml-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ml-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ml-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ml-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ml-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ml-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ml-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ml-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ml-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ml-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ml-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ml-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .ml-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .ml-history-stage { opacity: 1; }

    .ml-history-s0 { animation-delay: 0.00s; }
    .ml-history-e0 { animation-delay: 0.00s; }
    .ml-history-s1 { animation-delay: 1.28s; }
    .ml-history-e1 { animation-delay: 1.28s; }
    .ml-history-s2 { animation-delay: 2.56s; }
    .ml-history-e2 { animation-delay: 2.56s; }
    .ml-history-s3 { animation-delay: 3.84s; }
    .ml-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .ml-history-conn  { animation: ml-history-trace 6.4s ease-in-out infinite; }
      .ml-history-stage { animation: ml-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes ml-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes ml-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .ml-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ml-history-stage { animation: ml-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes ml-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ml-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="ml-history-bg" width="980" height="322"/>
  <text class="ml-history-h1"  x="30" y="40">Four steps in machine learning</text>
  <text class="ml-history-sub" x="30" y="64">Winters included.</text>
  <g class="ml-history-stage ml-history-s0">
    <rect class="ml-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="ml-history-step" x="44" y="142">01</text>
    <text class="ml-history-name" x="70" y="142">Early learning machines</text>
    <text class="ml-history-desc" x="44" y="166">Which worked on toy problems and</text>
    <text class="ml-history-desc" x="44" y="182">were oversold.</text>
  </g>
  <line class="ml-history-line ml-history-conn ml-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#ml-history-tip)"/>
  <g class="ml-history-stage ml-history-s1">
    <rect class="ml-history-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="ml-history-step" x="280" y="142">02</text>
    <text class="ml-history-name" x="306" y="142">Symbolic and rule-based systems</text>
    <text class="ml-history-desc" x="280" y="166">Hand-written knowledge, which</text>
    <text class="ml-history-desc" x="280" y="182">did not scale.</text>
  </g>
  <line class="ml-history-line ml-history-conn ml-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#ml-history-tip)"/>
  <g class="ml-history-stage ml-history-s2">
    <rect class="ml-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="ml-history-step" x="516" y="142">03</text>
    <text class="ml-history-name" x="542" y="142">Statistical learning from data</text>
    <text class="ml-history-desc" x="516" y="166">Which is the framing this</text>
    <text class="ml-history-desc" x="516" y="182">curriculum uses.</text>
  </g>
  <line class="ml-history-line ml-history-conn ml-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#ml-history-tip)"/>
  <g class="ml-history-stage ml-history-s3">
    <rect class="ml-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="ml-history-step" x="752" y="142">04</text>
    <text class="ml-history-name" x="778" y="142">Then scale: more data, more compute, larger models</text>
    <text class="ml-history-desc" x="752" y="166">Which changed what was possible,</text>
    <text class="ml-history-desc" x="752" y="182">not what learning is.</text>
  </g>
  <text class="ml-history-sub" x="30" y="304">Each cycle of over-promising was followed by a funding collapse, which is worth knowing when evaluating current claims about the field.</text>
</svg>
