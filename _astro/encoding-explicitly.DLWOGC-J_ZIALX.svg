<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The default varies by platform, which is how mojibake arrives.">
  <title>Always pass encoding</title>
  <style>
    .encoding-explicitly-bg   { fill: #f8fafc; }
    .encoding-explicitly-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoding-explicitly-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoding-explicitly-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoding-explicitly-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoding-explicitly-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoding-explicitly-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .encoding-explicitly-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .encoding-explicitly-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .encoding-explicitly-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .encoding-explicitly-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .encoding-explicitly-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .encoding-explicitly-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .encoding-explicitly-row { opacity: 1; }
    .encoding-explicitly-r0 { animation-delay: 0.00s; }
    .encoding-explicitly-r1 { animation-delay: 0.45s; }
    .encoding-explicitly-r2 { animation-delay: 0.90s; }
    .encoding-explicitly-r3 { animation-delay: 1.35s; }
    .encoding-explicitly-r4 { animation-delay: 1.80s; }
    .encoding-explicitly-row { animation: encoding-explicitly-reveal 7.3s ease-in-out infinite; }
    @keyframes encoding-explicitly-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="encoding-explicitly-bg" width="980" height="390"/>
  <text class="encoding-explicitly-h1"  x="30" y="40">Always pass encoding</text>
  <text class="encoding-explicitly-sub" x="30" y="64">The default varies by platform, which is how mojibake arrives.</text>
  <rect class="encoding-explicitly-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="encoding-explicitly-name" x="46" y="122">open(p)</text>
  <text class="encoding-explicitly-desc" x="46" y="142">Whatever the platform decides.</text>
  <text class="encoding-explicitly-desc encoding-explicitly-row encoding-explicitly-r0" x="46" y="182">The default differs between systems</text>
  <text class="encoding-explicitly-desc encoding-explicitly-row encoding-explicitly-r1" x="46" y="216">Works on your machine, fails on a server</text>
  <text class="encoding-explicitly-desc encoding-explicitly-row encoding-explicitly-r2" x="46" y="250">Or worse: succeeds, and corrupts</text>
  <text class="encoding-explicitly-desc encoding-explicitly-row encoding-explicitly-r3" x="46" y="284">Day 5's mojibake, with no error raised</text>
  <text class="encoding-explicitly-desc encoding-explicitly-row encoding-explicitly-r4" x="46" y="318">A CI failure nobody can reproduce locally</text>
  <rect class="encoding-explicitly-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="encoding-explicitly-name" x="526" y="122">open(p, encoding="utf-8")</text>
  <text class="encoding-explicitly-desc" x="526" y="142">The same everywhere.</text>
  <text class="encoding-explicitly-desc encoding-explicitly-row encoding-explicitly-r0" x="526" y="182">Explicit, and portable</text>
  <text class="encoding-explicitly-desc encoding-explicitly-row encoding-explicitly-r1" x="526" y="216">Fails loudly on genuinely wrong bytes</text>
  <text class="encoding-explicitly-desc encoding-explicitly-row encoding-explicitly-r2" x="526" y="250">UTF-8 is the right default in 2026</text>
  <text class="encoding-explicitly-desc encoding-explicitly-row encoding-explicitly-r3" x="526" y="284">One keyword argument</text>
  <text class="encoding-explicitly-desc encoding-explicitly-row encoding-explicitly-r4" x="526" y="318">Do it every single time</text>
  <text class="encoding-explicitly-sub" x="30" y="372">The dangerous case is not the crash — it is the silent one, where the bytes are valid under the wrong encoding too and the corruption is discovered months later in the data.</text>
</svg>
