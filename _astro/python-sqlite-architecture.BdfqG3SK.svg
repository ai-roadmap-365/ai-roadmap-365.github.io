<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" width="1280" height="860" role="img" aria-labelledby="d090a-title d090a-desc">
  <title id="d090a-title">The layers between a Python program and a SQLite file, and the one band in which SQL is allowed to exist</title>
  <desc id="d090a-desc">A static architecture diagram read top to bottom: application code and domain objects, then the repository, then the connection and cursor, then the sqlite3 module, then the SQLite C library, then one database file. A shaded band marks the repository as the only layer in which a SQL statement may appear, and a left rail records what each layer is responsible for. Annotations mark where values are bound, where transactions are controlled, where foreign keys are switched on, and where storage errors are translated into domain errors.</desc>

  <style>
    .d090a-bg      { fill: #f8fafc; }
    .d090a-title   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 23px; font-weight: 600; fill: #1a202c; }
    .d090a-lede    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #334155; }
    .d090a-layer   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 18px; font-weight: 600; fill: #1a202c; }
    .d090a-sub     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d090a-mono    { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; fill: #1a202c; }
    .d090a-monosm  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #334155; }
    .d090a-box     { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d090a-sqlbox  { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 2; }
    .d090a-nosql   { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .d090a-file    { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .d090a-band    { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 1.5; stroke-dasharray: 8 5; }
    .d090a-rail    { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.5; }
    .d090a-arrow   { fill: none; stroke: #1d4ed8; stroke-width: 2.5; }
    .d090a-green   { fill: none; stroke: #047857; stroke-width: 2.5; }
    .d090a-accent  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #1d4ed8; }
    .d090a-warn    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #b91c1c; }
  </style>

  <rect class="d090a-bg" x="0" y="0" width="1280" height="860" />
  <text class="d090a-title" x="32" y="44">Your program, the module, the library, the file</text>
  <text class="d090a-lede" x="32" y="70">Read top to bottom. Every layer is inside one operating-system process: no server, no port, no network hop.</text>

  <defs>
    <marker id="d090a-arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
    <marker id="d090a-arrowgreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857" />
    </marker>
  </defs>

  <!-- the SQL band -->
  <rect class="d090a-band" x="352" y="268" width="600" height="118" rx="10" />
  <text class="d090a-accent" x="962" y="316">SQL lives here</text>
  <text class="d090a-sub" x="962" y="338">and nowhere above it.</text>
  <text class="d090a-sub" x="962" y="358">Every statement a literal,</text>
  <text class="d090a-sub" x="962" y="378">every value bound.</text>

  <!-- layer 1: application code -->
  <rect class="d090a-nosql" x="376" y="96" width="552" height="66" rx="8" />
  <text class="d090a-layer" x="652" y="126" text-anchor="middle">Application code</text>
  <text class="d090a-monosm" x="652" y="148" text-anchor="middle">report.py — asks for objects, formats them, prints. Imports no sqlite3.</text>

  <path class="d090a-arrow" d="M 652 162 L 652 186" marker-end="url(#d090a-arrowhead)" />

  <!-- layer 2: domain objects -->
  <rect class="d090a-nosql" x="376" y="190" width="552" height="66" rx="8" />
  <text class="d090a-layer" x="652" y="220" text-anchor="middle">Domain objects</text>
  <text class="d090a-monosm" x="652" y="242" text-anchor="middle">domain.py — Book, Member, Loan and their rules. Imports no sqlite3 either.</text>

  <path class="d090a-arrow" d="M 652 256 L 652 290" marker-end="url(#d090a-arrowhead)" />
  <text class="d090a-sub" x="668" y="278">Book objects up, Book objects down</text>

  <!-- layer 3: the repository (SQL allowed) -->
  <rect class="d090a-sqlbox" x="376" y="290" width="552" height="74" rx="8" />
  <text class="d090a-layer" x="652" y="318" text-anchor="middle">The repository — the only layer that writes SQL</text>
  <text class="d090a-monosm" x="652" y="340" text-anchor="middle">db.py — BookRepository, LoanRepository, row_to_book, transaction, connect</text>
  <text class="d090a-monosm" x="652" y="358" text-anchor="middle">"SELECT ... WHERE author = ?", (author,)</text>

  <path class="d090a-arrow" d="M 652 364 L 652 400" marker-end="url(#d090a-arrowhead)" />
  <text class="d090a-sub" x="668" y="388">statement + bound values</text>

  <!-- layer 4: connection and cursor -->
  <rect class="d090a-box" x="376" y="400" width="266" height="86" rx="8" />
  <text class="d090a-layer" x="509" y="428" text-anchor="middle">Connection</text>
  <text class="d090a-sub" x="509" y="450" text-anchor="middle">one open database, one</text>
  <text class="d090a-sub" x="509" y="468" text-anchor="middle">transaction at a time</text>

  <rect class="d090a-box" x="662" y="400" width="266" height="86" rx="8" />
  <text class="d090a-layer" x="795" y="428" text-anchor="middle">Cursor</text>
  <text class="d090a-sub" x="795" y="450" text-anchor="middle">one running statement and</text>
  <text class="d090a-sub" x="795" y="468" text-anchor="middle">a position in its rows</text>

  <path class="d090a-arrow" d="M 652 486 L 652 522" marker-end="url(#d090a-arrowhead)" />

  <!-- layer 5: the sqlite3 module -->
  <rect class="d090a-box" x="376" y="522" width="552" height="90" rx="8" />
  <text class="d090a-layer" x="652" y="550" text-anchor="middle">The sqlite3 module — Python's DB-API 2.0 wrapper</text>
  <text class="d090a-sub" x="652" y="572" text-anchor="middle">converts Python values to SQLite ones, binds them to the prepared statement,</text>
  <text class="d090a-sub" x="652" y="590" text-anchor="middle">manages or delegates transactions, and raises IntegrityError, OperationalError, ProgrammingError</text>

  <path class="d090a-arrow" d="M 652 612 L 652 648" marker-end="url(#d090a-arrowhead)" />

  <!-- layer 6: the C library -->
  <rect class="d090a-box" x="376" y="648" width="552" height="90" rx="8" />
  <text class="d090a-layer" x="652" y="676" text-anchor="middle">The SQLite C library, linked into this process</text>
  <text class="d090a-sub" x="652" y="698" text-anchor="middle">tokenizer, parser, planner, bytecode virtual machine, B-tree, pager, OS interface</text>
  <text class="d090a-sub" x="652" y="716" text-anchor="middle">the parser only ever sees the statement — never the values you bound</text>

  <path class="d090a-green" d="M 652 738 L 652 772" marker-end="url(#d090a-arrowgreen)" />

  <!-- layer 7: the file -->
  <rect class="d090a-file" x="376" y="772" width="552" height="60" rx="8" />
  <text class="d090a-layer" x="652" y="800" text-anchor="middle">library.db — one ordinary file</text>
  <text class="d090a-sub" x="652" y="820" text-anchor="middle">plus its rollback journal or write-ahead log</text>

  <!-- left rail: the four decisions -->
  <rect class="d090a-rail" x="32" y="96" width="316" height="360" rx="8" />
  <text class="d090a-layer" x="52" y="126">The four things connect() decides</text>
  <text class="d090a-sub" x="52" y="154">Each of these belongs to the CONNECTION,</text>
  <text class="d090a-sub" x="52" y="172">not to the file — so every connection has</text>
  <text class="d090a-sub" x="52" y="190">to make them again.</text>
  <text class="d090a-monosm" x="52" y="220">PRAGMA foreign_keys = ON</text>
  <text class="d090a-sub" x="52" y="238">off by default; a no-op inside a transaction</text>
  <text class="d090a-monosm" x="52" y="266">row_factory = sqlite3.Row</text>
  <text class="d090a-sub" x="52" y="284">rows by column name, not by position</text>
  <text class="d090a-monosm" x="52" y="312">isolation_level = None</text>
  <text class="d090a-sub" x="52" y="330">nothing opens a transaction behind your back</text>
  <text class="d090a-monosm" x="52" y="358">timeout = 5.0</text>
  <text class="d090a-sub" x="52" y="376">wait for the write lock rather than failing</text>
  <text class="d090a-sub" x="52" y="410">A connection is not thread-safe by default:</text>
  <text class="d090a-sub" x="52" y="428">give each thread its own, or serialise the</text>
  <text class="d090a-sub" x="52" y="446">writes yourself.</text>

  <!-- left rail: the boundary -->
  <rect class="d090a-rail" x="32" y="480" width="316" height="258" rx="8" />
  <text class="d090a-layer" x="52" y="510">What crosses the boundary</text>
  <text class="d090a-sub" x="52" y="538">Downwards: statements and bound values.</text>
  <text class="d090a-sub" x="52" y="556">Upwards: rows, turned into domain objects</text>
  <text class="d090a-sub" x="52" y="574">by one mapping function.</text>
  <text class="d090a-sub" x="52" y="602">Errors are translated on the way up too:</text>
  <text class="d090a-monosm" x="52" y="628">sqlite3.IntegrityError</text>
  <text class="d090a-sub" x="52" y="648">becomes</text>
  <text class="d090a-monosm" x="52" y="672">DuplicateTitle</text>
  <text class="d090a-sub" x="52" y="694">so nothing above the repository has to</text>
  <text class="d090a-sub" x="52" y="712">import sqlite3 to handle a taken title —</text>
  <text class="d090a-sub" x="52" y="730">and no schema detail leaks to the caller.</text>

  <!-- right rail: the rule -->
  <rect class="d090a-rail" x="962" y="400" width="286" height="338" rx="8" />
  <text class="d090a-layer" x="982" y="430">The rule, and why</text>
  <text class="d090a-warn" x="982" y="460">Never build a statement</text>
  <text class="d090a-warn" x="982" y="478">out of a string.</text>
  <text class="d090a-sub" x="982" y="506">A value inside the string is</text>
  <text class="d090a-sub" x="982" y="524">already part of the statement</text>
  <text class="d090a-sub" x="982" y="542">before the parser starts.</text>
  <text class="d090a-sub" x="982" y="570">A bound value is attached to</text>
  <text class="d090a-sub" x="982" y="588">a statement that is already</text>
  <text class="d090a-sub" x="982" y="606">compiled, so it cannot change</text>
  <text class="d090a-sub" x="982" y="624">the statement's shape.</text>
  <text class="d090a-sub" x="982" y="654">Placeholders stand in for</text>
  <text class="d090a-sub" x="982" y="672">VALUES only. For a column</text>
  <text class="d090a-sub" x="982" y="690">name that varies, choose from</text>
  <text class="d090a-sub" x="982" y="708">an allow-list you wrote.</text>

  <!-- right rail: what is absent -->
  <rect class="d090a-rail" x="962" y="96" width="286" height="150" rx="8" />
  <text class="d090a-layer" x="982" y="126">Deliberately absent</text>
  <text class="d090a-sub" x="982" y="154">no server process</text>
  <text class="d090a-sub" x="982" y="176">no socket, port or hostname</text>
  <text class="d090a-sub" x="982" y="198">no user account or password</text>
  <text class="d090a-sub" x="982" y="220">no configuration file</text>
  <text class="d090a-sub" x="982" y="240">your process's privileges are the database's</text>

  <text class="d090a-sub" x="962" y="772">The whole stack is a function call away:</text>
  <text class="d090a-sub" x="962" y="792">connection.execute() reaches the disk</text>
  <text class="d090a-sub" x="962" y="812">without leaving this process.</text>
</svg>
