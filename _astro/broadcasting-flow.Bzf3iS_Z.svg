<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" width="1000" height="820" role="img" aria-labelledby="d100f-title d100f-desc">
  <title id="d100f-title">Broadcasting a shape 4 array across a shape 3 by 4 array, the same attempt with a shape 3 array failing, and the rule that predicted both</title>
  <desc id="d100f-desc">The top half shows a 3 by 4 grid of real numbers with a 4-entry price vector being stretched across each of its three rows in turn, with the resulting products written out. The bottom half shows the same 3 by 4 grid with a 3-entry vector, the shapes failing to line up at the right-hand end, and the exact ValueError NumPy raises. Between them the shape rule is applied step by step to both cases. With motion disabled every number, shape, product and message is still shown.</desc>

  <style>
    .d100f-bg     { fill: #f8fafc; }
    .d100f-h1     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 21px; font-weight: 600; fill: #1a202c; }
    .d100f-h2     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 600; fill: #1d4ed8; }
    .d100f-h2r    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 600; fill: #b91c1c; }
    .d100f-label  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #1a202c; }
    .d100f-small  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d100f-num    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; fill: #1a202c; text-anchor: middle; }
    .d100f-numw   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; fill: #ffffff; text-anchor: middle; }
    .d100f-panel  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d100f-cell   { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
    .d100f-vec    { fill: #1d4ed8; stroke: #1d4ed8; stroke-width: 1; }
    .d100f-res    { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1; }
    .d100f-bad    { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.5; }
    .d100f-okbox  { fill: #dcfce7; stroke: #047857; stroke-width: 1.5; }

    /* Motion 3 — the three rows light up in turn as the stretched vector reaches them. */
    .d100f-band   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.5; animation: d100f-lift 6s ease-in-out infinite; }
    .d100f-b1 { animation-delay: 0.3s; }
    .d100f-b2 { animation-delay: 2.0s; }
    .d100f-b3 { animation-delay: 3.7s; }
    @keyframes d100f-lift {
      0%, 22%, 100% { fill: #eff6ff; }
      6%, 16%       { fill: #bfdbfe; }
    }

    /* Motion 1 — the smaller array slides down the rows, resting visible at row 0. */
    .d100f-slider { animation: d100f-drop 6s ease-in-out infinite; }
    @keyframes d100f-drop {
      0%,   22%  { transform: translateY(0); }
      33%,  55%  { transform: translateY(44px); }
      66%,  88%  { transform: translateY(88px); }
      100%       { transform: translateY(0); }
    }

    /* Motion 2 — the alignment wire flows from the vector towards the grid. */
    .d100f-wire {
      fill: none; stroke: #1d4ed8; stroke-width: 2.5;
      stroke-dasharray: 9 7; animation: d100f-march 1.6s linear infinite;
    }
    @keyframes d100f-march { to { stroke-dashoffset: -16; } }

    /* The failure case pulses gently rather than flashing. Rest state is fully legible. */
    .d100f-alarm { animation: d100f-pulse 4s ease-in-out infinite; }
    @keyframes d100f-pulse {
      0%, 60%, 100% { opacity: 0.9; }
      75%, 85%      { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d100f-band   { animation: none; fill: #eff6ff; }
      .d100f-slider { animation: none; transform: none; }
      .d100f-wire   { animation: none; stroke-dasharray: none; }
      .d100f-alarm  { animation: none; opacity: 1; }
    }
  </style>

  <defs>
    <marker id="d100f-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
  </defs>

  <rect class="d100f-bg" x="0" y="0" width="1000" height="820" />

  <text class="d100f-h1" x="30" y="40">Broadcasting: how a small array is stretched, and when it refuses</text>
  <text class="d100f-small" x="30" y="64">Nothing is copied. The stretching is a fiction kept up by reading the smaller array's memory more than once.</text>

  <!-- ================= CASE A: it works ================= -->
  <rect class="d100f-panel" x="24" y="82" width="952" height="272" rx="6" />
  <text class="d100f-h2" x="44" y="110">Case A — shape (3, 4) with shape (4,): the vector stretches down the rows</text>

  <!-- the matrix -->
  <text class="d100f-small" x="44" y="136">M, shape (3, 4)</text>
  <rect class="d100f-band d100f-b1" x="44" y="146" width="200" height="40" rx="3" />
  <rect class="d100f-band d100f-b2" x="44" y="190" width="200" height="40" rx="3" />
  <rect class="d100f-band d100f-b3" x="44" y="234" width="200" height="40" rx="3" />
  <text class="d100f-num" x="69" y="172">2</text>
  <text class="d100f-num" x="119" y="172">4</text>
  <text class="d100f-num" x="169" y="172">1</text>
  <text class="d100f-num" x="219" y="172">3</text>
  <text class="d100f-num" x="69" y="216">0</text>
  <text class="d100f-num" x="119" y="216">5</text>
  <text class="d100f-num" x="169" y="216">2</text>
  <text class="d100f-num" x="219" y="216">7</text>
  <text class="d100f-num" x="69" y="260">6</text>
  <text class="d100f-num" x="119" y="260">1</text>
  <text class="d100f-num" x="169" y="260">4</text>
  <text class="d100f-num" x="219" y="260">2</text>

  <!-- the operator -->
  <text class="d100f-h2" x="262" y="216">x</text>

  <!-- the travelling vector -->
  <text class="d100f-small" x="292" y="136">prices, shape (4,) — one array, three visits</text>
  <g class="d100f-slider">
    <rect class="d100f-vec" x="292" y="146" width="200" height="40" rx="3" />
    <text class="d100f-numw" x="317" y="172">10</text>
    <text class="d100f-numw" x="367" y="172">2</text>
    <text class="d100f-numw" x="417" y="172">5</text>
    <text class="d100f-numw" x="467" y="172">1</text>
    <path class="d100f-wire" d="M 500 166 L 540 166" marker-end="url(#d100f-arrow)" />
  </g>
  <text class="d100f-small" x="292" y="250">The same four numbers are used for</text>
  <text class="d100f-small" x="292" y="268">every row. No copy is ever made.</text>

  <!-- the result -->
  <text class="d100f-small" x="556" y="136">M * prices, shape (3, 4)</text>
  <rect class="d100f-res" x="556" y="146" width="240" height="40" rx="3" />
  <rect class="d100f-res" x="556" y="190" width="240" height="40" rx="3" />
  <rect class="d100f-res" x="556" y="234" width="240" height="40" rx="3" />
  <text class="d100f-num" x="586" y="172">20</text>
  <text class="d100f-num" x="646" y="172">8</text>
  <text class="d100f-num" x="706" y="172">5</text>
  <text class="d100f-num" x="766" y="172">3</text>
  <text class="d100f-num" x="586" y="216">0</text>
  <text class="d100f-num" x="646" y="216">10</text>
  <text class="d100f-num" x="706" y="216">10</text>
  <text class="d100f-num" x="766" y="216">7</text>
  <text class="d100f-num" x="586" y="260">60</text>
  <text class="d100f-num" x="646" y="260">2</text>
  <text class="d100f-num" x="706" y="260">20</text>
  <text class="d100f-num" x="766" y="260">2</text>

  <!-- the rule applied, case A -->
  <rect class="d100f-okbox" x="812" y="146" width="146" height="128" rx="5" />
  <text class="d100f-small" x="824" y="168">the rule, right to left</text>
  <text class="d100f-label" x="824" y="192">(3, 4)</text>
  <text class="d100f-label" x="824" y="212">(1, 4)  &lt;- padded</text>
  <text class="d100f-small" x="824" y="234">4 = 4, and 1 stretches</text>
  <text class="d100f-label" x="824" y="258">result (3, 4)</text>

  <text class="d100f-small" x="44" y="300">Read it as: the price vector was applied to EVERY row. Row 0 became 2, 4, 1, 3 times 10, 2, 5, 1, which is 20, 8, 5, 3.</text>
  <text class="d100f-small" x="44" y="322">numpy.broadcast_to(prices, (3, 4)) shows the fiction directly: it shares memory with prices, and it is read-only,</text>
  <text class="d100f-small" x="44" y="344">because a single write into it would appear in three places at once.</text>

  <!-- ================= CASE B: it fails ================= -->
  <rect class="d100f-panel" x="24" y="372" width="952" height="228" rx="6" />
  <text class="d100f-h2r" x="44" y="400">Case B — shape (3, 4) with shape (3,): the rule stops, and NumPy raises</text>

  <text class="d100f-small" x="44" y="426">M, shape (3, 4)</text>
  <rect class="d100f-cell" x="44" y="436" width="200" height="40" rx="3" />
  <rect class="d100f-cell" x="44" y="476" width="200" height="40" rx="3" />
  <rect class="d100f-cell" x="44" y="516" width="200" height="40" rx="3" />
  <text class="d100f-num" x="69" y="462">2</text>
  <text class="d100f-num" x="119" y="462">4</text>
  <text class="d100f-num" x="169" y="462">1</text>
  <text class="d100f-num" x="219" y="462">3</text>
  <text class="d100f-num" x="69" y="502">0</text>
  <text class="d100f-num" x="119" y="502">5</text>
  <text class="d100f-num" x="169" y="502">2</text>
  <text class="d100f-num" x="219" y="502">7</text>
  <text class="d100f-num" x="69" y="542">6</text>
  <text class="d100f-num" x="119" y="542">1</text>
  <text class="d100f-num" x="169" y="542">4</text>
  <text class="d100f-num" x="219" y="542">2</text>

  <text class="d100f-h2r" x="262" y="502">+</text>

  <text class="d100f-small" x="292" y="426">one value per mix, shape (3,)</text>
  <rect class="d100f-bad" x="292" y="436" width="150" height="40" rx="3" />
  <text class="d100f-num" x="317" y="462">100</text>
  <text class="d100f-num" x="367" y="462">200</text>
  <text class="d100f-num" x="417" y="462">300</text>
  <text class="d100f-small" x="292" y="500">Three numbers, and the matrix has</text>
  <text class="d100f-small" x="292" y="518">four columns. They cannot line up.</text>

  <rect class="d100f-bad d100f-alarm" x="462" y="436" width="240" height="128" rx="5" />
  <text class="d100f-small" x="476" y="458">the rule, right to left</text>
  <text class="d100f-label" x="476" y="482">(3, 4)</text>
  <text class="d100f-label" x="476" y="502">(1, 3)  &lt;- padded</text>
  <text class="d100f-small" x="476" y="524">last pair is 4 against 3:</text>
  <text class="d100f-small" x="476" y="542">not equal, neither is 1</text>
  <text class="d100f-h2r" x="476" y="560">STOP</text>

  <rect class="d100f-cell" x="716" y="436" width="242" height="128" rx="5" />
  <text class="d100f-small" x="728" y="458">what NumPy actually raises</text>
  <text class="d100f-label" x="728" y="484">ValueError</text>
  <text class="d100f-small" x="728" y="506">operands could not be</text>
  <text class="d100f-small" x="728" y="524">broadcast together with</text>
  <text class="d100f-small" x="728" y="542">shapes (3,4) (3,)</text>

  <text class="d100f-small" x="44" y="582">The fix is to say which axis you meant: per_mix.reshape(3, 1) has shape (3, 1), and 1 against 4 stretches — result (3, 4).</text>

  <!-- ================= the rule, stated ================= -->
  <rect class="d100f-panel" x="24" y="618" width="952" height="180" rx="6" />
  <text class="d100f-h2" x="44" y="646">The whole rule, in five lines — it predicted both cases above</text>
  <text class="d100f-label" x="44" y="674">1. Line the two shapes up from the RIGHT-hand end.</text>
  <text class="d100f-label" x="44" y="696">2. A missing entry on the left of the shorter shape counts as 1.</text>
  <text class="d100f-label" x="44" y="718">3. Two dimensions are compatible when they are equal, or one of them is 1.</text>
  <text class="d100f-label" x="44" y="740">4. If any pair is neither, the operation is a ValueError.</text>
  <text class="d100f-label" x="44" y="762">5. The result takes the larger of each pair.</text>
  <text class="d100f-small" x="44" y="786">Check before you trust: numpy.broadcast_shapes(a, b) answers the question without doing the work. Data is invented.</text>
</svg>
