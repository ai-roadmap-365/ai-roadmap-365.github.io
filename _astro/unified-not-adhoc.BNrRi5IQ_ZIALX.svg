<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One operational, one legal.">
  <title>Two things it never is</title>
  <style>
    .unified-not-adhoc-bg   { fill: #f8fafc; }
    .unified-not-adhoc-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unified-not-adhoc-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unified-not-adhoc-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unified-not-adhoc-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unified-not-adhoc-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unified-not-adhoc-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .unified-not-adhoc-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .unified-not-adhoc-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .unified-not-adhoc-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .unified-not-adhoc-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .unified-not-adhoc-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .unified-not-adhoc-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .unified-not-adhoc-row { opacity: 1; }
    .unified-not-adhoc-r0 { animation-delay: 0.00s; }
    .unified-not-adhoc-r1 { animation-delay: 0.45s; }
    .unified-not-adhoc-r2 { animation-delay: 0.90s; }
    .unified-not-adhoc-r3 { animation-delay: 1.35s; }
    .unified-not-adhoc-r4 { animation-delay: 1.80s; }
    .unified-not-adhoc-row { animation: unified-not-adhoc-reveal 7.3s ease-in-out infinite; }
    @keyframes unified-not-adhoc-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="unified-not-adhoc-bg" width="980" height="390"/>
  <text class="unified-not-adhoc-h1"  x="30" y="40">Two things it never is</text>
  <text class="unified-not-adhoc-sub" x="30" y="64">One operational, one legal.</text>
  <rect class="unified-not-adhoc-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="unified-not-adhoc-name" x="46" y="122">What it is</text>
  <text class="unified-not-adhoc-desc" x="46" y="142">Four properties.</text>
  <text class="unified-not-adhoc-desc unified-not-adhoc-row unified-not-adhoc-r0" x="46" y="182">A gateway owning routing, redaction and flags</text>
  <text class="unified-not-adhoc-desc unified-not-adhoc-row unified-not-adhoc-r1" x="46" y="216">GPU serving with batching and VRAM bounds</text>
  <text class="unified-not-adhoc-desc unified-not-adhoc-row unified-not-adhoc-r2" x="46" y="250">Percentile latency and token consumption</text>
  <text class="unified-not-adhoc-desc unified-not-adhoc-row unified-not-adhoc-r3" x="46" y="284">Self-healing breakers reverting to baseline</text>
  <text class="unified-not-adhoc-desc unified-not-adhoc-row unified-not-adhoc-r4" x="46" y="318">Everything correlated by trace ID</text>
  <rect class="unified-not-adhoc-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="unified-not-adhoc-name" x="526" y="122">What it is not</text>
  <text class="unified-not-adhoc-desc" x="526" y="142">Two failure patterns.</text>
  <text class="unified-not-adhoc-desc unified-not-adhoc-row unified-not-adhoc-r0" x="526" y="182">Unmonitored scripts on ad-hoc VMs</text>
  <text class="unified-not-adhoc-desc unified-not-adhoc-row unified-not-adhoc-r1" x="526" y="216">No rollback, so every incident is manual</text>
  <text class="unified-not-adhoc-desc unified-not-adhoc-row unified-not-adhoc-r2" x="526" y="250">Unencrypted secrets in log archives</text>
  <text class="unified-not-adhoc-desc unified-not-adhoc-row unified-not-adhoc-r3" x="526" y="284">Customer PII in permanent storage</text>
  <text class="unified-not-adhoc-desc unified-not-adhoc-row unified-not-adhoc-r4" x="526" y="318">Regulatory exposure that compounds</text>
  <text class="unified-not-adhoc-sub" x="30" y="372">The second column's rows tend to arrive together, because both come from the same decision: shipping the thing that works before deciding how it will be operated.</text>
</svg>
