<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what to do first.">
  <title>How much to augment</title>
  <style>
    .augmentation-when-bg   { fill: #f8fafc; }
    .augmentation-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .augmentation-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .augmentation-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .augmentation-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .augmentation-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .augmentation-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .augmentation-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .augmentation-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .augmentation-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .augmentation-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .augmentation-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .augmentation-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .augmentation-when-row { opacity: 1; }
    .augmentation-when-r0 { animation-delay: 0.00s; }
    .augmentation-when-r1 { animation-delay: 0.45s; }
    .augmentation-when-r2 { animation-delay: 0.90s; }
    .augmentation-when-r3 { animation-delay: 1.35s; }
    .augmentation-when-r4 { animation-delay: 1.80s; }
    .augmentation-when-row { animation: augmentation-when-reveal 7.3s ease-in-out infinite; }
    @keyframes augmentation-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="augmentation-when-bg" width="980" height="390"/>
  <text class="augmentation-when-h1"  x="30" y="40">How much to augment</text>
  <text class="augmentation-when-sub" x="30" y="64">And what to do first.</text>
  <rect class="augmentation-when-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="augmentation-when-name" x="46" y="122">Light</text>
  <text class="augmentation-when-desc" x="46" y="142">Large data, short training.</text>
  <text class="augmentation-when-desc augmentation-when-row augmentation-when-r0" x="46" y="182">Crop and horizontal flip</text>
  <text class="augmentation-when-desc augmentation-when-row augmentation-when-r1" x="46" y="216">Large datasets, where memorisation is harder</text>
  <text class="augmentation-when-desc augmentation-when-row augmentation-when-r2" x="46" y="250">Short training schedules</text>
  <text class="augmentation-when-desc augmentation-when-row augmentation-when-r3" x="46" y="284">Transfer learning on a frozen backbone</text>
  <text class="augmentation-when-desc augmentation-when-row augmentation-when-r4" x="46" y="318">Enough for many problems</text>
  <rect class="augmentation-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="augmentation-when-name" x="526" y="122">Heavy</text>
  <text class="augmentation-when-desc" x="526" y="142">Small data, long training.</text>
  <text class="augmentation-when-desc augmentation-when-row augmentation-when-r0" x="526" y="182">Automated policies, mixing, strong jitter</text>
  <text class="augmentation-when-desc augmentation-when-row augmentation-when-r1" x="526" y="216">Small datasets with a large model</text>
  <text class="augmentation-when-desc augmentation-when-row augmentation-when-r2" x="526" y="250">Long training schedules</text>
  <text class="augmentation-when-desc augmentation-when-row augmentation-when-r3" x="526" y="284">Where overfitting is visible in the curves</text>
  <text class="augmentation-when-desc augmentation-when-row augmentation-when-r4" x="526" y="318">Start light and increase if it overfits</text>
  <text class="augmentation-when-sub" x="30" y="372">Starting light and increasing is the right order because augmentation strength is diagnosable: a widening gap between training and validation accuracy is the signal to add more.</text>
</svg>
