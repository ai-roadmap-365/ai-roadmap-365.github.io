<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Human at both ends, agent in the middle.">
  <title>The six stages</title>
  <style>
    .six-stages-bg   { fill: #f8fafc; }
    .six-stages-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .six-stages-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .six-stages-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .six-stages-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .six-stages-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .six-stages-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .six-stages-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .six-stages-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .six-stages-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .six-stages-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .six-stages-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .six-stages-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .six-stages-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .six-stages-stage { opacity: 1; }

    .six-stages-s0 { animation-delay: 0.00s; }
    .six-stages-e0 { animation-delay: 0.00s; }
    .six-stages-s1 { animation-delay: 1.37s; }
    .six-stages-e1 { animation-delay: 1.37s; }
    .six-stages-s2 { animation-delay: 2.74s; }
    .six-stages-e2 { animation-delay: 2.74s; }
    .six-stages-s3 { animation-delay: 4.11s; }
    .six-stages-e3 { animation-delay: 4.11s; }
    .six-stages-s4 { animation-delay: 5.49s; }
    .six-stages-e4 { animation-delay: 5.49s; }
    .six-stages-s5 { animation-delay: 6.86s; }
    .six-stages-e5 { animation-delay: 6.86s; }
    @media (prefers-reduced-motion: no-preference) {
      .six-stages-conn  { animation: six-stages-trace 9.600000000000001s ease-in-out infinite; }
      .six-stages-stage { animation: six-stages-arrive 9.600000000000001s ease-in-out infinite; }
    }
    @keyframes six-stages-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes six-stages-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .six-stages-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .six-stages-stage { animation: six-stages-settle 9.600000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes six-stages-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="six-stages-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="six-stages-bg" width="980" height="322"/>
  <text class="six-stages-h1"  x="30" y="40">The six stages</text>
  <text class="six-stages-sub" x="30" y="64">Human at both ends, agent in the middle.</text>
  <g class="six-stages-stage six-stages-s0">
    <rect class="six-stages-box" x="30" y="118" width="131" height="104" rx="10"/>
    <text class="six-stages-step" x="44" y="142">01</text>
    <text class="six-stages-name" x="70" y="142">Specify</text>
    <text class="six-stages-desc" x="44" y="166">User story, schemas,</text>
    <text class="six-stages-desc" x="44" y="182">performance targets,</text>
    <text class="six-stages-desc" x="44" y="198">non-goals. Human.</text>
    <text class="six-stages-edge" x="44" y="242">human</text>
  </g>
  <line class="six-stages-line six-stages-conn six-stages-e0" x1="163" y1="170" x2="185" y2="170" marker-end="url(#six-stages-tip)"/>
  <g class="six-stages-stage six-stages-s1">
    <rect class="six-stages-warn" x="187" y="118" width="131" height="104" rx="10"/>
    <text class="six-stages-step" x="201" y="142">02</text>
    <text class="six-stages-name" x="227" y="142">Plan, then review</text>
    <text class="six-stages-desc" x="201" y="166">The agent proposes</text>
    <text class="six-stages-desc" x="201" y="182">files and changes;</text>
    <text class="six-stages-desc" x="201" y="198">you approve before</text>
    <text class="six-stages-edge" x="201" y="242">gate</text>
  </g>
  <line class="six-stages-line six-stages-conn six-stages-e1" x1="320" y1="170" x2="342" y2="170" marker-end="url(#six-stages-tip)"/>
  <g class="six-stages-stage six-stages-s2">
    <rect class="six-stages-box" x="344" y="118" width="131" height="104" rx="10"/>
    <text class="six-stages-step" x="358" y="142">03</text>
    <text class="six-stages-name" x="384" y="142">Failing tests</text>
    <text class="six-stages-desc" x="358" y="166">Red. The acceptance</text>
    <text class="six-stages-desc" x="358" y="182">criteria,</text>
    <text class="six-stages-desc" x="358" y="198">executable.</text>
  </g>
  <line class="six-stages-line six-stages-conn six-stages-e2" x1="477" y1="170" x2="499" y2="170" marker-end="url(#six-stages-tip)"/>
  <g class="six-stages-stage six-stages-s3">
    <rect class="six-stages-box" x="501" y="118" width="131" height="104" rx="10"/>
    <text class="six-stages-step" x="515" y="142">04</text>
    <text class="six-stages-name" x="541" y="142">Atomic implementation</text>
    <text class="six-stages-desc" x="515" y="166">Every layer changed</text>
    <text class="six-stages-desc" x="515" y="182">in one turn. Green.</text>
  </g>
  <line class="six-stages-line six-stages-conn six-stages-e3" x1="634" y1="170" x2="656" y2="170" marker-end="url(#six-stages-tip)"/>
  <g class="six-stages-stage six-stages-s4">
    <rect class="six-stages-box" x="658" y="118" width="131" height="104" rx="10"/>
    <text class="six-stages-step" x="672" y="142">05</text>
    <text class="six-stages-name" x="698" y="142">Quality gates</text>
    <text class="six-stages-desc" x="672" y="166">Types, lint and</text>
    <text class="six-stages-desc" x="672" y="182">security scans, with</text>
    <text class="six-stages-desc" x="672" y="198">a self-healing pass.</text>
  </g>
  <line class="six-stages-line six-stages-conn six-stages-e4" x1="791" y1="170" x2="813" y2="170" marker-end="url(#six-stages-tip)"/>
  <g class="six-stages-stage six-stages-s5">
    <rect class="six-stages-good" x="815" y="118" width="131" height="104" rx="10"/>
    <text class="six-stages-step" x="829" y="142">06</text>
    <text class="six-stages-name" x="855" y="142">Walkthrough and PR</text>
    <text class="six-stages-desc" x="829" y="166">Architecture</text>
    <text class="six-stages-desc" x="829" y="182">summary, file table,</text>
    <text class="six-stages-desc" x="829" y="198">test evidence. Human</text>
    <text class="six-stages-edge" x="829" y="242">human</text>
  </g>
  <text class="six-stages-sub" x="30" y="304">The two human stages bracket the process deliberately: requirements and architecture at the start, and judgement at the end, with everything mechanical in between.</text>
</svg>
