<svg role="img" aria-label="Taxonomy of 3D Parallelism showing Data Parallelism Tensor Parallelism and Pipeline Parallelism across multi-GPU clusters" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>3D Parallelism: Data, Tensor, and Pipeline Parallelism</title>
  <defs>
    <linearGradient id="bg234a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card234" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg234a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">3D PARALLELISM: SCALING TO THOUSANDS OF GPUS</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Data Parallelism (DDP/FSDP), Tensor Parallelism (TP), and Pipeline Parallelism (PP)</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card234)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- 1. Data Parallelism (DDP / FSDP) -->
    <rect x="25" y="25" width="220" height="255" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="135" y="50" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">1. Data Parallelism (DP)</text>
    <rect x="40" y="70" width="190" height="40" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="135" y="93" fill="#cbd5e1" font-size="9" text-anchor="middle">Shard Data Batch (B/N)</text>
    <rect x="40" y="120" width="190" height="40" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="135" y="143" fill="#cbd5e1" font-size="9" text-anchor="middle">Identical Model Replicas</text>
    <rect x="40" y="170" width="190" height="50" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="4"/>
    <text x="135" y="192" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">All-Reduce Gradients</text>
    <text x="135" y="210" fill="#94a3b8" font-size="8" text-anchor="middle">Syncs step across ranks</text>
    <text x="135" y="255" fill="#38bdf8" font-size="8" font-style="italic" text-anchor="middle">Best for models fitting on 1 GPU</text>

    <!-- 2. Tensor Parallelism (TP / Megatron-LM) -->
    <rect x="270" y="25" width="220" height="255" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="380" y="50" fill="#fbbf24" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">2. Tensor Parallelism (TP)</text>
    <rect x="285" y="70" width="190" height="40" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="380" y="93" fill="#cbd5e1" font-size="9" text-anchor="middle">Slice Weight Matrices</text>
    <rect x="285" y="120" width="190" height="40" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="380" y="143" fill="#cbd5e1" font-size="9" text-anchor="middle">Column &amp; Row Linear Slicing</text>
    <rect x="285" y="170" width="190" height="50" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" rx="4"/>
    <text x="380" y="192" fill="#fb7185" font-size="9" font-weight="700" text-anchor="middle">All-Reduce on NVLink</text>
    <text x="380" y="210" fill="#94a3b8" font-size="8" text-anchor="middle">Requires ~900 GB/s Interconnect</text>
    <text x="380" y="255" fill="#fbbf24" font-size="8" font-style="italic" text-anchor="middle">Intra-node (Within 8 GPUs)</text>

    <!-- 3. Pipeline Parallelism (PP / Megatron / DeepSpeed) -->
    <rect x="515" y="25" width="220" height="255" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" rx="6"/>
    <text x="625" y="50" fill="#c084fc" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">3. Pipeline Parallelism (PP)</text>
    <rect x="530" y="70" width="190" height="40" fill="#1e293b" stroke="#a855f7" rx="4"/>
    <text x="625" y="93" fill="#cbd5e1" font-size="9" text-anchor="middle">Partition Layers Across Nodes</text>
    <rect x="530" y="120" width="190" height="40" fill="#1e293b" stroke="#a855f7" rx="4"/>
    <text x="625" y="143" fill="#cbd5e1" font-size="9" text-anchor="middle">Micro-batches &amp; 1F1B Sched</text>
    <rect x="530" y="170" width="190" height="50" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="4"/>
    <text x="625" y="192" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">P2P Activation Passing</text>
    <text x="625" y="210" fill="#94a3b8" font-size="8" text-anchor="middle">Runs across InfiniBand network</text>
    <text x="625" y="255" fill="#c084fc" font-size="8" font-style="italic" text-anchor="middle">Inter-node (Across Pods)</text>
  </g>
</svg>
