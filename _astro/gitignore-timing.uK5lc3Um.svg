<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The rule that surprises everyone, exactly once.">
  <title>Why ignoring after the fact does nothing</title>
  <style>
    .gitignore-timing-bg   { fill: #f8fafc; }
    .gitignore-timing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gitignore-timing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gitignore-timing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gitignore-timing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gitignore-timing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gitignore-timing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gitignore-timing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gitignore-timing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gitignore-timing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gitignore-timing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gitignore-timing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gitignore-timing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .gitignore-timing-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .gitignore-timing-stage { opacity: 1; }

    .gitignore-timing-s0 { animation-delay: 0.00s; }
    .gitignore-timing-e0 { animation-delay: 0.00s; }
    .gitignore-timing-s1 { animation-delay: 1.28s; }
    .gitignore-timing-e1 { animation-delay: 1.28s; }
    .gitignore-timing-s2 { animation-delay: 2.56s; }
    .gitignore-timing-e2 { animation-delay: 2.56s; }
    .gitignore-timing-s3 { animation-delay: 3.84s; }
    .gitignore-timing-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .gitignore-timing-conn  { animation: gitignore-timing-trace 6.4s ease-in-out infinite; }
      .gitignore-timing-stage { animation: gitignore-timing-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes gitignore-timing-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes gitignore-timing-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .gitignore-timing-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .gitignore-timing-stage { animation: gitignore-timing-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes gitignore-timing-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="gitignore-timing-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="gitignore-timing-bg" width="980" height="322"/>
  <text class="gitignore-timing-h1"  x="30" y="40">Why ignoring after the fact does nothing</text>
  <text class="gitignore-timing-sub" x="30" y="64">The rule that surprises everyone, exactly once.</text>
  <g class="gitignore-timing-stage gitignore-timing-s0">
    <rect class="gitignore-timing-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="gitignore-timing-step" x="44" y="142">01</text>
    <text class="gitignore-timing-name" x="70" y="142">The file gets committed</text>
    <text class="gitignore-timing-desc" x="44" y="166">Perhaps by git add . , perhaps</text>
    <text class="gitignore-timing-desc" x="44" y="182">deliberately. It is now tracked.</text>
  </g>
  <line class="gitignore-timing-line gitignore-timing-conn gitignore-timing-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#gitignore-timing-tip)"/>
  <g class="gitignore-timing-stage gitignore-timing-s1">
    <rect class="gitignore-timing-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="gitignore-timing-step" x="280" y="142">02</text>
    <text class="gitignore-timing-name" x="306" y="142">You add it to .gitignore</text>
    <text class="gitignore-timing-desc" x="280" y="166">And nothing changes. Git still</text>
    <text class="gitignore-timing-desc" x="280" y="182">reports every edit to it.</text>
  </g>
  <line class="gitignore-timing-line gitignore-timing-conn gitignore-timing-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#gitignore-timing-tip)"/>
  <g class="gitignore-timing-stage gitignore-timing-s2">
    <rect class="gitignore-timing-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="gitignore-timing-step" x="516" y="142">03</text>
    <text class="gitignore-timing-name" x="542" y="142">Because ignoring only prevents tracking</text>
    <text class="gitignore-timing-desc" x="516" y="166">It is not consulted for files</text>
    <text class="gitignore-timing-desc" x="516" y="182">Git is already recording.</text>
  </g>
  <line class="gitignore-timing-line gitignore-timing-conn gitignore-timing-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#gitignore-timing-tip)"/>
  <g class="gitignore-timing-stage gitignore-timing-s3">
    <rect class="gitignore-timing-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="gitignore-timing-step" x="752" y="142">04</text>
    <text class="gitignore-timing-name" x="778" y="142">git rm --cached is the fix</text>
    <text class="gitignore-timing-desc" x="752" y="166">Untrack it, keep it on disk. NOW</text>
    <text class="gitignore-timing-desc" x="752" y="182">the ignore rule applies.</text>
    <text class="gitignore-timing-edge" x="752" y="242">--cached</text>
  </g>
  <text class="gitignore-timing-sub" x="30" y="304">And the file remains in every commit that already contained it. For a secret, this is why the answer is revocation rather than removal — the history is not changed by any of this.</text>
</svg>
