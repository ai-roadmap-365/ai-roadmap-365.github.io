<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And the gauge that does not exist.">
  <title>The instruments in a car</title>
  <style>
    .car-instruments-bg   { fill: #f8fafc; }
    .car-instruments-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .car-instruments-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .car-instruments-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .car-instruments-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .car-instruments-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .car-instruments-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .car-instruments-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .car-instruments-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .car-instruments-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .car-instruments-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .car-instruments-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .car-instruments-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .car-instruments-row { opacity: 1; }
    .car-instruments-r0 { animation-delay: 0.00s; }
    .car-instruments-r1 { animation-delay: 0.45s; }
    .car-instruments-r2 { animation-delay: 0.90s; }
    .car-instruments-r3 { animation-delay: 1.35s; }
    .car-instruments-r4 { animation-delay: 1.80s; }
    .car-instruments-row { animation: car-instruments-reveal 7.3s ease-in-out infinite; }
    @keyframes car-instruments-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="car-instruments-bg" width="980" height="390"/>
  <text class="car-instruments-h1"  x="30" y="40">The instruments in a car</text>
  <text class="car-instruments-sub" x="30" y="64">And the gauge that does not exist.</text>
  <rect class="car-instruments-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="car-instruments-name" x="46" y="122">The gauges you have</text>
  <text class="car-instruments-desc" x="46" y="142">Three of the four.</text>
  <text class="car-instruments-desc car-instruments-row car-instruments-r0" x="46" y="182">Speedometer: availability, obvious and instant</text>
  <text class="car-instruments-desc car-instruments-row car-instruments-r1" x="46" y="216">Temperature: latency, where the spike matters</text>
  <text class="car-instruments-desc car-instruments-row car-instruments-r2" x="46" y="250">Fuel: cost, where the rate matters</text>
  <text class="car-instruments-desc car-instruments-row car-instruments-r3" x="46" y="284">All three can read perfectly</text>
  <text class="car-instruments-desc car-instruments-row car-instruments-r4" x="46" y="318">And the journey can still be wrong</text>
  <rect class="car-instruments-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="car-instruments-name" x="526" y="122">The gauge you do not</text>
  <text class="car-instruments-desc" x="526" y="142">Quality.</text>
  <text class="car-instruments-desc car-instruments-row car-instruments-r0" x="526" y="182">Nothing says you are driving efficiently</text>
  <text class="car-instruments-desc car-instruments-row car-instruments-r1" x="526" y="216">Nothing says you are comfortable</text>
  <text class="car-instruments-desc car-instruments-row car-instruments-r2" x="526" y="250">Nothing says the destination is right</text>
  <text class="car-instruments-desc car-instruments-row car-instruments-r3" x="526" y="284">Availability green, latency green, cost green</text>
  <text class="car-instruments-desc car-instruments-row car-instruments-r4" x="526" y="318">And every answer invented</text>
  <text class="car-instruments-sub" x="30" y="372">The right-hand column is the AI-specific failure mode in one sentence: every instrument reading correctly while the vehicle drives confidently in the wrong direction.</text>
</svg>
