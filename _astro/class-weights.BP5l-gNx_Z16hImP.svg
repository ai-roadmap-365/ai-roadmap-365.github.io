<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Reweighting the loss</title>
  <style>
    .class-weights-bg   { fill: #f8fafc; }
    .class-weights-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .class-weights-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .class-weights-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .class-weights-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .class-weights-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .class-weights-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .class-weights-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .class-weights-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .class-weights-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .class-weights-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .class-weights-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .class-weights-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .class-weights-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .class-weights-stage { opacity: 1; }

    .class-weights-s0 { animation-delay: 0.00s; }
    .class-weights-e0 { animation-delay: 0.00s; }
    .class-weights-s1 { animation-delay: 1.28s; }
    .class-weights-e1 { animation-delay: 1.28s; }
    .class-weights-s2 { animation-delay: 2.56s; }
    .class-weights-e2 { animation-delay: 2.56s; }
    .class-weights-s3 { animation-delay: 3.84s; }
    .class-weights-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .class-weights-conn  { animation: class-weights-trace 6.4s ease-in-out infinite; }
      .class-weights-stage { animation: class-weights-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes class-weights-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes class-weights-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .class-weights-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .class-weights-stage { animation: class-weights-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes class-weights-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="class-weights-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="class-weights-bg" width="980" height="322"/>
  <text class="class-weights-h1"  x="30" y="40">Reweighting the loss</text>
  <text class="class-weights-sub" x="30" y="64">Four steps.</text>
  <g class="class-weights-stage class-weights-s0">
    <rect class="class-weights-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="class-weights-step" x="44" y="142">01</text>
    <text class="class-weights-name" x="70" y="142">Give each class a weight inversely proportional to its frequency</text>
    <text class="class-weights-desc" x="44" y="166">So the rare class weighs more</text>
    <text class="class-weights-desc" x="44" y="182">per example.</text>
  </g>
  <line class="class-weights-line class-weights-conn class-weights-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#class-weights-tip)"/>
  <g class="class-weights-stage class-weights-s1">
    <rect class="class-weights-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="class-weights-step" x="280" y="142">02</text>
    <text class="class-weights-name" x="306" y="142">Which makes both classes contribute equally to the loss</text>
    <text class="class-weights-desc" x="280" y="166">Regardless of how many examples</text>
    <text class="class-weights-desc" x="280" y="182">each has.</text>
  </g>
  <line class="class-weights-line class-weights-conn class-weights-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#class-weights-tip)"/>
  <g class="class-weights-stage class-weights-s2">
    <rect class="class-weights-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="class-weights-step" x="516" y="142">03</text>
    <text class="class-weights-name" x="542" y="142">So gradients from rare examples are no longer drowned</text>
    <text class="class-weights-desc" x="516" y="166">And the model learns them.</text>
  </g>
  <line class="class-weights-line class-weights-conn class-weights-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#class-weights-tip)"/>
  <g class="class-weights-stage class-weights-s3">
    <rect class="class-weights-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="class-weights-step" x="752" y="142">04</text>
    <text class="class-weights-name" x="778" y="142">With no change to the data at all</text>
    <text class="class-weights-desc" x="752" y="166">Which is why this is the safest</text>
    <text class="class-weights-desc" x="752" y="182">option.</text>
    <text class="class-weights-edge" x="752" y="242">one parameter</text>
  </g>
  <text class="class-weights-sub" x="30" y="304">Leaving the data untouched is the practical advantage: nothing is duplicated or discarded, so there is no way to leak between splits.</text>
</svg>
