<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Not only a release mechanism.">
  <title>Flags as a runtime control</title>
  <style>
    .flags-as-guardrails-bg   { fill: #f8fafc; }
    .flags-as-guardrails-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .flags-as-guardrails-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .flags-as-guardrails-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .flags-as-guardrails-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .flags-as-guardrails-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .flags-as-guardrails-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .flags-as-guardrails-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .flags-as-guardrails-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .flags-as-guardrails-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .flags-as-guardrails-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .flags-as-guardrails-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .flags-as-guardrails-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .flags-as-guardrails-row { opacity: 1; }
    .flags-as-guardrails-r0 { animation-delay: 0.00s; }
    .flags-as-guardrails-r1 { animation-delay: 0.45s; }
    .flags-as-guardrails-r2 { animation-delay: 0.90s; }
    .flags-as-guardrails-r3 { animation-delay: 1.35s; }
    .flags-as-guardrails-r4 { animation-delay: 1.80s; }
    .flags-as-guardrails-row { animation: flags-as-guardrails-reveal 7.3s ease-in-out infinite; }
    @keyframes flags-as-guardrails-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="flags-as-guardrails-bg" width="980" height="390"/>
  <text class="flags-as-guardrails-h1"  x="30" y="40">Flags as a runtime control</text>
  <text class="flags-as-guardrails-sub" x="30" y="64">Not only a release mechanism.</text>
  <rect class="flags-as-guardrails-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="flags-as-guardrails-name" x="46" y="122">For releases</text>
  <text class="flags-as-guardrails-desc" x="46" y="142">The familiar use.</text>
  <text class="flags-as-guardrails-desc flags-as-guardrails-row flags-as-guardrails-r0" x="46" y="182">Route a percentage to a candidate</text>
  <text class="flags-as-guardrails-desc flags-as-guardrails-row flags-as-guardrails-r1" x="46" y="216">Ramp on evidence</text>
  <text class="flags-as-guardrails-desc flags-as-guardrails-row flags-as-guardrails-r2" x="46" y="250">Roll back without a deploy</text>
  <text class="flags-as-guardrails-desc flags-as-guardrails-row flags-as-guardrails-r3" x="46" y="284">Separate deploy from release</text>
  <text class="flags-as-guardrails-desc flags-as-guardrails-row flags-as-guardrails-r4" x="46" y="318">Day 359's separation, implemented</text>
  <rect class="flags-as-guardrails-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="flags-as-guardrails-name" x="526" y="122">As guardrails</text>
  <text class="flags-as-guardrails-desc" x="526" y="142">Runtime policy.</text>
  <text class="flags-as-guardrails-desc flags-as-guardrails-row flags-as-guardrails-r0" x="526" y="182">Tighten moderation thresholds during breaking news</text>
  <text class="flags-as-guardrails-desc flags-as-guardrails-row flags-as-guardrails-r1" x="526" y="216">Drop the context window from 16k to 8k under pressure</text>
  <text class="flags-as-guardrails-desc flags-as-guardrails-row flags-as-guardrails-r2" x="526" y="250">Shed non-enterprise load first</text>
  <text class="flags-as-guardrails-desc flags-as-guardrails-row flags-as-guardrails-r3" x="526" y="284">No redeploy, no restart</text>
  <text class="flags-as-guardrails-desc flags-as-guardrails-row flags-as-guardrails-r4" x="526" y="318">Seconds rather than a pipeline</text>
  <text class="flags-as-guardrails-sub" x="30" y="372">The right-hand column turns a flag system into a capacity control, which is worth building deliberately: the ability to shed load by policy is much cheaper than the ability to add capacity by scaling.</text>
</svg>
