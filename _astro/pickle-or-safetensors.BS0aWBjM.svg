<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One is a program; one is data.">
  <title>Pickle against SafeTensors</title>
  <style>
    .pickle-or-safetensors-bg   { fill: #f8fafc; }
    .pickle-or-safetensors-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pickle-or-safetensors-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pickle-or-safetensors-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pickle-or-safetensors-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pickle-or-safetensors-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pickle-or-safetensors-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pickle-or-safetensors-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pickle-or-safetensors-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pickle-or-safetensors-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pickle-or-safetensors-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pickle-or-safetensors-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pickle-or-safetensors-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pickle-or-safetensors-row { opacity: 1; }
    .pickle-or-safetensors-r0 { animation-delay: 0.00s; }
    .pickle-or-safetensors-r1 { animation-delay: 0.45s; }
    .pickle-or-safetensors-r2 { animation-delay: 0.90s; }
    .pickle-or-safetensors-r3 { animation-delay: 1.35s; }
    .pickle-or-safetensors-r4 { animation-delay: 1.80s; }
    .pickle-or-safetensors-row { animation: pickle-or-safetensors-reveal 7.3s ease-in-out infinite; }
    @keyframes pickle-or-safetensors-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="pickle-or-safetensors-bg" width="980" height="390"/>
  <text class="pickle-or-safetensors-h1"  x="30" y="40">Pickle against SafeTensors</text>
  <text class="pickle-or-safetensors-sub" x="30" y="64">One is a program; one is data.</text>
  <rect class="pickle-or-safetensors-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="pickle-or-safetensors-name" x="46" y="122">Pickle</text>
  <text class="pickle-or-safetensors-desc" x="46" y="142">Executes on load.</text>
  <text class="pickle-or-safetensors-desc pickle-or-safetensors-row pickle-or-safetensors-r0" x="46" y="182">Arbitrary bytecode via __reduce__</text>
  <text class="pickle-or-safetensors-desc pickle-or-safetensors-row pickle-or-safetensors-r1" x="46" y="216">Runs the moment torch.load touches it</text>
  <text class="pickle-or-safetensors-desc pickle-or-safetensors-row pickle-or-safetensors-r2" x="46" y="250">map_location='cpu' does not help</text>
  <text class="pickle-or-safetensors-desc pickle-or-safetensors-row pickle-or-safetensors-r3" x="46" y="284">Historically 40%+ of public checkpoints</text>
  <text class="pickle-or-safetensors-desc pickle-or-safetensors-row pickle-or-safetensors-r4" x="46" y="318">Weaponised examples stole AWS credentials</text>
  <rect class="pickle-or-safetensors-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="pickle-or-safetensors-name" x="526" y="122">SafeTensors</text>
  <text class="pickle-or-safetensors-desc" x="526" y="142">Parsed, never executed.</text>
  <text class="pickle-or-safetensors-desc pickle-or-safetensors-row pickle-or-safetensors-r0" x="526" y="182">8-byte length, JSON header, raw buffers</text>
  <text class="pickle-or-safetensors-desc pickle-or-safetensors-row pickle-or-safetensors-r1" x="526" y="216">mmap straight into CPU or GPU memory</text>
  <text class="pickle-or-safetensors-desc pickle-or-safetensors-row pickle-or-safetensors-r2" x="526" y="250">No Python object instantiation at all</text>
  <text class="pickle-or-safetensors-desc pickle-or-safetensors-row pickle-or-safetensors-r3" x="526" y="284">Up to 4x faster to load</text>
  <text class="pickle-or-safetensors-desc pickle-or-safetensors-row pickle-or-safetensors-r4" x="526" y="318">90-second cold start becomes under 15</text>
  <text class="pickle-or-safetensors-sub" x="30" y="372">`map_location='cpu'` is the specific misconception worth naming: it controls where tensors land, and the pickle opcodes have already executed by the time that matters.</text>
</svg>
