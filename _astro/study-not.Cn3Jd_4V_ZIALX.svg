<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things an exploratory study is not</title>
  <style>
    .study-not-bg   { fill: #f8fafc; }
    .study-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .study-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .study-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .study-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .study-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .study-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .study-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .study-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .study-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .study-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .study-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .study-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .study-not-row { opacity: 1; }
    .study-not-r0 { animation-delay: 0.00s; }
    .study-not-r1 { animation-delay: 0.45s; }
    .study-not-r2 { animation-delay: 0.90s; }
    .study-not-r3 { animation-delay: 1.35s; }
    .study-not-r4 { animation-delay: 1.80s; }
    .study-not-row { animation: study-not-reveal 7.3s ease-in-out infinite; }
    @keyframes study-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="study-not-bg" width="980" height="390"/>
  <text class="study-not-h1"  x="30" y="40">Four things an exploratory study is not</text>
  <text class="study-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="study-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="study-not-name" x="46" y="122">The misconception</text>
  <text class="study-not-desc" x="46" y="142">Commonly held.</text>
  <text class="study-not-desc study-not-row study-not-r0" x="46" y="182">It establishes causation</text>
  <text class="study-not-desc study-not-row study-not-r1" x="46" y="216">A striking finding is the best finding</text>
  <text class="study-not-desc study-not-row study-not-r2" x="46" y="250">It is finished when the analysis runs</text>
  <text class="study-not-desc study-not-row study-not-r3" x="46" y="284">The data speaks for itself</text>
  <text class="study-not-desc study-not-row study-not-r4" x="46" y="318">Negative results are failures</text>
  <rect class="study-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="study-not-name" x="526" y="122">What is true</text>
  <text class="study-not-desc" x="526" y="142">Actually.</text>
  <text class="study-not-desc study-not-row study-not-r0" x="526" y="182">It generates hypotheses to test</text>
  <text class="study-not-desc study-not-row study-not-r1" x="526" y="216">The most defensible one is</text>
  <text class="study-not-desc study-not-row study-not-r2" x="526" y="250">It is finished when it can be rerun and read</text>
  <text class="study-not-desc study-not-row study-not-r3" x="526" y="284">Every step involved a choice</text>
  <text class="study-not-desc study-not-row study-not-r4" x="526" y="318">They are results, and worth reporting</text>
  <text class="study-not-sub" x="30" y="372">Negative results being genuine results is worth internalising early, since a well-conducted study that found nothing has still answered the question asked.</text>
</svg>
