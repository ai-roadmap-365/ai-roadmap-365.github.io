<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Nothing is remembered.">
  <title>A letter, not a phone call</title>
  <style>
    .phone-call-bg   { fill: #f8fafc; }
    .phone-call-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .phone-call-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .phone-call-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .phone-call-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .phone-call-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .phone-call-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .phone-call-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .phone-call-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .phone-call-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .phone-call-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .phone-call-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .phone-call-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .phone-call-row { opacity: 1; }
    .phone-call-r0 { animation-delay: 0.00s; }
    .phone-call-r1 { animation-delay: 0.45s; }
    .phone-call-r2 { animation-delay: 0.90s; }
    .phone-call-r3 { animation-delay: 1.35s; }
    .phone-call-r4 { animation-delay: 1.80s; }
    .phone-call-row { animation: phone-call-reveal 7.3s ease-in-out infinite; }
    @keyframes phone-call-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="phone-call-bg" width="980" height="390"/>
  <text class="phone-call-h1"  x="30" y="40">A letter, not a phone call</text>
  <text class="phone-call-sub" x="30" y="64">Nothing is remembered.</text>
  <rect class="phone-call-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="phone-call-name" x="46" y="122">A phone call</text>
  <text class="phone-call-desc" x="46" y="142">Context is held.</text>
  <text class="phone-call-desc phone-call-row phone-call-r0" x="46" y="182">Both sides remember what was said</text>
  <text class="phone-call-desc phone-call-row phone-call-r1" x="46" y="216">Only the new part is spoken</text>
  <text class="phone-call-desc phone-call-row phone-call-r2" x="46" y="250">The line stays open</text>
  <text class="phone-call-desc phone-call-row phone-call-r3" x="46" y="284">State lives in the connection</text>
  <text class="phone-call-desc phone-call-row phone-call-r4" x="46" y="318">This is not how the API works</text>
  <rect class="phone-call-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="phone-call-name" x="526" y="122">A letter</text>
  <text class="phone-call-desc" x="526" y="142">Nothing is held.</text>
  <text class="phone-call-desc phone-call-row phone-call-r0" x="526" y="182">Each one must contain everything</text>
  <text class="phone-call-desc phone-call-row phone-call-r1" x="526" y="216">The whole history re-sent</text>
  <text class="phone-call-desc phone-call-row phone-call-r2" x="526" y="250">No connection between them</text>
  <text class="phone-call-desc phone-call-row phone-call-r3" x="526" y="284">State lives in your application</text>
  <text class="phone-call-desc phone-call-row phone-call-r4" x="526" y="318">This is how the API works</text>
  <text class="phone-call-sub" x="30" y="372">Everything about cost, context limits and conversation management follows from this one property, which is why it is worth being explicit about early.</text>
</svg>
