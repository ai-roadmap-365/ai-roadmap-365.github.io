<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One refreshes the catalogue. One changes your machine.">
  <title>update and upgrade are not the same word</title>
  <style>
    .update-versus-upgrade-bg   { fill: #f8fafc; }
    .update-versus-upgrade-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .update-versus-upgrade-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .update-versus-upgrade-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .update-versus-upgrade-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .update-versus-upgrade-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .update-versus-upgrade-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .update-versus-upgrade-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .update-versus-upgrade-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .update-versus-upgrade-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .update-versus-upgrade-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .update-versus-upgrade-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .update-versus-upgrade-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .update-versus-upgrade-row { opacity: 1; }
    .update-versus-upgrade-r0 { animation-delay: 0.00s; }
    .update-versus-upgrade-r1 { animation-delay: 0.45s; }
    .update-versus-upgrade-r2 { animation-delay: 0.90s; }
    .update-versus-upgrade-r3 { animation-delay: 1.35s; }
    .update-versus-upgrade-r4 { animation-delay: 1.80s; }
    .update-versus-upgrade-row { animation: update-versus-upgrade-reveal 7.3s ease-in-out infinite; }
    @keyframes update-versus-upgrade-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="update-versus-upgrade-bg" width="980" height="390"/>
  <text class="update-versus-upgrade-h1"  x="30" y="40">update and upgrade are not the same word</text>
  <text class="update-versus-upgrade-sub" x="30" y="64">One refreshes the catalogue. One changes your machine.</text>
  <rect class="update-versus-upgrade-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="update-versus-upgrade-name" x="46" y="122">apt update</text>
  <text class="update-versus-upgrade-desc" x="46" y="142">Refreshes the local copy of the index.</text>
  <text class="update-versus-upgrade-desc update-versus-upgrade-row update-versus-upgrade-r0" x="46" y="182">Downloads the catalogue, not the software</text>
  <text class="update-versus-upgrade-desc update-versus-upgrade-row update-versus-upgrade-r1" x="46" y="216">Nothing installed changes</text>
  <text class="update-versus-upgrade-desc update-versus-upgrade-row update-versus-upgrade-r2" x="46" y="250">Fast, and safe to run any time</text>
  <text class="update-versus-upgrade-desc update-versus-upgrade-row update-versus-upgrade-r3" x="46" y="284">Without it, you resolve against stale data</text>
  <text class="update-versus-upgrade-desc update-versus-upgrade-row update-versus-upgrade-r4" x="46" y="318">Homebrew's equivalent is brew update</text>
  <rect class="update-versus-upgrade-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="update-versus-upgrade-name" x="526" y="122">apt upgrade</text>
  <text class="update-versus-upgrade-desc" x="526" y="142">Installs newer versions of what you have.</text>
  <text class="update-versus-upgrade-desc update-versus-upgrade-row update-versus-upgrade-r0" x="526" y="182">Actually changes installed software</text>
  <text class="update-versus-upgrade-desc update-versus-upgrade-row update-versus-upgrade-r1" x="526" y="216">Resolves against whatever the index says now</text>
  <text class="update-versus-upgrade-desc update-versus-upgrade-row update-versus-upgrade-r2" x="526" y="250">Can take a long time</text>
  <text class="update-versus-upgrade-desc update-versus-upgrade-row update-versus-upgrade-r3" x="526" y="284">Read what it proposes before agreeing</text>
  <text class="update-versus-upgrade-desc update-versus-upgrade-row update-versus-upgrade-r4" x="526" y="318">Homebrew's equivalent is brew upgrade</text>
  <text class="update-versus-upgrade-sub" x="30" y="372">Running upgrade without update first is near-universal, and it silently upgrades to whatever was current the last time you refreshed — possibly months ago.</text>
</svg>
