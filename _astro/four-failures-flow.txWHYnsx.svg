<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" role="img" aria-labelledby="d148f-title d148f-desc" width="1040" height="660">
  <title id="d148f-title">One fitted line, checked four ways, each catching a failure the R-squared alone missed</title>
  <desc id="d148f-desc">A pipeline showing one fitted line passing through four diagnostic checks in sequence: curvature, heteroscedasticity, leverage and a forced-zero intercept, each reporting the number it measured.</desc>
  <style>
    .d148f-bg { fill: #f8fafc; }
    .d148f-title { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 24px; font-weight: 700; }
    .d148f-sub { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; }
    .d148f-head { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 700; }
    .d148f-label { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d148f-muted { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d148f-val { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; }
    .d148f-wire { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .d148f-node { fill: #ffffff; stroke: #1d4ed8; stroke-width: 2; }
    .d148f-card { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d148f-legend { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }

    .d148f-token { animation: d148f-slide 8s ease-in-out infinite; }
    @keyframes d148f-slide {
      0%   { transform: translateX(0px); }
      6%   { transform: translateX(0px); }
      22%  { transform: translateX(190px); }
      28%  { transform: translateX(190px); }
      44%  { transform: translateX(390px); }
      50%  { transform: translateX(390px); }
      66%  { transform: translateX(590px); }
      72%  { transform: translateX(590px); }
      88%  { transform: translateX(790px); }
      100% { transform: translateX(790px); }
    }

    .d148f-c0 { animation: d148f-lift 8s ease-in-out 0.10s infinite; }
    .d148f-c1 { animation: d148f-lift 8s ease-in-out 1.86s infinite; }
    .d148f-c2 { animation: d148f-lift 8s ease-in-out 3.62s infinite; }
    .d148f-c3 { animation: d148f-lift 8s ease-in-out 5.38s infinite; }
    @keyframes d148f-lift {
      0%, 100% { fill: #eef2ff; }
      4%, 18%  { fill: #bfdbfe; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d148f-token { animation: none; transform: translateX(790px); }
      .d148f-c0, .d148f-c1, .d148f-c2, .d148f-c3 { animation: none; fill: #eef2ff; }
    }
  </style>
  <rect class="d148f-bg" x="0" y="0" width="1040" height="660"/>
  <marker id="d148f-arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
  </marker>

  <text class="d148f-title" x="520" y="38" text-anchor="middle">One fitted line, checked four ways</text>
  <text class="d148f-sub" x="520" y="62" text-anchor="middle">Each check catches a failure the fitted line's own R-squared never flags</text>

  <!-- the fitted line, entering the pipeline -->
  <rect class="d148f-node" x="60" y="94" width="150" height="50" rx="8"/>
  <text class="d148f-label" x="135" y="124" text-anchor="middle">fitted line</text>

  <!-- pipeline wire -->
  <line class="d148f-wire" x1="210" y1="119" x2="960" y2="119" marker-end="url(#d148f-arrowhead)"/>

  <!-- travelling token -->
  <circle class="d148f-token" cx="230" cy="119" r="9" fill="#1d4ed8"/>

  <!-- four stage cards -->
  <g>
    <rect class="d148f-card d148f-c0" x="80" y="180" width="190" height="190" rx="10"/>
    <text class="d148f-head" x="100" y="212">1. Curvature</text>
    <text class="d148f-label" x="100" y="238">quadratic fit to residuals,</text>
    <text class="d148f-label" x="100" y="258">R-squared of the residuals:</text>
    <text class="d148f-val" x="100" y="286">0.3558 (curved data)</text>
    <text class="d148f-val" x="100" y="308">0.0002 (real BMI data)</text>
    <text class="d148f-muted" x="100" y="340">a respectable-looking</text>
    <text class="d148f-muted" x="100" y="358">R-squared, 0.852, missed it</text>
  </g>

  <g>
    <rect class="d148f-card d148f-c1" x="280" y="180" width="190" height="190" rx="10"/>
    <text class="d148f-head" x="300" y="212">2. Spread</text>
    <text class="d148f-label" x="300" y="238">residual sd, low half of x</text>
    <text class="d148f-label" x="300" y="258">against the high half:</text>
    <text class="d148f-val" x="300" y="286">4.7427 vs 12.0684</text>
    <text class="d148f-val" x="300" y="308">ratio 2.5446</text>
    <text class="d148f-muted" x="300" y="340">R-squared here, 0.5723,</text>
    <text class="d148f-muted" x="300" y="358">also looked ordinary</text>
  </g>

  <g>
    <rect class="d148f-card d148f-c2" x="480" y="180" width="190" height="190" rx="10"/>
    <text class="d148f-head" x="500" y="212">3. Leverage</text>
    <text class="d148f-label" x="500" y="238">one added point moved</text>
    <text class="d148f-label" x="500" y="258">the slope from 1.5196 to:</text>
    <text class="d148f-val" x="500" y="286">0.2138 (-1.3059)</text>
    <text class="d148f-val" x="500" y="308">leverage 27x typical</text>
    <text class="d148f-muted" x="500" y="340">computed from the point's</text>
    <text class="d148f-muted" x="500" y="358">x-value, before its y-value</text>
  </g>

  <g>
    <rect class="d148f-card d148f-c3" x="680" y="180" width="190" height="190" rx="10"/>
    <text class="d148f-head" x="700" y="212">4. Zero intercept</text>
    <text class="d148f-label" x="700" y="238">RMSE with an intercept</text>
    <text class="d148f-label" x="700" y="258">against without one:</text>
    <text class="d148f-val" x="700" y="286">6.1401 vs 9.7878</text>
    <text class="d148f-val" x="700" y="308">59% worse, forced to 0</text>
    <text class="d148f-muted" x="700" y="340">the slope absorbs the</text>
    <text class="d148f-muted" x="700" y="358">intercept it was denied</text>
  </g>

  <!-- output -->
  <rect class="d148f-node" x="880" y="94" width="130" height="50" rx="8"/>
  <text class="d148f-label" x="945" y="124" text-anchor="middle">diagnosed</text>

  <!-- legend / caption -->
  <rect class="d148f-legend" x="80" y="400" width="790" height="230" rx="10"/>
  <text class="d148f-head" x="100" y="432">None of these four numbers come from the R-squared</text>
  <text class="d148f-label" x="100" y="462">Every one of the four checks above is computed from the residuals or from a point's</text>
  <text class="d148f-label" x="100" y="486">position on x -- never from the single summary score a fitted line reports by default.</text>
  <text class="d148f-label" x="100" y="516">A line can score 0.852, or 0.5723, or fit forty points cleanly, and still be hiding a</text>
  <text class="d148f-label" x="100" y="540">curve, a widening error band, a single dominant row, or a forced-wrong intercept --</text>
  <text class="d148f-label" x="100" y="564">each invisible in the score, and each visible the moment you look at the residuals.</text>
  <text class="d148f-muted" x="100" y="598">The animation moves the token through the four checks in order; a reduced-motion</text>
  <text class="d148f-muted" x="100" y="618">viewer sees every card, every number, and the token at rest -- nothing here is motion-only.</text>
</svg>
