<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four readings.">
  <title>The determinant</title>
  <style>
    .determinant-bg   { fill: #f8fafc; }
    .determinant-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .determinant-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .determinant-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .determinant-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .determinant-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .determinant-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .determinant-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .determinant-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .determinant-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .determinant-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .determinant-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .determinant-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .determinant-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .determinant-stage { opacity: 1; }

    .determinant-s0 { animation-delay: 0.00s; }
    .determinant-e0 { animation-delay: 0.00s; }
    .determinant-s1 { animation-delay: 1.28s; }
    .determinant-e1 { animation-delay: 1.28s; }
    .determinant-s2 { animation-delay: 2.56s; }
    .determinant-e2 { animation-delay: 2.56s; }
    .determinant-s3 { animation-delay: 3.84s; }
    .determinant-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .determinant-conn  { animation: determinant-trace 6.4s ease-in-out infinite; }
      .determinant-stage { animation: determinant-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes determinant-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes determinant-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .determinant-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .determinant-stage { animation: determinant-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes determinant-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="determinant-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="determinant-bg" width="980" height="322"/>
  <text class="determinant-h1"  x="30" y="40">The determinant</text>
  <text class="determinant-sub" x="30" y="64">Four readings.</text>
  <g class="determinant-stage determinant-s0">
    <rect class="determinant-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="determinant-step" x="44" y="142">01</text>
    <text class="determinant-name" x="70" y="142">How much the transformation scales area</text>
    <text class="determinant-desc" x="44" y="166">A unit square becomes a shape of</text>
    <text class="determinant-desc" x="44" y="182">this area.</text>
  </g>
  <line class="determinant-line determinant-conn determinant-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#determinant-tip)"/>
  <g class="determinant-stage determinant-s1">
    <rect class="determinant-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="determinant-step" x="280" y="142">02</text>
    <text class="determinant-name" x="306" y="142">Its sign says whether orientation flipped</text>
    <text class="determinant-desc" x="280" y="166">Negative means the space was</text>
    <text class="determinant-desc" x="280" y="182">reflected.</text>
  </g>
  <line class="determinant-line determinant-conn determinant-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#determinant-tip)"/>
  <g class="determinant-stage determinant-s2">
    <rect class="determinant-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="determinant-step" x="516" y="142">03</text>
    <text class="determinant-name" x="542" y="142">Zero means the space was flattened</text>
    <text class="determinant-desc" x="516" y="166">Collapsed onto a line or a</text>
    <text class="determinant-desc" x="516" y="182">point.</text>
  </g>
  <line class="determinant-line determinant-conn determinant-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#determinant-tip)"/>
  <g class="determinant-stage determinant-s3">
    <rect class="determinant-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="determinant-step" x="752" y="142">04</text>
    <text class="determinant-name" x="778" y="142">In higher dimensions it scales volume</text>
    <text class="determinant-desc" x="752" y="166">Same meaning, more dimensions.</text>
  </g>
  <text class="determinant-sub" x="30" y="304">A determinant of zero is the algebraic signature of information being destroyed, which is why such a matrix has no inverse.</text>
</svg>
