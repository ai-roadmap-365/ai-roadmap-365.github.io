<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when one container is right.">
  <title>When a gateway is worth it</title>
  <style>
    .gateway-or-direct-bg   { fill: #f8fafc; }
    .gateway-or-direct-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-or-direct-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-or-direct-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-or-direct-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-or-direct-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-or-direct-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gateway-or-direct-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gateway-or-direct-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gateway-or-direct-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gateway-or-direct-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gateway-or-direct-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gateway-or-direct-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gateway-or-direct-row { opacity: 1; }
    .gateway-or-direct-r0 { animation-delay: 0.00s; }
    .gateway-or-direct-r1 { animation-delay: 0.45s; }
    .gateway-or-direct-r2 { animation-delay: 0.90s; }
    .gateway-or-direct-r3 { animation-delay: 1.35s; }
    .gateway-or-direct-r4 { animation-delay: 1.80s; }
    .gateway-or-direct-row { animation: gateway-or-direct-reveal 7.3s ease-in-out infinite; }
    @keyframes gateway-or-direct-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="gateway-or-direct-bg" width="980" height="390"/>
  <text class="gateway-or-direct-h1"  x="30" y="40">When a gateway is worth it</text>
  <text class="gateway-or-direct-sub" x="30" y="64">And when one container is right.</text>
  <rect class="gateway-or-direct-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="gateway-or-direct-name" x="46" y="122">Deploy the gateway</text>
  <text class="gateway-or-direct-desc" x="46" y="142">Multiple replicas, real users.</text>
  <text class="gateway-or-direct-desc gateway-or-direct-row gateway-or-direct-r0" x="46" y="182">More than one GPU replica</text>
  <text class="gateway-or-direct-desc gateway-or-direct-row gateway-or-direct-r1" x="46" y="216">Variable prompt lengths</text>
  <text class="gateway-or-direct-desc gateway-or-direct-row gateway-or-direct-r2" x="46" y="250">Streaming responses users read</text>
  <text class="gateway-or-direct-desc gateway-or-direct-row gateway-or-direct-r3" x="46" y="284">An availability target worth naming</text>
  <text class="gateway-or-direct-desc gateway-or-direct-row gateway-or-direct-r4" x="46" y="318">Rollouts that must not truncate</text>
  <rect class="gateway-or-direct-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="gateway-or-direct-name" x="526" y="122">One container is fine</text>
  <text class="gateway-or-direct-desc" x="526" y="142">Below that threshold.</text>
  <text class="gateway-or-direct-desc gateway-or-direct-row gateway-or-direct-r0" x="526" y="182">A single replica</text>
  <text class="gateway-or-direct-desc gateway-or-direct-row gateway-or-direct-r1" x="526" y="216">An internal tool or a demo</text>
  <text class="gateway-or-direct-desc gateway-or-direct-row gateway-or-direct-r2" x="526" y="250">Restart downtime is acceptable</text>
  <text class="gateway-or-direct-desc gateway-or-direct-row gateway-or-direct-r3" x="526" y="284">Nobody is watching a token stream</text>
  <text class="gateway-or-direct-desc gateway-or-direct-row gateway-or-direct-r4" x="526" y="318">A gateway in front of one worker routes nothing</text>
  <text class="gateway-or-direct-sub" x="30" y="372">A gateway in front of a single replica still buys auth, rate limiting and a circuit breaker — but not routing, which is the component people build it for and the one that needs a choice to make.</text>
</svg>
