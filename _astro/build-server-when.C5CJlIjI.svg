<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when a function is enough.">
  <title>When to build a server</title>
  <style>
    .build-server-when-bg   { fill: #f8fafc; }
    .build-server-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .build-server-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .build-server-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .build-server-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .build-server-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .build-server-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .build-server-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .build-server-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .build-server-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .build-server-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .build-server-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .build-server-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .build-server-when-row { opacity: 1; }
    .build-server-when-r0 { animation-delay: 0.00s; }
    .build-server-when-r1 { animation-delay: 0.45s; }
    .build-server-when-r2 { animation-delay: 0.90s; }
    .build-server-when-r3 { animation-delay: 1.35s; }
    .build-server-when-r4 { animation-delay: 1.80s; }
    .build-server-when-row { animation: build-server-when-reveal 7.3s ease-in-out infinite; }
    @keyframes build-server-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="build-server-when-bg" width="980" height="390"/>
  <text class="build-server-when-h1"  x="30" y="40">When to build a server</text>
  <text class="build-server-when-sub" x="30" y="64">And when a function is enough.</text>
  <rect class="build-server-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="build-server-when-name" x="46" y="122">Build one</text>
  <text class="build-server-when-desc" x="46" y="142">Reuse across clients.</text>
  <text class="build-server-when-desc build-server-when-row build-server-when-r0" x="46" y="182">Proprietary internal databases</text>
  <text class="build-server-when-desc build-server-when-row build-server-when-r1" x="46" y="216">Domain-specific simulators or CLI tools</text>
  <text class="build-server-when-desc build-server-when-row build-server-when-r2" x="46" y="250">Private deployment APIs</text>
  <text class="build-server-when-desc build-server-when-row build-server-when-r3" x="46" y="284">Anything you want in every IDE</text>
  <text class="build-server-when-desc build-server-when-row build-server-when-r4" x="46" y="318">Clean separation of tools from models</text>
  <rect class="build-server-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="build-server-when-name" x="526" y="122">Do not</text>
  <text class="build-server-when-desc" x="526" y="142">One script, one use.</text>
  <text class="build-server-when-desc build-server-when-row build-server-when-r0" x="526" y="182">A one-off private utility</text>
  <text class="build-server-when-desc build-server-when-row build-server-when-r1" x="526" y="216">Self-contained, no external reuse</text>
  <text class="build-server-when-desc build-server-when-row build-server-when-r2" x="526" y="250">No other client will call it</text>
  <text class="build-server-when-desc build-server-when-row build-server-when-r3" x="526" y="284">A function is simpler</text>
  <text class="build-server-when-desc build-server-when-row build-server-when-r4" x="526" y="318">And there is nothing to discover</text>
  <text class="build-server-when-sub" x="30" y="372">The separation-of-concerns argument is the one that ages best: a server outlives the agent that first used it, and rewriting the agent does not mean rewriting the tools.</text>
</svg>
