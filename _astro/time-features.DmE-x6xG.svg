<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four kinds.">
  <title>Time-series primitives</title>
  <style>
    .time-features-bg   { fill: #f8fafc; }
    .time-features-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-features-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-features-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-features-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-features-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-features-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .time-features-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .time-features-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .time-features-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .time-features-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .time-features-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .time-features-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .time-features-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .time-features-stage { opacity: 1; }

    .time-features-s0 { animation-delay: 0.00s; }
    .time-features-e0 { animation-delay: 0.00s; }
    .time-features-s1 { animation-delay: 1.28s; }
    .time-features-e1 { animation-delay: 1.28s; }
    .time-features-s2 { animation-delay: 2.56s; }
    .time-features-e2 { animation-delay: 2.56s; }
    .time-features-s3 { animation-delay: 3.84s; }
    .time-features-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .time-features-conn  { animation: time-features-trace 6.4s ease-in-out infinite; }
      .time-features-stage { animation: time-features-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes time-features-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes time-features-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .time-features-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .time-features-stage { animation: time-features-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes time-features-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="time-features-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="time-features-bg" width="980" height="322"/>
  <text class="time-features-h1"  x="30" y="40">Time-series primitives</text>
  <text class="time-features-sub" x="30" y="64">Four kinds.</text>
  <g class="time-features-stage time-features-s0">
    <rect class="time-features-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="time-features-step" x="44" y="142">01</text>
    <text class="time-features-name" x="70" y="142">Lags</text>
    <text class="time-features-desc" x="44" y="166">The value n periods ago. The</text>
    <text class="time-features-desc" x="44" y="182">foundation of forecasting</text>
    <text class="time-features-desc" x="44" y="198">features.</text>
  </g>
  <line class="time-features-line time-features-conn time-features-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#time-features-tip)"/>
  <g class="time-features-stage time-features-s1">
    <rect class="time-features-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="time-features-step" x="280" y="142">02</text>
    <text class="time-features-name" x="306" y="142">Rolling windows</text>
    <text class="time-features-desc" x="280" y="166">Mean or maximum over a recent</text>
    <text class="time-features-desc" x="280" y="182">span. Smooths noise.</text>
  </g>
  <line class="time-features-line time-features-conn time-features-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#time-features-tip)"/>
  <g class="time-features-stage time-features-s2">
    <rect class="time-features-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="time-features-step" x="516" y="142">03</text>
    <text class="time-features-name" x="542" y="142">Deltas and rates of change</text>
    <text class="time-features-desc" x="516" y="166">How fast something is moving,</text>
    <text class="time-features-desc" x="516" y="182">rather than where it is.</text>
  </g>
  <line class="time-features-line time-features-conn time-features-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#time-features-tip)"/>
  <g class="time-features-stage time-features-s3">
    <rect class="time-features-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="time-features-step" x="752" y="142">04</text>
    <text class="time-features-name" x="778" y="142">Time since the last event</text>
    <text class="time-features-desc" x="752" y="166">Which is frequently more</text>
    <text class="time-features-desc" x="752" y="182">predictive than the count of</text>
    <text class="time-features-desc" x="752" y="198">them.</text>
    <text class="time-features-edge" x="752" y="242">recency</text>
  </g>
  <text class="time-features-sub" x="30" y="304">Every one of these must be computed using only past data at each row's timestamp, which is why time-series feature pipelines are built to respect the ordering explicitly.</text>
</svg>
