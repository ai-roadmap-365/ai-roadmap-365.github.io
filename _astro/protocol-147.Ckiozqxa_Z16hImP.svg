<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Seven gated steps.">
  <title>The protocol</title>
  <style>
    .protocol-147-bg   { fill: #f8fafc; }
    .protocol-147-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .protocol-147-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .protocol-147-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .protocol-147-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .protocol-147-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .protocol-147-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .protocol-147-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .protocol-147-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .protocol-147-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .protocol-147-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .protocol-147-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .protocol-147-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .protocol-147-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .protocol-147-stage { opacity: 1; }

    .protocol-147-s0 { animation-delay: 0.00s; }
    .protocol-147-e0 { animation-delay: 0.00s; }
    .protocol-147-s1 { animation-delay: 1.37s; }
    .protocol-147-e1 { animation-delay: 1.37s; }
    .protocol-147-s2 { animation-delay: 2.74s; }
    .protocol-147-e2 { animation-delay: 2.74s; }
    .protocol-147-s3 { animation-delay: 4.11s; }
    .protocol-147-e3 { animation-delay: 4.11s; }
    .protocol-147-s4 { animation-delay: 5.49s; }
    .protocol-147-e4 { animation-delay: 5.49s; }
    .protocol-147-s5 { animation-delay: 6.86s; }
    .protocol-147-e5 { animation-delay: 6.86s; }
    @media (prefers-reduced-motion: no-preference) {
      .protocol-147-conn  { animation: protocol-147-trace 9.600000000000001s ease-in-out infinite; }
      .protocol-147-stage { animation: protocol-147-arrive 9.600000000000001s ease-in-out infinite; }
    }
    @keyframes protocol-147-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes protocol-147-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .protocol-147-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .protocol-147-stage { animation: protocol-147-settle 9.600000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes protocol-147-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="protocol-147-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="protocol-147-bg" width="980" height="322"/>
  <text class="protocol-147-h1"  x="30" y="40">The protocol</text>
  <text class="protocol-147-sub" x="30" y="64">Seven gated steps.</text>
  <g class="protocol-147-stage protocol-147-s0">
    <rect class="protocol-147-box" x="30" y="118" width="131" height="104" rx="10"/>
    <text class="protocol-147-step" x="44" y="142">01</text>
    <text class="protocol-147-name" x="70" y="142">Frame the problem and compute a baseline</text>
    <text class="protocol-147-desc" x="44" y="166">Before any model is</text>
    <text class="protocol-147-desc" x="44" y="182">fitted.</text>
  </g>
  <line class="protocol-147-line protocol-147-conn protocol-147-e0" x1="163" y1="170" x2="185" y2="170" marker-end="url(#protocol-147-tip)"/>
  <g class="protocol-147-stage protocol-147-s1">
    <rect class="protocol-147-warn" x="187" y="118" width="131" height="104" rx="10"/>
    <text class="protocol-147-step" x="201" y="142">02</text>
    <text class="protocol-147-name" x="227" y="142">Split, respecting whatever structure the data has</text>
    <text class="protocol-147-desc" x="201" y="166">Grouped, stratified,</text>
    <text class="protocol-147-desc" x="201" y="182">ordered.</text>
  </g>
  <line class="protocol-147-line protocol-147-conn protocol-147-e1" x1="320" y1="170" x2="342" y2="170" marker-end="url(#protocol-147-tip)"/>
  <g class="protocol-147-stage protocol-147-s2">
    <rect class="protocol-147-box" x="344" y="118" width="131" height="104" rx="10"/>
    <text class="protocol-147-step" x="358" y="142">03</text>
    <text class="protocol-147-name" x="384" y="142">Sweep candidates and cross-validate on training folds</text>
    <text class="protocol-147-desc" x="358" y="166">Never touching the</text>
    <text class="protocol-147-desc" x="358" y="182">test set.</text>
  </g>
  <line class="protocol-147-line protocol-147-conn protocol-147-e2" x1="477" y1="170" x2="499" y2="170" marker-end="url(#protocol-147-tip)"/>
  <g class="protocol-147-stage protocol-147-s3">
    <rect class="protocol-147-box" x="501" y="118" width="131" height="104" rx="10"/>
    <text class="protocol-147-step" x="515" y="142">04</text>
    <text class="protocol-147-name" x="541" y="142">Select the winner, knowing the score is optimistic</text>
    <text class="protocol-147-desc" x="515" y="166">By an amount that</text>
    <text class="protocol-147-desc" x="515" y="182">can be predicted.</text>
  </g>
  <line class="protocol-147-line protocol-147-conn protocol-147-e3" x1="634" y1="170" x2="656" y2="170" marker-end="url(#protocol-147-tip)"/>
  <g class="protocol-147-stage protocol-147-s4">
    <rect class="protocol-147-good" x="658" y="118" width="131" height="104" rx="10"/>
    <text class="protocol-147-step" x="672" y="142">05</text>
    <text class="protocol-147-name" x="698" y="142">Open the test set once</text>
    <text class="protocol-147-desc" x="672" y="166">And report what it</text>
    <text class="protocol-147-desc" x="672" y="182">says.</text>
  </g>
  <line class="protocol-147-line protocol-147-conn protocol-147-e4" x1="791" y1="170" x2="813" y2="170" marker-end="url(#protocol-147-tip)"/>
  <g class="protocol-147-stage protocol-147-s5">
    <rect class="protocol-147-box" x="815" y="118" width="131" height="104" rx="10"/>
    <text class="protocol-147-step" x="829" y="142">06</text>
    <text class="protocol-147-name" x="855" y="142">Then give a verdict with an interval</text>
    <text class="protocol-147-desc" x="829" y="166">Rather than a bare</text>
    <text class="protocol-147-desc" x="829" y="182">percentage.</text>
    <text class="protocol-147-edge" x="829" y="242">the deliverable</text>
  </g>
  <text class="protocol-147-sub" x="30" y="304">Predicting the optimism before opening the test set is the unusual step here, and it turns the final comparison into a check on the method rather than only on the model.</text>
</svg>
