<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="You already know all of them.">
  <title>Every hosted model call, in four parts</title>
  <style>
    .model-api-shape-bg   { fill: #f8fafc; }
    .model-api-shape-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-api-shape-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-api-shape-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-api-shape-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-api-shape-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-api-shape-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .model-api-shape-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .model-api-shape-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .model-api-shape-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .model-api-shape-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .model-api-shape-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .model-api-shape-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .model-api-shape-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .model-api-shape-stage { opacity: 1; }

    .model-api-shape-s0 { animation-delay: 0.00s; }
    .model-api-shape-e0 { animation-delay: 0.00s; }
    .model-api-shape-s1 { animation-delay: 1.28s; }
    .model-api-shape-e1 { animation-delay: 1.28s; }
    .model-api-shape-s2 { animation-delay: 2.56s; }
    .model-api-shape-e2 { animation-delay: 2.56s; }
    .model-api-shape-s3 { animation-delay: 3.84s; }
    .model-api-shape-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .model-api-shape-conn  { animation: model-api-shape-trace 6.4s ease-in-out infinite; }
      .model-api-shape-stage { animation: model-api-shape-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes model-api-shape-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes model-api-shape-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .model-api-shape-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .model-api-shape-stage { animation: model-api-shape-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes model-api-shape-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="model-api-shape-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="model-api-shape-bg" width="980" height="322"/>
  <text class="model-api-shape-h1"  x="30" y="40">Every hosted model call, in four parts</text>
  <text class="model-api-shape-sub" x="30" y="64">You already know all of them.</text>
  <g class="model-api-shape-stage model-api-shape-s0">
    <rect class="model-api-shape-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="model-api-shape-step" x="44" y="142">01</text>
    <text class="model-api-shape-name" x="70" y="142">POST to an endpoint</text>
    <text class="model-api-shape-desc" x="44" y="166">One URL, documented. Not a</text>
    <text class="model-api-shape-desc" x="44" y="182">special protocol.</text>
    <text class="model-api-shape-edge" x="44" y="242">POST</text>
  </g>
  <line class="model-api-shape-line model-api-shape-conn model-api-shape-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#model-api-shape-tip)"/>
  <g class="model-api-shape-stage model-api-shape-s1">
    <rect class="model-api-shape-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="model-api-shape-step" x="280" y="142">02</text>
    <text class="model-api-shape-name" x="306" y="142">Authorization header</text>
    <text class="model-api-shape-desc" x="280" y="166">Bearer plus your key, from an</text>
    <text class="model-api-shape-desc" x="280" y="182">environment variable per Day 11.</text>
    <text class="model-api-shape-edge" x="280" y="242">Bearer</text>
  </g>
  <line class="model-api-shape-line model-api-shape-conn model-api-shape-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#model-api-shape-tip)"/>
  <g class="model-api-shape-stage model-api-shape-s2">
    <rect class="model-api-shape-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="model-api-shape-step" x="516" y="142">03</text>
    <text class="model-api-shape-name" x="542" y="142">A JSON body</text>
    <text class="model-api-shape-desc" x="516" y="166">Which model, what prompt, and</text>
    <text class="model-api-shape-desc" x="516" y="182">the parameters that shape the</text>
    <text class="model-api-shape-desc" x="516" y="198">output.</text>
    <text class="model-api-shape-edge" x="516" y="242">JSON</text>
  </g>
  <line class="model-api-shape-line model-api-shape-conn model-api-shape-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#model-api-shape-tip)"/>
  <g class="model-api-shape-stage model-api-shape-s3">
    <rect class="model-api-shape-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="model-api-shape-step" x="752" y="142">04</text>
    <text class="model-api-shape-name" x="778" y="142">A JSON response</text>
    <text class="model-api-shape-desc" x="752" y="166">The generation, plus token</text>
    <text class="model-api-shape-desc" x="752" y="182">counts you will be billed on.</text>
    <text class="model-api-shape-edge" x="752" y="242">usage</text>
  </g>
  <text class="model-api-shape-sub" x="30" y="304">This shape is nearly identical across providers, which is precisely what makes switching one a change of endpoint and key rather than a rewrite.</text>
</svg>
