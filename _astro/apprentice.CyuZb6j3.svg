<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="How apprenticeship works.">
  <title>Demonstration, then correction</title>
  <style>
    .apprentice-bg   { fill: #f8fafc; }
    .apprentice-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .apprentice-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .apprentice-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .apprentice-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .apprentice-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .apprentice-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .apprentice-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .apprentice-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .apprentice-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .apprentice-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .apprentice-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .apprentice-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .apprentice-row { opacity: 1; }
    .apprentice-r0 { animation-delay: 0.00s; }
    .apprentice-r1 { animation-delay: 0.45s; }
    .apprentice-r2 { animation-delay: 0.90s; }
    .apprentice-r3 { animation-delay: 1.35s; }
    .apprentice-r4 { animation-delay: 1.80s; }
    .apprentice-row { animation: apprentice-reveal 7.3s ease-in-out infinite; }
    @keyframes apprentice-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="apprentice-bg" width="980" height="390"/>
  <text class="apprentice-h1"  x="30" y="40">Demonstration, then correction</text>
  <text class="apprentice-sub" x="30" y="64">How apprenticeship works.</text>
  <rect class="apprentice-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="apprentice-name" x="46" y="122">Show them how</text>
  <text class="apprentice-desc" x="46" y="142">Demonstration.</text>
  <text class="apprentice-desc apprentice-row apprentice-r0" x="46" y="182">The master does the work</text>
  <text class="apprentice-desc apprentice-row apprentice-r1" x="46" y="216">The apprentice copies</text>
  <text class="apprentice-desc apprentice-row apprentice-r2" x="46" y="250">Establishes the form</text>
  <text class="apprentice-desc apprentice-row apprentice-r3" x="46" y="284">Expensive to produce examples</text>
  <text class="apprentice-desc apprentice-row apprentice-r4" x="46" y="318">This is supervised fine-tuning</text>
  <rect class="apprentice-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="apprentice-name" x="526" y="122">Tell them which is better</text>
  <text class="apprentice-desc" x="526" y="142">Comparison.</text>
  <text class="apprentice-desc apprentice-row apprentice-r0" x="526" y="182">The apprentice produces two attempts</text>
  <text class="apprentice-desc apprentice-row apprentice-r1" x="526" y="216">The master says which is better</text>
  <text class="apprentice-desc apprentice-row apprentice-r2" x="526" y="250">Refines judgment, not form</text>
  <text class="apprentice-desc apprentice-row apprentice-r3" x="526" y="284">Much cheaper to collect</text>
  <text class="apprentice-desc apprentice-row apprentice-r4" x="526" y="318">This is preference optimisation</text>
  <text class="apprentice-sub" x="30" y="372">Comparison being cheaper than demonstration is why the second stage exists at all: judging two answers takes a fraction of the effort of writing a good one.</text>
</svg>
