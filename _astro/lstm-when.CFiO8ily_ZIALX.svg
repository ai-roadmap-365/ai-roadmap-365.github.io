<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And where it does not.">
  <title>Where gated recurrence still fits</title>
  <style>
    .lstm-when-bg   { fill: #f8fafc; }
    .lstm-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lstm-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lstm-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lstm-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lstm-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lstm-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lstm-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .lstm-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .lstm-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .lstm-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .lstm-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .lstm-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lstm-when-row { opacity: 1; }
    .lstm-when-r0 { animation-delay: 0.00s; }
    .lstm-when-r1 { animation-delay: 0.45s; }
    .lstm-when-r2 { animation-delay: 0.90s; }
    .lstm-when-r3 { animation-delay: 1.35s; }
    .lstm-when-r4 { animation-delay: 1.80s; }
    .lstm-when-row { animation: lstm-when-reveal 7.3s ease-in-out infinite; }
    @keyframes lstm-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="lstm-when-bg" width="980" height="390"/>
  <text class="lstm-when-h1"  x="30" y="40">Where gated recurrence still fits</text>
  <text class="lstm-when-sub" x="30" y="64">And where it does not.</text>
  <rect class="lstm-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="lstm-when-name" x="46" y="122">Gated recurrence fits</text>
  <text class="lstm-when-desc" x="46" y="142">Streaming and constrained.</text>
  <text class="lstm-when-desc lstm-when-row lstm-when-r0" x="46" y="182">Real-time streaming telemetry</text>
  <text class="lstm-when-desc lstm-when-row lstm-when-r1" x="46" y="216">On-device audio keyword spotting</text>
  <text class="lstm-when-desc lstm-when-row lstm-when-r2" x="46" y="250">Low-latency signal processing</text>
  <text class="lstm-when-desc lstm-when-row lstm-when-r3" x="46" y="284">Tabular time-series forecasting</text>
  <text class="lstm-when-desc lstm-when-row lstm-when-r4" x="46" y="318">Constant memory per step</text>
  <rect class="lstm-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="lstm-when-name" x="526" y="122">Attention dominates</text>
  <text class="lstm-when-desc" x="526" y="142">Large-scale language.</text>
  <text class="lstm-when-desc lstm-when-row lstm-when-r0" x="526" y="182">Generative foundation models</text>
  <text class="lstm-when-desc lstm-when-row lstm-when-r1" x="526" y="216">Anything needing training parallelism</text>
  <text class="lstm-when-desc lstm-when-row lstm-when-r2" x="526" y="250">Documents beyond a few thousand tokens</text>
  <text class="lstm-when-desc lstm-when-row lstm-when-r3" x="526" y="284">Where long-range dependencies matter</text>
  <text class="lstm-when-desc lstm-when-row lstm-when-r4" x="526" y="318">Which is most modern NLP</text>
  <text class="lstm-when-sub" x="30" y="372">The on-device case is genuinely current rather than legacy: a keyword spotter running continuously on a battery-powered device needs constant memory and low latency per step, which is exactly what recurrence provides.</text>
</svg>
