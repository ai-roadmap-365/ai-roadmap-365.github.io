<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which is why the sharing rule applies to it too.">
  <title>Amend does not edit — it replaces</title>
  <style>
    .amend-replaces-bg   { fill: #f8fafc; }
    .amend-replaces-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .amend-replaces-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .amend-replaces-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .amend-replaces-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .amend-replaces-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .amend-replaces-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .amend-replaces-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .amend-replaces-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .amend-replaces-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .amend-replaces-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .amend-replaces-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .amend-replaces-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .amend-replaces-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .amend-replaces-stage { opacity: 1; }

    .amend-replaces-s0 { animation-delay: 0.00s; }
    .amend-replaces-e0 { animation-delay: 0.00s; }
    .amend-replaces-s1 { animation-delay: 1.28s; }
    .amend-replaces-e1 { animation-delay: 1.28s; }
    .amend-replaces-s2 { animation-delay: 2.56s; }
    .amend-replaces-e2 { animation-delay: 2.56s; }
    .amend-replaces-s3 { animation-delay: 3.84s; }
    .amend-replaces-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .amend-replaces-conn  { animation: amend-replaces-trace 6.4s ease-in-out infinite; }
      .amend-replaces-stage { animation: amend-replaces-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes amend-replaces-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes amend-replaces-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .amend-replaces-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .amend-replaces-stage { animation: amend-replaces-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes amend-replaces-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="amend-replaces-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="amend-replaces-bg" width="980" height="322"/>
  <text class="amend-replaces-h1"  x="30" y="40">Amend does not edit — it replaces</text>
  <text class="amend-replaces-sub" x="30" y="64">Which is why the sharing rule applies to it too.</text>
  <g class="amend-replaces-stage amend-replaces-s0">
    <rect class="amend-replaces-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="amend-replaces-step" x="44" y="142">01</text>
    <text class="amend-replaces-name" x="70" y="142">You commit</text>
    <text class="amend-replaces-desc" x="44" y="166">And immediately notice a typo,</text>
    <text class="amend-replaces-desc" x="44" y="182">or a forgotten file.</text>
  </g>
  <line class="amend-replaces-line amend-replaces-conn amend-replaces-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#amend-replaces-tip)"/>
  <g class="amend-replaces-stage amend-replaces-s1">
    <rect class="amend-replaces-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="amend-replaces-step" x="280" y="142">02</text>
    <text class="amend-replaces-name" x="306" y="142">git add, then --amend</text>
    <text class="amend-replaces-desc" x="280" y="166">Git combines the staged content</text>
    <text class="amend-replaces-desc" x="280" y="182">with the previous commit's</text>
    <text class="amend-replaces-desc" x="280" y="198">content.</text>
  </g>
  <line class="amend-replaces-line amend-replaces-conn amend-replaces-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#amend-replaces-tip)"/>
  <g class="amend-replaces-stage amend-replaces-s2">
    <rect class="amend-replaces-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="amend-replaces-step" x="516" y="142">03</text>
    <text class="amend-replaces-name" x="542" y="142">A NEW commit is produced</text>
    <text class="amend-replaces-desc" x="516" y="166">With a new hash. The original is</text>
    <text class="amend-replaces-desc" x="516" y="182">not edited — it is replaced.</text>
    <text class="amend-replaces-edge" x="516" y="242">new hash</text>
  </g>
  <line class="amend-replaces-line amend-replaces-conn amend-replaces-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#amend-replaces-tip)"/>
  <g class="amend-replaces-stage amend-replaces-s3">
    <rect class="amend-replaces-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="amend-replaces-step" x="752" y="142">04</text>
    <text class="amend-replaces-name" x="778" y="142">The original drifts to the reflog</text>
    <text class="amend-replaces-desc" x="752" y="166">Recoverable, and no longer on</text>
    <text class="amend-replaces-desc" x="752" y="182">the branch.</text>
  </g>
  <text class="amend-replaces-sub" x="30" y="304">Because the hash changes, amending a commit you have pushed causes exactly the divergence that rebasing does. Amend freely before sharing; never after.</text>
</svg>
