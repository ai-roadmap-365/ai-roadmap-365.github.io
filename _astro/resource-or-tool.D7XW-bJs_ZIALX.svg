<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Stable key, or arbitrary arguments.">
  <title>Model it as a resource, or a tool</title>
  <style>
    .resource-or-tool-bg   { fill: #f8fafc; }
    .resource-or-tool-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resource-or-tool-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resource-or-tool-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resource-or-tool-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resource-or-tool-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resource-or-tool-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .resource-or-tool-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .resource-or-tool-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .resource-or-tool-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .resource-or-tool-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .resource-or-tool-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .resource-or-tool-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .resource-or-tool-row { opacity: 1; }
    .resource-or-tool-r0 { animation-delay: 0.00s; }
    .resource-or-tool-r1 { animation-delay: 0.45s; }
    .resource-or-tool-r2 { animation-delay: 0.90s; }
    .resource-or-tool-r3 { animation-delay: 1.35s; }
    .resource-or-tool-r4 { animation-delay: 1.80s; }
    .resource-or-tool-row { animation: resource-or-tool-reveal 7.3s ease-in-out infinite; }
    @keyframes resource-or-tool-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="resource-or-tool-bg" width="980" height="390"/>
  <text class="resource-or-tool-h1"  x="30" y="40">Model it as a resource, or a tool</text>
  <text class="resource-or-tool-sub" x="30" y="64">Stable key, or arbitrary arguments.</text>
  <rect class="resource-or-tool-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="resource-or-tool-name" x="46" y="122">A resource</text>
  <text class="resource-or-tool-desc" x="46" y="142">Addressable by a stable key.</text>
  <text class="resource-or-tool-desc resource-or-tool-row resource-or-tool-r0" x="46" y="182">Configuration files, API docs, schemas</text>
  <text class="resource-or-tool-desc resource-or-tool-row resource-or-tool-r1" x="46" y="216">Build logs and system logs</text>
  <text class="resource-or-tool-desc resource-or-tool-row resource-or-tool-r2" x="46" y="250">Slowly-changing reference state</text>
  <text class="resource-or-tool-desc resource-or-tool-row resource-or-tool-r3" x="46" y="284">No arguments beyond the URI</text>
  <text class="resource-or-tool-desc resource-or-tool-row resource-or-tool-r4" x="46" y="318">Read-only, always</text>
  <rect class="resource-or-tool-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="resource-or-tool-name" x="526" y="122">A tool</text>
  <text class="resource-or-tool-desc" x="526" y="142">Arguments and effects.</text>
  <text class="resource-or-tool-desc resource-or-tool-row resource-or-tool-r0" x="526" y="182">Arbitrary user-supplied arguments</text>
  <text class="resource-or-tool-desc resource-or-tool-row resource-or-tool-r1" x="526" y="216">Heavy multi-step computation</text>
  <text class="resource-or-tool-desc resource-or-tool-row resource-or-tool-r2" x="526" y="250">Dynamic queries such as execute_sql</text>
  <text class="resource-or-tool-desc resource-or-tool-row resource-or-tool-r3" x="526" y="284">External side effects</text>
  <text class="resource-or-tool-desc resource-or-tool-row resource-or-tool-r4" x="526" y="318">Anything that writes</text>
  <text class="resource-or-tool-sub" x="30" y="372">Hybrids are the common real shape: a prompt template that attaches schema resources and then lets the model call a query tool gives it the structure before it writes the statement.</text>
</svg>
