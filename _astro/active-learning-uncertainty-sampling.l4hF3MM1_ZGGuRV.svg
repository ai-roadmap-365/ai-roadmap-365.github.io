<svg role="img" aria-label="Active learning uncertainty sampling loop showing model predicting pool entropy selecting low confidence queries and updating training distribution" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Active Learning Uncertainty Sampling Loop</title>
  <defs>
    <linearGradient id="bg191a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card191" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg191a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">ACTIVE LEARNING &amp; UNCERTAINTY SAMPLING LOOP</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Prioritizing Human Labeling Effort on High-Entropy Decision Boundaries</text>
  <g transform="translate(60, 90)">
    <rect width="730" height="290" fill="url(#card191)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Unlabeled Pool -->
    <rect x="50" y="40" width="160" height="90" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="130" y="75" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Unlabeled Pool</text>
    <text x="130" y="100" fill="#94a3b8" font-family="system-ui" font-size="10" text-anchor="middle">1,000,000 Samples</text>
    <!-- Arrow right -->
    <line x1="210" y1="85" x2="280" y2="85" stroke="#64748b" stroke-width="2"/>
    <!-- Uncertainty Scorer -->
    <rect x="280" y="40" width="170" height="90" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" rx="6"/>
    <text x="365" y="70" fill="#fbbf24" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Uncertainty Scorer</text>
    <text x="365" y="95" fill="#cbd5e1" font-family="system-ui" font-size="10" text-anchor="middle">Entropy: -sum(p log p)</text>
    <text x="365" y="115" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">Least Confident Filter</text>
    <!-- Arrow right -->
    <line x1="450" y1="85" x2="520" y2="85" stroke="#64748b" stroke-width="2"/>
    <!-- Human Oracle -->
    <rect x="520" y="40" width="160" height="90" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" rx="6"/>
    <text x="600" y="75" fill="#f472b6" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Human Oracle</text>
    <text x="600" y="100" fill="#cbd5e1" font-family="system-ui" font-size="10" text-anchor="middle">Annotate Top-K (500)</text>
    <!-- Feedback flow down and left -->
    <path d="M 600 130 L 600 220 L 130 220 L 130 180" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,4"/>
    <!-- Retrain model box -->
    <rect x="260" y="180" width="210" height="70" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="365" y="210" fill="#34d399" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Retrain Model</text>
    <text x="365" y="232" fill="#94a3b8" font-family="system-ui" font-size="10" text-anchor="middle">Augmented Labeled Dataset</text>
  </g>
</svg>
