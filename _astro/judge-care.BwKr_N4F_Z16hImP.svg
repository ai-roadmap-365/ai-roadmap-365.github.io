<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four safeguards.">
  <title>Using a model as judge</title>
  <style>
    .judge-care-bg   { fill: #f8fafc; }
    .judge-care-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-care-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-care-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-care-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-care-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-care-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .judge-care-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .judge-care-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .judge-care-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .judge-care-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .judge-care-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .judge-care-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .judge-care-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .judge-care-stage { opacity: 1; }

    .judge-care-s0 { animation-delay: 0.00s; }
    .judge-care-e0 { animation-delay: 0.00s; }
    .judge-care-s1 { animation-delay: 1.28s; }
    .judge-care-e1 { animation-delay: 1.28s; }
    .judge-care-s2 { animation-delay: 2.56s; }
    .judge-care-e2 { animation-delay: 2.56s; }
    .judge-care-s3 { animation-delay: 3.84s; }
    .judge-care-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .judge-care-conn  { animation: judge-care-trace 6.4s ease-in-out infinite; }
      .judge-care-stage { animation: judge-care-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes judge-care-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes judge-care-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .judge-care-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .judge-care-stage { animation: judge-care-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes judge-care-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="judge-care-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="judge-care-bg" width="980" height="322"/>
  <text class="judge-care-h1"  x="30" y="40">Using a model as judge</text>
  <text class="judge-care-sub" x="30" y="64">Four safeguards.</text>
  <g class="judge-care-stage judge-care-s0">
    <rect class="judge-care-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="judge-care-step" x="44" y="142">01</text>
    <text class="judge-care-name" x="70" y="142">Write an explicit rubric</text>
    <text class="judge-care-desc" x="44" y="166">Not just a request to rate</text>
    <text class="judge-care-desc" x="44" y="182">quality.</text>
  </g>
  <line class="judge-care-line judge-care-conn judge-care-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#judge-care-tip)"/>
  <g class="judge-care-stage judge-care-s1">
    <rect class="judge-care-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="judge-care-step" x="280" y="142">02</text>
    <text class="judge-care-name" x="306" y="142">Randomise the order of what is compared</text>
    <text class="judge-care-desc" x="280" y="166">Position bias is large and</text>
    <text class="judge-care-desc" x="280" y="182">consistent.</text>
  </g>
  <line class="judge-care-line judge-care-conn judge-care-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#judge-care-tip)"/>
  <g class="judge-care-stage judge-care-s2">
    <rect class="judge-care-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="judge-care-step" x="516" y="142">03</text>
    <text class="judge-care-name" x="542" y="142">Calibrate against human labels</text>
    <text class="judge-care-desc" x="516" y="166">And measure agreement, not</text>
    <text class="judge-care-desc" x="516" y="182">plausibility.</text>
  </g>
  <line class="judge-care-line judge-care-conn judge-care-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#judge-care-tip)"/>
  <g class="judge-care-stage judge-care-s3">
    <rect class="judge-care-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="judge-care-step" x="752" y="142">04</text>
    <text class="judge-care-name" x="778" y="142">And do not let a model judge its own family</text>
    <text class="judge-care-desc" x="752" y="166">Self-preference is well</text>
    <text class="judge-care-desc" x="752" y="182">documented.</text>
  </g>
  <text class="judge-care-sub" x="30" y="304">Self-preference is subtle in practice: a judge from the same family as the generator scores it higher for reasons that have nothing to do with the rubric.</text>
</svg>
