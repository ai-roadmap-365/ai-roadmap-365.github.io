<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Grouped folds</title>
  <style>
    .group-kfold-bg   { fill: #f8fafc; }
    .group-kfold-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-kfold-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-kfold-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-kfold-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-kfold-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-kfold-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .group-kfold-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .group-kfold-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .group-kfold-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .group-kfold-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .group-kfold-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .group-kfold-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .group-kfold-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .group-kfold-stage { opacity: 1; }

    .group-kfold-s0 { animation-delay: 0.00s; }
    .group-kfold-e0 { animation-delay: 0.00s; }
    .group-kfold-s1 { animation-delay: 1.28s; }
    .group-kfold-e1 { animation-delay: 1.28s; }
    .group-kfold-s2 { animation-delay: 2.56s; }
    .group-kfold-e2 { animation-delay: 2.56s; }
    .group-kfold-s3 { animation-delay: 3.84s; }
    .group-kfold-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .group-kfold-conn  { animation: group-kfold-trace 6.4s ease-in-out infinite; }
      .group-kfold-stage { animation: group-kfold-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes group-kfold-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes group-kfold-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .group-kfold-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .group-kfold-stage { animation: group-kfold-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes group-kfold-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="group-kfold-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="group-kfold-bg" width="980" height="322"/>
  <text class="group-kfold-h1"  x="30" y="40">Grouped folds</text>
  <text class="group-kfold-sub" x="30" y="64">Four steps.</text>
  <g class="group-kfold-stage group-kfold-s0">
    <rect class="group-kfold-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="group-kfold-step" x="44" y="142">01</text>
    <text class="group-kfold-name" x="70" y="142">Several rows often belong to one entity</text>
    <text class="group-kfold-desc" x="44" y="166">Many visits per patient, many</text>
    <text class="group-kfold-desc" x="44" y="182">orders per customer.</text>
  </g>
  <line class="group-kfold-line group-kfold-conn group-kfold-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#group-kfold-tip)"/>
  <g class="group-kfold-stage group-kfold-s1">
    <rect class="group-kfold-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="group-kfold-step" x="280" y="142">02</text>
    <text class="group-kfold-name" x="306" y="142">A random split puts some in training and some in validation</text>
    <text class="group-kfold-desc" x="280" y="166">So the model recognises the</text>
    <text class="group-kfold-desc" x="280" y="182">entity, not the pattern.</text>
  </g>
  <line class="group-kfold-line group-kfold-conn group-kfold-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#group-kfold-tip)"/>
  <g class="group-kfold-stage group-kfold-s2">
    <rect class="group-kfold-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="group-kfold-step" x="516" y="142">03</text>
    <text class="group-kfold-name" x="542" y="142">Keep every entity's rows entirely on one side</text>
    <text class="group-kfold-desc" x="516" y="166">Which is what grouped splitting</text>
    <text class="group-kfold-desc" x="516" y="182">enforces.</text>
  </g>
  <line class="group-kfold-line group-kfold-conn group-kfold-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#group-kfold-tip)"/>
  <g class="group-kfold-stage group-kfold-s3">
    <rect class="group-kfold-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="group-kfold-step" x="752" y="142">04</text>
    <text class="group-kfold-name" x="778" y="142">Scores drop, and become honest</text>
    <text class="group-kfold-desc" x="752" y="166">They now measure generalisation</text>
    <text class="group-kfold-desc" x="752" y="182">to new entities.</text>
  </g>
  <text class="group-kfold-sub" x="30" y="304">The score dropping is the correct outcome and is often mistaken for a regression: the earlier number was measuring memorisation of entities.</text>
</svg>
