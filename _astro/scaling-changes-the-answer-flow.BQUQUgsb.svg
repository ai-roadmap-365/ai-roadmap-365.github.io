<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 790" role="img"
     aria-labelledby="d107f-title d107f-desc">
  <title id="d107f-title">The same nearest-neighbour search before and after standardising: in metres and grams the winner is bearing R, and after both columns are divided by their own standard deviations the winner is bearing P</title>
  <desc id="d107f-desc">An animated flow diagram in three parts. On the left, six bearings and a query plotted with both columns at the same scale, so the bore column collapses onto a single vertical line and only mass separates the parts, with bearing R marked as the nearest at a distance of 2.000036. In the middle, an arrow labelled standardise carrying a travelling token. On the right, the same seven points after each column has had its mean subtracted and been divided by its own standard deviation, now spread across two dimensions, with bearing P marked as the nearest at a distance of 0.466883. Below, the two rankings side by side.</desc>

  <style>
    .d107f-bg     { fill: #f8fafc; }
    .d107f-h1     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 27px; font-weight: 700; fill: #1a202c; }
    .d107f-h2     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 19px; font-weight: 700; fill: #1d4ed8; }
    .d107f-lab    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; fill: #1a202c; }
    .d107f-small  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d107f-mono   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; fill: #1a202c; }
    .d107f-monob  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; fill: #1a202c; }
    .d107f-panel  { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .d107f-card   { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d107f-axis   { stroke: #64748b; stroke-width: 1.5; }
    .d107f-guide  { stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .d107f-dot    { fill: #475569; }
    .d107f-query  { fill: #1d4ed8; }
    .d107f-amberT { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; fill: #b45309; }
    .d107f-greenT { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; fill: #047857; }
    .d107f-blueT  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; fill: #1d4ed8; }
    .d107f-winA   { fill: #b45309; }
    .d107f-winB   { fill: #047857; }

    .d107f-wire { stroke: #1d4ed8; stroke-width: 3; fill: none;
                  stroke-dasharray: 11 8;
                  animation: d107f-march 1.8s linear infinite; }
    @keyframes d107f-march { to { stroke-dashoffset: -19; } }

    .d107f-token { fill: #1d4ed8;
                   animation: d107f-slide 6s ease-in-out infinite; }
    @keyframes d107f-slide {
      0%, 8%    { transform: translateX(0); }
      50%, 100% { transform: translateX(196px); }
    }

    .d107f-ringA { fill: none; stroke: #b45309; stroke-width: 3;
                   animation: d107f-pulseA 6s ease-in-out infinite; }
    @keyframes d107f-pulseA {
      0%, 22%, 100% { r: 17px; opacity: 1; }
      10%           { r: 23px; opacity: 0.85; }
    }

    .d107f-ringB { fill: none; stroke: #047857; stroke-width: 3;
                   animation: d107f-pulseB 6s ease-in-out infinite;
                   animation-delay: 2.6s; }
    @keyframes d107f-pulseB {
      0%, 22%, 100% { r: 17px; opacity: 1; }
      10%           { r: 23px; opacity: 0.85; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d107f-wire  { animation: none; stroke-dasharray: none; }
      .d107f-token { animation: none; transform: none; }
      .d107f-ringA { animation: none; r: 17px; opacity: 1; }
      .d107f-ringB { animation: none; r: 17px; opacity: 1; }
    }
  </style>

  <rect class="d107f-bg" x="0" y="0" width="1020" height="790"/>

  <text class="d107f-h1" x="40" y="46">The units decide the answer, and nobody voted on them</text>
  <text class="d107f-small" x="40" y="72">Six bearings. One query: bore 0.020 m, mass 300 g. Same Euclidean distance, same code, both columns present both times.</text>

  <!-- ================= LEFT: raw units ================= -->
  <rect class="d107f-panel" x="40" y="92" width="352" height="476" rx="8"/>
  <text class="d107f-h2" x="60" y="122">1 · RAW — metres and grams</text>
  <text class="d107f-small" x="60" y="144">Both columns drawn at the SAME scale. The whole bore</text>
  <text class="d107f-small" x="60" y="162">column spans 0.03 of one gram-width, so all seven</text>
  <text class="d107f-small" x="60" y="180">points land on this one line.</text>

  <line class="d107f-axis" x1="215" y1="196" x2="215" y2="546"/>
  <text class="d107f-small" x="60" y="204">mass (g)</text>

  <circle class="d107f-dot" cx="215" cy="211" r="6"/>
  <text class="d107f-mono" x="234" y="216">V  500 g</text>
  <circle class="d107f-dot" cx="215" cy="321" r="6"/>
  <text class="d107f-mono" x="234" y="326">T  410 g</text>
  <circle class="d107f-dot" cx="215" cy="407" r="6"/>
  <text class="d107f-mono" x="234" y="412">P  340 g</text>

  <!-- R at 302 g and the query at 300 g: 2 grams apart, 3 pixels here -->
  <circle class="d107f-ringA" cx="215" cy="454" r="17"/>
  <circle class="d107f-winA" cx="215" cy="453" r="7"/>
  <polygon class="d107f-query" points="215,448 224,456 215,464 206,456"/>
  <line class="d107f-guide" x1="120" y1="456" x2="200" y2="456"/>
  <text class="d107f-blueT" x="70" y="451">query</text>
  <text class="d107f-mono" x="70" y="471">300 g</text>
  <text class="d107f-amberT" x="243" y="450">R  302 g</text>
  <text class="d107f-small" x="243" y="468">nearest: 2.000036</text>

  <circle class="d107f-dot" cx="215" cy="486" r="6"/>
  <text class="d107f-mono" x="234" y="497">U  275 g</text>
  <circle class="d107f-dot" cx="215" cy="517" r="6"/>
  <text class="d107f-mono" x="234" y="534">S  250 g</text>

  <text class="d107f-small" x="60" y="584">R and the query overlap here: 2 g apart is 3 pixels.</text>
  <text class="d107f-mono" x="60" y="608">winner  R  ·  bore 0.032 m</text>
  <text class="d107f-small" x="60" y="628">60 per cent oversize, and it will not fit the shaft. The</text>
  <text class="d107f-small" x="60" y="646">bore column contributed 0.0036% of the distance.</text>

  <!-- ================= MIDDLE: the arrow ================= -->
  <path class="d107f-wire" d="M 404 340 L 616 340"/>
  <polygon class="d107f-query" points="616,332 634,340 616,348"/>
  <circle class="d107f-token" cx="410" cy="340" r="8"/>
  <text class="d107f-blueT" x="404" y="300">standardise</text>
  <text class="d107f-mono" x="404" y="392">z = (x - mean) / sd</text>
  <text class="d107f-small" x="404" y="414">means  0.0230,  346.17</text>
  <text class="d107f-small" x="404" y="432">sds    0.0102,   85.67</text>
  <text class="d107f-small" x="404" y="458">taken from the CATALOGUE,</text>
  <text class="d107f-small" x="404" y="476">then applied to the query too</text>

  <!-- ================= RIGHT: standardised ================= -->
  <rect class="d107f-panel" x="648" y="92" width="332" height="476" rx="8"/>
  <text class="d107f-h2" x="668" y="122">2 · STANDARDISED</text>
  <text class="d107f-small" x="668" y="144">Both columns now speak in standard deviations of</text>
  <text class="d107f-small" x="668" y="162">the catalogue, so bore can finally be heard.</text>

  <!-- axes: centre (812, 350), unit = 82px -->
  <line class="d107f-axis" x1="672" y1="350" x2="962" y2="350"/>
  <line class="d107f-axis" x1="812" y1="196" x2="812" y2="536"/>
  <text class="d107f-small" x="924" y="370">bore (z)</text>
  <text class="d107f-small" x="822" y="210">mass (z)</text>

  <!-- S (-1.4639, -1.1225) -->
  <circle class="d107f-dot" cx="692" cy="442" r="6"/>
  <text class="d107f-mono" x="668" y="464">S</text>
  <!-- U (-0.8783, -0.8307) -->
  <circle class="d107f-dot" cx="740" cy="418" r="6"/>
  <text class="d107f-mono" x="716" y="438">U</text>
  <!-- R (0.8783, -0.5155) -->
  <circle class="d107f-dot" cx="884" cy="392" r="6"/>
  <text class="d107f-mono" x="898" y="397">R</text>
  <!-- T (0.2928, 0.7451) -->
  <circle class="d107f-dot" cx="836" cy="289" r="6"/>
  <text class="d107f-mono" x="850" y="294">T</text>
  <!-- V (1.4639, 1.7956) -->
  <circle class="d107f-dot" cx="932" cy="203" r="6"/>
  <text class="d107f-mono" x="946" y="208">V</text>

  <!-- query (-0.2928, -0.5389) -->
  <polygon class="d107f-query" points="788,386 797,394 788,402 779,394"/>
  <text class="d107f-blueT" x="700" y="399">query</text>

  <!-- P (-0.2928, -0.0720) -->
  <line class="d107f-guide" x1="788" y1="394" x2="788" y2="356"/>
  <circle class="d107f-ringB" cx="788" cy="356" r="17"/>
  <circle class="d107f-winB" cx="788" cy="356" r="7"/>
  <text class="d107f-greenT" x="668" y="322">P  nearest: 0.466883</text>

  <text class="d107f-small" x="668" y="584">Every point is now within about 2 sd of the centre.</text>
  <text class="d107f-mono" x="668" y="608">winner  P  ·  bore 0.020 m</text>
  <text class="d107f-small" x="668" y="628">Exactly the bore that was asked for. It was third</text>
  <text class="d107f-small" x="668" y="646">before, behind a part that cannot be fitted.</text>

  <!-- ================= BOTTOM: the two rankings ================= -->
  <rect class="d107f-card" x="40" y="656" width="452" height="106" rx="8"/>
  <text class="d107f-amberT" x="60" y="684">Raw Euclidean</text>
  <text class="d107f-monob" x="60" y="712">R → U → P → S → T → V</text>
  <text class="d107f-small" x="60" y="736">Effectively a ranking on mass alone, with a rounding</text>
  <text class="d107f-small" x="60" y="754">error attached.</text>

  <rect class="d107f-card" x="528" y="656" width="452" height="106" rx="8"/>
  <text class="d107f-greenT" x="548" y="684">Standardised Euclidean</text>
  <text class="d107f-monob" x="548" y="712">P → U → R → S → T → V</text>
  <text class="d107f-small" x="548" y="736">Two parts moved, and they are the two the decision</text>
  <text class="d107f-small" x="548" y="754">was between. P and R swapped first for third.</text>
</svg>
