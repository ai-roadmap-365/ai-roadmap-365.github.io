<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%" role="img" aria-label="What the Ledger Shows showing spend attributed across retrieval, the small model, the large model and the cache for three questions">
  <title>What the Ledger Shows</title>
  <defs>
    <style>
      .d329b-bg { fill: #f8fafc; }
      .d329b-axis { stroke: #94a3b8; stroke-width: 2px; }
      .d329b-large { fill: #ef4444; }
      .d329b-small { fill: #3b82f6; }
      .d329b-ret { fill: #a855f7; }
      .d329b-cache { fill: #22c55e; }
      .d329b-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d329b-sub { font-family: system-ui, sans-serif; font-size: 13px; fill: #475569; }
      .d329b-h { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; }
      .d329b-t { font-family: system-ui, sans-serif; font-size: 11px; fill: #334155; }
      .d329b-lbl { font-family: system-ui, sans-serif; font-size: 11px; fill: #475569; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d329b-bg"/>
  <text x="40" y="40" class="d329b-title">What the Ledger Shows</text>
  <text x="40" y="64" class="d329b-sub">Measured across three questions, one a repeat. Total $0.00230 — but the total is not the useful part.</text>

  <line x1="150" y1="100" x2="150" y2="250" class="d329b-axis"/>
  <line x1="150" y1="250" x2="820" y2="250" class="d329b-axis"/>

  <rect x="150" y="115" width="592" height="40" class="d329b-large"/>
  <text x="140" y="140" class="d329b-lbl" text-anchor="end">large</text>
  <text x="760" y="140" class="d329b-t">$0.00210 — 91% from ONE of three questions</text>

  <rect x="150" y="170" width="48" height="40" class="d329b-small"/>
  <text x="140" y="195" class="d329b-lbl" text-anchor="end">small</text>
  <text x="215" y="195" class="d329b-t">$0.00017</text>

  <rect x="150" y="222" width="6" height="22" class="d329b-ret"/>
  <text x="140" y="238" class="d329b-lbl" text-anchor="end">retrieval</text>
  <text x="175" y="238" class="d329b-t">$0.00002 — small, but inside the SAME budget</text>

  <text x="40" y="292" class="d329b-h">The two things a total cannot tell you</text>
  <text x="40" y="316" class="d329b-t">WHERE TO OPTIMISE. One reasoning question is 91% of spend. The lever is routing, not caching — and a cache hit rate</text>
  <text x="40" y="334" class="d329b-t">dashboard would have pointed the other way.</text>
  <text x="40" y="362" class="d329b-t">WHAT IS CAPPED. Retrieval is a rounding error here and it shares the request budget on purpose. A stage with its own</text>
  <text x="40" y="380" class="d329b-t">accounting is a path the cap does not bound, and that is where unbounded spend gets in.</text>
  <text x="40" y="406" class="d329b-t">The cache line sits at $0.00000 rather than being absent, so the hit rate stays visible when attributing spend.</text>
</svg>
