<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when it is not.">
  <title>When strict grounding is required</title>
  <style>
    .halluc-when-bg   { fill: #f8fafc; }
    .halluc-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .halluc-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .halluc-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .halluc-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .halluc-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .halluc-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .halluc-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .halluc-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .halluc-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .halluc-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .halluc-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .halluc-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .halluc-when-row { opacity: 1; }
    .halluc-when-r0 { animation-delay: 0.00s; }
    .halluc-when-r1 { animation-delay: 0.45s; }
    .halluc-when-r2 { animation-delay: 0.90s; }
    .halluc-when-r3 { animation-delay: 1.35s; }
    .halluc-when-r4 { animation-delay: 1.80s; }
    .halluc-when-row { animation: halluc-when-reveal 7.3s ease-in-out infinite; }
    @keyframes halluc-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="halluc-when-bg" width="980" height="390"/>
  <text class="halluc-when-h1"  x="30" y="40">When strict grounding is required</text>
  <text class="halluc-when-sub" x="30" y="64">And when it is not.</text>
  <rect class="halluc-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="halluc-when-name" x="46" y="122">Ground strictly</text>
  <text class="halluc-when-desc" x="46" y="142">Facts leaving the system.</text>
  <text class="halluc-when-desc halluc-when-row halluc-when-r0" x="46" y="182">Medical, legal or financial information</text>
  <text class="halluc-when-desc halluc-when-row halluc-when-r1" x="46" y="216">Anything a user will act on</text>
  <text class="halluc-when-desc halluc-when-row halluc-when-r2" x="46" y="250">Customer-facing factual answers</text>
  <text class="halluc-when-desc halluc-when-row halluc-when-r3" x="46" y="284">Citations and references</text>
  <text class="halluc-when-desc halluc-when-row halluc-when-r4" x="46" y="318">Regulated communication</text>
  <rect class="halluc-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="halluc-when-name" x="526" y="122">Less strictly</text>
  <text class="halluc-when-desc" x="526" y="142">Where invention is the point.</text>
  <text class="halluc-when-desc halluc-when-row halluc-when-r0" x="526" y="182">Creative writing and ideation</text>
  <text class="halluc-when-desc halluc-when-row halluc-when-r1" x="526" y="216">Brainstorming options</text>
  <text class="halluc-when-desc halluc-when-row halluc-when-r2" x="526" y="250">Drafting that a human will edit</text>
  <text class="halluc-when-desc halluc-when-row halluc-when-r3" x="526" y="284">Code a compiler will check</text>
  <text class="halluc-when-desc halluc-when-row halluc-when-r4" x="526" y="318">Where the user is the verifier</text>
  <text class="halluc-when-sub" x="30" y="372">The distinction is whether an unverified claim can reach a decision, which is a question about the system around the model rather than about the model itself.</text>
</svg>
