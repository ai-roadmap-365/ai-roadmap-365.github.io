<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Which is why the bug is often elsewhere.">
  <title>A traceback reports use, not origin</title>
  <style>
    .where-used-not-made-bg   { fill: #f8fafc; }
    .where-used-not-made-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .where-used-not-made-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .where-used-not-made-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .where-used-not-made-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .where-used-not-made-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .where-used-not-made-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .where-used-not-made-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .where-used-not-made-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .where-used-not-made-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .where-used-not-made-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .where-used-not-made-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .where-used-not-made-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .where-used-not-made-row { opacity: 1; }
    .where-used-not-made-r0 { animation-delay: 0.00s; }
    .where-used-not-made-r1 { animation-delay: 0.45s; }
    .where-used-not-made-r2 { animation-delay: 0.90s; }
    .where-used-not-made-r3 { animation-delay: 1.35s; }
    .where-used-not-made-r4 { animation-delay: 1.80s; }
    .where-used-not-made-row { animation: where-used-not-made-reveal 7.3s ease-in-out infinite; }
    @keyframes where-used-not-made-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="where-used-not-made-bg" width="980" height="390"/>
  <text class="where-used-not-made-h1"  x="30" y="40">A traceback reports use, not origin</text>
  <text class="where-used-not-made-sub" x="30" y="64">Which is why the bug is often elsewhere.</text>
  <rect class="where-used-not-made-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="where-used-not-made-name" x="46" y="122">Where it is reported</text>
  <text class="where-used-not-made-desc" x="46" y="142">The line that used the value.</text>
  <text class="where-used-not-made-desc where-used-not-made-row where-used-not-made-r0" x="46" y="182">value.strip() raised AttributeError</text>
  <text class="where-used-not-made-desc where-used-not-made-row where-used-not-made-r1" x="46" y="216">This line is correct as written</text>
  <text class="where-used-not-made-desc where-used-not-made-row where-used-not-made-r2" x="46" y="250">Changing it would only hide the problem</text>
  <text class="where-used-not-made-desc where-used-not-made-row where-used-not-made-r3" x="46" y="284">It is the first line that CARED</text>
  <text class="where-used-not-made-desc where-used-not-made-row where-used-not-made-r4" x="46" y="318">Often several calls from the cause</text>
  <rect class="where-used-not-made-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="where-used-not-made-name" x="526" y="122">Where it was caused</text>
  <text class="where-used-not-made-desc" x="526" y="142">The line that produced it.</text>
  <text class="where-used-not-made-desc where-used-not-made-row where-used-not-made-r0" x="526" y="182">A function returned None</text>
  <text class="where-used-not-made-desc where-used-not-made-row where-used-not-made-r1" x="526" y="216">Perhaps by falling off the end</text>
  <text class="where-used-not-made-desc where-used-not-made-row where-used-not-made-r2" x="526" y="250">Perhaps a .get() that found nothing</text>
  <text class="where-used-not-made-desc where-used-not-made-row where-used-not-made-r3" x="526" y="284">Nothing complained at the time</text>
  <text class="where-used-not-made-desc where-used-not-made-row where-used-not-made-r4" x="526" y="318">Work BACKWARDS from the value</text>
  <text class="where-used-not-made-sub" x="30" y="372">"NoneType object has no attribute" is the most common error in Python and it always means the same thing: something returned None silently, and the traceback points at the first place that minded.</text>
</svg>
