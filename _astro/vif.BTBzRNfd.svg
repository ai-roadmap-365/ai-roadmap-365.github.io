<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Variance inflation</title>
  <style>
    .vif-bg   { fill: #f8fafc; }
    .vif-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vif-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vif-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vif-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vif-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vif-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vif-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .vif-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .vif-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .vif-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .vif-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .vif-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .vif-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .vif-stage { opacity: 1; }

    .vif-s0 { animation-delay: 0.00s; }
    .vif-e0 { animation-delay: 0.00s; }
    .vif-s1 { animation-delay: 1.28s; }
    .vif-e1 { animation-delay: 1.28s; }
    .vif-s2 { animation-delay: 2.56s; }
    .vif-e2 { animation-delay: 2.56s; }
    .vif-s3 { animation-delay: 3.84s; }
    .vif-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .vif-conn  { animation: vif-trace 6.4s ease-in-out infinite; }
      .vif-stage { animation: vif-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes vif-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes vif-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .vif-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .vif-stage { animation: vif-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes vif-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="vif-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="vif-bg" width="980" height="322"/>
  <text class="vif-h1"  x="30" y="40">Variance inflation</text>
  <text class="vif-sub" x="30" y="64">Four steps.</text>
  <g class="vif-stage vif-s0">
    <rect class="vif-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="vif-step" x="44" y="142">01</text>
    <text class="vif-name" x="70" y="142">Regress each predictor on all the others</text>
    <text class="vif-desc" x="44" y="166">Using the same linear machinery.</text>
  </g>
  <line class="vif-line vif-conn vif-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#vif-tip)"/>
  <g class="vif-stage vif-s1">
    <rect class="vif-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="vif-step" x="280" y="142">02</text>
    <text class="vif-name" x="306" y="142">A high fit means it is nearly redundant</text>
    <text class="vif-desc" x="280" y="166">Its information is already</text>
    <text class="vif-desc" x="280" y="182">present.</text>
  </g>
  <line class="vif-line vif-conn vif-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#vif-tip)"/>
  <g class="vif-stage vif-s2">
    <rect class="vif-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="vif-step" x="516" y="142">03</text>
    <text class="vif-name" x="542" y="142">The inflation factor converts that into a multiplier</text>
    <text class="vif-desc" x="516" y="166">On the coefficient's variance.</text>
  </g>
  <line class="vif-line vif-conn vif-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#vif-tip)"/>
  <g class="vif-stage vif-s3">
    <rect class="vif-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="vif-step" x="752" y="142">04</text>
    <text class="vif-name" x="778" y="142">Above five is notable, above ten is serious</text>
    <text class="vif-desc" x="752" y="166">With diabetes values reaching</text>
    <text class="vif-desc" x="752" y="182">59.2.</text>
  </g>
  <text class="vif-sub" x="30" y="304">Computing it from its own definition rather than calling a function is worth doing once: it makes clear that the factor is just another regression.</text>
</svg>
