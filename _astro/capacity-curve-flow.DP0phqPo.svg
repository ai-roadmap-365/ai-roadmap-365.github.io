<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" role="img" aria-labelledby="d145f-title d145f-desc" width="1040" height="620">
  <title id="d145f-title">Training error falling with capacity while test error turns and explodes</title>
  <desc id="d145f-desc">Two curves against polynomial degree on a logarithmic error axis. Training error falls steadily from 11.32 to about 1. Test error falls to a minimum of 5.4911 at degree 4 and then rises by more than four orders of magnitude to 226667 at degree 24. The gap between the curves is the generalisation gap and it is negative at the left-hand end.</desc>
  <style>
    .d145f-bg { fill: #f8fafc; }
    .d145f-title { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 25px; font-weight: 700; }
    .d145f-label { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; }
    .d145f-muted { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d145f-tick { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; }
    .d145f-gridtext { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d145f-head { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; }
    .d145f-axis { stroke: #1a202c; stroke-width: 2; }
    .d145f-grid { stroke: #cbd5e1; stroke-width: 1; }
    .d145f-train { fill: none; stroke: #1a202c; stroke-width: 3; }
    .d145f-test { fill: none; stroke: #1d4ed8; stroke-width: 3.5; }
    .d145f-trdot { fill: #ffffff; stroke: #1a202c; stroke-width: 2.5; }
    .d145f-tedot { fill: #1d4ed8; stroke: #1d4ed8; stroke-width: 2; }
    .d145f-best { stroke: #1d4ed8; stroke-width: 2; stroke-dasharray: 6 5; }
    .d145f-note { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 2; }
    .d145f-p0 { animation: d145f-pop 8s ease-out 0.0s infinite; }
    .d145f-p1 { animation: d145f-pop 8s ease-out 0.6s infinite; }
    .d145f-p2 { animation: d145f-pop 8s ease-out 1.2s infinite; }
    .d145f-p3 { animation: d145f-pop 8s ease-out 1.8s infinite; }
    .d145f-p4 { animation: d145f-pop 8s ease-out 2.4s infinite; }
    .d145f-p5 { animation: d145f-pop 8s ease-out 3.0s infinite; }
    .d145f-p6 { animation: d145f-pop 8s ease-out 3.6s infinite; }
    .d145f-p7 { animation: d145f-pop 8s ease-out 4.2s infinite; }
    .d145f-p8 { animation: d145f-pop 8s ease-out 4.8s infinite; }
    .d145f-p9 { animation: d145f-pop 8s ease-out 5.4s infinite; }
    @keyframes d145f-pop {
      0%   { opacity: 0.2; }
      6%   { opacity: 1; }
      100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .d145f-p0 { animation: none; opacity: 1; }
      .d145f-p1 { animation: none; opacity: 1; }
      .d145f-p2 { animation: none; opacity: 1; }
      .d145f-p3 { animation: none; opacity: 1; }
      .d145f-p4 { animation: none; opacity: 1; }
      .d145f-p5 { animation: none; opacity: 1; }
      .d145f-p6 { animation: none; opacity: 1; }
      .d145f-p7 { animation: none; opacity: 1; }
      .d145f-p8 { animation: none; opacity: 1; }
      .d145f-p9 { animation: none; opacity: 1; }
    }
  </style>
  <rect class="d145f-bg" x="0" y="0" width="1040" height="620"/>
  <text class="d145f-title" x="520" y="40" text-anchor="middle">Capacity buys training error, and then it starts charging for it</text>
  <text class="d145f-muted" x="520" y="66" text-anchor="middle">25 training rows, 2000 test rows, a cubic truth plus noise. The error axis is logarithmic; it has to be.</text>

  <line class="d145f-grid" x1="130" y1="450.0" x2="910" y2="450.0"/>
  <text class="d145f-gridtext" x="118" y="455.0" text-anchor="end">1</text>
  <line class="d145f-grid" x1="130" y1="390.3" x2="910" y2="390.3"/>
  <text class="d145f-gridtext" x="118" y="395.3" text-anchor="end">10</text>
  <line class="d145f-grid" x1="130" y1="330.6" x2="910" y2="330.6"/>
  <text class="d145f-gridtext" x="118" y="335.6" text-anchor="end">100</text>
  <line class="d145f-grid" x1="130" y1="271.0" x2="910" y2="271.0"/>
  <text class="d145f-gridtext" x="118" y="276.0" text-anchor="end">1,000</text>
  <line class="d145f-grid" x1="130" y1="211.3" x2="910" y2="211.3"/>
  <text class="d145f-gridtext" x="118" y="216.3" text-anchor="end">10,000</text>
  <line class="d145f-grid" x1="130" y1="151.6" x2="910" y2="151.6"/>
  <text class="d145f-gridtext" x="118" y="156.6" text-anchor="end">100,000</text>
  <line class="d145f-axis" x1="130" y1="450" x2="910" y2="450"/>
  <line class="d145f-best" x1="390" y1="130" x2="390" y2="450"/>
  <text class="d145f-head" x="400" y="146">lowest test error: degree 4, at 5.4911</text>

  <polyline class="d145f-train" points="130.0,387.1 216.7,387.1 303.3,424.2 390.0,426.3 476.7,432.6 563.3,436.2 650.0,442.1 736.7,450.0 823.3,449.9 910.0,449.2"/>
  <polyline class="d145f-test" points="130.0,390.8 216.7,390.6 303.3,403.0 390.0,405.9 476.7,378.4 563.3,365.4 650.0,287.5 736.7,181.7 823.3,158.9 910.0,130.4"/>
  <circle class="d145f-tedot d145f-p0" cx="130.0" cy="390.8" r="6"/>
  <circle class="d145f-tedot d145f-p1" cx="216.7" cy="390.6" r="6"/>
  <circle class="d145f-tedot d145f-p2" cx="303.3" cy="403.0" r="6"/>
  <circle class="d145f-tedot d145f-p3" cx="390.0" cy="405.9" r="6"/>
  <circle class="d145f-tedot d145f-p4" cx="476.7" cy="378.4" r="6"/>
  <circle class="d145f-tedot d145f-p5" cx="563.3" cy="365.4" r="6"/>
  <circle class="d145f-tedot d145f-p6" cx="650.0" cy="287.5" r="6"/>
  <circle class="d145f-tedot d145f-p7" cx="736.7" cy="181.7" r="6"/>
  <circle class="d145f-tedot d145f-p8" cx="823.3" cy="158.9" r="6"/>
  <circle class="d145f-tedot d145f-p9" cx="910.0" cy="130.4" r="6"/>
  <circle class="d145f-trdot d145f-p0" cx="130.0" cy="387.1" r="5"/>
  <circle class="d145f-trdot d145f-p1" cx="216.7" cy="387.1" r="5"/>
  <circle class="d145f-trdot d145f-p2" cx="303.3" cy="424.2" r="5"/>
  <circle class="d145f-trdot d145f-p3" cx="390.0" cy="426.3" r="5"/>
  <circle class="d145f-trdot d145f-p4" cx="476.7" cy="432.6" r="5"/>
  <circle class="d145f-trdot d145f-p5" cx="563.3" cy="436.2" r="5"/>
  <circle class="d145f-trdot d145f-p6" cx="650.0" cy="442.1" r="5"/>
  <circle class="d145f-trdot d145f-p7" cx="736.7" cy="450.0" r="5"/>
  <circle class="d145f-trdot d145f-p8" cx="823.3" cy="449.9" r="5"/>
  <circle class="d145f-trdot d145f-p9" cx="910.0" cy="449.2" r="5"/>
  <text class="d145f-tick" x="130" y="476" text-anchor="middle">1</text>
  <text class="d145f-tick" x="217" y="476" text-anchor="middle">2</text>
  <text class="d145f-tick" x="303" y="476" text-anchor="middle">3</text>
  <text class="d145f-tick" x="390" y="476" text-anchor="middle">4</text>
  <text class="d145f-tick" x="477" y="476" text-anchor="middle">6</text>
  <text class="d145f-tick" x="563" y="476" text-anchor="middle">8</text>
  <text class="d145f-tick" x="650" y="476" text-anchor="middle">10</text>
  <text class="d145f-tick" x="737" y="476" text-anchor="middle">14</text>
  <text class="d145f-tick" x="823" y="476" text-anchor="middle">18</text>
  <text class="d145f-tick" x="910" y="476" text-anchor="middle">24</text>
  <text class="d145f-label" x="520" y="506" text-anchor="middle">polynomial degree — the capacity of the model class</text>
  <text class="d145f-muted" x="22" y="116">mean squared error</text>

  <circle class="d145f-tedot" cx="150" cy="96" r="6"/>
  <text class="d145f-head" x="166" y="101">test error</text>
  <circle class="d145f-trdot" cx="300" cy="96" r="5"/>
  <text class="d145f-head" x="316" y="101">training error</text>

  <rect class="d145f-note" x="80" y="510" width="880" height="94" rx="10"/>
  <text class="d145f-label" x="520" y="540" text-anchor="middle">At the left the curves are the wrong way round: test error sits BELOW training error, because a model too rigid to</text>
  <text class="d145f-label" x="520" y="564" text-anchor="middle">chase noise has none to be flattered by. That negative gap is the signature of underfitting, and it is the one people miss.</text>
  <text class="d145f-muted" x="520" y="590" text-anchor="middle">With motion switched off, both curves and every marker are already in place.</text>
</svg>
