<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Chosen by distribution.">
  <title>Three scaling methods</title>
  <style>
    .scaling-taxonomy-bg   { fill: #f8fafc; }
    .scaling-taxonomy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-taxonomy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-taxonomy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-taxonomy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-taxonomy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-taxonomy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scaling-taxonomy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scaling-taxonomy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scaling-taxonomy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scaling-taxonomy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scaling-taxonomy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scaling-taxonomy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scaling-taxonomy-row { opacity: 1; }
    .scaling-taxonomy-r0 { animation-delay: 0.00s; }
    .scaling-taxonomy-r1 { animation-delay: 0.45s; }
    .scaling-taxonomy-r2 { animation-delay: 0.90s; }
    .scaling-taxonomy-r3 { animation-delay: 1.35s; }
    .scaling-taxonomy-r4 { animation-delay: 1.80s; }
    .scaling-taxonomy-row { animation: scaling-taxonomy-reveal 7.3s ease-in-out infinite; }
    @keyframes scaling-taxonomy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="scaling-taxonomy-bg" width="980" height="390"/>
  <text class="scaling-taxonomy-h1"  x="30" y="40">Three scaling methods</text>
  <text class="scaling-taxonomy-sub" x="30" y="64">Chosen by distribution.</text>
  <rect class="scaling-taxonomy-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="scaling-taxonomy-name" x="46" y="122">The method</text>
  <text class="scaling-taxonomy-desc" x="46" y="142">What it does.</text>
  <text class="scaling-taxonomy-desc scaling-taxonomy-row scaling-taxonomy-r0" x="46" y="182">Standardisation — subtract mean, divide by deviation</text>
  <text class="scaling-taxonomy-desc scaling-taxonomy-row scaling-taxonomy-r1" x="46" y="216">Min-max — squash into a fixed range</text>
  <text class="scaling-taxonomy-desc scaling-taxonomy-row scaling-taxonomy-r2" x="46" y="250">Robust — use median and interquartile range</text>
  <text class="scaling-taxonomy-desc scaling-taxonomy-row scaling-taxonomy-r3" x="46" y="284">Log or power transform — compress a long tail</text>
  <text class="scaling-taxonomy-desc scaling-taxonomy-row scaling-taxonomy-r4" x="46" y="318">Quantile — force a target distribution</text>
  <rect class="scaling-taxonomy-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="scaling-taxonomy-name" x="526" y="122">When</text>
  <text class="scaling-taxonomy-desc" x="526" y="142">What it suits.</text>
  <text class="scaling-taxonomy-desc scaling-taxonomy-row scaling-taxonomy-r0" x="526" y="182">Roughly symmetric distributions; the default</text>
  <text class="scaling-taxonomy-desc scaling-taxonomy-row scaling-taxonomy-r1" x="526" y="216">Bounded inputs, such as image pixels</text>
  <text class="scaling-taxonomy-desc scaling-taxonomy-row scaling-taxonomy-r2" x="526" y="250">Data with outliers you cannot remove</text>
  <text class="scaling-taxonomy-desc scaling-taxonomy-row scaling-taxonomy-r3" x="526" y="284">Skewed positive quantities such as income</text>
  <text class="scaling-taxonomy-desc scaling-taxonomy-row scaling-taxonomy-r4" x="526" y="318">When the shape itself is the problem</text>
  <text class="scaling-taxonomy-sub" x="30" y="372">Robust scaling is under-used: a single extreme outlier is enough to make standardisation compress every real value into a narrow band.</text>
</svg>
