<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One ratio, one threshold.">
  <title>The four-fifths rule</title>
  <style>
    .four-fifths-bg   { fill: #f8fafc; }
    .four-fifths-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-fifths-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-fifths-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-fifths-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-fifths-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-fifths-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .four-fifths-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .four-fifths-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .four-fifths-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .four-fifths-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .four-fifths-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .four-fifths-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .four-fifths-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .four-fifths-stage { opacity: 1; }

    .four-fifths-s0 { animation-delay: 0.00s; }
    .four-fifths-e0 { animation-delay: 0.00s; }
    .four-fifths-s1 { animation-delay: 1.28s; }
    .four-fifths-e1 { animation-delay: 1.28s; }
    .four-fifths-s2 { animation-delay: 2.56s; }
    .four-fifths-e2 { animation-delay: 2.56s; }
    .four-fifths-s3 { animation-delay: 3.84s; }
    .four-fifths-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .four-fifths-conn  { animation: four-fifths-trace 6.4s ease-in-out infinite; }
      .four-fifths-stage { animation: four-fifths-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes four-fifths-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes four-fifths-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .four-fifths-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .four-fifths-stage { animation: four-fifths-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes four-fifths-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="four-fifths-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="four-fifths-bg" width="980" height="322"/>
  <text class="four-fifths-h1"  x="30" y="40">The four-fifths rule</text>
  <text class="four-fifths-sub" x="30" y="64">One ratio, one threshold.</text>
  <g class="four-fifths-stage four-fifths-s0">
    <rect class="four-fifths-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="four-fifths-step" x="44" y="142">01</text>
    <text class="four-fifths-name" x="70" y="142">Selection rate per group</text>
    <text class="four-fifths-desc" x="44" y="166">The proportion of each group the</text>
    <text class="four-fifths-desc" x="44" y="182">system selects.</text>
  </g>
  <line class="four-fifths-line four-fifths-conn four-fifths-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#four-fifths-tip)"/>
  <g class="four-fifths-stage four-fifths-s1">
    <rect class="four-fifths-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="four-fifths-step" x="280" y="142">02</text>
    <text class="four-fifths-name" x="306" y="142">Ratio = protected / reference</text>
    <text class="four-fifths-desc" x="280" y="166">A single number, computable from</text>
    <text class="four-fifths-desc" x="280" y="182">the same evaluation set.</text>
  </g>
  <line class="four-fifths-line four-fifths-conn four-fifths-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#four-fifths-tip)"/>
  <g class="four-fifths-stage four-fifths-s2">
    <rect class="four-fifths-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="four-fifths-step" x="516" y="142">03</text>
    <text class="four-fifths-name" x="542" y="142">Below 0.80 is adverse impact</text>
    <text class="four-fifths-desc" x="516" y="166">The EEOC standard. A legal</text>
    <text class="four-fifths-desc" x="516" y="182">threshold, not a preference.</text>
    <text class="four-fifths-edge" x="516" y="242">0.80</text>
  </g>
  <line class="four-fifths-line four-fifths-conn four-fifths-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#four-fifths-tip)"/>
  <g class="four-fifths-stage four-fifths-s3">
    <rect class="four-fifths-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="four-fifths-step" x="752" y="142">04</text>
    <text class="four-fifths-name" x="778" y="142">Which a CI job can block on</text>
    <text class="four-fifths-desc" x="752" y="166">A fairness metric is a gate,</text>
    <text class="four-fifths-desc" x="752" y="182">exactly like a test.</text>
  </g>
  <text class="four-fifths-sub" x="30" y="304">The value of a numeric threshold is that it converts an argument into a check: whatever else is contested about algorithmic fairness, a ratio below 0.80 is a stated legal standard a pipeline can enforce.</text>
</svg>
