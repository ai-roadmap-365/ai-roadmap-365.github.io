<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Open until you find the smallest.">
  <title>Boxes inside boxes</title>
  <style>
    .nested-boxes-bg   { fill: #f8fafc; }
    .nested-boxes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nested-boxes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nested-boxes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nested-boxes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nested-boxes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nested-boxes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nested-boxes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .nested-boxes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .nested-boxes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .nested-boxes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .nested-boxes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .nested-boxes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nested-boxes-row { opacity: 1; }
    .nested-boxes-r0 { animation-delay: 0.00s; }
    .nested-boxes-r1 { animation-delay: 0.45s; }
    .nested-boxes-r2 { animation-delay: 0.90s; }
    .nested-boxes-r3 { animation-delay: 1.35s; }
    .nested-boxes-r4 { animation-delay: 1.80s; }
    .nested-boxes-row { animation: nested-boxes-reveal 7.3s ease-in-out infinite; }
    @keyframes nested-boxes-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="nested-boxes-bg" width="980" height="390"/>
  <text class="nested-boxes-h1"  x="30" y="40">Boxes inside boxes</text>
  <text class="nested-boxes-sub" x="30" y="64">Open until you find the smallest.</text>
  <rect class="nested-boxes-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="nested-boxes-name" x="46" y="122">Opening inward</text>
  <text class="nested-boxes-desc" x="46" y="142">The descent.</text>
  <text class="nested-boxes-desc nested-boxes-row nested-boxes-r0" x="46" y="182">Each box contains a smaller one</text>
  <text class="nested-boxes-desc nested-boxes-row nested-boxes-r1" x="46" y="216">Set the current one aside, open the next</text>
  <text class="nested-boxes-desc nested-boxes-row nested-boxes-r2" x="46" y="250">The pile of opened boxes grows</text>
  <text class="nested-boxes-desc nested-boxes-row nested-boxes-r3" x="46" y="284">Until one contains no box</text>
  <text class="nested-boxes-desc nested-boxes-row nested-boxes-r4" x="46" y="318">This is the recursive descent</text>
  <rect class="nested-boxes-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="nested-boxes-name" x="526" y="122">Closing outward</text>
  <text class="nested-boxes-desc" x="526" y="142">The unwinding.</text>
  <text class="nested-boxes-desc nested-boxes-row nested-boxes-r0" x="526" y="182">Take the innermost result</text>
  <text class="nested-boxes-desc nested-boxes-row nested-boxes-r1" x="526" y="216">Combine it with the box you set aside</text>
  <text class="nested-boxes-desc nested-boxes-row nested-boxes-r2" x="526" y="250">Work back through the pile</text>
  <text class="nested-boxes-desc nested-boxes-row nested-boxes-r3" x="526" y="284">Until the outermost is complete</text>
  <text class="nested-boxes-desc nested-boxes-row nested-boxes-r4" x="526" y="318">This is the return journey</text>
  <text class="nested-boxes-sub" x="30" y="372">The pile of set-aside boxes is the call stack made physical, and it is why the depth rather than the total work decides whether it fits.</text>
</svg>
