<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Three gates, or two.">
  <title>LSTM or GRU</title>
  <style>
    .lstm-or-gru-bg   { fill: #f8fafc; }
    .lstm-or-gru-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lstm-or-gru-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lstm-or-gru-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lstm-or-gru-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lstm-or-gru-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lstm-or-gru-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lstm-or-gru-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .lstm-or-gru-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .lstm-or-gru-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .lstm-or-gru-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .lstm-or-gru-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .lstm-or-gru-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lstm-or-gru-row { opacity: 1; }
    .lstm-or-gru-r0 { animation-delay: 0.00s; }
    .lstm-or-gru-r1 { animation-delay: 0.45s; }
    .lstm-or-gru-r2 { animation-delay: 0.90s; }
    .lstm-or-gru-r3 { animation-delay: 1.35s; }
    .lstm-or-gru-r4 { animation-delay: 1.80s; }
    .lstm-or-gru-row { animation: lstm-or-gru-reveal 7.3s ease-in-out infinite; }
    @keyframes lstm-or-gru-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="lstm-or-gru-bg" width="980" height="390"/>
  <text class="lstm-or-gru-h1"  x="30" y="40">LSTM or GRU</text>
  <text class="lstm-or-gru-sub" x="30" y="64">Three gates, or two.</text>
  <rect class="lstm-or-gru-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="lstm-or-gru-name" x="46" y="122">LSTM</text>
  <text class="lstm-or-gru-desc" x="46" y="142">Three gates, two states.</text>
  <text class="lstm-or-gru-desc lstm-or-gru-row lstm-or-gru-r0" x="46" y="182">Forget, input and output gates</text>
  <text class="lstm-or-gru-desc lstm-or-gru-row lstm-or-gru-r1" x="46" y="216">A separate cell state and hidden state</text>
  <text class="lstm-or-gru-desc lstm-or-gru-row lstm-or-gru-r2" x="46" y="250">More parameters per unit</text>
  <text class="lstm-or-gru-desc lstm-or-gru-row lstm-or-gru-r3" x="46" y="284">Slightly better on very long dependencies</text>
  <text class="lstm-or-gru-desc lstm-or-gru-row lstm-or-gru-r4" x="46" y="318">The original, and still competitive</text>
  <rect class="lstm-or-gru-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="lstm-or-gru-name" x="526" y="122">GRU</text>
  <text class="lstm-or-gru-desc" x="526" y="142">Two gates, one state.</text>
  <text class="lstm-or-gru-desc lstm-or-gru-row lstm-or-gru-r0" x="526" y="182">Reset and update gates</text>
  <text class="lstm-or-gru-desc lstm-or-gru-row lstm-or-gru-r1" x="526" y="216">No separate cell state</text>
  <text class="lstm-or-gru-desc lstm-or-gru-row lstm-or-gru-r2" x="526" y="250">About a quarter fewer parameters</text>
  <text class="lstm-or-gru-desc lstm-or-gru-row lstm-or-gru-r3" x="526" y="284">Roughly a third faster to train</text>
  <text class="lstm-or-gru-desc lstm-or-gru-row lstm-or-gru-r4" x="526" y="318">Comparable accuracy on most tasks</text>
  <text class="lstm-or-gru-sub" x="30" y="372">The empirical picture is that they perform similarly on most problems, which makes the GRU the reasonable default and the LSTM worth trying when sequences are genuinely long.</text>
</svg>
