<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five gates from training to a running pod.">
  <title>The provenance pipeline</title>
  <style>
    .provenance-pipeline-bg   { fill: #f8fafc; }
    .provenance-pipeline-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .provenance-pipeline-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .provenance-pipeline-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .provenance-pipeline-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .provenance-pipeline-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .provenance-pipeline-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .provenance-pipeline-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .provenance-pipeline-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .provenance-pipeline-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .provenance-pipeline-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .provenance-pipeline-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .provenance-pipeline-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .provenance-pipeline-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .provenance-pipeline-stage { opacity: 1; }

    .provenance-pipeline-s0 { animation-delay: 0.00s; }
    .provenance-pipeline-e0 { animation-delay: 0.00s; }
    .provenance-pipeline-s1 { animation-delay: 1.33s; }
    .provenance-pipeline-e1 { animation-delay: 1.33s; }
    .provenance-pipeline-s2 { animation-delay: 2.67s; }
    .provenance-pipeline-e2 { animation-delay: 2.67s; }
    .provenance-pipeline-s3 { animation-delay: 4.00s; }
    .provenance-pipeline-e3 { animation-delay: 4.00s; }
    .provenance-pipeline-s4 { animation-delay: 5.33s; }
    .provenance-pipeline-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .provenance-pipeline-conn  { animation: provenance-pipeline-trace 8s ease-in-out infinite; }
      .provenance-pipeline-stage { animation: provenance-pipeline-arrive 8s ease-in-out infinite; }
    }
    @keyframes provenance-pipeline-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes provenance-pipeline-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .provenance-pipeline-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .provenance-pipeline-stage { animation: provenance-pipeline-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes provenance-pipeline-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="provenance-pipeline-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="provenance-pipeline-bg" width="980" height="322"/>
  <text class="provenance-pipeline-h1"  x="30" y="40">The provenance pipeline</text>
  <text class="provenance-pipeline-sub" x="30" y="64">Five gates from training to a running pod.</text>
  <g class="provenance-pipeline-stage provenance-pipeline-s0">
    <rect class="provenance-pipeline-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="provenance-pipeline-step" x="44" y="142">01</text>
    <text class="provenance-pipeline-name" x="70" y="142">Ingest the artefact</text>
    <text class="provenance-pipeline-desc" x="44" y="166">From training, or from a</text>
    <text class="provenance-pipeline-desc" x="44" y="182">public hub. Treated</text>
    <text class="provenance-pipeline-desc" x="44" y="198">identically.</text>
  </g>
  <line class="provenance-pipeline-line provenance-pipeline-conn provenance-pipeline-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#provenance-pipeline-tip)"/>
  <g class="provenance-pipeline-stage provenance-pipeline-s1">
    <rect class="provenance-pipeline-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="provenance-pipeline-step" x="233" y="142">02</text>
    <text class="provenance-pipeline-name" x="259" y="142">Scan statically</text>
    <text class="provenance-pipeline-desc" x="233" y="166">ModelScan over the</text>
    <text class="provenance-pipeline-desc" x="233" y="182">opcodes. A pickle in a</text>
    <text class="provenance-pipeline-desc" x="233" y="198">bundle fails here.</text>
    <text class="provenance-pipeline-edge" x="233" y="242">&lt;2s</text>
  </g>
  <line class="provenance-pipeline-line provenance-pipeline-conn provenance-pipeline-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#provenance-pipeline-tip)"/>
  <g class="provenance-pipeline-stage provenance-pipeline-s2">
    <rect class="provenance-pipeline-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="provenance-pipeline-step" x="422" y="142">03</text>
    <text class="provenance-pipeline-name" x="448" y="142">Sign with Cosign</text>
    <text class="provenance-pipeline-desc" x="422" y="166">Weights and the tokenizer</text>
    <text class="provenance-pipeline-desc" x="422" y="182">bundle, against a build</text>
    <text class="provenance-pipeline-desc" x="422" y="198">identity.</text>
  </g>
  <line class="provenance-pipeline-line provenance-pipeline-conn provenance-pipeline-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#provenance-pipeline-tip)"/>
  <g class="provenance-pipeline-stage provenance-pipeline-s3">
    <rect class="provenance-pipeline-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="provenance-pipeline-step" x="611" y="142">04</text>
    <text class="provenance-pipeline-name" x="637" y="142">Generate the AIBOM</text>
    <text class="provenance-pipeline-desc" x="611" y="166">CycloneDX. Hashes,</text>
    <text class="provenance-pipeline-desc" x="611" y="182">dataset lineage,</text>
    <text class="provenance-pipeline-desc" x="611" y="198">dependency versions.</text>
  </g>
  <line class="provenance-pipeline-line provenance-pipeline-conn provenance-pipeline-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#provenance-pipeline-tip)"/>
  <g class="provenance-pipeline-stage provenance-pipeline-s4">
    <rect class="provenance-pipeline-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="provenance-pipeline-step" x="800" y="142">05</text>
    <text class="provenance-pipeline-name" x="826" y="142">Verify at admission</text>
    <text class="provenance-pipeline-desc" x="800" y="166">A Kubernetes webhook</text>
    <text class="provenance-pipeline-desc" x="800" y="182">rejects any unsigned</text>
    <text class="provenance-pipeline-desc" x="800" y="198">artefact.</text>
    <text class="provenance-pipeline-edge" x="800" y="242">the gate</text>
  </g>
  <text class="provenance-pipeline-sub" x="30" y="304">The last stage is what makes the earlier four load-bearing: without an admission check, every control upstream is advisory, and an artefact that skipped the pipeline runs exactly as easily as one that did not.</text>
</svg>
