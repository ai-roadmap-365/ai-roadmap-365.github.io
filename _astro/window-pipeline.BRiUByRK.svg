<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A window is the unit of judgement.">
  <title>Five rules for judging a window</title>
  <style>
    .window-pipeline-bg   { fill: #f8fafc; }
    .window-pipeline-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .window-pipeline-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .window-pipeline-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .window-pipeline-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .window-pipeline-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .window-pipeline-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .window-pipeline-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .window-pipeline-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .window-pipeline-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .window-pipeline-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .window-pipeline-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .window-pipeline-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .window-pipeline-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .window-pipeline-stage { opacity: 1; }

    .window-pipeline-s0 { animation-delay: 0.00s; }
    .window-pipeline-e0 { animation-delay: 0.00s; }
    .window-pipeline-s1 { animation-delay: 1.33s; }
    .window-pipeline-e1 { animation-delay: 1.33s; }
    .window-pipeline-s2 { animation-delay: 2.67s; }
    .window-pipeline-e2 { animation-delay: 2.67s; }
    .window-pipeline-s3 { animation-delay: 4.00s; }
    .window-pipeline-e3 { animation-delay: 4.00s; }
    .window-pipeline-s4 { animation-delay: 5.33s; }
    .window-pipeline-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .window-pipeline-conn  { animation: window-pipeline-trace 8s ease-in-out infinite; }
      .window-pipeline-stage { animation: window-pipeline-arrive 8s ease-in-out infinite; }
    }
    @keyframes window-pipeline-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes window-pipeline-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .window-pipeline-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .window-pipeline-stage { animation: window-pipeline-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes window-pipeline-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="window-pipeline-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="window-pipeline-bg" width="980" height="322"/>
  <text class="window-pipeline-h1"  x="30" y="40">Five rules for judging a window</text>
  <text class="window-pipeline-sub" x="30" y="64">A window is the unit of judgement.</text>
  <g class="window-pipeline-stage window-pipeline-s0">
    <rect class="window-pipeline-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="window-pipeline-step" x="44" y="142">01</text>
    <text class="window-pipeline-name" x="70" y="142">Bucket into fixed windows</text>
    <text class="window-pipeline-desc" x="44" y="166">Each slice of time</text>
    <text class="window-pipeline-desc" x="44" y="182">carries its own metrics.</text>
  </g>
  <line class="window-pipeline-line window-pipeline-conn window-pipeline-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#window-pipeline-tip)"/>
  <g class="window-pipeline-stage window-pipeline-s1">
    <rect class="window-pipeline-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="window-pipeline-step" x="233" y="142">02</text>
    <text class="window-pipeline-name" x="259" y="142">Percentiles by nearest rank</text>
    <text class="window-pipeline-desc" x="233" y="166">ceil(p/100 x n), not</text>
    <text class="window-pipeline-desc" x="233" y="182">round — halves to even</text>
    <text class="window-pipeline-desc" x="233" y="198">picks the wrong</text>
    <text class="window-pipeline-edge" x="233" y="242">ceil</text>
  </g>
  <line class="window-pipeline-line window-pipeline-conn window-pipeline-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#window-pipeline-tip)"/>
  <g class="window-pipeline-stage window-pipeline-s2">
    <rect class="window-pipeline-good" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="window-pipeline-step" x="422" y="142">03</text>
    <text class="window-pipeline-name" x="448" y="142">Refuse to judge small windows</text>
    <text class="window-pipeline-desc" x="422" y="166">Below a minimum count,</text>
    <text class="window-pipeline-desc" x="422" y="182">report insufficient data</text>
    <text class="window-pipeline-desc" x="422" y="198">rather than alert.</text>
    <text class="window-pipeline-edge" x="422" y="242">anti-fatigue</text>
  </g>
  <line class="window-pipeline-line window-pipeline-conn window-pipeline-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#window-pipeline-tip)"/>
  <g class="window-pipeline-stage window-pipeline-s3">
    <rect class="window-pipeline-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="window-pipeline-step" x="611" y="142">04</text>
    <text class="window-pipeline-name" x="637" y="142">Evaluate against budgets</text>
    <text class="window-pipeline-desc" x="611" y="166">Latency to an SLO, errors</text>
    <text class="window-pipeline-desc" x="611" y="182">and groundedness to</text>
    <text class="window-pipeline-desc" x="611" y="198">budgets, spend to a</text>
  </g>
  <line class="window-pipeline-line window-pipeline-conn window-pipeline-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#window-pipeline-tip)"/>
  <g class="window-pipeline-stage window-pipeline-s4">
    <rect class="window-pipeline-warn" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="window-pipeline-step" x="800" y="142">05</text>
    <text class="window-pipeline-name" x="826" y="142">Baseline on the median</text>
    <text class="window-pipeline-desc" x="800" y="166">A mean lets one anomalous</text>
    <text class="window-pipeline-desc" x="800" y="182">window raise the bar and</text>
    <text class="window-pipeline-desc" x="800" y="198">hide the next.</text>
    <text class="window-pipeline-edge" x="800" y="242">robust</text>
  </g>
  <text class="window-pipeline-sub" x="30" y="304">The last rule is the reason a spend alert stops firing after the first incident if you get it wrong: the anomaly you just detected raises a mean baseline enough to swallow the next one.</text>
</svg>
