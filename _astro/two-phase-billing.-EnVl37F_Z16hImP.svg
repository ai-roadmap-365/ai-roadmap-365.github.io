<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Because the cost is unknown in advance.">
  <title>Two-phase settlement</title>
  <style>
    .two-phase-billing-bg   { fill: #f8fafc; }
    .two-phase-billing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-phase-billing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-phase-billing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-phase-billing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-phase-billing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-phase-billing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .two-phase-billing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .two-phase-billing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .two-phase-billing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .two-phase-billing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .two-phase-billing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .two-phase-billing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .two-phase-billing-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .two-phase-billing-stage { opacity: 1; }

    .two-phase-billing-s0 { animation-delay: 0.00s; }
    .two-phase-billing-e0 { animation-delay: 0.00s; }
    .two-phase-billing-s1 { animation-delay: 1.50s; }
    .two-phase-billing-e1 { animation-delay: 1.50s; }
    .two-phase-billing-s2 { animation-delay: 3.00s; }
    .two-phase-billing-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .two-phase-billing-conn  { animation: two-phase-billing-trace 6s ease-in-out infinite; }
      .two-phase-billing-stage { animation: two-phase-billing-arrive 6s ease-in-out infinite; }
    }
    @keyframes two-phase-billing-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes two-phase-billing-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .two-phase-billing-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .two-phase-billing-stage { animation: two-phase-billing-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes two-phase-billing-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="two-phase-billing-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="two-phase-billing-bg" width="980" height="322"/>
  <text class="two-phase-billing-h1"  x="30" y="40">Two-phase settlement</text>
  <text class="two-phase-billing-sub" x="30" y="64">Because the cost is unknown in advance.</text>
  <g class="two-phase-billing-stage two-phase-billing-s0">
    <rect class="two-phase-billing-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="two-phase-billing-step" x="44" y="142">01</text>
    <text class="two-phase-billing-name" x="70" y="142">Pre-authorise an estimate</text>
    <text class="two-phase-billing-desc" x="44" y="166">Reserve a hold against the balance before the</text>
    <text class="two-phase-billing-desc" x="44" y="182">model is called.</text>
    <text class="two-phase-billing-edge" x="44" y="242">hold</text>
  </g>
  <line class="two-phase-billing-line two-phase-billing-conn two-phase-billing-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#two-phase-billing-tip)"/>
  <g class="two-phase-billing-stage two-phase-billing-s1">
    <rect class="two-phase-billing-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="two-phase-billing-step" x="359" y="142">02</text>
    <text class="two-phase-billing-name" x="385" y="142">Generate</text>
    <text class="two-phase-billing-desc" x="359" y="166">Tokens stream. The real cost is discovered as</text>
    <text class="two-phase-billing-desc" x="359" y="182">it happens.</text>
  </g>
  <line class="two-phase-billing-line two-phase-billing-conn two-phase-billing-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#two-phase-billing-tip)"/>
  <g class="two-phase-billing-stage two-phase-billing-s2">
    <rect class="two-phase-billing-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="two-phase-billing-step" x="674" y="142">03</text>
    <text class="two-phase-billing-name" x="700" y="142">Settle the exact amount</text>
    <text class="two-phase-billing-desc" x="674" y="166">Charge what was used; release the remainder.</text>
    <text class="two-phase-billing-edge" x="674" y="242">exact</text>
  </g>
  <text class="two-phase-billing-sub" x="30" y="304">A single deduction cannot work because the amount is not known until afterwards, and deducting after generation means a customer with two cents can spend fifty dollars first.</text>
</svg>
