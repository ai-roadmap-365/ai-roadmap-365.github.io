<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Community-driven throughout.">
  <title>Four steps to local large models</title>
  <style>
    .quant-history-bg   { fill: #f8fafc; }
    .quant-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quant-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quant-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quant-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quant-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quant-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .quant-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .quant-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .quant-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .quant-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .quant-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .quant-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .quant-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .quant-history-stage { opacity: 1; }

    .quant-history-s0 { animation-delay: 0.00s; }
    .quant-history-e0 { animation-delay: 0.00s; }
    .quant-history-s1 { animation-delay: 1.28s; }
    .quant-history-e1 { animation-delay: 1.28s; }
    .quant-history-s2 { animation-delay: 2.56s; }
    .quant-history-e2 { animation-delay: 2.56s; }
    .quant-history-s3 { animation-delay: 3.84s; }
    .quant-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .quant-history-conn  { animation: quant-history-trace 6.4s ease-in-out infinite; }
      .quant-history-stage { animation: quant-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes quant-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes quant-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .quant-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .quant-history-stage { animation: quant-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes quant-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="quant-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="quant-history-bg" width="980" height="322"/>
  <text class="quant-history-h1"  x="30" y="40">Four steps to local large models</text>
  <text class="quant-history-sub" x="30" y="64">Community-driven throughout.</text>
  <g class="quant-history-stage quant-history-s0">
    <rect class="quant-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="quant-history-step" x="44" y="142">01</text>
    <text class="quant-history-name" x="70" y="142">Eight-bit integer deployment</text>
    <text class="quant-history-desc" x="44" y="166">Standard for mobile vision, long</text>
    <text class="quant-history-desc" x="44" y="182">before language models.</text>
  </g>
  <line class="quant-history-line quant-history-conn quant-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#quant-history-tip)"/>
  <g class="quant-history-stage quant-history-s1">
    <rect class="quant-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="quant-history-step" x="280" y="142">02</text>
    <text class="quant-history-name" x="306" y="142">Four-bit quantisation of large models</text>
    <text class="quant-history-desc" x="280" y="166">Which made them fit on consumer</text>
    <text class="quant-history-desc" x="280" y="182">hardware.</text>
  </g>
  <line class="quant-history-line quant-history-conn quant-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#quant-history-tip)"/>
  <g class="quant-history-stage quant-history-s2">
    <rect class="quant-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="quant-history-step" x="516" y="142">03</text>
    <text class="quant-history-name" x="542" y="142">Mixed-precision variants</text>
    <text class="quant-history-desc" x="516" y="166">Allocating bits by layer</text>
    <text class="quant-history-desc" x="516" y="182">sensitivity.</text>
  </g>
  <line class="quant-history-line quant-history-conn quant-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#quant-history-tip)"/>
  <g class="quant-history-stage quant-history-s3">
    <rect class="quant-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="quant-history-step" x="752" y="142">04</text>
    <text class="quant-history-name" x="778" y="142">And a self-describing file format</text>
    <text class="quant-history-desc" x="752" y="166">Carrying the template and</text>
    <text class="quant-history-desc" x="752" y="182">tokeniser with the weights.</text>
  </g>
  <text class="quant-history-sub" x="30" y="304">Much of this was community rather than laboratory work, which is unusual and is why the conventions are named after file formats rather than papers.</text>
</svg>
