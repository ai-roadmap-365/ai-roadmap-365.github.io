<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Holding the doors is the whole idea.">
  <title>A skyscraper elevator</title>
  <style>
    .elevator-analogy-bg   { fill: #f8fafc; }
    .elevator-analogy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .elevator-analogy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .elevator-analogy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .elevator-analogy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .elevator-analogy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .elevator-analogy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .elevator-analogy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .elevator-analogy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .elevator-analogy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .elevator-analogy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .elevator-analogy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .elevator-analogy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .elevator-analogy-row { opacity: 1; }
    .elevator-analogy-r0 { animation-delay: 0.00s; }
    .elevator-analogy-r1 { animation-delay: 0.45s; }
    .elevator-analogy-r2 { animation-delay: 0.90s; }
    .elevator-analogy-r3 { animation-delay: 1.35s; }
    .elevator-analogy-r4 { animation-delay: 1.80s; }
    .elevator-analogy-row { animation: elevator-analogy-reveal 7.3s ease-in-out infinite; }
    @keyframes elevator-analogy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="elevator-analogy-bg" width="980" height="390"/>
  <text class="elevator-analogy-h1"  x="30" y="40">A skyscraper elevator</text>
  <text class="elevator-analogy-sub" x="30" y="64">Holding the doors is the whole idea.</text>
  <rect class="elevator-analogy-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="elevator-analogy-name" x="46" y="122">One passenger per trip</text>
  <text class="elevator-analogy-desc" x="46" y="142">Terrible throughput.</text>
  <text class="elevator-analogy-desc elevator-analogy-row elevator-analogy-r0" x="46" y="182">Floor 1 to floor 50, carrying one</text>
  <text class="elevator-analogy-desc elevator-analogy-row elevator-analogy-r1" x="46" y="216">Ten people waiting in the lobby</text>
  <text class="elevator-analogy-desc elevator-analogy-row elevator-analogy-r2" x="46" y="250">The trip costs the same either way</text>
  <text class="elevator-analogy-desc elevator-analogy-row elevator-analogy-r3" x="46" y="284">The car is the expensive asset</text>
  <text class="elevator-analogy-desc elevator-analogy-row elevator-analogy-r4" x="46" y="318">This is single-request inference</text>
  <rect class="elevator-analogy-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="elevator-analogy-name" x="526" y="122">Hold the doors 3 seconds</text>
  <text class="elevator-analogy-desc" x="526" y="142">Twelve at once.</text>
  <text class="elevator-analogy-desc elevator-analogy-row elevator-analogy-r0" x="526" y="182">Gather twelve going to floors 40-50</text>
  <text class="elevator-analogy-desc elevator-analogy-row elevator-analogy-r1" x="526" y="216">One rapid trip</text>
  <text class="elevator-analogy-desc elevator-analogy-row elevator-analogy-r2" x="526" y="250">Nobody waited long</text>
  <text class="elevator-analogy-desc elevator-analogy-row elevator-analogy-r3" x="526" y="284">The car is fully used</text>
  <text class="elevator-analogy-desc elevator-analogy-row elevator-analogy-r4" x="526" y="318">This is the dynamic batch window</text>
  <text class="elevator-analogy-sub" x="30" y="372">The three-second window is the trade made explicit: everybody's journey starts marginally later and the system's total capacity multiplies, which is only a good trade when the vehicle is the scarce resource.</text>
</svg>
