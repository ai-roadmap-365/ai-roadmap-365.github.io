<svg role="img" aria-label="Constrained Grammar CFG logit masking mechanism showing how vocabulary logits are masked at each step so only valid JSON tokens can be sampled" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Constrained Grammar CFG Logit Masking</title>
  <defs>
    <linearGradient id="bg249b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card249b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg249b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">CONSTRAINED CFG LOGIT MASKING AT INFERENCE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Finite State Machine (FSM) Intersecting Vocabulary Logits to Guarantee Schema Compliance</text>
  <g transform="translate(65, 85)">
    <rect width="720" height="295" fill="url(#card249b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Step 1: Model Emits Unconstrained Logits -->
    <rect x="25" y="25" width="200" height="245" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="125" y="50" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">1. Raw Output Logits</text>
    <text x="35" y="75" fill="#cbd5e1" font-size="8">Generated vocab distribution:</text>
    <text x="35" y="105" fill="#94a3b8" font-size="8">"name": +8.4</text>
    <text x="35" y="130" fill="#fb7185" font-size="8">"Sure": +9.1 (Preamble)</text>
    <text x="35" y="155" fill="#fb7185" font-size="8">"```json": +7.2 (Markdown)</text>
    <text x="35" y="180" fill="#fb7185" font-size="8">"Hello": +6.5</text>
    <text x="35" y="235" fill="#38bdf8" font-size="8">Size: 128k Vocab Dim</text>

    <!-- Step 2: FSM Grammar Mask -->
    <rect x="260" y="25" width="200" height="245" fill="#0f172a" stroke="#fbbf24" rx="6"/>
    <text x="360" y="50" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">2. FSM Grammar Mask</text>
    <text x="270" y="75" fill="#cbd5e1" font-size="8">Schema: Object expecting key</text>
    <text x="270" y="105" fill="#34d399" font-size="8">"name" -&gt; VALID (Pass)</text>
    <text x="270" y="130" fill="#fb7185" font-size="8">"Sure" -&gt; -inf (MASKED)</text>
    <text x="270" y="155" fill="#fb7185" font-size="8">"```" -&gt; -inf (MASKED)</text>
    <text x="270" y="180" fill="#fb7185" font-size="8">"Hello" -&gt; -inf (MASKED)</text>
    <text x="270" y="235" fill="#fbbf24" font-size="8">Dynamic Finite Automaton</text>

    <!-- Step 3: Sampled Token Guaranteed Valid -->
    <rect x="495" y="25" width="200" height="245" fill="#0f172a" stroke="#34d399" stroke-width="1.5" rx="6"/>
    <text x="595" y="50" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">3. Masked Softmax &amp; Sample</text>
    <text x="505" y="75" fill="#cbd5e1" font-size="8">Masked distribution:</text>
    <text x="505" y="105" fill="#34d399" font-size="8">"name" -&gt; P = 1.0 (Sampled)</text>
    <text x="505" y="130" fill="#94a3b8" font-size="8">Others -&gt; P = 0.0</text>
    <rect x="505" y="160" width="180" height="90" fill="#1e293b" rx="4"/>
    <text x="595" y="185" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Guaranteed Parse</text>
    <text x="515" y="210" fill="#cbd5e1" font-size="7">• Zero syntax errors possible</text>
    <text x="515" y="230" fill="#cbd5e1" font-size="7">• Instant deserialization into DB</text>
  </g>
</svg>
