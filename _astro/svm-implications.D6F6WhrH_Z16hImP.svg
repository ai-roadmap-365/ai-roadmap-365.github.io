<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are limits.">
  <title>Four consequences of support vector machines</title>
  <style>
    .svm-implications-bg   { fill: #f8fafc; }
    .svm-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .svm-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .svm-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .svm-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .svm-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .svm-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .svm-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .svm-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .svm-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .svm-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .svm-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .svm-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .svm-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .svm-implications-stage { opacity: 1; }

    .svm-implications-s0 { animation-delay: 0.00s; }
    .svm-implications-e0 { animation-delay: 0.00s; }
    .svm-implications-s1 { animation-delay: 1.28s; }
    .svm-implications-e1 { animation-delay: 1.28s; }
    .svm-implications-s2 { animation-delay: 2.56s; }
    .svm-implications-e2 { animation-delay: 2.56s; }
    .svm-implications-s3 { animation-delay: 3.84s; }
    .svm-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .svm-implications-conn  { animation: svm-implications-trace 6.4s ease-in-out infinite; }
      .svm-implications-stage { animation: svm-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes svm-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes svm-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .svm-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .svm-implications-stage { animation: svm-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes svm-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="svm-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="svm-implications-bg" width="980" height="322"/>
  <text class="svm-implications-h1"  x="30" y="40">Four consequences of support vector machines</text>
  <text class="svm-implications-sub" x="30" y="64">Two are limits.</text>
  <g class="svm-implications-stage svm-implications-s0">
    <rect class="svm-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="svm-implications-step" x="44" y="142">01</text>
    <text class="svm-implications-name" x="70" y="142">Strong on small, high-dimensional datasets</text>
    <text class="svm-implications-desc" x="44" y="166">Where their theory is most</text>
    <text class="svm-implications-desc" x="44" y="182">relevant.</text>
  </g>
  <line class="svm-implications-line svm-implications-conn svm-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#svm-implications-tip)"/>
  <g class="svm-implications-stage svm-implications-s1">
    <rect class="svm-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="svm-implications-step" x="280" y="142">02</text>
    <text class="svm-implications-name" x="306" y="142">But training scales badly with rows</text>
    <text class="svm-implications-desc" x="280" y="166">Quadratic to cubic, which caps</text>
    <text class="svm-implications-desc" x="280" y="182">dataset size.</text>
  </g>
  <line class="svm-implications-line svm-implications-conn svm-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#svm-implications-tip)"/>
  <g class="svm-implications-stage svm-implications-s2">
    <rect class="svm-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="svm-implications-step" x="516" y="142">03</text>
    <text class="svm-implications-name" x="542" y="142">A kernelised model is not interpretable</text>
    <text class="svm-implications-desc" x="516" y="166">The boundary lives in a space</text>
    <text class="svm-implications-desc" x="516" y="182">you cannot inspect.</text>
  </g>
  <line class="svm-implications-line svm-implications-conn svm-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#svm-implications-tip)"/>
  <g class="svm-implications-stage svm-implications-s3">
    <rect class="svm-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="svm-implications-step" x="752" y="142">04</text>
    <text class="svm-implications-name" x="778" y="142">And outputs need calibrating to be probabilities</text>
    <text class="svm-implications-desc" x="752" y="166">Which requires a separate</text>
    <text class="svm-implications-desc" x="752" y="182">held-out fit.</text>
  </g>
  <text class="svm-implications-sub" x="30" y="304">The training complexity is the whole reason for their decline, and it is why they remain competitive on the small datasets where that cost never bites.</text>
</svg>
