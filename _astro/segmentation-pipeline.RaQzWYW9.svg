<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five stages.">
  <title>The segmentation pipeline</title>
  <style>
    .segmentation-pipeline-bg   { fill: #f8fafc; }
    .segmentation-pipeline-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .segmentation-pipeline-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .segmentation-pipeline-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .segmentation-pipeline-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .segmentation-pipeline-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .segmentation-pipeline-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .segmentation-pipeline-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .segmentation-pipeline-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .segmentation-pipeline-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .segmentation-pipeline-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .segmentation-pipeline-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .segmentation-pipeline-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .segmentation-pipeline-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .segmentation-pipeline-stage { opacity: 1; }

    .segmentation-pipeline-s0 { animation-delay: 0.00s; }
    .segmentation-pipeline-e0 { animation-delay: 0.00s; }
    .segmentation-pipeline-s1 { animation-delay: 1.33s; }
    .segmentation-pipeline-e1 { animation-delay: 1.33s; }
    .segmentation-pipeline-s2 { animation-delay: 2.67s; }
    .segmentation-pipeline-e2 { animation-delay: 2.67s; }
    .segmentation-pipeline-s3 { animation-delay: 4.00s; }
    .segmentation-pipeline-e3 { animation-delay: 4.00s; }
    .segmentation-pipeline-s4 { animation-delay: 5.33s; }
    .segmentation-pipeline-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .segmentation-pipeline-conn  { animation: segmentation-pipeline-trace 8s ease-in-out infinite; }
      .segmentation-pipeline-stage { animation: segmentation-pipeline-arrive 8s ease-in-out infinite; }
    }
    @keyframes segmentation-pipeline-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes segmentation-pipeline-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .segmentation-pipeline-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .segmentation-pipeline-stage { animation: segmentation-pipeline-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes segmentation-pipeline-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="segmentation-pipeline-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="segmentation-pipeline-bg" width="980" height="322"/>
  <text class="segmentation-pipeline-h1"  x="30" y="40">The segmentation pipeline</text>
  <text class="segmentation-pipeline-sub" x="30" y="64">Five stages.</text>
  <g class="segmentation-pipeline-stage segmentation-pipeline-s0">
    <rect class="segmentation-pipeline-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="segmentation-pipeline-step" x="44" y="142">01</text>
    <text class="segmentation-pipeline-name" x="70" y="142">Aggregate transactions to one row per customer</text>
    <text class="segmentation-pipeline-desc" x="44" y="166">Which is where most of</text>
    <text class="segmentation-pipeline-desc" x="44" y="182">the code lives.</text>
  </g>
  <line class="segmentation-pipeline-line segmentation-pipeline-conn segmentation-pipeline-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#segmentation-pipeline-tip)"/>
  <g class="segmentation-pipeline-stage segmentation-pipeline-s1">
    <rect class="segmentation-pipeline-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="segmentation-pipeline-step" x="233" y="142">02</text>
    <text class="segmentation-pipeline-name" x="259" y="142">Construct behavioural features</text>
    <text class="segmentation-pipeline-desc" x="233" y="166">Recency, frequency,</text>
    <text class="segmentation-pipeline-desc" x="233" y="182">value, and domain</text>
    <text class="segmentation-pipeline-desc" x="233" y="198">additions.</text>
  </g>
  <line class="segmentation-pipeline-line segmentation-pipeline-conn segmentation-pipeline-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#segmentation-pipeline-tip)"/>
  <g class="segmentation-pipeline-stage segmentation-pipeline-s2">
    <rect class="segmentation-pipeline-warn" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="segmentation-pipeline-step" x="422" y="142">03</text>
    <text class="segmentation-pipeline-name" x="448" y="142">Transform skew and scale</text>
    <text class="segmentation-pipeline-desc" x="422" y="166">Monetary features are</text>
    <text class="segmentation-pipeline-desc" x="422" y="182">heavily skewed; log</text>
    <text class="segmentation-pipeline-desc" x="422" y="198">first.</text>
  </g>
  <line class="segmentation-pipeline-line segmentation-pipeline-conn segmentation-pipeline-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#segmentation-pipeline-tip)"/>
  <g class="segmentation-pipeline-stage segmentation-pipeline-s3">
    <rect class="segmentation-pipeline-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="segmentation-pipeline-step" x="611" y="142">04</text>
    <text class="segmentation-pipeline-name" x="637" y="142">Cluster, with the count chosen deliberately</text>
    <text class="segmentation-pipeline-desc" x="611" y="166">By stability and business</text>
    <text class="segmentation-pipeline-desc" x="611" y="182">usability, not only by</text>
    <text class="segmentation-pipeline-desc" x="611" y="198">score.</text>
  </g>
  <line class="segmentation-pipeline-line segmentation-pipeline-conn segmentation-pipeline-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#segmentation-pipeline-tip)"/>
  <g class="segmentation-pipeline-stage segmentation-pipeline-s4">
    <rect class="segmentation-pipeline-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="segmentation-pipeline-step" x="800" y="142">05</text>
    <text class="segmentation-pipeline-name" x="826" y="142">Then profile and name each segment</text>
    <text class="segmentation-pipeline-desc" x="800" y="166">Which is the deliverable.</text>
  </g>
  <text class="segmentation-pipeline-sub" x="30" y="304">Log-transforming monetary features before scaling is the step most often missed, and without it one high-value customer can define an entire cluster.</text>
</svg>
