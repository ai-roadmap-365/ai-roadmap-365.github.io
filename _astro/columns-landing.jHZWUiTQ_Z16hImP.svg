<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The columns are the landing places</title>
  <style>
    .columns-landing-bg   { fill: #f8fafc; }
    .columns-landing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .columns-landing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .columns-landing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .columns-landing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .columns-landing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .columns-landing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .columns-landing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .columns-landing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .columns-landing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .columns-landing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .columns-landing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .columns-landing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .columns-landing-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .columns-landing-stage { opacity: 1; }

    .columns-landing-s0 { animation-delay: 0.00s; }
    .columns-landing-e0 { animation-delay: 0.00s; }
    .columns-landing-s1 { animation-delay: 1.28s; }
    .columns-landing-e1 { animation-delay: 1.28s; }
    .columns-landing-s2 { animation-delay: 2.56s; }
    .columns-landing-e2 { animation-delay: 2.56s; }
    .columns-landing-s3 { animation-delay: 3.84s; }
    .columns-landing-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .columns-landing-conn  { animation: columns-landing-trace 6.4s ease-in-out infinite; }
      .columns-landing-stage { animation: columns-landing-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes columns-landing-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes columns-landing-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .columns-landing-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .columns-landing-stage { animation: columns-landing-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes columns-landing-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="columns-landing-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="columns-landing-bg" width="980" height="322"/>
  <text class="columns-landing-h1"  x="30" y="40">The columns are the landing places</text>
  <text class="columns-landing-sub" x="30" y="64">Four steps.</text>
  <g class="columns-landing-stage columns-landing-s0">
    <rect class="columns-landing-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="columns-landing-step" x="44" y="142">01</text>
    <text class="columns-landing-name" x="70" y="142">Take the first basis vector: one, then zeros</text>
    <text class="columns-landing-desc" x="44" y="166">Multiply the matrix by it.</text>
  </g>
  <line class="columns-landing-line columns-landing-conn columns-landing-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#columns-landing-tip)"/>
  <g class="columns-landing-stage columns-landing-s1">
    <rect class="columns-landing-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="columns-landing-step" x="280" y="142">02</text>
    <text class="columns-landing-name" x="306" y="142">The result is exactly the first column</text>
    <text class="columns-landing-desc" x="280" y="166">By the definition of the</text>
    <text class="columns-landing-desc" x="280" y="182">product.</text>
  </g>
  <line class="columns-landing-line columns-landing-conn columns-landing-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#columns-landing-tip)"/>
  <g class="columns-landing-stage columns-landing-s2">
    <rect class="columns-landing-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="columns-landing-step" x="516" y="142">03</text>
    <text class="columns-landing-name" x="542" y="142">So the first column is where that basis vector lands</text>
    <text class="columns-landing-desc" x="516" y="166">And likewise for each of the</text>
    <text class="columns-landing-desc" x="516" y="182">others.</text>
  </g>
  <line class="columns-landing-line columns-landing-conn columns-landing-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#columns-landing-tip)"/>
  <g class="columns-landing-stage columns-landing-s3">
    <rect class="columns-landing-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="columns-landing-step" x="752" y="142">04</text>
    <text class="columns-landing-name" x="778" y="142">Everything else follows by combination</text>
    <text class="columns-landing-desc" x="752" y="166">Which is why these few numbers</text>
    <text class="columns-landing-desc" x="752" y="182">fix the whole map.</text>
  </g>
  <text class="columns-landing-sub" x="30" y="304">Reading a matrix by its columns turns it from a grid to be computed with into a picture that can be seen, which is the point of this whole lesson.</text>
</svg>
