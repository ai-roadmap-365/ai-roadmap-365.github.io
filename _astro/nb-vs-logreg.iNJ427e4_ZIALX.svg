<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Generative against discriminative.">
  <title>Naive Bayes against logistic regression</title>
  <style>
    .nb-vs-logreg-bg   { fill: #f8fafc; }
    .nb-vs-logreg-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-vs-logreg-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-vs-logreg-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-vs-logreg-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-vs-logreg-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-vs-logreg-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nb-vs-logreg-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .nb-vs-logreg-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .nb-vs-logreg-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .nb-vs-logreg-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .nb-vs-logreg-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .nb-vs-logreg-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nb-vs-logreg-row { opacity: 1; }
    .nb-vs-logreg-r0 { animation-delay: 0.00s; }
    .nb-vs-logreg-r1 { animation-delay: 0.45s; }
    .nb-vs-logreg-r2 { animation-delay: 0.90s; }
    .nb-vs-logreg-r3 { animation-delay: 1.35s; }
    .nb-vs-logreg-r4 { animation-delay: 1.80s; }
    .nb-vs-logreg-row { animation: nb-vs-logreg-reveal 7.3s ease-in-out infinite; }
    @keyframes nb-vs-logreg-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="nb-vs-logreg-bg" width="980" height="390"/>
  <text class="nb-vs-logreg-h1"  x="30" y="40">Naive Bayes against logistic regression</text>
  <text class="nb-vs-logreg-sub" x="30" y="64">Generative against discriminative.</text>
  <rect class="nb-vs-logreg-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="nb-vs-logreg-name" x="46" y="122">Naive Bayes</text>
  <text class="nb-vs-logreg-desc" x="46" y="142">Models how data is generated.</text>
  <text class="nb-vs-logreg-desc nb-vs-logreg-row nb-vs-logreg-r0" x="46" y="182">Learns each class's feature distribution</text>
  <text class="nb-vs-logreg-desc nb-vs-logreg-row nb-vs-logreg-r1" x="46" y="216">Trains in one pass, by counting</text>
  <text class="nb-vs-logreg-desc nb-vs-logreg-row nb-vs-logreg-r2" x="46" y="250">Strong with very little data</text>
  <text class="nb-vs-logreg-desc nb-vs-logreg-row nb-vs-logreg-r3" x="46" y="284">Poorly calibrated probabilities</text>
  <text class="nb-vs-logreg-desc nb-vs-logreg-row nb-vs-logreg-r4" x="46" y="318">Assumes independence</text>
  <rect class="nb-vs-logreg-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="nb-vs-logreg-name" x="526" y="122">Logistic regression</text>
  <text class="nb-vs-logreg-desc" x="526" y="142">Models the boundary.</text>
  <text class="nb-vs-logreg-desc nb-vs-logreg-row nb-vs-logreg-r0" x="526" y="182">Learns the boundary directly</text>
  <text class="nb-vs-logreg-desc nb-vs-logreg-row nb-vs-logreg-r1" x="526" y="216">Trains iteratively by optimisation</text>
  <text class="nb-vs-logreg-desc nb-vs-logreg-row nb-vs-logreg-r2" x="526" y="250">Needs more data to match</text>
  <text class="nb-vs-logreg-desc nb-vs-logreg-row nb-vs-logreg-r3" x="526" y="284">Well-calibrated probabilities</text>
  <text class="nb-vs-logreg-desc nb-vs-logreg-row nb-vs-logreg-r4" x="526" y="318">Makes no independence assumption</text>
  <text class="nb-vs-logreg-sub" x="30" y="372">The crossover is real and measurable: naive Bayes wins on small datasets and logistic regression overtakes it as data grows, which is worth testing rather than assuming.</text>
</svg>
