<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are cautions.">
  <title>Four consequences of classes</title>
  <style>
    .class-implications-bg   { fill: #f8fafc; }
    .class-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .class-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .class-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .class-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .class-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .class-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .class-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .class-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .class-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .class-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .class-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .class-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .class-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .class-implications-stage { opacity: 1; }

    .class-implications-s0 { animation-delay: 0.00s; }
    .class-implications-e0 { animation-delay: 0.00s; }
    .class-implications-s1 { animation-delay: 1.28s; }
    .class-implications-e1 { animation-delay: 1.28s; }
    .class-implications-s2 { animation-delay: 2.56s; }
    .class-implications-e2 { animation-delay: 2.56s; }
    .class-implications-s3 { animation-delay: 3.84s; }
    .class-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .class-implications-conn  { animation: class-implications-trace 6.4s ease-in-out infinite; }
      .class-implications-stage { animation: class-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes class-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes class-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .class-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .class-implications-stage { animation: class-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes class-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="class-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="class-implications-bg" width="980" height="322"/>
  <text class="class-implications-h1"  x="30" y="40">Four consequences of classes</text>
  <text class="class-implications-sub" x="30" y="64">Two are cautions.</text>
  <g class="class-implications-stage class-implications-s0">
    <rect class="class-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="class-implications-step" x="44" y="142">01</text>
    <text class="class-implications-name" x="70" y="142">The code can mirror the domain</text>
    <text class="class-implications-desc" x="44" y="166">Which makes it readable by</text>
    <text class="class-implications-desc" x="44" y="182">people who know the domain.</text>
  </g>
  <line class="class-implications-line class-implications-conn class-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#class-implications-tip)"/>
  <g class="class-implications-stage class-implications-s1">
    <rect class="class-implications-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="class-implications-step" x="280" y="142">02</text>
    <text class="class-implications-name" x="306" y="142">And state is kept with the operations on it</text>
    <text class="class-implications-desc" x="280" y="166">Rather than passed around.</text>
  </g>
  <line class="class-implications-line class-implications-conn class-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#class-implications-tip)"/>
  <g class="class-implications-stage class-implications-s2">
    <rect class="class-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="class-implications-step" x="516" y="142">03</text>
    <text class="class-implications-name" x="542" y="142">But mutable objects make reasoning harder</text>
    <text class="class-implications-desc" x="516" y="166">Since any method can change</text>
    <text class="class-implications-desc" x="516" y="182">them.</text>
  </g>
  <line class="class-implications-line class-implications-conn class-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#class-implications-tip)"/>
  <g class="class-implications-stage class-implications-s3">
    <rect class="class-implications-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="class-implications-step" x="752" y="142">04</text>
    <text class="class-implications-name" x="778" y="142">And a class with hidden state is harder to test</text>
    <text class="class-implications-desc" x="752" y="166">Than a function with explicit</text>
    <text class="class-implications-desc" x="752" y="182">inputs.</text>
  </g>
  <text class="class-implications-sub" x="30" y="304">Mutable state making reasoning harder is the honest cost, and it is why the functional-core pattern from Day 63 keeps the interesting logic out of objects.</text>
</svg>
