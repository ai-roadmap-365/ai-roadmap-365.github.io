<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are costs.">
  <title>Four consequences of typing</title>
  <style>
    .typing-implications-bg   { fill: #f8fafc; }
    .typing-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .typing-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .typing-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .typing-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .typing-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .typing-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .typing-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .typing-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .typing-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .typing-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .typing-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .typing-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .typing-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .typing-implications-stage { opacity: 1; }

    .typing-implications-s0 { animation-delay: 0.00s; }
    .typing-implications-e0 { animation-delay: 0.00s; }
    .typing-implications-s1 { animation-delay: 1.28s; }
    .typing-implications-e1 { animation-delay: 1.28s; }
    .typing-implications-s2 { animation-delay: 2.56s; }
    .typing-implications-e2 { animation-delay: 2.56s; }
    .typing-implications-s3 { animation-delay: 3.84s; }
    .typing-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .typing-implications-conn  { animation: typing-implications-trace 6.4s ease-in-out infinite; }
      .typing-implications-stage { animation: typing-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes typing-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes typing-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .typing-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .typing-implications-stage { animation: typing-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes typing-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="typing-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="typing-implications-bg" width="980" height="322"/>
  <text class="typing-implications-h1"  x="30" y="40">Four consequences of typing</text>
  <text class="typing-implications-sub" x="30" y="64">Two are costs.</text>
  <g class="typing-implications-stage typing-implications-s0">
    <rect class="typing-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="typing-implications-step" x="44" y="142">01</text>
    <text class="typing-implications-name" x="70" y="142">A class of bug never reaches runtime</text>
    <text class="typing-implications-desc" x="44" y="166">Particularly in long-running</text>
    <text class="typing-implications-desc" x="44" y="182">jobs.</text>
  </g>
  <line class="typing-implications-line typing-implications-conn typing-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#typing-implications-tip)"/>
  <g class="typing-implications-stage typing-implications-s1">
    <rect class="typing-implications-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="typing-implications-step" x="280" y="142">02</text>
    <text class="typing-implications-name" x="306" y="142">And refactoring surfaces every affected caller</text>
    <text class="typing-implications-desc" x="280" y="166">Which makes large changes</text>
    <text class="typing-implications-desc" x="280" y="182">tractable.</text>
  </g>
  <line class="typing-implications-line typing-implications-conn typing-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#typing-implications-tip)"/>
  <g class="typing-implications-stage typing-implications-s2">
    <rect class="typing-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="typing-implications-step" x="516" y="142">03</text>
    <text class="typing-implications-name" x="542" y="142">But annotations must be written and maintained</text>
    <text class="typing-implications-desc" x="516" y="166">Which is real effort.</text>
  </g>
  <line class="typing-implications-line typing-implications-conn typing-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#typing-implications-tip)"/>
  <g class="typing-implications-stage typing-implications-s3">
    <rect class="typing-implications-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="typing-implications-step" x="752" y="142">04</text>
    <text class="typing-implications-name" x="778" y="142">And complex types can become unreadable</text>
    <text class="typing-implications-desc" x="752" y="166">At which point they cost more</text>
    <text class="typing-implications-desc" x="752" y="182">than they buy.</text>
  </g>
  <text class="typing-implications-sub" x="30" y="304">An unreadable type annotation is a signal about the design rather than about typing: a value that needs a five-line type is usually several values.</text>
</svg>
