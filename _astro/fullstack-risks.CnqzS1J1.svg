<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Financial, availability, latency.">
  <title>Three existential risks the design removes</title>
  <style>
    .fullstack-risks-bg   { fill: #f8fafc; }
    .fullstack-risks-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fullstack-risks-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fullstack-risks-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fullstack-risks-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fullstack-risks-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fullstack-risks-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fullstack-risks-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fullstack-risks-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fullstack-risks-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fullstack-risks-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fullstack-risks-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fullstack-risks-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .fullstack-risks-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .fullstack-risks-stage { opacity: 1; }

    .fullstack-risks-s0 { animation-delay: 0.00s; }
    .fullstack-risks-e0 { animation-delay: 0.00s; }
    .fullstack-risks-s1 { animation-delay: 1.50s; }
    .fullstack-risks-e1 { animation-delay: 1.50s; }
    .fullstack-risks-s2 { animation-delay: 3.00s; }
    .fullstack-risks-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .fullstack-risks-conn  { animation: fullstack-risks-trace 6s ease-in-out infinite; }
      .fullstack-risks-stage { animation: fullstack-risks-arrive 6s ease-in-out infinite; }
    }
    @keyframes fullstack-risks-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes fullstack-risks-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .fullstack-risks-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .fullstack-risks-stage { animation: fullstack-risks-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes fullstack-risks-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="fullstack-risks-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="fullstack-risks-bg" width="980" height="322"/>
  <text class="fullstack-risks-h1"  x="30" y="40">Three existential risks the design removes</text>
  <text class="fullstack-risks-sub" x="30" y="64">Financial, availability, latency.</text>
  <g class="fullstack-risks-stage fullstack-risks-s0">
    <rect class="fullstack-risks-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="fullstack-risks-step" x="44" y="142">01</text>
    <text class="fullstack-risks-name" x="70" y="142">Overdraft</text>
    <text class="fullstack-risks-desc" x="44" y="166">A tenant with five cents cannot run a</text>
    <text class="fullstack-risks-desc" x="44" y="182">five-dollar generation.</text>
    <text class="fullstack-risks-edge" x="44" y="242">pre-auth</text>
  </g>
  <line class="fullstack-risks-line fullstack-risks-conn fullstack-risks-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#fullstack-risks-tip)"/>
  <g class="fullstack-risks-stage fullstack-risks-s1">
    <rect class="fullstack-risks-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="fullstack-risks-step" x="359" y="142">02</text>
    <text class="fullstack-risks-name" x="385" y="142">Provider outage</text>
    <text class="fullstack-risks-desc" x="359" y="166">A multi-hour incident becomes a millisecond</text>
    <text class="fullstack-risks-desc" x="359" y="182">reroute.</text>
    <text class="fullstack-risks-edge" x="359" y="242">failover</text>
  </g>
  <line class="fullstack-risks-line fullstack-risks-conn fullstack-risks-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#fullstack-risks-tip)"/>
  <g class="fullstack-risks-stage fullstack-risks-s2">
    <rect class="fullstack-risks-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="fullstack-risks-step" x="674" y="142">03</text>
    <text class="fullstack-risks-name" x="700" y="142">Latency</text>
    <text class="fullstack-risks-desc" x="674" y="166">1,500 ms to under 20 on common queries, with</text>
    <text class="fullstack-risks-desc" x="674" y="182">optimistic UI over the rest.</text>
  </g>
  <text class="fullstack-risks-sub" x="30" y="304">All three are business risks rather than engineering preferences, which is what makes this architecture worth its complexity: each one has ended a product at some point.</text>
</svg>
