<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The through-line of the entire course.">
  <title>Every layer exists to hide the one below</title>
  <style>
    .abstraction-throughline-bg   { fill: #f8fafc; }
    .abstraction-throughline-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .abstraction-throughline-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .abstraction-throughline-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .abstraction-throughline-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .abstraction-throughline-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .abstraction-throughline-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .abstraction-throughline-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .abstraction-throughline-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .abstraction-throughline-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .abstraction-throughline-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .abstraction-throughline-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .abstraction-throughline-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .abstraction-throughline-row { opacity: 1; }
    .abstraction-throughline-r0 { animation-delay: 0.00s; }
    .abstraction-throughline-r1 { animation-delay: 0.45s; }
    .abstraction-throughline-r2 { animation-delay: 0.90s; }
    .abstraction-throughline-r3 { animation-delay: 1.35s; }
    .abstraction-throughline-r4 { animation-delay: 1.80s; }
    .abstraction-throughline-row { animation: abstraction-throughline-reveal 7.3s ease-in-out infinite; }
    @keyframes abstraction-throughline-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="abstraction-throughline-bg" width="980" height="390"/>
  <text class="abstraction-throughline-h1"  x="30" y="40">Every layer exists to hide the one below</text>
  <text class="abstraction-throughline-sub" x="30" y="64">The through-line of the entire course.</text>
  <rect class="abstraction-throughline-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="abstraction-throughline-name" x="46" y="122">What it hides</text>
  <text class="abstraction-throughline-desc" x="46" y="142">Most of the time, completely.</text>
  <text class="abstraction-throughline-desc abstraction-throughline-row abstraction-throughline-r0" x="46" y="182">The OS hides the disk's geometry</text>
  <text class="abstraction-throughline-desc abstraction-throughline-row abstraction-throughline-r1" x="46" y="216">The filesystem hides numbered blocks</text>
  <text class="abstraction-throughline-desc abstraction-throughline-row abstraction-throughline-r2" x="46" y="250">TCP hides lost and reordered packets</text>
  <text class="abstraction-throughline-desc abstraction-throughline-row abstraction-throughline-r3" x="46" y="284">HTTP hides the connection</text>
  <text class="abstraction-throughline-desc abstraction-throughline-row abstraction-throughline-r4" x="46" y="318">An API hides someone's whole database</text>
  <rect class="abstraction-throughline-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="abstraction-throughline-name" x="526" y="122">When it leaks</text>
  <text class="abstraction-throughline-desc" x="526" y="142">Which is why you learned them.</text>
  <text class="abstraction-throughline-desc abstraction-throughline-row abstraction-throughline-r0" x="526" y="182">An out-of-memory kill (Day 7)</text>
  <text class="abstraction-throughline-desc abstraction-throughline-row abstraction-throughline-r1" x="526" y="216">A permission denied (Day 9)</text>
  <text class="abstraction-throughline-desc abstraction-throughline-row abstraction-throughline-r2" x="526" y="250">A latency floor you cannot optimise (Day 15)</text>
  <text class="abstraction-throughline-desc abstraction-throughline-row abstraction-throughline-r3" x="526" y="284">An expired certificate (Day 19)</text>
  <text class="abstraction-throughline-desc abstraction-throughline-row abstraction-throughline-r4" x="526" y="318">A 429, and a rate limit (Day 27)</text>
  <text class="abstraction-throughline-sub" x="30" y="372">Abstraction is not a programming technique; it is how the whole field made progress. And every abstraction leaks eventually, which is precisely the moment the layer beneath becomes worth understanding.</text>
</svg>
