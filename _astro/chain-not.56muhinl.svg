<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things the chain rule is not</title>
  <style>
    .chain-not-bg   { fill: #f8fafc; }
    .chain-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chain-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .chain-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .chain-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .chain-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .chain-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .chain-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chain-not-row { opacity: 1; }
    .chain-not-r0 { animation-delay: 0.00s; }
    .chain-not-r1 { animation-delay: 0.45s; }
    .chain-not-r2 { animation-delay: 0.90s; }
    .chain-not-r3 { animation-delay: 1.35s; }
    .chain-not-r4 { animation-delay: 1.80s; }
    .chain-not-row { animation: chain-not-reveal 7.3s ease-in-out infinite; }
    @keyframes chain-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="chain-not-bg" width="980" height="390"/>
  <text class="chain-not-h1"  x="30" y="40">Four things the chain rule is not</text>
  <text class="chain-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="chain-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="chain-not-name" x="46" y="122">The misconception</text>
  <text class="chain-not-desc" x="46" y="142">Commonly held.</text>
  <text class="chain-not-desc chain-not-row chain-not-r0" x="46" y="182">Rates add along a chain</text>
  <text class="chain-not-desc chain-not-row chain-not-r1" x="46" y="216">It only matters in calculus classes</text>
  <text class="chain-not-desc chain-not-row chain-not-r2" x="46" y="250">Backpropagation is a separate invention</text>
  <text class="chain-not-desc chain-not-row chain-not-r3" x="46" y="284">Depth is free</text>
  <text class="chain-not-desc chain-not-row chain-not-r4" x="46" y="318">It applies only to one variable</text>
  <rect class="chain-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="chain-not-name" x="526" y="122">What is true</text>
  <text class="chain-not-desc" x="526" y="142">Actually.</text>
  <text class="chain-not-desc chain-not-row chain-not-r0" x="526" y="182">They multiply</text>
  <text class="chain-not-desc chain-not-row chain-not-r1" x="526" y="216">It is the mechanism behind training</text>
  <text class="chain-not-desc chain-not-row chain-not-r2" x="526" y="250">It is the chain rule, applied systematically</text>
  <text class="chain-not-desc chain-not-row chain-not-r3" x="526" y="284">Each layer adds a multiplicative factor</text>
  <text class="chain-not-desc chain-not-row chain-not-r4" x="526" y="318">The multivariable form handles whole layers</text>
  <text class="chain-not-sub" x="30" y="372">Depth not being free is the practical lesson: every added layer is another factor in a product, and products of many small numbers vanish.</text>
</svg>
