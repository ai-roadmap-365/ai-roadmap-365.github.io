<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Training time as capacity</title>
  <style>
    .training-time-capacity-bg   { fill: #f8fafc; }
    .training-time-capacity-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .training-time-capacity-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .training-time-capacity-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .training-time-capacity-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .training-time-capacity-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .training-time-capacity-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .training-time-capacity-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .training-time-capacity-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .training-time-capacity-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .training-time-capacity-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .training-time-capacity-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .training-time-capacity-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .training-time-capacity-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .training-time-capacity-stage { opacity: 1; }

    .training-time-capacity-s0 { animation-delay: 0.00s; }
    .training-time-capacity-e0 { animation-delay: 0.00s; }
    .training-time-capacity-s1 { animation-delay: 1.28s; }
    .training-time-capacity-e1 { animation-delay: 1.28s; }
    .training-time-capacity-s2 { animation-delay: 2.56s; }
    .training-time-capacity-e2 { animation-delay: 2.56s; }
    .training-time-capacity-s3 { animation-delay: 3.84s; }
    .training-time-capacity-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .training-time-capacity-conn  { animation: training-time-capacity-trace 6.4s ease-in-out infinite; }
      .training-time-capacity-stage { animation: training-time-capacity-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes training-time-capacity-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes training-time-capacity-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .training-time-capacity-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .training-time-capacity-stage { animation: training-time-capacity-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes training-time-capacity-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="training-time-capacity-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="training-time-capacity-bg" width="980" height="322"/>
  <text class="training-time-capacity-h1"  x="30" y="40">Training time as capacity</text>
  <text class="training-time-capacity-sub" x="30" y="64">Four steps.</text>
  <g class="training-time-capacity-stage training-time-capacity-s0">
    <rect class="training-time-capacity-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="training-time-capacity-step" x="44" y="142">01</text>
    <text class="training-time-capacity-name" x="70" y="142">Early in training the model is effectively simple</text>
    <text class="training-time-capacity-desc" x="44" y="166">Weights near their</text>
    <text class="training-time-capacity-desc" x="44" y="182">initialisation.</text>
  </g>
  <line class="training-time-capacity-line training-time-capacity-conn training-time-capacity-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#training-time-capacity-tip)"/>
  <g class="training-time-capacity-stage training-time-capacity-s1">
    <rect class="training-time-capacity-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="training-time-capacity-step" x="280" y="142">02</text>
    <text class="training-time-capacity-name" x="306" y="142">It fits progressively more as training continues</text>
    <text class="training-time-capacity-desc" x="280" y="166">Which is capacity rising over</text>
    <text class="training-time-capacity-desc" x="280" y="182">time.</text>
  </g>
  <line class="training-time-capacity-line training-time-capacity-conn training-time-capacity-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#training-time-capacity-tip)"/>
  <g class="training-time-capacity-stage training-time-capacity-s2">
    <rect class="training-time-capacity-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="training-time-capacity-step" x="516" y="142">03</text>
    <text class="training-time-capacity-name" x="542" y="142">Past a point it fits the sample's noise</text>
    <text class="training-time-capacity-desc" x="516" y="166">And validation error turns</text>
    <text class="training-time-capacity-desc" x="516" y="182">upward.</text>
  </g>
  <line class="training-time-capacity-line training-time-capacity-conn training-time-capacity-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#training-time-capacity-tip)"/>
  <g class="training-time-capacity-stage training-time-capacity-s3">
    <rect class="training-time-capacity-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="training-time-capacity-step" x="752" y="142">04</text>
    <text class="training-time-capacity-name" x="778" y="142">So stopping there is a regulariser</text>
    <text class="training-time-capacity-desc" x="752" y="166">Which is why early stopping</text>
    <text class="training-time-capacity-desc" x="752" y="182">works at all.</text>
  </g>
  <text class="training-time-capacity-sub" x="30" y="304">Understanding early stopping as capacity control rather than as a convenience is what makes it transfer: it is the same dial as model size, moved differently.</text>
</svg>
