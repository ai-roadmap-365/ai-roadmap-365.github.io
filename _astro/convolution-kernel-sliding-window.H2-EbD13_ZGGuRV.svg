<svg role="img" aria-label="2D Convolution operation showing sliding 3x3 kernel over 5x5 input feature map computing dot product and generating output feature map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>2D Convolution Kernel Sliding Window and Feature Map Extraction</title>
  <defs>
    <linearGradient id="bg211a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card211" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg211a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">2D CONVOLUTION SLIDING WINDOW MECHANICS</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Spatial Weight Sharing, Receptive Fields, and Feature Map Generation</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card211)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Input Tensor 5x5 -->
    <rect x="30" y="30" width="200" height="200" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="4"/>
    <text x="130" y="20" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Input Tensor (5x5)</text>
    <!-- Highlight 3x3 receptive field -->
    <rect x="35" y="35" width="115" height="115" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2"/>
    <text x="92" y="95" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">Receptive Field</text>
    <text x="92" y="112" fill="#94a3b8" font-size="8" text-anchor="middle">(3x3 Patch)</text>

    <!-- Convolution Symbol -->
    <circle cx="270" cy="130" r="18" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <text x="270" y="136" fill="#f43f5e" font-size="16" font-weight="700" text-anchor="middle">*</text>
    <text x="270" y="165" fill="#cbd5e1" font-size="8" text-anchor="middle">Conv2d</text>

    <!-- Kernel 3x3 -->
    <rect x="320" y="65" width="130" height="130" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="4"/>
    <text x="385" y="55" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">Filter Kernel (3x3)</text>
    <!-- 3x3 Grid values -->
    <text x="345" y="95" fill="#f8fafc" font-size="10"> 0  -1   0</text>
    <text x="345" y="130" fill="#f8fafc" font-size="10">-1   4  -1</text>
    <text x="345" y="165" fill="#f8fafc" font-size="10"> 0  -1   0</text>
    <text x="385" y="215" fill="#fbbf24" font-size="9" text-anchor="middle">Laplacian Edge Detector</text>

    <!-- Equals Arrow -->
    <path d="M 480 130 L 520 130" stroke="#10b981" stroke-width="3" fill="none"/>
    <polygon points="520,130 510,123 510,137" fill="#10b981"/>

    <!-- Output Feature Map 3x3 -->
    <rect x="545" y="65" width="130" height="130" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="4"/>
    <text x="610" y="55" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">Feature Map (3x3)</text>
    <!-- Highlighted single pixel -->
    <rect x="550" y="70" width="40" height="40" fill="#10b981" fill-opacity="0.35" stroke="#10b981" stroke-width="2"/>
    <text x="570" y="94" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">Y_11</text>

    <!-- Bottom summary -->
    <rect x="30" y="245" width="700" height="35" fill="#0f172a" stroke="#475569" rx="4"/>
    <text x="380" y="267" fill="#cbd5e1" font-size="9" text-anchor="middle">Output Dimension Formula: H_out = floor((H_in - Kernel + 2*Padding) / Stride) + 1</text>
  </g>
</svg>
