<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward hardware.">
  <title>Four steps for matrix multiplication</title>
  <style>
    .matmul-history-bg   { fill: #f8fafc; }
    .matmul-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matmul-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matmul-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matmul-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matmul-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matmul-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .matmul-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .matmul-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .matmul-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .matmul-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .matmul-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .matmul-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .matmul-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .matmul-history-stage { opacity: 1; }

    .matmul-history-s0 { animation-delay: 0.00s; }
    .matmul-history-e0 { animation-delay: 0.00s; }
    .matmul-history-s1 { animation-delay: 1.28s; }
    .matmul-history-e1 { animation-delay: 1.28s; }
    .matmul-history-s2 { animation-delay: 2.56s; }
    .matmul-history-e2 { animation-delay: 2.56s; }
    .matmul-history-s3 { animation-delay: 3.84s; }
    .matmul-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .matmul-history-conn  { animation: matmul-history-trace 6.4s ease-in-out infinite; }
      .matmul-history-stage { animation: matmul-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes matmul-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes matmul-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .matmul-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .matmul-history-stage { animation: matmul-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes matmul-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="matmul-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="matmul-history-bg" width="980" height="322"/>
  <text class="matmul-history-h1"  x="30" y="40">Four steps for matrix multiplication</text>
  <text class="matmul-history-sub" x="30" y="64">Toward hardware.</text>
  <g class="matmul-history-stage matmul-history-s0">
    <rect class="matmul-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="matmul-history-step" x="44" y="142">01</text>
    <text class="matmul-history-name" x="70" y="142">Defined to represent composition of transformations</text>
    <text class="matmul-history-desc" x="44" y="166">Which is why the rule looks the</text>
    <text class="matmul-history-desc" x="44" y="182">way it does.</text>
  </g>
  <line class="matmul-history-line matmul-history-conn matmul-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#matmul-history-tip)"/>
  <g class="matmul-history-stage matmul-history-s1">
    <rect class="matmul-history-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="matmul-history-step" x="280" y="142">02</text>
    <text class="matmul-history-name" x="306" y="142">Then faster algorithms with lower complexity</text>
    <text class="matmul-history-desc" x="280" y="166">Theoretically interesting,</text>
    <text class="matmul-history-desc" x="280" y="182">rarely used in practice.</text>
  </g>
  <line class="matmul-history-line matmul-history-conn matmul-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#matmul-history-tip)"/>
  <g class="matmul-history-stage matmul-history-s2">
    <rect class="matmul-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="matmul-history-step" x="516" y="142">03</text>
    <text class="matmul-history-name" x="542" y="142">And heavily optimised libraries</text>
    <text class="matmul-history-desc" x="516" y="166">Cache-aware, and where the real</text>
    <text class="matmul-history-desc" x="516" y="182">speed came from.</text>
  </g>
  <line class="matmul-history-line matmul-history-conn matmul-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#matmul-history-tip)"/>
  <g class="matmul-history-stage matmul-history-s3">
    <rect class="matmul-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="matmul-history-step" x="752" y="142">04</text>
    <text class="matmul-history-name" x="778" y="142">Then silicon built for this one operation</text>
    <text class="matmul-history-desc" x="752" y="166">Which is what a matrix unit is.</text>
  </g>
  <text class="matmul-history-sub" x="30" y="304">The asymptotically faster algorithms being unused in practice is worth knowing: constant factors and cache behaviour dominate at realistic sizes.</text>
</svg>
