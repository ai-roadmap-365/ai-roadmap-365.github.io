<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A timeout is the case that catches people out.">
  <title>What you may retry, and what you may not</title>
  <style>
    .retry-what-bg   { fill: #f8fafc; }
    .retry-what-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retry-what-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retry-what-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retry-what-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retry-what-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retry-what-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .retry-what-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .retry-what-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .retry-what-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .retry-what-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .retry-what-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .retry-what-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .retry-what-row { opacity: 1; }
    .retry-what-r0 { animation-delay: 0.00s; }
    .retry-what-r1 { animation-delay: 0.45s; }
    .retry-what-r2 { animation-delay: 0.90s; }
    .retry-what-r3 { animation-delay: 1.35s; }
    .retry-what-r4 { animation-delay: 1.80s; }
    .retry-what-row { animation: retry-what-reveal 7.3s ease-in-out infinite; }
    @keyframes retry-what-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="retry-what-bg" width="980" height="390"/>
  <text class="retry-what-h1"  x="30" y="40">What you may retry, and what you may not</text>
  <text class="retry-what-sub" x="30" y="64">A timeout is the case that catches people out.</text>
  <rect class="retry-what-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="retry-what-name" x="46" y="122">Retry these</text>
  <text class="retry-what-desc" x="46" y="142">They may succeed next time.</text>
  <text class="retry-what-desc retry-what-row retry-what-r0" x="46" y="182">5xx — the server failed a valid request</text>
  <text class="retry-what-desc retry-what-row retry-what-r1" x="46" y="216">429 — after waiting, per Retry-After</text>
  <text class="retry-what-desc retry-what-row retry-what-r2" x="46" y="250">Timeouts on GET, PUT, DELETE</text>
  <text class="retry-what-desc retry-what-row retry-what-r3" x="46" y="284">Connection failures on idempotent calls</text>
  <text class="retry-what-desc retry-what-row retry-what-r4" x="46" y="318">Always with backoff, jitter and a cap</text>
  <rect class="retry-what-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="retry-what-name" x="526" y="122">Do not retry these</text>
  <text class="retry-what-desc" x="526" y="142">Repetition cannot help.</text>
  <text class="retry-what-desc retry-what-row retry-what-r0" x="526" y="182">400 — the body is malformed</text>
  <text class="retry-what-desc retry-what-row retry-what-r1" x="526" y="216">401 — the credential is wrong</text>
  <text class="retry-what-desc retry-what-row retry-what-r2" x="526" y="250">403 — permission is refused</text>
  <text class="retry-what-desc retry-what-row retry-what-r3" x="526" y="284">404 — there is nothing there</text>
  <text class="retry-what-desc retry-what-row retry-what-r4" x="526" y="318">A timed-out POST, without an idempotency key</text>
  <text class="retry-what-sub" x="30" y="372">The last row is the expensive one. The request may well have succeeded; only the response was lost, and repeating it does the work twice.</text>
</svg>
