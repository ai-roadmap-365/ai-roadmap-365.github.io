<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <title>Validation Curve Hyperparameter Flow</title>
  <style>
    .bg { fill: var(--bg-surface, #0f172a); }
    .box { fill: var(--bg-subtle, #1e293b); stroke: var(--border-subtle, #334155); stroke-width: 2; rx: 8; }
    .axis { stroke: var(--border-subtle, #475569); stroke-width: 2; }
    .curve-train { stroke: #3b82f6; stroke-width: 3; fill: none; }
    .curve-val { stroke: #10b981; stroke-width: 3; fill: none; }
    .sweet-spot { fill: rgba(16, 185, 129, 0.15); stroke: #10b981; stroke-width: 2; stroke-dasharray: 4; }
    .scan-line { stroke: #6366f1; stroke-width: 2; stroke-dasharray: 4; animation: sweep 4s ease-in-out infinite alternate; }
    @keyframes sweep { from { x1: 200; x2: 200; } to { x1: 750; x2: 750; } }
    @media (prefers-reduced-motion: reduce) {
      .scan-line { animation: none !important; x1: 480; x2: 480; }
    }
    .text-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: var(--text-primary, #f8fafc); text-anchor: middle; }
    .text-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: var(--text-secondary, #94a3b8); text-anchor: middle; }
    .text-head { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: var(--text-primary, #f8fafc); text-anchor: middle; }
    .text-label { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 12px; }
  </style>

  <rect width="900" height="500" class="bg" rx="12" />

  <text x="450" y="40" class="text-head">Validation Curve: Hyperparameter Tuning Diagnostics</text>
  <text x="450" y="65" class="text-sub">Tracking Bias-Variance Transition Across Hyperparameter Capacity</text>

  <rect x="80" y="90" width="740" height="350" class="box" />

  <!-- Sweet spot region -->
  <rect x="420" y="110" width="120" height="270" class="sweet-spot" />
  <text x="480" y="130" class="text-title" fill="#10b981">Optimal Capacity</text>
  <text x="480" y="150" class="text-sub">Min Validation Error</text>

  <!-- Axes -->
  <line x1="140" y1="380" x2="780" y2="380" class="axis" />
  <line x1="140" y1="380" x2="140" y2="120" class="axis" />
  <text x="460" y="415" class="text-title">Model Complexity / Capacity (e.g. Tree Depth, 1/Regularization)</text>
  <text x="115" y="250" class="text-sub" transform="rotate(-90 115 250)">Error</text>

  <!-- Training Error: Decreases monotonically -->
  <path d="M 160 320 Q 350 250 480 180 T 760 125" class="curve-train" />
  <text x="710" y="115" class="text-label" fill="#3b82f6">Training Error</text>

  <!-- Validation Error: U-Shaped -->
  <path d="M 160 350 Q 300 240 480 190 T 760 360" class="curve-val" />
  <text x="710" y="380" class="text-label" fill="#10b981">Validation Error</text>

  <!-- Dynamic scan line -->
  <line x1="480" y1="120" x2="480" y2="380" class="scan-line" />

  <!-- Annotations for underfitting vs overfitting -->
  <text x="250" y="360" class="text-sub" fill="#f59e0b">High Bias Regime (Underfitting)</text>
  <text x="680" y="270" class="text-sub" fill="#ef4444">High Variance Regime (Overfitting)</text>
</svg>
