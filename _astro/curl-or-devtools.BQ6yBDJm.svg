<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One isolates a request. The other surveys a page.">
  <title>Which tool for which question</title>
  <style>
    .curl-or-devtools-bg   { fill: #f8fafc; }
    .curl-or-devtools-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .curl-or-devtools-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .curl-or-devtools-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .curl-or-devtools-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .curl-or-devtools-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .curl-or-devtools-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .curl-or-devtools-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .curl-or-devtools-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .curl-or-devtools-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .curl-or-devtools-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .curl-or-devtools-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .curl-or-devtools-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .curl-or-devtools-row { opacity: 1; }
    .curl-or-devtools-r0 { animation-delay: 0.00s; }
    .curl-or-devtools-r1 { animation-delay: 0.45s; }
    .curl-or-devtools-r2 { animation-delay: 0.90s; }
    .curl-or-devtools-r3 { animation-delay: 1.35s; }
    .curl-or-devtools-r4 { animation-delay: 1.80s; }
    .curl-or-devtools-row { animation: curl-or-devtools-reveal 7.3s ease-in-out infinite; }
    @keyframes curl-or-devtools-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="curl-or-devtools-bg" width="980" height="390"/>
  <text class="curl-or-devtools-h1"  x="30" y="40">Which tool for which question</text>
  <text class="curl-or-devtools-sub" x="30" y="64">One isolates a request. The other surveys a page.</text>
  <rect class="curl-or-devtools-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="curl-or-devtools-name" x="46" y="122">curl</text>
  <text class="curl-or-devtools-desc" x="46" y="142">One request, exactly as you specify it.</text>
  <text class="curl-or-devtools-desc curl-or-devtools-row curl-or-devtools-r0" x="46" y="182">You already know which request failed</text>
  <text class="curl-or-devtools-desc curl-or-devtools-row curl-or-devtools-r1" x="46" y="216">Repeatable, scriptable, shareable</text>
  <text class="curl-or-devtools-desc curl-or-devtools-row curl-or-devtools-r2" x="46" y="250">No cookies, no session, no origin</text>
  <text class="curl-or-devtools-desc curl-or-devtools-row curl-or-devtools-r3" x="46" y="284">Shows every layer: DNS, TCP, TLS, HTTP</text>
  <text class="curl-or-devtools-desc curl-or-devtools-row curl-or-devtools-r4" x="46" y="318">Works on a server with no screen</text>
  <rect class="curl-or-devtools-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="curl-or-devtools-name" x="526" y="122">Developer tools</text>
  <text class="curl-or-devtools-desc" x="526" y="142">Every request the page made.</text>
  <text class="curl-or-devtools-desc curl-or-devtools-row curl-or-devtools-r0" x="526" y="182">You do not yet know which request failed</text>
  <text class="curl-or-devtools-desc curl-or-devtools-row curl-or-devtools-r1" x="526" y="216">Live, but not repeatable as text</text>
  <text class="curl-or-devtools-desc curl-or-devtools-row curl-or-devtools-r2" x="526" y="250">Real session, real cookies, real origin</text>
  <text class="curl-or-devtools-desc curl-or-devtools-row curl-or-devtools-r3" x="526" y="284">Shows the waterfall and the initiator chain</text>
  <text class="curl-or-devtools-desc curl-or-devtools-row curl-or-devtools-r4" x="526" y="318">Only where a browser can run</text>
  <text class="curl-or-devtools-sub" x="30" y="372">The differences are themselves diagnostic: a request that works in curl and fails in the browser is usually about origin or cookies, and you have just halved the search.</text>
</svg>
