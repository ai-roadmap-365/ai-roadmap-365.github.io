<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A scale and an offset.">
  <title>How quantisation works</title>
  <style>
    .quant-math-bg   { fill: #f8fafc; }
    .quant-math-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quant-math-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quant-math-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quant-math-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quant-math-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quant-math-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .quant-math-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .quant-math-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .quant-math-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .quant-math-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .quant-math-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .quant-math-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .quant-math-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .quant-math-stage { opacity: 1; }

    .quant-math-s0 { animation-delay: 0.00s; }
    .quant-math-e0 { animation-delay: 0.00s; }
    .quant-math-s1 { animation-delay: 1.28s; }
    .quant-math-e1 { animation-delay: 1.28s; }
    .quant-math-s2 { animation-delay: 2.56s; }
    .quant-math-e2 { animation-delay: 2.56s; }
    .quant-math-s3 { animation-delay: 3.84s; }
    .quant-math-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .quant-math-conn  { animation: quant-math-trace 6.4s ease-in-out infinite; }
      .quant-math-stage { animation: quant-math-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes quant-math-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes quant-math-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .quant-math-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .quant-math-stage { animation: quant-math-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes quant-math-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="quant-math-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="quant-math-bg" width="980" height="322"/>
  <text class="quant-math-h1"  x="30" y="40">How quantisation works</text>
  <text class="quant-math-sub" x="30" y="64">A scale and an offset.</text>
  <g class="quant-math-stage quant-math-s0">
    <rect class="quant-math-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="quant-math-step" x="44" y="142">01</text>
    <text class="quant-math-name" x="70" y="142">Find the range of the weights</text>
    <text class="quant-math-desc" x="44" y="166">Per tensor, or per channel for</text>
    <text class="quant-math-desc" x="44" y="182">better accuracy.</text>
  </g>
  <line class="quant-math-line quant-math-conn quant-math-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#quant-math-tip)"/>
  <g class="quant-math-stage quant-math-s1">
    <rect class="quant-math-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="quant-math-step" x="280" y="142">02</text>
    <text class="quant-math-name" x="306" y="142">Compute a scale</text>
    <text class="quant-math-desc" x="280" y="166">Mapping that range onto the</text>
    <text class="quant-math-desc" x="280" y="182">available integers.</text>
  </g>
  <line class="quant-math-line quant-math-conn quant-math-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#quant-math-tip)"/>
  <g class="quant-math-stage quant-math-s2">
    <rect class="quant-math-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="quant-math-step" x="516" y="142">03</text>
    <text class="quant-math-name" x="542" y="142">Store integers plus the scale</text>
    <text class="quant-math-desc" x="516" y="166">Four times smaller at eight</text>
    <text class="quant-math-desc" x="516" y="182">bits, eight times at four.</text>
    <text class="quant-math-edge" x="516" y="242">4-8x</text>
  </g>
  <line class="quant-math-line quant-math-conn quant-math-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#quant-math-tip)"/>
  <g class="quant-math-stage quant-math-s3">
    <rect class="quant-math-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="quant-math-step" x="752" y="142">04</text>
    <text class="quant-math-name" x="778" y="142">Multiply back when computing</text>
    <text class="quant-math-desc" x="752" y="166">Which introduces a small,</text>
    <text class="quant-math-desc" x="752" y="182">bounded rounding error.</text>
  </g>
  <text class="quant-math-sub" x="30" y="304">Per-channel scaling is where most of the accuracy is recovered, because a single scale across a tensor is set by its largest outlier and wastes resolution on everything else.</text>
</svg>
