<svg viewBox="0 0 1100 700" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="d111a-title d111a-desc" width="1100" height="700">
  <title id="d111a-title">The anatomy of one gradient-descent step: a current point on a loss surface, the gradient pointing uphill, the scaled step negative eta times the gradient pointing downhill, and the new point closer to the minimum</title>
  <desc id="d111a-desc">A contour plot of a bowl-shaped loss surface with a current point x_n, the gradient vector pointing away from the minimum (uphill), the actual update step negative eta times the gradient pointing toward the minimum and shorter than the raw gradient, and the new point x_n+1. A side panel shows the scaling eta performs: the raw gradient's length compared against the much shorter step length after multiplying by eta equals 0.3.</desc>

  <style>
    .d111a-bg      { fill: #f8fafc; }
    .d111a-panel   { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .d111a-text    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a202c; }
    .d111a-mono    { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #1a202c; }
    .d111a-heading { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a202c; font-weight: 700; }
    .d111a-sub     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
    .d111a-contour { fill: none; stroke: #94a3b8; stroke-width: 1.5; }
    .d111a-contour-min { fill: none; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .d111a-uphill  { stroke: #ea580c; stroke-width: 3; fill: none; }
    .d111a-uphill-fill { fill: #ea580c; }
    .d111a-step    { stroke: #1d4ed8; stroke-width: 3.5; fill: none; }
    .d111a-step-fill { fill: #1d4ed8; }
    .d111a-point   { fill: #1a202c; }
    .d111a-min     { fill: #16a34a; }
    .d111a-bar-full  { fill: #fed7aa; stroke: #ea580c; stroke-width: 1.5; }
    .d111a-bar-scaled { fill: #bfdbfe; stroke: #1d4ed8; stroke-width: 1.5; }
  </style>

  <rect class="d111a-bg" x="0" y="0" width="1100" height="700"/>

  <!-- Heading -->
  <text class="d111a-heading" x="30" y="34" font-size="20">One gradient-descent step, taken apart</text>
  <text class="d111a-sub" x="30" y="56" font-size="14">x_n+1 = x_n − η ∇f(x_n).  The gradient says which way is uphill; η decides how far downhill you actually move.</text>

  <!-- Left panel: contour plot -->
  <rect class="d111a-panel" x="30" y="80" width="620" height="560"/>
  <text class="d111a-heading" x="50" y="112" font-size="16">THE STEP, ON THE LOSS SURFACE</text>

  <!-- concentric contour circles, center = minimum -->
  <g transform="translate(340,400)">
    <circle class="d111a-contour" r="230"/>
    <circle class="d111a-contour" r="175"/>
    <circle class="d111a-contour" r="120"/>
    <circle class="d111a-contour-min" r="65"/>
    <circle class="d111a-min" r="6"/>
    <text class="d111a-text" x="14" y="4" font-size="13">minimum</text>
  </g>

  <!-- current point x_n -->
  <circle class="d111a-point" cx="150" cy="230" r="7"/>
  <text class="d111a-mono" x="118" y="210" font-size="15">x_n</text>

  <!-- gradient arrow: points AWAY from minimum (uphill), from x_n outward -->
  <line class="d111a-uphill" x1="150" y1="230" x2="90" y2="150" marker-end="url(#d111a-arrow-uphill)"/>
  <text class="d111a-text" x="10" y="120" font-size="14" fill="#ea580c" font-weight="700">∇f(x_n)</text>
  <text class="d111a-sub" x="10" y="138" font-size="12">points uphill —</text>
  <text class="d111a-sub" x="10" y="153" font-size="12">the direction that</text>
  <text class="d111a-sub" x="10" y="168" font-size="12">increases loss fastest</text>

  <!-- the actual step: -eta * grad, opposite direction, SHORTER than the raw gradient -->
  <line class="d111a-step" x1="150" y1="230" x2="223" y2="273" marker-end="url(#d111a-arrow-step)"/>
  <text class="d111a-text" x="230" y="270" font-size="14" fill="#1d4ed8" font-weight="700">−η∇f(x_n)</text>
  <text class="d111a-sub" x="230" y="288" font-size="12">the ACTUAL step:</text>
  <text class="d111a-sub" x="230" y="303" font-size="12">opposite direction,</text>
  <text class="d111a-sub" x="230" y="318" font-size="12">scaled down by η</text>

  <!-- new point x_n+1 -->
  <circle class="d111a-point" cx="223" cy="273" r="7"/>
  <text class="d111a-mono" x="233" y="335" font-size="15">x_n+1</text>

  <!-- annotation: raw gradient direction shown faded, continuing past the step, to make the scaling visible -->
  <line x1="150" y1="230" x2="330" y2="326" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.55"/>
  <text class="d111a-sub" x="290" y="345" font-size="11" fill="#ea580c">(unscaled −∇f(x_n) would land here)</text>
  <circle cx="330" cy="326" r="4" fill="#ea580c" opacity="0.55"/>

  <text class="d111a-sub" x="50" y="600" font-size="12">Each ring is a level curve: every point on the same ring shares the same loss. The gradient is always perpendicular to the level curve it sits on, pointing toward higher rings.</text>
  <text class="d111a-sub" x="50" y="618" font-size="12">Repeating the step from x_n+1 walks the point ring by ring toward the minimum — which is exactly the loop in "gradient_descent".</text>

  <defs>
    <marker id="d111a-arrow-uphill" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <marker id="d111a-arrow-step" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- Right panel: the scaling eta performs -->
  <rect class="d111a-panel" x="670" y="80" width="400" height="330"/>
  <text class="d111a-heading" x="690" y="112" font-size="16">THE SCALING η PERFORMS</text>
  <text class="d111a-sub" x="690" y="132" font-size="12">η = 0.3 in this picture</text>

  <text class="d111a-mono" x="690" y="168" font-size="13">‖∇f(x_n)‖  (raw gradient length)</text>
  <rect class="d111a-bar-full" x="690" y="178" width="340" height="26"/>
  <text class="d111a-mono" x="700" y="196" font-size="13">1.00</text>

  <text class="d111a-mono" x="690" y="238" font-size="13">‖η∇f(x_n)‖  (the actual step)</text>
  <rect class="d111a-bar-scaled" x="690" y="248" width="102" height="26"/>
  <text class="d111a-mono" x="700" y="266" font-size="13">0.30</text>

  <text class="d111a-sub" x="690" y="300" font-size="12">η never changes the DIRECTION of the step —</text>
  <text class="d111a-sub" x="690" y="317" font-size="12">only its length. Direction always comes from</text>
  <text class="d111a-sub" x="690" y="334" font-size="12">the gradient, flipped to point downhill.</text>

  <text class="d111a-sub" x="690" y="364" font-size="12">Too small an η: correct direction, tiny steps,</text>
  <text class="d111a-sub" x="690" y="381" font-size="12">slow arrival. Too large: the step overshoots</text>
  <text class="d111a-sub" x="690" y="398" font-size="12">the minimum and can land farther away than</text>
  <text class="d111a-sub" x="690" y="415" font-size="12">it started — see the flow diagram.</text>

  <!-- Right panel: the four parts, restated as a checklist -->
  <rect class="d111a-panel" x="670" y="430" width="400" height="210"/>
  <text class="d111a-heading" x="690" y="462" font-size="16">THE FOUR PARTS OF ONE STEP</text>
  <text class="d111a-mono" x="690" y="492" font-size="13" fill="#1a202c">1. x_n</text>
  <text class="d111a-sub" x="740" y="492" font-size="12">where you are now</text>
  <text class="d111a-mono" x="690" y="518" font-size="13" fill="#ea580c">2. ∇f(x_n)</text>
  <text class="d111a-sub" x="740" y="518" font-size="12">which way is uphill, from here</text>
  <text class="d111a-mono" x="690" y="544" font-size="13" fill="#1d4ed8">3. −η∇f(x_n)</text>
  <text class="d111a-sub" x="740" y="544" font-size="12">flip it, scale it by η: the real move</text>
  <text class="d111a-mono" x="690" y="570" font-size="13" fill="#1a202c">4. x_n+1 = x_n + step</text>
  <text class="d111a-sub" x="740" y="588" font-size="12">then repeat, from the new point</text>

  <!-- Footer band: the whole rule -->
  <rect x="30" y="655" width="1040" height="35" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="1"/>
  <text class="d111a-mono" x="50" y="678" font-size="15" font-weight="700" fill="#1d4ed8">x_n+1  =  x_n  −  η · ∇f(x_n)</text>
  <text class="d111a-sub" x="420" y="678" font-size="12">one line — the whole of gradient descent, repeated until ‖∇f(x)‖ is small enough</text>
</svg>
