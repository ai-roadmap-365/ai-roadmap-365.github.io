<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" role="img" aria-labelledby="d147f-title d147f-desc" width="1040" height="700">
  <title id="d147f-title">Predicted selection optimism against the measured drop, and the leaky-selection gap, both across twenty seeds</title>
  <desc id="d147f-desc">Two bar-chart panels revealed left to right. The top panel plots the measured drop between cross-validated and test accuracy at eight sampled seeds against a dashed line marking the 0.0326 optimism Day 144's formula predicted for this 36-candidate sweep; every measured drop sits far below the predicted line and scatters both above and below zero. The bottom panel plots the gap between a leaky test-set-peeking selection and the honest cross-validated one at the same eight seeds; every bar sits at or above zero, and never below it.</desc>
  <style>
    .d147f-bg { fill: #f8fafc; }
    .d147f-title { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 24px; font-weight: 700; }
    .d147f-muted { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d147f-head { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; }
    .d147f-label { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d147f-val { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; font-weight: 700; }
    .d147f-axis { stroke: #1a202c; stroke-width: 2; }
    .d147f-zero { stroke: #1a202c; stroke-width: 2; }
    .d147f-predline { stroke: #1d4ed8; stroke-width: 2; stroke-dasharray: 7 5; }
    .d147f-posbar { fill: #93c5fd; stroke: #1d4ed8; stroke-width: 2; }
    .d147f-negbar { fill: #fecaca; stroke: #b91c1c; stroke-width: 2; }
    .d147f-gapbar { fill: #bbf7d0; stroke: #15803d; stroke-width: 2; }
    .d147f-note { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 2; }
    .d147f-b0 { animation: d147f-rise 8s ease-out 0.00s infinite; }
    .d147f-b1 { animation: d147f-rise 8s ease-out 0.45s infinite; }
    .d147f-b2 { animation: d147f-rise 8s ease-out 0.90s infinite; }
    .d147f-b3 { animation: d147f-rise 8s ease-out 1.35s infinite; }
    .d147f-b4 { animation: d147f-rise 8s ease-out 1.80s infinite; }
    .d147f-b5 { animation: d147f-rise 8s ease-out 2.25s infinite; }
    .d147f-b6 { animation: d147f-rise 8s ease-out 2.70s infinite; }
    .d147f-b7 { animation: d147f-rise 8s ease-out 3.15s infinite; }
    .d147f-g0 { animation: d147f-rise 8s ease-out 3.80s infinite; }
    .d147f-g1 { animation: d147f-rise 8s ease-out 4.10s infinite; }
    .d147f-g2 { animation: d147f-rise 8s ease-out 4.40s infinite; }
    .d147f-g3 { animation: d147f-rise 8s ease-out 4.70s infinite; }
    .d147f-g4 { animation: d147f-rise 8s ease-out 5.00s infinite; }
    .d147f-g5 { animation: d147f-rise 8s ease-out 5.30s infinite; }
    .d147f-g6 { animation: d147f-rise 8s ease-out 5.60s infinite; }
    .d147f-g7 { animation: d147f-rise 8s ease-out 5.90s infinite; }
    @keyframes d147f-rise {
      0%   { opacity: 0.15; }
      6%   { opacity: 1; }
      100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .d147f-b0, .d147f-b1, .d147f-b2, .d147f-b3, .d147f-b4, .d147f-b5, .d147f-b6, .d147f-b7,
      .d147f-g0, .d147f-g1, .d147f-g2, .d147f-g3, .d147f-g4, .d147f-g5, .d147f-g6, .d147f-g7 {
        animation: none; opacity: 1;
      }
    }
  </style>
  <rect class="d147f-bg" x="0" y="0" width="1040" height="700"/>

  <text class="d147f-title" x="520" y="34" text-anchor="middle">What the formula predicted, and what actually happened</text>
  <text class="d147f-muted" x="520" y="56" text-anchor="middle">36 candidate pipelines, 5-fold cross-validation, eight of twenty independently seeded runs shown</text>

  <text class="d147f-head" x="80" y="86">Top: measured drop (cv minus test) against the 0.0326 predicted optimism</text>
  <line class="d147f-predline" x1="96" y1="296.2" x2="1000" y2="296.2"/>
  <text class="d147f-val" x="1000" y="290" text-anchor="end">predicted optimism, 0.0326</text>
  <line class="d147f-zero" x1="96" y1="380" x2="1000" y2="380"/>
  <text class="d147f-muted" x="96" y="398">zero</text>

  <rect class="d147f-posbar d147f-b0" x="120" y="368.4" width="46" height="11.6" rx="3"/>
  <rect class="d147f-negbar d147f-b1" x="220" y="380" width="46" height="39.6" rx="3"/>
  <rect class="d147f-posbar d147f-b2" x="320" y="368.9" width="46" height="11.1" rx="3"/>
  <rect class="d147f-posbar d147f-b3" x="420" y="357.6" width="46" height="22.4" rx="3"/>
  <rect class="d147f-posbar d147f-b4" x="520" y="323.7" width="46" height="56.3" rx="3"/>
  <rect class="d147f-negbar d147f-b5" x="620" y="380" width="46" height="79.2" rx="3"/>
  <rect class="d147f-posbar d147f-b6" x="720" y="306.7" width="46" height="73.3" rx="3"/>
  <rect class="d147f-posbar d147f-b7" x="820" y="340.7" width="46" height="39.3" rx="3"/>

  <text class="d147f-label" x="143" y="414" text-anchor="middle">seed 0</text>
  <text class="d147f-label" x="243" y="414" text-anchor="middle">seed 1</text>
  <text class="d147f-label" x="343" y="414" text-anchor="middle">seed 3</text>
  <text class="d147f-label" x="443" y="414" text-anchor="middle">seed 4</text>
  <text class="d147f-label" x="543" y="414" text-anchor="middle">seed 7</text>
  <text class="d147f-label" x="643" y="414" text-anchor="middle">seed 9</text>
  <text class="d147f-label" x="743" y="414" text-anchor="middle">seed 11</text>
  <text class="d147f-label" x="843" y="414" text-anchor="middle">seed 16</text>

  <text class="d147f-head" x="80" y="466">Bottom: the leaky-selection gap (test-peeked score minus honest score) -- never negative</text>
  <line class="d147f-zero" x1="96" y1="590" x2="1000" y2="590"/>
  <text class="d147f-muted" x="96" y="608">zero</text>

  <rect class="d147f-gapbar d147f-g0" x="120" y="589.5" width="46" height="0.5" rx="3"/>
  <rect class="d147f-gapbar d147f-g1" x="220" y="589.5" width="46" height="0.5" rx="3"/>
  <rect class="d147f-gapbar d147f-g2" x="320" y="545.0" width="46" height="45.0" rx="3"/>
  <rect class="d147f-gapbar d147f-g3" x="420" y="567.4" width="46" height="22.6" rx="3"/>
  <rect class="d147f-gapbar d147f-g4" x="520" y="544.7" width="46" height="45.3" rx="3"/>
  <rect class="d147f-gapbar d147f-g5" x="620" y="589.5" width="46" height="0.5" rx="3"/>
  <rect class="d147f-gapbar d147f-g6" x="720" y="567.4" width="46" height="22.6" rx="3"/>
  <rect class="d147f-gapbar d147f-g7" x="820" y="499.7" width="46" height="90.3" rx="3"/>

  <text class="d147f-label" x="143" y="624" text-anchor="middle">seed 0</text>
  <text class="d147f-label" x="243" y="624" text-anchor="middle">seed 1</text>
  <text class="d147f-label" x="343" y="624" text-anchor="middle">seed 3</text>
  <text class="d147f-label" x="443" y="624" text-anchor="middle">seed 4</text>
  <text class="d147f-label" x="543" y="624" text-anchor="middle">seed 7</text>
  <text class="d147f-label" x="643" y="624" text-anchor="middle">seed 9</text>
  <text class="d147f-label" x="743" y="624" text-anchor="middle">seed 11</text>
  <text class="d147f-label" x="843" y="624" text-anchor="middle">seed 16</text>

  <rect class="d147f-note" x="70" y="648" width="900" height="40" rx="6"/>
  <text class="d147f-label" x="90" y="673">Over all twenty seeds: mean measured drop -0.0001 against a mean prediction of 0.0330; mean leaky gap +0.0096, never negative once.</text>
</svg>
