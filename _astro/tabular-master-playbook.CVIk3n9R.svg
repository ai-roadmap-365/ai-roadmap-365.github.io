<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="The Tabular Master Playbook Diagram">
  <title>The Tabular Master Playbook</title>
  <defs>
    <style>
      .d168a-bg { fill: #f8fafc; }
      .d168a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 6; }
      .d168a-header { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; }
      .d168a-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; }
      .d168a-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 10px; }
      .d168a-num { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="d168a-bg" />

  <text x="40" y="45" class="d168a-header" font-size="22">The Tabular Master Playbook</text>
  <text x="40" y="70" class="d168a-text" font-size="13">The 8-Phase Engineering Methodology for Dominating Tabular Machine Learning</text>

  <!-- Row 1: Phases 1 to 4 -->
  <!-- Phase 1 -->
  <rect x="40" y="100" width="190" height="150" class="d168a-card" fill="#eff6ff" stroke="#3b82f6" />
  <circle cx="65" cy="125" r="12" fill="#2563eb" /><text x="61" y="129" class="d168a-num">1</text>
  <text x="85" y="129" class="d168a-title" fill="#1d4ed8">Validation Anchor</text>
  <text x="55" y="155" class="d168a-text">• Stratified / Group K-Fold</text>
  <text x="55" y="175" class="d168a-text">• TimeSeries causality split</text>
  <text x="55" y="195" class="d168a-text">• Lock down metric (AUC/F1)</text>

  <!-- Phase 2 -->
  <rect x="250" y="100" width="190" height="150" class="d168a-card" />
  <circle cx="275" cy="125" r="12" fill="#475569" /><text x="271" y="129" class="d168a-num">2</text>
  <text x="295" y="129" class="d168a-title">EDA &amp; Hygiene</text>
  <text x="265" y="155" class="d168a-text">• High-cardinality analysis</text>
  <text x="265" y="175" class="d168a-text">• Missingness pattern audit</text>
  <text x="265" y="195" class="d168a-text">• Outlier &amp; clipping checks</text>

  <!-- Phase 3 -->
  <rect x="460" y="100" width="190" height="150" class="d168a-card" />
  <circle cx="485" cy="125" r="12" fill="#475569" /><text x="481" y="129" class="d168a-num">3</text>
  <text x="505" y="129" class="d168a-title">Fast Baselines</text>
  <text x="475" y="155" class="d168a-text">• Logistic / Ridge baseline</text>
  <text x="475" y="175" class="d168a-text">• Simple Decision Tree</text>
  <text x="475" y="195" class="d168a-text">• Establish floor score</text>

  <!-- Phase 4 -->
  <rect x="670" y="100" width="190" height="150" class="d168a-card" fill="#f0fdf4" stroke="#22c55e" />
  <circle cx="695" cy="125" r="12" fill="#16a34a" /><text x="691" y="129" class="d168a-num">4</text>
  <text x="715" y="129" class="d168a-title" fill="#15803d">Tree Ensembles</text>
  <text x="685" y="155" class="d168a-text">• LightGBM (Speed &amp; Cat)</text>
  <text x="685" y="175" class="d168a-text">• XGBoost (Exact split)</text>
  <text x="685" y="195" class="d168a-text">• CatBoost (Target stats)</text>

  <!-- Row 2: Phases 5 to 8 -->
  <!-- Phase 5 -->
  <rect x="40" y="270" width="190" height="150" class="d168a-card" fill="#fefce8" stroke="#eab308" />
  <circle cx="65" cy="295" r="12" fill="#ca8a04" /><text x="61" y="299" class="d168a-num">5</text>
  <text x="85" y="299" class="d168a-title" fill="#854d0e">Feature Flywheel</text>
  <text x="55" y="325" class="d168a-text">• Group aggregations (mean/std)</text>
  <text x="55" y="345" class="d168a-text">• Target encoding (leak-free)</text>
  <text x="55" y="365" class="d168a-text">• Domain ratios &amp; products</text>

  <!-- Phase 6 -->
  <rect x="250" y="270" width="190" height="150" class="d168a-card" />
  <circle cx="275" cy="295" r="12" fill="#475569" /><text x="271" y="299" class="d168a-num">6</text>
  <text x="295" y="299" class="d168a-title">Optuna Tuning</text>
  <text x="265" y="325" class="d168a-text">• Bayesian TPE search</text>
  <text x="265" y="345" class="d168a-text">• Early stopping at 50 rds</text>
  <text x="265" y="365" class="d168a-text">• Regularize depth/leaves</text>

  <!-- Phase 7 -->
  <rect x="460" y="270" width="190" height="150" class="d168a-card" fill="#fdf2f8" stroke="#ec4899" />
  <circle cx="485" cy="295" r="12" fill="#db2777" /><text x="481" y="299" class="d168a-num">7</text>
  <text x="505" y="299" class="d168a-title" fill="#9d174d">Stacking &amp; Blending</text>
  <text x="475" y="325" class="d168a-text">• Out-of-fold probability Z</text>
  <text x="475" y="345" class="d168a-text">• Ridge/Logistic meta-learner</text>
  <text x="475" y="365" class="d168a-text">• Maximize model diversity</text>

  <!-- Phase 8 -->
  <rect x="670" y="270" width="190" height="150" class="d168a-card" />
  <circle cx="695" cy="295" r="12" fill="#475569" /><text x="691" y="299" class="d168a-num">8</text>
  <text x="715" y="299" class="d168a-title">SHAP &amp; Deploy</text>
  <text x="685" y="325" class="d168a-text">• TreeSHAP local attribution</text>
  <text x="685" y="345" class="d168a-text">• Permutation importance</text>
  <text x="685" y="365" class="d168a-text">• Export ONNX / Treelite</text>
</svg>
