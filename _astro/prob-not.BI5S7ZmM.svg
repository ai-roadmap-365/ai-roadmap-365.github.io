<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things probability is not</title>
  <style>
    .prob-not-bg   { fill: #f8fafc; }
    .prob-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prob-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prob-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prob-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prob-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prob-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prob-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .prob-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .prob-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .prob-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .prob-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .prob-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prob-not-row { opacity: 1; }
    .prob-not-r0 { animation-delay: 0.00s; }
    .prob-not-r1 { animation-delay: 0.45s; }
    .prob-not-r2 { animation-delay: 0.90s; }
    .prob-not-r3 { animation-delay: 1.35s; }
    .prob-not-r4 { animation-delay: 1.80s; }
    .prob-not-row { animation: prob-not-reveal 7.3s ease-in-out infinite; }
    @keyframes prob-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="prob-not-bg" width="980" height="390"/>
  <text class="prob-not-h1"  x="30" y="40">Four things probability is not</text>
  <text class="prob-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="prob-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="prob-not-name" x="46" y="122">The misconception</text>
  <text class="prob-not-desc" x="46" y="142">Commonly held.</text>
  <text class="prob-not-desc prob-not-row prob-not-r0" x="46" y="182">A probability is a prediction</text>
  <text class="prob-not-desc prob-not-row prob-not-r1" x="46" y="216">Rare events do not happen</text>
  <text class="prob-not-desc prob-not-row prob-not-r2" x="46" y="250">Independent events balance out</text>
  <text class="prob-not-desc prob-not-row prob-not-r3" x="46" y="284">Probabilities are objective facts</text>
  <text class="prob-not-desc prob-not-row prob-not-r4" x="46" y="318">Zero probability means impossible</text>
  <rect class="prob-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="prob-not-name" x="526" y="122">What is true</text>
  <text class="prob-not-desc" x="526" y="142">Actually.</text>
  <text class="prob-not-desc prob-not-row prob-not-r0" x="526" y="182">It is a statement about a long run</text>
  <text class="prob-not-desc prob-not-row prob-not-r1" x="526" y="216">With enough trials, they are common</text>
  <text class="prob-not-desc prob-not-row prob-not-r2" x="526" y="250">Each trial is unaffected by the last</text>
  <text class="prob-not-desc prob-not-row prob-not-r3" x="526" y="284">They depend on the model assumed</text>
  <text class="prob-not-desc prob-not-row prob-not-r4" x="526" y="318">In continuous spaces, it does not</text>
  <text class="prob-not-sub" x="30" y="372">Probabilities depending on the assumed model is the point that carries into machine learning, where a confident output is confident given a model that may be wrong.</text>
</svg>
