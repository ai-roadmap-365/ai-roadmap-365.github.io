<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each a few dozen lines.">
  <title>The whole system, in five pieces</title>
  <style>
    .scratch-idea-bg   { fill: #f8fafc; }
    .scratch-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scratch-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scratch-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scratch-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scratch-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scratch-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scratch-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .scratch-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .scratch-idea-stage { opacity: 1; }

    .scratch-idea-s0 { animation-delay: 0.00s; }
    .scratch-idea-e0 { animation-delay: 0.00s; }
    .scratch-idea-s1 { animation-delay: 1.33s; }
    .scratch-idea-e1 { animation-delay: 1.33s; }
    .scratch-idea-s2 { animation-delay: 2.67s; }
    .scratch-idea-e2 { animation-delay: 2.67s; }
    .scratch-idea-s3 { animation-delay: 4.00s; }
    .scratch-idea-e3 { animation-delay: 4.00s; }
    .scratch-idea-s4 { animation-delay: 5.33s; }
    .scratch-idea-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .scratch-idea-conn  { animation: scratch-idea-trace 8s ease-in-out infinite; }
      .scratch-idea-stage { animation: scratch-idea-arrive 8s ease-in-out infinite; }
    }
    @keyframes scratch-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes scratch-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .scratch-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .scratch-idea-stage { animation: scratch-idea-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes scratch-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="scratch-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="scratch-idea-bg" width="980" height="322"/>
  <text class="scratch-idea-h1"  x="30" y="40">The whole system, in five pieces</text>
  <text class="scratch-idea-sub" x="30" y="64">Each a few dozen lines.</text>
  <g class="scratch-idea-stage scratch-idea-s0">
    <rect class="scratch-idea-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="scratch-idea-step" x="44" y="142">01</text>
    <text class="scratch-idea-name" x="70" y="142">Chunk the documents</text>
    <text class="scratch-idea-desc" x="44" y="166">On word boundaries, with</text>
    <text class="scratch-idea-desc" x="44" y="182">overlap. Twenty lines.</text>
  </g>
  <line class="scratch-idea-line scratch-idea-conn scratch-idea-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#scratch-idea-tip)"/>
  <g class="scratch-idea-stage scratch-idea-s1">
    <rect class="scratch-idea-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="scratch-idea-step" x="233" y="142">02</text>
    <text class="scratch-idea-name" x="259" y="142">Score lexically</text>
    <text class="scratch-idea-desc" x="233" y="166">Term frequency, rarity,</text>
    <text class="scratch-idea-desc" x="233" y="182">length normalisation.</text>
    <text class="scratch-idea-desc" x="233" y="198">Fifteen lines.</text>
  </g>
  <line class="scratch-idea-line scratch-idea-conn scratch-idea-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#scratch-idea-tip)"/>
  <g class="scratch-idea-stage scratch-idea-s2">
    <rect class="scratch-idea-good" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="scratch-idea-step" x="422" y="142">03</text>
    <text class="scratch-idea-name" x="448" y="142">Score densely</text>
    <text class="scratch-idea-desc" x="422" y="166">One matrix multiplication</text>
    <text class="scratch-idea-desc" x="422" y="182">against the embeddings.</text>
  </g>
  <line class="scratch-idea-line scratch-idea-conn scratch-idea-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#scratch-idea-tip)"/>
  <g class="scratch-idea-stage scratch-idea-s3">
    <rect class="scratch-idea-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="scratch-idea-step" x="611" y="142">04</text>
    <text class="scratch-idea-name" x="637" y="142">Fuse the two rankings</text>
    <text class="scratch-idea-desc" x="611" y="166">By reciprocal rank. Ten</text>
    <text class="scratch-idea-desc" x="611" y="182">lines.</text>
  </g>
  <line class="scratch-idea-line scratch-idea-conn scratch-idea-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#scratch-idea-tip)"/>
  <g class="scratch-idea-stage scratch-idea-s4">
    <rect class="scratch-idea-box" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="scratch-idea-step" x="800" y="142">05</text>
    <text class="scratch-idea-name" x="826" y="142">Assemble the prompt</text>
    <text class="scratch-idea-desc" x="800" y="166">Labelled passages,</text>
    <text class="scratch-idea-desc" x="800" y="182">instruction, question.</text>
    <text class="scratch-idea-edge" x="800" y="242">~200 lines</text>
  </g>
  <text class="scratch-idea-sub" x="30" y="304">Two hundred lines is the honest total, which is worth knowing before adopting a framework: the abstraction is buying operations and integrations, not the algorithm.</text>
</svg>
