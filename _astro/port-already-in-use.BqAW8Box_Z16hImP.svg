<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four checks, in this order, and one of them is always the answer.">
  <title>Diagnosing "address already in use"</title>
  <style>
    .port-already-in-use-bg   { fill: #f8fafc; }
    .port-already-in-use-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .port-already-in-use-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .port-already-in-use-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .port-already-in-use-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .port-already-in-use-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .port-already-in-use-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .port-already-in-use-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .port-already-in-use-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .port-already-in-use-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .port-already-in-use-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .port-already-in-use-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .port-already-in-use-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .port-already-in-use-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .port-already-in-use-stage { opacity: 1; }

    .port-already-in-use-s0 { animation-delay: 0.00s; }
    .port-already-in-use-e0 { animation-delay: 0.00s; }
    .port-already-in-use-s1 { animation-delay: 1.28s; }
    .port-already-in-use-e1 { animation-delay: 1.28s; }
    .port-already-in-use-s2 { animation-delay: 2.56s; }
    .port-already-in-use-e2 { animation-delay: 2.56s; }
    .port-already-in-use-s3 { animation-delay: 3.84s; }
    .port-already-in-use-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .port-already-in-use-conn  { animation: port-already-in-use-trace 6.4s ease-in-out infinite; }
      .port-already-in-use-stage { animation: port-already-in-use-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes port-already-in-use-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes port-already-in-use-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .port-already-in-use-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .port-already-in-use-stage { animation: port-already-in-use-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes port-already-in-use-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="port-already-in-use-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="port-already-in-use-bg" width="980" height="322"/>
  <text class="port-already-in-use-h1"  x="30" y="40">Diagnosing "address already in use"</text>
  <text class="port-already-in-use-sub" x="30" y="64">Four checks, in this order, and one of them is always the answer.</text>
  <g class="port-already-in-use-stage port-already-in-use-s0">
    <rect class="port-already-in-use-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="port-already-in-use-step" x="44" y="142">01</text>
    <text class="port-already-in-use-name" x="70" y="142">Who holds it?</text>
    <text class="port-already-in-use-desc" x="44" y="166">lsof -i :8080 names the process</text>
    <text class="port-already-in-use-desc" x="44" y="182">and its PID.</text>
    <text class="port-already-in-use-edge" x="44" y="242">lsof</text>
  </g>
  <line class="port-already-in-use-line port-already-in-use-conn port-already-in-use-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#port-already-in-use-tip)"/>
  <g class="port-already-in-use-stage port-already-in-use-s1">
    <rect class="port-already-in-use-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="port-already-in-use-step" x="280" y="142">02</text>
    <text class="port-already-in-use-name" x="306" y="142">Is it your own last run?</text>
    <text class="port-already-in-use-desc" x="280" y="166">A previous server that did not</text>
    <text class="port-already-in-use-desc" x="280" y="182">exit. Signal it, per Day 7.</text>
  </g>
  <line class="port-already-in-use-line port-already-in-use-conn port-already-in-use-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#port-already-in-use-tip)"/>
  <g class="port-already-in-use-stage port-already-in-use-s2">
    <rect class="port-already-in-use-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="port-already-in-use-step" x="516" y="142">03</text>
    <text class="port-already-in-use-name" x="542" y="142">Is it TIME_WAIT?</text>
    <text class="port-already-in-use-desc" x="516" y="166">TCP holds the port briefly so</text>
    <text class="port-already-in-use-desc" x="516" y="182">late packets cannot confuse a</text>
    <text class="port-already-in-use-desc" x="516" y="198">new connection.</text>
    <text class="port-already-in-use-edge" x="516" y="242">~60s</text>
  </g>
  <line class="port-already-in-use-line port-already-in-use-conn port-already-in-use-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#port-already-in-use-tip)"/>
  <g class="port-already-in-use-stage port-already-in-use-s3">
    <rect class="port-already-in-use-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="port-already-in-use-step" x="752" y="142">04</text>
    <text class="port-already-in-use-name" x="778" y="142">Otherwise, move</text>
    <text class="port-already-in-use-desc" x="752" y="166">Nothing requires 8080. Pick</text>
    <text class="port-already-in-use-desc" x="752" y="182">another and carry on.</text>
  </g>
  <text class="port-already-in-use-sub" x="30" y="304">The TIME_WAIT case is the one that feels like a bug and is not: it is TCP protecting the next connection from the previous one's stragglers.</text>
</svg>
