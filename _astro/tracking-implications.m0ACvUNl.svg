<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are costs.">
  <title>Four consequences of tracking everything</title>
  <style>
    .tracking-implications-bg   { fill: #f8fafc; }
    .tracking-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tracking-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tracking-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tracking-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tracking-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tracking-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tracking-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tracking-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tracking-implications-stage { opacity: 1; }

    .tracking-implications-s0 { animation-delay: 0.00s; }
    .tracking-implications-e0 { animation-delay: 0.00s; }
    .tracking-implications-s1 { animation-delay: 1.28s; }
    .tracking-implications-e1 { animation-delay: 1.28s; }
    .tracking-implications-s2 { animation-delay: 2.56s; }
    .tracking-implications-e2 { animation-delay: 2.56s; }
    .tracking-implications-s3 { animation-delay: 3.84s; }
    .tracking-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tracking-implications-conn  { animation: tracking-implications-trace 6.4s ease-in-out infinite; }
      .tracking-implications-stage { animation: tracking-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tracking-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tracking-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tracking-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tracking-implications-stage { animation: tracking-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tracking-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tracking-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tracking-implications-bg" width="980" height="322"/>
  <text class="tracking-implications-h1"  x="30" y="40">Four consequences of tracking everything</text>
  <text class="tracking-implications-sub" x="30" y="64">Two are costs.</text>
  <g class="tracking-implications-stage tracking-implications-s0">
    <rect class="tracking-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tracking-implications-step" x="44" y="142">01</text>
    <text class="tracking-implications-name" x="70" y="142">Checkpoint storage adds up quickly</text>
    <text class="tracking-implications-desc" x="44" y="166">So retain by policy, not by</text>
    <text class="tracking-implications-desc" x="44" y="182">default.</text>
  </g>
  <line class="tracking-implications-line tracking-implications-conn tracking-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tracking-implications-tip)"/>
  <g class="tracking-implications-stage tracking-implications-s1">
    <rect class="tracking-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tracking-implications-step" x="280" y="142">02</text>
    <text class="tracking-implications-name" x="306" y="142">And logs can capture sensitive data</text>
    <text class="tracking-implications-desc" x="280" y="166">Sample inputs and gradients both</text>
    <text class="tracking-implications-desc" x="280" y="182">leak.</text>
  </g>
  <line class="tracking-implications-line tracking-implications-conn tracking-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tracking-implications-tip)"/>
  <g class="tracking-implications-stage tracking-implications-s2">
    <rect class="tracking-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tracking-implications-step" x="516" y="142">03</text>
    <text class="tracking-implications-name" x="542" y="142">But velocity rises sharply</text>
    <text class="tracking-implications-desc" x="516" y="166">Because no experiment is ever</text>
    <text class="tracking-implications-desc" x="516" y="182">repeated by accident.</text>
  </g>
  <line class="tracking-implications-line tracking-implications-conn tracking-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tracking-implications-tip)"/>
  <g class="tracking-implications-stage tracking-implications-s3">
    <rect class="tracking-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tracking-implications-step" x="752" y="142">04</text>
    <text class="tracking-implications-name" x="778" y="142">And regulated deployment becomes possible</text>
    <text class="tracking-implications-desc" x="752" y="166">Lineage is what an auditor</text>
    <text class="tracking-implications-desc" x="752" y="182">actually asks for.</text>
  </g>
  <text class="tracking-implications-sub" x="30" y="304">Logged sample inputs are an underrated exposure: a tracking dashboard is frequently more widely readable than the training data it displays.</text>
</svg>
