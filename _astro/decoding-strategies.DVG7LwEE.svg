<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The same model, different outputs.">
  <title>Decoding strategies</title>
  <style>
    .decoding-strategies-bg   { fill: #f8fafc; }
    .decoding-strategies-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decoding-strategies-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decoding-strategies-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decoding-strategies-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decoding-strategies-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decoding-strategies-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .decoding-strategies-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .decoding-strategies-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .decoding-strategies-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .decoding-strategies-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .decoding-strategies-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .decoding-strategies-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .decoding-strategies-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .decoding-strategies-stage { opacity: 1; }

    .decoding-strategies-s0 { animation-delay: 0.00s; }
    .decoding-strategies-e0 { animation-delay: 0.00s; }
    .decoding-strategies-s1 { animation-delay: 1.28s; }
    .decoding-strategies-e1 { animation-delay: 1.28s; }
    .decoding-strategies-s2 { animation-delay: 2.56s; }
    .decoding-strategies-e2 { animation-delay: 2.56s; }
    .decoding-strategies-s3 { animation-delay: 3.84s; }
    .decoding-strategies-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .decoding-strategies-conn  { animation: decoding-strategies-trace 6.4s ease-in-out infinite; }
      .decoding-strategies-stage { animation: decoding-strategies-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes decoding-strategies-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes decoding-strategies-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .decoding-strategies-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .decoding-strategies-stage { animation: decoding-strategies-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes decoding-strategies-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="decoding-strategies-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="decoding-strategies-bg" width="980" height="322"/>
  <text class="decoding-strategies-h1"  x="30" y="40">Decoding strategies</text>
  <text class="decoding-strategies-sub" x="30" y="64">The same model, different outputs.</text>
  <g class="decoding-strategies-stage decoding-strategies-s0">
    <rect class="decoding-strategies-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="decoding-strategies-step" x="44" y="142">01</text>
    <text class="decoding-strategies-name" x="70" y="142">Greedy: take the best token each step</text>
    <text class="decoding-strategies-desc" x="44" y="166">Fast, and locally optimal only.</text>
  </g>
  <line class="decoding-strategies-line decoding-strategies-conn decoding-strategies-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#decoding-strategies-tip)"/>
  <g class="decoding-strategies-stage decoding-strategies-s1">
    <rect class="decoding-strategies-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="decoding-strategies-step" x="280" y="142">02</text>
    <text class="decoding-strategies-name" x="306" y="142">Which can be globally poor</text>
    <text class="decoding-strategies-desc" x="280" y="166">A high-probability first word</text>
    <text class="decoding-strategies-desc" x="280" y="182">can force a bad continuation.</text>
  </g>
  <line class="decoding-strategies-line decoding-strategies-conn decoding-strategies-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#decoding-strategies-tip)"/>
  <g class="decoding-strategies-stage decoding-strategies-s2">
    <rect class="decoding-strategies-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="decoding-strategies-step" x="516" y="142">03</text>
    <text class="decoding-strategies-name" x="542" y="142">Beam search keeps several candidates</text>
    <text class="decoding-strategies-desc" x="516" y="166">Expanding the best few sequences</text>
    <text class="decoding-strategies-desc" x="516" y="182">rather than one.</text>
  </g>
  <line class="decoding-strategies-line decoding-strategies-conn decoding-strategies-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#decoding-strategies-tip)"/>
  <g class="decoding-strategies-stage decoding-strategies-s3">
    <rect class="decoding-strategies-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="decoding-strategies-step" x="752" y="142">04</text>
    <text class="decoding-strategies-name" x="778" y="142">And needs length normalisation</text>
    <text class="decoding-strategies-desc" x="752" y="166">Or it systematically prefers</text>
    <text class="decoding-strategies-desc" x="752" y="182">short outputs.</text>
  </g>
  <text class="decoding-strategies-sub" x="30" y="304">The length bias is a real and non-obvious artefact: sequence probability is a product of terms below one, so a longer sequence is mechanically less probable regardless of quality.</text>
</svg>
