<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Generating a test set</title>
  <style>
    .synthetic-tests-bg   { fill: #f8fafc; }
    .synthetic-tests-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .synthetic-tests-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .synthetic-tests-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .synthetic-tests-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .synthetic-tests-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .synthetic-tests-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .synthetic-tests-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .synthetic-tests-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .synthetic-tests-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .synthetic-tests-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .synthetic-tests-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .synthetic-tests-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .synthetic-tests-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .synthetic-tests-stage { opacity: 1; }

    .synthetic-tests-s0 { animation-delay: 0.00s; }
    .synthetic-tests-e0 { animation-delay: 0.00s; }
    .synthetic-tests-s1 { animation-delay: 1.28s; }
    .synthetic-tests-e1 { animation-delay: 1.28s; }
    .synthetic-tests-s2 { animation-delay: 2.56s; }
    .synthetic-tests-e2 { animation-delay: 2.56s; }
    .synthetic-tests-s3 { animation-delay: 3.84s; }
    .synthetic-tests-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .synthetic-tests-conn  { animation: synthetic-tests-trace 6.4s ease-in-out infinite; }
      .synthetic-tests-stage { animation: synthetic-tests-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes synthetic-tests-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes synthetic-tests-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .synthetic-tests-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .synthetic-tests-stage { animation: synthetic-tests-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes synthetic-tests-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="synthetic-tests-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="synthetic-tests-bg" width="980" height="322"/>
  <text class="synthetic-tests-h1"  x="30" y="40">Generating a test set</text>
  <text class="synthetic-tests-sub" x="30" y="64">Four steps.</text>
  <g class="synthetic-tests-stage synthetic-tests-s0">
    <rect class="synthetic-tests-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="synthetic-tests-step" x="44" y="142">01</text>
    <text class="synthetic-tests-name" x="70" y="142">Sample passages from your own corpus</text>
    <text class="synthetic-tests-desc" x="44" y="166">Which makes the questions</text>
    <text class="synthetic-tests-desc" x="44" y="182">answerable by construction.</text>
  </g>
  <line class="synthetic-tests-line synthetic-tests-conn synthetic-tests-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#synthetic-tests-tip)"/>
  <g class="synthetic-tests-stage synthetic-tests-s1">
    <rect class="synthetic-tests-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="synthetic-tests-step" x="280" y="142">02</text>
    <text class="synthetic-tests-name" x="306" y="142">Generate a question each passage answers</text>
    <text class="synthetic-tests-desc" x="280" y="166">With that passage recorded as</text>
    <text class="synthetic-tests-desc" x="280" y="182">ground truth.</text>
  </g>
  <line class="synthetic-tests-line synthetic-tests-conn synthetic-tests-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#synthetic-tests-tip)"/>
  <g class="synthetic-tests-stage synthetic-tests-s2">
    <rect class="synthetic-tests-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="synthetic-tests-step" x="516" y="142">03</text>
    <text class="synthetic-tests-name" x="542" y="142">Then make some of them harder</text>
    <text class="synthetic-tests-desc" x="516" y="166">Multi-hop, indirect, requiring</text>
    <text class="synthetic-tests-desc" x="516" y="182">two passages.</text>
  </g>
  <line class="synthetic-tests-line synthetic-tests-conn synthetic-tests-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#synthetic-tests-tip)"/>
  <g class="synthetic-tests-stage synthetic-tests-s3">
    <rect class="synthetic-tests-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="synthetic-tests-step" x="752" y="142">04</text>
    <text class="synthetic-tests-name" x="778" y="142">And review a sample by hand</text>
    <text class="synthetic-tests-desc" x="752" y="166">Because generated questions</text>
    <text class="synthetic-tests-desc" x="752" y="182">include bad ones.</text>
  </g>
  <text class="synthetic-tests-sub" x="30" y="304">The human review step is what keeps this honest: an unreviewed synthetic set measures agreement with the generating model rather than retrieval quality.</text>
</svg>
