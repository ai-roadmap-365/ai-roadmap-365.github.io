<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five steps, three outcomes.">
  <title>Detect, dispatch, budget, score, gate</title>
  <style>
    .processing-pipeline-bg   { fill: #f8fafc; }
    .processing-pipeline-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .processing-pipeline-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .processing-pipeline-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .processing-pipeline-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .processing-pipeline-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .processing-pipeline-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .processing-pipeline-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .processing-pipeline-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .processing-pipeline-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .processing-pipeline-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .processing-pipeline-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .processing-pipeline-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .processing-pipeline-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .processing-pipeline-stage { opacity: 1; }

    .processing-pipeline-s0 { animation-delay: 0.00s; }
    .processing-pipeline-e0 { animation-delay: 0.00s; }
    .processing-pipeline-s1 { animation-delay: 1.33s; }
    .processing-pipeline-e1 { animation-delay: 1.33s; }
    .processing-pipeline-s2 { animation-delay: 2.67s; }
    .processing-pipeline-e2 { animation-delay: 2.67s; }
    .processing-pipeline-s3 { animation-delay: 4.00s; }
    .processing-pipeline-e3 { animation-delay: 4.00s; }
    .processing-pipeline-s4 { animation-delay: 5.33s; }
    .processing-pipeline-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .processing-pipeline-conn  { animation: processing-pipeline-trace 8s ease-in-out infinite; }
      .processing-pipeline-stage { animation: processing-pipeline-arrive 8s ease-in-out infinite; }
    }
    @keyframes processing-pipeline-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes processing-pipeline-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .processing-pipeline-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .processing-pipeline-stage { animation: processing-pipeline-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes processing-pipeline-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="processing-pipeline-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="processing-pipeline-bg" width="980" height="322"/>
  <text class="processing-pipeline-h1"  x="30" y="40">Detect, dispatch, budget, score, gate</text>
  <text class="processing-pipeline-sub" x="30" y="64">Five steps, three outcomes.</text>
  <g class="processing-pipeline-stage processing-pipeline-s0">
    <rect class="processing-pipeline-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="processing-pipeline-step" x="44" y="142">01</text>
    <text class="processing-pipeline-name" x="70" y="142">Detect from the leading bytes</text>
    <text class="processing-pipeline-desc" x="44" y="166">Magic numbers, not</text>
    <text class="processing-pipeline-desc" x="44" y="182">extensions. Probe further</text>
    <text class="processing-pipeline-desc" x="44" y="198">where ambiguous.</text>
  </g>
  <line class="processing-pipeline-line processing-pipeline-conn processing-pipeline-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#processing-pipeline-tip)"/>
  <g class="processing-pipeline-stage processing-pipeline-s1">
    <rect class="processing-pipeline-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="processing-pipeline-step" x="233" y="142">02</text>
    <text class="processing-pipeline-name" x="259" y="142">Dispatch to a registered extractor</text>
    <text class="processing-pipeline-desc" x="233" y="166">A registry, so a new</text>
    <text class="processing-pipeline-desc" x="233" y="182">format is a handler</text>
    <text class="processing-pipeline-desc" x="233" y="198">rather than a longer</text>
  </g>
  <line class="processing-pipeline-line processing-pipeline-conn processing-pipeline-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#processing-pipeline-tip)"/>
  <g class="processing-pipeline-stage processing-pipeline-s2">
    <rect class="processing-pipeline-warn" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="processing-pipeline-step" x="422" y="142">03</text>
    <text class="processing-pipeline-name" x="448" y="142">Run under a hard budget</text>
    <text class="processing-pipeline-desc" x="422" y="166">A subprocess with a</text>
    <text class="processing-pipeline-desc" x="422" y="182">timeout — a parser in a</text>
    <text class="processing-pipeline-desc" x="422" y="198">tight loop cannot be</text>
  </g>
  <line class="processing-pipeline-line processing-pipeline-conn processing-pipeline-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#processing-pipeline-tip)"/>
  <g class="processing-pipeline-stage processing-pipeline-s3">
    <rect class="processing-pipeline-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="processing-pipeline-step" x="611" y="142">04</text>
    <text class="processing-pipeline-name" x="637" y="142">Score the output</text>
    <text class="processing-pipeline-desc" x="611" y="166">Yield, alphabetic ratio,</text>
    <text class="processing-pipeline-desc" x="611" y="182">word length, whitespace.</text>
  </g>
  <line class="processing-pipeline-line processing-pipeline-conn processing-pipeline-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#processing-pipeline-tip)"/>
  <g class="processing-pipeline-stage processing-pipeline-s4">
    <rect class="processing-pipeline-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="processing-pipeline-step" x="800" y="142">05</text>
    <text class="processing-pipeline-name" x="826" y="142">Gate: accept, flag, or dead-letter</text>
    <text class="processing-pipeline-desc" x="800" y="166">Three outcomes. Two would</text>
    <text class="processing-pipeline-desc" x="800" y="182">either discard or admit</text>
    <text class="processing-pipeline-desc" x="800" y="198">garbage.</text>
  </g>
  <text class="processing-pipeline-sub" x="30" y="304">The third outcome is what makes the system honest: flagged documents are still indexed because partial text usually beats none, and they are recorded so somebody can route them to OCR.</text>
</svg>
