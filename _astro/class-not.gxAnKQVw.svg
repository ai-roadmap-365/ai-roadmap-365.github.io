<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things classes are not</title>
  <style>
    .class-not-bg   { fill: #f8fafc; }
    .class-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .class-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .class-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .class-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .class-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .class-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .class-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .class-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .class-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .class-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .class-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .class-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .class-not-row { opacity: 1; }
    .class-not-r0 { animation-delay: 0.00s; }
    .class-not-r1 { animation-delay: 0.45s; }
    .class-not-r2 { animation-delay: 0.90s; }
    .class-not-r3 { animation-delay: 1.35s; }
    .class-not-r4 { animation-delay: 1.80s; }
    .class-not-row { animation: class-not-reveal 7.3s ease-in-out infinite; }
    @keyframes class-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="class-not-bg" width="980" height="390"/>
  <text class="class-not-h1"  x="30" y="40">Four things classes are not</text>
  <text class="class-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="class-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="class-not-name" x="46" y="122">The misconception</text>
  <text class="class-not-desc" x="46" y="142">Commonly held.</text>
  <text class="class-not-desc class-not-row class-not-r0" x="46" y="182">Everything should be a class</text>
  <text class="class-not-desc class-not-row class-not-r1" x="46" y="216">The initialiser creates the object</text>
  <text class="class-not-desc class-not-row class-not-r2" x="46" y="250">Double underscore means private</text>
  <text class="class-not-desc class-not-row class-not-r3" x="46" y="284">Class attributes are per-instance defaults</text>
  <text class="class-not-desc class-not-row class-not-r4" x="46" y="318">Getters and setters are good practice</text>
  <rect class="class-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="class-not-name" x="526" y="122">What is true</text>
  <text class="class-not-desc" x="526" y="142">Actually.</text>
  <text class="class-not-desc class-not-row class-not-r0" x="526" y="182">A function is usually the better default</text>
  <text class="class-not-desc class-not-row class-not-r1" x="526" y="216">It initialises one already created</text>
  <text class="class-not-desc class-not-row class-not-r2" x="526" y="250">It mangles the name to avoid collisions</text>
  <text class="class-not-desc class-not-row class-not-r3" x="526" y="284">They are shared, which surprises people</text>
  <text class="class-not-desc class-not-row class-not-r4" x="526" y="318">Use plain attributes; add a property if needed</text>
  <text class="class-not-sub" x="30" y="372">Writing getters and setters for every attribute is a habit imported from other languages, and it adds ceremony that a property can supply later if it is ever needed.</text>
</svg>
