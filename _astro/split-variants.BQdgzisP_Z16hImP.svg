<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The default is not what the explicit version does.">
  <title>Four ways to split, and they differ</title>
  <style>
    .split-variants-bg   { fill: #f8fafc; }
    .split-variants-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .split-variants-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .split-variants-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .split-variants-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .split-variants-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .split-variants-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .split-variants-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .split-variants-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .split-variants-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .split-variants-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .split-variants-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .split-variants-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .split-variants-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .split-variants-stage { opacity: 1; }

    .split-variants-s0 { animation-delay: 0.00s; }
    .split-variants-e0 { animation-delay: 0.00s; }
    .split-variants-s1 { animation-delay: 1.28s; }
    .split-variants-e1 { animation-delay: 1.28s; }
    .split-variants-s2 { animation-delay: 2.56s; }
    .split-variants-e2 { animation-delay: 2.56s; }
    .split-variants-s3 { animation-delay: 3.84s; }
    .split-variants-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .split-variants-conn  { animation: split-variants-trace 6.4s ease-in-out infinite; }
      .split-variants-stage { animation: split-variants-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes split-variants-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes split-variants-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .split-variants-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .split-variants-stage { animation: split-variants-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes split-variants-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="split-variants-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="split-variants-bg" width="980" height="322"/>
  <text class="split-variants-h1"  x="30" y="40">Four ways to split, and they differ</text>
  <text class="split-variants-sub" x="30" y="64">The default is not what the explicit version does.</text>
  <g class="split-variants-stage split-variants-s0">
    <rect class="split-variants-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="split-variants-step" x="44" y="142">01</text>
    <text class="split-variants-name" x="70" y="142">split()</text>
    <text class="split-variants-desc" x="44" y="166">Any whitespace, runs collapsed,</text>
    <text class="split-variants-desc" x="44" y="182">leading and trailing empties</text>
    <text class="split-variants-desc" x="44" y="198">dropped.</text>
    <text class="split-variants-edge" x="44" y="242">forgiving</text>
  </g>
  <line class="split-variants-line split-variants-conn split-variants-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#split-variants-tip)"/>
  <g class="split-variants-stage split-variants-s1">
    <rect class="split-variants-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="split-variants-step" x="280" y="142">02</text>
    <text class="split-variants-name" x="306" y="142">split(" ")</text>
    <text class="split-variants-desc" x="280" y="166">Every single space. Double</text>
    <text class="split-variants-desc" x="280" y="182">spaces produce empty strings</text>
    <text class="split-variants-desc" x="280" y="198">between them.</text>
    <text class="split-variants-edge" x="280" y="242">literal</text>
  </g>
  <line class="split-variants-line split-variants-conn split-variants-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#split-variants-tip)"/>
  <g class="split-variants-stage split-variants-s2">
    <rect class="split-variants-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="split-variants-step" x="516" y="142">03</text>
    <text class="split-variants-name" x="542" y="142">splitlines()</text>
    <text class="split-variants-desc" x="516" y="166">Every line ending, including</text>
    <text class="split-variants-desc" x="516" y="182">\\r\\n. No stray carriage</text>
    <text class="split-variants-desc" x="516" y="198">returns.</text>
    <text class="split-variants-edge" x="516" y="242">lines</text>
  </g>
  <line class="split-variants-line split-variants-conn split-variants-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#split-variants-tip)"/>
  <g class="split-variants-stage split-variants-s3">
    <rect class="split-variants-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="split-variants-step" x="752" y="142">04</text>
    <text class="split-variants-name" x="778" y="142">partition(sep)</text>
    <text class="split-variants-desc" x="752" y="166">Three pieces: before, the</text>
    <text class="split-variants-desc" x="752" y="182">separator, after. For exactly</text>
    <text class="split-variants-desc" x="752" y="198">one split.</text>
    <text class="split-variants-edge" x="752" y="242">3-tuple</text>
  </g>
  <text class="split-variants-sub" x="30" y="304">The first two are the pair that catches people: split() on "a  b" gives two items, and split(" ") gives three, the middle one empty. Neither is wrong; they answer different questions.</text>
</svg>
