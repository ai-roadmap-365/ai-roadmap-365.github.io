<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three controls, one adaptive.">
  <title>Running a thousand cases quickly</title>
  <style>
    .concurrency-throttle-bg   { fill: #f8fafc; }
    .concurrency-throttle-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .concurrency-throttle-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .concurrency-throttle-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .concurrency-throttle-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .concurrency-throttle-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .concurrency-throttle-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .concurrency-throttle-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .concurrency-throttle-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .concurrency-throttle-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .concurrency-throttle-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .concurrency-throttle-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .concurrency-throttle-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .concurrency-throttle-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .concurrency-throttle-stage { opacity: 1; }

    .concurrency-throttle-s0 { animation-delay: 0.00s; }
    .concurrency-throttle-e0 { animation-delay: 0.00s; }
    .concurrency-throttle-s1 { animation-delay: 1.50s; }
    .concurrency-throttle-e1 { animation-delay: 1.50s; }
    .concurrency-throttle-s2 { animation-delay: 3.00s; }
    .concurrency-throttle-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .concurrency-throttle-conn  { animation: concurrency-throttle-trace 6s ease-in-out infinite; }
      .concurrency-throttle-stage { animation: concurrency-throttle-arrive 6s ease-in-out infinite; }
    }
    @keyframes concurrency-throttle-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes concurrency-throttle-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .concurrency-throttle-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .concurrency-throttle-stage { animation: concurrency-throttle-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes concurrency-throttle-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="concurrency-throttle-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="concurrency-throttle-bg" width="980" height="322"/>
  <text class="concurrency-throttle-h1"  x="30" y="40">Running a thousand cases quickly</text>
  <text class="concurrency-throttle-sub" x="30" y="64">Three controls, one adaptive.</text>
  <g class="concurrency-throttle-stage concurrency-throttle-s0">
    <rect class="concurrency-throttle-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="concurrency-throttle-step" x="44" y="142">01</text>
    <text class="concurrency-throttle-name" x="70" y="142">A semaphore pool</text>
    <text class="concurrency-throttle-desc" x="44" y="166">A fixed ceiling on in-flight requests.</text>
  </g>
  <line class="concurrency-throttle-line concurrency-throttle-conn concurrency-throttle-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#concurrency-throttle-tip)"/>
  <g class="concurrency-throttle-stage concurrency-throttle-s1">
    <rect class="concurrency-throttle-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="concurrency-throttle-step" x="359" y="142">02</text>
    <text class="concurrency-throttle-name" x="385" y="142">A token bucket</text>
    <text class="concurrency-throttle-desc" x="359" y="166">Requests and tokens per minute, within the</text>
    <text class="concurrency-throttle-desc" x="359" y="182">provider's tier.</text>
  </g>
  <line class="concurrency-throttle-line concurrency-throttle-conn concurrency-throttle-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#concurrency-throttle-tip)"/>
  <g class="concurrency-throttle-stage concurrency-throttle-s2">
    <rect class="concurrency-throttle-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="concurrency-throttle-step" x="674" y="142">03</text>
    <text class="concurrency-throttle-name" x="700" y="142">Halve on 429, then ramp</text>
    <text class="concurrency-throttle-desc" x="674" y="166">Exponential backoff with jitter, then recover</text>
    <text class="concurrency-throttle-desc" x="674" y="182">throughput.</text>
    <text class="concurrency-throttle-edge" x="674" y="242">adaptive</text>
  </g>
  <text class="concurrency-throttle-sub" x="30" y="304">The adaptive step is what keeps a long run from failing halfway: a fixed concurrency that works at one time of day will hit rate limits at another, and a run that dies at case 700 has cost money for nothing.</text>
</svg>
