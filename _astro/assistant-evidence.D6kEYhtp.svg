<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each proving one seam.">
  <title>Three runs, three properties</title>
  <style>
    .assistant-evidence-bg   { fill: #f8fafc; }
    .assistant-evidence-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assistant-evidence-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assistant-evidence-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assistant-evidence-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assistant-evidence-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assistant-evidence-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .assistant-evidence-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .assistant-evidence-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .assistant-evidence-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .assistant-evidence-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .assistant-evidence-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .assistant-evidence-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .assistant-evidence-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .assistant-evidence-stage { opacity: 1; }

    .assistant-evidence-s0 { animation-delay: 0.00s; }
    .assistant-evidence-e0 { animation-delay: 0.00s; }
    .assistant-evidence-s1 { animation-delay: 1.28s; }
    .assistant-evidence-e1 { animation-delay: 1.28s; }
    .assistant-evidence-s2 { animation-delay: 2.56s; }
    .assistant-evidence-e2 { animation-delay: 2.56s; }
    .assistant-evidence-s3 { animation-delay: 3.84s; }
    .assistant-evidence-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .assistant-evidence-conn  { animation: assistant-evidence-trace 6.4s ease-in-out infinite; }
      .assistant-evidence-stage { animation: assistant-evidence-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes assistant-evidence-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes assistant-evidence-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .assistant-evidence-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .assistant-evidence-stage { animation: assistant-evidence-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes assistant-evidence-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="assistant-evidence-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="assistant-evidence-bg" width="980" height="322"/>
  <text class="assistant-evidence-h1"  x="30" y="40">Three runs, three properties</text>
  <text class="assistant-evidence-sub" x="30" y="64">Each proving one seam.</text>
  <g class="assistant-evidence-stage assistant-evidence-s0">
    <rect class="assistant-evidence-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="assistant-evidence-step" x="44" y="142">01</text>
    <text class="assistant-evidence-name" x="70" y="142">Two documents dead-lettered</text>
    <text class="assistant-evidence-desc" x="44" y="166">One empty, one failing the</text>
    <text class="assistant-evidence-desc" x="44" y="182">alphabetic-ratio gate. The run</text>
    <text class="assistant-evidence-desc" x="44" y="198">continues.</text>
  </g>
  <line class="assistant-evidence-line assistant-evidence-conn assistant-evidence-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#assistant-evidence-tip)"/>
  <g class="assistant-evidence-stage assistant-evidence-s1">
    <rect class="assistant-evidence-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="assistant-evidence-step" x="280" y="142">02</text>
    <text class="assistant-evidence-name" x="306" y="142">Four redactions, before chunking</text>
    <text class="assistant-evidence-desc" x="280" y="166">No vector in the index contains</text>
    <text class="assistant-evidence-desc" x="280" y="182">an email address.</text>
  </g>
  <line class="assistant-evidence-line assistant-evidence-conn assistant-evidence-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#assistant-evidence-tip)"/>
  <g class="assistant-evidence-stage assistant-evidence-s2">
    <rect class="assistant-evidence-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="assistant-evidence-step" x="516" y="142">03</text>
    <text class="assistant-evidence-name" x="542" y="142">Retrieval charged alongside the models</text>
    <text class="assistant-evidence-desc" x="516" y="166">One model is 91% of spend from</text>
    <text class="assistant-evidence-desc" x="516" y="182">one of three questions.</text>
    <text class="assistant-evidence-edge" x="516" y="242">attribution</text>
  </g>
  <line class="assistant-evidence-line assistant-evidence-conn assistant-evidence-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#assistant-evidence-tip)"/>
  <g class="assistant-evidence-stage assistant-evidence-s3">
    <rect class="assistant-evidence-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="assistant-evidence-step" x="752" y="142">04</text>
    <text class="assistant-evidence-name" x="778" y="142">Three stores, three read-backs</text>
    <text class="assistant-evidence-desc" x="752" y="166">Including the cache — without</text>
    <text class="assistant-evidence-desc" x="752" y="182">clearing it, the assistant keeps</text>
    <text class="assistant-evidence-desc" x="752" y="198">answering from deleted content.</text>
  </g>
  <text class="assistant-evidence-sub" x="30" y="304">The attribution answers the optimisation question immediately, which is the point of building the ledger before optimising anything: 91 percent of spend from one question shape is a routing decision, not a prompt one.</text>
</svg>
