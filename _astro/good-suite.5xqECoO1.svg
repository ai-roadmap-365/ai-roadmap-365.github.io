<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four properties each.">
  <title>A good suite against a bad one</title>
  <style>
    .good-suite-bg   { fill: #f8fafc; }
    .good-suite-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .good-suite-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .good-suite-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .good-suite-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .good-suite-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .good-suite-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .good-suite-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .good-suite-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .good-suite-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .good-suite-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .good-suite-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .good-suite-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .good-suite-row { opacity: 1; }
    .good-suite-r0 { animation-delay: 0.00s; }
    .good-suite-r1 { animation-delay: 0.45s; }
    .good-suite-r2 { animation-delay: 0.90s; }
    .good-suite-r3 { animation-delay: 1.35s; }
    .good-suite-r4 { animation-delay: 1.80s; }
    .good-suite-row { animation: good-suite-reveal 7.3s ease-in-out infinite; }
    @keyframes good-suite-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="good-suite-bg" width="980" height="390"/>
  <text class="good-suite-h1"  x="30" y="40">A good suite against a bad one</text>
  <text class="good-suite-sub" x="30" y="64">Four properties each.</text>
  <rect class="good-suite-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="good-suite-name" x="46" y="122">A good suite</text>
  <text class="good-suite-desc" x="46" y="142">Trusted.</text>
  <text class="good-suite-desc good-suite-row good-suite-r0" x="46" y="182">Fast enough to run constantly</text>
  <text class="good-suite-desc good-suite-row good-suite-r1" x="46" y="216">Independent: any order, any subset</text>
  <text class="good-suite-desc good-suite-row good-suite-r2" x="46" y="250">Deterministic</text>
  <text class="good-suite-desc good-suite-row good-suite-r3" x="46" y="284">Failures name the problem</text>
  <text class="good-suite-desc good-suite-row good-suite-r4" x="46" y="318">Tests behaviour, not internals</text>
  <rect class="good-suite-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="good-suite-name" x="526" y="122">A poor suite</text>
  <text class="good-suite-desc" x="526" y="142">Ignored.</text>
  <text class="good-suite-desc good-suite-row good-suite-r0" x="526" y="182">Slow enough to skip</text>
  <text class="good-suite-desc good-suite-row good-suite-r1" x="526" y="216">Order-dependent, via shared state</text>
  <text class="good-suite-desc good-suite-row good-suite-r2" x="526" y="250">Intermittently failing</text>
  <text class="good-suite-desc good-suite-row good-suite-r3" x="526" y="284">Failures require investigation</text>
  <text class="good-suite-desc good-suite-row good-suite-r4" x="526" y="318">Breaks on every refactor</text>
  <text class="good-suite-sub" x="30" y="372">A suite people skip has negative value: it costs maintenance and provides no confidence, which is worse than having none at all.</text>
</svg>
