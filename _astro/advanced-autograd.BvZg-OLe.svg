<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two useful, one hazardous.">
  <title>Three advanced autograd features</title>
  <style>
    .advanced-autograd-bg   { fill: #f8fafc; }
    .advanced-autograd-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .advanced-autograd-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .advanced-autograd-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .advanced-autograd-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .advanced-autograd-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .advanced-autograd-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .advanced-autograd-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .advanced-autograd-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .advanced-autograd-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .advanced-autograd-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .advanced-autograd-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .advanced-autograd-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .advanced-autograd-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .advanced-autograd-stage { opacity: 1; }

    .advanced-autograd-s0 { animation-delay: 0.00s; }
    .advanced-autograd-e0 { animation-delay: 0.00s; }
    .advanced-autograd-s1 { animation-delay: 1.50s; }
    .advanced-autograd-e1 { animation-delay: 1.50s; }
    .advanced-autograd-s2 { animation-delay: 3.00s; }
    .advanced-autograd-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .advanced-autograd-conn  { animation: advanced-autograd-trace 6s ease-in-out infinite; }
      .advanced-autograd-stage { animation: advanced-autograd-arrive 6s ease-in-out infinite; }
    }
    @keyframes advanced-autograd-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes advanced-autograd-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .advanced-autograd-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .advanced-autograd-stage { animation: advanced-autograd-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes advanced-autograd-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="advanced-autograd-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="advanced-autograd-bg" width="980" height="322"/>
  <text class="advanced-autograd-h1"  x="30" y="40">Three advanced autograd features</text>
  <text class="advanced-autograd-sub" x="30" y="64">Two useful, one hazardous.</text>
  <g class="advanced-autograd-stage advanced-autograd-s0">
    <rect class="advanced-autograd-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="advanced-autograd-step" x="44" y="142">01</text>
    <text class="advanced-autograd-name" x="70" y="142">Hooks</text>
    <text class="advanced-autograd-desc" x="44" y="166">Callbacks on forward or backward, without</text>
    <text class="advanced-autograd-desc" x="44" y="182">editing the module. For inspection and</text>
    <text class="advanced-autograd-desc" x="44" y="198">debugging.</text>
  </g>
  <line class="advanced-autograd-line advanced-autograd-conn advanced-autograd-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#advanced-autograd-tip)"/>
  <g class="advanced-autograd-stage advanced-autograd-s1">
    <rect class="advanced-autograd-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="advanced-autograd-step" x="359" y="142">02</text>
    <text class="advanced-autograd-name" x="385" y="142">Custom functions</text>
    <text class="advanced-autograd-desc" x="359" y="166">Define a forward and a backward yourself —</text>
    <text class="advanced-autograd-desc" x="359" y="182">for non-differentiable steps or faster</text>
    <text class="advanced-autograd-desc" x="359" y="198">kernels.</text>
  </g>
  <line class="advanced-autograd-line advanced-autograd-conn advanced-autograd-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#advanced-autograd-tip)"/>
  <g class="advanced-autograd-stage advanced-autograd-s2">
    <rect class="advanced-autograd-warn" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="advanced-autograd-step" x="674" y="142">03</text>
    <text class="advanced-autograd-name" x="700" y="142">In-place operations</text>
    <text class="advanced-autograd-desc" x="674" y="166">Overwriting a value autograd saved raises at</text>
    <text class="advanced-autograd-desc" x="674" y="182">backward time.</text>
  </g>
  <text class="advanced-autograd-sub" x="30" y="304">The in-place hazard is a real trade rather than a mistake: modifying in place saves memory, and it is unsafe exactly when the overwritten value was needed for a derivative.</text>
</svg>
