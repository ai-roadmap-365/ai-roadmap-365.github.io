<svg role="img" aria-label="Latency timeline comparison between blocking and streaming generation diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Latency Timeline: Block Generation vs Streaming</title>
  <defs>
    <linearGradient id="bg255b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card255b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg255b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">LATENCY PROFILES: BLOCKING VS STREAMING</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Comparing Perceived Latency (Time-To-First-Token) and Inter-Token Smoothness</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card255b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Blocking Timeline -->
    <rect x="30" y="30" width="700" height="105" fill="#0f172a" stroke="#fb7185" rx="6"/>
    <text x="45" y="55" fill="#fb7185" font-size="11" font-weight="700">1. Blocking Response (Perceived Latency = 5.2 seconds)</text>
    <rect x="45" y="70" width="580" height="25" fill="#e11d48" rx="4"/>
    <text x="335" y="87" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">User Waiting Idle (Spinner) — 5,200ms</text>
    <rect x="630" y="70" width="85" height="25" fill="#34d399" rx="4"/>
    <text x="672" y="87" fill="#0f172a" font-size="8" font-weight="700" text-anchor="middle">Output Pop</text>
    <text x="45" y="120" fill="#94a3b8" font-size="8">Perception: High friction, unresponsive feel, high abandonment risk.</text>

    <!-- Streaming Timeline -->
    <rect x="30" y="155" width="700" height="115" fill="#0f172a" stroke="#34d399" rx="6"/>
    <text x="45" y="180" fill="#34d399" font-size="11" font-weight="700">2. Streaming Response (Perceived Latency = 380 ms)</text>
    <rect x="45" y="195" width="60" height="25" fill="#38bdf8" rx="4"/>
    <text x="75" y="211" fill="#0f172a" font-size="7" font-weight="700" text-anchor="middle">TTFT 380ms</text>
    
    <!-- Token pulses -->
    <g transform="translate(110, 195)">
      <rect x="5" y="0" width="22" height="25" fill="#34d399" rx="2"/>
      <rect x="32" y="0" width="22" height="25" fill="#34d399" rx="2"/>
      <rect x="59" y="0" width="22" height="25" fill="#34d399" rx="2"/>
      <rect x="86" y="0" width="22" height="25" fill="#34d399" rx="2"/>
      <rect x="113" y="0" width="22" height="25" fill="#34d399" rx="2"/>
      <rect x="140" y="0" width="22" height="25" fill="#34d399" rx="2"/>
      <rect x="167" y="0" width="22" height="25" fill="#34d399" rx="2"/>
      <rect x="194" y="0" width="22" height="25" fill="#34d399" rx="2"/>
      <rect x="221" y="0" width="22" height="25" fill="#34d399" rx="2"/>
      <rect x="248" y="0" width="22" height="25" fill="#34d399" rx="2"/>
      <rect x="275" y="0" width="22" height="25" fill="#34d399" rx="2"/>
      <rect x="302" y="0" width="22" height="25" fill="#34d399" rx="2"/>
      <rect x="329" y="0" width="22" height="25" fill="#34d399" rx="2"/>
      <rect x="356" y="0" width="22" height="25" fill="#34d399" rx="2"/>
      <rect x="383" y="0" width="22" height="25" fill="#34d399" rx="2"/>
      <rect x="410" y="0" width="22" height="25" fill="#34d399" rx="2"/>
      <rect x="437" y="0" width="22" height="25" fill="#34d399" rx="2"/>
      <rect x="464" y="0" width="22" height="25" fill="#34d399" rx="2"/>
      <rect x="491" y="0" width="22" height="25" fill="#34d399" rx="2"/>
      <rect x="518" y="0" width="22" height="25" fill="#34d399" rx="2"/>
      <rect x="545" y="0" width="55" height="25" fill="#fb7185" rx="2"/>
      <text x="572" y="16" fill="#ffffff" font-size="7" font-weight="700" text-anchor="middle">[DONE]</text>
    </g>
    <text x="45" y="245" fill="#94a3b8" font-size="8">Perception: Immediate feedback, fluid typewriter motion (24ms/token), 10x better UX.</text>
  </g>
</svg>
