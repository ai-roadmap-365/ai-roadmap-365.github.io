<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Triage, diversion, and scrubbing in.">
  <title>A multi-lane emergency room</title>
  <style>
    .emergency-room-bg   { fill: #f8fafc; }
    .emergency-room-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .emergency-room-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .emergency-room-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .emergency-room-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .emergency-room-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .emergency-room-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .emergency-room-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .emergency-room-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .emergency-room-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .emergency-room-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .emergency-room-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .emergency-room-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .emergency-room-row { opacity: 1; }
    .emergency-room-r0 { animation-delay: 0.00s; }
    .emergency-room-r1 { animation-delay: 0.45s; }
    .emergency-room-r2 { animation-delay: 0.90s; }
    .emergency-room-r3 { animation-delay: 1.35s; }
    .emergency-room-r4 { animation-delay: 1.80s; }
    .emergency-room-row { animation: emergency-room-reveal 7.3s ease-in-out infinite; }
    @keyframes emergency-room-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="emergency-room-bg" width="980" height="390"/>
  <text class="emergency-room-h1"  x="30" y="40">A multi-lane emergency room</text>
  <text class="emergency-room-sub" x="30" y="64">Triage, diversion, and scrubbing in.</text>
  <rect class="emergency-room-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="emergency-room-name" x="46" y="122">The hospital</text>
  <text class="emergency-room-desc" x="46" y="142">Three practices.</text>
  <text class="emergency-room-desc emergency-room-row emergency-room-r0" x="46" y="182">Triage sends patients to the freest doctor</text>
  <text class="emergency-room-desc emergency-room-row emergency-room-r1" x="46" y="216">Ambulances diverted when the ICU floods</text>
  <text class="emergency-room-desc emergency-room-row emergency-room-r2" x="46" y="250">A surgeon scrubs in before being assigned</text>
  <text class="emergency-room-desc emergency-room-row emergency-room-r3" x="46" y="284">Nobody is left unattended in a hallway</text>
  <text class="emergency-room-desc emergency-room-row emergency-room-r4" x="46" y="318">Everyone knows which state they are in</text>
  <rect class="emergency-room-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="emergency-room-name" x="526" y="122">The gateway</text>
  <text class="emergency-room-desc" x="526" y="142">The same three.</text>
  <text class="emergency-room-desc emergency-room-row emergency-room-r0" x="526" y="182">LOR routes to the fewest active streams</text>
  <text class="emergency-room-desc emergency-room-row emergency-room-r1" x="526" y="216">The circuit opens and answers from cache</text>
  <text class="emergency-room-desc emergency-room-row emergency-room-r2" x="526" y="250">A startup probe gates first traffic</text>
  <text class="emergency-room-desc emergency-room-row emergency-room-r3" x="526" y="284">No client waits on a dead backend</text>
  <text class="emergency-room-desc emergency-room-row emergency-room-r4" x="526" y="318">Every state is observable</text>
  <text class="emergency-room-sub" x="30" y="372">The diversion is the one people resist implementing, because it feels like giving up — and it is the difference between a busy department and one where nobody is being seen at all.</text>
</svg>
