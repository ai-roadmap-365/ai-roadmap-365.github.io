<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each with a specific mechanism.">
  <title>Four failures the controls prevent</title>
  <style>
    .four-failures-prevented-bg   { fill: #f8fafc; }
    .four-failures-prevented-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-failures-prevented-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-failures-prevented-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-failures-prevented-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-failures-prevented-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-failures-prevented-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .four-failures-prevented-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .four-failures-prevented-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .four-failures-prevented-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .four-failures-prevented-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .four-failures-prevented-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .four-failures-prevented-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .four-failures-prevented-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .four-failures-prevented-stage { opacity: 1; }

    .four-failures-prevented-s0 { animation-delay: 0.00s; }
    .four-failures-prevented-e0 { animation-delay: 0.00s; }
    .four-failures-prevented-s1 { animation-delay: 1.28s; }
    .four-failures-prevented-e1 { animation-delay: 1.28s; }
    .four-failures-prevented-s2 { animation-delay: 2.56s; }
    .four-failures-prevented-e2 { animation-delay: 2.56s; }
    .four-failures-prevented-s3 { animation-delay: 3.84s; }
    .four-failures-prevented-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .four-failures-prevented-conn  { animation: four-failures-prevented-trace 6.4s ease-in-out infinite; }
      .four-failures-prevented-stage { animation: four-failures-prevented-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes four-failures-prevented-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes four-failures-prevented-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .four-failures-prevented-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .four-failures-prevented-stage { animation: four-failures-prevented-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes four-failures-prevented-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="four-failures-prevented-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="four-failures-prevented-bg" width="980" height="322"/>
  <text class="four-failures-prevented-h1"  x="30" y="40">Four failures the controls prevent</text>
  <text class="four-failures-prevented-sub" x="30" y="64">Each with a specific mechanism.</text>
  <g class="four-failures-prevented-stage four-failures-prevented-s0">
    <rect class="four-failures-prevented-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="four-failures-prevented-step" x="44" y="142">01</text>
    <text class="four-failures-prevented-name" x="70" y="142">Accidental deletion</text>
    <text class="four-failures-prevented-desc" x="44" y="166">"Clean up old test files"</text>
    <text class="four-failures-prevented-desc" x="44" y="182">misread as the repository. An</text>
    <text class="four-failures-prevented-desc" x="44" y="198">approval gate shows the list.</text>
  </g>
  <line class="four-failures-prevented-line four-failures-prevented-conn four-failures-prevented-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#four-failures-prevented-tip)"/>
  <g class="four-failures-prevented-stage four-failures-prevented-s1">
    <rect class="four-failures-prevented-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="four-failures-prevented-step" x="280" y="142">02</text>
    <text class="four-failures-prevented-name" x="306" y="142">Injected actions completing</text>
    <text class="four-failures-prevented-desc" x="280" y="166">Confirmation on egress and</text>
    <text class="four-failures-prevented-desc" x="280" y="182">mutation means an injection</text>
    <text class="four-failures-prevented-desc" x="280" y="198">cannot finish autonomously.</text>
  </g>
  <line class="four-failures-prevented-line four-failures-prevented-conn four-failures-prevented-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#four-failures-prevented-tip)"/>
  <g class="four-failures-prevented-stage four-failures-prevented-s2">
    <rect class="four-failures-prevented-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="four-failures-prevented-step" x="516" y="142">03</text>
    <text class="four-failures-prevented-name" x="542" y="142">Filesystem blast radius</text>
    <text class="four-failures-prevented-desc" x="516" y="166">Canonicalisation confines reads</text>
    <text class="four-failures-prevented-desc" x="516" y="182">and writes to a configured</text>
    <text class="four-failures-prevented-desc" x="516" y="198">workspace.</text>
    <text class="four-failures-prevented-edge" x="516" y="242">no ~/.ssh</text>
  </g>
  <line class="four-failures-prevented-line four-failures-prevented-conn four-failures-prevented-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#four-failures-prevented-tip)"/>
  <g class="four-failures-prevented-stage four-failures-prevented-s3">
    <rect class="four-failures-prevented-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="four-failures-prevented-step" x="752" y="142">04</text>
    <text class="four-failures-prevented-name" x="778" y="142">Unexplainable incidents</text>
    <text class="four-failures-prevented-desc" x="752" y="166">An append-only log of calls,</text>
    <text class="four-failures-prevented-desc" x="752" y="182">arguments and verdicts.</text>
  </g>
  <text class="four-failures-prevented-sub" x="30" y="304">The first is worth noticing because there is no attacker in it: the most likely destructive event is a well-intentioned agent acting on an ambiguous instruction, and the same gate catches both.</text>
</svg>
