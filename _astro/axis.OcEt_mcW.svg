<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Settled once.">
  <title>Which axis is which</title>
  <style>
    .axis-bg   { fill: #f8fafc; }
    .axis-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .axis-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .axis-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .axis-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .axis-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .axis-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .axis-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .axis-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .axis-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .axis-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .axis-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .axis-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .axis-row { opacity: 1; }
    .axis-r0 { animation-delay: 0.00s; }
    .axis-r1 { animation-delay: 0.45s; }
    .axis-r2 { animation-delay: 0.90s; }
    .axis-r3 { animation-delay: 1.35s; }
    .axis-r4 { animation-delay: 1.80s; }
    .axis-row { animation: axis-reveal 7.3s ease-in-out infinite; }
    @keyframes axis-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="axis-bg" width="980" height="390"/>
  <text class="axis-h1"  x="30" y="40">Which axis is which</text>
  <text class="axis-sub" x="30" y="64">Settled once.</text>
  <rect class="axis-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="axis-name" x="46" y="122">axis=0</text>
  <text class="axis-desc" x="46" y="142">Down the rows.</text>
  <text class="axis-desc axis-row axis-r0" x="46" y="182">Collapses the row dimension</text>
  <text class="axis-desc axis-row axis-r1" x="46" y="216">Gives one value per column</text>
  <text class="axis-desc axis-row axis-r2" x="46" y="250">Column means, column sums</text>
  <text class="axis-desc axis-row axis-r3" x="46" y="284">Result length equals the column count</text>
  <text class="axis-desc axis-row axis-r4" x="46" y="318">Think: 'for each column'</text>
  <rect class="axis-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="axis-name" x="526" y="122">axis=1</text>
  <text class="axis-desc" x="526" y="142">Across the columns.</text>
  <text class="axis-desc axis-row axis-r0" x="526" y="182">Collapses the column dimension</text>
  <text class="axis-desc axis-row axis-r1" x="526" y="216">Gives one value per row</text>
  <text class="axis-desc axis-row axis-r2" x="526" y="250">Row means, row sums</text>
  <text class="axis-desc axis-row axis-r3" x="526" y="284">Result length equals the row count</text>
  <text class="axis-desc axis-row axis-r4" x="526" y="318">Think: 'for each row'</text>
  <text class="axis-sub" x="30" y="372">The axis argument names the dimension that disappears, which is the reading that makes it memorable rather than something to look up each time.</text>
</svg>
