<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Isolation forests</title>
  <style>
    .isolation-forest-bg   { fill: #f8fafc; }
    .isolation-forest-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .isolation-forest-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .isolation-forest-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .isolation-forest-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .isolation-forest-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .isolation-forest-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .isolation-forest-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .isolation-forest-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .isolation-forest-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .isolation-forest-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .isolation-forest-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .isolation-forest-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .isolation-forest-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .isolation-forest-stage { opacity: 1; }

    .isolation-forest-s0 { animation-delay: 0.00s; }
    .isolation-forest-e0 { animation-delay: 0.00s; }
    .isolation-forest-s1 { animation-delay: 1.28s; }
    .isolation-forest-e1 { animation-delay: 1.28s; }
    .isolation-forest-s2 { animation-delay: 2.56s; }
    .isolation-forest-e2 { animation-delay: 2.56s; }
    .isolation-forest-s3 { animation-delay: 3.84s; }
    .isolation-forest-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .isolation-forest-conn  { animation: isolation-forest-trace 6.4s ease-in-out infinite; }
      .isolation-forest-stage { animation: isolation-forest-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes isolation-forest-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes isolation-forest-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .isolation-forest-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .isolation-forest-stage { animation: isolation-forest-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes isolation-forest-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="isolation-forest-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="isolation-forest-bg" width="980" height="322"/>
  <text class="isolation-forest-h1"  x="30" y="40">Isolation forests</text>
  <text class="isolation-forest-sub" x="30" y="64">Four steps.</text>
  <g class="isolation-forest-stage isolation-forest-s0">
    <rect class="isolation-forest-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="isolation-forest-step" x="44" y="142">01</text>
    <text class="isolation-forest-name" x="70" y="142">Split the data on a random feature at a random value</text>
    <text class="isolation-forest-desc" x="44" y="166">Repeatedly, building a tree.</text>
  </g>
  <line class="isolation-forest-line isolation-forest-conn isolation-forest-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#isolation-forest-tip)"/>
  <g class="isolation-forest-stage isolation-forest-s1">
    <rect class="isolation-forest-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="isolation-forest-step" x="280" y="142">02</text>
    <text class="isolation-forest-name" x="306" y="142">Continue until each point is alone in its region</text>
    <text class="isolation-forest-desc" x="280" y="166">Which is isolation.</text>
  </g>
  <line class="isolation-forest-line isolation-forest-conn isolation-forest-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#isolation-forest-tip)"/>
  <g class="isolation-forest-stage isolation-forest-s2">
    <rect class="isolation-forest-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="isolation-forest-step" x="516" y="142">03</text>
    <text class="isolation-forest-name" x="542" y="142">Anomalies are isolated in few splits</text>
    <text class="isolation-forest-desc" x="516" y="166">Because they sit apart from</text>
    <text class="isolation-forest-desc" x="516" y="182">everything.</text>
  </g>
  <line class="isolation-forest-line isolation-forest-conn isolation-forest-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#isolation-forest-tip)"/>
  <g class="isolation-forest-stage isolation-forest-s3">
    <rect class="isolation-forest-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="isolation-forest-step" x="752" y="142">04</text>
    <text class="isolation-forest-name" x="778" y="142">So a short average path length means anomalous</text>
    <text class="isolation-forest-desc" x="752" y="166">Averaged over many random trees.</text>
  </g>
  <text class="isolation-forest-sub" x="30" y="304">Detecting anomalies by how easily they are separated rather than by distance is what makes this scale: no pairwise distances are ever computed.</text>
</svg>
