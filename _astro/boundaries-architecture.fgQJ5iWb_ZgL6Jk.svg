<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" font-family="system-ui, sans-serif">
  <title>The architecture of a testable program: a pure core in the middle holding the logic, surrounded by the five boundaries that make tests slow, flaky or non-deterministic — the clock, the network, the filesystem, randomness, and the environment and other processes — each one arriving as a parameter, with a hand-written test double attached where the arrow enters the core</title>
  <rect x="0" y="0" width="900" height="640" fill="#f8fafc"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The core and its boundaries — where a test double attaches</text>

  <!-- The world -->
  <rect x="28" y="58" width="844" height="512" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="14"/>
  <text x="450" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">The world — slow, unreliable, different every time, sometimes metered</text>

  <!-- Top row: clock, network, filesystem -->
  <rect x="52" y="100" width="252" height="118" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="178" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">The clock</text>
  <text x="178" y="150" text-anchor="middle" font-size="14" fill="#1a202c">datetime.date.today()</text>
  <text x="178" y="172" text-anchor="middle" font-size="14" fill="#1a202c">makes a test non-deterministic</text>
  <text x="178" y="198" text-anchor="middle" font-size="14" fill="#1d4ed8">inject clock() · stub: frozen_clock</text>

  <rect x="324" y="100" width="252" height="118" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="450" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">The network</text>
  <text x="450" y="150" text-anchor="middle" font-size="14" fill="#1a202c">client.fetch_readings(...)</text>
  <text x="450" y="172" text-anchor="middle" font-size="14" fill="#1a202c">slow, flaky, sometimes billed</text>
  <text x="450" y="198" text-anchor="middle" font-size="14" fill="#1d4ed8">inject client · fake: FakeSensorClient</text>

  <rect x="596" y="100" width="252" height="118" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="722" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">The filesystem</text>
  <text x="722" y="150" text-anchor="middle" font-size="14" fill="#1a202c">Path(...).write_text(...)</text>
  <text x="722" y="172" text-anchor="middle" font-size="14" fill="#1a202c">shared, stateful, order-dependent</text>
  <text x="722" y="198" text-anchor="middle" font-size="14" fill="#1d4ed8">return a value · an adapter writes it</text>

  <!-- Core -->
  <rect x="268" y="262" width="364" height="152" fill="#ffffff" stroke="#1a202c" stroke-width="3" rx="10"/>
  <text x="450" y="290" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">Pure core — report_v2.py</text>
  <text x="450" y="316" text-anchor="middle" font-size="14" fill="#1d4ed8">summarise() · build_report() · DailyReport</text>
  <text x="450" y="340" text-anchor="middle" font-size="14" fill="#1a202c">imports datetime and dataclasses</text>
  <text x="450" y="362" text-anchor="middle" font-size="14" fill="#1a202c">every boundary arrives as a parameter</text>
  <text x="450" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">testable from an empty directory</text>

  <!-- Bottom row: randomness, environment -->
  <rect x="120" y="446" width="252" height="106" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="246" y="472" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Randomness</text>
  <text x="246" y="496" text-anchor="middle" font-size="14" fill="#1a202c">random.random() · uuid4()</text>
  <text x="246" y="522" text-anchor="middle" font-size="14" fill="#1d4ed8">inject the generator, or seed it</text>

  <rect x="528" y="446" width="252" height="106" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="654" y="472" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Environment and processes</text>
  <text x="654" y="496" text-anchor="middle" font-size="14" fill="#1a202c">os.environ · subprocess · sleep</text>
  <text x="654" y="522" text-anchor="middle" font-size="14" fill="#1d4ed8">pass the value in · monkeypatch at the edge</text>

  <!-- Arrows inward -->
  <line x1="178" y1="220" x2="300" y2="258" stroke="#1a202c" stroke-width="2"/>
  <polygon points="303,260 288,257 293,246" fill="#1a202c"/>
  <line x1="450" y1="220" x2="450" y2="258" stroke="#1a202c" stroke-width="2"/>
  <polygon points="450,261 444,247 456,247" fill="#1a202c"/>
  <line x1="722" y1="220" x2="600" y2="258" stroke="#1a202c" stroke-width="2"/>
  <polygon points="597,260 607,246 612,257" fill="#1a202c"/>
  <line x1="246" y1="444" x2="330" y2="418" stroke="#1a202c" stroke-width="2"/>
  <polygon points="333,417 320,425 317,413" fill="#1a202c"/>
  <line x1="654" y1="444" x2="570" y2="418" stroke="#1a202c" stroke-width="2"/>
  <polygon points="567,417 583,413 580,425" fill="#1a202c"/>

  <!-- Legend -->
  <text x="450" y="592" text-anchor="middle" font-size="15" fill="#1a202c">Each arrow is a value passed in. The test attaches its double at the arrow head — no patching required.</text>
  <text x="450" y="616" text-anchor="middle" font-size="15" fill="#1d4ed8">Hard-code a boundary instead, and the only way in is patch() — which aims at a string nothing checks until it runs.</text>
</svg>
