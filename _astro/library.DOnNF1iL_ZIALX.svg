<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two different educations.">
  <title>Reading the library, or being taught</title>
  <style>
    .library-bg   { fill: #f8fafc; }
    .library-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .library-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .library-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .library-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .library-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .library-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .library-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .library-row { opacity: 1; }
    .library-r0 { animation-delay: 0.00s; }
    .library-r1 { animation-delay: 0.45s; }
    .library-r2 { animation-delay: 0.90s; }
    .library-r3 { animation-delay: 1.35s; }
    .library-r4 { animation-delay: 1.80s; }
    .library-row { animation: library-reveal 7.3s ease-in-out infinite; }
    @keyframes library-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="library-bg" width="980" height="390"/>
  <text class="library-h1"  x="30" y="40">Reading the library, or being taught</text>
  <text class="library-sub" x="30" y="64">Two different educations.</text>
  <rect class="library-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="library-name" x="46" y="122">Reading everything</text>
  <text class="library-desc" x="46" y="142">Broad, and undirected.</text>
  <text class="library-desc library-row library-r0" x="46" y="182">Enormous accumulated knowledge</text>
  <text class="library-desc library-row library-r1" x="46" y="216">No sense of what is wanted</text>
  <text class="library-desc library-row library-r2" x="46" y="250">Absorbs the good and the bad alike</text>
  <text class="library-desc library-row library-r3" x="46" y="284">Cannot be asked a question usefully</text>
  <text class="library-desc library-row library-r4" x="46" y="318">This is pretraining</text>
  <rect class="library-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="library-name" x="526" y="122">Being taught</text>
  <text class="library-desc" x="526" y="142">Narrow, and directed.</text>
  <text class="library-desc library-row library-r0" x="526" y="182">Far less material</text>
  <text class="library-desc library-row library-r1" x="526" y="216">But shaped toward answering</text>
  <text class="library-desc library-row library-r2" x="526" y="250">Corrected when wrong</text>
  <text class="library-desc library-row library-r3" x="526" y="284">Learns what a question expects</text>
  <text class="library-desc library-row library-r4" x="526" y="318">This is what comes next</text>
  <text class="library-sub" x="30" y="372">The order is not reversible, which is the useful part of the analogy: instruction only works on someone who has already read widely, and the same is true of these models.</text>
</svg>
