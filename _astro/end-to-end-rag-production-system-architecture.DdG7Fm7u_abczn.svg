<svg role="img" aria-label="End to end RAG production system architecture diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>Production End-to-End RAG Architecture</title>
  <defs>
    <linearGradient id="bg266a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card266" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg266a)" rx="12"/>
  <text x="425" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">PRODUCTION END-TO-END RAG ARCHITECTURE</text>
  <text x="425" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Unified Ingestion, Hybrid Retrieval, Prompt Synthesis, Generation &amp; Evaluation</text>
  <g transform="translate(35, 75)">
    <rect width="780" height="325" fill="url(#card266)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Left Lane: Ingestion Pipeline -->
    <rect x="20" y="20" width="160" height="285" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="100" y="45" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">INGESTION</text>
    <rect x="30" y="65" width="140" height="40" fill="#1e293b" rx="4"/>
    <text x="100" y="88" fill="#cbd5e1" font-size="7.5" text-anchor="middle">Document Parser</text>
    <rect x="30" y="115" width="140" height="40" fill="#1e293b" rx="4"/>
    <text x="100" y="138" fill="#cbd5e1" font-size="7.5" text-anchor="middle">Structure Chunker</text>
    <rect x="30" y="165" width="140" height="40" fill="#1e293b" rx="4"/>
    <text x="100" y="188" fill="#cbd5e1" font-size="7.5" text-anchor="middle">Vector &amp; BM25 Index</text>
    <rect x="30" y="215" width="140" height="70" fill="#0f172a" stroke="#38bdf8" rx="4"/>
    <text x="100" y="240" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">Qdrant Vector DB</text>
    <text x="100" y="255" fill="#cbd5e1" font-size="7" text-anchor="middle">HNSW + Payload Index</text>

    <!-- Mid-Left: Hybrid Retrieval & Rerank -->
    <rect x="205" y="20" width="175" height="285" fill="#0f172a" stroke="#fbbf24" rx="6"/>
    <text x="292" y="45" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">RETRIEVAL &amp; FUSION</text>
    <rect x="215" y="65" width="155" height="50" fill="#1e293b" rx="4"/>
    <text x="292" y="87" fill="#cbd5e1" font-size="7.5" text-anchor="middle">Parallel Search</text>
    <text x="292" y="100" fill="#fbbf24" font-size="7" text-anchor="middle">BM25 + Dense Vectors</text>
    <rect x="215" y="125" width="155" height="45" fill="#1e293b" rx="4"/>
    <text x="292" y="147" fill="#cbd5e1" font-size="7.5" text-anchor="middle">RRF Rank Fusion</text>
    <text x="292" y="160" fill="#fbbf24" font-size="7" text-anchor="middle">Deduplicate Top-40</text>
    <rect x="215" y="180" width="155" height="105" fill="#0f172a" stroke="#fbbf24" rx="4"/>
    <text x="292" y="205" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">Cross-Encoder Re-Rank</text>
    <text x="292" y="222" fill="#cbd5e1" font-size="7" text-anchor="middle">BGE-Reranker-Large</text>
    <text x="292" y="240" fill="#34d399" font-size="7.5" font-weight="700" text-anchor="middle">Top-5 Precision Passages</text>
    <text x="292" y="258" fill="#94a3b8" font-size="6.5" text-anchor="middle">Score &gt; 0.35 threshold</text>

    <!-- Mid-Right: Prompt Synthesis & LLM -->
    <rect x="405" y="20" width="180" height="285" fill="#0f172a" stroke="#34d399" rx="6"/>
    <text x="495" y="45" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">GENERATION</text>
    <rect x="415" y="65" width="160" height="50" fill="#1e293b" rx="4"/>
    <text x="495" y="87" fill="#cbd5e1" font-size="7.5" text-anchor="middle">Context Synthesis</text>
    <text x="495" y="100" fill="#34d399" font-size="7" text-anchor="middle">Source Citation Tags [1..N]</text>
    <rect x="415" y="125" width="160" height="50" fill="#1e293b" rx="4"/>
    <text x="495" y="147" fill="#cbd5e1" font-size="7.5" text-anchor="middle">System Prompt</text>
    <text x="495" y="160" fill="#34d399" font-size="7" text-anchor="middle">Strict Grounding Instructions</text>
    <rect x="415" y="185" width="160" height="100" fill="#0f172a" stroke="#34d399" rx="4"/>
    <text x="495" y="210" fill="#34d399" font-size="8.5" font-weight="700" text-anchor="middle">LLM Generator</text>
    <text x="495" y="228" fill="#cbd5e1" font-size="7" text-anchor="middle">Claude 3.7 / GPT-4o</text>
    <text x="495" y="246" fill="#34d399" font-size="7" text-anchor="middle">Streaming Token Yield</text>
    <text x="495" y="264" fill="#94a3b8" font-size="6.5" text-anchor="middle">Grounded Answer + Citations</text>

    <!-- Right: Evaluation & Observability -->
    <rect x="610" y="20" width="150" height="285" fill="#0f172a" stroke="#a78bfa" rx="6"/>
    <text x="685" y="45" fill="#a78bfa" font-size="10.5" font-weight="700" text-anchor="middle">OBSERVABILITY</text>
    <rect x="620" y="65" width="130" height="60" fill="#1e293b" rx="4"/>
    <text x="685" y="88" fill="#cbd5e1" font-size="7.5" text-anchor="middle">OpenTelemetry Traces</text>
    <text x="685" y="102" fill="#a78bfa" font-size="7" text-anchor="middle">Span Timings (18ms)</text>
    <rect x="620" y="135" width="130" height="70" fill="#1e293b" rx="4"/>
    <text x="685" y="158" fill="#cbd5e1" font-size="7.5" text-anchor="middle">RAG Triad Evals</text>
    <text x="685" y="172" fill="#34d399" font-size="7" text-anchor="middle">Faithfulness: 0.98</text>
    <text x="685" y="186" fill="#38bdf8" font-size="7" text-anchor="middle">Relevance: 0.95</text>
    <rect x="620" y="215" width="130" height="70" fill="#0f172a" stroke="#a78bfa" rx="4"/>
    <text x="685" y="240" fill="#a78bfa" font-size="8" font-weight="700" text-anchor="middle">Audit Logs</text>
    <text x="685" y="255" fill="#cbd5e1" font-size="7" text-anchor="middle">User Query + Tokens</text>
  </g>
</svg>
