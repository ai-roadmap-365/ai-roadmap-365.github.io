<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By what is available.">
  <title>What to monitor when</title>
  <style>
    .monitoring-when-bg   { fill: #f8fafc; }
    .monitoring-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .monitoring-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .monitoring-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .monitoring-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .monitoring-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .monitoring-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .monitoring-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .monitoring-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .monitoring-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .monitoring-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .monitoring-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .monitoring-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .monitoring-when-row { opacity: 1; }
    .monitoring-when-r0 { animation-delay: 0.00s; }
    .monitoring-when-r1 { animation-delay: 0.45s; }
    .monitoring-when-r2 { animation-delay: 0.90s; }
    .monitoring-when-r3 { animation-delay: 1.35s; }
    .monitoring-when-r4 { animation-delay: 1.80s; }
    .monitoring-when-row { animation: monitoring-when-reveal 7.3s ease-in-out infinite; }
    @keyframes monitoring-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="monitoring-when-bg" width="980" height="390"/>
  <text class="monitoring-when-h1"  x="30" y="40">What to monitor when</text>
  <text class="monitoring-when-sub" x="30" y="64">By what is available.</text>
  <rect class="monitoring-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="monitoring-when-name" x="46" y="122">The situation</text>
  <text class="monitoring-when-desc" x="46" y="142">What you have.</text>
  <text class="monitoring-when-desc monitoring-when-row monitoring-when-r0" x="46" y="182">Labels arrive within hours</text>
  <text class="monitoring-when-desc monitoring-when-row monitoring-when-r1" x="46" y="216">Labels arrive after months</text>
  <text class="monitoring-when-desc monitoring-when-row monitoring-when-r2" x="46" y="250">No labels ever</text>
  <text class="monitoring-when-desc monitoring-when-row monitoring-when-r3" x="46" y="284">A model that intervenes in outcomes</text>
  <text class="monitoring-when-desc monitoring-when-row monitoring-when-r4" x="46" y="318">Highly seasonal inputs</text>
  <rect class="monitoring-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="monitoring-when-name" x="526" y="122">The monitoring</text>
  <text class="monitoring-when-desc" x="526" y="142">What to use.</text>
  <text class="monitoring-when-desc monitoring-when-row monitoring-when-r0" x="526" y="182">Outcome metrics directly</text>
  <text class="monitoring-when-desc monitoring-when-row monitoring-when-r1" x="526" y="216">Input and prediction drift as leading indicators</text>
  <text class="monitoring-when-desc monitoring-when-row monitoring-when-r2" x="526" y="250">Drift only, plus business proxies</text>
  <text class="monitoring-when-desc monitoring-when-row monitoring-when-r3" x="526" y="284">Hold out a control group</text>
  <text class="monitoring-when-desc monitoring-when-row monitoring-when-r4" x="526" y="318">Compare against the same period last year</text>
  <text class="monitoring-when-sub" x="30" y="372">Holding out a control group is the only reliable way to evaluate a model that changes the outcomes it predicts, and it has to be designed in before launch.</text>
</svg>
