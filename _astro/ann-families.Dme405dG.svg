<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One question, three answers.">
  <title>Three ways to skip vectors</title>
  <style>
    .ann-families-bg   { fill: #f8fafc; }
    .ann-families-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ann-families-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ann-families-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ann-families-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ann-families-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ann-families-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ann-families-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ann-families-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ann-families-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ann-families-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ann-families-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ann-families-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .ann-families-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .ann-families-stage { opacity: 1; }

    .ann-families-s0 { animation-delay: 0.00s; }
    .ann-families-e0 { animation-delay: 0.00s; }
    .ann-families-s1 { animation-delay: 1.50s; }
    .ann-families-e1 { animation-delay: 1.50s; }
    .ann-families-s2 { animation-delay: 3.00s; }
    .ann-families-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .ann-families-conn  { animation: ann-families-trace 6s ease-in-out infinite; }
      .ann-families-stage { animation: ann-families-arrive 6s ease-in-out infinite; }
    }
    @keyframes ann-families-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes ann-families-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .ann-families-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ann-families-stage { animation: ann-families-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes ann-families-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ann-families-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="ann-families-bg" width="980" height="322"/>
  <text class="ann-families-h1"  x="30" y="40">Three ways to skip vectors</text>
  <text class="ann-families-sub" x="30" y="64">One question, three answers.</text>
  <g class="ann-families-stage ann-families-s0">
    <rect class="ann-families-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="ann-families-step" x="44" y="142">01</text>
    <text class="ann-families-name" x="70" y="142">Partition the space</text>
    <text class="ann-families-desc" x="44" y="166">Cluster into lists; search the nearest few.</text>
    <text class="ann-families-desc" x="44" y="182">This is IVF.</text>
    <text class="ann-families-edge" x="44" y="242">nprobe</text>
  </g>
  <line class="ann-families-line ann-families-conn ann-families-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#ann-families-tip)"/>
  <g class="ann-families-stage ann-families-s1">
    <rect class="ann-families-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="ann-families-step" x="359" y="142">02</text>
    <text class="ann-families-name" x="385" y="142">Build a neighbour graph</text>
    <text class="ann-families-desc" x="359" y="166">Walk it greedily toward the query. This is</text>
    <text class="ann-families-desc" x="359" y="182">HNSW, and it dominates in practice.</text>
    <text class="ann-families-edge" x="359" y="242">efSearch</text>
  </g>
  <line class="ann-families-line ann-families-conn ann-families-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#ann-families-tip)"/>
  <g class="ann-families-stage ann-families-s2">
    <rect class="ann-families-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="ann-families-step" x="674" y="142">03</text>
    <text class="ann-families-name" x="700" y="142">Compress the vectors</text>
    <text class="ann-families-desc" x="674" y="166">More fit in cache, each comparison cheaper.</text>
    <text class="ann-families-desc" x="674" y="182">Composes with both.</text>
    <text class="ann-families-edge" x="674" y="242">quantisation</text>
  </g>
  <text class="ann-families-sub" x="30" y="304">They share a single tuning knob under different names — search more, get better recall, pay more — which is why understanding one of them transfers directly to the others.</text>
</svg>
