<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Which can be changed.">
  <title>Built from parts, or grown from a mould</title>
  <style>
    .parts-assembly-bg   { fill: #f8fafc; }
    .parts-assembly-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parts-assembly-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parts-assembly-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parts-assembly-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parts-assembly-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parts-assembly-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .parts-assembly-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .parts-assembly-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .parts-assembly-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .parts-assembly-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .parts-assembly-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .parts-assembly-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .parts-assembly-row { opacity: 1; }
    .parts-assembly-r0 { animation-delay: 0.00s; }
    .parts-assembly-r1 { animation-delay: 0.45s; }
    .parts-assembly-r2 { animation-delay: 0.90s; }
    .parts-assembly-r3 { animation-delay: 1.35s; }
    .parts-assembly-r4 { animation-delay: 1.80s; }
    .parts-assembly-row { animation: parts-assembly-reveal 7.3s ease-in-out infinite; }
    @keyframes parts-assembly-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="parts-assembly-bg" width="980" height="390"/>
  <text class="parts-assembly-h1"  x="30" y="40">Built from parts, or grown from a mould</text>
  <text class="parts-assembly-sub" x="30" y="64">Which can be changed.</text>
  <rect class="parts-assembly-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="parts-assembly-name" x="46" y="122">Cast from a mould</text>
  <text class="parts-assembly-desc" x="46" y="142">Shape inherited whole.</text>
  <text class="parts-assembly-desc parts-assembly-row parts-assembly-r0" x="46" y="182">Takes the mould's entire shape</text>
  <text class="parts-assembly-desc parts-assembly-row parts-assembly-r1" x="46" y="216">Cannot decline any of it</text>
  <text class="parts-assembly-desc parts-assembly-row parts-assembly-r2" x="46" y="250">Changing the mould changes every cast</text>
  <text class="parts-assembly-desc parts-assembly-row parts-assembly-r3" x="46" y="284">One mould, one lineage</text>
  <text class="parts-assembly-desc parts-assembly-row parts-assembly-r4" x="46" y="318">This is inheritance</text>
  <rect class="parts-assembly-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="parts-assembly-name" x="526" y="122">Assembled from parts</text>
  <text class="parts-assembly-desc" x="526" y="142">Each chosen.</text>
  <text class="parts-assembly-desc parts-assembly-row parts-assembly-r0" x="526" y="182">Only the parts you selected</text>
  <text class="parts-assembly-desc parts-assembly-row parts-assembly-r1" x="526" y="216">Each can be a different make</text>
  <text class="parts-assembly-desc parts-assembly-row parts-assembly-r2" x="526" y="250">Swapping a part changes one unit</text>
  <text class="parts-assembly-desc parts-assembly-row parts-assembly-r3" x="526" y="284">Parts from anywhere</text>
  <text class="parts-assembly-desc parts-assembly-row parts-assembly-r4" x="526" y="318">This is composition</text>
  <text class="parts-assembly-sub" x="30" y="372">Swapping a part in one unit without affecting the others is exactly what makes composed designs testable and inherited ones awkward.</text>
</svg>
