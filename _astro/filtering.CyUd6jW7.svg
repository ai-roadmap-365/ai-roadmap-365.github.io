<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which is harder than it looks.">
  <title>Filtering with an approximate index</title>
  <style>
    .filtering-bg   { fill: #f8fafc; }
    .filtering-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .filtering-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .filtering-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .filtering-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .filtering-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .filtering-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .filtering-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .filtering-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .filtering-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .filtering-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .filtering-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .filtering-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .filtering-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .filtering-stage { opacity: 1; }

    .filtering-s0 { animation-delay: 0.00s; }
    .filtering-e0 { animation-delay: 0.00s; }
    .filtering-s1 { animation-delay: 1.28s; }
    .filtering-e1 { animation-delay: 1.28s; }
    .filtering-s2 { animation-delay: 2.56s; }
    .filtering-e2 { animation-delay: 2.56s; }
    .filtering-s3 { animation-delay: 3.84s; }
    .filtering-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .filtering-conn  { animation: filtering-trace 6.4s ease-in-out infinite; }
      .filtering-stage { animation: filtering-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes filtering-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes filtering-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .filtering-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .filtering-stage { animation: filtering-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes filtering-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="filtering-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="filtering-bg" width="980" height="322"/>
  <text class="filtering-h1"  x="30" y="40">Filtering with an approximate index</text>
  <text class="filtering-sub" x="30" y="64">Which is harder than it looks.</text>
  <g class="filtering-stage filtering-s0">
    <rect class="filtering-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="filtering-step" x="44" y="142">01</text>
    <text class="filtering-name" x="70" y="142">Search first, then filter the results</text>
    <text class="filtering-desc" x="44" y="166">Simple, and returns too few when</text>
    <text class="filtering-desc" x="44" y="182">the filter is selective.</text>
  </g>
  <line class="filtering-line filtering-conn filtering-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#filtering-tip)"/>
  <g class="filtering-stage filtering-s1">
    <rect class="filtering-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="filtering-step" x="280" y="142">02</text>
    <text class="filtering-name" x="306" y="142">Because the nearest hundred may all be excluded</text>
    <text class="filtering-desc" x="280" y="166">Leaving nothing, with matching</text>
    <text class="filtering-desc" x="280" y="182">documents elsewhere.</text>
  </g>
  <line class="filtering-line filtering-conn filtering-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#filtering-tip)"/>
  <g class="filtering-stage filtering-s2">
    <rect class="filtering-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="filtering-step" x="516" y="142">03</text>
    <text class="filtering-name" x="542" y="142">Filter first, then search the subset</text>
    <text class="filtering-desc" x="516" y="166">Correct, and slow when the</text>
    <text class="filtering-desc" x="516" y="182">subset is large.</text>
  </g>
  <line class="filtering-line filtering-conn filtering-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#filtering-tip)"/>
  <g class="filtering-stage filtering-s3">
    <rect class="filtering-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="filtering-step" x="752" y="142">04</text>
    <text class="filtering-name" x="778" y="142">Or apply the filter during graph traversal</text>
    <text class="filtering-desc" x="752" y="166">Which is what a good</text>
    <text class="filtering-desc" x="752" y="182">implementation does.</text>
  </g>
  <text class="filtering-sub" x="30" y="304">An empty result set from a selective filter is one of the most confusing failures in these systems, and it is entirely explained by post-filtering an approximate result.</text>
</svg>
