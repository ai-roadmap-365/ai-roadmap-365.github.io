<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="Gradient Boosting Architecture Diagram">
  <title>Gradient Boosting Additive Pipeline</title>
  <defs>
    <style>
      .d164a-bg { fill: #f8fafc; }
      .d164a-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 6; }
      .d164a-header { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; }
      .d164a-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
      .d164a-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .d164a-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 11px; font-weight: 600; }
      .d164a-arrow { stroke: #2563eb; stroke-width: 2; marker-end: url(#d164a-arr); fill: none; }
      .d164a-step-box { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; rx: 6; }
      .d164a-res-box { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.5; rx: 4; }
    </style>
    <marker id="d164a-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="d164a-bg" />

  <text x="40" y="45" class="d164a-header" font-size="22">Gradient Boosting: Sequential Additive Pipeline</text>
  <text x="40" y="70" class="d164a-text">Functional Gradient Descent: F_M(x) = F_0(x) + η · h_1(x) + η · h_2(x) + ... + η · h_M(x)</text>

  <!-- Step 0: Initial Constant -->
  <rect x="40" y="120" width="160" height="90" class="d164a-box" fill="#f1f5f9" />
  <text x="55" y="145" class="d164a-title">Step 0: Base F₀</text>
  <text x="55" y="170" class="d164a-math">F₀(x) = argmin γ</text>
  <text x="55" y="190" class="d164a-text" font-size="11" fill="#64748b">F₀ = log(p / (1-p))</text>

  <!-- Arrow to Tree 1 -->
  <path d="M 200 165 L 260 165" class="d164a-arrow" />

  <!-- Residual 1 Box -->
  <rect x="260" y="100" width="170" height="45" class="d164a-res-box" />
  <text x="275" y="120" class="d164a-title" font-size="11" fill="#991b1b">Pseudo-Residuals r₁</text>
  <text x="275" y="137" class="d164a-math" fill="#b91c1c">r₁ = y - σ(F₀(x))</text>

  <!-- Tree 1 Box -->
  <rect x="260" y="155" width="170" height="85" class="d164a-step-box" />
  <text x="275" y="180" class="d164a-title" fill="#1d4ed8">Tree h₁(x) (Depth 3)</text>
  <text x="275" y="200" class="d164a-math">Fit on r₁</text>
  <text x="275" y="220" class="d164a-text" font-size="11" fill="#1e40af">Update: + η · h₁(x)</text>

  <!-- Arrow to Tree 2 -->
  <path d="M 430 195 L 490 195" class="d164a-arrow" />

  <!-- Residual 2 Box -->
  <rect x="490" y="100" width="170" height="45" class="d164a-res-box" />
  <text x="505" y="120" class="d164a-title" font-size="11" fill="#991b1b">Pseudo-Residuals r₂</text>
  <text x="505" y="137" class="d164a-math" fill="#b91c1c">r₂ = y - σ(F₀ + η·h₁)</text>

  <!-- Tree 2 Box -->
  <rect x="490" y="155" width="170" height="85" class="d164a-step-box" />
  <text x="505" y="180" class="d164a-title" fill="#1d4ed8">Tree h₂(x) (Depth 3)</text>
  <text x="505" y="200" class="d164a-math">Fit on r₂</text>
  <text x="505" y="220" class="d164a-text" font-size="11" fill="#1e40af">Update: + η · h₂(x)</text>

  <!-- Arrow to Tree M -->
  <path d="M 660 195 L 720 195" class="d164a-arrow" stroke-dasharray="3 2" />

  <!-- Final Ensemble Box -->
  <rect x="720" y="120" width="140" height="120" class="d164a-box" fill="#f0fdf4" stroke="#22c55e" />
  <text x="735" y="150" class="d164a-title" fill="#15803d">Final Model F_M</text>
  <text x="735" y="175" class="d164a-math" fill="#166534">F_M = F₀ + ∑ η·h_m</text>
  <text x="735" y="200" class="d164a-text" font-size="11" fill="#15803d">Probability:</text>
  <text x="735" y="220" class="d164a-math" fill="#15803d">p = σ(F_M(x))</text>

  <!-- Bottom Explanatory Card -->
  <rect x="40" y="270" width="820" height="170" class="d164a-box" />
  <text x="60" y="300" class="d164a-title" font-size="14" fill="#1e40af">Key Gradient Boosting Invariants</text>
  
  <text x="60" y="330" class="d164a-text">• <tspan font-weight="700">Sequential Nature:</tspan> Tree m cannot be trained until Tree m-1 produces predictions and new residuals.</text>
  <text x="60" y="360" class="d164a-text">• <tspan font-weight="700">Shrinkage Regularization (η):</tspan> Scales each tree by η ∈ (0.01, 0.1]. Smaller η + larger M yields superior generalization.</text>
  <text x="60" y="390" class="d164a-text">• <tspan font-weight="700">Newton-Raphson Leaf Updates:</tspan> Leaf value γ_j = ∑ r_i / ( ∑ p_i(1-p_i) + ε ) optimizes log-odds steps in each terminal node.</text>
  <text x="60" y="420" class="d164a-text">• <tspan font-weight="700">Overfitting Vulnerability:</tspan> Excessively large M will memorize training noise; validation early stopping is mandatory.</text>
</svg>
