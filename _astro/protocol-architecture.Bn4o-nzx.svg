<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="d154a-title d154a-desc" width="1200" height="660">
  <title id="d154a-title">The eight-stage protocol for one regression project, with the number each stage actually produced</title>
  <desc id="d154a-desc">Eight boxes in reading order, left to right then wrapping to a second row: frame the problem, noting the target has no physical unit; state a mean-predictor baseline of 70.4637 RMSE; split 442 rows into 331 train and 111 test; sweep 23 candidate pipelines; cross-validate on train rows only and select Lasso with alpha equal to 1 at a cross-validated RMSE of 53.8958; evaluate the test set exactly once through a gate, scoring 56.5566 RMSE; read the residual diagnostics, finding a mild heteroscedasticity signal of 0.2386, a weak curvature signal of -0.1278, and a Q-Q correlation of 0.9901; and state a verdict of a margin of 13.9071 RMSE points with a 95 percent bootstrap interval from 5.5852 to 22.3324, distinguishable from the baseline. A highlighted panel beneath states that selecting by peeking at the test set was never negative across twenty seeds, averaging a gap of 0.5279 RMSE points in the leak's favour, and that a 95 percent prediction interval achieved a realised coverage of 0.9459.</desc>
  <style>
    .d154a-bg { fill: #f8fafc; }
    .d154a-title { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 23px; font-weight: 700; }
    .d154a-muted { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d154a-box { fill: #ffffff; stroke: #1d4ed8; stroke-width: 2; }
    .d154a-num { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; }
    .d154a-label { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; }
    .d154a-value { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d154a-arrow { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .d154a-note { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 2; }
    .d154a-notehead { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; }
    .d154a-notetext { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14.5px; }
  </style>
  <defs>
    <marker id="d154a-arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="d154a-bg" x="0" y="0" width="1200" height="660"/>

  <text class="d154a-title" x="600" y="34" text-anchor="middle">One regression project, run properly, once</text>
  <text class="d154a-muted" x="600" y="56" text-anchor="middle">Diabetes progression set, 442 rows, the only bundled regression dataset that needs no download</text>

  <!-- Row 1: stages 1-4 -->
  <g>
    <rect class="d154a-box" x="30" y="90" width="255" height="112" rx="8"/>
    <text class="d154a-num" x="48" y="114">1. FRAME</text>
    <text class="d154a-label" x="48" y="136">Progression score,</text>
    <text class="d154a-value" x="48" y="158">no physical unit --</text>
    <text class="d154a-value" x="48" y="176">10 raw-unit features,</text>
    <text class="d154a-value" x="48" y="194">442 rows, RMSE chosen</text>
  </g>

  <path class="d154a-arrow" d="M 285 146 L 315 146" marker-end="url(#d154a-arrowhead)"/>

  <g>
    <rect class="d154a-box" x="315" y="90" width="255" height="112" rx="8"/>
    <text class="d154a-num" x="333" y="114">2. BASELINE</text>
    <text class="d154a-label" x="333" y="136">Mean prediction, no model</text>
    <text class="d154a-value" x="333" y="158">test RMSE = 70.4637</text>
    <text class="d154a-value" x="333" y="180">every later result must</text>
    <text class="d154a-value" x="333" y="198">clear this to matter</text>
  </g>

  <path class="d154a-arrow" d="M 570 146 L 600 146" marker-end="url(#d154a-arrowhead)"/>

  <g>
    <rect class="d154a-box" x="600" y="90" width="255" height="112" rx="8"/>
    <text class="d154a-num" x="618" y="114">3. SPLIT</text>
    <text class="d154a-label" x="618" y="136">Held back, one look later</text>
    <text class="d154a-value" x="618" y="158">331 train / 111 test</text>
    <text class="d154a-value" x="618" y="180">test rows untouched</text>
    <text class="d154a-value" x="618" y="198">until stage 5</text>
  </g>

  <path class="d154a-arrow" d="M 855 146 L 885 146" marker-end="url(#d154a-arrowhead)"/>

  <g>
    <rect class="d154a-box" x="885" y="90" width="285" height="112" rx="8"/>
    <text class="d154a-num" x="903" y="114">4. SWEEP</text>
    <text class="d154a-label" x="903" y="136">23 candidate pipelines</text>
    <text class="d154a-value" x="903" y="158">11 ridge, 11 lasso,</text>
    <text class="d154a-value" x="903" y="176">1 plain OLS -- K counted</text>
    <text class="d154a-value" x="903" y="194">explicitly, before selecting</text>
  </g>

  <!-- wrap arrow from stage 4 down to stage 5 -->
  <path class="d154a-arrow" d="M 1027 202 L 1027 232 L 1027 232" marker-end="url(#d154a-arrowhead)"/>
  <path class="d154a-arrow" d="M 1027 232 L 855 232 L 855 262" marker-end="url(#d154a-arrowhead)"/>

  <!-- Row 2: stages 5-8 -->
  <g>
    <rect class="d154a-box" x="600" y="262" width="285" height="112" rx="8"/>
    <text class="d154a-num" x="618" y="286">5. CROSS-VALIDATE, SELECT</text>
    <text class="d154a-label" x="618" y="308">5-fold RMSE, train only</text>
    <text class="d154a-value" x="618" y="330">winner: Lasso (alpha=1),</text>
    <text class="d154a-value" x="618" y="348">cv RMSE 53.8958</text>
    <text class="d154a-value" x="618" y="366">test rows never touched</text>
  </g>

  <path class="d154a-arrow" d="M 600 318 L 570 318" marker-end="url(#d154a-arrowhead)"/>

  <g>
    <rect class="d154a-box" x="315" y="262" width="255" height="112" rx="8"/>
    <text class="d154a-num" x="333" y="286">6. ONE TEST EVAL</text>
    <text class="d154a-label" x="333" y="308">GatedTestSet, one look</text>
    <text class="d154a-value" x="333" y="330">test RMSE = 56.5566</text>
    <text class="d154a-value" x="333" y="348">a second look raises</text>
    <text class="d154a-value" x="333" y="366">TestSetTouchedTwice</text>
  </g>

  <path class="d154a-arrow" d="M 315 318 L 285 318" marker-end="url(#d154a-arrowhead)"/>

  <g>
    <rect class="d154a-box" x="30" y="262" width="255" height="112" rx="8"/>
    <text class="d154a-num" x="48" y="286">7. RESIDUAL DIAGNOSTICS</text>
    <text class="d154a-label" x="48" y="308">Fitted, curve, normality</text>
    <text class="d154a-value" x="48" y="330">heterosced. 0.2386, curve</text>
    <text class="d154a-value" x="48" y="348">-0.1278, Q-Q corr 0.9901</text>
    <text class="d154a-value" x="48" y="366">worst residual -157.3</text>
  </g>

  <!-- wrap arrow down to stage 8, centered below -->
  <path class="d154a-arrow" d="M 157 374 L 157 404 L 600 404 L 600 434" marker-end="url(#d154a-arrowhead)"/>

  <g>
    <rect class="d154a-box" x="450" y="434" width="300" height="112" rx="8"/>
    <text class="d154a-num" x="468" y="458">8. VERDICT, WITH AN INTERVAL</text>
    <text class="d154a-label" x="468" y="480">margin 13.9071, 95 percent</text>
    <text class="d154a-value" x="468" y="502">bootstrap [5.5852, 22.3324]</text>
    <text class="d154a-value" x="468" y="520">distinguishable, clearly,</text>
    <text class="d154a-value" x="468" y="538">not a close call</text>
  </g>

  <rect class="d154a-note" x="30" y="576" width="1140" height="66" rx="8"/>
  <text class="d154a-notehead" x="50" y="600">Two checks beyond the eight stages</text>
  <text class="d154a-notetext" x="50" y="622">Selecting by peeking at the test set never once produced a worse RMSE than selecting honestly, over twenty seeds (mean</text>
  <text class="d154a-notetext" x="50" y="640">gap +0.5279 in the leak's favour). A 95 percent prediction interval, sized from training residuals only, covered 0.9459 of test rows.</text>
</svg>
