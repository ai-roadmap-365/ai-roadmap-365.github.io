<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="Cross-Validation Schemes Diagram">
  <title>Cross-Validation Schemes Taxonomy</title>
  <defs>
    <style>
      .d167a-bg { fill: #f8fafc; }
      .d167a-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 6; }
      .d167a-header { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; }
      .d167a-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
      .d167a-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
      .d167a-train { fill: #3b82f6; rx: 3; }
      .d167a-val { fill: #ef4444; rx: 3; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="d167a-bg" />

  <text x="40" y="45" class="d167a-header" font-size="22">Cross-Validation Partition Strategies</text>
  <text x="40" y="70" class="d167a-text" font-size="13">Blue = Training Split, Red = Validation Split (Unbiased Generalization Test)</text>

  <!-- Scheme 1: Standard K-Fold -->
  <rect x="40" y="100" width="390" height="155" class="d167a-box" />
  <text x="60" y="125" class="d167a-title" fill="#1d4ed8">1. Standard K-Fold (k=4)</text>
  <!-- Fold 1 -->
  <rect x="60" y="140" width="70" height="18" class="d167a-val" /><rect x="135" y="140" width="220" height="18" class="d167a-train" />
  <!-- Fold 2 -->
  <rect x="60" y="165" width="70" height="18" class="d167a-train" /><rect x="135" y="165" width="70" height="18" class="d167a-val" /><rect x="210" y="165" width="145" height="18" class="d167a-train" />
  <!-- Fold 3 -->
  <rect x="60" y="190" width="145" height="18" class="d167a-train" /><rect x="210" y="190" width="70" height="18" class="d167a-val" /><rect x="285" y="190" width="70" height="18" class="d167a-train" />
  <!-- Fold 4 -->
  <rect x="60" y="215" width="220" height="18" class="d167a-train" /><rect x="285" y="215" width="70" height="18" class="d167a-val" />
  <text x="60" y="248" class="d167a-text">Uniform random partitioning for balanced, independent i.i.d. data.</text>

  <!-- Scheme 2: Stratified K-Fold -->
  <rect x="470" y="100" width="390" height="155" class="d167a-box" />
  <text x="490" y="125" class="d167a-title" fill="#15803d">2. Stratified K-Fold (Imbalance-Aware)</text>
  <rect x="490" y="140" width="350" height="20" fill="#f1f5f9" stroke="#cbd5e1" rx="3" />
  <text x="500" y="155" class="d167a-text">Class 0 (80%) + Class 1 (20%) sampled proportionally</text>
  <rect x="490" y="170" width="80" height="18" class="d167a-val" /><rect x="575" y="170" width="265" height="18" class="d167a-train" />
  <rect x="490" y="195" width="265" height="18" class="d167a-train" /><rect x="760" y="195" width="80" height="18" class="d167a-val" />
  <text x="490" y="240" class="d167a-text">Preserves exact class ratio P(y=k) across every fold.</text>

  <!-- Scheme 3: Group K-Fold -->
  <rect x="40" y="280" width="390" height="160" class="d167a-box" />
  <text x="60" y="305" class="d167a-title" fill="#b91c1c">3. Group K-Fold (Entity Isolation)</text>
  <text x="60" y="325" class="d167a-text">Patient A [rows 1-3], Patient B [rows 4-6], Patient C [rows 7-9]</text>
  <rect x="60" y="340" width="100" height="20" class="d167a-val" /><rect x="165" y="340" width="230" height="20" class="d167a-train" />
  <text x="70" y="355" fill="#ffffff" font-size="10" font-weight="700">Patient A (Val)</text>
  <text x="180" y="355" fill="#ffffff" font-size="10" font-weight="700">Patients B &amp; C (Train)</text>
  <text x="60" y="415" class="d167a-text">Guarantees zero group overlap: Train Groups ∩ Val Groups = ∅.</text>

  <!-- Scheme 4: Time Series Split -->
  <rect x="470" y="280" width="390" height="160" class="d167a-box" />
  <text x="490" y="305" class="d167a-title" fill="#c026d3">4. Time-Series (Expanding Window)</text>
  <!-- Split 1 -->
  <rect x="490" y="325" width="120" height="16" class="d167a-train" /><rect x="615" y="325" width="60" height="16" class="d167a-val" />
  <!-- Split 2 -->
  <rect x="490" y="350" width="185" height="16" class="d167a-train" /><rect x="680" y="350" width="60" height="16" class="d167a-val" />
  <!-- Split 3 -->
  <rect x="490" y="375" width="250" height="16" class="d167a-train" /><rect x="745" y="375" width="60" height="16" class="d167a-val" />
  <text x="490" y="415" class="d167a-text">Strict temporal precedence: training always precedes validation.</text>
</svg>
