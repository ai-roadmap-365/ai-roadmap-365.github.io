<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are advantages.">
  <title>Four consequences of trees</title>
  <style>
    .tree-implications-bg   { fill: #f8fafc; }
    .tree-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tree-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tree-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tree-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tree-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tree-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tree-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tree-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tree-implications-stage { opacity: 1; }

    .tree-implications-s0 { animation-delay: 0.00s; }
    .tree-implications-e0 { animation-delay: 0.00s; }
    .tree-implications-s1 { animation-delay: 1.28s; }
    .tree-implications-e1 { animation-delay: 1.28s; }
    .tree-implications-s2 { animation-delay: 2.56s; }
    .tree-implications-e2 { animation-delay: 2.56s; }
    .tree-implications-s3 { animation-delay: 3.84s; }
    .tree-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tree-implications-conn  { animation: tree-implications-trace 6.4s ease-in-out infinite; }
      .tree-implications-stage { animation: tree-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tree-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tree-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tree-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tree-implications-stage { animation: tree-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tree-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tree-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tree-implications-bg" width="980" height="322"/>
  <text class="tree-implications-h1"  x="30" y="40">Four consequences of trees</text>
  <text class="tree-implications-sub" x="30" y="64">Two are advantages.</text>
  <g class="tree-implications-stage tree-implications-s0">
    <rect class="tree-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tree-implications-step" x="44" y="142">01</text>
    <text class="tree-implications-name" x="70" y="142">Predictions are explainable as a path</text>
    <text class="tree-implications-desc" x="44" y="166">Which regulators and users both</text>
    <text class="tree-implications-desc" x="44" y="182">accept.</text>
  </g>
  <line class="tree-implications-line tree-implications-conn tree-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tree-implications-tip)"/>
  <g class="tree-implications-stage tree-implications-s1">
    <rect class="tree-implications-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tree-implications-step" x="280" y="142">02</text>
    <text class="tree-implications-name" x="306" y="142">No scaling, and missing values handled natively</text>
    <text class="tree-implications-desc" x="280" y="166">Which removes preprocessing</text>
    <text class="tree-implications-desc" x="280" y="182">errors.</text>
  </g>
  <line class="tree-implications-line tree-implications-conn tree-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tree-implications-tip)"/>
  <g class="tree-implications-stage tree-implications-s2">
    <rect class="tree-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tree-implications-step" x="516" y="142">03</text>
    <text class="tree-implications-name" x="542" y="142">But small data changes can restructure the tree</text>
    <text class="tree-implications-desc" x="516" y="166">High variance, which is the core</text>
    <text class="tree-implications-desc" x="516" y="182">weakness.</text>
  </g>
  <line class="tree-implications-line tree-implications-conn tree-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tree-implications-tip)"/>
  <g class="tree-implications-stage tree-implications-s3">
    <rect class="tree-implications-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tree-implications-step" x="752" y="142">04</text>
    <text class="tree-implications-name" x="778" y="142">And it predicts a constant outside its training range</text>
    <text class="tree-implications-desc" x="752" y="166">Which surprises people in</text>
    <text class="tree-implications-desc" x="752" y="182">production.</text>
  </g>
  <text class="tree-implications-sub" x="30" y="304">The extrapolation failure is worth stating plainly: a tree trained on prices up to a million will predict the same value for ten million, forever.</text>
</svg>
