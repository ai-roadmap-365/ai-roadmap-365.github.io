<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each contains a different consequence.">
  <title>Five layers, none sufficient alone</title>
  <style>
    .defense-layers-mcp-bg   { fill: #f8fafc; }
    .defense-layers-mcp-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .defense-layers-mcp-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .defense-layers-mcp-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .defense-layers-mcp-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .defense-layers-mcp-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .defense-layers-mcp-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .defense-layers-mcp-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .defense-layers-mcp-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .defense-layers-mcp-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .defense-layers-mcp-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .defense-layers-mcp-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .defense-layers-mcp-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .defense-layers-mcp-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .defense-layers-mcp-stage { opacity: 1; }

    .defense-layers-mcp-s0 { animation-delay: 0.00s; }
    .defense-layers-mcp-e0 { animation-delay: 0.00s; }
    .defense-layers-mcp-s1 { animation-delay: 1.33s; }
    .defense-layers-mcp-e1 { animation-delay: 1.33s; }
    .defense-layers-mcp-s2 { animation-delay: 2.67s; }
    .defense-layers-mcp-e2 { animation-delay: 2.67s; }
    .defense-layers-mcp-s3 { animation-delay: 4.00s; }
    .defense-layers-mcp-e3 { animation-delay: 4.00s; }
    .defense-layers-mcp-s4 { animation-delay: 5.33s; }
    .defense-layers-mcp-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .defense-layers-mcp-conn  { animation: defense-layers-mcp-trace 8s ease-in-out infinite; }
      .defense-layers-mcp-stage { animation: defense-layers-mcp-arrive 8s ease-in-out infinite; }
    }
    @keyframes defense-layers-mcp-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes defense-layers-mcp-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .defense-layers-mcp-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .defense-layers-mcp-stage { animation: defense-layers-mcp-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes defense-layers-mcp-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="defense-layers-mcp-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="defense-layers-mcp-bg" width="980" height="322"/>
  <text class="defense-layers-mcp-h1"  x="30" y="40">Five layers, none sufficient alone</text>
  <text class="defense-layers-mcp-sub" x="30" y="64">Each contains a different consequence.</text>
  <g class="defense-layers-mcp-stage defense-layers-mcp-s0">
    <rect class="defense-layers-mcp-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="defense-layers-mcp-step" x="44" y="142">01</text>
    <text class="defense-layers-mcp-name" x="70" y="142">Validate every parameter</text>
    <text class="defense-layers-mcp-desc" x="44" y="166">Schema first, then</text>
    <text class="defense-layers-mcp-desc" x="44" y="182">semantics. The argument</text>
    <text class="defense-layers-mcp-desc" x="44" y="198">came from a model.</text>
  </g>
  <line class="defense-layers-mcp-line defense-layers-mcp-conn defense-layers-mcp-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#defense-layers-mcp-tip)"/>
  <g class="defense-layers-mcp-stage defense-layers-mcp-s1">
    <rect class="defense-layers-mcp-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="defense-layers-mcp-step" x="233" y="142">02</text>
    <text class="defense-layers-mcp-name" x="259" y="142">Canonicalise every path</text>
    <text class="defense-layers-mcp-desc" x="233" y="166">Resolve, then check it is</text>
    <text class="defense-layers-mcp-desc" x="233" y="182">under an authorised root.</text>
    <text class="defense-layers-mcp-desc" x="233" y="198">Not string matching.</text>
    <text class="defense-layers-mcp-edge" x="233" y="242">commonpath</text>
  </g>
  <line class="defense-layers-mcp-line defense-layers-mcp-conn defense-layers-mcp-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#defense-layers-mcp-tip)"/>
  <g class="defense-layers-mcp-stage defense-layers-mcp-s2">
    <rect class="defense-layers-mcp-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="defense-layers-mcp-step" x="422" y="142">03</text>
    <text class="defense-layers-mcp-name" x="448" y="142">Least privilege per server</text>
    <text class="defense-layers-mcp-desc" x="422" y="166">Read-only where possible;</text>
    <text class="defense-layers-mcp-desc" x="422" y="182">a scoped environment</text>
    <text class="defense-layers-mcp-desc" x="422" y="198">always.</text>
  </g>
  <line class="defense-layers-mcp-line defense-layers-mcp-conn defense-layers-mcp-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#defense-layers-mcp-tip)"/>
  <g class="defense-layers-mcp-stage defense-layers-mcp-s3">
    <rect class="defense-layers-mcp-good" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="defense-layers-mcp-step" x="611" y="142">04</text>
    <text class="defense-layers-mcp-name" x="637" y="142">Human approval for mutations</text>
    <text class="defense-layers-mcp-desc" x="611" y="166">DELETE, UPDATE, DROP,</text>
    <text class="defense-layers-mcp-desc" x="611" y="182">SHELL, and network</text>
    <text class="defense-layers-mcp-desc" x="611" y="198">egress.</text>
    <text class="defense-layers-mcp-edge" x="611" y="242">HITL</text>
  </g>
  <line class="defense-layers-mcp-line defense-layers-mcp-conn defense-layers-mcp-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#defense-layers-mcp-tip)"/>
  <g class="defense-layers-mcp-stage defense-layers-mcp-s4">
    <rect class="defense-layers-mcp-box" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="defense-layers-mcp-step" x="800" y="142">05</text>
    <text class="defense-layers-mcp-name" x="826" y="142">Append-only audit log</text>
    <text class="defense-layers-mcp-desc" x="800" y="166">Call, arguments,</text>
    <text class="defense-layers-mcp-desc" x="800" y="182">duration, verdict. For</text>
    <text class="defense-layers-mcp-desc" x="800" y="198">the post-mortem you will</text>
  </g>
  <text class="defense-layers-mcp-sub" x="30" y="304">The fourth layer is the only one that works against an attack nobody anticipated, which is why it is worth the friction: it does not need to recognise the injection to stop the action.</text>
</svg>
