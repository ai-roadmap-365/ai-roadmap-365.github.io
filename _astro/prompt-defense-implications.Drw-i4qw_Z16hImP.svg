<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And the price is unusually low.">
  <title>Four consequences</title>
  <style>
    .prompt-defense-implications-bg   { fill: #f8fafc; }
    .prompt-defense-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-defense-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-defense-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-defense-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-defense-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-defense-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prompt-defense-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .prompt-defense-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .prompt-defense-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .prompt-defense-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .prompt-defense-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .prompt-defense-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .prompt-defense-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .prompt-defense-implications-stage { opacity: 1; }

    .prompt-defense-implications-s0 { animation-delay: 0.00s; }
    .prompt-defense-implications-e0 { animation-delay: 0.00s; }
    .prompt-defense-implications-s1 { animation-delay: 1.28s; }
    .prompt-defense-implications-e1 { animation-delay: 1.28s; }
    .prompt-defense-implications-s2 { animation-delay: 2.56s; }
    .prompt-defense-implications-e2 { animation-delay: 2.56s; }
    .prompt-defense-implications-s3 { animation-delay: 3.84s; }
    .prompt-defense-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .prompt-defense-implications-conn  { animation: prompt-defense-implications-trace 6.4s ease-in-out infinite; }
      .prompt-defense-implications-stage { animation: prompt-defense-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes prompt-defense-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes prompt-defense-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .prompt-defense-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .prompt-defense-implications-stage { animation: prompt-defense-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes prompt-defense-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="prompt-defense-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="prompt-defense-implications-bg" width="980" height="322"/>
  <text class="prompt-defense-implications-h1"  x="30" y="40">Four consequences</text>
  <text class="prompt-defense-implications-sub" x="30" y="64">And the price is unusually low.</text>
  <g class="prompt-defense-implications-stage prompt-defense-implications-s0">
    <rect class="prompt-defense-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-defense-implications-step" x="44" y="142">01</text>
    <text class="prompt-defense-implications-name" x="70" y="142">Latency is negligible</text>
    <text class="prompt-defense-implications-desc" x="44" y="166">Regex and escaping under a</text>
    <text class="prompt-defense-implications-desc" x="44" y="182">millisecond; the canary check</text>
    <text class="prompt-defense-implications-desc" x="44" y="198">under half of one.</text>
    <text class="prompt-defense-implications-edge" x="44" y="242">~0</text>
  </g>
  <line class="prompt-defense-implications-line prompt-defense-implications-conn prompt-defense-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#prompt-defense-implications-tip)"/>
  <g class="prompt-defense-implications-stage prompt-defense-implications-s1">
    <rect class="prompt-defense-implications-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-defense-implications-step" x="280" y="142">02</text>
    <text class="prompt-defense-implications-name" x="306" y="142">Quarantine is cheap</text>
    <text class="prompt-defense-implications-desc" x="280" y="166">A quantized 2-3B worker extracts</text>
    <text class="prompt-defense-implications-desc" x="280" y="182">documents for cents per</text>
    <text class="prompt-defense-implications-desc" x="280" y="198">thousand.</text>
    <text class="prompt-defense-implications-edge" x="280" y="242">$0.05/1k</text>
  </g>
  <line class="prompt-defense-implications-line prompt-defense-implications-conn prompt-defense-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#prompt-defense-implications-tip)"/>
  <g class="prompt-defense-implications-stage prompt-defense-implications-s2">
    <rect class="prompt-defense-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-defense-implications-step" x="516" y="142">03</text>
    <text class="prompt-defense-implications-name" x="542" y="142">Residual risk remains</text>
    <text class="prompt-defense-implications-desc" x="516" y="166">90% is not 100%. Assume the</text>
    <text class="prompt-defense-implications-desc" x="516" y="182">model may be persuaded.</text>
  </g>
  <line class="prompt-defense-implications-line prompt-defense-implications-conn prompt-defense-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#prompt-defense-implications-tip)"/>
  <g class="prompt-defense-implications-stage prompt-defense-implications-s3">
    <rect class="prompt-defense-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-defense-implications-step" x="752" y="142">04</text>
    <text class="prompt-defense-implications-name" x="778" y="142">So tools stay parameterised</text>
    <text class="prompt-defense-implications-desc" x="752" y="166">Strict schemas, read-only</text>
    <text class="prompt-defense-implications-desc" x="752" y="182">connections, least privilege.</text>
    <text class="prompt-defense-implications-edge" x="752" y="242">the real control</text>
  </g>
  <text class="prompt-defense-implications-sub" x="30" y="304">The cost figures are worth quoting when someone argues the defences are expensive: the entire pipeline costs less latency than a single database round trip and less money than the inference it is protecting.</text>
</svg>
