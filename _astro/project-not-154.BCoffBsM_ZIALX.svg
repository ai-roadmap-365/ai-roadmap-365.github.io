<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things this project is not</title>
  <style>
    .project-not-154-bg   { fill: #f8fafc; }
    .project-not-154-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-not-154-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-not-154-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-not-154-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-not-154-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-not-154-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .project-not-154-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .project-not-154-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .project-not-154-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .project-not-154-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .project-not-154-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .project-not-154-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .project-not-154-row { opacity: 1; }
    .project-not-154-r0 { animation-delay: 0.00s; }
    .project-not-154-r1 { animation-delay: 0.45s; }
    .project-not-154-r2 { animation-delay: 0.90s; }
    .project-not-154-r3 { animation-delay: 1.35s; }
    .project-not-154-r4 { animation-delay: 1.80s; }
    .project-not-154-row { animation: project-not-154-reveal 7.3s ease-in-out infinite; }
    @keyframes project-not-154-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="project-not-154-bg" width="980" height="390"/>
  <text class="project-not-154-h1"  x="30" y="40">Four things this project is not</text>
  <text class="project-not-154-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="project-not-154-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="project-not-154-name" x="46" y="122">The misconception</text>
  <text class="project-not-154-desc" x="46" y="142">Commonly held.</text>
  <text class="project-not-154-desc project-not-154-row project-not-154-r0" x="46" y="182">The lowest error wins</text>
  <text class="project-not-154-desc project-not-154-row project-not-154-r1" x="46" y="216">A margin over baseline is an improvement</text>
  <text class="project-not-154-desc project-not-154-row project-not-154-r2" x="46" y="250">Residual plots are a formality</text>
  <text class="project-not-154-desc project-not-154-row project-not-154-r3" x="46" y="284">A prediction interval is trustworthy as stated</text>
  <text class="project-not-154-desc project-not-154-row project-not-154-r4" x="46" y="318">One test evaluation is excessive caution</text>
  <rect class="project-not-154-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="project-not-154-name" x="526" y="122">What is true</text>
  <text class="project-not-154-desc" x="526" y="142">Actually.</text>
  <text class="project-not-154-desc project-not-154-row project-not-154-r0" x="526" y="182">The defensible verdict wins</text>
  <text class="project-not-154-desc project-not-154-row project-not-154-r1" x="526" y="216">Only if its interval excludes zero</text>
  <text class="project-not-154-desc project-not-154-row project-not-154-r2" x="526" y="250">They are where the diagnosis lives</text>
  <text class="project-not-154-desc project-not-154-row project-not-154-r3" x="526" y="284">Its coverage has to be verified</text>
  <text class="project-not-154-desc project-not-154-row project-not-154-r4" x="526" y="318">Each additional look spends the estimate</text>
  <text class="project-not-154-sub" x="30" y="372">The second row is the one this project is built around: a margin without an interval is not yet evidence of anything.</text>
</svg>
