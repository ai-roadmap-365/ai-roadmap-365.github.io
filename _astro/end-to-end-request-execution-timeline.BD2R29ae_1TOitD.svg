<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="End-to-End Request Execution Timeline">
  <title>End-to-End Request Execution Timeline</title>
  <defs>
    <style>
      .d322b-bg { fill: #f8fafc; }
      .d322b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d322b-t1 { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 6px; }
      .d322b-t2 { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 6px; }
      .d322b-t3 { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 6px; }
      .d322b-t4 { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 6px; }
      .d322b-t5 { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2px; rx: 6px; }
      .d322b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d322b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d322b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d322b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d322b-bg" />
  
  <text x="40" y="40" class="d322a-title">End-to-End Request Execution Timeline</text>
  <text x="40" y="65" class="d322a-subtitle">End-to-End Request Execution Timeline showing Microsecond Auth (2ms), Cache Check (5ms), Pre-Auth Hold (10ms), SSE Streaming Generation (450ms), and Final Settlement (5ms)</text>
  
  <!-- Milestone 1: Auth & Rate Limiting -->
  <rect x="40" y="110" width="820" height="45" class="d322b-t1" />
  <text x="60" y="138" class="d322b-header" fill="#1d4ed8">1. Edge Gateway: JWT Signature &amp; Redis Token Bucket Check (Latency: 2ms)</text>
  
  <!-- Milestone 2: Multi-Tier Cache Check -->
  <rect x="40" y="165" width="820" height="45" class="d322b-t2" />
  <text x="60" y="193" class="d322b-header" fill="#7e22ce">2. Multi-Tier Cache: Exact Hash (1ms) &amp; Semantic Vector Search (8ms) -> Cache Miss</text>
  
  <!-- Milestone 3: Credit Pre-Authorization Hold -->
  <rect x="40" y="220" width="820" height="45" class="d322b-t3" />
  <text x="60" y="248" class="d322b-header" fill="#a16207">3. Billing Engine: Reserve Estimated $0.030 Hold on Tenant Balance (Latency: 5ms)</text>
  
  <!-- Milestone 4: Model Streaming & Failover -->
  <rect x="40" y="275" width="820" height="75" class="d322b-t4" />
  <text x="60" y="300" class="d322b-header" fill="#15803d">4. Model Router: Claude 3.5 Sonnet SSE Token Streaming (Prefill: 180ms, Total: 620ms)</text>
  <text x="60" y="325" class="d322b-text">• Streamed 140 tokens via SSE | Smart Auto-Scroll Active | No Failover Needed</text>
  
  <!-- Milestone 5: Exact Usage Settlement -->
  <rect x="40" y="360" width="820" height="45" class="d322b-t5" />
  <text x="60" y="388" class="d322b-header" fill="#0369a1">5. Settlement: Reconcile $0.0034 Actual Charge, Release $0.030 Hold, Save Cache (3ms)</text>
</svg>