<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Fusion in ten lines</title>
  <style>
    .rrf-code-bg   { fill: #f8fafc; }
    .rrf-code-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rrf-code-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rrf-code-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rrf-code-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rrf-code-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rrf-code-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rrf-code-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rrf-code-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rrf-code-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rrf-code-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rrf-code-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rrf-code-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .rrf-code-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .rrf-code-stage { opacity: 1; }

    .rrf-code-s0 { animation-delay: 0.00s; }
    .rrf-code-e0 { animation-delay: 0.00s; }
    .rrf-code-s1 { animation-delay: 1.28s; }
    .rrf-code-e1 { animation-delay: 1.28s; }
    .rrf-code-s2 { animation-delay: 2.56s; }
    .rrf-code-e2 { animation-delay: 2.56s; }
    .rrf-code-s3 { animation-delay: 3.84s; }
    .rrf-code-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .rrf-code-conn  { animation: rrf-code-trace 6.4s ease-in-out infinite; }
      .rrf-code-stage { animation: rrf-code-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes rrf-code-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes rrf-code-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .rrf-code-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .rrf-code-stage { animation: rrf-code-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes rrf-code-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="rrf-code-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="rrf-code-bg" width="980" height="322"/>
  <text class="rrf-code-h1"  x="30" y="40">Fusion in ten lines</text>
  <text class="rrf-code-sub" x="30" y="64">Four steps.</text>
  <g class="rrf-code-stage rrf-code-s0">
    <rect class="rrf-code-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="rrf-code-step" x="44" y="142">01</text>
    <text class="rrf-code-name" x="70" y="142">Take the two ranked lists</text>
    <text class="rrf-code-desc" x="44" y="166">Lexical and dense, each ordered.</text>
  </g>
  <line class="rrf-code-line rrf-code-conn rrf-code-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#rrf-code-tip)"/>
  <g class="rrf-code-stage rrf-code-s1">
    <rect class="rrf-code-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="rrf-code-step" x="280" y="142">02</text>
    <text class="rrf-code-name" x="306" y="142">Score each document by one over its rank</text>
    <text class="rrf-code-desc" x="280" y="166">Plus a constant, which damps the</text>
    <text class="rrf-code-desc" x="280" y="182">top positions.</text>
  </g>
  <line class="rrf-code-line rrf-code-conn rrf-code-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#rrf-code-tip)"/>
  <g class="rrf-code-stage rrf-code-s2">
    <rect class="rrf-code-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="rrf-code-step" x="516" y="142">03</text>
    <text class="rrf-code-name" x="542" y="142">Sum across both lists</text>
    <text class="rrf-code-desc" x="516" y="166">A document absent from one</text>
    <text class="rrf-code-desc" x="516" y="182">simply contributes nothing</text>
    <text class="rrf-code-desc" x="516" y="198">there.</text>
  </g>
  <line class="rrf-code-line rrf-code-conn rrf-code-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#rrf-code-tip)"/>
  <g class="rrf-code-stage rrf-code-s3">
    <rect class="rrf-code-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="rrf-code-step" x="752" y="142">04</text>
    <text class="rrf-code-name" x="778" y="142">And sort by the total</text>
    <text class="rrf-code-desc" x="752" y="166">Which is the fused ranking.</text>
    <text class="rrf-code-edge" x="752" y="242">no tuning</text>
  </g>
  <text class="rrf-code-sub" x="30" y="304">The damping constant is why the top result of one list does not automatically win: it keeps a document both methods ranked moderately ahead of one method's favourite.</text>
</svg>
