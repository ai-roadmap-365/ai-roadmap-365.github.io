<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each hex digit is exactly four bits, so the translation is mechanical.">
  <title>Hexadecimal exists for humans</title>
  <style>
    .hex-as-shorthand-bg   { fill: #f8fafc; }
    .hex-as-shorthand-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hex-as-shorthand-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hex-as-shorthand-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hex-as-shorthand-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hex-as-shorthand-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hex-as-shorthand-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hex-as-shorthand-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hex-as-shorthand-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hex-as-shorthand-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hex-as-shorthand-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hex-as-shorthand-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hex-as-shorthand-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .hex-as-shorthand-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .hex-as-shorthand-stage { opacity: 1; }

    .hex-as-shorthand-s0 { animation-delay: 0.00s; }
    .hex-as-shorthand-e0 { animation-delay: 0.00s; }
    .hex-as-shorthand-s1 { animation-delay: 1.28s; }
    .hex-as-shorthand-e1 { animation-delay: 1.28s; }
    .hex-as-shorthand-s2 { animation-delay: 2.56s; }
    .hex-as-shorthand-e2 { animation-delay: 2.56s; }
    .hex-as-shorthand-s3 { animation-delay: 3.84s; }
    .hex-as-shorthand-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .hex-as-shorthand-conn  { animation: hex-as-shorthand-trace 6.4s ease-in-out infinite; }
      .hex-as-shorthand-stage { animation: hex-as-shorthand-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes hex-as-shorthand-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes hex-as-shorthand-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .hex-as-shorthand-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .hex-as-shorthand-stage { animation: hex-as-shorthand-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes hex-as-shorthand-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="hex-as-shorthand-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="hex-as-shorthand-bg" width="980" height="322"/>
  <text class="hex-as-shorthand-h1"  x="30" y="40">Hexadecimal exists for humans</text>
  <text class="hex-as-shorthand-sub" x="30" y="64">Each hex digit is exactly four bits, so the translation is mechanical.</text>
  <g class="hex-as-shorthand-stage hex-as-shorthand-s0">
    <rect class="hex-as-shorthand-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="hex-as-shorthand-step" x="44" y="142">01</text>
    <text class="hex-as-shorthand-name" x="70" y="142">One byte</text>
    <text class="hex-as-shorthand-desc" x="44" y="166">10110101. Hard to read, easy to</text>
    <text class="hex-as-shorthand-desc" x="44" y="182">mistype.</text>
    <text class="hex-as-shorthand-edge" x="44" y="242">8 bits</text>
  </g>
  <line class="hex-as-shorthand-line hex-as-shorthand-conn hex-as-shorthand-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#hex-as-shorthand-tip)"/>
  <g class="hex-as-shorthand-stage hex-as-shorthand-s1">
    <rect class="hex-as-shorthand-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="hex-as-shorthand-step" x="280" y="142">02</text>
    <text class="hex-as-shorthand-name" x="306" y="142">Split in half</text>
    <text class="hex-as-shorthand-desc" x="280" y="166">1011 and 0101. Four bits each.</text>
    <text class="hex-as-shorthand-edge" x="280" y="242">two nibbles</text>
  </g>
  <line class="hex-as-shorthand-line hex-as-shorthand-conn hex-as-shorthand-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#hex-as-shorthand-tip)"/>
  <g class="hex-as-shorthand-stage hex-as-shorthand-s2">
    <rect class="hex-as-shorthand-hi" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="hex-as-shorthand-step" x="516" y="142">03</text>
    <text class="hex-as-shorthand-name" x="542" y="142">Convert each</text>
    <text class="hex-as-shorthand-desc" x="516" y="166">1011 is 11 is b. 0101 is 5.</text>
    <text class="hex-as-shorthand-edge" x="516" y="242">one digit each</text>
  </g>
  <line class="hex-as-shorthand-line hex-as-shorthand-conn hex-as-shorthand-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#hex-as-shorthand-tip)"/>
  <g class="hex-as-shorthand-stage hex-as-shorthand-s3">
    <rect class="hex-as-shorthand-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="hex-as-shorthand-step" x="752" y="142">04</text>
    <text class="hex-as-shorthand-name" x="778" y="142">Read it</text>
    <text class="hex-as-shorthand-desc" x="752" y="166">0xb5. Same value, four times</text>
    <text class="hex-as-shorthand-desc" x="752" y="182">shorter.</text>
    <text class="hex-as-shorthand-edge" x="752" y="242">2 characters</text>
  </g>
  <text class="hex-as-shorthand-sub" x="30" y="304">The machine does not use hex. You do, because 0xb5 is harder to mistype than 10110101.</text>
</svg>
