<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Where information is lost.">
  <title>A cascade against one model</title>
  <style>
    .end-to-end-vs-cascade-bg   { fill: #f8fafc; }
    .end-to-end-vs-cascade-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .end-to-end-vs-cascade-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .end-to-end-vs-cascade-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .end-to-end-vs-cascade-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .end-to-end-vs-cascade-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .end-to-end-vs-cascade-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .end-to-end-vs-cascade-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .end-to-end-vs-cascade-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .end-to-end-vs-cascade-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .end-to-end-vs-cascade-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .end-to-end-vs-cascade-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .end-to-end-vs-cascade-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .end-to-end-vs-cascade-row { opacity: 1; }
    .end-to-end-vs-cascade-r0 { animation-delay: 0.00s; }
    .end-to-end-vs-cascade-r1 { animation-delay: 0.45s; }
    .end-to-end-vs-cascade-r2 { animation-delay: 0.90s; }
    .end-to-end-vs-cascade-r3 { animation-delay: 1.35s; }
    .end-to-end-vs-cascade-r4 { animation-delay: 1.80s; }
    .end-to-end-vs-cascade-row { animation: end-to-end-vs-cascade-reveal 7.3s ease-in-out infinite; }
    @keyframes end-to-end-vs-cascade-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="end-to-end-vs-cascade-bg" width="980" height="390"/>
  <text class="end-to-end-vs-cascade-h1"  x="30" y="40">A cascade against one model</text>
  <text class="end-to-end-vs-cascade-sub" x="30" y="64">Where information is lost.</text>
  <rect class="end-to-end-vs-cascade-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="end-to-end-vs-cascade-name" x="46" y="122">Caption, then reason</text>
  <text class="end-to-end-vs-cascade-desc" x="46" y="142">Two models, one bottleneck.</text>
  <text class="end-to-end-vs-cascade-desc end-to-end-vs-cascade-row end-to-end-vs-cascade-r0" x="46" y="182">A captioner describes the image</text>
  <text class="end-to-end-vs-cascade-desc end-to-end-vs-cascade-row end-to-end-vs-cascade-r1" x="46" y="216">The language model reads the description</text>
  <text class="end-to-end-vs-cascade-desc end-to-end-vs-cascade-row end-to-end-vs-cascade-r2" x="46" y="250">Everything not described is lost</text>
  <text class="end-to-end-vs-cascade-desc end-to-end-vs-cascade-row end-to-end-vs-cascade-r3" x="46" y="284">Cannot answer about unmentioned detail</text>
  <text class="end-to-end-vs-cascade-desc end-to-end-vs-cascade-row end-to-end-vs-cascade-r4" x="46" y="318">Errors compound across stages</text>
  <rect class="end-to-end-vs-cascade-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="end-to-end-vs-cascade-name" x="526" y="122">One joint model</text>
  <text class="end-to-end-vs-cascade-desc" x="526" y="142">No bottleneck.</text>
  <text class="end-to-end-vs-cascade-desc end-to-end-vs-cascade-row end-to-end-vs-cascade-r0" x="526" y="182">The image is attended to directly</text>
  <text class="end-to-end-vs-cascade-desc end-to-end-vs-cascade-row end-to-end-vs-cascade-r1" x="526" y="216">Every patch remains available</text>
  <text class="end-to-end-vs-cascade-desc end-to-end-vs-cascade-row end-to-end-vs-cascade-r2" x="526" y="250">Detail is retrieved on demand</text>
  <text class="end-to-end-vs-cascade-desc end-to-end-vs-cascade-row end-to-end-vs-cascade-r3" x="526" y="284">Can answer about anything visible</text>
  <text class="end-to-end-vs-cascade-desc end-to-end-vs-cascade-row end-to-end-vs-cascade-r4" x="526" y="318">One model, one error surface</text>
  <text class="end-to-end-vs-cascade-sub" x="30" y="372">The caption is a lossy summary chosen without knowing the question, which is precisely why the two-stage approach fails on anything the captioner did not think to mention.</text>
</svg>
