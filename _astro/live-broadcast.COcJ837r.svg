<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One of them can be edited.">
  <title>Live, or recorded</title>
  <style>
    .live-broadcast-bg   { fill: #f8fafc; }
    .live-broadcast-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .live-broadcast-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .live-broadcast-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .live-broadcast-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .live-broadcast-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .live-broadcast-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .live-broadcast-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .live-broadcast-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .live-broadcast-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .live-broadcast-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .live-broadcast-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .live-broadcast-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .live-broadcast-row { opacity: 1; }
    .live-broadcast-r0 { animation-delay: 0.00s; }
    .live-broadcast-r1 { animation-delay: 0.45s; }
    .live-broadcast-r2 { animation-delay: 0.90s; }
    .live-broadcast-r3 { animation-delay: 1.35s; }
    .live-broadcast-r4 { animation-delay: 1.80s; }
    .live-broadcast-row { animation: live-broadcast-reveal 7.3s ease-in-out infinite; }
    @keyframes live-broadcast-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="live-broadcast-bg" width="980" height="390"/>
  <text class="live-broadcast-h1"  x="30" y="40">Live, or recorded</text>
  <text class="live-broadcast-sub" x="30" y="64">One of them can be edited.</text>
  <rect class="live-broadcast-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="live-broadcast-name" x="46" y="122">Live</text>
  <text class="live-broadcast-desc" x="46" y="142">Immediate, uncorrected.</text>
  <text class="live-broadcast-desc live-broadcast-row live-broadcast-r0" x="46" y="182">The audience sees it as it happens</text>
  <text class="live-broadcast-desc live-broadcast-row live-broadcast-r1" x="46" y="216">Nothing can be cut</text>
  <text class="live-broadcast-desc live-broadcast-row live-broadcast-r2" x="46" y="250">Mistakes are broadcast</text>
  <text class="live-broadcast-desc live-broadcast-row live-broadcast-r3" x="46" y="284">Feels present and responsive</text>
  <text class="live-broadcast-desc live-broadcast-row live-broadcast-r4" x="46" y="318">This is streaming</text>
  <rect class="live-broadcast-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="live-broadcast-name" x="526" y="122">Recorded</text>
  <text class="live-broadcast-desc" x="526" y="142">Delayed, checked.</text>
  <text class="live-broadcast-desc live-broadcast-row live-broadcast-r0" x="526" y="182">Reviewed before transmission</text>
  <text class="live-broadcast-desc live-broadcast-row live-broadcast-r1" x="526" y="216">Errors removed</text>
  <text class="live-broadcast-desc live-broadcast-row live-broadcast-r2" x="526" y="250">Nothing goes out unchecked</text>
  <text class="live-broadcast-desc live-broadcast-row live-broadcast-r3" x="526" y="284">Feels slower to arrive</text>
  <text class="live-broadcast-desc live-broadcast-row live-broadcast-r4" x="526" y="318">This is a buffered response</text>
  <text class="live-broadcast-sub" x="30" y="372">Broadcasters make exactly this trade for exactly these reasons, and they reserve live transmission for cases where immediacy is worth losing the edit.</text>
</svg>
