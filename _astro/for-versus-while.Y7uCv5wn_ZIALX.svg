<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Do you know the list in advance, or not?">
  <title>for or while?</title>
  <style>
    .for-versus-while-bg   { fill: #f8fafc; }
    .for-versus-while-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .for-versus-while-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .for-versus-while-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .for-versus-while-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .for-versus-while-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .for-versus-while-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .for-versus-while-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .for-versus-while-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .for-versus-while-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .for-versus-while-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .for-versus-while-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .for-versus-while-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .for-versus-while-row { opacity: 1; }
    .for-versus-while-r0 { animation-delay: 0.00s; }
    .for-versus-while-r1 { animation-delay: 0.45s; }
    .for-versus-while-r2 { animation-delay: 0.90s; }
    .for-versus-while-r3 { animation-delay: 1.35s; }
    .for-versus-while-r4 { animation-delay: 1.80s; }
    .for-versus-while-row { animation: for-versus-while-reveal 7.3s ease-in-out infinite; }
    @keyframes for-versus-while-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="for-versus-while-bg" width="980" height="390"/>
  <text class="for-versus-while-h1"  x="30" y="40">for or while?</text>
  <text class="for-versus-while-sub" x="30" y="64">Do you know the list in advance, or not?</text>
  <rect class="for-versus-while-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="for-versus-while-name" x="46" y="122">for</text>
  <text class="for-versus-while-desc" x="46" y="142">Once per item in a known list.</text>
  <text class="for-versus-while-desc for-versus-while-row for-versus-while-r0" x="46" y="182">for f in *.txt; do ... done</text>
  <text class="for-versus-while-desc for-versus-while-row for-versus-while-r1" x="46" y="216">Files matching a pattern</text>
  <text class="for-versus-while-desc for-versus-while-row for-versus-while-r2" x="46" y="250">A fixed set of names</text>
  <text class="for-versus-while-desc for-versus-while-row for-versus-while-r3" x="46" y="284">The script's own arguments: "$@"</text>
  <text class="for-versus-while-desc for-versus-while-row for-versus-while-r4" x="46" y="318">The count is known before it starts</text>
  <rect class="for-versus-while-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="for-versus-while-name" x="526" y="122">while</text>
  <text class="for-versus-while-desc" x="526" y="142">As long as a command keeps succeeding.</text>
  <text class="for-versus-while-desc for-versus-while-row for-versus-while-r0" x="526" y="182">while read -r line; do ... done &lt; file</text>
  <text class="for-versus-while-desc for-versus-while-row for-versus-while-r1" x="526" y="216">Reading a file line by line</text>
  <text class="for-versus-while-desc for-versus-while-row for-versus-while-r2" x="526" y="250">Retrying until something is ready</text>
  <text class="for-versus-while-desc for-versus-while-row for-versus-while-r3" x="526" y="284">Counting down to a condition</text>
  <text class="for-versus-while-desc for-versus-while-row for-versus-while-r4" x="526" y="318">The count is not known in advance</text>
  <text class="for-versus-while-sub" x="30" y="372">until is while's mirror: it repeats as long as the command FAILS, which reads better when you are waiting for something to become true.</text>
</svg>
