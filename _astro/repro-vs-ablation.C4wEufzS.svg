<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Matching against explaining.">
  <title>Reproduction against ablation</title>
  <style>
    .repro-vs-ablation-bg   { fill: #f8fafc; }
    .repro-vs-ablation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-vs-ablation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-vs-ablation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-vs-ablation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-vs-ablation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-vs-ablation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .repro-vs-ablation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .repro-vs-ablation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .repro-vs-ablation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .repro-vs-ablation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .repro-vs-ablation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .repro-vs-ablation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .repro-vs-ablation-row { opacity: 1; }
    .repro-vs-ablation-r0 { animation-delay: 0.00s; }
    .repro-vs-ablation-r1 { animation-delay: 0.45s; }
    .repro-vs-ablation-r2 { animation-delay: 0.90s; }
    .repro-vs-ablation-r3 { animation-delay: 1.35s; }
    .repro-vs-ablation-r4 { animation-delay: 1.80s; }
    .repro-vs-ablation-row { animation: repro-vs-ablation-reveal 7.3s ease-in-out infinite; }
    @keyframes repro-vs-ablation-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="repro-vs-ablation-bg" width="980" height="390"/>
  <text class="repro-vs-ablation-h1"  x="30" y="40">Reproduction against ablation</text>
  <text class="repro-vs-ablation-sub" x="30" y="64">Matching against explaining.</text>
  <rect class="repro-vs-ablation-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="repro-vs-ablation-name" x="46" y="122">Reproduction</text>
  <text class="repro-vs-ablation-desc" x="46" y="142">Does it hold?</text>
  <text class="repro-vs-ablation-desc repro-vs-ablation-row repro-vs-ablation-r0" x="46" y="182">Run the method as published</text>
  <text class="repro-vs-ablation-desc repro-vs-ablation-row repro-vs-ablation-r1" x="46" y="216">Compare against the reported number</text>
  <text class="repro-vs-ablation-desc repro-vs-ablation-row repro-vs-ablation-r2" x="46" y="250">Success is matching within variance</text>
  <text class="repro-vs-ablation-desc repro-vs-ablation-row repro-vs-ablation-r3" x="46" y="284">Tests the claim</text>
  <text class="repro-vs-ablation-desc repro-vs-ablation-row repro-vs-ablation-r4" x="46" y="318">One configuration</text>
  <rect class="repro-vs-ablation-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="repro-vs-ablation-name" x="526" y="122">Ablation</text>
  <text class="repro-vs-ablation-desc" x="526" y="142">Why does it hold?</text>
  <text class="repro-vs-ablation-desc repro-vs-ablation-row repro-vs-ablation-r0" x="526" y="182">Remove one component at a time</text>
  <text class="repro-vs-ablation-desc repro-vs-ablation-row repro-vs-ablation-r1" x="526" y="216">Compare against the full method</text>
  <text class="repro-vs-ablation-desc repro-vs-ablation-row repro-vs-ablation-r2" x="526" y="250">Success is understanding the contribution</text>
  <text class="repro-vs-ablation-desc repro-vs-ablation-row repro-vs-ablation-r3" x="526" y="284">Tests the explanation</text>
  <text class="repro-vs-ablation-desc repro-vs-ablation-row repro-vs-ablation-r4" x="526" y="318">Many configurations</text>
  <text class="repro-vs-ablation-sub" x="30" y="372">Reproduction should come first: ablating a method you have not yet reproduced tells you about your implementation rather than about the method.</text>
</svg>
