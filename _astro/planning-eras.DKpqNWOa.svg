<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From four separate fields.">
  <title>Four findings that explain week three</title>
  <style>
    .planning-eras-bg   { fill: #f8fafc; }
    .planning-eras-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .planning-eras-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .planning-eras-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .planning-eras-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .planning-eras-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .planning-eras-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .planning-eras-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .planning-eras-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .planning-eras-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .planning-eras-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .planning-eras-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .planning-eras-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .planning-eras-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .planning-eras-stage { opacity: 1; }

    .planning-eras-s0 { animation-delay: 0.00s; }
    .planning-eras-e0 { animation-delay: 0.00s; }
    .planning-eras-s1 { animation-delay: 1.28s; }
    .planning-eras-e1 { animation-delay: 1.28s; }
    .planning-eras-s2 { animation-delay: 2.56s; }
    .planning-eras-e2 { animation-delay: 2.56s; }
    .planning-eras-s3 { animation-delay: 3.84s; }
    .planning-eras-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .planning-eras-conn  { animation: planning-eras-trace 6.4s ease-in-out infinite; }
      .planning-eras-stage { animation: planning-eras-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes planning-eras-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes planning-eras-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .planning-eras-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .planning-eras-stage { animation: planning-eras-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes planning-eras-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="planning-eras-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="planning-eras-bg" width="980" height="322"/>
  <text class="planning-eras-h1"  x="30" y="40">Four findings that explain week three</text>
  <text class="planning-eras-sub" x="30" y="64">From four separate fields.</text>
  <g class="planning-eras-stage planning-eras-s0">
    <rect class="planning-eras-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="planning-eras-step" x="44" y="142">01</text>
    <text class="planning-eras-name" x="70" y="142">Specific goals, 1968</text>
    <text class="planning-eras-desc" x="44" y="166">Locke and Latham. A vague goal</text>
    <text class="planning-eras-desc" x="44" y="182">has no state that counts as</text>
    <text class="planning-eras-desc" x="44" y="198">done.</text>
  </g>
  <line class="planning-eras-line planning-eras-conn planning-eras-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#planning-eras-tip)"/>
  <g class="planning-eras-stage planning-eras-s1">
    <rect class="planning-eras-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="planning-eras-step" x="280" y="142">02</text>
    <text class="planning-eras-name" x="306" y="142">Implementation intentions, 1990s</text>
    <text class="planning-eras-desc" x="280" y="166">"When X, I will do Y" is acted</text>
    <text class="planning-eras-desc" x="280" y="182">on far more often. It removes a</text>
    <text class="planning-eras-desc" x="280" y="198">decision.</text>
    <text class="planning-eras-edge" x="280" y="242">next action</text>
  </g>
  <line class="planning-eras-line planning-eras-conn planning-eras-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#planning-eras-tip)"/>
  <g class="planning-eras-stage planning-eras-s2">
    <rect class="planning-eras-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="planning-eras-step" x="516" y="142">03</text>
    <text class="planning-eras-name" x="542" y="142">The planning fallacy, 1979</text>
    <text class="planning-eras-desc" x="516" y="166">Systematic under-estimation,</text>
    <text class="planning-eras-desc" x="516" y="182">worse for unfamiliar work, not</text>
    <text class="planning-eras-desc" x="516" y="198">fixed by knowing.</text>
    <text class="planning-eras-edge" x="516" y="242">1.2x</text>
  </g>
  <line class="planning-eras-line planning-eras-conn planning-eras-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#planning-eras-tip)"/>
  <g class="planning-eras-stage planning-eras-s3">
    <rect class="planning-eras-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="planning-eras-step" x="752" y="142">04</text>
    <text class="planning-eras-name" x="778" y="142">Work-in-progress limits</text>
    <text class="planning-eras-desc" x="752" y="166">Throughput falls as</text>
    <text class="planning-eras-desc" x="752" y="182">work-in-progress rises.</text>
    <text class="planning-eras-desc" x="752" y="198">Switching costs; unfinished work</text>
    <text class="planning-eras-edge" x="752" y="242">cap it</text>
  </g>
  <text class="planning-eras-sub" x="30" y="304">Two of these arrive at the same conclusion from psychology and from manufacturing respectively, which is a reasonable reason to believe it: a plan with six simultaneous commitments has a work-in-progress limit of six, set by nobody.</text>
</svg>
