<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the error distribution.">
  <title>Which loss when</title>
  <style>
    .loss-when-bg   { fill: #f8fafc; }
    .loss-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .loss-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .loss-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .loss-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .loss-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .loss-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .loss-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .loss-when-row { opacity: 1; }
    .loss-when-r0 { animation-delay: 0.00s; }
    .loss-when-r1 { animation-delay: 0.45s; }
    .loss-when-r2 { animation-delay: 0.90s; }
    .loss-when-r3 { animation-delay: 1.35s; }
    .loss-when-r4 { animation-delay: 1.80s; }
    .loss-when-row { animation: loss-when-reveal 7.3s ease-in-out infinite; }
    @keyframes loss-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="loss-when-bg" width="980" height="390"/>
  <text class="loss-when-h1"  x="30" y="40">Which loss when</text>
  <text class="loss-when-sub" x="30" y="64">By the error distribution.</text>
  <rect class="loss-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="loss-when-name" x="46" y="122">The situation</text>
  <text class="loss-when-desc" x="46" y="142">What you have.</text>
  <text class="loss-when-desc loss-when-row loss-when-r0" x="46" y="182">Clean data, roughly Gaussian errors</text>
  <text class="loss-when-desc loss-when-row loss-when-r1" x="46" y="216">Known outliers you cannot remove</text>
  <text class="loss-when-desc loss-when-row loss-when-r2" x="46" y="250">Uncertain, somewhere between</text>
  <text class="loss-when-desc loss-when-row loss-when-r3" x="46" y="284">Large errors genuinely catastrophic</text>
  <text class="loss-when-desc loss-when-row loss-when-r4" x="46" y="318">A specific asymmetric cost</text>
  <rect class="loss-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="loss-when-name" x="526" y="122">The loss</text>
  <text class="loss-when-desc" x="526" y="142">What to use.</text>
  <text class="loss-when-desc loss-when-row loss-when-r0" x="526" y="182">Squared error; it is efficient here</text>
  <text class="loss-when-desc loss-when-row loss-when-r1" x="526" y="216">Absolute error, or a robust variant</text>
  <text class="loss-when-desc loss-when-row loss-when-r2" x="526" y="250">A hybrid, with the threshold tuned</text>
  <text class="loss-when-desc loss-when-row loss-when-r3" x="526" y="284">Squared error, deliberately</text>
  <text class="loss-when-desc loss-when-row loss-when-r4" x="526" y="318">A custom loss matching the costs</text>
  <text class="loss-when-sub" x="30" y="372">The fourth row is the case where squared error's outlier sensitivity is the feature rather than the defect, which is worth stating since it is usually described as a flaw.</text>
</svg>
