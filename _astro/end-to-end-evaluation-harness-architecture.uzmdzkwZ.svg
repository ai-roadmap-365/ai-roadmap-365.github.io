<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="End-to-End Evaluation Harness Architecture">
  <title>End-to-End Evaluation Harness Architecture</title>
  <defs>
    <style>
      .d315a-bg { fill: #f8fafc; }
      .d315a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d315a-ds { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d315a-run { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d315a-eng { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 8px; }
      .d315a-rep { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d315a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d315a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d315a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d315a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d315a-bg" />
  
  <text x="40" y="40" class="d315a-title">Unified AI Evaluation Harness Pipeline</text>
  <text x="40" y="65" class="d315a-subtitle">End-to-End Evaluation Harness Architecture showing Dataset Streaming, Concurrent Batch Runner, Multi-Metric Engine (EM, JSON F1, LLM Judge), Aggregator, and CI Markdown Reporter</text>
  
  <!-- Module 1: Dataset Loader -->
  <rect x="40" y="110" width="180" height="270" class="d315a-ds" />
  <text x="55" y="140" class="d315a-header" fill="#1d4ed8">1. Dataset Loader</text>
  <text x="55" y="170" class="d315a-text">• `dataset.jsonl` streaming</text>
  <text x="55" y="190" class="d315a-text">• Schema validation</text>
  <text x="55" y="210" class="d315a-text">• Stratified category filter</text>
  <text x="55" y="230" class="d315a-text">• Golden case tags</text>
  <text x="55" y="260" class="d315a-text" font-weight="600">Payload:</text>
  <text x="55" y="280" class="d315a-text">Clean benchmark cases</text>
  
  <!-- Module 2: Concurrency Runner -->
  <rect x="250" y="110" width="180" height="270" class="d315a-run" />
  <text x="265" y="140" class="d315a-header" fill="#7e22ce">2. Execution Runner</text>
  <text x="265" y="170" class="d315a-text">• Async concurrency pool</text>
  <text x="265" y="190" class="d315a-text">• Exponential retry backoff</text>
  <text x="265" y="210" class="d315a-text">• Rate limit semaphores</text>
  <text x="265" y="230" class="d315a-text">• Model client dispatch</text>
  <text x="265" y="260" class="d315a-text" font-weight="600">Throughput:</text>
  <text x="265" y="280" class="d315a-text">50 req/sec parallel</text>
  
  <!-- Module 3: Metric Engine -->
  <rect x="460" y="110" width="180" height="270" class="d315a-eng" />
  <text x="475" y="140" class="d315a-header" fill="#a16207">3. Multi-Metric Engine</text>
  <text x="475" y="170" class="d315a-text">• Exact Match (EM)</text>
  <text x="475" y="190" class="d315a-text">• JSON Schema Field F1</text>
  <text x="475" y="210" class="d315a-text">• Token Overlap F1</text>
  <text x="475" y="230" class="d315a-text">• Rubric-Anchored Judge</text>
  <text x="475" y="260" class="d315a-text" font-weight="600">Aggregation:</text>
  <text x="475" y="280" class="d315a-text">Composite Weighted Score</text>
  
  <!-- Module 4: Regression Reporter -->
  <rect x="670" y="110" width="190" height="270" class="d315a-rep" />
  <text x="685" y="140" class="d315a-header" fill="#15803d">4. Report &amp; CI Gate</text>
  <text x="685" y="170" class="d315a-text">• Delta vs baseline</text>
  <text x="685" y="190" class="d315a-text">• Category pass breakdown</text>
  <text x="685" y="210" class="d315a-text">• Markdown PR comment</text>
  <text x="685" y="230" class="d315a-text">• Exit 0 (Pass) / 1 (Fail)</text>
  <text x="685" y="260" class="d315a-text" font-weight="600">Artifact:</text>
  <text x="685" y="280" class="d315a-text">`eval_report.md`</text>
</svg>