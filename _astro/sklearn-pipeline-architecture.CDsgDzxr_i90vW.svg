<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="Pipeline Architecture Diagram">
  <title>Atomic Scikit-Learn Pipeline Architecture</title>
  <defs>
    <style>
      .d173a-bg { fill: #f8fafc; }
      .d173a-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d173a-header { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; }
      .d173a-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
      .d173a-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
      .d173a-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 11px; font-weight: 600; }
      .d173a-arr { stroke: #2563eb; stroke-width: 2; marker-end: url(#d173a-m); fill: none; }
    </style>
    <marker id="d173a-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="d173a-bg" />

  <text x="40" y="45" class="d173a-header" font-size="22">Atomic Scikit-Learn Pipeline Architecture</text>
  <text x="40" y="70" class="d173a-text" font-size="13">Encapsulating Multi-Branch Preprocessing, Feature Selection, and Estimation in an Atomic Object</text>

  <!-- Big Outer Container: The Pipeline -->
  <rect x="40" y="100" width="820" height="340" class="d173a-box" fill="#f1f5f9" stroke="#3b82f6" stroke-dasharray="6 4" />
  <text x="60" y="130" class="d173a-title" fill="#1d4ed8" font-size="15">Pipeline( [ ('preprocessor', ColumnTransformer), ('selector', RFE), ('classifier', LogisticRegression) ] )</text>

  <!-- Step 1: ColumnTransformer -->
  <rect x="60" y="150" width="340" height="260" class="d173a-box" />
  <text x="80" y="180" class="d173a-title" fill="#0f172a">1. ColumnTransformer Branches</text>
  
  <!-- Numerical Sub-pipeline -->
  <rect x="80" y="195" width="300" height="85" fill="#eff6ff" stroke="#93c5fd" rx="6" />
  <text x="95" y="220" class="d173a-title" fill="#1e40af">Numerical Pipeline (Age, Income)</text>
  <text x="95" y="245" class="d173a-math">OutlierClipper ➔ StandardScaler</text>
  <text x="95" y="265" class="d173a-text">Fits mean &amp; IQR strictly on train fold</text>

  <!-- Categorical Sub-pipeline -->
  <rect x="80" y="295" width="300" height="85" fill="#f0fdf4" stroke="#86efac" rx="6" />
  <text x="95" y="320" class="d173a-title" fill="#15803d">Categorical Pipeline (City, Job)</text>
  <text x="95" y="345" class="d173a-math">OneHotEncoder(handle_unknown='ignore')</text>
  <text x="95" y="365" class="d173a-text">Encodes categories cleanly into binary vectors</text>

  <!-- Arrow 1 to 2 -->
  <path d="M 400 280 L 450 280" class="d173a-arr" />

  <!-- Step 2: Feature Selection -->
  <rect x="450" y="150" width="180" height="260" class="d173a-box" fill="#fefce8" stroke="#eab308" />
  <text x="465" y="180" class="d173a-title" fill="#a16207">2. Feature Selection</text>
  <text x="465" y="215" class="d173a-math">RFE / SelectKBest</text>
  <text x="465" y="250" class="d173a-text">• Evaluates feature</text>
  <text x="465" y="270" class="d173a-text">  importance strictly</text>
  <text x="465" y="290" class="d173a-text">  inside training fold.</text>
  <text x="465" y="320" class="d173a-text">• Zero selection bias.</text>
  <text x="465" y="350" class="d173a-text">• Top K subset.</text>

  <!-- Arrow 2 to 3 -->
  <path d="M 630 280 L 670 280" class="d173a-arr" />

  <!-- Step 3: Final Estimator -->
  <rect x="670" y="150" width="170" height="260" class="d173a-box" fill="#ffffff" stroke="#22c55e" />
  <text x="685" y="180" class="d173a-title" fill="#15803d">3. Final Estimator</text>
  <text x="685" y="215" class="d173a-math">Classifier.fit()</text>
  <text x="685" y="250" class="d173a-text">• LogisticRegression</text>
  <text x="685" y="275" class="d173a-text">• Ridge / Lasso</text>
  <text x="685" y="300" class="d173a-text">• Gradient Boosting</text>
  <text x="685" y="335" class="d173a-math" fill="#15803d">.predict(X_new)</text>
  <text x="685" y="365" class="d173a-text">Atomic Inference!</text>
</svg>
