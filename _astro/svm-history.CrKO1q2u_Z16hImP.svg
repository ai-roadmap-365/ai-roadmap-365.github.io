<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Dominant, then displaced.">
  <title>Four steps for support vector machines</title>
  <style>
    .svm-history-bg   { fill: #f8fafc; }
    .svm-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .svm-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .svm-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .svm-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .svm-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .svm-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .svm-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .svm-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .svm-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .svm-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .svm-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .svm-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .svm-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .svm-history-stage { opacity: 1; }

    .svm-history-s0 { animation-delay: 0.00s; }
    .svm-history-e0 { animation-delay: 0.00s; }
    .svm-history-s1 { animation-delay: 1.28s; }
    .svm-history-e1 { animation-delay: 1.28s; }
    .svm-history-s2 { animation-delay: 2.56s; }
    .svm-history-e2 { animation-delay: 2.56s; }
    .svm-history-s3 { animation-delay: 3.84s; }
    .svm-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .svm-history-conn  { animation: svm-history-trace 6.4s ease-in-out infinite; }
      .svm-history-stage { animation: svm-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes svm-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes svm-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .svm-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .svm-history-stage { animation: svm-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes svm-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="svm-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="svm-history-bg" width="980" height="322"/>
  <text class="svm-history-h1"  x="30" y="40">Four steps for support vector machines</text>
  <text class="svm-history-sub" x="30" y="64">Dominant, then displaced.</text>
  <g class="svm-history-stage svm-history-s0">
    <rect class="svm-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="svm-history-step" x="44" y="142">01</text>
    <text class="svm-history-name" x="70" y="142">The margin idea, with strong theory behind it</text>
    <text class="svm-history-desc" x="44" y="166">Generalisation bounds, which</text>
    <text class="svm-history-desc" x="44" y="182">were rare.</text>
  </g>
  <line class="svm-history-line svm-history-conn svm-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#svm-history-tip)"/>
  <g class="svm-history-stage svm-history-s1">
    <rect class="svm-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="svm-history-step" x="280" y="142">02</text>
    <text class="svm-history-name" x="306" y="142">The soft margin made it practical</text>
    <text class="svm-history-desc" x="280" y="166">By handling non-separable data.</text>
  </g>
  <line class="svm-history-line svm-history-conn svm-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#svm-history-tip)"/>
  <g class="svm-history-stage svm-history-s2">
    <rect class="svm-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="svm-history-step" x="516" y="142">03</text>
    <text class="svm-history-name" x="542" y="142">It became the state of the art for a decade</text>
    <text class="svm-history-desc" x="516" y="166">Especially on text and small</text>
    <text class="svm-history-desc" x="516" y="182">datasets.</text>
  </g>
  <line class="svm-history-line svm-history-conn svm-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#svm-history-tip)"/>
  <g class="svm-history-stage svm-history-s3">
    <rect class="svm-history-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="svm-history-step" x="752" y="142">04</text>
    <text class="svm-history-name" x="778" y="142">Then displaced by ensembles and networks</text>
    <text class="svm-history-desc" x="752" y="166">On scale, not on principle.</text>
  </g>
  <text class="svm-history-sub" x="30" y="304">Being displaced on scale rather than on principle is the important distinction: the method did not stop working, the datasets outgrew its training complexity.</text>
</svg>
