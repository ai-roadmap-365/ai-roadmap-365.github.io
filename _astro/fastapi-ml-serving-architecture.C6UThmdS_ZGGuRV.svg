<svg role="img" aria-label="FastAPI ML inference architecture showing HTTP request Pydantic schema validation model forward pass and JSON response" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>FastAPI ML Inference Service Architecture</title>
  <defs>
    <linearGradient id="bg194a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card194" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg194a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">FASTAPI ML MICROSERVICE SERVING ARCHITECTURE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Low-Latency REST Prediction Engine with Pydantic Validation &amp; Health Probes</text>
  <g transform="translate(40, 85)">
    <rect width="770" height="295" fill="url(#card194)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Client -->
    <rect x="25" y="50" width="120" height="180" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="85" y="80" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">HTTP Client</text>
    <text x="85" y="110" fill="#cbd5e1" font-family="system-ui" font-size="10" text-anchor="middle">POST /predict</text>
    <text x="85" y="135" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">JSON Payload</text>
    <text x="85" y="160" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">GET /healthz</text>
    <!-- Arrow -->
    <line x1="145" y1="140" x2="205" y2="140" stroke="#64748b" stroke-width="2"/>
    <!-- Pydantic Layer -->
    <rect x="205" y="40" width="160" height="200" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" rx="6"/>
    <text x="285" y="65" fill="#fbbf24" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Pydantic Schemas</text>
    <text x="220" y="95" fill="#cbd5e1" font-family="system-ui" font-size="9">• Type Coercion</text>
    <text x="220" y="120" fill="#cbd5e1" font-family="system-ui" font-size="9">• Range Bounds [ge/le]</text>
    <text x="220" y="145" fill="#cbd5e1" font-family="system-ui" font-size="9">• Non-null assertions</text>
    <text x="220" y="170" fill="#ef4444" font-family="system-ui" font-size="9">• 422 Interception</text>
    <text x="285" y="215" fill="#fde68a" font-family="system-ui" font-size="9" text-anchor="middle">Contract Enforcement</text>
    <!-- Arrow -->
    <line x1="365" y1="140" x2="425" y2="140" stroke="#64748b" stroke-width="2"/>
    <!-- Model Wrapper & Cache -->
    <rect x="425" y="40" width="160" height="200" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="505" y="65" fill="#34d399" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Model Runner</text>
    <text x="440" y="95" fill="#cbd5e1" font-family="system-ui" font-size="9">• Preloaded Weights</text>
    <text x="440" y="120" fill="#cbd5e1" font-family="system-ui" font-size="9">• NumPy Vectorization</text>
    <text x="440" y="145" fill="#cbd5e1" font-family="system-ui" font-size="9">• Batch Inference</text>
    <text x="440" y="170" fill="#cbd5e1" font-family="system-ui" font-size="9">• Fallback Circuit</text>
    <text x="505" y="215" fill="#a7f3d0" font-family="system-ui" font-size="9" text-anchor="middle">Sub-10ms Execution</text>
    <!-- Arrow -->
    <line x1="585" y1="140" x2="645" y2="140" stroke="#64748b" stroke-width="2"/>
    <!-- Response -->
    <rect x="645" y="50" width="105" height="180" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" rx="6"/>
    <text x="697" y="80" fill="#f472b6" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Response</text>
    <text x="697" y="110" fill="#cbd5e1" font-family="system-ui" font-size="9" text-anchor="middle">200 OK</text>
    <text x="697" y="135" fill="#94a3b8" font-family="system-ui" font-size="8" text-anchor="middle">probabilities</text>
    <text x="697" y="155" fill="#94a3b8" font-family="system-ui" font-size="8" text-anchor="middle">model_version</text>
    <text x="697" y="175" fill="#94a3b8" font-family="system-ui" font-size="8" text-anchor="middle">latency_ms</text>
  </g>
</svg>
