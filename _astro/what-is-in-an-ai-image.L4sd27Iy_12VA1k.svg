<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="100%" height="100%" role="img" aria-label="What Is Actually In An AI Image showing build tooling, framework and weights as proportions of a twenty-one gigabyte image">
  <title>What Is Actually In An AI Image</title>
  <defs>
    <style>
      .d331a-bg { fill: #f8fafc; }
      .d331a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; }
      .d331a-build { fill: #fee2e2; stroke: #ef4444; stroke-width: 2px; }
      .d331a-run { fill: #dbeafe; stroke: #3b82f6; stroke-width: 2px; }
      .d331a-data { fill: #fef9c3; stroke: #eab308; stroke-width: 2px; }
      .d331a-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d331a-h { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .d331a-t { font-family: system-ui, sans-serif; font-size: 13px; fill: #334155; }
      .d331a-s { font-family: system-ui, sans-serif; font-size: 12px; fill: #64748b; }
    </style>
  </defs>
  <rect class="d331a-bg" width="900" height="430" />
  <text class="d331a-title" x="30" y="36">What Is Actually In An AI Image</text>
  <text class="d331a-s" x="30" y="58">21,128 MB, drawn to scale. Three buckets, and only one of them is obvious.</text>

  <rect class="d331a-build" x="30" y="80" width="164" height="58" rx="6" />
  <text class="d331a-h" x="44" y="104">BUILD</text>
  <text class="d331a-s" x="44" y="124">4,380 MB</text>

  <rect class="d331a-run" x="200" y="80" width="163" height="58" rx="6" />
  <text class="d331a-h" x="214" y="104">RUNTIME</text>
  <text class="d331a-s" x="214" y="124">4,248 MB</text>

  <rect class="d331a-data" x="369" y="80" width="501" height="58" rx="6" />
  <text class="d331a-h" x="383" y="104">DATA — model weights</text>
  <text class="d331a-s" x="383" y="124">13,500 MB</text>

  <rect class="d331a-card" x="30" y="160" width="270" height="120" rx="8" />
  <text class="d331a-h" x="48" y="186">BUILD</text>
  <text class="d331a-s" x="48" y="210">build-essential, cuda-devel</text>
  <text class="d331a-t" x="48" y="236">Never used at run time.</text>
  <text class="d331a-t" x="48" y="256">Removed by a multi-stage build —</text>
  <text class="d331a-t" x="48" y="272">the optimisation everyone teaches.</text>

  <rect class="d331a-card" x="315" y="160" width="270" height="120" rx="8" />
  <text class="d331a-h" x="333" y="186">RUNTIME</text>
  <text class="d331a-s" x="333" y="210">cuda-runtime, torch, your code</text>
  <text class="d331a-t" x="333" y="236">The process needs these.</text>
  <text class="d331a-t" x="333" y="256">A slimmer base helps a little.</text>
  <text class="d331a-t" x="333" y="272">They cannot be dropped.</text>

  <rect class="d331a-card" x="600" y="160" width="270" height="120" rx="8" />
  <text class="d331a-h" x="618" y="186">DATA</text>
  <text class="d331a-s" x="618" y="210">model weights</text>
  <text class="d331a-t" x="618" y="236">Needed at run time, but NOT</text>
  <text class="d331a-t" x="618" y="256">needed in the image. Mount a</text>
  <text class="d331a-t" x="618" y="272">volume or fetch on startup.</text>

  <rect class="d331a-card" x="30" y="300" width="840" height="46" rx="6" />
  <text class="d331a-t" x="48" y="330">In a web application the third bucket is empty. That is why most Docker guidance never mentions it.</text>

  <rect class="d331a-data" x="30" y="360" width="840" height="46" rx="6" />
  <text class="d331a-h" x="48" y="380">The weights outweigh build tooling and runtime combined, three to one.</text>
  <text class="d331a-s" x="48" y="398">Multi-stage discipline does not touch them.</text>
</svg>
