<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Agent Skill Directory Structure and Lifecycle">
  <title>Agent Skill Directory Structure and Lifecycle</title>
  <defs>
    <style>
      .d305f-bg { fill: #f8fafc; }
      .d305f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d305f-dir { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d305f-meta { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d305f-exec { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d305f-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d305f-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d305f-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d305f-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
      .d305f-arrow { stroke: #64748b; stroke-width: 2px; fill: none; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d305f-bg" />
  
  <text x="40" y="40" class="d305a-title">Agent Skill Architecture: Packaging &amp; On-Demand Lifecycle</text>
  <text x="40" y="65" class="d305a-subtitle">Agent Skill Directory Structure and Lifecycle showing SKILL.md Frontmatter, Trigger Match, Lazy Load, Helper Script Execution, and Context Return</text>
  
  <!-- Skill Directory Bundle -->
  <rect x="40" y="110" width="250" height="260" class="d305f-dir" />
  <text x="55" y="140" class="d305f-header" fill="#1d4ed8">Skill Directory Bundle</text>
  <text x="55" y="170" class="d305f-text">📁 .agents/skills/db-migrations/</text>
  <text x="55" y="195" class="d305f-text">  ├── 📄 SKILL.md (Instructions)</text>
  <text x="55" y="220" class="d305f-text">  ├── 📁 scripts/ (Helper CLI)</text>
  <text x="55" y="240" class="d305f-text">  │     └── ⚙️ generate_diff.py</text>
  <text x="55" y="265" class="d305f-text">  └── 📁 references/ (Docs)</text>
  <text x="55" y="285" class="d305f-text">        └── 📖 alembic_rules.md</text>
  
  <!-- Lifecycle 1: Trigger Matching -->
  <rect x="325" y="110" width="250" height="260" class="d305f-meta" />
  <text x="340" y="140" class="d305f-header" fill="#7e22ce">Discovery &amp; Lazy Loading</text>
  <text x="340" y="170" class="d305f-text">1. Agent reads Skill catalog</text>
  <text x="340" y="190" class="d305f-text">   (Short metadata only)</text>
  <text x="340" y="215" class="d305f-text">2. User prompt: "Add table"</text>
  <text x="340" y="240" class="d305f-text">3. Trigger matches 'db-migration'</text>
  <text x="340" y="265" class="d305f-text">4. Agent executes `view_file`</text>
  <text x="340" y="285" class="d305f-text">   on `SKILL.md` (Lazy Load)</text>
  
  <!-- Lifecycle 2: Execution -->
  <rect x="610" y="110" width="250" height="260" class="d305f-exec" />
  <text x="625" y="140" class="d305f-header" fill="#15803d">Execution &amp; Verification</text>
  <text x="625" y="170" class="d305f-text">5. Agent reads migration schema</text>
  <text x="625" y="195" class="d305f-text">6. Executes helper script:</text>
  <text x="625" y="215" class="d305f-text">   `python3 scripts/diff.py`</text>
  <text x="625" y="240" class="d305f-text">7. Applies generated migration</text>
  <text x="625" y="265" class="d305f-text">8. Verifies with `pytest`</text>
  <text x="625" y="290" class="d305f-text">9. Context discarded (clean)</text>
</svg>