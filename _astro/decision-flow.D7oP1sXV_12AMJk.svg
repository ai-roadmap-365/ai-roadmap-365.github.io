<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" role="img" font-family="system-ui, sans-serif">
  <title>An if/elif/else path that classifies a model prediction into accept, review, or reject</title>
  <rect x="0" y="0" width="720" height="620" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Classifying a prediction: accept, review, or reject</text>

  <!-- Start -->
  <rect x="270" y="56" width="180" height="48" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="24"/>
  <text x="360" y="85" text-anchor="middle" font-size="15" fill="#1a202c">score, verified</text>

  <!-- Guard 1: valid input? -->
  <polygon points="360,124 470,168 360,212 250,168" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="360" y="164" text-anchor="middle" font-size="14" fill="#1a202c">input valid?</text>
  <text x="360" y="182" text-anchor="middle" font-size="12" fill="#1a202c">0.0 &#8804; score &#8804; 1.0</text>

  <!-- reject path (invalid) -->
  <rect x="510" y="144" width="180" height="48" fill="#ffe4e6" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="600" y="166" text-anchor="middle" font-size="13" fill="#1a202c">print error to stderr</text>
  <text x="600" y="184" text-anchor="middle" font-size="13" fill="#1a202c">exit code 2</text>
  <line x1="470" y1="168" x2="508" y2="168" stroke="#1d4ed8" stroke-width="2.5"/>
  <polygon points="510,168 498,162 498,174" fill="#1d4ed8"/>
  <text x="489" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">no</text>

  <!-- Decision 2: score < 0.5 (guard clause) -->
  <line x1="360" y1="212" x2="360" y2="248" stroke="#1d4ed8" stroke-width="2.5"/>
  <polygon points="360,250 354,238 366,238" fill="#1d4ed8"/>
  <text x="378" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">yes</text>
  <polygon points="360,250 470,294 360,338 250,294" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="360" y="298" text-anchor="middle" font-size="14" fill="#1a202c">score &lt; 0.5 ?</text>

  <rect x="510" y="270" width="180" height="48" fill="#fef3c7" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="600" y="299" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">REJECT</text>
  <line x1="470" y1="294" x2="508" y2="294" stroke="#1d4ed8" stroke-width="2.5"/>
  <polygon points="510,294 498,288 498,300" fill="#1d4ed8"/>
  <text x="489" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">yes</text>

  <!-- Decision 3: score >= 0.9 and verified -->
  <line x1="360" y1="338" x2="360" y2="374" stroke="#1d4ed8" stroke-width="2.5"/>
  <polygon points="360,376 354,364 366,364" fill="#1d4ed8"/>
  <text x="384" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">no</text>
  <polygon points="360,376 480,420 360,464 240,420" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="360" y="416" text-anchor="middle" font-size="13" fill="#1a202c">score &#8805; 0.9</text>
  <text x="360" y="434" text-anchor="middle" font-size="13" fill="#1a202c">and verified ?</text>

  <rect x="510" y="396" width="180" height="48" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="600" y="425" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">AUTO_ACCEPT</text>
  <line x1="480" y1="420" x2="508" y2="420" stroke="#1d4ed8" stroke-width="2.5"/>
  <polygon points="510,420 498,414 498,426" fill="#1d4ed8"/>
  <text x="493" y="410" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">yes</text>

  <!-- else: REVIEW -->
  <line x1="360" y1="464" x2="360" y2="500" stroke="#1d4ed8" stroke-width="2.5"/>
  <polygon points="360,502 354,490 366,490" fill="#1d4ed8"/>
  <text x="384" y="486" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">no</text>
  <rect x="270" y="502" width="180" height="48" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="360" y="531" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">REVIEW (else)</text>

  <text x="360" y="588" text-anchor="middle" font-size="13" fill="#1a202c">Each traveller takes exactly one path: the first matching branch wins, and the rest are skipped.</text>
</svg>
