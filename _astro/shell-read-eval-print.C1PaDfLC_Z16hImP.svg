<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The shell is a program waiting for input, and this is its whole loop.">
  <title>What happens between Return and the next prompt</title>
  <style>
    .shell-read-eval-print-bg   { fill: #f8fafc; }
    .shell-read-eval-print-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shell-read-eval-print-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shell-read-eval-print-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shell-read-eval-print-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shell-read-eval-print-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shell-read-eval-print-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .shell-read-eval-print-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .shell-read-eval-print-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .shell-read-eval-print-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .shell-read-eval-print-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .shell-read-eval-print-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .shell-read-eval-print-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .shell-read-eval-print-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .shell-read-eval-print-stage { opacity: 1; }

    .shell-read-eval-print-s0 { animation-delay: 0.00s; }
    .shell-read-eval-print-e0 { animation-delay: 0.00s; }
    .shell-read-eval-print-s1 { animation-delay: 1.33s; }
    .shell-read-eval-print-e1 { animation-delay: 1.33s; }
    .shell-read-eval-print-s2 { animation-delay: 2.67s; }
    .shell-read-eval-print-e2 { animation-delay: 2.67s; }
    .shell-read-eval-print-s3 { animation-delay: 4.00s; }
    .shell-read-eval-print-e3 { animation-delay: 4.00s; }
    .shell-read-eval-print-s4 { animation-delay: 5.33s; }
    .shell-read-eval-print-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .shell-read-eval-print-conn  { animation: shell-read-eval-print-trace 8s ease-in-out infinite; }
      .shell-read-eval-print-stage { animation: shell-read-eval-print-arrive 8s ease-in-out infinite; }
    }
    @keyframes shell-read-eval-print-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes shell-read-eval-print-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .shell-read-eval-print-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .shell-read-eval-print-stage { animation: shell-read-eval-print-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes shell-read-eval-print-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="shell-read-eval-print-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="shell-read-eval-print-bg" width="980" height="322"/>
  <text class="shell-read-eval-print-h1"  x="30" y="40">What happens between Return and the next prompt</text>
  <text class="shell-read-eval-print-sub" x="30" y="64">The shell is a program waiting for input, and this is its whole loop.</text>
  <g class="shell-read-eval-print-stage shell-read-eval-print-s0">
    <rect class="shell-read-eval-print-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="shell-read-eval-print-step" x="44" y="142">01</text>
    <text class="shell-read-eval-print-name" x="70" y="142">Prompt</text>
    <text class="shell-read-eval-print-desc" x="44" y="166">The shell prints it and</text>
    <text class="shell-read-eval-print-desc" x="44" y="182">waits. Nothing is</text>
    <text class="shell-read-eval-print-desc" x="44" y="198">happening yet.</text>
    <text class="shell-read-eval-print-edge" x="44" y="242">idle</text>
  </g>
  <line class="shell-read-eval-print-line shell-read-eval-print-conn shell-read-eval-print-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#shell-read-eval-print-tip)"/>
  <g class="shell-read-eval-print-stage shell-read-eval-print-s1">
    <rect class="shell-read-eval-print-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="shell-read-eval-print-step" x="233" y="142">02</text>
    <text class="shell-read-eval-print-name" x="259" y="142">Read</text>
    <text class="shell-read-eval-print-desc" x="233" y="166">Your line is taken as</text>
    <text class="shell-read-eval-print-desc" x="233" y="182">text when you press</text>
    <text class="shell-read-eval-print-desc" x="233" y="198">Return.</text>
    <text class="shell-read-eval-print-edge" x="233" y="242">one line</text>
  </g>
  <line class="shell-read-eval-print-line shell-read-eval-print-conn shell-read-eval-print-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#shell-read-eval-print-tip)"/>
  <g class="shell-read-eval-print-stage shell-read-eval-print-s2">
    <rect class="shell-read-eval-print-hi" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="shell-read-eval-print-step" x="422" y="142">03</text>
    <text class="shell-read-eval-print-name" x="448" y="142">Parse</text>
    <text class="shell-read-eval-print-desc" x="422" y="166">Split into a command and</text>
    <text class="shell-read-eval-print-desc" x="422" y="182">its arguments; expand</text>
    <text class="shell-read-eval-print-desc" x="422" y="198">variables and globs.</text>
    <text class="shell-read-eval-print-edge" x="422" y="242">where quoting matters</text>
  </g>
  <line class="shell-read-eval-print-line shell-read-eval-print-conn shell-read-eval-print-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#shell-read-eval-print-tip)"/>
  <g class="shell-read-eval-print-stage shell-read-eval-print-s3">
    <rect class="shell-read-eval-print-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="shell-read-eval-print-step" x="611" y="142">04</text>
    <text class="shell-read-eval-print-name" x="637" y="142">Execute</text>
    <text class="shell-read-eval-print-desc" x="611" y="166">Find the program on PATH,</text>
    <text class="shell-read-eval-print-desc" x="611" y="182">launch it, wait for it to</text>
    <text class="shell-read-eval-print-desc" x="611" y="198">finish.</text>
    <text class="shell-read-eval-print-edge" x="611" y="242">a child process</text>
  </g>
  <line class="shell-read-eval-print-line shell-read-eval-print-conn shell-read-eval-print-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#shell-read-eval-print-tip)"/>
  <g class="shell-read-eval-print-stage shell-read-eval-print-s4">
    <rect class="shell-read-eval-print-box" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="shell-read-eval-print-step" x="800" y="142">05</text>
    <text class="shell-read-eval-print-name" x="826" y="142">Print</text>
    <text class="shell-read-eval-print-desc" x="800" y="166">Its output reaches your</text>
    <text class="shell-read-eval-print-desc" x="800" y="182">screen; its exit code</text>
    <text class="shell-read-eval-print-desc" x="800" y="198">reaches the shell.</text>
    <text class="shell-read-eval-print-edge" x="800" y="242">$?</text>
  </g>
  <text class="shell-read-eval-print-sub" x="30" y="304">Every command you will run on a remote machine is this loop, with the network between Read and Execute.</text>
</svg>
