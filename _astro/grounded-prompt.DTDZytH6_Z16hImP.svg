<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four parts, in order.">
  <title>Assembling the grounded prompt</title>
  <style>
    .grounded-prompt-bg   { fill: #f8fafc; }
    .grounded-prompt-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grounded-prompt-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grounded-prompt-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grounded-prompt-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grounded-prompt-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grounded-prompt-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .grounded-prompt-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .grounded-prompt-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .grounded-prompt-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .grounded-prompt-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .grounded-prompt-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .grounded-prompt-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .grounded-prompt-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .grounded-prompt-stage { opacity: 1; }

    .grounded-prompt-s0 { animation-delay: 0.00s; }
    .grounded-prompt-e0 { animation-delay: 0.00s; }
    .grounded-prompt-s1 { animation-delay: 1.28s; }
    .grounded-prompt-e1 { animation-delay: 1.28s; }
    .grounded-prompt-s2 { animation-delay: 2.56s; }
    .grounded-prompt-e2 { animation-delay: 2.56s; }
    .grounded-prompt-s3 { animation-delay: 3.84s; }
    .grounded-prompt-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .grounded-prompt-conn  { animation: grounded-prompt-trace 6.4s ease-in-out infinite; }
      .grounded-prompt-stage { animation: grounded-prompt-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes grounded-prompt-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes grounded-prompt-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .grounded-prompt-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .grounded-prompt-stage { animation: grounded-prompt-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes grounded-prompt-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="grounded-prompt-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="grounded-prompt-bg" width="980" height="322"/>
  <text class="grounded-prompt-h1"  x="30" y="40">Assembling the grounded prompt</text>
  <text class="grounded-prompt-sub" x="30" y="64">Four parts, in order.</text>
  <g class="grounded-prompt-stage grounded-prompt-s0">
    <rect class="grounded-prompt-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="grounded-prompt-step" x="44" y="142">01</text>
    <text class="grounded-prompt-name" x="70" y="142">Instructions first</text>
    <text class="grounded-prompt-desc" x="44" y="166">Including the rule to answer</text>
    <text class="grounded-prompt-desc" x="44" y="182">only from the passages.</text>
  </g>
  <line class="grounded-prompt-line grounded-prompt-conn grounded-prompt-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#grounded-prompt-tip)"/>
  <g class="grounded-prompt-stage grounded-prompt-s1">
    <rect class="grounded-prompt-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="grounded-prompt-step" x="280" y="142">02</text>
    <text class="grounded-prompt-name" x="306" y="142">Then the passages, each labelled</text>
    <text class="grounded-prompt-desc" x="280" y="166">Delimited, and treated as</text>
    <text class="grounded-prompt-desc" x="280" y="182">untrusted content.</text>
  </g>
  <line class="grounded-prompt-line grounded-prompt-conn grounded-prompt-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#grounded-prompt-tip)"/>
  <g class="grounded-prompt-stage grounded-prompt-s2">
    <rect class="grounded-prompt-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="grounded-prompt-step" x="516" y="142">03</text>
    <text class="grounded-prompt-name" x="542" y="142">Then the question, last</text>
    <text class="grounded-prompt-desc" x="516" y="166">Where recency attention is</text>
    <text class="grounded-prompt-desc" x="516" y="182">strongest.</text>
  </g>
  <line class="grounded-prompt-line grounded-prompt-conn grounded-prompt-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#grounded-prompt-tip)"/>
  <g class="grounded-prompt-stage grounded-prompt-s3">
    <rect class="grounded-prompt-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="grounded-prompt-step" x="752" y="142">04</text>
    <text class="grounded-prompt-name" x="778" y="142">With an explicit instruction to decline</text>
    <text class="grounded-prompt-desc" x="752" y="166">If the passages do not contain</text>
    <text class="grounded-prompt-desc" x="752" y="182">the answer.</text>
  </g>
  <text class="grounded-prompt-sub" x="30" y="304">The instruction to decline is what makes grounding operative rather than decorative: without it, a model given irrelevant passages will answer from its own memory instead.</text>
</svg>
