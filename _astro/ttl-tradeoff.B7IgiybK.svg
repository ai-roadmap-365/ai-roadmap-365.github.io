<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Agility on one side, lookups on the other.">
  <title>The TTL you choose is a trade</title>
  <style>
    .ttl-tradeoff-bg   { fill: #f8fafc; }
    .ttl-tradeoff-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ttl-tradeoff-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ttl-tradeoff-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ttl-tradeoff-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ttl-tradeoff-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ttl-tradeoff-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ttl-tradeoff-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ttl-tradeoff-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ttl-tradeoff-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ttl-tradeoff-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ttl-tradeoff-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ttl-tradeoff-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ttl-tradeoff-row { opacity: 1; }
    .ttl-tradeoff-r0 { animation-delay: 0.00s; }
    .ttl-tradeoff-r1 { animation-delay: 0.45s; }
    .ttl-tradeoff-r2 { animation-delay: 0.90s; }
    .ttl-tradeoff-r3 { animation-delay: 1.35s; }
    .ttl-tradeoff-r4 { animation-delay: 1.80s; }
    .ttl-tradeoff-row { animation: ttl-tradeoff-reveal 7.3s ease-in-out infinite; }
    @keyframes ttl-tradeoff-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="ttl-tradeoff-bg" width="980" height="390"/>
  <text class="ttl-tradeoff-h1"  x="30" y="40">The TTL you choose is a trade</text>
  <text class="ttl-tradeoff-sub" x="30" y="64">Agility on one side, lookups on the other.</text>
  <rect class="ttl-tradeoff-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="ttl-tradeoff-name" x="46" y="122">Short TTL (60s)</text>
  <text class="ttl-tradeoff-desc" x="46" y="142">Changes land fast.</text>
  <text class="ttl-tradeoff-desc ttl-tradeoff-row ttl-tradeoff-r0" x="46" y="182">A migration propagates in a minute</text>
  <text class="ttl-tradeoff-desc ttl-tradeoff-row ttl-tradeoff-r1" x="46" y="216">Failover actually works</text>
  <text class="ttl-tradeoff-desc ttl-tradeoff-row ttl-tradeoff-r2" x="46" y="250">Many more lookups, from everyone</text>
  <text class="ttl-tradeoff-desc ttl-tradeoff-row ttl-tradeoff-r3" x="46" y="284">Your authoritative servers carry the load</text>
  <text class="ttl-tradeoff-desc ttl-tradeoff-row ttl-tradeoff-r4" x="46" y="318">An outage there hurts almost immediately</text>
  <rect class="ttl-tradeoff-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="ttl-tradeoff-name" x="526" y="122">Long TTL (24h)</text>
  <text class="ttl-tradeoff-desc" x="526" y="142">Cheap and stable.</text>
  <text class="ttl-tradeoff-desc ttl-tradeoff-row ttl-tradeoff-r0" x="526" y="182">Almost every lookup is served from cache</text>
  <text class="ttl-tradeoff-desc ttl-tradeoff-row ttl-tradeoff-r1" x="526" y="216">Very little load on your servers</text>
  <text class="ttl-tradeoff-desc ttl-tradeoff-row ttl-tradeoff-r2" x="526" y="250">An outage is invisible for hours</text>
  <text class="ttl-tradeoff-desc ttl-tradeoff-row ttl-tradeoff-r3" x="526" y="284">A change takes a day to fully propagate</text>
  <text class="ttl-tradeoff-desc ttl-tradeoff-row ttl-tradeoff-r4" x="526" y="318">A mistake takes a day to un-propagate</text>
  <text class="ttl-tradeoff-sub" x="30" y="372">The professional habit: lower the TTL a day BEFORE a planned change, make the change, then raise it again once the new value has settled.</text>
</svg>
