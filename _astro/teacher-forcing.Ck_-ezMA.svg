<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Train on truth, generate from yourself.">
  <title>Teacher forcing and exposure bias</title>
  <style>
    .teacher-forcing-bg   { fill: #f8fafc; }
    .teacher-forcing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .teacher-forcing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .teacher-forcing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .teacher-forcing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .teacher-forcing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .teacher-forcing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .teacher-forcing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .teacher-forcing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .teacher-forcing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .teacher-forcing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .teacher-forcing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .teacher-forcing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .teacher-forcing-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .teacher-forcing-stage { opacity: 1; }

    .teacher-forcing-s0 { animation-delay: 0.00s; }
    .teacher-forcing-e0 { animation-delay: 0.00s; }
    .teacher-forcing-s1 { animation-delay: 1.28s; }
    .teacher-forcing-e1 { animation-delay: 1.28s; }
    .teacher-forcing-s2 { animation-delay: 2.56s; }
    .teacher-forcing-e2 { animation-delay: 2.56s; }
    .teacher-forcing-s3 { animation-delay: 3.84s; }
    .teacher-forcing-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .teacher-forcing-conn  { animation: teacher-forcing-trace 6.4s ease-in-out infinite; }
      .teacher-forcing-stage { animation: teacher-forcing-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes teacher-forcing-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes teacher-forcing-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .teacher-forcing-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .teacher-forcing-stage { animation: teacher-forcing-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes teacher-forcing-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="teacher-forcing-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="teacher-forcing-bg" width="980" height="322"/>
  <text class="teacher-forcing-h1"  x="30" y="40">Teacher forcing and exposure bias</text>
  <text class="teacher-forcing-sub" x="30" y="64">Train on truth, generate from yourself.</text>
  <g class="teacher-forcing-stage teacher-forcing-s0">
    <rect class="teacher-forcing-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="teacher-forcing-step" x="44" y="142">01</text>
    <text class="teacher-forcing-name" x="70" y="142">Training feeds the true previous token</text>
    <text class="teacher-forcing-desc" x="44" y="166">So each step's input is correct</text>
    <text class="teacher-forcing-desc" x="44" y="182">regardless of earlier mistakes.</text>
  </g>
  <line class="teacher-forcing-line teacher-forcing-conn teacher-forcing-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#teacher-forcing-tip)"/>
  <g class="teacher-forcing-stage teacher-forcing-s1">
    <rect class="teacher-forcing-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="teacher-forcing-step" x="280" y="142">02</text>
    <text class="teacher-forcing-name" x="306" y="142">Generation feeds the model's own output</text>
    <text class="teacher-forcing-desc" x="280" y="166">So a mistake at step three</text>
    <text class="teacher-forcing-desc" x="280" y="182">conditions every step after it.</text>
  </g>
  <line class="teacher-forcing-line teacher-forcing-conn teacher-forcing-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#teacher-forcing-tip)"/>
  <g class="teacher-forcing-stage teacher-forcing-s2">
    <rect class="teacher-forcing-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="teacher-forcing-step" x="516" y="142">03</text>
    <text class="teacher-forcing-name" x="542" y="142">Which is a distribution mismatch</text>
    <text class="teacher-forcing-desc" x="516" y="166">The model never trained on its</text>
    <text class="teacher-forcing-desc" x="516" y="182">own imperfect prefixes.</text>
    <text class="teacher-forcing-edge" x="516" y="242">exposure bias</text>
  </g>
  <line class="teacher-forcing-line teacher-forcing-conn teacher-forcing-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#teacher-forcing-tip)"/>
  <g class="teacher-forcing-stage teacher-forcing-s3">
    <rect class="teacher-forcing-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="teacher-forcing-step" x="752" y="142">04</text>
    <text class="teacher-forcing-name" x="778" y="142">And errors compound in generation</text>
    <text class="teacher-forcing-desc" x="752" y="166">A drift the training signal</text>
    <text class="teacher-forcing-desc" x="752" y="182">never penalised.</text>
  </g>
  <text class="teacher-forcing-sub" x="30" y="304">Exposure bias is still present in modern language models trained the same way, which is part of why long generations can drift into repetition or incoherence that shorter ones do not show.</text>
</svg>
