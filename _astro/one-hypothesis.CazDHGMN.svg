<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The discipline that separates debugging from guessing.">
  <title>One hypothesis, one change, one test</title>
  <style>
    .one-hypothesis-bg   { fill: #f8fafc; }
    .one-hypothesis-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-hypothesis-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-hypothesis-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-hypothesis-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-hypothesis-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-hypothesis-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .one-hypothesis-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .one-hypothesis-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .one-hypothesis-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .one-hypothesis-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .one-hypothesis-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .one-hypothesis-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .one-hypothesis-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .one-hypothesis-stage { opacity: 1; }

    .one-hypothesis-s0 { animation-delay: 0.00s; }
    .one-hypothesis-e0 { animation-delay: 0.00s; }
    .one-hypothesis-s1 { animation-delay: 1.28s; }
    .one-hypothesis-e1 { animation-delay: 1.28s; }
    .one-hypothesis-s2 { animation-delay: 2.56s; }
    .one-hypothesis-e2 { animation-delay: 2.56s; }
    .one-hypothesis-s3 { animation-delay: 3.84s; }
    .one-hypothesis-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .one-hypothesis-conn  { animation: one-hypothesis-trace 6.4s ease-in-out infinite; }
      .one-hypothesis-stage { animation: one-hypothesis-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes one-hypothesis-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes one-hypothesis-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .one-hypothesis-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .one-hypothesis-stage { animation: one-hypothesis-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes one-hypothesis-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="one-hypothesis-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="one-hypothesis-bg" width="980" height="322"/>
  <text class="one-hypothesis-h1"  x="30" y="40">One hypothesis, one change, one test</text>
  <text class="one-hypothesis-sub" x="30" y="64">The discipline that separates debugging from guessing.</text>
  <g class="one-hypothesis-stage one-hypothesis-s0">
    <rect class="one-hypothesis-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="one-hypothesis-step" x="44" y="142">01</text>
    <text class="one-hypothesis-name" x="70" y="142">State it specifically</text>
    <text class="one-hypothesis-desc" x="44" y="166">"rows[0] has no 'amount' key" —</text>
    <text class="one-hypothesis-desc" x="44" y="182">checkable, not "the data is</text>
    <text class="one-hypothesis-desc" x="44" y="198">wrong".</text>
    <text class="one-hypothesis-edge" x="44" y="242">testable</text>
  </g>
  <line class="one-hypothesis-line one-hypothesis-conn one-hypothesis-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#one-hypothesis-tip)"/>
  <g class="one-hypothesis-stage one-hypothesis-s1">
    <rect class="one-hypothesis-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="one-hypothesis-step" x="280" y="142">02</text>
    <text class="one-hypothesis-name" x="306" y="142">Change ONE thing</text>
    <text class="one-hypothesis-desc" x="280" y="166">Two changes and a fix tells you</text>
    <text class="one-hypothesis-desc" x="280" y="182">nothing about which mattered.</text>
    <text class="one-hypothesis-edge" x="280" y="242">one</text>
  </g>
  <line class="one-hypothesis-line one-hypothesis-conn one-hypothesis-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#one-hypothesis-tip)"/>
  <g class="one-hypothesis-stage one-hypothesis-s2">
    <rect class="one-hypothesis-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="one-hypothesis-step" x="516" y="142">03</text>
    <text class="one-hypothesis-name" x="542" y="142">Observe</text>
    <text class="one-hypothesis-desc" x="516" y="166">Did it behave as the hypothesis</text>
    <text class="one-hypothesis-desc" x="516" y="182">predicted? Either answer is</text>
    <text class="one-hypothesis-desc" x="516" y="198">progress.</text>
  </g>
  <line class="one-hypothesis-line one-hypothesis-conn one-hypothesis-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#one-hypothesis-tip)"/>
  <g class="one-hypothesis-stage one-hypothesis-s3">
    <rect class="one-hypothesis-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="one-hypothesis-step" x="752" y="142">04</text>
    <text class="one-hypothesis-name" x="778" y="142">Halve the space</text>
    <text class="one-hypothesis-desc" x="752" y="166">Bisect the code, and bisect the</text>
    <text class="one-hypothesis-desc" x="752" y="182">input too.</text>
    <text class="one-hypothesis-edge" x="752" y="242">log n</text>
  </g>
  <text class="one-hypothesis-sub" x="30" y="304">Bisecting the input is the half people forget: halve the rows, and if it still fails you have removed half the data from the search without touching the code at all.</text>
</svg>
