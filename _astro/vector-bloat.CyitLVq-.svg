<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Storage is the quiet cost of a retrieval system.">
  <title>Embeddings are large, and they accumulate</title>
  <style>
    .vector-bloat-bg   { fill: #f8fafc; }
    .vector-bloat-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vector-bloat-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vector-bloat-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vector-bloat-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vector-bloat-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vector-bloat-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vector-bloat-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .vector-bloat-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .vector-bloat-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .vector-bloat-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .vector-bloat-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .vector-bloat-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .vector-bloat-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .vector-bloat-stage { opacity: 1; }

    .vector-bloat-s0 { animation-delay: 0.00s; }
    .vector-bloat-e0 { animation-delay: 0.00s; }
    .vector-bloat-s1 { animation-delay: 1.28s; }
    .vector-bloat-e1 { animation-delay: 1.28s; }
    .vector-bloat-s2 { animation-delay: 2.56s; }
    .vector-bloat-e2 { animation-delay: 2.56s; }
    .vector-bloat-s3 { animation-delay: 3.84s; }
    .vector-bloat-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .vector-bloat-conn  { animation: vector-bloat-trace 6.4s ease-in-out infinite; }
      .vector-bloat-stage { animation: vector-bloat-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes vector-bloat-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes vector-bloat-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .vector-bloat-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .vector-bloat-stage { animation: vector-bloat-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes vector-bloat-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="vector-bloat-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="vector-bloat-bg" width="980" height="322"/>
  <text class="vector-bloat-h1"  x="30" y="40">Embeddings are large, and they accumulate</text>
  <text class="vector-bloat-sub" x="30" y="64">Storage is the quiet cost of a retrieval system.</text>
  <g class="vector-bloat-stage vector-bloat-s0">
    <rect class="vector-bloat-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="vector-bloat-step" x="44" y="142">01</text>
    <text class="vector-bloat-name" x="70" y="142">One vector</text>
    <text class="vector-bloat-desc" x="44" y="166">1,536 dimensions at 4 bytes is</text>
    <text class="vector-bloat-desc" x="44" y="182">about 6 KB, before any index.</text>
    <text class="vector-bloat-edge" x="44" y="242">~6 KB</text>
  </g>
  <line class="vector-bloat-line vector-bloat-conn vector-bloat-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#vector-bloat-tip)"/>
  <g class="vector-bloat-stage vector-bloat-s1">
    <rect class="vector-bloat-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="vector-bloat-step" x="280" y="142">02</text>
    <text class="vector-bloat-name" x="306" y="142">Times the corpus</text>
    <text class="vector-bloat-desc" x="280" y="166">A million chunks is 6 GB of raw</text>
    <text class="vector-bloat-desc" x="280" y="182">vectors alone.</text>
    <text class="vector-bloat-edge" x="280" y="242">6 GB</text>
  </g>
  <line class="vector-bloat-line vector-bloat-conn vector-bloat-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#vector-bloat-tip)"/>
  <g class="vector-bloat-stage vector-bloat-s2">
    <rect class="vector-bloat-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="vector-bloat-step" x="516" y="142">03</text>
    <text class="vector-bloat-name" x="542" y="142">Plus the index</text>
    <text class="vector-bloat-desc" x="516" y="166">Graph indexes add substantially,</text>
    <text class="vector-bloat-desc" x="516" y="182">and must sit in memory to be</text>
    <text class="vector-bloat-desc" x="516" y="198">fast.</text>
  </g>
  <line class="vector-bloat-line vector-bloat-conn vector-bloat-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#vector-bloat-tip)"/>
  <g class="vector-bloat-stage vector-bloat-s3">
    <rect class="vector-bloat-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="vector-bloat-step" x="752" y="142">04</text>
    <text class="vector-bloat-name" x="778" y="142">The levers</text>
    <text class="vector-bloat-desc" x="752" y="166">Fewer dimensions, quantisation,</text>
    <text class="vector-bloat-desc" x="752" y="182">or fewer chunks. All trade</text>
    <text class="vector-bloat-desc" x="752" y="198">recall for size.</text>
    <text class="vector-bloat-edge" x="752" y="242">trade</text>
  </g>
  <text class="vector-bloat-sub" x="30" y="304">Re-embedding the whole corpus when you change model or chunk size is the cost people forget: it is not a migration you can do incrementally, and it must fit in the budget from Day 351.</text>
</svg>
