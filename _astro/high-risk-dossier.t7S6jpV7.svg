<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four articles, four artefacts.">
  <title>What a high-risk dossier contains</title>
  <style>
    .high-risk-dossier-bg   { fill: #f8fafc; }
    .high-risk-dossier-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .high-risk-dossier-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .high-risk-dossier-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .high-risk-dossier-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .high-risk-dossier-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .high-risk-dossier-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .high-risk-dossier-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .high-risk-dossier-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .high-risk-dossier-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .high-risk-dossier-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .high-risk-dossier-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .high-risk-dossier-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .high-risk-dossier-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .high-risk-dossier-stage { opacity: 1; }

    .high-risk-dossier-s0 { animation-delay: 0.00s; }
    .high-risk-dossier-e0 { animation-delay: 0.00s; }
    .high-risk-dossier-s1 { animation-delay: 1.28s; }
    .high-risk-dossier-e1 { animation-delay: 1.28s; }
    .high-risk-dossier-s2 { animation-delay: 2.56s; }
    .high-risk-dossier-e2 { animation-delay: 2.56s; }
    .high-risk-dossier-s3 { animation-delay: 3.84s; }
    .high-risk-dossier-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .high-risk-dossier-conn  { animation: high-risk-dossier-trace 6.4s ease-in-out infinite; }
      .high-risk-dossier-stage { animation: high-risk-dossier-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes high-risk-dossier-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes high-risk-dossier-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .high-risk-dossier-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .high-risk-dossier-stage { animation: high-risk-dossier-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes high-risk-dossier-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="high-risk-dossier-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="high-risk-dossier-bg" width="980" height="322"/>
  <text class="high-risk-dossier-h1"  x="30" y="40">What a high-risk dossier contains</text>
  <text class="high-risk-dossier-sub" x="30" y="64">Four articles, four artefacts.</text>
  <g class="high-risk-dossier-stage high-risk-dossier-s0">
    <rect class="high-risk-dossier-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="high-risk-dossier-step" x="44" y="142">01</text>
    <text class="high-risk-dossier-name" x="70" y="142">Article 9: risk management</text>
    <text class="high-risk-dossier-desc" x="44" y="166">Continuous and iterative across</text>
    <text class="high-risk-dossier-desc" x="44" y="182">the lifecycle, not a one-time</text>
    <text class="high-risk-dossier-desc" x="44" y="198">assessment.</text>
  </g>
  <line class="high-risk-dossier-line high-risk-dossier-conn high-risk-dossier-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#high-risk-dossier-tip)"/>
  <g class="high-risk-dossier-stage high-risk-dossier-s1">
    <rect class="high-risk-dossier-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="high-risk-dossier-step" x="280" y="142">02</text>
    <text class="high-risk-dossier-name" x="306" y="142">Article 10: data governance</text>
    <text class="high-risk-dossier-desc" x="280" y="166">Dataset provenance, collection</text>
    <text class="high-risk-dossier-desc" x="280" y="182">methodology, demographic</text>
    <text class="high-risk-dossier-desc" x="280" y="198">representation, bias mitigation.</text>
  </g>
  <line class="high-risk-dossier-line high-risk-dossier-conn high-risk-dossier-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#high-risk-dossier-tip)"/>
  <g class="high-risk-dossier-stage high-risk-dossier-s2">
    <rect class="high-risk-dossier-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="high-risk-dossier-step" x="516" y="142">03</text>
    <text class="high-risk-dossier-name" x="542" y="142">Articles 11-12: records</text>
    <text class="high-risk-dossier-desc" x="516" y="166">Architecture, algorithms,</text>
    <text class="high-risk-dossier-desc" x="516" y="182">dependencies, and automated</text>
    <text class="high-risk-dossier-desc" x="516" y="198">operational logging.</text>
  </g>
  <line class="high-risk-dossier-line high-risk-dossier-conn high-risk-dossier-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#high-risk-dossier-tip)"/>
  <g class="high-risk-dossier-stage high-risk-dossier-s3">
    <rect class="high-risk-dossier-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="high-risk-dossier-step" x="752" y="142">04</text>
    <text class="high-risk-dossier-name" x="778" y="142">Article 14: human oversight</text>
    <text class="high-risk-dossier-desc" x="752" y="166">Interfaces that let a qualified</text>
    <text class="high-risk-dossier-desc" x="752" y="182">overseer understand outputs and</text>
    <text class="high-risk-dossier-desc" x="752" y="198">halt operation.</text>
    <text class="high-risk-dossier-edge" x="752" y="242">kill switch</text>
  </g>
  <text class="high-risk-dossier-sub" x="30" y="304">Article 14 is the one with real engineering content: an override that exists in a runbook but not in the interface is not oversight, because the person expected to use it cannot reach it during an autonomous run.</text>
</svg>
