<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="MCP Stdio Framing vs Stderr Logging">
  <title>MCP Stdio Framing vs Stderr Logging</title>
  <defs>
    <style>
      .d296f-bg { fill: #f8fafc; }
      .d296f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d296f-good { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d296f-err { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; rx: 8px; }
      .d296f-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d296f-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d296f-header { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
      .d296f-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .d296f-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d296f-bg" />
  
  <text x="40" y="40" class="d296f-title">Stdio Stream Discipline: stdout vs stderr</text>
  <text x="40" y="65" class="d296f-subtitle">MCP Stdio Framing vs Stderr Logging diagram contrasting clean stdout JSON-RPC messaging with isolated stderr diagnostic logs</text>
  
  <!-- Correct Pattern -->
  <rect x="40" y="100" width="380" height="300" class="d296f-good" />
  <text x="60" y="130" class="d296f-header" fill="#1d4ed8">CORRECT: Clean Stream Separation</text>
  <text x="60" y="160" class="d296f-text" font-weight="600">Standard Output (stdout):</text>
  <text x="60" y="180" class="d296f-code" fill="#15803d">{"jsonrpc":"2.0","id":1,"result":{...}}
</text>
  <text x="60" y="210" class="d296f-text" font-weight="600">Standard Error (stderr):</text>
  <text x="60" y="230" class="d296f-code" fill="#475569">DEBUG: Connected to SQLite database</text>
  <text x="60" y="250" class="d296f-code" fill="#475569">INFO: Executed SELECT in 1.4ms</text>
  <text x="60" y="290" class="d296f-text" fill="#1e40af" font-weight="600">Result: Client parses JSON-RPC cleanly with zero parse errors</text>
  
  <!-- Broken Anti-Pattern -->
  <rect x="480" y="100" width="380" height="300" class="d296f-err" />
  <text x="500" y="130" class="d296f-header" fill="#dc2626">FATAL ANTI-PATTERN: Corrupted stdout</text>
  <text x="500" y="160" class="d296f-text" font-weight="600">Accidental print() to stdout:</text>
  <text x="500" y="180" class="d296f-code" fill="#b91c1c">print("Database connected successfully!")</text>
  <text x="500" y="200" class="d296f-code" fill="#b91c1c">{"jsonrpc":"2.0","id":1,"result":{...}}</text>
  <text x="500" y="240" class="d296f-text" font-weight="600">Client Parse Failure:</text>
  <text x="500" y="260" class="d296f-code" fill="#7f1d1d">JSONDecodeError: Extra data at byte 0</text>
  <text x="500" y="290" class="d296f-text" fill="#991b1b" font-weight="700">Result: Client crashes or drops server connection</text>
</svg>