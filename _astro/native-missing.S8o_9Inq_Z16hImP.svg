<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Native missing handling</title>
  <style>
    .native-missing-bg   { fill: #f8fafc; }
    .native-missing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .native-missing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .native-missing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .native-missing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .native-missing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .native-missing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .native-missing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .native-missing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .native-missing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .native-missing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .native-missing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .native-missing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .native-missing-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .native-missing-stage { opacity: 1; }

    .native-missing-s0 { animation-delay: 0.00s; }
    .native-missing-e0 { animation-delay: 0.00s; }
    .native-missing-s1 { animation-delay: 1.28s; }
    .native-missing-e1 { animation-delay: 1.28s; }
    .native-missing-s2 { animation-delay: 2.56s; }
    .native-missing-e2 { animation-delay: 2.56s; }
    .native-missing-s3 { animation-delay: 3.84s; }
    .native-missing-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .native-missing-conn  { animation: native-missing-trace 6.4s ease-in-out infinite; }
      .native-missing-stage { animation: native-missing-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes native-missing-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes native-missing-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .native-missing-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .native-missing-stage { animation: native-missing-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes native-missing-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="native-missing-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="native-missing-bg" width="980" height="322"/>
  <text class="native-missing-h1"  x="30" y="40">Native missing handling</text>
  <text class="native-missing-sub" x="30" y="64">Four steps.</text>
  <g class="native-missing-stage native-missing-s0">
    <rect class="native-missing-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="native-missing-step" x="44" y="142">01</text>
    <text class="native-missing-name" x="70" y="142">At each split, present values go left or right as usual</text>
    <text class="native-missing-desc" x="44" y="166">By the threshold.</text>
  </g>
  <line class="native-missing-line native-missing-conn native-missing-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#native-missing-tip)"/>
  <g class="native-missing-stage native-missing-s1">
    <rect class="native-missing-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="native-missing-step" x="280" y="142">02</text>
    <text class="native-missing-name" x="306" y="142">Missing values must go somewhere</text>
    <text class="native-missing-desc" x="280" y="166">Both directions are tried.</text>
  </g>
  <line class="native-missing-line native-missing-conn native-missing-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#native-missing-tip)"/>
  <g class="native-missing-stage native-missing-s2">
    <rect class="native-missing-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="native-missing-step" x="516" y="142">03</text>
    <text class="native-missing-name" x="542" y="142">And whichever reduces the loss more becomes the default</text>
    <text class="native-missing-desc" x="516" y="166">Learned per split, from the</text>
    <text class="native-missing-desc" x="516" y="182">data.</text>
  </g>
  <line class="native-missing-line native-missing-conn native-missing-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#native-missing-tip)"/>
  <g class="native-missing-stage native-missing-s3">
    <rect class="native-missing-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="native-missing-step" x="752" y="142">04</text>
    <text class="native-missing-name" x="778" y="142">So missingness is modelled rather than filled in</text>
    <text class="native-missing-desc" x="752" y="166">Which usually beats imputation.</text>
    <text class="native-missing-edge" x="752" y="242">free</text>
  </g>
  <text class="native-missing-sub" x="30" y="304">Learning the direction per split means the model can treat missingness differently in different regions, which no single imputation strategy can express.</text>
</svg>
