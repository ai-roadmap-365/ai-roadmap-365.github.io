<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Five conveniences, one base class.">
  <title>What nn.Module inherits for you</title>
  <style>
    .module-benefits-bg   { fill: #f8fafc; }
    .module-benefits-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .module-benefits-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .module-benefits-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .module-benefits-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .module-benefits-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .module-benefits-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .module-benefits-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .module-benefits-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .module-benefits-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .module-benefits-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .module-benefits-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .module-benefits-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .module-benefits-row { opacity: 1; }
    .module-benefits-r0 { animation-delay: 0.00s; }
    .module-benefits-r1 { animation-delay: 0.45s; }
    .module-benefits-r2 { animation-delay: 0.90s; }
    .module-benefits-r3 { animation-delay: 1.35s; }
    .module-benefits-r4 { animation-delay: 1.80s; }
    .module-benefits-row { animation: module-benefits-reveal 7.3s ease-in-out infinite; }
    @keyframes module-benefits-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="module-benefits-bg" width="980" height="390"/>
  <text class="module-benefits-h1"  x="30" y="40">What nn.Module inherits for you</text>
  <text class="module-benefits-sub" x="30" y="64">Five conveniences, one base class.</text>
  <rect class="module-benefits-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="module-benefits-name" x="46" y="122">By hand</text>
  <text class="module-benefits-desc" x="46" y="142">Every list maintained.</text>
  <text class="module-benefits-desc module-benefits-row module-benefits-r0" x="46" y="182">Collect every parameter yourself</text>
  <text class="module-benefits-desc module-benefits-row module-benefits-r1" x="46" y="216">Move each one to the device yourself</text>
  <text class="module-benefits-desc module-benefits-row module-benefits-r2" x="46" y="250">Serialise them by hand</text>
  <text class="module-benefits-desc module-benefits-row module-benefits-r3" x="46" y="284">Track train and eval behaviour manually</text>
  <text class="module-benefits-desc module-benefits-row module-benefits-r4" x="46" y="318">One forgotten tensor breaks it silently</text>
  <rect class="module-benefits-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="module-benefits-name" x="526" y="122">A module base class</text>
  <text class="module-benefits-desc" x="526" y="142">Registered automatically.</text>
  <text class="module-benefits-desc module-benefits-row module-benefits-r0" x="526" y="182">Assigning a parameter registers it</text>
  <text class="module-benefits-desc module-benefits-row module-benefits-r1" x="526" y="216">parameters() finds them recursively</text>
  <text class="module-benefits-desc module-benefits-row module-benefits-r2" x="526" y="250">to(device) migrates everything</text>
  <text class="module-benefits-desc module-benefits-row module-benefits-r3" x="526" y="284">state_dict() serialises everything</text>
  <text class="module-benefits-desc module-benefits-row module-benefits-r4" x="526" y="318">train() and eval() propagate to submodules</text>
  <text class="module-benefits-sub" x="30" y="372">The recursion is what makes this scale: a model of modules of modules is migrated, serialised and mode-switched by one call, and a manually maintained list of tensors is not.</text>
</svg>
