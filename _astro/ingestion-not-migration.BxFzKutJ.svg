<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Each confusion has a cost.">
  <title>Three things a pipeline is not</title>
  <style>
    .ingestion-not-migration-bg   { fill: #f8fafc; }
    .ingestion-not-migration-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ingestion-not-migration-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ingestion-not-migration-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ingestion-not-migration-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ingestion-not-migration-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ingestion-not-migration-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ingestion-not-migration-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ingestion-not-migration-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ingestion-not-migration-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ingestion-not-migration-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ingestion-not-migration-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ingestion-not-migration-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ingestion-not-migration-row { opacity: 1; }
    .ingestion-not-migration-r0 { animation-delay: 0.00s; }
    .ingestion-not-migration-r1 { animation-delay: 0.45s; }
    .ingestion-not-migration-r2 { animation-delay: 0.90s; }
    .ingestion-not-migration-r3 { animation-delay: 1.35s; }
    .ingestion-not-migration-r4 { animation-delay: 1.80s; }
    .ingestion-not-migration-row { animation: ingestion-not-migration-reveal 7.3s ease-in-out infinite; }
    @keyframes ingestion-not-migration-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="ingestion-not-migration-bg" width="980" height="390"/>
  <text class="ingestion-not-migration-h1"  x="30" y="40">Three things a pipeline is not</text>
  <text class="ingestion-not-migration-sub" x="30" y="64">Each confusion has a cost.</text>
  <rect class="ingestion-not-migration-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="ingestion-not-migration-name" x="46" y="122">What it is</text>
  <text class="ingestion-not-migration-desc" x="46" y="142">Three properties.</text>
  <text class="ingestion-not-migration-desc ingestion-not-migration-row ingestion-not-migration-r0" x="46" y="182">Stateful: cursors and hashes</text>
  <text class="ingestion-not-migration-desc ingestion-not-migration-row ingestion-not-migration-r1" x="46" y="216">A contract with the index about what an id means</text>
  <text class="ingestion-not-migration-desc ingestion-not-migration-row ingestion-not-migration-r2" x="46" y="250">An operational surface with a schedule and a lag metric</text>
  <text class="ingestion-not-migration-desc ingestion-not-migration-row ingestion-not-migration-r3" x="46" y="284">Predictable at 3 a.m.</text>
  <text class="ingestion-not-migration-desc ingestion-not-migration-row ingestion-not-migration-r4" x="46" y="318">Boring, deliberately</text>
  <rect class="ingestion-not-migration-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="ingestion-not-migration-name" x="526" y="122">Three conflations</text>
  <text class="ingestion-not-migration-desc" x="526" y="142">All common.</text>
  <text class="ingestion-not-migration-desc ingestion-not-migration-row ingestion-not-migration-r0" x="526" y="182">Not chunking or embedding — those are stages inside it</text>
  <text class="ingestion-not-migration-desc ingestion-not-migration-row ingestion-not-migration-r1" x="526" y="216">Not a migration — a migration runs once and is discarded</text>
  <text class="ingestion-not-migration-desc ingestion-not-migration-row ingestion-not-migration-r2" x="526" y="250">Not a place for cleverness</text>
  <text class="ingestion-not-migration-desc ingestion-not-migration-row ingestion-not-migration-r3" x="526" y="284">A pipeline runs forever</text>
  <text class="ingestion-not-migration-desc ingestion-not-migration-row ingestion-not-migration-r4" x="526" y="318">So its failure modes compound</text>
  <text class="ingestion-not-migration-sub" x="30" y="372">The middle conflation is the expensive one: migration code is written to be correct once, and the same code scheduled nightly accumulates every failure mode nobody bothered to handle.</text>
</svg>
