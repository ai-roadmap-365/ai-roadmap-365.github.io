<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="AI Code Review Verification Pyramid">
  <title>AI Code Review Verification Pyramid</title>
  <defs>
    <style>
      .d306a-bg { fill: #f8fafc; }
      .d306a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d306a-l1 { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; }
      .d306a-l2 { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; }
      .d306a-l3 { fill: #fefce8; stroke: #eab308; stroke-width: 2px; }
      .d306a-l4 { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; }
      .d306a-l5 { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; }
      .d306a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d306a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d306a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d306a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d306a-bg" />
  
  <text x="40" y="40" class="d306a-title">The 5-Layer AI Code Verification Defense-in-Depth</text>
  <text x="40" y="65" class="d306a-subtitle">AI Code Review Verification Pyramid showing Automated Static Linters, Type Checkers, Security Scanners, Unit &amp; Mutation Tests, and Human Architectural Review</text>
  
  <!-- Pyramid Layers -->
  <!-- Layer 5: Human Architecture (Top) -->
  <polygon points="350,110 550,110 580,160 320,160" class="d306a-l5" />
  <text x="450" y="135" text-anchor="middle" class="d306a-header" fill="#991b1b">5. Human Architectural Review</text>
  <text x="450" y="152" text-anchor="middle" class="d306a-text">Business logic, data privacy, edge cases</text>
  
  <!-- Layer 4: Mutation & Integration Tests -->
  <polygon points="320,165 580,165 610,215 290,215" class="d306a-l4" />
  <text x="450" y="190" text-anchor="middle" class="d306a-header" fill="#15803d">4. Mutation &amp; Integration Testing</text>
  <text x="450" y="207" text-anchor="middle" class="d306a-text">Verifies tests fail on mutated buggy code</text>
  
  <!-- Layer 3: Security & Dependency Scan -->
  <polygon points="290,220 610,220 640,270 260,270" class="d306a-l3" />
  <text x="450" y="245" text-anchor="middle" class="d306a-header" fill="#a16207">3. Security &amp; Supply-Chain Audits</text>
  <text x="450" y="262" text-anchor="middle" class="d306a-text">`bandit`, `pip-audit`, slopsquatting check</text>
  
  <!-- Layer 2: Static Type Checkers -->
  <polygon points="260,275 640,275 670,325 230,325" class="d306a-l2" />
  <text x="450" y="300" text-anchor="middle" class="d306a-header" fill="#7e22ce">2. Strict Static Typing</text>
  <text x="450" y="317" text-anchor="middle" class="d306a-text">`mypy --strict`, signature validation</text>
  
  <!-- Layer 1: Deterministic Linters (Bottom) -->
  <polygon points="230,330 670,330 700,380 200,380" class="d306a-l1" />
  <text x="450" y="355" text-anchor="middle" class="d306a-header" fill="#1d4ed8">1. Automated Formatting &amp; Linters</text>
  <text x="450" y="372" text-anchor="middle" class="d306a-text">`ruff check`, syntax, unused imports</text>
</svg>