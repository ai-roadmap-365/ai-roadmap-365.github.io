<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Mostly by measuring the wrong thing.">
  <title>Four ways red teaming fails</title>
  <style>
    .red-team-hazards-bg   { fill: #f8fafc; }
    .red-team-hazards-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .red-team-hazards-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .red-team-hazards-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .red-team-hazards-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .red-team-hazards-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .red-team-hazards-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .red-team-hazards-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .red-team-hazards-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .red-team-hazards-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .red-team-hazards-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .red-team-hazards-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .red-team-hazards-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .red-team-hazards-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .red-team-hazards-stage { opacity: 1; }

    .red-team-hazards-s0 { animation-delay: 0.00s; }
    .red-team-hazards-e0 { animation-delay: 0.00s; }
    .red-team-hazards-s1 { animation-delay: 1.28s; }
    .red-team-hazards-e1 { animation-delay: 1.28s; }
    .red-team-hazards-s2 { animation-delay: 2.56s; }
    .red-team-hazards-e2 { animation-delay: 2.56s; }
    .red-team-hazards-s3 { animation-delay: 3.84s; }
    .red-team-hazards-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .red-team-hazards-conn  { animation: red-team-hazards-trace 6.4s ease-in-out infinite; }
      .red-team-hazards-stage { animation: red-team-hazards-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes red-team-hazards-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes red-team-hazards-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .red-team-hazards-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .red-team-hazards-stage { animation: red-team-hazards-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes red-team-hazards-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="red-team-hazards-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="red-team-hazards-bg" width="980" height="322"/>
  <text class="red-team-hazards-h1"  x="30" y="40">Four ways red teaming fails</text>
  <text class="red-team-hazards-sub" x="30" y="64">Mostly by measuring the wrong thing.</text>
  <g class="red-team-hazards-stage red-team-hazards-s0">
    <rect class="red-team-hazards-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="red-team-hazards-step" x="44" y="142">01</text>
    <text class="red-team-hazards-name" x="70" y="142">Single-turn coverage only</text>
    <text class="red-team-hazards-desc" x="44" y="166">Misses every crescendo, and</text>
    <text class="red-team-hazards-desc" x="44" y="182">reports a low ASR while doing</text>
    <text class="red-team-hazards-desc" x="44" y="198">so.</text>
  </g>
  <line class="red-team-hazards-line red-team-hazards-conn red-team-hazards-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#red-team-hazards-tip)"/>
  <g class="red-team-hazards-stage red-team-hazards-s1">
    <rect class="red-team-hazards-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="red-team-hazards-step" x="280" y="142">02</text>
    <text class="red-team-hazards-name" x="306" y="142">An unreliable judge</text>
    <text class="red-team-hazards-desc" x="280" y="166">A vague rubric makes the ASR</text>
    <text class="red-team-hazards-desc" x="280" y="182">figure meaningless in both</text>
    <text class="red-team-hazards-desc" x="280" y="198">directions.</text>
  </g>
  <line class="red-team-hazards-line red-team-hazards-conn red-team-hazards-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#red-team-hazards-tip)"/>
  <g class="red-team-hazards-stage red-team-hazards-s2">
    <rect class="red-team-hazards-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="red-team-hazards-step" x="516" y="142">03</text>
    <text class="red-team-hazards-name" x="542" y="142">Run manually, before launch</text>
    <text class="red-team-hazards-desc" x="516" y="166">So a prompt change three weeks</text>
    <text class="red-team-hazards-desc" x="516" y="182">later reintroduces everything.</text>
  </g>
  <line class="red-team-hazards-line red-team-hazards-conn red-team-hazards-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#red-team-hazards-tip)"/>
  <g class="red-team-hazards-stage red-team-hazards-s3">
    <rect class="red-team-hazards-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="red-team-hazards-step" x="752" y="142">04</text>
    <text class="red-team-hazards-name" x="778" y="142">Safety fixes that break the product</text>
    <text class="red-team-hazards-desc" x="752" y="166">Check retention on standard</text>
    <text class="red-team-hazards-desc" x="752" y="182">benchmarks, not only ASR.</text>
    <text class="red-team-hazards-edge" x="752" y="242">both metrics</text>
  </g>
  <text class="red-team-hazards-sub" x="30" y="304">The fourth is the one that gets safety work reverted: a guardrail that drives ASR to zero by refusing everything is a regression, and only a utility benchmark alongside it will say so.</text>
</svg>
