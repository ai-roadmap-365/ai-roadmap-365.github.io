<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Cheap first, expensive on escalation.">
  <title>Tiered routing</title>
  <style>
    .routing-bg   { fill: #f8fafc; }
    .routing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .routing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .routing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .routing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .routing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .routing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .routing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .routing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .routing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .routing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .routing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .routing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .routing-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .routing-stage { opacity: 1; }

    .routing-s0 { animation-delay: 0.00s; }
    .routing-e0 { animation-delay: 0.00s; }
    .routing-s1 { animation-delay: 1.28s; }
    .routing-e1 { animation-delay: 1.28s; }
    .routing-s2 { animation-delay: 2.56s; }
    .routing-e2 { animation-delay: 2.56s; }
    .routing-s3 { animation-delay: 3.84s; }
    .routing-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .routing-conn  { animation: routing-trace 6.4s ease-in-out infinite; }
      .routing-stage { animation: routing-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes routing-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes routing-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .routing-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .routing-stage { animation: routing-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes routing-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="routing-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="routing-bg" width="980" height="322"/>
  <text class="routing-h1"  x="30" y="40">Tiered routing</text>
  <text class="routing-sub" x="30" y="64">Cheap first, expensive on escalation.</text>
  <g class="routing-stage routing-s0">
    <rect class="routing-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="routing-step" x="44" y="142">01</text>
    <text class="routing-name" x="70" y="142">Classify the request</text>
    <text class="routing-desc" x="44" y="166">By difficulty, or by a cheap</text>
    <text class="routing-desc" x="44" y="182">model's own confidence.</text>
  </g>
  <line class="routing-line routing-conn routing-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#routing-tip)"/>
  <g class="routing-stage routing-s1">
    <rect class="routing-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="routing-step" x="280" y="142">02</text>
    <text class="routing-name" x="306" y="142">Send most of it to a small model</text>
    <text class="routing-desc" x="280" y="166">Which handles the large majority</text>
    <text class="routing-desc" x="280" y="182">adequately.</text>
  </g>
  <line class="routing-line routing-conn routing-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#routing-tip)"/>
  <g class="routing-stage routing-s2">
    <rect class="routing-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="routing-step" x="516" y="142">03</text>
    <text class="routing-name" x="542" y="142">Escalate what it cannot do</text>
    <text class="routing-desc" x="516" y="166">To the expensive model, on a</text>
    <text class="routing-desc" x="516" y="182">measurable trigger.</text>
  </g>
  <line class="routing-line routing-conn routing-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#routing-tip)"/>
  <g class="routing-stage routing-s3">
    <rect class="routing-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="routing-step" x="752" y="142">04</text>
    <text class="routing-name" x="778" y="142">Most of the quality, a fraction of the cost</text>
    <text class="routing-desc" x="752" y="166">Which is why nearly every</text>
    <text class="routing-desc" x="752" y="182">production system does this.</text>
    <text class="routing-edge" x="752" y="242">5-10x</text>
  </g>
  <text class="routing-sub" x="30" y="304">The escalation trigger is the whole design: a router that escalates on the wrong signal either wastes the saving or ships bad answers, and it needs its own evaluation.</text>
</svg>
