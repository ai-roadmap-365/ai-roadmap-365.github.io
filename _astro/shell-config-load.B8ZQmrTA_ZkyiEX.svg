<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 520" role="img" font-family="system-ui, sans-serif">
  <title>Which shell configuration files load for a login shell versus an interactive non-login shell, in bash and zsh</title>
  <rect x="0" y="0" width="740" height="520" fill="#f8fafc"/>
  <text x="370" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Which config files load, and when</text>

  <!-- Left column: login shell -->
  <rect x="30" y="58" width="330" height="410" fill="#eef2ff" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="195" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Login shell</text>
  <text x="195" y="106" text-anchor="middle" font-size="13" fill="#1a202c">e.g. an SSH session; a new macOS</text>
  <text x="195" y="123" text-anchor="middle" font-size="13" fill="#1a202c">Terminal tab</text>

  <text x="60" y="152" font-size="14" font-weight="bold" fill="#1d4ed8">bash reads, in order:</text>
  <rect x="60" y="162" width="270" height="34" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="72" y="184" font-size="14" fill="#1a202c">1. /etc/profile  (system-wide)</text>
  <rect x="60" y="202" width="270" height="34" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="72" y="224" font-size="13" fill="#1a202c">2. first of ~/.bash_profile,</text>
  <text x="72" y="240" font-size="0" fill="#1a202c"> </text>
  <text x="200" y="240" text-anchor="middle" font-size="0" fill="#1a202c"> </text>
  <text x="80" y="240" font-size="13" fill="#1a202c">    ~/.bash_login, ~/.profile</text>

  <text x="60" y="292" font-size="14" font-weight="bold" fill="#1d4ed8">zsh reads, in order:</text>
  <rect x="60" y="302" width="270" height="34" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="72" y="324" font-size="14" fill="#1a202c">1. ~/.zshenv   (always)</text>
  <rect x="60" y="342" width="270" height="34" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="72" y="364" font-size="14" fill="#1a202c">2. ~/.zprofile (login only)</text>
  <rect x="60" y="382" width="270" height="34" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="72" y="404" font-size="14" fill="#1a202c">3. ~/.zshrc    (interactive)</text>

  <text x="195" y="446" text-anchor="middle" font-size="13" fill="#1a202c">A login shell is also interactive,</text>
  <text x="195" y="462" text-anchor="middle" font-size="13" fill="#1a202c">so ~/.zshrc runs here too.</text>

  <!-- Right column: interactive non-login -->
  <rect x="380" y="58" width="330" height="410" fill="#eef2ff" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="545" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Interactive, non-login shell</text>
  <text x="545" y="106" text-anchor="middle" font-size="13" fill="#1a202c">e.g. opening a second terminal on a</text>
  <text x="545" y="123" text-anchor="middle" font-size="13" fill="#1a202c">Linux desktop; typing bash inside one</text>

  <text x="410" y="152" font-size="14" font-weight="bold" fill="#1d4ed8">bash reads:</text>
  <rect x="410" y="162" width="270" height="34" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="422" y="184" font-size="14" fill="#1a202c">~/.bashrc   (not .bash_profile)</text>

  <text x="410" y="292" font-size="14" font-weight="bold" fill="#1d4ed8">zsh reads:</text>
  <rect x="410" y="302" width="270" height="34" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="422" y="324" font-size="14" fill="#1a202c">~/.zshenv   (always)</text>
  <rect x="410" y="342" width="270" height="34" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="422" y="364" font-size="14" fill="#1a202c">~/.zshrc    (interactive)</text>

  <text x="545" y="430" text-anchor="middle" font-size="13" fill="#1a202c">This is why the common tip is:</text>
  <text x="545" y="448" text-anchor="middle" font-size="13" fill="#1a202c">have ~/.bash_profile source</text>
  <text x="545" y="464" text-anchor="middle" font-size="13" fill="#1a202c">~/.bashrc so both cases match.</text>

  <text x="370" y="498" text-anchor="middle" font-size="14" fill="#1a202c">Put settings in the file the shell actually reads, or they silently do nothing.</text>
</svg>
