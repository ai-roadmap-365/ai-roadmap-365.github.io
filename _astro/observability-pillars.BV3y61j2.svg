<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Only one needs labels.">
  <title>Four things to monitor</title>
  <style>
    .observability-pillars-bg   { fill: #f8fafc; }
    .observability-pillars-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .observability-pillars-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .observability-pillars-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .observability-pillars-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .observability-pillars-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .observability-pillars-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .observability-pillars-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .observability-pillars-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .observability-pillars-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .observability-pillars-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .observability-pillars-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .observability-pillars-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .observability-pillars-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .observability-pillars-stage { opacity: 1; }

    .observability-pillars-s0 { animation-delay: 0.00s; }
    .observability-pillars-e0 { animation-delay: 0.00s; }
    .observability-pillars-s1 { animation-delay: 1.28s; }
    .observability-pillars-e1 { animation-delay: 1.28s; }
    .observability-pillars-s2 { animation-delay: 2.56s; }
    .observability-pillars-e2 { animation-delay: 2.56s; }
    .observability-pillars-s3 { animation-delay: 3.84s; }
    .observability-pillars-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .observability-pillars-conn  { animation: observability-pillars-trace 6.4s ease-in-out infinite; }
      .observability-pillars-stage { animation: observability-pillars-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes observability-pillars-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes observability-pillars-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .observability-pillars-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .observability-pillars-stage { animation: observability-pillars-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes observability-pillars-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="observability-pillars-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="observability-pillars-bg" width="980" height="322"/>
  <text class="observability-pillars-h1"  x="30" y="40">Four things to monitor</text>
  <text class="observability-pillars-sub" x="30" y="64">Only one needs labels.</text>
  <g class="observability-pillars-stage observability-pillars-s0">
    <rect class="observability-pillars-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="observability-pillars-step" x="44" y="142">01</text>
    <text class="observability-pillars-name" x="70" y="142">Service health</text>
    <text class="observability-pillars-desc" x="44" y="166">Latency, error rate, throughput.</text>
    <text class="observability-pillars-desc" x="44" y="182">Available immediately.</text>
  </g>
  <line class="observability-pillars-line observability-pillars-conn observability-pillars-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#observability-pillars-tip)"/>
  <g class="observability-pillars-stage observability-pillars-s1">
    <rect class="observability-pillars-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="observability-pillars-step" x="280" y="142">02</text>
    <text class="observability-pillars-name" x="306" y="142">Input drift</text>
    <text class="observability-pillars-desc" x="280" y="166">Feature distributions against</text>
    <text class="observability-pillars-desc" x="280" y="182">training. No labels needed.</text>
  </g>
  <line class="observability-pillars-line observability-pillars-conn observability-pillars-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#observability-pillars-tip)"/>
  <g class="observability-pillars-stage observability-pillars-s2">
    <rect class="observability-pillars-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="observability-pillars-step" x="516" y="142">03</text>
    <text class="observability-pillars-name" x="542" y="142">Prediction drift</text>
    <text class="observability-pillars-desc" x="516" y="166">The output distribution. An</text>
    <text class="observability-pillars-desc" x="516" y="182">early warning of concept drift.</text>
  </g>
  <line class="observability-pillars-line observability-pillars-conn observability-pillars-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#observability-pillars-tip)"/>
  <g class="observability-pillars-stage observability-pillars-s3">
    <rect class="observability-pillars-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="observability-pillars-step" x="752" y="142">04</text>
    <text class="observability-pillars-name" x="778" y="142">And outcome quality</text>
    <text class="observability-pillars-desc" x="752" y="166">The real metric, once labels</text>
    <text class="observability-pillars-desc" x="752" y="182">arrive. Often much later.</text>
  </g>
  <text class="observability-pillars-sub" x="30" y="304">The first three are available without labels, which is what makes them valuable: outcome labels frequently arrive weeks after the prediction they would evaluate.</text>
</svg>
