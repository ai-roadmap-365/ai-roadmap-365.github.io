<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when it does not.">
  <title>When linear regression fits</title>
  <style>
    .linreg-when-bg   { fill: #f8fafc; }
    .linreg-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linreg-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linreg-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linreg-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linreg-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linreg-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .linreg-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .linreg-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .linreg-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .linreg-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .linreg-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .linreg-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .linreg-when-row { opacity: 1; }
    .linreg-when-r0 { animation-delay: 0.00s; }
    .linreg-when-r1 { animation-delay: 0.45s; }
    .linreg-when-r2 { animation-delay: 0.90s; }
    .linreg-when-r3 { animation-delay: 1.35s; }
    .linreg-when-r4 { animation-delay: 1.80s; }
    .linreg-when-row { animation: linreg-when-reveal 7.3s ease-in-out infinite; }
    @keyframes linreg-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="linreg-when-bg" width="980" height="390"/>
  <text class="linreg-when-h1"  x="30" y="40">When linear regression fits</text>
  <text class="linreg-when-sub" x="30" y="64">And when it does not.</text>
  <rect class="linreg-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="linreg-when-name" x="46" y="122">Use it</text>
  <text class="linreg-when-desc" x="46" y="142">Four cases.</text>
  <text class="linreg-when-desc linreg-when-row linreg-when-r0" x="46" y="182">As the baseline, always</text>
  <text class="linreg-when-desc linreg-when-row linreg-when-r1" x="46" y="216">Where coefficients must be explained</text>
  <text class="linreg-when-desc linreg-when-row linreg-when-r2" x="46" y="250">Where uncertainty must be quantified</text>
  <text class="linreg-when-desc linreg-when-row linreg-when-r3" x="46" y="284">Small datasets with few predictors</text>
  <text class="linreg-when-desc linreg-when-row linreg-when-r4" x="46" y="318">Where the relationship is roughly linear</text>
  <rect class="linreg-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="linreg-when-name" x="526" y="122">Use something else</text>
  <text class="linreg-when-desc" x="526" y="142">Also four.</text>
  <text class="linreg-when-desc linreg-when-row linreg-when-r0" x="526" y="182">Clear non-linearity, unless features are engineered</text>
  <text class="linreg-when-desc linreg-when-row linreg-when-r1" x="526" y="216">Strong interactions between predictors</text>
  <text class="linreg-when-desc linreg-when-row linreg-when-r2" x="526" y="250">Many correlated predictors — regularise</text>
  <text class="linreg-when-desc linreg-when-row linreg-when-r3" x="526" y="284">Heavy-tailed errors — use a robust loss</text>
  <text class="linreg-when-desc linreg-when-row linreg-when-r4" x="526" y="318">Images, audio, text</text>
  <text class="linreg-when-sub" x="30" y="372">Fitting it first regardless is the recommendation: it takes seconds and establishes the number every later model has to beat.</text>
</svg>
