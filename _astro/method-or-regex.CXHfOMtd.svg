<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Clearer, faster, and it cannot over-match.">
  <title>Reach for a method before a pattern</title>
  <style>
    .method-or-regex-bg   { fill: #f8fafc; }
    .method-or-regex-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .method-or-regex-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .method-or-regex-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .method-or-regex-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .method-or-regex-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .method-or-regex-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .method-or-regex-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .method-or-regex-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .method-or-regex-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .method-or-regex-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .method-or-regex-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .method-or-regex-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .method-or-regex-row { opacity: 1; }
    .method-or-regex-r0 { animation-delay: 0.00s; }
    .method-or-regex-r1 { animation-delay: 0.45s; }
    .method-or-regex-r2 { animation-delay: 0.90s; }
    .method-or-regex-r3 { animation-delay: 1.35s; }
    .method-or-regex-r4 { animation-delay: 1.80s; }
    .method-or-regex-row { animation: method-or-regex-reveal 7.3s ease-in-out infinite; }
    @keyframes method-or-regex-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="method-or-regex-bg" width="980" height="390"/>
  <text class="method-or-regex-h1"  x="30" y="40">Reach for a method before a pattern</text>
  <text class="method-or-regex-sub" x="30" y="64">Clearer, faster, and it cannot over-match.</text>
  <rect class="method-or-regex-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="method-or-regex-name" x="46" y="122">A string method</text>
  <text class="method-or-regex-desc" x="46" y="142">When it fits.</text>
  <text class="method-or-regex-desc method-or-regex-row method-or-regex-r0" x="46" y="182">s.startswith("Error")</text>
  <text class="method-or-regex-desc method-or-regex-row method-or-regex-r1" x="46" y="216">s.replace("a", "b")</text>
  <text class="method-or-regex-desc method-or-regex-row method-or-regex-r2" x="46" y="250">"x" in s</text>
  <text class="method-or-regex-desc method-or-regex-row method-or-regex-r3" x="46" y="284">Obvious to every reader</text>
  <text class="method-or-regex-desc method-or-regex-row method-or-regex-r4" x="46" y="318">Cannot over-match or backtrack</text>
  <rect class="method-or-regex-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="method-or-regex-name" x="526" y="122">A regular expression</text>
  <text class="method-or-regex-desc" x="526" y="142">When the shape varies.</text>
  <text class="method-or-regex-desc method-or-regex-row method-or-regex-r0" x="526" y="182">re.match(r"^Error\\s+\\d+", s)</text>
  <text class="method-or-regex-desc method-or-regex-row method-or-regex-r1" x="526" y="216">Patterns rather than fixed text</text>
  <text class="method-or-regex-desc method-or-regex-row method-or-regex-r2" x="526" y="250">Capture groups, to extract</text>
  <text class="method-or-regex-desc method-or-regex-row method-or-regex-r3" x="526" y="284">Needs a raw string, always</text>
  <text class="method-or-regex-desc method-or-regex-row method-or-regex-r4" x="526" y="318">Day 38's territory</text>
  <text class="method-or-regex-sub" x="30" y="372">The method is not merely simpler — it says what you mean. Reserve patterns for cases where the text genuinely varies in shape, and use a raw string when you do.</text>
</svg>
