<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Cross-training, by removing people.">
  <title>A team where nobody is indispensable</title>
  <style>
    .team-analogy-bg   { fill: #f8fafc; }
    .team-analogy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .team-analogy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .team-analogy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .team-analogy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .team-analogy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .team-analogy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .team-analogy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .team-analogy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .team-analogy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .team-analogy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .team-analogy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .team-analogy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .team-analogy-row { opacity: 1; }
    .team-analogy-r0 { animation-delay: 0.00s; }
    .team-analogy-r1 { animation-delay: 0.45s; }
    .team-analogy-r2 { animation-delay: 0.90s; }
    .team-analogy-r3 { animation-delay: 1.35s; }
    .team-analogy-r4 { animation-delay: 1.80s; }
    .team-analogy-row { animation: team-analogy-reveal 7.3s ease-in-out infinite; }
    @keyframes team-analogy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="team-analogy-bg" width="980" height="390"/>
  <text class="team-analogy-h1"  x="30" y="40">A team where nobody is indispensable</text>
  <text class="team-analogy-sub" x="30" y="64">Cross-training, by removing people.</text>
  <rect class="team-analogy-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="team-analogy-name" x="46" y="122">Everyone specialised</text>
  <text class="team-analogy-desc" x="46" y="142">Fragile.</text>
  <text class="team-analogy-desc team-analogy-row team-analogy-r0" x="46" y="182">One person owns each subsystem</text>
  <text class="team-analogy-desc team-analogy-row team-analogy-r1" x="46" y="216">Fast, while everyone is present</text>
  <text class="team-analogy-desc team-analogy-row team-analogy-r2" x="46" y="250">One absence blocks the work</text>
  <text class="team-analogy-desc team-analogy-row team-analogy-r3" x="46" y="284">Nobody else can cover</text>
  <text class="team-analogy-desc team-analogy-row team-analogy-r4" x="46" y="318">This is co-adaptation</text>
  <rect class="team-analogy-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="team-analogy-name" x="526" y="122">Random absences</text>
  <text class="team-analogy-desc" x="526" y="142">Robust.</text>
  <text class="team-analogy-desc team-analogy-row team-analogy-r0" x="526" y="182">A different person is out each day</text>
  <text class="team-analogy-desc team-analogy-row team-analogy-r1" x="526" y="216">Everyone learns overlapping skills</text>
  <text class="team-analogy-desc team-analogy-row team-analogy-r2" x="526" y="250">No single point of failure remains</text>
  <text class="team-analogy-desc team-analogy-row team-analogy-r3" x="526" y="284">Slightly slower to train</text>
  <text class="team-analogy-desc team-analogy-row team-analogy-r4" x="526" y="318">This is dropout</text>
  <text class="team-analogy-sub" x="30" y="372">Slightly slower to train is the honest cost: dropout genuinely lengthens training, and it buys a network whose features do not depend on specific partners surviving.</text>
</svg>
