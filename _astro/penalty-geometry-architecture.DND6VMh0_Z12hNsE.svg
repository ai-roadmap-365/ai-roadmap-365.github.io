<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" role="img" aria-labelledby="d151a-title d151a-desc" width="1100" height="800">
  <title id="d151a-title">Why a diamond produces a corner and a circle does not</title>
  <desc id="d151a-desc">Two constraint regions for the same regularized regression problem: ridge's circular region, where the loss contours touch at a point with both coefficients nonzero, and lasso's diamond region, where the loss contours touch at a corner sitting on an axis, so one coefficient is exactly zero.</desc>
  <style>
    .d151a-bg { fill: #f8fafc; }
    .d151a-title { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 26px; font-weight: 700; }
    .d151a-sub { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; }
    .d151a-head { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 19px; font-weight: 700; }
    .d151a-label { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d151a-strong { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; }
    .d151a-muted { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13.5px; }
    .d151a-num { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; }
    .d151a-panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .d151a-region { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.5; }
    .d151a-axis { stroke: #94a3b8; stroke-width: 1.5; }
    .d151a-contour { fill: none; stroke: #1a202c; stroke-width: 1.5; opacity: 0.55; }
    .d151a-touch { fill: #1d4ed8; stroke: #ffffff; stroke-width: 2; }
    .d151a-cardhead { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; }
    .d151a-mono { fill: #1a202c; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 13.5px; }
    .d151a-monob { fill: #1d4ed8; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 13.5px; font-weight: 700; }
  </style>
  <rect class="d151a-bg" x="0" y="0" width="1100" height="800"/>

  <text class="d151a-title" x="550" y="40" text-anchor="middle">The corner, and why only one penalty has one</text>
  <text class="d151a-sub" x="550" y="64" text-anchor="middle">Same loss, same alpha, two different constraint-region shapes -- measured on two correlated features</text>

  <!-- LEFT PANEL: RIDGE / L2 -->
  <rect class="d151a-panel" x="40" y="90" width="480" height="430" rx="10"/>
  <text class="d151a-head" x="280" y="122" text-anchor="middle">RIDGE -- L2 penalty: sum(beta^2) &lt;= t</text>

  <!-- axes -->
  <line class="d151a-axis" x1="280" y1="160" x2="280" y2="440" />
  <line class="d151a-axis" x1="100" y1="330" x2="460" y2="330" />
  <text class="d151a-muted" x="466" y="334">beta1</text>
  <text class="d151a-muted" x="286" y="172">beta2</text>

  <!-- circular constraint region -->
  <circle class="d151a-region" cx="280" cy="330" r="95" fill-opacity="0.55"/>

  <!-- tilted elliptical loss contours, centered off-origin (the OLS solution) -->
  <g transform="translate(345,270) rotate(35)">
    <ellipse class="d151a-contour" cx="0" cy="0" rx="150" ry="60"/>
    <ellipse class="d151a-contour" cx="0" cy="0" rx="105" ry="42"/>
    <ellipse class="d151a-contour" cx="0" cy="0" rx="62" ry="25"/>
  </g>
  <circle cx="345" cy="270" r="4" fill="#1a202c"/>
  <text class="d151a-muted" x="352" y="266">OLS solution (unconstrained)</text>

  <!-- point of first contact: off-axis, both coordinates nonzero -->
  <circle class="d151a-touch" cx="322" cy="272" r="7"/>
  <text class="d151a-strong" x="150" y="450">Contact point: off-axis, BOTH coefficients nonzero</text>
  <text class="d151a-muted" x="150" y="470">The circle has no corners, so the first touch is generic</text>

  <!-- measured card -->
  <rect class="d151a-panel" x="70" y="486" width="420" height="24" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
  <text class="d151a-mono" x="82" y="503">measured: ridge zeroed 0 of 10 coefficients, alpha 0.001-100</text>

  <!-- RIGHT PANEL: LASSO / L1 -->
  <rect class="d151a-panel" x="580" y="90" width="480" height="430" rx="10"/>
  <text class="d151a-head" x="820" y="122" text-anchor="middle">LASSO -- L1 penalty: sum(|beta|) &lt;= t</text>

  <line class="d151a-axis" x1="820" y1="160" x2="820" y2="440" />
  <line class="d151a-axis" x1="640" y1="330" x2="1000" y2="330" />
  <text class="d151a-muted" x="1006" y="334">beta1</text>
  <text class="d151a-muted" x="826" y="172">beta2</text>

  <!-- diamond constraint region: |x|+|y| <= 95 around (820,330) -->
  <polygon class="d151a-region" points="820,235 915,330 820,425 725,330" fill-opacity="0.55"/>

  <g transform="translate(885,270) rotate(35)">
    <ellipse class="d151a-contour" cx="0" cy="0" rx="150" ry="60"/>
    <ellipse class="d151a-contour" cx="0" cy="0" rx="105" ry="42"/>
    <ellipse class="d151a-contour" cx="0" cy="0" rx="70" ry="28"/>
  </g>
  <circle cx="885" cy="270" r="4" fill="#1a202c"/>
  <text class="d151a-muted" x="892" y="266">OLS solution (unconstrained)</text>

  <!-- point of first contact: the corner, sitting exactly on the beta1 axis -->
  <circle class="d151a-touch" cx="915" cy="330" r="8"/>
  <text class="d151a-strong" x="690" y="450">Contact point: the CORNER, on the axis -- beta2 = 0 exactly</text>
  <text class="d151a-muted" x="690" y="470">The diamond's corners sit on the axes; a tilted ellipse often meets one first</text>

  <rect class="d151a-panel" x="610" y="486" width="420" height="24" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
  <text class="d151a-mono" x="622" y="503">measured: lasso zeroed 8 of 10 coefficients by alpha=1.0</text>

  <!-- BOTTOM: measured two-feature corner demonstration -->
  <rect class="d151a-panel" x="40" y="536" width="1020" height="230" rx="10"/>
  <text class="d151a-cardhead" x="60" y="566">Measured on the smallest case that shows it: two features correlated at 0.9999</text>
  <text class="d151a-muted" x="60" y="586">OLS (no penalty) coefficients: [1.9564, 1.9381]</text>

  <text class="d151a-strong" x="60" y="616">alpha</text>
  <text class="d151a-strong" x="220" y="616">ridge coefficients</text>
  <text class="d151a-strong" x="560" y="616">lasso coefficients</text>

  <line class="d151a-axis" x1="60" y1="626" x2="1000" y2="626"/>

  <text class="d151a-mono" x="60" y="650">0.001</text>
  <text class="d151a-mono" x="220" y="650">[1.9564, 1.9381]</text>
  <text class="d151a-mono" x="560" y="650">[1.9583, 1.9352]</text>

  <text class="d151a-mono" x="60" y="674">1.000</text>
  <text class="d151a-mono" x="220" y="674">[1.9551, 1.9295]</text>
  <text class="d151a-mono" x="560" y="674">[1.9593, 0.8990]</text>

  <text class="d151a-mono" x="60" y="698">3.000</text>
  <text class="d151a-mono" x="220" y="698">[1.9507, 1.9141]</text>
  <text class="d151a-monob" x="560" y="698">[0.8919, 0.0000]  &lt;- exact zero, the corner</text>

  <text class="d151a-mono" x="60" y="722">8.000</text>
  <text class="d151a-mono" x="220" y="722">[1.9345, 1.8820]  &lt;- still both nonzero</text>
  <text class="d151a-mono" x="560" y="722">[0.0000, 0.0000]</text>

  <text class="d151a-muted" x="60" y="750">Ridge never lands on the axis at any alpha tried, from 0.001 to 100, across the full ten-feature dataset.</text>
</svg>
