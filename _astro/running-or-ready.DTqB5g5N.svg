<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And a Service routes only to ready.">
  <title>Running is not ready</title>
  <style>
    .running-or-ready-bg   { fill: #f8fafc; }
    .running-or-ready-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .running-or-ready-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .running-or-ready-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .running-or-ready-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .running-or-ready-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .running-or-ready-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .running-or-ready-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .running-or-ready-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .running-or-ready-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .running-or-ready-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .running-or-ready-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .running-or-ready-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .running-or-ready-row { opacity: 1; }
    .running-or-ready-r0 { animation-delay: 0.00s; }
    .running-or-ready-r1 { animation-delay: 0.45s; }
    .running-or-ready-r2 { animation-delay: 0.90s; }
    .running-or-ready-r3 { animation-delay: 1.35s; }
    .running-or-ready-r4 { animation-delay: 1.80s; }
    .running-or-ready-row { animation: running-or-ready-reveal 7.3s ease-in-out infinite; }
    @keyframes running-or-ready-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="running-or-ready-bg" width="980" height="390"/>
  <text class="running-or-ready-h1"  x="30" y="40">Running is not ready</text>
  <text class="running-or-ready-sub" x="30" y="64">And a Service routes only to ready.</text>
  <rect class="running-or-ready-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="running-or-ready-name" x="46" y="122">Running</text>
  <text class="running-or-ready-desc" x="46" y="142">The container started.</text>
  <text class="running-or-ready-desc running-or-ready-row running-or-ready-r0" x="46" y="182">The process exists</text>
  <text class="running-or-ready-desc running-or-ready-row running-or-ready-r1" x="46" y="216">Says nothing about the model being loaded</text>
  <text class="running-or-ready-desc running-or-ready-row running-or-ready-r2" x="46" y="250">Receives no traffic</text>
  <text class="running-or-ready-desc running-or-ready-row running-or-ready-r3" x="46" y="284">The spec can be satisfied here</text>
  <text class="running-or-ready-desc running-or-ready-row running-or-ready-r4" x="46" y="318">Three pods, none serving</text>
  <rect class="running-or-ready-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="running-or-ready-name" x="526" y="122">Ready</text>
  <text class="running-or-ready-desc" x="526" y="142">The probe passed.</text>
  <text class="running-or-ready-desc running-or-ready-row running-or-ready-r0" x="526" y="182">The pod answers the question you wrote</text>
  <text class="running-or-ready-desc running-or-ready-row running-or-ready-r1" x="526" y="216">The Service adds it to the load balancer</text>
  <text class="running-or-ready-desc running-or-ready-row running-or-ready-r2" x="526" y="250">Re-asked every few seconds, forever</text>
  <text class="running-or-ready-desc running-or-ready-row running-or-ready-r3" x="526" y="284">Removed the moment the answer changes</text>
  <text class="running-or-ready-desc running-or-ready-row running-or-ready-r4" x="526" y="318">This is what "serving" counts</text>
  <text class="running-or-ready-sub" x="30" y="372">Yesterday's Compose lesson asked this question once, at startup. Kubernetes asks it continuously, which is the difference between an ordering guarantee and a traffic control.</text>
</svg>
