<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" font-family="system-ui, sans-serif">
  <title>The anatomy of a Python traceback, read from the bottom up</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Anatomy of a traceback — read it bottom-up</text>

  <!-- Traceback panel -->
  <rect x="40" y="60" width="470" height="300" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>

  <text x="58" y="92" font-size="15" font-family="ui-monospace, monospace" fill="#1a202c">Traceback (most recent call last):</text>

  <text x="58" y="128" font-size="15" font-family="ui-monospace, monospace" fill="#1a202c">  File "report.py", line 12, in &lt;module&gt;</text>
  <text x="58" y="148" font-size="15" font-family="ui-monospace, monospace" fill="#1a202c">    main()</text>

  <text x="58" y="184" font-size="15" font-family="ui-monospace, monospace" fill="#1a202c">  File "report.py", line 9, in main</text>
  <text x="58" y="204" font-size="15" font-family="ui-monospace, monospace" fill="#1a202c">    print_average(scores)</text>

  <text x="58" y="240" font-size="15" font-family="ui-monospace, monospace" fill="#1a202c">  File "report.py", line 4, in print_average</text>
  <text x="58" y="260" font-size="15" font-family="ui-monospace, monospace" fill="#1a202c">    average = total / len(values)</text>

  <rect x="52" y="290" width="446" height="30" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" rx="4"/>
  <text x="58" y="311" font-size="15" font-family="ui-monospace, monospace" font-weight="bold" fill="#1a202c">ZeroDivisionError: division by zero</text>

  <!-- Frame bracket labels -->
  <text x="380" y="112" font-size="13" fill="#1a202c" font-style="italic">top frame (oldest call)</text>
  <text x="380" y="168" font-size="13" fill="#1a202c" font-style="italic">caller</text>

  <!-- Annotations on the right -->
  <text x="540" y="298" font-size="14" font-weight="bold" fill="#1d4ed8">1. Read this first:</text>
  <text x="540" y="318" font-size="14" fill="#1a202c">the exception TYPE and</text>
  <text x="540" y="336" font-size="14" fill="#1a202c">MESSAGE — the "what".</text>
  <line x1="500" y1="305" x2="534" y2="305" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="500,305 514,298 514,312" fill="#1d4ed8"/>

  <text x="540" y="238" font-size="14" font-weight="bold" fill="#1d4ed8">2. Then this frame:</text>
  <text x="540" y="258" font-size="14" fill="#1a202c">the culprit line — where</text>
  <text x="540" y="276" font-size="14" fill="#1a202c">it surfaced (the "where").</text>
  <line x1="500" y1="250" x2="534" y2="250" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="500,250 514,243 514,257" fill="#1d4ed8"/>

  <text x="540" y="150" font-size="14" font-weight="bold" fill="#1d4ed8">3. Climb only if needed:</text>
  <text x="540" y="170" font-size="14" fill="#1a202c">the call stack — who</text>
  <text x="540" y="188" font-size="14" fill="#1a202c">called whom.</text>

  <!-- Bottom-up arrow -->
  <line x1="26" y1="315" x2="26" y2="95" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="26,84 19,100 33,100" fill="#1d4ed8"/>
  <text x="16" y="205" font-size="13" font-weight="bold" fill="#1d4ed8" transform="rotate(-90 16 205)" text-anchor="middle">read bottom-up</text>

  <text x="380" y="400" text-anchor="middle" font-size="15" fill="#1a202c">The last line is the "what"; the frame above it is the "where".</text>
  <text x="380" y="424" text-anchor="middle" font-size="15" fill="#1a202c">Where it broke is not always where it went wrong — climb the stack when the cause hides in a caller.</text>
</svg>
