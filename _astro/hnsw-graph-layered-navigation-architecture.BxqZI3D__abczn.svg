<svg role="img" aria-label="HNSW graph layered navigation architecture diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>HNSW Graph Layered Navigation Architecture</title>
  <defs>
    <linearGradient id="bg262a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card262" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg262a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">HIERARCHICAL NAVIGABLE SMALL WORLD (HNSW) GRAPH</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Multi-Layer Skip-List Graph Architecture for Logarithmic Vector Retrieval</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card262)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Layer 2 (Top Sparse Layer) -->
    <rect x="25" y="20" width="710" height="65" fill="#0f172a" stroke="#fb7185" rx="6"/>
    <text x="35" y="42" fill="#fb7185" font-size="10" font-weight="700">Layer 2 (Expressway / Sparse)</text>
    <circle cx="200" cy="50" r="10" fill="#fb7185"/>
    <text x="200" y="53" fill="#0f172a" font-size="7" font-weight="700" text-anchor="middle">Entry</text>
    <line x1="210" y1="50" x2="520" y2="50" stroke="#fb7185" stroke-width="2"/>
    <circle cx="530" cy="50" r="10" fill="#fb7185"/>
    <text x="650" y="53" fill="#cbd5e1" font-size="8">Long-range jumps: O(log N)</text>

    <!-- Layer 1 (Medium Density Layer) -->
    <rect x="25" y="100" width="710" height="75" fill="#0f172a" stroke="#fbbf24" rx="6"/>
    <text x="35" y="122" fill="#fbbf24" font-size="10" font-weight="700">Layer 1 (Regional Highway)</text>
    <circle cx="200" cy="140" r="8" fill="#fbbf24"/>
    <circle cx="340" cy="140" r="8" fill="#fbbf24"/>
    <circle cx="530" cy="140" r="8" fill="#fbbf24"/>
    <circle cx="650" cy="140" r="8" fill="#fbbf24"/>
    <line x1="208" y1="140" x2="332" y2="140" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="348" y1="140" x2="522" y2="140" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="538" y1="140" x2="642" y2="140" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="200" y1="60" x2="200" y2="132" stroke="#94a3b8" stroke-dasharray="3,3"/>
    <line x1="530" y1="60" x2="530" y2="132" stroke="#94a3b8" stroke-dasharray="3,3"/>

    <!-- Layer 0 (Base Dense Layer) -->
    <rect x="25" y="190" width="710" height="100" fill="#0f172a" stroke="#34d399" stroke-width="1.5" rx="6"/>
    <text x="35" y="212" fill="#34d399" font-size="10" font-weight="700">Layer 0 (Base / All Vectors &amp; Local Neighborhoods)</text>
    
    <circle cx="120" cy="250" r="7" fill="#34d399"/>
    <circle cx="200" cy="250" r="7" fill="#34d399"/>
    <circle cx="270" cy="250" r="7" fill="#34d399"/>
    <circle cx="340" cy="250" r="7" fill="#34d399"/>
    <circle cx="420" cy="250" r="7" fill="#34d399"/>
    <circle cx="500" cy="250" r="7" fill="#34d399"/>
    <circle cx="530" cy="250" r="7" fill="#38bdf8" stroke="#f8fafc" stroke-width="2"/>
    <circle cx="580" cy="250" r="7" fill="#34d399"/>
    <circle cx="650" cy="250" r="7" fill="#34d399"/>

    <line x1="127" y1="250" x2="193" y2="250" stroke="#34d399"/>
    <line x1="207" y1="250" x2="263" y2="250" stroke="#34d399"/>
    <line x1="277" y1="250" x2="333" y2="250" stroke="#34d399"/>
    <line x1="347" y1="250" x2="413" y2="250" stroke="#34d399"/>
    <line x1="427" y1="250" x2="493" y2="250" stroke="#34d399"/>
    <line x1="507" y1="250" x2="523" y2="250" stroke="#38bdf8" stroke-width="2"/>
    <line x1="537" y1="250" x2="573" y2="250" stroke="#34d399"/>
    <line x1="587" y1="250" x2="643" y2="250" stroke="#34d399"/>

    <text x="530" y="275" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">Greedy Local Search Result (Target)</text>
  </g>
</svg>
