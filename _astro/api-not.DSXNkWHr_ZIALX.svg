<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things the interface is not</title>
  <style>
    .api-not-bg   { fill: #f8fafc; }
    .api-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .api-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .api-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .api-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .api-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .api-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .api-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .api-not-row { opacity: 1; }
    .api-not-r0 { animation-delay: 0.00s; }
    .api-not-r1 { animation-delay: 0.45s; }
    .api-not-r2 { animation-delay: 0.90s; }
    .api-not-r3 { animation-delay: 1.35s; }
    .api-not-r4 { animation-delay: 1.80s; }
    .api-not-row { animation: api-not-reveal 7.3s ease-in-out infinite; }
    @keyframes api-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="api-not-bg" width="980" height="390"/>
  <text class="api-not-h1"  x="30" y="40">Four things the interface is not</text>
  <text class="api-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="api-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="api-not-name" x="46" y="122">The misconception</text>
  <text class="api-not-desc" x="46" y="142">Commonly held.</text>
  <text class="api-not-desc api-not-row api-not-r0" x="46" y="182">The conventions are stylistic</text>
  <text class="api-not-desc api-not-row api-not-r1" x="46" y="216">Fit can be called incrementally by default</text>
  <text class="api-not-desc api-not-row api-not-r2" x="46" y="250">Any object with fit and predict will work</text>
  <text class="api-not-desc api-not-row api-not-r3" x="46" y="284">The constructor is a good place to validate</text>
  <text class="api-not-desc api-not-row api-not-r4" x="46" y="318">Predict is always the method you want</text>
  <rect class="api-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="api-not-name" x="526" y="122">What is true</text>
  <text class="api-not-desc" x="526" y="142">Actually.</text>
  <text class="api-not-desc api-not-row api-not-r0" x="526" y="182">Cloning and searching depend on them</text>
  <text class="api-not-desc api-not-row api-not-r1" x="526" y="216">Refitting resets, unless partial fit exists</text>
  <text class="api-not-desc api-not-row api-not-r2" x="526" y="250">Cloning and parameter handling must work too</text>
  <text class="api-not-desc api-not-row api-not-r3" x="526" y="284">Validate in fit; the constructor must only store</text>
  <text class="api-not-desc api-not-row api-not-r4" x="526" y="318">Probabilities are usually more useful</text>
  <text class="api-not-sub" x="30" y="372">The incremental-fitting assumption causes real bugs: calling fit in a loop over batches trains on the last batch only, silently.</text>
</svg>
