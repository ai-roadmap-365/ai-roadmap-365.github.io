<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="It determines what you see.">
  <title>Choosing an instrument</title>
  <style>
    .instrument-bg   { fill: #f8fafc; }
    .instrument-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .instrument-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .instrument-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .instrument-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .instrument-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .instrument-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .instrument-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .instrument-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .instrument-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .instrument-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .instrument-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .instrument-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .instrument-row { opacity: 1; }
    .instrument-r0 { animation-delay: 0.00s; }
    .instrument-r1 { animation-delay: 0.45s; }
    .instrument-r2 { animation-delay: 0.90s; }
    .instrument-r3 { animation-delay: 1.35s; }
    .instrument-r4 { animation-delay: 1.80s; }
    .instrument-row { animation: instrument-reveal 7.3s ease-in-out infinite; }
    @keyframes instrument-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="instrument-bg" width="980" height="390"/>
  <text class="instrument-h1"  x="30" y="40">Choosing an instrument</text>
  <text class="instrument-sub" x="30" y="64">It determines what you see.</text>
  <rect class="instrument-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="instrument-name" x="46" y="122">The wrong instrument</text>
  <text class="instrument-desc" x="46" y="142">Precise, and irrelevant.</text>
  <text class="instrument-desc instrument-row instrument-r0" x="46" y="182">Measures something, accurately</text>
  <text class="instrument-desc instrument-row instrument-r1" x="46" y="216">Not the quantity that matters</text>
  <text class="instrument-desc instrument-row instrument-r2" x="46" y="250">Readings look authoritative</text>
  <text class="instrument-desc instrument-row instrument-r3" x="46" y="284">Decisions made on them go wrong</text>
  <text class="instrument-desc instrument-row instrument-r4" x="46" y="318">This is a mismatched metric</text>
  <rect class="instrument-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="instrument-name" x="526" y="122">The right instrument</text>
  <text class="instrument-desc" x="526" y="142">Measures what matters.</text>
  <text class="instrument-desc instrument-row instrument-r0" x="526" y="182">Chosen for the quantity of interest</text>
  <text class="instrument-desc instrument-row instrument-r1" x="526" y="216">Sensitive where the decision is sensitive</text>
  <text class="instrument-desc instrument-row instrument-r2" x="526" y="250">Readings mean what they appear to</text>
  <text class="instrument-desc instrument-row instrument-r3" x="526" y="284">Decisions follow correctly</text>
  <text class="instrument-desc instrument-row instrument-r4" x="526" y="318">This is a matched metric</text>
  <text class="instrument-sub" x="30" y="372">An accurate measurement of the wrong quantity is more dangerous than a rough measurement of the right one, because it invites confidence.</text>
</svg>
