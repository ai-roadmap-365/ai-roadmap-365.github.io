<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Six gated steps.">
  <title>The regression protocol</title>
  <style>
    .protocol-154-bg   { fill: #f8fafc; }
    .protocol-154-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .protocol-154-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .protocol-154-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .protocol-154-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .protocol-154-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .protocol-154-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .protocol-154-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .protocol-154-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .protocol-154-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .protocol-154-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .protocol-154-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .protocol-154-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .protocol-154-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .protocol-154-stage { opacity: 1; }

    .protocol-154-s0 { animation-delay: 0.00s; }
    .protocol-154-e0 { animation-delay: 0.00s; }
    .protocol-154-s1 { animation-delay: 1.37s; }
    .protocol-154-e1 { animation-delay: 1.37s; }
    .protocol-154-s2 { animation-delay: 2.74s; }
    .protocol-154-e2 { animation-delay: 2.74s; }
    .protocol-154-s3 { animation-delay: 4.11s; }
    .protocol-154-e3 { animation-delay: 4.11s; }
    .protocol-154-s4 { animation-delay: 5.49s; }
    .protocol-154-e4 { animation-delay: 5.49s; }
    .protocol-154-s5 { animation-delay: 6.86s; }
    .protocol-154-e5 { animation-delay: 6.86s; }
    @media (prefers-reduced-motion: no-preference) {
      .protocol-154-conn  { animation: protocol-154-trace 9.600000000000001s ease-in-out infinite; }
      .protocol-154-stage { animation: protocol-154-arrive 9.600000000000001s ease-in-out infinite; }
    }
    @keyframes protocol-154-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes protocol-154-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .protocol-154-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .protocol-154-stage { animation: protocol-154-settle 9.600000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes protocol-154-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="protocol-154-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="protocol-154-bg" width="980" height="322"/>
  <text class="protocol-154-h1"  x="30" y="40">The regression protocol</text>
  <text class="protocol-154-sub" x="30" y="64">Six gated steps.</text>
  <g class="protocol-154-stage protocol-154-s0">
    <rect class="protocol-154-box" x="30" y="118" width="131" height="104" rx="10"/>
    <text class="protocol-154-step" x="44" y="142">01</text>
    <text class="protocol-154-name" x="70" y="142">Frame what is predicted, from what, for whom</text>
    <text class="protocol-154-desc" x="44" y="166">Including whether</text>
    <text class="protocol-154-desc" x="44" y="182">the target has a</text>
    <text class="protocol-154-desc" x="44" y="198">meaningful unit.</text>
  </g>
  <line class="protocol-154-line protocol-154-conn protocol-154-e0" x1="163" y1="170" x2="185" y2="170" marker-end="url(#protocol-154-tip)"/>
  <g class="protocol-154-stage protocol-154-s1">
    <rect class="protocol-154-warn" x="187" y="118" width="131" height="104" rx="10"/>
    <text class="protocol-154-step" x="201" y="142">02</text>
    <text class="protocol-154-name" x="227" y="142">Compute the baseline: always guess the mean</text>
    <text class="protocol-154-desc" x="201" y="166">70.4637, which</text>
    <text class="protocol-154-desc" x="201" y="182">everything must</text>
    <text class="protocol-154-desc" x="201" y="198">beat.</text>
  </g>
  <line class="protocol-154-line protocol-154-conn protocol-154-e1" x1="320" y1="170" x2="342" y2="170" marker-end="url(#protocol-154-tip)"/>
  <g class="protocol-154-stage protocol-154-s2">
    <rect class="protocol-154-box" x="344" y="118" width="131" height="104" rx="10"/>
    <text class="protocol-154-step" x="358" y="142">03</text>
    <text class="protocol-154-name" x="384" y="142">Split, and sweep candidates on the training folds</text>
    <text class="protocol-154-desc" x="358" y="166">Twenty-three</text>
    <text class="protocol-154-desc" x="358" y="182">pipelines,</text>
    <text class="protocol-154-desc" x="358" y="198">cross-validated.</text>
  </g>
  <line class="protocol-154-line protocol-154-conn protocol-154-e2" x1="477" y1="170" x2="499" y2="170" marker-end="url(#protocol-154-tip)"/>
  <g class="protocol-154-stage protocol-154-s3">
    <rect class="protocol-154-box" x="501" y="118" width="131" height="104" rx="10"/>
    <text class="protocol-154-step" x="515" y="142">04</text>
    <text class="protocol-154-name" x="541" y="142">Select the winner, knowing its score is optimistic</text>
    <text class="protocol-154-desc" x="515" y="166">Lasso at a</text>
    <text class="protocol-154-desc" x="515" y="182">cross-validated</text>
    <text class="protocol-154-desc" x="515" y="198">53.8958.</text>
  </g>
  <line class="protocol-154-line protocol-154-conn protocol-154-e3" x1="634" y1="170" x2="656" y2="170" marker-end="url(#protocol-154-tip)"/>
  <g class="protocol-154-stage protocol-154-s4">
    <rect class="protocol-154-good" x="658" y="118" width="131" height="104" rx="10"/>
    <text class="protocol-154-step" x="672" y="142">05</text>
    <text class="protocol-154-name" x="698" y="142">Open the test set once</text>
    <text class="protocol-154-desc" x="672" y="166">56.5566, on 111</text>
    <text class="protocol-154-desc" x="672" y="182">held-back rows.</text>
  </g>
  <line class="protocol-154-line protocol-154-conn protocol-154-e4" x1="791" y1="170" x2="813" y2="170" marker-end="url(#protocol-154-tip)"/>
  <g class="protocol-154-stage protocol-154-s5">
    <rect class="protocol-154-box" x="815" y="118" width="131" height="104" rx="10"/>
    <text class="protocol-154-step" x="829" y="142">06</text>
    <text class="protocol-154-name" x="855" y="142">Then give a verdict with an interval</text>
    <text class="protocol-154-desc" x="829" y="166">A margin of 13.9071,</text>
    <text class="protocol-154-desc" x="829" y="182">interval [5.5852,</text>
    <text class="protocol-154-desc" x="829" y="198">22.3324].</text>
    <text class="protocol-154-edge" x="829" y="242">does not cross zero</text>
  </g>
  <text class="protocol-154-sub" x="30" y="304">The interval not crossing zero is what turns the margin into a verdict, and it is the sentence the whole protocol exists to be able to write honestly.</text>
</svg>
