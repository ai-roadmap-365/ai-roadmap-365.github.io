<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One of them starts from nothing.">
  <title>Carving, or developing a photograph</title>
  <style>
    .sculpting-bg   { fill: #f8fafc; }
    .sculpting-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sculpting-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sculpting-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sculpting-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sculpting-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sculpting-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sculpting-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sculpting-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sculpting-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sculpting-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sculpting-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sculpting-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sculpting-row { opacity: 1; }
    .sculpting-r0 { animation-delay: 0.00s; }
    .sculpting-r1 { animation-delay: 0.45s; }
    .sculpting-r2 { animation-delay: 0.90s; }
    .sculpting-r3 { animation-delay: 1.35s; }
    .sculpting-r4 { animation-delay: 1.80s; }
    .sculpting-row { animation: sculpting-reveal 7.3s ease-in-out infinite; }
    @keyframes sculpting-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="sculpting-bg" width="980" height="390"/>
  <text class="sculpting-h1"  x="30" y="40">Carving, or developing a photograph</text>
  <text class="sculpting-sub" x="30" y="64">One of them starts from nothing.</text>
  <rect class="sculpting-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="sculpting-name" x="46" y="122">Drawing it in</text>
  <text class="sculpting-desc" x="46" y="142">Adding detail.</text>
  <text class="sculpting-desc sculpting-row sculpting-r0" x="46" y="182">Starts from a blank surface</text>
  <text class="sculpting-desc sculpting-row sculpting-r1" x="46" y="216">Each stroke adds something</text>
  <text class="sculpting-desc sculpting-row sculpting-r2" x="46" y="250">The artist decides every element</text>
  <text class="sculpting-desc sculpting-row sculpting-r3" x="46" y="284">Progress is visible throughout</text>
  <text class="sculpting-desc sculpting-row sculpting-r4" x="46" y="318">This is not how diffusion works</text>
  <rect class="sculpting-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="sculpting-name" x="526" y="122">Developing from noise</text>
  <text class="sculpting-desc" x="526" y="142">Removing what is wrong.</text>
  <text class="sculpting-desc sculpting-row sculpting-r0" x="526" y="182">Starts from random static</text>
  <text class="sculpting-desc sculpting-row sculpting-r1" x="526" y="216">Each step removes noise</text>
  <text class="sculpting-desc sculpting-row sculpting-r2" x="526" y="250">The prompt steers what emerges</text>
  <text class="sculpting-desc sculpting-row sculpting-r3" x="526" y="284">An image appears from nothing</text>
  <text class="sculpting-desc sculpting-row sculpting-r4" x="526" y="318">This is how diffusion works</text>
  <text class="sculpting-sub" x="30" y="372">The subtractive framing is worth holding onto because it explains the controls: guidance and negative prompts both steer what is removed rather than what is added.</text>
</svg>
