<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are operational.">
  <title>Four consequences of serving properly</title>
  <style>
    .serving-implications-bg   { fill: #f8fafc; }
    .serving-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serving-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serving-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serving-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serving-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serving-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .serving-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .serving-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .serving-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .serving-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .serving-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .serving-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .serving-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .serving-implications-stage { opacity: 1; }

    .serving-implications-s0 { animation-delay: 0.00s; }
    .serving-implications-e0 { animation-delay: 0.00s; }
    .serving-implications-s1 { animation-delay: 1.28s; }
    .serving-implications-e1 { animation-delay: 1.28s; }
    .serving-implications-s2 { animation-delay: 2.56s; }
    .serving-implications-e2 { animation-delay: 2.56s; }
    .serving-implications-s3 { animation-delay: 3.84s; }
    .serving-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .serving-implications-conn  { animation: serving-implications-trace 6.4s ease-in-out infinite; }
      .serving-implications-stage { animation: serving-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes serving-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes serving-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .serving-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .serving-implications-stage { animation: serving-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes serving-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="serving-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="serving-implications-bg" width="980" height="322"/>
  <text class="serving-implications-h1"  x="30" y="40">Four consequences of serving properly</text>
  <text class="serving-implications-sub" x="30" y="64">Two are operational.</text>
  <g class="serving-implications-stage serving-implications-s0">
    <rect class="serving-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="serving-implications-step" x="44" y="142">01</text>
    <text class="serving-implications-name" x="70" y="142">Throughput rises several-fold</text>
    <text class="serving-implications-desc" x="44" y="166">On unchanged hardware and an</text>
    <text class="serving-implications-desc" x="44" y="182">unchanged model.</text>
  </g>
  <line class="serving-implications-line serving-implications-conn serving-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#serving-implications-tip)"/>
  <g class="serving-implications-stage serving-implications-s1">
    <rect class="serving-implications-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="serving-implications-step" x="280" y="142">02</text>
    <text class="serving-implications-name" x="306" y="142">Which is what makes self-hosting break even</text>
    <text class="serving-implications-desc" x="280" y="166">At a much lower volume than</text>
    <text class="serving-implications-desc" x="280" y="182">naive serving would.</text>
  </g>
  <line class="serving-implications-line serving-implications-conn serving-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#serving-implications-tip)"/>
  <g class="serving-implications-stage serving-implications-s2">
    <rect class="serving-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="serving-implications-step" x="516" y="142">03</text>
    <text class="serving-implications-name" x="542" y="142">But shared prefix caching crosses request boundaries</text>
    <text class="serving-implications-desc" x="516" y="166">So isolate tenants deliberately.</text>
  </g>
  <line class="serving-implications-line serving-implications-conn serving-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#serving-implications-tip)"/>
  <g class="serving-implications-stage serving-implications-s3">
    <rect class="serving-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="serving-implications-step" x="752" y="142">04</text>
    <text class="serving-implications-name" x="778" y="142">And you now operate a cluster</text>
    <text class="serving-implications-desc" x="752" y="166">Capacity-planned, monitored, on</text>
    <text class="serving-implications-desc" x="752" y="182">call.</text>
  </g>
  <text class="serving-implications-sub" x="30" y="304">Shared caching between tenants is the subtle risk: a cache keyed only on content will happily serve one tenant's computed prefix to another.</text>
</svg>
