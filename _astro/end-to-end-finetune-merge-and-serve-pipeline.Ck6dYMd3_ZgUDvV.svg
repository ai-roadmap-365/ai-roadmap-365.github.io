<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" role="img" aria-label="End-to-End Fine-Tune, Merge, and Serve Pipeline">
  <title>End-to-End Fine-Tune, Merge, and Serve Pipeline</title>
  <rect width="100%" height="100%" fill="#f8fafc" />
  
    <style>
      .d280a-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d280a-header { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .d280a-text { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .d280a-accent { fill: #1d4ed8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .d280a-arrow { stroke: #1d4ed8; stroke-width: 2; stroke-linecap: round; marker-end: url(#d280a-arrowhead); }
      .d280a-pulse { animation: d280a-glow 2.5s infinite ease-in-out; }
      @keyframes d280a-glow {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(29, 78, 216, 0.2)); }
        50% { filter: drop-shadow(0 0 6px rgba(29, 78, 216, 0.6)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .d280a-pulse { animation: none; }
      }
    </style>
    
  
    <defs>
      <marker id="d280a-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8" />
      </marker>
    </defs>
    
  
  <g transform="translate(40, 40)">
    <rect class="d280a-box" x="0" y="0" width="160" height="80" />
    <text class="d280a-header" x="15" y="30">1. Data Prep</text>
    <text class="d280a-text" x="15" y="50">Filter, format &amp; split</text>
    <text class="d280a-accent" x="15" y="68">JSONL dataset</text>

    <path class="d280a-arrow" d="M 160 40 L 210 40" />

    <rect class="d280a-box d280a-pulse" x="210" y="0" width="170" height="80" />
    <text class="d280a-header" x="15" y="30">2. LoRA Training</text>
    <text class="d280a-text" x="15" y="50">Rank-8 adapters</text>
    <text class="d280a-accent" x="15" y="68">Loss convergence</text>

    <path class="d280a-arrow" d="M 380 40 L 430 40" />

    <rect class="d280a-box" x="430" y="0" width="160" height="80" />
    <text class="d280a-header" x="15" y="30">3. Merge &amp; Quant</text>
    <text class="d280a-text" x="15" y="50">W = W0 + (BA)*s</text>
    <text class="d280a-accent" x="15" y="68">Export to GGUF</text>

    <path class="d280a-arrow" d="M 590 40 L 640 40" />

    <rect class="d280a-box d280a-pulse" x="640" y="0" width="160" height="80" />
    <text class="d280a-header" x="15" y="30">4. Local Serving</text>
    <text class="d280a-text" x="15" y="50">Ollama / vLLM</text>
    <text class="d280a-accent" x="15" y="68">REST /v1/chat</text>
  </g>

</svg>