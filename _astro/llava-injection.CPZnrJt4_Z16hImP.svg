<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Injecting visual tokens</title>
  <style>
    .llava-injection-bg   { fill: #f8fafc; }
    .llava-injection-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .llava-injection-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .llava-injection-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .llava-injection-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .llava-injection-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .llava-injection-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .llava-injection-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .llava-injection-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .llava-injection-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .llava-injection-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .llava-injection-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .llava-injection-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .llava-injection-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .llava-injection-stage { opacity: 1; }

    .llava-injection-s0 { animation-delay: 0.00s; }
    .llava-injection-e0 { animation-delay: 0.00s; }
    .llava-injection-s1 { animation-delay: 1.28s; }
    .llava-injection-e1 { animation-delay: 1.28s; }
    .llava-injection-s2 { animation-delay: 2.56s; }
    .llava-injection-e2 { animation-delay: 2.56s; }
    .llava-injection-s3 { animation-delay: 3.84s; }
    .llava-injection-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .llava-injection-conn  { animation: llava-injection-trace 6.4s ease-in-out infinite; }
      .llava-injection-stage { animation: llava-injection-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes llava-injection-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes llava-injection-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .llava-injection-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .llava-injection-stage { animation: llava-injection-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes llava-injection-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="llava-injection-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="llava-injection-bg" width="980" height="322"/>
  <text class="llava-injection-h1"  x="30" y="40">Injecting visual tokens</text>
  <text class="llava-injection-sub" x="30" y="64">Four steps.</text>
  <g class="llava-injection-stage llava-injection-s0">
    <rect class="llava-injection-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="llava-injection-step" x="44" y="142">01</text>
    <text class="llava-injection-name" x="70" y="142">A placeholder marks where the image goes</text>
    <text class="llava-injection-desc" x="44" y="166">In the text sequence.</text>
  </g>
  <line class="llava-injection-line llava-injection-conn llava-injection-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#llava-injection-tip)"/>
  <g class="llava-injection-stage llava-injection-s1">
    <rect class="llava-injection-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="llava-injection-step" x="280" y="142">02</text>
    <text class="llava-injection-name" x="306" y="142">The encoder produces patch representations</text>
    <text class="llava-injection-desc" x="280" y="166">Then a projection maps them into</text>
    <text class="llava-injection-desc" x="280" y="182">the text space.</text>
  </g>
  <line class="llava-injection-line llava-injection-conn llava-injection-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#llava-injection-tip)"/>
  <g class="llava-injection-stage llava-injection-s2">
    <rect class="llava-injection-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="llava-injection-step" x="516" y="142">03</text>
    <text class="llava-injection-name" x="542" y="142">Which replace the placeholder</text>
    <text class="llava-injection-desc" x="516" y="166">Becoming ordinary positions in</text>
    <text class="llava-injection-desc" x="516" y="182">the sequence.</text>
  </g>
  <line class="llava-injection-line llava-injection-conn llava-injection-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#llava-injection-tip)"/>
  <g class="llava-injection-stage llava-injection-s3">
    <rect class="llava-injection-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="llava-injection-step" x="752" y="142">04</text>
    <text class="llava-injection-name" x="778" y="142">And the model attends over all of it uniformly</text>
    <text class="llava-injection-desc" x="752" y="166">With no distinction between</text>
    <text class="llava-injection-desc" x="752" y="182">kinds.</text>
    <text class="llava-injection-edge" x="752" y="242">one sequence</text>
  </g>
  <text class="llava-injection-sub" x="30" y="304">The uniformity is why injection through an image works: once projected, visual tokens are positions like any other, with no privileged or restricted status.</text>
</svg>
