<svg role="img" aria-label="Padding and Stride effects on feature map spatial resolution showing valid padding, same padding, and downsampling with stride 2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Convolution Padding and Stride Spatial Transformations</title>
  <defs>
    <linearGradient id="bg211b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card211b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg211b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">PADDING, STRIDE &amp; RECEPTIVE FIELD EXPANSION</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Controlling Feature Map Spatial Resolution and Computational Complexity</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card211b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Mode 1: Valid Padding (P=0) -->
    <rect x="25" y="25" width="220" height="245" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="135" y="48" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Valid Padding (P = 0)</text>
    <rect x="55" y="70" width="160" height="90" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="135" y="105" fill="#f8fafc" font-size="10" text-anchor="middle">H_in = 32x32, K = 3</text>
    <text x="135" y="130" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">H_out = 30x30</text>
    <text x="135" y="180" fill="#cbd5e1" font-size="8" text-anchor="middle">Shrinks spatial dimensions</text>
    <text x="135" y="200" fill="#cbd5e1" font-size="8" text-anchor="middle">Border pixels sampled less</text>
    <text x="135" y="235" fill="#94a3b8" font-size="8" text-anchor="middle">No border zero-padding</text>

    <!-- Mode 2: Same Padding (P=1 for K=3) -->
    <rect x="270" y="25" width="220" height="245" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="380" y="48" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Same Padding (P = (K-1)/2)</text>
    <rect x="300" y="70" width="160" height="90" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="380" y="105" fill="#f8fafc" font-size="10" text-anchor="middle">H_in = 32x32, P = 1, S = 1</text>
    <text x="380" y="130" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">H_out = 32x32 (Preserved)</text>
    <text x="380" y="180" fill="#cbd5e1" font-size="8" text-anchor="middle">Zero-pads perimeter by 1 pixel</text>
    <text x="380" y="200" fill="#cbd5e1" font-size="8" text-anchor="middle">Preserves spatial resolution</text>
    <text x="380" y="235" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Universal in ResNets &amp; VGG</text>

    <!-- Mode 3: Strided Downsampling (S=2) -->
    <rect x="515" y="25" width="220" height="245" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" rx="6"/>
    <text x="625" y="48" fill="#fb7185" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Strided Downsampling (S = 2)</text>
    <rect x="545" y="70" width="160" height="90" fill="#1e293b" stroke="#f43f5e" rx="4"/>
    <text x="625" y="105" fill="#f8fafc" font-size="10" text-anchor="middle">H_in = 32x32, S = 2, P = 1</text>
    <text x="625" y="130" fill="#fb7185" font-size="11" font-weight="700" text-anchor="middle">H_out = 16x16 (Halved)</text>
    <text x="625" y="180" fill="#cbd5e1" font-size="8" text-anchor="middle">Slides kernel by 2 pixels per step</text>
    <text x="625" y="200" fill="#cbd5e1" font-size="8" text-anchor="middle">Replaces Max Pooling</text>
    <text x="625" y="235" fill="#fbbf24" font-size="8" text-anchor="middle">Learnable spatial compression</text>
  </g>
</svg>
