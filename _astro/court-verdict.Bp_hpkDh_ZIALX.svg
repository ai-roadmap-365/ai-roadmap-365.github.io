<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Not proven, not innocent.">
  <title>A verdict</title>
  <style>
    .court-verdict-bg   { fill: #f8fafc; }
    .court-verdict-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .court-verdict-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .court-verdict-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .court-verdict-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .court-verdict-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .court-verdict-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .court-verdict-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .court-verdict-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .court-verdict-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .court-verdict-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .court-verdict-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .court-verdict-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .court-verdict-row { opacity: 1; }
    .court-verdict-r0 { animation-delay: 0.00s; }
    .court-verdict-r1 { animation-delay: 0.45s; }
    .court-verdict-r2 { animation-delay: 0.90s; }
    .court-verdict-r3 { animation-delay: 1.35s; }
    .court-verdict-r4 { animation-delay: 1.80s; }
    .court-verdict-row { animation: court-verdict-reveal 7.3s ease-in-out infinite; }
    @keyframes court-verdict-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="court-verdict-bg" width="980" height="390"/>
  <text class="court-verdict-h1"  x="30" y="40">A verdict</text>
  <text class="court-verdict-sub" x="30" y="64">Not proven, not innocent.</text>
  <rect class="court-verdict-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="court-verdict-name" x="46" y="122">A verdict</text>
  <text class="court-verdict-desc" x="46" y="142">Asymmetric.</text>
  <text class="court-verdict-desc court-verdict-row court-verdict-r0" x="46" y="182">Presumed not guilty to begin with</text>
  <text class="court-verdict-desc court-verdict-row court-verdict-r1" x="46" y="216">Evidence must exceed a standard</text>
  <text class="court-verdict-desc court-verdict-row court-verdict-r2" x="46" y="250">'Not guilty' is not 'innocent'</text>
  <text class="court-verdict-desc court-verdict-row court-verdict-r3" x="46" y="284">The standard is set in advance</text>
  <text class="court-verdict-desc court-verdict-row court-verdict-r4" x="46" y="318">This is the null hypothesis</text>
  <rect class="court-verdict-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="court-verdict-name" x="526" y="122">The parallel</text>
  <text class="court-verdict-desc" x="526" y="142">In testing.</text>
  <text class="court-verdict-desc court-verdict-row court-verdict-r0" x="526" y="182">Assume no effect to begin with</text>
  <text class="court-verdict-desc court-verdict-row court-verdict-r1" x="526" y="216">Data must be sufficiently unlikely</text>
  <text class="court-verdict-desc court-verdict-row court-verdict-r2" x="526" y="250">Failing to reject is not proving</text>
  <text class="court-verdict-desc court-verdict-row court-verdict-r3" x="526" y="284">The threshold is set in advance</text>
  <text class="court-verdict-desc court-verdict-row court-verdict-r4" x="526" y="318">This is the test</text>
  <text class="court-verdict-sub" x="30" y="372">The asymmetry is the point of both procedures: they are designed to control one kind of error, and they say correspondingly little about the other.</text>
</svg>
