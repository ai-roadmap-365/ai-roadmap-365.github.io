<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Prediction intervals, checked</title>
  <style>
    .prediction-intervals-bg   { fill: #f8fafc; }
    .prediction-intervals-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prediction-intervals-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prediction-intervals-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prediction-intervals-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prediction-intervals-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prediction-intervals-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prediction-intervals-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .prediction-intervals-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .prediction-intervals-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .prediction-intervals-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .prediction-intervals-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .prediction-intervals-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .prediction-intervals-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .prediction-intervals-stage { opacity: 1; }

    .prediction-intervals-s0 { animation-delay: 0.00s; }
    .prediction-intervals-e0 { animation-delay: 0.00s; }
    .prediction-intervals-s1 { animation-delay: 1.28s; }
    .prediction-intervals-e1 { animation-delay: 1.28s; }
    .prediction-intervals-s2 { animation-delay: 2.56s; }
    .prediction-intervals-e2 { animation-delay: 2.56s; }
    .prediction-intervals-s3 { animation-delay: 3.84s; }
    .prediction-intervals-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .prediction-intervals-conn  { animation: prediction-intervals-trace 6.4s ease-in-out infinite; }
      .prediction-intervals-stage { animation: prediction-intervals-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes prediction-intervals-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes prediction-intervals-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .prediction-intervals-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .prediction-intervals-stage { animation: prediction-intervals-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes prediction-intervals-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="prediction-intervals-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="prediction-intervals-bg" width="980" height="322"/>
  <text class="prediction-intervals-h1"  x="30" y="40">Prediction intervals, checked</text>
  <text class="prediction-intervals-sub" x="30" y="64">Four steps.</text>
  <g class="prediction-intervals-stage prediction-intervals-s0">
    <rect class="prediction-intervals-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="prediction-intervals-step" x="44" y="142">01</text>
    <text class="prediction-intervals-name" x="70" y="142">A point prediction alone is rarely what a decision needs</text>
    <text class="prediction-intervals-desc" x="44" y="166">A range is.</text>
  </g>
  <line class="prediction-intervals-line prediction-intervals-conn prediction-intervals-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#prediction-intervals-tip)"/>
  <g class="prediction-intervals-stage prediction-intervals-s1">
    <rect class="prediction-intervals-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="prediction-intervals-step" x="280" y="142">02</text>
    <text class="prediction-intervals-name" x="306" y="142">Construct an interval intended to contain the truth</text>
    <text class="prediction-intervals-desc" x="280" y="166">Ninety percent of the time, say.</text>
  </g>
  <line class="prediction-intervals-line prediction-intervals-conn prediction-intervals-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#prediction-intervals-tip)"/>
  <g class="prediction-intervals-stage prediction-intervals-s2">
    <rect class="prediction-intervals-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="prediction-intervals-step" x="516" y="142">03</text>
    <text class="prediction-intervals-name" x="542" y="142">Then count how often it actually does</text>
    <text class="prediction-intervals-desc" x="516" y="166">On the held-out data.</text>
  </g>
  <line class="prediction-intervals-line prediction-intervals-conn prediction-intervals-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#prediction-intervals-tip)"/>
  <g class="prediction-intervals-stage prediction-intervals-s3">
    <rect class="prediction-intervals-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="prediction-intervals-step" x="752" y="142">04</text>
    <text class="prediction-intervals-name" x="778" y="142">Nominal and realised coverage frequently differ</text>
    <text class="prediction-intervals-desc" x="752" y="166">Which is why the check is not</text>
    <text class="prediction-intervals-desc" x="752" y="182">optional.</text>
  </g>
  <text class="prediction-intervals-sub" x="30" y="304">Checking realised coverage against the nominal figure is the step almost always skipped, and an interval whose coverage was never verified is a claim rather than a measurement.</text>
</svg>
