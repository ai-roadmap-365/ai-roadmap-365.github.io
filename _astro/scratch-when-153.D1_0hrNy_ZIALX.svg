<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when to use the library.">
  <title>When to implement it yourself</title>
  <style>
    .scratch-when-153-bg   { fill: #f8fafc; }
    .scratch-when-153-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-when-153-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-when-153-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-when-153-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-when-153-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-when-153-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scratch-when-153-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scratch-when-153-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scratch-when-153-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scratch-when-153-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scratch-when-153-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scratch-when-153-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scratch-when-153-row { opacity: 1; }
    .scratch-when-153-r0 { animation-delay: 0.00s; }
    .scratch-when-153-r1 { animation-delay: 0.45s; }
    .scratch-when-153-r2 { animation-delay: 0.90s; }
    .scratch-when-153-r3 { animation-delay: 1.35s; }
    .scratch-when-153-r4 { animation-delay: 1.80s; }
    .scratch-when-153-row { animation: scratch-when-153-reveal 7.3s ease-in-out infinite; }
    @keyframes scratch-when-153-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="scratch-when-153-bg" width="980" height="390"/>
  <text class="scratch-when-153-h1"  x="30" y="40">When to implement it yourself</text>
  <text class="scratch-when-153-sub" x="30" y="64">And when to use the library.</text>
  <rect class="scratch-when-153-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="scratch-when-153-name" x="46" y="122">Write it</text>
  <text class="scratch-when-153-desc" x="46" y="142">Four reasons.</text>
  <text class="scratch-when-153-desc scratch-when-153-row scratch-when-153-r0" x="46" y="182">To understand what the library does</text>
  <text class="scratch-when-153-desc scratch-when-153-row scratch-when-153-r1" x="46" y="216">To learn where numerical issues arise</text>
  <text class="scratch-when-153-desc scratch-when-153-row scratch-when-153-r2" x="46" y="250">For a genuinely custom objective</text>
  <text class="scratch-when-153-desc scratch-when-153-row scratch-when-153-r3" x="46" y="284">In a constrained environment with no dependencies</text>
  <text class="scratch-when-153-desc scratch-when-153-row scratch-when-153-r4" x="46" y="318">Once, deliberately</text>
  <rect class="scratch-when-153-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="scratch-when-153-name" x="526" y="122">Use the library</text>
  <text class="scratch-when-153-desc" x="526" y="142">Everywhere else.</text>
  <text class="scratch-when-153-desc scratch-when-153-row scratch-when-153-r0" x="526" y="182">Any production use</text>
  <text class="scratch-when-153-desc scratch-when-153-row scratch-when-153-r1" x="526" y="216">Where numerical stability matters</text>
  <text class="scratch-when-153-desc scratch-when-153-row scratch-when-153-r2" x="526" y="250">Where speed matters</text>
  <text class="scratch-when-153-desc scratch-when-153-row scratch-when-153-r3" x="526" y="284">Where correctness must be assumed</text>
  <text class="scratch-when-153-desc scratch-when-153-row scratch-when-153-r4" x="526" y="318">Which is nearly always</text>
  <text class="scratch-when-153-sub" x="30" y="372">The exercise is for understanding rather than for deployment, and the correct conclusion from it is to use the library with more confidence rather than less.</text>
</svg>
