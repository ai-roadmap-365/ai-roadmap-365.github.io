<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three perturbations of a real case.">
  <title>Synthesising hard negatives</title>
  <style>
    .counterfactual-bg   { fill: #f8fafc; }
    .counterfactual-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .counterfactual-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .counterfactual-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .counterfactual-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .counterfactual-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .counterfactual-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .counterfactual-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .counterfactual-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .counterfactual-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .counterfactual-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .counterfactual-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .counterfactual-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .counterfactual-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .counterfactual-stage { opacity: 1; }

    .counterfactual-s0 { animation-delay: 0.00s; }
    .counterfactual-e0 { animation-delay: 0.00s; }
    .counterfactual-s1 { animation-delay: 1.50s; }
    .counterfactual-e1 { animation-delay: 1.50s; }
    .counterfactual-s2 { animation-delay: 3.00s; }
    .counterfactual-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .counterfactual-conn  { animation: counterfactual-trace 6s ease-in-out infinite; }
      .counterfactual-stage { animation: counterfactual-arrive 6s ease-in-out infinite; }
    }
    @keyframes counterfactual-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes counterfactual-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .counterfactual-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .counterfactual-stage { animation: counterfactual-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes counterfactual-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="counterfactual-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="counterfactual-bg" width="980" height="322"/>
  <text class="counterfactual-h1"  x="30" y="40">Synthesising hard negatives</text>
  <text class="counterfactual-sub" x="30" y="64">Three perturbations of a real case.</text>
  <g class="counterfactual-stage counterfactual-s0">
    <rect class="counterfactual-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="counterfactual-step" x="44" y="142">01</text>
    <text class="counterfactual-name" x="70" y="142">Entity swap</text>
    <text class="counterfactual-desc" x="44" y="166">Ask about a party the contract never</text>
    <text class="counterfactual-desc" x="44" y="182">mentions. Correct answer: abstain.</text>
    <text class="counterfactual-edge" x="44" y="242">abstention</text>
  </g>
  <line class="counterfactual-line counterfactual-conn counterfactual-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#counterfactual-tip)"/>
  <g class="counterfactual-stage counterfactual-s1">
    <rect class="counterfactual-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="counterfactual-step" x="359" y="142">02</text>
    <text class="counterfactual-name" x="385" y="142">Temporal inversion</text>
    <text class="counterfactual-desc" x="359" y="166">Shift dates so the question falls outside the</text>
    <text class="counterfactual-desc" x="359" y="182">context's period.</text>
  </g>
  <line class="counterfactual-line counterfactual-conn counterfactual-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#counterfactual-tip)"/>
  <g class="counterfactual-stage counterfactual-s2">
    <rect class="counterfactual-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="counterfactual-step" x="674" y="142">03</text>
    <text class="counterfactual-name" x="700" y="142">Numerical perturbation</text>
    <text class="counterfactual-desc" x="674" y="166">Change the figures, to test extraction</text>
    <text class="counterfactual-desc" x="674" y="182">against memorised pre-training.</text>
  </g>
  <text class="counterfactual-sub" x="30" y="304">The third is the sharpest test of grounding: a model that reproduces a well-known figure rather than the one in front of it is retrieving from its weights, and only altered numbers reveal that.</text>
</svg>
