<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward declared relations.">
  <title>Four steps in data storage</title>
  <style>
    .rdb-history-bg   { fill: #f8fafc; }
    .rdb-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rdb-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rdb-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rdb-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rdb-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rdb-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rdb-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rdb-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rdb-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rdb-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rdb-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rdb-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .rdb-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .rdb-history-stage { opacity: 1; }

    .rdb-history-s0 { animation-delay: 0.00s; }
    .rdb-history-e0 { animation-delay: 0.00s; }
    .rdb-history-s1 { animation-delay: 1.28s; }
    .rdb-history-e1 { animation-delay: 1.28s; }
    .rdb-history-s2 { animation-delay: 2.56s; }
    .rdb-history-e2 { animation-delay: 2.56s; }
    .rdb-history-s3 { animation-delay: 3.84s; }
    .rdb-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .rdb-history-conn  { animation: rdb-history-trace 6.4s ease-in-out infinite; }
      .rdb-history-stage { animation: rdb-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes rdb-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes rdb-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .rdb-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .rdb-history-stage { animation: rdb-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes rdb-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="rdb-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="rdb-history-bg" width="980" height="322"/>
  <text class="rdb-history-h1"  x="30" y="40">Four steps in data storage</text>
  <text class="rdb-history-sub" x="30" y="64">Toward declared relations.</text>
  <g class="rdb-history-stage rdb-history-s0">
    <rect class="rdb-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="rdb-history-step" x="44" y="142">01</text>
    <text class="rdb-history-name" x="70" y="142">Flat files, with the structure only in the code</text>
    <text class="rdb-history-desc" x="44" y="166">Which every program had to agree</text>
    <text class="rdb-history-desc" x="44" y="182">on.</text>
  </g>
  <line class="rdb-history-line rdb-history-conn rdb-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#rdb-history-tip)"/>
  <g class="rdb-history-stage rdb-history-s1">
    <rect class="rdb-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="rdb-history-step" x="280" y="142">02</text>
    <text class="rdb-history-name" x="306" y="142">Then navigational databases, traversed by pointer</text>
    <text class="rdb-history-desc" x="280" y="166">Fast, and rigid.</text>
  </g>
  <line class="rdb-history-line rdb-history-conn rdb-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#rdb-history-tip)"/>
  <g class="rdb-history-stage rdb-history-s2">
    <rect class="rdb-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="rdb-history-step" x="516" y="142">03</text>
    <text class="rdb-history-name" x="542" y="142">Then the relational model: declare what you want</text>
    <text class="rdb-history-desc" x="516" y="166">And let the engine find it.</text>
  </g>
  <line class="rdb-history-line rdb-history-conn rdb-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#rdb-history-tip)"/>
  <g class="rdb-history-stage rdb-history-s3">
    <rect class="rdb-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="rdb-history-step" x="752" y="142">04</text>
    <text class="rdb-history-name" x="778" y="142">And embedded engines putting all of it in a library</text>
    <text class="rdb-history-desc" x="752" y="166">With nothing to operate.</text>
  </g>
  <text class="rdb-history-sub" x="30" y="304">The relational step separated the question from the method, which is why decades of engine improvements benefited queries nobody rewrote.</text>
</svg>
