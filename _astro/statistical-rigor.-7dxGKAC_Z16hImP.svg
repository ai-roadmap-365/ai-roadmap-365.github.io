<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Bootstrap, and look at the lower bound.">
  <title>Is a 3.5% gain real?</title>
  <style>
    .statistical-rigor-bg   { fill: #f8fafc; }
    .statistical-rigor-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .statistical-rigor-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .statistical-rigor-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .statistical-rigor-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .statistical-rigor-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .statistical-rigor-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .statistical-rigor-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .statistical-rigor-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .statistical-rigor-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .statistical-rigor-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .statistical-rigor-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .statistical-rigor-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .statistical-rigor-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .statistical-rigor-stage { opacity: 1; }

    .statistical-rigor-s0 { animation-delay: 0.00s; }
    .statistical-rigor-e0 { animation-delay: 0.00s; }
    .statistical-rigor-s1 { animation-delay: 1.28s; }
    .statistical-rigor-e1 { animation-delay: 1.28s; }
    .statistical-rigor-s2 { animation-delay: 2.56s; }
    .statistical-rigor-e2 { animation-delay: 2.56s; }
    .statistical-rigor-s3 { animation-delay: 3.84s; }
    .statistical-rigor-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .statistical-rigor-conn  { animation: statistical-rigor-trace 6.4s ease-in-out infinite; }
      .statistical-rigor-stage { animation: statistical-rigor-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes statistical-rigor-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes statistical-rigor-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .statistical-rigor-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .statistical-rigor-stage { animation: statistical-rigor-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes statistical-rigor-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="statistical-rigor-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="statistical-rigor-bg" width="980" height="322"/>
  <text class="statistical-rigor-h1"  x="30" y="40">Is a 3.5% gain real?</text>
  <text class="statistical-rigor-sub" x="30" y="64">Bootstrap, and look at the lower bound.</text>
  <g class="statistical-rigor-stage statistical-rigor-s0">
    <rect class="statistical-rigor-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="statistical-rigor-step" x="44" y="142">01</text>
    <text class="statistical-rigor-name" x="70" y="142">Resample with replacement</text>
    <text class="statistical-rigor-desc" x="44" y="166">A thousand bootstrap samples</text>
    <text class="statistical-rigor-desc" x="44" y="182">from the same test cases.</text>
  </g>
  <line class="statistical-rigor-line statistical-rigor-conn statistical-rigor-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#statistical-rigor-tip)"/>
  <g class="statistical-rigor-stage statistical-rigor-s1">
    <rect class="statistical-rigor-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="statistical-rigor-step" x="280" y="142">02</text>
    <text class="statistical-rigor-name" x="306" y="142">Compute the delta each time</text>
    <text class="statistical-rigor-desc" x="280" y="166">A distribution of possible</text>
    <text class="statistical-rigor-desc" x="280" y="182">deltas rather than one number.</text>
  </g>
  <line class="statistical-rigor-line statistical-rigor-conn statistical-rigor-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#statistical-rigor-tip)"/>
  <g class="statistical-rigor-stage statistical-rigor-s2">
    <rect class="statistical-rigor-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="statistical-rigor-step" x="516" y="142">03</text>
    <text class="statistical-rigor-name" x="542" y="142">Take the 2.5th and 97.5th percentiles</text>
    <text class="statistical-rigor-desc" x="516" y="166">A 95% confidence interval on the</text>
    <text class="statistical-rigor-desc" x="516" y="182">improvement.</text>
    <text class="statistical-rigor-edge" x="516" y="242">interval</text>
  </g>
  <line class="statistical-rigor-line statistical-rigor-conn statistical-rigor-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#statistical-rigor-tip)"/>
  <g class="statistical-rigor-stage statistical-rigor-s3">
    <rect class="statistical-rigor-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="statistical-rigor-step" x="752" y="142">04</text>
    <text class="statistical-rigor-name" x="778" y="142">Decide on the lower bound</text>
    <text class="statistical-rigor-desc" x="752" y="166">If it clears the threshold, the</text>
    <text class="statistical-rigor-desc" x="752" y="182">gain is verified.</text>
  </g>
  <text class="statistical-rigor-sub" x="30" y="304">Judging on the point estimate is how teams ship prompt changes that were sampling noise: a +3.5% mean with a confidence interval spanning zero is not an improvement anyone can rely on.</text>
</svg>
