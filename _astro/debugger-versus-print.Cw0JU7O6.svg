<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="It answers one question, and you must edit the code to ask the next.">
  <title>Why print debugging stops scaling</title>
  <style>
    .debugger-versus-print-bg   { fill: #f8fafc; }
    .debugger-versus-print-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .debugger-versus-print-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .debugger-versus-print-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .debugger-versus-print-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .debugger-versus-print-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .debugger-versus-print-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .debugger-versus-print-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .debugger-versus-print-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .debugger-versus-print-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .debugger-versus-print-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .debugger-versus-print-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .debugger-versus-print-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .debugger-versus-print-row { opacity: 1; }
    .debugger-versus-print-r0 { animation-delay: 0.00s; }
    .debugger-versus-print-r1 { animation-delay: 0.45s; }
    .debugger-versus-print-r2 { animation-delay: 0.90s; }
    .debugger-versus-print-r3 { animation-delay: 1.35s; }
    .debugger-versus-print-r4 { animation-delay: 1.80s; }
    .debugger-versus-print-row { animation: debugger-versus-print-reveal 7.3s ease-in-out infinite; }
    @keyframes debugger-versus-print-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="debugger-versus-print-bg" width="980" height="390"/>
  <text class="debugger-versus-print-h1"  x="30" y="40">Why print debugging stops scaling</text>
  <text class="debugger-versus-print-sub" x="30" y="64">It answers one question, and you must edit the code to ask the next.</text>
  <rect class="debugger-versus-print-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="debugger-versus-print-name" x="46" y="122">print()</text>
  <text class="debugger-versus-print-desc" x="46" y="142">One question per run.</text>
  <text class="debugger-versus-print-desc debugger-versus-print-row debugger-versus-print-r0" x="46" y="182">Edit, run, read, edit again</text>
  <text class="debugger-versus-print-desc debugger-versus-print-row debugger-versus-print-r1" x="46" y="216">Only the values you thought to print</text>
  <text class="debugger-versus-print-desc debugger-versus-print-row debugger-versus-print-r2" x="46" y="250">No way up the call stack</text>
  <text class="debugger-versus-print-desc debugger-versus-print-row debugger-versus-print-r3" x="46" y="284">Prints left behind, and committed</text>
  <text class="debugger-versus-print-desc debugger-versus-print-row debugger-versus-print-r4" x="46" y="318">Works everywhere, which is its real virtue</text>
  <rect class="debugger-versus-print-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="debugger-versus-print-name" x="526" y="122">A debugger</text>
  <text class="debugger-versus-print-desc" x="526" y="142">Every question, one pause.</text>
  <text class="debugger-versus-print-desc debugger-versus-print-row debugger-versus-print-r0" x="526" y="182">Stop once; ask anything</text>
  <text class="debugger-versus-print-desc debugger-versus-print-row debugger-versus-print-r1" x="526" y="216">Every variable in scope, live</text>
  <text class="debugger-versus-print-desc debugger-versus-print-row debugger-versus-print-r2" x="526" y="250">Click up the stack to each caller</text>
  <text class="debugger-versus-print-desc debugger-versus-print-row debugger-versus-print-r3" x="526" y="284">Nothing added to the code</text>
  <text class="debugger-versus-print-desc debugger-versus-print-row debugger-versus-print-r4" x="526" y="318">Conditional: stop on iteration 4,732 only</text>
  <text class="debugger-versus-print-sub" x="30" y="372">print is not wrong — it is genuinely the right tool in a container, a CI log, or anywhere you cannot attach. The mistake is reaching for it a third time on the same bug.</text>
</svg>
