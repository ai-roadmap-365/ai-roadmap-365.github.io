<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to choose a non-relational store</title>
  <style>
    .nosql-when-bg   { fill: #f8fafc; }
    .nosql-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nosql-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .nosql-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .nosql-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .nosql-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .nosql-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .nosql-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nosql-when-row { opacity: 1; }
    .nosql-when-r0 { animation-delay: 0.00s; }
    .nosql-when-r1 { animation-delay: 0.45s; }
    .nosql-when-r2 { animation-delay: 0.90s; }
    .nosql-when-r3 { animation-delay: 1.35s; }
    .nosql-when-r4 { animation-delay: 1.80s; }
    .nosql-when-row { animation: nosql-when-reveal 7.3s ease-in-out infinite; }
    @keyframes nosql-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="nosql-when-bg" width="980" height="390"/>
  <text class="nosql-when-h1"  x="30" y="40">When to choose a non-relational store</text>
  <text class="nosql-when-sub" x="30" y="64">And when not to.</text>
  <rect class="nosql-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="nosql-when-name" x="46" y="122">Non-relational</text>
  <text class="nosql-when-desc" x="46" y="142">Four cases.</text>
  <text class="nosql-when-desc nosql-when-row nosql-when-r0" x="46" y="182">Lookup by a single key dominates</text>
  <text class="nosql-when-desc nosql-when-row nosql-when-r1" x="46" y="216">Records genuinely vary in shape</text>
  <text class="nosql-when-desc nosql-when-row nosql-when-r2" x="46" y="250">Write volume exceeds one machine</text>
  <text class="nosql-when-desc nosql-when-row nosql-when-r3" x="46" y="284">Deep relationship traversal</text>
  <text class="nosql-when-desc nosql-when-row nosql-when-r4" x="46" y="318">Caching and ephemeral state</text>
  <rect class="nosql-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="nosql-when-name" x="526" y="122">Relational</text>
  <text class="nosql-when-desc" x="526" y="142">Also four.</text>
  <text class="nosql-when-desc nosql-when-row nosql-when-r0" x="526" y="182">Data with strong relationships</text>
  <text class="nosql-when-desc nosql-when-row nosql-when-r1" x="526" y="216">Unpredictable ad hoc queries</text>
  <text class="nosql-when-desc nosql-when-row nosql-when-r2" x="526" y="250">Integrity rules that must hold</text>
  <text class="nosql-when-desc nosql-when-row nosql-when-r3" x="526" y="284">Reporting and analytics</text>
  <text class="nosql-when-desc nosql-when-row nosql-when-r4" x="526" y="318">The default until proven otherwise</text>
  <text class="nosql-when-sub" x="30" y="372">Relational as the default is the honest recommendation: most systems never reach the scale that motivated the alternatives, and pay their costs anyway.</text>
</svg>
