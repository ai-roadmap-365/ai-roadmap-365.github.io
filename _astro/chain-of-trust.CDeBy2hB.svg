<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" font-family="system-ui, sans-serif">
  <title>The chain of trust: a root CA signs an intermediate CA, which signs the site certificate, and the browser validates the chain up to a trusted root</title>
  <rect x="0" y="0" width="720" height="520" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The chain of trust</text>

  <!-- Root CA -->
  <rect x="220" y="60" width="280" height="72" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="360" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Root CA certificate</text>
  <text x="360" y="110" text-anchor="middle" font-size="14" fill="#1a202c">Self-signed; preloaded in your</text>
  <text x="360" y="126" text-anchor="middle" font-size="14" fill="#1a202c">browser / OS trust store</text>

  <!-- Arrow down -->
  <line x1="360" y1="132" x2="360" y2="178" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="360,186 353,172 367,172" fill="#1d4ed8"/>
  <text x="470" y="164" text-anchor="middle" font-size="13" fill="#1d4ed8">signs</text>

  <!-- Intermediate CA -->
  <rect x="220" y="188" width="280" height="72" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="360" y="216" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Intermediate CA certificate</text>
  <text x="360" y="238" text-anchor="middle" font-size="14" fill="#1a202c">Signed by the root; kept online</text>
  <text x="360" y="254" text-anchor="middle" font-size="14" fill="#1a202c">to issue day-to-day certificates</text>

  <!-- Arrow down -->
  <line x1="360" y1="260" x2="360" y2="306" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="360,314 353,300 367,300" fill="#1d4ed8"/>
  <text x="470" y="292" text-anchor="middle" font-size="13" fill="#1d4ed8">signs</text>

  <!-- Site certificate -->
  <rect x="220" y="316" width="280" height="72" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="360" y="344" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Site (leaf) certificate</text>
  <text x="360" y="366" text-anchor="middle" font-size="14" fill="#1a202c">Names the domain, holds the</text>
  <text x="360" y="382" text-anchor="middle" font-size="14" fill="#1a202c">server's public key, has an expiry</text>

  <!-- Validation arrow going up -->
  <line x1="150" y1="352" x2="150" y2="96" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="6 5"/>
  <polygon points="150,88 143,102 157,102" fill="#1d4ed8"/>
  <text x="150" y="372" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Browser</text>
  <text x="150" y="392" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">validates</text>
  <text x="150" y="412" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">upward</text>

  <!-- Footer note -->
  <rect x="60" y="440" width="600" height="60" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="360" y="464" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Each certificate is verified against the one above it, up to a root the browser</text>
  <text x="360" y="486" text-anchor="middle" font-size="14" fill="#1a202c">already trusts. If any link is broken, expired, or untrusted, the connection fails.</text>
</svg>
