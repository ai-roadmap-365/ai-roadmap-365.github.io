<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="Feature Scaling Comparison Diagram">
  <title>Feature Scaling Transformations Comparison</title>
  <defs>
    <style>
      .d170a-bg { fill: #f8fafc; }
      .d170a-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d170a-header { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; }
      .d170a-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
      .d170a-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
      .d170a-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 11px; font-weight: 600; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="d170a-bg" />

  <text x="40" y="45" class="d170a-header" font-size="22">Feature Scaling Transformation Properties</text>
  <text x="40" y="70" class="d170a-text" font-size="13">Comparing StandardScaler, MinMaxScaler, and Outlier-Resilient RobustScaler</text>

  <!-- 1. Raw Data with Outlier -->
  <rect x="40" y="100" width="260" height="340" class="d170a-box" />
  <text x="60" y="130" class="d170a-title" fill="#b91c1c">1. Raw Feature (With Outlier)</text>
  <text x="60" y="155" class="d170a-text">Data: [10, 12, 14, 15, 18, 20] + <tspan fill="#b91c1c" font-weight="700">5000 (Outlier)</tspan></text>
  <line x1="60" y1="220" x2="280" y2="220" stroke="#94a3b8" stroke-width="2" />
  <circle cx="70" cy="220" r="4" fill="#3b82f6" /><circle cx="75" cy="220" r="4" fill="#3b82f6" /><circle cx="80" cy="220" r="4" fill="#3b82f6" />
  <circle cx="270" cy="220" r="5" fill="#ef4444" />
  <text x="60" y="270" class="d170a-text">• Massive scale disparity ($0 to $5,000).</text>
  <text x="60" y="295" class="d170a-text">• Destroys gradient descent condition number.</text>
  <text x="60" y="320" class="d170a-text">• Distorts Euclidean distance metrics.</text>

  <!-- 2. StandardScaler -->
  <rect x="320" y="100" width="260" height="340" class="d170a-box" />
  <text x="340" y="130" class="d170a-title" fill="#1d4ed8">2. StandardScaler (Z-Score)</text>
  <text x="340" y="155" class="d170a-math">z = (x - μ) / σ</text>
  <line x1="340" y1="220" x2="560" y2="220" stroke="#94a3b8" stroke-width="2" />
  <circle cx="370" cy="220" r="4" fill="#3b82f6" /><circle cx="373" cy="220" r="4" fill="#3b82f6" />
  <circle cx="545" cy="220" r="5" fill="#ef4444" />
  <text x="340" y="270" class="d170a-text">• Guarantees <tspan font-weight="700">Mean = 0, Std = 1</tspan>.</text>
  <text x="340" y="295" class="d170a-text">• Outlier pulls mean μ to 730, squishing</text>
  <text x="340" y="315" class="d170a-text">  all inliers into a tight compressed clump.</text>
  <text x="340" y="345" class="d170a-text">• Best for roughly Gaussian features.</text>

  <!-- 3. RobustScaler -->
  <rect x="600" y="100" width="260" height="340" class="d170a-box" fill="#f0fdf4" stroke="#22c55e" />
  <text x="620" y="130" class="d170a-title" fill="#15803d">3. RobustScaler (Median / IQR)</text>
  <text x="620" y="155" class="d170a-math">z = (x - Median) / IQR</text>
  <line x1="620" y1="220" x2="840" y2="220" stroke="#94a3b8" stroke-width="2" />
  <circle cx="650" cy="220" r="4" fill="#3b82f6" /><circle cx="680" cy="220" r="4" fill="#3b82f6" /><circle cx="710" cy="220" r="4" fill="#3b82f6" /><circle cx="740" cy="220" r="4" fill="#3b82f6" />
  <circle cx="830" cy="220" r="5" fill="#ef4444" />
  <text x="620" y="270" class="d170a-text">• Uses <tspan font-weight="700">Median = 15, IQR = 6</tspan>.</text>
  <text x="620" y="295" class="d170a-text">• Inliers retain rich, uncompressed variance.</text>
  <text x="620" y="320" class="d170a-text">• Outlier is scaled naturally without distorting core data.</text>
  <text x="620" y="350" class="d170a-math" fill="#15803d">Outlier-Resilient Standard</text>
</svg>
