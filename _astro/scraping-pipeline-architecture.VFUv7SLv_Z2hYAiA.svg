<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" font-family="system-ui, sans-serif">
  <title>The architecture of a responsible scraper: three permission gates — robots.txt, terms of service and a rate limit — stand between the target URL and the fetch stage; the fetch stage sits behind a local response cache, and everything downstream of the cache — parse, extract, validate, store — costs the source site nothing however many times it runs</title>
  <rect x="0" y="0" width="900" height="700" fill="#f8fafc"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">A responsible scraping pipeline</text>
  <text x="450" y="58" text-anchor="middle" font-size="14" fill="#1a202c">Permission first. Then one fetch. Then everything else runs for free.</text>

  <!-- The target -->
  <rect x="330" y="80" width="240" height="46" fill="#e2e8f0" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="450" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">A URL you want data from</text>
  <text x="450" y="119" text-anchor="middle" font-size="14" fill="#1a202c">visible to a human, not offered to a machine</text>
  <line x1="450" y1="126" x2="450" y2="148" stroke="#1a202c" stroke-width="2"/>
  <polygon points="450,152 444,138 456,138" fill="#1a202c"/>

  <!-- Permission band -->
  <rect x="40" y="152" width="820" height="132" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="60" y="176" font-size="16" font-weight="bold" fill="#1d4ed8">Permission gates — all three, before any socket opens</text>

  <rect x="60" y="190" width="240" height="78" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="76" y="212" font-size="15" font-weight="bold" fill="#1a202c">1. robots.txt</text>
  <text x="76" y="232" font-size="14" fill="#1a202c">urllib.robotparser.can_fetch</text>
  <text x="76" y="250" font-size="14" fill="#1a202c">per User-Agent, per path.</text>
  <text x="76" y="264" font-size="14" fill="#1a202c">Refused here means never fetched.</text>

  <rect x="330" y="190" width="240" height="78" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="346" y="212" font-size="15" font-weight="bold" fill="#1a202c">2. Terms of service</text>
  <text x="346" y="232" font-size="14" fill="#1a202c">A contract question, not a</text>
  <text x="346" y="250" font-size="14" fill="#1a202c">technical one. No library can</text>
  <text x="346" y="264" font-size="14" fill="#1a202c">answer it. A person reads them.</text>

  <rect x="600" y="190" width="240" height="78" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="616" y="212" font-size="15" font-weight="bold" fill="#1a202c">3. Rate limit</text>
  <text x="616" y="232" font-size="14" fill="#1a202c">Crawl-delay, or your own slower</text>
  <text x="616" y="250" font-size="14" fill="#1a202c">figure. Someone else's users are</text>
  <text x="616" y="264" font-size="14" fill="#1a202c">sharing that server with you.</text>

  <line x1="450" y1="284" x2="450" y2="306" stroke="#1a202c" stroke-width="2"/>
  <polygon points="450,310 444,296 456,296" fill="#1a202c"/>

  <!-- Fetch -->
  <rect x="290" y="310" width="320" height="66" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="450" y="334" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Fetch — the only stage that touches the site</text>
  <text x="450" y="354" text-anchor="middle" font-size="14" fill="#1a202c">requests.Session, a timeout, an honest User-Agent</text>
  <text x="450" y="370" text-anchor="middle" font-size="14" fill="#1a202c">with a way to contact you</text>

  <text x="626" y="340" font-size="14" fill="#1d4ed8">runs once per page,</text>
  <text x="626" y="358" font-size="14" fill="#1d4ed8">ever</text>

  <line x1="450" y1="376" x2="450" y2="398" stroke="#1a202c" stroke-width="2"/>
  <polygon points="450,402 444,388 456,388" fill="#1a202c"/>

  <!-- Cache -->
  <rect x="250" y="402" width="400" height="66" fill="#f8fafc" stroke="#1d4ed8" stroke-width="3" rx="8"/>
  <text x="450" y="426" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">Local response cache</text>
  <text x="450" y="446" text-anchor="middle" font-size="14" fill="#1a202c">one file per URL on your own disk —</text>
  <text x="450" y="462" text-anchor="middle" font-size="14" fill="#1a202c">the boundary between their cost and yours</text>

  <line x1="450" y1="468" x2="450" y2="490" stroke="#1a202c" stroke-width="2"/>
  <polygon points="450,494 444,480 456,480" fill="#1a202c"/>

  <!-- Downstream band -->
  <rect x="40" y="494" width="820" height="120" fill="#e2e8f0" stroke="#1a202c" stroke-width="2" rx="10"/>
  <text x="60" y="518" font-size="16" font-weight="bold" fill="#1a202c">Everything below the cache is free to run again — and you will run it twenty times</text>

  <rect x="60" y="530" width="180" height="66" fill="#f8fafc" stroke="#1a202c" stroke-width="2" rx="6"/>
  <text x="150" y="554" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Parse</text>
  <text x="150" y="574" text-anchor="middle" font-size="14" fill="#1a202c">HTML to a tree</text>
  <text x="150" y="590" text-anchor="middle" font-size="14" fill="#1a202c">BeautifulSoup</text>

  <rect x="260" y="530" width="180" height="66" fill="#f8fafc" stroke="#1a202c" stroke-width="2" rx="6"/>
  <text x="350" y="554" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Extract</text>
  <text x="350" y="574" text-anchor="middle" font-size="14" fill="#1a202c">CSS selectors,</text>
  <text x="350" y="590" text-anchor="middle" font-size="14" fill="#1a202c">missing element = None</text>

  <rect x="460" y="530" width="180" height="66" fill="#f8fafc" stroke="#1a202c" stroke-width="2" rx="6"/>
  <text x="550" y="554" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Validate</text>
  <text x="550" y="574" text-anchor="middle" font-size="14" fill="#1a202c">types, ranges, and</text>
  <text x="550" y="590" text-anchor="middle" font-size="14" fill="#1a202c">"did half the rows vanish?"</text>

  <rect x="660" y="530" width="180" height="66" fill="#f8fafc" stroke="#1a202c" stroke-width="2" rx="6"/>
  <text x="750" y="554" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Store</text>
  <text x="750" y="574" text-anchor="middle" font-size="14" fill="#1a202c">CSV, JSON, a database —</text>
  <text x="750" y="590" text-anchor="middle" font-size="14" fill="#1a202c">with its provenance</text>

  <line x1="240" y1="563" x2="256" y2="563" stroke="#1a202c" stroke-width="2"/>
  <polygon points="260,563 246,557 246,569" fill="#1a202c"/>
  <line x1="440" y1="563" x2="456" y2="563" stroke="#1a202c" stroke-width="2"/>
  <polygon points="460,563 446,557 446,569" fill="#1a202c"/>
  <line x1="640" y1="563" x2="656" y2="563" stroke="#1a202c" stroke-width="2"/>
  <polygon points="660,563 646,557 646,569" fill="#1a202c"/>

  <!-- Feedback arrow: iterate on the parser without refetching -->
  <path d="M 60 596 L 30 596 L 30 435 L 246 435" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="250,435 236,429 236,441" fill="#1d4ed8"/>
  <text x="60" y="638" font-size="14" fill="#1d4ed8">Every parser fix re-reads the cache, not the site. That dashed line is the whole ethic in one arrow.</text>
  <text x="60" y="660" font-size="14" fill="#1a202c">The one thing you never cache is robots.txt — permission is re-checked each run, because the owner may have changed their mind.</text>
  <text x="60" y="682" font-size="14" fill="#1a202c">Provenance travels with the data: which URL, which day, under which rules. That is the record you will be asked for later.</text>
</svg>
