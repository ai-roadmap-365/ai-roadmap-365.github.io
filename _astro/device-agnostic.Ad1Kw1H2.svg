<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One variable, used everywhere.">
  <title>Writing device-agnostic code</title>
  <style>
    .device-agnostic-bg   { fill: #f8fafc; }
    .device-agnostic-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .device-agnostic-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .device-agnostic-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .device-agnostic-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .device-agnostic-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .device-agnostic-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .device-agnostic-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .device-agnostic-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .device-agnostic-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .device-agnostic-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .device-agnostic-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .device-agnostic-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .device-agnostic-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .device-agnostic-stage { opacity: 1; }

    .device-agnostic-s0 { animation-delay: 0.00s; }
    .device-agnostic-e0 { animation-delay: 0.00s; }
    .device-agnostic-s1 { animation-delay: 1.50s; }
    .device-agnostic-e1 { animation-delay: 1.50s; }
    .device-agnostic-s2 { animation-delay: 3.00s; }
    .device-agnostic-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .device-agnostic-conn  { animation: device-agnostic-trace 6s ease-in-out infinite; }
      .device-agnostic-stage { animation: device-agnostic-arrive 6s ease-in-out infinite; }
    }
    @keyframes device-agnostic-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes device-agnostic-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .device-agnostic-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .device-agnostic-stage { animation: device-agnostic-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes device-agnostic-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="device-agnostic-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="device-agnostic-bg" width="980" height="322"/>
  <text class="device-agnostic-h1"  x="30" y="40">Writing device-agnostic code</text>
  <text class="device-agnostic-sub" x="30" y="64">One variable, used everywhere.</text>
  <g class="device-agnostic-stage device-agnostic-s0">
    <rect class="device-agnostic-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="device-agnostic-step" x="44" y="142">01</text>
    <text class="device-agnostic-name" x="70" y="142">Select the device once</text>
    <text class="device-agnostic-desc" x="44" y="166">Accelerator if available, otherwise the CPU.</text>
  </g>
  <line class="device-agnostic-line device-agnostic-conn device-agnostic-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#device-agnostic-tip)"/>
  <g class="device-agnostic-stage device-agnostic-s1">
    <rect class="device-agnostic-good" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="device-agnostic-step" x="359" y="142">02</text>
    <text class="device-agnostic-name" x="385" y="142">Move model and data to it consistently</text>
    <text class="device-agnostic-desc" x="359" y="166">A mismatch raises immediately rather than</text>
    <text class="device-agnostic-desc" x="359" y="182">computing wrongly.</text>
  </g>
  <line class="device-agnostic-line device-agnostic-conn device-agnostic-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#device-agnostic-tip)"/>
  <g class="device-agnostic-stage device-agnostic-s2">
    <rect class="device-agnostic-warn" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="device-agnostic-step" x="674" y="142">03</text>
    <text class="device-agnostic-name" x="700" y="142">Never hardcode</text>
    <text class="device-agnostic-desc" x="674" y="166">A pinned device is what makes a notebook fail</text>
    <text class="device-agnostic-desc" x="674" y="182">on somebody else's machine.</text>
  </g>
  <text class="device-agnostic-sub" x="30" y="304">The immediate error on a device mismatch is a feature worth appreciating: silently moving tensors between devices would hide a performance disaster behind correct-looking results.</text>
</svg>
