<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>How errors compound</title>
  <style>
    .cascading-errors-bg   { fill: #f8fafc; }
    .cascading-errors-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cascading-errors-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cascading-errors-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cascading-errors-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cascading-errors-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cascading-errors-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cascading-errors-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cascading-errors-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cascading-errors-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cascading-errors-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cascading-errors-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cascading-errors-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cascading-errors-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cascading-errors-stage { opacity: 1; }

    .cascading-errors-s0 { animation-delay: 0.00s; }
    .cascading-errors-e0 { animation-delay: 0.00s; }
    .cascading-errors-s1 { animation-delay: 1.28s; }
    .cascading-errors-e1 { animation-delay: 1.28s; }
    .cascading-errors-s2 { animation-delay: 2.56s; }
    .cascading-errors-e2 { animation-delay: 2.56s; }
    .cascading-errors-s3 { animation-delay: 3.84s; }
    .cascading-errors-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cascading-errors-conn  { animation: cascading-errors-trace 6.4s ease-in-out infinite; }
      .cascading-errors-stage { animation: cascading-errors-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cascading-errors-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cascading-errors-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cascading-errors-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cascading-errors-stage { animation: cascading-errors-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cascading-errors-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cascading-errors-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cascading-errors-bg" width="980" height="322"/>
  <text class="cascading-errors-h1"  x="30" y="40">How errors compound</text>
  <text class="cascading-errors-sub" x="30" y="64">Four steps.</text>
  <g class="cascading-errors-stage cascading-errors-s0">
    <rect class="cascading-errors-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cascading-errors-step" x="44" y="142">01</text>
    <text class="cascading-errors-name" x="70" y="142">Each stage is individually accurate</text>
    <text class="cascading-errors-desc" x="44" y="166">Ninety-five percent sounds fine.</text>
  </g>
  <line class="cascading-errors-line cascading-errors-conn cascading-errors-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cascading-errors-tip)"/>
  <g class="cascading-errors-stage cascading-errors-s1">
    <rect class="cascading-errors-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cascading-errors-step" x="280" y="142">02</text>
    <text class="cascading-errors-name" x="306" y="142">But accuracy multiplies across stages</text>
    <text class="cascading-errors-desc" x="280" y="166">Not averages.</text>
  </g>
  <line class="cascading-errors-line cascading-errors-conn cascading-errors-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cascading-errors-tip)"/>
  <g class="cascading-errors-stage cascading-errors-s2">
    <rect class="cascading-errors-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cascading-errors-step" x="516" y="142">03</text>
    <text class="cascading-errors-name" x="542" y="142">So four such stages give about eighty percent</text>
    <text class="cascading-errors-desc" x="516" y="166">Which is a very different</text>
    <text class="cascading-errors-desc" x="516" y="182">product.</text>
  </g>
  <line class="cascading-errors-line cascading-errors-conn cascading-errors-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cascading-errors-tip)"/>
  <g class="cascading-errors-stage cascading-errors-s3">
    <rect class="cascading-errors-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cascading-errors-step" x="752" y="142">04</text>
    <text class="cascading-errors-name" x="778" y="142">Mitigated by confidence gates between stages</text>
    <text class="cascading-errors-desc" x="752" y="166">Stopping rather than passing a</text>
    <text class="cascading-errors-desc" x="752" y="182">bad result forward.</text>
  </g>
  <text class="cascading-errors-sub" x="30" y="304">Reading a stage's accuracy as a multiplier rather than a score is the mental shift, and it is why adding a stage can make a pipeline worse even when the stage works.</text>
</svg>
