<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The gates are yours either way.">
  <title>Choosing what runs the gates</title>
  <style>
    .platform-choice-bg   { fill: #f8fafc; }
    .platform-choice-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .platform-choice-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .platform-choice-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .platform-choice-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .platform-choice-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .platform-choice-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .platform-choice-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .platform-choice-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .platform-choice-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .platform-choice-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .platform-choice-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .platform-choice-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .platform-choice-row { opacity: 1; }
    .platform-choice-r0 { animation-delay: 0.00s; }
    .platform-choice-r1 { animation-delay: 0.45s; }
    .platform-choice-r2 { animation-delay: 0.90s; }
    .platform-choice-r3 { animation-delay: 1.35s; }
    .platform-choice-r4 { animation-delay: 1.80s; }
    .platform-choice-row { animation: platform-choice-reveal 7.3s ease-in-out infinite; }
    @keyframes platform-choice-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="platform-choice-bg" width="980" height="390"/>
  <text class="platform-choice-h1"  x="30" y="40">Choosing what runs the gates</text>
  <text class="platform-choice-sub" x="30" y="64">The gates are yours either way.</text>
  <rect class="platform-choice-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="platform-choice-name" x="46" y="122">Managed platform</text>
  <text class="platform-choice-desc" x="46" y="142">Usually right for a capstone.</text>
  <text class="platform-choice-desc platform-choice-row platform-choice-r0" x="46" y="182">Health checks and rollback built in</text>
  <text class="platform-choice-desc platform-choice-row platform-choice-r1" x="46" y="216">One command to go back</text>
  <text class="platform-choice-desc platform-choice-row platform-choice-r2" x="46" y="250">Scale to zero, so idle costs nothing</text>
  <text class="platform-choice-desc platform-choice-row platform-choice-r3" x="46" y="284">Traffic splitting for canaries</text>
  <text class="platform-choice-desc platform-choice-row platform-choice-r4" x="46" y="318">Removes what you are not learning</text>
  <rect class="platform-choice-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="platform-choice-name" x="526" y="122">Self-operated</text>
  <text class="platform-choice-desc" x="526" y="142">Right at scale, costly before it.</text>
  <text class="platform-choice-desc platform-choice-row platform-choice-r0" x="526" y="182">Kubernetes, Nomad, Compose on a host</text>
  <text class="platform-choice-desc platform-choice-row platform-choice-r1" x="526" y="216">Full control of every probe</text>
  <text class="platform-choice-desc platform-choice-row platform-choice-r2" x="526" y="250">A substantial operational commitment</text>
  <text class="platform-choice-desc platform-choice-row platform-choice-r3" x="526" y="284">Argo Rollouts and Flagger add analysis</text>
  <text class="platform-choice-desc platform-choice-row platform-choice-r4" x="526" y="318">Worth it once you have the scale</text>
  <text class="platform-choice-sub" x="30" y="372">Docker Compose on a single host is a legitimate answer for a capstone: rollback is bringing up the previous image tag, which satisfies the one control you must never skip.</text>
</svg>
