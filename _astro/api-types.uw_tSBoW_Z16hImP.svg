<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four consequences.">
  <title>Type hints doing real work</title>
  <style>
    .api-types-bg   { fill: #f8fafc; }
    .api-types-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-types-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-types-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-types-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-types-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-types-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .api-types-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .api-types-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .api-types-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .api-types-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .api-types-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .api-types-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .api-types-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .api-types-stage { opacity: 1; }

    .api-types-s0 { animation-delay: 0.00s; }
    .api-types-e0 { animation-delay: 0.00s; }
    .api-types-s1 { animation-delay: 1.28s; }
    .api-types-e1 { animation-delay: 1.28s; }
    .api-types-s2 { animation-delay: 2.56s; }
    .api-types-e2 { animation-delay: 2.56s; }
    .api-types-s3 { animation-delay: 3.84s; }
    .api-types-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .api-types-conn  { animation: api-types-trace 6.4s ease-in-out infinite; }
      .api-types-stage { animation: api-types-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes api-types-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes api-types-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .api-types-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .api-types-stage { animation: api-types-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes api-types-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="api-types-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="api-types-bg" width="980" height="322"/>
  <text class="api-types-h1"  x="30" y="40">Type hints doing real work</text>
  <text class="api-types-sub" x="30" y="64">Four consequences.</text>
  <g class="api-types-stage api-types-s0">
    <rect class="api-types-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="api-types-step" x="44" y="142">01</text>
    <text class="api-types-name" x="70" y="142">The annotation says what shape the input must have</text>
    <text class="api-types-desc" x="44" y="166">Written once, in the signature.</text>
  </g>
  <line class="api-types-line api-types-conn api-types-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#api-types-tip)"/>
  <g class="api-types-stage api-types-s1">
    <rect class="api-types-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="api-types-step" x="280" y="142">02</text>
    <text class="api-types-name" x="306" y="142">From it, parsing and validation are generated</text>
    <text class="api-types-desc" x="280" y="166">With errors that name the</text>
    <text class="api-types-desc" x="280" y="182">offending field.</text>
  </g>
  <line class="api-types-line api-types-conn api-types-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#api-types-tip)"/>
  <g class="api-types-stage api-types-s2">
    <rect class="api-types-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="api-types-step" x="516" y="142">03</text>
    <text class="api-types-name" x="542" y="142">And so is the interface documentation</text>
    <text class="api-types-desc" x="516" y="166">Which therefore cannot drift.</text>
    <text class="api-types-edge" x="516" y="242">free</text>
  </g>
  <line class="api-types-line api-types-conn api-types-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#api-types-tip)"/>
  <g class="api-types-stage api-types-s3">
    <rect class="api-types-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="api-types-step" x="752" y="142">04</text>
    <text class="api-types-name" x="778" y="142">While the editor checks your handler against it</text>
    <text class="api-types-desc" x="752" y="166">Before the code ever runs.</text>
  </g>
  <text class="api-types-sub" x="30" y="304">Documentation that cannot drift is the underrated benefit: hand-written API docs are wrong within a release, and generated ones are not.</text>
</svg>
