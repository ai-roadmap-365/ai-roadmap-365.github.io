<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Measuring the decomposition</title>
  <style>
    .bias-variance-145-bg   { fill: #f8fafc; }
    .bias-variance-145-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bias-variance-145-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bias-variance-145-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bias-variance-145-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bias-variance-145-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bias-variance-145-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bias-variance-145-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bias-variance-145-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bias-variance-145-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bias-variance-145-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bias-variance-145-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bias-variance-145-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .bias-variance-145-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .bias-variance-145-stage { opacity: 1; }

    .bias-variance-145-s0 { animation-delay: 0.00s; }
    .bias-variance-145-e0 { animation-delay: 0.00s; }
    .bias-variance-145-s1 { animation-delay: 1.28s; }
    .bias-variance-145-e1 { animation-delay: 1.28s; }
    .bias-variance-145-s2 { animation-delay: 2.56s; }
    .bias-variance-145-e2 { animation-delay: 2.56s; }
    .bias-variance-145-s3 { animation-delay: 3.84s; }
    .bias-variance-145-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .bias-variance-145-conn  { animation: bias-variance-145-trace 6.4s ease-in-out infinite; }
      .bias-variance-145-stage { animation: bias-variance-145-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes bias-variance-145-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes bias-variance-145-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .bias-variance-145-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .bias-variance-145-stage { animation: bias-variance-145-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes bias-variance-145-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="bias-variance-145-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="bias-variance-145-bg" width="980" height="322"/>
  <text class="bias-variance-145-h1"  x="30" y="40">Measuring the decomposition</text>
  <text class="bias-variance-145-sub" x="30" y="64">Four steps.</text>
  <g class="bias-variance-145-stage bias-variance-145-s0">
    <rect class="bias-variance-145-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="bias-variance-145-step" x="44" y="142">01</text>
    <text class="bias-variance-145-name" x="70" y="142">Draw many training samples from the same process</text>
    <text class="bias-variance-145-desc" x="44" y="166">Which simulation allows and</text>
    <text class="bias-variance-145-desc" x="44" y="182">reality does not.</text>
  </g>
  <line class="bias-variance-145-line bias-variance-145-conn bias-variance-145-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#bias-variance-145-tip)"/>
  <g class="bias-variance-145-stage bias-variance-145-s1">
    <rect class="bias-variance-145-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="bias-variance-145-step" x="280" y="142">02</text>
    <text class="bias-variance-145-name" x="306" y="142">Fit the same model on each</text>
    <text class="bias-variance-145-desc" x="280" y="166">Giving many models.</text>
  </g>
  <line class="bias-variance-145-line bias-variance-145-conn bias-variance-145-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#bias-variance-145-tip)"/>
  <g class="bias-variance-145-stage bias-variance-145-s2">
    <rect class="bias-variance-145-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="bias-variance-145-step" x="516" y="142">03</text>
    <text class="bias-variance-145-name" x="542" y="142">Their average prediction's error is the bias</text>
    <text class="bias-variance-145-desc" x="516" y="166">How wrong the method is,</text>
    <text class="bias-variance-145-desc" x="516" y="182">systematically.</text>
  </g>
  <line class="bias-variance-145-line bias-variance-145-conn bias-variance-145-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#bias-variance-145-tip)"/>
  <g class="bias-variance-145-stage bias-variance-145-s3">
    <rect class="bias-variance-145-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="bias-variance-145-step" x="752" y="142">04</text>
    <text class="bias-variance-145-name" x="778" y="142">And their spread around it is the variance</text>
    <text class="bias-variance-145-desc" x="752" y="166">How much the particular sample</text>
    <text class="bias-variance-145-desc" x="752" y="182">matters.</text>
  </g>
  <text class="bias-variance-145-sub" x="30" y="304">Being able to measure these separately in simulation is what makes the decomposition concrete rather than a metaphor, and it is why the lesson does it.</text>
</svg>
