<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="What moves.">
  <title>Adapters against full fine-tuning</title>
  <style>
    .lora-vs-full-bg   { fill: #f8fafc; }
    .lora-vs-full-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lora-vs-full-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lora-vs-full-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lora-vs-full-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lora-vs-full-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lora-vs-full-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lora-vs-full-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .lora-vs-full-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .lora-vs-full-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .lora-vs-full-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .lora-vs-full-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .lora-vs-full-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lora-vs-full-row { opacity: 1; }
    .lora-vs-full-r0 { animation-delay: 0.00s; }
    .lora-vs-full-r1 { animation-delay: 0.45s; }
    .lora-vs-full-r2 { animation-delay: 0.90s; }
    .lora-vs-full-r3 { animation-delay: 1.35s; }
    .lora-vs-full-r4 { animation-delay: 1.80s; }
    .lora-vs-full-row { animation: lora-vs-full-reveal 7.3s ease-in-out infinite; }
    @keyframes lora-vs-full-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="lora-vs-full-bg" width="980" height="390"/>
  <text class="lora-vs-full-h1"  x="30" y="40">Adapters against full fine-tuning</text>
  <text class="lora-vs-full-sub" x="30" y="64">What moves.</text>
  <rect class="lora-vs-full-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="lora-vs-full-name" x="46" y="122">Adapters</text>
  <text class="lora-vs-full-desc" x="46" y="142">A fraction trains.</text>
  <text class="lora-vs-full-desc lora-vs-full-row lora-vs-full-r0" x="46" y="182">Base weights frozen</text>
  <text class="lora-vs-full-desc lora-vs-full-row lora-vs-full-r1" x="46" y="216">Under one percent trainable</text>
  <text class="lora-vs-full-desc lora-vs-full-row lora-vs-full-r2" x="46" y="250">Fits on one consumer device</text>
  <text class="lora-vs-full-desc lora-vs-full-row lora-vs-full-r3" x="46" y="284">Megabytes per task</text>
  <text class="lora-vs-full-desc lora-vs-full-row lora-vs-full-r4" x="46" y="318">Nearly the same quality</text>
  <rect class="lora-vs-full-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="lora-vs-full-name" x="526" y="122">Full fine-tuning</text>
  <text class="lora-vs-full-desc" x="526" y="142">Everything trains.</text>
  <text class="lora-vs-full-desc lora-vs-full-row lora-vs-full-r0" x="526" y="182">Every weight updated</text>
  <text class="lora-vs-full-desc lora-vs-full-row lora-vs-full-r1" x="526" y="216">One hundred percent trainable</text>
  <text class="lora-vs-full-desc lora-vs-full-row lora-vs-full-r2" x="526" y="250">Needs a cluster past a few billion parameters</text>
  <text class="lora-vs-full-desc lora-vs-full-row lora-vs-full-r3" x="526" y="284">Gigabytes per task</text>
  <text class="lora-vs-full-desc lora-vs-full-row lora-vs-full-r4" x="526" y="318">A slightly higher ceiling</text>
  <text class="lora-vs-full-sub" x="30" y="372">The quality gap is small enough that it rarely decides anything, while the resource gap is large enough that it decides almost everything.</text>
</svg>
