<svg role="img" aria-label="Exact KNN vs Approximate Nearest Neighbor search diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Exact k-NN vs Approximate Nearest Neighbors</title>
  <defs>
    <linearGradient id="bg261b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card261b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg261b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">EXACT K-NN VS APPROXIMATE NEAREST NEIGHBORS (ANN)</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Evaluating Recall, Query Latency, and Algorithmic Complexity</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card261b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Exact k-NN (Linear Scan) -->
    <rect x="25" y="25" width="340" height="245" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="195" y="50" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">1. Exact k-NN (Flat Linear Scan)</text>
    
    <rect x="40" y="70" width="310" height="75" fill="#1e293b" rx="4"/>
    <text x="50" y="90" fill="#cbd5e1" font-size="8">• Exhaustive comparison against ALL N vectors</text>
    <text x="50" y="105" fill="#34d399" font-size="8">• Recall: 100% (Guaranteed exact global optimum)</text>
    <text x="50" y="120" fill="#fb7185" font-size="8">• Complexity: O(N * d) linear scaling</text>
    <text x="50" y="135" fill="#cbd5e1" font-size="8">• Latency: &lt; 2ms for N = 50k; &gt; 1500ms for N = 10M</text>

    <rect x="40" y="155" width="310" height="95" fill="#0f172a" stroke="#475569" rx="4"/>
    <text x="50" y="175" fill="#38bdf8" font-size="8" font-weight="700">When to use Flat k-NN:</text>
    <text x="50" y="190" fill="#cbd5e1" font-size="7">• Datasets with less than 100,000 documents</text>
    <text x="50" y="205" fill="#cbd5e1" font-size="7">• Zero indexing build time required</text>
    <text x="50" y="220" fill="#34d399" font-size="7">• Perfect ground truth for evaluating ANN recall</text>
    <text x="50" y="235" fill="#cbd5e1" font-size="7">• Zero index RAM memory overhead</text>

    <!-- ANN (Graph / Inverted Index) -->
    <rect x="395" y="25" width="340" height="245" fill="#0f172a" stroke="#34d399" stroke-width="1.5" rx="6"/>
    <text x="565" y="50" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">2. Approximate Nearest Neighbors (ANN)</text>
    
    <rect x="410" y="70" width="310" height="75" fill="#1e293b" rx="4"/>
    <text x="420" y="90" fill="#cbd5e1" font-size="8">• HNSW graphs / IVF-PQ cluster partitioning</text>
    <text x="420" y="105" fill="#34d399" font-size="8">• Recall: 95% - 99% (High empirical accuracy)</text>
    <text x="420" y="120" fill="#34d399" font-size="8">• Complexity: O(log N) logarithmic scaling</text>
    <text x="420" y="135" fill="#34d399" font-size="8">• Latency: &lt; 5ms for N = 100M+ vectors</text>

    <rect x="410" y="155" width="310" height="95" fill="#0f172a" stroke="#34d399" rx="4"/>
    <text x="420" y="175" fill="#34d399" font-size="8" font-weight="700">When to use ANN (HNSW / IVF):</text>
    <text x="420" y="190" fill="#cbd5e1" font-size="7">• Production RAG with &gt; 100,000 documents</text>
    <text x="420" y="205" fill="#cbd5e1" font-size="7">• High QPS concurrent search workloads</text>
    <text x="420" y="220" fill="#fbbf24" font-size="7">• Requires index build time &amp; extra memory</text>
    <text x="420" y="235" fill="#34d399" font-size="7">• Sub-5ms response times at billion-scale</text>
  </g>
</svg>
