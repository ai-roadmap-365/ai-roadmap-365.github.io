<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And the first match wins, which decides the order.">
  <title>Exactly one branch runs</title>
  <style>
    .first-match-wins-bg   { fill: #f8fafc; }
    .first-match-wins-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .first-match-wins-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .first-match-wins-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .first-match-wins-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .first-match-wins-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .first-match-wins-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .first-match-wins-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .first-match-wins-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .first-match-wins-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .first-match-wins-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .first-match-wins-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .first-match-wins-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .first-match-wins-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .first-match-wins-stage { opacity: 1; }

    .first-match-wins-s0 { animation-delay: 0.00s; }
    .first-match-wins-e0 { animation-delay: 0.00s; }
    .first-match-wins-s1 { animation-delay: 1.28s; }
    .first-match-wins-e1 { animation-delay: 1.28s; }
    .first-match-wins-s2 { animation-delay: 2.56s; }
    .first-match-wins-e2 { animation-delay: 2.56s; }
    .first-match-wins-s3 { animation-delay: 3.84s; }
    .first-match-wins-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .first-match-wins-conn  { animation: first-match-wins-trace 6.4s ease-in-out infinite; }
      .first-match-wins-stage { animation: first-match-wins-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes first-match-wins-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes first-match-wins-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .first-match-wins-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .first-match-wins-stage { animation: first-match-wins-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes first-match-wins-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="first-match-wins-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="first-match-wins-bg" width="980" height="322"/>
  <text class="first-match-wins-h1"  x="30" y="40">Exactly one branch runs</text>
  <text class="first-match-wins-sub" x="30" y="64">And the first match wins, which decides the order.</text>
  <g class="first-match-wins-stage first-match-wins-s0">
    <rect class="first-match-wins-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="first-match-wins-step" x="44" y="142">01</text>
    <text class="first-match-wins-name" x="70" y="142">Tested top to bottom</text>
    <text class="first-match-wins-desc" x="44" y="166">Each condition in turn, until</text>
    <text class="first-match-wins-desc" x="44" y="182">one is true.</text>
  </g>
  <line class="first-match-wins-line first-match-wins-conn first-match-wins-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#first-match-wins-tip)"/>
  <g class="first-match-wins-stage first-match-wins-s1">
    <rect class="first-match-wins-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="first-match-wins-step" x="280" y="142">02</text>
    <text class="first-match-wins-name" x="306" y="142">The first true branch runs</text>
    <text class="first-match-wins-desc" x="280" y="166">And the rest are not even</text>
    <text class="first-match-wins-desc" x="280" y="182">evaluated.</text>
    <text class="first-match-wins-edge" x="280" y="242">first wins</text>
  </g>
  <line class="first-match-wins-line first-match-wins-conn first-match-wins-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#first-match-wins-tip)"/>
  <g class="first-match-wins-stage first-match-wins-s2">
    <rect class="first-match-wins-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="first-match-wins-step" x="516" y="142">03</text>
    <text class="first-match-wins-name" x="542" y="142">So order encodes priority</text>
    <text class="first-match-wins-desc" x="516" y="166">Overlapping cases must go</text>
    <text class="first-match-wins-desc" x="516" y="182">most-specific first, or the</text>
    <text class="first-match-wins-desc" x="516" y="198">general one swallows them.</text>
  </g>
  <line class="first-match-wins-line first-match-wins-conn first-match-wins-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#first-match-wins-tip)"/>
  <g class="first-match-wins-stage first-match-wins-s3">
    <rect class="first-match-wins-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="first-match-wins-step" x="752" y="142">04</text>
    <text class="first-match-wins-name" x="778" y="142">else catches the remainder</text>
    <text class="first-match-wins-desc" x="752" y="166">Optional — and its absence means</text>
    <text class="first-match-wins-desc" x="752" y="182">"otherwise, do nothing".</text>
  </g>
  <text class="first-match-wins-sub" x="30" y="304">The overlap case is where this bites: put "score &gt; 50" before "score &gt; 90" and nothing ever reaches the second, because everything above 90 is also above 50.</text>
</svg>
