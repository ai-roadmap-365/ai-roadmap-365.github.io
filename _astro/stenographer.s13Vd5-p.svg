<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Words appear as spoken.">
  <title>Live courtroom subtitles</title>
  <style>
    .stenographer-bg   { fill: #f8fafc; }
    .stenographer-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stenographer-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stenographer-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stenographer-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stenographer-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stenographer-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stenographer-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stenographer-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stenographer-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stenographer-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stenographer-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stenographer-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stenographer-row { opacity: 1; }
    .stenographer-r0 { animation-delay: 0.00s; }
    .stenographer-r1 { animation-delay: 0.45s; }
    .stenographer-r2 { animation-delay: 0.90s; }
    .stenographer-r3 { animation-delay: 1.35s; }
    .stenographer-r4 { animation-delay: 1.80s; }
    .stenographer-row { animation: stenographer-reveal 7.3s ease-in-out infinite; }
    @keyframes stenographer-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="stenographer-bg" width="980" height="390"/>
  <text class="stenographer-h1"  x="30" y="40">Live courtroom subtitles</text>
  <text class="stenographer-sub" x="30" y="64">Words appear as spoken.</text>
  <rect class="stenographer-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="stenographer-name" x="46" y="122">Live subtitles</text>
  <text class="stenographer-desc" x="46" y="142">Appear as spoken.</text>
  <text class="stenographer-desc stenographer-row stenographer-r0" x="46" y="182">Words on the screen immediately</text>
  <text class="stenographer-desc stenographer-row stenographer-r1" x="46" y="216">Sentences form naturally</text>
  <text class="stenographer-desc stenographer-row stenographer-r2" x="46" y="250">Reading earlier notes is undisturbed</text>
  <text class="stenographer-desc stenographer-row stenographer-r3" x="46" y="284">"Objection" stops the typing at once</text>
  <text class="stenographer-desc stenographer-row stenographer-r4" x="46" y="318">Everyone follows in real time</text>
  <rect class="stenographer-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="stenographer-name" x="526" y="122">Transcribed afterwards</text>
  <text class="stenographer-desc" x="526" y="142">Complete, and late.</text>
  <text class="stenographer-desc stenographer-row stenographer-r0" x="526" y="182">Nothing on screen during the session</text>
  <text class="stenographer-desc stenographer-row stenographer-r1" x="526" y="216">The full transcript at the end</text>
  <text class="stenographer-desc stenographer-row stenographer-r2" x="526" y="250">Accurate, and unusable live</text>
  <text class="stenographer-desc stenographer-row stenographer-r3" x="526" y="284">Nothing to interrupt</text>
  <text class="stenographer-desc stenographer-row stenographer-r4" x="526" y="318">Same words, no participation</text>
  <text class="stenographer-sub" x="30" y="372">The projector not slapping an observer back to the current line is the scroll-lock behaviour, and it is the detail that makes the difference between a display and an interruption.</text>
</svg>
