<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Interests are free; commitments cost hours.">
  <title>A plan is not a list of interests</title>
  <style>
    .plan-not-interests-bg   { fill: #f8fafc; }
    .plan-not-interests-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .plan-not-interests-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .plan-not-interests-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .plan-not-interests-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .plan-not-interests-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .plan-not-interests-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .plan-not-interests-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .plan-not-interests-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .plan-not-interests-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .plan-not-interests-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .plan-not-interests-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .plan-not-interests-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .plan-not-interests-row { opacity: 1; }
    .plan-not-interests-r0 { animation-delay: 0.00s; }
    .plan-not-interests-r1 { animation-delay: 0.45s; }
    .plan-not-interests-r2 { animation-delay: 0.90s; }
    .plan-not-interests-r3 { animation-delay: 1.35s; }
    .plan-not-interests-r4 { animation-delay: 1.80s; }
    .plan-not-interests-row { animation: plan-not-interests-reveal 7.3s ease-in-out infinite; }
    @keyframes plan-not-interests-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="plan-not-interests-bg" width="980" height="390"/>
  <text class="plan-not-interests-h1"  x="30" y="40">A plan is not a list of interests</text>
  <text class="plan-not-interests-sub" x="30" y="64">Interests are free; commitments cost hours.</text>
  <rect class="plan-not-interests-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="plan-not-interests-name" x="46" y="122">A plan</text>
  <text class="plan-not-interests-desc" x="46" y="142">Short, by construction.</text>
  <text class="plan-not-interests-desc plan-not-interests-row plan-not-interests-r0" x="46" y="182">Two or three commitments</text>
  <text class="plan-not-interests-desc plan-not-interests-row plan-not-interests-r1" x="46" y="216">Costed at your measured calibration</text>
  <text class="plan-not-interests-desc plan-not-interests-row plan-not-interests-r2" x="46" y="250">Each produces an artifact</text>
  <text class="plan-not-interests-desc plan-not-interests-row plan-not-interests-r3" x="46" y="284">Re-run every quarter</text>
  <text class="plan-not-interests-desc plan-not-interests-row plan-not-interests-r4" x="46" y="318">Constrained by your actual life</text>
  <rect class="plan-not-interests-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="plan-not-interests-name" x="526" y="122">Interests, or a curriculum</text>
  <text class="plan-not-interests-desc" x="526" y="142">Unlimited, or somebody else's.</text>
  <text class="plan-not-interests-desc plan-not-interests-row plan-not-interests-r0" x="526" y="182">Interests cost nothing to add</text>
  <text class="plan-not-interests-desc plan-not-interests-row plan-not-interests-r1" x="526" y="216">So the list has no natural length</text>
  <text class="plan-not-interests-desc plan-not-interests-row plan-not-interests-r2" x="526" y="250">A curriculum knows nothing about your hours</text>
  <text class="plan-not-interests-desc plan-not-interests-row plan-not-interests-r3" x="526" y="284">You have just finished one</text>
  <text class="plan-not-interests-desc plan-not-interests-row plan-not-interests-r4" x="526" y="318">What follows is chosen by you</text>
  <text class="plan-not-interests-sub" x="30" y="372">Two or three commitments for four or five hours a week is a normal outcome and not a failure — the number is small because the hours are, and no amount of enthusiasm changes the denominator.</text>
</svg>
