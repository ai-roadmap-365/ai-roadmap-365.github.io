<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each with one central idea.">
  <title>Four architectural families</title>
  <style>
    .architecture-families-bg   { fill: #f8fafc; }
    .architecture-families-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .architecture-families-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .architecture-families-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .architecture-families-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .architecture-families-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .architecture-families-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .architecture-families-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .architecture-families-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .architecture-families-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .architecture-families-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .architecture-families-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .architecture-families-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .architecture-families-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .architecture-families-stage { opacity: 1; }

    .architecture-families-s0 { animation-delay: 0.00s; }
    .architecture-families-e0 { animation-delay: 0.00s; }
    .architecture-families-s1 { animation-delay: 1.28s; }
    .architecture-families-e1 { animation-delay: 1.28s; }
    .architecture-families-s2 { animation-delay: 2.56s; }
    .architecture-families-e2 { animation-delay: 2.56s; }
    .architecture-families-s3 { animation-delay: 3.84s; }
    .architecture-families-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .architecture-families-conn  { animation: architecture-families-trace 6.4s ease-in-out infinite; }
      .architecture-families-stage { animation: architecture-families-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes architecture-families-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes architecture-families-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .architecture-families-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .architecture-families-stage { animation: architecture-families-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes architecture-families-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="architecture-families-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="architecture-families-bg" width="980" height="322"/>
  <text class="architecture-families-h1"  x="30" y="40">Four architectural families</text>
  <text class="architecture-families-sub" x="30" y="64">Each with one central idea.</text>
  <g class="architecture-families-stage architecture-families-s0">
    <rect class="architecture-families-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="architecture-families-step" x="44" y="142">01</text>
    <text class="architecture-families-name" x="70" y="142">Stacked small kernels</text>
    <text class="architecture-families-desc" x="44" y="166">Uniform 3x3 layers, deep. Simple</text>
    <text class="architecture-families-desc" x="44" y="182">and effective.</text>
  </g>
  <line class="architecture-families-line architecture-families-conn architecture-families-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#architecture-families-tip)"/>
  <g class="architecture-families-stage architecture-families-s1">
    <rect class="architecture-families-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="architecture-families-step" x="280" y="142">02</text>
    <text class="architecture-families-name" x="306" y="142">Residual connections</text>
    <text class="architecture-families-desc" x="280" y="166">Identity paths making depth</text>
    <text class="architecture-families-desc" x="280" y="182">trainable.</text>
  </g>
  <line class="architecture-families-line architecture-families-conn architecture-families-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#architecture-families-tip)"/>
  <g class="architecture-families-stage architecture-families-s2">
    <rect class="architecture-families-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="architecture-families-step" x="516" y="142">03</text>
    <text class="architecture-families-name" x="542" y="142">Multi-scale blocks</text>
    <text class="architecture-families-desc" x="516" y="166">Several kernel sizes in</text>
    <text class="architecture-families-desc" x="516" y="182">parallel, concatenated.</text>
    <text class="architecture-families-desc" x="516" y="198">Different scales at once.</text>
  </g>
  <line class="architecture-families-line architecture-families-conn architecture-families-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#architecture-families-tip)"/>
  <g class="architecture-families-stage architecture-families-s3">
    <rect class="architecture-families-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="architecture-families-step" x="752" y="142">04</text>
    <text class="architecture-families-name" x="778" y="142">Compound scaling</text>
    <text class="architecture-families-desc" x="752" y="166">Depth, width and resolution</text>
    <text class="architecture-families-desc" x="752" y="182">scaled together by a fixed</text>
    <text class="architecture-families-desc" x="752" y="198">ratio.</text>
    <text class="architecture-families-edge" x="752" y="242">systematic</text>
  </g>
  <text class="architecture-families-sub" x="30" y="304">Compound scaling is the most recent conceptual step and the least intuitive: scaling one dimension alone saturates, and scaling all three in proportion does not.</text>
</svg>
