<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The margin, with an interval</title>
  <style>
    .bootstrap-margin-bg   { fill: #f8fafc; }
    .bootstrap-margin-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bootstrap-margin-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bootstrap-margin-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bootstrap-margin-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bootstrap-margin-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bootstrap-margin-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bootstrap-margin-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bootstrap-margin-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bootstrap-margin-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bootstrap-margin-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bootstrap-margin-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bootstrap-margin-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .bootstrap-margin-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .bootstrap-margin-stage { opacity: 1; }

    .bootstrap-margin-s0 { animation-delay: 0.00s; }
    .bootstrap-margin-e0 { animation-delay: 0.00s; }
    .bootstrap-margin-s1 { animation-delay: 1.28s; }
    .bootstrap-margin-e1 { animation-delay: 1.28s; }
    .bootstrap-margin-s2 { animation-delay: 2.56s; }
    .bootstrap-margin-e2 { animation-delay: 2.56s; }
    .bootstrap-margin-s3 { animation-delay: 3.84s; }
    .bootstrap-margin-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .bootstrap-margin-conn  { animation: bootstrap-margin-trace 6.4s ease-in-out infinite; }
      .bootstrap-margin-stage { animation: bootstrap-margin-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes bootstrap-margin-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes bootstrap-margin-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .bootstrap-margin-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .bootstrap-margin-stage { animation: bootstrap-margin-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes bootstrap-margin-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="bootstrap-margin-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="bootstrap-margin-bg" width="980" height="322"/>
  <text class="bootstrap-margin-h1"  x="30" y="40">The margin, with an interval</text>
  <text class="bootstrap-margin-sub" x="30" y="64">Four steps.</text>
  <g class="bootstrap-margin-stage bootstrap-margin-s0">
    <rect class="bootstrap-margin-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="bootstrap-margin-step" x="44" y="142">01</text>
    <text class="bootstrap-margin-name" x="70" y="142">The margin over baseline is 13.9071 points</text>
    <text class="bootstrap-margin-desc" x="44" y="166">On one test set of 111 rows.</text>
  </g>
  <line class="bootstrap-margin-line bootstrap-margin-conn bootstrap-margin-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#bootstrap-margin-tip)"/>
  <g class="bootstrap-margin-stage bootstrap-margin-s1">
    <rect class="bootstrap-margin-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="bootstrap-margin-step" x="280" y="142">02</text>
    <text class="bootstrap-margin-name" x="306" y="142">Resample those rows with replacement, two thousand times</text>
    <text class="bootstrap-margin-desc" x="280" y="166">Recomputing the margin each</text>
    <text class="bootstrap-margin-desc" x="280" y="182">time.</text>
  </g>
  <line class="bootstrap-margin-line bootstrap-margin-conn bootstrap-margin-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#bootstrap-margin-tip)"/>
  <g class="bootstrap-margin-stage bootstrap-margin-s2">
    <rect class="bootstrap-margin-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="bootstrap-margin-step" x="516" y="142">03</text>
    <text class="bootstrap-margin-name" x="542" y="142">Which gives an interval of [5.5852, 22.3324]</text>
    <text class="bootstrap-margin-desc" x="516" y="166">Wide, because 111 rows is not</text>
    <text class="bootstrap-margin-desc" x="516" y="182">many.</text>
  </g>
  <line class="bootstrap-margin-line bootstrap-margin-conn bootstrap-margin-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#bootstrap-margin-tip)"/>
  <g class="bootstrap-margin-stage bootstrap-margin-s3">
    <rect class="bootstrap-margin-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="bootstrap-margin-step" x="752" y="142">04</text>
    <text class="bootstrap-margin-name" x="778" y="142">It does not cross zero, so the improvement is real</text>
    <text class="bootstrap-margin-desc" x="752" y="166">By more than sampling noise</text>
    <text class="bootstrap-margin-desc" x="752" y="182">could explain.</text>
  </g>
  <text class="bootstrap-margin-sub" x="30" y="304">The interval being wide is not a defect but an honest statement about 111 rows, and quoting the point estimate alone would have overstated the certainty.</text>
</svg>
