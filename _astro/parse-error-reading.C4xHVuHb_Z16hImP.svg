<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The reported position is where the parser gave up, not where you went wrong.">
  <title>Reading a parse error</title>
  <style>
    .parse-error-reading-bg   { fill: #f8fafc; }
    .parse-error-reading-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parse-error-reading-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parse-error-reading-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parse-error-reading-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parse-error-reading-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parse-error-reading-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .parse-error-reading-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .parse-error-reading-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .parse-error-reading-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .parse-error-reading-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .parse-error-reading-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .parse-error-reading-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .parse-error-reading-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .parse-error-reading-stage { opacity: 1; }

    .parse-error-reading-s0 { animation-delay: 0.00s; }
    .parse-error-reading-e0 { animation-delay: 0.00s; }
    .parse-error-reading-s1 { animation-delay: 1.28s; }
    .parse-error-reading-e1 { animation-delay: 1.28s; }
    .parse-error-reading-s2 { animation-delay: 2.56s; }
    .parse-error-reading-e2 { animation-delay: 2.56s; }
    .parse-error-reading-s3 { animation-delay: 3.84s; }
    .parse-error-reading-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .parse-error-reading-conn  { animation: parse-error-reading-trace 6.4s ease-in-out infinite; }
      .parse-error-reading-stage { animation: parse-error-reading-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes parse-error-reading-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes parse-error-reading-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .parse-error-reading-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .parse-error-reading-stage { animation: parse-error-reading-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes parse-error-reading-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="parse-error-reading-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="parse-error-reading-bg" width="980" height="322"/>
  <text class="parse-error-reading-h1"  x="30" y="40">Reading a parse error</text>
  <text class="parse-error-reading-sub" x="30" y="64">The reported position is where the parser gave up, not where you went wrong.</text>
  <g class="parse-error-reading-stage parse-error-reading-s0">
    <rect class="parse-error-reading-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="parse-error-reading-step" x="44" y="142">01</text>
    <text class="parse-error-reading-name" x="70" y="142">Read the line and column</text>
    <text class="parse-error-reading-desc" x="44" y="166">For a quote or comma mistake,</text>
    <text class="parse-error-reading-desc" x="44" y="182">this is usually exactly right.</text>
    <text class="parse-error-reading-edge" x="44" y="242">line:col</text>
  </g>
  <line class="parse-error-reading-line parse-error-reading-conn parse-error-reading-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#parse-error-reading-tip)"/>
  <g class="parse-error-reading-stage parse-error-reading-s1">
    <rect class="parse-error-reading-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="parse-error-reading-step" x="280" y="142">02</text>
    <text class="parse-error-reading-name" x="306" y="142">Structural errors report late</text>
    <text class="parse-error-reading-desc" x="280" y="166">A missing closing brace is</text>
    <text class="parse-error-reading-desc" x="280" y="182">flagged at the end of the file,</text>
    <text class="parse-error-reading-desc" x="280" y="198">not where it opened.</text>
  </g>
  <line class="parse-error-reading-line parse-error-reading-conn parse-error-reading-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#parse-error-reading-tip)"/>
  <g class="parse-error-reading-stage parse-error-reading-s2">
    <rect class="parse-error-reading-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="parse-error-reading-step" x="516" y="142">03</text>
    <text class="parse-error-reading-name" x="542" y="142">Check the status code first</text>
    <text class="parse-error-reading-desc" x="516" y="166">An HTML error page reaching a</text>
    <text class="parse-error-reading-desc" x="516" y="182">JSON parser produces a baffling</text>
    <text class="parse-error-reading-desc" x="516" y="198">error at position 0.</text>
    <text class="parse-error-reading-edge" x="516" y="242">&lt; is not JSON</text>
  </g>
  <line class="parse-error-reading-line parse-error-reading-conn parse-error-reading-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#parse-error-reading-tip)"/>
  <g class="parse-error-reading-stage parse-error-reading-s3">
    <rect class="parse-error-reading-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="parse-error-reading-step" x="752" y="142">04</text>
    <text class="parse-error-reading-name" x="778" y="142">Strip the fence</text>
    <text class="parse-error-reading-desc" x="752" y="166">Model output wrapped in a</text>
    <text class="parse-error-reading-desc" x="752" y="182">markdown code block is not JSON</text>
    <text class="parse-error-reading-desc" x="752" y="198">until it is removed.</text>
    <text class="parse-error-reading-edge" x="752" y="242">```json</text>
  </g>
  <text class="parse-error-reading-sub" x="30" y="304">"Expecting value: line 1 column 1" almost never means the JSON is malformed. It usually means what arrived was not JSON at all.</text>
</svg>
