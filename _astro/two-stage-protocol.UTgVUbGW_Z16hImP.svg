<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Warm the head first.">
  <title>The two-phase protocol</title>
  <style>
    .two-stage-protocol-bg   { fill: #f8fafc; }
    .two-stage-protocol-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-stage-protocol-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-stage-protocol-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-stage-protocol-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-stage-protocol-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-stage-protocol-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .two-stage-protocol-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .two-stage-protocol-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .two-stage-protocol-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .two-stage-protocol-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .two-stage-protocol-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .two-stage-protocol-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .two-stage-protocol-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .two-stage-protocol-stage { opacity: 1; }

    .two-stage-protocol-s0 { animation-delay: 0.00s; }
    .two-stage-protocol-e0 { animation-delay: 0.00s; }
    .two-stage-protocol-s1 { animation-delay: 1.28s; }
    .two-stage-protocol-e1 { animation-delay: 1.28s; }
    .two-stage-protocol-s2 { animation-delay: 2.56s; }
    .two-stage-protocol-e2 { animation-delay: 2.56s; }
    .two-stage-protocol-s3 { animation-delay: 3.84s; }
    .two-stage-protocol-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .two-stage-protocol-conn  { animation: two-stage-protocol-trace 6.4s ease-in-out infinite; }
      .two-stage-protocol-stage { animation: two-stage-protocol-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes two-stage-protocol-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes two-stage-protocol-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .two-stage-protocol-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .two-stage-protocol-stage { animation: two-stage-protocol-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes two-stage-protocol-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="two-stage-protocol-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="two-stage-protocol-bg" width="980" height="322"/>
  <text class="two-stage-protocol-h1"  x="30" y="40">The two-phase protocol</text>
  <text class="two-stage-protocol-sub" x="30" y="64">Warm the head first.</text>
  <g class="two-stage-protocol-stage two-stage-protocol-s0">
    <rect class="two-stage-protocol-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="two-stage-protocol-step" x="44" y="142">01</text>
    <text class="two-stage-protocol-name" x="70" y="142">Phase one: freeze the backbone</text>
    <text class="two-stage-protocol-desc" x="44" y="166">Train only the new head for a</text>
    <text class="two-stage-protocol-desc" x="44" y="182">few epochs, until its loss</text>
    <text class="two-stage-protocol-desc" x="44" y="198">stabilises.</text>
  </g>
  <line class="two-stage-protocol-line two-stage-protocol-conn two-stage-protocol-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#two-stage-protocol-tip)"/>
  <g class="two-stage-protocol-stage two-stage-protocol-s1">
    <rect class="two-stage-protocol-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="two-stage-protocol-step" x="280" y="142">02</text>
    <text class="two-stage-protocol-name" x="306" y="142">Because a random head produces large gradients</text>
    <text class="two-stage-protocol-desc" x="280" y="166">Which would flow into the</text>
    <text class="two-stage-protocol-desc" x="280" y="182">backbone and destroy it.</text>
  </g>
  <line class="two-stage-protocol-line two-stage-protocol-conn two-stage-protocol-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#two-stage-protocol-tip)"/>
  <g class="two-stage-protocol-stage two-stage-protocol-s2">
    <rect class="two-stage-protocol-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="two-stage-protocol-step" x="516" y="142">03</text>
    <text class="two-stage-protocol-name" x="542" y="142">Phase two: unfreeze, gently</text>
    <text class="two-stage-protocol-desc" x="516" y="166">Deep blocks first, with a very</text>
    <text class="two-stage-protocol-desc" x="516" y="182">small learning rate and cosine</text>
    <text class="two-stage-protocol-desc" x="516" y="198">decay.</text>
  </g>
  <line class="two-stage-protocol-line two-stage-protocol-conn two-stage-protocol-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#two-stage-protocol-tip)"/>
  <g class="two-stage-protocol-stage two-stage-protocol-s3">
    <rect class="two-stage-protocol-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="two-stage-protocol-step" x="752" y="142">04</text>
    <text class="two-stage-protocol-name" x="778" y="142">Optionally differential rates per layer</text>
    <text class="two-stage-protocol-desc" x="752" y="166">Smaller for earlier layers,</text>
    <text class="two-stage-protocol-desc" x="752" y="182">which need less adjustment.</text>
  </g>
  <text class="two-stage-protocol-sub" x="30" y="304">The ordering is the entire mechanism: an untrained head produces enormous initial gradients, and unfreezing before it has stabilised sends that noise straight into the pretrained weights.</text>
</svg>
