<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="100%" height="100%" role="img" aria-label="Ingestion Pipeline Stages and Failure Boundaries showing Source Connector, Extract, Normalize, Chunk, Embed, and Index stages with a checkpoint store and a dead-letter queue">
  <title>Ingestion Pipeline Stages and Failure Boundaries</title>
  <defs>
    <style>
      .d323a-bg { fill: #f8fafc; }
      .d323a-stage { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; }
      .d323a-store { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; }
      .d323a-dlq { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; }
      .d323a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d323a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d323a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; }
      .d323a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
      .d323a-flow { stroke: #64748b; stroke-width: 2px; fill: none; }
      .d323a-fail { stroke: #ef4444; stroke-width: 2px; fill: none; stroke-dasharray: 5 4; }
    </style>
    <marker id="d323a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <marker id="d323a-arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="d323a-bg" />
  <text x="40" y="40" class="d323a-title">Ingestion Pipeline Stages and Failure Boundaries</text>
  <text x="40" y="64" class="d323a-subtitle">Every stage can fail independently. The checkpoint says where to resume; the dead-letter queue holds what must not block the batch.</text>

  <rect x="40"  y="110" width="120" height="70" rx="8" class="d323a-stage" />
  <text x="100" y="140" class="d323a-header" text-anchor="middle">Source</text>
  <text x="100" y="160" class="d323a-text" text-anchor="middle">connector, cursor</text>

  <rect x="192" y="110" width="120" height="70" rx="8" class="d323a-stage" />
  <text x="252" y="140" class="d323a-header" text-anchor="middle">Extract</text>
  <text x="252" y="160" class="d323a-text" text-anchor="middle">bytes to text</text>

  <rect x="344" y="110" width="120" height="70" rx="8" class="d323a-stage" />
  <text x="404" y="140" class="d323a-header" text-anchor="middle">Normalize</text>
  <text x="404" y="160" class="d323a-text" text-anchor="middle">schema, dedupe</text>

  <rect x="496" y="110" width="120" height="70" rx="8" class="d323a-stage" />
  <text x="556" y="140" class="d323a-header" text-anchor="middle">Chunk</text>
  <text x="556" y="160" class="d323a-text" text-anchor="middle">stable ids</text>

  <rect x="648" y="110" width="100" height="70" rx="8" class="d323a-stage" />
  <text x="698" y="140" class="d323a-header" text-anchor="middle">Embed</text>
  <text x="698" y="160" class="d323a-text" text-anchor="middle">batched</text>

  <rect x="780" y="110" width="80" height="70" rx="8" class="d323a-stage" />
  <text x="820" y="140" class="d323a-header" text-anchor="middle">Index</text>
  <text x="820" y="160" class="d323a-text" text-anchor="middle">upsert</text>

  <path d="M 160 145 L 186 145" class="d323a-flow" marker-end="url(#d323a-arrow)" />
  <path d="M 312 145 L 338 145" class="d323a-flow" marker-end="url(#d323a-arrow)" />
  <path d="M 464 145 L 490 145" class="d323a-flow" marker-end="url(#d323a-arrow)" />
  <path d="M 616 145 L 642 145" class="d323a-flow" marker-end="url(#d323a-arrow)" />
  <path d="M 748 145 L 774 145" class="d323a-flow" marker-end="url(#d323a-arrow)" />

  <rect x="40" y="250" width="300" height="80" rx="8" class="d323a-store" />
  <text x="190" y="278" class="d323a-header" text-anchor="middle">Checkpoint store</text>
  <text x="190" y="299" class="d323a-text" text-anchor="middle">last committed cursor + content hashes</text>
  <text x="190" y="317" class="d323a-text" text-anchor="middle">answers: where do I resume, what changed?</text>

  <path d="M 100 180 L 100 246" class="d323a-flow" marker-end="url(#d323a-arrow)" />
  <path d="M 820 180 L 820 214 L 340 214 L 340 250" class="d323a-flow" marker-end="url(#d323a-arrow)" />

  <rect x="560" y="250" width="300" height="80" rx="8" class="d323a-dlq" />
  <text x="710" y="278" class="d323a-header" text-anchor="middle">Dead-letter queue</text>
  <text x="710" y="299" class="d323a-text" text-anchor="middle">poison records + the error that rejected them</text>
  <text x="710" y="317" class="d323a-text" text-anchor="middle">one bad file must not stall the other 9,999</text>

  <path d="M 252 180 L 252 226 L 640 226 L 640 250" class="d323a-fail" marker-end="url(#d323a-arrow-fail)" />
  <path d="M 404 180 L 404 234 L 700 234 L 700 250" class="d323a-fail" marker-end="url(#d323a-arrow-fail)" />

  <text x="40" y="378" class="d323a-header">The three properties that make a re-run safe</text>
  <text x="40" y="400" class="d323a-text">Idempotent — the same input twice produces one row, because the id is derived from content, not from arrival order.</text>
  <text x="40" y="420" class="d323a-text">Resumable — a crash at record 8,412 restarts at 8,412, because the cursor commits only after the batch is durable.</text>
  <text x="40" y="440" class="d323a-text">Isolated — a malformed record lands in the dead-letter queue with its error, and the batch continues.</text>
</svg>
