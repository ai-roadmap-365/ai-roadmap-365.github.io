<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three signals, any one of which is enough.">
  <title>When the one-liner should become a program</title>
  <style>
    .three-signals-to-graduate-bg   { fill: #f8fafc; }
    .three-signals-to-graduate-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-signals-to-graduate-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-signals-to-graduate-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-signals-to-graduate-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-signals-to-graduate-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-signals-to-graduate-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-signals-to-graduate-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-signals-to-graduate-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-signals-to-graduate-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-signals-to-graduate-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-signals-to-graduate-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-signals-to-graduate-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .three-signals-to-graduate-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .three-signals-to-graduate-stage { opacity: 1; }

    .three-signals-to-graduate-s0 { animation-delay: 0.00s; }
    .three-signals-to-graduate-e0 { animation-delay: 0.00s; }
    .three-signals-to-graduate-s1 { animation-delay: 1.28s; }
    .three-signals-to-graduate-e1 { animation-delay: 1.28s; }
    .three-signals-to-graduate-s2 { animation-delay: 2.56s; }
    .three-signals-to-graduate-e2 { animation-delay: 2.56s; }
    .three-signals-to-graduate-s3 { animation-delay: 3.84s; }
    .three-signals-to-graduate-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .three-signals-to-graduate-conn  { animation: three-signals-to-graduate-trace 6.4s ease-in-out infinite; }
      .three-signals-to-graduate-stage { animation: three-signals-to-graduate-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes three-signals-to-graduate-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes three-signals-to-graduate-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .three-signals-to-graduate-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .three-signals-to-graduate-stage { animation: three-signals-to-graduate-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes three-signals-to-graduate-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="three-signals-to-graduate-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="three-signals-to-graduate-bg" width="980" height="322"/>
  <text class="three-signals-to-graduate-h1"  x="30" y="40">When the one-liner should become a program</text>
  <text class="three-signals-to-graduate-sub" x="30" y="64">Three signals, any one of which is enough.</text>
  <g class="three-signals-to-graduate-stage three-signals-to-graduate-s0">
    <rect class="three-signals-to-graduate-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="three-signals-to-graduate-step" x="44" y="142">01</text>
    <text class="three-signals-to-graduate-name" x="70" y="142">A one-liner</text>
    <text class="three-signals-to-graduate-desc" x="44" y="166">Fits on a line, no branching.</text>
    <text class="three-signals-to-graduate-desc" x="44" y="182">Perfect — leave it alone.</text>
    <text class="three-signals-to-graduate-edge" x="44" y="242">curl | jq</text>
  </g>
  <line class="three-signals-to-graduate-line three-signals-to-graduate-conn three-signals-to-graduate-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#three-signals-to-graduate-tip)"/>
  <g class="three-signals-to-graduate-stage three-signals-to-graduate-s1">
    <rect class="three-signals-to-graduate-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="three-signals-to-graduate-step" x="280" y="142">02</text>
    <text class="three-signals-to-graduate-name" x="306" y="142">A script</text>
    <text class="three-signals-to-graduate-desc" x="280" y="166">You want it repeatable,</text>
    <text class="three-signals-to-graduate-desc" x="280" y="182">scheduled or shared. Still</text>
    <text class="three-signals-to-graduate-desc" x="280" y="198">shell, with strict mode.</text>
    <text class="three-signals-to-graduate-edge" x="280" y="242">script.sh</text>
  </g>
  <line class="three-signals-to-graduate-line three-signals-to-graduate-conn three-signals-to-graduate-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#three-signals-to-graduate-tip)"/>
  <g class="three-signals-to-graduate-stage three-signals-to-graduate-s2">
    <rect class="three-signals-to-graduate-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="three-signals-to-graduate-step" x="516" y="142">03</text>
    <text class="three-signals-to-graduate-name" x="542" y="142">You need a data structure</text>
    <text class="three-signals-to-graduate-desc" x="516" y="166">A dictionary, a list of records,</text>
    <text class="three-signals-to-graduate-desc" x="516" y="182">anything you would have to fake</text>
    <text class="three-signals-to-graduate-desc" x="516" y="198">with text.</text>
    <text class="three-signals-to-graduate-edge" x="516" y="242">signal 1</text>
  </g>
  <line class="three-signals-to-graduate-line three-signals-to-graduate-conn three-signals-to-graduate-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#three-signals-to-graduate-tip)"/>
  <g class="three-signals-to-graduate-stage three-signals-to-graduate-s3">
    <rect class="three-signals-to-graduate-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="three-signals-to-graduate-step" x="752" y="142">04</text>
    <text class="three-signals-to-graduate-name" x="778" y="142">Or error handling, or a test</text>
    <text class="three-signals-to-graduate-desc" x="752" y="166">Catch and continue, or assert</text>
    <text class="three-signals-to-graduate-desc" x="752" y="182">behaviour. Both mean Python.</text>
    <text class="three-signals-to-graduate-edge" x="752" y="242">signals 2, 3</text>
  </g>
  <text class="three-signals-to-graduate-sub" x="30" y="304">The second if statement is the reliable tell. One is fine; two means the logic has outgrown a language whose error handling is a set of exit codes.</text>
</svg>
