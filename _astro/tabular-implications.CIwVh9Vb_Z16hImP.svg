<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are organisational.">
  <title>Four consequences of tabular practice</title>
  <style>
    .tabular-implications-bg   { fill: #f8fafc; }
    .tabular-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tabular-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tabular-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tabular-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tabular-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tabular-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tabular-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tabular-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tabular-implications-stage { opacity: 1; }

    .tabular-implications-s0 { animation-delay: 0.00s; }
    .tabular-implications-e0 { animation-delay: 0.00s; }
    .tabular-implications-s1 { animation-delay: 1.28s; }
    .tabular-implications-e1 { animation-delay: 1.28s; }
    .tabular-implications-s2 { animation-delay: 2.56s; }
    .tabular-implications-e2 { animation-delay: 2.56s; }
    .tabular-implications-s3 { animation-delay: 3.84s; }
    .tabular-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tabular-implications-conn  { animation: tabular-implications-trace 6.4s ease-in-out infinite; }
      .tabular-implications-stage { animation: tabular-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tabular-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tabular-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tabular-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tabular-implications-stage { animation: tabular-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tabular-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tabular-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tabular-implications-bg" width="980" height="322"/>
  <text class="tabular-implications-h1"  x="30" y="40">Four consequences of tabular practice</text>
  <text class="tabular-implications-sub" x="30" y="64">Two are organisational.</text>
  <g class="tabular-implications-stage tabular-implications-s0">
    <rect class="tabular-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tabular-implications-step" x="44" y="142">01</text>
    <text class="tabular-implications-name" x="70" y="142">Most gains come from features and validation</text>
    <text class="tabular-implications-desc" x="44" y="166">Not from the model. Which</text>
    <text class="tabular-implications-desc" x="44" y="182">changes where effort goes.</text>
  </g>
  <line class="tabular-implications-line tabular-implications-conn tabular-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tabular-implications-tip)"/>
  <g class="tabular-implications-stage tabular-implications-s1">
    <rect class="tabular-implications-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tabular-implications-step" x="280" y="142">02</text>
    <text class="tabular-implications-name" x="306" y="142">So domain knowledge is a first-class input</text>
    <text class="tabular-implications-desc" x="280" y="166">And the people who have it are</text>
    <text class="tabular-implications-desc" x="280" y="182">on the critical path.</text>
  </g>
  <line class="tabular-implications-line tabular-implications-conn tabular-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tabular-implications-tip)"/>
  <g class="tabular-implications-stage tabular-implications-s2">
    <rect class="tabular-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tabular-implications-step" x="516" y="142">03</text>
    <text class="tabular-implications-name" x="542" y="142">Attribution makes deployment defensible</text>
    <text class="tabular-implications-desc" x="516" y="166">Which regulated settings</text>
    <text class="tabular-implications-desc" x="516" y="182">require.</text>
  </g>
  <line class="tabular-implications-line tabular-implications-conn tabular-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tabular-implications-tip)"/>
  <g class="tabular-implications-stage tabular-implications-s3">
    <rect class="tabular-implications-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tabular-implications-step" x="752" y="142">04</text>
    <text class="tabular-implications-name" x="778" y="142">And tabular data drifts as the business changes</text>
    <text class="tabular-implications-desc" x="752" y="166">So monitoring is not optional.</text>
  </g>
  <text class="tabular-implications-sub" x="30" y="304">Domain experts being on the critical path is the organisational consequence: a tabular project staffed only with modellers will underperform one that is not.</text>
</svg>
