<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four decidable properties, no network.">
  <title>What the checker looks for</title>
  <style>
    .four-checks-bg   { fill: #f8fafc; }
    .four-checks-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-checks-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-checks-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-checks-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-checks-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-checks-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .four-checks-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .four-checks-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .four-checks-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .four-checks-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .four-checks-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .four-checks-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .four-checks-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .four-checks-stage { opacity: 1; }

    .four-checks-s0 { animation-delay: 0.00s; }
    .four-checks-e0 { animation-delay: 0.00s; }
    .four-checks-s1 { animation-delay: 1.28s; }
    .four-checks-e1 { animation-delay: 1.28s; }
    .four-checks-s2 { animation-delay: 2.56s; }
    .four-checks-e2 { animation-delay: 2.56s; }
    .four-checks-s3 { animation-delay: 3.84s; }
    .four-checks-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .four-checks-conn  { animation: four-checks-trace 6.4s ease-in-out infinite; }
      .four-checks-stage { animation: four-checks-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes four-checks-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes four-checks-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .four-checks-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .four-checks-stage { animation: four-checks-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes four-checks-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="four-checks-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="four-checks-bg" width="980" height="322"/>
  <text class="four-checks-h1"  x="30" y="40">What the checker looks for</text>
  <text class="four-checks-sub" x="30" y="64">Four decidable properties, no network.</text>
  <g class="four-checks-stage four-checks-s0">
    <rect class="four-checks-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="four-checks-step" x="44" y="142">01</text>
    <text class="four-checks-name" x="70" y="142">Measurement</text>
    <text class="four-checks-desc" x="44" y="166">A number with a unit, a</text>
    <text class="four-checks-desc" x="44" y="182">percentage, a multiplier — or a</text>
    <text class="four-checks-desc" x="44" y="198">stated change between two</text>
  </g>
  <line class="four-checks-line four-checks-conn four-checks-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#four-checks-tip)"/>
  <g class="four-checks-stage four-checks-s1">
    <rect class="four-checks-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="four-checks-step" x="280" y="142">02</text>
    <text class="four-checks-name" x="306" y="142">Baseline</text>
    <text class="four-checks-desc" x="280" y="166">Wording that names a starting</text>
    <text class="four-checks-desc" x="280" y="182">point: from, previously,</text>
    <text class="four-checks-desc" x="280" y="198">compared to.</text>
    <text class="four-checks-edge" x="280" y="242">from</text>
  </g>
  <line class="four-checks-line four-checks-conn four-checks-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#four-checks-tip)"/>
  <g class="four-checks-stage four-checks-s2">
    <rect class="four-checks-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="four-checks-step" x="516" y="142">03</text>
    <text class="four-checks-name" x="542" y="142">Attribution</text>
    <text class="four-checks-desc" x="516" y="166">Yours, shared, mixed, or</text>
    <text class="four-checks-desc" x="516" y="182">unattributed. Mixed is</text>
    <text class="four-checks-desc" x="516" y="198">strongest.</text>
    <text class="four-checks-edge" x="516" y="242">mixed</text>
  </g>
  <line class="four-checks-line four-checks-conn four-checks-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#four-checks-tip)"/>
  <g class="four-checks-stage four-checks-s3">
    <rect class="four-checks-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="four-checks-step" x="752" y="142">04</text>
    <text class="four-checks-name" x="778" y="142">Evidence</text>
    <text class="four-checks-desc" x="752" y="166">A public URL, decidable from the</text>
    <text class="four-checks-desc" x="752" y="182">string alone. No request needed.</text>
    <text class="four-checks-edge" x="752" y="242">offline</text>
  </g>
  <text class="four-checks-sub" x="30" y="304">Accepting "from 0.71 to 0.94" without a unit is a deliberate concession: a checker that demands units pushes people into attaching units that do not belong, which makes the writing worse.</text>
</svg>
