<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Geometry, then computation.">
  <title>Four steps for transformations</title>
  <style>
    .transform-history-bg   { fill: #f8fafc; }
    .transform-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transform-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transform-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transform-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transform-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transform-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .transform-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .transform-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .transform-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .transform-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .transform-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .transform-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .transform-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .transform-history-stage { opacity: 1; }

    .transform-history-s0 { animation-delay: 0.00s; }
    .transform-history-e0 { animation-delay: 0.00s; }
    .transform-history-s1 { animation-delay: 1.28s; }
    .transform-history-e1 { animation-delay: 1.28s; }
    .transform-history-s2 { animation-delay: 2.56s; }
    .transform-history-e2 { animation-delay: 2.56s; }
    .transform-history-s3 { animation-delay: 3.84s; }
    .transform-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .transform-history-conn  { animation: transform-history-trace 6.4s ease-in-out infinite; }
      .transform-history-stage { animation: transform-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes transform-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes transform-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .transform-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .transform-history-stage { animation: transform-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes transform-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="transform-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="transform-history-bg" width="980" height="322"/>
  <text class="transform-history-h1"  x="30" y="40">Four steps for transformations</text>
  <text class="transform-history-sub" x="30" y="64">Geometry, then computation.</text>
  <g class="transform-history-stage transform-history-s0">
    <rect class="transform-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="transform-history-step" x="44" y="142">01</text>
    <text class="transform-history-name" x="70" y="142">Geometric constructions, done by hand</text>
    <text class="transform-history-desc" x="44" y="166">Rotation and scaling, without</text>
    <text class="transform-history-desc" x="44" y="182">matrices.</text>
  </g>
  <line class="transform-history-line transform-history-conn transform-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#transform-history-tip)"/>
  <g class="transform-history-stage transform-history-s1">
    <rect class="transform-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="transform-history-step" x="280" y="142">02</text>
    <text class="transform-history-name" x="306" y="142">Then an algebraic formulation</text>
    <text class="transform-history-desc" x="280" y="166">Which made composition a</text>
    <text class="transform-history-desc" x="280" y="182">multiplication.</text>
  </g>
  <line class="transform-history-line transform-history-conn transform-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#transform-history-tip)"/>
  <g class="transform-history-stage transform-history-s2">
    <rect class="transform-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="transform-history-step" x="516" y="142">03</text>
    <text class="transform-history-name" x="542" y="142">Computer graphics made it a mass computation</text>
    <text class="transform-history-desc" x="516" y="166">Millions of points per frame.</text>
  </g>
  <line class="transform-history-line transform-history-conn transform-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#transform-history-tip)"/>
  <g class="transform-history-stage transform-history-s3">
    <rect class="transform-history-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="transform-history-step" x="752" y="142">04</text>
    <text class="transform-history-name" x="778" y="142">And neural network layers are the same operation</text>
    <text class="transform-history-desc" x="752" y="166">With learned rather than</text>
    <text class="transform-history-desc" x="752" y="182">designed matrices.</text>
  </g>
  <text class="transform-history-sub" x="30" y="304">The difference between a graphics transform and a network layer is only where the numbers came from, which is a useful thing to notice once.</text>
</svg>
