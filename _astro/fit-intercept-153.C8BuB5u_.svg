<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Two ways to handle the intercept</title>
  <style>
    .fit-intercept-153-bg   { fill: #f8fafc; }
    .fit-intercept-153-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fit-intercept-153-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fit-intercept-153-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fit-intercept-153-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fit-intercept-153-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fit-intercept-153-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fit-intercept-153-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fit-intercept-153-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fit-intercept-153-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fit-intercept-153-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fit-intercept-153-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fit-intercept-153-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .fit-intercept-153-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .fit-intercept-153-stage { opacity: 1; }

    .fit-intercept-153-s0 { animation-delay: 0.00s; }
    .fit-intercept-153-e0 { animation-delay: 0.00s; }
    .fit-intercept-153-s1 { animation-delay: 1.28s; }
    .fit-intercept-153-e1 { animation-delay: 1.28s; }
    .fit-intercept-153-s2 { animation-delay: 2.56s; }
    .fit-intercept-153-e2 { animation-delay: 2.56s; }
    .fit-intercept-153-s3 { animation-delay: 3.84s; }
    .fit-intercept-153-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .fit-intercept-153-conn  { animation: fit-intercept-153-trace 6.4s ease-in-out infinite; }
      .fit-intercept-153-stage { animation: fit-intercept-153-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes fit-intercept-153-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes fit-intercept-153-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .fit-intercept-153-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .fit-intercept-153-stage { animation: fit-intercept-153-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes fit-intercept-153-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="fit-intercept-153-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="fit-intercept-153-bg" width="980" height="322"/>
  <text class="fit-intercept-153-h1"  x="30" y="40">Two ways to handle the intercept</text>
  <text class="fit-intercept-153-sub" x="30" y="64">Four steps.</text>
  <g class="fit-intercept-153-stage fit-intercept-153-s0">
    <rect class="fit-intercept-153-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="fit-intercept-153-step" x="44" y="142">01</text>
    <text class="fit-intercept-153-name" x="70" y="142">Append a column of ones to the data</text>
    <text class="fit-intercept-153-desc" x="44" y="166">So the intercept is just another</text>
    <text class="fit-intercept-153-desc" x="44" y="182">coefficient.</text>
  </g>
  <line class="fit-intercept-153-line fit-intercept-153-conn fit-intercept-153-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#fit-intercept-153-tip)"/>
  <g class="fit-intercept-153-stage fit-intercept-153-s1">
    <rect class="fit-intercept-153-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="fit-intercept-153-step" x="280" y="142">02</text>
    <text class="fit-intercept-153-name" x="306" y="142">Or centre the data and compute the intercept afterwards</text>
    <text class="fit-intercept-153-desc" x="280" y="166">From the means.</text>
  </g>
  <line class="fit-intercept-153-line fit-intercept-153-conn fit-intercept-153-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#fit-intercept-153-tip)"/>
  <g class="fit-intercept-153-stage fit-intercept-153-s2">
    <rect class="fit-intercept-153-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="fit-intercept-153-step" x="516" y="142">03</text>
    <text class="fit-intercept-153-name" x="542" y="142">Both give the same answer mathematically</text>
    <text class="fit-intercept-153-desc" x="516" y="166">And not the same numerical</text>
    <text class="fit-intercept-153-desc" x="516" y="182">behaviour.</text>
  </g>
  <line class="fit-intercept-153-line fit-intercept-153-conn fit-intercept-153-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#fit-intercept-153-tip)"/>
  <g class="fit-intercept-153-stage fit-intercept-153-s3">
    <rect class="fit-intercept-153-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="fit-intercept-153-step" x="752" y="142">04</text>
    <text class="fit-intercept-153-name" x="778" y="142">Centring conditions better</text>
    <text class="fit-intercept-153-desc" x="752" y="166">Which is what the libraries do.</text>
  </g>
  <text class="fit-intercept-153-sub" x="30" y="304">Two mathematically equivalent routes differing numerically is the recurring theme of this lesson, and it is why implementation choices are not merely stylistic.</text>
</svg>
