<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two databases for two questions.">
  <title>Search, or analytics</title>
  <style>
    .clickhouse-or-elastic-bg   { fill: #f8fafc; }
    .clickhouse-or-elastic-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clickhouse-or-elastic-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clickhouse-or-elastic-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clickhouse-or-elastic-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clickhouse-or-elastic-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clickhouse-or-elastic-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .clickhouse-or-elastic-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .clickhouse-or-elastic-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .clickhouse-or-elastic-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .clickhouse-or-elastic-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .clickhouse-or-elastic-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .clickhouse-or-elastic-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .clickhouse-or-elastic-row { opacity: 1; }
    .clickhouse-or-elastic-r0 { animation-delay: 0.00s; }
    .clickhouse-or-elastic-r1 { animation-delay: 0.45s; }
    .clickhouse-or-elastic-r2 { animation-delay: 0.90s; }
    .clickhouse-or-elastic-r3 { animation-delay: 1.35s; }
    .clickhouse-or-elastic-r4 { animation-delay: 1.80s; }
    .clickhouse-or-elastic-row { animation: clickhouse-or-elastic-reveal 7.3s ease-in-out infinite; }
    @keyframes clickhouse-or-elastic-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="clickhouse-or-elastic-bg" width="980" height="390"/>
  <text class="clickhouse-or-elastic-h1"  x="30" y="40">Search, or analytics</text>
  <text class="clickhouse-or-elastic-sub" x="30" y="64">Two databases for two questions.</text>
  <rect class="clickhouse-or-elastic-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="clickhouse-or-elastic-name" x="46" y="122">Full-text search</text>
  <text class="clickhouse-or-elastic-desc" x="46" y="142">Find one event.</text>
  <text class="clickhouse-or-elastic-desc clickhouse-or-elastic-row clickhouse-or-elastic-r0" x="46" y="182">"Which request threw this error?"</text>
  <text class="clickhouse-or-elastic-desc clickhouse-or-elastic-row clickhouse-or-elastic-r1" x="46" y="216">Inverted indexes over text</text>
  <text class="clickhouse-or-elastic-desc clickhouse-or-elastic-row clickhouse-or-elastic-r2" x="46" y="250">Excellent for investigation</text>
  <text class="clickhouse-or-elastic-desc clickhouse-or-elastic-row clickhouse-or-elastic-r3" x="46" y="284">Expensive per gigabyte in RAM and SSD</text>
  <text class="clickhouse-or-elastic-desc clickhouse-or-elastic-row clickhouse-or-elastic-r4" x="46" y="318">Wrong shape for summing a column</text>
  <rect class="clickhouse-or-elastic-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="clickhouse-or-elastic-name" x="526" y="122">Columnar analytics</text>
  <text class="clickhouse-or-elastic-desc" x="526" y="142">Sum a billion rows.</text>
  <text class="clickhouse-or-elastic-desc clickhouse-or-elastic-row clickhouse-or-elastic-r0" x="526" y="182">"What did tenant 42 spend this week?"</text>
  <text class="clickhouse-or-elastic-desc clickhouse-or-elastic-row clickhouse-or-elastic-r1" x="526" y="216">Columnar scans with heavy compression</text>
  <text class="clickhouse-or-elastic-desc clickhouse-or-elastic-row clickhouse-or-elastic-r2" x="526" y="250">Roughly 85% cheaper storage</text>
  <text class="clickhouse-or-elastic-desc clickhouse-or-elastic-row clickhouse-or-elastic-r3" x="526" y="284">50,000+ writes per second</text>
  <text class="clickhouse-or-elastic-desc clickhouse-or-elastic-row clickhouse-or-elastic-r4" x="526" y="318">Wrong shape for free-text search</text>
  <text class="clickhouse-or-elastic-sub" x="30" y="372">Running both is the normal answer rather than a compromise: they answer different questions, and forcing either to do the other's job is what produces either an unusable bill or an unusable query time.</text>
</svg>
