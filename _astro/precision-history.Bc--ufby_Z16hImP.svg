<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Range mattered more than digits.">
  <title>Four steps to low-precision training</title>
  <style>
    .precision-history-bg   { fill: #f8fafc; }
    .precision-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .precision-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .precision-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .precision-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .precision-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .precision-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .precision-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .precision-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .precision-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .precision-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .precision-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .precision-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .precision-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .precision-history-stage { opacity: 1; }

    .precision-history-s0 { animation-delay: 0.00s; }
    .precision-history-e0 { animation-delay: 0.00s; }
    .precision-history-s1 { animation-delay: 1.28s; }
    .precision-history-e1 { animation-delay: 1.28s; }
    .precision-history-s2 { animation-delay: 2.56s; }
    .precision-history-e2 { animation-delay: 2.56s; }
    .precision-history-s3 { animation-delay: 3.84s; }
    .precision-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .precision-history-conn  { animation: precision-history-trace 6.4s ease-in-out infinite; }
      .precision-history-stage { animation: precision-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes precision-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes precision-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .precision-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .precision-history-stage { animation: precision-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes precision-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="precision-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="precision-history-bg" width="980" height="322"/>
  <text class="precision-history-h1"  x="30" y="40">Four steps to low-precision training</text>
  <text class="precision-history-sub" x="30" y="64">Range mattered more than digits.</text>
  <g class="precision-history-stage precision-history-s0">
    <rect class="precision-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="precision-history-step" x="44" y="142">01</text>
    <text class="precision-history-name" x="70" y="142">Everything in thirty-two bits</text>
    <text class="precision-history-desc" x="44" y="166">Inherited from scientific</text>
    <text class="precision-history-desc" x="44" y="182">computing, and never questioned.</text>
  </g>
  <line class="precision-history-line precision-history-conn precision-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#precision-history-tip)"/>
  <g class="precision-history-stage precision-history-s1">
    <rect class="precision-history-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="precision-history-step" x="280" y="142">02</text>
    <text class="precision-history-name" x="306" y="142">Sixteen bits, with a loss scaler</text>
    <text class="precision-history-desc" x="280" y="166">Twice as fast, and fragile.</text>
    <text class="precision-history-desc" x="280" y="182">Underflow had to be worked</text>
    <text class="precision-history-desc" x="280" y="198">around.</text>
  </g>
  <line class="precision-history-line precision-history-conn precision-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#precision-history-tip)"/>
  <g class="precision-history-stage precision-history-s2">
    <rect class="precision-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="precision-history-step" x="516" y="142">03</text>
    <text class="precision-history-name" x="542" y="142">A format with full exponent range</text>
    <text class="precision-history-desc" x="516" y="166">Fewer digits, no underflow, no</text>
    <text class="precision-history-desc" x="516" y="182">scaler needed.</text>
  </g>
  <line class="precision-history-line precision-history-conn precision-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#precision-history-tip)"/>
  <g class="precision-history-stage precision-history-s3">
    <rect class="precision-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="precision-history-step" x="752" y="142">04</text>
    <text class="precision-history-name" x="778" y="142">Then eight bits</text>
    <text class="precision-history-desc" x="752" y="166">For the largest models, with</text>
    <text class="precision-history-desc" x="752" y="182">per-block scaling.</text>
  </g>
  <text class="precision-history-sub" x="30" y="304">Each step traded decimal places for speed and found that the model did not care, which is a result about the redundancy of neural network weights rather than about hardware.</text>
</svg>
