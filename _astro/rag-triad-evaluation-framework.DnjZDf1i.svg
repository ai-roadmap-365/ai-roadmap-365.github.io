<svg role="img" aria-label="RAG triad evaluation framework diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>The RAG Triad Evaluation Framework</title>
  <defs>
    <linearGradient id="bg265a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card265" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg265a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">THE RAG TRIAD EVALUATION FRAMEWORK</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Core Pillars: Context Relevance, Grounded Faithfulness, and Answer Relevance</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card265)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Top: User Query -->
    <rect x="310" y="20" width="140" height="50" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="380" y="45" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">1. User Query</text>
    <text x="380" y="60" fill="#cbd5e1" font-size="8" text-anchor="middle">"What is the SLA?"</text>

    <!-- Bottom Left: Retrieved Context -->
    <rect x="70" y="210" width="180" height="65" fill="#0f172a" stroke="#fbbf24" rx="6"/>
    <text x="160" y="235" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">2. Retrieved Context</text>
    <text x="160" y="252" fill="#cbd5e1" font-size="8" text-anchor="middle">Passages retrieved from DB</text>
    <text x="160" y="265" fill="#94a3b8" font-size="7" text-anchor="middle">Vector / Hybrid Index</text>

    <!-- Bottom Right: Generated Response -->
    <rect x="510" y="210" width="180" height="65" fill="#0f172a" stroke="#34d399" rx="6"/>
    <text x="600" y="235" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">3. Generated Answer</text>
    <text x="600" y="252" fill="#cbd5e1" font-size="8" text-anchor="middle">LLM Response Generation</text>
    <text x="600" y="265" fill="#94a3b8" font-size="7" text-anchor="middle">"The SLA is 99.99%"</text>

    <!-- Edge 1: Query <-> Context (Context Relevance) -->
    <line x1="320" y1="70" x2="190" y2="210" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
    <rect x="150" y="115" width="160" height="45" fill="#0f172a" stroke="#38bdf8" rx="4"/>
    <text x="230" y="133" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">Context Relevance</text>
    <text x="230" y="148" fill="#94a3b8" font-size="7.5" text-anchor="middle">Is context free of noise?</text>

    <!-- Edge 2: Context <-> Answer (Groundedness / Faithfulness) -->
    <line x1="250" y1="242" x2="510" y2="242" stroke="#fb7185" stroke-width="2.5"/>
    <rect x="300" y="225" width="160" height="45" fill="#0f172a" stroke="#fb7185" rx="4"/>
    <text x="380" y="243" fill="#fb7185" font-size="9" font-weight="700" text-anchor="middle">Faithfulness (Grounded)</text>
    <text x="380" y="258" fill="#94a3b8" font-size="7.5" text-anchor="middle">Is answer 100% in context?</text>

    <!-- Edge 3: Query <-> Answer (Answer Relevance) -->
    <line x1="440" y1="70" x2="570" y2="210" stroke="#34d399" stroke-width="2" stroke-dasharray="4,4"/>
    <rect x="450" y="115" width="160" height="45" fill="#0f172a" stroke="#34d399" rx="4"/>
    <text x="530" y="133" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">Answer Relevance</text>
    <text x="530" y="148" fill="#94a3b8" font-size="7.5" text-anchor="middle">Does it directly answer query?</text>
  </g>
</svg>
