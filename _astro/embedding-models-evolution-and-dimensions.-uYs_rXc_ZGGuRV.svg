<svg role="img" aria-label="Embedding models evolution and dimensionality architecture diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Embedding Models Evolution &amp; Dimensions</title>
  <defs>
    <linearGradient id="bg260b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card260b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg260b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">EMBEDDING MODELS EVOLUTION &amp; DIMENSIONS</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">From Word-Level Lookups to Contextual Sentence Transformers and Asymmetric Bi-Encoders</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card260b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Word2Vec / GloVe (2013) -->
    <rect x="25" y="25" width="220" height="245" fill="#0f172a" stroke="#94a3b8" rx="6"/>
    <text x="135" y="50" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle">1. Static Word Embeddings</text>
    <text x="135" y="65" fill="#64748b" font-size="8" text-anchor="middle">Word2Vec / GloVe (2013-2014)</text>
    <rect x="35" y="80" width="200" height="85" fill="#1e293b" rx="4"/>
    <text x="45" y="100" fill="#cbd5e1" font-size="7">• Fixed 1 vector per word</text>
    <text x="45" y="115" fill="#fb7185" font-size="7">• Polysemy Blindness:</text>
    <text x="45" y="130" fill="#cbd5e1" font-size="7">  "bank" (river) == "bank" (money)</text>
    <text x="45" y="145" fill="#cbd5e1" font-size="7">• Dimensions: 100 - 300d</text>
    <text x="135" y="245" fill="#94a3b8" font-size="8" font-weight="700" text-anchor="middle">Bag-of-Words Limitation</text>

    <!-- Sentence Transformers (2019) -->
    <rect x="270" y="25" width="220" height="245" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="380" y="50" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">2. Contextual Encoders</text>
    <text x="380" y="65" fill="#38bdf8" font-size="8" text-anchor="middle">SBERT / all-MiniLM-L6-v2</text>
    <rect x="280" y="80" width="200" height="85" fill="#1e293b" rx="4"/>
    <text x="290" y="100" fill="#cbd5e1" font-size="7">• Siamese BERT architecture</text>
    <text x="290" y="115" fill="#34d399" font-size="7">• Full sentence contextualization</text>
    <text x="290" y="130" fill="#cbd5e1" font-size="7">• Contrastive learning (InfoNCE)</text>
    <text x="290" y="145" fill="#cbd5e1" font-size="7">• Dimensions: 384 - 768d</text>
    <text x="380" y="245" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">High Quality Sentence Search</text>

    <!-- Modern Asymmetric Bi-Encoders (2024+) -->
    <rect x="515" y="25" width="220" height="245" fill="#0f172a" stroke="#34d399" stroke-width="1.5" rx="6"/>
    <text x="625" y="50" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">3. Modern Asymmetric Models</text>
    <text x="625" y="65" fill="#34d399" font-size="8" text-anchor="middle">text-embedding-3 / BGE-M3</text>
    <rect x="525" y="80" width="200" height="85" fill="#1e293b" rx="4"/>
    <text x="535" y="100" fill="#cbd5e1" font-size="7">• Matryoshka Reps (MRL)</text>
    <text x="535" y="115" fill="#34d399" font-size="7">• Truncate 1536d -&gt; 512d with &lt;1% loss</text>
    <text x="535" y="130" fill="#cbd5e1" font-size="7">• Asymmetric Query/Passage prefix</text>
    <text x="535" y="145" fill="#34d399" font-size="7">• 8,192 Token Context Windows</text>
    <text x="625" y="245" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Enterprise RAG Backbone</text>
  </g>
</svg>
