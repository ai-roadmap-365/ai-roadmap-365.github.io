<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Freshness against operational complexity.">
  <title>Batch or streaming</title>
  <style>
    .batch-or-streaming-bg   { fill: #f8fafc; }
    .batch-or-streaming-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .batch-or-streaming-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .batch-or-streaming-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .batch-or-streaming-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .batch-or-streaming-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .batch-or-streaming-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .batch-or-streaming-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .batch-or-streaming-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .batch-or-streaming-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .batch-or-streaming-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .batch-or-streaming-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .batch-or-streaming-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .batch-or-streaming-row { opacity: 1; }
    .batch-or-streaming-r0 { animation-delay: 0.00s; }
    .batch-or-streaming-r1 { animation-delay: 0.45s; }
    .batch-or-streaming-r2 { animation-delay: 0.90s; }
    .batch-or-streaming-r3 { animation-delay: 1.35s; }
    .batch-or-streaming-r4 { animation-delay: 1.80s; }
    .batch-or-streaming-row { animation: batch-or-streaming-reveal 7.3s ease-in-out infinite; }
    @keyframes batch-or-streaming-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="batch-or-streaming-bg" width="980" height="390"/>
  <text class="batch-or-streaming-h1"  x="30" y="40">Batch or streaming</text>
  <text class="batch-or-streaming-sub" x="30" y="64">Freshness against operational complexity.</text>
  <rect class="batch-or-streaming-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="batch-or-streaming-name" x="46" y="122">Batch</text>
  <text class="batch-or-streaming-desc" x="46" y="142">Frequent enough, usually.</text>
  <text class="batch-or-streaming-desc batch-or-streaming-row batch-or-streaming-r0" x="46" y="182">Runs on a schedule over a window</text>
  <text class="batch-or-streaming-desc batch-or-streaming-row batch-or-streaming-r1" x="46" y="216">Staleness measured in minutes</text>
  <text class="batch-or-streaming-desc batch-or-streaming-row batch-or-streaming-r2" x="46" y="250">Simple operational semantics</text>
  <text class="batch-or-streaming-desc batch-or-streaming-row batch-or-streaming-r3" x="46" y="284">Easy to reason about and re-run</text>
  <text class="batch-or-streaming-desc batch-or-streaming-row batch-or-streaming-r4" x="46" y="318">Sufficient for most retrieval systems</text>
  <rect class="batch-or-streaming-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="batch-or-streaming-name" x="526" y="122">Streaming</text>
  <text class="batch-or-streaming-desc" x="526" y="142">Lower staleness, harder.</text>
  <text class="batch-or-streaming-desc batch-or-streaming-row batch-or-streaming-r0" x="526" y="182">Reacts per event</text>
  <text class="batch-or-streaming-desc batch-or-streaming-row batch-or-streaming-r1" x="526" y="216">Staleness measured in seconds</text>
  <text class="batch-or-streaming-desc batch-or-streaming-row batch-or-streaming-r2" x="526" y="250">Much harder failure semantics</text>
  <text class="batch-or-streaming-desc batch-or-streaming-row batch-or-streaming-r3" x="526" y="284">Backpressure and ordering to manage</text>
  <text class="batch-or-streaming-desc batch-or-streaming-row batch-or-streaming-r4" x="526" y="318">Right when minutes are genuinely too slow</text>
  <text class="batch-or-streaming-sub" x="30" y="372">Index freshness of minutes is nearly always sufficient for retrieval, which makes frequent batching the default and streaming a choice you should be able to justify with a requirement.</text>
</svg>
