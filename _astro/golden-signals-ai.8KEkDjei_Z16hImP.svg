<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each one gets a different metric here.">
  <title>The four golden signals, for AI</title>
  <style>
    .golden-signals-ai-bg   { fill: #f8fafc; }
    .golden-signals-ai-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .golden-signals-ai-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .golden-signals-ai-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .golden-signals-ai-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .golden-signals-ai-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .golden-signals-ai-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .golden-signals-ai-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .golden-signals-ai-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .golden-signals-ai-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .golden-signals-ai-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .golden-signals-ai-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .golden-signals-ai-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .golden-signals-ai-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .golden-signals-ai-stage { opacity: 1; }

    .golden-signals-ai-s0 { animation-delay: 0.00s; }
    .golden-signals-ai-e0 { animation-delay: 0.00s; }
    .golden-signals-ai-s1 { animation-delay: 1.28s; }
    .golden-signals-ai-e1 { animation-delay: 1.28s; }
    .golden-signals-ai-s2 { animation-delay: 2.56s; }
    .golden-signals-ai-e2 { animation-delay: 2.56s; }
    .golden-signals-ai-s3 { animation-delay: 3.84s; }
    .golden-signals-ai-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .golden-signals-ai-conn  { animation: golden-signals-ai-trace 6.4s ease-in-out infinite; }
      .golden-signals-ai-stage { animation: golden-signals-ai-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes golden-signals-ai-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes golden-signals-ai-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .golden-signals-ai-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .golden-signals-ai-stage { animation: golden-signals-ai-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes golden-signals-ai-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="golden-signals-ai-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="golden-signals-ai-bg" width="980" height="322"/>
  <text class="golden-signals-ai-h1"  x="30" y="40">The four golden signals, for AI</text>
  <text class="golden-signals-ai-sub" x="30" y="64">Each one gets a different metric here.</text>
  <g class="golden-signals-ai-stage golden-signals-ai-s0">
    <rect class="golden-signals-ai-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="golden-signals-ai-step" x="44" y="142">01</text>
    <text class="golden-signals-ai-name" x="70" y="142">Latency</text>
    <text class="golden-signals-ai-desc" x="44" y="166">Time to first token, and</text>
    <text class="golden-signals-ai-desc" x="44" y="182">inter-token latency. Not one</text>
    <text class="golden-signals-ai-desc" x="44" y="198">number.</text>
    <text class="golden-signals-ai-edge" x="44" y="242">TTFT, ITL</text>
  </g>
  <line class="golden-signals-ai-line golden-signals-ai-conn golden-signals-ai-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#golden-signals-ai-tip)"/>
  <g class="golden-signals-ai-stage golden-signals-ai-s1">
    <rect class="golden-signals-ai-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="golden-signals-ai-step" x="280" y="142">02</text>
    <text class="golden-signals-ai-name" x="306" y="142">Traffic</text>
    <text class="golden-signals-ai-desc" x="280" y="166">Requests per second, and tokens</text>
    <text class="golden-signals-ai-desc" x="280" y="182">per second. The second is the</text>
    <text class="golden-signals-ai-desc" x="280" y="198">one that costs money.</text>
    <text class="golden-signals-ai-edge" x="280" y="242">tokens/s</text>
  </g>
  <line class="golden-signals-ai-line golden-signals-ai-conn golden-signals-ai-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#golden-signals-ai-tip)"/>
  <g class="golden-signals-ai-stage golden-signals-ai-s2">
    <rect class="golden-signals-ai-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="golden-signals-ai-step" x="516" y="142">03</text>
    <text class="golden-signals-ai-name" x="542" y="142">Errors</text>
    <text class="golden-signals-ai-desc" x="516" y="166">5xx responses, and refusals. A</text>
    <text class="golden-signals-ai-desc" x="516" y="182">refusal is a 200 that failed.</text>
  </g>
  <line class="golden-signals-ai-line golden-signals-ai-conn golden-signals-ai-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#golden-signals-ai-tip)"/>
  <g class="golden-signals-ai-stage golden-signals-ai-s3">
    <rect class="golden-signals-ai-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="golden-signals-ai-step" x="752" y="142">04</text>
    <text class="golden-signals-ai-name" x="778" y="142">Saturation</text>
    <text class="golden-signals-ai-desc" x="752" y="166">VRAM and queue depth.</text>
    <text class="golden-signals-ai-desc" x="752" y="182">num_requests_waiting, not CPU.</text>
    <text class="golden-signals-ai-edge" x="752" y="242">KV cache</text>
  </g>
  <text class="golden-signals-ai-sub" x="30" y="304">Every one of the four has an AI-specific reading, and the fourth is the one that breaks a standard dashboard: a GPU worker at full KV-cache saturation shows unremarkable host CPU.</text>
</svg>
