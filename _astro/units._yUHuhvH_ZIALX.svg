<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Without converting them.">
  <title>Comparing quantities in different units</title>
  <style>
    .units-bg   { fill: #f8fafc; }
    .units-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .units-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .units-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .units-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .units-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .units-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .units-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .units-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .units-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .units-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .units-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .units-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .units-row { opacity: 1; }
    .units-r0 { animation-delay: 0.00s; }
    .units-r1 { animation-delay: 0.45s; }
    .units-r2 { animation-delay: 0.90s; }
    .units-r3 { animation-delay: 1.35s; }
    .units-r4 { animation-delay: 1.80s; }
    .units-row { animation: units-reveal 7.3s ease-in-out infinite; }
    @keyframes units-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="units-bg" width="980" height="390"/>
  <text class="units-h1"  x="30" y="40">Comparing quantities in different units</text>
  <text class="units-sub" x="30" y="64">Without converting them.</text>
  <rect class="units-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="units-name" x="46" y="122">Different units</text>
  <text class="units-desc" x="46" y="142">The comparison is meaningless.</text>
  <text class="units-desc units-row units-r0" x="46" y="182">One quantity in thousands, another in tens</text>
  <text class="units-desc units-row units-r1" x="46" y="216">The larger number dominates any total</text>
  <text class="units-desc units-row units-r2" x="46" y="250">Its dominance reflects units, not importance</text>
  <text class="units-desc units-row units-r3" x="46" y="284">The conclusion is an artefact</text>
  <text class="units-desc units-row units-r4" x="46" y="318">This is unscaled features</text>
  <rect class="units-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="units-name" x="526" y="122">Common units</text>
  <text class="units-desc" x="526" y="142">The comparison is meaningful.</text>
  <text class="units-desc units-row units-r0" x="526" y="182">Both expressed on the same scale</text>
  <text class="units-desc units-row units-r1" x="526" y="216">Neither dominates by construction</text>
  <text class="units-desc units-row units-r2" x="526" y="250">Influence reflects actual relevance</text>
  <text class="units-desc units-row units-r3" x="526" y="284">The conclusion is real</text>
  <text class="units-desc units-row units-r4" x="526" y="318">This is scaled features</text>
  <text class="units-sub" x="30" y="372">Nobody would add a distance to a temperature and interpret the total, yet an unscaled distance metric does exactly that on every prediction.</text>
</svg>
