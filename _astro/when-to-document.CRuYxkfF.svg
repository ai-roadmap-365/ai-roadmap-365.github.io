<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The best moment is while decisions are fresh.">
  <title>When to write it, and how much</title>
  <style>
    .when-to-document-bg   { fill: #f8fafc; }
    .when-to-document-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .when-to-document-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .when-to-document-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .when-to-document-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .when-to-document-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .when-to-document-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .when-to-document-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .when-to-document-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .when-to-document-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .when-to-document-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .when-to-document-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .when-to-document-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .when-to-document-row { opacity: 1; }
    .when-to-document-r0 { animation-delay: 0.00s; }
    .when-to-document-r1 { animation-delay: 0.45s; }
    .when-to-document-r2 { animation-delay: 0.90s; }
    .when-to-document-r3 { animation-delay: 1.35s; }
    .when-to-document-r4 { animation-delay: 1.80s; }
    .when-to-document-row { animation: when-to-document-reveal 7.3s ease-in-out infinite; }
    @keyframes when-to-document-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="when-to-document-bg" width="980" height="390"/>
  <text class="when-to-document-h1"  x="30" y="40">When to write it, and how much</text>
  <text class="when-to-document-sub" x="30" y="64">The best moment is while decisions are fresh.</text>
  <rect class="when-to-document-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="when-to-document-name" x="46" y="122">Write and check</text>
  <text class="when-to-document-desc" x="46" y="142">As soon as anyone else reads it.</text>
  <text class="when-to-document-desc when-to-document-row when-to-document-r0" x="46" y="182">While the decisions are still fresh</text>
  <text class="when-to-document-desc when-to-document-row when-to-document-r1" x="46" y="216">Before you forget what is surprising</text>
  <text class="when-to-document-desc when-to-document-row when-to-document-r2" x="46" y="250">When someone else depends on it</text>
  <text class="when-to-document-desc when-to-document-row when-to-document-r3" x="46" y="284">Drift becomes their problem, not yours</text>
  <text class="when-to-document-desc when-to-document-row when-to-document-r4" x="46" y="318">One good README, in the test suite</text>
  <rect class="when-to-document-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="when-to-document-name" x="526" y="122">Keep it light</text>
  <text class="when-to-document-desc" x="526" y="142">Proportion, not completeness.</text>
  <text class="when-to-document-desc when-to-document-row when-to-document-r0" x="526" y="182">A project only you use</text>
  <text class="when-to-document-desc when-to-document-row when-to-document-r1" x="526" y="216">A stale README you can survive</text>
  <text class="when-to-document-desc when-to-document-row when-to-document-r2" x="526" y="250">No documentation site for a capstone</text>
  <text class="when-to-document-desc when-to-document-row when-to-document-r3" x="526" y="284">A short one they read beats a long one they do not</text>
  <text class="when-to-document-desc when-to-document-row when-to-document-r4" x="526" y="318">But always state the limitations</text>
  <text class="when-to-document-sub" x="30" y="372">The limitations section is the exception to every proportionality argument: it costs a paragraph, and it is the thing that makes every other claim in the document credible.</text>
</svg>
