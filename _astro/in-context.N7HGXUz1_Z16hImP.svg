<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Adaptation without training.">
  <title>In-context learning</title>
  <style>
    .in-context-bg   { fill: #f8fafc; }
    .in-context-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .in-context-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .in-context-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .in-context-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .in-context-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .in-context-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .in-context-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .in-context-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .in-context-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .in-context-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .in-context-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .in-context-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .in-context-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .in-context-stage { opacity: 1; }

    .in-context-s0 { animation-delay: 0.00s; }
    .in-context-e0 { animation-delay: 0.00s; }
    .in-context-s1 { animation-delay: 1.28s; }
    .in-context-e1 { animation-delay: 1.28s; }
    .in-context-s2 { animation-delay: 2.56s; }
    .in-context-e2 { animation-delay: 2.56s; }
    .in-context-s3 { animation-delay: 3.84s; }
    .in-context-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .in-context-conn  { animation: in-context-trace 6.4s ease-in-out infinite; }
      .in-context-stage { animation: in-context-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes in-context-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes in-context-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .in-context-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .in-context-stage { animation: in-context-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes in-context-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="in-context-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="in-context-bg" width="980" height="322"/>
  <text class="in-context-h1"  x="30" y="40">In-context learning</text>
  <text class="in-context-sub" x="30" y="64">Adaptation without training.</text>
  <g class="in-context-stage in-context-s0">
    <rect class="in-context-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="in-context-step" x="44" y="142">01</text>
    <text class="in-context-name" x="70" y="142">A few examples are placed in the prompt</text>
    <text class="in-context-desc" x="44" y="166">Input and output pairs, in the</text>
    <text class="in-context-desc" x="44" y="182">desired format.</text>
  </g>
  <line class="in-context-line in-context-conn in-context-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#in-context-tip)"/>
  <g class="in-context-stage in-context-s1">
    <rect class="in-context-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="in-context-step" x="280" y="142">02</text>
    <text class="in-context-name" x="306" y="142">The model infers the pattern</text>
    <text class="in-context-desc" x="280" y="166">From the examples alone, within</text>
    <text class="in-context-desc" x="280" y="182">one forward pass.</text>
  </g>
  <line class="in-context-line in-context-conn in-context-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#in-context-tip)"/>
  <g class="in-context-stage in-context-s2">
    <rect class="in-context-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="in-context-step" x="516" y="142">03</text>
    <text class="in-context-name" x="542" y="142">And applies it to the new input</text>
    <text class="in-context-desc" x="516" y="166">Often matching a fine-tuned</text>
    <text class="in-context-desc" x="516" y="182">model on simple tasks.</text>
  </g>
  <line class="in-context-line in-context-conn in-context-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#in-context-tip)"/>
  <g class="in-context-stage in-context-s3">
    <rect class="in-context-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="in-context-step" x="752" y="142">04</text>
    <text class="in-context-name" x="778" y="142">With no weights changed at all</text>
    <text class="in-context-desc" x="752" y="166">The adaptation exists only</text>
    <text class="in-context-desc" x="752" y="182">inside that request.</text>
    <text class="in-context-edge" x="752" y="242">per request</text>
  </g>
  <text class="in-context-sub" x="30" y="304">That this works at all was not designed and not predicted, and it is the capability that made prompting a discipline rather than a user-interface detail.</text>
</svg>
