<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>A verdict, not a number</title>
  <style>
    .verdict-interval-bg   { fill: #f8fafc; }
    .verdict-interval-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .verdict-interval-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .verdict-interval-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .verdict-interval-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .verdict-interval-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .verdict-interval-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .verdict-interval-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .verdict-interval-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .verdict-interval-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .verdict-interval-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .verdict-interval-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .verdict-interval-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .verdict-interval-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .verdict-interval-stage { opacity: 1; }

    .verdict-interval-s0 { animation-delay: 0.00s; }
    .verdict-interval-e0 { animation-delay: 0.00s; }
    .verdict-interval-s1 { animation-delay: 1.28s; }
    .verdict-interval-e1 { animation-delay: 1.28s; }
    .verdict-interval-s2 { animation-delay: 2.56s; }
    .verdict-interval-e2 { animation-delay: 2.56s; }
    .verdict-interval-s3 { animation-delay: 3.84s; }
    .verdict-interval-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .verdict-interval-conn  { animation: verdict-interval-trace 6.4s ease-in-out infinite; }
      .verdict-interval-stage { animation: verdict-interval-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes verdict-interval-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes verdict-interval-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .verdict-interval-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .verdict-interval-stage { animation: verdict-interval-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes verdict-interval-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="verdict-interval-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="verdict-interval-bg" width="980" height="322"/>
  <text class="verdict-interval-h1"  x="30" y="40">A verdict, not a number</text>
  <text class="verdict-interval-sub" x="30" y="64">Four steps.</text>
  <g class="verdict-interval-stage verdict-interval-s0">
    <rect class="verdict-interval-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="verdict-interval-step" x="44" y="142">01</text>
    <text class="verdict-interval-name" x="70" y="142">The test score is one number from one sample</text>
    <text class="verdict-interval-desc" x="44" y="166">Of limited size.</text>
  </g>
  <line class="verdict-interval-line verdict-interval-conn verdict-interval-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#verdict-interval-tip)"/>
  <g class="verdict-interval-stage verdict-interval-s1">
    <rect class="verdict-interval-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="verdict-interval-step" x="280" y="142">02</text>
    <text class="verdict-interval-name" x="306" y="142">Resample it to see how much it could have varied</text>
    <text class="verdict-interval-desc" x="280" y="166">Two thousand times, which is</text>
    <text class="verdict-interval-desc" x="280" y="182">cheap.</text>
  </g>
  <line class="verdict-interval-line verdict-interval-conn verdict-interval-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#verdict-interval-tip)"/>
  <g class="verdict-interval-stage verdict-interval-s2">
    <rect class="verdict-interval-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="verdict-interval-step" x="516" y="142">03</text>
    <text class="verdict-interval-name" x="542" y="142">Giving an interval around the margin over baseline</text>
    <text class="verdict-interval-desc" x="516" y="166">Rather than a bare difference.</text>
  </g>
  <line class="verdict-interval-line verdict-interval-conn verdict-interval-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#verdict-interval-tip)"/>
  <g class="verdict-interval-stage verdict-interval-s3">
    <rect class="verdict-interval-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="verdict-interval-step" x="752" y="142">04</text>
    <text class="verdict-interval-name" x="778" y="142">If it does not cross zero, the improvement is real</text>
    <text class="verdict-interval-desc" x="752" y="166">Which is a verdict rather than a</text>
    <text class="verdict-interval-desc" x="752" y="182">hope.</text>
  </g>
  <text class="verdict-interval-sub" x="30" y="304">An interval that crosses zero is the honest outcome in more projects than are reported, and saying so is what makes the ones that do not cross it worth believing.</text>
</svg>
