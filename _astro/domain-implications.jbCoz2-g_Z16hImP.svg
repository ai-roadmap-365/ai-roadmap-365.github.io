<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are organisational.">
  <title>Four consequences of a good model</title>
  <style>
    .domain-implications-bg   { fill: #f8fafc; }
    .domain-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .domain-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .domain-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .domain-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .domain-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .domain-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .domain-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .domain-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .domain-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .domain-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .domain-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .domain-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .domain-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .domain-implications-stage { opacity: 1; }

    .domain-implications-s0 { animation-delay: 0.00s; }
    .domain-implications-e0 { animation-delay: 0.00s; }
    .domain-implications-s1 { animation-delay: 1.28s; }
    .domain-implications-e1 { animation-delay: 1.28s; }
    .domain-implications-s2 { animation-delay: 2.56s; }
    .domain-implications-e2 { animation-delay: 2.56s; }
    .domain-implications-s3 { animation-delay: 3.84s; }
    .domain-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .domain-implications-conn  { animation: domain-implications-trace 6.4s ease-in-out infinite; }
      .domain-implications-stage { animation: domain-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes domain-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes domain-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .domain-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .domain-implications-stage { animation: domain-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes domain-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="domain-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="domain-implications-bg" width="980" height="322"/>
  <text class="domain-implications-h1"  x="30" y="40">Four consequences of a good model</text>
  <text class="domain-implications-sub" x="30" y="64">Two are organisational.</text>
  <g class="domain-implications-stage domain-implications-s0">
    <rect class="domain-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="domain-implications-step" x="44" y="142">01</text>
    <text class="domain-implications-name" x="70" y="142">Invalid states become unconstructible</text>
    <text class="domain-implications-desc" x="44" y="166">Rather than merely discouraged.</text>
  </g>
  <line class="domain-implications-line domain-implications-conn domain-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#domain-implications-tip)"/>
  <g class="domain-implications-stage domain-implications-s1">
    <rect class="domain-implications-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="domain-implications-step" x="280" y="142">02</text>
    <text class="domain-implications-name" x="306" y="142">And the team shares one vocabulary</text>
    <text class="domain-implications-desc" x="280" y="166">Including the non-programmers.</text>
  </g>
  <line class="domain-implications-line domain-implications-conn domain-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#domain-implications-tip)"/>
  <g class="domain-implications-stage domain-implications-s2">
    <rect class="domain-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="domain-implications-step" x="516" y="142">03</text>
    <text class="domain-implications-name" x="542" y="142">While the rules test without infrastructure</text>
    <text class="domain-implications-desc" x="516" y="166">Which makes the test suite fast.</text>
  </g>
  <line class="domain-implications-line domain-implications-conn domain-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#domain-implications-tip)"/>
  <g class="domain-implications-stage domain-implications-s3">
    <rect class="domain-implications-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="domain-implications-step" x="752" y="142">04</text>
    <text class="domain-implications-name" x="778" y="142">And domain changes land in one place</text>
    <text class="domain-implications-desc" x="752" y="166">Rather than scattered across</text>
    <text class="domain-implications-desc" x="752" y="182">layers.</text>
  </g>
  <text class="domain-implications-sub" x="30" y="304">The shared vocabulary is the benefit that compounds, because it removes a translation step from every conversation about requirements.</text>
</svg>
