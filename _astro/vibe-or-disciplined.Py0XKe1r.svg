<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One is inspected; one is propped up.">
  <title>Two construction methods</title>
  <style>
    .vibe-or-disciplined-bg   { fill: #f8fafc; }
    .vibe-or-disciplined-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vibe-or-disciplined-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vibe-or-disciplined-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vibe-or-disciplined-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vibe-or-disciplined-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vibe-or-disciplined-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vibe-or-disciplined-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .vibe-or-disciplined-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .vibe-or-disciplined-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .vibe-or-disciplined-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .vibe-or-disciplined-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .vibe-or-disciplined-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vibe-or-disciplined-row { opacity: 1; }
    .vibe-or-disciplined-r0 { animation-delay: 0.00s; }
    .vibe-or-disciplined-r1 { animation-delay: 0.45s; }
    .vibe-or-disciplined-r2 { animation-delay: 0.90s; }
    .vibe-or-disciplined-r3 { animation-delay: 1.35s; }
    .vibe-or-disciplined-r4 { animation-delay: 1.80s; }
    .vibe-or-disciplined-row { animation: vibe-or-disciplined-reveal 7.3s ease-in-out infinite; }
    @keyframes vibe-or-disciplined-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="vibe-or-disciplined-bg" width="980" height="390"/>
  <text class="vibe-or-disciplined-h1"  x="30" y="40">Two construction methods</text>
  <text class="vibe-or-disciplined-sub" x="30" y="64">One is inspected; one is propped up.</text>
  <rect class="vibe-or-disciplined-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="vibe-or-disciplined-name" x="46" y="122">Unstructured</text>
  <text class="vibe-or-disciplined-desc" x="46" y="142">Saw first, check later.</text>
  <text class="vibe-or-disciplined-desc vibe-or-disciplined-row vibe-or-disciplined-r0" x="46" y="182">"Build this feature"</text>
  <text class="vibe-or-disciplined-desc vibe-or-disciplined-row vibe-or-disciplined-r1" x="46" y="216">A 500-line diff, no tests</text>
  <text class="vibe-or-disciplined-desc vibe-or-disciplined-row vibe-or-disciplined-r2" x="46" y="250">Clicking in a browser to check</text>
  <text class="vibe-or-disciplined-desc vibe-or-disciplined-row vibe-or-disciplined-r3" x="46" y="284">Three hours debugging regressions</text>
  <text class="vibe-or-disciplined-desc vibe-or-disciplined-row vibe-or-disciplined-r4" x="46" y="318">Defect prevention under 40%</text>
  <rect class="vibe-or-disciplined-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="vibe-or-disciplined-name" x="526" y="122">Disciplined</text>
  <text class="vibe-or-disciplined-desc" x="526" y="142">Blueprint, then build.</text>
  <text class="vibe-or-disciplined-desc vibe-or-disciplined-row vibe-or-disciplined-r0" x="526" y="182">A plan reviewed before any edit</text>
  <text class="vibe-or-disciplined-desc vibe-or-disciplined-row vibe-or-disciplined-r1" x="526" y="216">A failing test as the target</text>
  <text class="vibe-or-disciplined-desc vibe-or-disciplined-row vibe-or-disciplined-r2" x="526" y="250">Self-correction against tracebacks</text>
  <text class="vibe-or-disciplined-desc vibe-or-disciplined-row vibe-or-disciplined-r3" x="526" y="284">Green on the first inspection</text>
  <text class="vibe-or-disciplined-desc vibe-or-disciplined-row vibe-or-disciplined-r4" x="526" y="318">Defect prevention above 99%</text>
  <text class="vibe-or-disciplined-sub" x="30" y="372">The percentages are the argument: the disciplined column costs more up front in specification effort and returns it several times over in debugging that does not happen.</text>
</svg>
