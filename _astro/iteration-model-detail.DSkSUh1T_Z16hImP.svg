<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The iteration protocol</title>
  <style>
    .iteration-model-detail-bg   { fill: #f8fafc; }
    .iteration-model-detail-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .iteration-model-detail-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .iteration-model-detail-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .iteration-model-detail-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .iteration-model-detail-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .iteration-model-detail-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .iteration-model-detail-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .iteration-model-detail-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .iteration-model-detail-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .iteration-model-detail-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .iteration-model-detail-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .iteration-model-detail-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .iteration-model-detail-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .iteration-model-detail-stage { opacity: 1; }

    .iteration-model-detail-s0 { animation-delay: 0.00s; }
    .iteration-model-detail-e0 { animation-delay: 0.00s; }
    .iteration-model-detail-s1 { animation-delay: 1.28s; }
    .iteration-model-detail-e1 { animation-delay: 1.28s; }
    .iteration-model-detail-s2 { animation-delay: 2.56s; }
    .iteration-model-detail-e2 { animation-delay: 2.56s; }
    .iteration-model-detail-s3 { animation-delay: 3.84s; }
    .iteration-model-detail-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .iteration-model-detail-conn  { animation: iteration-model-detail-trace 6.4s ease-in-out infinite; }
      .iteration-model-detail-stage { animation: iteration-model-detail-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes iteration-model-detail-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes iteration-model-detail-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .iteration-model-detail-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .iteration-model-detail-stage { animation: iteration-model-detail-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes iteration-model-detail-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="iteration-model-detail-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="iteration-model-detail-bg" width="980" height="322"/>
  <text class="iteration-model-detail-h1"  x="30" y="40">The iteration protocol</text>
  <text class="iteration-model-detail-sub" x="30" y="64">Four steps.</text>
  <g class="iteration-model-detail-stage iteration-model-detail-s0">
    <rect class="iteration-model-detail-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="iteration-model-detail-step" x="44" y="142">01</text>
    <text class="iteration-model-detail-name" x="70" y="142">An iterable is asked for an iterator</text>
    <text class="iteration-model-detail-desc" x="44" y="166">Once, at the start of the loop.</text>
  </g>
  <line class="iteration-model-detail-line iteration-model-detail-conn iteration-model-detail-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#iteration-model-detail-tip)"/>
  <g class="iteration-model-detail-stage iteration-model-detail-s1">
    <rect class="iteration-model-detail-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="iteration-model-detail-step" x="280" y="142">02</text>
    <text class="iteration-model-detail-name" x="306" y="142">The iterator is asked for the next item</text>
    <text class="iteration-model-detail-desc" x="280" y="166">Repeatedly, one at a time.</text>
  </g>
  <line class="iteration-model-detail-line iteration-model-detail-conn iteration-model-detail-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#iteration-model-detail-tip)"/>
  <g class="iteration-model-detail-stage iteration-model-detail-s2">
    <rect class="iteration-model-detail-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="iteration-model-detail-step" x="516" y="142">03</text>
    <text class="iteration-model-detail-name" x="542" y="142">Until it signals that there are none left</text>
    <text class="iteration-model-detail-desc" x="516" y="166">Which the loop catches and</text>
    <text class="iteration-model-detail-desc" x="516" y="182">stops.</text>
  </g>
  <line class="iteration-model-detail-line iteration-model-detail-conn iteration-model-detail-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#iteration-model-detail-tip)"/>
  <g class="iteration-model-detail-stage iteration-model-detail-s3">
    <rect class="iteration-model-detail-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="iteration-model-detail-step" x="752" y="142">04</text>
    <text class="iteration-model-detail-name" x="778" y="142">So the loop never needs an index at all</text>
    <text class="iteration-model-detail-desc" x="752" y="166">Which removes a whole class of</text>
    <text class="iteration-model-detail-desc" x="752" y="182">error.</text>
    <text class="iteration-model-detail-edge" x="752" y="242">no indices</text>
  </g>
  <text class="iteration-model-detail-sub" x="30" y="304">Because the protocol is only these two operations, anything implementing them can be looped over — files, generators, database cursors and model batches alike.</text>
</svg>
