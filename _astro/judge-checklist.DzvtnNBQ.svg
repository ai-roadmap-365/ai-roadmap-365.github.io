<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And the two that are most often missed.">
  <title>Six checks before shipping a judge</title>
  <style>
    .judge-checklist-bg   { fill: #f8fafc; }
    .judge-checklist-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-checklist-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-checklist-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-checklist-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-checklist-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-checklist-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .judge-checklist-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .judge-checklist-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .judge-checklist-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .judge-checklist-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .judge-checklist-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .judge-checklist-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .judge-checklist-row { opacity: 1; }
    .judge-checklist-r0 { animation-delay: 0.00s; }
    .judge-checklist-r1 { animation-delay: 0.45s; }
    .judge-checklist-r2 { animation-delay: 0.90s; }
    .judge-checklist-r3 { animation-delay: 1.35s; }
    .judge-checklist-r4 { animation-delay: 1.80s; }
    .judge-checklist-row { animation: judge-checklist-reveal 7.3s ease-in-out infinite; }
    @keyframes judge-checklist-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="judge-checklist-bg" width="980" height="390"/>
  <text class="judge-checklist-h1"  x="30" y="40">Six checks before shipping a judge</text>
  <text class="judge-checklist-sub" x="30" y="64">And the two that are most often missed.</text>
  <rect class="judge-checklist-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="judge-checklist-name" x="46" y="122">Verified</text>
  <text class="judge-checklist-desc" x="46" y="142">Six checks.</text>
  <text class="judge-checklist-desc judge-checklist-row judge-checklist-r0" x="46" y="182">An impartial, strict evaluator persona</text>
  <text class="judge-checklist-desc judge-checklist-row judge-checklist-r1" x="46" y="216">Every score tier concretely defined</text>
  <text class="judge-checklist-desc judge-checklist-row judge-checklist-r2" x="46" y="250">Critique required before the score</text>
  <text class="judge-checklist-desc judge-checklist-row judge-checklist-r3" x="46" y="284">Output constrained to a schema</text>
  <text class="judge-checklist-desc judge-checklist-row judge-checklist-r4" x="46" y="318">Pairwise run in both directions, temperature 0</text>
  <rect class="judge-checklist-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="judge-checklist-name" x="526" y="122">Commonly missed</text>
  <text class="judge-checklist-desc" x="526" y="142">Two, both quiet.</text>
  <text class="judge-checklist-desc judge-checklist-row judge-checklist-r0" x="526" y="182">"Rate this from 1 to 10" with no anchors</text>
  <text class="judge-checklist-desc judge-checklist-row judge-checklist-r1" x="526" y="216">Scores drift between runs</text>
  <text class="judge-checklist-desc judge-checklist-row judge-checklist-r2" x="526" y="250">Single-direction pairwise comparison</text>
  <text class="judge-checklist-desc judge-checklist-row judge-checklist-r3" x="526" y="284">Positional bias goes unmeasured</text>
  <text class="judge-checklist-desc judge-checklist-row judge-checklist-r4" x="526" y="318">And the baseline is not comparable</text>
  <text class="judge-checklist-sub" x="30" y="372">Both of the missed items produce the same symptom rather than an error: the suite still runs, still reports numbers, and the numbers are not comparable to last week's.</text>
</svg>
