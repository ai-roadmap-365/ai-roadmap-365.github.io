<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Keep what shows through.">
  <title>A stencil over a page</title>
  <style>
    .stencil-bg   { fill: #f8fafc; }
    .stencil-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stencil-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stencil-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stencil-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stencil-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stencil-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stencil-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stencil-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stencil-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stencil-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stencil-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stencil-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stencil-row { opacity: 1; }
    .stencil-r0 { animation-delay: 0.00s; }
    .stencil-r1 { animation-delay: 0.45s; }
    .stencil-r2 { animation-delay: 0.90s; }
    .stencil-r3 { animation-delay: 1.35s; }
    .stencil-r4 { animation-delay: 1.80s; }
    .stencil-row { animation: stencil-reveal 7.3s ease-in-out infinite; }
    @keyframes stencil-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="stencil-bg" width="980" height="390"/>
  <text class="stencil-h1"  x="30" y="40">A stencil over a page</text>
  <text class="stencil-sub" x="30" y="64">Keep what shows through.</text>
  <rect class="stencil-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="stencil-name" x="46" y="122">A stencil</text>
  <text class="stencil-desc" x="46" y="142">All at once.</text>
  <text class="stencil-desc stencil-row stencil-r0" x="46" y="182">Cut holes where the condition holds</text>
  <text class="stencil-desc stencil-row stencil-r1" x="46" y="216">Lay it over the whole page</text>
  <text class="stencil-desc stencil-row stencil-r2" x="46" y="250">Everything showing through is kept</text>
  <text class="stencil-desc stencil-row stencil-r3" x="46" y="284">One operation, whatever the size</text>
  <text class="stencil-desc stencil-row stencil-r4" x="46" y="318">This is a boolean mask</text>
  <rect class="stencil-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="stencil-name" x="526" y="122">By hand</text>
  <text class="stencil-desc" x="526" y="142">One at a time.</text>
  <text class="stencil-desc stencil-row stencil-r0" x="526" y="182">Read each line</text>
  <text class="stencil-desc stencil-row stencil-r1" x="526" y="216">Decide, then copy it across</text>
  <text class="stencil-desc stencil-row stencil-r2" x="526" y="250">Slow, and error-prone</text>
  <text class="stencil-desc stencil-row stencil-r3" x="526" y="284">Time grows with the page</text>
  <text class="stencil-desc stencil-row stencil-r4" x="526" y="318">This is a Python loop</text>
  <text class="stencil-sub" x="30" y="372">The stencil doing all rows in one operation is exactly what vectorisation means, and it is why the mask idiom is both faster and easier to read.</text>
</svg>
