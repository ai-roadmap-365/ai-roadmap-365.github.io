<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to use boosting</title>
  <style>
    .boosting-when-bg   { fill: #f8fafc; }
    .boosting-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boosting-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boosting-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boosting-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boosting-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boosting-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .boosting-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .boosting-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .boosting-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .boosting-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .boosting-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .boosting-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .boosting-when-row { opacity: 1; }
    .boosting-when-r0 { animation-delay: 0.00s; }
    .boosting-when-r1 { animation-delay: 0.45s; }
    .boosting-when-r2 { animation-delay: 0.90s; }
    .boosting-when-r3 { animation-delay: 1.35s; }
    .boosting-when-r4 { animation-delay: 1.80s; }
    .boosting-when-row { animation: boosting-when-reveal 7.3s ease-in-out infinite; }
    @keyframes boosting-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="boosting-when-bg" width="980" height="390"/>
  <text class="boosting-when-h1"  x="30" y="40">When to use boosting</text>
  <text class="boosting-when-sub" x="30" y="64">And when not to.</text>
  <rect class="boosting-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="boosting-when-name" x="46" y="122">Use it</text>
  <text class="boosting-when-desc" x="46" y="142">Four cases.</text>
  <text class="boosting-when-desc boosting-when-row boosting-when-r0" x="46" y="182">Tabular data where accuracy matters</text>
  <text class="boosting-when-desc boosting-when-row boosting-when-r1" x="46" y="216">Competitions and benchmarks</text>
  <text class="boosting-when-desc boosting-when-row boosting-when-r2" x="46" y="250">Where you can afford to tune</text>
  <text class="boosting-when-desc boosting-when-row boosting-when-r3" x="46" y="284">Structured features with interactions</text>
  <text class="boosting-when-desc boosting-when-row boosting-when-r4" x="46" y="318">Ranking problems</text>
  <rect class="boosting-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="boosting-when-name" x="526" y="122">Use something else</text>
  <text class="boosting-when-desc" x="526" y="142">Also four.</text>
  <text class="boosting-when-desc boosting-when-row boosting-when-r0" x="526" y="182">Images, audio, text — networks</text>
  <text class="boosting-when-desc boosting-when-row boosting-when-r1" x="526" y="216">Where no tuning time exists — forest</text>
  <text class="boosting-when-desc boosting-when-row boosting-when-r2" x="526" y="250">Very small datasets</text>
  <text class="boosting-when-desc boosting-when-row boosting-when-r3" x="526" y="284">Where training must parallelise fully</text>
  <text class="boosting-when-desc boosting-when-row boosting-when-r4" x="526" y="318">Where a readable rule is required</text>
  <text class="boosting-when-sub" x="30" y="372">The no-tuning-time row is the honest one: an untuned boosted model frequently loses to a default random forest, so the choice depends on effort available.</text>
</svg>
