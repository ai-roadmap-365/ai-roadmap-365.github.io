<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Both have a cost.">
  <title>Two resampling directions</title>
  <style>
    .resampling-bg   { fill: #f8fafc; }
    .resampling-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resampling-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resampling-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resampling-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resampling-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resampling-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .resampling-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .resampling-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .resampling-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .resampling-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .resampling-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .resampling-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .resampling-row { opacity: 1; }
    .resampling-r0 { animation-delay: 0.00s; }
    .resampling-r1 { animation-delay: 0.45s; }
    .resampling-r2 { animation-delay: 0.90s; }
    .resampling-r3 { animation-delay: 1.35s; }
    .resampling-r4 { animation-delay: 1.80s; }
    .resampling-row { animation: resampling-reveal 7.3s ease-in-out infinite; }
    @keyframes resampling-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="resampling-bg" width="980" height="390"/>
  <text class="resampling-h1"  x="30" y="40">Two resampling directions</text>
  <text class="resampling-sub" x="30" y="64">Both have a cost.</text>
  <rect class="resampling-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="resampling-name" x="46" y="122">Undersampling</text>
  <text class="resampling-desc" x="46" y="142">Discard majority examples.</text>
  <text class="resampling-desc resampling-row resampling-r0" x="46" y="182">Removes data until classes balance</text>
  <text class="resampling-desc resampling-row resampling-r1" x="46" y="216">Trains faster on less data</text>
  <text class="resampling-desc resampling-row resampling-r2" x="46" y="250">Throws away real information</text>
  <text class="resampling-desc resampling-row resampling-r3" x="46" y="284">Risky when data is scarce</text>
  <text class="resampling-desc resampling-row resampling-r4" x="46" y="318">Reasonable on very large datasets</text>
  <rect class="resampling-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="resampling-name" x="526" y="122">Oversampling</text>
  <text class="resampling-desc" x="526" y="142">Duplicate or synthesise minority ones.</text>
  <text class="resampling-desc resampling-row resampling-r0" x="526" y="182">Repeats or interpolates rare examples</text>
  <text class="resampling-desc resampling-row resampling-r1" x="526" y="216">Keeps all the original data</text>
  <text class="resampling-desc resampling-row resampling-r2" x="526" y="250">Can memorise duplicated points</text>
  <text class="resampling-desc resampling-row resampling-r3" x="526" y="284">Synthetic points may be unrealistic</text>
  <text class="resampling-desc resampling-row resampling-r4" x="526" y="318">Must happen inside the split</text>
  <text class="resampling-sub" x="30" y="372">Neither creates information: undersampling removes it and oversampling repeats it, which is why reweighting is usually the better first move.</text>
</svg>
