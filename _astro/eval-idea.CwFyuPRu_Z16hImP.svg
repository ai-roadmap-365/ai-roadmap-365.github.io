<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Building your own evaluation</title>
  <style>
    .eval-idea-bg   { fill: #f8fafc; }
    .eval-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eval-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eval-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eval-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eval-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eval-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eval-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .eval-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .eval-idea-stage { opacity: 1; }

    .eval-idea-s0 { animation-delay: 0.00s; }
    .eval-idea-e0 { animation-delay: 0.00s; }
    .eval-idea-s1 { animation-delay: 1.28s; }
    .eval-idea-e1 { animation-delay: 1.28s; }
    .eval-idea-s2 { animation-delay: 2.56s; }
    .eval-idea-e2 { animation-delay: 2.56s; }
    .eval-idea-s3 { animation-delay: 3.84s; }
    .eval-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .eval-idea-conn  { animation: eval-idea-trace 6.4s ease-in-out infinite; }
      .eval-idea-stage { animation: eval-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes eval-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes eval-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .eval-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .eval-idea-stage { animation: eval-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes eval-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="eval-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="eval-idea-bg" width="980" height="322"/>
  <text class="eval-idea-h1"  x="30" y="40">Building your own evaluation</text>
  <text class="eval-idea-sub" x="30" y="64">Four steps.</text>
  <g class="eval-idea-stage eval-idea-s0">
    <rect class="eval-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="eval-idea-step" x="44" y="142">01</text>
    <text class="eval-idea-name" x="70" y="142">Collect real examples</text>
    <text class="eval-idea-desc" x="44" y="166">A hundred or two from actual</text>
    <text class="eval-idea-desc" x="44" y="182">use, not invented ones.</text>
  </g>
  <line class="eval-idea-line eval-idea-conn eval-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#eval-idea-tip)"/>
  <g class="eval-idea-stage eval-idea-s1">
    <rect class="eval-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="eval-idea-step" x="280" y="142">02</text>
    <text class="eval-idea-name" x="306" y="142">Define how a good answer is judged</text>
    <text class="eval-idea-desc" x="280" y="166">Precisely enough that two people</text>
    <text class="eval-idea-desc" x="280" y="182">would agree.</text>
  </g>
  <line class="eval-idea-line eval-idea-conn eval-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#eval-idea-tip)"/>
  <g class="eval-idea-stage eval-idea-s2">
    <rect class="eval-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="eval-idea-step" x="516" y="142">03</text>
    <text class="eval-idea-name" x="542" y="142">Run every candidate against them</text>
    <text class="eval-idea-desc" x="516" y="166">Same prompts, same parameters,</text>
    <text class="eval-idea-desc" x="516" y="182">several seeds.</text>
  </g>
  <line class="eval-idea-line eval-idea-conn eval-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#eval-idea-tip)"/>
  <g class="eval-idea-stage eval-idea-s3">
    <rect class="eval-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="eval-idea-step" x="752" y="142">04</text>
    <text class="eval-idea-name" x="778" y="142">And decide on the numbers</text>
    <text class="eval-idea-desc" x="752" y="166">With cost and latency alongside</text>
    <text class="eval-idea-desc" x="752" y="182">accuracy.</text>
    <text class="eval-idea-edge" x="752" y="242">the point</text>
  </g>
  <text class="eval-idea-sub" x="30" y="304">Writing down the grading criteria is the step teams skip and the one that does the most work, because a criterion two people disagree about cannot grade anything.</text>
</svg>
