<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Evidence, not just a verdict.">
  <title>A case file</title>
  <style>
    .case-file-bg   { fill: #f8fafc; }
    .case-file-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .case-file-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .case-file-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .case-file-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .case-file-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .case-file-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .case-file-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .case-file-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .case-file-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .case-file-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .case-file-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .case-file-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .case-file-row { opacity: 1; }
    .case-file-r0 { animation-delay: 0.00s; }
    .case-file-r1 { animation-delay: 0.45s; }
    .case-file-r2 { animation-delay: 0.90s; }
    .case-file-r3 { animation-delay: 1.35s; }
    .case-file-r4 { animation-delay: 1.80s; }
    .case-file-row { animation: case-file-reveal 7.3s ease-in-out infinite; }
    @keyframes case-file-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="case-file-bg" width="980" height="390"/>
  <text class="case-file-h1"  x="30" y="40">A case file</text>
  <text class="case-file-sub" x="30" y="64">Evidence, not just a verdict.</text>
  <rect class="case-file-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="case-file-name" x="46" y="122">A case file</text>
  <text class="case-file-desc" x="46" y="142">Assessable.</text>
  <text class="case-file-desc case-file-row case-file-r0" x="46" y="182">The question stated</text>
  <text class="case-file-desc case-file-row case-file-r1" x="46" y="216">Evidence, with its source</text>
  <text class="case-file-desc case-file-row case-file-r2" x="46" y="250">Reasoning shown</text>
  <text class="case-file-desc case-file-row case-file-r3" x="46" y="284">What remains uncertain</text>
  <text class="case-file-desc case-file-row case-file-r4" x="46" y="318">This is an analysis report</text>
  <rect class="case-file-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="case-file-name" x="526" y="122">A verdict alone</text>
  <text class="case-file-desc" x="526" y="142">Take it on trust.</text>
  <text class="case-file-desc case-file-row case-file-r0" x="526" y="182">Only the conclusion</text>
  <text class="case-file-desc case-file-row case-file-r1" x="526" y="216">No sources</text>
  <text class="case-file-desc case-file-row case-file-r2" x="526" y="250">No reasoning</text>
  <text class="case-file-desc case-file-row case-file-r3" x="526" y="284">Uncertainty unmentioned</text>
  <text class="case-file-desc case-file-row case-file-r4" x="526" y="318">This is an assertion</text>
  <text class="case-file-sub" x="30" y="372">Reasoning being shown is what lets a reader disagree productively, and a report that cannot be argued with cannot be improved either.</text>
</svg>
