<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By what they are sensitive to.">
  <title>Three ways to measure a shift</title>
  <style>
    .drift-metrics-bg   { fill: #f8fafc; }
    .drift-metrics-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drift-metrics-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drift-metrics-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drift-metrics-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drift-metrics-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drift-metrics-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .drift-metrics-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .drift-metrics-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .drift-metrics-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .drift-metrics-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .drift-metrics-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .drift-metrics-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .drift-metrics-row { opacity: 1; }
    .drift-metrics-r0 { animation-delay: 0.00s; }
    .drift-metrics-r1 { animation-delay: 0.45s; }
    .drift-metrics-r2 { animation-delay: 0.90s; }
    .drift-metrics-r3 { animation-delay: 1.35s; }
    .drift-metrics-r4 { animation-delay: 1.80s; }
    .drift-metrics-row { animation: drift-metrics-reveal 7.3s ease-in-out infinite; }
    @keyframes drift-metrics-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="drift-metrics-bg" width="980" height="390"/>
  <text class="drift-metrics-h1"  x="30" y="40">Three ways to measure a shift</text>
  <text class="drift-metrics-sub" x="30" y="64">By what they are sensitive to.</text>
  <rect class="drift-metrics-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="drift-metrics-name" x="46" y="122">The metric</text>
  <text class="drift-metrics-desc" x="46" y="142">What it measures.</text>
  <text class="drift-metrics-desc drift-metrics-row drift-metrics-r0" x="46" y="182">Stability index — binned proportion change</text>
  <text class="drift-metrics-desc drift-metrics-row drift-metrics-r1" x="46" y="216">Earth mover's distance — how far mass moved</text>
  <text class="drift-metrics-desc drift-metrics-row drift-metrics-r2" x="46" y="250">Jensen-Shannon — symmetric distributional divergence</text>
  <text class="drift-metrics-desc drift-metrics-row drift-metrics-r3" x="46" y="284">Test statistic — the largest cumulative gap</text>
  <text class="drift-metrics-desc drift-metrics-row drift-metrics-r4" x="46" y="318">Each on a different scale</text>
  <rect class="drift-metrics-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="drift-metrics-name" x="526" y="122">When it fits</text>
  <text class="drift-metrics-desc" x="526" y="142">And its catch.</text>
  <text class="drift-metrics-desc drift-metrics-row drift-metrics-r0" x="526" y="182">Familiar thresholds; binning is arbitrary</text>
  <text class="drift-metrics-desc drift-metrics-row drift-metrics-r1" x="526" y="216">Interpretable in the feature's own units</text>
  <text class="drift-metrics-desc drift-metrics-row drift-metrics-r2" x="526" y="250">Bounded and symmetric; less interpretable</text>
  <text class="drift-metrics-desc drift-metrics-row drift-metrics-r3" x="526" y="284">Sensitive to the middle, weak in the tails</text>
  <text class="drift-metrics-desc drift-metrics-row drift-metrics-r4" x="526" y="318">So set thresholds empirically, per feature</text>
  <text class="drift-metrics-sub" x="30" y="372">The earth mover's distance being expressed in the feature's own units is its practical advantage: a shift of two thousand in income means something a unitless score does not.</text>
</svg>
