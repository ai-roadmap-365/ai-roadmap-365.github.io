<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what a private one costs to build.">
  <title>A public inference endpoint</title>
  <style>
    .private-or-public-endpoint-bg   { fill: #f8fafc; }
    .private-or-public-endpoint-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .private-or-public-endpoint-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .private-or-public-endpoint-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .private-or-public-endpoint-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .private-or-public-endpoint-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .private-or-public-endpoint-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .private-or-public-endpoint-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .private-or-public-endpoint-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .private-or-public-endpoint-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .private-or-public-endpoint-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .private-or-public-endpoint-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .private-or-public-endpoint-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .private-or-public-endpoint-row { opacity: 1; }
    .private-or-public-endpoint-r0 { animation-delay: 0.00s; }
    .private-or-public-endpoint-r1 { animation-delay: 0.45s; }
    .private-or-public-endpoint-r2 { animation-delay: 0.90s; }
    .private-or-public-endpoint-r3 { animation-delay: 1.35s; }
    .private-or-public-endpoint-r4 { animation-delay: 1.80s; }
    .private-or-public-endpoint-row { animation: private-or-public-endpoint-reveal 7.3s ease-in-out infinite; }
    @keyframes private-or-public-endpoint-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="private-or-public-endpoint-bg" width="980" height="390"/>
  <text class="private-or-public-endpoint-h1"  x="30" y="40">A public inference endpoint</text>
  <text class="private-or-public-endpoint-sub" x="30" y="64">And what a private one costs to build.</text>
  <rect class="private-or-public-endpoint-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="private-or-public-endpoint-name" x="46" y="122">Public endpoint</text>
  <text class="private-or-public-endpoint-desc" x="46" y="142">Reachable by anyone.</text>
  <text class="private-or-public-endpoint-desc private-or-public-endpoint-row private-or-public-endpoint-r0" x="46" y="182">GPU nodes with public IP addresses</text>
  <text class="private-or-public-endpoint-desc private-or-public-endpoint-row private-or-public-endpoint-r1" x="46" y="216">Open to volumetric abuse</text>
  <text class="private-or-public-endpoint-desc private-or-public-endpoint-row private-or-public-endpoint-r2" x="46" y="250">Open to prompt fuzzing</text>
  <text class="private-or-public-endpoint-desc private-or-public-endpoint-row private-or-public-endpoint-r3" x="46" y="284">Every request costs you tokens</text>
  <text class="private-or-public-endpoint-desc private-or-public-endpoint-row private-or-public-endpoint-r4" x="46" y="318">No layer to rate limit at</text>
  <rect class="private-or-public-endpoint-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="private-or-public-endpoint-name" x="526" y="122">Private subnet</text>
  <text class="private-or-public-endpoint-desc" x="526" y="142">Reachable through one door.</text>
  <text class="private-or-public-endpoint-desc private-or-public-endpoint-row private-or-public-endpoint-r0" x="526" y="182">Inference nodes with no public IP</text>
  <text class="private-or-public-endpoint-desc private-or-public-endpoint-row private-or-public-endpoint-r1" x="526" y="216">Private Service Connect from the gateway</text>
  <text class="private-or-public-endpoint-desc private-or-public-endpoint-row private-or-public-endpoint-r2" x="526" y="250">A WAF screens all public ingress</text>
  <text class="private-or-public-endpoint-desc private-or-public-endpoint-row private-or-public-endpoint-r3" x="526" y="284">Rate limits and auth at the edge</text>
  <text class="private-or-public-endpoint-desc private-or-public-endpoint-row private-or-public-endpoint-r4" x="526" y="318">Token-depletion attacks stop at the door</text>
  <text class="private-or-public-endpoint-sub" x="30" y="372">Token depletion deserves naming as an attack: an endpoint that answers anybody is an endpoint anybody can bill you for, and it needs no vulnerability beyond being reachable.</text>
</svg>
