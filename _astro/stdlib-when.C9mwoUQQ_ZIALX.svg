<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to add a dependency</title>
  <style>
    .stdlib-when-bg   { fill: #f8fafc; }
    .stdlib-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stdlib-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stdlib-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stdlib-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stdlib-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stdlib-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stdlib-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stdlib-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stdlib-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stdlib-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stdlib-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stdlib-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stdlib-when-row { opacity: 1; }
    .stdlib-when-r0 { animation-delay: 0.00s; }
    .stdlib-when-r1 { animation-delay: 0.45s; }
    .stdlib-when-r2 { animation-delay: 0.90s; }
    .stdlib-when-r3 { animation-delay: 1.35s; }
    .stdlib-when-r4 { animation-delay: 1.80s; }
    .stdlib-when-row { animation: stdlib-when-reveal 7.3s ease-in-out infinite; }
    @keyframes stdlib-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="stdlib-when-bg" width="980" height="390"/>
  <text class="stdlib-when-h1"  x="30" y="40">When to add a dependency</text>
  <text class="stdlib-when-sub" x="30" y="64">And when not to.</text>
  <rect class="stdlib-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="stdlib-when-name" x="46" y="122">Add one</text>
  <text class="stdlib-when-desc" x="46" y="142">Four cases.</text>
  <text class="stdlib-when-desc stdlib-when-row stdlib-when-r0" x="46" y="182">Substantial, well-tested functionality</text>
  <text class="stdlib-when-desc stdlib-when-row stdlib-when-r1" x="46" y="216">Numerical, web or data work</text>
  <text class="stdlib-when-desc stdlib-when-row stdlib-when-r2" x="46" y="250">A protocol you should not implement yourself</text>
  <text class="stdlib-when-desc stdlib-when-row stdlib-when-r3" x="46" y="284">Widely used and actively maintained</text>
  <text class="stdlib-when-desc stdlib-when-row stdlib-when-r4" x="46" y="318">Where writing it would take weeks</text>
  <rect class="stdlib-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="stdlib-when-name" x="526" y="122">Use the library</text>
  <text class="stdlib-when-desc" x="526" y="142">Also four.</text>
  <text class="stdlib-when-desc stdlib-when-row stdlib-when-r0" x="526" y="182">Paths, dates, JSON and collections</text>
  <text class="stdlib-when-desc stdlib-when-row stdlib-when-r1" x="526" y="216">Anything a few dozen lines would do</text>
  <text class="stdlib-when-desc stdlib-when-row stdlib-when-r2" x="526" y="250">Where the dependency is unmaintained</text>
  <text class="stdlib-when-desc stdlib-when-row stdlib-when-r3" x="526" y="284">In constrained or air-gapped environments</text>
  <text class="stdlib-when-desc stdlib-when-row stdlib-when-r4" x="526" y="318">Where you have not checked first</text>
  <text class="stdlib-when-sub" x="30" y="372">Cryptography and protocol implementations belong firmly in the first column: writing them yourself is a security decision rather than an engineering one.</text>
</svg>
