<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="However much you add.">
  <title>A weighing scale with a limit</title>
  <style>
    .scales-bg   { fill: #f8fafc; }
    .scales-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scales-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scales-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scales-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scales-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scales-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scales-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scales-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scales-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scales-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scales-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scales-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scales-row { opacity: 1; }
    .scales-r0 { animation-delay: 0.00s; }
    .scales-r1 { animation-delay: 0.45s; }
    .scales-r2 { animation-delay: 0.90s; }
    .scales-r3 { animation-delay: 1.35s; }
    .scales-r4 { animation-delay: 1.80s; }
    .scales-row { animation: scales-reveal 7.3s ease-in-out infinite; }
    @keyframes scales-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="scales-bg" width="980" height="390"/>
  <text class="scales-h1"  x="30" y="40">A weighing scale with a limit</text>
  <text class="scales-sub" x="30" y="64">However much you add.</text>
  <rect class="scales-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="scales-name" x="46" y="122">The evidence added up</text>
  <text class="scales-desc" x="46" y="142">Unbounded.</text>
  <text class="scales-desc scales-row scales-r0" x="46" y="182">Each factor contributes its weight</text>
  <text class="scales-desc scales-row scales-r1" x="46" y="216">Positive and negative both</text>
  <text class="scales-desc scales-row scales-r2" x="46" y="250">No limit to the total</text>
  <text class="scales-desc scales-row scales-r3" x="46" y="284">Not a probability</text>
  <text class="scales-desc scales-row scales-r4" x="46" y="318">This is the linear part</text>
  <rect class="scales-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="scales-name" x="526" y="122">The reading given</text>
  <text class="scales-desc" x="526" y="142">Bounded.</text>
  <text class="scales-desc scales-row scales-r0" x="526" y="182">Compressed onto a fixed dial</text>
  <text class="scales-desc scales-row scales-r1" x="526" y="216">Extremes approach but never reach the ends</text>
  <text class="scales-desc scales-row scales-r2" x="526" y="250">More evidence moves it less near the edges</text>
  <text class="scales-desc scales-row scales-r3" x="526" y="284">Always a valid probability</text>
  <text class="scales-desc scales-row scales-r4" x="526" y="318">This is the sigmoid</text>
  <text class="scales-sub" x="30" y="372">Diminishing movement near the extremes is the behaviour that matters: strong evidence for an already-certain conclusion barely changes the output, which is correct.</text>
</svg>
