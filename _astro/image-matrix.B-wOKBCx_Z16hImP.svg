<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>An image is a matrix</title>
  <style>
    .image-matrix-bg   { fill: #f8fafc; }
    .image-matrix-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .image-matrix-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .image-matrix-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .image-matrix-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .image-matrix-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .image-matrix-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .image-matrix-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .image-matrix-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .image-matrix-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .image-matrix-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .image-matrix-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .image-matrix-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .image-matrix-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .image-matrix-stage { opacity: 1; }

    .image-matrix-s0 { animation-delay: 0.00s; }
    .image-matrix-e0 { animation-delay: 0.00s; }
    .image-matrix-s1 { animation-delay: 1.28s; }
    .image-matrix-e1 { animation-delay: 1.28s; }
    .image-matrix-s2 { animation-delay: 2.56s; }
    .image-matrix-e2 { animation-delay: 2.56s; }
    .image-matrix-s3 { animation-delay: 3.84s; }
    .image-matrix-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .image-matrix-conn  { animation: image-matrix-trace 6.4s ease-in-out infinite; }
      .image-matrix-stage { animation: image-matrix-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes image-matrix-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes image-matrix-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .image-matrix-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .image-matrix-stage { animation: image-matrix-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes image-matrix-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="image-matrix-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="image-matrix-bg" width="980" height="322"/>
  <text class="image-matrix-h1"  x="30" y="40">An image is a matrix</text>
  <text class="image-matrix-sub" x="30" y="64">Four steps.</text>
  <g class="image-matrix-stage image-matrix-s0">
    <rect class="image-matrix-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="image-matrix-step" x="44" y="142">01</text>
    <text class="image-matrix-name" x="70" y="142">An image is a grid of numbers</text>
    <text class="image-matrix-desc" x="44" y="166">Rows down, columns across.</text>
  </g>
  <line class="image-matrix-line image-matrix-conn image-matrix-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#image-matrix-tip)"/>
  <g class="image-matrix-stage image-matrix-s1">
    <rect class="image-matrix-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="image-matrix-step" x="280" y="142">02</text>
    <text class="image-matrix-name" x="306" y="142">Each pixel has a coordinate</text>
    <text class="image-matrix-desc" x="280" y="166">Which a matrix can transform.</text>
  </g>
  <line class="image-matrix-line image-matrix-conn image-matrix-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#image-matrix-tip)"/>
  <g class="image-matrix-stage image-matrix-s2">
    <rect class="image-matrix-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="image-matrix-step" x="516" y="142">03</text>
    <text class="image-matrix-name" x="542" y="142">So rotating an image is a matrix applied to coordinates</text>
    <text class="image-matrix-desc" x="516" y="166">Not to the pixel values.</text>
  </g>
  <line class="image-matrix-line image-matrix-conn image-matrix-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#image-matrix-tip)"/>
  <g class="image-matrix-stage image-matrix-s3">
    <rect class="image-matrix-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="image-matrix-step" x="752" y="142">04</text>
    <text class="image-matrix-name" x="778" y="142">Then the values are resampled onto the new grid</text>
    <text class="image-matrix-desc" x="752" y="166">Which is where interpolation</text>
    <text class="image-matrix-desc" x="752" y="182">enters.</text>
    <text class="image-matrix-edge" x="752" y="242">two steps</text>
  </g>
  <text class="image-matrix-sub" x="30" y="304">Transforming coordinates rather than pixels is the shift that makes everything else follow, and it is the mistake beginners most often make in reverse.</text>
</svg>
