<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Which is why it is tiered.">
  <title>Evaluation costs money</title>
  <style>
    .eval-cost-bg   { fill: #f8fafc; }
    .eval-cost-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-cost-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-cost-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-cost-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-cost-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-cost-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eval-cost-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eval-cost-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eval-cost-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eval-cost-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eval-cost-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eval-cost-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eval-cost-row { opacity: 1; }
    .eval-cost-r0 { animation-delay: 0.00s; }
    .eval-cost-r1 { animation-delay: 0.45s; }
    .eval-cost-r2 { animation-delay: 0.90s; }
    .eval-cost-r3 { animation-delay: 1.35s; }
    .eval-cost-r4 { animation-delay: 1.80s; }
    .eval-cost-row { animation: eval-cost-reveal 7.3s ease-in-out infinite; }
    @keyframes eval-cost-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="eval-cost-bg" width="980" height="390"/>
  <text class="eval-cost-h1"  x="30" y="40">Evaluation costs money</text>
  <text class="eval-cost-sub" x="30" y="64">Which is why it is tiered.</text>
  <rect class="eval-cost-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="eval-cost-name" x="46" y="122">Tiered</text>
  <text class="eval-cost-desc" x="46" y="142">Cost matched to cadence.</text>
  <text class="eval-cost-desc eval-cost-row eval-cost-r0" x="46" y="182">Deterministic checks on every commit</text>
  <text class="eval-cost-desc eval-cost-row eval-cost-r1" x="46" y="216">Near-free, and instant</text>
  <text class="eval-cost-desc eval-cost-row eval-cost-r2" x="46" y="250">Full judged suite nightly</text>
  <text class="eval-cost-desc eval-cost-row eval-cost-r3" x="46" y="284">Or on staging pull requests</text>
  <text class="eval-cost-desc eval-cost-row eval-cost-r4" x="46" y="318">Regressions still caught before release</text>
  <rect class="eval-cost-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="eval-cost-name" x="526" y="122">Everything, always</text>
  <text class="eval-cost-desc" x="526" y="142">$50 a pull request.</text>
  <text class="eval-cost-desc eval-cost-row eval-cost-r0" x="526" y="182">1,000 judged evaluations per commit</text>
  <text class="eval-cost-desc eval-cost-row eval-cost-r1" x="526" y="216">On a frontier model</text>
  <text class="eval-cost-desc eval-cost-row eval-cost-r2" x="526" y="250">The cost becomes the argument against evals</text>
  <text class="eval-cost-desc eval-cost-row eval-cost-r3" x="526" y="284">And the suite gets disabled</text>
  <text class="eval-cost-desc eval-cost-row eval-cost-r4" x="526" y="318">Which is the worst outcome</text>
  <text class="eval-cost-sub" x="30" y="372">Dataset contamination is the other cost worth guarding: examples that leak into a prompt or a fine-tune stop measuring generalisation and start measuring memorisation.</text>
</svg>
