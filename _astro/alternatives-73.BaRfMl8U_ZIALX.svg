<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Each with a trade.">
  <title>Four development orders</title>
  <style>
    .alternatives-73-bg   { fill: #f8fafc; }
    .alternatives-73-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .alternatives-73-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .alternatives-73-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .alternatives-73-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .alternatives-73-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .alternatives-73-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .alternatives-73-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .alternatives-73-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .alternatives-73-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .alternatives-73-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .alternatives-73-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .alternatives-73-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .alternatives-73-row { opacity: 1; }
    .alternatives-73-r0 { animation-delay: 0.00s; }
    .alternatives-73-r1 { animation-delay: 0.45s; }
    .alternatives-73-r2 { animation-delay: 0.90s; }
    .alternatives-73-r3 { animation-delay: 1.35s; }
    .alternatives-73-r4 { animation-delay: 1.80s; }
    .alternatives-73-row { animation: alternatives-73-reveal 7.3s ease-in-out infinite; }
    @keyframes alternatives-73-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="alternatives-73-bg" width="980" height="390"/>
  <text class="alternatives-73-h1"  x="30" y="40">Four development orders</text>
  <text class="alternatives-73-sub" x="30" y="64">Each with a trade.</text>
  <rect class="alternatives-73-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="alternatives-73-name" x="46" y="122">The ordering</text>
  <text class="alternatives-73-desc" x="46" y="142">When tests are written.</text>
  <text class="alternatives-73-desc alternatives-73-row alternatives-73-r0" x="46" y="182">Test first, then implement</text>
  <text class="alternatives-73-desc alternatives-73-row alternatives-73-r1" x="46" y="216">Implement, then test</text>
  <text class="alternatives-73-desc alternatives-73-row alternatives-73-r2" x="46" y="250">Behaviour specified in plain language first</text>
  <text class="alternatives-73-desc alternatives-73-row alternatives-73-r3" x="46" y="284">Properties asserted, inputs generated</text>
  <text class="alternatives-73-desc alternatives-73-row alternatives-73-r4" x="46" y="318">Types first, then implementation</text>
  <rect class="alternatives-73-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="alternatives-73-name" x="526" y="122">The trade</text>
  <text class="alternatives-73-desc" x="526" y="142">What it buys and costs.</text>
  <text class="alternatives-73-desc alternatives-73-row alternatives-73-r0" x="526" y="182">Design pressure; slower to start</text>
  <text class="alternatives-73-desc alternatives-73-row alternatives-73-r1" x="526" y="216">Faster to start; tests fit the code written</text>
  <text class="alternatives-73-desc alternatives-73-row alternatives-73-r2" x="526" y="250">Shared vocabulary; heavier tooling</text>
  <text class="alternatives-73-desc alternatives-73-row alternatives-73-r3" x="526" y="284">Finds cases nobody imagined; harder to write</text>
  <text class="alternatives-73-desc alternatives-73-row alternatives-73-r4" x="526" y="318">Catches whole error classes; no behavioural check</text>
  <text class="alternatives-73-sub" x="30" y="372">Tests written after the code tend to test what was built rather than what was wanted, which is the subtle cost of the second row.</text>
</svg>
