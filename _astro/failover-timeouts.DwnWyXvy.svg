<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Time to first token is the trigger.">
  <title>Timing out fast enough to fail over</title>
  <style>
    .failover-timeouts-bg   { fill: #f8fafc; }
    .failover-timeouts-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .failover-timeouts-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .failover-timeouts-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .failover-timeouts-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .failover-timeouts-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .failover-timeouts-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .failover-timeouts-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .failover-timeouts-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .failover-timeouts-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .failover-timeouts-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .failover-timeouts-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .failover-timeouts-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .failover-timeouts-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .failover-timeouts-stage { opacity: 1; }

    .failover-timeouts-s0 { animation-delay: 0.00s; }
    .failover-timeouts-e0 { animation-delay: 0.00s; }
    .failover-timeouts-s1 { animation-delay: 1.50s; }
    .failover-timeouts-e1 { animation-delay: 1.50s; }
    .failover-timeouts-s2 { animation-delay: 3.00s; }
    .failover-timeouts-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .failover-timeouts-conn  { animation: failover-timeouts-trace 6s ease-in-out infinite; }
      .failover-timeouts-stage { animation: failover-timeouts-arrive 6s ease-in-out infinite; }
    }
    @keyframes failover-timeouts-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes failover-timeouts-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .failover-timeouts-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .failover-timeouts-stage { animation: failover-timeouts-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes failover-timeouts-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="failover-timeouts-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="failover-timeouts-bg" width="980" height="322"/>
  <text class="failover-timeouts-h1"  x="30" y="40">Timing out fast enough to fail over</text>
  <text class="failover-timeouts-sub" x="30" y="64">Time to first token is the trigger.</text>
  <g class="failover-timeouts-stage failover-timeouts-s0">
    <rect class="failover-timeouts-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="failover-timeouts-step" x="44" y="142">01</text>
    <text class="failover-timeouts-name" x="70" y="142">Set a TTFT deadline</text>
    <text class="failover-timeouts-desc" x="44" y="166">About two seconds. Not a thirty-second</text>
    <text class="failover-timeouts-desc" x="44" y="182">request timeout.</text>
    <text class="failover-timeouts-edge" x="44" y="242">2,000 ms</text>
  </g>
  <line class="failover-timeouts-line failover-timeouts-conn failover-timeouts-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#failover-timeouts-tip)"/>
  <g class="failover-timeouts-stage failover-timeouts-s1">
    <rect class="failover-timeouts-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="failover-timeouts-step" x="359" y="142">02</text>
    <text class="failover-timeouts-name" x="385" y="142">Abort on breach</text>
    <text class="failover-timeouts-desc" x="359" y="166">The primary has not started. It is unlikely</text>
    <text class="failover-timeouts-desc" x="359" y="182">to finish well.</text>
  </g>
  <line class="failover-timeouts-line failover-timeouts-conn failover-timeouts-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#failover-timeouts-tip)"/>
  <g class="failover-timeouts-stage failover-timeouts-s2">
    <rect class="failover-timeouts-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="failover-timeouts-step" x="674" y="142">03</text>
    <text class="failover-timeouts-name" x="700" y="142">Dispatch to the secondary</text>
    <text class="failover-timeouts-desc" x="674" y="166">The user waits two seconds longer, not</text>
    <text class="failover-timeouts-desc" x="674" y="182">thirty.</text>
  </g>
  <text class="failover-timeouts-sub" x="30" y="304">Using the default request timeout for failover means a degraded provider produces a thirty-second wait followed by a retry, which is worse for the user than no failover at all.</text>
</svg>
