<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And where not to.">
  <title>Where to validate</title>
  <style>
    .validation-when-bg   { fill: #f8fafc; }
    .validation-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validation-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validation-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validation-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validation-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validation-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .validation-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .validation-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .validation-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .validation-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .validation-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .validation-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .validation-when-row { opacity: 1; }
    .validation-when-r0 { animation-delay: 0.00s; }
    .validation-when-r1 { animation-delay: 0.45s; }
    .validation-when-r2 { animation-delay: 0.90s; }
    .validation-when-r3 { animation-delay: 1.35s; }
    .validation-when-r4 { animation-delay: 1.80s; }
    .validation-when-row { animation: validation-when-reveal 7.3s ease-in-out infinite; }
    @keyframes validation-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="validation-when-bg" width="980" height="390"/>
  <text class="validation-when-h1"  x="30" y="40">Where to validate</text>
  <text class="validation-when-sub" x="30" y="64">And where not to.</text>
  <rect class="validation-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="validation-when-name" x="46" y="122">Validate</text>
  <text class="validation-when-desc" x="46" y="142">Four places.</text>
  <text class="validation-when-desc validation-when-row validation-when-r0" x="46" y="182">Request and response bodies</text>
  <text class="validation-when-desc validation-when-row validation-when-r1" x="46" y="216">Configuration at startup</text>
  <text class="validation-when-desc validation-when-row validation-when-r2" x="46" y="250">Files and records being imported</text>
  <text class="validation-when-desc validation-when-row validation-when-r3" x="46" y="284">Responses from external services</text>
  <text class="validation-when-desc validation-when-row validation-when-r4" x="46" y="318">Any boundary with the outside</text>
  <rect class="validation-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="validation-when-name" x="526" y="122">Do not</text>
  <text class="validation-when-desc" x="526" y="142">Also four.</text>
  <text class="validation-when-desc validation-when-row validation-when-r0" x="526" y="182">Between internal functions</text>
  <text class="validation-when-desc validation-when-row validation-when-r1" x="526" y="216">Inside a hot loop</text>
  <text class="validation-when-desc validation-when-row validation-when-r2" x="526" y="250">Where the database already enforces it</text>
  <text class="validation-when-desc validation-when-row validation-when-r3" x="526" y="284">On data you just constructed</text>
  <text class="validation-when-desc validation-when-row validation-when-r4" x="526" y="318">Repeatedly, on the same values</text>
  <text class="validation-when-sub" x="30" y="372">Validating responses from external services is the one most often skipped, and an interface that changes its response shape will otherwise fail somewhere confusing.</text>
</svg>
