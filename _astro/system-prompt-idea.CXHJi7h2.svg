<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four jobs at once.">
  <title>What a system prompt does</title>
  <style>
    .system-prompt-idea-bg   { fill: #f8fafc; }
    .system-prompt-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .system-prompt-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .system-prompt-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .system-prompt-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .system-prompt-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .system-prompt-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .system-prompt-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .system-prompt-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .system-prompt-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .system-prompt-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .system-prompt-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .system-prompt-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .system-prompt-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .system-prompt-idea-stage { opacity: 1; }

    .system-prompt-idea-s0 { animation-delay: 0.00s; }
    .system-prompt-idea-e0 { animation-delay: 0.00s; }
    .system-prompt-idea-s1 { animation-delay: 1.28s; }
    .system-prompt-idea-e1 { animation-delay: 1.28s; }
    .system-prompt-idea-s2 { animation-delay: 2.56s; }
    .system-prompt-idea-e2 { animation-delay: 2.56s; }
    .system-prompt-idea-s3 { animation-delay: 3.84s; }
    .system-prompt-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .system-prompt-idea-conn  { animation: system-prompt-idea-trace 6.4s ease-in-out infinite; }
      .system-prompt-idea-stage { animation: system-prompt-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes system-prompt-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes system-prompt-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .system-prompt-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .system-prompt-idea-stage { animation: system-prompt-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes system-prompt-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="system-prompt-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="system-prompt-idea-bg" width="980" height="322"/>
  <text class="system-prompt-idea-h1"  x="30" y="40">What a system prompt does</text>
  <text class="system-prompt-idea-sub" x="30" y="64">Four jobs at once.</text>
  <g class="system-prompt-idea-stage system-prompt-idea-s0">
    <rect class="system-prompt-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="system-prompt-idea-step" x="44" y="142">01</text>
    <text class="system-prompt-idea-name" x="70" y="142">Sets the behaviour</text>
    <text class="system-prompt-idea-desc" x="44" y="166">Tone, level of detail, how much</text>
    <text class="system-prompt-idea-desc" x="44" y="182">to ask before answering.</text>
  </g>
  <line class="system-prompt-idea-line system-prompt-idea-conn system-prompt-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#system-prompt-idea-tip)"/>
  <g class="system-prompt-idea-stage system-prompt-idea-s1">
    <rect class="system-prompt-idea-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="system-prompt-idea-step" x="280" y="142">02</text>
    <text class="system-prompt-idea-name" x="306" y="142">Sets the boundaries</text>
    <text class="system-prompt-idea-desc" x="280" y="166">What is out of scope, and how to</text>
    <text class="system-prompt-idea-desc" x="280" y="182">decline it.</text>
  </g>
  <line class="system-prompt-idea-line system-prompt-idea-conn system-prompt-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#system-prompt-idea-tip)"/>
  <g class="system-prompt-idea-stage system-prompt-idea-s2">
    <rect class="system-prompt-idea-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="system-prompt-idea-step" x="516" y="142">03</text>
    <text class="system-prompt-idea-name" x="542" y="142">Supplies persistent context</text>
    <text class="system-prompt-idea-desc" x="516" y="166">Who the user is, what the</text>
    <text class="system-prompt-idea-desc" x="516" y="182">product does.</text>
  </g>
  <line class="system-prompt-idea-line system-prompt-idea-conn system-prompt-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#system-prompt-idea-tip)"/>
  <g class="system-prompt-idea-stage system-prompt-idea-s3">
    <rect class="system-prompt-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="system-prompt-idea-step" x="752" y="142">04</text>
    <text class="system-prompt-idea-name" x="778" y="142">And fixes the output shape</text>
    <text class="system-prompt-idea-desc" x="752" y="166">So the surrounding code can rely</text>
    <text class="system-prompt-idea-desc" x="752" y="182">on it.</text>
    <text class="system-prompt-idea-edge" x="752" y="242">every request</text>
  </g>
  <text class="system-prompt-idea-sub" x="30" y="304">It is the most frequently read text in the entire application and the one least often reviewed, which is a mismatch worth correcting deliberately.</text>
</svg>
