<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" font-family="system-ui, sans-serif">
  <title>Two edits to the same line become a conflict, then get resolved and committed</title>
  <rect x="0" y="0" width="760" height="500" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Resolving a merge conflict</text>

  <!-- Step 1: two competing edits -->
  <rect x="40" y="64" width="320" height="86" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="200" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">main edits line 3</text>
  <text x="200" y="112" text-anchor="middle" font-size="14" fill="#1a202c">milk: 1 cup buttermilk</text>
  <text x="200" y="134" text-anchor="middle" font-size="13" fill="#1a202c">(current branch, "ours")</text>

  <rect x="400" y="64" width="320" height="86" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="560" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">feature edits line 3</text>
  <text x="560" y="112" text-anchor="middle" font-size="14" fill="#1a202c">milk: 2 cups</text>
  <text x="560" y="134" text-anchor="middle" font-size="13" fill="#1a202c">(branch being merged, "theirs")</text>

  <!-- arrows down to conflict -->
  <line x1="200" y1="150" x2="330" y2="188" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="336,192 321,189 327,178" fill="#1d4ed8"/>
  <line x1="560" y1="150" x2="430" y2="188" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="424,192 433,178 439,189" fill="#1d4ed8"/>

  <!-- Step 2: git merge -> conflict markers -->
  <rect x="150" y="196" width="460" height="150" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">git merge &#8594; CONFLICT: git writes markers</text>
  <text x="170" y="248" text-anchor="start" font-size="14" fill="#1a202c">&#60;&#60;&#60;&#60;&#60;&#60;&#60; HEAD</text>
  <text x="170" y="270" text-anchor="start" font-size="14" fill="#1a202c">milk: 1 cup buttermilk</text>
  <text x="170" y="292" text-anchor="start" font-size="14" fill="#1a202c">=======</text>
  <text x="170" y="314" text-anchor="start" font-size="14" fill="#1a202c">milk: 2 cups</text>
  <text x="170" y="336" text-anchor="start" font-size="14" fill="#1a202c">&#62;&#62;&#62;&#62;&#62;&#62;&#62; feature</text>

  <!-- arrow down to resolve -->
  <line x1="380" y1="346" x2="380" y2="384" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="380,392 373,377 387,377" fill="#1d4ed8"/>
  <text x="470" y="372" text-anchor="start" font-size="13" fill="#1d4ed8">you edit: delete the 3 markers</text>

  <!-- Step 3: resolved -->
  <rect x="150" y="394" width="460" height="52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="416" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Resolved: milk: 2 cups buttermilk</text>
  <text x="380" y="436" text-anchor="middle" font-size="13" fill="#1a202c">no markers remain</text>

  <!-- arrow to commit -->
  <line x1="610" y1="420" x2="660" y2="420" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="668,420 653,413 653,427" fill="#1d4ed8"/>

  <!-- Step 4: commit -->
  <rect x="40" y="458" width="680" height="34" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="480" text-anchor="middle" font-size="14" fill="#1a202c">git add recipe.txt  &#8594;  git commit  &#8594;  the merge commit is created</text>
</svg>
