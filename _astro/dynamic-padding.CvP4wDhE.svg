<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Not to a global maximum.">
  <title>Padding per batch</title>
  <style>
    .dynamic-padding-bg   { fill: #f8fafc; }
    .dynamic-padding-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dynamic-padding-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dynamic-padding-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dynamic-padding-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dynamic-padding-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dynamic-padding-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dynamic-padding-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dynamic-padding-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dynamic-padding-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dynamic-padding-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dynamic-padding-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dynamic-padding-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .dynamic-padding-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .dynamic-padding-stage { opacity: 1; }

    .dynamic-padding-s0 { animation-delay: 0.00s; }
    .dynamic-padding-e0 { animation-delay: 0.00s; }
    .dynamic-padding-s1 { animation-delay: 1.50s; }
    .dynamic-padding-e1 { animation-delay: 1.50s; }
    .dynamic-padding-s2 { animation-delay: 3.00s; }
    .dynamic-padding-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .dynamic-padding-conn  { animation: dynamic-padding-trace 6s ease-in-out infinite; }
      .dynamic-padding-stage { animation: dynamic-padding-arrive 6s ease-in-out infinite; }
    }
    @keyframes dynamic-padding-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes dynamic-padding-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .dynamic-padding-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .dynamic-padding-stage { animation: dynamic-padding-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes dynamic-padding-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="dynamic-padding-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="dynamic-padding-bg" width="980" height="322"/>
  <text class="dynamic-padding-h1"  x="30" y="40">Padding per batch</text>
  <text class="dynamic-padding-sub" x="30" y="64">Not to a global maximum.</text>
  <g class="dynamic-padding-stage dynamic-padding-s0">
    <rect class="dynamic-padding-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="dynamic-padding-step" x="44" y="142">01</text>
    <text class="dynamic-padding-name" x="70" y="142">Padding to a global maximum wastes most of the compute</text>
    <text class="dynamic-padding-desc" x="44" y="166">Short texts padded to the length of the</text>
    <text class="dynamic-padding-desc" x="44" y="182">longest document.</text>
  </g>
  <line class="dynamic-padding-line dynamic-padding-conn dynamic-padding-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#dynamic-padding-tip)"/>
  <g class="dynamic-padding-stage dynamic-padding-s1">
    <rect class="dynamic-padding-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="dynamic-padding-step" x="359" y="142">02</text>
    <text class="dynamic-padding-name" x="385" y="142">Pad to the longest in this batch</text>
    <text class="dynamic-padding-desc" x="359" y="166">Which is usually far shorter.</text>
  </g>
  <line class="dynamic-padding-line dynamic-padding-conn dynamic-padding-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#dynamic-padding-tip)"/>
  <g class="dynamic-padding-stage dynamic-padding-s2">
    <rect class="dynamic-padding-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="dynamic-padding-step" x="674" y="142">03</text>
    <text class="dynamic-padding-name" x="700" y="142">Bucket by length to do better still</text>
    <text class="dynamic-padding-desc" x="674" y="166">Group similar lengths together so batches are</text>
    <text class="dynamic-padding-desc" x="674" y="182">uniform.</text>
  </g>
  <text class="dynamic-padding-sub" x="30" y="304">Length bucketing is a substantial saving on corpora with a wide length distribution, and it costs only a sort: batches of similar-length texts waste almost nothing on padding.</text>
</svg>
