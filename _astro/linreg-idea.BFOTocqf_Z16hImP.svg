<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Linear regression</title>
  <style>
    .linreg-idea-bg   { fill: #f8fafc; }
    .linreg-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linreg-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linreg-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linreg-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linreg-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linreg-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .linreg-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .linreg-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .linreg-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .linreg-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .linreg-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .linreg-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .linreg-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .linreg-idea-stage { opacity: 1; }

    .linreg-idea-s0 { animation-delay: 0.00s; }
    .linreg-idea-e0 { animation-delay: 0.00s; }
    .linreg-idea-s1 { animation-delay: 1.28s; }
    .linreg-idea-e1 { animation-delay: 1.28s; }
    .linreg-idea-s2 { animation-delay: 2.56s; }
    .linreg-idea-e2 { animation-delay: 2.56s; }
    .linreg-idea-s3 { animation-delay: 3.84s; }
    .linreg-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .linreg-idea-conn  { animation: linreg-idea-trace 6.4s ease-in-out infinite; }
      .linreg-idea-stage { animation: linreg-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes linreg-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes linreg-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .linreg-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .linreg-idea-stage { animation: linreg-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes linreg-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="linreg-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="linreg-idea-bg" width="980" height="322"/>
  <text class="linreg-idea-h1"  x="30" y="40">Linear regression</text>
  <text class="linreg-idea-sub" x="30" y="64">Four steps.</text>
  <g class="linreg-idea-stage linreg-idea-s0">
    <rect class="linreg-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="linreg-idea-step" x="44" y="142">01</text>
    <text class="linreg-idea-name" x="70" y="142">Propose a straight-line relationship</text>
    <text class="linreg-idea-desc" x="44" y="166">Output as a weighted sum of</text>
    <text class="linreg-idea-desc" x="44" y="182">inputs, plus a constant.</text>
  </g>
  <line class="linreg-idea-line linreg-idea-conn linreg-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#linreg-idea-tip)"/>
  <g class="linreg-idea-stage linreg-idea-s1">
    <rect class="linreg-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="linreg-idea-step" x="280" y="142">02</text>
    <text class="linreg-idea-name" x="306" y="142">Score candidates by squared error</text>
    <text class="linreg-idea-desc" x="280" y="166">Which is a choice, examined</text>
    <text class="linreg-idea-desc" x="280" y="182">tomorrow.</text>
  </g>
  <line class="linreg-idea-line linreg-idea-conn linreg-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#linreg-idea-tip)"/>
  <g class="linreg-idea-stage linreg-idea-s2">
    <rect class="linreg-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="linreg-idea-step" x="516" y="142">03</text>
    <text class="linreg-idea-name" x="542" y="142">Solve for the best one directly</text>
    <text class="linreg-idea-desc" x="516" y="166">A closed form, with no iteration</text>
    <text class="linreg-idea-desc" x="516" y="182">needed.</text>
  </g>
  <line class="linreg-idea-line linreg-idea-conn linreg-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#linreg-idea-tip)"/>
  <g class="linreg-idea-stage linreg-idea-s3">
    <rect class="linreg-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="linreg-idea-step" x="752" y="142">04</text>
    <text class="linreg-idea-name" x="778" y="142">And read the coefficients as effects</text>
    <text class="linreg-idea-desc" x="752" y="166">Per unit, holding the others</text>
    <text class="linreg-idea-desc" x="752" y="182">fixed.</text>
    <text class="linreg-idea-edge" x="752" y="242">if assumptions hold</text>
  </g>
  <text class="linreg-idea-sub" x="30" y="304">The final qualifier carries all the weight: the coefficients are interpretable exactly to the extent the assumptions hold, which is what the diagnostics check.</text>
</svg>
