<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Everything derives from four cells</title>
  <style>
    .confusion-foundation-bg   { fill: #f8fafc; }
    .confusion-foundation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .confusion-foundation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .confusion-foundation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .confusion-foundation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .confusion-foundation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .confusion-foundation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .confusion-foundation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .confusion-foundation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .confusion-foundation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .confusion-foundation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .confusion-foundation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .confusion-foundation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .confusion-foundation-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .confusion-foundation-stage { opacity: 1; }

    .confusion-foundation-s0 { animation-delay: 0.00s; }
    .confusion-foundation-e0 { animation-delay: 0.00s; }
    .confusion-foundation-s1 { animation-delay: 1.28s; }
    .confusion-foundation-e1 { animation-delay: 1.28s; }
    .confusion-foundation-s2 { animation-delay: 2.56s; }
    .confusion-foundation-e2 { animation-delay: 2.56s; }
    .confusion-foundation-s3 { animation-delay: 3.84s; }
    .confusion-foundation-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .confusion-foundation-conn  { animation: confusion-foundation-trace 6.4s ease-in-out infinite; }
      .confusion-foundation-stage { animation: confusion-foundation-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes confusion-foundation-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes confusion-foundation-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .confusion-foundation-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .confusion-foundation-stage { animation: confusion-foundation-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes confusion-foundation-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="confusion-foundation-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="confusion-foundation-bg" width="980" height="322"/>
  <text class="confusion-foundation-h1"  x="30" y="40">Everything derives from four cells</text>
  <text class="confusion-foundation-sub" x="30" y="64">Four steps.</text>
  <g class="confusion-foundation-stage confusion-foundation-s0">
    <rect class="confusion-foundation-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="confusion-foundation-step" x="44" y="142">01</text>
    <text class="confusion-foundation-name" x="70" y="142">Four counts describe every binary classifier completely</text>
    <text class="confusion-foundation-desc" x="44" y="166">At one threshold.</text>
  </g>
  <line class="confusion-foundation-line confusion-foundation-conn confusion-foundation-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#confusion-foundation-tip)"/>
  <g class="confusion-foundation-stage confusion-foundation-s1">
    <rect class="confusion-foundation-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="confusion-foundation-step" x="280" y="142">02</text>
    <text class="confusion-foundation-name" x="306" y="142">Ratios along the predicted rows give precision</text>
    <text class="confusion-foundation-desc" x="280" y="166">Of what was flagged, how much</text>
    <text class="confusion-foundation-desc" x="280" y="182">was right.</text>
  </g>
  <line class="confusion-foundation-line confusion-foundation-conn confusion-foundation-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#confusion-foundation-tip)"/>
  <g class="confusion-foundation-stage confusion-foundation-s2">
    <rect class="confusion-foundation-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="confusion-foundation-step" x="516" y="142">03</text>
    <text class="confusion-foundation-name" x="542" y="142">Ratios along the actual columns give recall</text>
    <text class="confusion-foundation-desc" x="516" y="166">Of what mattered, how much was</text>
    <text class="confusion-foundation-desc" x="516" y="182">found.</text>
  </g>
  <line class="confusion-foundation-line confusion-foundation-conn confusion-foundation-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#confusion-foundation-tip)"/>
  <g class="confusion-foundation-stage confusion-foundation-s3">
    <rect class="confusion-foundation-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="confusion-foundation-step" x="752" y="142">04</text>
    <text class="confusion-foundation-name" x="778" y="142">And combinations give every other metric</text>
    <text class="confusion-foundation-desc" x="752" y="166">None of which adds information</text>
    <text class="confusion-foundation-desc" x="752" y="182">the matrix lacks.</text>
  </g>
  <text class="confusion-foundation-sub" x="30" y="304">Since no scalar adds information the matrix does not already contain, reporting the matrix alongside any score costs nothing and prevents most misreadings.</text>
</svg>
