<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By what you are building.">
  <title>Which construct when</title>
  <style>
    .comprehension-when-bg   { fill: #f8fafc; }
    .comprehension-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .comprehension-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .comprehension-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .comprehension-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .comprehension-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .comprehension-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .comprehension-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .comprehension-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .comprehension-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .comprehension-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .comprehension-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .comprehension-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .comprehension-when-row { opacity: 1; }
    .comprehension-when-r0 { animation-delay: 0.00s; }
    .comprehension-when-r1 { animation-delay: 0.45s; }
    .comprehension-when-r2 { animation-delay: 0.90s; }
    .comprehension-when-r3 { animation-delay: 1.35s; }
    .comprehension-when-r4 { animation-delay: 1.80s; }
    .comprehension-when-row { animation: comprehension-when-reveal 7.3s ease-in-out infinite; }
    @keyframes comprehension-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="comprehension-when-bg" width="980" height="390"/>
  <text class="comprehension-when-h1"  x="30" y="40">Which construct when</text>
  <text class="comprehension-when-sub" x="30" y="64">By what you are building.</text>
  <rect class="comprehension-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="comprehension-when-name" x="46" y="122">The situation</text>
  <text class="comprehension-when-desc" x="46" y="142">What you need.</text>
  <text class="comprehension-when-desc comprehension-when-row comprehension-when-r0" x="46" y="182">Build a list from a transform or filter</text>
  <text class="comprehension-when-desc comprehension-when-row comprehension-when-r1" x="46" y="216">Process something larger than memory</text>
  <text class="comprehension-when-desc comprehension-when-row comprehension-when-r2" x="46" y="250">Stop at the first match</text>
  <text class="comprehension-when-desc comprehension-when-row comprehension-when-r3" x="46" y="284">Perform side effects per item</text>
  <text class="comprehension-when-desc comprehension-when-row comprehension-when-r4" x="46" y="318">Complex multi-step logic per item</text>
  <rect class="comprehension-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="comprehension-when-name" x="526" y="122">The construct</text>
  <text class="comprehension-when-desc" x="526" y="142">What to write.</text>
  <text class="comprehension-when-desc comprehension-when-row comprehension-when-r0" x="526" y="182">A list comprehension</text>
  <text class="comprehension-when-desc comprehension-when-row comprehension-when-r1" x="526" y="216">A generator expression</text>
  <text class="comprehension-when-desc comprehension-when-row comprehension-when-r2" x="526" y="250">A generator, and break</text>
  <text class="comprehension-when-desc comprehension-when-row comprehension-when-r3" x="526" y="284">An explicit loop</text>
  <text class="comprehension-when-desc comprehension-when-row comprehension-when-r4" x="526" y="318">An explicit loop, or a named function</text>
  <text class="comprehension-when-sub" x="30" y="372">The last two rows are the cases where a loop is genuinely clearer, and choosing it deliberately is better than forcing a comprehension that needs a comment.</text>
</svg>
