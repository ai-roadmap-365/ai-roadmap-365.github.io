<svg role="img" aria-label="Diagram of rolling expanding window cross validation for temporal forecasting showing sequential train splits and non overlapping test horizons" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Temporal Cross-Validation: Rolling Expanding Window</title>
  <defs>
    <linearGradient id="bg192b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="windowCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg192b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">TEMPORAL CROSS-VALIDATION: EXPANDING WINDOW SPLITS</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Never Shuffle Temporal Data: Train Strictly on Past -> Forecast Strictly on Future</text>
  <g transform="translate(50, 85)">
    <rect width="750" height="295" fill="url(#windowCard)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Fold 1 -->
    <text x="60" y="55" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="700">Split 1</text>
    <rect x="130" y="40" width="200" height="24" fill="#3b82f6" rx="3"/>
    <text x="230" y="56" fill="#ffffff" font-family="system-ui" font-size="9" text-anchor="middle">Train (T1..T4)</text>
    <rect x="340" y="40" width="70" height="24" fill="#ef4444" rx="3"/>
    <text x="375" y="56" fill="#ffffff" font-family="system-ui" font-size="9" text-anchor="middle">Test (T5)</text>
    <!-- Fold 2 -->
    <text x="60" y="105" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="700">Split 2</text>
    <rect x="130" y="90" width="280" height="24" fill="#3b82f6" rx="3"/>
    <text x="270" y="106" fill="#ffffff" font-family="system-ui" font-size="9" text-anchor="middle">Train (T1..T5)</text>
    <rect x="420" y="90" width="70" height="24" fill="#ef4444" rx="3"/>
    <text x="455" y="106" fill="#ffffff" font-family="system-ui" font-size="9" text-anchor="middle">Test (T6)</text>
    <!-- Fold 3 -->
    <text x="60" y="155" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="700">Split 3</text>
    <rect x="130" y="140" width="360" height="24" fill="#3b82f6" rx="3"/>
    <text x="310" y="156" fill="#ffffff" font-family="system-ui" font-size="9" text-anchor="middle">Train (T1..T6)</text>
    <rect x="500" y="140" width="70" height="24" fill="#ef4444" rx="3"/>
    <text x="535" y="156" fill="#ffffff" font-family="system-ui" font-size="9" text-anchor="middle">Test (T7)</text>
    <!-- Fold 4 -->
    <text x="60" y="205" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="700">Split 4</text>
    <rect x="130" y="190" width="440" height="24" fill="#3b82f6" rx="3"/>
    <text x="350" y="206" fill="#ffffff" font-family="system-ui" font-size="9" text-anchor="middle">Train (T1..T7)</text>
    <rect x="580" y="190" width="70" height="24" fill="#ef4444" rx="3"/>
    <text x="615" y="206" fill="#ffffff" font-family="system-ui" font-size="9" text-anchor="middle">Test (T8)</text>
    <text x="375" y="265" fill="#fbbf24" font-family="system-ui" font-size="11" text-anchor="middle">Temporal Integrity: Zero Lookahead Bias | Walk-Forward Out-of-Sample Evaluation</text>
  </g>
</svg>
