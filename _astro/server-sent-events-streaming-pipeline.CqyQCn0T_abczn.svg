<svg role="img" aria-label="Server-Sent Events SSE streaming pipeline architecture diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>Server-Sent Events (SSE) Streaming Pipeline</title>
  <defs>
    <linearGradient id="bg255a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card255" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg255a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">SERVER-SENT EVENTS (SSE) STREAMING PIPELINE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Real-Time Autoregressive Token Yields over Persistent HTTP/1.1 and HTTP/2 Connections</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card255)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Client Request -->
    <rect x="25" y="25" width="220" height="255" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="135" y="50" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">1. Client Request</text>
    <rect x="35" y="70" width="200" height="60" fill="#1e293b" rx="4"/>
    <text x="45" y="90" fill="#cbd5e1" font-size="8">POST /v1/chat/completions</text>
    <text x="45" y="105" fill="#38bdf8" font-size="8" font-weight="700">stream: true</text>
    <text x="45" y="120" fill="#cbd5e1" font-size="8">Accept: text/event-stream</text>
    <text x="135" y="245" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">Immediate Connection Open</text>

    <!-- SSE Chunk Stream -->
    <rect x="270" y="25" width="220" height="255" fill="#0f172a" stroke="#fbbf24" rx="6"/>
    <text x="380" y="50" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">2. Real-Time Token Yields</text>
    
    <rect x="280" y="70" width="200" height="35" fill="#1e293b" rx="4"/>
    <text x="290" y="88" fill="#cbd5e1" font-size="7">data: {"delta": {"content": "The"}}</text>
    
    <rect x="280" y="112" width="200" height="35" fill="#1e293b" rx="4"/>
    <text x="290" y="130" fill="#cbd5e1" font-size="7">data: {"delta": {"content": " server"}}</text>

    <rect x="280" y="154" width="200" height="35" fill="#1e293b" rx="4"/>
    <text x="290" y="172" fill="#cbd5e1" font-size="7">data: {"delta": {"content": " is"}}</text>

    <rect x="280" y="196" width="200" height="35" fill="#1e293b" rx="4"/>
    <text x="290" y="214" fill="#fb7185" font-size="7">data: [DONE]</text>
    <text x="380" y="255" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">Zero Buffer Accumulation</text>

    <!-- Client Token Sink -->
    <rect x="515" y="25" width="220" height="255" fill="#0f172a" stroke="#34d399" stroke-width="1.5" rx="6"/>
    <text x="625" y="50" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">3. Client UI Rendering</text>
    
    <rect x="525" y="70" width="200" height="70" fill="#1e293b" rx="4"/>
    <text x="535" y="90" fill="#34d399" font-size="8" font-weight="700">Async Token Loop:</text>
    <text x="535" y="108" fill="#cbd5e1" font-size="7">for chunk in stream:</text>
    <text x="535" y="122" fill="#cbd5e1" font-size="7">  sys.stdout.write(chunk)</text>
    <text x="535" y="134" fill="#cbd5e1" font-size="7">  sys.stdout.flush()</text>

    <rect x="525" y="150" width="200" height="70" fill="#1e293b" rx="4"/>
    <text x="535" y="170" fill="#c084fc" font-size="8" font-weight="700">Telemetry Tracking:</text>
    <text x="535" y="188" fill="#cbd5e1" font-size="7">TTFT: 380ms</text>
    <text x="535" y="202" fill="#cbd5e1" font-size="7">Avg Inter-Token: 24ms</text>
    <text x="625" y="255" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Instant User Feedback</text>
  </g>
</svg>
