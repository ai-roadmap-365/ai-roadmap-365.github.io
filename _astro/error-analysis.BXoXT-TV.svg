<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps, and the highest return.">
  <title>Error analysis</title>
  <style>
    .error-analysis-bg   { fill: #f8fafc; }
    .error-analysis-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .error-analysis-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .error-analysis-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .error-analysis-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .error-analysis-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .error-analysis-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .error-analysis-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .error-analysis-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .error-analysis-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .error-analysis-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .error-analysis-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .error-analysis-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .error-analysis-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .error-analysis-stage { opacity: 1; }

    .error-analysis-s0 { animation-delay: 0.00s; }
    .error-analysis-e0 { animation-delay: 0.00s; }
    .error-analysis-s1 { animation-delay: 1.28s; }
    .error-analysis-e1 { animation-delay: 1.28s; }
    .error-analysis-s2 { animation-delay: 2.56s; }
    .error-analysis-e2 { animation-delay: 2.56s; }
    .error-analysis-s3 { animation-delay: 3.84s; }
    .error-analysis-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .error-analysis-conn  { animation: error-analysis-trace 6.4s ease-in-out infinite; }
      .error-analysis-stage { animation: error-analysis-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes error-analysis-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes error-analysis-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .error-analysis-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .error-analysis-stage { animation: error-analysis-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes error-analysis-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="error-analysis-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="error-analysis-bg" width="980" height="322"/>
  <text class="error-analysis-h1"  x="30" y="40">Error analysis</text>
  <text class="error-analysis-sub" x="30" y="64">Four steps, and the highest return.</text>
  <g class="error-analysis-stage error-analysis-s0">
    <rect class="error-analysis-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="error-analysis-step" x="44" y="142">01</text>
    <text class="error-analysis-name" x="70" y="142">Collect the errors the model actually makes</text>
    <text class="error-analysis-desc" x="44" y="166">On validation data,</text>
    <text class="error-analysis-desc" x="44" y="182">individually.</text>
  </g>
  <line class="error-analysis-line error-analysis-conn error-analysis-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#error-analysis-tip)"/>
  <g class="error-analysis-stage error-analysis-s1">
    <rect class="error-analysis-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="error-analysis-step" x="280" y="142">02</text>
    <text class="error-analysis-name" x="306" y="142">Group them by cause</text>
    <text class="error-analysis-desc" x="280" y="166">By reading them, not by</text>
    <text class="error-analysis-desc" x="280" y="182">clustering them.</text>
  </g>
  <line class="error-analysis-line error-analysis-conn error-analysis-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#error-analysis-tip)"/>
  <g class="error-analysis-stage error-analysis-s2">
    <rect class="error-analysis-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="error-analysis-step" x="516" y="142">03</text>
    <text class="error-analysis-name" x="542" y="142">Count each category</text>
    <text class="error-analysis-desc" x="516" y="166">Which turns impressions into a</text>
    <text class="error-analysis-desc" x="516" y="182">ranked list.</text>
  </g>
  <line class="error-analysis-line error-analysis-conn error-analysis-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#error-analysis-tip)"/>
  <g class="error-analysis-stage error-analysis-s3">
    <rect class="error-analysis-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="error-analysis-step" x="752" y="142">04</text>
    <text class="error-analysis-name" x="778" y="142">And fix the largest category first</text>
    <text class="error-analysis-desc" x="752" y="166">Which is usually data, not</text>
    <text class="error-analysis-desc" x="752" y="182">architecture.</text>
  </g>
  <text class="error-analysis-sub" x="30" y="304">This produces more improvement per hour than model search does, and it is consistently the step teams skip in favour of trying another algorithm.</text>
</svg>
