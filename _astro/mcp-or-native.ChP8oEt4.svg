<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Portability against simplicity.">
  <title>Native calling, or a protocol</title>
  <style>
    .mcp-or-native-bg   { fill: #f8fafc; }
    .mcp-or-native-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-or-native-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-or-native-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-or-native-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-or-native-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-or-native-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mcp-or-native-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mcp-or-native-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mcp-or-native-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mcp-or-native-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mcp-or-native-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mcp-or-native-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mcp-or-native-row { opacity: 1; }
    .mcp-or-native-r0 { animation-delay: 0.00s; }
    .mcp-or-native-r1 { animation-delay: 0.45s; }
    .mcp-or-native-r2 { animation-delay: 0.90s; }
    .mcp-or-native-r3 { animation-delay: 1.35s; }
    .mcp-or-native-r4 { animation-delay: 1.80s; }
    .mcp-or-native-row { animation: mcp-or-native-reveal 7.3s ease-in-out infinite; }
    @keyframes mcp-or-native-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="mcp-or-native-bg" width="980" height="390"/>
  <text class="mcp-or-native-h1"  x="30" y="40">Native calling, or a protocol</text>
  <text class="mcp-or-native-sub" x="30" y="64">Portability against simplicity.</text>
  <rect class="mcp-or-native-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="mcp-or-native-name" x="46" y="122">Native function calling</text>
  <text class="mcp-or-native-desc" x="46" y="142">Simplest to adopt.</text>
  <text class="mcp-or-native-desc mcp-or-native-row mcp-or-native-r0" x="46" y="182">Industry-standard JSON Schema</text>
  <text class="mcp-or-native-desc mcp-or-native-row mcp-or-native-r1" x="46" y="216">Wide model support</text>
  <text class="mcp-or-native-desc mcp-or-native-row mcp-or-native-r2" x="46" y="250">No extra process to run</text>
  <text class="mcp-or-native-desc mcp-or-native-row mcp-or-native-r3" x="46" y="284">Provider-specific envelopes</text>
  <text class="mcp-or-native-desc mcp-or-native-row mcp-or-native-r4" x="46" y="318">Re-implemented per client</text>
  <rect class="mcp-or-native-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="mcp-or-native-name" x="526" y="122">MCP</text>
  <text class="mcp-or-native-desc" x="526" y="142">Write once, serve any client.</text>
  <text class="mcp-or-native-desc mcp-or-native-row mcp-or-native-r0" x="526" y="182">JSON-RPC 2.0 over a server</text>
  <text class="mcp-or-native-desc mcp-or-native-row mcp-or-native-r1" x="526" y="216">One GitHub or Postgres connector for all clients</text>
  <text class="mcp-or-native-desc mcp-or-native-row mcp-or-native-r2" x="526" y="250">No SDK lock-in</text>
  <text class="mcp-or-native-desc mcp-or-native-row mcp-or-native-r3" x="526" y="284">Requires running a daemon</text>
  <text class="mcp-or-native-desc mcp-or-native-row mcp-or-native-r4" x="526" y="318">Worth it once more than one client exists</text>
  <text class="mcp-or-native-sub" x="30" y="372">The deciding question is how many clients will consume the tool: for one application native calling is less machinery, and for a connector several teams will use, a protocol is the cheaper long-run choice.</text>
</svg>
