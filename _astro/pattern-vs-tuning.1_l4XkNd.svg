<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One of them survives a model change.">
  <title>Patterns against tuned phrasing</title>
  <style>
    .pattern-vs-tuning-bg   { fill: #f8fafc; }
    .pattern-vs-tuning-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pattern-vs-tuning-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pattern-vs-tuning-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pattern-vs-tuning-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pattern-vs-tuning-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pattern-vs-tuning-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pattern-vs-tuning-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pattern-vs-tuning-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pattern-vs-tuning-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pattern-vs-tuning-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pattern-vs-tuning-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pattern-vs-tuning-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pattern-vs-tuning-row { opacity: 1; }
    .pattern-vs-tuning-r0 { animation-delay: 0.00s; }
    .pattern-vs-tuning-r1 { animation-delay: 0.45s; }
    .pattern-vs-tuning-r2 { animation-delay: 0.90s; }
    .pattern-vs-tuning-r3 { animation-delay: 1.35s; }
    .pattern-vs-tuning-r4 { animation-delay: 1.80s; }
    .pattern-vs-tuning-row { animation: pattern-vs-tuning-reveal 7.3s ease-in-out infinite; }
    @keyframes pattern-vs-tuning-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="pattern-vs-tuning-bg" width="980" height="390"/>
  <text class="pattern-vs-tuning-h1"  x="30" y="40">Patterns against tuned phrasing</text>
  <text class="pattern-vs-tuning-sub" x="30" y="64">One of them survives a model change.</text>
  <rect class="pattern-vs-tuning-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="pattern-vs-tuning-name" x="46" y="122">Structural patterns</text>
  <text class="pattern-vs-tuning-desc" x="46" y="142">Portable.</text>
  <text class="pattern-vs-tuning-desc pattern-vs-tuning-row pattern-vs-tuning-r0" x="46" y="182">Sections, roles, explicit format</text>
  <text class="pattern-vs-tuning-desc pattern-vs-tuning-row pattern-vs-tuning-r1" x="46" y="216">Work across providers</text>
  <text class="pattern-vs-tuning-desc pattern-vs-tuning-row pattern-vs-tuning-r2" x="46" y="250">Survive a model upgrade</text>
  <text class="pattern-vs-tuning-desc pattern-vs-tuning-row pattern-vs-tuning-r3" x="46" y="284">Reviewable by anyone</text>
  <text class="pattern-vs-tuning-desc pattern-vs-tuning-row pattern-vs-tuning-r4" x="46" y="318">And explainable to a colleague</text>
  <rect class="pattern-vs-tuning-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="pattern-vs-tuning-name" x="526" y="122">Tuned phrasing</text>
  <text class="pattern-vs-tuning-desc" x="526" y="142">Fragile.</text>
  <text class="pattern-vs-tuning-desc pattern-vs-tuning-row pattern-vs-tuning-r0" x="526" y="182">Specific words that happened to help</text>
  <text class="pattern-vs-tuning-desc pattern-vs-tuning-row pattern-vs-tuning-r1" x="526" y="216">Tuned against one model version</text>
  <text class="pattern-vs-tuning-desc pattern-vs-tuning-row pattern-vs-tuning-r2" x="526" y="250">Frequently stop helping after an update</text>
  <text class="pattern-vs-tuning-desc pattern-vs-tuning-row pattern-vs-tuning-r3" x="526" y="284">Hard to justify in review</text>
  <text class="pattern-vs-tuning-desc pattern-vs-tuning-row pattern-vs-tuning-r4" x="526" y="318">And impossible to explain</text>
  <text class="pattern-vs-tuning-sub" x="30" y="372">This is the practical reason to prefer structure over wording: the structural gains persist across model changes and the phrasing gains routinely do not.</text>
</svg>
