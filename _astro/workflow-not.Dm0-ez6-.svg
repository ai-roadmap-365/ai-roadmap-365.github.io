<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things the workflow is not</title>
  <style>
    .workflow-not-bg   { fill: #f8fafc; }
    .workflow-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workflow-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .workflow-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .workflow-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .workflow-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .workflow-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .workflow-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .workflow-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .workflow-not-row { opacity: 1; }
    .workflow-not-r0 { animation-delay: 0.00s; }
    .workflow-not-r1 { animation-delay: 0.45s; }
    .workflow-not-r2 { animation-delay: 0.90s; }
    .workflow-not-r3 { animation-delay: 1.35s; }
    .workflow-not-r4 { animation-delay: 1.80s; }
    .workflow-not-row { animation: workflow-not-reveal 7.3s ease-in-out infinite; }
    @keyframes workflow-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="workflow-not-bg" width="980" height="390"/>
  <text class="workflow-not-h1"  x="30" y="40">Four things the workflow is not</text>
  <text class="workflow-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="workflow-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="workflow-not-name" x="46" y="122">The misconception</text>
  <text class="workflow-not-desc" x="46" y="142">Commonly held.</text>
  <text class="workflow-not-desc workflow-not-row workflow-not-r0" x="46" y="182">It is a linear sequence</text>
  <text class="workflow-not-desc workflow-not-row workflow-not-r1" x="46" y="216">Modelling is the main stage</text>
  <text class="workflow-not-desc workflow-not-row workflow-not-r2" x="46" y="250">A notebook that runs is a pipeline</text>
  <text class="workflow-not-desc workflow-not-row workflow-not-r3" x="46" y="284">Deployment is the end</text>
  <text class="workflow-not-desc workflow-not-row workflow-not-r4" x="46" y="318">Order is a matter of style</text>
  <rect class="workflow-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="workflow-not-name" x="526" y="122">What is true</text>
  <text class="workflow-not-desc" x="526" y="142">Actually.</text>
  <text class="workflow-not-desc workflow-not-row workflow-not-r0" x="526" y="182">It loops, especially back to data</text>
  <text class="workflow-not-desc workflow-not-row workflow-not-r1" x="526" y="216">It is the shortest stage</text>
  <text class="workflow-not-desc workflow-not-row workflow-not-r2" x="526" y="250">Cells are not contracts</text>
  <text class="workflow-not-desc workflow-not-row workflow-not-r3" x="526" y="284">Monitoring starts there</text>
  <text class="workflow-not-desc workflow-not-row workflow-not-r4" x="526" y="318">Order decides whether results are true</text>
  <text class="workflow-not-sub" x="30" y="372">The last row is the one this lesson measures rather than asserts, which is why the transposition demonstration is worth reading closely.</text>
</svg>
