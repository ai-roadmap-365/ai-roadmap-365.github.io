<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Elements in sequence, each correcting.">
  <title>A camera lens assembly</title>
  <style>
    .camera-lens-bg   { fill: #f8fafc; }
    .camera-lens-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .camera-lens-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .camera-lens-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .camera-lens-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .camera-lens-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .camera-lens-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .camera-lens-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .camera-lens-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .camera-lens-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .camera-lens-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .camera-lens-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .camera-lens-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .camera-lens-row { opacity: 1; }
    .camera-lens-r0 { animation-delay: 0.00s; }
    .camera-lens-r1 { animation-delay: 0.45s; }
    .camera-lens-r2 { animation-delay: 0.90s; }
    .camera-lens-r3 { animation-delay: 1.35s; }
    .camera-lens-r4 { animation-delay: 1.80s; }
    .camera-lens-row { animation: camera-lens-reveal 7.3s ease-in-out infinite; }
    @keyframes camera-lens-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="camera-lens-bg" width="980" height="390"/>
  <text class="camera-lens-h1"  x="30" y="40">A camera lens assembly</text>
  <text class="camera-lens-sub" x="30" y="64">Elements in sequence, each correcting.</text>
  <rect class="camera-lens-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="camera-lens-name" x="46" y="122">One element</text>
  <text class="camera-lens-desc" x="46" y="142">Limited, and aberrated.</text>
  <text class="camera-lens-desc camera-lens-row camera-lens-r0" x="46" y="182">A single piece of shaped glass</text>
  <text class="camera-lens-desc camera-lens-row camera-lens-r1" x="46" y="216">Focuses, and distorts</text>
  <text class="camera-lens-desc camera-lens-row camera-lens-r2" x="46" y="250">Chromatic and spherical aberration</text>
  <text class="camera-lens-desc camera-lens-row camera-lens-r3" x="46" y="284">No way to correct within one element</text>
  <text class="camera-lens-desc camera-lens-row camera-lens-r4" x="46" y="318">This is a single layer</text>
  <rect class="camera-lens-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="camera-lens-name" x="526" y="122">A compound assembly</text>
  <text class="camera-lens-desc" x="526" y="142">Each element refines.</text>
  <text class="camera-lens-desc camera-lens-row camera-lens-r0" x="526" y="182">Many elements in a fixed order</text>
  <text class="camera-lens-desc camera-lens-row camera-lens-r1" x="526" y="216">Each correcting the previous</text>
  <text class="camera-lens-desc camera-lens-row camera-lens-r2" x="526" y="250">Small individual contributions</text>
  <text class="camera-lens-desc camera-lens-row camera-lens-r3" x="526" y="284">Combined into a sharp image</text>
  <text class="camera-lens-desc camera-lens-row camera-lens-r4" x="526" y="318">This is a stack of blocks</text>
  <text class="camera-lens-sub" x="30" y="372">The refinement framing matches the residual stream precisely: each block adds a correction to what is already there rather than replacing it, which is why depth accumulates rather than overwrites.</text>
</svg>
