<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Clean output on broken logic is entirely normal.">
  <title>What these tools cannot tell you</title>
  <style>
    .tools-versus-tests-bg   { fill: #f8fafc; }
    .tools-versus-tests-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tools-versus-tests-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tools-versus-tests-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tools-versus-tests-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tools-versus-tests-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tools-versus-tests-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tools-versus-tests-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tools-versus-tests-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tools-versus-tests-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tools-versus-tests-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tools-versus-tests-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tools-versus-tests-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tools-versus-tests-row { opacity: 1; }
    .tools-versus-tests-r0 { animation-delay: 0.00s; }
    .tools-versus-tests-r1 { animation-delay: 0.45s; }
    .tools-versus-tests-r2 { animation-delay: 0.90s; }
    .tools-versus-tests-r3 { animation-delay: 1.35s; }
    .tools-versus-tests-r4 { animation-delay: 1.80s; }
    .tools-versus-tests-row { animation: tools-versus-tests-reveal 7.3s ease-in-out infinite; }
    @keyframes tools-versus-tests-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tools-versus-tests-bg" width="980" height="390"/>
  <text class="tools-versus-tests-h1"  x="30" y="40">What these tools cannot tell you</text>
  <text class="tools-versus-tests-sub" x="30" y="64">Clean output on broken logic is entirely normal.</text>
  <rect class="tools-versus-tests-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tools-versus-tests-name" x="46" y="122">Static analysis finds</text>
  <text class="tools-versus-tests-desc" x="46" y="142">Shape.</text>
  <text class="tools-versus-tests-desc tools-versus-tests-row tools-versus-tests-r0" x="46" y="182">Unused variables and imports</text>
  <text class="tools-versus-tests-desc tools-versus-tests-row tools-versus-tests-r1" x="46" y="216">Unreachable branches</text>
  <text class="tools-versus-tests-desc tools-versus-tests-row tools-versus-tests-r2" x="46" y="250">Type mismatches</text>
  <text class="tools-versus-tests-desc tools-versus-tests-row tools-versus-tests-r3" x="46" y="284">Shadowed names</text>
  <text class="tools-versus-tests-desc tools-versus-tests-row tools-versus-tests-r4" x="46" y="318">Some vulnerability patterns</text>
  <rect class="tools-versus-tests-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tools-versus-tests-name" x="526" y="122">Only running it finds</text>
  <text class="tools-versus-tests-desc" x="526" y="142">Behaviour.</text>
  <text class="tools-versus-tests-desc tools-versus-tests-row tools-versus-tests-r0" x="526" y="182">Arithmetic that is simply wrong</text>
  <text class="tools-versus-tests-desc tools-versus-tests-row tools-versus-tests-r1" x="526" y="216">A condition inverted</text>
  <text class="tools-versus-tests-desc tools-versus-tests-row tools-versus-tests-r2" x="526" y="250">An off-by-one in a boundary</text>
  <text class="tools-versus-tests-desc tools-versus-tests-row tools-versus-tests-r3" x="526" y="284">A silently wrong normalisation</text>
  <text class="tools-versus-tests-desc tools-versus-tests-row tools-versus-tests-r4" x="526" y="318">Anything about actual values</text>
  <text class="tools-versus-tests-sub" x="30" y="372">A function can pass every linter, every formatter and every type check while returning the wrong answer for valid input. That is not a gap in the tools; it is the boundary of what reading code can establish.</text>
</svg>
