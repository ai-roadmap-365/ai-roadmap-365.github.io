<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By what the decision does.">
  <title>Which fairness criterion when</title>
  <style>
    .fairness-when-bg   { fill: #f8fafc; }
    .fairness-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fairness-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fairness-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fairness-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fairness-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fairness-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fairness-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fairness-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fairness-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fairness-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fairness-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fairness-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fairness-when-row { opacity: 1; }
    .fairness-when-r0 { animation-delay: 0.00s; }
    .fairness-when-r1 { animation-delay: 0.45s; }
    .fairness-when-r2 { animation-delay: 0.90s; }
    .fairness-when-r3 { animation-delay: 1.35s; }
    .fairness-when-r4 { animation-delay: 1.80s; }
    .fairness-when-row { animation: fairness-when-reveal 7.3s ease-in-out infinite; }
    @keyframes fairness-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="fairness-when-bg" width="980" height="390"/>
  <text class="fairness-when-h1"  x="30" y="40">Which fairness criterion when</text>
  <text class="fairness-when-sub" x="30" y="64">By what the decision does.</text>
  <rect class="fairness-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="fairness-when-name" x="46" y="122">The decision</text>
  <text class="fairness-when-desc" x="46" y="142">What it does.</text>
  <text class="fairness-when-desc fairness-when-row fairness-when-r0" x="46" y="182">Allocating a scarce benefit</text>
  <text class="fairness-when-desc fairness-when-row fairness-when-r1" x="46" y="216">Screening where a miss is harmful</text>
  <text class="fairness-when-desc fairness-when-row fairness-when-r2" x="46" y="250">Screening where a false alarm is harmful</text>
  <text class="fairness-when-desc fairness-when-row fairness-when-r3" x="46" y="284">A score consumed by other decisions</text>
  <text class="fairness-when-desc fairness-when-row fairness-when-r4" x="46" y="318">Any decision affecting people</text>
  <rect class="fairness-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="fairness-when-name" x="526" y="122">The criterion</text>
  <text class="fairness-when-desc" x="526" y="142">What to measure.</text>
  <text class="fairness-when-desc fairness-when-row fairness-when-r0" x="526" y="182">Demographic parity, if base rates permit</text>
  <text class="fairness-when-desc fairness-when-row fairness-when-r1" x="526" y="216">Equal opportunity — equal recall</text>
  <text class="fairness-when-desc fairness-when-row fairness-when-r2" x="526" y="250">Equalised odds — both error rates</text>
  <text class="fairness-when-desc fairness-when-row fairness-when-r3" x="526" y="284">Calibration per group</text>
  <text class="fairness-when-desc fairness-when-row fairness-when-r4" x="526" y="318">Measure several, and state which you chose</text>
  <text class="fairness-when-sub" x="30" y="372">Measuring several and stating the choice is the defensible position, since no single criterion can be justified as universally correct and silence looks like avoidance.</text>
</svg>
