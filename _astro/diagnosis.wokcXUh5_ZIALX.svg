<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One of them locates the problem.">
  <title>A single symptom, or a panel of tests</title>
  <style>
    .diagnosis-bg   { fill: #f8fafc; }
    .diagnosis-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diagnosis-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diagnosis-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diagnosis-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diagnosis-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diagnosis-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .diagnosis-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .diagnosis-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .diagnosis-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .diagnosis-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .diagnosis-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .diagnosis-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .diagnosis-row { opacity: 1; }
    .diagnosis-r0 { animation-delay: 0.00s; }
    .diagnosis-r1 { animation-delay: 0.45s; }
    .diagnosis-r2 { animation-delay: 0.90s; }
    .diagnosis-r3 { animation-delay: 1.35s; }
    .diagnosis-r4 { animation-delay: 1.80s; }
    .diagnosis-row { animation: diagnosis-reveal 7.3s ease-in-out infinite; }
    @keyframes diagnosis-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="diagnosis-bg" width="980" height="390"/>
  <text class="diagnosis-h1"  x="30" y="40">A single symptom, or a panel of tests</text>
  <text class="diagnosis-sub" x="30" y="64">One of them locates the problem.</text>
  <rect class="diagnosis-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="diagnosis-name" x="46" y="122">One overall score</text>
  <text class="diagnosis-desc" x="46" y="142">Something is wrong.</text>
  <text class="diagnosis-desc diagnosis-row diagnosis-r0" x="46" y="182">A single quality number</text>
  <text class="diagnosis-desc diagnosis-row diagnosis-r1" x="46" y="216">Falls when anything breaks</text>
  <text class="diagnosis-desc diagnosis-row diagnosis-r2" x="46" y="250">Says nothing about where</text>
  <text class="diagnosis-desc diagnosis-row diagnosis-r3" x="46" y="284">Every fix is a guess</text>
  <text class="diagnosis-desc diagnosis-row diagnosis-r4" x="46" y="318">Progress is accidental</text>
  <rect class="diagnosis-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="diagnosis-name" x="526" y="122">Per-stage measurements</text>
  <text class="diagnosis-desc" x="526" y="142">This stage is wrong.</text>
  <text class="diagnosis-desc diagnosis-row diagnosis-r0" x="526" y="182">One measurement per stage</text>
  <text class="diagnosis-desc diagnosis-row diagnosis-r1" x="526" y="216">Identifies the failing component</text>
  <text class="diagnosis-desc diagnosis-row diagnosis-r2" x="526" y="250">Points directly at the fix</text>
  <text class="diagnosis-desc diagnosis-row diagnosis-r3" x="526" y="284">Improvements are verifiable</text>
  <text class="diagnosis-desc diagnosis-row diagnosis-r4" x="526" y="318">Progress is deliberate</text>
  <text class="diagnosis-sub" x="30" y="372">This is the same reasoning as any diagnostic process: the aggregate establishes that something is wrong and the targeted tests establish what.</text>
</svg>
