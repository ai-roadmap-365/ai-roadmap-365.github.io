<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" font-family="system-ui, sans-serif">
  <title>The anatomy of a code editor window, with its explorer, editor pane, integrated terminal, extensions rail, and status bar labelled</title>
  <rect x="0" y="0" width="720" height="500" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The anatomy of a code editor</text>

  <!-- Outer editor window -->
  <rect x="40" y="60" width="640" height="360" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>

  <!-- Extensions rail (far left) -->
  <rect x="40" y="60" width="52" height="360" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="66" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c" transform="rotate(-90 66 240)">Extensions</text>

  <!-- File explorer -->
  <rect x="92" y="60" width="150" height="300" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="167" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">File explorer</text>
  <text x="108" y="112" font-size="14" fill="#1a202c">▸ project/</text>
  <text x="120" y="134" font-size="14" fill="#1a202c">main.py</text>
  <text x="120" y="156" font-size="14" fill="#1a202c">utils.py</text>
  <text x="120" y="178" font-size="14" fill="#1a202c">.editorconfig</text>
  <text x="108" y="200" font-size="14" fill="#1a202c">▸ tests/</text>

  <!-- Editor pane -->
  <rect x="242" y="60" width="438" height="230" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="461" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Editor pane</text>
  <text x="262" y="118" font-size="14" fill="#1d4ed8">def</text>
  <text x="300" y="118" font-size="14" fill="#1a202c">greet(name):</text>
  <text x="282" y="140" font-size="14" fill="#1a202c">return "Hi " + name</text>
  <text x="262" y="176" font-size="14" fill="#1d4ed8">greet(</text>
  <rect x="312" y="164" width="150" height="20" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="1" rx="3"/>
  <text x="320" y="179" font-size="13" fill="#1a202c">name  (autocomplete)</text>
  <text x="262" y="212" font-size="13" fill="#1a202c">Colored keywords, inline completion,</text>
  <text x="262" y="232" font-size="13" fill="#1a202c">error underlines — powered by a language server.</text>

  <!-- Integrated terminal -->
  <rect x="242" y="290" width="438" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="461" y="314" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Integrated terminal</text>
  <text x="262" y="340" font-size="14" fill="#1a202c">$ python main.py</text>

  <!-- Status bar -->
  <rect x="92" y="360" width="588" height="60" fill="#1d4ed8" rx="0"/>
  <text x="386" y="384" text-anchor="middle" font-size="15" font-weight="bold" fill="#f8fafc">Status bar</text>
  <text x="386" y="406" text-anchor="middle" font-size="13" fill="#f8fafc">git branch: main   •   Python   •   Ln 2, Col 24   •   0 errors</text>

  <text x="360" y="452" text-anchor="middle" font-size="14" fill="#1a202c">One window, cooperating regions: explorer to navigate, pane to edit,</text>
  <text x="360" y="472" text-anchor="middle" font-size="14" fill="#1a202c">terminal to run, extensions to grow, status bar to report.</text>
</svg>
