<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Reading a traceback</title>
  <style>
    .traceback-bg   { fill: #f8fafc; }
    .traceback-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .traceback-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .traceback-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .traceback-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .traceback-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .traceback-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .traceback-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .traceback-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .traceback-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .traceback-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .traceback-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .traceback-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .traceback-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .traceback-stage { opacity: 1; }

    .traceback-s0 { animation-delay: 0.00s; }
    .traceback-e0 { animation-delay: 0.00s; }
    .traceback-s1 { animation-delay: 1.28s; }
    .traceback-e1 { animation-delay: 1.28s; }
    .traceback-s2 { animation-delay: 2.56s; }
    .traceback-e2 { animation-delay: 2.56s; }
    .traceback-s3 { animation-delay: 3.84s; }
    .traceback-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .traceback-conn  { animation: traceback-trace 6.4s ease-in-out infinite; }
      .traceback-stage { animation: traceback-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes traceback-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes traceback-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .traceback-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .traceback-stage { animation: traceback-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes traceback-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="traceback-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="traceback-bg" width="980" height="322"/>
  <text class="traceback-h1"  x="30" y="40">Reading a traceback</text>
  <text class="traceback-sub" x="30" y="64">Four steps.</text>
  <g class="traceback-stage traceback-s0">
    <rect class="traceback-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="traceback-step" x="44" y="142">01</text>
    <text class="traceback-name" x="70" y="142">It is printed oldest call first</text>
    <text class="traceback-desc" x="44" y="166">Which is the opposite of what</text>
    <text class="traceback-desc" x="44" y="182">you want.</text>
  </g>
  <line class="traceback-line traceback-conn traceback-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#traceback-tip)"/>
  <g class="traceback-stage traceback-s1">
    <rect class="traceback-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="traceback-step" x="280" y="142">02</text>
    <text class="traceback-name" x="306" y="142">So read the bottom line first</text>
    <text class="traceback-desc" x="280" y="166">Which names the exception and</text>
    <text class="traceback-desc" x="280" y="182">the message.</text>
  </g>
  <line class="traceback-line traceback-conn traceback-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#traceback-tip)"/>
  <g class="traceback-stage traceback-s2">
    <rect class="traceback-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="traceback-step" x="516" y="142">03</text>
    <text class="traceback-name" x="542" y="142">Then walk upward to the last line of your own code</text>
    <text class="traceback-desc" x="516" y="166">Which is usually where the</text>
    <text class="traceback-desc" x="516" y="182">problem is.</text>
  </g>
  <line class="traceback-line traceback-conn traceback-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#traceback-tip)"/>
  <g class="traceback-stage traceback-s3">
    <rect class="traceback-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="traceback-step" x="752" y="142">04</text>
    <text class="traceback-name" x="778" y="142">And check for a cause chain above it</text>
    <text class="traceback-desc" x="752" y="166">Which says what triggered what.</text>
  </g>
  <text class="traceback-sub" x="30" y="304">Reading bottom-up is the habit worth forming: the most specific information is at the end, and the top frames are usually library internals.</text>
</svg>
