<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Six pieces, all standard library.">
  <title>What you build, and what it is made of</title>
  <style>
    .scratch-components-bg   { fill: #f8fafc; }
    .scratch-components-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-components-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-components-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-components-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-components-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-components-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scratch-components-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scratch-components-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scratch-components-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scratch-components-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scratch-components-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scratch-components-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .scratch-components-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .scratch-components-stage { opacity: 1; }

    .scratch-components-s0 { animation-delay: 0.00s; }
    .scratch-components-e0 { animation-delay: 0.00s; }
    .scratch-components-s1 { animation-delay: 1.37s; }
    .scratch-components-e1 { animation-delay: 1.37s; }
    .scratch-components-s2 { animation-delay: 2.74s; }
    .scratch-components-e2 { animation-delay: 2.74s; }
    .scratch-components-s3 { animation-delay: 4.11s; }
    .scratch-components-e3 { animation-delay: 4.11s; }
    .scratch-components-s4 { animation-delay: 5.49s; }
    .scratch-components-e4 { animation-delay: 5.49s; }
    .scratch-components-s5 { animation-delay: 6.86s; }
    .scratch-components-e5 { animation-delay: 6.86s; }
    @media (prefers-reduced-motion: no-preference) {
      .scratch-components-conn  { animation: scratch-components-trace 9.600000000000001s ease-in-out infinite; }
      .scratch-components-stage { animation: scratch-components-arrive 9.600000000000001s ease-in-out infinite; }
    }
    @keyframes scratch-components-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes scratch-components-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .scratch-components-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .scratch-components-stage { animation: scratch-components-settle 9.600000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes scratch-components-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="scratch-components-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="scratch-components-bg" width="980" height="322"/>
  <text class="scratch-components-h1"  x="30" y="40">What you build, and what it is made of</text>
  <text class="scratch-components-sub" x="30" y="64">Six pieces, all standard library.</text>
  <g class="scratch-components-stage scratch-components-s0">
    <rect class="scratch-components-box" x="30" y="118" width="131" height="104" rx="10"/>
    <text class="scratch-components-step" x="44" y="142">01</text>
    <text class="scratch-components-name" x="70" y="142">Prompt assembly</text>
    <text class="scratch-components-desc" x="44" y="166">System prompt, goal,</text>
    <text class="scratch-components-desc" x="44" y="182">tool schemas,</text>
    <text class="scratch-components-desc" x="44" y="198">scratchpad. Every</text>
  </g>
  <line class="scratch-components-line scratch-components-conn scratch-components-e0" x1="163" y1="170" x2="185" y2="170" marker-end="url(#scratch-components-tip)"/>
  <g class="scratch-components-stage scratch-components-s1">
    <rect class="scratch-components-box" x="187" y="118" width="131" height="104" rx="10"/>
    <text class="scratch-components-step" x="201" y="142">02</text>
    <text class="scratch-components-name" x="227" y="142">Action parsing</text>
    <text class="scratch-components-desc" x="201" y="166">Regex plus json,</text>
    <text class="scratch-components-desc" x="201" y="182">handling both</text>
    <text class="scratch-components-desc" x="201" y="198">single-line and</text>
  </g>
  <line class="scratch-components-line scratch-components-conn scratch-components-e1" x1="320" y1="170" x2="342" y2="170" marker-end="url(#scratch-components-tip)"/>
  <g class="scratch-components-stage scratch-components-s2">
    <rect class="scratch-components-box" x="344" y="118" width="131" height="104" rx="10"/>
    <text class="scratch-components-step" x="358" y="142">03</text>
    <text class="scratch-components-name" x="384" y="142">Tool dispatch</text>
    <text class="scratch-components-desc" x="358" y="166">A registry, a schema</text>
    <text class="scratch-components-desc" x="358" y="182">check, and a call.</text>
    <text class="scratch-components-edge" x="358" y="242">registry</text>
  </g>
  <line class="scratch-components-line scratch-components-conn scratch-components-e2" x1="477" y1="170" x2="499" y2="170" marker-end="url(#scratch-components-tip)"/>
  <g class="scratch-components-stage scratch-components-s3">
    <rect class="scratch-components-warn" x="501" y="118" width="131" height="104" rx="10"/>
    <text class="scratch-components-step" x="515" y="142">04</text>
    <text class="scratch-components-name" x="541" y="142">Sandboxed execution</text>
    <text class="scratch-components-desc" x="515" y="166">Timeouts and</text>
    <text class="scratch-components-desc" x="515" y="182">stripped builtins.</text>
    <text class="scratch-components-desc" x="515" y="198">Not optional.</text>
  </g>
  <line class="scratch-components-line scratch-components-conn scratch-components-e3" x1="634" y1="170" x2="656" y2="170" marker-end="url(#scratch-components-tip)"/>
  <g class="scratch-components-stage scratch-components-s4">
    <rect class="scratch-components-box" x="658" y="118" width="131" height="104" rx="10"/>
    <text class="scratch-components-step" x="672" y="142">05</text>
    <text class="scratch-components-name" x="698" y="142">Sliding-window memory</text>
    <text class="scratch-components-desc" x="672" y="166">Keep the head,</text>
    <text class="scratch-components-desc" x="672" y="182">compact the middle,</text>
    <text class="scratch-components-desc" x="672" y="198">keep the last K</text>
  </g>
  <line class="scratch-components-line scratch-components-conn scratch-components-e4" x1="791" y1="170" x2="813" y2="170" marker-end="url(#scratch-components-tip)"/>
  <g class="scratch-components-stage scratch-components-s5">
    <rect class="scratch-components-good" x="815" y="118" width="131" height="104" rx="10"/>
    <text class="scratch-components-step" x="829" y="142">06</text>
    <text class="scratch-components-name" x="855" y="142">Stopping predicates</text>
    <text class="scratch-components-desc" x="829" y="166">Step bound, token</text>
    <text class="scratch-components-desc" x="829" y="182">cap, cycle</text>
    <text class="scratch-components-desc" x="829" y="198">detection.</text>
  </g>
  <text class="scratch-components-sub" x="30" y="304">None of these needs a dependency, which is the point: the whole runtime is `re`, `json`, `time`, `dataclasses` and `hashlib`, and every line of it is inspectable when something goes wrong.</text>
</svg>
