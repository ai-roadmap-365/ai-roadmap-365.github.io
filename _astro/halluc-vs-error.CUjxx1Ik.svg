<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Different failures.">
  <title>Hallucination against error</title>
  <style>
    .halluc-vs-error-bg   { fill: #f8fafc; }
    .halluc-vs-error-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .halluc-vs-error-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .halluc-vs-error-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .halluc-vs-error-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .halluc-vs-error-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .halluc-vs-error-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .halluc-vs-error-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .halluc-vs-error-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .halluc-vs-error-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .halluc-vs-error-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .halluc-vs-error-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .halluc-vs-error-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .halluc-vs-error-row { opacity: 1; }
    .halluc-vs-error-r0 { animation-delay: 0.00s; }
    .halluc-vs-error-r1 { animation-delay: 0.45s; }
    .halluc-vs-error-r2 { animation-delay: 0.90s; }
    .halluc-vs-error-r3 { animation-delay: 1.35s; }
    .halluc-vs-error-r4 { animation-delay: 1.80s; }
    .halluc-vs-error-row { animation: halluc-vs-error-reveal 7.3s ease-in-out infinite; }
    @keyframes halluc-vs-error-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="halluc-vs-error-bg" width="980" height="390"/>
  <text class="halluc-vs-error-h1"  x="30" y="40">Hallucination against error</text>
  <text class="halluc-vs-error-sub" x="30" y="64">Different failures.</text>
  <rect class="halluc-vs-error-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="halluc-vs-error-name" x="46" y="122">Hallucination</text>
  <text class="halluc-vs-error-desc" x="46" y="142">Confidently wrong.</text>
  <text class="halluc-vs-error-desc halluc-vs-error-row halluc-vs-error-r0" x="46" y="182">Fluent, specific and false</text>
  <text class="halluc-vs-error-desc halluc-vs-error-row halluc-vs-error-r1" x="46" y="216">No signal that anything failed</text>
  <text class="halluc-vs-error-desc halluc-vs-error-row halluc-vs-error-r2" x="46" y="250">Indistinguishable from a correct answer</text>
  <text class="halluc-vs-error-desc halluc-vs-error-row halluc-vs-error-r3" x="46" y="284">Cannot be caught by the model itself</text>
  <text class="halluc-vs-error-desc halluc-vs-error-row halluc-vs-error-r4" x="46" y="318">Needs external verification</text>
  <rect class="halluc-vs-error-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="halluc-vs-error-name" x="526" y="122">An ordinary error</text>
  <text class="halluc-vs-error-desc" x="526" y="142">Visibly wrong.</text>
  <text class="halluc-vs-error-desc halluc-vs-error-row halluc-vs-error-r0" x="526" y="182">An exception, or a wrong type</text>
  <text class="halluc-vs-error-desc halluc-vs-error-row halluc-vs-error-r1" x="526" y="216">A stack trace, or a failed assertion</text>
  <text class="halluc-vs-error-desc halluc-vs-error-row halluc-vs-error-r2" x="526" y="250">Distinguishable from success</text>
  <text class="halluc-vs-error-desc halluc-vs-error-row halluc-vs-error-r3" x="526" y="284">Caught by tests</text>
  <text class="halluc-vs-error-desc halluc-vs-error-row halluc-vs-error-r4" x="526" y="318">Needs a fix, not a checker</text>
  <text class="halluc-vs-error-sub" x="30" y="372">The absence of a failure signal is what makes this a different engineering problem: everything in conventional practice assumes errors announce themselves.</text>
</svg>
