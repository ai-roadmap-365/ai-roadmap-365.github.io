<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Two-Phase Credit Authorization and Settlement Flow">
  <title>Two-Phase Credit Authorization and Settlement Flow</title>
  <defs>
    <style>
      .d319a-bg { fill: #f8fafc; }
      .d319a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d319a-p1 { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d319a-p2 { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d319a-p3 { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d319a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d319a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d319a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d319a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d319a-bg" />
  
  <text x="40" y="40" class="d319a-title">Two-Phase Token Billing &amp; Credit Settlement</text>
  <text x="40" y="65" class="d319a-subtitle">Two-Phase Credit Authorization and Settlement Flow showing Phase 1 Pre-Auth Reserve Hold, LLM Inference Stream, and Phase 2 Exact Token Settlement and Hold Release</text>
  
  <!-- Phase 1: Pre-Auth Reservation -->
  <rect x="40" y="110" width="250" height="270" class="d319a-p1" />
  <text x="60" y="145" class="d319a-header" fill="#1d4ed8">Phase 1: Pre-Authorization Hold</text>
  <text x="60" y="180" class="d319a-text">• User submits prompt (500 tokens)</text>
  <text x="60" y="205" class="d319a-text">• Est. Max Cost: $0.030 (2,000 max)</text>
  <text x="60" y="230" class="d319a-text">• Check Tenant Balance: $25.00</text>
  <text x="60" y="255" class="d319a-text">• **Reserve Hold:** Balance -> $24.97</text>
  <text x="60" y="295" class="d319a-text" font-weight="600" fill="#1d4ed8">Status: Hold Placed ($0.030)</text>
  <text x="60" y="320" class="d319a-text">Pass request to model engine</text>
  
  <!-- Phase 2: Inference Stream -->
  <rect x="325" y="110" width="250" height="270" class="d319a-p2" />
  <text x="345" y="145" class="d319a-header" fill="#7e22ce">Phase 2: LLM Execution</text>
  <text x="345" y="180" class="d319a-text">• Stream tokens to client (SSE)</text>
  <text x="345" y="205" class="d319a-text">• Model completes generation</text>
  <text x="345" y="230" class="d319a-text">• Exact Prompt Tokens: 480</text>
  <text x="345" y="255" class="d319a-text">• Exact Output Tokens: 120</text>
  <text x="345" y="295" class="d319a-text" font-weight="600" fill="#7e22ce">Exact Actual Cost: $0.0032</text>
  <text x="345" y="320" class="d319a-text">Dispatched to Settlement Engine</text>
  
  <!-- Phase 3: Settlement & Reconciliation -->
  <rect x="610" y="110" width="250" height="270" class="d319a-p3" />
  <text x="630" y="145" class="d319a-header" fill="#15803d">Phase 3: Settlement &amp; Release</text>
  <text x="630" y="180" class="d319a-text">• Release $0.030 reserved hold</text>
  <text x="630" y="205" class="d319a-text">• Deduct exact $0.0032 charge</text>
  <text x="630" y="230" class="d319a-text">• Final Balance: $24.9968</text>
  <text x="630" y="255" class="d319a-text">• Emit Stripe Metered Event</text>
  <text x="630" y="295" class="d319a-text" font-weight="600" fill="#15803d">Status: Reconciled 100%</text>
  <text x="630" y="320" class="d319a-text">Audit log saved to Postgres</text>
</svg>