<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Streaming, idempotency, breaking.">
  <title>Three backend patterns</title>
  <style>
    .three-patterns-bg   { fill: #f8fafc; }
    .three-patterns-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-patterns-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-patterns-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-patterns-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-patterns-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-patterns-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-patterns-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-patterns-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-patterns-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-patterns-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-patterns-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-patterns-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .three-patterns-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .three-patterns-stage { opacity: 1; }

    .three-patterns-s0 { animation-delay: 0.00s; }
    .three-patterns-e0 { animation-delay: 0.00s; }
    .three-patterns-s1 { animation-delay: 1.50s; }
    .three-patterns-e1 { animation-delay: 1.50s; }
    .three-patterns-s2 { animation-delay: 3.00s; }
    .three-patterns-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .three-patterns-conn  { animation: three-patterns-trace 6s ease-in-out infinite; }
      .three-patterns-stage { animation: three-patterns-arrive 6s ease-in-out infinite; }
    }
    @keyframes three-patterns-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes three-patterns-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .three-patterns-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .three-patterns-stage { animation: three-patterns-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes three-patterns-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="three-patterns-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="three-patterns-bg" width="980" height="322"/>
  <text class="three-patterns-h1"  x="30" y="40">Three backend patterns</text>
  <text class="three-patterns-sub" x="30" y="64">Streaming, idempotency, breaking.</text>
  <g class="three-patterns-stage three-patterns-s0">
    <rect class="three-patterns-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="three-patterns-step" x="44" y="142">01</text>
    <text class="three-patterns-name" x="70" y="142">SSE streaming generators</text>
    <text class="three-patterns-desc" x="44" y="166">Yield frames as tokens arrive. Never buffer</text>
    <text class="three-patterns-desc" x="44" y="182">the completion.</text>
    <text class="three-patterns-edge" x="44" y="242">memory</text>
  </g>
  <line class="three-patterns-line three-patterns-conn three-patterns-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#three-patterns-tip)"/>
  <g class="three-patterns-stage three-patterns-s1">
    <rect class="three-patterns-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="three-patterns-step" x="359" y="142">02</text>
    <text class="three-patterns-name" x="385" y="142">Idempotent deduplication</text>
    <text class="three-patterns-desc" x="359" y="166">A distributed lock with a TTL: at-most-once</text>
    <text class="three-patterns-desc" x="359" y="182">for a repeated key.</text>
    <text class="three-patterns-edge" x="359" y="242">billing</text>
  </g>
  <line class="three-patterns-line three-patterns-conn three-patterns-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#three-patterns-tip)"/>
  <g class="three-patterns-stage three-patterns-s2">
    <rect class="three-patterns-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="three-patterns-step" x="674" y="142">03</text>
    <text class="three-patterns-name" x="700" y="142">Circuit breakers</text>
    <text class="three-patterns-desc" x="674" y="166">Closed, open, half-open. An upstream outage</text>
    <text class="three-patterns-desc" x="674" y="182">becomes degraded mode.</text>
    <text class="three-patterns-edge" x="674" y="242">availability</text>
  </g>
  <text class="three-patterns-sub" x="30" y="304">Each addresses a different property of AI workloads: generations are long, they are expensive enough that duplicates matter, and they depend on a provider you cannot fix.</text>
</svg>
