<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And not permanent either.">
  <title>Not the headline number</title>
  <style>
    .not-a-headline-number-bg   { fill: #f8fafc; }
    .not-a-headline-number-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-headline-number-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-headline-number-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-headline-number-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-headline-number-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-headline-number-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-a-headline-number-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .not-a-headline-number-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .not-a-headline-number-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .not-a-headline-number-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .not-a-headline-number-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .not-a-headline-number-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-a-headline-number-row { opacity: 1; }
    .not-a-headline-number-r0 { animation-delay: 0.00s; }
    .not-a-headline-number-r1 { animation-delay: 0.45s; }
    .not-a-headline-number-r2 { animation-delay: 0.90s; }
    .not-a-headline-number-r3 { animation-delay: 1.35s; }
    .not-a-headline-number-r4 { animation-delay: 1.80s; }
    .not-a-headline-number-row { animation: not-a-headline-number-reveal 7.3s ease-in-out infinite; }
    @keyframes not-a-headline-number-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="not-a-headline-number-bg" width="980" height="390"/>
  <text class="not-a-headline-number-h1"  x="30" y="40">Not the headline number</text>
  <text class="not-a-headline-number-sub" x="30" y="64">And not permanent either.</text>
  <rect class="not-a-headline-number-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="not-a-headline-number-name" x="46" y="122">What it is</text>
  <text class="not-a-headline-number-desc" x="46" y="142">A decision with a horizon.</text>
  <text class="not-a-headline-number-desc not-a-headline-number-row not-a-headline-number-r0" x="46" y="182">Traffic-dependent — name a level</text>
  <text class="not-a-headline-number-desc not-a-headline-number-row not-a-headline-number-r1" x="46" y="216">Reversible, at a price</text>
  <text class="not-a-headline-number-desc not-a-headline-number-row not-a-headline-number-r2" x="46" y="250">Cheapest for 3 months differs from 3 years</text>
  <text class="not-a-headline-number-desc not-a-headline-number-row not-a-headline-number-r3" x="46" y="284">The crossover is computable</text>
  <text class="not-a-headline-number-desc not-a-headline-number-row not-a-headline-number-r4" x="46" y="318">So the move can be planned</text>
  <rect class="not-a-headline-number-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="not-a-headline-number-name" x="526" y="122">Misreadings</text>
  <text class="not-a-headline-number-desc" x="526" y="142">Three, all expensive.</text>
  <text class="not-a-headline-number-desc not-a-headline-number-row not-a-headline-number-r0" x="526" y="182">"Free tier: two million requests"</text>
  <text class="not-a-headline-number-desc not-a-headline-number-row not-a-headline-number-r1" x="526" y="216">That is the dimension chosen to be generous</text>
  <text class="not-a-headline-number-desc not-a-headline-number-row not-a-headline-number-r2" x="526" y="250">"Cheapest wins" — a host that cannot serve is not cheap</text>
  <text class="not-a-headline-number-desc not-a-headline-number-row not-a-headline-number-r3" x="526" y="284">"We picked one, that's settled"</text>
  <text class="not-a-headline-number-desc not-a-headline-number-row not-a-headline-number-r4" x="526" y="318">Egress makes moving data the expensive part</text>
  <text class="not-a-headline-number-sub" x="30" y="372">The middle row on the right is the one this lesson's model is explicit about not checking: it will happily quote a single 1 vCPU VM for twenty million requests a month, which that machine could not deliver.</text>
</svg>
