<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The controlled comparison</title>
  <style>
    .head-to-head-bg   { fill: #f8fafc; }
    .head-to-head-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .head-to-head-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .head-to-head-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .head-to-head-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .head-to-head-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .head-to-head-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .head-to-head-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .head-to-head-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .head-to-head-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .head-to-head-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .head-to-head-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .head-to-head-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .head-to-head-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .head-to-head-stage { opacity: 1; }

    .head-to-head-s0 { animation-delay: 0.00s; }
    .head-to-head-e0 { animation-delay: 0.00s; }
    .head-to-head-s1 { animation-delay: 1.28s; }
    .head-to-head-e1 { animation-delay: 1.28s; }
    .head-to-head-s2 { animation-delay: 2.56s; }
    .head-to-head-e2 { animation-delay: 2.56s; }
    .head-to-head-s3 { animation-delay: 3.84s; }
    .head-to-head-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .head-to-head-conn  { animation: head-to-head-trace 6.4s ease-in-out infinite; }
      .head-to-head-stage { animation: head-to-head-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes head-to-head-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes head-to-head-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .head-to-head-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .head-to-head-stage { animation: head-to-head-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes head-to-head-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="head-to-head-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="head-to-head-bg" width="980" height="322"/>
  <text class="head-to-head-h1"  x="30" y="40">The controlled comparison</text>
  <text class="head-to-head-sub" x="30" y="64">Four steps.</text>
  <g class="head-to-head-stage head-to-head-s0">
    <rect class="head-to-head-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="head-to-head-step" x="44" y="142">01</text>
    <text class="head-to-head-name" x="70" y="142">Hold the features fixed and vary the model</text>
    <text class="head-to-head-desc" x="44" y="166">Across several families, each</text>
    <text class="head-to-head-desc" x="44" y="182">tuned.</text>
  </g>
  <line class="head-to-head-line head-to-head-conn head-to-head-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#head-to-head-tip)"/>
  <g class="head-to-head-stage head-to-head-s1">
    <rect class="head-to-head-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="head-to-head-step" x="280" y="142">02</text>
    <text class="head-to-head-name" x="306" y="142">The spread is a few points</text>
    <text class="head-to-head-desc" x="280" y="166">Which bounds what model choice</text>
    <text class="head-to-head-desc" x="280" y="182">can buy.</text>
  </g>
  <line class="head-to-head-line head-to-head-conn head-to-head-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#head-to-head-tip)"/>
  <g class="head-to-head-stage head-to-head-s2">
    <rect class="head-to-head-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="head-to-head-step" x="516" y="142">03</text>
    <text class="head-to-head-name" x="542" y="142">Then hold the model fixed and vary the features</text>
    <text class="head-to-head-desc" x="516" y="166">Raw against engineered.</text>
  </g>
  <line class="head-to-head-line head-to-head-conn head-to-head-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#head-to-head-tip)"/>
  <g class="head-to-head-stage head-to-head-s3">
    <rect class="head-to-head-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="head-to-head-step" x="752" y="142">04</text>
    <text class="head-to-head-name" x="778" y="142">The spread is far larger</text>
    <text class="head-to-head-desc" x="752" y="166">Which is the comparison, done</text>
    <text class="head-to-head-desc" x="752" y="182">properly.</text>
  </g>
  <text class="head-to-head-sub" x="30" y="304">Running this on your own problem takes an afternoon and settles the question locally, rather than relying on a general claim that may not hold for your data.</text>
</svg>
