<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="It computes; something else decides.">
  <title>Backpropagation is not an optimiser</title>
  <style>
    .backprop-not-optimiser-bg   { fill: #f8fafc; }
    .backprop-not-optimiser-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backprop-not-optimiser-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backprop-not-optimiser-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backprop-not-optimiser-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backprop-not-optimiser-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backprop-not-optimiser-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .backprop-not-optimiser-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .backprop-not-optimiser-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .backprop-not-optimiser-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .backprop-not-optimiser-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .backprop-not-optimiser-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .backprop-not-optimiser-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .backprop-not-optimiser-row { opacity: 1; }
    .backprop-not-optimiser-r0 { animation-delay: 0.00s; }
    .backprop-not-optimiser-r1 { animation-delay: 0.45s; }
    .backprop-not-optimiser-r2 { animation-delay: 0.90s; }
    .backprop-not-optimiser-r3 { animation-delay: 1.35s; }
    .backprop-not-optimiser-r4 { animation-delay: 1.80s; }
    .backprop-not-optimiser-row { animation: backprop-not-optimiser-reveal 7.3s ease-in-out infinite; }
    @keyframes backprop-not-optimiser-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="backprop-not-optimiser-bg" width="980" height="390"/>
  <text class="backprop-not-optimiser-h1"  x="30" y="40">Backpropagation is not an optimiser</text>
  <text class="backprop-not-optimiser-sub" x="30" y="64">It computes; something else decides.</text>
  <rect class="backprop-not-optimiser-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="backprop-not-optimiser-name" x="46" y="122">Backpropagation</text>
  <text class="backprop-not-optimiser-desc" x="46" y="142">Produces gradients.</text>
  <text class="backprop-not-optimiser-desc backprop-not-optimiser-row backprop-not-optimiser-r0" x="46" y="182">Exact partial derivatives</text>
  <text class="backprop-not-optimiser-desc backprop-not-optimiser-row backprop-not-optimiser-r1" x="46" y="216">One value per parameter</text>
  <text class="backprop-not-optimiser-desc backprop-not-optimiser-row backprop-not-optimiser-r2" x="46" y="250">Says which direction increases the loss</text>
  <text class="backprop-not-optimiser-desc backprop-not-optimiser-row backprop-not-optimiser-r3" x="46" y="284">Says nothing about step size</text>
  <text class="backprop-not-optimiser-desc backprop-not-optimiser-row backprop-not-optimiser-r4" x="46" y="318">Deterministic, given the batch</text>
  <rect class="backprop-not-optimiser-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="backprop-not-optimiser-name" x="526" y="122">The optimiser</text>
  <text class="backprop-not-optimiser-desc" x="526" y="142">Decides the update.</text>
  <text class="backprop-not-optimiser-desc backprop-not-optimiser-row backprop-not-optimiser-r0" x="526" y="182">Learning rate, momentum, adaptivity</text>
  <text class="backprop-not-optimiser-desc backprop-not-optimiser-row backprop-not-optimiser-r1" x="526" y="216">May scale gradients per parameter</text>
  <text class="backprop-not-optimiser-desc backprop-not-optimiser-row backprop-not-optimiser-r2" x="526" y="250">May accumulate history</text>
  <text class="backprop-not-optimiser-desc backprop-not-optimiser-row backprop-not-optimiser-r3" x="526" y="284">Adam, SGD, and the rest — Day 206</text>
  <text class="backprop-not-optimiser-desc backprop-not-optimiser-row backprop-not-optimiser-r4" x="526" y="318">Where most training tuning happens</text>
  <text class="backprop-not-optimiser-sub" x="30" y="372">Separating them is what allows the same gradients to be consumed by very different update rules, and it is why an optimiser change is a configuration decision rather than a model change.</text>
</svg>
