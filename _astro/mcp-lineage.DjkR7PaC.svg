<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="LSP, then plugins, then MCP.">
  <title>Three steps to a standard</title>
  <style>
    .mcp-lineage-bg   { fill: #f8fafc; }
    .mcp-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mcp-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mcp-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mcp-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mcp-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mcp-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mcp-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .mcp-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .mcp-lineage-stage { opacity: 1; }

    .mcp-lineage-s0 { animation-delay: 0.00s; }
    .mcp-lineage-e0 { animation-delay: 0.00s; }
    .mcp-lineage-s1 { animation-delay: 1.50s; }
    .mcp-lineage-e1 { animation-delay: 1.50s; }
    .mcp-lineage-s2 { animation-delay: 3.00s; }
    .mcp-lineage-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .mcp-lineage-conn  { animation: mcp-lineage-trace 6s ease-in-out infinite; }
      .mcp-lineage-stage { animation: mcp-lineage-arrive 6s ease-in-out infinite; }
    }
    @keyframes mcp-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes mcp-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .mcp-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .mcp-lineage-stage { animation: mcp-lineage-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes mcp-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="mcp-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="mcp-lineage-bg" width="980" height="322"/>
  <text class="mcp-lineage-h1"  x="30" y="40">Three steps to a standard</text>
  <text class="mcp-lineage-sub" x="30" y="64">LSP, then plugins, then MCP.</text>
  <g class="mcp-lineage-stage mcp-lineage-s0">
    <rect class="mcp-lineage-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="mcp-lineage-step" x="44" y="142">01</text>
    <text class="mcp-lineage-name" x="70" y="142">LSP, 2016</text>
    <text class="mcp-lineage-desc" x="44" y="166">Editor and compiler speak JSON-RPC. Fifty</text>
    <text class="mcp-lineage-desc" x="44" y="182">integrations become fifteen.</text>
    <text class="mcp-lineage-edge" x="44" y="242">the template</text>
  </g>
  <line class="mcp-lineage-line mcp-lineage-conn mcp-lineage-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#mcp-lineage-tip)"/>
  <g class="mcp-lineage-stage mcp-lineage-s1">
    <rect class="mcp-lineage-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="mcp-lineage-step" x="359" y="142">02</text>
    <text class="mcp-lineage-name" x="385" y="142">Plugins and function calling, 2023-2024</text>
    <text class="mcp-lineage-desc" x="359" y="166">Groundbreaking, and proprietary. A ChatGPT</text>
    <text class="mcp-lineage-desc" x="359" y="182">plugin ran nowhere else.</text>
  </g>
  <line class="mcp-lineage-line mcp-lineage-conn mcp-lineage-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#mcp-lineage-tip)"/>
  <g class="mcp-lineage-stage mcp-lineage-s2">
    <rect class="mcp-lineage-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="mcp-lineage-step" x="674" y="142">03</text>
    <text class="mcp-lineage-name" x="700" y="142">MCP, November 2024</text>
    <text class="mcp-lineage-desc" x="674" y="166">MIT-licensed, JSON-RPC 2.0, SDKs in three</text>
    <text class="mcp-lineage-desc" x="674" y="182">languages. Adopted within months.</text>
  </g>
  <text class="mcp-lineage-sub" x="30" y="304">The second step's failure is instructive: the capability was right and the format was owned, so every tool author had to pick an ecosystem, and most picked none.</text>
</svg>
