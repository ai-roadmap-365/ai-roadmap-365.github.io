<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Borg, then five design decisions.">
  <title>Where the loop came from</title>
  <style>
    .k8s-lineage-bg   { fill: #f8fafc; }
    .k8s-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .k8s-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .k8s-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .k8s-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .k8s-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .k8s-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .k8s-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .k8s-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .k8s-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .k8s-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .k8s-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .k8s-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .k8s-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .k8s-lineage-stage { opacity: 1; }

    .k8s-lineage-s0 { animation-delay: 0.00s; }
    .k8s-lineage-e0 { animation-delay: 0.00s; }
    .k8s-lineage-s1 { animation-delay: 1.33s; }
    .k8s-lineage-e1 { animation-delay: 1.33s; }
    .k8s-lineage-s2 { animation-delay: 2.67s; }
    .k8s-lineage-e2 { animation-delay: 2.67s; }
    .k8s-lineage-s3 { animation-delay: 4.00s; }
    .k8s-lineage-e3 { animation-delay: 4.00s; }
    .k8s-lineage-s4 { animation-delay: 5.33s; }
    .k8s-lineage-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .k8s-lineage-conn  { animation: k8s-lineage-trace 8s ease-in-out infinite; }
      .k8s-lineage-stage { animation: k8s-lineage-arrive 8s ease-in-out infinite; }
    }
    @keyframes k8s-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes k8s-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .k8s-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .k8s-lineage-stage { animation: k8s-lineage-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes k8s-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="k8s-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="k8s-lineage-bg" width="980" height="322"/>
  <text class="k8s-lineage-h1"  x="30" y="40">Where the loop came from</text>
  <text class="k8s-lineage-sub" x="30" y="64">Borg, then five design decisions.</text>
  <g class="k8s-lineage-stage k8s-lineage-s0">
    <rect class="k8s-lineage-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="k8s-lineage-step" x="44" y="142">01</text>
    <text class="k8s-lineage-name" x="70" y="142">Borg, 2003</text>
    <text class="k8s-lineage-desc" x="44" y="166">Declarative specification</text>
    <text class="k8s-lineage-desc" x="44" y="182">plus continuous</text>
    <text class="k8s-lineage-desc" x="44" y="198">reconciliation, at Google</text>
  </g>
  <line class="k8s-lineage-line k8s-lineage-conn k8s-lineage-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#k8s-lineage-tip)"/>
  <g class="k8s-lineage-stage k8s-lineage-s1">
    <rect class="k8s-lineage-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="k8s-lineage-step" x="233" y="142">02</text>
    <text class="k8s-lineage-name" x="259" y="142">Kubernetes, 2014</text>
    <text class="k8s-lineage-desc" x="233" y="166">Borg's ideas in the open:</text>
    <text class="k8s-lineage-desc" x="233" y="182">an API server,</text>
    <text class="k8s-lineage-desc" x="233" y="198">controllers, a scheduler.</text>
  </g>
  <line class="k8s-lineage-line k8s-lineage-conn k8s-lineage-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#k8s-lineage-tip)"/>
  <g class="k8s-lineage-stage k8s-lineage-s2">
    <rect class="k8s-lineage-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="k8s-lineage-step" x="422" y="142">03</text>
    <text class="k8s-lineage-name" x="448" y="142">The operator pattern, 2016</text>
    <text class="k8s-lineage-desc" x="422" y="166">A controller is just a</text>
    <text class="k8s-lineage-desc" x="422" y="182">loop, so write one for</text>
    <text class="k8s-lineage-desc" x="422" y="198">your own resource types.</text>
    <text class="k8s-lineage-edge" x="422" y="242">generalises</text>
  </g>
  <line class="k8s-lineage-line k8s-lineage-conn k8s-lineage-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#k8s-lineage-tip)"/>
  <g class="k8s-lineage-stage k8s-lineage-s3">
    <rect class="k8s-lineage-good" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="k8s-lineage-step" x="611" y="142">04</text>
    <text class="k8s-lineage-name" x="637" y="142">Level-triggered throughout</text>
    <text class="k8s-lineage-desc" x="611" y="166">React to state, not</text>
    <text class="k8s-lineage-desc" x="611" y="182">events. Self-correcting</text>
    <text class="k8s-lineage-desc" x="611" y="198">by construction.</text>
  </g>
  <line class="k8s-lineage-line k8s-lineage-conn k8s-lineage-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#k8s-lineage-tip)"/>
  <g class="k8s-lineage-stage k8s-lineage-s4">
    <rect class="k8s-lineage-box" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="k8s-lineage-step" x="800" y="142">05</text>
    <text class="k8s-lineage-name" x="826" y="142">Deployments, 2016</text>
    <text class="k8s-lineage-desc" x="800" y="166">Rolling updates moved off</text>
    <text class="k8s-lineage-desc" x="800" y="182">the laptop into a</text>
    <text class="k8s-lineage-desc" x="800" y="198">controller, so closing it</text>
  </g>
  <text class="k8s-lineage-sub" x="30" y="304">That the operator pattern generalises this cleanly is evidence the core abstraction was right: if the only thing a controller does is compare and step, then anything with a desired state can have one.</text>
</svg>
