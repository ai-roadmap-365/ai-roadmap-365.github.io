<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The problem virtual environments exist to solve.">
  <title>One shared package directory, or one per project</title>
  <style>
    .shared-versus-isolated-bg   { fill: #f8fafc; }
    .shared-versus-isolated-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shared-versus-isolated-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shared-versus-isolated-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shared-versus-isolated-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shared-versus-isolated-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shared-versus-isolated-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .shared-versus-isolated-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .shared-versus-isolated-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .shared-versus-isolated-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .shared-versus-isolated-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .shared-versus-isolated-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .shared-versus-isolated-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .shared-versus-isolated-row { opacity: 1; }
    .shared-versus-isolated-r0 { animation-delay: 0.00s; }
    .shared-versus-isolated-r1 { animation-delay: 0.45s; }
    .shared-versus-isolated-r2 { animation-delay: 0.90s; }
    .shared-versus-isolated-r3 { animation-delay: 1.35s; }
    .shared-versus-isolated-r4 { animation-delay: 1.80s; }
    .shared-versus-isolated-row { animation: shared-versus-isolated-reveal 7.3s ease-in-out infinite; }
    @keyframes shared-versus-isolated-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="shared-versus-isolated-bg" width="980" height="390"/>
  <text class="shared-versus-isolated-h1"  x="30" y="40">One shared package directory, or one per project</text>
  <text class="shared-versus-isolated-sub" x="30" y="64">The problem virtual environments exist to solve.</text>
  <rect class="shared-versus-isolated-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="shared-versus-isolated-name" x="46" y="122">One shared directory</text>
  <text class="shared-versus-isolated-desc" x="46" y="142">Every project installs to the same place.</text>
  <text class="shared-versus-isolated-desc shared-versus-isolated-row shared-versus-isolated-r0" x="46" y="182">Project A needs a library at 1.4</text>
  <text class="shared-versus-isolated-desc shared-versus-isolated-row shared-versus-isolated-r1" x="46" y="216">Project B needs it at 2.0</text>
  <text class="shared-versus-isolated-desc shared-versus-isolated-row shared-versus-isolated-r2" x="46" y="250">Installing one silently breaks the other</text>
  <text class="shared-versus-isolated-desc shared-versus-isolated-row shared-versus-isolated-r3" x="46" y="284">The OS depends on this Python too</text>
  <text class="shared-versus-isolated-desc shared-versus-isolated-row shared-versus-isolated-r4" x="46" y="318">Removing a package may break something unrelated</text>
  <rect class="shared-versus-isolated-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="shared-versus-isolated-name" x="526" y="122">One per project</text>
  <text class="shared-versus-isolated-desc" x="526" y="142">A private directory each.</text>
  <text class="shared-versus-isolated-desc shared-versus-isolated-row shared-versus-isolated-r0" x="526" y="182">A gets 1.4, B gets 2.0</text>
  <text class="shared-versus-isolated-desc shared-versus-isolated-row shared-versus-isolated-r1" x="526" y="216">Neither can see the other's packages</text>
  <text class="shared-versus-isolated-desc shared-versus-isolated-row shared-versus-isolated-r2" x="526" y="250">The system Python is untouched</text>
  <text class="shared-versus-isolated-desc shared-versus-isolated-row shared-versus-isolated-r3" x="526" y="284">Delete the folder to undo everything</text>
  <text class="shared-versus-isolated-desc shared-versus-isolated-row shared-versus-isolated-r4" x="526" y="318">No administrator rights needed</text>
  <text class="shared-versus-isolated-sub" x="30" y="372">This is dependency hell and its cure, in one picture. Python shipped without the cure for its first sixteen years, which is why every later tool is a variation on the same fix.</text>
</svg>
