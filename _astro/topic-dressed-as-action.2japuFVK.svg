<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label=""Build up my understanding of evals".">
  <title>The phrasing that fools a naive check</title>
  <style>
    .topic-dressed-as-action-bg   { fill: #f8fafc; }
    .topic-dressed-as-action-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .topic-dressed-as-action-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .topic-dressed-as-action-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .topic-dressed-as-action-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .topic-dressed-as-action-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .topic-dressed-as-action-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .topic-dressed-as-action-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .topic-dressed-as-action-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .topic-dressed-as-action-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .topic-dressed-as-action-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .topic-dressed-as-action-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .topic-dressed-as-action-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .topic-dressed-as-action-row { opacity: 1; }
    .topic-dressed-as-action-r0 { animation-delay: 0.00s; }
    .topic-dressed-as-action-r1 { animation-delay: 0.45s; }
    .topic-dressed-as-action-r2 { animation-delay: 0.90s; }
    .topic-dressed-as-action-r3 { animation-delay: 1.35s; }
    .topic-dressed-as-action-r4 { animation-delay: 1.80s; }
    .topic-dressed-as-action-row { animation: topic-dressed-as-action-reveal 7.3s ease-in-out infinite; }
    @keyframes topic-dressed-as-action-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="topic-dressed-as-action-bg" width="980" height="390"/>
  <text class="topic-dressed-as-action-h1"  x="30" y="40">The phrasing that fools a naive check</text>
  <text class="topic-dressed-as-action-sub" x="30" y="64">"Build up my understanding of evals".</text>
  <rect class="topic-dressed-as-action-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="topic-dressed-as-action-name" x="46" y="122">A next action</text>
  <text class="topic-dressed-as-action-desc" x="46" y="142">Starts within the hour.</text>
  <text class="topic-dressed-as-action-desc topic-dressed-as-action-row topic-dressed-as-action-r0" x="46" y="182">"Port the service to two replicas"</text>
  <text class="topic-dressed-as-action-desc topic-dressed-as-action-row topic-dressed-as-action-r1" x="46" y="216">"Measure the tail latency"</text>
  <text class="topic-dressed-as-action-desc topic-dressed-as-action-row topic-dressed-as-action-r2" x="46" y="250">"Write a post about the reranking result"</text>
  <text class="topic-dressed-as-action-desc topic-dressed-as-action-row topic-dressed-as-action-r3" x="46" y="284">Produces something that did not exist</text>
  <text class="topic-dressed-as-action-desc topic-dressed-as-action-row topic-dressed-as-action-r4" x="46" y="318">You could open a terminal now</text>
  <rect class="topic-dressed-as-action-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="topic-dressed-as-action-name" x="526" y="122">A topic in disguise</text>
  <text class="topic-dressed-as-action-desc" x="526" y="142">Starts with a verb, commits to nothing.</text>
  <text class="topic-dressed-as-action-desc topic-dressed-as-action-row topic-dressed-as-action-r0" x="526" y="182">"Build up my understanding of evals"</text>
  <text class="topic-dressed-as-action-desc topic-dressed-as-action-row topic-dressed-as-action-r1" x="526" y="216">"Explore the main agent frameworks"</text>
  <text class="topic-dressed-as-action-desc topic-dressed-as-action-row topic-dressed-as-action-r2" x="526" y="250">"Get better at distributed systems"</text>
  <text class="topic-dressed-as-action-desc topic-dressed-as-action-row topic-dressed-as-action-r3" x="526" y="284">Nothing exists afterwards</text>
  <text class="topic-dressed-as-action-desc topic-dressed-as-action-row topic-dressed-as-action-r4" x="526" y="318">A first-word check waves it through</text>
  <text class="topic-dressed-as-action-sub" x="30" y="372">A check that only inspects the first word passes the whole right-hand column, which is why the rule rejects topic verbs anywhere in the phrase rather than only at the start.</text>
</svg>
