<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Portable graph formats</title>
  <style>
    .onnx-bg   { fill: #f8fafc; }
    .onnx-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .onnx-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .onnx-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .onnx-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .onnx-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .onnx-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .onnx-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .onnx-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .onnx-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .onnx-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .onnx-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .onnx-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .onnx-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .onnx-stage { opacity: 1; }

    .onnx-s0 { animation-delay: 0.00s; }
    .onnx-e0 { animation-delay: 0.00s; }
    .onnx-s1 { animation-delay: 1.28s; }
    .onnx-e1 { animation-delay: 1.28s; }
    .onnx-s2 { animation-delay: 2.56s; }
    .onnx-e2 { animation-delay: 2.56s; }
    .onnx-s3 { animation-delay: 3.84s; }
    .onnx-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .onnx-conn  { animation: onnx-trace 6.4s ease-in-out infinite; }
      .onnx-stage { animation: onnx-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes onnx-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes onnx-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .onnx-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .onnx-stage { animation: onnx-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes onnx-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="onnx-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="onnx-bg" width="980" height="322"/>
  <text class="onnx-h1"  x="30" y="40">Portable graph formats</text>
  <text class="onnx-sub" x="30" y="64">Four steps.</text>
  <g class="onnx-stage onnx-s0">
    <rect class="onnx-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="onnx-step" x="44" y="142">01</text>
    <text class="onnx-name" x="70" y="142">Trace the model's computation</text>
    <text class="onnx-desc" x="44" y="166">Producing a graph of standard</text>
    <text class="onnx-desc" x="44" y="182">operators.</text>
  </g>
  <line class="onnx-line onnx-conn onnx-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#onnx-tip)"/>
  <g class="onnx-stage onnx-s1">
    <rect class="onnx-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="onnx-step" x="280" y="142">02</text>
    <text class="onnx-name" x="306" y="142">Which is independent of the training framework</text>
    <text class="onnx-desc" x="280" y="166">So serving does not need it</text>
    <text class="onnx-desc" x="280" y="182">installed.</text>
  </g>
  <line class="onnx-line onnx-conn onnx-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#onnx-tip)"/>
  <g class="onnx-stage onnx-s2">
    <rect class="onnx-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="onnx-step" x="516" y="142">03</text>
    <text class="onnx-name" x="542" y="142">Optimise the graph</text>
    <text class="onnx-desc" x="516" y="166">Fusing operations and folding</text>
    <text class="onnx-desc" x="516" y="182">constants.</text>
  </g>
  <line class="onnx-line onnx-conn onnx-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#onnx-tip)"/>
  <g class="onnx-stage onnx-s3">
    <rect class="onnx-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="onnx-step" x="752" y="142">04</text>
    <text class="onnx-name" x="778" y="142">Then run it on a lightweight runtime</text>
    <text class="onnx-desc" x="752" y="166">Frequently several times faster.</text>
    <text class="onnx-edge" x="752" y="242">verify first</text>
  </g>
  <text class="onnx-sub" x="30" y="304">Verifying that the exported graph produces identical outputs on a test set is a required step: conversion can change numerical behaviour subtly at the edges.</text>
</svg>
