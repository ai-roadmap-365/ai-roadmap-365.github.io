<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="None sufficient alone.">
  <title>Four layers of defence</title>
  <style>
    .defence-layers-bg   { fill: #f8fafc; }
    .defence-layers-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .defence-layers-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .defence-layers-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .defence-layers-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .defence-layers-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .defence-layers-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .defence-layers-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .defence-layers-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .defence-layers-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .defence-layers-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .defence-layers-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .defence-layers-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .defence-layers-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .defence-layers-stage { opacity: 1; }

    .defence-layers-s0 { animation-delay: 0.00s; }
    .defence-layers-e0 { animation-delay: 0.00s; }
    .defence-layers-s1 { animation-delay: 1.28s; }
    .defence-layers-e1 { animation-delay: 1.28s; }
    .defence-layers-s2 { animation-delay: 2.56s; }
    .defence-layers-e2 { animation-delay: 2.56s; }
    .defence-layers-s3 { animation-delay: 3.84s; }
    .defence-layers-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .defence-layers-conn  { animation: defence-layers-trace 6.4s ease-in-out infinite; }
      .defence-layers-stage { animation: defence-layers-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes defence-layers-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes defence-layers-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .defence-layers-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .defence-layers-stage { animation: defence-layers-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes defence-layers-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="defence-layers-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="defence-layers-bg" width="980" height="322"/>
  <text class="defence-layers-h1"  x="30" y="40">Four layers of defence</text>
  <text class="defence-layers-sub" x="30" y="64">None sufficient alone.</text>
  <g class="defence-layers-stage defence-layers-s0">
    <rect class="defence-layers-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="defence-layers-step" x="44" y="142">01</text>
    <text class="defence-layers-name" x="70" y="142">Delimit and label untrusted input</text>
    <text class="defence-layers-desc" x="44" y="166">Which reduces the success rate,</text>
    <text class="defence-layers-desc" x="44" y="182">and does not eliminate it.</text>
  </g>
  <line class="defence-layers-line defence-layers-conn defence-layers-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#defence-layers-tip)"/>
  <g class="defence-layers-stage defence-layers-s1">
    <rect class="defence-layers-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="defence-layers-step" x="280" y="142">02</text>
    <text class="defence-layers-name" x="306" y="142">Limit what the model can do</text>
    <text class="defence-layers-desc" x="280" y="166">Least privilege on every tool.</text>
    <text class="defence-layers-desc" x="280" y="182">The most effective layer.</text>
  </g>
  <line class="defence-layers-line defence-layers-conn defence-layers-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#defence-layers-tip)"/>
  <g class="defence-layers-stage defence-layers-s2">
    <rect class="defence-layers-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="defence-layers-step" x="516" y="142">03</text>
    <text class="defence-layers-name" x="542" y="142">Check the output before acting on it</text>
    <text class="defence-layers-desc" x="516" y="166">Especially anything containing a</text>
    <text class="defence-layers-desc" x="516" y="182">URL or a command.</text>
  </g>
  <line class="defence-layers-line defence-layers-conn defence-layers-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#defence-layers-tip)"/>
  <g class="defence-layers-stage defence-layers-s3">
    <rect class="defence-layers-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="defence-layers-step" x="752" y="142">04</text>
    <text class="defence-layers-name" x="778" y="142">And require approval for irreversible actions</text>
    <text class="defence-layers-desc" x="752" y="166">Which is the last line, and the</text>
    <text class="defence-layers-desc" x="752" y="182">reliable one.</text>
  </g>
  <text class="defence-layers-sub" x="30" y="304">Privilege limitation does more than every filtering technique combined, because it changes the consequence of a successful injection rather than its probability.</text>
</svg>
