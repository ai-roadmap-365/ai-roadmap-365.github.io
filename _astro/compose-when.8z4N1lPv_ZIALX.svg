<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And three things not to believe about it.">
  <title>Where Compose belongs</title>
  <style>
    .compose-when-bg   { fill: #f8fafc; }
    .compose-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compose-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compose-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compose-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compose-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compose-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .compose-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .compose-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .compose-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .compose-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .compose-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .compose-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .compose-when-row { opacity: 1; }
    .compose-when-r0 { animation-delay: 0.00s; }
    .compose-when-r1 { animation-delay: 0.45s; }
    .compose-when-r2 { animation-delay: 0.90s; }
    .compose-when-r3 { animation-delay: 1.35s; }
    .compose-when-r4 { animation-delay: 1.80s; }
    .compose-when-row { animation: compose-when-reveal 7.3s ease-in-out infinite; }
    @keyframes compose-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="compose-when-bg" width="980" height="390"/>
  <text class="compose-when-h1"  x="30" y="40">Where Compose belongs</text>
  <text class="compose-when-sub" x="30" y="64">And three things not to believe about it.</text>
  <rect class="compose-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="compose-when-name" x="46" y="122">Use it</text>
  <text class="compose-when-desc" x="46" y="142">Its home ground.</text>
  <text class="compose-when-desc compose-when-row compose-when-r0" x="46" y="182">Local development of anything multi-process</text>
  <text class="compose-when-desc compose-when-row compose-when-r1" x="46" y="216">CI, to stand up integration dependencies</text>
  <text class="compose-when-desc compose-when-row compose-when-r2" x="46" y="250">A small single-host deployment</text>
  <text class="compose-when-desc compose-when-row compose-when-r3" x="46" y="284">Where restart downtime is acceptable</text>
  <text class="compose-when-desc compose-when-row compose-when-r4" x="46" y="318">With real healthchecks and conditions</text>
  <rect class="compose-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="compose-when-name" x="526" y="122">Do not</text>
  <text class="compose-when-desc" x="526" y="142">Three misuses.</text>
  <text class="compose-when-desc compose-when-row compose-when-r0" x="526" y="182">Where uptime matters — one failure domain</text>
  <text class="compose-when-desc compose-when-row compose-when-r1" x="526" y="216">deploy.replicas is not horizontal scaling</text>
  <text class="compose-when-desc compose-when-row compose-when-r2" x="526" y="250">Publishing a port you do not need published</text>
  <text class="compose-when-desc compose-when-row compose-when-r3" x="526" y="284">The internal network is already there</text>
  <text class="compose-when-desc compose-when-row compose-when-r4" x="526" y="318">And CI is where the missing condition bites</text>
  <text class="compose-when-sub" x="30" y="372">CI deserves its own line because it is the environment where everything starts cold: the missing condition that never fails on a warm laptop fails there reliably, and gets filed under the wrong heading.</text>
</svg>
