<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Atomic Multi File Feature Synchronization">
  <title>Atomic Multi File Feature Synchronization</title>
  <defs>
    <style>
      .d308f-bg { fill: #f8fafc; }
      .d308f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d308f-mod { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d308f-api { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d308f-ser { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 8px; }
      .d308f-tst { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d308f-doc { fill: #f1f5f9; stroke: #64748b; stroke-width: 2px; rx: 8px; }
      .d308f-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d308f-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d308f-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d308f-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d308f-bg" />
  
  <text x="40" y="40" class="d308a-title">Atomic Multi-File Feature Synchronization</text>
  <text x="40" y="65" class="d308a-subtitle">Atomic Multi File Feature Synchronization diagram showing Models, API Endpoints, Serializers, Unit Tests, and Docs modified simultaneously</text>
  
  <!-- File 1: Data Model -->
  <rect x="40" y="110" width="150" height="260" class="d308f-mod" />
  <text x="50" y="140" class="d308f-header" fill="#1d4ed8">1. Data Model</text>
  <text x="50" y="170" class="d308f-text">📁 `src/models.py`</text>
  <text x="50" y="200" class="d308f-text">• New table column</text>
  <text x="50" y="220" class="d308f-text">• Database types</text>
  <text x="50" y="240" class="d308f-text">• Foreign keys</text>
  
  <!-- File 2: Serializer -->
  <rect x="210" y="110" width="150" height="260" class="d308f-ser" />
  <text x="220" y="140" class="d308f-header" fill="#a16207">2. Serializer / Schema</text>
  <text x="220" y="170" class="d308f-text">📁 `src/schemas.py`</text>
  <text x="220" y="200" class="d308f-text">• Pydantic schema</text>
  <text x="220" y="220" class="d308f-text">• Type validation</text>
  <text x="220" y="240" class="d308f-text">• JSON export</text>
  
  <!-- File 3: API Endpoint -->
  <rect x="380" y="110" width="150" height="260" class="d308f-api" />
  <text x="390" y="140" class="d308f-header" fill="#7e22ce">3. API Route</text>
  <text x="390" y="170" class="d308f-text">📁 `src/routes.py`</text>
  <text x="390" y="200" class="d308f-text">• HTTP endpoint</text>
  <text x="390" y="220" class="d308f-text">• Route handler</text>
  <text x="390" y="240" class="d308f-text">• Error status codes</text>
  
  <!-- File 4: Tests -->
  <rect x="550" y="110" width="150" height="260" class="d308f-tst" />
  <text x="560" y="140" class="d308f-header" fill="#15803d">4. Unit &amp; Int Tests</text>
  <text x="560" y="170" class="d308f-text">📁 `tests/test_api.py`</text>
  <text x="560" y="200" class="d308f-text">• Endpoint tests</text>
  <text x="560" y="220" class="d308f-text">• Edge case inputs</text>
  <text x="560" y="240" class="d308f-text">• 100% assertions</text>
  
  <!-- File 5: Documentation -->
  <rect x="720" y="110" width="145" height="260" class="d308f-doc" />
  <text x="730" y="140" class="d308f-header" fill="#0f172a">5. OpenAPI &amp; Docs</text>
  <text x="730" y="170" class="d308f-text">📁 `docs/API.md`</text>
  <text x="730" y="200" class="d308f-text">• Endpoint spec</text>
  <text x="730" y="220" class="d308f-text">• Example payloads</text>
  <text x="730" y="240" class="d308f-text">• Walkthrough notes</text>
</svg>