<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are costs.">
  <title>Four consequences of validation choice</title>
  <style>
    .cv-implications-bg   { fill: #f8fafc; }
    .cv-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cv-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cv-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cv-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cv-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cv-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cv-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cv-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cv-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cv-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cv-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cv-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cv-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cv-implications-stage { opacity: 1; }

    .cv-implications-s0 { animation-delay: 0.00s; }
    .cv-implications-e0 { animation-delay: 0.00s; }
    .cv-implications-s1 { animation-delay: 1.28s; }
    .cv-implications-e1 { animation-delay: 1.28s; }
    .cv-implications-s2 { animation-delay: 2.56s; }
    .cv-implications-e2 { animation-delay: 2.56s; }
    .cv-implications-s3 { animation-delay: 3.84s; }
    .cv-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cv-implications-conn  { animation: cv-implications-trace 6.4s ease-in-out infinite; }
      .cv-implications-stage { animation: cv-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cv-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cv-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cv-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cv-implications-stage { animation: cv-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cv-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cv-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cv-implications-bg" width="980" height="322"/>
  <text class="cv-implications-h1"  x="30" y="40">Four consequences of validation choice</text>
  <text class="cv-implications-sub" x="30" y="64">Two are costs.</text>
  <g class="cv-implications-stage cv-implications-s0">
    <rect class="cv-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cv-implications-step" x="44" y="142">01</text>
    <text class="cv-implications-name" x="70" y="142">Model decisions become defensible</text>
    <text class="cv-implications-desc" x="44" y="166">Backed by an estimate with a</text>
    <text class="cv-implications-desc" x="44" y="182">known spread.</text>
  </g>
  <line class="cv-implications-line cv-implications-conn cv-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cv-implications-tip)"/>
  <g class="cv-implications-stage cv-implications-s1">
    <rect class="cv-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cv-implications-step" x="280" y="142">02</text>
    <text class="cv-implications-name" x="306" y="142">But it multiplies training cost by the fold count</text>
    <text class="cv-implications-desc" x="280" y="166">And nested validation multiplies</text>
    <text class="cv-implications-desc" x="280" y="182">it again.</text>
  </g>
  <line class="cv-implications-line cv-implications-conn cv-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cv-implications-tip)"/>
  <g class="cv-implications-stage cv-implications-s2">
    <rect class="cv-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cv-implications-step" x="516" y="142">03</text>
    <text class="cv-implications-name" x="542" y="142">Fold variance tells you how reliable the estimate is</text>
    <text class="cv-implications-desc" x="516" y="166">Which a single split cannot.</text>
  </g>
  <line class="cv-implications-line cv-implications-conn cv-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cv-implications-tip)"/>
  <g class="cv-implications-stage cv-implications-s3">
    <rect class="cv-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cv-implications-step" x="752" y="142">04</text>
    <text class="cv-implications-name" x="778" y="142">And a leaked split produces a confident wrong number</text>
    <text class="cv-implications-desc" x="752" y="166">Which is worse than no number at</text>
    <text class="cv-implications-desc" x="752" y="182">all.</text>
  </g>
  <text class="cv-implications-sub" x="30" y="304">A confident wrong number being worse than none is not rhetorical: it gets acted on, and the failure surfaces only after deployment.</text>
</svg>
