<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The shape of the whole course.">
  <title>Four layers that stack, two that wrap</title>
  <style>
    .six-weeks-one-system-bg   { fill: #f8fafc; }
    .six-weeks-one-system-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .six-weeks-one-system-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .six-weeks-one-system-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .six-weeks-one-system-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .six-weeks-one-system-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .six-weeks-one-system-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .six-weeks-one-system-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .six-weeks-one-system-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .six-weeks-one-system-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .six-weeks-one-system-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .six-weeks-one-system-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .six-weeks-one-system-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .six-weeks-one-system-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .six-weeks-one-system-stage { opacity: 1; }

    .six-weeks-one-system-s0 { animation-delay: 0.00s; }
    .six-weeks-one-system-e0 { animation-delay: 0.00s; }
    .six-weeks-one-system-s1 { animation-delay: 1.28s; }
    .six-weeks-one-system-e1 { animation-delay: 1.28s; }
    .six-weeks-one-system-s2 { animation-delay: 2.56s; }
    .six-weeks-one-system-e2 { animation-delay: 2.56s; }
    .six-weeks-one-system-s3 { animation-delay: 3.84s; }
    .six-weeks-one-system-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .six-weeks-one-system-conn  { animation: six-weeks-one-system-trace 6.4s ease-in-out infinite; }
      .six-weeks-one-system-stage { animation: six-weeks-one-system-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes six-weeks-one-system-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes six-weeks-one-system-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .six-weeks-one-system-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .six-weeks-one-system-stage { animation: six-weeks-one-system-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes six-weeks-one-system-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="six-weeks-one-system-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="six-weeks-one-system-bg" width="980" height="322"/>
  <text class="six-weeks-one-system-h1"  x="30" y="40">Four layers that stack, two that wrap</text>
  <text class="six-weeks-one-system-sub" x="30" y="64">The shape of the whole course.</text>
  <g class="six-weeks-one-system-stage six-weeks-one-system-s0">
    <rect class="six-weeks-one-system-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="six-weeks-one-system-step" x="44" y="142">01</text>
    <text class="six-weeks-one-system-name" x="70" y="142">The machine</text>
    <text class="six-weeks-one-system-desc" x="44" y="166">Processor, memory, storage, the</text>
    <text class="six-weeks-one-system-desc" x="44" y="182">operating system. Everything</text>
    <text class="six-weeks-one-system-desc" x="44" y="198">runs on this.</text>
    <text class="six-weeks-one-system-edge" x="44" y="242">days 1-7</text>
  </g>
  <line class="six-weeks-one-system-line six-weeks-one-system-conn six-weeks-one-system-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#six-weeks-one-system-tip)"/>
  <g class="six-weeks-one-system-stage six-weeks-one-system-s1">
    <rect class="six-weeks-one-system-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="six-weeks-one-system-step" x="280" y="142">02</text>
    <text class="six-weeks-one-system-name" x="306" y="142">The command line</text>
    <text class="six-weeks-one-system-desc" x="280" y="166">How you drive it directly and</text>
    <text class="six-weeks-one-system-desc" x="280" y="182">repeatably. The hinge between</text>
    <text class="six-weeks-one-system-desc" x="280" y="198">you and the rest.</text>
    <text class="six-weeks-one-system-edge" x="280" y="242">days 8-14</text>
  </g>
  <line class="six-weeks-one-system-line six-weeks-one-system-conn six-weeks-one-system-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#six-weeks-one-system-tip)"/>
  <g class="six-weeks-one-system-stage six-weeks-one-system-s2">
    <rect class="six-weeks-one-system-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="six-weeks-one-system-step" x="516" y="142">03</text>
    <text class="six-weeks-one-system-name" x="542" y="142">The internet</text>
    <text class="six-weeks-one-system-desc" x="516" y="166">How your machine reaches another</text>
    <text class="six-weeks-one-system-desc" x="516" y="182">one. DNS, TCP, HTTP, TLS.</text>
    <text class="six-weeks-one-system-edge" x="516" y="242">days 15-21</text>
  </g>
  <line class="six-weeks-one-system-line six-weeks-one-system-conn six-weeks-one-system-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#six-weeks-one-system-tip)"/>
  <g class="six-weeks-one-system-stage six-weeks-one-system-s3">
    <rect class="six-weeks-one-system-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="six-weeks-one-system-step" x="752" y="142">04</text>
    <text class="six-weeks-one-system-name" x="778" y="142">APIs</text>
    <text class="six-weeks-one-system-desc" x="752" y="166">How programs agree to work</text>
    <text class="six-weeks-one-system-desc" x="752" y="182">together, on top of all of that.</text>
    <text class="six-weeks-one-system-edge" x="752" y="242">days 22-28</text>
  </g>
  <text class="six-weeks-one-system-sub" x="30" y="304">Version control (29-35) and the daily craft (36-41) are not a fifth and sixth storey. They wrap the whole structure, because you version, observe and automate at every one of these levels.</text>
</svg>
