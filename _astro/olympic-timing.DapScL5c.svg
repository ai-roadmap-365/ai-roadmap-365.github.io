<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Not asking who looked fastest.">
  <title>Olympic timing</title>
  <style>
    .olympic-timing-bg   { fill: #f8fafc; }
    .olympic-timing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .olympic-timing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .olympic-timing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .olympic-timing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .olympic-timing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .olympic-timing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .olympic-timing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .olympic-timing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .olympic-timing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .olympic-timing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .olympic-timing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .olympic-timing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .olympic-timing-row { opacity: 1; }
    .olympic-timing-r0 { animation-delay: 0.00s; }
    .olympic-timing-r1 { animation-delay: 0.45s; }
    .olympic-timing-r2 { animation-delay: 0.90s; }
    .olympic-timing-r3 { animation-delay: 1.35s; }
    .olympic-timing-r4 { animation-delay: 1.80s; }
    .olympic-timing-row { animation: olympic-timing-reveal 7.3s ease-in-out infinite; }
    @keyframes olympic-timing-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="olympic-timing-bg" width="980" height="390"/>
  <text class="olympic-timing-h1"  x="30" y="40">Olympic timing</text>
  <text class="olympic-timing-sub" x="30" y="64">Not asking who looked fastest.</text>
  <rect class="olympic-timing-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="olympic-timing-name" x="46" y="122">Instrumented</text>
  <text class="olympic-timing-desc" x="46" y="142">Reproducible measurement.</text>
  <text class="olympic-timing-desc olympic-timing-row olympic-timing-r0" x="46" y="182">Laser cameras at the finish line</text>
  <text class="olympic-timing-desc olympic-timing-row olympic-timing-r1" x="46" y="216">Wind gauges recording conditions</text>
  <text class="olympic-timing-desc olympic-timing-row olympic-timing-r2" x="46" y="250">Spectrometers testing samples</text>
  <text class="olympic-timing-desc olympic-timing-row olympic-timing-r3" x="46" y="284">Immutable, reproducible results</text>
  <text class="olympic-timing-desc olympic-timing-row olympic-timing-r4" x="46" y="318">Nobody argues about the outcome</text>
  <rect class="olympic-timing-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="olympic-timing-name" x="526" y="122">By judgement</text>
  <text class="olympic-timing-desc" x="526" y="142">Confident, and contested.</text>
  <text class="olympic-timing-desc olympic-timing-row olympic-timing-r0" x="526" y="182">"Who looked fastest?"</text>
  <text class="olympic-timing-desc olympic-timing-row olympic-timing-r1" x="526" y="216">No record of conditions</text>
  <text class="olympic-timing-desc olympic-timing-row olympic-timing-r2" x="526" y="250">No independent check</text>
  <text class="olympic-timing-desc olympic-timing-row olympic-timing-r3" x="526" y="284">Different answer from each observer</text>
  <text class="olympic-timing-desc olympic-timing-row olympic-timing-r4" x="526" y="318">And no way to compare across years</text>
  <text class="olympic-timing-sub" x="30" y="372">Comparing across years is the property that matters most for evals: a pinned baseline is what turns a score into a delta, and a delta is the only thing that says whether a change helped.</text>
</svg>
