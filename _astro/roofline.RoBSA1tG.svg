<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And which one you are in.">
  <title>Two performance regimes</title>
  <style>
    .roofline-bg   { fill: #f8fafc; }
    .roofline-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .roofline-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .roofline-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .roofline-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .roofline-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .roofline-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .roofline-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .roofline-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .roofline-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .roofline-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .roofline-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .roofline-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .roofline-row { opacity: 1; }
    .roofline-r0 { animation-delay: 0.00s; }
    .roofline-r1 { animation-delay: 0.45s; }
    .roofline-r2 { animation-delay: 0.90s; }
    .roofline-r3 { animation-delay: 1.35s; }
    .roofline-r4 { animation-delay: 1.80s; }
    .roofline-row { animation: roofline-reveal 7.3s ease-in-out infinite; }
    @keyframes roofline-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="roofline-bg" width="980" height="390"/>
  <text class="roofline-h1"  x="30" y="40">Two performance regimes</text>
  <text class="roofline-sub" x="30" y="64">And which one you are in.</text>
  <rect class="roofline-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="roofline-name" x="46" y="122">Bandwidth bound</text>
  <text class="roofline-desc" x="46" y="142">Starved for data.</text>
  <text class="roofline-desc roofline-row roofline-r0" x="46" y="182">Little arithmetic per byte read</text>
  <text class="roofline-desc roofline-row roofline-r1" x="46" y="216">Arithmetic units mostly idle</text>
  <text class="roofline-desc roofline-row roofline-r2" x="46" y="250">Normalisation, activation, softmax</text>
  <text class="roofline-desc roofline-row roofline-r3" x="46" y="284">Single-sequence generation</text>
  <text class="roofline-desc roofline-row roofline-r4" x="46" y="318">Fix by fusing kernels, not by adding compute</text>
  <rect class="roofline-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="roofline-name" x="526" y="122">Compute bound</text>
  <text class="roofline-desc" x="526" y="142">Saturating the units.</text>
  <text class="roofline-desc roofline-row roofline-r0" x="526" y="182">Much arithmetic per byte read</text>
  <text class="roofline-desc roofline-row roofline-r1" x="526" y="216">Memory keeps up</text>
  <text class="roofline-desc roofline-row roofline-r2" x="526" y="250">Large matrix multiplication</text>
  <text class="roofline-desc roofline-row roofline-r3" x="526" y="284">Batched training steps</text>
  <text class="roofline-desc roofline-row roofline-r4" x="526" y="318">Fix by better maths or lower precision</text>
  <text class="roofline-sub" x="30" y="372">Diagnosing the regime before optimising is what prevents the most common wasted effort: adding arithmetic throughput to a kernel that was waiting on memory changes nothing.</text>
</svg>
