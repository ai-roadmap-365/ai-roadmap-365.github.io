<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Predicting the optimism</title>
  <style>
    .predicted-optimism-bg   { fill: #f8fafc; }
    .predicted-optimism-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .predicted-optimism-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .predicted-optimism-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .predicted-optimism-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .predicted-optimism-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .predicted-optimism-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .predicted-optimism-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .predicted-optimism-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .predicted-optimism-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .predicted-optimism-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .predicted-optimism-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .predicted-optimism-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .predicted-optimism-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .predicted-optimism-stage { opacity: 1; }

    .predicted-optimism-s0 { animation-delay: 0.00s; }
    .predicted-optimism-e0 { animation-delay: 0.00s; }
    .predicted-optimism-s1 { animation-delay: 1.28s; }
    .predicted-optimism-e1 { animation-delay: 1.28s; }
    .predicted-optimism-s2 { animation-delay: 2.56s; }
    .predicted-optimism-e2 { animation-delay: 2.56s; }
    .predicted-optimism-s3 { animation-delay: 3.84s; }
    .predicted-optimism-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .predicted-optimism-conn  { animation: predicted-optimism-trace 6.4s ease-in-out infinite; }
      .predicted-optimism-stage { animation: predicted-optimism-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes predicted-optimism-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes predicted-optimism-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .predicted-optimism-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .predicted-optimism-stage { animation: predicted-optimism-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes predicted-optimism-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="predicted-optimism-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="predicted-optimism-bg" width="980" height="322"/>
  <text class="predicted-optimism-h1"  x="30" y="40">Predicting the optimism</text>
  <text class="predicted-optimism-sub" x="30" y="64">Four steps.</text>
  <g class="predicted-optimism-stage predicted-optimism-s0">
    <rect class="predicted-optimism-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="predicted-optimism-step" x="44" y="142">01</text>
    <text class="predicted-optimism-name" x="70" y="142">Count the candidates and the fold-to-fold noise</text>
    <text class="predicted-optimism-desc" x="44" y="166">Both known before selecting.</text>
  </g>
  <line class="predicted-optimism-line predicted-optimism-conn predicted-optimism-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#predicted-optimism-tip)"/>
  <g class="predicted-optimism-stage predicted-optimism-s1">
    <rect class="predicted-optimism-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="predicted-optimism-step" x="280" y="142">02</text>
    <text class="predicted-optimism-name" x="306" y="142">The expected maximum of many noisy draws exceeds the true best</text>
    <text class="predicted-optimism-desc" x="280" y="166">By a computable amount.</text>
  </g>
  <line class="predicted-optimism-line predicted-optimism-conn predicted-optimism-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#predicted-optimism-tip)"/>
  <g class="predicted-optimism-stage predicted-optimism-s2">
    <rect class="predicted-optimism-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="predicted-optimism-step" x="516" y="142">03</text>
    <text class="predicted-optimism-name" x="542" y="142">So write down the predicted shortfall in advance</text>
    <text class="predicted-optimism-desc" x="516" y="166">Before opening the test set.</text>
  </g>
  <line class="predicted-optimism-line predicted-optimism-conn predicted-optimism-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#predicted-optimism-tip)"/>
  <g class="predicted-optimism-stage predicted-optimism-s3">
    <rect class="predicted-optimism-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="predicted-optimism-step" x="752" y="142">04</text>
    <text class="predicted-optimism-name" x="778" y="142">Then compare prediction against measurement</text>
    <text class="predicted-optimism-desc" x="752" y="166">Which tests the method, not just</text>
    <text class="predicted-optimism-desc" x="752" y="182">the model.</text>
  </g>
  <text class="predicted-optimism-sub" x="30" y="304">Committing to a prediction before seeing the answer is what makes the exercise a genuine test, and it is the same discipline as pre-registration in research.</text>
</svg>
