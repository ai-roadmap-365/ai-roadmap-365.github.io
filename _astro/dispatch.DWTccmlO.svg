<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Command dispatch</title>
  <style>
    .dispatch-bg   { fill: #f8fafc; }
    .dispatch-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dispatch-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dispatch-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dispatch-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dispatch-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dispatch-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dispatch-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dispatch-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dispatch-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dispatch-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dispatch-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dispatch-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .dispatch-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .dispatch-stage { opacity: 1; }

    .dispatch-s0 { animation-delay: 0.00s; }
    .dispatch-e0 { animation-delay: 0.00s; }
    .dispatch-s1 { animation-delay: 1.28s; }
    .dispatch-e1 { animation-delay: 1.28s; }
    .dispatch-s2 { animation-delay: 2.56s; }
    .dispatch-e2 { animation-delay: 2.56s; }
    .dispatch-s3 { animation-delay: 3.84s; }
    .dispatch-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .dispatch-conn  { animation: dispatch-trace 6.4s ease-in-out infinite; }
      .dispatch-stage { animation: dispatch-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes dispatch-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes dispatch-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .dispatch-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .dispatch-stage { animation: dispatch-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes dispatch-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="dispatch-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="dispatch-bg" width="980" height="322"/>
  <text class="dispatch-h1"  x="30" y="40">Command dispatch</text>
  <text class="dispatch-sub" x="30" y="64">Four steps.</text>
  <g class="dispatch-stage dispatch-s0">
    <rect class="dispatch-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="dispatch-step" x="44" y="142">01</text>
    <text class="dispatch-name" x="70" y="142">Each subcommand names an operation</text>
    <text class="dispatch-desc" x="44" y="166">With its own arguments.</text>
  </g>
  <line class="dispatch-line dispatch-conn dispatch-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#dispatch-tip)"/>
  <g class="dispatch-stage dispatch-s1">
    <rect class="dispatch-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="dispatch-step" x="280" y="142">02</text>
    <text class="dispatch-name" x="306" y="142">A mapping connects the name to a function</text>
    <text class="dispatch-desc" x="280" y="166">Rather than a chain of</text>
    <text class="dispatch-desc" x="280" y="182">conditionals.</text>
  </g>
  <line class="dispatch-line dispatch-conn dispatch-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#dispatch-tip)"/>
  <g class="dispatch-stage dispatch-s2">
    <rect class="dispatch-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="dispatch-step" x="516" y="142">03</text>
    <text class="dispatch-name" x="542" y="142">Which is called with the parsed arguments</text>
    <text class="dispatch-desc" x="516" y="166">Knowing nothing about parsing.</text>
  </g>
  <line class="dispatch-line dispatch-conn dispatch-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#dispatch-tip)"/>
  <g class="dispatch-stage dispatch-s3">
    <rect class="dispatch-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="dispatch-step" x="752" y="142">04</text>
    <text class="dispatch-name" x="778" y="142">So adding a command is adding an entry</text>
    <text class="dispatch-desc" x="752" y="166">Which is what makes the tool</text>
    <text class="dispatch-desc" x="752" y="182">extensible.</text>
    <text class="dispatch-edge" x="752" y="242">one entry</text>
  </g>
  <text class="dispatch-sub" x="30" y="304">Separating dispatch from the operations is what keeps each function testable on its own, without constructing command-line arguments.</text>
</svg>
