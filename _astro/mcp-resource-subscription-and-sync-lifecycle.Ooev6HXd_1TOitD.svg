<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="MCP Resource Subscription and Sync Lifecycle">
  <title>MCP Resource Subscription and Sync Lifecycle</title>
  <defs>
    <style>
      .d298f-bg { fill: #f8fafc; }
      .d298f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 6px; }
      .d298f-cli { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 6px; }
      .d298f-srv { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 6px; }
      .d298f-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d298f-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d298f-header { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
      .d298f-msg { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #1e293b; }
      .d298f-flow { stroke: #3b82f6; stroke-width: 2px; fill: none; }
      .d298f-resp { stroke: #22c55e; stroke-width: 2px; stroke-dasharray: 4,4; fill: none; }
      .d298f-notif { stroke: #eab308; stroke-width: 2px; fill: none; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d298f-bg" />
  
  <text x="40" y="40" class="d298f-title">MCP Resource Subscription &amp; Update Flow</text>
  <text x="40" y="65" class="d298f-subtitle">MCP Resource Subscription and Sync Lifecycle sequence diagram showing resource discovery, read request, client subscription, update notification, and cache refresh</text>
  
  <rect x="80" y="100" width="160" height="50" class="d298f-cli" />
  <text x="120" y="130" class="d298f-header" fill="#1d4ed8">MCP Client</text>
  
  <rect x="660" y="100" width="160" height="50" class="d298f-srv" />
  <text x="700" y="130" class="d298f-header" fill="#15803d">MCP Server</text>
  
  <line x1="160" y1="150" x2="160" y2="400" stroke="#cbd5e1" stroke-width="2" />
  <line x1="740" y1="150" x2="740" y2="400" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- 1. List Resources -->
  <line x1="160" y1="180" x2="740" y2="180" class="d298f-flow" />
  <text x="280" y="175" class="d298f-msg">1. request: {"method": "resources/list"}</text>
  
  <line x1="740" y1="210" x2="160" y2="210" class="d298f-resp" />
  <text x="280" y="205" class="d298f-msg">2. response: [{"uri": "memo://notes", "mimeType": "text/plain"}]</text>
  
  <!-- 2. Subscribe -->
  <line x1="160" y1="250" x2="740" y2="250" class="d298f-flow" />
  <text x="280" y="245" class="d298f-msg">3. request: {"method": "resources/subscribe", "params": {"uri": "memo://notes"}}</text>
  
  <line x1="740" y1="280" x2="160" y2="280" class="d298f-resp" />
  <text x="280" y="275" class="d298f-msg">4. response: {"result": {}} (Subscription Active)</text>
  
  <!-- 3. Server-Push Notification on File Change -->
  <line x1="740" y1="320" x2="160" y2="320" class="d298f-notif" />
  <text x="280" y="315" class="d298f-msg" fill="#ca8a04">5. NOTIFY: {"method": "notifications/resources/updated", "uri": "memo://notes"}</text>
  
  <!-- 4. Client Re-fetch -->
  <line x1="160" y1="360" x2="740" y2="360" class="d298f-flow" />
  <text x="280" y="355" class="d298f-msg">6. request: {"method": "resources/read", "params": {"uri": "memo://notes"}}</text>
  
  <line x1="740" y1="390" x2="160" y2="390" class="d298f-resp" />
  <text x="280" y="385" class="d298f-msg">7. response: {"contents": [{"text": "Updated content...", "uri": "memo://notes"}]}</text>
</svg>