<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each trading something.">
  <title>Three convolution variants</title>
  <style>
    .conv-variants-bg   { fill: #f8fafc; }
    .conv-variants-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-variants-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-variants-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-variants-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-variants-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-variants-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .conv-variants-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .conv-variants-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .conv-variants-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .conv-variants-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .conv-variants-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .conv-variants-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .conv-variants-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .conv-variants-stage { opacity: 1; }

    .conv-variants-s0 { animation-delay: 0.00s; }
    .conv-variants-e0 { animation-delay: 0.00s; }
    .conv-variants-s1 { animation-delay: 1.50s; }
    .conv-variants-e1 { animation-delay: 1.50s; }
    .conv-variants-s2 { animation-delay: 3.00s; }
    .conv-variants-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .conv-variants-conn  { animation: conv-variants-trace 6s ease-in-out infinite; }
      .conv-variants-stage { animation: conv-variants-arrive 6s ease-in-out infinite; }
    }
    @keyframes conv-variants-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes conv-variants-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .conv-variants-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .conv-variants-stage { animation: conv-variants-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes conv-variants-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="conv-variants-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="conv-variants-bg" width="980" height="322"/>
  <text class="conv-variants-h1"  x="30" y="40">Three convolution variants</text>
  <text class="conv-variants-sub" x="30" y="64">Each trading something.</text>
  <g class="conv-variants-stage conv-variants-s0">
    <rect class="conv-variants-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="conv-variants-step" x="44" y="142">01</text>
    <text class="conv-variants-name" x="70" y="142">Standard</text>
    <text class="conv-variants-desc" x="44" y="166">Spatial filtering and channel mixing in one</text>
    <text class="conv-variants-desc" x="44" y="182">operation. The default.</text>
  </g>
  <line class="conv-variants-line conv-variants-conn conv-variants-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#conv-variants-tip)"/>
  <g class="conv-variants-stage conv-variants-s1">
    <rect class="conv-variants-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="conv-variants-step" x="359" y="142">02</text>
    <text class="conv-variants-name" x="385" y="142">Depthwise separable</text>
    <text class="conv-variants-desc" x="359" y="166">Split them: spatial per channel, then mixing.</text>
    <text class="conv-variants-desc" x="359" y="182">Far fewer parameters.</text>
    <text class="conv-variants-edge" x="359" y="242">mobile</text>
  </g>
  <line class="conv-variants-line conv-variants-conn conv-variants-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#conv-variants-tip)"/>
  <g class="conv-variants-stage conv-variants-s2">
    <rect class="conv-variants-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="conv-variants-step" x="674" y="142">03</text>
    <text class="conv-variants-name" x="700" y="142">Transposed</text>
    <text class="conv-variants-desc" x="674" y="166">Increases resolution rather than reducing it.</text>
    <text class="conv-variants-desc" x="674" y="182">For generation and segmentation.</text>
  </g>
  <text class="conv-variants-sub" x="30" y="304">Depthwise separable convolution is the operation that made vision practical on phones: it does the same two jobs in sequence rather than together, for a fraction of the multiply-accumulates.</text>
</svg>
