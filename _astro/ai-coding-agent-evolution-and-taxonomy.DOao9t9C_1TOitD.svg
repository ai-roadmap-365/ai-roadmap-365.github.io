<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="AI Coding Agent Evolution and Taxonomy">
  <title>AI Coding Agent Evolution and Taxonomy</title>
  <defs>
    <style>
      .d302a-bg { fill: #f8fafc; }
      .d302a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d302a-gen1 { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d302a-gen2 { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d302a-gen3 { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d302a-gen4 { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 8px; }
      .d302a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d302a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d302a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d302a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d302a-bg" />
  
  <text x="40" y="40" class="d302a-title">The Evolution of AI Coding Tools: 4 Architectural Generations</text>
  <text x="40" y="65" class="d302a-subtitle">AI Coding Agent Evolution and Taxonomy diagram comparing Line Completion, Chat In-Editor, Agentic IDE, Terminal Pair Programmer, and Autonomous Background Agent</text>
  
  <!-- Gen 1: Tab Autocomplete -->
  <rect x="40" y="100" width="190" height="300" class="d302a-gen1" />
  <text x="55" y="130" class="d302a-header" fill="#1d4ed8">Gen 1: Tab Completion</text>
  <text x="55" y="155" class="d302a-text">• Examples: Copilot (2021)</text>
  <text x="55" y="175" class="d302a-text">• Scope: Active line/block</text>
  <text x="55" y="195" class="d302a-text">• Context: Surrounding lines</text>
  <text x="55" y="215" class="d302a-text">• Tools: None (pure text)</text>
  <text x="55" y="245" class="d302a-text" font-weight="600">Strengths:</text>
  <text x="55" y="265" class="d302a-text">Ultra-fast sub-100ms</text>
  <text x="55" y="280" class="d302a-text">Ghost text ergonomics</text>
  <text x="55" y="310" class="d302a-text" font-weight="600">Limitations:</text>
  <text x="55" y="330" class="d302a-text">Cannot edit multiple files</text>
  <text x="55" y="345" class="d302a-text">No terminal/test loops</text>
  
  <!-- Gen 2: Chat & Inline Diff -->
  <rect x="255" y="100" width="190" height="300" class="d302a-gen2" />
  <text x="270" y="130" class="d302a-header" fill="#15803d">Gen 2: In-Editor Chat</text>
  <text x="270" y="155" class="d302a-text">• Examples: Copilot Chat</text>
  <text x="270" y="175" class="d302a-text">• Scope: Selected function</text>
  <text x="270" y="195" class="d302a-text">• Context: @file mentions</text>
  <text x="270" y="215" class="d302a-text">• Tools: Inline diff apply</text>
  <text x="270" y="245" class="d302a-text" font-weight="600">Strengths:</text>
  <text x="270" y="265" class="d302a-text">Explains complex code</text>
  <text x="270" y="280" class="d302a-text">Refactors single files</text>
  <text x="270" y="310" class="d302a-text" font-weight="600">Limitations:</text>
  <text x="270" y="330" class="d302a-text">Requires manual copy-paste</text>
  <text x="270" y="345" class="d302a-text">Passive assistance only</text>
  
  <!-- Gen 3: Agentic IDEs & CLI -->
  <rect x="470" y="100" width="190" height="300" class="d302a-gen3" />
  <text x="485" y="130" class="d302a-header" fill="#7e22ce">Gen 3: Agentic IDE/CLI</text>
  <text x="485" y="155" class="d302a-text">• Cursor, Windsurf, Aider</text>
  <text x="485" y="175" class="d302a-text">• Scope: Entire codebase</text>
  <text x="485" y="195" class="d302a-text">• Context: AST + LSP repo-map</text>
  <text x="485" y="215" class="d302a-text">• Tools: File edits, Terminal,</text>
  <text x="485" y="230" class="d302a-text">  Test runners, Git ops</text>
  <text x="485" y="255" class="d302a-text" font-weight="600">Strengths:</text>
  <text x="485" y="275" class="d302a-text">Multi-file auto edits</text>
  <text x="485" y="290" class="d302a-text">Self-corrects test errors</text>
  <text x="485" y="320" class="d302a-text" font-weight="600">Limitations:</text>
  <text x="485" y="340" class="d302a-text">Requires developer oversight</text>
  
  <!-- Gen 4: Autonomous Background -->
  <rect x="685" y="100" width="180" height="300" class="d302a-gen4" />
  <text x="700" y="130" class="d302a-header" fill="#a16207">Gen 4: Headless SWE</text>
  <text x="700" y="155" class="d302a-text">• Devin, SWE-agent, CI</text>
  <text x="700" y="175" class="d302a-text">• Scope: GitHub Issue to PR</text>
  <text x="700" y="195" class="d302a-text">• Context: Full environment</text>
  <text x="700" y="215" class="d302a-text">• Tools: Docker sandbox,</text>
  <text x="700" y="230" class="d302a-text">  Browser, CI pipelines</text>
  <text x="700" y="255" class="d302a-text" font-weight="600">Strengths:</text>
  <text x="700" y="275" class="d302a-text">End-to-end bug fixing</text>
  <text x="700" y="290" class="d302a-text">Runs asynchronously</text>
  <text x="700" y="320" class="d302a-text" font-weight="600">Limitations:</text>
  <text x="700" y="340" class="d302a-text">Higher token costs / turn</text>
</svg>