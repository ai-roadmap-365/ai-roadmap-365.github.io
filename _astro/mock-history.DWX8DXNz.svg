<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward the boundary.">
  <title>Four steps in test isolation</title>
  <style>
    .mock-history-bg   { fill: #f8fafc; }
    .mock-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mock-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mock-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mock-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mock-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mock-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mock-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mock-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mock-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mock-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mock-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mock-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .mock-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .mock-history-stage { opacity: 1; }

    .mock-history-s0 { animation-delay: 0.00s; }
    .mock-history-e0 { animation-delay: 0.00s; }
    .mock-history-s1 { animation-delay: 1.28s; }
    .mock-history-e1 { animation-delay: 1.28s; }
    .mock-history-s2 { animation-delay: 2.56s; }
    .mock-history-e2 { animation-delay: 2.56s; }
    .mock-history-s3 { animation-delay: 3.84s; }
    .mock-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .mock-history-conn  { animation: mock-history-trace 6.4s ease-in-out infinite; }
      .mock-history-stage { animation: mock-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes mock-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes mock-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .mock-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .mock-history-stage { animation: mock-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes mock-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="mock-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="mock-history-bg" width="980" height="322"/>
  <text class="mock-history-h1"  x="30" y="40">Four steps in test isolation</text>
  <text class="mock-history-sub" x="30" y="64">Toward the boundary.</text>
  <g class="mock-history-stage mock-history-s0">
    <rect class="mock-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="mock-history-step" x="44" y="142">01</text>
    <text class="mock-history-name" x="70" y="142">Tests hit the real database and network</text>
    <text class="mock-history-desc" x="44" y="166">Slow, flaky and occasionally</text>
    <text class="mock-history-desc" x="44" y="182">destructive.</text>
  </g>
  <line class="mock-history-line mock-history-conn mock-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#mock-history-tip)"/>
  <g class="mock-history-stage mock-history-s1">
    <rect class="mock-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="mock-history-step" x="280" y="142">02</text>
    <text class="mock-history-name" x="306" y="142">Then hand-written stubs</text>
    <text class="mock-history-desc" x="280" y="166">Explicit, and tedious to</text>
    <text class="mock-history-desc" x="280" y="182">maintain.</text>
  </g>
  <line class="mock-history-line mock-history-conn mock-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#mock-history-tip)"/>
  <g class="mock-history-stage mock-history-s2">
    <rect class="mock-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="mock-history-step" x="516" y="142">03</text>
    <text class="mock-history-name" x="542" y="142">Then mocking frameworks</text>
    <text class="mock-history-desc" x="516" y="166">Powerful, and easy to overuse.</text>
  </g>
  <line class="mock-history-line mock-history-conn mock-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#mock-history-tip)"/>
  <g class="mock-history-stage mock-history-s3">
    <rect class="mock-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="mock-history-step" x="752" y="142">04</text>
    <text class="mock-history-name" x="778" y="142">And a return to lightweight fakes</text>
    <text class="mock-history-desc" x="752" y="166">Which test behaviour rather than</text>
    <text class="mock-history-desc" x="752" y="182">calls.</text>
  </g>
  <text class="mock-history-sub" x="30" y="304">The return to fakes reflects experience: a fake in-memory implementation gives most of the speed with far less coupling than an interaction mock.</text>
</svg>
