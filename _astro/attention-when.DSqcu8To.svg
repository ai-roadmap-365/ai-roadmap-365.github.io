<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And its one hard constraint.">
  <title>Where attention belongs</title>
  <style>
    .attention-when-bg   { fill: #f8fafc; }
    .attention-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .attention-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .attention-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .attention-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .attention-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .attention-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .attention-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .attention-when-row { opacity: 1; }
    .attention-when-r0 { animation-delay: 0.00s; }
    .attention-when-r1 { animation-delay: 0.45s; }
    .attention-when-r2 { animation-delay: 0.90s; }
    .attention-when-r3 { animation-delay: 1.35s; }
    .attention-when-r4 { animation-delay: 1.80s; }
    .attention-when-row { animation: attention-when-reveal 7.3s ease-in-out infinite; }
    @keyframes attention-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="attention-when-bg" width="980" height="390"/>
  <text class="attention-when-h1"  x="30" y="40">Where attention belongs</text>
  <text class="attention-when-sub" x="30" y="64">And its one hard constraint.</text>
  <rect class="attention-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="attention-when-name" x="46" y="122">Use it</text>
  <text class="attention-when-desc" x="46" y="142">Nearly everywhere.</text>
  <text class="attention-when-desc attention-when-row attention-when-r0" x="46" y="182">Language modelling and understanding</text>
  <text class="attention-when-desc attention-when-row attention-when-r1" x="46" y="216">Vision, as patch sequences</text>
  <text class="attention-when-desc attention-when-row attention-when-r2" x="46" y="250">Audio, video and code</text>
  <text class="attention-when-desc attention-when-row attention-when-r3" x="46" y="284">Cross-modal conditioning</text>
  <text class="attention-when-desc attention-when-row attention-when-r4" x="46" y="318">The default for sequence modelling</text>
  <rect class="attention-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="attention-when-name" x="526" y="122">The hard limit</text>
  <text class="attention-when-desc" x="526" y="142">Memory.</text>
  <text class="attention-when-desc attention-when-row attention-when-r0" x="526" y="182">Quadratic buffers on tiny devices</text>
  <text class="attention-when-desc attention-when-row attention-when-r1" x="526" y="216">Microcontrollers with kilobytes of RAM</text>
  <text class="attention-when-desc attention-when-row attention-when-r2" x="526" y="250">Extremely long sequences without tiling</text>
  <text class="attention-when-desc attention-when-row attention-when-r3" x="526" y="284">Streaming with unbounded input</text>
  <text class="attention-when-desc attention-when-row attention-when-r4" x="526" y="318">Recurrence still wins there</text>
  <text class="attention-when-sub" x="30" y="372">The streaming case remains genuinely unsolved by attention: an unbounded input with bounded memory is a recurrent problem, which is why state space models keep attracting attention.</text>
</svg>
