<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four checks, in order.">
  <title>Triaging a TTFT alert</title>
  <style>
    .ttft-playbook-bg   { fill: #f8fafc; }
    .ttft-playbook-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ttft-playbook-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ttft-playbook-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ttft-playbook-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ttft-playbook-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ttft-playbook-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ttft-playbook-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ttft-playbook-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ttft-playbook-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ttft-playbook-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ttft-playbook-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ttft-playbook-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .ttft-playbook-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .ttft-playbook-stage { opacity: 1; }

    .ttft-playbook-s0 { animation-delay: 0.00s; }
    .ttft-playbook-e0 { animation-delay: 0.00s; }
    .ttft-playbook-s1 { animation-delay: 1.28s; }
    .ttft-playbook-e1 { animation-delay: 1.28s; }
    .ttft-playbook-s2 { animation-delay: 2.56s; }
    .ttft-playbook-e2 { animation-delay: 2.56s; }
    .ttft-playbook-s3 { animation-delay: 3.84s; }
    .ttft-playbook-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .ttft-playbook-conn  { animation: ttft-playbook-trace 6.4s ease-in-out infinite; }
      .ttft-playbook-stage { animation: ttft-playbook-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes ttft-playbook-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes ttft-playbook-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .ttft-playbook-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ttft-playbook-stage { animation: ttft-playbook-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes ttft-playbook-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ttft-playbook-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="ttft-playbook-bg" width="980" height="322"/>
  <text class="ttft-playbook-h1"  x="30" y="40">Triaging a TTFT alert</text>
  <text class="ttft-playbook-sub" x="30" y="64">Four checks, in order.</text>
  <g class="ttft-playbook-stage ttft-playbook-s0">
    <rect class="ttft-playbook-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="ttft-playbook-step" x="44" y="142">01</text>
    <text class="ttft-playbook-name" x="70" y="142">Check ingress concurrency</text>
    <text class="ttft-playbook-desc" x="44" y="166">Did RPS exceed provisioned</text>
    <text class="ttft-playbook-desc" x="44" y="182">capacity? Scale replicas if so.</text>
  </g>
  <line class="ttft-playbook-line ttft-playbook-conn ttft-playbook-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#ttft-playbook-tip)"/>
  <g class="ttft-playbook-stage ttft-playbook-s1">
    <rect class="ttft-playbook-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="ttft-playbook-step" x="280" y="142">02</text>
    <text class="ttft-playbook-name" x="306" y="142">Inspect the KV cache</text>
    <text class="ttft-playbook-desc" x="280" y="166">num_requests_waiting above zero</text>
    <text class="ttft-playbook-desc" x="280" y="182">means VRAM is exhausted, not</text>
    <text class="ttft-playbook-desc" x="280" y="198">compute.</text>
    <text class="ttft-playbook-edge" x="280" y="242">Day 338</text>
  </g>
  <line class="ttft-playbook-line ttft-playbook-conn ttft-playbook-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#ttft-playbook-tip)"/>
  <g class="ttft-playbook-stage ttft-playbook-s2">
    <rect class="ttft-playbook-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="ttft-playbook-step" x="516" y="142">03</text>
    <text class="ttft-playbook-name" x="542" y="142">Check prompt length distribution</text>
    <text class="ttft-playbook-desc" x="516" y="166">32k-token documents make prefill</text>
    <text class="ttft-playbook-desc" x="516" y="182">the cost, not generation.</text>
  </g>
  <line class="ttft-playbook-line ttft-playbook-conn ttft-playbook-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#ttft-playbook-tip)"/>
  <g class="ttft-playbook-stage ttft-playbook-s3">
    <rect class="ttft-playbook-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="ttft-playbook-step" x="752" y="142">04</text>
    <text class="ttft-playbook-name" x="778" y="142">Verify GPU clocks</text>
    <text class="ttft-playbook-desc" x="752" y="166">nvidia-smi performance query, to</text>
    <text class="ttft-playbook-desc" x="752" y="182">rule out thermal throttling.</text>
  </g>
  <text class="ttft-playbook-sub" x="30" y="304">Having the order written down before the alert fires is the whole value of a playbook: at 3am the natural first move is to restart something, and three of these four checks are faster and more informative.</text>
</svg>
