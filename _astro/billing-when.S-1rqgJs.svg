<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what applies from day one.">
  <title>When two-phase billing is needed</title>
  <style>
    .billing-when-bg   { fill: #f8fafc; }
    .billing-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .billing-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .billing-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .billing-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .billing-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .billing-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .billing-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .billing-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .billing-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .billing-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .billing-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .billing-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .billing-when-row { opacity: 1; }
    .billing-when-r0 { animation-delay: 0.00s; }
    .billing-when-r1 { animation-delay: 0.45s; }
    .billing-when-r2 { animation-delay: 0.90s; }
    .billing-when-r3 { animation-delay: 1.35s; }
    .billing-when-r4 { animation-delay: 1.80s; }
    .billing-when-row { animation: billing-when-reveal 7.3s ease-in-out infinite; }
    @keyframes billing-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="billing-when-bg" width="980" height="390"/>
  <text class="billing-when-h1"  x="30" y="40">When two-phase billing is needed</text>
  <text class="billing-when-sub" x="30" y="64">And what applies from day one.</text>
  <rect class="billing-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="billing-when-name" x="46" y="122">Full infrastructure</text>
  <text class="billing-when-desc" x="46" y="142">Metered and multi-tenant.</text>
  <text class="billing-when-desc billing-when-row billing-when-r0" x="46" y="182">Usage-based pricing</text>
  <text class="billing-when-desc billing-when-row billing-when-r1" x="46" y="216">Prepaid credit balances</text>
  <text class="billing-when-desc billing-when-row billing-when-r2" x="46" y="250">Multiple tenants sharing a wallet</text>
  <text class="billing-when-desc billing-when-row billing-when-r3" x="46" y="284">Public API access</text>
  <text class="billing-when-desc billing-when-row billing-when-r4" x="46" y="318">Anywhere overdraw is unrecoverable</text>
  <rect class="billing-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="billing-when-name" x="526" y="122">From day one regardless</text>
  <text class="billing-when-desc" x="526" y="142">Three cheap controls.</text>
  <text class="billing-when-desc billing-when-row billing-when-r0" x="526" y="182">Hashed keys, compared in constant time</text>
  <text class="billing-when-desc billing-when-row billing-when-r1" x="526" y="216">A hard spend cap per tenant</text>
  <text class="billing-when-desc billing-when-row billing-when-r2" x="526" y="250">Token counts recorded per request</text>
  <text class="billing-when-desc billing-when-row billing-when-r3" x="526" y="284">Even for an internal tool</text>
  <text class="billing-when-desc billing-when-row billing-when-r4" x="526" y="318">Especially for a free tier</text>
  <text class="billing-when-sub" x="30" y="372">The free tier is where this bites first: an unauthenticated or generously limited endpoint is the cheapest thing in the world to abuse, and the bill arrives regardless of who was using it.</text>
</svg>
