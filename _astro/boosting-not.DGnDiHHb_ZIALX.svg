<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What gradient boosting is not</title>
  <style>
    .boosting-not-bg   { fill: #f8fafc; }
    .boosting-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boosting-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boosting-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boosting-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boosting-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boosting-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .boosting-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .boosting-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .boosting-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .boosting-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .boosting-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .boosting-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .boosting-not-row { opacity: 1; }
    .boosting-not-r0 { animation-delay: 0.00s; }
    .boosting-not-r1 { animation-delay: 0.45s; }
    .boosting-not-r2 { animation-delay: 0.90s; }
    .boosting-not-r3 { animation-delay: 1.35s; }
    .boosting-not-r4 { animation-delay: 1.80s; }
    .boosting-not-row { animation: boosting-not-reveal 7.3s ease-in-out infinite; }
    @keyframes boosting-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="boosting-not-bg" width="980" height="390"/>
  <text class="boosting-not-h1"  x="30" y="40">What gradient boosting is not</text>
  <text class="boosting-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="boosting-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="boosting-not-name" x="46" y="122">The misconception</text>
  <text class="boosting-not-desc" x="46" y="142">Commonly held.</text>
  <text class="boosting-not-desc boosting-not-row boosting-not-r0" x="46" y="182">It is just a forest built differently</text>
  <text class="boosting-not-desc boosting-not-row boosting-not-r1" x="46" y="216">More trees are always better</text>
  <text class="boosting-not-desc boosting-not-row boosting-not-r2" x="46" y="250">Deep trees make it stronger</text>
  <text class="boosting-not-desc boosting-not-row boosting-not-r3" x="46" y="284">It cannot overfit</text>
  <text class="boosting-not-desc boosting-not-row boosting-not-r4" x="46" y="318">Deep learning has replaced it</text>
  <rect class="boosting-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="boosting-not-name" x="526" y="122">What is true</text>
  <text class="boosting-not-desc" x="526" y="142">Actually.</text>
  <text class="boosting-not-desc boosting-not-row boosting-not-r0" x="526" y="182">Sequential and bias-reducing, not parallel</text>
  <text class="boosting-not-desc boosting-not-row boosting-not-r1" x="526" y="216">Too many overfit; use early stopping</text>
  <text class="boosting-not-desc boosting-not-row boosting-not-r2" x="526" y="250">Shallow trees are the design</text>
  <text class="boosting-not-desc boosting-not-row boosting-not-r3" x="526" y="284">It overfits readily without care</text>
  <text class="boosting-not-desc boosting-not-row boosting-not-r4" x="526" y="318">It still wins on tabular data</text>
  <text class="boosting-not-sub" x="30" y="372">The overfitting difference from forests is the practically important one: adding trees to a forest is safe and adding them to a boosted model is not.</text>
</svg>
