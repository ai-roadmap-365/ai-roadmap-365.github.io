<svg role="img" aria-label="Comparison of 4 Structured Output paradigms from naive prompt instructions to Constrained Grammar CFG logit masking" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>The 4 Paradigms of Structured LLM Output</title>
  <defs>
    <linearGradient id="bg249a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card249" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg249a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">THE 4 PARADIGMS OF STRUCTURED JSON GENERATION</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">From Brittle Natural Language Prompting to Deterministic Constrained Grammar Logit Masking</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card249)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Paradigm 1: Naive Prompting -->
    <rect x="20" y="25" width="165" height="255" fill="#0f172a" stroke="#fb7185" rx="6"/>
    <text x="102" y="50" fill="#fb7185" font-size="10" font-weight="700" text-anchor="middle">1. Naive Prompting</text>
    <text x="30" y="75" fill="#cbd5e1" font-size="7">"Return valid JSON:"</text>
    <rect x="30" y="90" width="145" height="60" fill="#1e293b" rx="4"/>
    <text x="35" y="110" fill="#fb7185" font-size="7">Preamble: "Sure! {"</text>
    <text x="35" y="125" fill="#fb7185" font-size="7">Unescaped quotes</text>
    <text x="35" y="140" fill="#fb7185" font-size="7">Markdown backticks</text>
    <text x="102" y="200" fill="#fb7185" font-size="8" font-weight="700" text-anchor="middle">Reliability: 60-75%</text>
    <text x="102" y="225" fill="#94a3b8" font-size="7" text-anchor="middle">Frequent parser crash</text>

    <!-- Paradigm 2: Assistant Prefill -->
    <rect x="205" y="25" width="165" height="255" fill="#0f172a" stroke="#fbbf24" rx="6"/>
    <text x="287" y="50" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">2. Assistant Prefill</text>
    <text x="215" y="75" fill="#cbd5e1" font-size="7">Prepend "{" to output</text>
    <rect x="215" y="90" width="145" height="60" fill="#1e293b" rx="4"/>
    <text x="220" y="110" fill="#34d399" font-size="7">Forces JSON start</text>
    <text x="220" y="125" fill="#34d399" font-size="7">Eliminates preamble</text>
    <text x="220" y="140" fill="#fbbf24" font-size="7">Syntax errors possible</text>
    <text x="287" y="200" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">Reliability: 85-92%</text>
    <text x="287" y="225" fill="#94a3b8" font-size="7" text-anchor="middle">Claude / Open Weights</text>

    <!-- Paradigm 3: Pydantic + Instructor -->
    <rect x="390" y="25" width="165" height="255" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="472" y="50" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">3. Pydantic + Retries</text>
    <text x="400" y="75" fill="#cbd5e1" font-size="7">Instructor / Tool Calls</text>
    <rect x="400" y="90" width="145" height="60" fill="#1e293b" rx="4"/>
    <text x="405" y="110" fill="#38bdf8" font-size="7">Schema injection</text>
    <text x="405" y="125" fill="#38bdf8" font-size="7">Auto-retry on error</text>
    <text x="405" y="140" fill="#38bdf8" font-size="7">Type coerced output</text>
    <text x="472" y="200" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">Reliability: 98-99%</text>
    <text x="472" y="225" fill="#94a3b8" font-size="7" text-anchor="middle">Multi-turn error loop</text>

    <!-- Paradigm 4: Constrained CFG Decoding -->
    <rect x="575" y="25" width="165" height="255" fill="#0f172a" stroke="#34d399" stroke-width="2" rx="6"/>
    <text x="657" y="50" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">4. Constrained CFG</text>
    <text x="585" y="75" fill="#cbd5e1" font-size="7">Outlines / OpenAI JSON</text>
    <rect x="585" y="90" width="145" height="60" fill="#1e293b" rx="4"/>
    <text x="590" y="110" fill="#34d399" font-size="7">Logit bias masking</text>
    <text x="590" y="125" fill="#34d399" font-size="7">FSM schema validation</text>
    <text x="590" y="140" fill="#34d399" font-size="7">Mathematically 100%</text>
    <text x="657" y="200" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Reliability: 100.0%</text>
    <text x="657" y="225" fill="#34d399" font-size="7" text-anchor="middle">Zero invalid tokens!</text>
  </g>
</svg>
