<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" role="img" font-family="system-ui, sans-serif">
  <title>The architecture of a domain model: a pure domain core of value objects, entities, invariants and domain errors sits in the middle; an outer ring of adapters — the command-line interface, the repository with its CSV, JSON and SQLite file formats, and the test harness — surrounds it; every dependency arrow points inward, because the core imports nothing from the ring</title>
  <rect x="0" y="0" width="820" height="540" fill="#f8fafc"/>
  <text x="410" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">A domain model and its boundaries</text>

  <!-- Adapter ring -->
  <rect x="40" y="60" width="740" height="430" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="14"/>
  <text x="410" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Adapter ring — everything that touches the outside world</text>
  <text x="410" y="110" text-anchor="middle" font-size="14" fill="#1a202c">files, the screen, arguments, the clock, the network</text>

  <!-- Pure domain core -->
  <rect x="270" y="170" width="280" height="200" fill="#ffffff" stroke="#1a202c" stroke-width="2" rx="10"/>
  <text x="410" y="198" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Pure domain core</text>
  <text x="410" y="219" text-anchor="middle" font-size="14" fill="#1a202c">no open, no print, no json</text>
  <text x="410" y="252" text-anchor="middle" font-size="14" fill="#1d4ed8">value objects: Money, DateRange</text>
  <text x="410" y="276" text-anchor="middle" font-size="14" fill="#1d4ed8">closed sets: Category (Enum)</text>
  <text x="410" y="300" text-anchor="middle" font-size="14" fill="#1d4ed8">entities: Expense, Ledger</text>
  <text x="410" y="324" text-anchor="middle" font-size="14" fill="#1d4ed8">errors: SpendError hierarchy</text>
  <text x="410" y="350" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">every invariant enforced here</text>

  <!-- CLI adapter (left edge) -->
  <rect x="60" y="200" width="170" height="140" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="145" y="226" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">CLI adapter</text>
  <text x="145" y="252" text-anchor="middle" font-size="14" fill="#1a202c">reads arguments</text>
  <text x="145" y="274" text-anchor="middle" font-size="14" fill="#1a202c">prints the report</text>
  <text x="145" y="296" text-anchor="middle" font-size="14" fill="#1a202c">picks the exit code</text>
  <text x="145" y="322" text-anchor="middle" font-size="14" fill="#1a202c">turns errors into words</text>
  <line x1="232" y1="270" x2="266" y2="270" stroke="#1a202c" stroke-width="2"/>
  <polygon points="268,270 254,264 254,276" fill="#1a202c"/>

  <!-- Repository adapter (right edge) -->
  <rect x="590" y="176" width="170" height="112" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="675" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Repository adapter</text>
  <text x="675" y="228" text-anchor="middle" font-size="14" fill="#1a202c">save(ledger)</text>
  <text x="675" y="250" text-anchor="middle" font-size="14" fill="#1a202c">load()</text>
  <text x="675" y="274" text-anchor="middle" font-size="14" fill="#1a202c">rebuilds through the core</text>
  <line x1="588" y1="232" x2="554" y2="232" stroke="#1a202c" stroke-width="2"/>
  <polygon points="552,232 566,226 566,238" fill="#1a202c"/>

  <!-- File formats (same edge, one layer further out) -->
  <rect x="590" y="304" width="170" height="90" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="675" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">File formats</text>
  <text x="675" y="354" text-anchor="middle" font-size="14" fill="#1a202c">CSV · JSON · SQLite</text>
  <text x="675" y="378" text-anchor="middle" font-size="14" fill="#1a202c">swap without touching the core</text>
  <line x1="675" y1="302" x2="675" y2="292" stroke="#1a202c" stroke-width="2"/>
  <polygon points="675,290 669,304 681,304" fill="#1a202c"/>

  <!-- Test harness (bottom edge) -->
  <rect x="310" y="404" width="200" height="66" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="410" y="430" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Test harness</text>
  <text x="410" y="454" text-anchor="middle" font-size="14" fill="#1a202c">calls the core, creates no files</text>
  <line x1="410" y1="402" x2="410" y2="376" stroke="#1a202c" stroke-width="2"/>
  <polygon points="410,374 404,388 416,388" fill="#1a202c"/>

  <!-- Direction note -->
  <text x="150" y="392" text-anchor="middle" font-size="14" font-style="italic" fill="#1d4ed8">every arrow points inward</text>
  <text x="150" y="414" text-anchor="middle" font-size="14" font-style="italic" fill="#1d4ed8">the core imports nothing</text>
  <text x="150" y="436" text-anchor="middle" font-size="14" font-style="italic" fill="#1d4ed8">from this ring</text>

  <text x="410" y="516" text-anchor="middle" font-size="14" fill="#1a202c">Floor plan in the middle, building code enforced there, utilities connected only at the edges.</text>
</svg>
