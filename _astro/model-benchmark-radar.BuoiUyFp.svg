<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="Model Benchmark Radar Comparison">
  <title>Model Benchmark Radar Comparison</title>
  <defs>
    <style>
      .d161f-bg { fill: #f8fafc; }
      .d161f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d161f-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; }
      .d161f-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; }
      .d161f-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 13px; font-weight: 600; }
      .d161f-poly-lr { fill: rgba(37, 99, 235, 0.25); stroke: #2563eb; stroke-width: 2.5; }
      .d161f-poly-knn { fill: rgba(220, 38, 38, 0.15); stroke: #dc2626; stroke-width: 2; stroke-dasharray: 4 2; }
      .d161f-poly-nb { fill: rgba(22, 163, 74, 0.15); stroke: #16a34a; stroke-width: 2; stroke-dasharray: 2 2; }
      
      @keyframes d161f-rotate {
        0% { transform: scale(0.98); }
        100% { transform: scale(1.02); }
      }
      .d161f-pulse { animation: d161f-rotate 3s infinite alternate ease-in-out; transform-origin: 240px 260px; }
      
      @media (prefers-reduced-motion: reduce) {
        .d161f-pulse { animation: none; }
      }
    </style>
  </defs>

  <rect width="100%" height="100%" class="d161f-bg" />

  <text x="40" y="45" class="d161f-title" font-size="22">Candidate Model Multi-Metric Benchmark</text>
  <text x="40" y="70" class="d161f-text">5-Fold Stratified Cross-Validation on Breast Cancer Dataset</text>

  <!-- Left: Radar Chart -->
  <rect x="40" y="100" width="420" height="340" class="d161f-card" />
  
  <g class="d161f-pulse">
    <!-- Concentric radar polygons (5 axes: Precision, Recall, F1, ROC AUC, Speed) -->
    <polygon points="240,150 325,205 295,310 185,310 155,205" fill="none" stroke="#e2e8f0" stroke-width="1.5" />
    <polygon points="240,180 295,220 275,290 205,290 185,220" fill="none" stroke="#e2e8f0" stroke-width="1.5" />
    <polygon points="240,210 268,235 258,270 222,270 212,235" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Axis lines -->
    <line x1="240" y1="260" x2="240" y2="140" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="240" y1="260" x2="345" y2="195" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="240" y1="260" x2="305" y2="330" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="240" y1="260" x2="175" y2="330" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="240" y1="260" x2="135" y2="195" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Model 1: Logistic Regression (Winner) -->
    <polygon points="240,145 340,198 298,322 182,322 140,200" class="d161f-poly-lr" />

    <!-- Model 2: KNN -->
    <polygon points="240,165 315,215 285,305 195,305 160,210" class="d161f-poly-knn" />

    <!-- Model 3: Gaussian NB -->
    <polygon points="240,185 285,230 265,280 215,280 180,225" class="d161f-poly-nb" />
  </g>

  <!-- Axis Labels -->
  <text x="240" y="130" text-anchor="middle" class="d161f-text" font-weight="700">Precision (0.98)</text>
  <text x="355" y="195" class="d161f-text" font-weight="700">Recall (0.99)</text>
  <text x="315" y="345" class="d161f-text" font-weight="700">F1 Score (0.98)</text>
  <text x="120" y="345" class="d161f-text" font-weight="700">ROC AUC (0.99)</text>
  <text x="65" y="195" class="d161f-text" font-weight="700">Speed (&lt;1ms)</text>

  <!-- Right: Scorecard -->
  <rect x="480" y="100" width="380" height="340" class="d161f-card" />
  <text x="500" y="130" class="d161f-title" font-size="16" fill="#1e40af">Benchmark Summary Scorecard</text>

  <rect x="500" y="150" width="340" height="60" fill="#eff6ff" stroke="#bfdbfe" rx="6" />
  <text x="515" y="172" class="d161f-title" font-size="14" fill="#1d4ed8">👑 Champion: Logistic Regression (L2)</text>
  <text x="515" y="195" class="d161f-text">CV F1: 0.9839 | Test F1: 0.9861 | Speed: 0.12ms</text>

  <rect x="500" y="225" width="340" height="50" fill="#f8fafc" stroke="#cbd5e1" rx="6" />
  <text x="515" y="247" class="d161f-text" font-weight="700">Runner-Up: KNN (k=5, distance-weighted)</text>
  <text x="515" y="265" class="d161f-text" font-size="11" fill="#64748b">CV F1: 0.9754 | Slower inference on large batches</text>

  <rect x="500" y="290" width="340" height="50" fill="#f8fafc" stroke="#cbd5e1" rx="6" />
  <text x="515" y="312" class="d161f-text" font-weight="700">Baseline: Gaussian Naive Bayes</text>
  <text x="515" y="330" class="d161f-text" font-size="11" fill="#64748b">CV F1: 0.9416 | Fast, but feature correlations degrade score</text>

  <text x="500" y="380" class="d161f-text" font-weight="700">Key Engineering Decision:</text>
  <text x="500" y="405" class="d161f-text">Logistic Regression selected for production deployment due to superior F1 score, probability calibration, and sub-millisecond latency.</text>
</svg>
