<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Both ride; only one is fixable.">
  <title>A sealed shell, or wired by hand</title>
  <style>
    .scooter-or-bike-bg   { fill: #f8fafc; }
    .scooter-or-bike-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scooter-or-bike-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scooter-or-bike-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scooter-or-bike-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scooter-or-bike-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scooter-or-bike-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scooter-or-bike-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scooter-or-bike-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scooter-or-bike-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scooter-or-bike-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scooter-or-bike-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scooter-or-bike-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scooter-or-bike-row { opacity: 1; }
    .scooter-or-bike-r0 { animation-delay: 0.00s; }
    .scooter-or-bike-r1 { animation-delay: 0.45s; }
    .scooter-or-bike-r2 { animation-delay: 0.90s; }
    .scooter-or-bike-r3 { animation-delay: 1.35s; }
    .scooter-or-bike-r4 { animation-delay: 1.80s; }
    .scooter-or-bike-row { animation: scooter-or-bike-reveal 7.3s ease-in-out infinite; }
    @keyframes scooter-or-bike-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="scooter-or-bike-bg" width="980" height="390"/>
  <text class="scooter-or-bike-h1"  x="30" y="40">A sealed shell, or wired by hand</text>
  <text class="scooter-or-bike-sub" x="30" y="64">Both ride; only one is fixable.</text>
  <rect class="scooter-or-bike-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="scooter-or-bike-name" x="46" y="122">The sealed shell</text>
  <text class="scooter-or-bike-desc" x="46" y="142">Works out of the box.</text>
  <text class="scooter-or-bike-desc scooter-or-bike-row scooter-or-bike-r0" x="46" y="182">Fully assembled, in a plastic case</text>
  <text class="scooter-or-bike-desc scooter-or-bike-row scooter-or-bike-r1" x="46" y="216">No access to the wiring</text>
  <text class="scooter-or-bike-desc scooter-or-bike-row scooter-or-bike-r2" x="46" y="250">A stutter could be three different faults</text>
  <text class="scooter-or-bike-desc scooter-or-bike-row scooter-or-bike-r3" x="46" y="284">Proprietary firmware you cannot read</text>
  <text class="scooter-or-bike-desc scooter-or-bike-row scooter-or-bike-r4" x="46" y="318">Fast to start, slow to diagnose</text>
  <rect class="scooter-or-bike-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="scooter-or-bike-name" x="526" y="122">Wired by hand</text>
  <text class="scooter-or-bike-desc" x="526" y="142">You know every wire.</text>
  <text class="scooter-or-bike-desc scooter-or-bike-row scooter-or-bike-r0" x="526" y="182">Motor to controller, by you</text>
  <text class="scooter-or-bike-desc scooter-or-bike-row scooter-or-bike-r1" x="526" y="216">Every volt accounted for</text>
  <text class="scooter-or-bike-desc scooter-or-bike-row scooter-or-bike-r2" x="526" y="250">A loose wire is a ten-second fix</text>
  <text class="scooter-or-bike-desc scooter-or-bike-row scooter-or-bike-r3" x="526" y="284">Nothing hidden between you and the fault</text>
  <text class="scooter-or-bike-desc scooter-or-bike-row scooter-or-bike-r4" x="526" y="318">Slower to start, fast to diagnose</text>
  <text class="scooter-or-bike-sub" x="30" y="372">The trade is entirely about where you spend the time, and for a production system the diagnosis cost recurs while the assembly cost is paid once.</text>
</svg>
