<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A pooling problem, solved by training.">
  <title>From token vectors to sentence vectors</title>
  <style>
    .sentence-embeddings-bg   { fill: #f8fafc; }
    .sentence-embeddings-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sentence-embeddings-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sentence-embeddings-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sentence-embeddings-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sentence-embeddings-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sentence-embeddings-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sentence-embeddings-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sentence-embeddings-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sentence-embeddings-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sentence-embeddings-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sentence-embeddings-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sentence-embeddings-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .sentence-embeddings-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .sentence-embeddings-stage { opacity: 1; }

    .sentence-embeddings-s0 { animation-delay: 0.00s; }
    .sentence-embeddings-e0 { animation-delay: 0.00s; }
    .sentence-embeddings-s1 { animation-delay: 1.28s; }
    .sentence-embeddings-e1 { animation-delay: 1.28s; }
    .sentence-embeddings-s2 { animation-delay: 2.56s; }
    .sentence-embeddings-e2 { animation-delay: 2.56s; }
    .sentence-embeddings-s3 { animation-delay: 3.84s; }
    .sentence-embeddings-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .sentence-embeddings-conn  { animation: sentence-embeddings-trace 6.4s ease-in-out infinite; }
      .sentence-embeddings-stage { animation: sentence-embeddings-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes sentence-embeddings-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes sentence-embeddings-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .sentence-embeddings-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .sentence-embeddings-stage { animation: sentence-embeddings-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes sentence-embeddings-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="sentence-embeddings-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="sentence-embeddings-bg" width="980" height="322"/>
  <text class="sentence-embeddings-h1"  x="30" y="40">From token vectors to sentence vectors</text>
  <text class="sentence-embeddings-sub" x="30" y="64">A pooling problem, solved by training.</text>
  <g class="sentence-embeddings-stage sentence-embeddings-s0">
    <rect class="sentence-embeddings-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="sentence-embeddings-step" x="44" y="142">01</text>
    <text class="sentence-embeddings-name" x="70" y="142">An encoder produces one vector per token</text>
    <text class="sentence-embeddings-desc" x="44" y="166">Not one per sentence.</text>
  </g>
  <line class="sentence-embeddings-line sentence-embeddings-conn sentence-embeddings-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#sentence-embeddings-tip)"/>
  <g class="sentence-embeddings-stage sentence-embeddings-s1">
    <rect class="sentence-embeddings-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="sentence-embeddings-step" x="280" y="142">02</text>
    <text class="sentence-embeddings-name" x="306" y="142">Naive pooling works badly</text>
    <text class="sentence-embeddings-desc" x="280" y="166">Averaging a base encoder's</text>
    <text class="sentence-embeddings-desc" x="280" y="182">outputs gives poor similarity.</text>
  </g>
  <line class="sentence-embeddings-line sentence-embeddings-conn sentence-embeddings-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#sentence-embeddings-tip)"/>
  <g class="sentence-embeddings-stage sentence-embeddings-s2">
    <rect class="sentence-embeddings-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="sentence-embeddings-step" x="516" y="142">03</text>
    <text class="sentence-embeddings-name" x="542" y="142">Train with a contrastive objective</text>
    <text class="sentence-embeddings-desc" x="516" y="166">Similar pairs close, dissimilar</text>
    <text class="sentence-embeddings-desc" x="516" y="182">pairs apart.</text>
  </g>
  <line class="sentence-embeddings-line sentence-embeddings-conn sentence-embeddings-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#sentence-embeddings-tip)"/>
  <g class="sentence-embeddings-stage sentence-embeddings-s3">
    <rect class="sentence-embeddings-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="sentence-embeddings-step" x="752" y="142">04</text>
    <text class="sentence-embeddings-name" x="778" y="142">And similarity becomes meaningful</text>
    <text class="sentence-embeddings-desc" x="752" y="166">Which is what every dense</text>
    <text class="sentence-embeddings-desc" x="752" y="182">retrieval system runs on.</text>
  </g>
  <text class="sentence-embeddings-sub" x="30" y="304">The second stage surprises people: a strong encoder's averaged outputs are a poor similarity measure until the model has been trained for that objective specifically.</text>
</svg>
