<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One retrieval pass against many.">
  <title>A research agent is not RAG</title>
  <style>
    .research-or-rag-bg   { fill: #f8fafc; }
    .research-or-rag-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .research-or-rag-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .research-or-rag-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .research-or-rag-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .research-or-rag-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .research-or-rag-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .research-or-rag-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .research-or-rag-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .research-or-rag-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .research-or-rag-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .research-or-rag-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .research-or-rag-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .research-or-rag-row { opacity: 1; }
    .research-or-rag-r0 { animation-delay: 0.00s; }
    .research-or-rag-r1 { animation-delay: 0.45s; }
    .research-or-rag-r2 { animation-delay: 0.90s; }
    .research-or-rag-r3 { animation-delay: 1.35s; }
    .research-or-rag-r4 { animation-delay: 1.80s; }
    .research-or-rag-row { animation: research-or-rag-reveal 7.3s ease-in-out infinite; }
    @keyframes research-or-rag-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="research-or-rag-bg" width="980" height="390"/>
  <text class="research-or-rag-h1"  x="30" y="40">A research agent is not RAG</text>
  <text class="research-or-rag-sub" x="30" y="64">One retrieval pass against many.</text>
  <rect class="research-or-rag-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="research-or-rag-name" x="46" y="122">Standard RAG</text>
  <text class="research-or-rag-desc" x="46" y="142">One pass, static index.</text>
  <text class="research-or-rag-desc research-or-rag-row research-or-rag-r0" x="46" y="182">A single vector retrieval</text>
  <text class="research-or-rag-desc research-or-rag-row research-or-rag-r1" x="46" y="216">Over a corpus you already own</text>
  <text class="research-or-rag-desc research-or-rag-row research-or-rag-r2" x="46" y="250">Fast: hundreds of milliseconds</text>
  <text class="research-or-rag-desc research-or-rag-row research-or-rag-r3" x="46" y="284">No exploration between hops</text>
  <text class="research-or-rag-desc research-or-rag-row research-or-rag-r4" x="46" y="318">Right for question answering</text>
  <rect class="research-or-rag-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="research-or-rag-name" x="526" y="122">A research agent</text>
  <text class="research-or-rag-desc" x="526" y="142">Many passes, live sources.</text>
  <text class="research-or-rag-desc research-or-rag-row research-or-rag-r0" x="526" y="182">Iterative search across recursive hops</text>
  <text class="research-or-rag-desc research-or-rag-row research-or-rag-r1" x="526" y="216">External sources it discovers as it goes</text>
  <text class="research-or-rag-desc research-or-rag-row research-or-rag-r2" x="526" y="250">15-60 seconds per report</text>
  <text class="research-or-rag-desc research-or-rag-row research-or-rag-r3" x="526" y="284">Each hop conditioned on the last</text>
  <text class="research-or-rag-desc research-or-rag-row research-or-rag-r4" x="526" y="318">Right for a brief nobody has written</text>
  <text class="research-or-rag-sub" x="30" y="372">Conflating them is a common scoping error: RAG cannot answer a question whose sources are not already indexed, and a research agent is far too slow to sit behind a chat box.</text>
</svg>
