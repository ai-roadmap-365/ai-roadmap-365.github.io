<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Compacting a long conversation</title>
  <style>
    .compaction-bg   { fill: #f8fafc; }
    .compaction-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compaction-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compaction-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compaction-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compaction-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compaction-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .compaction-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .compaction-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .compaction-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .compaction-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .compaction-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .compaction-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .compaction-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .compaction-stage { opacity: 1; }

    .compaction-s0 { animation-delay: 0.00s; }
    .compaction-e0 { animation-delay: 0.00s; }
    .compaction-s1 { animation-delay: 1.28s; }
    .compaction-e1 { animation-delay: 1.28s; }
    .compaction-s2 { animation-delay: 2.56s; }
    .compaction-e2 { animation-delay: 2.56s; }
    .compaction-s3 { animation-delay: 3.84s; }
    .compaction-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .compaction-conn  { animation: compaction-trace 6.4s ease-in-out infinite; }
      .compaction-stage { animation: compaction-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes compaction-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes compaction-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .compaction-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .compaction-stage { animation: compaction-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes compaction-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="compaction-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="compaction-bg" width="980" height="322"/>
  <text class="compaction-h1"  x="30" y="40">Compacting a long conversation</text>
  <text class="compaction-sub" x="30" y="64">Four steps.</text>
  <g class="compaction-stage compaction-s0">
    <rect class="compaction-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="compaction-step" x="44" y="142">01</text>
    <text class="compaction-name" x="70" y="142">The conversation grows with every turn</text>
    <text class="compaction-desc" x="44" y="166">And every turn is resent in</text>
    <text class="compaction-desc" x="44" y="182">full.</text>
  </g>
  <line class="compaction-line compaction-conn compaction-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#compaction-tip)"/>
  <g class="compaction-stage compaction-s1">
    <rect class="compaction-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="compaction-step" x="280" y="142">02</text>
    <text class="compaction-name" x="306" y="142">Until it approaches the context limit</text>
    <text class="compaction-desc" x="280" y="166">Or simply becomes too expensive.</text>
  </g>
  <line class="compaction-line compaction-conn compaction-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#compaction-tip)"/>
  <g class="compaction-stage compaction-s2">
    <rect class="compaction-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="compaction-step" x="516" y="142">03</text>
    <text class="compaction-name" x="542" y="142">Summarise the older turns</text>
    <text class="compaction-desc" x="516" y="166">Keeping the recent ones</text>
    <text class="compaction-desc" x="516" y="182">verbatim.</text>
  </g>
  <line class="compaction-line compaction-conn compaction-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#compaction-tip)"/>
  <g class="compaction-stage compaction-s3">
    <rect class="compaction-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="compaction-step" x="752" y="142">04</text>
    <text class="compaction-name" x="778" y="142">And restate the system prompt</text>
    <text class="compaction-desc" x="752" y="166">Which the summary would</text>
    <text class="compaction-desc" x="752" y="182">otherwise have diluted.</text>
  </g>
  <text class="compaction-sub" x="30" y="304">Keeping recent turns verbatim while summarising older ones matters more than the summarisation quality: the immediate context is what the next answer actually depends on.</text>
</svg>
