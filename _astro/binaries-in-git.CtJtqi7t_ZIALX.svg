<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Every version of every file is kept, forever.">
  <title>Why large files ruin a repository</title>
  <style>
    .binaries-in-git-bg   { fill: #f8fafc; }
    .binaries-in-git-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .binaries-in-git-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .binaries-in-git-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .binaries-in-git-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .binaries-in-git-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .binaries-in-git-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .binaries-in-git-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .binaries-in-git-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .binaries-in-git-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .binaries-in-git-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .binaries-in-git-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .binaries-in-git-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .binaries-in-git-row { opacity: 1; }
    .binaries-in-git-r0 { animation-delay: 0.00s; }
    .binaries-in-git-r1 { animation-delay: 0.45s; }
    .binaries-in-git-r2 { animation-delay: 0.90s; }
    .binaries-in-git-r3 { animation-delay: 1.35s; }
    .binaries-in-git-r4 { animation-delay: 1.80s; }
    .binaries-in-git-row { animation: binaries-in-git-reveal 7.3s ease-in-out infinite; }
    @keyframes binaries-in-git-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="binaries-in-git-bg" width="980" height="390"/>
  <text class="binaries-in-git-h1"  x="30" y="40">Why large files ruin a repository</text>
  <text class="binaries-in-git-sub" x="30" y="64">Every version of every file is kept, forever.</text>
  <rect class="binaries-in-git-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="binaries-in-git-name" x="46" y="122">Text files</text>
  <text class="binaries-in-git-desc" x="46" y="142">Store the differences.</text>
  <text class="binaries-in-git-desc binaries-in-git-row binaries-in-git-r0" x="46" y="182">A one-line change costs about one line</text>
  <text class="binaries-in-git-desc binaries-in-git-row binaries-in-git-r1" x="46" y="216">Versions compress against each other</text>
  <text class="binaries-in-git-desc binaries-in-git-row binaries-in-git-r2" x="46" y="250">A long history stays small</text>
  <text class="binaries-in-git-desc binaries-in-git-row binaries-in-git-r3" x="46" y="284">Diffs are readable and reviewable</text>
  <text class="binaries-in-git-desc binaries-in-git-row binaries-in-git-r4" x="46" y="318">Merging is possible at all</text>
  <rect class="binaries-in-git-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="binaries-in-git-name" x="526" y="122">Large binaries</text>
  <text class="binaries-in-git-desc" x="526" y="142">Store the whole thing, each time.</text>
  <text class="binaries-in-git-desc binaries-in-git-row binaries-in-git-r0" x="526" y="182">A tiny change costs a full new copy</text>
  <text class="binaries-in-git-desc binaries-in-git-row binaries-in-git-r1" x="526" y="216">Nothing compresses against anything</text>
  <text class="binaries-in-git-desc binaries-in-git-row binaries-in-git-r2" x="526" y="250">Ten edits to a 500 MB file is 5 GB</text>
  <text class="binaries-in-git-desc binaries-in-git-row binaries-in-git-r3" x="526" y="284">Diffs are meaningless</text>
  <text class="binaries-in-git-desc binaries-in-git-row binaries-in-git-r4" x="526" y="318">And every clone downloads all of it</text>
  <text class="binaries-in-git-sub" x="30" y="372">Git LFS and DVC exist to solve exactly this: keep a small pointer in the repository and the large object somewhere built for large objects.</text>
</svg>
