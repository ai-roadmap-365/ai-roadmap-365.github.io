<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Rather than any path.">
  <title>The widest safe path</title>
  <style>
    .widest-path-bg   { fill: #f8fafc; }
    .widest-path-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .widest-path-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .widest-path-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .widest-path-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .widest-path-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .widest-path-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .widest-path-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .widest-path-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .widest-path-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .widest-path-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .widest-path-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .widest-path-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .widest-path-row { opacity: 1; }
    .widest-path-r0 { animation-delay: 0.00s; }
    .widest-path-r1 { animation-delay: 0.45s; }
    .widest-path-r2 { animation-delay: 0.90s; }
    .widest-path-r3 { animation-delay: 1.35s; }
    .widest-path-r4 { animation-delay: 1.80s; }
    .widest-path-row { animation: widest-path-reveal 7.3s ease-in-out infinite; }
    @keyframes widest-path-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="widest-path-bg" width="980" height="390"/>
  <text class="widest-path-h1"  x="30" y="40">The widest safe path</text>
  <text class="widest-path-sub" x="30" y="64">Rather than any path.</text>
  <rect class="widest-path-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="widest-path-name" x="46" y="122">Any clear path</text>
  <text class="widest-path-desc" x="46" y="142">Works, until it does not.</text>
  <text class="widest-path-desc widest-path-row widest-path-r0" x="46" y="182">Passes close to obstacles on one side</text>
  <text class="widest-path-desc widest-path-row widest-path-r1" x="46" y="216">Fine if nothing moves</text>
  <text class="widest-path-desc widest-path-row widest-path-r2" x="46" y="250">A small deviation causes a collision</text>
  <text class="widest-path-desc widest-path-row widest-path-r3" x="46" y="284">Many such paths exist</text>
  <text class="widest-path-desc widest-path-row widest-path-r4" x="46" y="318">This is any separating boundary</text>
  <rect class="widest-path-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="widest-path-name" x="526" y="122">The widest path</text>
  <text class="widest-path-desc" x="526" y="142">Robust to deviation.</text>
  <text class="widest-path-desc widest-path-row widest-path-r0" x="526" y="182">Maximum clearance on both sides</text>
  <text class="widest-path-desc widest-path-row widest-path-r1" x="526" y="216">Tolerates deviation</text>
  <text class="widest-path-desc widest-path-row widest-path-r2" x="526" y="250">Determined by the nearest obstacles only</text>
  <text class="widest-path-desc widest-path-row widest-path-r3" x="526" y="284">Exactly one such path</text>
  <text class="widest-path-desc widest-path-row widest-path-r4" x="526" y="318">This is the maximum margin</text>
  <text class="widest-path-sub" x="30" y="372">The path being determined only by the nearest obstacles is exactly the support vector property, including its fragility: move one of them and the route changes.</text>
</svg>
