<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Exact equality is for integers. Decimals need a tolerance.">
  <title>How to compare two decimals</title>
  <style>
    .float-comparison-rule-bg   { fill: #f8fafc; }
    .float-comparison-rule-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .float-comparison-rule-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .float-comparison-rule-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .float-comparison-rule-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .float-comparison-rule-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .float-comparison-rule-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .float-comparison-rule-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .float-comparison-rule-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .float-comparison-rule-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .float-comparison-rule-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .float-comparison-rule-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .float-comparison-rule-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .float-comparison-rule-row { opacity: 1; }
    .float-comparison-rule-r0 { animation-delay: 0.00s; }
    .float-comparison-rule-r1 { animation-delay: 0.45s; }
    .float-comparison-rule-r2 { animation-delay: 0.90s; }
    .float-comparison-rule-r3 { animation-delay: 1.35s; }
    .float-comparison-rule-r4 { animation-delay: 1.80s; }
    .float-comparison-rule-row { animation: float-comparison-rule-reveal 7.3s ease-in-out infinite; }
    @keyframes float-comparison-rule-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="float-comparison-rule-bg" width="980" height="390"/>
  <text class="float-comparison-rule-h1"  x="30" y="40">How to compare two decimals</text>
  <text class="float-comparison-rule-sub" x="30" y="64">Exact equality is for integers. Decimals need a tolerance.</text>
  <rect class="float-comparison-rule-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="float-comparison-rule-name" x="46" y="122">a == b</text>
  <text class="float-comparison-rule-desc" x="46" y="142">Almost always wrong for decimals</text>
  <text class="float-comparison-rule-desc float-comparison-rule-row float-comparison-rule-r0" x="46" y="182">0.1 + 0.2 == 0.3 is False</text>
  <text class="float-comparison-rule-desc float-comparison-rule-row float-comparison-rule-r1" x="46" y="216">The values differ at the 17th decimal place</text>
  <text class="float-comparison-rule-desc float-comparison-rule-row float-comparison-rule-r2" x="46" y="250">Passes on some inputs, fails on others</text>
  <text class="float-comparison-rule-desc float-comparison-rule-row float-comparison-rule-r3" x="46" y="284">Which makes the bug intermittent</text>
  <text class="float-comparison-rule-desc float-comparison-rule-row float-comparison-rule-r4" x="46" y="318">Correct only for integers and exact values</text>
  <rect class="float-comparison-rule-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="float-comparison-rule-name" x="526" y="122">math.isclose(a, b)</text>
  <text class="float-comparison-rule-desc" x="526" y="142">Right for decimals</text>
  <text class="float-comparison-rule-desc float-comparison-rule-row float-comparison-rule-r0" x="526" y="182">Tests equality within a tolerance</text>
  <text class="float-comparison-rule-desc float-comparison-rule-row float-comparison-rule-r1" x="526" y="216">Default relative tolerance is 1e-09</text>
  <text class="float-comparison-rule-desc float-comparison-rule-row float-comparison-rule-r2" x="526" y="250">Set abs_tol when comparing against zero</text>
  <text class="float-comparison-rule-desc float-comparison-rule-row float-comparison-rule-r3" x="526" y="284">numpy.allclose for arrays</text>
  <text class="float-comparison-rule-desc float-comparison-rule-row float-comparison-rule-r4" x="526" y="318">The float32 epsilon is about 1.2e-07</text>
  <text class="float-comparison-rule-sub" x="30" y="372">A test that compares accumulated float sums with == is a test that will fail on a different machine.</text>
</svg>
