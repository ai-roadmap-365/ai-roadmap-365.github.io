<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" font-family="system-ui, sans-serif">
  <title>The anatomy of a pull request page: title and description, a diff with inline comments, automated checks, and an approval</title>
  <rect x="0" y="0" width="760" height="520" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Anatomy of a pull request</text>

  <!-- Outer PR frame -->
  <rect x="30" y="54" width="700" height="446" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="10"/>

  <!-- Title + description -->
  <rect x="50" y="72" width="660" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="66" y="96" font-size="16" font-weight="bold" fill="#1a202c">Add retry to API client</text>
  <text x="66" y="118" font-size="14" fill="#1a202c">Description: payments calls fail transiently; add up to 3 retries with backoff.</text>
  <text x="66" y="135" font-size="14" fill="#1a202c">Verified with a test that simulates two failures then a success.</text>
  <text x="700" y="90" text-anchor="end" font-size="13" font-style="italic" fill="#1d4ed8">title + description</text>

  <!-- Diff panel -->
  <rect x="50" y="158" width="660" height="150" fill="#f1f5f9" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="66" y="180" font-size="15" font-weight="bold" fill="#1a202c">Diff — client.py</text>
  <text x="700" y="180" text-anchor="end" font-size="13" font-style="italic" fill="#1d4ed8">the change, line by line</text>
  <!-- removed line -->
  <rect x="66" y="192" width="470" height="22" fill="#fee2e2" stroke="#b91c1c" stroke-width="1" rx="3"/>
  <text x="76" y="208" font-size="14" fill="#1a202c" font-family="monospace">- return call(url)</text>
  <!-- added lines -->
  <rect x="66" y="218" width="470" height="22" fill="#dcfce7" stroke="#166534" stroke-width="1" rx="3"/>
  <text x="76" y="234" font-size="14" fill="#1a202c" font-family="monospace">+ for attempt in range(3):</text>
  <rect x="66" y="244" width="470" height="22" fill="#dcfce7" stroke="#166534" stroke-width="1" rx="3"/>
  <text x="76" y="260" font-size="14" fill="#1a202c" font-family="monospace">+   try: return call(url)</text>
  <rect x="66" y="270" width="470" height="22" fill="#dcfce7" stroke="#166534" stroke-width="1" rx="3"/>
  <text x="76" y="286" font-size="14" fill="#1a202c" font-family="monospace">+   except: sleep(backoff)</text>

  <!-- Inline comment -->
  <rect x="548" y="218" width="150" height="74" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" rx="6"/>
  <text x="558" y="238" font-size="13" font-weight="bold" fill="#1a202c">Inline comment</text>
  <text x="558" y="256" font-size="12.5" fill="#1a202c">"Does the delay</text>
  <text x="558" y="272" font-size="12.5" fill="#1a202c">grow between</text>
  <text x="558" y="288" font-size="12.5" fill="#1a202c">attempts?"</text>
  <line x1="536" y1="255" x2="548" y2="255" stroke="#ca8a04" stroke-width="2"/>

  <!-- Checks panel -->
  <rect x="50" y="324" width="320" height="150" fill="#f1f5f9" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="66" y="346" font-size="15" font-weight="bold" fill="#1a202c">Checks (CI)</text>
  <circle cx="76" cy="372" r="7" fill="#166534"/>
  <text x="92" y="377" font-size="14" fill="#1a202c">build — passed</text>
  <circle cx="76" cy="402" r="7" fill="#166534"/>
  <text x="92" y="407" font-size="14" fill="#1a202c">tests — passed</text>
  <circle cx="76" cy="432" r="7" fill="#166534"/>
  <text x="92" y="437" font-size="14" fill="#1a202c">lint — passed</text>
  <text x="66" y="463" font-size="13" font-style="italic" fill="#1d4ed8">must be green to merge</text>

  <!-- Approval / reviewers panel -->
  <rect x="390" y="324" width="320" height="150" fill="#f1f5f9" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="406" y="346" font-size="15" font-weight="bold" fill="#1a202c">Reviewers</text>
  <circle cx="416" cy="372" r="7" fill="#166534"/>
  <text x="432" y="377" font-size="14" fill="#1a202c">reviewer A — approved</text>
  <circle cx="416" cy="402" r="7" fill="#ca8a04"/>
  <text x="432" y="407" font-size="14" fill="#1a202c">reviewer B — commented</text>
  <rect x="406" y="422" width="288" height="40" fill="#bbf7d0" stroke="#166534" stroke-width="2" rx="6"/>
  <text x="550" y="447" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Merge (enabled: approved + green)</text>

  <text x="380" y="494" text-anchor="middle" font-size="14" fill="#1a202c">Every part feeds one decision: is this change safe to fold into main?</text>
</svg>
