<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Line-buffered on a terminal, block-buffered on a pipe.">
  <title>The buffering trap</title>
  <style>
    .buffering-trap-bg   { fill: #f8fafc; }
    .buffering-trap-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .buffering-trap-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .buffering-trap-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .buffering-trap-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .buffering-trap-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .buffering-trap-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .buffering-trap-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .buffering-trap-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .buffering-trap-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .buffering-trap-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .buffering-trap-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .buffering-trap-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .buffering-trap-row { opacity: 1; }
    .buffering-trap-r0 { animation-delay: 0.00s; }
    .buffering-trap-r1 { animation-delay: 0.45s; }
    .buffering-trap-r2 { animation-delay: 0.90s; }
    .buffering-trap-r3 { animation-delay: 1.35s; }
    .buffering-trap-r4 { animation-delay: 1.80s; }
    .buffering-trap-row { animation: buffering-trap-reveal 7.3s ease-in-out infinite; }
    @keyframes buffering-trap-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="buffering-trap-bg" width="980" height="390"/>
  <text class="buffering-trap-h1"  x="30" y="40">The buffering trap</text>
  <text class="buffering-trap-sub" x="30" y="64">Line-buffered on a terminal, block-buffered on a pipe.</text>
  <rect class="buffering-trap-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="buffering-trap-name" x="46" y="122">On a terminal</text>
  <text class="buffering-trap-desc" x="46" y="142">Line buffered.</text>
  <text class="buffering-trap-desc buffering-trap-row buffering-trap-r0" x="46" y="182">Each line flushes as written</text>
  <text class="buffering-trap-desc buffering-trap-row buffering-trap-r1" x="46" y="216">Works perfectly in manual testing</text>
  <text class="buffering-trap-desc buffering-trap-row buffering-trap-r2" x="46" y="250">You see output immediately</text>
  <text class="buffering-trap-desc buffering-trap-row buffering-trap-r3" x="46" y="284">Which is exactly how you develop it</text>
  <text class="buffering-trap-desc buffering-trap-row buffering-trap-r4" x="46" y="318">And why the bug is invisible locally</text>
  <rect class="buffering-trap-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="buffering-trap-name" x="526" y="122">On a pipe</text>
  <text class="buffering-trap-desc" x="526" y="142">Block buffered, 4-8 KB.</text>
  <text class="buffering-trap-desc buffering-trap-row buffering-trap-r0" x="526" y="182">Nothing leaves until the buffer fills</text>
  <text class="buffering-trap-desc buffering-trap-row buffering-trap-r1" x="526" y="216">The client waits for a response that exists</text>
  <text class="buffering-trap-desc buffering-trap-row buffering-trap-r2" x="526" y="250">Presents as a hang, not an error</text>
  <text class="buffering-trap-desc buffering-trap-row buffering-trap-r3" x="526" y="284">Only under the host, never in a terminal</text>
  <text class="buffering-trap-desc buffering-trap-row buffering-trap-r4" x="526" y="318">Flush explicitly, or run unbuffered</text>
  <text class="buffering-trap-sub" x="30" y="372">This is one of the highest-value facts in the lesson because of how it fails: the server works when you test it and hangs when a client spawns it, which sends people looking at the protocol instead of the buffer.</text>
</svg>
