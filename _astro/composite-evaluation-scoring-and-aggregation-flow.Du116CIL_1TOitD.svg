<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Composite Evaluation Scoring and Aggregation Flow">
  <title>Composite Evaluation Scoring and Aggregation Flow</title>
  <defs>
    <style>
      .d315f-bg { fill: #f8fafc; }
      .d315f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d315f-b1 { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d315f-b2 { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d315f-b3 { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 8px; }
      .d315f-b4 { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d315f-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d315f-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d315f-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d315f-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d315f-bg" />
  
  <text x="40" y="40" class="d315a-title">Composite Multi-Metric Scoring Engine</text>
  <text x="40" y="65" class="d315a-subtitle">Composite Evaluation Scoring and Aggregation Flow showing Exact Match (25%), JSON F1 (25%), LLM Judge (50%), Weighted Average, Category Breakdown, and Final Decision</text>
  
  <!-- Metric 1: Exact Match (25%) -->
  <rect x="40" y="110" width="180" height="260" class="d315f-b1" />
  <text x="55" y="140" class="d315f-header" fill="#1d4ed8">Exact Match (25%)</text>
  <text x="55" y="170" class="d315f-text">• Binary string equality</text>
  <text x="55" y="190" class="d315f-text">• Case-normalized</text>
  <text x="55" y="210" class="d315f-text">• Score: 0.0 or 1.0</text>
  <text x="55" y="250" class="d315f-text" font-weight="600">Target:</text>
  <text x="55" y="270" class="d315f-text">Classification / IDs</text>
  
  <!-- Metric 2: JSON Field F1 (25%) -->
  <rect x="250" y="110" width="180" height="260" class="d315f-b2" />
  <text x="265" y="140" class="d315f-header" fill="#7e22ce">JSON Field F1 (25%)</text>
  <text x="265" y="170" class="d315f-text">• Precision &amp; Recall</text>
  <text x="265" y="190" class="d315f-text">• Schema key matching</text>
  <text x="265" y="210" class="d315f-text">• Invalid JSON = 0.0</text>
  <text x="265" y="250" class="d315f-text" font-weight="600">Target:</text>
  <text x="265" y="270" class="d315f-text">Structured Tool Calls</text>
  
  <!-- Metric 3: LLM Judge (50%) -->
  <rect x="460" y="110" width="180" height="260" class="d315f-b3" />
  <text x="475" y="140" class="d315f-header" fill="#a16207">LLM Judge (50%)</text>
  <text x="475" y="170" class="d315f-text">• Faithfulness (1-5)</text>
  <text x="475" y="190" class="d315f-text">• Helpfulness (1-5)</text>
  <text x="475" y="210" class="d315f-text">• Chain-of-thought rationale</text>
  <text x="475" y="250" class="d315f-text" font-weight="600">Target:</text>
  <text x="475" y="270" class="d315f-text">Open Prose &amp; RAG</text>
  
  <!-- Final Composite Synthesis -->
  <rect x="670" y="110" width="190" height="260" class="d315f-b4" />
  <text x="685" y="140" class="d315f-header" fill="#15803d">Composite Score</text>
  <text x="685" y="170" class="d315f-text">• Weighted average sum</text>
  <text x="685" y="190" class="d315f-text">• Category stratifications</text>
  <text x="685" y="210" class="d315f-text">• Regression delta check</text>
  <text x="685" y="250" class="d315f-text" font-weight="600">Result:</text>
  <text x="685" y="270" class="d315f-text" fill="#15803d" font-weight="700">Composite: 93.4%</text>
</svg>