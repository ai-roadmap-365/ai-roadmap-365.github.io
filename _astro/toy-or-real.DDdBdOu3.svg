<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Why a real benchmark matters.">
  <title>Two features, or seven hundred</title>
  <style>
    .toy-or-real-bg   { fill: #f8fafc; }
    .toy-or-real-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toy-or-real-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toy-or-real-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toy-or-real-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toy-or-real-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toy-or-real-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .toy-or-real-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .toy-or-real-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .toy-or-real-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .toy-or-real-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .toy-or-real-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .toy-or-real-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .toy-or-real-row { opacity: 1; }
    .toy-or-real-r0 { animation-delay: 0.00s; }
    .toy-or-real-r1 { animation-delay: 0.45s; }
    .toy-or-real-r2 { animation-delay: 0.90s; }
    .toy-or-real-r3 { animation-delay: 1.35s; }
    .toy-or-real-r4 { animation-delay: 1.80s; }
    .toy-or-real-row { animation: toy-or-real-reveal 7.3s ease-in-out infinite; }
    @keyframes toy-or-real-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="toy-or-real-bg" width="980" height="390"/>
  <text class="toy-or-real-h1"  x="30" y="40">Two features, or seven hundred</text>
  <text class="toy-or-real-sub" x="30" y="64">Why a real benchmark matters.</text>
  <rect class="toy-or-real-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="toy-or-real-name" x="46" y="122">Toy datasets</text>
  <text class="toy-or-real-desc" x="46" y="142">Two features, a few hundred points.</text>
  <text class="toy-or-real-desc toy-or-real-row toy-or-real-r0" x="46" y="182">Decision boundaries can be plotted</text>
  <text class="toy-or-real-desc toy-or-real-row toy-or-real-r1" x="46" y="216">Excellent for building intuition</text>
  <text class="toy-or-real-desc toy-or-real-row toy-or-real-r2" x="46" y="250">Any method separates them</text>
  <text class="toy-or-real-desc toy-or-real-row toy-or-real-r3" x="46" y="284">Nothing generalises from the result</text>
  <text class="toy-or-real-desc toy-or-real-row toy-or-real-r4" x="46" y="318">No benchmark to compare against</text>
  <rect class="toy-or-real-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="toy-or-real-name" x="526" y="122">MNIST</text>
  <text class="toy-or-real-desc" x="526" y="142">784 features, 70,000 samples.</text>
  <text class="toy-or-real-desc toy-or-real-row toy-or-real-r0" x="526" y="182">Cannot be visualised directly</text>
  <text class="toy-or-real-desc toy-or-real-row toy-or-real-r1" x="526" y="216">Ten classes, not two</text>
  <text class="toy-or-real-desc toy-or-real-row toy-or-real-r2" x="526" y="250">Published accuracies to compare against</text>
  <text class="toy-or-real-desc toy-or-real-row toy-or-real-r3" x="526" y="284">Real handwriting variation</text>
  <text class="toy-or-real-desc toy-or-real-row toy-or-real-r4" x="526" y="318">A result that means something</text>
  <text class="toy-or-real-sub" x="30" y="372">The comparability is what made MNIST historically important: for the first time a claimed improvement could be checked by somebody else on the same data.</text>
</svg>
