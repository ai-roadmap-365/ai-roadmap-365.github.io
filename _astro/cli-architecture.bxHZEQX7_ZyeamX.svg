<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" font-family="system-ui, sans-serif">
  <title>The architecture of a command-line tool: one parser at the top declaring the whole interface, dispatching through set_defaults to one handler function per subcommand, with the six surrounding surfaces the program stands on — standard input, standard output, standard error, the exit code, the environment and a config file — and the four-step configuration precedence stack from built-in defaults up to command-line flags</title>
  <rect x="0" y="0" width="900" height="720" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Anatomy of a command-line tool</text>
  <text x="450" y="56" text-anchor="middle" font-size="14" fill="#1a202c">one declared interface, one handler per verb, six surfaces to the outside world</text>

  <!-- The command line coming in -->
  <rect x="250" y="76" width="400" height="40" fill="#ffffff" stroke="#1a202c" stroke-width="2" rx="6"/>
  <text x="450" y="102" text-anchor="middle" font-size="15" fill="#1d4ed8">$ notes remove 3 --dry-run --store work.json</text>
  <line x1="450" y1="116" x2="450" y2="136" stroke="#1a202c" stroke-width="2"/>
  <polygon points="450,140 444,126 456,126" fill="#1a202c"/>

  <!-- The parser -->
  <rect x="180" y="142" width="540" height="96" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3" rx="8"/>
  <text x="450" y="168" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">ArgumentParser — the whole interface, declared once</text>
  <text x="200" y="192" font-size="14" fill="#1a202c">prog · description · epilog · --help · --version</text>
  <text x="200" y="212" font-size="14" fill="#1a202c">add_argument: positionals, options, type=, choices=, nargs=, action=</text>
  <text x="200" y="232" font-size="14" fill="#1a202c">argument groups and mutually exclusive groups · add_subparsers</text>

  <!-- Dispatch label -->
  <line x1="450" y1="238" x2="450" y2="262" stroke="#1a202c" stroke-width="2"/>
  <polygon points="450,266 444,252 456,252" fill="#1a202c"/>
  <text x="464" y="258" font-size="14" fill="#1d4ed8">set_defaults(func=...) → args.func(args, streams)</text>

  <!-- Subcommand row -->
  <rect x="40" y="270" width="150" height="52" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="115" y="292" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">add</text>
  <text x="115" y="312" text-anchor="middle" font-size="14" fill="#1a202c">cmd_add</text>

  <rect x="204" y="270" width="150" height="52" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="279" y="292" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">list</text>
  <text x="279" y="312" text-anchor="middle" font-size="14" fill="#1a202c">cmd_list</text>

  <rect x="368" y="270" width="150" height="52" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="443" y="292" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">search</text>
  <text x="443" y="312" text-anchor="middle" font-size="14" fill="#1a202c">cmd_search</text>

  <rect x="532" y="270" width="150" height="52" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="607" y="292" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">export</text>
  <text x="607" y="312" text-anchor="middle" font-size="14" fill="#1a202c">cmd_export</text>

  <rect x="696" y="270" width="164" height="52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3" rx="6"/>
  <text x="778" y="292" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">remove</text>
  <text x="778" y="312" text-anchor="middle" font-size="14" fill="#1a202c">cmd_remove</text>

  <text x="450" y="344" text-anchor="middle" font-size="14" fill="#1a202c">no if-statement anywhere chooses between these — the parser already did</text>

  <!-- Surfaces heading -->
  <text x="40" y="384" font-size="16" font-weight="bold" fill="#1a202c">The six surfaces the program stands on</text>

  <!-- Left column: inputs -->
  <rect x="40" y="396" width="250" height="60" fill="#ffffff" stroke="#1a202c" stroke-width="2" rx="6"/>
  <text x="56" y="418" font-size="15" font-weight="bold" fill="#1d4ed8">standard input</text>
  <text x="56" y="440" font-size="14" fill="#1a202c">read when an argument is "-"</text>

  <rect x="40" y="464" width="250" height="60" fill="#ffffff" stroke="#1a202c" stroke-width="2" rx="6"/>
  <text x="56" y="486" font-size="15" font-weight="bold" fill="#1d4ed8">environment</text>
  <text x="56" y="508" font-size="14" fill="#1a202c">$NOTES_STORE and friends</text>

  <rect x="40" y="532" width="250" height="60" fill="#ffffff" stroke="#1a202c" stroke-width="2" rx="6"/>
  <text x="56" y="554" font-size="15" font-weight="bold" fill="#1d4ed8">config file</text>
  <text x="56" y="576" font-size="14" fill="#1a202c">parser.set_defaults(**loaded)</text>

  <!-- Right column: outputs -->
  <rect x="310" y="396" width="250" height="60" fill="#ffffff" stroke="#1a202c" stroke-width="2" rx="6"/>
  <text x="326" y="418" font-size="15" font-weight="bold" fill="#1d4ed8">standard output</text>
  <text x="326" y="440" font-size="14" fill="#1a202c">the RESULT — pipe it onward</text>

  <rect x="310" y="464" width="250" height="60" fill="#ffffff" stroke="#1a202c" stroke-width="2" rx="6"/>
  <text x="326" y="486" font-size="15" font-weight="bold" fill="#1d4ed8">standard error</text>
  <text x="326" y="508" font-size="14" fill="#1a202c">the DIAGNOSTIC — never the result</text>

  <rect x="310" y="532" width="250" height="60" fill="#ffffff" stroke="#1a202c" stroke-width="2" rx="6"/>
  <text x="326" y="554" font-size="15" font-weight="bold" fill="#1d4ed8">exit code</text>
  <text x="326" y="576" font-size="14" fill="#1a202c">0 success · 1 refusal · 2 usage</text>

  <!-- Precedence stack -->
  <text x="596" y="384" font-size="16" font-weight="bold" fill="#1a202c">Configuration precedence</text>
  <text x="596" y="404" font-size="14" fill="#1a202c">later beats earlier — the order users expect</text>

  <rect x="596" y="540" width="264" height="46" fill="#ffffff" stroke="#1a202c" stroke-width="2" rx="6"/>
  <text x="612" y="569" font-size="15" fill="#1a202c">1. built-in defaults (weakest)</text>

  <rect x="596" y="486" width="264" height="46" fill="#ffffff" stroke="#1a202c" stroke-width="2" rx="6"/>
  <text x="612" y="515" font-size="15" fill="#1a202c">2. config file</text>

  <rect x="596" y="432" width="264" height="46" fill="#ffffff" stroke="#1a202c" stroke-width="2" rx="6"/>
  <text x="612" y="461" font-size="15" fill="#1a202c">3. environment variables</text>

  <rect x="596" y="600" width="264" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3" rx="6"/>
  <text x="612" y="629" font-size="15" font-weight="bold" fill="#1a202c">4. command-line flags (wins)</text>

  <line x1="728" y1="600" x2="728" y2="590" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="728,586 722,600 734,600" fill="#1d4ed8"/>
  <line x1="728" y1="540" x2="728" y2="534" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="728,530 722,544 734,544" fill="#1d4ed8"/>
  <line x1="728" y1="486" x2="728" y2="480" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="728,476 722,490 734,490" fill="#1d4ed8"/>

  <text x="450" y="676" text-anchor="middle" font-size="15" fill="#1a202c">The most specific statement of intent wins, and the most specific</text>
  <text x="450" y="698" text-anchor="middle" font-size="15" fill="#1a202c">statement is always the one the user just typed.</text>
</svg>
