<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Only the first is on the front page.">
  <title>Four things decide the bill</title>
  <style>
    .four-cost-dimensions-bg   { fill: #f8fafc; }
    .four-cost-dimensions-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-cost-dimensions-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-cost-dimensions-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-cost-dimensions-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-cost-dimensions-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-cost-dimensions-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .four-cost-dimensions-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .four-cost-dimensions-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .four-cost-dimensions-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .four-cost-dimensions-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .four-cost-dimensions-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .four-cost-dimensions-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .four-cost-dimensions-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .four-cost-dimensions-stage { opacity: 1; }

    .four-cost-dimensions-s0 { animation-delay: 0.00s; }
    .four-cost-dimensions-e0 { animation-delay: 0.00s; }
    .four-cost-dimensions-s1 { animation-delay: 1.28s; }
    .four-cost-dimensions-e1 { animation-delay: 1.28s; }
    .four-cost-dimensions-s2 { animation-delay: 2.56s; }
    .four-cost-dimensions-e2 { animation-delay: 2.56s; }
    .four-cost-dimensions-s3 { animation-delay: 3.84s; }
    .four-cost-dimensions-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .four-cost-dimensions-conn  { animation: four-cost-dimensions-trace 6.4s ease-in-out infinite; }
      .four-cost-dimensions-stage { animation: four-cost-dimensions-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes four-cost-dimensions-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes four-cost-dimensions-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .four-cost-dimensions-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .four-cost-dimensions-stage { animation: four-cost-dimensions-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes four-cost-dimensions-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="four-cost-dimensions-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="four-cost-dimensions-bg" width="980" height="322"/>
  <text class="four-cost-dimensions-h1"  x="30" y="40">Four things decide the bill</text>
  <text class="four-cost-dimensions-sub" x="30" y="64">Only the first is on the front page.</text>
  <g class="four-cost-dimensions-stage four-cost-dimensions-s0">
    <rect class="four-cost-dimensions-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="four-cost-dimensions-step" x="44" y="142">01</text>
    <text class="four-cost-dimensions-name" x="70" y="142">Compute</text>
    <text class="four-cost-dimensions-desc" x="44" y="166">Always-on bills by the hour</text>
    <text class="four-cost-dimensions-desc" x="44" y="182">regardless. Per-request bills</text>
    <text class="four-cost-dimensions-desc" x="44" y="198">what you consume.</text>
    <text class="four-cost-dimensions-edge" x="44" y="242">the decision</text>
  </g>
  <line class="four-cost-dimensions-line four-cost-dimensions-conn four-cost-dimensions-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#four-cost-dimensions-tip)"/>
  <g class="four-cost-dimensions-stage four-cost-dimensions-s1">
    <rect class="four-cost-dimensions-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="four-cost-dimensions-step" x="280" y="142">02</text>
    <text class="four-cost-dimensions-name" x="306" y="142">Egress</text>
    <text class="four-cost-dimensions-desc" x="280" y="166">Per gigabyte leaving. At scale</text>
    <text class="four-cost-dimensions-desc" x="280" y="182">it frequently exceeds compute.</text>
    <text class="four-cost-dimensions-edge" x="280" y="242">surprising</text>
  </g>
  <line class="four-cost-dimensions-line four-cost-dimensions-conn four-cost-dimensions-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#four-cost-dimensions-tip)"/>
  <g class="four-cost-dimensions-stage four-cost-dimensions-s2">
    <rect class="four-cost-dimensions-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="four-cost-dimensions-step" x="516" y="142">03</text>
    <text class="four-cost-dimensions-name" x="542" y="142">Idle</text>
    <text class="four-cost-dimensions-desc" x="516" y="166">Not a line item, a property. A</text>
    <text class="four-cost-dimensions-desc" x="516" y="182">VM at 3am costs what it costs at</text>
    <text class="four-cost-dimensions-desc" x="516" y="198">noon.</text>
  </g>
  <line class="four-cost-dimensions-line four-cost-dimensions-conn four-cost-dimensions-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#four-cost-dimensions-tip)"/>
  <g class="four-cost-dimensions-stage four-cost-dimensions-s3">
    <rect class="four-cost-dimensions-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="four-cost-dimensions-step" x="752" y="142">04</text>
    <text class="four-cost-dimensions-name" x="778" y="142">Storage</text>
    <text class="four-cost-dimensions-desc" x="752" y="166">Small, steady, and forgotten</text>
    <text class="four-cost-dimensions-desc" x="752" y="182">until someone reads a bill line</text>
    <text class="four-cost-dimensions-desc" x="752" y="198">by line.</text>
  </g>
  <text class="four-cost-dimensions-sub" x="30" y="304">The first dimension is why the ranking is a function of traffic rather than a fixed preference: one option's cost is proportional to use and the other's is not, so they must cross somewhere.</text>
</svg>
