<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The run-or-import switch</title>
  <style>
    .run-or-import-bg   { fill: #f8fafc; }
    .run-or-import-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .run-or-import-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .run-or-import-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .run-or-import-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .run-or-import-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .run-or-import-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .run-or-import-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .run-or-import-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .run-or-import-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .run-or-import-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .run-or-import-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .run-or-import-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .run-or-import-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .run-or-import-stage { opacity: 1; }

    .run-or-import-s0 { animation-delay: 0.00s; }
    .run-or-import-e0 { animation-delay: 0.00s; }
    .run-or-import-s1 { animation-delay: 1.28s; }
    .run-or-import-e1 { animation-delay: 1.28s; }
    .run-or-import-s2 { animation-delay: 2.56s; }
    .run-or-import-e2 { animation-delay: 2.56s; }
    .run-or-import-s3 { animation-delay: 3.84s; }
    .run-or-import-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .run-or-import-conn  { animation: run-or-import-trace 6.4s ease-in-out infinite; }
      .run-or-import-stage { animation: run-or-import-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes run-or-import-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes run-or-import-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .run-or-import-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .run-or-import-stage { animation: run-or-import-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes run-or-import-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="run-or-import-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="run-or-import-bg" width="980" height="322"/>
  <text class="run-or-import-h1"  x="30" y="40">The run-or-import switch</text>
  <text class="run-or-import-sub" x="30" y="64">Four steps.</text>
  <g class="run-or-import-stage run-or-import-s0">
    <rect class="run-or-import-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="run-or-import-step" x="44" y="142">01</text>
    <text class="run-or-import-name" x="70" y="142">Every module has a name attribute</text>
    <text class="run-or-import-desc" x="44" y="166">Set when it is loaded.</text>
  </g>
  <line class="run-or-import-line run-or-import-conn run-or-import-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#run-or-import-tip)"/>
  <g class="run-or-import-stage run-or-import-s1">
    <rect class="run-or-import-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="run-or-import-step" x="280" y="142">02</text>
    <text class="run-or-import-name" x="306" y="142">Run directly, it is set to a special value</text>
    <text class="run-or-import-desc" x="280" y="166">Imported, it is the module's own</text>
    <text class="run-or-import-desc" x="280" y="182">name.</text>
  </g>
  <line class="run-or-import-line run-or-import-conn run-or-import-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#run-or-import-tip)"/>
  <g class="run-or-import-stage run-or-import-s2">
    <rect class="run-or-import-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="run-or-import-step" x="516" y="142">03</text>
    <text class="run-or-import-name" x="542" y="142">So a guard runs code only when executed directly</text>
    <text class="run-or-import-desc" x="516" y="166">And not on import.</text>
  </g>
  <line class="run-or-import-line run-or-import-conn run-or-import-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#run-or-import-tip)"/>
  <g class="run-or-import-stage run-or-import-s3">
    <rect class="run-or-import-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="run-or-import-step" x="752" y="142">04</text>
    <text class="run-or-import-name" x="778" y="142">Which makes a file both a library and a tool</text>
    <text class="run-or-import-desc" x="752" y="166">Without side effects on import.</text>
  </g>
  <text class="run-or-import-sub" x="30" y="304">Without the guard, importing a module to use one function also runs its whole demonstration, which is a common and confusing surprise.</text>
</svg>
