<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Both are real skills.">
  <title>Building a race car, or driving one</title>
  <style>
    .race-cars-bg   { fill: #f8fafc; }
    .race-cars-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .race-cars-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .race-cars-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .race-cars-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .race-cars-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .race-cars-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .race-cars-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .race-cars-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .race-cars-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .race-cars-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .race-cars-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .race-cars-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .race-cars-row { opacity: 1; }
    .race-cars-r0 { animation-delay: 0.00s; }
    .race-cars-r1 { animation-delay: 0.45s; }
    .race-cars-r2 { animation-delay: 0.90s; }
    .race-cars-r3 { animation-delay: 1.35s; }
    .race-cars-r4 { animation-delay: 1.80s; }
    .race-cars-row { animation: race-cars-reveal 7.3s ease-in-out infinite; }
    @keyframes race-cars-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="race-cars-bg" width="980" height="390"/>
  <text class="race-cars-h1"  x="30" y="40">Building a race car, or driving one</text>
  <text class="race-cars-sub" x="30" y="64">Both are real skills.</text>
  <rect class="race-cars-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="race-cars-name" x="46" y="122">Building it</text>
  <text class="race-cars-desc" x="46" y="142">You understand it.</text>
  <text class="race-cars-desc race-cars-row race-cars-r0" x="46" y="182">Every component chosen and fitted</text>
  <text class="race-cars-desc race-cars-row race-cars-r1" x="46" y="216">Complete knowledge of the mechanism</text>
  <text class="race-cars-desc race-cars-row race-cars-r2" x="46" y="250">Slow, and instructive</text>
  <text class="race-cars-desc race-cars-row race-cars-r3" x="46" y="284">You can diagnose anything</text>
  <text class="race-cars-desc race-cars-row race-cars-r4" x="46" y="318">Do this to learn</text>
  <rect class="race-cars-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="race-cars-name" x="526" y="122">Driving it</text>
  <text class="race-cars-desc" x="526" y="142">You compete with it.</text>
  <text class="race-cars-desc race-cars-row race-cars-r0" x="526" y="182">A prepared, tuned machine</text>
  <text class="race-cars-desc race-cars-row race-cars-r1" x="526" y="216">Focus on the race, not the assembly</text>
  <text class="race-cars-desc race-cars-row race-cars-r2" x="526" y="250">Fast, and effective</text>
  <text class="race-cars-desc race-cars-row race-cars-r3" x="526" y="284">Understanding still helps</text>
  <text class="race-cars-desc race-cars-row race-cars-r4" x="526" y="318">Do this to win</text>
  <text class="race-cars-sub" x="30" y="372">The analogy's limit is worth naming: unlike a car, you can open this one mid-race, which is why the from-scratch understanding keeps paying off rather than becoming background.</text>
</svg>
