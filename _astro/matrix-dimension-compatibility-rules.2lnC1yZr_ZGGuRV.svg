<svg role="img" aria-label="Matrix dimension alignment and batch tensor shapes across neural network forward propagation layers" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Vectorized Matrix Dimension Compatibility Rules</title>
  <defs>
    <linearGradient id="bg199b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="matrixCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg199b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">VECTORIZED MATRIX DIMENSION ALIGNMENT</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Strict Linear Algebra Dimensional Contracts for Batch Neural Network Computation</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#matrixCard)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Formula Box -->
    <rect x="25" y="25" width="710" height="60" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="380" y="60" fill="#38bdf8" font-family="system-ui" font-size="16" font-weight="700" text-anchor="middle">Z^[l] = W^[l] . A^[l-1] + b^[l]</text>

    <!-- Dimension breakdown -->
    <g transform="translate(25, 105)">
      <!-- Z matrix -->
      <rect x="0" y="0" width="130" height="150" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
      <text x="65" y="30" fill="#34d399" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">Z^[l]</text>
      <text x="65" y="65" fill="#cbd5e1" font-size="10" text-anchor="middle">Dimensions:</text>
      <text x="65" y="90" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">(n^[l], m)</text>
      <text x="65" y="125" fill="#94a3b8" font-size="8" text-anchor="middle">n^[l] neurons, m batch</text>

      <text x="145" y="85" fill="#f8fafc" font-size="20" font-weight="700">=</text>

      <!-- W matrix -->
      <rect x="165" y="0" width="160" height="150" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
      <text x="245" y="30" fill="#38bdf8" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">W^[l]</text>
      <text x="245" y="65" fill="#cbd5e1" font-size="10" text-anchor="middle">Dimensions:</text>
      <text x="245" y="90" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">(n^[l], n^[l-1])</text>
      <text x="245" y="125" fill="#94a3b8" font-size="8" text-anchor="middle">Rows=Curr, Cols=Prev</text>

      <text x="340" y="85" fill="#f8fafc" font-size="20" font-weight="700">.</text>

      <!-- A matrix -->
      <rect x="360" y="0" width="150" height="150" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" rx="6"/>
      <text x="435" y="30" fill="#c084fc" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">A^[l-1]</text>
      <text x="435" y="65" fill="#cbd5e1" font-size="10" text-anchor="middle">Dimensions:</text>
      <text x="435" y="90" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">(n^[l-1], m)</text>
      <text x="435" y="125" fill="#94a3b8" font-size="8" text-anchor="middle">Prev activations, m batch</text>

      <text x="525" y="85" fill="#f8fafc" font-size="20" font-weight="700">+</text>

      <!-- b vector -->
      <rect x="545" y="0" width="165" height="150" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" rx="6"/>
      <text x="627" y="30" fill="#fb7185" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">b^[l] (Broadcast)</text>
      <text x="627" y="65" fill="#cbd5e1" font-size="10" text-anchor="middle">Dimensions:</text>
      <text x="627" y="90" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">(n^[l], 1) -&gt; (n^[l], m)</text>
      <text x="627" y="125" fill="#94a3b8" font-size="8" text-anchor="middle">Replicated across m columns</text>
    </g>
  </g>
</svg>
