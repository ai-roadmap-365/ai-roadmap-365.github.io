<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four of them.">
  <title>Set operations</title>
  <style>
    .set-ops-bg   { fill: #f8fafc; }
    .set-ops-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .set-ops-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .set-ops-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .set-ops-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .set-ops-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .set-ops-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .set-ops-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .set-ops-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .set-ops-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .set-ops-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .set-ops-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .set-ops-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .set-ops-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .set-ops-stage { opacity: 1; }

    .set-ops-s0 { animation-delay: 0.00s; }
    .set-ops-e0 { animation-delay: 0.00s; }
    .set-ops-s1 { animation-delay: 1.28s; }
    .set-ops-e1 { animation-delay: 1.28s; }
    .set-ops-s2 { animation-delay: 2.56s; }
    .set-ops-e2 { animation-delay: 2.56s; }
    .set-ops-s3 { animation-delay: 3.84s; }
    .set-ops-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .set-ops-conn  { animation: set-ops-trace 6.4s ease-in-out infinite; }
      .set-ops-stage { animation: set-ops-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes set-ops-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes set-ops-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .set-ops-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .set-ops-stage { animation: set-ops-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes set-ops-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="set-ops-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="set-ops-bg" width="980" height="322"/>
  <text class="set-ops-h1"  x="30" y="40">Set operations</text>
  <text class="set-ops-sub" x="30" y="64">Four of them.</text>
  <g class="set-ops-stage set-ops-s0">
    <rect class="set-ops-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="set-ops-step" x="44" y="142">01</text>
    <text class="set-ops-name" x="70" y="142">Union: everything in either</text>
    <text class="set-ops-desc" x="44" y="166">Which is how collections are</text>
    <text class="set-ops-desc" x="44" y="182">merged without duplicates.</text>
  </g>
  <line class="set-ops-line set-ops-conn set-ops-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#set-ops-tip)"/>
  <g class="set-ops-stage set-ops-s1">
    <rect class="set-ops-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="set-ops-step" x="280" y="142">02</text>
    <text class="set-ops-name" x="306" y="142">Intersection: only what is in both</text>
    <text class="set-ops-desc" x="280" y="166">Which answers what two groups</text>
    <text class="set-ops-desc" x="280" y="182">share.</text>
  </g>
  <line class="set-ops-line set-ops-conn set-ops-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#set-ops-tip)"/>
  <g class="set-ops-stage set-ops-s2">
    <rect class="set-ops-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="set-ops-step" x="516" y="142">03</text>
    <text class="set-ops-name" x="542" y="142">Difference: in the first and not the second</text>
    <text class="set-ops-desc" x="516" y="166">Which is how a removal list is</text>
    <text class="set-ops-desc" x="516" y="182">computed.</text>
  </g>
  <line class="set-ops-line set-ops-conn set-ops-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#set-ops-tip)"/>
  <g class="set-ops-stage set-ops-s3">
    <rect class="set-ops-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="set-ops-step" x="752" y="142">04</text>
    <text class="set-ops-name" x="778" y="142">Symmetric difference: in one but not both</text>
    <text class="set-ops-desc" x="752" y="166">Which is how two collections are</text>
    <text class="set-ops-desc" x="752" y="182">compared.</text>
  </g>
  <text class="set-ops-sub" x="30" y="304">Expressing these as set operations rather than as nested loops is both far faster and far easier to read, which is unusual for a performance improvement.</text>
</svg>
