<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The property that predicts behaviour.">
  <title>Sort types by whether they can change</title>
  <style>
    .immutable-or-mutable-bg   { fill: #f8fafc; }
    .immutable-or-mutable-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .immutable-or-mutable-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .immutable-or-mutable-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .immutable-or-mutable-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .immutable-or-mutable-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .immutable-or-mutable-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .immutable-or-mutable-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .immutable-or-mutable-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .immutable-or-mutable-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .immutable-or-mutable-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .immutable-or-mutable-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .immutable-or-mutable-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .immutable-or-mutable-row { opacity: 1; }
    .immutable-or-mutable-r0 { animation-delay: 0.00s; }
    .immutable-or-mutable-r1 { animation-delay: 0.45s; }
    .immutable-or-mutable-r2 { animation-delay: 0.90s; }
    .immutable-or-mutable-r3 { animation-delay: 1.35s; }
    .immutable-or-mutable-r4 { animation-delay: 1.80s; }
    .immutable-or-mutable-row { animation: immutable-or-mutable-reveal 7.3s ease-in-out infinite; }
    @keyframes immutable-or-mutable-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="immutable-or-mutable-bg" width="980" height="390"/>
  <text class="immutable-or-mutable-h1"  x="30" y="40">Sort types by whether they can change</text>
  <text class="immutable-or-mutable-sub" x="30" y="64">The property that predicts behaviour.</text>
  <rect class="immutable-or-mutable-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="immutable-or-mutable-name" x="46" y="122">Immutable</text>
  <text class="immutable-or-mutable-desc" x="46" y="142">int, float, bool, str, tuple.</text>
  <text class="immutable-or-mutable-desc immutable-or-mutable-row immutable-or-mutable-r0" x="46" y="182">"Changing" one creates a NEW object</text>
  <text class="immutable-or-mutable-desc immutable-or-mutable-row immutable-or-mutable-r1" x="46" y="216">Safe to share freely</text>
  <text class="immutable-or-mutable-desc immutable-or-mutable-row immutable-or-mutable-r2" x="46" y="250">Usable as dictionary keys</text>
  <text class="immutable-or-mutable-desc immutable-or-mutable-row immutable-or-mutable-r3" x="46" y="284">Safe as a default argument</text>
  <text class="immutable-or-mutable-desc immutable-or-mutable-row immutable-or-mutable-r4" x="46" y="318">id changes when the value does</text>
  <rect class="immutable-or-mutable-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="immutable-or-mutable-name" x="526" y="122">Mutable</text>
  <text class="immutable-or-mutable-desc" x="526" y="142">list, dict, set.</text>
  <text class="immutable-or-mutable-desc immutable-or-mutable-row immutable-or-mutable-r0" x="526" y="182">Changing one alters the object in place</text>
  <text class="immutable-or-mutable-desc immutable-or-mutable-row immutable-or-mutable-r1" x="526" y="216">Every name pointing at it sees the change</text>
  <text class="immutable-or-mutable-desc immutable-or-mutable-row immutable-or-mutable-r2" x="526" y="250">Cannot be a dictionary key</text>
  <text class="immutable-or-mutable-desc immutable-or-mutable-row immutable-or-mutable-r3" x="526" y="284">Dangerous as a default argument</text>
  <text class="immutable-or-mutable-desc immutable-or-mutable-row immutable-or-mutable-r4" x="526" y="318">id stays the same as contents change</text>
  <text class="immutable-or-mutable-sub" x="30" y="372">This single distinction predicts aliasing behaviour, dictionary-key errors, default-argument bugs and thread-safety, which is why it is the axis worth sorting the types by.</text>
</svg>
