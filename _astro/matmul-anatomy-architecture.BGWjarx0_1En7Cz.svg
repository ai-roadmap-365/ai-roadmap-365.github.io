<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" width="1000" height="790" role="img" aria-labelledby="d101a-title d101a-desc">
  <title id="d101a-title">The anatomy of a matrix product: a 2 by 3 times a 3 by 2, with one output cell traced back to the exact row and column that produced it</title>
  <desc id="d101a-desc">A 2 by 3 matrix is multiplied by a 3 by 2 matrix to give a 2 by 2 result. Row 1 of the left matrix and column 1 of the right matrix are shaded, and the single output cell they produce is shaded in the answer. The arithmetic for that cell is written out underneath. A panel at the foot annotates the shape rule, showing which two dimensions must match and are then consumed, and which two survive into the answer.</desc>

  <style>
    .d101a-bg      { fill: #f8fafc; }
    .d101a-h1      { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 22px; font-weight: 600; fill: #1a202c; }
    .d101a-h2      { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 600; fill: #1d4ed8; }
    .d101a-sub     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; fill: #334155; }
    .d101a-label   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #1a202c; }
    .d101a-small   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d101a-num     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 18px; fill: #1a202c; text-anchor: middle; }
    .d101a-numhi   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 18px; font-weight: 700; fill: #1a202c; text-anchor: middle; }
    .d101a-op      { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 30px; font-weight: 600; fill: #1d4ed8; text-anchor: middle; }
    .d101a-shape   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 30px; font-weight: 600; fill: #1a202c; text-anchor: middle; }
    .d101a-sgreen  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 30px; font-weight: 700; fill: #047857; text-anchor: middle; }
    .d101a-sblue   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 30px; font-weight: 700; fill: #1d4ed8; text-anchor: middle; }
    .d101a-sred    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 30px; font-weight: 700; fill: #b91c1c; text-anchor: middle; }
    .d101a-cell    { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
    .d101a-hirow   { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
    .d101a-hicol   { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .d101a-hicell  { fill: #fef3c7; stroke: #b45309; stroke-width: 2.5; }
    .d101a-panel   { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d101a-work    { fill: #ffffff; stroke: #b45309; stroke-width: 2; }
    .d101a-arcg    { fill: none; stroke: #047857; stroke-width: 2.5; }
    .d101a-arcb    { fill: none; stroke: #1d4ed8; stroke-width: 2.5; }
    .d101a-arcr    { fill: none; stroke: #b91c1c; stroke-width: 2.5; stroke-dasharray: 7 5; }
    .d101a-tie     { fill: none; stroke: #b45309; stroke-width: 2; stroke-dasharray: 6 4; }
  </style>

  <rect class="d101a-bg" x="0" y="0" width="1000" height="790" />

  <text class="d101a-h1" x="40" y="44">One output cell, traced back to exactly what produced it</text>
  <text class="d101a-sub" x="40" y="72">Entry (i, j) of the answer is row i of the left matrix dotted with column j of the right matrix. Nothing else is going on.</text>

  <!-- ============================ X, shape (2, 3) ============================ -->
  <text class="d101a-h2" x="80" y="128">X — the batch</text>
  <text class="d101a-small" x="80" y="148">two examples, three features each</text>

  <!-- row 1 highlight sits behind the cells -->
  <rect class="d101a-hirow" x="80" y="216" width="174" height="46" />

  <rect class="d101a-cell" x="80" y="170" width="58" height="46" />
  <rect class="d101a-cell" x="138" y="170" width="58" height="46" />
  <rect class="d101a-cell" x="196" y="170" width="58" height="46" />
  <text class="d101a-num" x="109" y="200">1</text>
  <text class="d101a-num" x="167" y="200">2</text>
  <text class="d101a-num" x="225" y="200">0</text>

  <rect class="d101a-hirow" x="80" y="216" width="58" height="46" />
  <rect class="d101a-hirow" x="138" y="216" width="58" height="46" />
  <rect class="d101a-hirow" x="196" y="216" width="58" height="46" />
  <text class="d101a-numhi" x="109" y="246">0</text>
  <text class="d101a-numhi" x="167" y="246">1</text>
  <text class="d101a-numhi" x="225" y="246">3</text>

  <text class="d101a-small" x="264" y="246">row 1</text>
  <text class="d101a-shape" x="167" y="300">(2, 3)</text>

  <text class="d101a-op" x="310" y="228">@</text>

  <!-- ============================ W, shape (3, 2) ============================ -->
  <text class="d101a-h2" x="380" y="128">W — the weights</text>
  <text class="d101a-small" x="380" y="148">three inputs in, two outputs out</text>

  <rect class="d101a-cell" x="380" y="170" width="58" height="46" />
  <rect class="d101a-cell" x="380" y="216" width="58" height="46" />
  <rect class="d101a-cell" x="380" y="262" width="58" height="46" />
  <text class="d101a-num" x="409" y="200">2</text>
  <text class="d101a-num" x="409" y="246">-1</text>
  <text class="d101a-num" x="409" y="292">0</text>

  <rect class="d101a-hicol" x="438" y="170" width="58" height="46" />
  <rect class="d101a-hicol" x="438" y="216" width="58" height="46" />
  <rect class="d101a-hicol" x="438" y="262" width="58" height="46" />
  <text class="d101a-numhi" x="467" y="200">0</text>
  <text class="d101a-numhi" x="467" y="246">1</text>
  <text class="d101a-numhi" x="467" y="292">4</text>

  <text class="d101a-small" x="438" y="330">column 1</text>
  <text class="d101a-shape" x="438" y="368">(3, 2)</text>

  <text class="d101a-op" x="560" y="228">=</text>

  <!-- ============================ result, shape (2, 2) ============================ -->
  <text class="d101a-h2" x="640" y="128">X @ W — the answer</text>
  <text class="d101a-small" x="640" y="148">two examples, two outputs each</text>

  <rect class="d101a-cell" x="640" y="170" width="58" height="46" />
  <rect class="d101a-cell" x="698" y="170" width="58" height="46" />
  <rect class="d101a-cell" x="640" y="216" width="58" height="46" />
  <text class="d101a-num" x="669" y="200">0</text>
  <text class="d101a-num" x="727" y="200">2</text>
  <text class="d101a-num" x="669" y="246">-1</text>

  <rect class="d101a-hicell" x="698" y="216" width="58" height="46" />
  <text class="d101a-numhi" x="727" y="246">13</text>

  <text class="d101a-shape" x="698" y="300">(2, 2)</text>

  <!-- ties from the two shaded strips into the shaded output cell -->
  <path class="d101a-tie" d="M 254 239 C 300 200 320 150 380 140" />
  <path class="d101a-tie" d="M 496 292 C 600 300 660 280 712 266" />
  <text class="d101a-small" x="790" y="246">the shaded row and</text>
  <text class="d101a-small" x="790" y="264">the shaded column</text>
  <text class="d101a-small" x="790" y="282">meet in this one cell</text>

  <!-- ============================ the arithmetic ============================ -->
  <rect class="d101a-work" x="40" y="400" width="920" height="132" rx="6" />
  <text class="d101a-h2" x="64" y="430">That cell, worked out in full</text>
  <text class="d101a-label" x="64" y="462">row 1 of X = [0, 1, 3]          column 1 of W = [0, 1, 4]</text>
  <text class="d101a-label" x="64" y="492">0 × 0  +  1 × 1  +  3 × 4   =   0  +  1  +  12   =   13</text>
  <text class="d101a-small" x="64" y="518">Three multiplications and two additions. The other three cells of the answer are the same thing with a different row or a different column.</text>

  <!-- ============================ the shape rule ============================ -->
  <rect class="d101a-panel" x="40" y="556" width="920" height="200" rx="6" />
  <text class="d101a-h2" x="64" y="586">The shape rule, and why it is the only rule it could be</text>

  <text class="d101a-shape" x="120" y="672">(</text>
  <text class="d101a-sgreen" x="142" y="672">2</text>
  <text class="d101a-shape" x="160" y="672">,</text>
  <text class="d101a-sred" x="182" y="672">3</text>
  <text class="d101a-shape" x="204" y="672">)</text>
  <text class="d101a-op" x="234" y="672">@</text>
  <text class="d101a-shape" x="266" y="672">(</text>
  <text class="d101a-sred" x="288" y="672">3</text>
  <text class="d101a-shape" x="306" y="672">,</text>
  <text class="d101a-sblue" x="328" y="672">2</text>
  <text class="d101a-shape" x="350" y="672">)</text>
  <text class="d101a-op" x="386" y="672">=</text>
  <text class="d101a-shape" x="424" y="672">(</text>
  <text class="d101a-sgreen" x="446" y="672">2</text>
  <text class="d101a-shape" x="464" y="672">,</text>
  <text class="d101a-sblue" x="486" y="672">2</text>
  <text class="d101a-shape" x="508" y="672">)</text>

  <path class="d101a-arcg" d="M 142 648 Q 294 604 446 648" />
  <path class="d101a-arcb" d="M 328 648 Q 407 620 486 648" />
  <path class="d101a-arcr" d="M 182 684 Q 235 722 288 684" />

  <rect x="560" y="600" width="14" height="14" fill="#047857" />
  <text class="d101a-small" x="584" y="612">2 on the left — the number of rows going in. It survives: the answer has 2 rows.</text>

  <rect x="560" y="634" width="14" height="14" fill="#1d4ed8" />
  <text class="d101a-small" x="584" y="646">2 on the right — the width of the layer. It survives: the answer has 2 columns.</text>

  <rect x="560" y="668" width="14" height="14" fill="#b91c1c" />
  <text class="d101a-small" x="584" y="680">3 and 3 must match, because the second matrix has to accept what the first</text>
  <text class="d101a-small" x="584" y="698">one produces. Then the 3 is CONSUMED — it is gone from the answer entirely.</text>
  <text class="d101a-small" x="584" y="726">When these two disagree, that is the shape error, and it is the whole bug.</text>

  <text class="d101a-small" x="64" y="716">X holds data, W transforms it:</text>
  <text class="d101a-small" x="64" y="734">every ROW of X is passed through W.</text>

  <text class="d101a-small" x="40" y="778">All values are invented. Every number above can be re-derived with a pen in under a minute.</text>
</svg>
