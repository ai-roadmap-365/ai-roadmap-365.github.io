<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the data.">
  <title>Which distance when</title>
  <style>
    .vector-when-bg   { fill: #f8fafc; }
    .vector-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vector-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vector-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vector-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vector-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vector-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vector-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .vector-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .vector-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .vector-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .vector-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .vector-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vector-when-row { opacity: 1; }
    .vector-when-r0 { animation-delay: 0.00s; }
    .vector-when-r1 { animation-delay: 0.45s; }
    .vector-when-r2 { animation-delay: 0.90s; }
    .vector-when-r3 { animation-delay: 1.35s; }
    .vector-when-r4 { animation-delay: 1.80s; }
    .vector-when-row { animation: vector-when-reveal 7.3s ease-in-out infinite; }
    @keyframes vector-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="vector-when-bg" width="980" height="390"/>
  <text class="vector-when-h1"  x="30" y="40">Which distance when</text>
  <text class="vector-when-sub" x="30" y="64">By the data.</text>
  <rect class="vector-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="vector-when-name" x="46" y="122">The situation</text>
  <text class="vector-when-desc" x="46" y="142">What you have.</text>
  <text class="vector-when-desc vector-when-row vector-when-r0" x="46" y="182">Comparable units, moderate dimensions</text>
  <text class="vector-when-desc vector-when-row vector-when-r1" x="46" y="216">Text or documents of differing length</text>
  <text class="vector-when-desc vector-when-row vector-when-r2" x="46" y="250">Many dimensions, or outliers present</text>
  <text class="vector-when-desc vector-when-row vector-when-r3" x="46" y="284">Counts, where totals differ</text>
  <text class="vector-when-desc vector-when-row vector-when-r4" x="46" y="318">Binary presence or absence</text>
  <rect class="vector-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="vector-when-name" x="526" y="122">The metric</text>
  <text class="vector-when-desc" x="526" y="142">What to use.</text>
  <text class="vector-when-desc vector-when-row vector-when-r0" x="526" y="182">Straight-line distance</text>
  <text class="vector-when-desc vector-when-row vector-when-r1" x="526" y="216">Cosine similarity, after normalising</text>
  <text class="vector-when-desc vector-when-row vector-when-r2" x="526" y="250">Grid distance, which is more robust</text>
  <text class="vector-when-desc vector-when-row vector-when-r3" x="526" y="284">Normalise first, then compare</text>
  <text class="vector-when-desc vector-when-row vector-when-r4" x="526" y="318">A set-overlap measure instead</text>
  <text class="vector-when-sub" x="30" y="372">Normalising before comparing counts is the step that most often turns a useless similarity into a meaningful one, and it is a single line.</text>
</svg>
