<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward a shared database.">
  <title>Four steps in civil timekeeping</title>
  <style>
    .time-history-bg   { fill: #f8fafc; }
    .time-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .time-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .time-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .time-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .time-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .time-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .time-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .time-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .time-history-stage { opacity: 1; }

    .time-history-s0 { animation-delay: 0.00s; }
    .time-history-e0 { animation-delay: 0.00s; }
    .time-history-s1 { animation-delay: 1.28s; }
    .time-history-e1 { animation-delay: 1.28s; }
    .time-history-s2 { animation-delay: 2.56s; }
    .time-history-e2 { animation-delay: 2.56s; }
    .time-history-s3 { animation-delay: 3.84s; }
    .time-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .time-history-conn  { animation: time-history-trace 6.4s ease-in-out infinite; }
      .time-history-stage { animation: time-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes time-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes time-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .time-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .time-history-stage { animation: time-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes time-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="time-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="time-history-bg" width="980" height="322"/>
  <text class="time-history-h1"  x="30" y="40">Four steps in civil timekeeping</text>
  <text class="time-history-sub" x="30" y="64">Toward a shared database.</text>
  <g class="time-history-stage time-history-s0">
    <rect class="time-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="time-history-step" x="44" y="142">01</text>
    <text class="time-history-name" x="70" y="142">Local solar time, different in every town</text>
    <text class="time-history-desc" x="44" y="166">Which railways made unworkable.</text>
  </g>
  <line class="time-history-line time-history-conn time-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#time-history-tip)"/>
  <g class="time-history-stage time-history-s1">
    <rect class="time-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="time-history-step" x="280" y="142">02</text>
    <text class="time-history-name" x="306" y="142">Then standard zones, agreed regionally</text>
    <text class="time-history-desc" x="280" y="166">Which made timetables possible.</text>
  </g>
  <line class="time-history-line time-history-conn time-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#time-history-tip)"/>
  <g class="time-history-stage time-history-s2">
    <rect class="time-history-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="time-history-step" x="516" y="142">03</text>
    <text class="time-history-name" x="542" y="142">Then constant political adjustment</text>
    <text class="time-history-desc" x="516" y="166">Zones and rules change by</text>
    <text class="time-history-desc" x="516" y="182">decree.</text>
  </g>
  <line class="time-history-line time-history-conn time-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#time-history-tip)"/>
  <g class="time-history-stage time-history-s3">
    <rect class="time-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="time-history-step" x="752" y="142">04</text>
    <text class="time-history-name" x="778" y="142">And a shared database recording every change</text>
    <text class="time-history-desc" x="752" y="166">Which software depends on</text>
    <text class="time-history-desc" x="752" y="182">entirely.</text>
  </g>
  <text class="time-history-sub" x="30" y="304">Software depends on that database completely, which is why a stale copy produces wrong times for exactly the regions that recently changed their rules.</text>
</svg>
