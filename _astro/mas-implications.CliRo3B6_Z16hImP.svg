<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One is money; one is a boundary.">
  <title>Two costs of going multi-agent</title>
  <style>
    .mas-implications-bg   { fill: #f8fafc; }
    .mas-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mas-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mas-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mas-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mas-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mas-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mas-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mas-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mas-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mas-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mas-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mas-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .mas-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .mas-implications-stage { opacity: 1; }

    .mas-implications-s0 { animation-delay: 0.00s; }
    .mas-implications-e0 { animation-delay: 0.00s; }
    .mas-implications-s1 { animation-delay: 1.50s; }
    .mas-implications-e1 { animation-delay: 1.50s; }
    .mas-implications-s2 { animation-delay: 3.00s; }
    .mas-implications-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .mas-implications-conn  { animation: mas-implications-trace 6s ease-in-out infinite; }
      .mas-implications-stage { animation: mas-implications-arrive 6s ease-in-out infinite; }
    }
    @keyframes mas-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes mas-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .mas-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .mas-implications-stage { animation: mas-implications-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes mas-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="mas-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="mas-implications-bg" width="980" height="322"/>
  <text class="mas-implications-h1"  x="30" y="40">Two costs of going multi-agent</text>
  <text class="mas-implications-sub" x="30" y="64">One is money; one is a boundary.</text>
  <g class="mas-implications-stage mas-implications-s0">
    <rect class="mas-implications-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="mas-implications-step" x="44" y="142">01</text>
    <text class="mas-implications-name" x="70" y="142">Cost multiplies with agents and rounds</text>
    <text class="mas-implications-desc" x="44" y="166">Each agent carries its own context, and every</text>
    <text class="mas-implications-desc" x="44" y="182">round re-reads it.</text>
    <text class="mas-implications-edge" x="44" y="242">money</text>
  </g>
  <line class="mas-implications-line mas-implications-conn mas-implications-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#mas-implications-tip)"/>
  <g class="mas-implications-stage mas-implications-s1">
    <rect class="mas-implications-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="mas-implications-step" x="359" y="142">02</text>
    <text class="mas-implications-name" x="385" y="142">So caps are structural</text>
    <text class="mas-implications-desc" x="359" y="166">Round limits and message filtering, in the</text>
    <text class="mas-implications-desc" x="359" y="182">bus.</text>
  </g>
  <line class="mas-implications-line mas-implications-conn mas-implications-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#mas-implications-tip)"/>
  <g class="mas-implications-stage mas-implications-s2">
    <rect class="mas-implications-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="mas-implications-step" x="674" y="142">03</text>
    <text class="mas-implications-name" x="700" y="142">Isolation is also a security control</text>
    <text class="mas-implications-desc" x="674" y="166">An agent with three search tools cannot be</text>
    <text class="mas-implications-desc" x="674" y="182">talked into a database write.</text>
    <text class="mas-implications-edge" x="674" y="242">Day 344</text>
  </g>
  <text class="mas-implications-sub" x="30" y="304">The third point is worth making explicitly because it is usually framed as an organisational benefit: narrow tool inventories are least privilege, and they bound what an injected instruction can achieve.</text>
</svg>
