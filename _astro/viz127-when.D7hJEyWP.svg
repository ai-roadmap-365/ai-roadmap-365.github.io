<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when to tabulate.">
  <title>When to chart</title>
  <style>
    .viz127-when-bg   { fill: #f8fafc; }
    .viz127-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz127-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz127-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz127-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz127-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz127-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .viz127-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .viz127-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .viz127-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .viz127-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .viz127-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .viz127-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .viz127-when-row { opacity: 1; }
    .viz127-when-r0 { animation-delay: 0.00s; }
    .viz127-when-r1 { animation-delay: 0.45s; }
    .viz127-when-r2 { animation-delay: 0.90s; }
    .viz127-when-r3 { animation-delay: 1.35s; }
    .viz127-when-r4 { animation-delay: 1.80s; }
    .viz127-when-row { animation: viz127-when-reveal 7.3s ease-in-out infinite; }
    @keyframes viz127-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="viz127-when-bg" width="980" height="390"/>
  <text class="viz127-when-h1"  x="30" y="40">When to chart</text>
  <text class="viz127-when-sub" x="30" y="64">And when to tabulate.</text>
  <rect class="viz127-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="viz127-when-name" x="46" y="122">Chart it</text>
  <text class="viz127-when-desc" x="46" y="142">Four cases.</text>
  <text class="viz127-when-desc viz127-when-row viz127-when-r0" x="46" y="182">Showing a trend or a distribution</text>
  <text class="viz127-when-desc viz127-when-row viz127-when-r1" x="46" y="216">Comparing many values</text>
  <text class="viz127-when-desc viz127-when-row viz127-when-r2" x="46" y="250">Revealing outliers or clusters</text>
  <text class="viz127-when-desc viz127-when-row viz127-when-r3" x="46" y="284">Exploring before summarising</text>
  <text class="viz127-when-desc viz127-when-row viz127-when-r4" x="46" y="318">Communicating a single clear point</text>
  <rect class="viz127-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="viz127-when-name" x="526" y="122">Tabulate it</text>
  <text class="viz127-when-desc" x="526" y="142">Also four.</text>
  <text class="viz127-when-desc viz127-when-row viz127-when-r0" x="526" y="182">A handful of precise values</text>
  <text class="viz127-when-desc viz127-when-row viz127-when-r1" x="526" y="216">Values that will be looked up</text>
  <text class="viz127-when-desc viz127-when-row viz127-when-r2" x="526" y="250">Where exact figures are required</text>
  <text class="viz127-when-desc viz127-when-row viz127-when-r3" x="526" y="284">Reference material</text>
  <text class="viz127-when-desc viz127-when-row viz127-when-r4" x="526" y="318">Where the chart would show four bars</text>
  <text class="viz127-when-sub" x="30" y="372">A chart of four bars is almost always worse than the four numbers written out, which is a useful and frequently ignored threshold.</text>
</svg>
