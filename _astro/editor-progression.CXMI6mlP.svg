<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each step removed a constraint the previous one lived under.">
  <title>From teletypes to language servers</title>
  <style>
    .editor-progression-bg   { fill: #f8fafc; }
    .editor-progression-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .editor-progression-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .editor-progression-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .editor-progression-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .editor-progression-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .editor-progression-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .editor-progression-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .editor-progression-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .editor-progression-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .editor-progression-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .editor-progression-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .editor-progression-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .editor-progression-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .editor-progression-stage { opacity: 1; }

    .editor-progression-s0 { animation-delay: 0.00s; }
    .editor-progression-e0 { animation-delay: 0.00s; }
    .editor-progression-s1 { animation-delay: 1.28s; }
    .editor-progression-e1 { animation-delay: 1.28s; }
    .editor-progression-s2 { animation-delay: 2.56s; }
    .editor-progression-e2 { animation-delay: 2.56s; }
    .editor-progression-s3 { animation-delay: 3.84s; }
    .editor-progression-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .editor-progression-conn  { animation: editor-progression-trace 6.4s ease-in-out infinite; }
      .editor-progression-stage { animation: editor-progression-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes editor-progression-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes editor-progression-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .editor-progression-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .editor-progression-stage { animation: editor-progression-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes editor-progression-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="editor-progression-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="editor-progression-bg" width="980" height="322"/>
  <text class="editor-progression-h1"  x="30" y="40">From teletypes to language servers</text>
  <text class="editor-progression-sub" x="30" y="64">Each step removed a constraint the previous one lived under.</text>
  <g class="editor-progression-stage editor-progression-s0">
    <rect class="editor-progression-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="editor-progression-step" x="44" y="142">01</text>
    <text class="editor-progression-name" x="70" y="142">Line editors</text>
    <text class="editor-progression-desc" x="44" y="166">ed, then vi. Terse because every</text>
    <text class="editor-progression-desc" x="44" y="182">character cost time on a slow</text>
    <text class="editor-progression-desc" x="44" y="198">terminal.</text>
    <text class="editor-progression-edge" x="44" y="242">1970s</text>
  </g>
  <line class="editor-progression-line editor-progression-conn editor-progression-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#editor-progression-tip)"/>
  <g class="editor-progression-stage editor-progression-s1">
    <rect class="editor-progression-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="editor-progression-step" x="280" y="142">02</text>
    <text class="editor-progression-name" x="306" y="142">Extensible editors</text>
    <text class="editor-progression-desc" x="280" y="166">Emacs: an environment you</text>
    <text class="editor-progression-desc" x="280" y="182">programmed yourself. Still the</text>
    <text class="editor-progression-desc" x="280" y="198">most configurable there is.</text>
  </g>
  <line class="editor-progression-line editor-progression-conn editor-progression-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#editor-progression-tip)"/>
  <g class="editor-progression-stage editor-progression-s2">
    <rect class="editor-progression-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="editor-progression-step" x="516" y="142">03</text>
    <text class="editor-progression-name" x="542" y="142">IDEs</text>
    <text class="editor-progression-desc" x="516" y="166">Editor, compiler, debugger</text>
    <text class="editor-progression-desc" x="516" y="182">bundled — and language-specific,</text>
    <text class="editor-progression-desc" x="516" y="198">because integration was written</text>
    <text class="editor-progression-edge" x="516" y="242">per language</text>
  </g>
  <line class="editor-progression-line editor-progression-conn editor-progression-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#editor-progression-tip)"/>
  <g class="editor-progression-stage editor-progression-s3">
    <rect class="editor-progression-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="editor-progression-step" x="752" y="142">04</text>
    <text class="editor-progression-name" x="778" y="142">The Language Server Protocol</text>
    <text class="editor-progression-desc" x="752" y="166">One protocol. One server per</text>
    <text class="editor-progression-desc" x="752" y="182">language. Every editor gets it</text>
    <text class="editor-progression-desc" x="752" y="198">for free.</text>
    <text class="editor-progression-edge" x="752" y="242">2016</text>
  </g>
  <text class="editor-progression-sub" x="30" y="304">The line between editor and IDE has blurred since, and the remaining distinction is mostly about how much arrives preassembled rather than what is possible.</text>
</svg>
