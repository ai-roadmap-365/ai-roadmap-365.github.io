<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four items.">
  <title>What provenance records</title>
  <style>
    .provenance-bg   { fill: #f8fafc; }
    .provenance-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .provenance-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .provenance-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .provenance-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .provenance-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .provenance-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .provenance-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .provenance-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .provenance-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .provenance-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .provenance-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .provenance-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .provenance-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .provenance-stage { opacity: 1; }

    .provenance-s0 { animation-delay: 0.00s; }
    .provenance-e0 { animation-delay: 0.00s; }
    .provenance-s1 { animation-delay: 1.28s; }
    .provenance-e1 { animation-delay: 1.28s; }
    .provenance-s2 { animation-delay: 2.56s; }
    .provenance-e2 { animation-delay: 2.56s; }
    .provenance-s3 { animation-delay: 3.84s; }
    .provenance-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .provenance-conn  { animation: provenance-trace 6.4s ease-in-out infinite; }
      .provenance-stage { animation: provenance-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes provenance-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes provenance-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .provenance-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .provenance-stage { animation: provenance-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes provenance-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="provenance-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="provenance-bg" width="980" height="322"/>
  <text class="provenance-h1"  x="30" y="40">What provenance records</text>
  <text class="provenance-sub" x="30" y="64">Four items.</text>
  <g class="provenance-stage provenance-s0">
    <rect class="provenance-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="provenance-step" x="44" y="142">01</text>
    <text class="provenance-name" x="70" y="142">Where the data originated, and who collected it</text>
    <text class="provenance-desc" x="44" y="166">With a date.</text>
  </g>
  <line class="provenance-line provenance-conn provenance-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#provenance-tip)"/>
  <g class="provenance-stage provenance-s1">
    <rect class="provenance-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="provenance-step" x="280" y="142">02</text>
    <text class="provenance-name" x="306" y="142">How it was collected, and from whom</text>
    <text class="provenance-desc" x="280" y="166">Which explains its biases.</text>
  </g>
  <line class="provenance-line provenance-conn provenance-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#provenance-tip)"/>
  <g class="provenance-stage provenance-s2">
    <rect class="provenance-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="provenance-step" x="516" y="142">03</text>
    <text class="provenance-name" x="542" y="142">Under what licence and consent it may be used</text>
    <text class="provenance-desc" x="516" y="166">Including onward use.</text>
  </g>
  <line class="provenance-line provenance-conn provenance-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#provenance-tip)"/>
  <g class="provenance-stage provenance-s3">
    <rect class="provenance-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="provenance-step" x="752" y="142">04</text>
    <text class="provenance-name" x="778" y="142">And every transformation applied since</text>
    <text class="provenance-desc" x="752" y="166">So a number can be traced to its</text>
    <text class="provenance-desc" x="752" y="182">source.</text>
  </g>
  <text class="provenance-sub" x="30" y="304">Being able to trace a number back to its source is what makes a system auditable, and it is increasingly a regulatory expectation rather than good practice.</text>
</svg>
