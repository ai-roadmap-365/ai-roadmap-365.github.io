<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Not for yourself.">
  <title>Writing for a reader</title>
  <style>
    .technical-writing-bg   { fill: #f8fafc; }
    .technical-writing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .technical-writing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .technical-writing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .technical-writing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .technical-writing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .technical-writing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .technical-writing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .technical-writing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .technical-writing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .technical-writing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .technical-writing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .technical-writing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .technical-writing-row { opacity: 1; }
    .technical-writing-r0 { animation-delay: 0.00s; }
    .technical-writing-r1 { animation-delay: 0.45s; }
    .technical-writing-r2 { animation-delay: 0.90s; }
    .technical-writing-r3 { animation-delay: 1.35s; }
    .technical-writing-r4 { animation-delay: 1.80s; }
    .technical-writing-row { animation: technical-writing-reveal 7.3s ease-in-out infinite; }
    @keyframes technical-writing-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="technical-writing-bg" width="980" height="390"/>
  <text class="technical-writing-h1"  x="30" y="40">Writing for a reader</text>
  <text class="technical-writing-sub" x="30" y="64">Not for yourself.</text>
  <rect class="technical-writing-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="technical-writing-name" x="46" y="122">Written for yourself</text>
  <text class="technical-writing-desc" x="46" y="142">Assumes your context.</text>
  <text class="technical-writing-desc technical-writing-row technical-writing-r0" x="46" y="182">Abbreviations only you know</text>
  <text class="technical-writing-desc technical-writing-row technical-writing-r1" x="46" y="216">Reasoning left in your head</text>
  <text class="technical-writing-desc technical-writing-row technical-writing-r2" x="46" y="250">Obvious to you, today</text>
  <text class="technical-writing-desc technical-writing-row technical-writing-r3" x="46" y="284">Incomprehensible in six months</text>
  <text class="technical-writing-desc technical-writing-row technical-writing-r4" x="46" y="318">This is unreadable code</text>
  <rect class="technical-writing-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="technical-writing-name" x="526" y="122">Written for a reader</text>
  <text class="technical-writing-desc" x="526" y="142">Supplies the context.</text>
  <text class="technical-writing-desc technical-writing-row technical-writing-r0" x="526" y="182">Names a stranger can follow</text>
  <text class="technical-writing-desc technical-writing-row technical-writing-r1" x="526" y="216">Reasoning recorded where it surprises</text>
  <text class="technical-writing-desc technical-writing-row technical-writing-r2" x="526" y="250">Obvious to anyone, any time</text>
  <text class="technical-writing-desc technical-writing-row technical-writing-r3" x="526" y="284">Still clear in six months</text>
  <text class="technical-writing-desc technical-writing-row technical-writing-r4" x="526" y="318">This is readable code</text>
  <text class="technical-writing-sub" x="30" y="372">The six-month test is the practical one, because the stranger who cannot follow your code is most often you, later.</text>
</svg>
