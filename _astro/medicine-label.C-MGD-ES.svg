<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Indications and contraindications.">
  <title>A medicine label</title>
  <style>
    .medicine-label-bg   { fill: #f8fafc; }
    .medicine-label-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .medicine-label-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .medicine-label-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .medicine-label-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .medicine-label-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .medicine-label-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .medicine-label-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .medicine-label-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .medicine-label-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .medicine-label-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .medicine-label-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .medicine-label-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .medicine-label-row { opacity: 1; }
    .medicine-label-r0 { animation-delay: 0.00s; }
    .medicine-label-r1 { animation-delay: 0.45s; }
    .medicine-label-r2 { animation-delay: 0.90s; }
    .medicine-label-r3 { animation-delay: 1.35s; }
    .medicine-label-r4 { animation-delay: 1.80s; }
    .medicine-label-row { animation: medicine-label-reveal 7.3s ease-in-out infinite; }
    @keyframes medicine-label-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="medicine-label-bg" width="980" height="390"/>
  <text class="medicine-label-h1"  x="30" y="40">A medicine label</text>
  <text class="medicine-label-sub" x="30" y="64">Indications and contraindications.</text>
  <rect class="medicine-label-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="medicine-label-name" x="46" y="122">No label</text>
  <text class="medicine-label-desc" x="46" y="142">Use at your discretion.</text>
  <text class="medicine-label-desc medicine-label-row medicine-label-r0" x="46" y="182">No stated purpose</text>
  <text class="medicine-label-desc medicine-label-row medicine-label-r1" x="46" y="216">No dosage or conditions</text>
  <text class="medicine-label-desc medicine-label-row medicine-label-r2" x="46" y="250">No contraindications</text>
  <text class="medicine-label-desc medicine-label-row medicine-label-r3" x="46" y="284">No known side effects listed</text>
  <text class="medicine-label-desc medicine-label-row medicine-label-r4" x="46" y="318">This is an undocumented model</text>
  <rect class="medicine-label-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="medicine-label-name" x="526" y="122">A proper label</text>
  <text class="medicine-label-desc" x="526" y="142">Indications and limits.</text>
  <text class="medicine-label-desc medicine-label-row medicine-label-r0" x="526" y="182">What it is for, specifically</text>
  <text class="medicine-label-desc medicine-label-row medicine-label-r1" x="526" y="216">Conditions of correct use</text>
  <text class="medicine-label-desc medicine-label-row medicine-label-r2" x="526" y="250">Who should not use it</text>
  <text class="medicine-label-desc medicine-label-row medicine-label-r3" x="526" y="284">Known adverse effects</text>
  <text class="medicine-label-desc medicine-label-row medicine-label-r4" x="526" y="318">This is a model card</text>
  <text class="medicine-label-sub" x="30" y="372">Contraindications are the closest parallel to the out-of-scope section, and in both cases they are the part that prevents the most harm.</text>
</svg>
