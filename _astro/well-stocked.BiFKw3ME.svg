<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Check before you shop.">
  <title>A well-stocked kitchen</title>
  <style>
    .well-stocked-bg   { fill: #f8fafc; }
    .well-stocked-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .well-stocked-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .well-stocked-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .well-stocked-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .well-stocked-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .well-stocked-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .well-stocked-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .well-stocked-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .well-stocked-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .well-stocked-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .well-stocked-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .well-stocked-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .well-stocked-row { opacity: 1; }
    .well-stocked-r0 { animation-delay: 0.00s; }
    .well-stocked-r1 { animation-delay: 0.45s; }
    .well-stocked-r2 { animation-delay: 0.90s; }
    .well-stocked-r3 { animation-delay: 1.35s; }
    .well-stocked-r4 { animation-delay: 1.80s; }
    .well-stocked-row { animation: well-stocked-reveal 7.3s ease-in-out infinite; }
    @keyframes well-stocked-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="well-stocked-bg" width="980" height="390"/>
  <text class="well-stocked-h1"  x="30" y="40">A well-stocked kitchen</text>
  <text class="well-stocked-sub" x="30" y="64">Check before you shop.</text>
  <rect class="well-stocked-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="well-stocked-name" x="46" y="122">Buying another</text>
  <text class="well-stocked-desc" x="46" y="142">Without looking.</text>
  <text class="well-stocked-desc well-stocked-row well-stocked-r0" x="46" y="182">Order a new gadget for each task</text>
  <text class="well-stocked-desc well-stocked-row well-stocked-r1" x="46" y="216">Drawers fill with near-duplicates</text>
  <text class="well-stocked-desc well-stocked-row well-stocked-r2" x="46" y="250">Each one must be maintained</text>
  <text class="well-stocked-desc well-stocked-row well-stocked-r3" x="46" y="284">Some arrive broken</text>
  <text class="well-stocked-desc well-stocked-row well-stocked-r4" x="46" y="318">This is adding dependencies reflexively</text>
  <rect class="well-stocked-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="well-stocked-name" x="526" y="122">Checking the drawer</text>
  <text class="well-stocked-desc" x="526" y="142">First.</text>
  <text class="well-stocked-desc well-stocked-row well-stocked-r0" x="526" y="182">Look at what is already there</text>
  <text class="well-stocked-desc well-stocked-row well-stocked-r1" x="526" y="216">Usually something fits</text>
  <text class="well-stocked-desc well-stocked-row well-stocked-r2" x="526" y="250">Nothing new to maintain</text>
  <text class="well-stocked-desc well-stocked-row well-stocked-r3" x="526" y="284">Known and reliable</text>
  <text class="well-stocked-desc well-stocked-row well-stocked-r4" x="526" y="318">This is checking the standard library</text>
  <text class="well-stocked-sub" x="30" y="372">The maintenance column is the one that compounds: an unused dependency still has to be updated, audited and eventually removed.</text>
</svg>
