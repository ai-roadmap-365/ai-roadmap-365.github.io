<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The stability index</title>
  <style>
    .psi-bg   { fill: #f8fafc; }
    .psi-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .psi-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .psi-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .psi-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .psi-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .psi-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .psi-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .psi-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .psi-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .psi-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .psi-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .psi-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .psi-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .psi-stage { opacity: 1; }

    .psi-s0 { animation-delay: 0.00s; }
    .psi-e0 { animation-delay: 0.00s; }
    .psi-s1 { animation-delay: 1.28s; }
    .psi-e1 { animation-delay: 1.28s; }
    .psi-s2 { animation-delay: 2.56s; }
    .psi-e2 { animation-delay: 2.56s; }
    .psi-s3 { animation-delay: 3.84s; }
    .psi-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .psi-conn  { animation: psi-trace 6.4s ease-in-out infinite; }
      .psi-stage { animation: psi-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes psi-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes psi-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .psi-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .psi-stage { animation: psi-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes psi-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="psi-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="psi-bg" width="980" height="322"/>
  <text class="psi-h1"  x="30" y="40">The stability index</text>
  <text class="psi-sub" x="30" y="64">Four steps.</text>
  <g class="psi-stage psi-s0">
    <rect class="psi-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="psi-step" x="44" y="142">01</text>
    <text class="psi-name" x="70" y="142">Bin the feature using the training distribution</text>
    <text class="psi-desc" x="44" y="166">Deciles, typically.</text>
  </g>
  <line class="psi-line psi-conn psi-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#psi-tip)"/>
  <g class="psi-stage psi-s1">
    <rect class="psi-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="psi-step" x="280" y="142">02</text>
    <text class="psi-name" x="306" y="142">Compare the proportion in each bin now against then</text>
    <text class="psi-desc" x="280" y="166">Which is where the shift shows.</text>
  </g>
  <line class="psi-line psi-conn psi-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#psi-tip)"/>
  <g class="psi-stage psi-s2">
    <rect class="psi-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="psi-step" x="516" y="142">03</text>
    <text class="psi-name" x="542" y="142">Sum a weighted log ratio across bins</text>
    <text class="psi-desc" x="516" y="166">Giving one number per feature.</text>
  </g>
  <line class="psi-line psi-conn psi-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#psi-tip)"/>
  <g class="psi-stage psi-s3">
    <rect class="psi-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="psi-step" x="752" y="142">04</text>
    <text class="psi-name" x="778" y="142">With conventional thresholds for action</text>
    <text class="psi-desc" x="752" y="166">Below 0.1 stable, above 0.25</text>
    <text class="psi-desc" x="752" y="182">significant.</text>
  </g>
  <text class="psi-sub" x="30" y="304">The thresholds are industry convention rather than statistics, which is worth knowing: they are a useful default and not a test with a false positive rate.</text>
</svg>
