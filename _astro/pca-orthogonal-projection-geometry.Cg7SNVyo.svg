<svg role="img" aria-label="Geometric diagram showing orthogonal projection of 2D data onto the first principal component axis PC1 and orthogonal axis PC2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>PCA Orthogonal Projection Geometry</title>
  <defs>
    <linearGradient id="bg185a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card185" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg185a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">PRINCIPAL COMPONENT ANALYSIS: MAXIMAL VARIANCE PROJECTION</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Orthogonal rotation to principal axes of covariance matrix Sigma = (1/(N-1)) X^T X</text>
  <g transform="translate(60, 90)">
    <rect width="730" height="290" fill="url(#card185)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <line x1="80" y1="240" x2="650" y2="240" stroke="#64748b" stroke-width="1.5"/>
    <line x1="365" y1="260" x2="365" y2="30" stroke="#64748b" stroke-width="1.5"/>
    <line x1="140" y1="230" x2="590" y2="60" stroke="#38bdf8" stroke-width="3"/>
    <text x="600" y="55" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700">PC1 (Max Variance w_1)</text>
    <line x1="280" y1="70" x2="450" y2="220" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="460" y="235" fill="#fbbf24" font-family="system-ui" font-size="12" font-weight="700">PC2 (Orthogonal w_2)</text>
    <circle cx="200" cy="205" r="5" fill="#93c5fd"/>
    <circle cx="260" cy="180" r="5" fill="#93c5fd"/>
    <circle cx="320" cy="165" r="5" fill="#93c5fd"/>
    <circle cx="380" cy="135" r="5" fill="#93c5fd"/>
    <circle cx="440" cy="120" r="5" fill="#93c5fd"/>
    <circle cx="500" cy="95" r="5" fill="#93c5fd"/>
    <line x1="380" y1="135" x2="395" y2="130" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2,2"/>
    <text x="365" y="275" fill="#cbd5e1" font-family="system-ui" font-size="11" text-anchor="middle">Orthogonal Projection: z_i = x_i . w_1 | Residual Error Minimized</text>
  </g>
</svg>
