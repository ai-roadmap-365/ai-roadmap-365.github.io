<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" role="img" font-family="system-ui, sans-serif">
  <title>The path of one change through a quality gate: edit, fast pre-commit hook, push, clean checkout on a continuous-integration runner, install pinned dependencies, then the five ordered stages of format, lint, types, tests and coverage, each with a red branch that returns feedback to the developer, ending at branch protection which either allows or blocks the merge</title>
  <rect x="0" y="0" width="900" height="780" fill="#f8fafc"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">One change, from edit to merge</text>

  <!-- Feedback column label -->
  <text x="792" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">feedback returns</text>
  <text x="792" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">to the developer</text>

  <!-- Local band -->
  <rect x="30" y="56" width="560" height="152" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="46" y="80" font-size="15" font-weight="bold" fill="#1a202c">On your machine — seconds</text>

  <rect x="52" y="94" width="150" height="60" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="6"/>
  <text x="127" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">edit</text>
  <text x="127" y="140" text-anchor="middle" font-size="14" fill="#1a202c">write the change</text>

  <rect x="232" y="94" width="180" height="60" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="6"/>
  <text x="322" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">pre-commit hook</text>
  <text x="322" y="140" text-anchor="middle" font-size="14" fill="#1d4ed8">fast checks only</text>

  <rect x="442" y="94" width="130" height="60" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="6"/>
  <text x="507" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">push</text>
  <text x="507" y="140" text-anchor="middle" font-size="14" fill="#1a202c">to the branch</text>

  <text x="322" y="180" text-anchor="middle" font-size="14" fill="#1a202c">a slow hook gets skipped with --no-verify — keep it under a second</text>

  <line x1="204" y1="124" x2="228" y2="124" stroke="#1a202c" stroke-width="2"/>
  <polygon points="230,124 216,118 216,130" fill="#1a202c"/>
  <line x1="414" y1="124" x2="438" y2="124" stroke="#1a202c" stroke-width="2"/>
  <polygon points="440,124 426,118 426,130" fill="#1a202c"/>
  <line x1="507" y1="156" x2="507" y2="222" stroke="#1a202c" stroke-width="2"/>
  <polygon points="507,224 501,210 513,210" fill="#1a202c"/>

  <!-- CI band -->
  <rect x="30" y="228" width="720" height="464" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="46" y="252" font-size="15" font-weight="bold" fill="#1a202c">On a clean machine — the same bash check.sh</text>

  <rect x="60" y="266" width="200" height="54" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="6"/>
  <text x="160" y="288" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">clean checkout</text>
  <text x="160" y="309" text-anchor="middle" font-size="14" fill="#1a202c">one commit, nothing else</text>

  <rect x="292" y="266" width="220" height="54" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="6"/>
  <text x="402" y="288" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">install pinned deps</text>
  <text x="402" y="309" text-anchor="middle" font-size="14" fill="#1d4ed8">requirements.txt</text>

  <rect x="544" y="266" width="180" height="54" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="6"/>
  <text x="634" y="288" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">build matrix</text>
  <text x="634" y="309" text-anchor="middle" font-size="14" fill="#1a202c">3.10 · 3.11 · 3.12</text>

  <line x1="262" y1="293" x2="288" y2="293" stroke="#1a202c" stroke-width="2"/>
  <polygon points="290,293 276,287 276,299" fill="#1a202c"/>
  <line x1="514" y1="293" x2="540" y2="293" stroke="#1a202c" stroke-width="2"/>
  <polygon points="542,293 528,287 528,299" fill="#1a202c"/>
  <line x1="160" y1="322" x2="160" y2="348" stroke="#1a202c" stroke-width="2"/>
  <polygon points="160,350 154,336 166,336" fill="#1a202c"/>

  <!-- Stages -->
  <rect x="60" y="352" width="300" height="46" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="6"/>
  <text x="76" y="381" font-size="15" fill="#1a202c">1. format — layout matches?</text>
  <rect x="60" y="410" width="300" height="46" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="6"/>
  <text x="76" y="439" font-size="15" fill="#1a202c">2. lint — banned patterns?</text>
  <rect x="60" y="468" width="300" height="46" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="6"/>
  <text x="76" y="497" font-size="15" fill="#1a202c">3. types — annotations hold?</text>
  <rect x="60" y="526" width="300" height="46" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="6"/>
  <text x="76" y="555" font-size="15" fill="#1a202c">4. tests — asserted behaviour?</text>
  <rect x="60" y="584" width="300" height="46" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="6"/>
  <text x="76" y="613" font-size="15" fill="#1a202c">5. coverage — above the floor?</text>

  <line x1="210" y1="400" x2="210" y2="408" stroke="#1a202c" stroke-width="2"/>
  <line x1="210" y1="458" x2="210" y2="466" stroke="#1a202c" stroke-width="2"/>
  <line x1="210" y1="516" x2="210" y2="524" stroke="#1a202c" stroke-width="2"/>
  <line x1="210" y1="574" x2="210" y2="582" stroke="#1a202c" stroke-width="2"/>

  <!-- red branches -->
  <line x1="362" y1="375" x2="700" y2="375" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="362" y1="433" x2="700" y2="433" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="362" y1="491" x2="700" y2="491" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="362" y1="549" x2="700" y2="549" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="362" y1="607" x2="700" y2="607" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="530" y="368" text-anchor="middle" font-size="14" fill="#1d4ed8">fail</text>
  <text x="530" y="426" text-anchor="middle" font-size="14" fill="#1d4ed8">fail</text>
  <text x="530" y="484" text-anchor="middle" font-size="14" fill="#1d4ed8">fail</text>
  <text x="530" y="542" text-anchor="middle" font-size="14" fill="#1d4ed8">fail</text>
  <text x="530" y="600" text-anchor="middle" font-size="14" fill="#1d4ed8">fail</text>

  <rect x="700" y="352" width="170" height="278" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="785" y="440" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">back to you</text>
  <text x="785" y="464" text-anchor="middle" font-size="14" fill="#1a202c">with the stage name</text>
  <text x="785" y="486" text-anchor="middle" font-size="14" fill="#1a202c">and the tool's message</text>
  <text x="785" y="514" text-anchor="middle" font-size="14" fill="#1d4ed8">exit 1 — no merge</text>
  <text x="785" y="546" text-anchor="middle" font-size="14" fill="#1a202c">--fail-fast: stop here</text>
  <text x="785" y="568" text-anchor="middle" font-size="14" fill="#1a202c">default: finish and</text>
  <text x="785" y="588" text-anchor="middle" font-size="14" fill="#1a202c">report every failure</text>

  <text x="210" y="656" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">all five green</text>
  <line x1="210" y1="632" x2="210" y2="640" stroke="#1a202c" stroke-width="2"/>
  <line x1="210" y1="662" x2="210" y2="706" stroke="#1a202c" stroke-width="2"/>
  <polygon points="210,708 204,694 216,694" fill="#1a202c"/>

  <!-- Verdict -->
  <rect x="60" y="712" width="330" height="52" fill="#ffffff" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="225" y="736" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">exit 0 — branch protection</text>
  <text x="225" y="756" text-anchor="middle" font-size="14" fill="#1d4ed8">merge allowed</text>

  <rect x="430" y="712" width="330" height="52" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="595" y="736" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">exit 1 — branch protection</text>
  <text x="595" y="756" text-anchor="middle" font-size="14" fill="#1d4ed8">merge blocked</text>

  <line x1="785" y1="632" x2="785" y2="726" stroke="#1a202c" stroke-width="2"/>
  <line x1="785" y1="726" x2="764" y2="726" stroke="#1a202c" stroke-width="2"/>
  <polygon points="762,726 776,720 776,732" fill="#1a202c"/>
</svg>
