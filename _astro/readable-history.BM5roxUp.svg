<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward automation.">
  <title>Four steps in readability practice</title>
  <style>
    .readable-history-bg   { fill: #f8fafc; }
    .readable-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readable-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readable-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readable-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readable-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readable-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .readable-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .readable-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .readable-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .readable-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .readable-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .readable-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .readable-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .readable-history-stage { opacity: 1; }

    .readable-history-s0 { animation-delay: 0.00s; }
    .readable-history-e0 { animation-delay: 0.00s; }
    .readable-history-s1 { animation-delay: 1.28s; }
    .readable-history-e1 { animation-delay: 1.28s; }
    .readable-history-s2 { animation-delay: 2.56s; }
    .readable-history-e2 { animation-delay: 2.56s; }
    .readable-history-s3 { animation-delay: 3.84s; }
    .readable-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .readable-history-conn  { animation: readable-history-trace 6.4s ease-in-out infinite; }
      .readable-history-stage { animation: readable-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes readable-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes readable-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .readable-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .readable-history-stage { animation: readable-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes readable-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="readable-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="readable-history-bg" width="980" height="322"/>
  <text class="readable-history-h1"  x="30" y="40">Four steps in readability practice</text>
  <text class="readable-history-sub" x="30" y="64">Toward automation.</text>
  <g class="readable-history-stage readable-history-s0">
    <rect class="readable-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="readable-history-step" x="44" y="142">01</text>
    <text class="readable-history-name" x="70" y="142">Personal style, differing per author</text>
    <text class="readable-history-desc" x="44" y="166">Which made every file feel</text>
    <text class="readable-history-desc" x="44" y="182">different.</text>
  </g>
  <line class="readable-history-line readable-history-conn readable-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#readable-history-tip)"/>
  <g class="readable-history-stage readable-history-s1">
    <rect class="readable-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="readable-history-step" x="280" y="142">02</text>
    <text class="readable-history-name" x="306" y="142">Then written style guides</text>
    <text class="readable-history-desc" x="280" y="166">Which needed people to remember</text>
    <text class="readable-history-desc" x="280" y="182">them.</text>
  </g>
  <line class="readable-history-line readable-history-conn readable-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#readable-history-tip)"/>
  <g class="readable-history-stage readable-history-s2">
    <rect class="readable-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="readable-history-step" x="516" y="142">03</text>
    <text class="readable-history-name" x="542" y="142">Then linters that checked mechanically</text>
    <text class="readable-history-desc" x="516" y="166">Turning a guide into a gate.</text>
  </g>
  <line class="readable-history-line readable-history-conn readable-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#readable-history-tip)"/>
  <g class="readable-history-stage readable-history-s3">
    <rect class="readable-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="readable-history-step" x="752" y="142">04</text>
    <text class="readable-history-name" x="778" y="142">And formatters that simply rewrite the code</text>
    <text class="readable-history-desc" x="752" y="166">Which ended the discussion</text>
    <text class="readable-history-desc" x="752" y="182">entirely.</text>
  </g>
  <text class="readable-history-sub" x="30" y="304">Automated formatting ended style debates by removing the choice, which is the same pattern as every other convention-turned-gate in this curriculum.</text>
</svg>
