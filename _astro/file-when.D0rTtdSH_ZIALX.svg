<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By size and durability.">
  <title>Which approach when</title>
  <style>
    .file-when-bg   { fill: #f8fafc; }
    .file-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .file-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .file-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .file-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .file-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .file-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .file-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .file-when-row { opacity: 1; }
    .file-when-r0 { animation-delay: 0.00s; }
    .file-when-r1 { animation-delay: 0.45s; }
    .file-when-r2 { animation-delay: 0.90s; }
    .file-when-r3 { animation-delay: 1.35s; }
    .file-when-r4 { animation-delay: 1.80s; }
    .file-when-row { animation: file-when-reveal 7.3s ease-in-out infinite; }
    @keyframes file-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="file-when-bg" width="980" height="390"/>
  <text class="file-when-h1"  x="30" y="40">Which approach when</text>
  <text class="file-when-sub" x="30" y="64">By size and durability.</text>
  <rect class="file-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="file-when-name" x="46" y="122">The requirement</text>
  <text class="file-when-desc" x="46" y="142">What you need.</text>
  <text class="file-when-desc file-when-row file-when-r0" x="46" y="182">A small configuration file</text>
  <text class="file-when-desc file-when-row file-when-r1" x="46" y="216">A file larger than memory</text>
  <text class="file-when-desc file-when-row file-when-r2" x="46" y="250">A file that must never be half-written</text>
  <text class="file-when-desc file-when-row file-when-r3" x="46" y="284">Structured records appended over time</text>
  <text class="file-when-desc file-when-row file-when-r4" x="46" y="318">Binary data such as images</text>
  <rect class="file-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="file-when-name" x="526" y="122">The approach</text>
  <text class="file-when-desc" x="526" y="142">What to do.</text>
  <text class="file-when-desc file-when-row file-when-r0" x="526" y="182">Read it whole; simplicity wins</text>
  <text class="file-when-desc file-when-row file-when-r1" x="526" y="216">Iterate line by line, or in chunks</text>
  <text class="file-when-desc file-when-row file-when-r2" x="526" y="250">Write to a temporary file and rename</text>
  <text class="file-when-desc file-when-row file-when-r3" x="526" y="284">Line-delimited JSON, appended</text>
  <text class="file-when-desc file-when-row file-when-r4" x="526" y="318">Binary mode, and no encoding</text>
  <text class="file-when-sub" x="30" y="372">The line-delimited format in the fourth row is what makes an appended log both streamable and recoverable after a partial write, which is why training data uses it.</text>
</svg>
