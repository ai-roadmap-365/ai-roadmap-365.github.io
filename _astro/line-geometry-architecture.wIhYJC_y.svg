<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 760" role="img" aria-labelledby="d148a-title d148a-desc" width="1040" height="760">
  <title id="d148a-title">A fitted line, and the two facts that always hold</title>
  <desc id="d148a-desc">A scatterplot with a fitted straight line, labelled with the slope, the intercept, the point of means the line passes through exactly, and a residual panel beneath showing that the leftover errors sum to zero.</desc>
  <style>
    .d148a-bg { fill: #f8fafc; }
    .d148a-title { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 26px; font-weight: 700; }
    .d148a-head { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 18px; font-weight: 700; }
    .d148a-label { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; }
    .d148a-strong { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; }
    .d148a-muted { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d148a-axis { stroke: #1a202c; stroke-width: 2; }
    .d148a-point { fill: #1d4ed8; opacity: 0.55; }
    .d148a-line { stroke: #1d4ed8; stroke-width: 3; fill: none; }
    .d148a-mean { fill: #1a202c; stroke: #f8fafc; stroke-width: 2; }
    .d148a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .d148a-callout { stroke: #1d4ed8; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
    .d148a-zero { stroke: #94a3b8; stroke-width: 1.5; }
    .d148a-resid-pos { stroke: #1d4ed8; stroke-width: 3; }
    .d148a-resid-neg { stroke: #1a202c; stroke-width: 3; }
  </style>
  <rect class="d148a-bg" x="0" y="0" width="1040" height="760"/>
  <marker id="d148a-arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
  </marker>

  <text class="d148a-title" x="520" y="42" text-anchor="middle">One predictor, one line, two facts that always hold</text>
  <text class="d148a-muted" x="520" y="68" text-anchor="middle">A slope and an intercept are the whole model -- and a fitted line makes claims you can check.</text>

  <!-- scatter plot -->
  <g>
    <line class="d148a-axis" x1="90" y1="110" x2="90" y2="420" marker-end="url(#d148a-arrowhead)"/>
    <line class="d148a-axis" x1="90" y1="420" x2="640" y2="420" marker-end="url(#d148a-arrowhead)"/>
    <text class="d148a-muted" x="365" y="450" text-anchor="middle">predictor x</text>
    <text class="d148a-muted" x="60" y="265" text-anchor="middle" transform="rotate(-90 60 265)">target y</text>

    <!-- scattered points around an upward line -->
    <circle class="d148a-point" cx="130" cy="360" r="6"/>
    <circle class="d148a-point" cx="150" cy="330" r="6"/>
    <circle class="d148a-point" cx="175" cy="345" r="6"/>
    <circle class="d148a-point" cx="195" cy="300" r="6"/>
    <circle class="d148a-point" cx="220" cy="320" r="6"/>
    <circle class="d148a-point" cx="245" cy="275" r="6"/>
    <circle class="d148a-point" cx="270" cy="295" r="6"/>
    <circle class="d148a-point" cx="290" cy="250" r="6"/>
    <circle class="d148a-point" cx="315" cy="265" r="6"/>
    <circle class="d148a-point" cx="340" cy="230" r="6"/>
    <circle class="d148a-point" cx="360" cy="245" r="6"/>
    <circle class="d148a-point" cx="385" cy="205" r="6"/>
    <circle class="d148a-point" cx="410" cy="220" r="6"/>
    <circle class="d148a-point" cx="430" cy="185" r="6"/>
    <circle class="d148a-point" cx="455" cy="195" r="6"/>
    <circle class="d148a-point" cx="480" cy="160" r="6"/>
    <circle class="d148a-point" cx="505" cy="175" r="6"/>
    <circle class="d148a-point" cx="525" cy="140" r="6"/>
    <circle class="d148a-point" cx="550" cy="155" r="6"/>
    <circle class="d148a-point" cx="575" cy="125" r="6"/>

    <!-- fitted line -->
    <path class="d148a-line" d="M 100 375 L 610 130"/>

    <!-- point of means -->
    <circle class="d148a-mean" cx="355" cy="252" r="7"/>
    <path class="d148a-callout" d="M 355 252 L 355 480"/>
  </g>

  <!-- callout cards -->
  <rect class="d148a-card" x="660" y="100" width="340" height="120" rx="8"/>
  <text class="d148a-head" x="680" y="130">Slope</text>
  <text class="d148a-label" x="680" y="156">The change in y per one unit of x,</text>
  <text class="d148a-label" x="680" y="178">in the target's real units -- not a</text>
  <text class="d148a-label" x="680" y="200">standardized or scaled one.</text>

  <rect class="d148a-card" x="660" y="234" width="340" height="120" rx="8"/>
  <text class="d148a-head" x="680" y="264">Intercept</text>
  <text class="d148a-label" x="680" y="290">The predicted y when x is zero.</text>
  <text class="d148a-label" x="680" y="312">Only meaningful when x near zero</text>
  <text class="d148a-label" x="680" y="334">is a real situation for your data.</text>

  <rect class="d148a-card" x="660" y="368" width="340" height="120" rx="8"/>
  <text class="d148a-head" x="680" y="398">The point of means</text>
  <text class="d148a-label" x="680" y="424">The fitted line passes exactly</text>
  <text class="d148a-label" x="680" y="446">through (mean(x), mean(y)) --</text>
  <text class="d148a-label" x="680" y="468">a guarantee, not a measurement.</text>

  <!-- residual panel -->
  <rect class="d148a-card" x="40" y="520" width="960" height="200" rx="10"/>
  <text class="d148a-head" x="60" y="550">Residuals: actual minus predicted, for each point above</text>
  <text class="d148a-muted" x="60" y="572">Fitted with an intercept, these always sum to (essentially) zero -- a property of the fit, not a coincidence.</text>

  <line class="d148a-zero" x1="90" y1="650" x2="960" y2="650"/>
  <text class="d148a-muted" x="90" y="672">0</text>

  <line class="d148a-resid-neg" x1="130" y1="650" x2="130" y2="680"/>
  <line class="d148a-resid-pos" x1="175" y1="650" x2="175" y2="622"/>
  <line class="d148a-resid-neg" x1="220" y1="650" x2="220" y2="668"/>
  <line class="d148a-resid-pos" x1="270" y1="650" x2="270" y2="612"/>
  <line class="d148a-resid-neg" x1="315" y1="650" x2="315" y2="678"/>
  <line class="d148a-resid-pos" x1="360" y1="650" x2="360" y2="618"/>
  <line class="d148a-resid-neg" x1="410" y1="650" x2="410" y2="672"/>
  <line class="d148a-resid-pos" x1="455" y1="650" x2="455" y2="626"/>
  <line class="d148a-resid-neg" x1="505" y1="650" x2="505" y2="662"/>
  <line class="d148a-resid-pos" x1="550" y1="650" x2="550" y2="616"/>

  <text class="d148a-strong" x="990" y="700" text-anchor="end">sum of all residuals ~ 0</text>
</svg>
