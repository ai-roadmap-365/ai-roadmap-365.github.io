<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" role="img" font-family="system-ui, sans-serif">
  <title>How @dataclass builds a class: you write a class body containing only annotated field declarations; at class-creation time the decorator reads the class's __annotations__ dictionary and the class-body values beside it, turning each annotated name into a Field object that records its name, its annotation, and its default or default_factory; from that ordered list of fields it generates __init__, __repr__ and __eq__ as ordinary functions and attaches them to the class; the finished class then constructs instances that each hold their own attribute values, with default_factory called once per instance so no two instances share a mutable default.</title>
  <rect x="0" y="0" width="980" height="760" fill="#f8fafc"/>

  <text x="490" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a202c">What @dataclass generates, and what it reads to do it</text>
  <text x="490" y="62" text-anchor="middle" font-size="14" fill="#1a202c">A decorator that runs once, when the class is created — not when instances are made.</text>

  <!-- STAGE 1: annotated declarations -->
  <rect x="30" y="90" width="290" height="230" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="175" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">1 · What you write</text>
  <text x="46" y="146" font-size="14" fill="#1d4ed8">@dataclass</text>
  <text x="46" y="168" font-size="14" fill="#1a202c">class EvalRecord:</text>
  <text x="60" y="190" font-size="14" fill="#1a202c">prompt: str</text>
  <text x="60" y="212" font-size="14" fill="#1a202c">expected: str</text>
  <text x="60" y="234" font-size="14" fill="#1a202c">score: float = 0.0</text>
  <text x="60" y="256" font-size="14" fill="#1a202c">tags: list[str] = field(</text>
  <text x="74" y="276" font-size="14" fill="#1d4ed8">default_factory=list)</text>
  <text x="175" y="302" text-anchor="middle" font-size="14" fill="#1a202c">Declarations only. No __init__.</text>

  <!-- arrow 1->2 -->
  <line x1="320" y1="200" x2="378" y2="200" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="384,200 372,194 372,206" fill="#1d4ed8"/>

  <!-- STAGE 2: what the decorator reads -->
  <rect x="388" y="90" width="290" height="230" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="533" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">2 · What the decorator reads</text>
  <text x="404" y="146" font-size="14" font-weight="bold" fill="#1d4ed8">cls.__annotations__</text>
  <text x="404" y="168" font-size="14" fill="#1a202c">{'prompt': str,</text>
  <text x="404" y="190" font-size="14" fill="#1a202c">&#160;'expected': str,</text>
  <text x="404" y="212" font-size="14" fill="#1a202c">&#160;'score': float,</text>
  <text x="404" y="234" font-size="14" fill="#1a202c">&#160;'tags': list[str]}</text>
  <text x="404" y="262" font-size="14" fill="#1a202c">plus any value sitting beside</text>
  <text x="404" y="282" font-size="14" fill="#1a202c">each name in the class body</text>
  <text x="404" y="302" font-size="14" fill="#1a202c">(the default, or a field(...) spec)</text>

  <!-- arrow 2->3 -->
  <line x1="678" y1="200" x2="736" y2="200" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="742,200 730,194 730,206" fill="#1d4ed8"/>

  <!-- STAGE 3: Field objects -->
  <rect x="746" y="90" width="204" height="230" fill="#fef9c3" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="848" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">3 · Field objects</text>
  <text x="762" y="146" font-size="14" fill="#1a202c">one per annotated</text>
  <text x="762" y="166" font-size="14" fill="#1a202c">name, in order:</text>
  <text x="762" y="194" font-size="14" fill="#1d4ed8">.name</text>
  <text x="762" y="216" font-size="14" fill="#1d4ed8">.type</text>
  <text x="762" y="238" font-size="14" fill="#1d4ed8">.default</text>
  <text x="762" y="260" font-size="14" fill="#1d4ed8">.default_factory</text>
  <text x="762" y="288" font-size="14" fill="#1a202c">readable later via</text>
  <text x="762" y="308" font-size="14" fill="#1a202c">dataclasses.fields()</text>

  <!-- down arrow to stage 4 -->
  <line x1="848" y1="320" x2="848" y2="356" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="848,362 842,350 854,350" fill="#1d4ed8"/>
  <text x="836" y="344" text-anchor="end" font-size="14" fill="#1a202c">code generation</text>

  <!-- STAGE 4: generated methods attached to the class -->
  <rect x="200" y="366" width="750" height="180" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="575" y="394" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">4 · Generated methods, attached to the class itself</text>

  <rect x="220" y="410" width="228" height="116" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="334" y="436" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">__init__</text>
  <text x="334" y="460" text-anchor="middle" font-size="14" fill="#1a202c">one parameter per field,</text>
  <text x="334" y="480" text-anchor="middle" font-size="14" fill="#1a202c">in declaration order,</text>
  <text x="334" y="500" text-anchor="middle" font-size="14" fill="#1a202c">defaults last; then it</text>
  <text x="334" y="518" text-anchor="middle" font-size="14" fill="#1a202c">calls __post_init__</text>

  <rect x="462" y="410" width="228" height="116" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="576" y="436" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">__repr__</text>
  <text x="576" y="460" text-anchor="middle" font-size="14" fill="#1a202c">ClassName(name=value,</text>
  <text x="576" y="480" text-anchor="middle" font-size="14" fill="#1a202c">...) for every field</text>
  <text x="576" y="500" text-anchor="middle" font-size="14" fill="#1a202c">whose spec did not</text>
  <text x="576" y="518" text-anchor="middle" font-size="14" fill="#1a202c">say repr=False</text>

  <rect x="704" y="410" width="228" height="116" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="818" y="436" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">__eq__</text>
  <text x="818" y="460" text-anchor="middle" font-size="14" fill="#1a202c">compares the tuple of</text>
  <text x="818" y="480" text-anchor="middle" font-size="14" fill="#1a202c">field values, but only</text>
  <text x="818" y="500" text-anchor="middle" font-size="14" fill="#1a202c">against the same class</text>
  <text x="818" y="518" text-anchor="middle" font-size="14" fill="#1a202c">(else NotImplemented)</text>

  <!-- optional extras note -->
  <rect x="30" y="366" width="150" height="180" fill="#f8fafc" stroke="#1a202c" stroke-width="2" rx="10" stroke-dasharray="5 4"/>
  <text x="105" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">On request</text>
  <text x="46" y="420" font-size="14" fill="#1a202c">frozen=True</text>
  <text x="46" y="442" font-size="14" fill="#1a202c">→ __setattr__</text>
  <text x="46" y="462" font-size="14" fill="#1a202c">&#160;&#160;&#160;+ __hash__</text>
  <text x="46" y="486" font-size="14" fill="#1a202c">order=True</text>
  <text x="46" y="506" font-size="14" fill="#1a202c">→ __lt__ __le__</text>
  <text x="46" y="526" font-size="14" fill="#1a202c">&#160;&#160;&#160;__gt__ __ge__</text>

  <!-- down arrow to instances -->
  <line x1="575" y1="546" x2="575" y2="592" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="575,598 569,586 581,586" fill="#1d4ed8"/>
  <text x="590" y="576" font-size="14" fill="#1a202c">calling the class runs the generated __init__</text>

  <!-- STAGE 5: instances -->
  <rect x="200" y="602" width="360" height="120" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="380" y="628" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">instance A</text>
  <text x="216" y="652" font-size="14" fill="#1a202c">prompt='2+2?'&#160;&#160;expected='4'</text>
  <text x="216" y="674" font-size="14" fill="#1a202c">score=0.0</text>
  <text x="216" y="698" font-size="14" font-weight="bold" fill="#1d4ed8">tags=[]&#160;&#160;← its own new list</text>

  <rect x="590" y="602" width="360" height="120" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="770" y="628" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">instance B</text>
  <text x="606" y="652" font-size="14" fill="#1a202c">prompt='Capital?'&#160;&#160;expected='Paris'</text>
  <text x="606" y="674" font-size="14" fill="#1a202c">score=1.0</text>
  <text x="606" y="698" font-size="14" font-weight="bold" fill="#1d4ed8">tags=[]&#160;&#160;← a different new list</text>

  <text x="30" y="626" font-size="14" font-weight="bold" fill="#1d4ed8">default_factory</text>
  <text x="30" y="646" font-size="14" fill="#1a202c">is CALLED once</text>
  <text x="30" y="666" font-size="14" fill="#1a202c">per instance —</text>
  <text x="30" y="686" font-size="14" fill="#1a202c">that is why the</text>
  <text x="30" y="706" font-size="14" fill="#1a202c">two lists differ.</text>
</svg>
