<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which is what keeps the record honest.">
  <title>Undoing adds to history rather than removing from it</title>
  <style>
    .undo-is-a-new-commit-bg   { fill: #f8fafc; }
    .undo-is-a-new-commit-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .undo-is-a-new-commit-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .undo-is-a-new-commit-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .undo-is-a-new-commit-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .undo-is-a-new-commit-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .undo-is-a-new-commit-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .undo-is-a-new-commit-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .undo-is-a-new-commit-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .undo-is-a-new-commit-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .undo-is-a-new-commit-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .undo-is-a-new-commit-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .undo-is-a-new-commit-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .undo-is-a-new-commit-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .undo-is-a-new-commit-stage { opacity: 1; }

    .undo-is-a-new-commit-s0 { animation-delay: 0.00s; }
    .undo-is-a-new-commit-e0 { animation-delay: 0.00s; }
    .undo-is-a-new-commit-s1 { animation-delay: 1.28s; }
    .undo-is-a-new-commit-e1 { animation-delay: 1.28s; }
    .undo-is-a-new-commit-s2 { animation-delay: 2.56s; }
    .undo-is-a-new-commit-e2 { animation-delay: 2.56s; }
    .undo-is-a-new-commit-s3 { animation-delay: 3.84s; }
    .undo-is-a-new-commit-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .undo-is-a-new-commit-conn  { animation: undo-is-a-new-commit-trace 6.4s ease-in-out infinite; }
      .undo-is-a-new-commit-stage { animation: undo-is-a-new-commit-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes undo-is-a-new-commit-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes undo-is-a-new-commit-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .undo-is-a-new-commit-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .undo-is-a-new-commit-stage { animation: undo-is-a-new-commit-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes undo-is-a-new-commit-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="undo-is-a-new-commit-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="undo-is-a-new-commit-bg" width="980" height="322"/>
  <text class="undo-is-a-new-commit-h1"  x="30" y="40">Undoing adds to history rather than removing from it</text>
  <text class="undo-is-a-new-commit-sub" x="30" y="64">Which is what keeps the record honest.</text>
  <g class="undo-is-a-new-commit-stage undo-is-a-new-commit-s0">
    <rect class="undo-is-a-new-commit-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="undo-is-a-new-commit-step" x="44" y="142">01</text>
    <text class="undo-is-a-new-commit-name" x="70" y="142">A commit introduces a mistake</text>
    <text class="undo-is-a-new-commit-desc" x="44" y="166">It is recorded, like everything</text>
    <text class="undo-is-a-new-commit-desc" x="44" y="182">else.</text>
  </g>
  <line class="undo-is-a-new-commit-line undo-is-a-new-commit-conn undo-is-a-new-commit-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#undo-is-a-new-commit-tip)"/>
  <g class="undo-is-a-new-commit-stage undo-is-a-new-commit-s1">
    <rect class="undo-is-a-new-commit-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="undo-is-a-new-commit-step" x="280" y="142">02</text>
    <text class="undo-is-a-new-commit-name" x="306" y="142">You revert it</text>
    <text class="undo-is-a-new-commit-desc" x="280" y="166">A NEW commit whose content</text>
    <text class="undo-is-a-new-commit-desc" x="280" y="182">restores the previous state.</text>
    <text class="undo-is-a-new-commit-edge" x="280" y="242">new commit</text>
  </g>
  <line class="undo-is-a-new-commit-line undo-is-a-new-commit-conn undo-is-a-new-commit-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#undo-is-a-new-commit-tip)"/>
  <g class="undo-is-a-new-commit-stage undo-is-a-new-commit-s2">
    <rect class="undo-is-a-new-commit-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="undo-is-a-new-commit-step" x="516" y="142">03</text>
    <text class="undo-is-a-new-commit-name" x="542" y="142">Both remain in the history</text>
    <text class="undo-is-a-new-commit-desc" x="516" y="166">The mistake, and the correction.</text>
    <text class="undo-is-a-new-commit-desc" x="516" y="182">Nothing was erased.</text>
  </g>
  <line class="undo-is-a-new-commit-line undo-is-a-new-commit-conn undo-is-a-new-commit-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#undo-is-a-new-commit-tip)"/>
  <g class="undo-is-a-new-commit-stage undo-is-a-new-commit-s3">
    <rect class="undo-is-a-new-commit-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="undo-is-a-new-commit-step" x="752" y="142">04</text>
    <text class="undo-is-a-new-commit-name" x="778" y="142">So the record stays true</text>
    <text class="undo-is-a-new-commit-desc" x="752" y="166">Someone reading later sees what</text>
    <text class="undo-is-a-new-commit-desc" x="752" y="182">happened, not a tidied version</text>
    <text class="undo-is-a-new-commit-desc" x="752" y="198">of it.</text>
    <text class="undo-is-a-new-commit-edge" x="752" y="242">honest</text>
  </g>
  <text class="undo-is-a-new-commit-sub" x="30" y="304">This is also why a committed secret stays compromised: the revert adds a commit, and the original is still sitting in the history for anyone who looks.</text>
</svg>
