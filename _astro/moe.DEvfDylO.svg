<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="More parameters, same cost per token.">
  <title>Sparse expert models</title>
  <style>
    .moe-bg   { fill: #f8fafc; }
    .moe-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .moe-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .moe-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .moe-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .moe-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .moe-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .moe-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .moe-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .moe-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .moe-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .moe-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .moe-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .moe-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .moe-stage { opacity: 1; }

    .moe-s0 { animation-delay: 0.00s; }
    .moe-e0 { animation-delay: 0.00s; }
    .moe-s1 { animation-delay: 1.28s; }
    .moe-e1 { animation-delay: 1.28s; }
    .moe-s2 { animation-delay: 2.56s; }
    .moe-e2 { animation-delay: 2.56s; }
    .moe-s3 { animation-delay: 3.84s; }
    .moe-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .moe-conn  { animation: moe-trace 6.4s ease-in-out infinite; }
      .moe-stage { animation: moe-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes moe-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes moe-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .moe-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .moe-stage { animation: moe-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes moe-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="moe-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="moe-bg" width="980" height="322"/>
  <text class="moe-h1"  x="30" y="40">Sparse expert models</text>
  <text class="moe-sub" x="30" y="64">More parameters, same cost per token.</text>
  <g class="moe-stage moe-s0">
    <rect class="moe-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="moe-step" x="44" y="142">01</text>
    <text class="moe-name" x="70" y="142">Replace one feed-forward block with many</text>
    <text class="moe-desc" x="44" y="166">Each an independent expert.</text>
  </g>
  <line class="moe-line moe-conn moe-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#moe-tip)"/>
  <g class="moe-stage moe-s1">
    <rect class="moe-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="moe-step" x="280" y="142">02</text>
    <text class="moe-name" x="306" y="142">A router picks a few per token</text>
    <text class="moe-desc" x="280" y="166">Usually two, out of eight or</text>
    <text class="moe-desc" x="280" y="182">more.</text>
  </g>
  <line class="moe-line moe-conn moe-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#moe-tip)"/>
  <g class="moe-stage moe-s2">
    <rect class="moe-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="moe-step" x="516" y="142">03</text>
    <text class="moe-name" x="542" y="142">So most of the model does nothing</text>
    <text class="moe-desc" x="516" y="166">Per token. Compute stays roughly</text>
    <text class="moe-desc" x="516" y="182">flat.</text>
  </g>
  <line class="moe-line moe-conn moe-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#moe-tip)"/>
  <g class="moe-stage moe-s3">
    <rect class="moe-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="moe-step" x="752" y="142">04</text>
    <text class="moe-name" x="778" y="142">But all of it must be held in memory</text>
    <text class="moe-desc" x="752" y="166">And experts spread across</text>
    <text class="moe-desc" x="752" y="182">devices, which the network pays</text>
    <text class="moe-desc" x="752" y="198">for.</text>
  </g>
  <text class="moe-sub" x="30" y="304">This decouples parameter count from cost per token, which is why a sparse model can advertise a very large size while serving at the cost of a much smaller dense one.</text>
</svg>
