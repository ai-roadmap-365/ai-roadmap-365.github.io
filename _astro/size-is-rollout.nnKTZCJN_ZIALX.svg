<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Not a disk number.">
  <title>Size is a rollout number</title>
  <style>
    .size-is-rollout-bg   { fill: #f8fafc; }
    .size-is-rollout-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .size-is-rollout-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .size-is-rollout-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .size-is-rollout-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .size-is-rollout-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .size-is-rollout-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .size-is-rollout-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .size-is-rollout-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .size-is-rollout-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .size-is-rollout-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .size-is-rollout-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .size-is-rollout-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .size-is-rollout-row { opacity: 1; }
    .size-is-rollout-r0 { animation-delay: 0.00s; }
    .size-is-rollout-r1 { animation-delay: 0.45s; }
    .size-is-rollout-r2 { animation-delay: 0.90s; }
    .size-is-rollout-r3 { animation-delay: 1.35s; }
    .size-is-rollout-r4 { animation-delay: 1.80s; }
    .size-is-rollout-row { animation: size-is-rollout-reveal 7.3s ease-in-out infinite; }
    @keyframes size-is-rollout-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="size-is-rollout-bg" width="980" height="390"/>
  <text class="size-is-rollout-h1"  x="30" y="40">Size is a rollout number</text>
  <text class="size-is-rollout-sub" x="30" y="64">Not a disk number.</text>
  <rect class="size-is-rollout-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="size-is-rollout-name" x="46" y="122">As disk</text>
  <text class="size-is-rollout-desc" x="46" y="142">Nobody cares.</text>
  <text class="size-is-rollout-desc size-is-rollout-row size-is-rollout-r0" x="46" y="182">21 GB on a laptop is fine</text>
  <text class="size-is-rollout-desc size-is-rollout-row size-is-rollout-r1" x="46" y="216">Storage is cheap</text>
  <text class="size-is-rollout-desc size-is-rollout-row size-is-rollout-r2" x="46" y="250">The number looks abstract</text>
  <text class="size-is-rollout-desc size-is-rollout-row size-is-rollout-r3" x="46" y="284">Optimising feels like tidiness</text>
  <text class="size-is-rollout-desc size-is-rollout-row size-is-rollout-r4" x="46" y="318">So it gets deprioritised</text>
  <rect class="size-is-rollout-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="size-is-rollout-name" x="526" y="122">As rollout</text>
  <text class="size-is-rollout-desc" x="526" y="142">Everybody cares.</text>
  <text class="size-is-rollout-desc size-is-rollout-row size-is-rollout-r0" x="526" y="182">845s for one pull</text>
  <text class="size-is-rollout-desc size-is-rollout-row size-is-rollout-r1" x="526" y="216">x 20 nodes = 16,902s</text>
  <text class="size-is-rollout-desc size-is-rollout-row size-is-rollout-r2" x="526" y="250">Felt during autoscaling</text>
  <text class="size-is-rollout-desc size-is-rollout-row size-is-rollout-r3" x="526" y="284">Felt during incident recovery</text>
  <text class="size-is-rollout-desc size-is-rollout-row size-is-rollout-r4" x="526" y="318">420 GB of registry egress per deploy</text>
  <text class="size-is-rollout-sub" x="30" y="372">Autoscaling and incident recovery are the two moments the number is felt, and they are precisely the moments at which nobody has four hours to spare — which is what makes this a reliability property rather than a tidiness one.</text>
</svg>
