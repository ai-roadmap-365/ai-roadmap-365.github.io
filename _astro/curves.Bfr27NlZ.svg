<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four patterns.">
  <title>Reading a training curve</title>
  <style>
    .curves-bg   { fill: #f8fafc; }
    .curves-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .curves-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .curves-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .curves-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .curves-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .curves-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .curves-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .curves-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .curves-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .curves-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .curves-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .curves-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .curves-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .curves-stage { opacity: 1; }

    .curves-s0 { animation-delay: 0.00s; }
    .curves-e0 { animation-delay: 0.00s; }
    .curves-s1 { animation-delay: 1.28s; }
    .curves-e1 { animation-delay: 1.28s; }
    .curves-s2 { animation-delay: 2.56s; }
    .curves-e2 { animation-delay: 2.56s; }
    .curves-s3 { animation-delay: 3.84s; }
    .curves-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .curves-conn  { animation: curves-trace 6.4s ease-in-out infinite; }
      .curves-stage { animation: curves-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes curves-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes curves-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .curves-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .curves-stage { animation: curves-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes curves-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="curves-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="curves-bg" width="980" height="322"/>
  <text class="curves-h1"  x="30" y="40">Reading a training curve</text>
  <text class="curves-sub" x="30" y="64">Four patterns.</text>
  <g class="curves-stage curves-s0">
    <rect class="curves-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="curves-step" x="44" y="142">01</text>
    <text class="curves-name" x="70" y="142">Smooth descent, flattening out: healthy</text>
    <text class="curves-desc" x="44" y="166">Nothing to change.</text>
  </g>
  <line class="curves-line curves-conn curves-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#curves-tip)"/>
  <g class="curves-stage curves-s1">
    <rect class="curves-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="curves-step" x="280" y="142">02</text>
    <text class="curves-name" x="306" y="142">Oscillating loss: the step size is too large</text>
    <text class="curves-desc" x="280" y="166">Reduce the rate.</text>
  </g>
  <line class="curves-line curves-conn curves-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#curves-tip)"/>
  <g class="curves-stage curves-s2">
    <rect class="curves-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="curves-step" x="516" y="142">03</text>
    <text class="curves-name" x="542" y="142">A long flat stretch: a plateau or a dead unit</text>
    <text class="curves-desc" x="516" y="166">Check initialisation and</text>
    <text class="curves-desc" x="516" y="182">activations.</text>
  </g>
  <line class="curves-line curves-conn curves-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#curves-tip)"/>
  <g class="curves-stage curves-s3">
    <rect class="curves-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="curves-step" x="752" y="142">04</text>
    <text class="curves-name" x="778" y="142">And rising loss: divergence</text>
    <text class="curves-desc" x="752" y="166">The rate is far too large.</text>
  </g>
  <text class="curves-sub" x="30" y="304">Training curves are the cheapest diagnostic available, and reading them well removes most of the guesswork from tuning a run.</text>
</svg>
