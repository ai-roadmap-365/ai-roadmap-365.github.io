<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when to stop.">
  <title>When to write it yourself</title>
  <style>
    .numpy-when-bg   { fill: #f8fafc; }
    .numpy-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .numpy-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .numpy-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .numpy-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .numpy-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .numpy-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .numpy-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .numpy-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .numpy-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .numpy-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .numpy-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .numpy-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .numpy-when-row { opacity: 1; }
    .numpy-when-r0 { animation-delay: 0.00s; }
    .numpy-when-r1 { animation-delay: 0.45s; }
    .numpy-when-r2 { animation-delay: 0.90s; }
    .numpy-when-r3 { animation-delay: 1.35s; }
    .numpy-when-r4 { animation-delay: 1.80s; }
    .numpy-when-row { animation: numpy-when-reveal 7.3s ease-in-out infinite; }
    @keyframes numpy-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="numpy-when-bg" width="980" height="390"/>
  <text class="numpy-when-h1"  x="30" y="40">When to write it yourself</text>
  <text class="numpy-when-sub" x="30" y="64">And when to stop.</text>
  <rect class="numpy-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="numpy-when-name" x="46" y="122">Write it</text>
  <text class="numpy-when-desc" x="46" y="142">To learn, or to embed.</text>
  <text class="numpy-when-desc numpy-when-row numpy-when-r0" x="46" y="182">To internalise gradient flow</text>
  <text class="numpy-when-desc numpy-when-row numpy-when-r1" x="46" y="216">To debug an intuition about training</text>
  <text class="numpy-when-desc numpy-when-row numpy-when-r2" x="46" y="250">Constrained environments with no framework</text>
  <text class="numpy-when-desc numpy-when-row numpy-when-r3" x="46" y="284">Small networks on tabular data</text>
  <text class="numpy-when-desc numpy-when-row numpy-when-r4" x="46" y="318">Once — and then move on</text>
  <rect class="numpy-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="numpy-when-name" x="526" y="122">Use a framework</text>
  <text class="numpy-when-desc" x="526" y="142">Everything else.</text>
  <text class="numpy-when-desc numpy-when-row numpy-when-r0" x="526" y="182">Vision, language, generative models</text>
  <text class="numpy-when-desc numpy-when-row numpy-when-r1" x="526" y="216">Anything needing a GPU</text>
  <text class="numpy-when-desc numpy-when-row numpy-when-r2" x="526" y="250">Anything needing distributed training</text>
  <text class="numpy-when-desc numpy-when-row numpy-when-r3" x="526" y="284">Anything you will maintain</text>
  <text class="numpy-when-desc numpy-when-row numpy-when-r4" x="526" y="318">Which is essentially all real work</text>
  <text class="numpy-when-sub" x="30" y="372">"Once, and then move on" is the honest recommendation: the understanding transfers permanently and the code does not, and rewriting it for each new project is a way of avoiding progress.</text>
</svg>
