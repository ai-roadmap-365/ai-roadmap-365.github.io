<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And an unrehearsed demo is an unrun test.">
  <title>A demo is not a test</title>
  <style>
    .demo-versus-test-bg   { fill: #f8fafc; }
    .demo-versus-test-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .demo-versus-test-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .demo-versus-test-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .demo-versus-test-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .demo-versus-test-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .demo-versus-test-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .demo-versus-test-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .demo-versus-test-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .demo-versus-test-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .demo-versus-test-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .demo-versus-test-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .demo-versus-test-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .demo-versus-test-row { opacity: 1; }
    .demo-versus-test-r0 { animation-delay: 0.00s; }
    .demo-versus-test-r1 { animation-delay: 0.45s; }
    .demo-versus-test-r2 { animation-delay: 0.90s; }
    .demo-versus-test-r3 { animation-delay: 1.35s; }
    .demo-versus-test-r4 { animation-delay: 1.80s; }
    .demo-versus-test-row { animation: demo-versus-test-reveal 7.3s ease-in-out infinite; }
    @keyframes demo-versus-test-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="demo-versus-test-bg" width="980" height="390"/>
  <text class="demo-versus-test-h1"  x="30" y="40">A demo is not a test</text>
  <text class="demo-versus-test-sub" x="30" y="64">And an unrehearsed demo is an unrun test.</text>
  <rect class="demo-versus-test-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="demo-versus-test-name" x="46" y="122">A test</text>
  <text class="demo-versus-test-desc" x="46" y="142">Proves a property to a machine.</text>
  <text class="demo-versus-test-desc demo-versus-test-row demo-versus-test-r0" x="46" y="182">Runs on every change</text>
  <text class="demo-versus-test-desc demo-versus-test-row demo-versus-test-r1" x="46" y="216">Fails loudly and specifically</text>
  <text class="demo-versus-test-desc demo-versus-test-row demo-versus-test-r2" x="46" y="250">Nobody watches it succeed</text>
  <text class="demo-versus-test-desc demo-versus-test-row demo-versus-test-r3" x="46" y="284">Covers cases nobody would demo</text>
  <text class="demo-versus-test-desc demo-versus-test-row demo-versus-test-r4" x="46" y="318">Says nothing about whether it is impressive</text>
  <rect class="demo-versus-test-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="demo-versus-test-name" x="526" y="122">A demo</text>
  <text class="demo-versus-test-desc" x="526" y="142">Shows capability to a person.</text>
  <text class="demo-versus-test-desc demo-versus-test-row demo-versus-test-r0" x="526" y="182">Runs once, in front of an audience</text>
  <text class="demo-versus-test-desc demo-versus-test-row demo-versus-test-r1" x="526" y="216">Fails in the least helpful way possible</text>
  <text class="demo-versus-test-desc demo-versus-test-row demo-versus-test-r2" x="526" y="250">Everyone watches</text>
  <text class="demo-versus-test-desc demo-versus-test-row demo-versus-test-r3" x="526" y="284">Covers the path you chose to show</text>
  <text class="demo-versus-test-desc demo-versus-test-row demo-versus-test-r4" x="526" y="318">Says nothing about whether it is correct</text>
  <text class="demo-versus-test-sub" x="30" y="372">A demo that has never been rehearsed end to end is a test that has never been run — and the first execution happening in front of an audience is not a risk anyone would accept in code.</text>
</svg>
