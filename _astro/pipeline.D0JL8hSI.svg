<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" font-family="system-ui, sans-serif">
  <title>A four-stage pipeline: four instructions overlapping in the fetch, decode, execute, and write-back stages, so one instruction finishes every clock cycle once the pipeline is full</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Pipelining: four instructions in flight at once</text>

  <!-- Clock cycle labels -->
  <text x="200" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">cycle 1</text>
  <text x="280" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">cycle 2</text>
  <text x="360" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">cycle 3</text>
  <text x="440" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">cycle 4</text>
  <text x="520" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">cycle 5</text>
  <text x="600" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">cycle 6</text>
  <text x="680" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">cycle 7</text>

  <!-- Row labels -->
  <text x="150" y="123" text-anchor="end" font-size="14" font-weight="bold" fill="#1a202c">instruction 1</text>
  <text x="150" y="193" text-anchor="end" font-size="14" font-weight="bold" fill="#1a202c">instruction 2</text>
  <text x="150" y="263" text-anchor="end" font-size="14" font-weight="bold" fill="#1a202c">instruction 3</text>
  <text x="150" y="333" text-anchor="end" font-size="14" font-weight="bold" fill="#1a202c">instruction 4</text>

  <!-- Instruction 1: cycles 1-4 -->
  <rect x="164" y="100" width="72" height="36" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="200" y="123" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">F</text>
  <rect x="244" y="100" width="72" height="36" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="280" y="123" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">D</text>
  <rect x="324" y="100" width="72" height="36" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="360" y="123" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">E</text>
  <rect x="404" y="100" width="72" height="36" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="440" y="123" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">W</text>

  <!-- Instruction 2: cycles 2-5 -->
  <rect x="244" y="170" width="72" height="36" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="280" y="193" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">F</text>
  <rect x="324" y="170" width="72" height="36" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="360" y="193" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">D</text>
  <rect x="404" y="170" width="72" height="36" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="440" y="193" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">E</text>
  <rect x="484" y="170" width="72" height="36" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="520" y="193" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">W</text>

  <!-- Instruction 3: cycles 3-6 -->
  <rect x="324" y="240" width="72" height="36" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="360" y="263" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">F</text>
  <rect x="404" y="240" width="72" height="36" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="440" y="263" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">D</text>
  <rect x="484" y="240" width="72" height="36" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="520" y="263" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">E</text>
  <rect x="564" y="240" width="72" height="36" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="600" y="263" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">W</text>

  <!-- Instruction 4: cycles 4-7 -->
  <rect x="404" y="310" width="72" height="36" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="440" y="333" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">F</text>
  <rect x="484" y="310" width="72" height="36" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="520" y="333" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">D</text>
  <rect x="564" y="310" width="72" height="36" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="600" y="333" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">E</text>
  <rect x="644" y="310" width="72" height="36" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="680" y="333" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">W</text>

  <!-- Highlight cycle 4 column -->
  <rect x="400" y="92" width="80" height="262" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="7,5" rx="8"/>
  <text x="440" y="378" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">cycle 4: all four stages busy</text>

  <!-- Legend -->
  <rect x="164" y="400" width="26" height="26" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="4"/>
  <text x="198" y="418" font-size="14" fill="#1a202c">F = fetch</text>
  <rect x="304" y="400" width="26" height="26" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2" rx="4"/>
  <text x="338" y="418" font-size="14" fill="#1a202c">D = decode</text>
  <rect x="464" y="400" width="26" height="26" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2" rx="4"/>
  <text x="498" y="418" font-size="14" fill="#1a202c">E = execute</text>
  <rect x="614" y="400" width="26" height="26" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="4"/>
  <text x="648" y="418" font-size="14" fill="#1a202c">W = write-back</text>

  <text x="380" y="456" text-anchor="middle" font-size="14" fill="#1a202c">Each instruction still takes four cycles, but once the pipeline is full, one instruction finishes every cycle.</text>
</svg>
