<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="None of them new.">
  <title>Three conventions MCP inherited</title>
  <style>
    .mcp-ops-eras-bg   { fill: #f8fafc; }
    .mcp-ops-eras-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-ops-eras-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-ops-eras-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-ops-eras-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-ops-eras-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-ops-eras-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mcp-ops-eras-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mcp-ops-eras-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mcp-ops-eras-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mcp-ops-eras-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mcp-ops-eras-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mcp-ops-eras-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .mcp-ops-eras-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .mcp-ops-eras-stage { opacity: 1; }

    .mcp-ops-eras-s0 { animation-delay: 0.00s; }
    .mcp-ops-eras-e0 { animation-delay: 0.00s; }
    .mcp-ops-eras-s1 { animation-delay: 1.50s; }
    .mcp-ops-eras-e1 { animation-delay: 1.50s; }
    .mcp-ops-eras-s2 { animation-delay: 3.00s; }
    .mcp-ops-eras-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .mcp-ops-eras-conn  { animation: mcp-ops-eras-trace 6s ease-in-out infinite; }
      .mcp-ops-eras-stage { animation: mcp-ops-eras-arrive 6s ease-in-out infinite; }
    }
    @keyframes mcp-ops-eras-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes mcp-ops-eras-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .mcp-ops-eras-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .mcp-ops-eras-stage { animation: mcp-ops-eras-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes mcp-ops-eras-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="mcp-ops-eras-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="mcp-ops-eras-bg" width="980" height="322"/>
  <text class="mcp-ops-eras-h1"  x="30" y="40">Three conventions MCP inherited</text>
  <text class="mcp-ops-eras-sub" x="30" y="64">None of them new.</text>
  <g class="mcp-ops-eras-stage mcp-ops-eras-s0">
    <rect class="mcp-ops-eras-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="mcp-ops-eras-step" x="44" y="142">01</text>
    <text class="mcp-ops-eras-name" x="70" y="142">Unix stdio, 1970s</text>
    <text class="mcp-ops-eras-desc" x="44" y="166">Data to stdout, diagnostics to stderr. Fifty</text>
    <text class="mcp-ops-eras-desc" x="44" y="182">years of proven behaviour.</text>
  </g>
  <line class="mcp-ops-eras-line mcp-ops-eras-conn mcp-ops-eras-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#mcp-ops-eras-tip)"/>
  <g class="mcp-ops-eras-stage mcp-ops-eras-s1">
    <rect class="mcp-ops-eras-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="mcp-ops-eras-step" x="359" y="142">02</text>
    <text class="mcp-ops-eras-name" x="385" y="142">Editor configuration, 2015</text>
    <text class="mcp-ops-eras-desc" x="359" y="166">A JSON file spawning language server</text>
    <text class="mcp-ops-eras-desc" x="359" y="182">subprocesses. The ergonomics were solved.</text>
  </g>
  <line class="mcp-ops-eras-line mcp-ops-eras-conn mcp-ops-eras-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#mcp-ops-eras-tip)"/>
  <g class="mcp-ops-eras-stage mcp-ops-eras-s2">
    <rect class="mcp-ops-eras-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="mcp-ops-eras-step" x="674" y="142">03</text>
    <text class="mcp-ops-eras-name" x="700" y="142">The ecosystem surge, 2024-2025</text>
    <text class="mcp-ops-eras-desc" x="674" y="166">Over 500 community servers within six months.</text>
  </g>
  <text class="mcp-ops-eras-sub" x="30" y="304">Adopting two well-worn conventions rather than inventing new ones is most of why adoption was fast: the configuration file and the process model were already familiar to every developer using an editor.</text>
</svg>
