<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two clear rules.">
  <title>When to reach for each primitive</title>
  <style>
    .resources-when-bg   { fill: #f8fafc; }
    .resources-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resources-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resources-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resources-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resources-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resources-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .resources-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .resources-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .resources-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .resources-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .resources-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .resources-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .resources-when-row { opacity: 1; }
    .resources-when-r0 { animation-delay: 0.00s; }
    .resources-when-r1 { animation-delay: 0.45s; }
    .resources-when-r2 { animation-delay: 0.90s; }
    .resources-when-r3 { animation-delay: 1.35s; }
    .resources-when-r4 { animation-delay: 1.80s; }
    .resources-when-row { animation: resources-when-reveal 7.3s ease-in-out infinite; }
    @keyframes resources-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="resources-when-bg" width="980" height="390"/>
  <text class="resources-when-h1"  x="30" y="40">When to reach for each primitive</text>
  <text class="resources-when-sub" x="30" y="64">Two clear rules.</text>
  <rect class="resources-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="resources-when-name" x="46" y="122">Resources and prompts</text>
  <text class="resources-when-desc" x="46" y="142">Context and intent.</text>
  <text class="resources-when-desc resources-when-row resources-when-r0" x="46" y="182">Live schemas and system logs as context</text>
  <text class="resources-when-desc resources-when-row resources-when-r1" x="46" y="216">Without forcing repeated function calls</text>
  <text class="resources-when-desc resources-when-row resources-when-r2" x="46" y="250">Standardised organisational prompt templates</text>
  <text class="resources-when-desc resources-when-row resources-when-r3" x="46" y="284">Slash commands the whole team shares</text>
  <text class="resources-when-desc resources-when-row resources-when-r4" x="46" y="318">Anything read-only and addressable</text>
  <rect class="resources-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="resources-when-name" x="526" y="122">Tools</text>
  <text class="resources-when-desc" x="526" y="142">Computation and effects.</text>
  <text class="resources-when-desc resources-when-row resources-when-r0" x="526" y="182">A value computed from arguments</text>
  <text class="resources-when-desc resources-when-row resources-when-r1" x="526" y="216">A dynamic query the model composes</text>
  <text class="resources-when-desc resources-when-row resources-when-r2" x="526" y="250">Anything that writes or sends</text>
  <text class="resources-when-desc resources-when-row resources-when-r3" x="526" y="284">Anything needing approval</text>
  <text class="resources-when-desc resources-when-row resources-when-r4" x="526" y="318">Where a URI could not name the answer</text>
  <text class="resources-when-sub" x="30" y="372">The test that resolves most cases is whether a stable URI could name the thing: if it could, it is a resource, and if naming it requires the arguments, it is a tool.</text>
</svg>
