<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when a spot-check is honest enough.">
  <title>When automated evaluation earns its cost</title>
  <style>
    .eval-enforce-or-spot-bg   { fill: #f8fafc; }
    .eval-enforce-or-spot-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-enforce-or-spot-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-enforce-or-spot-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-enforce-or-spot-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-enforce-or-spot-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-enforce-or-spot-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eval-enforce-or-spot-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eval-enforce-or-spot-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eval-enforce-or-spot-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eval-enforce-or-spot-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eval-enforce-or-spot-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eval-enforce-or-spot-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eval-enforce-or-spot-row { opacity: 1; }
    .eval-enforce-or-spot-r0 { animation-delay: 0.00s; }
    .eval-enforce-or-spot-r1 { animation-delay: 0.45s; }
    .eval-enforce-or-spot-r2 { animation-delay: 0.90s; }
    .eval-enforce-or-spot-r3 { animation-delay: 1.35s; }
    .eval-enforce-or-spot-r4 { animation-delay: 1.80s; }
    .eval-enforce-or-spot-row { animation: eval-enforce-or-spot-reveal 7.3s ease-in-out infinite; }
    @keyframes eval-enforce-or-spot-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="eval-enforce-or-spot-bg" width="980" height="390"/>
  <text class="eval-enforce-or-spot-h1"  x="30" y="40">When automated evaluation earns its cost</text>
  <text class="eval-enforce-or-spot-sub" x="30" y="64">And when a spot-check is honest enough.</text>
  <rect class="eval-enforce-or-spot-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="eval-enforce-or-spot-name" x="46" y="122">Automate</text>
  <text class="eval-enforce-or-spot-desc" x="46" y="142">Where regression is likely and costly.</text>
  <text class="eval-enforce-or-spot-desc eval-enforce-or-spot-row eval-enforce-or-spot-r0" x="46" y="182">Prompts or models change regularly</text>
  <text class="eval-enforce-or-spot-desc eval-enforce-or-spot-row eval-enforce-or-spot-r1" x="46" y="216">More than one person changes the system</text>
  <text class="eval-enforce-or-spot-desc eval-enforce-or-spot-row eval-enforce-or-spot-r2" x="46" y="250">Retrieval is being tuned</text>
  <text class="eval-enforce-or-spot-desc eval-enforce-or-spot-row eval-enforce-or-spot-r3" x="46" y="284">Answers reach users</text>
  <text class="eval-enforce-or-spot-desc eval-enforce-or-spot-row eval-enforce-or-spot-r4" x="46" y="318">A regression would go unnoticed otherwise</text>
  <rect class="eval-enforce-or-spot-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="eval-enforce-or-spot-name" x="526" y="122">Spot-check</text>
  <text class="eval-enforce-or-spot-desc" x="526" y="142">Where automation costs more than it saves.</text>
  <text class="eval-enforce-or-spot-desc eval-enforce-or-spot-row eval-enforce-or-spot-r0" x="526" y="182">A one-off exploration</text>
  <text class="eval-enforce-or-spot-desc eval-enforce-or-spot-row eval-enforce-or-spot-r1" x="526" y="216">A prototype nobody depends on</text>
  <text class="eval-enforce-or-spot-desc eval-enforce-or-spot-row eval-enforce-or-spot-r2" x="526" y="250">The behaviour is obvious when wrong</text>
  <text class="eval-enforce-or-spot-desc eval-enforce-or-spot-row eval-enforce-or-spot-r3" x="526" y="284">Fewer than a handful of queries matter</text>
  <text class="eval-enforce-or-spot-desc eval-enforce-or-spot-row eval-enforce-or-spot-r4" x="526" y="318">Write down what you checked, at least</text>
  <text class="eval-enforce-or-spot-sub" x="30" y="372">The honest middle path for a capstone is a small automated set plus a recorded manual pass: the set catches regressions, and the manual pass catches the things you did not think to encode.</text>
</svg>
