<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="They are confused constantly, and they overlap not at all.">
  <title>Which tool answers which question</title>
  <style>
    .three-tools-summary-bg   { fill: #f8fafc; }
    .three-tools-summary-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-tools-summary-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-tools-summary-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-tools-summary-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-tools-summary-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-tools-summary-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-tools-summary-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-tools-summary-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-tools-summary-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-tools-summary-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-tools-summary-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-tools-summary-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .three-tools-summary-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .three-tools-summary-stage { opacity: 1; }

    .three-tools-summary-s0 { animation-delay: 0.00s; }
    .three-tools-summary-e0 { animation-delay: 0.00s; }
    .three-tools-summary-s1 { animation-delay: 1.28s; }
    .three-tools-summary-e1 { animation-delay: 1.28s; }
    .three-tools-summary-s2 { animation-delay: 2.56s; }
    .three-tools-summary-e2 { animation-delay: 2.56s; }
    .three-tools-summary-s3 { animation-delay: 3.84s; }
    .three-tools-summary-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .three-tools-summary-conn  { animation: three-tools-summary-trace 6.4s ease-in-out infinite; }
      .three-tools-summary-stage { animation: three-tools-summary-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes three-tools-summary-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes three-tools-summary-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .three-tools-summary-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .three-tools-summary-stage { animation: three-tools-summary-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes three-tools-summary-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="three-tools-summary-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="three-tools-summary-bg" width="980" height="322"/>
  <text class="three-tools-summary-h1"  x="30" y="40">Which tool answers which question</text>
  <text class="three-tools-summary-sub" x="30" y="64">They are confused constantly, and they overlap not at all.</text>
  <g class="three-tools-summary-stage three-tools-summary-s0">
    <rect class="three-tools-summary-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="three-tools-summary-step" x="44" y="142">01</text>
    <text class="three-tools-summary-name" x="70" y="142">Formatter</text>
    <text class="three-tools-summary-desc" x="44" y="166">"How should this look?" No</text>
    <text class="three-tools-summary-desc" x="44" y="182">opinion on whether it works.</text>
    <text class="three-tools-summary-edge" x="44" y="242">layout</text>
  </g>
  <line class="three-tools-summary-line three-tools-summary-conn three-tools-summary-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#three-tools-summary-tip)"/>
  <g class="three-tools-summary-stage three-tools-summary-s1">
    <rect class="three-tools-summary-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="three-tools-summary-step" x="280" y="142">02</text>
    <text class="three-tools-summary-name" x="306" y="142">Linter</text>
    <text class="three-tools-summary-desc" x="280" y="166">"Does this look suspicious?"</text>
    <text class="three-tools-summary-desc" x="280" y="182">Without running anything.</text>
    <text class="three-tools-summary-edge" x="280" y="242">patterns</text>
  </g>
  <line class="three-tools-summary-line three-tools-summary-conn three-tools-summary-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#three-tools-summary-tip)"/>
  <g class="three-tools-summary-stage three-tools-summary-s2">
    <rect class="three-tools-summary-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="three-tools-summary-step" x="516" y="142">03</text>
    <text class="three-tools-summary-name" x="542" y="142">Type checker</text>
    <text class="three-tools-summary-desc" x="516" y="166">"Do the kinds of values line</text>
    <text class="three-tools-summary-desc" x="516" y="182">up?" Also without running.</text>
    <text class="three-tools-summary-edge" x="516" y="242">kinds</text>
  </g>
  <line class="three-tools-summary-line three-tools-summary-conn three-tools-summary-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#three-tools-summary-tip)"/>
  <g class="three-tools-summary-stage three-tools-summary-s3">
    <rect class="three-tools-summary-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="three-tools-summary-step" x="752" y="142">04</text>
    <text class="three-tools-summary-name" x="778" y="142">Debugger</text>
    <text class="three-tools-summary-desc" x="752" y="166">"What is actually happening</text>
    <text class="three-tools-summary-desc" x="752" y="182">right now?" Only while running.</text>
    <text class="three-tools-summary-edge" x="752" y="242">values</text>
  </g>
  <text class="three-tools-summary-sub" x="30" y="304">The first three read your code. Only the last one watches it work, which is why it is the only one that can answer a question about a value.</text>
</svg>
