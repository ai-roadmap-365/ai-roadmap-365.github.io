<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Each stage passed its own tests.">
  <title>Components, or seams</title>
  <style>
    .seams-or-components-bg   { fill: #f8fafc; }
    .seams-or-components-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .seams-or-components-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .seams-or-components-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .seams-or-components-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .seams-or-components-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .seams-or-components-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .seams-or-components-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .seams-or-components-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .seams-or-components-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .seams-or-components-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .seams-or-components-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .seams-or-components-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .seams-or-components-row { opacity: 1; }
    .seams-or-components-r0 { animation-delay: 0.00s; }
    .seams-or-components-r1 { animation-delay: 0.45s; }
    .seams-or-components-r2 { animation-delay: 0.90s; }
    .seams-or-components-r3 { animation-delay: 1.35s; }
    .seams-or-components-r4 { animation-delay: 1.80s; }
    .seams-or-components-row { animation: seams-or-components-reveal 7.3s ease-in-out infinite; }
    @keyframes seams-or-components-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="seams-or-components-bg" width="980" height="390"/>
  <text class="seams-or-components-h1"  x="30" y="40">Components, or seams</text>
  <text class="seams-or-components-sub" x="30" y="64">Each stage passed its own tests.</text>
  <rect class="seams-or-components-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="seams-or-components-name" x="46" y="122">Each component</text>
  <text class="seams-or-components-desc" x="46" y="142">Tested, and correct.</text>
  <text class="seams-or-components-desc seams-or-components-row seams-or-components-r0" x="46" y="182">Ingestion survives a crash</text>
  <text class="seams-or-components-desc seams-or-components-row seams-or-components-r1" x="46" y="216">Processing gates bad extractions</text>
  <text class="seams-or-components-desc seams-or-components-row seams-or-components-r2" x="46" y="250">Freshness reconciles drift</text>
  <text class="seams-or-components-desc seams-or-components-row seams-or-components-r3" x="46" y="284">Cost accounting is accurate</text>
  <text class="seams-or-components-desc seams-or-components-row seams-or-components-r4" x="46" y="318">Redaction removes identifiers</text>
  <rect class="seams-or-components-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="seams-or-components-name" x="526" y="122">The seams</text>
  <text class="seams-or-components-desc" x="526" y="142">Where it fails.</text>
  <text class="seams-or-components-desc seams-or-components-row seams-or-components-r0" x="526" y="182">Redaction placed after chunking</text>
  <text class="seams-or-components-desc seams-or-components-row seams-or-components-r1" x="526" y="216">Retrieval outside the cost budget</text>
  <text class="seams-or-components-desc seams-or-components-row seams-or-components-r2" x="526" y="250">Erasure missing the cache</text>
  <text class="seams-or-components-desc seams-or-components-row seams-or-components-r3" x="526" y="284">A hash that survives a deletion</text>
  <text class="seams-or-components-desc seams-or-components-row seams-or-components-r4" x="526" y="318">No single day's tests could reach these</text>
  <text class="seams-or-components-sub" x="30" y="372">Systems fail at their seams far more often than in their components, and the seams are invisible until the components share a pipeline — which is what makes an integration day worth having.</text>
</svg>
