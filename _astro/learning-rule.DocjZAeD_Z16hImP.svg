<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three cases, and two of them do nothing.">
  <title>The update rule</title>
  <style>
    .learning-rule-bg   { fill: #f8fafc; }
    .learning-rule-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .learning-rule-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .learning-rule-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .learning-rule-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .learning-rule-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .learning-rule-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .learning-rule-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .learning-rule-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .learning-rule-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .learning-rule-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .learning-rule-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .learning-rule-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .learning-rule-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .learning-rule-stage { opacity: 1; }

    .learning-rule-s0 { animation-delay: 0.00s; }
    .learning-rule-e0 { animation-delay: 0.00s; }
    .learning-rule-s1 { animation-delay: 1.50s; }
    .learning-rule-e1 { animation-delay: 1.50s; }
    .learning-rule-s2 { animation-delay: 3.00s; }
    .learning-rule-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .learning-rule-conn  { animation: learning-rule-trace 6s ease-in-out infinite; }
      .learning-rule-stage { animation: learning-rule-arrive 6s ease-in-out infinite; }
    }
    @keyframes learning-rule-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes learning-rule-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .learning-rule-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .learning-rule-stage { animation: learning-rule-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes learning-rule-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="learning-rule-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="learning-rule-bg" width="980" height="322"/>
  <text class="learning-rule-h1"  x="30" y="40">The update rule</text>
  <text class="learning-rule-sub" x="30" y="64">Three cases, and two of them do nothing.</text>
  <g class="learning-rule-stage learning-rule-s0">
    <rect class="learning-rule-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="learning-rule-step" x="44" y="142">01</text>
    <text class="learning-rule-name" x="70" y="142">Correct: error is zero</text>
    <text class="learning-rule-desc" x="44" y="166">Nothing changes. The perceptron only learns</text>
    <text class="learning-rule-desc" x="44" y="182">from mistakes.</text>
  </g>
  <line class="learning-rule-line learning-rule-conn learning-rule-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#learning-rule-tip)"/>
  <g class="learning-rule-stage learning-rule-s1">
    <rect class="learning-rule-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="learning-rule-step" x="359" y="142">02</text>
    <text class="learning-rule-name" x="385" y="142">False negative: error is +1</text>
    <text class="learning-rule-desc" x="359" y="166">Add the input to the weights. The boundary</text>
    <text class="learning-rule-desc" x="359" y="182">rotates toward this point.</text>
    <text class="learning-rule-edge" x="359" y="242">toward</text>
  </g>
  <line class="learning-rule-line learning-rule-conn learning-rule-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#learning-rule-tip)"/>
  <g class="learning-rule-stage learning-rule-s2">
    <rect class="learning-rule-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="learning-rule-step" x="674" y="142">03</text>
    <text class="learning-rule-name" x="700" y="142">False positive: error is -1</text>
    <text class="learning-rule-desc" x="674" y="166">Subtract it. The boundary rotates away.</text>
    <text class="learning-rule-edge" x="674" y="242">away</text>
  </g>
  <text class="learning-rule-sub" x="30" y="304">Learning only on mistakes is what makes this an online algorithm rather than a batch one: it needs no loss surface and no gradient, only a signed error.</text>
</svg>
