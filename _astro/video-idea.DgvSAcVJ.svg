<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four reasons.">
  <title>Why video is hard</title>
  <style>
    .video-idea-bg   { fill: #f8fafc; }
    .video-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .video-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .video-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .video-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .video-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .video-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .video-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .video-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .video-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .video-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .video-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .video-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .video-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .video-idea-stage { opacity: 1; }

    .video-idea-s0 { animation-delay: 0.00s; }
    .video-idea-e0 { animation-delay: 0.00s; }
    .video-idea-s1 { animation-delay: 1.28s; }
    .video-idea-e1 { animation-delay: 1.28s; }
    .video-idea-s2 { animation-delay: 2.56s; }
    .video-idea-e2 { animation-delay: 2.56s; }
    .video-idea-s3 { animation-delay: 3.84s; }
    .video-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .video-idea-conn  { animation: video-idea-trace 6.4s ease-in-out infinite; }
      .video-idea-stage { animation: video-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes video-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes video-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .video-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .video-idea-stage { animation: video-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes video-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="video-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="video-idea-bg" width="980" height="322"/>
  <text class="video-idea-h1"  x="30" y="40">Why video is hard</text>
  <text class="video-idea-sub" x="30" y="64">Four reasons.</text>
  <g class="video-idea-stage video-idea-s0">
    <rect class="video-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="video-idea-step" x="44" y="142">01</text>
    <text class="video-idea-name" x="70" y="142">Video adds a third dimension</text>
    <text class="video-idea-desc" x="44" y="166">Height, width and now time.</text>
  </g>
  <line class="video-idea-line video-idea-conn video-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#video-idea-tip)"/>
  <g class="video-idea-stage video-idea-s1">
    <rect class="video-idea-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="video-idea-step" x="280" y="142">02</text>
    <text class="video-idea-name" x="306" y="142">Attention over all three is quadratic in their product</text>
    <text class="video-idea-desc" x="280" y="166">Which becomes impossible</text>
    <text class="video-idea-desc" x="280" y="182">quickly.</text>
  </g>
  <line class="video-idea-line video-idea-conn video-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#video-idea-tip)"/>
  <g class="video-idea-stage video-idea-s2">
    <rect class="video-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="video-idea-step" x="516" y="142">03</text>
    <text class="video-idea-name" x="542" y="142">And frames must be consistent with each other</text>
    <text class="video-idea-desc" x="516" y="166">A sequence of good frames is not</text>
    <text class="video-idea-desc" x="516" y="182">a good video.</text>
  </g>
  <line class="video-idea-line video-idea-conn video-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#video-idea-tip)"/>
  <g class="video-idea-stage video-idea-s3">
    <rect class="video-idea-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="video-idea-step" x="752" y="142">04</text>
    <text class="video-idea-name" x="778" y="142">While memory scales with the whole clip</text>
    <text class="video-idea-desc" x="752" y="166">Not with one frame.</text>
  </g>
  <text class="video-idea-sub" x="30" y="304">Temporal consistency is the harder of the two problems: per-frame quality was solved by image models, and objects staying the same between frames was not.</text>
</svg>
