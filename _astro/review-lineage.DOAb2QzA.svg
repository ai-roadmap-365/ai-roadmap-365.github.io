<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Inspection, mutation, then supply chain.">
  <title>Three milestones in code trust</title>
  <style>
    .review-lineage-bg   { fill: #f8fafc; }
    .review-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .review-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .review-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .review-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .review-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .review-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .review-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .review-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .review-lineage-stage { opacity: 1; }

    .review-lineage-s0 { animation-delay: 0.00s; }
    .review-lineage-e0 { animation-delay: 0.00s; }
    .review-lineage-s1 { animation-delay: 1.50s; }
    .review-lineage-e1 { animation-delay: 1.50s; }
    .review-lineage-s2 { animation-delay: 3.00s; }
    .review-lineage-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .review-lineage-conn  { animation: review-lineage-trace 6s ease-in-out infinite; }
      .review-lineage-stage { animation: review-lineage-arrive 6s ease-in-out infinite; }
    }
    @keyframes review-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes review-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .review-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .review-lineage-stage { animation: review-lineage-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes review-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="review-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="review-lineage-bg" width="980" height="322"/>
  <text class="review-lineage-h1"  x="30" y="40">Three milestones in code trust</text>
  <text class="review-lineage-sub" x="30" y="64">Inspection, mutation, then supply chain.</text>
  <g class="review-lineage-stage review-lineage-s0">
    <rect class="review-lineage-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="review-lineage-step" x="44" y="142">01</text>
    <text class="review-lineage-name" x="70" y="142">Fagan inspection, 1976</text>
    <text class="review-lineage-desc" x="44" y="166">Structured human checklists catch 60-90% of</text>
    <text class="review-lineage-desc" x="44" y="182">defects before testing.</text>
  </g>
  <line class="review-lineage-line review-lineage-conn review-lineage-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#review-lineage-tip)"/>
  <g class="review-lineage-stage review-lineage-s1">
    <rect class="review-lineage-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="review-lineage-step" x="359" y="142">02</text>
    <text class="review-lineage-name" x="385" y="142">Mutation testing, 1978</text>
    <text class="review-lineage-desc" x="359" y="166">Passing tests can be deceptive. Inverting</text>
    <text class="review-lineage-desc" x="359" y="182">operators proves the suite.</text>
  </g>
  <line class="review-lineage-line review-lineage-conn review-lineage-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#review-lineage-tip)"/>
  <g class="review-lineage-stage review-lineage-s2">
    <rect class="review-lineage-warn" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="review-lineage-step" x="674" y="142">03</text>
    <text class="review-lineage-name" x="700" y="142">Slopsquatting, 2023</text>
    <text class="review-lineage-desc" x="674" y="166">Attackers register the package names models</text>
    <text class="review-lineage-desc" x="674" y="182">predictably hallucinate.</text>
  </g>
  <text class="review-lineage-sub" x="30" y="304">The first two were developed against human authors and transfer directly; the third exists only because a new kind of author makes the same plausible mistake repeatedly and predictably.</text>
</svg>
