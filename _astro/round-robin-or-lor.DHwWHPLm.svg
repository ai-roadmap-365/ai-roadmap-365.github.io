<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The difference is P99, not average.">
  <title>Round robin against least-outstanding</title>
  <style>
    .round-robin-or-lor-bg   { fill: #f8fafc; }
    .round-robin-or-lor-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .round-robin-or-lor-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .round-robin-or-lor-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .round-robin-or-lor-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .round-robin-or-lor-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .round-robin-or-lor-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .round-robin-or-lor-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .round-robin-or-lor-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .round-robin-or-lor-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .round-robin-or-lor-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .round-robin-or-lor-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .round-robin-or-lor-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .round-robin-or-lor-row { opacity: 1; }
    .round-robin-or-lor-r0 { animation-delay: 0.00s; }
    .round-robin-or-lor-r1 { animation-delay: 0.45s; }
    .round-robin-or-lor-r2 { animation-delay: 0.90s; }
    .round-robin-or-lor-r3 { animation-delay: 1.35s; }
    .round-robin-or-lor-r4 { animation-delay: 1.80s; }
    .round-robin-or-lor-row { animation: round-robin-or-lor-reveal 7.3s ease-in-out infinite; }
    @keyframes round-robin-or-lor-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="round-robin-or-lor-bg" width="980" height="390"/>
  <text class="round-robin-or-lor-h1"  x="30" y="40">Round robin against least-outstanding</text>
  <text class="round-robin-or-lor-sub" x="30" y="64">The difference is P99, not average.</text>
  <rect class="round-robin-or-lor-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="round-robin-or-lor-name" x="46" y="122">Round robin</text>
  <text class="round-robin-or-lor-desc" x="46" y="142">Blind to queue depth.</text>
  <text class="round-robin-or-lor-desc round-robin-or-lor-row round-robin-or-lor-r0" x="46" y="182">Each replica takes its turn</text>
  <text class="round-robin-or-lor-desc round-robin-or-lor-row round-robin-or-lor-r1" x="46" y="216">A 2,000-token query lands on a saturated worker</text>
  <text class="round-robin-or-lor-desc round-robin-or-lor-row round-robin-or-lor-r2" x="46" y="250">Short queries queue behind long ones</text>
  <text class="round-robin-or-lor-desc round-robin-or-lor-row round-robin-or-lor-r3" x="46" y="284">Average latency looks acceptable</text>
  <text class="round-robin-or-lor-desc round-robin-or-lor-row round-robin-or-lor-r4" x="46" y="318">P99 is where it shows</text>
  <rect class="round-robin-or-lor-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="round-robin-or-lor-name" x="526" y="122">Least-outstanding</text>
  <text class="round-robin-or-lor-desc" x="526" y="142">Routes to the shortest queue.</text>
  <text class="round-robin-or-lor-desc round-robin-or-lor-row round-robin-or-lor-r0" x="526" y="182">Pick the worker with fewest active streams</text>
  <text class="round-robin-or-lor-desc round-robin-or-lor-row round-robin-or-lor-r1" x="526" y="216">Long queries do not compound</text>
  <text class="round-robin-or-lor-desc round-robin-or-lor-row round-robin-or-lor-r2" x="526" y="250">Short queries stay short</text>
  <text class="round-robin-or-lor-desc round-robin-or-lor-row round-robin-or-lor-r3" x="526" y="284">P99 falls by roughly 65%</text>
  <text class="round-robin-or-lor-desc round-robin-or-lor-row round-robin-or-lor-r4" x="526" y="318">Costs one min() over healthy replicas</text>
  <text class="round-robin-or-lor-sub" x="30" y="372">The implementation is a single `min` over the healthy replicas by active-request count, which is a remarkably small amount of code for the largest tail-latency improvement available at this layer.</text>
</svg>
