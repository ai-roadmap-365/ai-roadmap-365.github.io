<svg role="img" aria-label="End-to-end LLM pretraining data-to-weights lifecycle diagram showing 5 stages from raw web crawl to base foundation model" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>LLM Pre-Training End-to-End Pipeline</title>
  <defs>
    <linearGradient id="bg239a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card239" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg239a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">THE INDUSTRIAL LLM PRE-TRAINING LIFECYCLE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">From Petabytes of Unstructured Web Text to Foundation Model Weights</text>
  <g transform="translate(35, 85)">
    <rect width="780" height="305" fill="url(#card239)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Step 1 -->
    <rect x="20" y="30" width="135" height="240" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="87" y="55" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">1. Web Ingestion</text>
    <text x="30" y="85" fill="#cbd5e1" font-size="8">• Common Crawl</text>
    <text x="30" y="105" fill="#cbd5e1" font-size="8">• 100+ Terabytes</text>
    <text x="30" y="125" fill="#cbd5e1" font-size="8">• WET text files</text>
    <text x="30" y="145" fill="#cbd5e1" font-size="8">• Multi-language</text>
    <text x="30" y="165" fill="#cbd5e1" font-size="8">• Code repos</text>
    <text x="30" y="185" fill="#cbd5e1" font-size="8">• ArXiv papers</text>

    <!-- Step 2 -->
    <rect x="175" y="30" width="135" height="240" fill="#0f172a" stroke="#fbbf24" rx="6"/>
    <text x="242" y="55" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">2. Data Filtering</text>
    <text x="185" y="85" fill="#cbd5e1" font-size="8">• MinHash LSH</text>
    <text x="185" y="105" fill="#cbd5e1" font-size="8">• FastText quality</text>
    <text x="185" y="125" fill="#cbd5e1" font-size="8">• PII removal</text>
    <text x="185" y="145" fill="#cbd5e1" font-size="8">• Repetition filters</text>
    <text x="185" y="165" fill="#cbd5e1" font-size="8">• Toxicity cutoff</text>
    <text x="185" y="185" fill="#cbd5e1" font-size="8">• 15T clean tokens</text>

    <!-- Step 3 -->
    <rect x="330" y="30" width="135" height="240" fill="#0f172a" stroke="#10b981" rx="6"/>
    <text x="397" y="55" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">3. Tokenization</text>
    <text x="340" y="85" fill="#cbd5e1" font-size="8">• Byte-Pair Encode</text>
    <text x="340" y="105" fill="#cbd5e1" font-size="8">• tiktoken / BPE</text>
    <text x="340" y="125" fill="#cbd5e1" font-size="8">• Vocab: 128k</text>
    <text x="340" y="145" fill="#cbd5e1" font-size="8">• Int32 binary</text>
    <text x="340" y="165" fill="#cbd5e1" font-size="8">• Memory mapping</text>
    <text x="340" y="185" fill="#cbd5e1" font-size="8">• Mega chunks</text>

    <!-- Step 4 -->
    <rect x="485" y="30" width="135" height="240" fill="#0f172a" stroke="#a855f7" rx="6"/>
    <text x="552" y="55" fill="#c084fc" font-size="10" font-weight="700" text-anchor="middle">4. Cluster Training</text>
    <text x="495" y="85" fill="#cbd5e1" font-size="8">• 16,384 H100 GPUs</text>
    <text x="495" y="105" fill="#cbd5e1" font-size="8">• 3D Parallelism</text>
    <text x="495" y="125" fill="#cbd5e1" font-size="8">• BF16 / FP8 Mixed</text>
    <text x="495" y="145" fill="#cbd5e1" font-size="8">• Causal LM loss</text>
    <text x="495" y="165" fill="#cbd5e1" font-size="8">• 3-month run</text>
    <text x="495" y="185" fill="#cbd5e1" font-size="8">• $50M compute</text>

    <!-- Step 5 -->
    <rect x="640" y="30" width="120" height="240" fill="#0f172a" stroke="#f43f5e" rx="6"/>
    <text x="700" y="55" fill="#fb7185" font-size="10" font-weight="700" text-anchor="middle">5. Base Model</text>
    <text x="650" y="85" fill="#cbd5e1" font-size="8">• Next-token guru</text>
    <text x="650" y="105" fill="#cbd5e1" font-size="8">• Raw autocomplete</text>
    <text x="650" y="125" fill="#cbd5e1" font-size="8">• World knowledge</text>
    <text x="650" y="145" fill="#cbd5e1" font-size="8">• Unaligned</text>
    <text x="650" y="165" fill="#cbd5e1" font-size="8">• Checkpoints</text>
    <text x="650" y="185" fill="#cbd5e1" font-size="8">• Ready for SFT</text>
  </g>
</svg>
