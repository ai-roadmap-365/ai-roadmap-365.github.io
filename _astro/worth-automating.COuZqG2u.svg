<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Every automated thing is also something to maintain.">
  <title>Not everything is worth automating</title>
  <style>
    .worth-automating-bg   { fill: #f8fafc; }
    .worth-automating-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .worth-automating-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .worth-automating-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .worth-automating-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .worth-automating-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .worth-automating-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .worth-automating-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .worth-automating-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .worth-automating-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .worth-automating-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .worth-automating-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .worth-automating-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .worth-automating-row { opacity: 1; }
    .worth-automating-r0 { animation-delay: 0.00s; }
    .worth-automating-r1 { animation-delay: 0.45s; }
    .worth-automating-r2 { animation-delay: 0.90s; }
    .worth-automating-r3 { animation-delay: 1.35s; }
    .worth-automating-r4 { animation-delay: 1.80s; }
    .worth-automating-row { animation: worth-automating-reveal 7.3s ease-in-out infinite; }
    @keyframes worth-automating-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="worth-automating-bg" width="980" height="390"/>
  <text class="worth-automating-h1"  x="30" y="40">Not everything is worth automating</text>
  <text class="worth-automating-sub" x="30" y="64">Every automated thing is also something to maintain.</text>
  <rect class="worth-automating-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="worth-automating-name" x="46" y="122">Worth it</text>
  <text class="worth-automating-desc" x="46" y="142">Repetition, or absence.</text>
  <text class="worth-automating-desc worth-automating-row worth-automating-r0" x="46" y="182">Done three times already</text>
  <text class="worth-automating-desc worth-automating-row worth-automating-r1" x="46" y="216">Must happen while you sleep</text>
  <text class="worth-automating-desc worth-automating-row worth-automating-r2" x="46" y="250">Must happen identically every time</text>
  <text class="worth-automating-desc worth-automating-row worth-automating-r3" x="46" y="284">Several people do it, differently</text>
  <text class="worth-automating-desc worth-automating-row worth-automating-r4" x="46" y="318">A mistake in it is expensive</text>
  <rect class="worth-automating-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="worth-automating-name" x="526" y="122">Leave it manual</text>
  <text class="worth-automating-desc" x="526" y="142">The maintenance costs more.</text>
  <text class="worth-automating-desc worth-automating-row worth-automating-r0" x="526" y="182">Done twice a year</text>
  <text class="worth-automating-desc worth-automating-row worth-automating-r1" x="526" y="216">The steps change every time</text>
  <text class="worth-automating-desc worth-automating-row worth-automating-r2" x="526" y="250">You do not fully understand it yet</text>
  <text class="worth-automating-desc worth-automating-row worth-automating-r3" x="526" y="284">It needs judgement at each step</text>
  <text class="worth-automating-desc worth-automating-row worth-automating-r4" x="526" y="318">A person is genuinely faster</text>
  <text class="worth-automating-sub" x="30" y="372">That third item on the right is the important one: automating a process you do not understand encodes the mistakes as faithfully as the steps, and then runs them reliably.</text>
</svg>
