<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Three decisions.">
  <title>Choosing attention configuration</title>
  <style>
    .mha-when-bg   { fill: #f8fafc; }
    .mha-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mha-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mha-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mha-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mha-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mha-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mha-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mha-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mha-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mha-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mha-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mha-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mha-when-row { opacity: 1; }
    .mha-when-r0 { animation-delay: 0.00s; }
    .mha-when-r1 { animation-delay: 0.45s; }
    .mha-when-r2 { animation-delay: 0.90s; }
    .mha-when-r3 { animation-delay: 1.35s; }
    .mha-when-r4 { animation-delay: 1.80s; }
    .mha-when-row { animation: mha-when-reveal 7.3s ease-in-out infinite; }
    @keyframes mha-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="mha-when-bg" width="980" height="390"/>
  <text class="mha-when-h1"  x="30" y="40">Choosing attention configuration</text>
  <text class="mha-when-sub" x="30" y="64">Three decisions.</text>
  <rect class="mha-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="mha-when-name" x="46" y="122">For training</text>
  <text class="mha-when-desc" x="46" y="142">Capacity and optimisation.</text>
  <text class="mha-when-desc mha-when-row mha-when-r0" x="46" y="182">More heads help optimisation</text>
  <text class="mha-when-desc mha-when-row mha-when-r1" x="46" y="216">Keep each head wide enough to be useful</text>
  <text class="mha-when-desc mha-when-row mha-when-r2" x="46" y="250">Rotary or bias-based position</text>
  <text class="mha-when-desc mha-when-row mha-when-r3" x="46" y="284">Full attention, tiled</text>
  <text class="mha-when-desc mha-when-row mha-when-r4" x="46" y="318">Follow an established recipe</text>
  <rect class="mha-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="mha-when-name" x="526" y="122">For serving</text>
  <text class="mha-when-desc" x="526" y="142">Cache and latency.</text>
  <text class="mha-when-desc mha-when-row mha-when-r0" x="526" y="182">Grouped-query to shrink the cache</text>
  <text class="mha-when-desc mha-when-row mha-when-r1" x="526" y="216">Prune redundant heads</text>
  <text class="mha-when-desc mha-when-row mha-when-r2" x="526" y="250">Quantise the cache if needed</text>
  <text class="mha-when-desc mha-when-row mha-when-r3" x="526" y="284">Longest context you actually need</text>
  <text class="mha-when-desc mha-when-row mha-when-r4" x="526" y="318">Which is usually shorter than advertised</text>
  <text class="mha-when-sub" x="30" y="372">The last row is worth acting on: context length is expensive in cache memory, and most deployed applications use a fraction of the window their model advertises.</text>
</svg>
