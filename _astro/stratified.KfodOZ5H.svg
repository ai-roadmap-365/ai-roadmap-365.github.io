<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Stratified folds</title>
  <style>
    .stratified-bg   { fill: #f8fafc; }
    .stratified-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stratified-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stratified-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stratified-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stratified-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stratified-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stratified-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stratified-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stratified-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stratified-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stratified-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stratified-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .stratified-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .stratified-stage { opacity: 1; }

    .stratified-s0 { animation-delay: 0.00s; }
    .stratified-e0 { animation-delay: 0.00s; }
    .stratified-s1 { animation-delay: 1.28s; }
    .stratified-e1 { animation-delay: 1.28s; }
    .stratified-s2 { animation-delay: 2.56s; }
    .stratified-e2 { animation-delay: 2.56s; }
    .stratified-s3 { animation-delay: 3.84s; }
    .stratified-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .stratified-conn  { animation: stratified-trace 6.4s ease-in-out infinite; }
      .stratified-stage { animation: stratified-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes stratified-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes stratified-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .stratified-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .stratified-stage { animation: stratified-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes stratified-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="stratified-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="stratified-bg" width="980" height="322"/>
  <text class="stratified-h1"  x="30" y="40">Stratified folds</text>
  <text class="stratified-sub" x="30" y="64">Four steps.</text>
  <g class="stratified-stage stratified-s0">
    <rect class="stratified-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="stratified-step" x="44" y="142">01</text>
    <text class="stratified-name" x="70" y="142">One class is rare</text>
    <text class="stratified-desc" x="44" y="166">A few percent of the rows.</text>
  </g>
  <line class="stratified-line stratified-conn stratified-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#stratified-tip)"/>
  <g class="stratified-stage stratified-s1">
    <rect class="stratified-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="stratified-step" x="280" y="142">02</text>
    <text class="stratified-name" x="306" y="142">A random split can leave a fold with almost none</text>
    <text class="stratified-desc" x="280" y="166">Or none at all, which breaks the</text>
    <text class="stratified-desc" x="280" y="182">metric.</text>
  </g>
  <line class="stratified-line stratified-conn stratified-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#stratified-tip)"/>
  <g class="stratified-stage stratified-s2">
    <rect class="stratified-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="stratified-step" x="516" y="142">03</text>
    <text class="stratified-name" x="542" y="142">So allocate each class across folds proportionally</text>
    <text class="stratified-desc" x="516" y="166">Preserving the overall balance</text>
    <text class="stratified-desc" x="516" y="182">in every fold.</text>
  </g>
  <line class="stratified-line stratified-conn stratified-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#stratified-tip)"/>
  <g class="stratified-stage stratified-s3">
    <rect class="stratified-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="stratified-step" x="752" y="142">04</text>
    <text class="stratified-name" x="778" y="142">Which makes fold scores comparable</text>
    <text class="stratified-desc" x="752" y="166">And reduces the variance of the</text>
    <text class="stratified-desc" x="752" y="182">estimate.</text>
  </g>
  <text class="stratified-sub" x="30" y="304">This should be the default for any classification problem rather than a special case, because unstratified folds add variance for no benefit.</text>
</svg>
