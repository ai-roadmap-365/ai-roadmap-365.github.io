<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Usually the latter.">
  <title>A dedicated store, or your existing database</title>
  <style>
    .dedicated-pgvector-bg   { fill: #f8fafc; }
    .dedicated-pgvector-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dedicated-pgvector-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dedicated-pgvector-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dedicated-pgvector-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dedicated-pgvector-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dedicated-pgvector-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dedicated-pgvector-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dedicated-pgvector-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dedicated-pgvector-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dedicated-pgvector-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dedicated-pgvector-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dedicated-pgvector-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dedicated-pgvector-row { opacity: 1; }
    .dedicated-pgvector-r0 { animation-delay: 0.00s; }
    .dedicated-pgvector-r1 { animation-delay: 0.45s; }
    .dedicated-pgvector-r2 { animation-delay: 0.90s; }
    .dedicated-pgvector-r3 { animation-delay: 1.35s; }
    .dedicated-pgvector-r4 { animation-delay: 1.80s; }
    .dedicated-pgvector-row { animation: dedicated-pgvector-reveal 7.3s ease-in-out infinite; }
    @keyframes dedicated-pgvector-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="dedicated-pgvector-bg" width="980" height="390"/>
  <text class="dedicated-pgvector-h1"  x="30" y="40">A dedicated store, or your existing database</text>
  <text class="dedicated-pgvector-sub" x="30" y="64">Usually the latter.</text>
  <rect class="dedicated-pgvector-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="dedicated-pgvector-name" x="46" y="122">Your existing database</text>
  <text class="dedicated-pgvector-desc" x="46" y="142">One system.</text>
  <text class="dedicated-pgvector-desc dedicated-pgvector-row dedicated-pgvector-r0" x="46" y="182">No new service to run</text>
  <text class="dedicated-pgvector-desc dedicated-pgvector-row dedicated-pgvector-r1" x="46" y="216">Transactions across vectors and rows</text>
  <text class="dedicated-pgvector-desc dedicated-pgvector-row dedicated-pgvector-r2" x="46" y="250">Filtering with the full query language</text>
  <text class="dedicated-pgvector-desc dedicated-pgvector-row dedicated-pgvector-r3" x="46" y="284">Backups and access control already solved</text>
  <text class="dedicated-pgvector-desc dedicated-pgvector-row dedicated-pgvector-r4" x="46" y="318">Fine to several million vectors</text>
  <rect class="dedicated-pgvector-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="dedicated-pgvector-name" x="526" y="122">A dedicated store</text>
  <text class="dedicated-pgvector-desc" x="526" y="142">A second system.</text>
  <text class="dedicated-pgvector-desc dedicated-pgvector-row dedicated-pgvector-r0" x="526" y="182">Purpose-built indexes and tuning</text>
  <text class="dedicated-pgvector-desc dedicated-pgvector-row dedicated-pgvector-r1" x="526" y="216">Better at very high query rates</text>
  <text class="dedicated-pgvector-desc dedicated-pgvector-row dedicated-pgvector-r2" x="526" y="250">Scales past what an extension handles</text>
  <text class="dedicated-pgvector-desc dedicated-pgvector-row dedicated-pgvector-r3" x="526" y="284">Another service to operate and secure</text>
  <text class="dedicated-pgvector-desc dedicated-pgvector-row dedicated-pgvector-r4" x="526" y="318">Earned past tens of millions</text>
  <text class="dedicated-pgvector-sub" x="30" y="372">Starting with the database you already run is nearly always right, and the migration later is straightforward because the vectors and the schema are already defined.</text>
</svg>
