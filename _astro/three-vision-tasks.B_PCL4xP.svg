<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Increasing spatial precision.">
  <title>Three questions about an image</title>
  <style>
    .three-vision-tasks-bg   { fill: #f8fafc; }
    .three-vision-tasks-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-vision-tasks-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-vision-tasks-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-vision-tasks-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-vision-tasks-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-vision-tasks-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-vision-tasks-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-vision-tasks-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-vision-tasks-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-vision-tasks-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-vision-tasks-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-vision-tasks-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .three-vision-tasks-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .three-vision-tasks-stage { opacity: 1; }

    .three-vision-tasks-s0 { animation-delay: 0.00s; }
    .three-vision-tasks-e0 { animation-delay: 0.00s; }
    .three-vision-tasks-s1 { animation-delay: 1.50s; }
    .three-vision-tasks-e1 { animation-delay: 1.50s; }
    .three-vision-tasks-s2 { animation-delay: 3.00s; }
    .three-vision-tasks-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .three-vision-tasks-conn  { animation: three-vision-tasks-trace 6s ease-in-out infinite; }
      .three-vision-tasks-stage { animation: three-vision-tasks-arrive 6s ease-in-out infinite; }
    }
    @keyframes three-vision-tasks-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes three-vision-tasks-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .three-vision-tasks-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .three-vision-tasks-stage { animation: three-vision-tasks-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes three-vision-tasks-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="three-vision-tasks-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="three-vision-tasks-bg" width="980" height="322"/>
  <text class="three-vision-tasks-h1"  x="30" y="40">Three questions about an image</text>
  <text class="three-vision-tasks-sub" x="30" y="64">Increasing spatial precision.</text>
  <g class="three-vision-tasks-stage three-vision-tasks-s0">
    <rect class="three-vision-tasks-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="three-vision-tasks-step" x="44" y="142">01</text>
    <text class="three-vision-tasks-name" x="70" y="142">Classification: what is this?</text>
    <text class="three-vision-tasks-desc" x="44" y="166">One label for the whole image. No location at</text>
    <text class="three-vision-tasks-desc" x="44" y="182">all.</text>
  </g>
  <line class="three-vision-tasks-line three-vision-tasks-conn three-vision-tasks-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#three-vision-tasks-tip)"/>
  <g class="three-vision-tasks-stage three-vision-tasks-s1">
    <rect class="three-vision-tasks-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="three-vision-tasks-step" x="359" y="142">02</text>
    <text class="three-vision-tasks-name" x="385" y="142">Detection: what, and where?</text>
    <text class="three-vision-tasks-desc" x="359" y="166">A box and a label per object. Location to a</text>
    <text class="three-vision-tasks-desc" x="359" y="182">rectangle.</text>
    <text class="three-vision-tasks-edge" x="359" y="242">boxes</text>
  </g>
  <line class="three-vision-tasks-line three-vision-tasks-conn three-vision-tasks-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#three-vision-tasks-tip)"/>
  <g class="three-vision-tasks-stage three-vision-tasks-s2">
    <rect class="three-vision-tasks-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="three-vision-tasks-step" x="674" y="142">03</text>
    <text class="three-vision-tasks-name" x="700" y="142">Segmentation: which pixels?</text>
    <text class="three-vision-tasks-desc" x="674" y="166">A class per pixel. Location to the boundary.</text>
  </g>
  <text class="three-vision-tasks-sub" x="30" y="304">Each step up costs more annotation and more compute, which is why the right question is what precision the application actually needs rather than what is technically finest.</text>
</svg>
