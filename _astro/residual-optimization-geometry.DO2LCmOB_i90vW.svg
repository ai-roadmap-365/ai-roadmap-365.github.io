<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="Functional Gradient Descent Chart">
  <title>Functional Gradient Descent Trajectory</title>
  <defs>
    <style>
      .d164f-bg { fill: #f8fafc; }
      .d164f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d164f-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; }
      .d164f-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; }
      .d164f-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 12px; font-weight: 600; }
      
      @keyframes d164f-step {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      .d164f-loss-curve { stroke: #2563eb; fill: none; stroke-width: 3; stroke-dasharray: 600; animation: d164f-step 5s infinite linear; }
      
      @media (prefers-reduced-motion: reduce) {
        .d164f-loss-curve { animation: none; stroke-dasharray: none; }
      }
    </style>
  </defs>

  <rect width="100%" height="100%" class="d164f-bg" />

  <text x="40" y="45" class="d164f-title" font-size="22">Functional Gradient Descent Optimization</text>
  <text x="40" y="70" class="d164f-text">Loss reduction across boosting rounds: Training Loss vs Validation Loss (Early Stopping Gate)</text>

  <!-- Left: Plot Area -->
  <rect x="40" y="100" width="460" height="340" class="d164f-card" />

  <!-- Axes -->
  <line x1="80" y1="380" x2="460" y2="380" stroke="#94a3b8" stroke-width="2" />
  <line x1="80" y1="140" x2="80" y2="380" stroke="#94a3b8" stroke-width="2" />

  <!-- Labels -->
  <text x="210" y="420" class="d164f-text" font-weight="700">Boosting Rounds (Trees M) ➔</text>
  <text x="45" y="270" class="d164f-text" font-weight="700" transform="rotate(-90 45,270)">Loss L(y, F) ➔</text>

  <!-- Curves -->
  <!-- Training Loss (Continuous drop) -->
  <path d="M 80 160 Q 150 260 250 310 T 460 360" stroke="#16a34a" stroke-width="2.5" fill="none" />
  <text x="360" y="350" class="d164f-math" fill="#16a34a" font-size="11">Train Loss</text>

  <!-- Validation Loss (U-shape) -->
  <path d="M 80 180 Q 150 270 240 290 Q 320 300 460 240" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="4 2" fill="none" />
  <text x="360" y="235" class="d164f-math" fill="#dc2626" font-size="11">Validation Loss</text>

  <!-- Optimal Stopping Line at round M* (x = 240) -->
  <line x1="240" y1="140" x2="240" y2="380" stroke="#2563eb" stroke-width="2" stroke-dasharray="3 3" />
  <text x="245" y="160" class="d164f-title" fill="#1d4ed8" font-size="12">Optimal Round M*</text>
  <text x="245" y="178" class="d164f-text" font-size="10" fill="#2563eb">(Early Stopping)</text>

  <!-- Right: Loss Function Formulas -->
  <rect x="520" y="100" width="340" height="340" class="d164f-card" />
  <text x="540" y="130" class="d164f-title" fill="#1e40af">Loss Functions &amp; Gradients</text>

  <!-- 1. Squared Error (L2) -->
  <rect x="540" y="150" width="300" height="65" fill="#eff6ff" stroke="#bfdbfe" rx="6" />
  <text x="555" y="172" class="d164f-title" font-size="12" fill="#1d4ed8">1. Squared Error (Regression)</text>
  <text x="555" y="195" class="d164f-math" font-size="11">L = ½(y - F)² ➔ r_i = y_i - F_{m-1}(x_i)</text>

  <!-- 2. Binary Cross-Entropy -->
  <rect x="540" y="225" width="300" height="65" fill="#fef2f2" stroke="#fecaca" rx="6" />
  <text x="555" y="247" class="d164f-title" font-size="12" fill="#dc2626">2. Log-Loss (Classification)</text>
  <text x="555" y="270" class="d164f-math" font-size="11">L = -[y·log p + (1-y)·log(1-p)] ➔ r_i = y_i - p_i</text>

  <!-- 3. Absolute Error (L1) -->
  <rect x="540" y="300" width="300" height="65" fill="#f0fdf4" stroke="#bbf7d0" rx="6" />
  <text x="555" y="322" class="d164f-title" font-size="12" fill="#16a34a">3. Absolute Error (Robust L1)</text>
  <text x="555" y="345" class="d164f-math" font-size="11">L = |y - F| ➔ r_i = sign(y_i - F_{m-1}(x_i))</text>

  <text x="540" y="395" class="d164f-text" font-size="12">Any differentiable loss function can be boosted by computing its analytical negative gradient.</text>
</svg>
