<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Limits, procedures and a maintenance log.">
  <title>A flight computer</title>
  <style>
    .avionics-bg   { fill: #f8fafc; }
    .avionics-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .avionics-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .avionics-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .avionics-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .avionics-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .avionics-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .avionics-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .avionics-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .avionics-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .avionics-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .avionics-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .avionics-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .avionics-row { opacity: 1; }
    .avionics-r0 { animation-delay: 0.00s; }
    .avionics-r1 { animation-delay: 0.45s; }
    .avionics-r2 { animation-delay: 0.90s; }
    .avionics-r3 { animation-delay: 1.35s; }
    .avionics-r4 { animation-delay: 1.80s; }
    .avionics-row { animation: avionics-reveal 7.3s ease-in-out infinite; }
    @keyframes avionics-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="avionics-bg" width="980" height="390"/>
  <text class="avionics-h1"  x="30" y="40">A flight computer</text>
  <text class="avionics-sub" x="30" y="64">Limits, procedures and a maintenance log.</text>
  <rect class="avionics-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="avionics-name" x="46" y="122">The aircraft</text>
  <text class="avionics-desc" x="46" y="142">Three systems.</text>
  <text class="avionics-desc avionics-row avionics-r0" x="46" y="182">Flight envelope: never exceed these limits</text>
  <text class="avionics-desc avionics-row avionics-r1" x="46" y="216">Pre-programmed emergency procedures</text>
  <text class="avionics-desc avionics-row avionics-r2" x="46" y="250">The maintenance logbook</text>
  <text class="avionics-desc avionics-row avionics-r3" x="46" y="284">Each read automatically, not recalled</text>
  <text class="avionics-desc avionics-row avionics-r4" x="46" y="318">Nobody briefs the computer verbally</text>
  <rect class="avionics-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="avionics-name" x="526" y="122">The agent</text>
  <text class="avionics-desc" x="526" y="142">The same three.</text>
  <text class="avionics-desc avionics-row avionics-r0" x="526" y="182">AGENTS.md: operating limits</text>
  <text class="avionics-desc avionics-row avionics-r1" x="526" y="216">Skills: procedures with scripts</text>
  <text class="avionics-desc avionics-row avionics-r2" x="526" y="250">Memory: what happened last time</text>
  <text class="avionics-desc avionics-row avionics-r3" x="526" y="284">Loaded, not remembered</text>
  <text class="avionics-desc avionics-row avionics-r4" x="526" y="318">Nobody re-explains the repository</text>
  <text class="avionics-sub" x="30" y="372">The maintenance log is the closest match to repository memory: it records specific history about this particular airframe that no general procedure would capture.</text>
</svg>
