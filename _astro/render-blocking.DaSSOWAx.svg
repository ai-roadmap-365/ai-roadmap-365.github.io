<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The parser stops, because the script might rewrite what it was parsing.">
  <title>Why a script in the head slows everything</title>
  <style>
    .render-blocking-bg   { fill: #f8fafc; }
    .render-blocking-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .render-blocking-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .render-blocking-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .render-blocking-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .render-blocking-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .render-blocking-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .render-blocking-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .render-blocking-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .render-blocking-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .render-blocking-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .render-blocking-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .render-blocking-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .render-blocking-row { opacity: 1; }
    .render-blocking-r0 { animation-delay: 0.00s; }
    .render-blocking-r1 { animation-delay: 0.45s; }
    .render-blocking-r2 { animation-delay: 0.90s; }
    .render-blocking-r3 { animation-delay: 1.35s; }
    .render-blocking-r4 { animation-delay: 1.80s; }
    .render-blocking-row { animation: render-blocking-reveal 7.3s ease-in-out infinite; }
    @keyframes render-blocking-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="render-blocking-bg" width="980" height="390"/>
  <text class="render-blocking-h1"  x="30" y="40">Why a script in the head slows everything</text>
  <text class="render-blocking-sub" x="30" y="64">The parser stops, because the script might rewrite what it was parsing.</text>
  <rect class="render-blocking-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="render-blocking-name" x="46" y="122">&lt;script src=...&gt;</text>
  <text class="render-blocking-desc" x="46" y="142">The parser stops dead.</text>
  <text class="render-blocking-desc render-blocking-row render-blocking-r0" x="46" y="182">Downloading and running block parsing</text>
  <text class="render-blocking-desc render-blocking-row render-blocking-r1" x="46" y="216">The DOM stops being built</text>
  <text class="render-blocking-desc render-blocking-row render-blocking-r2" x="46" y="250">First paint waits for the script</text>
  <text class="render-blocking-desc render-blocking-row render-blocking-r3" x="46" y="284">A large script in &lt;head&gt; is the worst case</text>
  <text class="render-blocking-desc render-blocking-row render-blocking-r4" x="46" y="318">Necessary only if the script writes markup</text>
  <rect class="render-blocking-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="render-blocking-name" x="526" y="122">defer, or end of body</text>
  <text class="render-blocking-desc" x="526" y="142">Parsing continues.</text>
  <text class="render-blocking-desc render-blocking-row render-blocking-r0" x="526" y="182">defer downloads in parallel, runs after parsing</text>
  <text class="render-blocking-desc render-blocking-row render-blocking-r1" x="526" y="216">async runs as soon as it arrives, order not guaranteed</text>
  <text class="render-blocking-desc render-blocking-row render-blocking-r2" x="526" y="250">The DOM keeps building meanwhile</text>
  <text class="render-blocking-desc render-blocking-row render-blocking-r3" x="526" y="284">First paint is not held up</text>
  <text class="render-blocking-desc render-blocking-row render-blocking-r4" x="526" y="318">The right default for almost everything</text>
  <text class="render-blocking-sub" x="30" y="372">CSS blocks rendering for a different and good reason: a rule at the end of the file could restyle the top of the page, and painting early would flash the wrong result.</text>
</svg>
