<svg role="img" aria-label="End-to-end transformer fine-tuning pipeline showing pretrained backbone layer-wise learning rates classifier head backpropagation and checkpointing" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>Transformer Fine-Tuning Pipeline and LLRD</title>
  <defs>
    <linearGradient id="bg231a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card231" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg231a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">TRANSFORMER FINE-TUNING &amp; TRANSFER LEARNING PIPELINE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Layer-wise Learning Rates, Regularization, and Sub-Millisecond Production Deployment</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card231)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Top: Task Classification Head -->
    <rect x="230" y="20" width="300" height="45" fill="#0f172a" stroke="#f43f5e" stroke-width="2" rx="6"/>
    <text x="380" y="42" fill="#fb7185" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Task Classification Head (Randomly Initialized)</text>
    <text x="380" y="58" fill="#f8fafc" font-size="8" text-anchor="middle">High Learning Rate: eta_head = 1e-4</text>

    <!-- Center: Transformer Layers with LLRD -->
    <g transform="translate(45, 80)">
      <!-- Layer 6 -->
      <rect x="0" y="0" width="670" height="32" fill="#0f172a" stroke="#a855f7" rx="4"/>
      <text x="335" y="20" fill="#c084fc" font-size="10" font-weight="700" text-anchor="middle">Transformer Layer 6 (Top Features) — LR: 5.0e-5</text>

      <!-- Layer 5 -->
      <rect x="0" y="38" width="670" height="32" fill="#0f172a" stroke="#818cf8" rx="4"/>
      <text x="335" y="58" fill="#a5b4fc" font-size="10" font-weight="700" text-anchor="middle">Transformer Layer 5 (Complex Semantics) — LR: 4.2e-5</text>

      <!-- Layer 4 -->
      <rect x="0" y="76" width="670" height="32" fill="#0f172a" stroke="#38bdf8" rx="4"/>
      <text x="335" y="96" fill="#7dd3fc" font-size="10" font-weight="700" text-anchor="middle">Transformer Layer 4 (Syntactic Patterns) — LR: 3.6e-5</text>

      <!-- Layer 1-3 -->
      <rect x="0" y="114" width="670" height="32" fill="#0f172a" stroke="#10b981" rx="4"/>
      <text x="335" y="134" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">Transformer Layers 1–3 (Low-Level Token Features) — LR: 2.1e-5 to 3.0e-5</text>
    </g>

    <!-- Bottom: Pretrained Token Embeddings -->
    <rect x="180" y="238" width="400" height="42" fill="#065f46" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="380" y="258" fill="#a7f3d0" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Pretrained Embedding Layer (Preserved / Frozen)</text>
    <text x="380" y="272" fill="#cbd5e1" font-size="8" text-anchor="middle">Minimal LR: eta_emb = 1.0e-5</text>
  </g>
</svg>
