<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Incident Lifecycle and Automated Circuit Breaker Rollback">
  <title>Incident Lifecycle and Automated Circuit Breaker Rollback</title>
  <defs>
    <style>
      .d342a-bg { fill: #f8fafc; }
      .d342a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d342a-dtc { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; rx: 8px; }
      .d342a-cct { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d342a-rst { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d342a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d342a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d342a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d342a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d342a-bg" />
  
  <text x="40" y="40" class="d342a-title">AI Incident Management &amp; Fast Rollback Lifecycle</text>
  <text x="40" y="65" class="d342a-subtitle">Incident Lifecycle and Automated Circuit Breaker Rollback showing Anomaly Detection, Incident Commander Triage, Automated Circuit Breaker Trip reverting traffic to Baseline, and Blameless Post-Mortem</text>
  
  <!-- Step 1: Anomaly Detection -->
  <rect x="40" y="110" width="240" height="270" class="d342a-dtc" />
  <text x="55" y="145" class="d342a-header" fill="#b91c1c">1. Anomaly Detection (T+0)</text>
  <text x="55" y="180" class="d342a-text">• Candidate v2.1 deployed (10%)</text>
  <text x="55" y="205" class="d342a-text">• 5xx Error Rate spikes to 4.2%</text>
  <text x="55" y="230" class="d342a-text">• P95 Latency jumps to 3,200ms</text>
  <text x="55" y="255" class="d342a-text">• Prometheus alert evaluates</text>
  <text x="55" y="295" class="d342a-text" font-weight="600" fill="#b91c1c">Immediate Detection</text>
  <text x="55" y="320" class="d342a-text">Alertmanager fires in 15 seconds</text>
  
  <!-- Step 2: Circuit Breaker Trip -->
  <rect x="315" y="110" width="240" height="270" class="d342a-cct" />
  <text x="330" y="145" class="d342a-header" fill="#1d4ed8">2. Circuit Breaker Trip (T+30s)</text>
  <text x="330" y="180" class="d342a-text">• Error threshold breached (&gt;1%)</text>
  <text x="330" y="205" class="d342a-text">• Automated router trips circuit</text>
  <text x="330" y="230" class="d342a-text">• Traffic instantly reverts to v2.0</text>
  <text x="330" y="255" class="d342a-text">• Zero manual intervention</text>
  <text x="330" y="295" class="d342a-text" font-weight="600" fill="#1d4ed8">500ms Mitigation</text>
  <text x="330" y="320" class="d342a-text">Customer impact neutralized</text>
  
  <!-- Step 3: Resolution & Post-Mortem -->
  <rect x="590" y="110" width="270" height="270" class="d342a-rst" />
  <text x="605" y="145" class="d342a-header" fill="#15803d">3. Blameless Post-Mortem</text>
  <text x="605" y="180" class="d342a-text">• Root Cause: CUDA OOM on 8k ctx</text>
  <text x="605" y="205" class="d342a-text">• Five Whys causal timeline</text>
  <text x="605" y="230" class="d342a-text">• Action Item 1: Add KV test suite</text>
  <text x="605" y="255" class="d342a-text">• Action Item 2: Lower max context</text>
  <text x="605" y="295" class="d342a-text" font-weight="600" fill="#15803d">Continuous Learning</text>
  <text x="605" y="320" class="d342a-text">Systemic hardening prevents repeat</text>
</svg>