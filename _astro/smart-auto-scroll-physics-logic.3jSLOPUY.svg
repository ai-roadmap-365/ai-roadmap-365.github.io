<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Smart Auto-Scroll Physics Logic">
  <title>Smart Auto-Scroll Physics Logic</title>
  <defs>
    <style>
      .d318b-bg { fill: #f8fafc; }
      .d318b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d318b-stick { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d318b-lock { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 8px; }
      .d318b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d318b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d318b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
      .d318b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d318b-bg" />
  
  <text x="40" y="40" class="d318a-title">Smart Auto-Scroll Viewport Physics</text>
  <text x="40" y="65" class="d318a-subtitle">Smart Auto-Scroll Physics Logic comparing User at Bottom (Stick to bottom on new token) with User Scrolled Up (Auto-scroll locked, show jump-to-bottom button)</text>
  
  <!-- Scenario A: User at Bottom -->
  <rect x="40" y="110" width="390" height="270" class="d318b-stick" />
  <text x="60" y="145" class="d318b-header" fill="#1d4ed8">Scenario A: User at Bottom (Stick to Bottom)</text>
  <text x="60" y="180" class="d318b-text">• Viewport is within 50px of bottom threshold</text>
  <text x="60" y="205" class="d318b-text">• As each token chunk arrives: `scrollToBottom()`</text>
  <text x="60" y="230" class="d318b-text">• Smooth micro-scroll anchors user to new text</text>
  <text x="60" y="255" class="d318b-text">• No scroll jumping; fluid reading experience</text>
  <text x="60" y="300" class="d318b-text" font-weight="600" fill="#1d4ed8">Status: Auto-Scroll Active</text>
  
  <!-- Scenario B: User Scrolled Up -->
  <rect x="470" y="110" width="390" height="270" class="d318b-lock" />
  <text x="490" y="145" class="d318b-header" fill="#a16207">Scenario B: User Scrolled Up (Scroll Locked)</text>
  <text x="490" y="180" class="d318b-text">• User manually scrolls up to read earlier message</text>
  <text x="490" y="205" class="d318b-text">• `isUserScrolledUp = true` -> DISABLE auto-scroll</text>
  <text x="490" y="230" class="d318b-text">• Tokens append in background without moving viewport</text>
  <text x="490" y="255" class="d318b-text">• Display floating "Scroll to Bottom (↓)" badge</text>
  <text x="490" y="300" class="d318b-text" font-weight="600" fill="#a16207">Status: User In Control</text>
</svg>