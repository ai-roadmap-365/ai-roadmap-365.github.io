<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which sounds wrong and works.">
  <title>Answering before searching</title>
  <style>
    .hyde-bg   { fill: #f8fafc; }
    .hyde-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hyde-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hyde-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hyde-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hyde-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hyde-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hyde-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hyde-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hyde-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hyde-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hyde-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hyde-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .hyde-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .hyde-stage { opacity: 1; }

    .hyde-s0 { animation-delay: 0.00s; }
    .hyde-e0 { animation-delay: 0.00s; }
    .hyde-s1 { animation-delay: 1.28s; }
    .hyde-e1 { animation-delay: 1.28s; }
    .hyde-s2 { animation-delay: 2.56s; }
    .hyde-e2 { animation-delay: 2.56s; }
    .hyde-s3 { animation-delay: 3.84s; }
    .hyde-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .hyde-conn  { animation: hyde-trace 6.4s ease-in-out infinite; }
      .hyde-stage { animation: hyde-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes hyde-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes hyde-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .hyde-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .hyde-stage { animation: hyde-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes hyde-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="hyde-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="hyde-bg" width="980" height="322"/>
  <text class="hyde-h1"  x="30" y="40">Answering before searching</text>
  <text class="hyde-sub" x="30" y="64">Which sounds wrong and works.</text>
  <g class="hyde-stage hyde-s0">
    <rect class="hyde-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="hyde-step" x="44" y="142">01</text>
    <text class="hyde-name" x="70" y="142">A question and an answer look different</text>
    <text class="hyde-desc" x="44" y="166">So the question embeds far from</text>
    <text class="hyde-desc" x="44" y="182">the passage that answers it.</text>
  </g>
  <line class="hyde-line hyde-conn hyde-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#hyde-tip)"/>
  <g class="hyde-stage hyde-s1">
    <rect class="hyde-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="hyde-step" x="280" y="142">02</text>
    <text class="hyde-name" x="306" y="142">Generate a plausible answer first</text>
    <text class="hyde-desc" x="280" y="166">Which may be factually wrong. It</text>
    <text class="hyde-desc" x="280" y="182">does not matter.</text>
  </g>
  <line class="hyde-line hyde-conn hyde-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#hyde-tip)"/>
  <g class="hyde-stage hyde-s2">
    <rect class="hyde-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="hyde-step" x="516" y="142">03</text>
    <text class="hyde-name" x="542" y="142">Embed that instead of the question</text>
    <text class="hyde-desc" x="516" y="166">It looks like the passages you</text>
    <text class="hyde-desc" x="516" y="182">are searching for.</text>
  </g>
  <line class="hyde-line hyde-conn hyde-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#hyde-tip)"/>
  <g class="hyde-stage hyde-s3">
    <rect class="hyde-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="hyde-step" x="752" y="142">04</text>
    <text class="hyde-name" x="778" y="142">And retrieve with it</text>
    <text class="hyde-desc" x="752" y="166">Which lands much closer to real</text>
    <text class="hyde-desc" x="752" y="182">answers.</text>
  </g>
  <text class="hyde-sub" x="30" y="304">That the hypothetical answer can be wrong is the counter-intuitive part: it is used only for its shape and vocabulary, never for its content.</text>
</svg>
