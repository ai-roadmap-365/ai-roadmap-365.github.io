<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" font-family="system-ui, sans-serif">
  <title>The three git reset modes and which of HEAD, the index, and the working tree each one moves</title>
  <rect x="0" y="0" width="780" height="540" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">git reset: what each mode moves</text>
  <text x="390" y="58" text-anchor="middle" font-size="14" fill="#1a202c">All three move the branch pointer (HEAD). They differ in how far the change reaches.</text>

  <!-- Column headers: the three trees -->
  <text x="300" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">HEAD (branch tip)</text>
  <text x="460" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">Index (staging)</text>
  <text x="640" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">Working tree (files)</text>

  <!-- soft row -->
  <rect x="20" y="118" width="150" height="86" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="95" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">--soft</text>
  <text x="95" y="173" text-anchor="middle" font-size="14" fill="#1a202c">gentlest</text>
  <text x="95" y="192" text-anchor="middle" font-size="14" fill="#1a202c">moves 1 thing</text>

  <rect x="245" y="128" width="110" height="60" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" rx="6"/>
  <text x="300" y="163" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">MOVED</text>
  <rect x="405" y="128" width="110" height="60" fill="#dcfce7" stroke="#15803d" stroke-width="2" rx="6"/>
  <text x="460" y="163" text-anchor="middle" font-size="14" fill="#1a202c">unchanged</text>
  <rect x="565" y="128" width="150" height="60" fill="#dcfce7" stroke="#15803d" stroke-width="2" rx="6"/>
  <text x="640" y="163" text-anchor="middle" font-size="14" fill="#1a202c">unchanged</text>

  <!-- mixed row -->
  <rect x="20" y="226" width="150" height="86" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="95" y="258" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">--mixed</text>
  <text x="95" y="281" text-anchor="middle" font-size="14" fill="#1a202c">the default</text>
  <text x="95" y="300" text-anchor="middle" font-size="14" fill="#1a202c">moves 2 things</text>

  <rect x="245" y="236" width="110" height="60" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" rx="6"/>
  <text x="300" y="271" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">MOVED</text>
  <rect x="405" y="236" width="110" height="60" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" rx="6"/>
  <text x="460" y="271" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">RESET</text>
  <rect x="565" y="236" width="150" height="60" fill="#dcfce7" stroke="#15803d" stroke-width="2" rx="6"/>
  <text x="640" y="271" text-anchor="middle" font-size="14" fill="#1a202c">unchanged</text>

  <!-- hard row -->
  <rect x="20" y="334" width="150" height="86" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" rx="8"/>
  <text x="95" y="366" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">--hard</text>
  <text x="95" y="389" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">DANGEROUS</text>
  <text x="95" y="408" text-anchor="middle" font-size="14" fill="#1a202c">moves all 3</text>

  <rect x="245" y="344" width="110" height="60" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" rx="6"/>
  <text x="300" y="379" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">MOVED</text>
  <rect x="405" y="344" width="110" height="60" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" rx="6"/>
  <text x="460" y="379" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">RESET</text>
  <rect x="565" y="344" width="150" height="60" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" rx="6"/>
  <text x="640" y="371" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">OVERWRITTEN</text>
  <text x="640" y="392" text-anchor="middle" font-size="14" fill="#b91c1c">edits discarded</text>

  <!-- legend -->
  <rect x="20" y="444" width="740" height="80" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="390" y="468" text-anchor="middle" font-size="14" fill="#1a202c">Green cells are left alone and safe.</text>
  <text x="390" y="490" text-anchor="middle" font-size="14" fill="#1a202c">Red on HEAD or the index means updated but still recoverable through the reflog.</text>
  <text x="390" y="512" text-anchor="middle" font-size="14" fill="#1a202c">Red on the working tree (only with --hard) means uncommitted edits are erased — no undo.</text>
</svg>
