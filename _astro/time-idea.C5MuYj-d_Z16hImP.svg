<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four distinctions.">
  <title>The three kinds of time value</title>
  <style>
    .time-idea-bg   { fill: #f8fafc; }
    .time-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .time-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .time-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .time-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .time-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .time-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .time-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .time-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .time-idea-stage { opacity: 1; }

    .time-idea-s0 { animation-delay: 0.00s; }
    .time-idea-e0 { animation-delay: 0.00s; }
    .time-idea-s1 { animation-delay: 1.28s; }
    .time-idea-e1 { animation-delay: 1.28s; }
    .time-idea-s2 { animation-delay: 2.56s; }
    .time-idea-e2 { animation-delay: 2.56s; }
    .time-idea-s3 { animation-delay: 3.84s; }
    .time-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .time-idea-conn  { animation: time-idea-trace 6.4s ease-in-out infinite; }
      .time-idea-stage { animation: time-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes time-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes time-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .time-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .time-idea-stage { animation: time-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes time-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="time-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="time-idea-bg" width="980" height="322"/>
  <text class="time-idea-h1"  x="30" y="40">The three kinds of time value</text>
  <text class="time-idea-sub" x="30" y="64">Four distinctions.</text>
  <g class="time-idea-stage time-idea-s0">
    <rect class="time-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="time-idea-step" x="44" y="142">01</text>
    <text class="time-idea-name" x="70" y="142">An instant: a specific moment, everywhere at once</text>
    <text class="time-idea-desc" x="44" y="166">Store these with an offset.</text>
  </g>
  <line class="time-idea-line time-idea-conn time-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#time-idea-tip)"/>
  <g class="time-idea-stage time-idea-s1">
    <rect class="time-idea-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="time-idea-step" x="280" y="142">02</text>
    <text class="time-idea-name" x="306" y="142">A local time: a wall-clock reading with no zone</text>
    <text class="time-idea-desc" x="280" y="166">Ambiguous until a zone is</text>
    <text class="time-idea-desc" x="280" y="182">supplied.</text>
  </g>
  <line class="time-idea-line time-idea-conn time-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#time-idea-tip)"/>
  <g class="time-idea-stage time-idea-s2">
    <rect class="time-idea-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="time-idea-step" x="516" y="142">03</text>
    <text class="time-idea-name" x="542" y="142">A calendar date: a day, with no time at all</text>
    <text class="time-idea-desc" x="516" y="166">A birthday is not an instant.</text>
  </g>
  <line class="time-idea-line time-idea-conn time-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#time-idea-tip)"/>
  <g class="time-idea-stage time-idea-s3">
    <rect class="time-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="time-idea-step" x="752" y="142">04</text>
    <text class="time-idea-name" x="778" y="142">And a duration: an amount of time, not a point</text>
    <text class="time-idea-desc" x="752" y="166">Which does not convert between</text>
    <text class="time-idea-desc" x="752" y="182">zones.</text>
  </g>
  <text class="time-idea-sub" x="30" y="304">Confusing an instant with a local time is the root of nearly every date bug, because the two look identical when printed and mean entirely different things.</text>
</svg>
