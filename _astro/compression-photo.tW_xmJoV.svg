<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Detail nobody uses.">
  <title>Compressing a recording</title>
  <style>
    .compression-photo-bg   { fill: #f8fafc; }
    .compression-photo-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compression-photo-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compression-photo-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compression-photo-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compression-photo-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compression-photo-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .compression-photo-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .compression-photo-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .compression-photo-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .compression-photo-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .compression-photo-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .compression-photo-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .compression-photo-row { opacity: 1; }
    .compression-photo-r0 { animation-delay: 0.00s; }
    .compression-photo-r1 { animation-delay: 0.45s; }
    .compression-photo-r2 { animation-delay: 0.90s; }
    .compression-photo-r3 { animation-delay: 1.35s; }
    .compression-photo-r4 { animation-delay: 1.80s; }
    .compression-photo-row { animation: compression-photo-reveal 7.3s ease-in-out infinite; }
    @keyframes compression-photo-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="compression-photo-bg" width="980" height="390"/>
  <text class="compression-photo-h1"  x="30" y="40">Compressing a recording</text>
  <text class="compression-photo-sub" x="30" y="64">Detail nobody uses.</text>
  <rect class="compression-photo-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="compression-photo-name" x="46" y="122">Uncompressed</text>
  <text class="compression-photo-desc" x="46" y="142">Every bit preserved.</text>
  <text class="compression-photo-desc compression-photo-row compression-photo-r0" x="46" y="182">Perfect fidelity</text>
  <text class="compression-photo-desc compression-photo-row compression-photo-r1" x="46" y="216">Very large files</text>
  <text class="compression-photo-desc compression-photo-row compression-photo-r2" x="46" y="250">Detail beyond perception</text>
  <text class="compression-photo-desc compression-photo-row compression-photo-r3" x="46" y="284">Slow to move around</text>
  <text class="compression-photo-desc compression-photo-row compression-photo-r4" x="46" y="318">This is full precision</text>
  <rect class="compression-photo-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="compression-photo-name" x="526" y="122">Compressed</text>
  <text class="compression-photo-desc" x="526" y="142">Every bit that matters.</text>
  <text class="compression-photo-desc compression-photo-row compression-photo-r0" x="526" y="182">Detail dropped where it is not used</text>
  <text class="compression-photo-desc compression-photo-row compression-photo-r1" x="526" y="216">A fraction of the size</text>
  <text class="compression-photo-desc compression-photo-row compression-photo-r2" x="526" y="250">Indistinguishable in practice</text>
  <text class="compression-photo-desc compression-photo-row compression-photo-r3" x="526" y="284">Fast to move around</text>
  <text class="compression-photo-desc compression-photo-row compression-photo-r4" x="526" y="318">This is quantisation</text>
  <text class="compression-photo-sub" x="30" y="372">Both work for the same underlying reason: the original representation carried far more precision than the consumer of it could actually make use of.</text>
</svg>
