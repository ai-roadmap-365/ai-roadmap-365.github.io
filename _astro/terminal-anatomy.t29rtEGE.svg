<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" role="img" font-family="system-ui, sans-serif">
  <title>The terminal emulator contains the shell, which sits on the operating system, plus a labelled command line</title>
  <rect x="0" y="0" width="700" height="560" fill="#f8fafc"/>
  <text x="350" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Anatomy of a terminal session</text>

  <!-- Nested layers: emulator > shell > OS -->
  <rect x="60" y="56" width="580" height="230" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="80" y="80" font-size="16" font-weight="bold" fill="#1a202c">Terminal emulator</text>
  <text x="80" y="100" font-size="14" fill="#1a202c">the window that shows text and sends your keystrokes on</text>

  <rect x="90" y="116" width="520" height="150" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="110" y="140" font-size="16" font-weight="bold" fill="#1a202c">Shell</text>
  <text x="110" y="160" font-size="14" fill="#1a202c">reads your command line, interprets it, launches programs</text>

  <rect x="120" y="176" width="460" height="76" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="140" y="200" font-size="16" font-weight="bold" fill="#1a202c">Operating system</text>
  <text x="140" y="220" font-size="14" fill="#1a202c">actually starts programs, opens files, manages memory</text>
  <text x="140" y="240" font-size="14" fill="#1a202c">(the layers you studied in Week 1)</text>

  <!-- Command line dissection -->
  <text x="350" y="322" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">A single command line, word by word</text>

  <rect x="60" y="340" width="580" height="70" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="110" y="384" font-size="26" font-weight="bold" fill="#1d4ed8">ls</text>
  <text x="230" y="384" font-size="26" font-weight="bold" fill="#1a202c">-l</text>
  <text x="360" y="384" font-size="26" font-weight="bold" fill="#1a202c">/Users</text>

  <!-- Pointers/labels -->
  <line x1="118" y1="392" x2="118" y2="430" stroke="#1d4ed8" stroke-width="2"/>
  <text x="118" y="450" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Command</text>
  <text x="118" y="470" text-anchor="middle" font-size="14" fill="#1a202c">the program to run</text>

  <line x1="242" y1="392" x2="242" y2="430" stroke="#1d4ed8" stroke-width="2"/>
  <text x="300" y="450" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Option / flag</text>
  <text x="300" y="470" text-anchor="middle" font-size="14" fill="#1a202c">changes how it behaves</text>

  <line x1="400" y1="392" x2="400" y2="430" stroke="#1d4ed8" stroke-width="2"/>
  <text x="500" y="450" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Argument</text>
  <text x="500" y="470" text-anchor="middle" font-size="14" fill="#1a202c">what it acts on</text>

  <text x="350" y="520" text-anchor="middle" font-size="15" fill="#1a202c">Read every command left to right: command first, then its options and arguments.</text>
</svg>
