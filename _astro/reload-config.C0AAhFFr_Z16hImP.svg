<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The most common configuration bug in existence.">
  <title>Why your edit did nothing</title>
  <style>
    .reload-config-bg   { fill: #f8fafc; }
    .reload-config-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reload-config-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reload-config-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reload-config-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reload-config-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reload-config-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .reload-config-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .reload-config-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .reload-config-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .reload-config-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .reload-config-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .reload-config-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .reload-config-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .reload-config-stage { opacity: 1; }

    .reload-config-s0 { animation-delay: 0.00s; }
    .reload-config-e0 { animation-delay: 0.00s; }
    .reload-config-s1 { animation-delay: 1.28s; }
    .reload-config-e1 { animation-delay: 1.28s; }
    .reload-config-s2 { animation-delay: 2.56s; }
    .reload-config-e2 { animation-delay: 2.56s; }
    .reload-config-s3 { animation-delay: 3.84s; }
    .reload-config-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .reload-config-conn  { animation: reload-config-trace 6.4s ease-in-out infinite; }
      .reload-config-stage { animation: reload-config-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes reload-config-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes reload-config-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .reload-config-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .reload-config-stage { animation: reload-config-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes reload-config-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="reload-config-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="reload-config-bg" width="980" height="322"/>
  <text class="reload-config-h1"  x="30" y="40">Why your edit did nothing</text>
  <text class="reload-config-sub" x="30" y="64">The most common configuration bug in existence.</text>
  <g class="reload-config-stage reload-config-s0">
    <rect class="reload-config-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="reload-config-step" x="44" y="142">01</text>
    <text class="reload-config-name" x="70" y="142">Check which shell you are in</text>
    <text class="reload-config-desc" x="44" y="166">echo $0 or ps -p $$. macOS</text>
    <text class="reload-config-desc" x="44" y="182">terminals run zsh, not bash.</text>
    <text class="reload-config-edge" x="44" y="242">$0</text>
  </g>
  <line class="reload-config-line reload-config-conn reload-config-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#reload-config-tip)"/>
  <g class="reload-config-stage reload-config-s1">
    <rect class="reload-config-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="reload-config-step" x="280" y="142">02</text>
    <text class="reload-config-name" x="306" y="142">Edit the file that shell reads</text>
    <text class="reload-config-desc" x="280" y="166">zsh reads .zshrc. bash reads</text>
    <text class="reload-config-desc" x="280" y="182">.bashrc. Editing the other one</text>
    <text class="reload-config-desc" x="280" y="198">does nothing at all.</text>
  </g>
  <line class="reload-config-line reload-config-conn reload-config-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#reload-config-tip)"/>
  <g class="reload-config-stage reload-config-s2">
    <rect class="reload-config-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="reload-config-step" x="516" y="142">03</text>
    <text class="reload-config-name" x="542" y="142">Open shells never re-read it</text>
    <text class="reload-config-desc" x="516" y="166">The file is read at startup and</text>
    <text class="reload-config-desc" x="516" y="182">not again.</text>
  </g>
  <line class="reload-config-line reload-config-conn reload-config-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#reload-config-tip)"/>
  <g class="reload-config-stage reload-config-s3">
    <rect class="reload-config-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="reload-config-step" x="752" y="142">04</text>
    <text class="reload-config-name" x="778" y="142">source it, or open a new terminal</text>
    <text class="reload-config-desc" x="752" y="166">source ~/.zshrc applies it here</text>
    <text class="reload-config-desc" x="752" y="182">and now.</text>
    <text class="reload-config-edge" x="752" y="242">source</text>
  </g>
  <text class="reload-config-sub" x="30" y="304">Editing ~/.bash_profile on a machine whose terminals read ~/.zshrc, then wondering why nothing changed, is the single most common shell-configuration mistake.</text>
</svg>
