<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Contrastive pretraining</title>
  <style>
    .clip-loss-bg   { fill: #f8fafc; }
    .clip-loss-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clip-loss-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clip-loss-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clip-loss-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clip-loss-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clip-loss-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .clip-loss-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .clip-loss-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .clip-loss-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .clip-loss-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .clip-loss-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .clip-loss-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .clip-loss-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .clip-loss-stage { opacity: 1; }

    .clip-loss-s0 { animation-delay: 0.00s; }
    .clip-loss-e0 { animation-delay: 0.00s; }
    .clip-loss-s1 { animation-delay: 1.28s; }
    .clip-loss-e1 { animation-delay: 1.28s; }
    .clip-loss-s2 { animation-delay: 2.56s; }
    .clip-loss-e2 { animation-delay: 2.56s; }
    .clip-loss-s3 { animation-delay: 3.84s; }
    .clip-loss-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .clip-loss-conn  { animation: clip-loss-trace 6.4s ease-in-out infinite; }
      .clip-loss-stage { animation: clip-loss-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes clip-loss-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes clip-loss-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .clip-loss-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .clip-loss-stage { animation: clip-loss-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes clip-loss-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="clip-loss-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="clip-loss-bg" width="980" height="322"/>
  <text class="clip-loss-h1"  x="30" y="40">Contrastive pretraining</text>
  <text class="clip-loss-sub" x="30" y="64">Four steps.</text>
  <g class="clip-loss-stage clip-loss-s0">
    <rect class="clip-loss-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="clip-loss-step" x="44" y="142">01</text>
    <text class="clip-loss-name" x="70" y="142">Collect image and caption pairs</text>
    <text class="clip-loss-desc" x="44" y="166">Hundreds of millions, from the</text>
    <text class="clip-loss-desc" x="44" y="182">web.</text>
  </g>
  <line class="clip-loss-line clip-loss-conn clip-loss-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#clip-loss-tip)"/>
  <g class="clip-loss-stage clip-loss-s1">
    <rect class="clip-loss-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="clip-loss-step" x="280" y="142">02</text>
    <text class="clip-loss-name" x="306" y="142">Embed both, in a batch</text>
    <text class="clip-loss-desc" x="280" y="166">Giving a grid of every image</text>
    <text class="clip-loss-desc" x="280" y="182">against every caption.</text>
  </g>
  <line class="clip-loss-line clip-loss-conn clip-loss-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#clip-loss-tip)"/>
  <g class="clip-loss-stage clip-loss-s2">
    <rect class="clip-loss-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="clip-loss-step" x="516" y="142">03</text>
    <text class="clip-loss-name" x="542" y="142">Pull matching pairs together, push the rest apart</text>
    <text class="clip-loss-desc" x="516" y="166">In both directions,</text>
    <text class="clip-loss-desc" x="516" y="182">symmetrically.</text>
  </g>
  <line class="clip-loss-line clip-loss-conn clip-loss-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#clip-loss-tip)"/>
  <g class="clip-loss-stage clip-loss-s3">
    <rect class="clip-loss-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="clip-loss-step" x="752" y="142">04</text>
    <text class="clip-loss-name" x="778" y="142">And classification becomes free</text>
    <text class="clip-loss-desc" x="752" y="166">Compare an image against the</text>
    <text class="clip-loss-desc" x="752" y="182">text of any label.</text>
    <text class="clip-loss-edge" x="752" y="242">zero-shot</text>
  </g>
  <text class="clip-loss-sub" x="30" y="304">Classification without a labelled training set is the capability this unlocked: any category expressible as a phrase becomes a class, with no additional training.</text>
</svg>
