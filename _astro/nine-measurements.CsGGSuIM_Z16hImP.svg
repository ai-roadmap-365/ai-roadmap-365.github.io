<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four conclusions.">
  <title>What the measurements establish</title>
  <style>
    .nine-measurements-bg   { fill: #f8fafc; }
    .nine-measurements-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nine-measurements-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nine-measurements-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nine-measurements-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nine-measurements-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nine-measurements-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nine-measurements-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .nine-measurements-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .nine-measurements-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .nine-measurements-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .nine-measurements-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .nine-measurements-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .nine-measurements-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .nine-measurements-stage { opacity: 1; }

    .nine-measurements-s0 { animation-delay: 0.00s; }
    .nine-measurements-e0 { animation-delay: 0.00s; }
    .nine-measurements-s1 { animation-delay: 1.28s; }
    .nine-measurements-e1 { animation-delay: 1.28s; }
    .nine-measurements-s2 { animation-delay: 2.56s; }
    .nine-measurements-e2 { animation-delay: 2.56s; }
    .nine-measurements-s3 { animation-delay: 3.84s; }
    .nine-measurements-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .nine-measurements-conn  { animation: nine-measurements-trace 6.4s ease-in-out infinite; }
      .nine-measurements-stage { animation: nine-measurements-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes nine-measurements-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes nine-measurements-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .nine-measurements-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .nine-measurements-stage { animation: nine-measurements-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes nine-measurements-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="nine-measurements-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="nine-measurements-bg" width="980" height="322"/>
  <text class="nine-measurements-h1"  x="30" y="40">What the measurements establish</text>
  <text class="nine-measurements-sub" x="30" y="64">Four conclusions.</text>
  <g class="nine-measurements-stage nine-measurements-s0">
    <rect class="nine-measurements-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="nine-measurements-step" x="44" y="142">01</text>
    <text class="nine-measurements-name" x="70" y="142">A perfect training score can mean nothing</text>
    <text class="nine-measurements-desc" x="44" y="166">Demonstrated, not argued.</text>
  </g>
  <line class="nine-measurements-line nine-measurements-conn nine-measurements-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#nine-measurements-tip)"/>
  <g class="nine-measurements-stage nine-measurements-s1">
    <rect class="nine-measurements-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="nine-measurements-step" x="280" y="142">02</text>
    <text class="nine-measurements-name" x="306" y="142">A score is meaningless without a baseline</text>
    <text class="nine-measurements-desc" x="280" y="166">Which is a one-line computation.</text>
  </g>
  <line class="nine-measurements-line nine-measurements-conn nine-measurements-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#nine-measurements-tip)"/>
  <g class="nine-measurements-stage nine-measurements-s2">
    <rect class="nine-measurements-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="nine-measurements-step" x="516" y="142">03</text>
    <text class="nine-measurements-name" x="542" y="142">The gap between train and test is the diagnostic</text>
    <text class="nine-measurements-desc" x="516" y="166">Not either number alone.</text>
  </g>
  <line class="nine-measurements-line nine-measurements-conn nine-measurements-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#nine-measurements-tip)"/>
  <g class="nine-measurements-stage nine-measurements-s3">
    <rect class="nine-measurements-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="nine-measurements-step" x="752" y="142">04</text>
    <text class="nine-measurements-name" x="778" y="142">And some error cannot be removed at all</text>
    <text class="nine-measurements-desc" x="752" y="166">Which bounds what any model can</text>
    <text class="nine-measurements-desc" x="752" y="182">achieve.</text>
  </g>
  <text class="nine-measurements-sub" x="30" y="304">All four are established by measurement rather than assertion, which is the pattern the whole course follows and the reason the numbers are quoted exactly.</text>
</svg>
