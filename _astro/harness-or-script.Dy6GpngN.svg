<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One of them can be repeated.">
  <title>A harness, or a training script</title>
  <style>
    .harness-or-script-bg   { fill: #f8fafc; }
    .harness-or-script-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-or-script-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-or-script-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-or-script-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-or-script-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-or-script-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .harness-or-script-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .harness-or-script-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .harness-or-script-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .harness-or-script-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .harness-or-script-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .harness-or-script-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .harness-or-script-row { opacity: 1; }
    .harness-or-script-r0 { animation-delay: 0.00s; }
    .harness-or-script-r1 { animation-delay: 0.45s; }
    .harness-or-script-r2 { animation-delay: 0.90s; }
    .harness-or-script-r3 { animation-delay: 1.35s; }
    .harness-or-script-r4 { animation-delay: 1.80s; }
    .harness-or-script-row { animation: harness-or-script-reveal 7.3s ease-in-out infinite; }
    @keyframes harness-or-script-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="harness-or-script-bg" width="980" height="390"/>
  <text class="harness-or-script-h1"  x="30" y="40">A harness, or a training script</text>
  <text class="harness-or-script-sub" x="30" y="64">One of them can be repeated.</text>
  <rect class="harness-or-script-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="harness-or-script-name" x="46" y="122">A harness</text>
  <text class="harness-or-script-desc" x="46" y="142">Reproducible and resumable.</text>
  <text class="harness-or-script-desc harness-or-script-row harness-or-script-r0" x="46" y="182">One typed configuration object</text>
  <text class="harness-or-script-desc harness-or-script-row harness-or-script-r1" x="46" y="216">Every random source seeded</text>
  <text class="harness-or-script-desc harness-or-script-row harness-or-script-r2" x="46" y="250">Full state checkpointed</text>
  <text class="harness-or-script-desc harness-or-script-row harness-or-script-r3" x="46" y="284">Metrics recorded per run</text>
  <text class="harness-or-script-desc harness-or-script-row harness-or-script-r4" x="46" y="318">The same config produces the same weights</text>
  <rect class="harness-or-script-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="harness-or-script-name" x="526" y="122">A script</text>
  <text class="harness-or-script-desc" x="526" y="142">Correct once.</text>
  <text class="harness-or-script-desc harness-or-script-row harness-or-script-r0" x="526" y="182">Hyperparameters scattered through the file</text>
  <text class="harness-or-script-desc harness-or-script-row harness-or-script-r1" x="526" y="216">Some seeds set, some not</text>
  <text class="harness-or-script-desc harness-or-script-row harness-or-script-r2" x="526" y="250">Only weights saved</text>
  <text class="harness-or-script-desc harness-or-script-row harness-or-script-r3" x="526" y="284">Metrics printed to a terminal</text>
  <text class="harness-or-script-desc harness-or-script-row harness-or-script-r4" x="526" y="318">And the run cannot be repeated</text>
  <text class="harness-or-script-sub" x="30" y="372">"The same config produces the same weights" is a strong claim and an achievable one, and it is the property that turns a comparison between two runs into evidence rather than an impression.</text>
</svg>
