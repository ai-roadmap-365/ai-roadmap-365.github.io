<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="Text Classification Pipeline Flow">
  <title>Text Classification Pipeline Flow</title>
  <defs>
    <style>
      .d158f-bg { fill: #f8fafc; }
      .d158f-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d158f-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 700; }
      .d158f-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; }
      .d158f-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 13px; font-weight: 600; }
      .d158f-arrow { stroke: #2563eb; stroke-width: 2; marker-end: url(#d158f-arr); fill: none; }
      
      @keyframes d158f-pulse {
        0%, 100% { stroke: #3b82f6; }
        50% { stroke: #1d4ed8; stroke-width: 3; }
      }
      .d158f-active { animation: d158f-pulse 2.5s infinite ease-in-out; }
      
      @media (prefers-reduced-motion: reduce) {
        .d158f-active { animation: none; stroke: #3b82f6; stroke-width: 2; }
      }
    </style>
    <marker id="d158f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="d158f-bg" />

  <text x="40" y="45" class="d158f-title" font-size="22">End-to-End NLP Text Classification Pipeline</text>
  <text x="40" y="70" class="d158f-text">From raw text string to Bag-of-Words vectorization and Naive Bayes probability prediction</text>

  <!-- Step 1: Raw Text -->
  <rect x="40" y="110" width="180" height="150" class="d158f-box" />
  <text x="55" y="140" class="d158f-title" font-size="14" fill="#1e40af">1. Raw Document</text>
  <rect x="55" y="155" width="150" height="55" fill="#f1f5f9" rx="4" />
  <text x="65" y="175" class="d158f-text" font-size="11">"Win FREE cash</text>
  <text x="65" y="195" class="d158f-text" font-size="11">prize today now!"</text>
  <text x="55" y="235" class="d158f-text" font-size="11" fill="#64748b">Unstructured string</text>

  <path d="M 220 185 L 260 185" class="d158f-arrow" />

  <!-- Step 2: Tokenize -->
  <rect x="270" y="110" width="170" height="150" class="d158f-box" />
  <text x="285" y="140" class="d158f-title" font-size="14" fill="#1e40af">2. Tokenizer</text>
  <text x="285" y="170" class="d158f-math" font-size="11">['win', 'free',</text>
  <text x="285" y="190" class="d158f-math" font-size="11"> 'cash', 'prize',</text>
  <text x="285" y="210" class="d158f-math" font-size="11"> 'today', 'now']</text>
  <text x="285" y="240" class="d158f-text" font-size="11" fill="#64748b">Lower + regex words</text>

  <path d="M 440 185 L 480 185" class="d158f-arrow" />

  <!-- Step 3: BOW Vector -->
  <rect x="490" y="110" width="180" height="150" class="d158f-box d158f-active" />
  <text x="505" y="140" class="d158f-title" font-size="14" fill="#1e40af">3. Bag-of-Words</text>
  <text x="505" y="168" class="d158f-math" font-size="12">x = [1, 1, 1, 0, 1]</text>
  <text x="505" y="195" class="d158f-text" font-size="11">Vocab size V = 5,000</text>
  <text x="505" y="215" class="d158f-text" font-size="11">Sparse count tensor</text>
  <text x="505" y="235" class="d158f-text" font-size="11" fill="#64748b">Term frequencies</text>

  <path d="M 670 185 L 710 185" class="d158f-arrow" />

  <!-- Step 4: Classification Result -->
  <rect x="720" y="110" width="150" height="150" class="d158f-box" fill="#fef2f2" stroke="#ef4444" />
  <text x="735" y="140" class="d158f-title" font-size="14" fill="#991b1b">4. Prediction</text>
  <text x="735" y="170" class="d158f-text" font-size="12">P(Spam) = 99.4%</text>
  <text x="735" y="195" class="d158f-text" font-size="12">P(Ham) = 0.6%</text>
  <text x="735" y="230" class="d158f-math" font-size="16" fill="#991b1b">ŷ = SPAM</text>

  <!-- Explanatory footer -->
  <rect x="40" y="290" width="830" height="150" class="d158f-box" />
  <text x="60" y="320" class="d158f-title" font-size="15">Why Naive Bayes Excels at Text Classification</text>
  <text x="60" y="348" class="d158f-text">1. High Dimensionality: Vocabularies contain 10,000 to 100,000 unique word tokens.</text>
  <text x="60" y="373" class="d158f-text">2. Linear Time Complexity: Training requires a single O(N · d) pass to accumulate word counts per class.</text>
  <text x="60" y="398" class="d158f-text">3. Robustness: Individual word correlations (e.g. 'cash' + 'prize') provide strong multiplicative evidence even under mild dependency violations.</text>
</svg>
