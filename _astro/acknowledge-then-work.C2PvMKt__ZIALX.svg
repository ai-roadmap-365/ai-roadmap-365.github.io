<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Doing the work first causes the duplicates you then have to handle.">
  <title>Store, acknowledge, then process</title>
  <style>
    .acknowledge-then-work-bg   { fill: #f8fafc; }
    .acknowledge-then-work-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .acknowledge-then-work-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .acknowledge-then-work-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .acknowledge-then-work-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .acknowledge-then-work-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .acknowledge-then-work-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .acknowledge-then-work-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .acknowledge-then-work-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .acknowledge-then-work-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .acknowledge-then-work-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .acknowledge-then-work-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .acknowledge-then-work-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .acknowledge-then-work-row { opacity: 1; }
    .acknowledge-then-work-r0 { animation-delay: 0.00s; }
    .acknowledge-then-work-r1 { animation-delay: 0.45s; }
    .acknowledge-then-work-r2 { animation-delay: 0.90s; }
    .acknowledge-then-work-r3 { animation-delay: 1.35s; }
    .acknowledge-then-work-r4 { animation-delay: 1.80s; }
    .acknowledge-then-work-row { animation: acknowledge-then-work-reveal 7.3s ease-in-out infinite; }
    @keyframes acknowledge-then-work-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="acknowledge-then-work-bg" width="980" height="390"/>
  <text class="acknowledge-then-work-h1"  x="30" y="40">Store, acknowledge, then process</text>
  <text class="acknowledge-then-work-sub" x="30" y="64">Doing the work first causes the duplicates you then have to handle.</text>
  <rect class="acknowledge-then-work-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="acknowledge-then-work-name" x="46" y="122">Process, then reply</text>
  <text class="acknowledge-then-work-desc" x="46" y="142">The sender is waiting.</text>
  <text class="acknowledge-then-work-desc acknowledge-then-work-row acknowledge-then-work-r0" x="46" y="182">Slow work happens inline</text>
  <text class="acknowledge-then-work-desc acknowledge-then-work-row acknowledge-then-work-r1" x="46" y="216">The sender may time out waiting</text>
  <text class="acknowledge-then-work-desc acknowledge-then-work-row acknowledge-then-work-r2" x="46" y="250">A timeout reads as delivery failure</text>
  <text class="acknowledge-then-work-desc acknowledge-then-work-row acknowledge-then-work-r3" x="46" y="284">So it retries an event you completed</text>
  <text class="acknowledge-then-work-desc acknowledge-then-work-row acknowledge-then-work-r4" x="46" y="318">You caused the duplicate yourself</text>
  <rect class="acknowledge-then-work-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="acknowledge-then-work-name" x="526" y="122">Store, reply, then process</text>
  <text class="acknowledge-then-work-desc" x="526" y="142">The sender is released.</text>
  <text class="acknowledge-then-work-desc acknowledge-then-work-row acknowledge-then-work-r0" x="526" y="182">Write the event somewhere durable</text>
  <text class="acknowledge-then-work-desc acknowledge-then-work-row acknowledge-then-work-r1" x="526" y="216">Reply 200 in milliseconds</text>
  <text class="acknowledge-then-work-desc acknowledge-then-work-row acknowledge-then-work-r2" x="526" y="250">The sender stops retrying</text>
  <text class="acknowledge-then-work-desc acknowledge-then-work-row acknowledge-then-work-r3" x="526" y="284">Do the slow work in a background worker</text>
  <text class="acknowledge-then-work-desc acknowledge-then-work-row acknowledge-then-work-r4" x="526" y="318">A processing failure is now yours to retry</text>
  <text class="acknowledge-then-work-sub" x="30" y="372">The trade is deliberate: you take responsibility for retrying your own processing, in exchange for the sender not retrying the delivery. That is almost always the better half.</text>
</svg>
