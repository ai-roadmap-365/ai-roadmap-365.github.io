<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="State is what makes the loop more than repeated calls.">
  <title>What an agent carries between turns</title>
  <style>
    .agent-state-bg   { fill: #f8fafc; }
    .agent-state-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-state-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-state-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-state-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-state-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-state-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .agent-state-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .agent-state-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .agent-state-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .agent-state-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .agent-state-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .agent-state-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .agent-state-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .agent-state-stage { opacity: 1; }

    .agent-state-s0 { animation-delay: 0.00s; }
    .agent-state-e0 { animation-delay: 0.00s; }
    .agent-state-s1 { animation-delay: 1.28s; }
    .agent-state-e1 { animation-delay: 1.28s; }
    .agent-state-s2 { animation-delay: 2.56s; }
    .agent-state-e2 { animation-delay: 2.56s; }
    .agent-state-s3 { animation-delay: 3.84s; }
    .agent-state-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .agent-state-conn  { animation: agent-state-trace 6.4s ease-in-out infinite; }
      .agent-state-stage { animation: agent-state-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes agent-state-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes agent-state-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .agent-state-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .agent-state-stage { animation: agent-state-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes agent-state-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="agent-state-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="agent-state-bg" width="980" height="322"/>
  <text class="agent-state-h1"  x="30" y="40">What an agent carries between turns</text>
  <text class="agent-state-sub" x="30" y="64">State is what makes the loop more than repeated calls.</text>
  <g class="agent-state-stage agent-state-s0">
    <rect class="agent-state-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="agent-state-step" x="44" y="142">01</text>
    <text class="agent-state-name" x="70" y="142">The goal</text>
    <text class="agent-state-desc" x="44" y="166">Unchanged across turns. What the</text>
    <text class="agent-state-desc" x="44" y="182">loop is trying to achieve.</text>
  </g>
  <line class="agent-state-line agent-state-conn agent-state-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#agent-state-tip)"/>
  <g class="agent-state-stage agent-state-s1">
    <rect class="agent-state-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="agent-state-step" x="280" y="142">02</text>
    <text class="agent-state-name" x="306" y="142">Observations so far</text>
    <text class="agent-state-desc" x="280" y="166">Tool results, accumulated. This</text>
    <text class="agent-state-desc" x="280" y="182">is what grows the prompt each</text>
    <text class="agent-state-desc" x="280" y="198">turn.</text>
    <text class="agent-state-edge" x="280" y="242">grows</text>
  </g>
  <line class="agent-state-line agent-state-conn agent-state-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#agent-state-tip)"/>
  <g class="agent-state-stage agent-state-s2">
    <rect class="agent-state-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="agent-state-step" x="516" y="142">03</text>
    <text class="agent-state-name" x="542" y="142">Budget consumed</text>
    <text class="agent-state-desc" x="516" y="166">Turns used, tokens spent.</text>
    <text class="agent-state-desc" x="516" y="182">Checked against the cap every</text>
    <text class="agent-state-desc" x="516" y="198">iteration.</text>
    <text class="agent-state-edge" x="516" y="242">counted</text>
  </g>
  <line class="agent-state-line agent-state-conn agent-state-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#agent-state-tip)"/>
  <g class="agent-state-stage agent-state-s3">
    <rect class="agent-state-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="agent-state-step" x="752" y="142">04</text>
    <text class="agent-state-name" x="778" y="142">A checkpoint</text>
    <text class="agent-state-desc" x="752" y="166">Written durably, so a crash</text>
    <text class="agent-state-desc" x="752" y="182">resumes rather than restarts.</text>
    <text class="agent-state-edge" x="752" y="242">resumable</text>
  </g>
  <text class="agent-state-sub" x="30" y="304">The second item is the one that surprises: observations accumulate into the prompt, so a ten-turn agent's last call is far larger and more expensive than its first, and can exceed the context window.</text>
</svg>
