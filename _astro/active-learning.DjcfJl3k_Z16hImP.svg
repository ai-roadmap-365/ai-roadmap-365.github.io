<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Active learning</title>
  <style>
    .active-learning-bg   { fill: #f8fafc; }
    .active-learning-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .active-learning-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .active-learning-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .active-learning-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .active-learning-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .active-learning-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .active-learning-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .active-learning-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .active-learning-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .active-learning-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .active-learning-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .active-learning-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .active-learning-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .active-learning-stage { opacity: 1; }

    .active-learning-s0 { animation-delay: 0.00s; }
    .active-learning-e0 { animation-delay: 0.00s; }
    .active-learning-s1 { animation-delay: 1.28s; }
    .active-learning-e1 { animation-delay: 1.28s; }
    .active-learning-s2 { animation-delay: 2.56s; }
    .active-learning-e2 { animation-delay: 2.56s; }
    .active-learning-s3 { animation-delay: 3.84s; }
    .active-learning-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .active-learning-conn  { animation: active-learning-trace 6.4s ease-in-out infinite; }
      .active-learning-stage { animation: active-learning-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes active-learning-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes active-learning-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .active-learning-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .active-learning-stage { animation: active-learning-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes active-learning-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="active-learning-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="active-learning-bg" width="980" height="322"/>
  <text class="active-learning-h1"  x="30" y="40">Active learning</text>
  <text class="active-learning-sub" x="30" y="64">Four steps.</text>
  <g class="active-learning-stage active-learning-s0">
    <rect class="active-learning-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="active-learning-step" x="44" y="142">01</text>
    <text class="active-learning-name" x="70" y="142">Train a model on a small labelled set</text>
    <text class="active-learning-desc" x="44" y="166">However weak it is.</text>
  </g>
  <line class="active-learning-line active-learning-conn active-learning-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#active-learning-tip)"/>
  <g class="active-learning-stage active-learning-s1">
    <rect class="active-learning-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="active-learning-step" x="280" y="142">02</text>
    <text class="active-learning-name" x="306" y="142">Score the unlabelled pool by uncertainty</text>
    <text class="active-learning-desc" x="280" y="166">Near the decision boundary, or</text>
    <text class="active-learning-desc" x="280" y="182">with disagreeing ensemble</text>
    <text class="active-learning-desc" x="280" y="198">members.</text>
  </g>
  <line class="active-learning-line active-learning-conn active-learning-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#active-learning-tip)"/>
  <g class="active-learning-stage active-learning-s2">
    <rect class="active-learning-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="active-learning-step" x="516" y="142">03</text>
    <text class="active-learning-name" x="542" y="142">Label the most uncertain examples</text>
    <text class="active-learning-desc" x="516" y="166">Which carry the most</text>
    <text class="active-learning-desc" x="516" y="182">information.</text>
  </g>
  <line class="active-learning-line active-learning-conn active-learning-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#active-learning-tip)"/>
  <g class="active-learning-stage active-learning-s3">
    <rect class="active-learning-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="active-learning-step" x="752" y="142">04</text>
    <text class="active-learning-name" x="778" y="142">Retrain, and repeat</text>
    <text class="active-learning-desc" x="752" y="166">Reaching a target with far fewer</text>
    <text class="active-learning-desc" x="752" y="182">labels.</text>
    <text class="active-learning-edge" x="752" y="242">often 2-5x fewer</text>
  </g>
  <text class="active-learning-sub" x="30" y="304">Labelling the confidently-classified examples teaches the model almost nothing, which is why random sampling wastes a large share of any labelling budget.</text>
</svg>
