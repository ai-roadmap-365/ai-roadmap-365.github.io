<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two quantities decide how long.">
  <title>The convergence bound</title>
  <style>
    .convergence-bound-bg   { fill: #f8fafc; }
    .convergence-bound-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .convergence-bound-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .convergence-bound-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .convergence-bound-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .convergence-bound-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .convergence-bound-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .convergence-bound-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .convergence-bound-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .convergence-bound-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .convergence-bound-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .convergence-bound-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .convergence-bound-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .convergence-bound-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .convergence-bound-stage { opacity: 1; }

    .convergence-bound-s0 { animation-delay: 0.00s; }
    .convergence-bound-e0 { animation-delay: 0.00s; }
    .convergence-bound-s1 { animation-delay: 1.28s; }
    .convergence-bound-e1 { animation-delay: 1.28s; }
    .convergence-bound-s2 { animation-delay: 2.56s; }
    .convergence-bound-e2 { animation-delay: 2.56s; }
    .convergence-bound-s3 { animation-delay: 3.84s; }
    .convergence-bound-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .convergence-bound-conn  { animation: convergence-bound-trace 6.4s ease-in-out infinite; }
      .convergence-bound-stage { animation: convergence-bound-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes convergence-bound-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes convergence-bound-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .convergence-bound-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .convergence-bound-stage { animation: convergence-bound-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes convergence-bound-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="convergence-bound-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="convergence-bound-bg" width="980" height="322"/>
  <text class="convergence-bound-h1"  x="30" y="40">The convergence bound</text>
  <text class="convergence-bound-sub" x="30" y="64">Two quantities decide how long.</text>
  <g class="convergence-bound-stage convergence-bound-s0">
    <rect class="convergence-bound-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="convergence-bound-step" x="44" y="142">01</text>
    <text class="convergence-bound-name" x="70" y="142">Assume linear separability</text>
    <text class="convergence-bound-desc" x="44" y="166">Some hyperplane classifies every</text>
    <text class="convergence-bound-desc" x="44" y="182">point correctly.</text>
    <text class="convergence-bound-edge" x="44" y="242">the premise</text>
  </g>
  <line class="convergence-bound-line convergence-bound-conn convergence-bound-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#convergence-bound-tip)"/>
  <g class="convergence-bound-stage convergence-bound-s1">
    <rect class="convergence-bound-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="convergence-bound-step" x="280" y="142">02</text>
    <text class="convergence-bound-name" x="306" y="142">The margin</text>
    <text class="convergence-bound-desc" x="280" y="166">How far the closest point sits</text>
    <text class="convergence-bound-desc" x="280" y="182">from that hyperplane. Larger is</text>
    <text class="convergence-bound-desc" x="280" y="198">easier.</text>
  </g>
  <line class="convergence-bound-line convergence-bound-conn convergence-bound-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#convergence-bound-tip)"/>
  <g class="convergence-bound-stage convergence-bound-s2">
    <rect class="convergence-bound-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="convergence-bound-step" x="516" y="142">03</text>
    <text class="convergence-bound-name" x="542" y="142">The input radius</text>
    <text class="convergence-bound-desc" x="516" y="166">The largest input vector length.</text>
    <text class="convergence-bound-desc" x="516" y="182">Larger is harder.</text>
  </g>
  <line class="convergence-bound-line convergence-bound-conn convergence-bound-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#convergence-bound-tip)"/>
  <g class="convergence-bound-stage convergence-bound-s3">
    <rect class="convergence-bound-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="convergence-bound-step" x="752" y="142">04</text>
    <text class="convergence-bound-name" x="778" y="142">Updates bounded by radius over margin, squared</text>
    <text class="convergence-bound-desc" x="752" y="166">Finite, and independent of how</text>
    <text class="convergence-bound-desc" x="752" y="182">many samples there are.</text>
  </g>
  <text class="convergence-bound-sub" x="30" y="304">The bound not depending on the number of samples is the surprising part: a million points with a wide margin converge faster than a hundred points crammed against the boundary.</text>
</svg>
