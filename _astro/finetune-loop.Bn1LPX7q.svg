<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five steps, small data.">
  <title>Fine-tuning, end to end</title>
  <style>
    .finetune-loop-bg   { fill: #f8fafc; }
    .finetune-loop-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finetune-loop-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finetune-loop-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finetune-loop-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finetune-loop-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finetune-loop-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .finetune-loop-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .finetune-loop-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .finetune-loop-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .finetune-loop-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .finetune-loop-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .finetune-loop-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .finetune-loop-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .finetune-loop-stage { opacity: 1; }

    .finetune-loop-s0 { animation-delay: 0.00s; }
    .finetune-loop-e0 { animation-delay: 0.00s; }
    .finetune-loop-s1 { animation-delay: 1.33s; }
    .finetune-loop-e1 { animation-delay: 1.33s; }
    .finetune-loop-s2 { animation-delay: 2.67s; }
    .finetune-loop-e2 { animation-delay: 2.67s; }
    .finetune-loop-s3 { animation-delay: 4.00s; }
    .finetune-loop-e3 { animation-delay: 4.00s; }
    .finetune-loop-s4 { animation-delay: 5.33s; }
    .finetune-loop-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .finetune-loop-conn  { animation: finetune-loop-trace 8s ease-in-out infinite; }
      .finetune-loop-stage { animation: finetune-loop-arrive 8s ease-in-out infinite; }
    }
    @keyframes finetune-loop-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes finetune-loop-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .finetune-loop-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .finetune-loop-stage { animation: finetune-loop-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes finetune-loop-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="finetune-loop-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="finetune-loop-bg" width="980" height="322"/>
  <text class="finetune-loop-h1"  x="30" y="40">Fine-tuning, end to end</text>
  <text class="finetune-loop-sub" x="30" y="64">Five steps, small data.</text>
  <g class="finetune-loop-stage finetune-loop-s0">
    <rect class="finetune-loop-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="finetune-loop-step" x="44" y="142">01</text>
    <text class="finetune-loop-name" x="70" y="142">Start from pretrained weights</text>
    <text class="finetune-loop-desc" x="44" y="166">Language already</text>
    <text class="finetune-loop-desc" x="44" y="182">understood. Only the task</text>
    <text class="finetune-loop-desc" x="44" y="198">is missing.</text>
  </g>
  <line class="finetune-loop-line finetune-loop-conn finetune-loop-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#finetune-loop-tip)"/>
  <g class="finetune-loop-stage finetune-loop-s1">
    <rect class="finetune-loop-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="finetune-loop-step" x="233" y="142">02</text>
    <text class="finetune-loop-name" x="259" y="142">Attach a task head</text>
    <text class="finetune-loop-desc" x="233" y="166">A small randomly</text>
    <text class="finetune-loop-desc" x="233" y="182">initialised classifier on</text>
    <text class="finetune-loop-desc" x="233" y="198">top.</text>
  </g>
  <line class="finetune-loop-line finetune-loop-conn finetune-loop-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#finetune-loop-tip)"/>
  <g class="finetune-loop-stage finetune-loop-s2">
    <rect class="finetune-loop-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="finetune-loop-step" x="422" y="142">03</text>
    <text class="finetune-loop-name" x="448" y="142">Train with very small learning rates</text>
    <text class="finetune-loop-desc" x="422" y="166">A hundred times smaller</text>
    <text class="finetune-loop-desc" x="422" y="182">than training from</text>
    <text class="finetune-loop-desc" x="422" y="198">scratch.</text>
    <text class="finetune-loop-edge" x="422" y="242">2e-5</text>
  </g>
  <line class="finetune-loop-line finetune-loop-conn finetune-loop-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#finetune-loop-tip)"/>
  <g class="finetune-loop-stage finetune-loop-s3">
    <rect class="finetune-loop-warn" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="finetune-loop-step" x="611" y="142">04</text>
    <text class="finetune-loop-name" x="637" y="142">Stop early</text>
    <text class="finetune-loop-desc" x="611" y="166">Two or three passes. More</text>
    <text class="finetune-loop-desc" x="611" y="182">overfits a small set.</text>
  </g>
  <line class="finetune-loop-line finetune-loop-conn finetune-loop-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#finetune-loop-tip)"/>
  <g class="finetune-loop-stage finetune-loop-s4">
    <rect class="finetune-loop-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="finetune-loop-step" x="800" y="142">05</text>
    <text class="finetune-loop-name" x="826" y="142">Quantise and export</text>
    <text class="finetune-loop-desc" x="800" y="166">To something that serves</text>
    <text class="finetune-loop-desc" x="800" y="182">on a CPU in milliseconds.</text>
  </g>
  <text class="finetune-loop-sub" x="30" y="304">The learning-rate gap is the part most often got wrong: the same optimiser settings that train a model from scratch will destroy a pretrained one within a few hundred steps.</text>
</svg>
