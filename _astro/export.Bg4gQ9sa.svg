<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Runtime, or portability.">
  <title>Two export paths</title>
  <style>
    .export-bg   { fill: #f8fafc; }
    .export-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .export-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .export-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .export-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .export-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .export-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .export-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .export-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .export-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .export-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .export-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .export-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .export-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .export-stage { opacity: 1; }

    .export-s0 { animation-delay: 0.00s; }
    .export-e0 { animation-delay: 0.00s; }
    .export-s1 { animation-delay: 1.50s; }
    .export-e1 { animation-delay: 1.50s; }
    .export-s2 { animation-delay: 3.00s; }
    .export-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .export-conn  { animation: export-trace 6s ease-in-out infinite; }
      .export-stage { animation: export-arrive 6s ease-in-out infinite; }
    }
    @keyframes export-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes export-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .export-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .export-stage { animation: export-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes export-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="export-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="export-bg" width="980" height="322"/>
  <text class="export-h1"  x="30" y="40">Two export paths</text>
  <text class="export-sub" x="30" y="64">Runtime, or portability.</text>
  <g class="export-stage export-s0">
    <rect class="export-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="export-step" x="44" y="142">01</text>
    <text class="export-name" x="70" y="142">Trace to a framework runtime</text>
    <text class="export-desc" x="44" y="166">Runs without a Python interpreter. Same</text>
    <text class="export-desc" x="44" y="182">framework, no Python.</text>
  </g>
  <line class="export-line export-conn export-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#export-tip)"/>
  <g class="export-stage export-s1">
    <rect class="export-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="export-step" x="359" y="142">02</text>
    <text class="export-name" x="385" y="142">Export to an interchange format</text>
    <text class="export-desc" x="359" y="166">Runs on other inference engines and other</text>
    <text class="export-desc" x="359" y="182">hardware.</text>
    <text class="export-edge" x="359" y="242">portable</text>
  </g>
  <line class="export-line export-conn export-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#export-tip)"/>
  <g class="export-stage export-s2">
    <rect class="export-warn" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="export-step" x="674" y="142">03</text>
    <text class="export-name" x="700" y="142">Both constrain the model</text>
    <text class="export-desc" x="674" y="166">Data-dependent control flow may not survive</text>
    <text class="export-desc" x="674" y="182">tracing.</text>
  </g>
  <text class="export-sub" x="30" y="304">The constraint is worth knowing before the end of a project: a model with Python control flow that depends on tensor values may train perfectly and refuse to export at all.</text>
</svg>
