<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things a relationship plot is not</title>
  <style>
    .dist130-not-bg   { fill: #f8fafc; }
    .dist130-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dist130-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dist130-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dist130-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dist130-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dist130-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dist130-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dist130-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dist130-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dist130-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dist130-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dist130-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dist130-not-row { opacity: 1; }
    .dist130-not-r0 { animation-delay: 0.00s; }
    .dist130-not-r1 { animation-delay: 0.45s; }
    .dist130-not-r2 { animation-delay: 0.90s; }
    .dist130-not-r3 { animation-delay: 1.35s; }
    .dist130-not-r4 { animation-delay: 1.80s; }
    .dist130-not-row { animation: dist130-not-reveal 7.3s ease-in-out infinite; }
    @keyframes dist130-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="dist130-not-bg" width="980" height="390"/>
  <text class="dist130-not-h1"  x="30" y="40">Four things a relationship plot is not</text>
  <text class="dist130-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="dist130-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="dist130-not-name" x="46" y="122">The misconception</text>
  <text class="dist130-not-desc" x="46" y="142">Commonly held.</text>
  <text class="dist130-not-desc dist130-not-row dist130-not-r0" x="46" y="182">A correlation shows a relationship exists</text>
  <text class="dist130-not-desc dist130-not-row dist130-not-r1" x="46" y="216">Zero correlation means independence</text>
  <text class="dist130-not-desc dist130-not-row dist130-not-r2" x="46" y="250">A trend line proves the form</text>
  <text class="dist130-not-desc dist130-not-row dist130-not-r3" x="46" y="284">Aggregate patterns hold within groups</text>
  <text class="dist130-not-desc dist130-not-row dist130-not-r4" x="46" y="318">Dense scatter shows the density</text>
  <rect class="dist130-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="dist130-not-name" x="526" y="122">What is true</text>
  <text class="dist130-not-desc" x="526" y="142">Actually.</text>
  <text class="dist130-not-desc dist130-not-row dist130-not-r0" x="526" y="182">It shows a linear association only</text>
  <text class="dist130-not-desc dist130-not-row dist130-not-r1" x="526" y="216">A curved relationship can score zero</text>
  <text class="dist130-not-desc dist130-not-row dist130-not-r2" x="526" y="250">It is fitted, not discovered</text>
  <text class="dist130-not-desc dist130-not-row dist130-not-r3" x="526" y="284">They can reverse entirely</text>
  <text class="dist130-not-desc dist130-not-row dist130-not-r4" x="526" y="318">Overplotting hides most of the points</text>
  <text class="dist130-not-sub" x="30" y="372">A fitted line being an assumption rather than a finding is worth stating, since the line is drawn wherever you ask for it regardless of whether it fits.</text>
</svg>
