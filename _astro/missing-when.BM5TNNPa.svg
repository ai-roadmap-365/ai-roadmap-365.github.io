<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By mechanism and model.">
  <title>Which approach when</title>
  <style>
    .missing-when-bg   { fill: #f8fafc; }
    .missing-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .missing-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .missing-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .missing-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .missing-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .missing-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .missing-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .missing-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .missing-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .missing-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .missing-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .missing-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .missing-when-row { opacity: 1; }
    .missing-when-r0 { animation-delay: 0.00s; }
    .missing-when-r1 { animation-delay: 0.45s; }
    .missing-when-r2 { animation-delay: 0.90s; }
    .missing-when-r3 { animation-delay: 1.35s; }
    .missing-when-r4 { animation-delay: 1.80s; }
    .missing-when-row { animation: missing-when-reveal 7.3s ease-in-out infinite; }
    @keyframes missing-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="missing-when-bg" width="980" height="390"/>
  <text class="missing-when-h1"  x="30" y="40">Which approach when</text>
  <text class="missing-when-sub" x="30" y="64">By mechanism and model.</text>
  <rect class="missing-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="missing-when-name" x="46" y="122">The situation</text>
  <text class="missing-when-desc" x="46" y="142">What you have.</text>
  <text class="missing-when-desc missing-when-row missing-when-r0" x="46" y="182">Boosted trees, any missingness</text>
  <text class="missing-when-desc missing-when-row missing-when-r1" x="46" y="216">A linear model, missing at random</text>
  <text class="missing-when-desc missing-when-row missing-when-r2" x="46" y="250">Missingness clearly informative</text>
  <text class="missing-when-desc missing-when-row missing-when-r3" x="46" y="284">Very few incomplete rows, missing at random</text>
  <text class="missing-when-desc missing-when-row missing-when-r4" x="46" y="318">Missingness related to the missing value itself</text>
  <rect class="missing-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="missing-when-name" x="526" y="122">The approach</text>
  <text class="missing-when-desc" x="526" y="142">What to do.</text>
  <text class="missing-when-desc missing-when-row missing-when-r0" x="526" y="182">Native handling; impute nothing</text>
  <text class="missing-when-desc missing-when-row missing-when-r1" x="526" y="216">Iterative imputation inside the pipeline</text>
  <text class="missing-when-desc missing-when-row missing-when-r2" x="526" y="250">Indicator column, always, plus imputation</text>
  <text class="missing-when-desc missing-when-row missing-when-r3" x="526" y="284">Deletion is acceptable here</text>
  <text class="missing-when-desc missing-when-row missing-when-r4" x="526" y="318">Model it explicitly; imputation will be biased</text>
  <text class="missing-when-sub" x="30" y="372">The last row is the case where no technique rescues you: when the value's absence depends on the value itself, the only honest response is to model the mechanism.</text>
</svg>
