<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Closures</title>
  <style>
    .closures-bg   { fill: #f8fafc; }
    .closures-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .closures-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .closures-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .closures-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .closures-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .closures-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .closures-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .closures-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .closures-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .closures-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .closures-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .closures-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .closures-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .closures-stage { opacity: 1; }

    .closures-s0 { animation-delay: 0.00s; }
    .closures-e0 { animation-delay: 0.00s; }
    .closures-s1 { animation-delay: 1.28s; }
    .closures-e1 { animation-delay: 1.28s; }
    .closures-s2 { animation-delay: 2.56s; }
    .closures-e2 { animation-delay: 2.56s; }
    .closures-s3 { animation-delay: 3.84s; }
    .closures-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .closures-conn  { animation: closures-trace 6.4s ease-in-out infinite; }
      .closures-stage { animation: closures-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes closures-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes closures-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .closures-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .closures-stage { animation: closures-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes closures-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="closures-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="closures-bg" width="980" height="322"/>
  <text class="closures-h1"  x="30" y="40">Closures</text>
  <text class="closures-sub" x="30" y="64">Four steps.</text>
  <g class="closures-stage closures-s0">
    <rect class="closures-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="closures-step" x="44" y="142">01</text>
    <text class="closures-name" x="70" y="142">A function defined inside another can see its names</text>
    <text class="closures-desc" x="44" y="166">Even after the outer one</text>
    <text class="closures-desc" x="44" y="182">returns.</text>
  </g>
  <line class="closures-line closures-conn closures-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#closures-tip)"/>
  <g class="closures-stage closures-s1">
    <rect class="closures-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="closures-step" x="280" y="142">02</text>
    <text class="closures-name" x="306" y="142">The captured names survive with it</text>
    <text class="closures-desc" x="280" y="166">Which is what makes a closure.</text>
  </g>
  <line class="closures-line closures-conn closures-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#closures-tip)"/>
  <g class="closures-stage closures-s2">
    <rect class="closures-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="closures-step" x="516" y="142">03</text>
    <text class="closures-name" x="542" y="142">But it captures the variable, not its value</text>
    <text class="closures-desc" x="516" y="166">So later changes are visible.</text>
  </g>
  <line class="closures-line closures-conn closures-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#closures-tip)"/>
  <g class="closures-stage closures-s3">
    <rect class="closures-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="closures-step" x="752" y="142">04</text>
    <text class="closures-name" x="778" y="142">Which surprises people in loops, every time</text>
    <text class="closures-desc" x="752" y="166">All the closures see the final</text>
    <text class="closures-desc" x="752" y="182">value.</text>
  </g>
  <text class="closures-sub" x="30" y="304">Capturing the variable rather than the value is the trap: closures created in a loop all see the loop variable's last value, not the one at creation.</text>
</svg>
