<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Every layer, or none.">
  <title>Atomic multi-file synchronisation</title>
  <style>
    .atomic-layers-bg   { fill: #f8fafc; }
    .atomic-layers-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .atomic-layers-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .atomic-layers-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .atomic-layers-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .atomic-layers-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .atomic-layers-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .atomic-layers-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .atomic-layers-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .atomic-layers-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .atomic-layers-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .atomic-layers-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .atomic-layers-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .atomic-layers-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .atomic-layers-stage { opacity: 1; }

    .atomic-layers-s0 { animation-delay: 0.00s; }
    .atomic-layers-e0 { animation-delay: 0.00s; }
    .atomic-layers-s1 { animation-delay: 1.33s; }
    .atomic-layers-e1 { animation-delay: 1.33s; }
    .atomic-layers-s2 { animation-delay: 2.67s; }
    .atomic-layers-e2 { animation-delay: 2.67s; }
    .atomic-layers-s3 { animation-delay: 4.00s; }
    .atomic-layers-e3 { animation-delay: 4.00s; }
    .atomic-layers-s4 { animation-delay: 5.33s; }
    .atomic-layers-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .atomic-layers-conn  { animation: atomic-layers-trace 8s ease-in-out infinite; }
      .atomic-layers-stage { animation: atomic-layers-arrive 8s ease-in-out infinite; }
    }
    @keyframes atomic-layers-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes atomic-layers-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .atomic-layers-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .atomic-layers-stage { animation: atomic-layers-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes atomic-layers-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="atomic-layers-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="atomic-layers-bg" width="980" height="322"/>
  <text class="atomic-layers-h1"  x="30" y="40">Atomic multi-file synchronisation</text>
  <text class="atomic-layers-sub" x="30" y="64">Every layer, or none.</text>
  <g class="atomic-layers-stage atomic-layers-s0">
    <rect class="atomic-layers-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="atomic-layers-step" x="44" y="142">01</text>
    <text class="atomic-layers-name" x="70" y="142">The data model</text>
    <text class="atomic-layers-desc" x="44" y="166">What the database</text>
    <text class="atomic-layers-desc" x="44" y="182">actually stores.</text>
  </g>
  <line class="atomic-layers-line atomic-layers-conn atomic-layers-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#atomic-layers-tip)"/>
  <g class="atomic-layers-stage atomic-layers-s1">
    <rect class="atomic-layers-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="atomic-layers-step" x="233" y="142">02</text>
    <text class="atomic-layers-name" x="259" y="142">The serializer</text>
    <text class="atomic-layers-desc" x="233" y="166">What crosses the API</text>
    <text class="atomic-layers-desc" x="233" y="182">boundary.</text>
  </g>
  <line class="atomic-layers-line atomic-layers-conn atomic-layers-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#atomic-layers-tip)"/>
  <g class="atomic-layers-stage atomic-layers-s2">
    <rect class="atomic-layers-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="atomic-layers-step" x="422" y="142">03</text>
    <text class="atomic-layers-name" x="448" y="142">The route</text>
    <text class="atomic-layers-desc" x="422" y="166">The public surface, and</text>
    <text class="atomic-layers-desc" x="422" y="182">its contract.</text>
  </g>
  <line class="atomic-layers-line atomic-layers-conn atomic-layers-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#atomic-layers-tip)"/>
  <g class="atomic-layers-stage atomic-layers-s3">
    <rect class="atomic-layers-warn" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="atomic-layers-step" x="611" y="142">04</text>
    <text class="atomic-layers-name" x="637" y="142">The client types</text>
    <text class="atomic-layers-desc" x="611" y="166">Which break at run time,</text>
    <text class="atomic-layers-desc" x="611" y="182">not at build time.</text>
  </g>
  <line class="atomic-layers-line atomic-layers-conn atomic-layers-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#atomic-layers-tip)"/>
  <g class="atomic-layers-stage atomic-layers-s4">
    <rect class="atomic-layers-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="atomic-layers-step" x="800" y="142">05</text>
    <text class="atomic-layers-name" x="826" y="142">The tests</text>
    <text class="atomic-layers-desc" x="800" y="166">Which are what prove the</text>
    <text class="atomic-layers-desc" x="800" y="182">four agree.</text>
  </g>
  <text class="atomic-layers-sub" x="30" y="304">Updating four of five is the failure this pattern prevents, and the client types are usually the one missed: nothing in the backend build fails, and the break surfaces in production.</text>
</svg>
