<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-label="C2PA Content Provenance Verification Flow">
  <title>C2PA Content Provenance Verification Flow</title>
  <rect width="100%" height="100%" fill="#f8fafc" />
  
    <style>
      .d286a-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d286a-header { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .d286a-text { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .d286a-accent { fill: #1d4ed8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .d286a-arrow { stroke: #1d4ed8; stroke-width: 2; stroke-linecap: round; marker-end: url(#d286a-arrowhead); }
      .d286a-pulse { animation: d286a-glow 2.5s infinite ease-in-out; }
      @keyframes d286a-glow {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(29, 78, 216, 0.2)); }
        50% { filter: drop-shadow(0 0 6px rgba(29, 78, 216, 0.6)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .d286a-pulse { animation: none; }
      }
    </style>
    
  
    <defs>
      <marker id="d286a-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8" />
      </marker>
    </defs>
    
  
  <g transform="translate(40, 40)">
    <rect class="d286a-box" x="0" y="0" width="220" height="200" />
    <text class="d286a-header" x="15" y="30">1. Media Creation</text>
    <text class="d286a-text" x="15" y="60">• AI Model / Generator</text>
    <text class="d286a-text" x="15" y="85">• Author Identity / Timestamp</text>
    <text class="d286a-accent" x="15" y="140">Origin Assertion</text>

    <path class="d286a-arrow" d="M 220 100 L 280 100" />

    <rect class="d286a-box d286a-pulse" x="280" y="0" width="240" height="200" />
    <text class="d286a-header" x="15" y="30">2. C2PA Manifest Store</text>
    <text class="d286a-text" x="15" y="60">• Cryptographic SHA-256 Hash</text>
    <text class="d286a-text" x="15" y="85">• X.509 Certificate Signature</text>
    <text class="d286a-text" x="15" y="110">• SynthID Watermark Bits</text>
    <text class="d286a-accent" x="15" y="160">Tamper-Proof Provenance</text>

    <path class="d286a-arrow" d="M 520 100 L 580 100" />

    <rect class="d286a-box" x="580" y="0" width="200" height="200" />
    <text class="d286a-header" x="15" y="30">3. Public Verifier</text>
    <text class="d286a-text" x="15" y="60">• Validate Signature Chain</text>
    <text class="d286a-text" x="15" y="85">• Content Authenticity Icon</text>
    <text class="d286a-accent" x="15" y="140">Verified Synthetic Label</text>
  </g>

</svg>