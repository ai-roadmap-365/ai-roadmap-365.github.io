<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Before exposure, and on every authority change.">
  <title>When to run the review</title>
  <style>
    .when-to-review-bg   { fill: #f8fafc; }
    .when-to-review-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .when-to-review-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .when-to-review-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .when-to-review-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .when-to-review-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .when-to-review-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .when-to-review-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .when-to-review-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .when-to-review-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .when-to-review-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .when-to-review-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .when-to-review-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .when-to-review-row { opacity: 1; }
    .when-to-review-r0 { animation-delay: 0.00s; }
    .when-to-review-r1 { animation-delay: 0.45s; }
    .when-to-review-r2 { animation-delay: 0.90s; }
    .when-to-review-r3 { animation-delay: 1.35s; }
    .when-to-review-r4 { animation-delay: 1.80s; }
    .when-to-review-row { animation: when-to-review-reveal 7.3s ease-in-out infinite; }
    @keyframes when-to-review-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="when-to-review-bg" width="980" height="390"/>
  <text class="when-to-review-h1"  x="30" y="40">When to run the review</text>
  <text class="when-to-review-sub" x="30" y="64">Before exposure, and on every authority change.</text>
  <rect class="when-to-review-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="when-to-review-name" x="46" y="122">Run it</text>
  <text class="when-to-review-desc" x="46" y="142">Cheap now, expensive later.</text>
  <text class="when-to-review-desc when-to-review-row when-to-review-r0" x="46" y="182">Before anything is publicly reachable</text>
  <text class="when-to-review-desc when-to-review-row when-to-review-r1" x="46" y="216">When a tool is added</text>
  <text class="when-to-review-desc when-to-review-row when-to-review-r2" x="46" y="250">When a scope is widened</text>
  <text class="when-to-review-desc when-to-review-row when-to-review-r3" x="46" y="284">When a new data source is introduced</text>
  <text class="when-to-review-desc when-to-review-row when-to-review-r4" x="46" y="318">Against the design, before the code</text>
  <rect class="when-to-review-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="when-to-review-name" x="526" y="122">Lower value</text>
  <text class="when-to-review-desc" x="526" y="142">Nothing about authority changed.</text>
  <text class="when-to-review-desc when-to-review-row when-to-review-r0" x="526" y="182">A prompt wording change</text>
  <text class="when-to-review-desc when-to-review-row when-to-review-r1" x="526" y="216">A UI adjustment</text>
  <text class="when-to-review-desc when-to-review-row when-to-review-r2" x="526" y="250">A dependency patch bump — but pin it</text>
  <text class="when-to-review-desc when-to-review-row when-to-review-r3" x="526" y="284">Re-running with no posture change</text>
  <text class="when-to-review-desc when-to-review-row when-to-review-r4" x="526" y="318">The gate still costs nothing to run</text>
  <text class="when-to-review-sub" x="30" y="372">Those three authority changes on the left account for most of what a re-review actually finds, which makes them a usable trigger rather than a calendar reminder nobody honours.</text>
</svg>
