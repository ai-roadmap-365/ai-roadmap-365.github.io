<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Credit is hard to divide.">
  <title>Two witnesses who saw the same thing</title>
  <style>
    .witnesses-bg   { fill: #f8fafc; }
    .witnesses-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .witnesses-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .witnesses-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .witnesses-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .witnesses-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .witnesses-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .witnesses-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .witnesses-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .witnesses-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .witnesses-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .witnesses-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .witnesses-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .witnesses-row { opacity: 1; }
    .witnesses-r0 { animation-delay: 0.00s; }
    .witnesses-r1 { animation-delay: 0.45s; }
    .witnesses-r2 { animation-delay: 0.90s; }
    .witnesses-r3 { animation-delay: 1.35s; }
    .witnesses-r4 { animation-delay: 1.80s; }
    .witnesses-row { animation: witnesses-reveal 7.3s ease-in-out infinite; }
    @keyframes witnesses-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="witnesses-bg" width="980" height="390"/>
  <text class="witnesses-h1"  x="30" y="40">Two witnesses who saw the same thing</text>
  <text class="witnesses-sub" x="30" y="64">Credit is hard to divide.</text>
  <rect class="witnesses-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="witnesses-name" x="46" y="122">Independent accounts</text>
  <text class="witnesses-desc" x="46" y="142">Credit divides cleanly.</text>
  <text class="witnesses-desc witnesses-row witnesses-r0" x="46" y="182">Each saw something different</text>
  <text class="witnesses-desc witnesses-row witnesses-r1" x="46" y="216">Each contribution identifiable</text>
  <text class="witnesses-desc witnesses-row witnesses-r2" x="46" y="250">Removing one loses information</text>
  <text class="witnesses-desc witnesses-row witnesses-r3" x="46" y="284">Attribution is stable</text>
  <text class="witnesses-desc witnesses-row witnesses-r4" x="46" y="318">This is uncorrelated predictors</text>
  <rect class="witnesses-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="witnesses-name" x="526" y="122">Duplicated accounts</text>
  <text class="witnesses-desc" x="526" y="142">Credit is arbitrary.</text>
  <text class="witnesses-desc witnesses-row witnesses-r0" x="526" y="182">Both saw the same thing</text>
  <text class="witnesses-desc witnesses-row witnesses-r1" x="526" y="216">Contribution cannot be separated</text>
  <text class="witnesses-desc witnesses-row witnesses-r2" x="526" y="250">Removing one loses nothing</text>
  <text class="witnesses-desc witnesses-row witnesses-r3" x="526" y="284">Attribution swings between them</text>
  <text class="witnesses-desc witnesses-row witnesses-r4" x="526" y="318">This is collinear predictors</text>
  <text class="witnesses-sub" x="30" y="372">The combined testimony is just as reliable in both cases, which is precisely why prediction survives collinearity while attribution does not.</text>
</svg>
