<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Storage decides at scale.">
  <title>Full fine-tuning, or parameter-efficient</title>
  <style>
    .peft-vision-bg   { fill: #f8fafc; }
    .peft-vision-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .peft-vision-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .peft-vision-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .peft-vision-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .peft-vision-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .peft-vision-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .peft-vision-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .peft-vision-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .peft-vision-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .peft-vision-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .peft-vision-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .peft-vision-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .peft-vision-row { opacity: 1; }
    .peft-vision-r0 { animation-delay: 0.00s; }
    .peft-vision-r1 { animation-delay: 0.45s; }
    .peft-vision-r2 { animation-delay: 0.90s; }
    .peft-vision-r3 { animation-delay: 1.35s; }
    .peft-vision-r4 { animation-delay: 1.80s; }
    .peft-vision-row { animation: peft-vision-reveal 7.3s ease-in-out infinite; }
    @keyframes peft-vision-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="peft-vision-bg" width="980" height="390"/>
  <text class="peft-vision-h1"  x="30" y="40">Full fine-tuning, or parameter-efficient</text>
  <text class="peft-vision-sub" x="30" y="64">Storage decides at scale.</text>
  <rect class="peft-vision-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="peft-vision-name" x="46" y="122">Full fine-tuning</text>
  <text class="peft-vision-desc" x="46" y="142">A checkpoint per task.</text>
  <text class="peft-vision-desc peft-vision-row peft-vision-r0" x="46" y="182">Every parameter updated</text>
  <text class="peft-vision-desc peft-vision-row peft-vision-r1" x="46" y="216">A complete copy saved per downstream task</text>
  <text class="peft-vision-desc peft-vision-row peft-vision-r2" x="46" y="250">Hundreds of megabytes each</text>
  <text class="peft-vision-desc peft-vision-row peft-vision-r3" x="46" y="284">Dozens of tasks becomes prohibitive</text>
  <text class="peft-vision-desc peft-vision-row peft-vision-r4" x="46" y="318">Highest ceiling on accuracy</text>
  <rect class="peft-vision-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="peft-vision-name" x="526" y="122">Parameter-efficient</text>
  <text class="peft-vision-desc" x="526" y="142">Small adapters.</text>
  <text class="peft-vision-desc peft-vision-row peft-vision-r0" x="526" y="182">The backbone frozen</text>
  <text class="peft-vision-desc peft-vision-row peft-vision-r1" x="526" y="216">Small low-rank updates learned</text>
  <text class="peft-vision-desc peft-vision-row peft-vision-r2" x="526" y="250">Megabytes per task, not hundreds</text>
  <text class="peft-vision-desc peft-vision-row peft-vision-r3" x="526" y="284">One backbone serving many tasks</text>
  <text class="peft-vision-desc peft-vision-row peft-vision-r4" x="526" y="318">Close to full fine-tuning accuracy</text>
  <text class="peft-vision-sub" x="30" y="372">The storage argument becomes decisive when the same backbone serves many tasks: a shared frozen model with small per-task adapters is a completely different deployment shape.</text>
</svg>
