<svg role="img" aria-label="Observability telemetry dashboard layout displaying four monitoring pillars service latency prediction drift error rate and resource saturation" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Production ML Observability Dashboard</title>
  <defs>
    <linearGradient id="bg195b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="dashCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg195b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">PRODUCTION ML OBSERVABILITY: THE 4 PILLARS</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Real-Time Prometheus &amp; Grafana Telemetry Metrics</text>
  <g transform="translate(50, 85)">
    <rect width="750" height="295" fill="url(#dashCard)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Pillar 1: Operational SLA -->
    <rect x="30" y="30" width="330" height="110" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="45" y="55" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700">1. Operational Health (Latency &amp; QPS)</text>
    <text x="45" y="80" fill="#cbd5e1" font-family="system-ui" font-size="10">• p95 Latency: 8.2 ms | p99: 14.1 ms</text>
    <text x="45" y="100" fill="#cbd5e1" font-family="system-ui" font-size="10">• Throughput: 1,250 QPS (Steady)</text>
    <text x="45" y="120" fill="#34d399" font-family="system-ui" font-size="9">✓ SLA Compliant (&lt; 20ms)</text>
    <!-- Pillar 2: Feature & Data Drift -->
    <rect x="390" y="30" width="330" height="110" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" rx="6"/>
    <text x="405" y="55" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="700">2. Data &amp; Feature Drift (PSI &amp; KS-Test)</text>
    <text x="405" y="80" fill="#cbd5e1" font-family="system-ui" font-size="10">• Feature "monthly_spend" PSI: 0.04 (Normal)</text>
    <text x="405" y="100" fill="#cbd5e1" font-family="system-ui" font-size="10">• Feature "support_tickets" PSI: 0.23 (DRIFT!)</text>
    <text x="405" y="120" fill="#ef4444" font-family="system-ui" font-size="9">⚠️ PagerDuty Alert Triggered</text>
    <!-- Pillar 3: Prediction Drift -->
    <rect x="30" y="155" width="330" height="110" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="45" y="180" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700">3. Prediction &amp; Concept Drift</text>
    <text x="45" y="205" fill="#cbd5e1" font-family="system-ui" font-size="10">• Output Mean Probability: 0.28 -&gt; 0.44</text>
    <text x="45" y="225" fill="#cbd5e1" font-family="system-ui" font-size="10">• Positive Class Ratio: +16% deviation</text>
    <text x="45" y="245" fill="#cbd5e1" font-family="system-ui" font-size="9">• Ground Truth Feedback Lag: ~14 days</text>
    <!-- Pillar 4: Error Rate & Fallback -->
    <rect x="390" y="155" width="330" height="110" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" rx="6"/>
    <text x="405" y="180" fill="#f472b6" font-family="system-ui" font-size="11" font-weight="700">4. Service Errors &amp; Fallbacks</text>
    <text x="405" y="205" fill="#cbd5e1" font-family="system-ui" font-size="10">• HTTP 5xx Error Rate: 0.00%</text>
    <text x="405" y="225" fill="#cbd5e1" font-family="system-ui" font-size="10">• HTTP 422 Validation Rejections: 0.12%</text>
    <text x="405" y="245" fill="#34d399" font-family="system-ui" font-size="9">✓ Fallback Rate: 0 / 100,000 requests</text>
  </g>
</svg>
