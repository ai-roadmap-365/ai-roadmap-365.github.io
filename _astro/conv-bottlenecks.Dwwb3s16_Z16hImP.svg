<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="All from dense layers on images.">
  <title>Three bottlenecks convolution removes</title>
  <style>
    .conv-bottlenecks-bg   { fill: #f8fafc; }
    .conv-bottlenecks-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-bottlenecks-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-bottlenecks-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-bottlenecks-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-bottlenecks-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-bottlenecks-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .conv-bottlenecks-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .conv-bottlenecks-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .conv-bottlenecks-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .conv-bottlenecks-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .conv-bottlenecks-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .conv-bottlenecks-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .conv-bottlenecks-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .conv-bottlenecks-stage { opacity: 1; }

    .conv-bottlenecks-s0 { animation-delay: 0.00s; }
    .conv-bottlenecks-e0 { animation-delay: 0.00s; }
    .conv-bottlenecks-s1 { animation-delay: 1.50s; }
    .conv-bottlenecks-e1 { animation-delay: 1.50s; }
    .conv-bottlenecks-s2 { animation-delay: 3.00s; }
    .conv-bottlenecks-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .conv-bottlenecks-conn  { animation: conv-bottlenecks-trace 6s ease-in-out infinite; }
      .conv-bottlenecks-stage { animation: conv-bottlenecks-arrive 6s ease-in-out infinite; }
    }
    @keyframes conv-bottlenecks-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes conv-bottlenecks-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .conv-bottlenecks-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .conv-bottlenecks-stage { animation: conv-bottlenecks-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes conv-bottlenecks-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="conv-bottlenecks-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="conv-bottlenecks-bg" width="980" height="322"/>
  <text class="conv-bottlenecks-h1"  x="30" y="40">Three bottlenecks convolution removes</text>
  <text class="conv-bottlenecks-sub" x="30" y="64">All from dense layers on images.</text>
  <g class="conv-bottlenecks-stage conv-bottlenecks-s0">
    <rect class="conv-bottlenecks-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="conv-bottlenecks-step" x="44" y="142">01</text>
    <text class="conv-bottlenecks-name" x="70" y="142">Parameter explosion</text>
    <text class="conv-bottlenecks-desc" x="44" y="166">A dense first layer on a colour photograph</text>
    <text class="conv-bottlenecks-desc" x="44" y="182">needs tens of millions of weights.</text>
  </g>
  <line class="conv-bottlenecks-line conv-bottlenecks-conn conv-bottlenecks-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#conv-bottlenecks-tip)"/>
  <g class="conv-bottlenecks-stage conv-bottlenecks-s1">
    <rect class="conv-bottlenecks-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="conv-bottlenecks-step" x="359" y="142">02</text>
    <text class="conv-bottlenecks-name" x="385" y="142">Spatial structure discarded</text>
    <text class="conv-bottlenecks-desc" x="359" y="166">Flattening tells the network that vertically</text>
    <text class="conv-bottlenecks-desc" x="359" y="182">adjacent pixels are unrelated.</text>
  </g>
  <line class="conv-bottlenecks-line conv-bottlenecks-conn conv-bottlenecks-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#conv-bottlenecks-tip)"/>
  <g class="conv-bottlenecks-stage conv-bottlenecks-s2">
    <rect class="conv-bottlenecks-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="conv-bottlenecks-step" x="674" y="142">03</text>
    <text class="conv-bottlenecks-name" x="700" y="142">Position dependence</text>
    <text class="conv-bottlenecks-desc" x="674" y="166">A feature learned at one location must be</text>
    <text class="conv-bottlenecks-desc" x="674" y="182">relearned at every other.</text>
  </g>
  <text class="conv-bottlenecks-sub" x="30" y="304">The third is the most wasteful: without weight sharing, recognising an object in the corner of an image requires learning it separately from recognising it in the centre.</text>
</svg>
