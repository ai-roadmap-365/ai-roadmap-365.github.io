<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By budget and model.">
  <title>Which method when</title>
  <style>
    .selection-when-bg   { fill: #f8fafc; }
    .selection-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .selection-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .selection-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .selection-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .selection-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .selection-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .selection-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .selection-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .selection-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .selection-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .selection-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .selection-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .selection-when-row { opacity: 1; }
    .selection-when-r0 { animation-delay: 0.00s; }
    .selection-when-r1 { animation-delay: 0.45s; }
    .selection-when-r2 { animation-delay: 0.90s; }
    .selection-when-r3 { animation-delay: 1.35s; }
    .selection-when-r4 { animation-delay: 1.80s; }
    .selection-when-row { animation: selection-when-reveal 7.3s ease-in-out infinite; }
    @keyframes selection-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="selection-when-bg" width="980" height="390"/>
  <text class="selection-when-h1"  x="30" y="40">Which method when</text>
  <text class="selection-when-sub" x="30" y="64">By budget and model.</text>
  <rect class="selection-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="selection-when-name" x="46" y="122">The situation</text>
  <text class="selection-when-desc" x="46" y="142">What you have.</text>
  <text class="selection-when-desc selection-when-row selection-when-r0" x="46" y="182">Thousands of features, quick triage needed</text>
  <text class="selection-when-desc selection-when-row selection-when-r1" x="46" y="216">A linear model, moderate feature count</text>
  <text class="selection-when-desc selection-when-row selection-when-r2" x="46" y="250">A tree model, and time to spend</text>
  <text class="selection-when-desc selection-when-row selection-when-r3" x="46" y="284">Serving cost is the binding constraint</text>
  <text class="selection-when-desc selection-when-row selection-when-r4" x="46" y="318">Features must be justified individually</text>
  <rect class="selection-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="selection-when-name" x="526" y="122">The method</text>
  <text class="selection-when-desc" x="526" y="142">What to use.</text>
  <text class="selection-when-desc selection-when-row selection-when-r0" x="526" y="182">Filters first, to cut the obvious</text>
  <text class="selection-when-desc selection-when-row selection-when-r1" x="526" y="216">An absolute-value penalty, embedded</text>
  <text class="selection-when-desc selection-when-row selection-when-r2" x="526" y="250">Recursive elimination with the model itself</text>
  <text class="selection-when-desc selection-when-row selection-when-r3" x="526" y="284">Stability selection, then prune hard</text>
  <text class="selection-when-desc selection-when-row selection-when-r4" x="526" y="318">Stability, plus per-feature attribution</text>
  <text class="selection-when-sub" x="30" y="372">Filters as a first pass followed by an embedded method is the practical combination: cheap triage removes the obvious, and the model decides among what remains.</text>
</svg>
