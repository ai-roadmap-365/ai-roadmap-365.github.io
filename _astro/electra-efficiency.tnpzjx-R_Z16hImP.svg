<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Eighty-five percent of the work is wasted.">
  <title>Why masking is sample-inefficient</title>
  <style>
    .electra-efficiency-bg   { fill: #f8fafc; }
    .electra-efficiency-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .electra-efficiency-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .electra-efficiency-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .electra-efficiency-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .electra-efficiency-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .electra-efficiency-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .electra-efficiency-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .electra-efficiency-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .electra-efficiency-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .electra-efficiency-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .electra-efficiency-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .electra-efficiency-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .electra-efficiency-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .electra-efficiency-stage { opacity: 1; }

    .electra-efficiency-s0 { animation-delay: 0.00s; }
    .electra-efficiency-e0 { animation-delay: 0.00s; }
    .electra-efficiency-s1 { animation-delay: 1.28s; }
    .electra-efficiency-e1 { animation-delay: 1.28s; }
    .electra-efficiency-s2 { animation-delay: 2.56s; }
    .electra-efficiency-e2 { animation-delay: 2.56s; }
    .electra-efficiency-s3 { animation-delay: 3.84s; }
    .electra-efficiency-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .electra-efficiency-conn  { animation: electra-efficiency-trace 6.4s ease-in-out infinite; }
      .electra-efficiency-stage { animation: electra-efficiency-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes electra-efficiency-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes electra-efficiency-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .electra-efficiency-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .electra-efficiency-stage { animation: electra-efficiency-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes electra-efficiency-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="electra-efficiency-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="electra-efficiency-bg" width="980" height="322"/>
  <text class="electra-efficiency-h1"  x="30" y="40">Why masking is sample-inefficient</text>
  <text class="electra-efficiency-sub" x="30" y="64">Eighty-five percent of the work is wasted.</text>
  <g class="electra-efficiency-stage electra-efficiency-s0">
    <rect class="electra-efficiency-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="electra-efficiency-step" x="44" y="142">01</text>
    <text class="electra-efficiency-name" x="70" y="142">Only masked tokens produce a loss</text>
    <text class="electra-efficiency-desc" x="44" y="166">Fifteen percent of the sequence,</text>
    <text class="electra-efficiency-desc" x="44" y="182">per pass.</text>
  </g>
  <line class="electra-efficiency-line electra-efficiency-conn electra-efficiency-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#electra-efficiency-tip)"/>
  <g class="electra-efficiency-stage electra-efficiency-s1">
    <rect class="electra-efficiency-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="electra-efficiency-step" x="280" y="142">02</text>
    <text class="electra-efficiency-name" x="306" y="142">The other eighty-five contribute nothing</text>
    <text class="electra-efficiency-desc" x="280" y="166">Encoded, and never used for</text>
    <text class="electra-efficiency-desc" x="280" y="182">learning.</text>
  </g>
  <line class="electra-efficiency-line electra-efficiency-conn electra-efficiency-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#electra-efficiency-tip)"/>
  <g class="electra-efficiency-stage electra-efficiency-s2">
    <rect class="electra-efficiency-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="electra-efficiency-step" x="516" y="142">03</text>
    <text class="electra-efficiency-name" x="542" y="142">Instead: corrupt tokens and detect them</text>
    <text class="electra-efficiency-desc" x="516" y="166">A binary decision on every</text>
    <text class="electra-efficiency-desc" x="516" y="182">position.</text>
  </g>
  <line class="electra-efficiency-line electra-efficiency-conn electra-efficiency-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#electra-efficiency-tip)"/>
  <g class="electra-efficiency-stage electra-efficiency-s3">
    <rect class="electra-efficiency-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="electra-efficiency-step" x="752" y="142">04</text>
    <text class="electra-efficiency-name" x="778" y="142">So every token contributes</text>
    <text class="electra-efficiency-desc" x="752" y="166">Substantially better results per</text>
    <text class="electra-efficiency-desc" x="752" y="182">unit of compute.</text>
  </g>
  <text class="electra-efficiency-sub" x="30" y="304">This is a compute-efficiency argument rather than a capability one, and at scale those are the same thing: a method that learns more per pass reaches a given quality for less.</text>
</svg>
