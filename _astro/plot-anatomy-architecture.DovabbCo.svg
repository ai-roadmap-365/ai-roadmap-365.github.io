<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" width="1040" height="700" role="img" aria-labelledby="d112aTitleId d112aDescId">
  <title id="d112aTitleId">The anatomy of a contour plot: level bands, the colour ramp, a start point, a descent path, and the minimum</title>
  <desc id="d112aDescId">Five nested level bands shaded from dark red at the outside to dark blue at the centre, each labelled with its value range, a white descent path with five numbered markers running from a start point to the minimum near the centre, both axes labelled and ticked, and a horizontal colour-ramp legend beneath.</desc>

  <style>
    .d112a-bg     { fill: #f8fafc; }
    .d112a-title  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 600; fill: #1a202c; }
    .d112a-sub    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d112a-label  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1a202c; }
    .d112a-small  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #334155; }
    .d112a-mono   { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #1a202c; }
    .d112a-bandlabel { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #f8fafc; }
    .d112a-axis   { stroke: #1a202c; stroke-width: 1.5; }
    .d112a-tick   { stroke: #64748b; stroke-width: 1; }
    .d112a-path   { fill: none; stroke: #ffffff; stroke-width: 3; stroke-linejoin: round; }
    .d112a-marker { fill: #ffffff; stroke: #1a202c; stroke-width: 1.5; }
    .d112a-panel  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1; }
  </style>

  <rect class="d112a-bg" x="0" y="0" width="1040" height="700" />

  <text class="d112a-title" x="32" y="40">The anatomy of a contour plot</text>
  <text class="d112a-sub" x="32" y="62">Every picture in this lesson is built from one array of values, mapped to colour, with a path drawn on top.</text>

  <!-- axes -->
  <line class="d112a-axis" x1="120" y1="530" x2="640" y2="530" />
  <line class="d112a-axis" x1="120" y1="530" x2="120" y2="100" />
  <text class="d112a-label" x="380" y="562" text-anchor="middle">x</text>
  <text class="d112a-label" x="70" y="320" text-anchor="middle">y</text>
  <g class="d112a-small">
    <line class="d112a-tick" x1="140" y1="530" x2="140" y2="536" /><text x="140" y="550" text-anchor="middle">-4</text>
    <line class="d112a-tick" x1="380" y1="530" x2="380" y2="536" /><text x="380" y="550" text-anchor="middle">0</text>
    <line class="d112a-tick" x1="620" y1="530" x2="620" y2="536" /><text x="620" y="550" text-anchor="middle">4</text>
    <line class="d112a-tick" x1="114" y1="490" x2="120" y2="490" /><text x="104" y="495" text-anchor="end">-4</text>
    <line class="d112a-tick" x1="114" y1="310" x2="120" y2="310" /><text x="104" y="315" text-anchor="end">0</text>
    <line class="d112a-tick" x1="114" y1="130" x2="120" y2="130" /><text x="104" y="135" text-anchor="end">4</text>
  </g>

  <!-- nested level bands: outer (high value, far from minimum) to inner (low value, the minimum) -->
  <g transform="translate(380,310)">
    <rect x="-260" y="-200" width="520" height="400" rx="18" fill="#7f1d1d" />
    <rect x="-208" y="-160" width="416" height="320" rx="16" fill="#b91c1c" />
    <rect x="-156" y="-120" width="312" height="240" rx="14" fill="#1d4ed8" />
    <rect x="-104" y="-80"  width="208" height="160" rx="12" fill="#2563eb" />
    <rect x="-52"  y="-40"  width="104" height="80"  rx="10" fill="#0d1b54" />
  </g>

  <!-- band range labels, stacked directly above the centre so the diagonal path (which stays to the right) never crosses them -->
  <g class="d112a-bandlabel" text-anchor="middle">
    <text x="380" y="125">32+</text>
    <text x="380" y="163">18 to 32</text>
    <text x="380" y="201">8 to 18</text>
    <text x="380" y="239">2 to 8</text>
    <text x="380" y="277">0 to 2</text>
  </g>

  <!-- descent path: start near the outer edge, six numbered markers, ending at the minimum -->
  <path class="d112a-path" d="M 600 140 L 560 190 L 500 240 L 450 270 L 410 285 L 385 295" />
  <circle class="d112a-marker" cx="600" cy="140" r="7" />
  <text class="d112a-label" x="612" y="128">START (x0, y0)</text>

  <g class="d112a-mono">
    <text x="600" y="118" text-anchor="middle">1</text>
    <circle class="d112a-marker" cx="560" cy="190" r="6" /><text x="572" y="188">2</text>
    <circle class="d112a-marker" cx="500" cy="240" r="6" /><text x="512" y="238">3</text>
    <circle class="d112a-marker" cx="450" cy="270" r="6" /><text x="462" y="268">4</text>
    <circle class="d112a-marker" cx="410" cy="285" r="6" /><text x="410" y="308">5</text>
    <circle class="d112a-marker" cx="385" cy="295" r="6" /><text x="360" y="298" text-anchor="end">6</text>
  </g>

  <circle cx="380" cy="310" r="3" fill="#f8fafc" stroke="#1a202c" stroke-width="1.5" />
  <line x1="368" y1="310" x2="392" y2="310" stroke="#f8fafc" stroke-width="2" />
  <line x1="380" y1="298" x2="380" y2="322" stroke="#f8fafc" stroke-width="2" />
  <text class="d112a-label" x="380" y="358" text-anchor="middle" fill="#f8fafc">MINIMUM</text>

  <!-- side note -->
  <g>
    <rect class="d112a-panel" x="680" y="130" width="320" height="150" rx="8" />
    <text class="d112a-label" x="700" y="158">Three lines build this:</text>
    <text class="d112a-mono" x="700" y="188">Z = f(X, Y)</text>
    <text class="d112a-mono" x="700" y="208">  via numpy.meshgrid</text>
    <text class="d112a-mono" x="700" y="238">colour = ramp(rescale(Z))</text>
    <text class="d112a-mono" x="700" y="266">pixel = world_to_pixel(x, y)</text>
  </g>

  <!-- colour ramp legend -->
  <defs>
    <linearGradient id="d112a-rampGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1b54" />
      <stop offset="35%" stop-color="#1d4ed8" />
      <stop offset="65%" stop-color="#fac515" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
  </defs>
  <rect x="120" y="600" width="520" height="24" rx="4" fill="url(#d112a-rampGradient)" stroke="#94a3b8" />
  <text class="d112a-small" x="120" y="642">LOW VALUE (near the minimum)</text>
  <text class="d112a-small" x="640" y="642" text-anchor="end">HIGH VALUE (far from the minimum)</text>
  <text class="d112a-small" x="380" y="670" text-anchor="middle">Colour alone never carries information that is not also shown by a label, a tick, or a marker elsewhere in the picture.</text>
</svg>
