<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One checks grammar; the other checks meaning.">
  <title>Parsing and validating are two steps</title>
  <style>
    .valid-or-correct-bg   { fill: #f8fafc; }
    .valid-or-correct-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .valid-or-correct-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .valid-or-correct-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .valid-or-correct-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .valid-or-correct-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .valid-or-correct-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .valid-or-correct-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .valid-or-correct-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .valid-or-correct-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .valid-or-correct-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .valid-or-correct-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .valid-or-correct-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .valid-or-correct-row { opacity: 1; }
    .valid-or-correct-r0 { animation-delay: 0.00s; }
    .valid-or-correct-r1 { animation-delay: 0.45s; }
    .valid-or-correct-r2 { animation-delay: 0.90s; }
    .valid-or-correct-r3 { animation-delay: 1.35s; }
    .valid-or-correct-r4 { animation-delay: 1.80s; }
    .valid-or-correct-row { animation: valid-or-correct-reveal 7.3s ease-in-out infinite; }
    @keyframes valid-or-correct-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="valid-or-correct-bg" width="980" height="390"/>
  <text class="valid-or-correct-h1"  x="30" y="40">Parsing and validating are two steps</text>
  <text class="valid-or-correct-sub" x="30" y="64">One checks grammar; the other checks meaning.</text>
  <rect class="valid-or-correct-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="valid-or-correct-name" x="46" y="122">It parsed</text>
  <text class="valid-or-correct-desc" x="46" y="142">Well-formed JSON.</text>
  <text class="valid-or-correct-desc valid-or-correct-row valid-or-correct-r0" x="46" y="182">Braces and quotes are correct</text>
  <text class="valid-or-correct-desc valid-or-correct-row valid-or-correct-r1" x="46" y="216">It is one of the six JSON types</text>
  <text class="valid-or-correct-desc valid-or-correct-row valid-or-correct-r2" x="46" y="250">No exception was raised</text>
  <text class="valid-or-correct-desc valid-or-correct-row valid-or-correct-r3" x="46" y="284">And the fields may be missing</text>
  <text class="valid-or-correct-desc valid-or-correct-row valid-or-correct-r4" x="46" y="318">And confidence may be a string</text>
  <rect class="valid-or-correct-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="valid-or-correct-name" x="526" y="122">It validated</text>
  <text class="valid-or-correct-desc" x="526" y="142">The data you asked for.</text>
  <text class="valid-or-correct-desc valid-or-correct-row valid-or-correct-r0" x="526" y="182">Required fields are present</text>
  <text class="valid-or-correct-desc valid-or-correct-row valid-or-correct-r1" x="526" y="216">Each value has the right type</text>
  <text class="valid-or-correct-desc valid-or-correct-row valid-or-correct-r2" x="526" y="250">Numbers are in range</text>
  <text class="valid-or-correct-desc valid-or-correct-row valid-or-correct-r3" x="526" y="284">Errors name the field that failed</text>
  <text class="valid-or-correct-desc valid-or-correct-row valid-or-correct-r4" x="526" y="318">Only now is it safe to act on</text>
  <text class="valid-or-correct-sub" x="30" y="372">Acting on parsed-but-unvalidated output is how a confidently wrong field reaches a user interface. The parse tells you the model produced JSON; only the schema tells you it produced your JSON.</text>
</svg>
