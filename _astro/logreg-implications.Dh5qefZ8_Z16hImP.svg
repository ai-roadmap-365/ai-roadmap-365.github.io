<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Interpretability included.">
  <title>Four consequences of logistic regression</title>
  <style>
    .logreg-implications-bg   { fill: #f8fafc; }
    .logreg-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logreg-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logreg-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logreg-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logreg-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logreg-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .logreg-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .logreg-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .logreg-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .logreg-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .logreg-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .logreg-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .logreg-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .logreg-implications-stage { opacity: 1; }

    .logreg-implications-s0 { animation-delay: 0.00s; }
    .logreg-implications-e0 { animation-delay: 0.00s; }
    .logreg-implications-s1 { animation-delay: 1.28s; }
    .logreg-implications-e1 { animation-delay: 1.28s; }
    .logreg-implications-s2 { animation-delay: 2.56s; }
    .logreg-implications-e2 { animation-delay: 2.56s; }
    .logreg-implications-s3 { animation-delay: 3.84s; }
    .logreg-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .logreg-implications-conn  { animation: logreg-implications-trace 6.4s ease-in-out infinite; }
      .logreg-implications-stage { animation: logreg-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes logreg-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes logreg-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .logreg-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .logreg-implications-stage { animation: logreg-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes logreg-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="logreg-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="logreg-implications-bg" width="980" height="322"/>
  <text class="logreg-implications-h1"  x="30" y="40">Four consequences of logistic regression</text>
  <text class="logreg-implications-sub" x="30" y="64">Interpretability included.</text>
  <g class="logreg-implications-stage logreg-implications-s0">
    <rect class="logreg-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="logreg-implications-step" x="44" y="142">01</text>
    <text class="logreg-implications-name" x="70" y="142">Coefficients can be read and explained</text>
    <text class="logreg-implications-desc" x="44" y="166">Each one an odds ratio. Which</text>
    <text class="logreg-implications-desc" x="44" y="182">regulators accept.</text>
  </g>
  <line class="logreg-implications-line logreg-implications-conn logreg-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#logreg-implications-tip)"/>
  <g class="logreg-implications-stage logreg-implications-s1">
    <rect class="logreg-implications-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="logreg-implications-step" x="280" y="142">02</text>
    <text class="logreg-implications-name" x="306" y="142">Probabilities are well calibrated</text>
    <text class="logreg-implications-desc" x="280" y="166">Better than most complex models</text>
    <text class="logreg-implications-desc" x="280" y="182">without correction.</text>
  </g>
  <line class="logreg-implications-line logreg-implications-conn logreg-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#logreg-implications-tip)"/>
  <g class="logreg-implications-stage logreg-implications-s2">
    <rect class="logreg-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="logreg-implications-step" x="516" y="142">03</text>
    <text class="logreg-implications-name" x="542" y="142">Training and prediction are extremely cheap</text>
    <text class="logreg-implications-desc" x="516" y="166">Which makes it viable at any</text>
    <text class="logreg-implications-desc" x="516" y="182">scale.</text>
  </g>
  <line class="logreg-implications-line logreg-implications-conn logreg-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#logreg-implications-tip)"/>
  <g class="logreg-implications-stage logreg-implications-s3">
    <rect class="logreg-implications-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="logreg-implications-step" x="752" y="142">04</text>
    <text class="logreg-implications-name" x="778" y="142">But it encodes the bias in its features</text>
    <text class="logreg-implications-desc" x="752" y="166">Legibly, which is at least</text>
    <text class="logreg-implications-desc" x="752" y="182">easier to audit.</text>
  </g>
  <text class="logreg-implications-sub" x="30" y="304">Legible bias is a genuine advantage: a coefficient on a proxy variable is visible in a way that the same relationship inside a large model is not.</text>
</svg>
