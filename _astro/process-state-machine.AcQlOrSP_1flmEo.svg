<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img"
     aria-label="The states a process moves through, and what causes each transition">
  <title>The process lifecycle</title>
  <style>
    .d007s-bg   { fill: #f8fafc; }
    .d007s-h1   { fill: #1a202c; font-size: 21px; font-weight: 700;
                  font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .d007s-sub  { fill: #475569; font-size: 14px;
                  font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .d007s-name { fill: #1a202c; font-size: 16px; font-weight: 700;
                  font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .d007s-desc { fill: #475569; font-size: 12.5px;
                  font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .d007s-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600;
                  font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .d007s-node { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .d007s-run  { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.5; }
    .d007s-dead { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .d007s-line { stroke: #64748b; stroke-width: 2; fill: none; }

    /* Motion: the running state pulses to mark it as the only state that
       consumes a core. Colour only -- no movement -- so it is vestibular-safe,
       and the static frame already distinguishes it by border weight. */
    .d007s-run { }
    @media (prefers-reduced-motion: no-preference) {
      .d007s-run { animation: d007s-pulse 3s ease-in-out infinite; }
    }
    @keyframes d007s-pulse {
      0%, 100% { fill: #eff6ff; }
      50%      { fill: #dbeafe; }
    }
    @media (prefers-reduced-motion: reduce) {
      .d007s-run { animation: none; fill: #dbeafe; }
    }
  </style>

  <rect class="d007s-bg" width="960" height="430"/>
  <text class="d007s-h1"  x="30" y="36">Only one state burns a core</text>
  <text class="d007s-sub" x="30" y="60">Everything else is queueing or waiting — which is why one core serves hundreds of processes.</text>

  <marker id="d007s-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
  </marker>

  <!-- new -->
  <rect class="d007s-node" x="30" y="150" width="140" height="72" rx="9"/>
  <text class="d007s-name" x="46" y="182">new</text>
  <text class="d007s-desc" x="46" y="204">kernel builds it</text>

  <line class="d007s-line" x1="176" y1="186" x2="256" y2="186" marker-end="url(#d007s-tip)"/>

  <!-- ready -->
  <rect class="d007s-node" x="264" y="150" width="150" height="72" rx="9"/>
  <text class="d007s-name" x="280" y="182">ready</text>
  <text class="d007s-desc" x="280" y="204">wants a core, queued</text>

  <line class="d007s-line" x1="420" y1="172" x2="500" y2="172" marker-end="url(#d007s-tip)"/>
  <text class="d007s-edge" x="424" y="162">scheduler picks it</text>

  <!-- running -->
  <rect class="d007s-run" x="508" y="150" width="160" height="72" rx="9"/>
  <text class="d007s-name" x="524" y="182">running</text>
  <text class="d007s-desc" x="524" y="204">on a core, using CPU</text>

  <!-- preempted, back to ready -->
  <path class="d007s-line" d="M 588 226 L 588 268 L 339 268 L 339 226" marker-end="url(#d007s-tip)"/>
  <text class="d007s-edge" x="392" y="286">time slice expired — preempted</text>

  <!-- waiting -->
  <path class="d007s-line" d="M 588 146 L 588 108 L 760 108 L 760 146" marker-end="url(#d007s-tip)"/>
  <text class="d007s-edge" x="600" y="100">asks for something slow</text>
  <rect class="d007s-node" x="690" y="150" width="150" height="72" rx="9"/>
  <text class="d007s-name" x="706" y="182">waiting</text>
  <text class="d007s-desc" x="706" y="204">costs no CPU at all</text>

  <path class="d007s-line" d="M 765 226 L 765 310 L 339 310 L 339 226" marker-end="url(#d007s-tip)"/>
  <text class="d007s-edge" x="470" y="328">the event arrives — back to ready</text>

  <!-- exit and zombie -->
  <line class="d007s-line" x1="674" y1="186" x2="690" y2="186"/>
  <rect class="d007s-dead" x="690" y="356" width="250" height="56" rx="9"/>
  <text class="d007s-name" x="706" y="380">exited — then zombie</text>
  <text class="d007s-desc" x="706" y="400">dead, until the parent collects its exit code</text>
  <path class="d007s-line" d="M 668 200 L 860 200 L 860 352" marker-end="url(#d007s-tip)"/>
  <text class="d007s-edge" x="872" y="270">finishes</text>

  <text class="d007s-sub" x="30" y="392">A few zombies are normal and momentary.</text>
  <text class="d007s-sub" x="30" y="412">Zombies that accumulate mean a parent that never reaps — a bug you may meet in a data loader.</text>
</svg>
