<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each with a different fix.">
  <title>Three causes of confident errors</title>
  <style>
    .error-gallery-bg   { fill: #f8fafc; }
    .error-gallery-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .error-gallery-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .error-gallery-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .error-gallery-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .error-gallery-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .error-gallery-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .error-gallery-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .error-gallery-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .error-gallery-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .error-gallery-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .error-gallery-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .error-gallery-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .error-gallery-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .error-gallery-stage { opacity: 1; }

    .error-gallery-s0 { animation-delay: 0.00s; }
    .error-gallery-e0 { animation-delay: 0.00s; }
    .error-gallery-s1 { animation-delay: 1.50s; }
    .error-gallery-e1 { animation-delay: 1.50s; }
    .error-gallery-s2 { animation-delay: 3.00s; }
    .error-gallery-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .error-gallery-conn  { animation: error-gallery-trace 6s ease-in-out infinite; }
      .error-gallery-stage { animation: error-gallery-arrive 6s ease-in-out infinite; }
    }
    @keyframes error-gallery-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes error-gallery-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .error-gallery-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .error-gallery-stage { animation: error-gallery-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes error-gallery-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="error-gallery-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="error-gallery-bg" width="980" height="322"/>
  <text class="error-gallery-h1"  x="30" y="40">Three causes of confident errors</text>
  <text class="error-gallery-sub" x="30" y="64">Each with a different fix.</text>
  <g class="error-gallery-stage error-gallery-s0">
    <rect class="error-gallery-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="error-gallery-step" x="44" y="142">01</text>
    <text class="error-gallery-name" x="70" y="142">Label noise</text>
    <text class="error-gallery-desc" x="44" y="166">The image is class A and the dataset says B.</text>
    <text class="error-gallery-desc" x="44" y="182">Fix the label.</text>
    <text class="error-gallery-edge" x="44" y="242">data</text>
  </g>
  <line class="error-gallery-line error-gallery-conn error-gallery-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#error-gallery-tip)"/>
  <g class="error-gallery-stage error-gallery-s1">
    <rect class="error-gallery-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="error-gallery-step" x="359" y="142">02</text>
    <text class="error-gallery-name" x="385" y="142">Occlusion or glare</text>
    <text class="error-gallery-desc" x="359" y="166">The object is genuinely hard to see. Fix with</text>
    <text class="error-gallery-desc" x="359" y="182">augmentation.</text>
    <text class="error-gallery-edge" x="359" y="242">augmentation</text>
  </g>
  <line class="error-gallery-line error-gallery-conn error-gallery-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#error-gallery-tip)"/>
  <g class="error-gallery-stage error-gallery-s2">
    <rect class="error-gallery-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="error-gallery-step" x="674" y="142">03</text>
    <text class="error-gallery-name" x="700" y="142">Taxonomic ambiguity</text>
    <text class="error-gallery-desc" x="674" y="166">Two classes overlap subjectively. Fix the</text>
    <text class="error-gallery-desc" x="674" y="182">guidelines, or merge them.</text>
    <text class="error-gallery-edge" x="674" y="242">definition</text>
  </g>
  <text class="error-gallery-sub" x="30" y="304">The third finding is the most valuable and the least expected: a persistent confusion between two classes often means the class boundary was never clearly defined for the annotators.</text>
</svg>
