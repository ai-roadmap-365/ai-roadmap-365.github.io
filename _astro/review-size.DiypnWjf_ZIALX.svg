<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Beyond a few hundred lines, reviewers skim.">
  <title>Review quality falls off a cliff with size</title>
  <style>
    .review-size-bg   { fill: #f8fafc; }
    .review-size-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-size-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-size-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-size-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-size-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-size-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .review-size-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .review-size-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .review-size-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .review-size-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .review-size-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .review-size-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .review-size-row { opacity: 1; }
    .review-size-r0 { animation-delay: 0.00s; }
    .review-size-r1 { animation-delay: 0.45s; }
    .review-size-r2 { animation-delay: 0.90s; }
    .review-size-r3 { animation-delay: 1.35s; }
    .review-size-r4 { animation-delay: 1.80s; }
    .review-size-row { animation: review-size-reveal 7.3s ease-in-out infinite; }
    @keyframes review-size-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="review-size-bg" width="980" height="390"/>
  <text class="review-size-h1"  x="30" y="40">Review quality falls off a cliff with size</text>
  <text class="review-size-sub" x="30" y="64">Beyond a few hundred lines, reviewers skim.</text>
  <rect class="review-size-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="review-size-name" x="46" y="122">Under ~200 lines</text>
  <text class="review-size-desc" x="46" y="142">Actually reviewed.</text>
  <text class="review-size-desc review-size-row review-size-r0" x="46" y="182">Read line by line</text>
  <text class="review-size-desc review-size-row review-size-r1" x="46" y="216">Specific, useful comments</text>
  <text class="review-size-desc review-size-row review-size-r2" x="46" y="250">Reviewer can hold it all in mind</text>
  <text class="review-size-desc review-size-row review-size-r3" x="46" y="284">Fast to review, fast to fix</text>
  <text class="review-size-desc review-size-row review-size-r4" x="46" y="318">Easy to revert as one unit</text>
  <rect class="review-size-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="review-size-name" x="526" y="122">Over ~1,000 lines</text>
  <text class="review-size-desc" x="526" y="142">Rubber-stamped.</text>
  <text class="review-size-desc review-size-row review-size-r0" x="526" y="182">Skimmed, whatever the intention</text>
  <text class="review-size-desc review-size-row review-size-r1" x="526" y="216">"Looks good to me"</text>
  <text class="review-size-desc review-size-row review-size-r2" x="526" y="250">Too much to hold in mind at once</text>
  <text class="review-size-desc review-size-row review-size-r3" x="526" y="284">More reviewers does not help</text>
  <text class="review-size-desc review-size-row review-size-r4" x="526" y="318">More time does not help either</text>
  <text class="review-size-sub" x="30" y="372">The only intervention that reliably restores review depth is making the unit smaller. This is why splitting work into several pull requests is a technique, not a courtesy.</text>
</svg>
