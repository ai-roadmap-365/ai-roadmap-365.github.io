<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="d088f-title d088f-desc">
  <title id="d088f-title">One transaction, from BEGIN to either COMMIT or ROLLBACK</title>
  <desc id="d088f-desc">A transaction begins, the rollback journal copies the original pages, three statements change loan rows from returned=0 to returned=1 and adjust a copy count, and then the path branches. COMMIT discards the journal and makes the new values durable. ROLLBACK copies the original pages back, leaving the file byte for byte as it was. Every value and label is shown whether or not the picture is moving.</desc>

  <style>
    .d088f-bg     { fill: #f8fafc; }
    .d088f-title  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 19px; font-weight: 600; fill: #1a202c; }
    .d088f-h      { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 600; fill: #1a202c; }
    .d088f-label  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #1a202c; }
    .d088f-small  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d088f-mono   { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 14px; fill: #1a202c; }
    .d088f-box    { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d088f-journal{ fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; }
    .d088f-commit { fill: #d1fae5; stroke: #047857; stroke-width: 2; }
    .d088f-rollbk { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 2; }

    /* Stages light up in the order the transaction runs. Resting fill is readable. */
    .d088f-stage  { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5;
                    animation: d088f-lift 8s ease-in-out infinite; }
    .d088f-s1 { animation-delay: 0s; }
    .d088f-s2 { animation-delay: 1.2s; }
    .d088f-s3 { animation-delay: 2.4s; }
    @keyframes d088f-lift {
      0%, 16%, 100% { fill: #e0e7ff; }
      4%, 12%       { fill: #bfdbfe; }
    }

    /* The wire down the middle of the transaction flows while it is open. */
    .d088f-wire   { fill: none; stroke: #1d4ed8; stroke-width: 2.5;
                    stroke-dasharray: 10 8; animation: d088f-march 1.8s linear infinite; }
    @keyframes d088f-march { to { stroke-dashoffset: -18; } }

    /* The journal fills as the original pages are copied aside. */
    .d088f-fill   { animation: d088f-store 8s ease-in-out infinite; }
    @keyframes d088f-store {
      0%, 6%    { opacity: 0.9; }
      14%, 62%  { opacity: 1; }
      70%, 100% { opacity: 0.9; }
    }

    /* The two outcomes take turns being emphasised, so neither is "the" answer. */
    .d088f-out-commit { animation: d088f-pick-a 8s ease-in-out infinite; }
    @keyframes d088f-pick-a {
      0%, 60%   { opacity: 0.9; }
      68%, 78%  { opacity: 1; }
      86%, 100% { opacity: 0.9; }
    }
    .d088f-out-rollback { animation: d088f-pick-b 8s ease-in-out infinite; }
    @keyframes d088f-pick-b {
      0%, 78%   { opacity: 0.9; }
      86%, 96%  { opacity: 1; }
      100%      { opacity: 0.9; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d088f-stage        { animation: none; fill: #e0e7ff; }
      .d088f-wire         { animation: none; stroke-dasharray: none; }
      .d088f-fill         { animation: none; opacity: 1; }
      .d088f-out-commit   { animation: none; opacity: 1; }
      .d088f-out-rollback { animation: none; opacity: 1; }
    }
  </style>

  <defs>
    <marker id="d088f-tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
    <marker id="d088f-tip-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857" />
    </marker>
    <marker id="d088f-tip-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309" />
    </marker>
  </defs>

  <rect class="d088f-bg" x="0" y="0" width="1000" height="640" />

  <text class="d088f-title" x="28" y="36">One transaction: the original pages are kept aside until you decide</text>
  <text class="d088f-small" x="28" y="60">Loan 2 comes back and a copy is added. Three statements, one decision at the end.</text>

  <!-- BEGIN -->
  <rect class="d088f-box" x="28" y="86" width="150" height="52" rx="8" />
  <text class="d088f-h" x="103" y="118" text-anchor="middle">BEGIN</text>

  <path class="d088f-wire" d="M 178 112 L 236 112" marker-end="url(#d088f-tip)" />

  <!-- journal capture -->
  <g class="d088f-fill">
    <rect class="d088f-journal" x="240" y="80" width="300" height="64" rx="8" />
    <text class="d088f-h" x="256" y="104">rollback journal</text>
    <text class="d088f-small" x="256" y="128">the ORIGINAL pages are copied aside first</text>
  </g>

  <text class="d088f-small" x="560" y="106">This copy is the whole trick.</text>
  <text class="d088f-small" x="560" y="128">Undo is just putting these pages back.</text>

  <path class="d088f-wire" d="M 103 138 L 103 176" marker-end="url(#d088f-tip)" />

  <!-- the three statements -->
  <text class="d088f-h" x="28" y="196">the statements, in order</text>

  <rect class="d088f-stage d088f-s1" x="28" y="208" width="440" height="56" rx="8" />
  <text class="d088f-mono" x="44" y="230">UPDATE loans SET returned = 1 WHERE id = 2;</text>
  <text class="d088f-small" x="44" y="252">loan 2: returned 0 &#8594; 1</text>

  <rect class="d088f-stage d088f-s2" x="28" y="274" width="440" height="56" rx="8" />
  <text class="d088f-mono" x="44" y="296">UPDATE books SET copies = copies + 1 WHERE id = 3;</text>
  <text class="d088f-small" x="44" y="318">book 3: copies 4 &#8594; 5</text>

  <rect class="d088f-stage d088f-s3" x="28" y="340" width="440" height="56" rx="8" />
  <text class="d088f-mono" x="44" y="362">SELECT count(*) FROM loans WHERE returned = 0;</text>
  <text class="d088f-small" x="44" y="384">answers 7, not 8 &#8212; your own connection sees the change</text>

  <!-- what is on disk vs what you see -->
  <rect class="d088f-box" x="504" y="208" width="468" height="188" rx="8" />
  <text class="d088f-h" x="522" y="234">while the transaction is open</text>
  <text class="d088f-label" x="522" y="262">you see:</text>
  <text class="d088f-mono" x="600" y="262">loan 2 returned = 1, outstanding = 7</text>
  <text class="d088f-label" x="522" y="288">the file holds:</text>
  <text class="d088f-mono" x="620" y="288">both versions at once</text>
  <text class="d088f-small" x="522" y="316">The new pages are in the database file; the original</text>
  <text class="d088f-small" x="522" y="336">pages are in the journal beside it. Nothing is decided.</text>
  <text class="d088f-small" x="522" y="366">An error here undoes only the failing STATEMENT.</text>
  <text class="d088f-small" x="522" y="386">The transaction stays open, waiting for you.</text>

  <path class="d088f-wire" d="M 248 396 L 248 434" marker-end="url(#d088f-tip)" />
  <text class="d088f-h" x="268" y="424">then exactly one of these</text>

  <!-- COMMIT branch -->
  <g class="d088f-out-commit">
    <rect class="d088f-commit" x="28" y="440" width="452" height="156" rx="10" />
    <text class="d088f-h" x="48" y="468">COMMIT</text>
    <text class="d088f-small" x="48" y="492">the journal is deleted &#8212; there is nothing left to undo with</text>
    <text class="d088f-mono" x="48" y="520">loan 2 returned = 1</text>
    <text class="d088f-mono" x="48" y="542">book 3 copies   = 5</text>
    <text class="d088f-mono" x="48" y="564">outstanding     = 7</text>
    <text class="d088f-small" x="48" y="586">durable: survives a crash, a power cut, and your regret</text>
  </g>
  <path d="M 254 596 L 254 616" stroke="#047857" stroke-width="2.5" fill="none" marker-end="url(#d088f-tip-green)" />

  <!-- ROLLBACK branch -->
  <g class="d088f-out-rollback">
    <rect class="d088f-rollbk" x="520" y="440" width="452" height="156" rx="10" />
    <text class="d088f-h" x="540" y="468">ROLLBACK</text>
    <text class="d088f-small" x="540" y="492">the original pages are copied back over the new ones</text>
    <text class="d088f-mono" x="540" y="520">loan 2 returned = 0</text>
    <text class="d088f-mono" x="540" y="542">book 3 copies   = 4</text>
    <text class="d088f-mono" x="540" y="564">outstanding     = 8</text>
    <text class="d088f-small" x="540" y="586">the file is byte for byte what it was before BEGIN</text>
  </g>
  <path d="M 746 596 L 746 616" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#d088f-tip)" />

  <text class="d088f-small" x="28" y="632">Resting state shows both outcomes and every value. The animation only marks the order: journal first, statements next, decision last.</text>
</svg>
