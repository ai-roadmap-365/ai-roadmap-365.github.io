<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="d141a-title d141a-desc" width="980" height="620">
  <title id="d141a-title">The three ingredients of machine learning feeding a search over a family of functions, with the boundary of the training distribution drawn as a visible region</title>
  <desc id="d141a-desc">Left column: data, a model class and an objective. Centre: a search that returns one trained function. Right: a feature-space panel in which the training distribution is a shaded region; points inside it are covered by evidence and points outside it are not.</desc>
  <style>
    .d141a-bg { fill: #f8fafc; }
    .d141a-card { fill: #ffffff; stroke: #1d4ed8; stroke-width: 2; }
    .d141a-card-soft { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d141a-panel { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d141a-region { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; stroke-dasharray: 7 5; }
    .d141a-h { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 22px; font-weight: 700; fill: #1a202c; }
    .d141a-t { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; fill: #1a202c; }
    .d141a-s { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #475569; }
    .d141a-lab { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; fill: #1d4ed8; }
    .d141a-warn { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; fill: #b45309; }
    .d141a-wire { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .d141a-in { fill: #1d4ed8; }
    .d141a-out { fill: #f59e0b; stroke: #b45309; stroke-width: 1.2; }
  </style>
  <rect class="d141a-bg" x="0" y="0" width="980" height="620" />

  <text class="d141a-h" x="34" y="42">Machine learning: three ingredients, one search, one region where the answer means anything</text>

  <text class="d141a-lab" x="34" y="82">1. What you supply</text>
  <rect class="d141a-card" x="34" y="96" width="250" height="86" rx="10" />
  <text class="d141a-t" x="50" y="124">Data</text>
  <text class="d141a-s" x="50" y="146">Examples of the function's</text>
  <text class="d141a-s" x="50" y="166">output: pairs of input and label</text>

  <rect class="d141a-card" x="34" y="200" width="250" height="86" rx="10" />
  <text class="d141a-t" x="50" y="228">Model class</text>
  <text class="d141a-s" x="50" y="250">The family of functions you</text>
  <text class="d141a-s" x="50" y="270">are willing to search through</text>

  <rect class="d141a-card" x="34" y="304" width="250" height="86" rx="10" />
  <text class="d141a-t" x="50" y="332">Objective</text>
  <text class="d141a-s" x="50" y="354">A score that ranks one</text>
  <text class="d141a-s" x="50" y="374">candidate function above another</text>

  <path class="d141a-wire" d="M 284 139 L 330 139 L 330 243 L 356 243" marker-end="url(#d141a-arrow)" />
  <path class="d141a-wire" d="M 284 243 L 356 243" marker-end="url(#d141a-arrow)" />
  <path class="d141a-wire" d="M 284 347 L 330 347 L 330 243 L 356 243" marker-end="url(#d141a-arrow)" />

  <rect class="d141a-card-soft" x="356" y="180" width="180" height="126" rx="10" />
  <text class="d141a-t" x="376" y="212">Search</text>
  <text class="d141a-s" x="376" y="236">Find the member of</text>
  <text class="d141a-s" x="376" y="256">the family that scores</text>
  <text class="d141a-s" x="376" y="276">best on the examples</text>
  <text class="d141a-s" x="376" y="296">Nothing else is needed</text>

  <path class="d141a-wire" d="M 536 243 L 596 243" marker-end="url(#d141a-arrow)" />

  <rect class="d141a-card" x="596" y="196" width="230" height="94" rx="10" />
  <text class="d141a-t" x="614" y="226">One trained function</text>
  <text class="d141a-s" x="614" y="248">It maps any input to an output.</text>
  <text class="d141a-s" x="614" y="268">It has no idea why, and it will</text>
  <text class="d141a-s" x="614" y="286">answer wherever you point it.</text>

  <text class="d141a-lab" x="34" y="440">2. Where the answer is evidence, and where it is only an output</text>

  <rect class="d141a-panel" x="34" y="456" width="912" height="140" rx="12" />
  <text class="d141a-s" x="52" y="480">Feature space: every input the trained function can be asked about</text>

  <ellipse class="d141a-region" cx="290" cy="536" rx="230" ry="48" />
  <text class="d141a-lab" x="176" y="524">Training distribution</text>
  <text class="d141a-s" x="140" y="546">inside: the examples came from here</text>
  <text class="d141a-s" x="152" y="566">and the score was measured here</text>

  <circle class="d141a-in" cx="112" cy="512" r="5" />
  <circle class="d141a-in" cx="146" cy="562" r="5" />
  <circle class="d141a-in" cx="238" cy="516" r="5" />
  <circle class="d141a-in" cx="332" cy="560" r="5" />
  <circle class="d141a-in" cx="400" cy="520" r="5" />
  <circle class="d141a-in" cx="462" cy="548" r="5" />

  <text class="d141a-warn" x="596" y="508">Outside the training distribution</text>
  <text class="d141a-s" x="596" y="530">The function still returns a confident answer here.</text>
  <text class="d141a-s" x="596" y="550">No example was ever drawn from this region, so no</text>
  <text class="d141a-s" x="596" y="570">measurement made inside the region says anything about it.</text>

  <circle class="d141a-out" cx="560" cy="486" r="6" />
  <circle class="d141a-out" cx="712" cy="586" r="6" />
  <circle class="d141a-out" cx="884" cy="492" r="6" />
  <circle class="d141a-out" cx="822" cy="580" r="6" />

  <defs>
    <marker id="d141a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
  </defs>
</svg>
