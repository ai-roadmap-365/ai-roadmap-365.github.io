<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The format should change as the data grows.">
  <title>JSON is the right default and the wrong endpoint</title>
  <style>
    .format-by-size-bg   { fill: #f8fafc; }
    .format-by-size-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .format-by-size-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .format-by-size-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .format-by-size-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .format-by-size-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .format-by-size-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .format-by-size-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .format-by-size-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .format-by-size-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .format-by-size-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .format-by-size-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .format-by-size-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .format-by-size-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .format-by-size-stage { opacity: 1; }

    .format-by-size-s0 { animation-delay: 0.00s; }
    .format-by-size-e0 { animation-delay: 0.00s; }
    .format-by-size-s1 { animation-delay: 1.28s; }
    .format-by-size-e1 { animation-delay: 1.28s; }
    .format-by-size-s2 { animation-delay: 2.56s; }
    .format-by-size-e2 { animation-delay: 2.56s; }
    .format-by-size-s3 { animation-delay: 3.84s; }
    .format-by-size-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .format-by-size-conn  { animation: format-by-size-trace 6.4s ease-in-out infinite; }
      .format-by-size-stage { animation: format-by-size-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes format-by-size-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes format-by-size-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .format-by-size-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .format-by-size-stage { animation: format-by-size-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes format-by-size-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="format-by-size-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="format-by-size-bg" width="980" height="322"/>
  <text class="format-by-size-h1"  x="30" y="40">JSON is the right default and the wrong endpoint</text>
  <text class="format-by-size-sub" x="30" y="64">The format should change as the data grows.</text>
  <g class="format-by-size-stage format-by-size-s0">
    <rect class="format-by-size-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="format-by-size-step" x="44" y="142">01</text>
    <text class="format-by-size-name" x="70" y="142">An API response</text>
    <text class="format-by-size-desc" x="44" y="166">JSON. Readable, universal, and</text>
    <text class="format-by-size-desc" x="44" y="182">small enough that verbosity</text>
    <text class="format-by-size-desc" x="44" y="198">costs nothing.</text>
    <text class="format-by-size-edge" x="44" y="242">JSON</text>
  </g>
  <line class="format-by-size-line format-by-size-conn format-by-size-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#format-by-size-tip)"/>
  <g class="format-by-size-stage format-by-size-s1">
    <rect class="format-by-size-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="format-by-size-step" x="280" y="142">02</text>
    <text class="format-by-size-name" x="306" y="142">A dataset</text>
    <text class="format-by-size-desc" x="280" y="166">JSONL. Streamable, appendable,</text>
    <text class="format-by-size-desc" x="280" y="182">and survives a bad record.</text>
    <text class="format-by-size-edge" x="280" y="242">JSONL</text>
  </g>
  <line class="format-by-size-line format-by-size-conn format-by-size-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#format-by-size-tip)"/>
  <g class="format-by-size-stage format-by-size-s2">
    <rect class="format-by-size-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="format-by-size-step" x="516" y="142">03</text>
    <text class="format-by-size-name" x="542" y="142">A million uniform rows</text>
    <text class="format-by-size-desc" x="516" y="166">Parquet. Columnar and</text>
    <text class="format-by-size-desc" x="516" y="182">compressed; often an order of</text>
    <text class="format-by-size-desc" x="516" y="198">magnitude smaller.</text>
    <text class="format-by-size-edge" x="516" y="242">Parquet</text>
  </g>
  <line class="format-by-size-line format-by-size-conn format-by-size-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#format-by-size-tip)"/>
  <g class="format-by-size-stage format-by-size-s3">
    <rect class="format-by-size-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="format-by-size-step" x="752" y="142">04</text>
    <text class="format-by-size-name" x="778" y="142">Service-to-service, hot path</text>
    <text class="format-by-size-desc" x="752" y="166">Protocol Buffers. Compact binary</text>
    <text class="format-by-size-desc" x="752" y="182">with a schema, when readability</text>
    <text class="format-by-size-desc" x="752" y="198">is not the point.</text>
    <text class="format-by-size-edge" x="752" y="242">protobuf</text>
  </g>
  <text class="format-by-size-sub" x="30" y="304">Every repeated key in a large JSON array is wasted bytes and wasted parse time. For uniform tabular data that waste is most of the file.</text>
</svg>
