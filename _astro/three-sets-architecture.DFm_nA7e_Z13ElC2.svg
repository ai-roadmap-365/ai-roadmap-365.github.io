<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" role="img" aria-labelledby="d144a-title d144a-desc" width="1040" height="700">
  <title id="d144a-title">Three sets, three jobs, and the budget each one has</title>
  <desc id="d144a-desc">One dataset divided into training, validation and test portions, each labelled with what it is for, how many times it may be used, and what happens when that budget is exceeded.</desc>
  <style>
    .d144a-bg { fill: #f8fafc; }
    .d144a-title { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 26px; font-weight: 700; }
    .d144a-head { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; }
    .d144a-label { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; }
    .d144a-strong { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; }
    .d144a-muted { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d144a-num { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; }
    .d144a-train { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.5; }
    .d144a-val { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 2.5; }
    .d144a-test { fill: #ffffff; stroke: #1a202c; stroke-width: 3.5; }
    .d144a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .d144a-warn { fill: #ffffff; stroke: #1d4ed8; stroke-width: 2.5; }
    .d144a-wire { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .d144a-loop { stroke: #1d4ed8; stroke-width: 2.5; fill: none; stroke-dasharray: 8 5; }
  </style>
  <rect class="d144a-bg" x="0" y="0" width="1040" height="700"/>
  <marker id="d144a-arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
  </marker>

  <text class="d144a-title" x="520" y="42" text-anchor="middle">Three sets, three jobs, three budgets</text>
  <text class="d144a-muted" x="520" y="68" text-anchor="middle">The difference between validation and test is not the data. It is how many times you are allowed to look.</text>

  <!-- the bar -->
  <rect class="d144a-train" x="40" y="100" width="580" height="72" rx="8"/>
  <text class="d144a-head" x="330" y="132" text-anchor="middle">TRAINING</text>
  <text class="d144a-muted" x="330" y="156" text-anchor="middle">the model fits its parameters here</text>

  <rect class="d144a-val" x="628" y="100" width="200" height="72" rx="8"/>
  <text class="d144a-head" x="728" y="132" text-anchor="middle">VALIDATION</text>
  <text class="d144a-muted" x="728" y="156" text-anchor="middle">you choose here</text>

  <rect class="d144a-test" x="836" y="100" width="164" height="72" rx="8"/>
  <text class="d144a-head" x="918" y="132" text-anchor="middle">TEST</text>
  <text class="d144a-muted" x="918" y="156" text-anchor="middle">you look once</text>

  <!-- job cards -->
  <rect class="d144a-card" x="40" y="204" width="580" height="150" rx="8"/>
  <text class="d144a-strong" x="60" y="234">Job: fit the parameters</text>
  <text class="d144a-label" x="60" y="262">Budget: unlimited. Look as often as you like.</text>
  <text class="d144a-label" x="60" y="288">A score measured here says nothing about new data, which</text>
  <text class="d144a-label" x="60" y="310">Day 141 measured: a 1-NN scores 1.000 on labels that are coin flips.</text>
  <text class="d144a-muted" x="60" y="336">Anything fitted -- a scaler, an imputer, a feature selector -- is fitted only here.</text>

  <rect class="d144a-card" x="628" y="204" width="372" height="150" rx="8"/>
  <text class="d144a-strong" x="648" y="234">Job: choose between candidates</text>
  <text class="d144a-label" x="648" y="262">Budget: many times, and every look costs.</text>
  <text class="d144a-label" x="648" y="288">Choosing the best of K on this set makes</text>
  <text class="d144a-label" x="648" y="310">its score optimistic by the expected</text>
  <text class="d144a-label" x="648" y="332">maximum of K noise draws. Measured below.</text>

  <!-- measured -->
  <rect class="d144a-warn" x="40" y="386" width="960" height="170" rx="10"/>
  <text class="d144a-head" x="60" y="416">What selecting on a set does to that set, measured on candidates with zero skill</text>
  <text class="d144a-muted" x="60" y="440">Each candidate is a coin flip. 500-row validation set, 500-row test set, averaged over 400 replications.</text>

  <text class="d144a-strong" x="70" y="474">candidates tried</text>
  <text class="d144a-strong" x="330" y="474">best validation score</text>
  <text class="d144a-strong" x="620" y="474">its score on the test set</text>
  <text class="d144a-label" x="70" y="502">1</text>
  <text class="d144a-label" x="330" y="502">0.4984</text>
  <text class="d144a-label" x="620" y="502">0.5011</text>
  <text class="d144a-label" x="70" y="524">10</text>
  <text class="d144a-label" x="330" y="524">0.5331</text>
  <text class="d144a-label" x="620" y="524">0.4999</text>
  <text class="d144a-num" x="70" y="546">1000</text>
  <text class="d144a-num" x="330" y="546">0.5720</text>
  <text class="d144a-num" x="620" y="546">0.4992</text>
  <text class="d144a-muted" x="800" y="502">the validation column climbs</text>
  <text class="d144a-muted" x="800" y="524">on candidates that are noise;</text>
  <text class="d144a-muted" x="800" y="546">the test column never moves</text>

  <!-- the loop and the gate -->
  <path class="d144a-loop" d="M 728 354 L 728 372" marker-end="url(#d144a-arrowhead)"/>
  <path class="d144a-wire" d="M 918 172 L 918 600" marker-end="url(#d144a-arrowhead)"/>
  <rect class="d144a-card" x="40" y="586" width="740" height="94" rx="8"/>
  <text class="d144a-strong" x="60" y="616">Job of the test set: estimate what you will actually get, once.</text>
  <text class="d144a-label" x="60" y="642">Budget: exactly one evaluation. Its whole value comes from never having influenced anything.</text>
  <text class="d144a-muted" x="60" y="666">Look twice and it has become a second validation set, and you no longer have an unbiased estimate of anything.</text>
</svg>
