<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="FastMCP Decorator to JSON Schema Pipeline">
  <title>FastMCP Decorator to JSON Schema Pipeline</title>
  <defs>
    <style>
      .d297a-bg { fill: #f8fafc; }
      .d297a-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d297a-code { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d297a-schema { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d297a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d297a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d297a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
      .d297a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
      .d297a-snippet { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #0f172a; }
      .d297a-arr { stroke: #3b82f6; stroke-width: 2px; marker-end: url(#d297a-m); fill: none; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d297a-bg" />
  
  <text x="40" y="40" class="d297a-title">FastMCP: Python Decorator to JSON Schema</text>
  <text x="40" y="65" class="d297a-subtitle">FastMCP Decorator to JSON Schema Pipeline diagram showing Python function inspection, docstring extraction, JSON Schema compilation, and stdio dispatch</text>
  
  <!-- Python Code -->
  <rect x="40" y="100" width="380" height="300" class="d297a-code" />
  <text x="60" y="130" class="d297a-header" fill="#1d4ed8">1. Python Function with @mcp.tool()</text>
  <text x="60" y="165" class="d297a-snippet">@mcp.tool()</text>
  <text x="60" y="185" class="d297a-snippet">def query_db(query: str, limit: int = 10) -> str:</text>
  <text x="80" y="205" class="d297a-snippet">"""Execute read-only SQL query.</text>
  <text x="80" y="225" class="d297a-snippet">Args:</text>
  <text x="100" y="245" class="d297a-snippet">query: Valid SELECT SQL statement.</text>
  <text x="100" y="265" class="d297a-snippet">limit: Max rows to return (1-100).</text>
  <text x="80" y="285" class="d297a-snippet">"""</text>
  <text x="80" y="305" class="d297a-snippet">return db.execute(query, limit)</text>
  
  <!-- Generated Schema -->
  <rect x="480" y="100" width="380" height="300" class="d297a-schema" />
  <text x="500" y="130" class="d297a-header" fill="#15803d">2. Compiled JSON Schema in tools/list</text>
  <text x="500" y="165" class="d297a-snippet">"name": "query_db",</text>
  <text x="500" y="185" class="d297a-snippet">"description": "Execute read-only SQL query.",</text>
  <text x="500" y="205" class="d297a-snippet">"inputSchema": {</text>
  <text x="520" y="225" class="d297a-snippet">"type": "object",</text>
  <text x="520" y="245" class="d297a-snippet">"properties": {</text>
  <text x="540" y="265" class="d297a-snippet">"query": {"type": "string", "description": "..."},</text>
  <text x="540" y="285" class="d297a-snippet">"limit": {"type": "integer", "default": 10}</text>
  <text x="520" y="305" class="d297a-snippet">},</text>
  <text x="520" y="325" class="d297a-snippet">"required": ["query"]</text>
  <text x="500" y="345" class="d297a-snippet">}</text>
</svg>