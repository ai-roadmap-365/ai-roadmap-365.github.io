<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Old vulnerabilities, one new one.">
  <title>Three milestones</title>
  <style>
    .injection-history-bg   { fill: #f8fafc; }
    .injection-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .injection-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .injection-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .injection-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .injection-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .injection-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .injection-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .injection-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .injection-history-stage { opacity: 1; }

    .injection-history-s0 { animation-delay: 0.00s; }
    .injection-history-e0 { animation-delay: 0.00s; }
    .injection-history-s1 { animation-delay: 1.50s; }
    .injection-history-e1 { animation-delay: 1.50s; }
    .injection-history-s2 { animation-delay: 3.00s; }
    .injection-history-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .injection-history-conn  { animation: injection-history-trace 6s ease-in-out infinite; }
      .injection-history-stage { animation: injection-history-arrive 6s ease-in-out infinite; }
    }
    @keyframes injection-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes injection-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .injection-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .injection-history-stage { animation: injection-history-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes injection-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="injection-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="injection-history-bg" width="980" height="322"/>
  <text class="injection-history-h1"  x="30" y="40">Three milestones</text>
  <text class="injection-history-sub" x="30" y="64">Old vulnerabilities, one new one.</text>
  <g class="injection-history-stage injection-history-s0">
    <rect class="injection-history-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="injection-history-step" x="44" y="142">01</text>
    <text class="injection-history-name" x="70" y="142">Classical vulnerabilities</text>
    <text class="injection-history-desc" x="44" y="166">SQL injection, command injection, directory</text>
    <text class="injection-history-desc" x="44" y="182">traversal. Still the primary vectors.</text>
  </g>
  <line class="injection-history-line injection-history-conn injection-history-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#injection-history-tip)"/>
  <g class="injection-history-stage injection-history-s1">
    <rect class="injection-history-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="injection-history-step" x="359" y="142">02</text>
    <text class="injection-history-name" x="385" y="142">Indirect injection, 2023</text>
    <text class="injection-history-desc" x="359" y="166">White text in a PDF instructing a hiring</text>
    <text class="injection-history-desc" x="359" y="182">agent. The model cannot tell data from</text>
    <text class="injection-history-desc" x="359" y="198">instruction.</text>
  </g>
  <line class="injection-history-line injection-history-conn injection-history-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#injection-history-tip)"/>
  <g class="injection-history-stage injection-history-s2">
    <rect class="injection-history-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="injection-history-step" x="674" y="142">03</text>
    <text class="injection-history-name" x="700" y="142">MCP security model, 2024</text>
    <text class="injection-history-desc" x="674" y="166">Client-side permissions, human confirmation,</text>
    <text class="injection-history-desc" x="674" y="182">isolated subprocesses.</text>
  </g>
  <text class="injection-history-sub" x="30" y="304">The middle row is the only genuinely new class, and it is what makes the first row dangerous again: the injected instruction is a way of reaching a vulnerability that a human operator would never have triggered.</text>
</svg>
