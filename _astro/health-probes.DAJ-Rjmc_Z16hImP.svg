<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four distinctions.">
  <title>Health checks</title>
  <style>
    .health-probes-bg   { fill: #f8fafc; }
    .health-probes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .health-probes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .health-probes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .health-probes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .health-probes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .health-probes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .health-probes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .health-probes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .health-probes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .health-probes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .health-probes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .health-probes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .health-probes-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .health-probes-stage { opacity: 1; }

    .health-probes-s0 { animation-delay: 0.00s; }
    .health-probes-e0 { animation-delay: 0.00s; }
    .health-probes-s1 { animation-delay: 1.28s; }
    .health-probes-e1 { animation-delay: 1.28s; }
    .health-probes-s2 { animation-delay: 2.56s; }
    .health-probes-e2 { animation-delay: 2.56s; }
    .health-probes-s3 { animation-delay: 3.84s; }
    .health-probes-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .health-probes-conn  { animation: health-probes-trace 6.4s ease-in-out infinite; }
      .health-probes-stage { animation: health-probes-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes health-probes-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes health-probes-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .health-probes-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .health-probes-stage { animation: health-probes-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes health-probes-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="health-probes-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="health-probes-bg" width="980" height="322"/>
  <text class="health-probes-h1"  x="30" y="40">Health checks</text>
  <text class="health-probes-sub" x="30" y="64">Four distinctions.</text>
  <g class="health-probes-stage health-probes-s0">
    <rect class="health-probes-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="health-probes-step" x="44" y="142">01</text>
    <text class="health-probes-name" x="70" y="142">Liveness: is the process alive</text>
    <text class="health-probes-desc" x="44" y="166">If not, restart it.</text>
  </g>
  <line class="health-probes-line health-probes-conn health-probes-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#health-probes-tip)"/>
  <g class="health-probes-stage health-probes-s1">
    <rect class="health-probes-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="health-probes-step" x="280" y="142">02</text>
    <text class="health-probes-name" x="306" y="142">Readiness: can it serve right now</text>
    <text class="health-probes-desc" x="280" y="166">If not, stop sending traffic but</text>
    <text class="health-probes-desc" x="280" y="182">leave it running.</text>
  </g>
  <line class="health-probes-line health-probes-conn health-probes-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#health-probes-tip)"/>
  <g class="health-probes-stage health-probes-s2">
    <rect class="health-probes-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="health-probes-step" x="516" y="142">03</text>
    <text class="health-probes-name" x="542" y="142">Confusing them causes restart loops</text>
    <text class="health-probes-desc" x="516" y="166">A slow model load fails liveness</text>
    <text class="health-probes-desc" x="516" y="182">and never finishes.</text>
  </g>
  <line class="health-probes-line health-probes-conn health-probes-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#health-probes-tip)"/>
  <g class="health-probes-stage health-probes-s3">
    <rect class="health-probes-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="health-probes-step" x="752" y="142">04</text>
    <text class="health-probes-name" x="778" y="142">And readiness should check the model actually loaded</text>
    <text class="health-probes-desc" x="752" y="166">Not merely that the web server</text>
    <text class="health-probes-desc" x="752" y="182">started.</text>
  </g>
  <text class="health-probes-sub" x="30" y="304">Checking that the model loaded rather than that the process started is the model-specific detail: a service can accept connections and have no model behind it.</text>
</svg>
