<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the audience.">
  <title>Which report form when</title>
  <style>
    .eda-when-bg   { fill: #f8fafc; }
    .eda-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eda-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eda-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eda-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eda-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eda-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eda-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eda-when-row { opacity: 1; }
    .eda-when-r0 { animation-delay: 0.00s; }
    .eda-when-r1 { animation-delay: 0.45s; }
    .eda-when-r2 { animation-delay: 0.90s; }
    .eda-when-r3 { animation-delay: 1.35s; }
    .eda-when-r4 { animation-delay: 1.80s; }
    .eda-when-row { animation: eda-when-reveal 7.3s ease-in-out infinite; }
    @keyframes eda-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="eda-when-bg" width="980" height="390"/>
  <text class="eda-when-h1"  x="30" y="40">Which report form when</text>
  <text class="eda-when-sub" x="30" y="64">By the audience.</text>
  <rect class="eda-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="eda-when-name" x="46" y="122">The audience</text>
  <text class="eda-when-desc" x="46" y="142">Who reads it.</text>
  <text class="eda-when-desc eda-when-row eda-when-r0" x="46" y="182">Yourself, next month</text>
  <text class="eda-when-desc eda-when-row eda-when-r1" x="46" y="216">A technical colleague</text>
  <text class="eda-when-desc eda-when-row eda-when-r2" x="46" y="250">A decision-maker</text>
  <text class="eda-when-desc eda-when-row eda-when-r3" x="46" y="284">A wide internal audience</text>
  <text class="eda-when-desc eda-when-row eda-when-r4" x="46" y="318">An external or regulatory reader</text>
  <rect class="eda-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="eda-when-name" x="526" y="122">The form</text>
  <text class="eda-when-desc" x="526" y="142">What to produce.</text>
  <text class="eda-when-desc eda-when-row eda-when-r0" x="526" y="182">An annotated notebook</text>
  <text class="eda-when-desc eda-when-row eda-when-r1" x="526" y="216">A notebook with a written summary</text>
  <text class="eda-when-desc eda-when-row eda-when-r2" x="526" y="250">A short document, one page of findings</text>
  <text class="eda-when-desc eda-when-row eda-when-r3" x="526" y="284">A rendered document, no code</text>
  <text class="eda-when-desc eda-when-row eda-when-r4" x="526" y="318">A full method appendix with data provenance</text>
  <text class="eda-when-sub" x="30" y="372">Writing for yourself next month is the case people neglect, and it is the one that recurs most often across a career.</text>
</svg>
