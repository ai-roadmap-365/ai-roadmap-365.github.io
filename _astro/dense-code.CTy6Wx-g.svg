<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps, one of them a multiplication.">
  <title>Dense retrieval, concretely</title>
  <style>
    .dense-code-bg   { fill: #f8fafc; }
    .dense-code-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dense-code-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dense-code-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dense-code-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dense-code-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dense-code-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dense-code-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dense-code-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dense-code-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dense-code-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dense-code-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dense-code-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .dense-code-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .dense-code-stage { opacity: 1; }

    .dense-code-s0 { animation-delay: 0.00s; }
    .dense-code-e0 { animation-delay: 0.00s; }
    .dense-code-s1 { animation-delay: 1.28s; }
    .dense-code-e1 { animation-delay: 1.28s; }
    .dense-code-s2 { animation-delay: 2.56s; }
    .dense-code-e2 { animation-delay: 2.56s; }
    .dense-code-s3 { animation-delay: 3.84s; }
    .dense-code-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .dense-code-conn  { animation: dense-code-trace 6.4s ease-in-out infinite; }
      .dense-code-stage { animation: dense-code-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes dense-code-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes dense-code-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .dense-code-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .dense-code-stage { animation: dense-code-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes dense-code-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="dense-code-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="dense-code-bg" width="980" height="322"/>
  <text class="dense-code-h1"  x="30" y="40">Dense retrieval, concretely</text>
  <text class="dense-code-sub" x="30" y="64">Four steps, one of them a multiplication.</text>
  <g class="dense-code-stage dense-code-s0">
    <rect class="dense-code-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="dense-code-step" x="44" y="142">01</text>
    <text class="dense-code-name" x="70" y="142">Embed every chunk once</text>
    <text class="dense-code-desc" x="44" y="166">Offline, into one matrix.</text>
  </g>
  <line class="dense-code-line dense-code-conn dense-code-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#dense-code-tip)"/>
  <g class="dense-code-stage dense-code-s1">
    <rect class="dense-code-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="dense-code-step" x="280" y="142">02</text>
    <text class="dense-code-name" x="306" y="142">Normalise the rows</text>
    <text class="dense-code-desc" x="280" y="166">So the dot product is the</text>
    <text class="dense-code-desc" x="280" y="182">angular similarity.</text>
  </g>
  <line class="dense-code-line dense-code-conn dense-code-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#dense-code-tip)"/>
  <g class="dense-code-stage dense-code-s2">
    <rect class="dense-code-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="dense-code-step" x="516" y="142">03</text>
    <text class="dense-code-name" x="542" y="142">Embed the query at request time</text>
    <text class="dense-code-desc" x="516" y="166">One vector.</text>
  </g>
  <line class="dense-code-line dense-code-conn dense-code-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#dense-code-tip)"/>
  <g class="dense-code-stage dense-code-s3">
    <rect class="dense-code-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="dense-code-step" x="752" y="142">04</text>
    <text class="dense-code-name" x="778" y="142">Multiply, and take the largest</text>
    <text class="dense-code-desc" x="752" y="166">Which is the entire search.</text>
    <text class="dense-code-edge" x="752" y="242">one line</text>
  </g>
  <text class="dense-code-sub" x="30" y="304">Search being a single matrix multiplication is the fact that makes exact retrieval viable at surprising scale, and it is invisible behind most libraries.</text>
</svg>
