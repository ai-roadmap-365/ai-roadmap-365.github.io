<svg role="img" aria-label="In-Context Learning attention trajectory diagram showing how few-shot exemplars act as implicit meta-gradients in transformer layers" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>In-Context Learning &amp; Implicit Meta-Gradients</title>
  <defs>
    <linearGradient id="bg248a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card248" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg248a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">IN-CONTEXT LEARNING &amp; ATTENTION ACTIVATION MANIFOLDS</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">How Few-Shot Demonstration Pairs Steer Hidden Activations Without Modifying Model Weights</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card248)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Exemplar Stream -->
    <rect x="25" y="25" width="220" height="255" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="135" y="50" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">1. Few-Shot Exemplars</text>
    <rect x="35" y="70" width="200" height="55" fill="#1e293b" rx="4"/>
    <text x="45" y="90" fill="#fbbf24" font-size="8" font-weight="700">Exemplar 1 (Input -&gt; Reasoning -&gt; Out)</text>
    <text x="45" y="108" fill="#94a3b8" font-size="7">Q: Roger has 5 balls... A: 5+6=11</text>
    
    <rect x="35" y="135" width="200" height="55" fill="#1e293b" rx="4"/>
    <text x="45" y="155" fill="#fbbf24" font-size="8" font-weight="700">Exemplar 2 (Input -&gt; Reasoning -&gt; Out)</text>
    <text x="45" y="173" fill="#94a3b8" font-size="7">Q: Server CPU 95%... A: Check PID</text>
    <text x="35" y="225" fill="#34d399" font-size="8">Format &amp; Schema Conditioning</text>
    <text x="35" y="245" fill="#cbd5e1" font-size="8">Zero Weight Updates (In-Context)</text>

    <!-- Transformer Latent Trajectory -->
    <rect x="270" y="25" width="465" height="255" fill="#0f172a" stroke="#a855f7" rx="6"/>
    <text x="502" y="50" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle">2. Transformer Attention Forward Pass</text>
    
    <rect x="290" y="75" width="425" height="50" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="305" y="95" fill="#38bdf8" font-size="8" font-weight="700">Attention Induction Heads (von Oswald et al.):</text>
    <text x="305" y="112" fill="#cbd5e1" font-size="8">Cross-attends to (Input, Output) pairs to synthesize task meta-gradients.</text>

    <rect x="290" y="135" width="425" height="50" fill="#1e293b" stroke="#34d399" rx="4"/>
    <text x="305" y="155" fill="#34d399" font-size="8" font-weight="700">Query Activation Alignment:</text>
    <text x="305" y="172" fill="#cbd5e1" font-size="8">The live query vector is projected into the demonstrated reasoning subspace.</text>

    <rect x="290" y="195" width="425" height="70" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="305" y="215" fill="#fbbf24" font-size="8" font-weight="700">Deterministic Output Generation:</text>
    <text x="305" y="232" fill="#cbd5e1" font-size="8">Model generates step-by-step intermediate tokens with &gt;90% benchmark accuracy.</text>
    <text x="305" y="252" fill="#34d399" font-size="8" font-weight="700">Substantially reduces reasoning hallucinations vs zero-shot!</text>
  </g>
</svg>
