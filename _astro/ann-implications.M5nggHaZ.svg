<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are about tenancy and erasure.">
  <title>Five consequences of an ANN index</title>
  <style>
    .ann-implications-bg   { fill: #f8fafc; }
    .ann-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ann-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ann-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ann-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ann-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ann-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ann-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ann-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ann-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ann-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ann-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ann-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .ann-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .ann-implications-stage { opacity: 1; }

    .ann-implications-s0 { animation-delay: 0.00s; }
    .ann-implications-e0 { animation-delay: 0.00s; }
    .ann-implications-s1 { animation-delay: 1.33s; }
    .ann-implications-e1 { animation-delay: 1.33s; }
    .ann-implications-s2 { animation-delay: 2.67s; }
    .ann-implications-e2 { animation-delay: 2.67s; }
    .ann-implications-s3 { animation-delay: 4.00s; }
    .ann-implications-e3 { animation-delay: 4.00s; }
    .ann-implications-s4 { animation-delay: 5.33s; }
    .ann-implications-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .ann-implications-conn  { animation: ann-implications-trace 8s ease-in-out infinite; }
      .ann-implications-stage { animation: ann-implications-arrive 8s ease-in-out infinite; }
    }
    @keyframes ann-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes ann-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .ann-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ann-implications-stage { animation: ann-implications-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes ann-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ann-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="ann-implications-bg" width="980" height="322"/>
  <text class="ann-implications-h1"  x="30" y="40">Five consequences of an ANN index</text>
  <text class="ann-implications-sub" x="30" y="64">Two are about tenancy and erasure.</text>
  <g class="ann-implications-stage ann-implications-s0">
    <rect class="ann-implications-warn" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="ann-implications-step" x="44" y="142">01</text>
    <text class="ann-implications-name" x="70" y="142">Approximate indexes are shared structures</text>
    <text class="ann-implications-desc" x="44" y="166">Filter before retrieval,</text>
    <text class="ann-implications-desc" x="44" y="182">not after, or tenancy</text>
    <text class="ann-implications-desc" x="44" y="198">leaks through results.</text>
    <text class="ann-implications-edge" x="44" y="242">security</text>
  </g>
  <line class="ann-implications-line ann-implications-conn ann-implications-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#ann-implications-tip)"/>
  <g class="ann-implications-stage ann-implications-s1">
    <rect class="ann-implications-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="ann-implications-step" x="233" y="142">02</text>
    <text class="ann-implications-name" x="259" y="142">Deletion is a tombstone, not a removal</text>
    <text class="ann-implications-desc" x="233" y="166">The vector stays until</text>
    <text class="ann-implications-desc" x="233" y="182">compaction — an erasure</text>
    <text class="ann-implications-desc" x="233" y="198">problem.</text>
    <text class="ann-implications-edge" x="233" y="242">privacy</text>
  </g>
  <line class="ann-implications-line ann-implications-conn ann-implications-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#ann-implications-tip)"/>
  <g class="ann-implications-stage ann-implications-s2">
    <rect class="ann-implications-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="ann-implications-step" x="422" y="142">03</text>
    <text class="ann-implications-name" x="448" y="142">Recall, latency, memory: choose two</text>
    <text class="ann-implications-desc" x="422" y="166">Quantisation trades</text>
    <text class="ann-implications-desc" x="422" y="182">recall for memory; higher</text>
    <text class="ann-implications-desc" x="422" y="198">search effort trades</text>
  </g>
  <line class="ann-implications-line ann-implications-conn ann-implications-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#ann-implications-tip)"/>
  <g class="ann-implications-stage ann-implications-s3">
    <rect class="ann-implications-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="ann-implications-step" x="611" y="142">04</text>
    <text class="ann-implications-name" x="637" y="142">Sharding raises tail latency</text>
    <text class="ann-implications-desc" x="611" y="166">A query is as slow as its</text>
    <text class="ann-implications-desc" x="611" y="182">slowest shard, and each</text>
    <text class="ann-implications-desc" x="611" y="198">shard returns its own</text>
  </g>
  <line class="ann-implications-line ann-implications-conn ann-implications-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#ann-implications-tip)"/>
  <g class="ann-implications-stage ann-implications-s4">
    <rect class="ann-implications-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="ann-implications-step" x="800" y="142">05</text>
    <text class="ann-implications-name" x="826" y="142">Below a million vectors, exact is often cheaper</text>
    <text class="ann-implications-desc" x="800" y="166">Once the rebuild pipeline</text>
    <text class="ann-implications-desc" x="800" y="182">and its failure modes are</text>
    <text class="ann-implications-desc" x="800" y="198">counted.</text>
  </g>
  <text class="ann-implications-sub" x="30" y="304">Post-filtering in a multi-tenant index is a specific and serious bug: the search touches another tenant's vectors and the filter removes them from the output, which is a timing and contamination surface rather than isolation.</text>
</svg>
