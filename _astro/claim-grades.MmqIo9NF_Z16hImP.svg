<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The third is the instructive one.">
  <title>Five claims, three grades</title>
  <style>
    .claim-grades-bg   { fill: #f8fafc; }
    .claim-grades-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .claim-grades-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .claim-grades-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .claim-grades-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .claim-grades-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .claim-grades-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .claim-grades-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .claim-grades-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .claim-grades-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .claim-grades-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .claim-grades-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .claim-grades-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .claim-grades-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .claim-grades-stage { opacity: 1; }

    .claim-grades-s0 { animation-delay: 0.00s; }
    .claim-grades-e0 { animation-delay: 0.00s; }
    .claim-grades-s1 { animation-delay: 1.28s; }
    .claim-grades-e1 { animation-delay: 1.28s; }
    .claim-grades-s2 { animation-delay: 2.56s; }
    .claim-grades-e2 { animation-delay: 2.56s; }
    .claim-grades-s3 { animation-delay: 3.84s; }
    .claim-grades-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .claim-grades-conn  { animation: claim-grades-trace 6.4s ease-in-out infinite; }
      .claim-grades-stage { animation: claim-grades-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes claim-grades-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes claim-grades-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .claim-grades-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .claim-grades-stage { animation: claim-grades-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes claim-grades-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="claim-grades-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="claim-grades-bg" width="980" height="322"/>
  <text class="claim-grades-h1"  x="30" y="40">Five claims, three grades</text>
  <text class="claim-grades-sub" x="30" y="64">The third is the instructive one.</text>
  <g class="claim-grades-stage claim-grades-s0">
    <rect class="claim-grades-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="claim-grades-step" x="44" y="142">01</text>
    <text class="claim-grades-name" x="70" y="142">VAGUE: "blazing", "state-of-the-art"</text>
    <text class="claim-grades-desc" x="44" y="166">No measurement, no attribution,</text>
    <text class="claim-grades-desc" x="44" y="182">no link.</text>
  </g>
  <line class="claim-grades-line claim-grades-conn claim-grades-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#claim-grades-tip)"/>
  <g class="claim-grades-stage claim-grades-s1">
    <rect class="claim-grades-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="claim-grades-step" x="280" y="142">02</text>
    <text class="claim-grades-name" x="306" y="142">WEAK: "reduced latency to 840ms"</text>
    <text class="claim-grades-desc" x="280" y="166">Sounds rigorous. 840 ms could be</text>
    <text class="claim-grades-desc" x="280" y="182">a regression from 200 ms.</text>
    <text class="claim-grades-edge" x="280" y="242">no baseline</text>
  </g>
  <line class="claim-grades-line claim-grades-conn claim-grades-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#claim-grades-tip)"/>
  <g class="claim-grades-stage claim-grades-s2">
    <rect class="claim-grades-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="claim-grades-step" x="516" y="142">03</text>
    <text class="claim-grades-name" x="542" y="142">WEAK: measured, but localhost</text>
    <text class="claim-grades-desc" x="516" y="166">Evidence to the author and to</text>
    <text class="claim-grades-desc" x="516" y="182">nobody else. It functions as no</text>
    <text class="claim-grades-desc" x="516" y="198">link.</text>
    <text class="claim-grades-edge" x="516" y="242">unopenable</text>
  </g>
  <line class="claim-grades-line claim-grades-conn claim-grades-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#claim-grades-tip)"/>
  <g class="claim-grades-stage claim-grades-s3">
    <rect class="claim-grades-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="claim-grades-step" x="752" y="142">04</text>
    <text class="claim-grades-name" x="778" y="142">STRONG: from 4.2s to 840ms, by me</text>
    <text class="claim-grades-desc" x="752" y="166">Specific, baselined, attributed,</text>
    <text class="claim-grades-desc" x="752" y="182">and openable.</text>
    <text class="claim-grades-edge" x="752" y="242">all four</text>
  </g>
  <text class="claim-grades-sub" x="30" y="304">The second row is the one worth remembering: a number without a baseline is a fact about the present rather than a claim about your work, and it passes a casual read precisely because it has a unit.</text>
</svg>
