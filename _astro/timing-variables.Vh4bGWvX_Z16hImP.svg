<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five variables, and the gap between two of them is a stage.">
  <title>Turning curl into a stopwatch</title>
  <style>
    .timing-variables-bg   { fill: #f8fafc; }
    .timing-variables-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .timing-variables-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .timing-variables-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .timing-variables-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .timing-variables-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .timing-variables-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .timing-variables-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .timing-variables-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .timing-variables-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .timing-variables-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .timing-variables-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .timing-variables-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .timing-variables-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .timing-variables-stage { opacity: 1; }

    .timing-variables-s0 { animation-delay: 0.00s; }
    .timing-variables-e0 { animation-delay: 0.00s; }
    .timing-variables-s1 { animation-delay: 1.33s; }
    .timing-variables-e1 { animation-delay: 1.33s; }
    .timing-variables-s2 { animation-delay: 2.67s; }
    .timing-variables-e2 { animation-delay: 2.67s; }
    .timing-variables-s3 { animation-delay: 4.00s; }
    .timing-variables-e3 { animation-delay: 4.00s; }
    .timing-variables-s4 { animation-delay: 5.33s; }
    .timing-variables-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .timing-variables-conn  { animation: timing-variables-trace 8s ease-in-out infinite; }
      .timing-variables-stage { animation: timing-variables-arrive 8s ease-in-out infinite; }
    }
    @keyframes timing-variables-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes timing-variables-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .timing-variables-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .timing-variables-stage { animation: timing-variables-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes timing-variables-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="timing-variables-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="timing-variables-bg" width="980" height="322"/>
  <text class="timing-variables-h1"  x="30" y="40">Turning curl into a stopwatch</text>
  <text class="timing-variables-sub" x="30" y="64">Five variables, and the gap between two of them is a stage.</text>
  <g class="timing-variables-stage timing-variables-s0">
    <rect class="timing-variables-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="timing-variables-step" x="44" y="142">01</text>
    <text class="timing-variables-name" x="70" y="142">time_namelookup</text>
    <text class="timing-variables-desc" x="44" y="166">Up to the DNS answer.</text>
    <text class="timing-variables-desc" x="44" y="182">Zero means it was already</text>
    <text class="timing-variables-desc" x="44" y="198">cached.</text>
    <text class="timing-variables-edge" x="44" y="242">DNS</text>
  </g>
  <line class="timing-variables-line timing-variables-conn timing-variables-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#timing-variables-tip)"/>
  <g class="timing-variables-stage timing-variables-s1">
    <rect class="timing-variables-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="timing-variables-step" x="233" y="142">02</text>
    <text class="timing-variables-name" x="259" y="142">time_connect</text>
    <text class="timing-variables-desc" x="233" y="166">Up to the TCP handshake</text>
    <text class="timing-variables-desc" x="233" y="182">completing.</text>
    <text class="timing-variables-edge" x="233" y="242">TCP</text>
  </g>
  <line class="timing-variables-line timing-variables-conn timing-variables-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#timing-variables-tip)"/>
  <g class="timing-variables-stage timing-variables-s2">
    <rect class="timing-variables-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="timing-variables-step" x="422" y="142">03</text>
    <text class="timing-variables-name" x="448" y="142">time_appconnect</text>
    <text class="timing-variables-desc" x="422" y="166">Up to TLS finishing.</text>
    <text class="timing-variables-desc" x="422" y="182">Often larger than TCP.</text>
    <text class="timing-variables-edge" x="422" y="242">TLS</text>
  </g>
  <line class="timing-variables-line timing-variables-conn timing-variables-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#timing-variables-tip)"/>
  <g class="timing-variables-stage timing-variables-s3">
    <rect class="timing-variables-good" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="timing-variables-step" x="611" y="142">04</text>
    <text class="timing-variables-name" x="637" y="142">time_starttransfer</text>
    <text class="timing-variables-desc" x="611" y="166">Up to the first byte of</text>
    <text class="timing-variables-desc" x="611" y="182">the response. The</text>
    <text class="timing-variables-desc" x="611" y="198">server's own work.</text>
    <text class="timing-variables-edge" x="611" y="242">TTFB</text>
  </g>
  <line class="timing-variables-line timing-variables-conn timing-variables-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#timing-variables-tip)"/>
  <g class="timing-variables-stage timing-variables-s4">
    <rect class="timing-variables-box" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="timing-variables-step" x="800" y="142">05</text>
    <text class="timing-variables-name" x="826" y="142">time_total</text>
    <text class="timing-variables-desc" x="800" y="166">Everything, including</text>
    <text class="timing-variables-desc" x="800" y="182">downloading the body.</text>
    <text class="timing-variables-edge" x="800" y="242">total</text>
  </g>
  <text class="timing-variables-sub" x="30" y="304">All five are cumulative from time zero, which is what people misread. Each stage's cost is the difference between neighbours, never the number itself.</text>
</svg>
