<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Read them and you never have to guess.">
  <title>Three headers tell you where you stand</title>
  <style>
    .limit-headers-bg   { fill: #f8fafc; }
    .limit-headers-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .limit-headers-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .limit-headers-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .limit-headers-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .limit-headers-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .limit-headers-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .limit-headers-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .limit-headers-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .limit-headers-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .limit-headers-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .limit-headers-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .limit-headers-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .limit-headers-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .limit-headers-stage { opacity: 1; }

    .limit-headers-s0 { animation-delay: 0.00s; }
    .limit-headers-e0 { animation-delay: 0.00s; }
    .limit-headers-s1 { animation-delay: 1.28s; }
    .limit-headers-e1 { animation-delay: 1.28s; }
    .limit-headers-s2 { animation-delay: 2.56s; }
    .limit-headers-e2 { animation-delay: 2.56s; }
    .limit-headers-s3 { animation-delay: 3.84s; }
    .limit-headers-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .limit-headers-conn  { animation: limit-headers-trace 6.4s ease-in-out infinite; }
      .limit-headers-stage { animation: limit-headers-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes limit-headers-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes limit-headers-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .limit-headers-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .limit-headers-stage { animation: limit-headers-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes limit-headers-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="limit-headers-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="limit-headers-bg" width="980" height="322"/>
  <text class="limit-headers-h1"  x="30" y="40">Three headers tell you where you stand</text>
  <text class="limit-headers-sub" x="30" y="64">Read them and you never have to guess.</text>
  <g class="limit-headers-stage limit-headers-s0">
    <rect class="limit-headers-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="limit-headers-step" x="44" y="142">01</text>
    <text class="limit-headers-name" x="70" y="142">Limit</text>
    <text class="limit-headers-desc" x="44" y="166">Your quota for the window.</text>
    <text class="limit-headers-desc" x="44" y="182">Constant, usually.</text>
    <text class="limit-headers-edge" x="44" y="242">60</text>
  </g>
  <line class="limit-headers-line limit-headers-conn limit-headers-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#limit-headers-tip)"/>
  <g class="limit-headers-stage limit-headers-s1">
    <rect class="limit-headers-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="limit-headers-step" x="280" y="142">02</text>
    <text class="limit-headers-name" x="306" y="142">Remaining</text>
    <text class="limit-headers-desc" x="280" y="166">What is left. Counts down with</text>
    <text class="limit-headers-desc" x="280" y="182">each call — this is what lets</text>
    <text class="limit-headers-desc" x="280" y="198">you pace.</text>
    <text class="limit-headers-edge" x="280" y="242">12</text>
  </g>
  <line class="limit-headers-line limit-headers-conn limit-headers-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#limit-headers-tip)"/>
  <g class="limit-headers-stage limit-headers-s2">
    <rect class="limit-headers-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="limit-headers-step" x="516" y="142">03</text>
    <text class="limit-headers-name" x="542" y="142">Reset</text>
    <text class="limit-headers-desc" x="516" y="166">When the window rolls over,</text>
    <text class="limit-headers-desc" x="516" y="182">often as a Unix timestamp.</text>
    <text class="limit-headers-edge" x="516" y="242">timestamp</text>
  </g>
  <line class="limit-headers-line limit-headers-conn limit-headers-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#limit-headers-tip)"/>
  <g class="limit-headers-stage limit-headers-s3">
    <rect class="limit-headers-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="limit-headers-step" x="752" y="142">04</text>
    <text class="limit-headers-name" x="778" y="142">Retry-After</text>
    <text class="limit-headers-desc" x="752" y="166">Sent with a 429. Seconds, or an</text>
    <text class="limit-headers-desc" x="752" y="182">HTTP date. Obey it exactly.</text>
    <text class="limit-headers-edge" x="752" y="242">30</text>
  </g>
  <text class="limit-headers-sub" x="30" y="304">Header names vary between APIs and the meanings do not. Read the documentation once per service, then the same code works for all of them.</text>
</svg>
