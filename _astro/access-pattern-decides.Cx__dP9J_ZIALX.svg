<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="How the data is read and written does.">
  <title>Size does not choose the store</title>
  <style>
    .access-pattern-decides-bg   { fill: #f8fafc; }
    .access-pattern-decides-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .access-pattern-decides-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .access-pattern-decides-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .access-pattern-decides-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .access-pattern-decides-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .access-pattern-decides-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .access-pattern-decides-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .access-pattern-decides-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .access-pattern-decides-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .access-pattern-decides-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .access-pattern-decides-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .access-pattern-decides-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .access-pattern-decides-row { opacity: 1; }
    .access-pattern-decides-r0 { animation-delay: 0.00s; }
    .access-pattern-decides-r1 { animation-delay: 0.45s; }
    .access-pattern-decides-r2 { animation-delay: 0.90s; }
    .access-pattern-decides-r3 { animation-delay: 1.35s; }
    .access-pattern-decides-r4 { animation-delay: 1.80s; }
    .access-pattern-decides-row { animation: access-pattern-decides-reveal 7.3s ease-in-out infinite; }
    @keyframes access-pattern-decides-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="access-pattern-decides-bg" width="980" height="390"/>
  <text class="access-pattern-decides-h1"  x="30" y="40">Size does not choose the store</text>
  <text class="access-pattern-decides-sub" x="30" y="64">How the data is read and written does.</text>
  <rect class="access-pattern-decides-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="access-pattern-decides-name" x="46" y="122">200 GB, read whole</text>
  <text class="access-pattern-decides-desc" x="46" y="142">Enormous, and simple.</text>
  <text class="access-pattern-decides-desc access-pattern-decides-row access-pattern-decides-r0" x="46" y="182">Read sequentially, start to finish</text>
  <text class="access-pattern-decides-desc access-pattern-decides-row access-pattern-decides-r1" x="46" y="216">No selective queries, ever</text>
  <text class="access-pattern-decides-desc access-pattern-decides-row access-pattern-decides-r2" x="46" y="250">Written once, read many times</text>
  <text class="access-pattern-decides-desc access-pattern-decides-row access-pattern-decides-r3" x="46" y="284">Object storage — cheap and durable</text>
  <text class="access-pattern-decides-desc access-pattern-decides-row access-pattern-decides-r4" x="46" y="318">A database here costs 10x for nothing</text>
  <rect class="access-pattern-decides-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="access-pattern-decides-name" x="526" y="122">200 MB, thousands of writers</text>
  <text class="access-pattern-decides-desc" x="526" y="142">Tiny, and hard.</text>
  <text class="access-pattern-decides-desc access-pattern-decides-row access-pattern-decides-r0" x="526" y="182">Many processes writing at once</text>
  <text class="access-pattern-decides-desc access-pattern-decides-row access-pattern-decides-r1" x="526" y="216">Precise queries with filters</text>
  <text class="access-pattern-decides-desc access-pattern-decides-row access-pattern-decides-r2" x="526" y="250">Constraints that must hold</text>
  <text class="access-pattern-decides-desc access-pattern-decides-row access-pattern-decides-r3" x="526" y="284">A relational database</text>
  <text class="access-pattern-decides-desc access-pattern-decides-row access-pattern-decides-r4" x="526" y="318">A file here corrupts on the first collision</text>
  <text class="access-pattern-decides-sub" x="30" y="372">The instinct is to pick a store by how much data there is. The question that actually decides it is how the data is reached: whole or selectively, by one writer or many.</text>
</svg>
