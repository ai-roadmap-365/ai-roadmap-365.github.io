<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>From tokens to one vector</title>
  <style>
    .bi-encoder-bg   { fill: #f8fafc; }
    .bi-encoder-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bi-encoder-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bi-encoder-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bi-encoder-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bi-encoder-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bi-encoder-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bi-encoder-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bi-encoder-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bi-encoder-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bi-encoder-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bi-encoder-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bi-encoder-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .bi-encoder-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .bi-encoder-stage { opacity: 1; }

    .bi-encoder-s0 { animation-delay: 0.00s; }
    .bi-encoder-e0 { animation-delay: 0.00s; }
    .bi-encoder-s1 { animation-delay: 1.28s; }
    .bi-encoder-e1 { animation-delay: 1.28s; }
    .bi-encoder-s2 { animation-delay: 2.56s; }
    .bi-encoder-e2 { animation-delay: 2.56s; }
    .bi-encoder-s3 { animation-delay: 3.84s; }
    .bi-encoder-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .bi-encoder-conn  { animation: bi-encoder-trace 6.4s ease-in-out infinite; }
      .bi-encoder-stage { animation: bi-encoder-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes bi-encoder-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes bi-encoder-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .bi-encoder-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .bi-encoder-stage { animation: bi-encoder-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes bi-encoder-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="bi-encoder-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="bi-encoder-bg" width="980" height="322"/>
  <text class="bi-encoder-h1"  x="30" y="40">From tokens to one vector</text>
  <text class="bi-encoder-sub" x="30" y="64">Four steps.</text>
  <g class="bi-encoder-stage bi-encoder-s0">
    <rect class="bi-encoder-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="bi-encoder-step" x="44" y="142">01</text>
    <text class="bi-encoder-name" x="70" y="142">Tokenise the text</text>
    <text class="bi-encoder-desc" x="44" y="166">Which caps how much a single</text>
    <text class="bi-encoder-desc" x="44" y="182">vector can represent.</text>
  </g>
  <line class="bi-encoder-line bi-encoder-conn bi-encoder-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#bi-encoder-tip)"/>
  <g class="bi-encoder-stage bi-encoder-s1">
    <rect class="bi-encoder-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="bi-encoder-step" x="280" y="142">02</text>
    <text class="bi-encoder-name" x="306" y="142">Encode every token in context</text>
    <text class="bi-encoder-desc" x="280" y="166">Producing one vector per token.</text>
  </g>
  <line class="bi-encoder-line bi-encoder-conn bi-encoder-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#bi-encoder-tip)"/>
  <g class="bi-encoder-stage bi-encoder-s2">
    <rect class="bi-encoder-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="bi-encoder-step" x="516" y="142">03</text>
    <text class="bi-encoder-name" x="542" y="142">Pool them into one</text>
    <text class="bi-encoder-desc" x="516" y="166">Usually by averaging. Sometimes</text>
    <text class="bi-encoder-desc" x="516" y="182">a dedicated position.</text>
  </g>
  <line class="bi-encoder-line bi-encoder-conn bi-encoder-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#bi-encoder-tip)"/>
  <g class="bi-encoder-stage bi-encoder-s3">
    <rect class="bi-encoder-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="bi-encoder-step" x="752" y="142">04</text>
    <text class="bi-encoder-name" x="778" y="142">Then normalise to unit length</text>
    <text class="bi-encoder-desc" x="752" y="166">Which makes distance and angle</text>
    <text class="bi-encoder-desc" x="752" y="182">equivalent.</text>
    <text class="bi-encoder-edge" x="752" y="242">convention</text>
  </g>
  <text class="bi-encoder-sub" x="30" y="304">Compressing a whole passage into one vector is a genuine information bottleneck, and it is the reason chunk size matters as much as it does.</text>
</svg>
