<svg role="img" aria-label="PyTorch dynamic computation graph and autograd engine showing tensor forward execution and reverse gradient propagation through grad_fn nodes" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>PyTorch Autograd Dynamic Computation Graph and grad_fn Engine</title>
  <defs>
    <linearGradient id="bg204a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card204" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg204a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">PYTORCH AUTOGRAD COMPUTATION GRAPH &amp; GRAD_FN</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Dynamic Tape-Based Reverse-Mode Automatic Differentiation</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card204)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Input Tensors -->
    <rect x="30" y="40" width="120" height="90" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="90" y="65" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Tensor x</text>
    <text x="90" y="85" fill="#94a3b8" font-size="9" text-anchor="middle">requires_grad=True</text>
    <text x="90" y="105" fill="#f8fafc" font-size="9" text-anchor="middle">Leaf Node (x.is_leaf)</text>

    <rect x="30" y="160" width="120" height="90" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="90" y="185" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Weight W</text>
    <text x="90" y="205" fill="#94a3b8" font-size="9" text-anchor="middle">nn.Parameter</text>
    <text x="90" y="225" fill="#f8fafc" font-size="9" text-anchor="middle">W.grad buffer</text>

    <!-- Operation 1: MatMul -->
    <circle cx="240" cy="145" r="28" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <text x="240" y="142" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">MatMul</text>
    <text x="240" y="158" fill="#94a3b8" font-size="8" text-anchor="middle">MmBackward0</text>

    <!-- Intermediate Tensor z -->
    <rect x="340" y="105" width="130" height="80" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" rx="6"/>
    <text x="405" y="130" fill="#c084fc" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Tensor z = W @ x</text>
    <text x="405" y="150" fill="#94a3b8" font-size="9" text-anchor="middle">Non-leaf Tensor</text>
    <text x="405" y="168" fill="#cbd5e1" font-size="8" text-anchor="middle">z.grad_fn = MmBackward0</text>

    <!-- Operation 2: ReLU & Loss -->
    <circle cx="540" cy="145" r="28" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="540" y="142" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Loss (MSE)</text>
    <text x="540" y="158" fill="#94a3b8" font-size="8" text-anchor="middle">MseBackward0</text>

    <!-- Scalar Output Loss -->
    <rect x="625" y="105" width="110" height="80" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" rx="6"/>
    <text x="680" y="130" fill="#fb7185" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Scalar Loss</text>
    <text x="680" y="150" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">loss.backward()</text>
    <text x="680" y="168" fill="#34d399" font-size="8" text-anchor="middle">Root of Gradient Pass</text>

    <!-- Connecting Arrows -->
    <line x1="150" y1="85" x2="215" y2="130" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="150" y1="205" x2="215" y2="160" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="268" y1="145" x2="340" y2="145" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="470" y1="145" x2="512" y2="145" stroke="#a855f7" stroke-width="1.5"/>
    <line x1="568" y1="145" x2="625" y2="145" stroke="#10b981" stroke-width="1.5"/>

    <!-- Backward Flow Curve -->
    <path d="M 680 195 C 680 260, 240 260, 90 255" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="400" y="275" fill="#fb7185" font-size="10" font-weight="700" text-anchor="middle">&lt;-- BACKWARD PASS: Autograd traverses grad_fn DAG, accumulating gradients in W.grad &lt;--</text>
  </g>
</svg>
