<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1010" role="img"
     aria-labelledby="d140a-title d140a-desc">
  <title id="d140a-title">The arc of a study, stage by stage, with the handoff each stage owes the next</title>
  <desc id="d140a-desc">Nine stages stacked vertically from question to conclusion, each labelled with the
    day that taught it. Beside every connecting arrow is the artefact that stage must hand the next one. A
    manifest lane on the right records a checksum for every artefact produced.</desc>

  <style>
    .d140a-bg    { fill: #f8fafc; }
    .d140a-t     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a202c; }
    .d140a-head  { font-size: 21px; font-weight: 700; }
    .d140a-sub   { font-size: 14px; fill: #475569; }
    .d140a-box   { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d140a-boxend{ fill: #dcfce7; stroke: #15803d; stroke-width: 1.5; }
    .d140a-name  { font-size: 17px; font-weight: 600; }
    .d140a-day   { font-size: 14px; fill: #334155; }
    .d140a-wire  { stroke: #1d4ed8; stroke-width: 2.2; fill: none; }
    .d140a-hand  { font-size: 14px; fill: #1a202c; }
    .d140a-handk { font-weight: 700; fill: #1d4ed8; }
    .d140a-lane  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; }
    .d140a-lanet { font-size: 15px; font-weight: 600; fill: #7c2d12; }
    .d140a-tick  { stroke: #b45309; stroke-width: 1.4; stroke-dasharray: 4 4; }
  </style>

  <rect class="d140a-bg" x="0" y="0" width="960" height="1010"/>

  <text class="d140a-t d140a-head" x="40" y="42">The arc of a study — and what each stage owes the next</text>
  <text class="d140a-t d140a-sub" x="40" y="66">The stages are the skills Course 03 taught. The labels on the arrows are the seams, which is where studies fail.</text>

  <defs>
    <marker id="d140a-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- Stage 1 -->
  <rect class="d140a-box" x="40" y="96" width="300" height="62" rx="6"/>
  <text class="d140a-t d140a-name" x="58" y="126">1. Question</text>
  <text class="d140a-t d140a-day"  x="58" y="146">Days 119, 136 — written before looking</text>
  <path class="d140a-wire" d="M 190 158 L 190 194" marker-end="url(#d140a-arrow)"/>
  <text class="d140a-t d140a-hand" x="372" y="182"><tspan class="d140a-handk">hands over: </tspan>a question in writing, and the decision it would change</text>

  <!-- Stage 2 -->
  <rect class="d140a-box" x="40" y="196" width="300" height="62" rx="6"/>
  <text class="d140a-t d140a-name" x="58" y="226">2. Source and provenance</text>
  <text class="d140a-t d140a-day"  x="58" y="246">Day 134 — licence, dictionary, checksum</text>
  <path class="d140a-wire" d="M 190 258 L 190 294" marker-end="url(#d140a-arrow)"/>
  <text class="d140a-t d140a-hand" x="372" y="282"><tspan class="d140a-handk">hands over: </tspan>a file, a licence, a date, and a digest that matches</text>

  <!-- Stage 3 -->
  <rect class="d140a-box" x="40" y="296" width="300" height="62" rx="6"/>
  <text class="d140a-t d140a-name" x="58" y="326">3. Ingestion</text>
  <text class="d140a-t d140a-day"  x="58" y="346">Day 135 — one row is one thing</text>
  <path class="d140a-wire" d="M 190 358 L 190 394" marker-end="url(#d140a-arrow)"/>
  <text class="d140a-t d140a-hand" x="372" y="382"><tspan class="d140a-handk">hands over: </tspan>a frame with a stated grain, and the check that ran</text>

  <!-- Stage 4 -->
  <rect class="d140a-box" x="40" y="396" width="300" height="62" rx="6"/>
  <text class="d140a-t d140a-name" x="58" y="426">4. Quality and cleaning</text>
  <text class="d140a-t d140a-day"  x="58" y="446">Days 121, 125 — and Week 18's pipeline</text>
  <path class="d140a-wire" d="M 190 458 L 190 494" marker-end="url(#d140a-arrow)"/>
  <text class="d140a-t d140a-hand" x="372" y="482"><tspan class="d140a-handk">hands over: </tspan>a damage report: every step measured before and after</text>

  <!-- Stage 5 -->
  <rect class="d140a-box" x="40" y="496" width="300" height="62" rx="6"/>
  <text class="d140a-t d140a-name" x="58" y="526">5. Exploration</text>
  <text class="d140a-t d140a-day"  x="58" y="546">Day 136 — research log, sealed half</text>
  <path class="d140a-wire" d="M 190 558 L 190 594" marker-end="url(#d140a-arrow)"/>
  <text class="d140a-t d140a-hand" x="372" y="582"><tspan class="d140a-handk">hands over: </tspan>one hypothesis, the count of looks, a sealed half</text>

  <!-- Stage 6 -->
  <rect class="d140a-box" x="40" y="596" width="300" height="62" rx="6"/>
  <text class="d140a-t d140a-name" x="58" y="626">6. Estimate</text>
  <text class="d140a-t d140a-day"  x="58" y="646">Days 117, 118 — the interval, not the point</text>
  <path class="d140a-wire" d="M 190 658 L 190 694" marker-end="url(#d140a-arrow)"/>
  <text class="d140a-t d140a-hand" x="372" y="682"><tspan class="d140a-handk">hands over: </tspan>a number with an interval, and the comparison count</text>

  <!-- Stage 7 -->
  <rect class="d140a-box" x="40" y="696" width="300" height="62" rx="6"/>
  <text class="d140a-t d140a-name" x="58" y="726">7. Visuals</text>
  <text class="d140a-t d140a-day"  x="58" y="746">Days 127–132 — right chart, honest scale</text>
  <path class="d140a-wire" d="M 190 758 L 190 794" marker-end="url(#d140a-arrow)"/>
  <text class="d140a-t d140a-hand" x="372" y="782"><tspan class="d140a-handk">hands over: </tspan>figures that carry the question and the claim</text>

  <!-- Stage 8 -->
  <rect class="d140a-box" x="40" y="796" width="300" height="62" rx="6"/>
  <text class="d140a-t d140a-name" x="58" y="826">8. Report</text>
  <text class="d140a-t d140a-day"  x="58" y="846">Days 133, 138 — the argument and its limits</text>
  <path class="d140a-wire" d="M 190 858 L 190 894" marker-end="url(#d140a-arrow)"/>
  <text class="d140a-t d140a-hand" x="372" y="882"><tspan class="d140a-handk">hands over: </tspan>the frame, the proxies, who is missing, the limits</text>

  <!-- Stage 9 -->
  <rect class="d140a-boxend" x="40" y="896" width="300" height="62" rx="6"/>
  <text class="d140a-t d140a-name" x="58" y="926">9. Conclusion</text>
  <text class="d140a-t d140a-day"  x="58" y="946">Exploratory. Not causal. Names what would be.</text>

  <!-- The manifest lane, running the whole height -->
  <rect class="d140a-lane" x="880" y="96" width="46" height="862" rx="6"/>
  <line class="d140a-tick" x1="344" y1="127" x2="880" y2="127"/>
  <line class="d140a-tick" x1="344" y1="227" x2="880" y2="227"/>
  <line class="d140a-tick" x1="344" y1="327" x2="880" y2="327"/>
  <line class="d140a-tick" x1="344" y1="427" x2="880" y2="427"/>
  <line class="d140a-tick" x1="344" y1="527" x2="880" y2="527"/>
  <line class="d140a-tick" x1="344" y1="627" x2="880" y2="627"/>
  <line class="d140a-tick" x1="344" y1="727" x2="880" y2="727"/>
  <line class="d140a-tick" x1="344" y1="827" x2="880" y2="827"/>
  <line class="d140a-tick" x1="344" y1="927" x2="880" y2="927"/>
  <text class="d140a-t d140a-lanet" x="903" y="527" text-anchor="middle"
        transform="rotate(-90 903 527)">Day 126 — MANIFEST: a SHA-256 for every artefact above</text>

  <text class="d140a-t d140a-sub" x="40" y="988">Every arrow is a place a study can be internally correct and still worthless. The harness checks the arrows.</text>
</svg>
