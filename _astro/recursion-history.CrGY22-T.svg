<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From theory to tooling.">
  <title>Four steps for recursion</title>
  <style>
    .recursion-history-bg   { fill: #f8fafc; }
    .recursion-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recursion-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recursion-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recursion-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recursion-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recursion-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .recursion-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .recursion-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .recursion-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .recursion-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .recursion-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .recursion-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .recursion-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .recursion-history-stage { opacity: 1; }

    .recursion-history-s0 { animation-delay: 0.00s; }
    .recursion-history-e0 { animation-delay: 0.00s; }
    .recursion-history-s1 { animation-delay: 1.28s; }
    .recursion-history-e1 { animation-delay: 1.28s; }
    .recursion-history-s2 { animation-delay: 2.56s; }
    .recursion-history-e2 { animation-delay: 2.56s; }
    .recursion-history-s3 { animation-delay: 3.84s; }
    .recursion-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .recursion-history-conn  { animation: recursion-history-trace 6.4s ease-in-out infinite; }
      .recursion-history-stage { animation: recursion-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes recursion-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes recursion-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .recursion-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .recursion-history-stage { animation: recursion-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes recursion-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="recursion-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="recursion-history-bg" width="980" height="322"/>
  <text class="recursion-history-h1"  x="30" y="40">Four steps for recursion</text>
  <text class="recursion-history-sub" x="30" y="64">From theory to tooling.</text>
  <g class="recursion-history-stage recursion-history-s0">
    <rect class="recursion-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="recursion-history-step" x="44" y="142">01</text>
    <text class="recursion-history-name" x="70" y="142">Recursive definitions in mathematics</text>
    <text class="recursion-history-desc" x="44" y="166">Long before any computer.</text>
  </g>
  <line class="recursion-history-line recursion-history-conn recursion-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#recursion-history-tip)"/>
  <g class="recursion-history-stage recursion-history-s1">
    <rect class="recursion-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="recursion-history-step" x="280" y="142">02</text>
    <text class="recursion-history-name" x="306" y="142">Then languages that allowed self-calls</text>
    <text class="recursion-history-desc" x="280" y="166">Which was not universal early</text>
    <text class="recursion-history-desc" x="280" y="182">on.</text>
  </g>
  <line class="recursion-history-line recursion-history-conn recursion-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#recursion-history-tip)"/>
  <g class="recursion-history-stage recursion-history-s2">
    <rect class="recursion-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="recursion-history-step" x="516" y="142">03</text>
    <text class="recursion-history-name" x="542" y="142">With the stack cost understood as a limit</text>
    <text class="recursion-history-desc" x="516" y="166">And guarded against with a depth</text>
    <text class="recursion-history-desc" x="516" y="182">limit.</text>
  </g>
  <line class="recursion-history-line recursion-history-conn recursion-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#recursion-history-tip)"/>
  <g class="recursion-history-stage recursion-history-s3">
    <rect class="recursion-history-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="recursion-history-step" x="752" y="142">04</text>
    <text class="recursion-history-name" x="778" y="142">And caching offered as a decorator</text>
    <text class="recursion-history-desc" x="752" y="166">Making the standard fix a single</text>
    <text class="recursion-history-desc" x="752" y="182">line.</text>
  </g>
  <text class="recursion-history-sub" x="30" y="304">The standard fix being a one-line decorator is why naive tree recursion is now a teaching example rather than a practical hazard.</text>
</svg>
