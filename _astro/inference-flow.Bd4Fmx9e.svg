<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="d121fTitleId d121fDescId">
  <title id="d121fTitleId">A raw text column being typed two ways: unguarded inference collapses 00123 to 123 and NA to missing, while dtype and keep_default_na pinned keep both intact</title>
  <desc id="d121fDescId">A column of raw text values, "00123" and "NA", is inspected on the left. In the top path, unguarded inference collapses "00123" into the integer 123 and turns "NA" into a missing value, both shown lighting up red as they change. In the bottom path, the same raw column is read again with dtype={"id": "str"} and keep_default_na=False pinned in place, and both values arrive on the right unchanged, shown lighting up green. A caption states that the difference between the two paths is two named arguments, not a different file.</desc>

  <style>
    .d121f-bg      { fill: #f8fafc; }
    .d121f-title   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; fill: #1a202c; }
    .d121f-sub     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #334155; }
    .d121f-label   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; fill: #1a202c; }
    .d121f-small   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #334155; }
    .d121f-mono    { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15px; fill: #1a202c; }
    .d121f-caption { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d121f-src     { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }

    /* Motion 2: wires march along both paths. */
    .d121f-wire {
      fill: none; stroke: #64748b; stroke-width: 2.25;
      stroke-dasharray: 8 6; animation: d121f-march 1.4s linear infinite;
    }
    @keyframes d121f-march { to { stroke-dashoffset: -14; } }

    /* Motion 3: the inference box on the top path pulses, marking the moment of guessing. */
    .d121f-guess {
      fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5;
      animation: d121f-pulse-guess 6s ease-in-out infinite;
    }
    @keyframes d121f-pulse-guess {
      0%, 30%, 100% { fill: #e0e7ff; }
      15%           { fill: #bfdbfe; }
    }

    /* Motion 1a: the top-path result cells light up red once the guess lands wrong. */
    .d121f-wrong {
      fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5;
      animation: d121f-pulse-wrong 6s ease-in-out infinite;
    }
    @keyframes d121f-pulse-wrong {
      0%, 40%   { fill: #f1f5f9; stroke: #94a3b8; }
      55%, 100% { fill: #fee2e2; stroke: #b91c1c; }
    }

    /* Motion 1b: the bottom-path result cells light up green once the pinned read lands right. */
    .d121f-right {
      fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5;
      animation: d121f-pulse-right 6s ease-in-out infinite;
    }
    @keyframes d121f-pulse-right {
      0%, 40%   { fill: #f1f5f9; stroke: #94a3b8; }
      55%, 100% { fill: #dcfce7; stroke: #047857; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d121f-wire   { animation: none; stroke-dasharray: none; }
      .d121f-guess  { animation: none; fill: #e0e7ff; }
      .d121f-wrong  { animation: none; fill: #fee2e2; stroke: #b91c1c; }
      .d121f-right  { animation: none; fill: #dcfce7; stroke: #047857; }
    }
  </style>

  <rect class="d121f-bg" x="0" y="0" width="1000" height="560" />

  <text class="d121f-title" x="32" y="42">Same raw column, two reads: unguarded inference guesses; dtype and keep_default_na pin it</text>
  <text class="d121f-sub" x="32" y="66">The difference between the two rows below is two named arguments -- not a different file</text>

  <!-- Shared source column -->
  <text class="d121f-label" x="120" y="106" text-anchor="middle">raw text</text>
  <rect class="d121f-src" x="40" y="118" width="160" height="40" />
  <text class="d121f-mono" x="60" y="143">id: "00123"</text>
  <rect class="d121f-src" x="40" y="162" width="160" height="40" />
  <text class="d121f-mono" x="60" y="187">code: "NA"</text>

  <!-- TOP PATH: unguarded inference -->
  <text class="d121f-label" x="500" y="106" text-anchor="middle">read_csv(path)  -- no guard, pandas guesses</text>
  <rect class="d121f-guess" x="420" y="118" width="160" height="84" />
  <text class="d121f-small" x="500" y="145" text-anchor="middle">inference stage</text>
  <text class="d121f-small" x="500" y="163" text-anchor="middle">int64? na_values?</text>
  <text class="d121f-small" x="500" y="181" text-anchor="middle">guesses once, silently</text>

  <path class="d121f-wire" d="M 200 138 L 420 145" />
  <path class="d121f-wire" d="M 200 182 L 420 175" />

  <rect class="d121f-wrong" x="740" y="118" width="200" height="40" />
  <text class="d121f-mono" x="760" y="143">id = 123</text>
  <text class="d121f-small" x="880" y="143">(leading zeros GONE)</text>
  <rect class="d121f-wrong" x="740" y="162" width="200" height="40" />
  <text class="d121f-mono" x="760" y="187">code = NaN</text>
  <text class="d121f-small" x="900" y="187">(missing!)</text>

  <path class="d121f-wire" d="M 580 145 L 740 138" />
  <path class="d121f-wire" d="M 580 175 L 740 182" />

  <!-- BOTTOM PATH: pinned read -->
  <text class="d121f-label" x="500" y="280" text-anchor="middle">read_csv(path, dtype={"id":"str"}, keep_default_na=False)</text>
  <rect class="d121f-guess" x="420" y="292" width="160" height="84" fill="#dbeafe" />
  <text class="d121f-small" x="500" y="319" text-anchor="middle">inference stage</text>
  <text class="d121f-small" x="500" y="337" text-anchor="middle">both decisions PINNED</text>
  <text class="d121f-small" x="500" y="355" text-anchor="middle">nothing left to guess</text>

  <path class="d121f-wire" d="M 200 138 L 420 312" />
  <path class="d121f-wire" d="M 200 182 L 420 348" />

  <rect class="d121f-right" x="740" y="292" width="200" height="40" />
  <text class="d121f-mono" x="760" y="317">id = "00123"</text>
  <text class="d121f-small" x="900" y="317">(intact)</text>
  <rect class="d121f-right" x="740" y="336" width="200" height="40" />
  <text class="d121f-mono" x="760" y="361">code = "NA"</text>
  <text class="d121f-small" x="900" y="361">(intact)</text>

  <path class="d121f-wire" d="M 580 319 L 740 312" />
  <path class="d121f-wire" d="M 580 349 L 740 356" />

  <text class="d121f-caption" x="32" y="420">Top: guessing collapses "00123" to 123 and turns Namibia's "NA" into a missing value -- no error, no warning.</text>
  <text class="d121f-caption" x="32" y="444">Bottom: naming dtype and keep_default_na keeps both values exactly as the file wrote them, every time.</text>

  <!-- Static legend for reduced-motion readers -->
  <rect x="32" y="470" width="18" height="18" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5" />
  <text class="d121f-small" x="58" y="484">changed by unguarded inference</text>
  <rect x="332" y="470" width="18" height="18" fill="#dcfce7" stroke="#047857" stroke-width="1.5" />
  <text class="d121f-small" x="358" y="484">preserved exactly by a pinned read</text>
</svg>
