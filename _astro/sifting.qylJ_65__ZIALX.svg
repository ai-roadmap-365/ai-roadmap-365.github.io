<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two different tools.">
  <title>A wide net, then a careful sort</title>
  <style>
    .sifting-bg   { fill: #f8fafc; }
    .sifting-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sifting-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sifting-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sifting-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sifting-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sifting-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sifting-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sifting-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sifting-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sifting-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sifting-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sifting-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sifting-row { opacity: 1; }
    .sifting-r0 { animation-delay: 0.00s; }
    .sifting-r1 { animation-delay: 0.45s; }
    .sifting-r2 { animation-delay: 0.90s; }
    .sifting-r3 { animation-delay: 1.35s; }
    .sifting-r4 { animation-delay: 1.80s; }
    .sifting-row { animation: sifting-reveal 7.3s ease-in-out infinite; }
    @keyframes sifting-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="sifting-bg" width="980" height="390"/>
  <text class="sifting-h1"  x="30" y="40">A wide net, then a careful sort</text>
  <text class="sifting-sub" x="30" y="64">Two different tools.</text>
  <rect class="sifting-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="sifting-name" x="46" y="122">The wide net</text>
  <text class="sifting-desc" x="46" y="142">Catch everything plausible.</text>
  <text class="sifting-desc sifting-row sifting-r0" x="46" y="182">Fast, and indiscriminate</text>
  <text class="sifting-desc sifting-row sifting-r1" x="46" y="216">Brings in far too much</text>
  <text class="sifting-desc sifting-row sifting-r2" x="46" y="250">Cheap per item</text>
  <text class="sifting-desc sifting-row sifting-r3" x="46" y="284">Misses very little</text>
  <text class="sifting-desc sifting-row sifting-r4" x="46" y="318">This is retrieval</text>
  <rect class="sifting-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="sifting-name" x="526" y="122">The careful sort</text>
  <text class="sifting-desc" x="526" y="142">Keep what is right.</text>
  <text class="sifting-desc sifting-row sifting-r0" x="526" y="182">Slow, and precise</text>
  <text class="sifting-desc sifting-row sifting-r1" x="526" y="216">Examines each one properly</text>
  <text class="sifting-desc sifting-row sifting-r2" x="526" y="250">Expensive per item</text>
  <text class="sifting-desc sifting-row sifting-r3" x="526" y="284">Only feasible on a small pile</text>
  <text class="sifting-desc sifting-row sifting-r4" x="526" y="318">This is reranking</text>
  <text class="sifting-sub" x="30" y="372">Neither step works alone, which is the whole design: the net cannot judge and the sorter cannot search.</text>
</svg>
