<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four things it shows.">
  <title>Reading a dendrogram</title>
  <style>
    .dendrogram-bg   { fill: #f8fafc; }
    .dendrogram-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dendrogram-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dendrogram-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dendrogram-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dendrogram-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dendrogram-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dendrogram-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dendrogram-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dendrogram-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dendrogram-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dendrogram-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dendrogram-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .dendrogram-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .dendrogram-stage { opacity: 1; }

    .dendrogram-s0 { animation-delay: 0.00s; }
    .dendrogram-e0 { animation-delay: 0.00s; }
    .dendrogram-s1 { animation-delay: 1.28s; }
    .dendrogram-e1 { animation-delay: 1.28s; }
    .dendrogram-s2 { animation-delay: 2.56s; }
    .dendrogram-e2 { animation-delay: 2.56s; }
    .dendrogram-s3 { animation-delay: 3.84s; }
    .dendrogram-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .dendrogram-conn  { animation: dendrogram-trace 6.4s ease-in-out infinite; }
      .dendrogram-stage { animation: dendrogram-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes dendrogram-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes dendrogram-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .dendrogram-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .dendrogram-stage { animation: dendrogram-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes dendrogram-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="dendrogram-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="dendrogram-bg" width="980" height="322"/>
  <text class="dendrogram-h1"  x="30" y="40">Reading a dendrogram</text>
  <text class="dendrogram-sub" x="30" y="64">Four things it shows.</text>
  <g class="dendrogram-stage dendrogram-s0">
    <rect class="dendrogram-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="dendrogram-step" x="44" y="142">01</text>
    <text class="dendrogram-name" x="70" y="142">The height of each merge is the distance at which it happened</text>
    <text class="dendrogram-desc" x="44" y="166">Low merges are tight groups.</text>
  </g>
  <line class="dendrogram-line dendrogram-conn dendrogram-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#dendrogram-tip)"/>
  <g class="dendrogram-stage dendrogram-s1">
    <rect class="dendrogram-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="dendrogram-step" x="280" y="142">02</text>
    <text class="dendrogram-name" x="306" y="142">A horizontal cut gives a partition</text>
    <text class="dendrogram-desc" x="280" y="166">At whatever number of clusters</text>
    <text class="dendrogram-desc" x="280" y="182">you choose.</text>
  </g>
  <line class="dendrogram-line dendrogram-conn dendrogram-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#dendrogram-tip)"/>
  <g class="dendrogram-stage dendrogram-s2">
    <rect class="dendrogram-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="dendrogram-step" x="516" y="142">03</text>
    <text class="dendrogram-name" x="542" y="142">A long vertical gap suggests a natural cut</text>
    <text class="dendrogram-desc" x="516" y="166">Clusters that stayed separate</text>
    <text class="dendrogram-desc" x="516" y="182">for a long range.</text>
  </g>
  <line class="dendrogram-line dendrogram-conn dendrogram-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#dendrogram-tip)"/>
  <g class="dendrogram-stage dendrogram-s3">
    <rect class="dendrogram-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="dendrogram-step" x="752" y="142">04</text>
    <text class="dendrogram-name" x="778" y="142">And short gaps suggest the structure is weak there</text>
    <text class="dendrogram-desc" x="752" y="166">Which is information k-means</text>
    <text class="dendrogram-desc" x="752" y="182">cannot give you.</text>
  </g>
  <text class="dendrogram-sub" x="30" y="304">The long vertical gap is the closest thing to a natural cluster count that any of these methods offers, and it is visible rather than inferred.</text>
</svg>
