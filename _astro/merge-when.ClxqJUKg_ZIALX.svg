<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the goal.">
  <title>Which operation when</title>
  <style>
    .merge-when-bg   { fill: #f8fafc; }
    .merge-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .merge-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .merge-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .merge-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .merge-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .merge-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .merge-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .merge-when-row { opacity: 1; }
    .merge-when-r0 { animation-delay: 0.00s; }
    .merge-when-r1 { animation-delay: 0.45s; }
    .merge-when-r2 { animation-delay: 0.90s; }
    .merge-when-r3 { animation-delay: 1.35s; }
    .merge-when-r4 { animation-delay: 1.80s; }
    .merge-when-row { animation: merge-when-reveal 7.3s ease-in-out infinite; }
    @keyframes merge-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="merge-when-bg" width="980" height="390"/>
  <text class="merge-when-h1"  x="30" y="40">Which operation when</text>
  <text class="merge-when-sub" x="30" y="64">By the goal.</text>
  <rect class="merge-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="merge-when-name" x="46" y="122">The goal</text>
  <text class="merge-when-desc" x="46" y="142">What you want.</text>
  <text class="merge-when-desc merge-when-row merge-when-r0" x="46" y="182">Add columns from a related table</text>
  <text class="merge-when-desc merge-when-row merge-when-r1" x="46" y="216">Stack rows from the same structure</text>
  <text class="merge-when-desc merge-when-row merge-when-r2" x="46" y="250">Prepare data for plotting or modelling</text>
  <text class="merge-when-desc merge-when-row merge-when-r3" x="46" y="284">Produce a readable summary table</text>
  <text class="merge-when-desc merge-when-row merge-when-r4" x="46" y="318">Combine files from several periods</text>
  <rect class="merge-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="merge-when-name" x="526" y="122">The operation</text>
  <text class="merge-when-desc" x="526" y="142">What to use.</text>
  <text class="merge-when-desc merge-when-row merge-when-r0" x="526" y="182">A merge on a key</text>
  <text class="merge-when-desc merge-when-row merge-when-r1" x="526" y="216">Concatenation</text>
  <text class="merge-when-desc merge-when-row merge-when-r2" x="526" y="250">Melt to long form</text>
  <text class="merge-when-desc merge-when-row merge-when-r3" x="526" y="284">Pivot to wide form</text>
  <text class="merge-when-desc merge-when-row merge-when-r4" x="526" y="318">Concatenation, with a source column</text>
  <text class="merge-when-sub" x="30" y="372">Adding a source column when concatenating files is a small step that preserves provenance, and it is invariably wanted later when a number looks wrong.</text>
</svg>
