<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Weights are safe; the bundle is not only weights.">
  <title>The rest of the bundle</title>
  <style>
    .bundle-hazards-bg   { fill: #f8fafc; }
    .bundle-hazards-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bundle-hazards-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bundle-hazards-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bundle-hazards-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bundle-hazards-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bundle-hazards-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bundle-hazards-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bundle-hazards-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bundle-hazards-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bundle-hazards-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bundle-hazards-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bundle-hazards-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .bundle-hazards-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .bundle-hazards-stage { opacity: 1; }

    .bundle-hazards-s0 { animation-delay: 0.00s; }
    .bundle-hazards-e0 { animation-delay: 0.00s; }
    .bundle-hazards-s1 { animation-delay: 1.50s; }
    .bundle-hazards-e1 { animation-delay: 1.50s; }
    .bundle-hazards-s2 { animation-delay: 3.00s; }
    .bundle-hazards-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .bundle-hazards-conn  { animation: bundle-hazards-trace 6s ease-in-out infinite; }
      .bundle-hazards-stage { animation: bundle-hazards-arrive 6s ease-in-out infinite; }
    }
    @keyframes bundle-hazards-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes bundle-hazards-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .bundle-hazards-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .bundle-hazards-stage { animation: bundle-hazards-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes bundle-hazards-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="bundle-hazards-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="bundle-hazards-bg" width="980" height="322"/>
  <text class="bundle-hazards-h1"  x="30" y="40">The rest of the bundle</text>
  <text class="bundle-hazards-sub" x="30" y="64">Weights are safe; the bundle is not only weights.</text>
  <g class="bundle-hazards-stage bundle-hazards-s0">
    <rect class="bundle-hazards-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="bundle-hazards-step" x="44" y="142">01</text>
    <text class="bundle-hazards-name" x="70" y="142">tokenizer.json, vocab.json</text>
    <text class="bundle-hazards-desc" x="44" y="166">Not weights, and shipped alongside them.</text>
  </g>
  <line class="bundle-hazards-line bundle-hazards-conn bundle-hazards-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#bundle-hazards-tip)"/>
  <g class="bundle-hazards-stage bundle-hazards-s1">
    <rect class="bundle-hazards-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="bundle-hazards-step" x="359" y="142">02</text>
    <text class="bundle-hazards-name" x="385" y="142">Homoglyphs and control characters</text>
    <text class="bundle-hazards-desc" x="359" y="166">Injected into a vocabulary to manipulate</text>
    <text class="bundle-hazards-desc" x="359" y="182">downstream parsing.</text>
  </g>
  <line class="bundle-hazards-line bundle-hazards-conn bundle-hazards-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#bundle-hazards-tip)"/>
  <g class="bundle-hazards-stage bundle-hazards-s2">
    <rect class="bundle-hazards-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="bundle-hazards-step" x="674" y="142">03</text>
    <text class="bundle-hazards-name" x="700" y="142">Enforce a strict schema</text>
    <text class="bundle-hazards-desc" x="674" y="166">Contiguous positive token IDs, special tokens</text>
    <text class="bundle-hazards-desc" x="674" y="182">matching an expected pattern.</text>
  </g>
  <text class="bundle-hazards-sub" x="30" y="304">This is the predictable consequence of fixing the weights format: attention moves to whatever in the bundle is still parsed loosely, and a vocabulary file is parsed by everything downstream.</text>
</svg>
