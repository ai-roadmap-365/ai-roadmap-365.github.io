<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Keep both, clearly separated.">
  <title>A plan is not a backlog</title>
  <style>
    .plan-versus-backlog-bg   { fill: #f8fafc; }
    .plan-versus-backlog-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .plan-versus-backlog-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .plan-versus-backlog-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .plan-versus-backlog-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .plan-versus-backlog-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .plan-versus-backlog-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .plan-versus-backlog-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .plan-versus-backlog-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .plan-versus-backlog-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .plan-versus-backlog-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .plan-versus-backlog-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .plan-versus-backlog-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .plan-versus-backlog-row { opacity: 1; }
    .plan-versus-backlog-r0 { animation-delay: 0.00s; }
    .plan-versus-backlog-r1 { animation-delay: 0.45s; }
    .plan-versus-backlog-r2 { animation-delay: 0.90s; }
    .plan-versus-backlog-r3 { animation-delay: 1.35s; }
    .plan-versus-backlog-r4 { animation-delay: 1.80s; }
    .plan-versus-backlog-row { animation: plan-versus-backlog-reveal 7.3s ease-in-out infinite; }
    @keyframes plan-versus-backlog-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="plan-versus-backlog-bg" width="980" height="390"/>
  <text class="plan-versus-backlog-h1"  x="30" y="40">A plan is not a backlog</text>
  <text class="plan-versus-backlog-sub" x="30" y="64">Keep both, clearly separated.</text>
  <rect class="plan-versus-backlog-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="plan-versus-backlog-name" x="46" y="122">A plan</text>
  <text class="plan-versus-backlog-desc" x="46" y="142">Hours are committed.</text>
  <text class="plan-versus-backlog-desc plan-versus-backlog-row plan-versus-backlog-r0" x="46" y="182">Short by construction</text>
  <text class="plan-versus-backlog-desc plan-versus-backlog-row plan-versus-backlog-r1" x="46" y="216">Everything in it is costed</text>
  <text class="plan-versus-backlog-desc plan-versus-backlog-row plan-versus-backlog-r2" x="46" y="250">Each item has a next action</text>
  <text class="plan-versus-backlog-desc plan-versus-backlog-row plan-versus-backlog-r3" x="46" y="284">Re-checked every quarter</text>
  <text class="plan-versus-backlog-desc plan-versus-backlog-row plan-versus-backlog-r4" x="46" y="318">What you will do on Monday</text>
  <rect class="plan-versus-backlog-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="plan-versus-backlog-name" x="526" y="122">A backlog</text>
  <text class="plan-versus-backlog-desc" x="526" y="142">Arbitrarily long.</text>
  <text class="plan-versus-backlog-desc plan-versus-backlog-row plan-versus-backlog-r0" x="526" y="182">Everything you might do</text>
  <text class="plan-versus-backlog-desc plan-versus-backlog-row plan-versus-backlog-r1" x="526" y="216">Nothing in it is costed</text>
  <text class="plan-versus-backlog-desc plan-versus-backlog-row plan-versus-backlog-r2" x="526" y="250">Items can be topics</text>
  <text class="plan-versus-backlog-desc plan-versus-backlog-row plan-versus-backlog-r3" x="526" y="284">Grows without limit, harmlessly</text>
  <text class="plan-versus-backlog-desc plan-versus-backlog-row plan-versus-backlog-r4" x="526" y="318">Where an idea waits</text>
  <text class="plan-versus-backlog-sub" x="30" y="372">Keeping both is fine and keeping them in one document is not: an uncosted backlog placed beside a costed plan quietly becomes the plan, and the arithmetic is lost without anyone deciding to lose it.</text>
</svg>
