<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>What sampling gives you</title>
  <style>
    .sample-idea-bg   { fill: #f8fafc; }
    .sample-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sample-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sample-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sample-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sample-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sample-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sample-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sample-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sample-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sample-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sample-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sample-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .sample-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .sample-idea-stage { opacity: 1; }

    .sample-idea-s0 { animation-delay: 0.00s; }
    .sample-idea-e0 { animation-delay: 0.00s; }
    .sample-idea-s1 { animation-delay: 1.28s; }
    .sample-idea-e1 { animation-delay: 1.28s; }
    .sample-idea-s2 { animation-delay: 2.56s; }
    .sample-idea-e2 { animation-delay: 2.56s; }
    .sample-idea-s3 { animation-delay: 3.84s; }
    .sample-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .sample-idea-conn  { animation: sample-idea-trace 6.4s ease-in-out infinite; }
      .sample-idea-stage { animation: sample-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes sample-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes sample-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .sample-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .sample-idea-stage { animation: sample-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes sample-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="sample-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="sample-idea-bg" width="980" height="322"/>
  <text class="sample-idea-h1"  x="30" y="40">What sampling gives you</text>
  <text class="sample-idea-sub" x="30" y="64">Four steps.</text>
  <g class="sample-idea-stage sample-idea-s0">
    <rect class="sample-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="sample-idea-step" x="44" y="142">01</text>
    <text class="sample-idea-name" x="70" y="142">A population you cannot measure entirely</text>
    <text class="sample-idea-desc" x="44" y="166">Too large, or not yet observed.</text>
  </g>
  <line class="sample-idea-line sample-idea-conn sample-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#sample-idea-tip)"/>
  <g class="sample-idea-stage sample-idea-s1">
    <rect class="sample-idea-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="sample-idea-step" x="280" y="142">02</text>
    <text class="sample-idea-name" x="306" y="142">A sample drawn from it, ideally at random</text>
    <text class="sample-idea-desc" x="280" y="166">Which is the critical word.</text>
  </g>
  <line class="sample-idea-line sample-idea-conn sample-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#sample-idea-tip)"/>
  <g class="sample-idea-stage sample-idea-s2">
    <rect class="sample-idea-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="sample-idea-step" x="516" y="142">03</text>
    <text class="sample-idea-name" x="542" y="142">A statistic computed from the sample</text>
    <text class="sample-idea-desc" x="516" y="166">Which estimates the population</text>
    <text class="sample-idea-desc" x="516" y="182">value.</text>
  </g>
  <line class="sample-idea-line sample-idea-conn sample-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#sample-idea-tip)"/>
  <g class="sample-idea-stage sample-idea-s3">
    <rect class="sample-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="sample-idea-step" x="752" y="142">04</text>
    <text class="sample-idea-name" x="778" y="142">And a quantified uncertainty around it</text>
    <text class="sample-idea-desc" x="752" y="166">Because a different sample would</text>
    <text class="sample-idea-desc" x="752" y="182">differ.</text>
  </g>
  <text class="sample-idea-sub" x="30" y="304">Randomness in the drawing is what licenses the whole inference, and a sample gathered conveniently supports no such conclusion however large it is.</text>
</svg>
