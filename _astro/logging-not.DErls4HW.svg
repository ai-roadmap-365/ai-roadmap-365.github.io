<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things logging and configuration are not</title>
  <style>
    .logging-not-bg   { fill: #f8fafc; }
    .logging-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .logging-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .logging-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .logging-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .logging-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .logging-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .logging-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .logging-not-row { opacity: 1; }
    .logging-not-r0 { animation-delay: 0.00s; }
    .logging-not-r1 { animation-delay: 0.45s; }
    .logging-not-r2 { animation-delay: 0.90s; }
    .logging-not-r3 { animation-delay: 1.35s; }
    .logging-not-r4 { animation-delay: 1.80s; }
    .logging-not-row { animation: logging-not-reveal 7.3s ease-in-out infinite; }
    @keyframes logging-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="logging-not-bg" width="980" height="390"/>
  <text class="logging-not-h1"  x="30" y="40">Four things logging and configuration are not</text>
  <text class="logging-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="logging-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="logging-not-name" x="46" y="122">The misconception</text>
  <text class="logging-not-desc" x="46" y="142">Commonly held.</text>
  <text class="logging-not-desc logging-not-row logging-not-r0" x="46" y="182">Printing is good enough</text>
  <text class="logging-not-desc logging-not-row logging-not-r1" x="46" y="216">Logging everything is safest</text>
  <text class="logging-not-desc logging-not-row logging-not-r2" x="46" y="250">Configuration belongs in the code</text>
  <text class="logging-not-desc logging-not-row logging-not-r3" x="46" y="284">Logs are internal, so anything can go in</text>
  <text class="logging-not-desc logging-not-row logging-not-r4" x="46" y="318">More logging is always better</text>
  <rect class="logging-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="logging-not-name" x="526" y="122">What is true</text>
  <text class="logging-not-desc" x="526" y="142">Actually.</text>
  <text class="logging-not-desc logging-not-row logging-not-r0" x="526" y="182">No levels, no destinations, no context</text>
  <text class="logging-not-desc logging-not-row logging-not-r1" x="526" y="216">Volume hides the important records</text>
  <text class="logging-not-desc logging-not-row logging-not-r2" x="526" y="250">It differs per environment</text>
  <text class="logging-not-desc logging-not-row logging-not-r3" x="526" y="284">Logs get shipped, stored and read widely</text>
  <text class="logging-not-desc logging-not-row logging-not-r4" x="526" y="318">Volume costs money and hides signal</text>
  <text class="logging-not-sub" x="30" y="372">Logs being shipped and stored widely is the reason personal data and credentials must never be logged: a log line outlives the request by years.</text>
</svg>
