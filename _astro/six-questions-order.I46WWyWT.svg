<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A reader has them in this sequence.">
  <title>Six questions, in the order they arrive</title>
  <style>
    .six-questions-order-bg   { fill: #f8fafc; }
    .six-questions-order-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .six-questions-order-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .six-questions-order-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .six-questions-order-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .six-questions-order-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .six-questions-order-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .six-questions-order-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .six-questions-order-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .six-questions-order-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .six-questions-order-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .six-questions-order-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .six-questions-order-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .six-questions-order-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .six-questions-order-stage { opacity: 1; }

    .six-questions-order-s0 { animation-delay: 0.00s; }
    .six-questions-order-e0 { animation-delay: 0.00s; }
    .six-questions-order-s1 { animation-delay: 1.37s; }
    .six-questions-order-e1 { animation-delay: 1.37s; }
    .six-questions-order-s2 { animation-delay: 2.74s; }
    .six-questions-order-e2 { animation-delay: 2.74s; }
    .six-questions-order-s3 { animation-delay: 4.11s; }
    .six-questions-order-e3 { animation-delay: 4.11s; }
    .six-questions-order-s4 { animation-delay: 5.49s; }
    .six-questions-order-e4 { animation-delay: 5.49s; }
    .six-questions-order-s5 { animation-delay: 6.86s; }
    .six-questions-order-e5 { animation-delay: 6.86s; }
    @media (prefers-reduced-motion: no-preference) {
      .six-questions-order-conn  { animation: six-questions-order-trace 9.600000000000001s ease-in-out infinite; }
      .six-questions-order-stage { animation: six-questions-order-arrive 9.600000000000001s ease-in-out infinite; }
    }
    @keyframes six-questions-order-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes six-questions-order-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .six-questions-order-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .six-questions-order-stage { animation: six-questions-order-settle 9.600000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes six-questions-order-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="six-questions-order-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="six-questions-order-bg" width="980" height="322"/>
  <text class="six-questions-order-h1"  x="30" y="40">Six questions, in the order they arrive</text>
  <text class="six-questions-order-sub" x="30" y="64">A reader has them in this sequence.</text>
  <g class="six-questions-order-stage six-questions-order-s0">
    <rect class="six-questions-order-box" x="30" y="118" width="131" height="104" rx="10"/>
    <text class="six-questions-order-step" x="44" y="142">01</text>
    <text class="six-questions-order-name" x="70" y="142">What does this do?</text>
    <text class="six-questions-order-desc" x="44" y="166">Two sentences,</text>
    <text class="six-questions-order-desc" x="44" y="182">before anything</text>
    <text class="six-questions-order-desc" x="44" y="198">else.</text>
  </g>
  <line class="six-questions-order-line six-questions-order-conn six-questions-order-e0" x1="163" y1="170" x2="185" y2="170" marker-end="url(#six-questions-order-tip)"/>
  <g class="six-questions-order-stage six-questions-order-s1">
    <rect class="six-questions-order-box" x="187" y="118" width="131" height="104" rx="10"/>
    <text class="six-questions-order-step" x="201" y="142">02</text>
    <text class="six-questions-order-name" x="227" y="142">How do I install it?</text>
    <text class="six-questions-order-desc" x="201" y="166">Exact commands, not</text>
    <text class="six-questions-order-desc" x="201" y="182">a description of</text>
    <text class="six-questions-order-desc" x="201" y="198">commands.</text>
    <text class="six-questions-order-edge" x="201" y="242">checkable</text>
  </g>
  <line class="six-questions-order-line six-questions-order-conn six-questions-order-e1" x1="320" y1="170" x2="342" y2="170" marker-end="url(#six-questions-order-tip)"/>
  <g class="six-questions-order-stage six-questions-order-s2">
    <rect class="six-questions-order-box" x="344" y="118" width="131" height="104" rx="10"/>
    <text class="six-questions-order-step" x="358" y="142">03</text>
    <text class="six-questions-order-name" x="384" y="142">How do I run it, and what should I see?</text>
    <text class="six-questions-order-desc" x="358" y="166">The expected output,</text>
    <text class="six-questions-order-desc" x="358" y="182">so they can tell</text>
    <text class="six-questions-order-desc" x="358" y="198">success from</text>
    <text class="six-questions-order-edge" x="358" y="242">checkable</text>
  </g>
  <line class="six-questions-order-line six-questions-order-conn six-questions-order-e2" x1="477" y1="170" x2="499" y2="170" marker-end="url(#six-questions-order-tip)"/>
  <g class="six-questions-order-stage six-questions-order-s3">
    <rect class="six-questions-order-box" x="501" y="118" width="131" height="104" rx="10"/>
    <text class="six-questions-order-step" x="515" y="142">04</text>
    <text class="six-questions-order-name" x="541" y="142">How does it fit together?</text>
    <text class="six-questions-order-desc" x="515" y="166">Enough architecture</text>
    <text class="six-questions-order-desc" x="515" y="182">to reason about a</text>
    <text class="six-questions-order-desc" x="515" y="198">problem.</text>
  </g>
  <line class="six-questions-order-line six-questions-order-conn six-questions-order-e3" x1="634" y1="170" x2="656" y2="170" marker-end="url(#six-questions-order-tip)"/>
  <g class="six-questions-order-stage six-questions-order-s4">
    <rect class="six-questions-order-warn" x="658" y="118" width="131" height="104" rx="10"/>
    <text class="six-questions-order-step" x="672" y="142">05</text>
    <text class="six-questions-order-name" x="698" y="142">What can it not do?</text>
    <text class="six-questions-order-desc" x="672" y="166">Stated, not implied.</text>
    <text class="six-questions-order-desc" x="672" y="182">The section people</text>
    <text class="six-questions-order-desc" x="672" y="198">skip.</text>
  </g>
  <line class="six-questions-order-line six-questions-order-conn six-questions-order-e4" x1="791" y1="170" x2="813" y2="170" marker-end="url(#six-questions-order-tip)"/>
  <g class="six-questions-order-stage six-questions-order-s5">
    <rect class="six-questions-order-good" x="815" y="118" width="131" height="104" rx="10"/>
    <text class="six-questions-order-step" x="829" y="142">06</text>
    <text class="six-questions-order-name" x="855" y="142">What do I do when it breaks?</text>
    <text class="six-questions-order-desc" x="829" y="166">The failures you</text>
    <text class="six-questions-order-desc" x="829" y="182">already know about.</text>
  </g>
  <text class="six-questions-order-sub" x="30" y="304">Answering them out of order is the commonest structural fault: an architecture diagram above the install command asks the reader to understand a system they have not yet run.</text>
</svg>
