<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Different purposes.">
  <title>Your evaluation against a public benchmark</title>
  <style>
    .eval-vs-benchmark-bg   { fill: #f8fafc; }
    .eval-vs-benchmark-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-vs-benchmark-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-vs-benchmark-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-vs-benchmark-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-vs-benchmark-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-vs-benchmark-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eval-vs-benchmark-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eval-vs-benchmark-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eval-vs-benchmark-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eval-vs-benchmark-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eval-vs-benchmark-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eval-vs-benchmark-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eval-vs-benchmark-row { opacity: 1; }
    .eval-vs-benchmark-r0 { animation-delay: 0.00s; }
    .eval-vs-benchmark-r1 { animation-delay: 0.45s; }
    .eval-vs-benchmark-r2 { animation-delay: 0.90s; }
    .eval-vs-benchmark-r3 { animation-delay: 1.35s; }
    .eval-vs-benchmark-r4 { animation-delay: 1.80s; }
    .eval-vs-benchmark-row { animation: eval-vs-benchmark-reveal 7.3s ease-in-out infinite; }
    @keyframes eval-vs-benchmark-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="eval-vs-benchmark-bg" width="980" height="390"/>
  <text class="eval-vs-benchmark-h1"  x="30" y="40">Your evaluation against a public benchmark</text>
  <text class="eval-vs-benchmark-sub" x="30" y="64">Different purposes.</text>
  <rect class="eval-vs-benchmark-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="eval-vs-benchmark-name" x="46" y="122">Your evaluation</text>
  <text class="eval-vs-benchmark-desc" x="46" y="142">Decides what you ship.</text>
  <text class="eval-vs-benchmark-desc eval-vs-benchmark-row eval-vs-benchmark-r0" x="46" y="182">Your examples, your criteria</text>
  <text class="eval-vs-benchmark-desc eval-vs-benchmark-row eval-vs-benchmark-r1" x="46" y="216">Not in anyone's training data</text>
  <text class="eval-vs-benchmark-desc eval-vs-benchmark-row eval-vs-benchmark-r2" x="46" y="250">Measures your task</text>
  <text class="eval-vs-benchmark-desc eval-vs-benchmark-row eval-vs-benchmark-r3" x="46" y="284">Catches regressions on model updates</text>
  <text class="eval-vs-benchmark-desc eval-vs-benchmark-row eval-vs-benchmark-r4" x="46" y="318">Improves as you collect more</text>
  <rect class="eval-vs-benchmark-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="eval-vs-benchmark-name" x="526" y="122">A public benchmark</text>
  <text class="eval-vs-benchmark-desc" x="526" y="142">Ranks models generally.</text>
  <text class="eval-vs-benchmark-desc eval-vs-benchmark-row eval-vs-benchmark-r0" x="526" y="182">Standard examples, standard criteria</text>
  <text class="eval-vs-benchmark-desc eval-vs-benchmark-row eval-vs-benchmark-r1" x="526" y="216">Very likely in the training data</text>
  <text class="eval-vs-benchmark-desc eval-vs-benchmark-row eval-vs-benchmark-r2" x="526" y="250">Measures a proxy task</text>
  <text class="eval-vs-benchmark-desc eval-vs-benchmark-row eval-vs-benchmark-r3" x="526" y="284">Comparable across the industry</text>
  <text class="eval-vs-benchmark-desc eval-vs-benchmark-row eval-vs-benchmark-r4" x="526" y="318">And saturates within a year or two</text>
  <text class="eval-vs-benchmark-sub" x="30" y="372">Contamination is the decisive difference: a benchmark published years ago is in every model's training corpus, and the score measures memorisation as much as capability.</text>
</svg>
