<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each changes something different.">
  <title>Three stages after pretraining</title>
  <style>
    .alignment-stages-bg   { fill: #f8fafc; }
    .alignment-stages-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .alignment-stages-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .alignment-stages-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .alignment-stages-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .alignment-stages-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .alignment-stages-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .alignment-stages-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .alignment-stages-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .alignment-stages-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .alignment-stages-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .alignment-stages-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .alignment-stages-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .alignment-stages-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .alignment-stages-stage { opacity: 1; }

    .alignment-stages-s0 { animation-delay: 0.00s; }
    .alignment-stages-e0 { animation-delay: 0.00s; }
    .alignment-stages-s1 { animation-delay: 1.50s; }
    .alignment-stages-e1 { animation-delay: 1.50s; }
    .alignment-stages-s2 { animation-delay: 3.00s; }
    .alignment-stages-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .alignment-stages-conn  { animation: alignment-stages-trace 6s ease-in-out infinite; }
      .alignment-stages-stage { animation: alignment-stages-arrive 6s ease-in-out infinite; }
    }
    @keyframes alignment-stages-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes alignment-stages-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .alignment-stages-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .alignment-stages-stage { animation: alignment-stages-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes alignment-stages-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="alignment-stages-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="alignment-stages-bg" width="980" height="322"/>
  <text class="alignment-stages-h1"  x="30" y="40">Three stages after pretraining</text>
  <text class="alignment-stages-sub" x="30" y="64">Each changes something different.</text>
  <g class="alignment-stages-stage alignment-stages-s0">
    <rect class="alignment-stages-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="alignment-stages-step" x="44" y="142">01</text>
    <text class="alignment-stages-name" x="70" y="142">Supervised fine-tuning</text>
    <text class="alignment-stages-desc" x="44" y="166">Demonstrations of good answers. Teaches the</text>
    <text class="alignment-stages-desc" x="44" y="182">format and the habit of answering.</text>
  </g>
  <line class="alignment-stages-line alignment-stages-conn alignment-stages-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#alignment-stages-tip)"/>
  <g class="alignment-stages-stage alignment-stages-s1">
    <rect class="alignment-stages-good" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="alignment-stages-step" x="359" y="142">02</text>
    <text class="alignment-stages-name" x="385" y="142">Preference optimisation</text>
    <text class="alignment-stages-desc" x="359" y="166">Pairs of better and worse answers. Teaches</text>
    <text class="alignment-stages-desc" x="359" y="182">which of two is preferred.</text>
  </g>
  <line class="alignment-stages-line alignment-stages-conn alignment-stages-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#alignment-stages-tip)"/>
  <g class="alignment-stages-stage alignment-stages-s2">
    <rect class="alignment-stages-box" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="alignment-stages-step" x="674" y="142">03</text>
    <text class="alignment-stages-name" x="700" y="142">Producing an assistant</text>
    <text class="alignment-stages-desc" x="674" y="166">Same knowledge as the base model, entirely</text>
    <text class="alignment-stages-desc" x="674" y="182">different behaviour.</text>
  </g>
  <text class="alignment-stages-sub" x="30" y="304">That the knowledge is unchanged is the important framing: alignment adjusts what the model does rather than what it knows, which is why refusals can be circumvented.</text>
</svg>
