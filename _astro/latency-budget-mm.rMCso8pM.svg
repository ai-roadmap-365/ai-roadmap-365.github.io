<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four contributors.">
  <title>The latency budget</title>
  <style>
    .latency-budget-mm-bg   { fill: #f8fafc; }
    .latency-budget-mm-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-budget-mm-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-budget-mm-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-budget-mm-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-budget-mm-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-budget-mm-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .latency-budget-mm-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .latency-budget-mm-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .latency-budget-mm-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .latency-budget-mm-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .latency-budget-mm-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .latency-budget-mm-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .latency-budget-mm-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .latency-budget-mm-stage { opacity: 1; }

    .latency-budget-mm-s0 { animation-delay: 0.00s; }
    .latency-budget-mm-e0 { animation-delay: 0.00s; }
    .latency-budget-mm-s1 { animation-delay: 1.28s; }
    .latency-budget-mm-e1 { animation-delay: 1.28s; }
    .latency-budget-mm-s2 { animation-delay: 2.56s; }
    .latency-budget-mm-e2 { animation-delay: 2.56s; }
    .latency-budget-mm-s3 { animation-delay: 3.84s; }
    .latency-budget-mm-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .latency-budget-mm-conn  { animation: latency-budget-mm-trace 6.4s ease-in-out infinite; }
      .latency-budget-mm-stage { animation: latency-budget-mm-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes latency-budget-mm-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes latency-budget-mm-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .latency-budget-mm-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .latency-budget-mm-stage { animation: latency-budget-mm-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes latency-budget-mm-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="latency-budget-mm-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="latency-budget-mm-bg" width="980" height="322"/>
  <text class="latency-budget-mm-h1"  x="30" y="40">The latency budget</text>
  <text class="latency-budget-mm-sub" x="30" y="64">Four contributors.</text>
  <g class="latency-budget-mm-stage latency-budget-mm-s0">
    <rect class="latency-budget-mm-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="latency-budget-mm-step" x="44" y="142">01</text>
    <text class="latency-budget-mm-name" x="70" y="142">Transcription</text>
    <text class="latency-budget-mm-desc" x="44" y="166">Roughly proportional to audio</text>
    <text class="latency-budget-mm-desc" x="44" y="182">length.</text>
  </g>
  <line class="latency-budget-mm-line latency-budget-mm-conn latency-budget-mm-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#latency-budget-mm-tip)"/>
  <g class="latency-budget-mm-stage latency-budget-mm-s1">
    <rect class="latency-budget-mm-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="latency-budget-mm-step" x="280" y="142">02</text>
    <text class="latency-budget-mm-name" x="306" y="142">Vision processing</text>
    <text class="latency-budget-mm-desc" x="280" y="166">Proportional to image count and</text>
    <text class="latency-budget-mm-desc" x="280" y="182">resolution.</text>
  </g>
  <line class="latency-budget-mm-line latency-budget-mm-conn latency-budget-mm-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#latency-budget-mm-tip)"/>
  <g class="latency-budget-mm-stage latency-budget-mm-s2">
    <rect class="latency-budget-mm-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="latency-budget-mm-step" x="516" y="142">03</text>
    <text class="latency-budget-mm-name" x="542" y="142">Retrieval</text>
    <text class="latency-budget-mm-desc" x="516" y="166">Roughly constant, and small.</text>
  </g>
  <line class="latency-budget-mm-line latency-budget-mm-conn latency-budget-mm-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#latency-budget-mm-tip)"/>
  <g class="latency-budget-mm-stage latency-budget-mm-s3">
    <rect class="latency-budget-mm-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="latency-budget-mm-step" x="752" y="142">04</text>
    <text class="latency-budget-mm-name" x="778" y="142">And generation, which dominates</text>
    <text class="latency-budget-mm-desc" x="752" y="166">So parallelise everything before</text>
    <text class="latency-budget-mm-desc" x="752" y="182">it.</text>
  </g>
  <text class="latency-budget-mm-sub" x="30" y="304">Running the independent modality stages concurrently rather than in sequence is the single largest latency saving available in these pipelines.</text>
</svg>
