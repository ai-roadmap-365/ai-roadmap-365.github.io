<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Feel the slope.">
  <title>Standing on a hillside in fog</title>
  <style>
    .hillside-bg   { fill: #f8fafc; }
    .hillside-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hillside-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hillside-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hillside-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hillside-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hillside-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hillside-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hillside-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hillside-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hillside-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hillside-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hillside-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hillside-row { opacity: 1; }
    .hillside-r0 { animation-delay: 0.00s; }
    .hillside-r1 { animation-delay: 0.45s; }
    .hillside-r2 { animation-delay: 0.90s; }
    .hillside-r3 { animation-delay: 1.35s; }
    .hillside-r4 { animation-delay: 1.80s; }
    .hillside-row { animation: hillside-reveal 7.3s ease-in-out infinite; }
    @keyframes hillside-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="hillside-bg" width="980" height="390"/>
  <text class="hillside-h1"  x="30" y="40">Standing on a hillside in fog</text>
  <text class="hillside-sub" x="30" y="64">Feel the slope.</text>
  <rect class="hillside-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="hillside-name" x="46" y="122">Feeling the slope</text>
  <text class="hillside-desc" x="46" y="142">Local only.</text>
  <text class="hillside-desc hillside-row hillside-r0" x="46" y="182">You can tell which way is down</text>
  <text class="hillside-desc hillside-row hillside-r1" x="46" y="216">And how steep it is</text>
  <text class="hillside-desc hillside-row hillside-r2" x="46" y="250">You cannot see the valley floor</text>
  <text class="hillside-desc hillside-row hillside-r3" x="46" y="284">You may end in a hollow</text>
  <text class="hillside-desc hillside-row hillside-r4" x="46" y="318">This is a gradient</text>
  <rect class="hillside-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="hillside-name" x="526" y="122">Seeing the whole valley</text>
  <text class="hillside-desc" x="526" y="142">Global.</text>
  <text class="hillside-desc hillside-row hillside-r0" x="526" y="182">You can see the lowest point</text>
  <text class="hillside-desc hillside-row hillside-r1" x="526" y="216">And plan a route</text>
  <text class="hillside-desc hillside-row hillside-r2" x="526" y="250">Requires seeing everything at once</text>
  <text class="hillside-desc hillside-row hillside-r3" x="526" y="284">Impossible in high dimensions</text>
  <text class="hillside-desc hillside-row hillside-r4" x="526" y="318">This is what we do not have</text>
  <text class="hillside-sub" x="30" y="372">Ending in a hollow rather than the valley floor is the local-minimum problem, and in very high dimensions it turns out to matter less than intuition suggests.</text>
</svg>
