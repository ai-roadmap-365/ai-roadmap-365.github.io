<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each gives up something relational to be good at one thing.">
  <title>Four NoSQL shapes, four different questions</title>
  <style>
    .nosql-families-bg   { fill: #f8fafc; }
    .nosql-families-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-families-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-families-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-families-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-families-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-families-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nosql-families-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .nosql-families-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .nosql-families-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .nosql-families-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .nosql-families-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .nosql-families-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .nosql-families-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .nosql-families-stage { opacity: 1; }

    .nosql-families-s0 { animation-delay: 0.00s; }
    .nosql-families-e0 { animation-delay: 0.00s; }
    .nosql-families-s1 { animation-delay: 1.28s; }
    .nosql-families-e1 { animation-delay: 1.28s; }
    .nosql-families-s2 { animation-delay: 2.56s; }
    .nosql-families-e2 { animation-delay: 2.56s; }
    .nosql-families-s3 { animation-delay: 3.84s; }
    .nosql-families-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .nosql-families-conn  { animation: nosql-families-trace 6.4s ease-in-out infinite; }
      .nosql-families-stage { animation: nosql-families-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes nosql-families-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes nosql-families-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .nosql-families-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .nosql-families-stage { animation: nosql-families-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes nosql-families-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="nosql-families-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="nosql-families-bg" width="980" height="322"/>
  <text class="nosql-families-h1"  x="30" y="40">Four NoSQL shapes, four different questions</text>
  <text class="nosql-families-sub" x="30" y="64">Each gives up something relational to be good at one thing.</text>
  <g class="nosql-families-stage nosql-families-s0">
    <rect class="nosql-families-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="nosql-families-step" x="44" y="142">01</text>
    <text class="nosql-families-name" x="70" y="142">Key-value</text>
    <text class="nosql-families-desc" x="44" y="166">A giant dictionary. Hand it a</text>
    <text class="nosql-families-desc" x="44" y="182">key, get a value, extremely</text>
    <text class="nosql-families-desc" x="44" y="198">fast.</text>
    <text class="nosql-families-edge" x="44" y="242">lookups</text>
  </g>
  <line class="nosql-families-line nosql-families-conn nosql-families-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#nosql-families-tip)"/>
  <g class="nosql-families-stage nosql-families-s1">
    <rect class="nosql-families-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="nosql-families-step" x="280" y="142">02</text>
    <text class="nosql-families-name" x="306" y="142">Document</text>
    <text class="nosql-families-desc" x="280" y="166">Self-contained JSON-like</text>
    <text class="nosql-families-desc" x="280" y="182">records, no fixed schema. For</text>
    <text class="nosql-families-desc" x="280" y="198">records whose shape varies.</text>
    <text class="nosql-families-edge" x="280" y="242">varied shape</text>
  </g>
  <line class="nosql-families-line nosql-families-conn nosql-families-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#nosql-families-tip)"/>
  <g class="nosql-families-stage nosql-families-s2">
    <rect class="nosql-families-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="nosql-families-step" x="516" y="142">03</text>
    <text class="nosql-families-name" x="542" y="142">Wide-column</text>
    <text class="nosql-families-desc" x="516" y="166">Enormous tables spread across</text>
    <text class="nosql-families-desc" x="516" y="182">many machines, tuned for write</text>
    <text class="nosql-families-desc" x="516" y="198">volume.</text>
    <text class="nosql-families-edge" x="516" y="242">write scale</text>
  </g>
  <line class="nosql-families-line nosql-families-conn nosql-families-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#nosql-families-tip)"/>
  <g class="nosql-families-stage nosql-families-s3">
    <rect class="nosql-families-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="nosql-families-step" x="752" y="142">04</text>
    <text class="nosql-families-name" x="778" y="142">Graph</text>
    <text class="nosql-families-desc" x="752" y="166">Nodes and edges. "Friends of</text>
    <text class="nosql-families-desc" x="752" y="182">friends" and shortest paths,</text>
    <text class="nosql-families-desc" x="752" y="198">which tie relational in knots.</text>
    <text class="nosql-families-edge" x="752" y="242">relationships</text>
  </g>
  <text class="nosql-families-sub" x="30" y="304">Note what each trades away — usually joins, transactions across records, or flexible querying. Choosing one for scale you do not yet have gives up real guarantees for a problem you may never meet.</text>
</svg>
