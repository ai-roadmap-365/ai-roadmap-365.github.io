<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Millions of parameters, deleted.">
  <title>Global pooling, or a dense head</title>
  <style>
    .gap-or-dense-bg   { fill: #f8fafc; }
    .gap-or-dense-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gap-or-dense-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gap-or-dense-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gap-or-dense-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gap-or-dense-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gap-or-dense-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gap-or-dense-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gap-or-dense-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gap-or-dense-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gap-or-dense-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gap-or-dense-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gap-or-dense-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gap-or-dense-row { opacity: 1; }
    .gap-or-dense-r0 { animation-delay: 0.00s; }
    .gap-or-dense-r1 { animation-delay: 0.45s; }
    .gap-or-dense-r2 { animation-delay: 0.90s; }
    .gap-or-dense-r3 { animation-delay: 1.35s; }
    .gap-or-dense-r4 { animation-delay: 1.80s; }
    .gap-or-dense-row { animation: gap-or-dense-reveal 7.3s ease-in-out infinite; }
    @keyframes gap-or-dense-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="gap-or-dense-bg" width="980" height="390"/>
  <text class="gap-or-dense-h1"  x="30" y="40">Global pooling, or a dense head</text>
  <text class="gap-or-dense-sub" x="30" y="64">Millions of parameters, deleted.</text>
  <rect class="gap-or-dense-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="gap-or-dense-name" x="46" y="122">A dense head</text>
  <text class="gap-or-dense-desc" x="46" y="142">Millions of parameters.</text>
  <text class="gap-or-dense-desc gap-or-dense-row gap-or-dense-r0" x="46" y="182">Flatten the final feature map</text>
  <text class="gap-or-dense-desc gap-or-dense-row gap-or-dense-r1" x="46" y="216">A large fully connected layer</text>
  <text class="gap-or-dense-desc gap-or-dense-row gap-or-dense-r2" x="46" y="250">Often most of the network's parameters</text>
  <text class="gap-or-dense-desc gap-or-dense-row gap-or-dense-r3" x="46" y="284">Ties the model to a fixed input size</text>
  <text class="gap-or-dense-desc gap-or-dense-row gap-or-dense-r4" x="46" y="318">And overfits readily</text>
  <rect class="gap-or-dense-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="gap-or-dense-name" x="526" y="122">Global average pooling</text>
  <text class="gap-or-dense-desc" x="526" y="142">No parameters at all.</text>
  <text class="gap-or-dense-desc gap-or-dense-row gap-or-dense-r0" x="526" y="182">Average each channel to one number</text>
  <text class="gap-or-dense-desc gap-or-dense-row gap-or-dense-r1" x="526" y="216">A small linear layer to the classes</text>
  <text class="gap-or-dense-desc gap-or-dense-row gap-or-dense-r2" x="526" y="250">Works at any input resolution</text>
  <text class="gap-or-dense-desc gap-or-dense-row gap-or-dense-r3" x="526" y="284">Regularises by construction</text>
  <text class="gap-or-dense-desc gap-or-dense-row gap-or-dense-r4" x="526" y="318">Standard in modern architectures</text>
  <text class="gap-or-dense-sub" x="30" y="372">Deleting most of a network's parameters and improving generalisation is a rare combination, and it is why global average pooling replaced the dense head almost universally.</text>
</svg>
