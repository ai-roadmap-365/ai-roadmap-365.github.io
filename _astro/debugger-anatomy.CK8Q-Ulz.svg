<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" font-family="system-ui, sans-serif">
  <title>The anatomy of a debugger session: a paused program with a breakpoint, call stack, variables panel, and step controls</title>
  <rect x="0" y="0" width="820" height="470" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Anatomy of a debugger session</text>
  <text x="410" y="56" text-anchor="middle" font-size="14" fill="#1a202c">The program is paused at a breakpoint; every panel shows its frozen live state.</text>

  <!-- Source panel -->
  <rect x="24" y="80" width="440" height="240" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="40" y="104" text-anchor="start" font-size="15" font-weight="bold" fill="#1a202c">Source (paused)</text>
  <text x="52" y="134" text-anchor="start" font-size="13" fill="#1a202c" font-family="monospace">1  def total(items):</text>
  <text x="52" y="156" text-anchor="start" font-size="13" fill="#1a202c" font-family="monospace">2      sum = 0</text>
  <text x="52" y="178" text-anchor="start" font-size="13" fill="#1a202c" font-family="monospace">3      for it in items:</text>
  <!-- breakpoint + current line -->
  <rect x="44" y="188" width="404" height="22" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1" rx="4"/>
  <circle cx="46" cy="199" r="7" fill="#b91c1c"/>
  <text x="52" y="204" text-anchor="start" font-size="13" fill="#1a202c" font-family="monospace">4          sum += price(it)</text>
  <text x="52" y="226" text-anchor="start" font-size="13" fill="#1a202c" font-family="monospace">5      return sum</text>
  <circle cx="46" cy="199" r="7" fill="none" stroke="#1a202c" stroke-width="1"/>
  <text x="72" y="262" text-anchor="start" font-size="13" fill="#b91c1c" font-weight="bold">breakpoint (red dot) + current line (highlighted)</text>
  <text x="72" y="288" text-anchor="start" font-size="12" fill="#1a202c">Execution stopped here so you can look around.</text>

  <!-- Call stack panel -->
  <rect x="484" y="80" width="312" height="130" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="500" y="104" text-anchor="start" font-size="15" font-weight="bold" fill="#1a202c">Call stack</text>
  <rect x="500" y="116" width="280" height="24" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1" rx="4"/>
  <text x="510" y="133" text-anchor="start" font-size="13" fill="#1a202c" font-family="monospace">total()  &#8592; current frame</text>
  <text x="510" y="160" text-anchor="start" font-size="13" fill="#1a202c" font-family="monospace">checkout()</text>
  <text x="510" y="182" text-anchor="start" font-size="13" fill="#1a202c" font-family="monospace">main()</text>
  <text x="500" y="202" text-anchor="start" font-size="11" fill="#1a202c">who called whom, top = here</text>

  <!-- Variables panel -->
  <rect x="484" y="226" width="312" height="130" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="500" y="250" text-anchor="start" font-size="15" font-weight="bold" fill="#1a202c">Variables (live values)</text>
  <text x="510" y="278" text-anchor="start" font-size="13" fill="#1a202c" font-family="monospace">items = [apple, pear]</text>
  <text x="510" y="300" text-anchor="start" font-size="13" fill="#1a202c" font-family="monospace">it    = apple</text>
  <text x="510" y="322" text-anchor="start" font-size="13" fill="#1a202c" font-family="monospace">sum   = 0</text>
  <text x="500" y="344" text-anchor="start" font-size="11" fill="#1a202c">watch: any expression, re-shown as you step</text>

  <!-- Step controls -->
  <rect x="24" y="380" width="772" height="66" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="410" y="404" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Step controls</text>
  <text x="150" y="430" text-anchor="middle" font-size="13" fill="#1a202c">Continue</text>
  <text x="330" y="430" text-anchor="middle" font-size="13" fill="#1a202c">Step over</text>
  <text x="500" y="430" text-anchor="middle" font-size="13" fill="#1a202c">Step into</text>
  <text x="670" y="430" text-anchor="middle" font-size="13" fill="#1a202c">Step out</text>
  <g stroke="#1d4ed8" stroke-width="2" fill="#1d4ed8">
    <polygon points="96,424 110,431 96,438"/>
    <polygon points="266,424 280,431 266,438"/>
    <polygon points="436,424 450,431 436,438"/>
    <polygon points="606,424 620,431 606,438"/>
  </g>
</svg>
