<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five stages, all of them yours.">
  <title>From pixels to a prediction</title>
  <style>
    .mnist-pipeline-bg   { fill: #f8fafc; }
    .mnist-pipeline-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mnist-pipeline-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mnist-pipeline-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mnist-pipeline-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mnist-pipeline-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mnist-pipeline-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mnist-pipeline-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mnist-pipeline-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mnist-pipeline-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mnist-pipeline-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mnist-pipeline-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mnist-pipeline-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .mnist-pipeline-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .mnist-pipeline-stage { opacity: 1; }

    .mnist-pipeline-s0 { animation-delay: 0.00s; }
    .mnist-pipeline-e0 { animation-delay: 0.00s; }
    .mnist-pipeline-s1 { animation-delay: 1.33s; }
    .mnist-pipeline-e1 { animation-delay: 1.33s; }
    .mnist-pipeline-s2 { animation-delay: 2.67s; }
    .mnist-pipeline-e2 { animation-delay: 2.67s; }
    .mnist-pipeline-s3 { animation-delay: 4.00s; }
    .mnist-pipeline-e3 { animation-delay: 4.00s; }
    .mnist-pipeline-s4 { animation-delay: 5.33s; }
    .mnist-pipeline-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .mnist-pipeline-conn  { animation: mnist-pipeline-trace 8s ease-in-out infinite; }
      .mnist-pipeline-stage { animation: mnist-pipeline-arrive 8s ease-in-out infinite; }
    }
    @keyframes mnist-pipeline-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes mnist-pipeline-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .mnist-pipeline-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .mnist-pipeline-stage { animation: mnist-pipeline-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes mnist-pipeline-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="mnist-pipeline-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="mnist-pipeline-bg" width="980" height="322"/>
  <text class="mnist-pipeline-h1"  x="30" y="40">From pixels to a prediction</text>
  <text class="mnist-pipeline-sub" x="30" y="64">Five stages, all of them yours.</text>
  <g class="mnist-pipeline-stage mnist-pipeline-s0">
    <rect class="mnist-pipeline-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="mnist-pipeline-step" x="44" y="142">01</text>
    <text class="mnist-pipeline-name" x="70" y="142">Normalise the pixels</text>
    <text class="mnist-pipeline-desc" x="44" y="166">Integers 0-255 into</text>
    <text class="mnist-pipeline-desc" x="44" y="182">floats 0-1. Scale matters</text>
    <text class="mnist-pipeline-desc" x="44" y="198">for initialisation and</text>
  </g>
  <line class="mnist-pipeline-line mnist-pipeline-conn mnist-pipeline-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#mnist-pipeline-tip)"/>
  <g class="mnist-pipeline-stage mnist-pipeline-s1">
    <rect class="mnist-pipeline-warn" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="mnist-pipeline-step" x="233" y="142">02</text>
    <text class="mnist-pipeline-name" x="259" y="142">Flatten the grid</text>
    <text class="mnist-pipeline-desc" x="233" y="166">28x28 becomes a</text>
    <text class="mnist-pipeline-desc" x="233" y="182">784-vector. Spatial</text>
    <text class="mnist-pipeline-desc" x="233" y="198">structure discarded.</text>
  </g>
  <line class="mnist-pipeline-line mnist-pipeline-conn mnist-pipeline-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#mnist-pipeline-tip)"/>
  <g class="mnist-pipeline-stage mnist-pipeline-s2">
    <rect class="mnist-pipeline-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="mnist-pipeline-step" x="422" y="142">03</text>
    <text class="mnist-pipeline-name" x="448" y="142">One-hot the labels</text>
    <text class="mnist-pipeline-desc" x="422" y="166">A digit becomes a</text>
    <text class="mnist-pipeline-desc" x="422" y="182">10-dimensional target</text>
    <text class="mnist-pipeline-desc" x="422" y="198">vector.</text>
  </g>
  <line class="mnist-pipeline-line mnist-pipeline-conn mnist-pipeline-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#mnist-pipeline-tip)"/>
  <g class="mnist-pipeline-stage mnist-pipeline-s3">
    <rect class="mnist-pipeline-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="mnist-pipeline-step" x="611" y="142">04</text>
    <text class="mnist-pipeline-name" x="637" y="142">Two layers: 784, 128, 10</text>
    <text class="mnist-pipeline-desc" x="611" y="166">101,770 parameters in</text>
    <text class="mnist-pipeline-desc" x="611" y="182">total.</text>
    <text class="mnist-pipeline-edge" x="611" y="242">101,770</text>
  </g>
  <line class="mnist-pipeline-line mnist-pipeline-conn mnist-pipeline-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#mnist-pipeline-tip)"/>
  <g class="mnist-pipeline-stage mnist-pipeline-s4">
    <rect class="mnist-pipeline-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="mnist-pipeline-step" x="800" y="142">05</text>
    <text class="mnist-pipeline-name" x="826" y="142">Track loss and accuracy per epoch</text>
    <text class="mnist-pipeline-desc" x="800" y="166">On held-out data, not</text>
    <text class="mnist-pipeline-desc" x="800" y="182">training data.</text>
  </g>
  <text class="mnist-pipeline-sub" x="30" y="304">The second stage is the one worth noticing as a limitation rather than a step: flattening tells the network that pixel 1 and pixel 29 are unrelated, when in the image they are vertically adjacent.</text>
</svg>
