<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The same drawings, different leverage.">
  <title>Drawing boards and CAD</title>
  <style>
    .freight-analogy-bg   { fill: #f8fafc; }
    .freight-analogy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freight-analogy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freight-analogy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freight-analogy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freight-analogy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freight-analogy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .freight-analogy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .freight-analogy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .freight-analogy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .freight-analogy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .freight-analogy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .freight-analogy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .freight-analogy-row { opacity: 1; }
    .freight-analogy-r0 { animation-delay: 0.00s; }
    .freight-analogy-r1 { animation-delay: 0.45s; }
    .freight-analogy-r2 { animation-delay: 0.90s; }
    .freight-analogy-r3 { animation-delay: 1.35s; }
    .freight-analogy-r4 { animation-delay: 1.80s; }
    .freight-analogy-row { animation: freight-analogy-reveal 7.3s ease-in-out infinite; }
    @keyframes freight-analogy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="freight-analogy-bg" width="980" height="390"/>
  <text class="freight-analogy-h1"  x="30" y="40">Drawing boards and CAD</text>
  <text class="freight-analogy-sub" x="30" y="64">The same drawings, different leverage.</text>
  <rect class="freight-analogy-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="freight-analogy-name" x="46" y="122">Manual drafting</text>
  <text class="freight-analogy-desc" x="46" y="142">Every line by hand.</text>
  <text class="freight-analogy-desc freight-analogy-row freight-analogy-r0" x="46" y="182">A T-square and a compass</text>
  <text class="freight-analogy-desc freight-analogy-row freight-analogy-r1" x="46" y="216">Every change redrawn from scratch</text>
  <text class="freight-analogy-desc freight-analogy-row freight-analogy-r2" x="46" y="250">Complete understanding of the geometry</text>
  <text class="freight-analogy-desc freight-analogy-row freight-analogy-r3" x="46" y="284">Slow, and entirely yours</text>
  <text class="freight-analogy-desc freight-analogy-row freight-analogy-r4" x="46" y="318">Excellent training</text>
  <rect class="freight-analogy-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="freight-analogy-name" x="526" y="122">Computer-aided</text>
  <text class="freight-analogy-desc" x="526" y="142">The same geometry, leveraged.</text>
  <text class="freight-analogy-desc freight-analogy-row freight-analogy-r0" x="526" y="182">Constraints propagate automatically</text>
  <text class="freight-analogy-desc freight-analogy-row freight-analogy-r1" x="526" y="216">A change updates everything downstream</text>
  <text class="freight-analogy-desc freight-analogy-row freight-analogy-r2" x="526" y="250">The geometry is unchanged</text>
  <text class="freight-analogy-desc freight-analogy-row freight-analogy-r3" x="526" y="284">Orders of magnitude faster to iterate</text>
  <text class="freight-analogy-desc freight-analogy-row freight-analogy-r4" x="526" y="318">And it still helps to have drafted by hand</text>
  <text class="freight-analogy-sub" x="30" y="372">The analogy holds precisely at the last row: the tool does not remove the need to understand the geometry, it removes the need to redraw it.</text>
</svg>
