<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward operable systems.">
  <title>Four steps in what counts as done</title>
  <style>
    .capstone-history-bg   { fill: #f8fafc; }
    .capstone-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .capstone-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .capstone-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .capstone-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .capstone-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .capstone-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .capstone-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .capstone-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .capstone-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .capstone-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .capstone-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .capstone-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .capstone-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .capstone-history-stage { opacity: 1; }

    .capstone-history-s0 { animation-delay: 0.00s; }
    .capstone-history-e0 { animation-delay: 0.00s; }
    .capstone-history-s1 { animation-delay: 1.28s; }
    .capstone-history-e1 { animation-delay: 1.28s; }
    .capstone-history-s2 { animation-delay: 2.56s; }
    .capstone-history-e2 { animation-delay: 2.56s; }
    .capstone-history-s3 { animation-delay: 3.84s; }
    .capstone-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .capstone-history-conn  { animation: capstone-history-trace 6.4s ease-in-out infinite; }
      .capstone-history-stage { animation: capstone-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes capstone-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes capstone-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .capstone-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .capstone-history-stage { animation: capstone-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes capstone-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="capstone-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="capstone-history-bg" width="980" height="322"/>
  <text class="capstone-history-h1"  x="30" y="40">Four steps in what counts as done</text>
  <text class="capstone-history-sub" x="30" y="64">Toward operable systems.</text>
  <g class="capstone-history-stage capstone-history-s0">
    <rect class="capstone-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="capstone-history-step" x="44" y="142">01</text>
    <text class="capstone-history-name" x="70" y="142">A number in a report</text>
    <text class="capstone-history-desc" x="44" y="166">Which nobody could reproduce.</text>
  </g>
  <line class="capstone-history-line capstone-history-conn capstone-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#capstone-history-tip)"/>
  <g class="capstone-history-stage capstone-history-s1">
    <rect class="capstone-history-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="capstone-history-step" x="280" y="142">02</text>
    <text class="capstone-history-name" x="306" y="142">A notebook that runs</text>
    <text class="capstone-history-desc" x="280" y="166">On its author's machine.</text>
  </g>
  <line class="capstone-history-line capstone-history-conn capstone-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#capstone-history-tip)"/>
  <g class="capstone-history-stage capstone-history-s2">
    <rect class="capstone-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="capstone-history-step" x="516" y="142">03</text>
    <text class="capstone-history-name" x="542" y="142">A deployed model behind an endpoint</text>
    <text class="capstone-history-desc" x="516" y="166">Which then decayed unattended.</text>
  </g>
  <line class="capstone-history-line capstone-history-conn capstone-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#capstone-history-tip)"/>
  <g class="capstone-history-stage capstone-history-s3">
    <rect class="capstone-history-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="capstone-history-step" x="752" y="142">04</text>
    <text class="capstone-history-name" x="778" y="142">And an operable service with monitoring and a retraining path</text>
    <text class="capstone-history-desc" x="752" y="166">Which is the current standard.</text>
  </g>
  <text class="capstone-history-sub" x="30" y="304">Each step moved the finish line further from the modelling, which is a fair summary of how the field has matured over the last decade.</text>
</svg>
