<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things a time series plot is not</title>
  <style>
    .ts-not-bg   { fill: #f8fafc; }
    .ts-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ts-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ts-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ts-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ts-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ts-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ts-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ts-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ts-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ts-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ts-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ts-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ts-not-row { opacity: 1; }
    .ts-not-r0 { animation-delay: 0.00s; }
    .ts-not-r1 { animation-delay: 0.45s; }
    .ts-not-r2 { animation-delay: 0.90s; }
    .ts-not-r3 { animation-delay: 1.35s; }
    .ts-not-r4 { animation-delay: 1.80s; }
    .ts-not-row { animation: ts-not-reveal 7.3s ease-in-out infinite; }
    @keyframes ts-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="ts-not-bg" width="980" height="390"/>
  <text class="ts-not-h1"  x="30" y="40">Four things a time series plot is not</text>
  <text class="ts-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="ts-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="ts-not-name" x="46" y="122">The misconception</text>
  <text class="ts-not-desc" x="46" y="142">Commonly held.</text>
  <text class="ts-not-desc ts-not-row ts-not-r0" x="46" y="182">A rising line indicates a trend</text>
  <text class="ts-not-desc ts-not-row ts-not-r1" x="46" y="216">Points can be treated independently</text>
  <text class="ts-not-desc ts-not-row ts-not-r2" x="46" y="250">The axis may start anywhere</text>
  <text class="ts-not-desc ts-not-row ts-not-r3" x="46" y="284">A smooth line is a better summary</text>
  <text class="ts-not-desc ts-not-row ts-not-r4" x="46" y="318">Recent movement predicts the next point</text>
  <rect class="ts-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="ts-not-name" x="526" y="122">What is true</text>
  <text class="ts-not-desc" x="526" y="142">Actually.</text>
  <text class="ts-not-desc ts-not-row ts-not-r0" x="526" y="182">Short runs occur in random series too</text>
  <text class="ts-not-desc ts-not-row ts-not-r1" x="526" y="216">Autocorrelation invalidates standard intervals</text>
  <text class="ts-not-desc ts-not-row ts-not-r2" x="526" y="250">Truncation exaggerates; state it clearly</text>
  <text class="ts-not-desc ts-not-row ts-not-r3" x="526" y="284">Smoothing hides variation deliberately</text>
  <text class="ts-not-desc ts-not-row ts-not-r4" x="526" y="318">Not without a model that says so</text>
  <text class="ts-not-sub" x="30" y="372">Short runs occurring in purely random series is worth internalising, because the eye reliably finds trends in noise and acts on them.</text>
</svg>
