<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are risks.">
  <title>Four consequences of file handling</title>
  <style>
    .file-implications-bg   { fill: #f8fafc; }
    .file-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .file-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .file-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .file-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .file-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .file-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .file-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .file-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .file-implications-stage { opacity: 1; }

    .file-implications-s0 { animation-delay: 0.00s; }
    .file-implications-e0 { animation-delay: 0.00s; }
    .file-implications-s1 { animation-delay: 1.28s; }
    .file-implications-e1 { animation-delay: 1.28s; }
    .file-implications-s2 { animation-delay: 2.56s; }
    .file-implications-e2 { animation-delay: 2.56s; }
    .file-implications-s3 { animation-delay: 3.84s; }
    .file-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .file-implications-conn  { animation: file-implications-trace 6.4s ease-in-out infinite; }
      .file-implications-stage { animation: file-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes file-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes file-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .file-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .file-implications-stage { animation: file-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes file-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="file-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="file-implications-bg" width="980" height="322"/>
  <text class="file-implications-h1"  x="30" y="40">Four consequences of file handling</text>
  <text class="file-implications-sub" x="30" y="64">Two are risks.</text>
  <g class="file-implications-stage file-implications-s0">
    <rect class="file-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="file-implications-step" x="44" y="142">01</text>
    <text class="file-implications-name" x="70" y="142">Buffered writes are not durable until flushed</text>
    <text class="file-implications-desc" x="44" y="166">Which matters when a process can</text>
    <text class="file-implications-desc" x="44" y="182">be killed.</text>
  </g>
  <line class="file-implications-line file-implications-conn file-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#file-implications-tip)"/>
  <g class="file-implications-stage file-implications-s1">
    <rect class="file-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="file-implications-step" x="280" y="142">02</text>
    <text class="file-implications-name" x="306" y="142">And unspecified encodings break across platforms</text>
    <text class="file-implications-desc" x="280" y="166">Silently, with mangled</text>
    <text class="file-implications-desc" x="280" y="182">characters.</text>
  </g>
  <line class="file-implications-line file-implications-conn file-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#file-implications-tip)"/>
  <g class="file-implications-stage file-implications-s2">
    <rect class="file-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="file-implications-step" x="516" y="142">03</text>
    <text class="file-implications-name" x="542" y="142">While paths built from user input can escape a directory</text>
    <text class="file-implications-desc" x="516" y="166">Which is a real vulnerability.</text>
  </g>
  <line class="file-implications-line file-implications-conn file-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#file-implications-tip)"/>
  <g class="file-implications-stage file-implications-s3">
    <rect class="file-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="file-implications-step" x="752" y="142">04</text>
    <text class="file-implications-name" x="778" y="142">And reading strategy decides whether large files work at all</text>
    <text class="file-implications-desc" x="752" y="166">Iteration, rather than reading</text>
    <text class="file-implications-desc" x="752" y="182">whole.</text>
  </g>
  <text class="file-implications-sub" x="30" y="304">Path traversal from user-supplied filenames is the security item here, and the fix is resolving the path and checking it stays under an allowed root.</text>
</svg>
