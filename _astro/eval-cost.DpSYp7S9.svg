<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Both have a place.">
  <title>Full evaluation against a sampled one</title>
  <style>
    .eval-cost-bg   { fill: #f8fafc; }
    .eval-cost-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-cost-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-cost-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-cost-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-cost-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-cost-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eval-cost-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eval-cost-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eval-cost-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eval-cost-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eval-cost-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eval-cost-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eval-cost-row { opacity: 1; }
    .eval-cost-r0 { animation-delay: 0.00s; }
    .eval-cost-r1 { animation-delay: 0.45s; }
    .eval-cost-r2 { animation-delay: 0.90s; }
    .eval-cost-r3 { animation-delay: 1.35s; }
    .eval-cost-r4 { animation-delay: 1.80s; }
    .eval-cost-row { animation: eval-cost-reveal 7.3s ease-in-out infinite; }
    @keyframes eval-cost-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="eval-cost-bg" width="980" height="390"/>
  <text class="eval-cost-h1"  x="30" y="40">Full evaluation against a sampled one</text>
  <text class="eval-cost-sub" x="30" y="64">Both have a place.</text>
  <rect class="eval-cost-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="eval-cost-name" x="46" y="122">Full evaluation</text>
  <text class="eval-cost-desc" x="46" y="142">Before a release.</text>
  <text class="eval-cost-desc eval-cost-row eval-cost-r0" x="46" y="182">The whole test set, every metric</text>
  <text class="eval-cost-desc eval-cost-row eval-cost-r1" x="46" y="216">Several model calls per case</text>
  <text class="eval-cost-desc eval-cost-row eval-cost-r2" x="46" y="250">Expensive, and slow</text>
  <text class="eval-cost-desc eval-cost-row eval-cost-r3" x="46" y="284">Run on changes, not continuously</text>
  <text class="eval-cost-desc eval-cost-row eval-cost-r4" x="46" y="318">Gives a defensible number</text>
  <rect class="eval-cost-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="eval-cost-name" x="526" y="122">Sampled in production</text>
  <text class="eval-cost-desc" x="526" y="142">Continuously.</text>
  <text class="eval-cost-desc eval-cost-row eval-cost-r0" x="526" y="182">A small fraction of live traffic</text>
  <text class="eval-cost-desc eval-cost-row eval-cost-r1" x="526" y="216">One or two cheap metrics</text>
  <text class="eval-cost-desc eval-cost-row eval-cost-r2" x="526" y="250">Affordable to run always</text>
  <text class="eval-cost-desc eval-cost-row eval-cost-r3" x="526" y="284">Catches drift between releases</text>
  <text class="eval-cost-desc eval-cost-row eval-cost-r4" x="526" y="318">Gives a trend, not a number</text>
  <text class="eval-cost-sub" x="30" y="372">Running both is the usual arrangement: the sampled version detects that something changed, and the full version establishes what.</text>
</svg>
