<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>How attribute lookup works</title>
  <style>
    .mro-bg   { fill: #f8fafc; }
    .mro-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mro-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mro-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mro-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mro-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mro-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mro-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mro-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mro-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mro-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mro-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mro-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .mro-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .mro-stage { opacity: 1; }

    .mro-s0 { animation-delay: 0.00s; }
    .mro-e0 { animation-delay: 0.00s; }
    .mro-s1 { animation-delay: 1.28s; }
    .mro-e1 { animation-delay: 1.28s; }
    .mro-s2 { animation-delay: 2.56s; }
    .mro-e2 { animation-delay: 2.56s; }
    .mro-s3 { animation-delay: 3.84s; }
    .mro-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .mro-conn  { animation: mro-trace 6.4s ease-in-out infinite; }
      .mro-stage { animation: mro-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes mro-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes mro-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .mro-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .mro-stage { animation: mro-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes mro-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="mro-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="mro-bg" width="980" height="322"/>
  <text class="mro-h1"  x="30" y="40">How attribute lookup works</text>
  <text class="mro-sub" x="30" y="64">Four steps.</text>
  <g class="mro-stage mro-s0">
    <rect class="mro-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="mro-step" x="44" y="142">01</text>
    <text class="mro-name" x="70" y="142">Look on the instance first</text>
    <text class="mro-desc" x="44" y="166">Its own attributes.</text>
  </g>
  <line class="mro-line mro-conn mro-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#mro-tip)"/>
  <g class="mro-stage mro-s1">
    <rect class="mro-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="mro-step" x="280" y="142">02</text>
    <text class="mro-name" x="306" y="142">Then on its class</text>
    <text class="mro-desc" x="280" y="166">Where the methods live.</text>
  </g>
  <line class="mro-line mro-conn mro-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#mro-tip)"/>
  <g class="mro-stage mro-s2">
    <rect class="mro-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="mro-step" x="516" y="142">03</text>
    <text class="mro-name" x="542" y="142">Then through the parents in a fixed order</text>
    <text class="mro-desc" x="516" y="166">The resolution order, computed</text>
    <text class="mro-desc" x="516" y="182">once.</text>
  </g>
  <line class="mro-line mro-conn mro-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#mro-tip)"/>
  <g class="mro-stage mro-s3">
    <rect class="mro-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="mro-step" x="752" y="142">04</text>
    <text class="mro-name" x="778" y="142">And raise if nothing matches</text>
    <text class="mro-desc" x="752" y="166">Which is where the attribute</text>
    <text class="mro-desc" x="752" y="182">error comes from.</text>
  </g>
  <text class="mro-sub" x="30" y="304">The order being computed once and inspectable is what makes multiple inheritance predictable rather than mysterious, and it is worth printing when confused.</text>
</svg>
