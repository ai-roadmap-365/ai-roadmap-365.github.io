<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Width, alignment, precision, type.">
  <title>What comes after the colon</title>
  <style>
    .fstring-spec-bg   { fill: #f8fafc; }
    .fstring-spec-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fstring-spec-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fstring-spec-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fstring-spec-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fstring-spec-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fstring-spec-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fstring-spec-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fstring-spec-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fstring-spec-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fstring-spec-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fstring-spec-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fstring-spec-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .fstring-spec-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .fstring-spec-stage { opacity: 1; }

    .fstring-spec-s0 { animation-delay: 0.00s; }
    .fstring-spec-e0 { animation-delay: 0.00s; }
    .fstring-spec-s1 { animation-delay: 1.28s; }
    .fstring-spec-e1 { animation-delay: 1.28s; }
    .fstring-spec-s2 { animation-delay: 2.56s; }
    .fstring-spec-e2 { animation-delay: 2.56s; }
    .fstring-spec-s3 { animation-delay: 3.84s; }
    .fstring-spec-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .fstring-spec-conn  { animation: fstring-spec-trace 6.4s ease-in-out infinite; }
      .fstring-spec-stage { animation: fstring-spec-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes fstring-spec-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes fstring-spec-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .fstring-spec-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .fstring-spec-stage { animation: fstring-spec-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes fstring-spec-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="fstring-spec-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="fstring-spec-bg" width="980" height="322"/>
  <text class="fstring-spec-h1"  x="30" y="40">What comes after the colon</text>
  <text class="fstring-spec-sub" x="30" y="64">Width, alignment, precision, type.</text>
  <g class="fstring-spec-stage fstring-spec-s0">
    <rect class="fstring-spec-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="fstring-spec-step" x="44" y="142">01</text>
    <text class="fstring-spec-name" x="70" y="142">Fill and align</text>
    <text class="fstring-spec-desc" x="44" y="166">&gt;10 right-aligns in ten columns;</text>
    <text class="fstring-spec-desc" x="44" y="182">&lt;10 left; ^10 centres.</text>
    <text class="fstring-spec-edge" x="44" y="242">&gt;10</text>
  </g>
  <line class="fstring-spec-line fstring-spec-conn fstring-spec-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#fstring-spec-tip)"/>
  <g class="fstring-spec-stage fstring-spec-s1">
    <rect class="fstring-spec-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="fstring-spec-step" x="280" y="142">02</text>
    <text class="fstring-spec-name" x="306" y="142">Width</text>
    <text class="fstring-spec-desc" x="280" y="166">The minimum number of columns.</text>
    <text class="fstring-spec-desc" x="280" y="182">Longer values are not truncated.</text>
    <text class="fstring-spec-edge" x="280" y="242">10</text>
  </g>
  <line class="fstring-spec-line fstring-spec-conn fstring-spec-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#fstring-spec-tip)"/>
  <g class="fstring-spec-stage fstring-spec-s2">
    <rect class="fstring-spec-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="fstring-spec-step" x="516" y="142">03</text>
    <text class="fstring-spec-name" x="542" y="142">Precision</text>
    <text class="fstring-spec-desc" x="516" y="166">.2 for two decimal places on a</text>
    <text class="fstring-spec-desc" x="516" y="182">float.</text>
    <text class="fstring-spec-edge" x="516" y="242">.2</text>
  </g>
  <line class="fstring-spec-line fstring-spec-conn fstring-spec-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#fstring-spec-tip)"/>
  <g class="fstring-spec-stage fstring-spec-s3">
    <rect class="fstring-spec-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="fstring-spec-step" x="752" y="142">04</text>
    <text class="fstring-spec-name" x="778" y="142">Type</text>
    <text class="fstring-spec-desc" x="752" y="166">f fixed-point, % percentage, ,</text>
    <text class="fstring-spec-desc" x="752" y="182">thousands separator, x hex.</text>
    <text class="fstring-spec-edge" x="752" y="242">f % , x</text>
  </g>
  <text class="fstring-spec-sub" x="30" y="304">f"{value:&gt;10,.2f}" is all four at once: right-aligned in ten columns, thousands-separated, two decimals. Learning the spec once removes the need for any formatting library.</text>
</svg>
