<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" role="img" font-family="system-ui, sans-serif">
  <title>Inside the CPU: the control unit with program counter and instruction register, the ALU, and the registers, all connected over a bus to memory</title>
  <rect x="0" y="0" width="760" height="540" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Inside the CPU</text>

  <!-- CPU package -->
  <rect x="30" y="60" width="450" height="440" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3" rx="12"/>
  <text x="255" y="88" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d4ed8">CPU</text>

  <!-- Control unit -->
  <rect x="55" y="105" width="230" height="180" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="170" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Control unit</text>
  <text x="170" y="150" text-anchor="middle" font-size="14" fill="#1a202c">decodes instructions,</text>
  <text x="170" y="168" text-anchor="middle" font-size="14" fill="#1a202c">steers every other part</text>

  <rect x="70" y="185" width="200" height="40" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="170" y="203" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Program counter (PC)</text>
  <text x="170" y="219" text-anchor="middle" font-size="14" fill="#1a202c">address of next instruction</text>

  <rect x="70" y="233" width="200" height="40" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="170" y="251" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Instruction register (IR)</text>
  <text x="170" y="267" text-anchor="middle" font-size="14" fill="#1a202c">instruction being decoded</text>

  <!-- ALU -->
  <rect x="55" y="320" width="230" height="150" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="170" y="347" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">ALU</text>
  <text x="170" y="368" text-anchor="middle" font-size="14" fill="#1a202c">arithmetic logic unit:</text>
  <text x="170" y="386" text-anchor="middle" font-size="14" fill="#1a202c">adds, compares, and</text>
  <text x="170" y="404" text-anchor="middle" font-size="14" fill="#1a202c">does logic on register</text>
  <text x="170" y="422" text-anchor="middle" font-size="14" fill="#1a202c">values, sets status flags</text>

  <!-- Registers -->
  <rect x="315" y="105" width="140" height="365" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="385" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Registers</text>
  <text x="385" y="150" text-anchor="middle" font-size="14" fill="#1a202c">fastest storage</text>
  <text x="385" y="168" text-anchor="middle" font-size="14" fill="#1a202c">in the machine</text>
  <rect x="330" y="185" width="110" height="36" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="385" y="208" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">R1</text>
  <rect x="330" y="231" width="110" height="36" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="385" y="254" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">R2</text>
  <rect x="330" y="277" width="110" height="36" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="385" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">R3</text>
  <rect x="330" y="323" width="110" height="36" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="385" y="346" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">R4</text>
  <rect x="330" y="369" width="110" height="36" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="385" y="392" text-anchor="middle" font-size="14" fill="#1a202c">flags</text>

  <!-- Arrows control unit <-> ALU and registers -->
  <line x1="170" y1="285" x2="170" y2="312" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="170,320 163,306 177,306" fill="#1d4ed8"/>
  <line x1="285" y1="195" x2="307" y2="195" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="315,195 301,188 301,202" fill="#1d4ed8"/>
  <line x1="315" y1="430" x2="293" y2="430" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="285,430 299,423 299,437" fill="#1d4ed8"/>
  <line x1="285" y1="400" x2="307" y2="400" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="315,400 301,393 301,407" fill="#1d4ed8"/>

  <!-- Bus -->
  <rect x="510" y="105" width="34" height="365" fill="#1d4ed8" rx="8"/>
  <text x="527" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#f8fafc" transform="rotate(-90 527 300)">bus: addresses, data, control</text>
  <line x1="480" y1="180" x2="502" y2="180" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="510,180 496,173 496,187" fill="#1d4ed8"/>
  <line x1="502" y1="390" x2="488" y2="390" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="480,390 494,383 494,397" fill="#1d4ed8"/>

  <!-- Memory -->
  <rect x="575" y="105" width="160" height="365" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="655" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Memory (RAM)</text>
  <text x="655" y="150" text-anchor="middle" font-size="14" fill="#1a202c">instructions and data</text>
  <rect x="590" y="165" width="130" height="34" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="655" y="187" text-anchor="middle" font-size="14" fill="#1a202c">0: LOAD R1,5</text>
  <rect x="590" y="207" width="130" height="34" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="655" y="229" text-anchor="middle" font-size="14" fill="#1a202c">1: LOAD R2,3</text>
  <rect x="590" y="249" width="130" height="34" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="655" y="271" text-anchor="middle" font-size="14" fill="#1a202c">2: ADD R1,R2-&gt;R3</text>
  <rect x="590" y="291" width="130" height="34" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="655" y="313" text-anchor="middle" font-size="14" fill="#1a202c">3: PRINT R3</text>
  <rect x="590" y="333" width="130" height="34" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="655" y="355" text-anchor="middle" font-size="14" fill="#1a202c">4: HALT</text>
  <rect x="590" y="375" width="130" height="34" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="655" y="397" text-anchor="middle" font-size="14" fill="#1a202c">5: data ...</text>

  <line x1="544" y1="287" x2="567" y2="287" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="575,287 561,280 561,294" fill="#1d4ed8"/>

  <!-- Caption -->
  <text x="380" y="524" text-anchor="middle" font-size="14" fill="#1a202c">The PC picks the next instruction, the bus carries it in, the control unit decodes it, the ALU and registers carry it out.</text>
</svg>
