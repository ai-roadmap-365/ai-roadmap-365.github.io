<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each one is a gap between paper and code.">
  <title>Four governance failures</title>
  <style>
    .governance-hazards-bg   { fill: #f8fafc; }
    .governance-hazards-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .governance-hazards-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .governance-hazards-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .governance-hazards-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .governance-hazards-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .governance-hazards-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .governance-hazards-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .governance-hazards-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .governance-hazards-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .governance-hazards-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .governance-hazards-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .governance-hazards-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .governance-hazards-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .governance-hazards-stage { opacity: 1; }

    .governance-hazards-s0 { animation-delay: 0.00s; }
    .governance-hazards-e0 { animation-delay: 0.00s; }
    .governance-hazards-s1 { animation-delay: 1.28s; }
    .governance-hazards-e1 { animation-delay: 1.28s; }
    .governance-hazards-s2 { animation-delay: 2.56s; }
    .governance-hazards-e2 { animation-delay: 2.56s; }
    .governance-hazards-s3 { animation-delay: 3.84s; }
    .governance-hazards-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .governance-hazards-conn  { animation: governance-hazards-trace 6.4s ease-in-out infinite; }
      .governance-hazards-stage { animation: governance-hazards-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes governance-hazards-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes governance-hazards-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .governance-hazards-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .governance-hazards-stage { animation: governance-hazards-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes governance-hazards-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="governance-hazards-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="governance-hazards-bg" width="980" height="322"/>
  <text class="governance-hazards-h1"  x="30" y="40">Four governance failures</text>
  <text class="governance-hazards-sub" x="30" y="64">Each one is a gap between paper and code.</text>
  <g class="governance-hazards-stage governance-hazards-s0">
    <rect class="governance-hazards-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="governance-hazards-step" x="44" y="142">01</text>
    <text class="governance-hazards-name" x="70" y="142">The tier was never assessed</text>
    <text class="governance-hazards-desc" x="44" y="166">A high-risk use classified by</text>
    <text class="governance-hazards-desc" x="44" y="182">nobody, because it looked like a</text>
    <text class="governance-hazards-desc" x="44" y="198">chat feature.</text>
  </g>
  <line class="governance-hazards-line governance-hazards-conn governance-hazards-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#governance-hazards-tip)"/>
  <g class="governance-hazards-stage governance-hazards-s1">
    <rect class="governance-hazards-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="governance-hazards-step" x="280" y="142">02</text>
    <text class="governance-hazards-name" x="306" y="142">Bias asserted, not measured</text>
    <text class="governance-hazards-desc" x="280" y="166">No demographic parity test, so</text>
    <text class="governance-hazards-desc" x="280" y="182">the four-fifths ratio is</text>
    <text class="governance-hazards-desc" x="280" y="198">unknown.</text>
  </g>
  <line class="governance-hazards-line governance-hazards-conn governance-hazards-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#governance-hazards-tip)"/>
  <g class="governance-hazards-stage governance-hazards-s2">
    <rect class="governance-hazards-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="governance-hazards-step" x="516" y="142">03</text>
    <text class="governance-hazards-name" x="542" y="142">Oversight exists on paper</text>
    <text class="governance-hazards-desc" x="516" y="166">A kill switch nobody has reached</text>
    <text class="governance-hazards-desc" x="516" y="182">during an actual run.</text>
  </g>
  <line class="governance-hazards-line governance-hazards-conn governance-hazards-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#governance-hazards-tip)"/>
  <g class="governance-hazards-stage governance-hazards-s3">
    <rect class="governance-hazards-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="governance-hazards-step" x="752" y="142">04</text>
    <text class="governance-hazards-name" x="778" y="142">A model card two versions old</text>
    <text class="governance-hazards-desc" x="752" y="166">Describing weights that were</text>
    <text class="governance-hazards-desc" x="752" y="182">replaced twice.</text>
    <text class="governance-hazards-edge" x="752" y="242">version it</text>
  </g>
  <text class="governance-hazards-sub" x="30" y="304">The fourth is Day 362's documentation drift with a regulator as the reader, and the same fix applies: version the card with the weights, so replacing one without the other fails a check.</text>
</svg>
