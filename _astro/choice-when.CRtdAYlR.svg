<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By symptom.">
  <title>Choosing between them</title>
  <style>
    .choice-when-bg   { fill: #f8fafc; }
    .choice-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .choice-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .choice-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .choice-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .choice-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .choice-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .choice-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .choice-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .choice-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .choice-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .choice-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .choice-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .choice-when-row { opacity: 1; }
    .choice-when-r0 { animation-delay: 0.00s; }
    .choice-when-r1 { animation-delay: 0.45s; }
    .choice-when-r2 { animation-delay: 0.90s; }
    .choice-when-r3 { animation-delay: 1.35s; }
    .choice-when-r4 { animation-delay: 1.80s; }
    .choice-when-row { animation: choice-when-reveal 7.3s ease-in-out infinite; }
    @keyframes choice-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="choice-when-bg" width="980" height="390"/>
  <text class="choice-when-h1"  x="30" y="40">Choosing between them</text>
  <text class="choice-when-sub" x="30" y="64">By symptom.</text>
  <rect class="choice-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="choice-when-name" x="46" y="122">The symptom</text>
  <text class="choice-when-desc" x="46" y="142">What you observe.</text>
  <text class="choice-when-desc choice-when-row choice-when-r0" x="46" y="182">Does not know your facts</text>
  <text class="choice-when-desc choice-when-row choice-when-r1" x="46" y="216">Facts change frequently</text>
  <text class="choice-when-desc choice-when-row choice-when-r2" x="46" y="250">Wrong tone or output format</text>
  <text class="choice-when-desc choice-when-row choice-when-r3" x="46" y="284">Prompt is long and volume is high</text>
  <text class="choice-when-desc choice-when-row choice-when-r4" x="46" y="318">Needs to cite its sources</text>
  <rect class="choice-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="choice-when-name" x="526" y="122">The approach</text>
  <text class="choice-when-desc" x="526" y="142">What to use.</text>
  <text class="choice-when-desc choice-when-row choice-when-r0" x="526" y="182">Retrieval</text>
  <text class="choice-when-desc choice-when-row choice-when-r1" x="526" y="216">Retrieval, definitely not fine-tuning</text>
  <text class="choice-when-desc choice-when-row choice-when-r2" x="526" y="250">Prompting, then fine-tuning</text>
  <text class="choice-when-desc choice-when-row choice-when-r3" x="526" y="284">Fine-tuning, to shorten the prompt</text>
  <text class="choice-when-desc choice-when-row choice-when-r4" x="526" y="318">Retrieval, which fine-tuning cannot do</text>
  <text class="choice-when-sub" x="30" y="372">The second and fifth rows are the ones most often got wrong, and both point the same way: retrieval owns facts, and fine-tuning owns behaviour.</text>
</svg>
