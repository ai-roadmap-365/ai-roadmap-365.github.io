<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A cross-section, not the land.">
  <title>A map of terrain</title>
  <style>
    .map-terrain-bg   { fill: #f8fafc; }
    .map-terrain-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-terrain-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-terrain-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-terrain-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-terrain-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-terrain-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .map-terrain-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .map-terrain-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .map-terrain-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .map-terrain-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .map-terrain-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .map-terrain-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .map-terrain-row { opacity: 1; }
    .map-terrain-r0 { animation-delay: 0.00s; }
    .map-terrain-r1 { animation-delay: 0.45s; }
    .map-terrain-r2 { animation-delay: 0.90s; }
    .map-terrain-r3 { animation-delay: 1.35s; }
    .map-terrain-r4 { animation-delay: 1.80s; }
    .map-terrain-row { animation: map-terrain-reveal 7.3s ease-in-out infinite; }
    @keyframes map-terrain-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="map-terrain-bg" width="980" height="390"/>
  <text class="map-terrain-h1"  x="30" y="40">A map of terrain</text>
  <text class="map-terrain-sub" x="30" y="64">A cross-section, not the land.</text>
  <rect class="map-terrain-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="map-terrain-name" x="46" y="122">A cross-section</text>
  <text class="map-terrain-desc" x="46" y="142">One line through it.</text>
  <text class="map-terrain-desc map-terrain-row map-terrain-r0" x="46" y="182">Shows elevation along one path</text>
  <text class="map-terrain-desc map-terrain-row map-terrain-r1" x="46" y="216">Easy to read</text>
  <text class="map-terrain-desc map-terrain-row map-terrain-r2" x="46" y="250">May miss the ravine beside it</text>
  <text class="map-terrain-desc map-terrain-row map-terrain-r3" x="46" y="284">Choose the line carefully</text>
  <text class="map-terrain-desc map-terrain-row map-terrain-r4" x="46" y="318">This is a loss surface slice</text>
  <rect class="map-terrain-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="map-terrain-name" x="526" y="122">The full terrain</text>
  <text class="map-terrain-desc" x="526" y="142">All of it.</text>
  <text class="map-terrain-desc map-terrain-row map-terrain-r0" x="526" y="182">Every direction at once</text>
  <text class="map-terrain-desc map-terrain-row map-terrain-r1" x="526" y="216">Cannot be drawn on paper</text>
  <text class="map-terrain-desc map-terrain-row map-terrain-r2" x="526" y="250">Nothing is missed</text>
  <text class="map-terrain-desc map-terrain-row map-terrain-r3" x="526" y="284">No choice needed</text>
  <text class="map-terrain-desc map-terrain-row map-terrain-r4" x="526" y="318">This is the real parameter space</text>
  <text class="map-terrain-sub" x="30" y="372">Missing the ravine beside the path is precisely the risk with these plots, which is why they inform intuition rather than settle questions.</text>
</svg>
