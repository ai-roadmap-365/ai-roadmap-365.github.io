<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Between size and data.">
  <title>Splitting a compute budget</title>
  <style>
    .compute-optimal-bg   { fill: #f8fafc; }
    .compute-optimal-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compute-optimal-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compute-optimal-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compute-optimal-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compute-optimal-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compute-optimal-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .compute-optimal-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .compute-optimal-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .compute-optimal-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .compute-optimal-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .compute-optimal-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .compute-optimal-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .compute-optimal-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .compute-optimal-stage { opacity: 1; }

    .compute-optimal-s0 { animation-delay: 0.00s; }
    .compute-optimal-e0 { animation-delay: 0.00s; }
    .compute-optimal-s1 { animation-delay: 1.28s; }
    .compute-optimal-e1 { animation-delay: 1.28s; }
    .compute-optimal-s2 { animation-delay: 2.56s; }
    .compute-optimal-e2 { animation-delay: 2.56s; }
    .compute-optimal-s3 { animation-delay: 3.84s; }
    .compute-optimal-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .compute-optimal-conn  { animation: compute-optimal-trace 6.4s ease-in-out infinite; }
      .compute-optimal-stage { animation: compute-optimal-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes compute-optimal-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes compute-optimal-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .compute-optimal-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .compute-optimal-stage { animation: compute-optimal-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes compute-optimal-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="compute-optimal-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="compute-optimal-bg" width="980" height="322"/>
  <text class="compute-optimal-h1"  x="30" y="40">Splitting a compute budget</text>
  <text class="compute-optimal-sub" x="30" y="64">Between size and data.</text>
  <g class="compute-optimal-stage compute-optimal-s0">
    <rect class="compute-optimal-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="compute-optimal-step" x="44" y="142">01</text>
    <text class="compute-optimal-name" x="70" y="142">Compute is roughly size multiplied by data</text>
    <text class="compute-optimal-desc" x="44" y="166">So a fixed budget is a curve,</text>
    <text class="compute-optimal-desc" x="44" y="182">not a point.</text>
  </g>
  <line class="compute-optimal-line compute-optimal-conn compute-optimal-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#compute-optimal-tip)"/>
  <g class="compute-optimal-stage compute-optimal-s1">
    <rect class="compute-optimal-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="compute-optimal-step" x="280" y="142">02</text>
    <text class="compute-optimal-name" x="306" y="142">A large model on little data underfits its capacity</text>
    <text class="compute-optimal-desc" x="280" y="166">Parameters that never see enough</text>
    <text class="compute-optimal-desc" x="280" y="182">examples.</text>
  </g>
  <line class="compute-optimal-line compute-optimal-conn compute-optimal-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#compute-optimal-tip)"/>
  <g class="compute-optimal-stage compute-optimal-s2">
    <rect class="compute-optimal-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="compute-optimal-step" x="516" y="142">03</text>
    <text class="compute-optimal-name" x="542" y="142">A small model on vast data saturates</text>
    <text class="compute-optimal-desc" x="516" y="166">Capacity, not data, becomes the</text>
    <text class="compute-optimal-desc" x="516" y="182">limit.</text>
  </g>
  <line class="compute-optimal-line compute-optimal-conn compute-optimal-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#compute-optimal-tip)"/>
  <g class="compute-optimal-stage compute-optimal-s3">
    <rect class="compute-optimal-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="compute-optimal-step" x="752" y="142">04</text>
    <text class="compute-optimal-name" x="778" y="142">The optimum is roughly twenty tokens per parameter</text>
    <text class="compute-optimal-desc" x="752" y="166">And the largest early models</text>
    <text class="compute-optimal-desc" x="752" y="182">were far below it.</text>
  </g>
  <text class="compute-optimal-sub" x="30" y="304">The correction was large rather than marginal: models several times smaller, trained on several times more data, beat their predecessors at identical compute.</text>
</svg>
