<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Why low rank works</title>
  <style>
    .low-rank-math-bg   { fill: #f8fafc; }
    .low-rank-math-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .low-rank-math-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .low-rank-math-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .low-rank-math-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .low-rank-math-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .low-rank-math-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .low-rank-math-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .low-rank-math-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .low-rank-math-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .low-rank-math-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .low-rank-math-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .low-rank-math-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .low-rank-math-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .low-rank-math-stage { opacity: 1; }

    .low-rank-math-s0 { animation-delay: 0.00s; }
    .low-rank-math-e0 { animation-delay: 0.00s; }
    .low-rank-math-s1 { animation-delay: 1.28s; }
    .low-rank-math-e1 { animation-delay: 1.28s; }
    .low-rank-math-s2 { animation-delay: 2.56s; }
    .low-rank-math-e2 { animation-delay: 2.56s; }
    .low-rank-math-s3 { animation-delay: 3.84s; }
    .low-rank-math-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .low-rank-math-conn  { animation: low-rank-math-trace 6.4s ease-in-out infinite; }
      .low-rank-math-stage { animation: low-rank-math-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes low-rank-math-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes low-rank-math-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .low-rank-math-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .low-rank-math-stage { animation: low-rank-math-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes low-rank-math-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="low-rank-math-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="low-rank-math-bg" width="980" height="322"/>
  <text class="low-rank-math-h1"  x="30" y="40">Why low rank works</text>
  <text class="low-rank-math-sub" x="30" y="64">Four steps.</text>
  <g class="low-rank-math-stage low-rank-math-s0">
    <rect class="low-rank-math-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="low-rank-math-step" x="44" y="142">01</text>
    <text class="low-rank-math-name" x="70" y="142">A full fine-tune changes every weight</text>
    <text class="low-rank-math-desc" x="44" y="166">A dense update, the size of the</text>
    <text class="low-rank-math-desc" x="44" y="182">model.</text>
  </g>
  <line class="low-rank-math-line low-rank-math-conn low-rank-math-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#low-rank-math-tip)"/>
  <g class="low-rank-math-stage low-rank-math-s1">
    <rect class="low-rank-math-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="low-rank-math-step" x="280" y="142">02</text>
    <text class="low-rank-math-name" x="306" y="142">But the change a task needs is far simpler</text>
    <text class="low-rank-math-desc" x="280" y="166">Empirically, it has very low</text>
    <text class="low-rank-math-desc" x="280" y="182">rank.</text>
  </g>
  <line class="low-rank-math-line low-rank-math-conn low-rank-math-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#low-rank-math-tip)"/>
  <g class="low-rank-math-stage low-rank-math-s2">
    <rect class="low-rank-math-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="low-rank-math-step" x="516" y="142">03</text>
    <text class="low-rank-math-name" x="542" y="142">So represent it as two thin matrices multiplied</text>
    <text class="low-rank-math-desc" x="516" y="166">A tall one and a wide one,</text>
    <text class="low-rank-math-desc" x="516" y="182">meeting at a small rank.</text>
  </g>
  <line class="low-rank-math-line low-rank-math-conn low-rank-math-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#low-rank-math-tip)"/>
  <g class="low-rank-math-stage low-rank-math-s3">
    <rect class="low-rank-math-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="low-rank-math-step" x="752" y="142">04</text>
    <text class="low-rank-math-name" x="778" y="142">Which needs a tiny fraction of the parameters</text>
    <text class="low-rank-math-desc" x="752" y="166">For nearly the same effect.</text>
    <text class="low-rank-math-edge" x="752" y="242">rank r</text>
  </g>
  <text class="low-rank-math-sub" x="30" y="304">That the necessary update is low-rank is an empirical finding rather than a mathematical necessity, and it is the entire load-bearing claim of the method.</text>
</svg>
