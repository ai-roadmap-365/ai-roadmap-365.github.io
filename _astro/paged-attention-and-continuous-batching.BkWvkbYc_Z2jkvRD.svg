<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="PagedAttention and Continuous Batching Architecture">
  <title>PagedAttention and Continuous Batching Architecture</title>
  <rect width="100%" height="100%" fill="#f8fafc" />
  
    <style>
      .d279a-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d279a-header { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .d279a-text { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .d279a-accent { fill: #1d4ed8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .d279a-arrow { stroke: #1d4ed8; stroke-width: 2; stroke-linecap: round; marker-end: url(#d279a-arrowhead); }
      .d279a-pulse { animation: d279a-glow 2.5s infinite ease-in-out; }
      @keyframes d279a-glow {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(29, 78, 216, 0.2)); }
        50% { filter: drop-shadow(0 0 6px rgba(29, 78, 216, 0.6)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .d279a-pulse { animation: none; }
      }
    </style>
    
  
    <defs>
      <marker id="d279a-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8" />
      </marker>
    </defs>
    
  
  <g transform="translate(40, 40)">
    <rect class="d279a-box" x="0" y="0" width="220" height="240" />
    <text class="d279a-header" x="20" y="35">Static Batching (Legacy)</text>
    <text class="d279a-text" x="20" y="70">• Pad to longest sequence</text>
    <text class="d279a-text" x="20" y="95">• Lock entire batch to slowest</text>
    <text class="d279a-text" x="20" y="120">• Severe GPU Bubble / Idle</text>
    <text class="d279a-text" x="20" y="145">• GPU Utilization: ~25%</text>
    <text class="d279a-accent" x="20" y="195">High latency overhead</text>
  </g>

  <g transform="translate(290, 40)">
    <rect class="d279a-box d279a-pulse" x="0" y="0" width="220" height="240" />
    <text class="d279a-header" x="20" y="35">Continuous Batching (vLLM)</text>
    <text class="d279a-text" x="20" y="70">• Iteration-level scheduling</text>
    <text class="d279a-text" x="20" y="95">• Evict completed requests</text>
    <text class="d279a-text" x="20" y="120">• Inject new incoming requests</text>
    <text class="d279a-text" x="20" y="145">• Zero idle waiting slots</text>
    <text class="d279a-accent" x="20" y="195">GPU Utilization: &gt;90%</text>
  </g>

  <g transform="translate(540, 40)">
    <rect class="d279a-box d279a-pulse" x="0" y="0" width="220" height="240" />
    <text class="d279a-header" x="20" y="35">PagedAttention KV Engine</text>
    <text class="d279a-text" x="20" y="70">• Virtual memory paging</text>
    <text class="d279a-text" x="20" y="95">• Non-contiguous KV blocks</text>
    <text class="d279a-text" x="20" y="120">• Zero memory fragmentation</text>
    <text class="d279a-text" x="20" y="145">• Shared prefix caching</text>
    <text class="d279a-accent" x="20" y="195">4x-8x Throughput Boost</text>
  </g>

</svg>