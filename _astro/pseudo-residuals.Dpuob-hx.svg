<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three cases.">
  <title>Pseudo-residuals by loss</title>
  <style>
    .pseudo-residuals-bg   { fill: #f8fafc; }
    .pseudo-residuals-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pseudo-residuals-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pseudo-residuals-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pseudo-residuals-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pseudo-residuals-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pseudo-residuals-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pseudo-residuals-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pseudo-residuals-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pseudo-residuals-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pseudo-residuals-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pseudo-residuals-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pseudo-residuals-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pseudo-residuals-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pseudo-residuals-stage { opacity: 1; }

    .pseudo-residuals-s0 { animation-delay: 0.00s; }
    .pseudo-residuals-e0 { animation-delay: 0.00s; }
    .pseudo-residuals-s1 { animation-delay: 1.50s; }
    .pseudo-residuals-e1 { animation-delay: 1.50s; }
    .pseudo-residuals-s2 { animation-delay: 3.00s; }
    .pseudo-residuals-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .pseudo-residuals-conn  { animation: pseudo-residuals-trace 6s ease-in-out infinite; }
      .pseudo-residuals-stage { animation: pseudo-residuals-arrive 6s ease-in-out infinite; }
    }
    @keyframes pseudo-residuals-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pseudo-residuals-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pseudo-residuals-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pseudo-residuals-stage { animation: pseudo-residuals-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pseudo-residuals-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pseudo-residuals-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pseudo-residuals-bg" width="980" height="322"/>
  <text class="pseudo-residuals-h1"  x="30" y="40">Pseudo-residuals by loss</text>
  <text class="pseudo-residuals-sub" x="30" y="64">Three cases.</text>
  <g class="pseudo-residuals-stage pseudo-residuals-s0">
    <rect class="pseudo-residuals-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="pseudo-residuals-step" x="44" y="142">01</text>
    <text class="pseudo-residuals-name" x="70" y="142">Squared error</text>
    <text class="pseudo-residuals-desc" x="44" y="166">The gradient is the plain residual. The</text>
    <text class="pseudo-residuals-desc" x="44" y="182">classical case.</text>
  </g>
  <line class="pseudo-residuals-line pseudo-residuals-conn pseudo-residuals-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#pseudo-residuals-tip)"/>
  <g class="pseudo-residuals-stage pseudo-residuals-s1">
    <rect class="pseudo-residuals-good" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="pseudo-residuals-step" x="359" y="142">02</text>
    <text class="pseudo-residuals-name" x="385" y="142">Absolute error</text>
    <text class="pseudo-residuals-desc" x="359" y="166">The gradient is just the sign. Robust to</text>
    <text class="pseudo-residuals-desc" x="359" y="182">outliers.</text>
  </g>
  <line class="pseudo-residuals-line pseudo-residuals-conn pseudo-residuals-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#pseudo-residuals-tip)"/>
  <g class="pseudo-residuals-stage pseudo-residuals-s2">
    <rect class="pseudo-residuals-box" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="pseudo-residuals-step" x="674" y="142">03</text>
    <text class="pseudo-residuals-name" x="700" y="142">Log loss</text>
    <text class="pseudo-residuals-desc" x="674" y="166">The gradient is predicted minus actual</text>
    <text class="pseudo-residuals-desc" x="674" y="182">probability. For classification.</text>
  </g>
  <text class="pseudo-residuals-sub" x="30" y="304">The absolute-error case is worth noting: because only the sign is used, one wild outlier moves the fit no more than a slightly wrong point does.</text>
</svg>
