<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four facts.">
  <title>Dictionary performance</title>
  <style>
    .dict-perf-bg   { fill: #f8fafc; }
    .dict-perf-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dict-perf-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dict-perf-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dict-perf-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dict-perf-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dict-perf-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dict-perf-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dict-perf-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dict-perf-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dict-perf-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dict-perf-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dict-perf-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .dict-perf-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .dict-perf-stage { opacity: 1; }

    .dict-perf-s0 { animation-delay: 0.00s; }
    .dict-perf-e0 { animation-delay: 0.00s; }
    .dict-perf-s1 { animation-delay: 1.28s; }
    .dict-perf-e1 { animation-delay: 1.28s; }
    .dict-perf-s2 { animation-delay: 2.56s; }
    .dict-perf-e2 { animation-delay: 2.56s; }
    .dict-perf-s3 { animation-delay: 3.84s; }
    .dict-perf-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .dict-perf-conn  { animation: dict-perf-trace 6.4s ease-in-out infinite; }
      .dict-perf-stage { animation: dict-perf-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes dict-perf-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes dict-perf-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .dict-perf-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .dict-perf-stage { animation: dict-perf-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes dict-perf-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="dict-perf-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="dict-perf-bg" width="980" height="322"/>
  <text class="dict-perf-h1"  x="30" y="40">Dictionary performance</text>
  <text class="dict-perf-sub" x="30" y="64">Four facts.</text>
  <g class="dict-perf-stage dict-perf-s0">
    <rect class="dict-perf-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="dict-perf-step" x="44" y="142">01</text>
    <text class="dict-perf-name" x="70" y="142">Lookup and insertion are constant on average</text>
    <text class="dict-perf-desc" x="44" y="166">Independent of the number of</text>
    <text class="dict-perf-desc" x="44" y="182">entries.</text>
  </g>
  <line class="dict-perf-line dict-perf-conn dict-perf-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#dict-perf-tip)"/>
  <g class="dict-perf-stage dict-perf-s1">
    <rect class="dict-perf-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="dict-perf-step" x="280" y="142">02</text>
    <text class="dict-perf-name" x="306" y="142">But memory overhead per entry is substantial</text>
    <text class="dict-perf-desc" x="280" y="166">Far more than a list of pairs.</text>
  </g>
  <line class="dict-perf-line dict-perf-conn dict-perf-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#dict-perf-tip)"/>
  <g class="dict-perf-stage dict-perf-s2">
    <rect class="dict-perf-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="dict-perf-step" x="516" y="142">03</text>
    <text class="dict-perf-name" x="542" y="142">And resizing occasionally costs a full rehash</text>
    <text class="dict-perf-desc" x="516" y="166">Amortised away, but it does</text>
    <text class="dict-perf-desc" x="516" y="182">happen.</text>
  </g>
  <line class="dict-perf-line dict-perf-conn dict-perf-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#dict-perf-tip)"/>
  <g class="dict-perf-stage dict-perf-s3">
    <rect class="dict-perf-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="dict-perf-step" x="752" y="142">04</text>
    <text class="dict-perf-name" x="778" y="142">While iteration is fast and in insertion order</text>
    <text class="dict-perf-desc" x="752" y="166">With no sorting cost.</text>
  </g>
  <text class="dict-perf-sub" x="30" y="304">The memory overhead is what makes a dictionary the wrong choice for millions of small records, where a dataframe or an array of structs is far leaner.</text>
</svg>
