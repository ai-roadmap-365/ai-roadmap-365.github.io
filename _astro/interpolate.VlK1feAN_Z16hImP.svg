<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Interpolation, not extrapolation</title>
  <style>
    .interpolate-bg   { fill: #f8fafc; }
    .interpolate-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interpolate-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interpolate-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interpolate-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interpolate-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interpolate-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .interpolate-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .interpolate-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .interpolate-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .interpolate-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .interpolate-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .interpolate-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .interpolate-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .interpolate-stage { opacity: 1; }

    .interpolate-s0 { animation-delay: 0.00s; }
    .interpolate-e0 { animation-delay: 0.00s; }
    .interpolate-s1 { animation-delay: 1.28s; }
    .interpolate-e1 { animation-delay: 1.28s; }
    .interpolate-s2 { animation-delay: 2.56s; }
    .interpolate-e2 { animation-delay: 2.56s; }
    .interpolate-s3 { animation-delay: 3.84s; }
    .interpolate-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .interpolate-conn  { animation: interpolate-trace 6.4s ease-in-out infinite; }
      .interpolate-stage { animation: interpolate-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes interpolate-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes interpolate-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .interpolate-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .interpolate-stage { animation: interpolate-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes interpolate-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="interpolate-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="interpolate-bg" width="980" height="322"/>
  <text class="interpolate-h1"  x="30" y="40">Interpolation, not extrapolation</text>
  <text class="interpolate-sub" x="30" y="64">Four steps.</text>
  <g class="interpolate-stage interpolate-s0">
    <rect class="interpolate-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="interpolate-step" x="44" y="142">01</text>
    <text class="interpolate-name" x="70" y="142">Training data covers a region of the input space</text>
    <text class="interpolate-desc" x="44" y="166">Bounded, in every dimension.</text>
  </g>
  <line class="interpolate-line interpolate-conn interpolate-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#interpolate-tip)"/>
  <g class="interpolate-stage interpolate-s1">
    <rect class="interpolate-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="interpolate-step" x="280" y="142">02</text>
    <text class="interpolate-name" x="306" y="142">Inside that region, predictions are supported by examples</text>
    <text class="interpolate-desc" x="280" y="166">Which is interpolation.</text>
  </g>
  <line class="interpolate-line interpolate-conn interpolate-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#interpolate-tip)"/>
  <g class="interpolate-stage interpolate-s2">
    <rect class="interpolate-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="interpolate-step" x="516" y="142">03</text>
    <text class="interpolate-name" x="542" y="142">Outside it, nothing constrained the model</text>
    <text class="interpolate-desc" x="516" y="166">So it produces something,</text>
    <text class="interpolate-desc" x="516" y="182">confidently, on no evidence.</text>
  </g>
  <line class="interpolate-line interpolate-conn interpolate-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#interpolate-tip)"/>
  <g class="interpolate-stage interpolate-s3">
    <rect class="interpolate-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="interpolate-step" x="752" y="142">04</text>
    <text class="interpolate-name" x="778" y="142">So check whether new inputs lie inside the training range</text>
    <text class="interpolate-desc" x="752" y="166">Which is a monitoring job, not a</text>
    <text class="interpolate-desc" x="752" y="182">modelling one.</text>
  </g>
  <text class="interpolate-sub" x="30" y="304">Confident predictions outside the training range are the quiet production failure, because nothing in the output distinguishes them from supported ones.</text>
</svg>
