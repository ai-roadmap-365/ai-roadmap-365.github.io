<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two properties separate them.">
  <title>A deployment, not an exposed container</title>
  <style>
    .deployed-or-exposed-bg   { fill: #f8fafc; }
    .deployed-or-exposed-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deployed-or-exposed-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deployed-or-exposed-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deployed-or-exposed-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deployed-or-exposed-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deployed-or-exposed-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .deployed-or-exposed-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .deployed-or-exposed-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .deployed-or-exposed-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .deployed-or-exposed-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .deployed-or-exposed-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .deployed-or-exposed-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .deployed-or-exposed-row { opacity: 1; }
    .deployed-or-exposed-r0 { animation-delay: 0.00s; }
    .deployed-or-exposed-r1 { animation-delay: 0.45s; }
    .deployed-or-exposed-r2 { animation-delay: 0.90s; }
    .deployed-or-exposed-r3 { animation-delay: 1.35s; }
    .deployed-or-exposed-r4 { animation-delay: 1.80s; }
    .deployed-or-exposed-row { animation: deployed-or-exposed-reveal 7.3s ease-in-out infinite; }
    @keyframes deployed-or-exposed-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="deployed-or-exposed-bg" width="980" height="390"/>
  <text class="deployed-or-exposed-h1"  x="30" y="40">A deployment, not an exposed container</text>
  <text class="deployed-or-exposed-sub" x="30" y="64">Two properties separate them.</text>
  <rect class="deployed-or-exposed-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="deployed-or-exposed-name" x="46" y="122">A deployment</text>
  <text class="deployed-or-exposed-desc" x="46" y="142">Guardrails at every layer.</text>
  <text class="deployed-or-exposed-desc deployed-or-exposed-row deployed-or-exposed-r0" x="46" y="182">A proxy with auth and rate limiting</text>
  <text class="deployed-or-exposed-desc deployed-or-exposed-row deployed-or-exposed-r1" x="46" y="216">Queue-aware routing</text>
  <text class="deployed-or-exposed-desc deployed-or-exposed-row deployed-or-exposed-r2" x="46" y="250">Distinct startup, readiness and liveness probes</text>
  <text class="deployed-or-exposed-desc deployed-or-exposed-row deployed-or-exposed-r3" x="46" y="284">Circuit breaking with a fallback</text>
  <text class="deployed-or-exposed-desc deployed-or-exposed-row deployed-or-exposed-r4" x="46" y="318">TTFT, ITL and queue depth recorded</text>
  <rect class="deployed-or-exposed-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="deployed-or-exposed-name" x="526" y="122">An exposed container</text>
  <text class="deployed-or-exposed-desc" x="526" y="142">One process, one port.</text>
  <text class="deployed-or-exposed-desc deployed-or-exposed-row deployed-or-exposed-r0" x="526" y="182">Directly reachable from the internet</text>
  <text class="deployed-or-exposed-desc deployed-or-exposed-row deployed-or-exposed-r1" x="526" y="216">Round-robin, or nothing</text>
  <text class="deployed-or-exposed-desc deployed-or-exposed-row deployed-or-exposed-r2" x="526" y="250">One probe doing three jobs</text>
  <text class="deployed-or-exposed-desc deployed-or-exposed-row deployed-or-exposed-r3" x="526" y="284">An exception becomes a 500</text>
  <text class="deployed-or-exposed-desc deployed-or-exposed-row deployed-or-exposed-r4" x="526" y="318">No visibility into saturation</text>
  <text class="deployed-or-exposed-sub" x="30" y="372">The probe row is where most first deployments fail: a single health endpoint used for startup, readiness and liveness will either kill a loading pod or route traffic to one, and usually both at different moments.</text>
</svg>
