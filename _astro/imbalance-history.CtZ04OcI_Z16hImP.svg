<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From ignoring it to metrics.">
  <title>Four steps in imbalance handling</title>
  <style>
    .imbalance-history-bg   { fill: #f8fafc; }
    .imbalance-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .imbalance-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .imbalance-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .imbalance-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .imbalance-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .imbalance-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .imbalance-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .imbalance-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .imbalance-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .imbalance-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .imbalance-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .imbalance-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .imbalance-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .imbalance-history-stage { opacity: 1; }

    .imbalance-history-s0 { animation-delay: 0.00s; }
    .imbalance-history-e0 { animation-delay: 0.00s; }
    .imbalance-history-s1 { animation-delay: 1.28s; }
    .imbalance-history-e1 { animation-delay: 1.28s; }
    .imbalance-history-s2 { animation-delay: 2.56s; }
    .imbalance-history-e2 { animation-delay: 2.56s; }
    .imbalance-history-s3 { animation-delay: 3.84s; }
    .imbalance-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .imbalance-history-conn  { animation: imbalance-history-trace 6.4s ease-in-out infinite; }
      .imbalance-history-stage { animation: imbalance-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes imbalance-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes imbalance-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .imbalance-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .imbalance-history-stage { animation: imbalance-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes imbalance-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="imbalance-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="imbalance-history-bg" width="980" height="322"/>
  <text class="imbalance-history-h1"  x="30" y="40">Four steps in imbalance handling</text>
  <text class="imbalance-history-sub" x="30" y="64">From ignoring it to metrics.</text>
  <g class="imbalance-history-stage imbalance-history-s0">
    <rect class="imbalance-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="imbalance-history-step" x="44" y="142">01</text>
    <text class="imbalance-history-name" x="70" y="142">Ignored, while accuracy was the reported metric</text>
    <text class="imbalance-history-desc" x="44" y="166">Which hid the problem entirely.</text>
  </g>
  <line class="imbalance-history-line imbalance-history-conn imbalance-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#imbalance-history-tip)"/>
  <g class="imbalance-history-stage imbalance-history-s1">
    <rect class="imbalance-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="imbalance-history-step" x="280" y="142">02</text>
    <text class="imbalance-history-name" x="306" y="142">Then naive resampling</text>
    <text class="imbalance-history-desc" x="280" y="166">Duplicate the rare, or discard</text>
    <text class="imbalance-history-desc" x="280" y="182">the common.</text>
  </g>
  <line class="imbalance-history-line imbalance-history-conn imbalance-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#imbalance-history-tip)"/>
  <g class="imbalance-history-stage imbalance-history-s2">
    <rect class="imbalance-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="imbalance-history-step" x="516" y="142">03</text>
    <text class="imbalance-history-name" x="542" y="142">Then synthetic minority generation</text>
    <text class="imbalance-history-desc" x="516" y="166">Interpolating between rare</text>
    <text class="imbalance-history-desc" x="516" y="182">examples.</text>
  </g>
  <line class="imbalance-history-line imbalance-history-conn imbalance-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#imbalance-history-tip)"/>
  <g class="imbalance-history-stage imbalance-history-s3">
    <rect class="imbalance-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="imbalance-history-step" x="752" y="142">04</text>
    <text class="imbalance-history-name" x="778" y="142">And finally cost-sensitive learning</text>
    <text class="imbalance-history-desc" x="752" y="166">Which addresses the objective</text>
    <text class="imbalance-history-desc" x="752" y="182">rather than the data.</text>
  </g>
  <text class="imbalance-history-sub" x="30" y="304">The progression moved from changing the data to changing the objective, which is generally the more principled direction and the one with fewer ways to go wrong.</text>
</svg>
