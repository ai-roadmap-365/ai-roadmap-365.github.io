<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The line is arguments in the middle.">
  <title>Alias or function?</title>
  <style>
    .alias-versus-function-bg   { fill: #f8fafc; }
    .alias-versus-function-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .alias-versus-function-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .alias-versus-function-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .alias-versus-function-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .alias-versus-function-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .alias-versus-function-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .alias-versus-function-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .alias-versus-function-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .alias-versus-function-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .alias-versus-function-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .alias-versus-function-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .alias-versus-function-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .alias-versus-function-row { opacity: 1; }
    .alias-versus-function-r0 { animation-delay: 0.00s; }
    .alias-versus-function-r1 { animation-delay: 0.45s; }
    .alias-versus-function-r2 { animation-delay: 0.90s; }
    .alias-versus-function-r3 { animation-delay: 1.35s; }
    .alias-versus-function-r4 { animation-delay: 1.80s; }
    .alias-versus-function-row { animation: alias-versus-function-reveal 7.3s ease-in-out infinite; }
    @keyframes alias-versus-function-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="alias-versus-function-bg" width="980" height="390"/>
  <text class="alias-versus-function-h1"  x="30" y="40">Alias or function?</text>
  <text class="alias-versus-function-sub" x="30" y="64">The line is arguments in the middle.</text>
  <rect class="alias-versus-function-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="alias-versus-function-name" x="46" y="122">Alias</text>
  <text class="alias-versus-function-desc" x="46" y="142">Pure text substitution.</text>
  <text class="alias-versus-function-desc alias-versus-function-row alias-versus-function-r0" x="46" y="182">alias ll='ls -la'</text>
  <text class="alias-versus-function-desc alias-versus-function-row alias-versus-function-r1" x="46" y="216">Arguments append to the end only</text>
  <text class="alias-versus-function-desc alias-versus-function-row alias-versus-function-r2" x="46" y="250">No conditionals, no loops</text>
  <text class="alias-versus-function-desc alias-versus-function-row alias-versus-function-r3" x="46" y="284">One line, always</text>
  <text class="alias-versus-function-desc alias-versus-function-row alias-versus-function-r4" x="46" y="318">Perfect for fixed shorthand</text>
  <rect class="alias-versus-function-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="alias-versus-function-name" x="526" y="122">Function</text>
  <text class="alias-versus-function-desc" x="526" y="142">A small program in your shell.</text>
  <text class="alias-versus-function-desc alias-versus-function-row alias-versus-function-r0" x="526" y="182">mkcd() { mkdir -p "$1" &amp;&amp; cd "$1"; }</text>
  <text class="alias-versus-function-desc alias-versus-function-row alias-versus-function-r1" x="526" y="216">$1, $2 place arguments anywhere</text>
  <text class="alias-versus-function-desc alias-versus-function-row alias-versus-function-r2" x="526" y="250">Conditionals, loops, multiple commands</text>
  <text class="alias-versus-function-desc alias-versus-function-row alias-versus-function-r3" x="526" y="284">As many lines as you need</text>
  <text class="alias-versus-function-desc alias-versus-function-row alias-versus-function-r4" x="526" y="318">Anything with logic or positional arguments</text>
  <text class="alias-versus-function-sub" x="30" y="372">Both belong in your config file, where they load in every new shell and become a personal toolkit that follows you between machines.</text>
</svg>
