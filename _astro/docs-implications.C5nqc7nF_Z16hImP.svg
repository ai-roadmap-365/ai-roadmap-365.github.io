<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are disclosure risks.">
  <title>Five things documentation leaks or claims</title>
  <style>
    .docs-implications-bg   { fill: #f8fafc; }
    .docs-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docs-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docs-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docs-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docs-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docs-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .docs-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .docs-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .docs-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .docs-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .docs-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .docs-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .docs-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .docs-implications-stage { opacity: 1; }

    .docs-implications-s0 { animation-delay: 0.00s; }
    .docs-implications-e0 { animation-delay: 0.00s; }
    .docs-implications-s1 { animation-delay: 1.33s; }
    .docs-implications-e1 { animation-delay: 1.33s; }
    .docs-implications-s2 { animation-delay: 2.67s; }
    .docs-implications-e2 { animation-delay: 2.67s; }
    .docs-implications-s3 { animation-delay: 4.00s; }
    .docs-implications-e3 { animation-delay: 4.00s; }
    .docs-implications-s4 { animation-delay: 5.33s; }
    .docs-implications-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .docs-implications-conn  { animation: docs-implications-trace 8s ease-in-out infinite; }
      .docs-implications-stage { animation: docs-implications-arrive 8s ease-in-out infinite; }
    }
    @keyframes docs-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes docs-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .docs-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .docs-implications-stage { animation: docs-implications-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes docs-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="docs-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="docs-implications-bg" width="980" height="322"/>
  <text class="docs-implications-h1"  x="30" y="40">Five things documentation leaks or claims</text>
  <text class="docs-implications-sub" x="30" y="64">Two are disclosure risks.</text>
  <g class="docs-implications-stage docs-implications-s0">
    <rect class="docs-implications-warn" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="docs-implications-step" x="44" y="142">01</text>
    <text class="docs-implications-name" x="70" y="142">Documentation is a disclosure surface</text>
    <text class="docs-implications-desc" x="44" y="166">Real hostnames, internal</text>
    <text class="docs-implications-desc" x="44" y="182">service names, a token in</text>
    <text class="docs-implications-desc" x="44" y="198">a quoted error.</text>
    <text class="docs-implications-edge" x="44" y="242">security</text>
  </g>
  <line class="docs-implications-line docs-implications-conn docs-implications-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#docs-implications-tip)"/>
  <g class="docs-implications-stage docs-implications-s1">
    <rect class="docs-implications-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="docs-implications-step" x="233" y="142">02</text>
    <text class="docs-implications-name" x="259" y="142">A demo publishes its data</text>
    <text class="docs-implications-desc" x="233" y="166">Record against a fixture</text>
    <text class="docs-implications-desc" x="233" y="182">corpus you own.</text>
    <text class="docs-implications-edge" x="233" y="242">privacy</text>
  </g>
  <line class="docs-implications-line docs-implications-conn docs-implications-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#docs-implications-tip)"/>
  <g class="docs-implications-stage docs-implications-s2">
    <rect class="docs-implications-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="docs-implications-step" x="422" y="142">03</text>
    <text class="docs-implications-name" x="448" y="142">Attach conditions to any number</text>
    <text class="docs-implications-desc" x="422" y="166">"p95 840 ms over 200</text>
    <text class="docs-implications-desc" x="422" y="182">requests, 5,000</text>
    <text class="docs-implications-desc" x="422" y="198">documents" is a claim.</text>
    <text class="docs-implications-edge" x="422" y="242">performance</text>
  </g>
  <line class="docs-implications-line docs-implications-conn docs-implications-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#docs-implications-tip)"/>
  <g class="docs-implications-stage docs-implications-s3">
    <rect class="docs-implications-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="docs-implications-step" x="611" y="142">04</text>
    <text class="docs-implications-name" x="637" y="142">Say what you tested</text>
    <text class="docs-implications-desc" x="611" y="166">Five thousand documents,</text>
    <text class="docs-implications-desc" x="611" y="182">not "scales well".</text>
    <text class="docs-implications-edge" x="611" y="242">scalability</text>
  </g>
  <line class="docs-implications-line docs-implications-conn docs-implications-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#docs-implications-tip)"/>
  <g class="docs-implications-stage docs-implications-s4">
    <rect class="docs-implications-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="docs-implications-step" x="800" y="142">05</text>
    <text class="docs-implications-name" x="826" y="142">Publish what running it costs</text>
    <text class="docs-implications-desc" x="800" y="166">A reader who deploys</text>
    <text class="docs-implications-desc" x="800" y="182">blind and gets a bill</text>
    <text class="docs-implications-desc" x="800" y="198">will not be pleased.</text>
    <text class="docs-implications-edge" x="800" y="242">money</text>
  </g>
  <text class="docs-implications-sub" x="30" y="304">The third and fourth are the same discipline as the rubric's spine: a number with its conditions attached is a claim someone can check, and one without them is an impression.</text>
</svg>
