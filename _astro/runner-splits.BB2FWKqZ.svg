<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The average pace hides both halves.">
  <title>A runner reviewing a race</title>
  <style>
    .runner-splits-bg   { fill: #f8fafc; }
    .runner-splits-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .runner-splits-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .runner-splits-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .runner-splits-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .runner-splits-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .runner-splits-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .runner-splits-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .runner-splits-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .runner-splits-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .runner-splits-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .runner-splits-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .runner-splits-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .runner-splits-row { opacity: 1; }
    .runner-splits-r0 { animation-delay: 0.00s; }
    .runner-splits-r1 { animation-delay: 0.45s; }
    .runner-splits-r2 { animation-delay: 0.90s; }
    .runner-splits-r3 { animation-delay: 1.35s; }
    .runner-splits-r4 { animation-delay: 1.80s; }
    .runner-splits-row { animation: runner-splits-reveal 7.3s ease-in-out infinite; }
    @keyframes runner-splits-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="runner-splits-bg" width="980" height="390"/>
  <text class="runner-splits-h1"  x="30" y="40">A runner reviewing a race</text>
  <text class="runner-splits-sub" x="30" y="64">The average pace hides both halves.</text>
  <rect class="runner-splits-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="runner-splits-name" x="46" y="122">Average pace</text>
  <text class="runner-splits-desc" x="46" y="142">"Slightly slower than target".</text>
  <text class="runner-splits-desc runner-splits-row runner-splits-r0" x="46" y="182">Hides a fast start</text>
  <text class="runner-splits-desc runner-splits-row runner-splits-r1" x="46" y="216">Hides a collapse</text>
  <text class="runner-splits-desc runner-splits-row runner-splits-r2" x="46" y="250">Suggests "train more"</text>
  <text class="runner-splits-desc runner-splits-row runner-splits-r3" x="46" y="284">Which addresses neither</text>
  <text class="runner-splits-desc runner-splits-row runner-splits-r4" x="46" y="318">The same as a project median of 1.2x</text>
  <rect class="runner-splits-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="runner-splits-name" x="526" y="122">Split times</text>
  <text class="runner-splits-desc" x="526" y="142">Two different problems.</text>
  <text class="runner-splits-desc runner-splits-row runner-splits-r0" x="526" y="182">First 3 km: 30 seconds fast</text>
  <text class="runner-splits-desc runner-splits-row runner-splits-r1" x="526" y="216">Last 5 km: two minutes slow</text>
  <text class="runner-splits-desc runner-splits-row runner-splits-r2" x="526" y="250">A pacing problem, not stamina</text>
  <text class="runner-splits-desc runner-splits-row runner-splits-r3" x="526" y="284">The fix is a pacing discipline</text>
  <text class="runner-splits-desc runner-splits-row runner-splits-r4" x="526" y="318">The same as 1.15x against 3.33x</text>
  <text class="runner-splits-sub" x="30" y="372">And the incident equivalent: a runner who cramped at kilometre 18 asks what would have prevented it — hydration, or a pace they could hold. "Try harder" is not on that list.</text>
</svg>
