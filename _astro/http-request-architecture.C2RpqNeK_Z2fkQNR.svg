<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 860" role="img" aria-labelledby="archTitle archDesc" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="archTitle">The architecture of one HTTP call, from client to server</title>
  <desc id="archDesc">A client, a DNS resolver, a TCP and TLS handshake, the request and response messages with their parts labelled, an intermediary proxy or CDN, and the origin server — with the places a timeout, a retry and a status code each live.</desc>

  <rect x="0" y="0" width="1180" height="860" fill="#f8fafc"/>

  <text x="590" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">One HTTP call, end to end</text>
  <text x="590" y="60" text-anchor="middle" font-size="15" fill="#475569">Everything between your function call and the bytes coming back</text>

  <!-- CLIENT -->
  <rect x="30" y="90" width="250" height="250" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="30" y="90" width="250" height="30" rx="10" fill="#1d4ed8"/>
  <text x="155" y="111" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">YOUR PROCESS</text>
  <text x="46" y="146" font-size="14" fill="#1a202c">session.get(url,</text>
  <text x="46" y="166" font-size="14" fill="#1a202c">    params={...},</text>
  <text x="46" y="186" font-size="14" font-weight="700" fill="#1d4ed8">    timeout=(3.05, 10))</text>
  <line x1="46" y1="200" x2="264" y2="200" stroke="#cbd5e1" stroke-width="1"/>
  <text x="46" y="222" font-size="14" fill="#1a202c">Session holds:</text>
  <text x="46" y="242" font-size="14" fill="#475569">• shared headers</text>
  <text x="46" y="262" font-size="14" fill="#475569">• a pool of open</text>
  <text x="46" y="280" font-size="14" fill="#475569">  connections</text>
  <text x="46" y="302" font-size="14" fill="#475569">• cookies</text>
  <text x="46" y="326" font-size="14" font-weight="700" fill="#b45309">retry lives HERE</text>

  <!-- DNS -->
  <rect x="320" y="90" width="200" height="105" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="420" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">1. DNS</text>
  <text x="336" y="139" font-size="14" fill="#475569">name → address</text>
  <text x="336" y="159" font-size="14" fill="#475569">cached, often 0 ms</text>
  <text x="336" y="179" font-size="14" fill="#475569">can fail: ConnectionError</text>

  <!-- TCP/TLS -->
  <rect x="320" y="215" width="200" height="125" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="420" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">2. TCP + TLS</text>
  <text x="336" y="264" font-size="14" fill="#475569">SYN, SYN-ACK, ACK</text>
  <text x="336" y="284" font-size="14" fill="#475569">then the TLS handshake</text>
  <text x="336" y="304" font-size="14" font-weight="700" fill="#1d4ed8">connect timeout: 3.05s</text>
  <text x="336" y="324" font-size="14" fill="#475569">reused by a Session</text>

  <!-- REQUEST MESSAGE -->
  <rect x="560" y="90" width="290" height="180" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="560" y="90" width="290" height="28" rx="10" fill="#1d4ed8"/>
  <text x="705" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3. THE REQUEST</text>
  <text x="574" y="140" font-size="14" font-weight="700" fill="#1a202c">GET /api/readings?station=A HTTP/1.1</text>
  <text x="574" y="158" font-size="13" fill="#64748b">method · path + query · version</text>
  <text x="574" y="184" font-size="14" fill="#1a202c">Host: api.example</text>
  <text x="574" y="202" font-size="14" fill="#1a202c">User-Agent: yourtool/1.0</text>
  <text x="574" y="220" font-size="14" fill="#1a202c">Accept: application/json</text>
  <text x="574" y="238" font-size="14" fill="#1a202c">Authorization: Bearer …</text>
  <text x="574" y="260" font-size="13" fill="#64748b">blank line, then a body (POST/PUT only)</text>

  <!-- RESPONSE MESSAGE -->
  <rect x="560" y="300" width="290" height="180" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="560" y="300" width="290" height="28" rx="10" fill="#1d4ed8"/>
  <text x="705" y="320" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">6. THE RESPONSE</text>
  <text x="574" y="350" font-size="14" font-weight="700" fill="#1a202c">HTTP/1.1 200 OK</text>
  <text x="574" y="368" font-size="13" fill="#64748b">version · status code · reason phrase</text>
  <text x="574" y="394" font-size="14" fill="#1a202c">Content-Type: application/json</text>
  <text x="574" y="412" font-size="14" fill="#1a202c">Content-Length: 255</text>
  <text x="574" y="430" font-size="14" fill="#1a202c">Retry-After: 1   (on a 429)</text>
  <text x="574" y="452" font-size="13" fill="#64748b">blank line, then the body — bytes,</text>
  <text x="574" y="470" font-size="13" fill="#64748b">which .json() decodes for you</text>

  <!-- PROXY -->
  <rect x="890" y="140" width="250" height="150" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1015" y="165" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">4. PROXY / CDN</text>
  <text x="906" y="189" font-size="14" fill="#475569">may be several, may be none</text>
  <text x="906" y="211" font-size="14" fill="#475569">caches a GET (safe, idempotent)</text>
  <text x="906" y="231" font-size="14" fill="#475569">never caches a POST</text>
  <text x="906" y="253" font-size="14" fill="#475569">may answer 304 by itself</text>
  <text x="906" y="275" font-size="14" font-weight="700" fill="#b45309">may return 502 / 503 / 504</text>

  <!-- ORIGIN SERVER -->
  <rect x="890" y="320" width="250" height="160" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="890" y="320" width="250" height="28" rx="10" fill="#1d4ed8"/>
  <text x="1015" y="340" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">5. ORIGIN SERVER</text>
  <text x="906" y="370" font-size="14" fill="#475569">routes the path</text>
  <text x="906" y="390" font-size="14" fill="#475569">reads the headers</text>
  <text x="906" y="410" font-size="14" fill="#475569">does the work</text>
  <text x="906" y="432" font-size="14" font-weight="700" fill="#1d4ed8">chooses the status code</text>
  <text x="906" y="454" font-size="13" fill="#64748b">this is the only place a 429</text>
  <text x="906" y="472" font-size="13" fill="#64748b">or a 500 is ever decided</text>

  <!-- arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowBack" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>

  <line x1="280" y1="150" x2="314" y2="140" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="195" x2="420" y2="209" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="250" x2="554" y2="200" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="850" y1="180" x2="884" y2="200" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1015" y1="290" x2="1015" y2="314" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="884" y1="400" x2="856" y2="390" stroke="#64748b" stroke-width="2" marker-end="url(#arrowBack)"/>
  <line x1="554" y1="390" x2="290" y2="290" stroke="#64748b" stroke-width="2" marker-end="url(#arrowBack)"/>

  <!-- TIMEOUT BAND -->
  <rect x="30" y="510" width="1110" height="112" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="46" y="535" font-size="16" font-weight="700" fill="#1d4ed8">Where a timeout lives — and it is two numbers, not one</text>
  <line x1="150" y1="562" x2="470" y2="562" stroke="#1d4ed8" stroke-width="6"/>
  <text x="46" y="567" font-size="14" font-weight="700" fill="#1a202c">connect</text>
  <text x="150" y="584" font-size="13" fill="#475569">steps 1 and 2: DNS, TCP, TLS. Default in requests: none.</text>
  <line x1="150" y1="602" x2="1000" y2="602" stroke="#b45309" stroke-width="6"/>
  <text x="46" y="607" font-size="14" font-weight="700" fill="#1a202c">read</text>
  <text x="150" y="618" font-size="13" fill="#475569">the gap between any two bytes arriving. NOT a deadline for the whole call. Default in requests: none.</text>

  <!-- STATUS FAMILIES -->
  <rect x="30" y="642" width="540" height="188" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="46" y="667" font-size="16" font-weight="700" fill="#1a202c">Where a status code lives: only in the response</text>
  <text x="46" y="692" font-size="14" fill="#1a202c"><tspan font-weight="700">2xx</tspan> it worked — 200 OK, 201 Created, 204 No Content</text>
  <text x="46" y="714" font-size="14" fill="#1a202c"><tspan font-weight="700">3xx</tspan> look elsewhere — 301 permanent, 302 temporary, 304 unchanged</text>
  <text x="46" y="736" font-size="14" fill="#1a202c"><tspan font-weight="700">4xx</tspan> you were wrong — 400, 401, 403, 404, 409, 422, 429</text>
  <text x="46" y="758" font-size="14" fill="#1a202c"><tspan font-weight="700">5xx</tspan> they were wrong — 500, 502, 503, 504</text>
  <text x="46" y="786" font-size="13" fill="#b45309">A response arriving is SUCCESS at the transport layer.</text>
  <text x="46" y="806" font-size="13" fill="#b45309">A 500 is a perfectly successful delivery of bad news.</text>

  <!-- RETRY BOX -->
  <rect x="600" y="642" width="540" height="188" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="616" y="667" font-size="16" font-weight="700" fill="#b45309">Where a retry lives: in your client, and nowhere else</text>
  <text x="616" y="692" font-size="14" fill="#1a202c"><tspan font-weight="700">retry</tspan> 429, 500, 502, 503, 504 — and transport failures</text>
  <text x="616" y="714" font-size="14" fill="#1a202c"><tspan font-weight="700">never</tspan> 400, 401, 403, 404, 409, 422 — the answer will not change</text>
  <text x="616" y="736" font-size="14" fill="#1a202c"><tspan font-weight="700">wait</tspan> 0.5s, 1s, 2s, 4s, 8s — doubling, capped</text>
  <text x="616" y="758" font-size="14" fill="#1a202c"><tspan font-weight="700">jitter</tspan> multiply each by 0.5 to 1.0, so clients do not synchronise</text>
  <text x="616" y="786" font-size="13" fill="#475569">A POST is not safe to retry blindly: the first attempt may have</text>
  <text x="616" y="806" font-size="13" fill="#475569">succeeded and lost only its reply. GET, PUT and DELETE are idempotent.</text>
</svg>
