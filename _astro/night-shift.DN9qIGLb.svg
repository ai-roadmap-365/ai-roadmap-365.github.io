<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Nobody is watching.">
  <title>Work done overnight</title>
  <style>
    .night-shift-bg   { fill: #f8fafc; }
    .night-shift-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .night-shift-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .night-shift-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .night-shift-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .night-shift-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .night-shift-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .night-shift-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .night-shift-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .night-shift-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .night-shift-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .night-shift-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .night-shift-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .night-shift-row { opacity: 1; }
    .night-shift-r0 { animation-delay: 0.00s; }
    .night-shift-r1 { animation-delay: 0.45s; }
    .night-shift-r2 { animation-delay: 0.90s; }
    .night-shift-r3 { animation-delay: 1.35s; }
    .night-shift-r4 { animation-delay: 1.80s; }
    .night-shift-row { animation: night-shift-reveal 7.3s ease-in-out infinite; }
    @keyframes night-shift-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="night-shift-bg" width="980" height="390"/>
  <text class="night-shift-h1"  x="30" y="40">Work done overnight</text>
  <text class="night-shift-sub" x="30" y="64">Nobody is watching.</text>
  <rect class="night-shift-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="night-shift-name" x="46" y="122">No check</text>
  <text class="night-shift-desc" x="46" y="142">Assumed done.</text>
  <text class="night-shift-desc night-shift-row night-shift-r0" x="46" y="182">The work is scheduled and forgotten</text>
  <text class="night-shift-desc night-shift-row night-shift-r1" x="46" y="216">Nobody confirms it happened</text>
  <text class="night-shift-desc night-shift-row night-shift-r2" x="46" y="250">A stoppage is invisible</text>
  <text class="night-shift-desc night-shift-row night-shift-r3" x="46" y="284">Discovered weeks later, by consequence</text>
  <text class="night-shift-desc night-shift-row night-shift-r4" x="46" y="318">This is an unmonitored job</text>
  <rect class="night-shift-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="night-shift-name" x="526" y="122">A morning check</text>
  <text class="night-shift-desc" x="526" y="142">Confirmed.</text>
  <text class="night-shift-desc night-shift-row night-shift-r0" x="526" y="182">A record of what ran and when</text>
  <text class="night-shift-desc night-shift-row night-shift-r1" x="526" y="216">Absence is as visible as failure</text>
  <text class="night-shift-desc night-shift-row night-shift-r2" x="526" y="250">A stoppage is noticed the next day</text>
  <text class="night-shift-desc night-shift-row night-shift-r3" x="526" y="284">Discovered immediately</text>
  <text class="night-shift-desc night-shift-row night-shift-r4" x="526" y="318">This is a heartbeat</text>
  <text class="night-shift-sub" x="30" y="372">Absence being as visible as failure is the property that matters, and it is the one an ordinary error alert does not give you.</text>
</svg>
