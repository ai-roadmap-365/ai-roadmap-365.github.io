<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One is flat memory; one is the size of the file.">
  <title>Iterating a file, or reading it whole</title>
  <style>
    .stream-or-load-bg   { fill: #f8fafc; }
    .stream-or-load-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stream-or-load-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stream-or-load-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stream-or-load-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stream-or-load-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stream-or-load-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stream-or-load-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stream-or-load-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stream-or-load-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stream-or-load-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stream-or-load-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stream-or-load-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stream-or-load-row { opacity: 1; }
    .stream-or-load-r0 { animation-delay: 0.00s; }
    .stream-or-load-r1 { animation-delay: 0.45s; }
    .stream-or-load-r2 { animation-delay: 0.90s; }
    .stream-or-load-r3 { animation-delay: 1.35s; }
    .stream-or-load-r4 { animation-delay: 1.80s; }
    .stream-or-load-row { animation: stream-or-load-reveal 7.3s ease-in-out infinite; }
    @keyframes stream-or-load-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="stream-or-load-bg" width="980" height="390"/>
  <text class="stream-or-load-h1"  x="30" y="40">Iterating a file, or reading it whole</text>
  <text class="stream-or-load-sub" x="30" y="64">One is flat memory; one is the size of the file.</text>
  <rect class="stream-or-load-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="stream-or-load-name" x="46" y="122">for line in f:</text>
  <text class="stream-or-load-desc" x="46" y="142">One line at a time.</text>
  <text class="stream-or-load-desc stream-or-load-row stream-or-load-r0" x="46" y="182">Memory stays flat, whatever the size</text>
  <text class="stream-or-load-desc stream-or-load-row stream-or-load-r1" x="46" y="216">A 200 GB file processes fine</text>
  <text class="stream-or-load-desc stream-or-load-row stream-or-load-r2" x="46" y="250">Work can start on the first line</text>
  <text class="stream-or-load-desc stream-or-load-row stream-or-load-r3" x="46" y="284">Can stop early without reading the rest</text>
  <text class="stream-or-load-desc stream-or-load-row stream-or-load-r4" x="46" y="318">Day 10's streaming, in Python</text>
  <rect class="stream-or-load-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="stream-or-load-name" x="526" y="122">f.read()</text>
  <text class="stream-or-load-desc" x="526" y="142">The whole thing, at once.</text>
  <text class="stream-or-load-desc stream-or-load-row stream-or-load-r0" x="526" y="182">Memory equals the file size</text>
  <text class="stream-or-load-desc stream-or-load-row stream-or-load-r1" x="526" y="216">Bounded by your RAM</text>
  <text class="stream-or-load-desc stream-or-load-row stream-or-load-r2" x="526" y="250">Nothing happens until it finishes</text>
  <text class="stream-or-load-desc stream-or-load-row stream-or-load-r3" x="526" y="284">Reads everything even if you need one line</text>
  <text class="stream-or-load-desc stream-or-load-row stream-or-load-r4" x="526" y="318">Fine for a config file; wrong for a dataset</text>
  <text class="stream-or-load-sub" x="30" y="372">Path("x").read_text() is the same trade in a friendlier wrapper: excellent for a small file, and the wrong reach for anything you cannot hold in memory.</text>
</svg>
