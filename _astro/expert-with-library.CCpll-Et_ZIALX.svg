<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Rather than one from memory.">
  <title>An expert with a library</title>
  <style>
    .expert-with-library-bg   { fill: #f8fafc; }
    .expert-with-library-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .expert-with-library-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .expert-with-library-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .expert-with-library-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .expert-with-library-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .expert-with-library-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .expert-with-library-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .expert-with-library-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .expert-with-library-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .expert-with-library-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .expert-with-library-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .expert-with-library-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .expert-with-library-row { opacity: 1; }
    .expert-with-library-r0 { animation-delay: 0.00s; }
    .expert-with-library-r1 { animation-delay: 0.45s; }
    .expert-with-library-r2 { animation-delay: 0.90s; }
    .expert-with-library-r3 { animation-delay: 1.35s; }
    .expert-with-library-r4 { animation-delay: 1.80s; }
    .expert-with-library-row { animation: expert-with-library-reveal 7.3s ease-in-out infinite; }
    @keyframes expert-with-library-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="expert-with-library-bg" width="980" height="390"/>
  <text class="expert-with-library-h1"  x="30" y="40">An expert with a library</text>
  <text class="expert-with-library-sub" x="30" y="64">Rather than one from memory.</text>
  <rect class="expert-with-library-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="expert-with-library-name" x="46" y="122">From memory</text>
  <text class="expert-with-library-desc" x="46" y="142">Fast, and dated.</text>
  <text class="expert-with-library-desc expert-with-library-row expert-with-library-r0" x="46" y="182">Knows a great deal, generally</text>
  <text class="expert-with-library-desc expert-with-library-row expert-with-library-r1" x="46" y="216">Nothing about your organisation</text>
  <text class="expert-with-library-desc expert-with-library-row expert-with-library-r2" x="46" y="250">Cannot cite anything</text>
  <text class="expert-with-library-desc expert-with-library-row expert-with-library-r3" x="46" y="284">Confidently wrong on specifics</text>
  <text class="expert-with-library-desc expert-with-library-row expert-with-library-r4" x="46" y="318">This is the model alone</text>
  <rect class="expert-with-library-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="expert-with-library-name" x="526" y="122">With the library open</text>
  <text class="expert-with-library-desc" x="526" y="142">Slower, and current.</text>
  <text class="expert-with-library-desc expert-with-library-row expert-with-library-r0" x="526" y="182">Looks it up before answering</text>
  <text class="expert-with-library-desc expert-with-library-row expert-with-library-r1" x="526" y="216">Knows your documents</text>
  <text class="expert-with-library-desc expert-with-library-row expert-with-library-r2" x="526" y="250">Cites the page</text>
  <text class="expert-with-library-desc expert-with-library-row expert-with-library-r3" x="526" y="284">Says when nothing is found</text>
  <text class="expert-with-library-desc expert-with-library-row expert-with-library-r4" x="526" y="318">This is retrieval-augmented generation</text>
  <text class="expert-with-library-sub" x="30" y="372">The general expertise is still required: retrieval supplies the documents, and it takes a capable reader to synthesise an answer from them.</text>
</svg>
