<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Declare what depends on what, and rebuild only that.">
  <title>The idea underneath every pipeline</title>
  <style>
    .make-dependency-graph-bg   { fill: #f8fafc; }
    .make-dependency-graph-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .make-dependency-graph-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .make-dependency-graph-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .make-dependency-graph-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .make-dependency-graph-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .make-dependency-graph-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .make-dependency-graph-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .make-dependency-graph-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .make-dependency-graph-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .make-dependency-graph-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .make-dependency-graph-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .make-dependency-graph-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .make-dependency-graph-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .make-dependency-graph-stage { opacity: 1; }

    .make-dependency-graph-s0 { animation-delay: 0.00s; }
    .make-dependency-graph-e0 { animation-delay: 0.00s; }
    .make-dependency-graph-s1 { animation-delay: 1.28s; }
    .make-dependency-graph-e1 { animation-delay: 1.28s; }
    .make-dependency-graph-s2 { animation-delay: 2.56s; }
    .make-dependency-graph-e2 { animation-delay: 2.56s; }
    .make-dependency-graph-s3 { animation-delay: 3.84s; }
    .make-dependency-graph-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .make-dependency-graph-conn  { animation: make-dependency-graph-trace 6.4s ease-in-out infinite; }
      .make-dependency-graph-stage { animation: make-dependency-graph-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes make-dependency-graph-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes make-dependency-graph-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .make-dependency-graph-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .make-dependency-graph-stage { animation: make-dependency-graph-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes make-dependency-graph-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="make-dependency-graph-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="make-dependency-graph-bg" width="980" height="322"/>
  <text class="make-dependency-graph-h1"  x="30" y="40">The idea underneath every pipeline</text>
  <text class="make-dependency-graph-sub" x="30" y="64">Declare what depends on what, and rebuild only that.</text>
  <g class="make-dependency-graph-stage make-dependency-graph-s0">
    <rect class="make-dependency-graph-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="make-dependency-graph-step" x="44" y="142">01</text>
    <text class="make-dependency-graph-name" x="70" y="142">Declare the dependencies</text>
    <text class="make-dependency-graph-desc" x="44" y="166">This output depends on those</text>
    <text class="make-dependency-graph-desc" x="44" y="182">inputs. Not the order — the</text>
    <text class="make-dependency-graph-desc" x="44" y="198">relationships.</text>
  </g>
  <line class="make-dependency-graph-line make-dependency-graph-conn make-dependency-graph-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#make-dependency-graph-tip)"/>
  <g class="make-dependency-graph-stage make-dependency-graph-s1">
    <rect class="make-dependency-graph-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="make-dependency-graph-step" x="280" y="142">02</text>
    <text class="make-dependency-graph-name" x="306" y="142">Compare timestamps</text>
    <text class="make-dependency-graph-desc" x="280" y="166">Is the output older than any</text>
    <text class="make-dependency-graph-desc" x="280" y="182">input it depends on?</text>
    <text class="make-dependency-graph-edge" x="280" y="242">stale?</text>
  </g>
  <line class="make-dependency-graph-line make-dependency-graph-conn make-dependency-graph-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#make-dependency-graph-tip)"/>
  <g class="make-dependency-graph-stage make-dependency-graph-s2">
    <rect class="make-dependency-graph-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="make-dependency-graph-step" x="516" y="142">03</text>
    <text class="make-dependency-graph-name" x="542" y="142">Rebuild only what is stale</text>
    <text class="make-dependency-graph-desc" x="516" y="166">And whatever depends on that,</text>
    <text class="make-dependency-graph-desc" x="516" y="182">transitively.</text>
    <text class="make-dependency-graph-edge" x="516" y="242">minimal</text>
  </g>
  <line class="make-dependency-graph-line make-dependency-graph-conn make-dependency-graph-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#make-dependency-graph-tip)"/>
  <g class="make-dependency-graph-stage make-dependency-graph-s3">
    <rect class="make-dependency-graph-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="make-dependency-graph-step" x="752" y="142">04</text>
    <text class="make-dependency-graph-name" x="778" y="142">Which is why it scales</text>
    <text class="make-dependency-graph-desc" x="752" y="166">A one-file change in a large</text>
    <text class="make-dependency-graph-desc" x="752" y="182">project rebuilds one file, not</text>
    <text class="make-dependency-graph-desc" x="752" y="198">the project.</text>
  </g>
  <text class="make-dependency-graph-sub" x="30" y="304">This is make's idea from 1976, and it underlies every build tool and workflow orchestrator since. Declaring relationships rather than steps is what lets the tool work out the minimum work.</text>
</svg>
