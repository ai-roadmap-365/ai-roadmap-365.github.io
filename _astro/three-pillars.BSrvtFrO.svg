<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" font-family="system-ui, sans-serif">
  <title>The three pillars of observability — logs, metrics, and traces — collected from services and feeding dashboards and alerts</title>
  <rect x="0" y="0" width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The three pillars of observability</text>

  <!-- Services source -->
  <rect x="30" y="180" width="140" height="90" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="100" y="215" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Running</text>
  <text x="100" y="237" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">services</text>
  <text x="100" y="258" text-anchor="middle" font-size="13" fill="#1a202c">emit signals</text>

  <!-- Three pillars -->
  <rect x="250" y="70" width="200" height="80" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="350" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Logs</text>
  <text x="350" y="122" text-anchor="middle" font-size="13" fill="#1a202c">timestamped events</text>
  <text x="350" y="140" text-anchor="middle" font-size="13" fill="#1a202c">(what happened, and why)</text>

  <rect x="250" y="180" width="200" height="80" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="350" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Metrics</text>
  <text x="350" y="232" text-anchor="middle" font-size="13" fill="#1a202c">numbers over time</text>
  <text x="350" y="250" text-anchor="middle" font-size="13" fill="#1a202c">(that something is wrong)</text>

  <rect x="250" y="290" width="200" height="80" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="350" y="320" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Traces</text>
  <text x="350" y="342" text-anchor="middle" font-size="13" fill="#1a202c">one request, span by span</text>
  <text x="350" y="360" text-anchor="middle" font-size="13" fill="#1a202c">(where the time went)</text>

  <!-- Arrows services -> pillars -->
  <line x1="170" y1="210" x2="242" y2="110" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="250,105 236,107 241,120" fill="#1d4ed8"/>
  <line x1="170" y1="222" x2="242" y2="220" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="250,220 236,213 236,227" fill="#1d4ed8"/>
  <line x1="170" y1="238" x2="242" y2="330" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="250,335 241,322 236,335" fill="#1d4ed8"/>

  <!-- Collector -->
  <rect x="520" y="180" width="130" height="90" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="585" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Collector</text>
  <text x="585" y="242" text-anchor="middle" font-size="13" fill="#1a202c">gathers &amp; stores</text>

  <!-- Arrows pillars -> collector -->
  <line x1="450" y1="110" x2="512" y2="205" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="518,212 504,208 511,196" fill="#1d4ed8"/>
  <line x1="450" y1="220" x2="512" y2="222" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="520,222 506,215 506,229" fill="#1d4ed8"/>
  <line x1="450" y1="330" x2="512" y2="245" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="518,238 511,251 504,239" fill="#1d4ed8"/>

  <!-- Outputs -->
  <rect x="600" y="70" width="130" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="665" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Dashboards</text>
  <text x="665" y="121" text-anchor="middle" font-size="13" fill="#1a202c">humans watching</text>

  <rect x="600" y="310" width="130" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="665" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Alerts</text>
  <text x="665" y="361" text-anchor="middle" font-size="13" fill="#1a202c">page when it matters</text>

  <!-- Arrows collector -> outputs -->
  <line x1="620" y1="180" x2="655" y2="146" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="660,140 646,145 653,157" fill="#1d4ed8"/>
  <line x1="620" y1="270" x2="655" y2="304" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="660,310 653,297 646,305" fill="#1d4ed8"/>

  <text x="380" y="430" text-anchor="middle" font-size="14" fill="#1a202c">Metrics notice a problem; traces locate it; logs explain it.</text>
</svg>
