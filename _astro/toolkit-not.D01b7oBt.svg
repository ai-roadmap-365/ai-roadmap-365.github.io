<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things a toolkit is not</title>
  <style>
    .toolkit-not-bg   { fill: #f8fafc; }
    .toolkit-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toolkit-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toolkit-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toolkit-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toolkit-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toolkit-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .toolkit-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .toolkit-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .toolkit-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .toolkit-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .toolkit-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .toolkit-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .toolkit-not-row { opacity: 1; }
    .toolkit-not-r0 { animation-delay: 0.00s; }
    .toolkit-not-r1 { animation-delay: 0.45s; }
    .toolkit-not-r2 { animation-delay: 0.90s; }
    .toolkit-not-r3 { animation-delay: 1.35s; }
    .toolkit-not-r4 { animation-delay: 1.80s; }
    .toolkit-not-row { animation: toolkit-not-reveal 7.3s ease-in-out infinite; }
    @keyframes toolkit-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="toolkit-not-bg" width="980" height="390"/>
  <text class="toolkit-not-h1"  x="30" y="40">Four things a toolkit is not</text>
  <text class="toolkit-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="toolkit-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="toolkit-not-name" x="46" y="122">The misconception</text>
  <text class="toolkit-not-desc" x="46" y="142">Commonly held.</text>
  <text class="toolkit-not-desc toolkit-not-row toolkit-not-r0" x="46" y="182">A folder of scripts is a toolkit</text>
  <text class="toolkit-not-desc toolkit-not-row toolkit-not-r1" x="46" y="216">Internal tools need no tests</text>
  <text class="toolkit-not-desc toolkit-not-row toolkit-not-r2" x="46" y="250">Nobody else will use it</text>
  <text class="toolkit-not-desc toolkit-not-row toolkit-not-r3" x="46" y="284">Documentation can wait</text>
  <text class="toolkit-not-desc toolkit-not-row toolkit-not-r4" x="46" y="318">It only needs to work on your machine</text>
  <rect class="toolkit-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="toolkit-not-name" x="526" y="122">What is true</text>
  <text class="toolkit-not-desc" x="526" y="142">Actually.</text>
  <text class="toolkit-not-desc toolkit-not-row toolkit-not-r0" x="526" y="182">Without shared conventions, it is a folder</text>
  <text class="toolkit-not-desc toolkit-not-row toolkit-not-r1" x="526" y="216">Internal tools cause real damage when wrong</text>
  <text class="toolkit-not-desc toolkit-not-row toolkit-not-r2" x="526" y="250">Internal tools spread quickly</text>
  <text class="toolkit-not-desc toolkit-not-row toolkit-not-r3" x="526" y="284">Undocumented tools are rewritten</text>
  <text class="toolkit-not-desc toolkit-not-row toolkit-not-r4" x="526" y="318">Colleagues will run it on theirs</text>
  <text class="toolkit-not-sub" x="30" y="372">Undocumented tools being rewritten is the quiet waste: the second person cannot tell what it does, so they write their own, and now there are two.</text>
</svg>
