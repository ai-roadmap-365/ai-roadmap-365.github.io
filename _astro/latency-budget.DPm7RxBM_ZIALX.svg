<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Under 3.5 milliseconds.">
  <title>What the whole gateway costs</title>
  <style>
    .latency-budget-bg   { fill: #f8fafc; }
    .latency-budget-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-budget-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-budget-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-budget-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-budget-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-budget-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .latency-budget-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .latency-budget-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .latency-budget-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .latency-budget-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .latency-budget-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .latency-budget-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .latency-budget-row { opacity: 1; }
    .latency-budget-r0 { animation-delay: 0.00s; }
    .latency-budget-r1 { animation-delay: 0.45s; }
    .latency-budget-r2 { animation-delay: 0.90s; }
    .latency-budget-r3 { animation-delay: 1.35s; }
    .latency-budget-r4 { animation-delay: 1.80s; }
    .latency-budget-row { animation: latency-budget-reveal 7.3s ease-in-out infinite; }
    @keyframes latency-budget-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="latency-budget-bg" width="980" height="390"/>
  <text class="latency-budget-h1"  x="30" y="40">What the whole gateway costs</text>
  <text class="latency-budget-sub" x="30" y="64">Under 3.5 milliseconds.</text>
  <rect class="latency-budget-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="latency-budget-name" x="46" y="122">The cost</text>
  <text class="latency-budget-desc" x="46" y="142">Under 3.5 ms total.</text>
  <text class="latency-budget-desc latency-budget-row latency-budget-r0" x="46" y="182">Regex filtering: sub-millisecond</text>
  <text class="latency-budget-desc latency-budget-row latency-budget-r1" x="46" y="216">PII tokenisation: about 1.5 ms</text>
  <text class="latency-budget-desc latency-budget-row latency-budget-r2" x="46" y="250">XML escaping: negligible</text>
  <text class="latency-budget-desc latency-budget-row latency-budget-r3" x="46" y="284">Canary scanning: under 0.5 ms</text>
  <text class="latency-budget-desc latency-budget-row latency-budget-r4" x="46" y="318">All in-memory, in one pipeline</text>
  <rect class="latency-budget-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="latency-budget-name" x="526" y="122">What it removes</text>
  <text class="latency-budget-desc" x="526" y="142">Several categories at once.</text>
  <text class="latency-budget-desc latency-budget-row latency-budget-r0" x="526" y="182">Prompt exfiltration reaching a client</text>
  <text class="latency-budget-desc latency-budget-row latency-budget-r1" x="526" y="216">Raw PII leaving the perimeter</text>
  <text class="latency-budget-desc latency-budget-row latency-budget-r2" x="526" y="250">Deserialisation code execution</text>
  <text class="latency-budget-desc latency-budget-row latency-budget-r3" x="526" y="284">Unmeasured algorithmic bias</text>
  <text class="latency-budget-desc latency-budget-row latency-budget-r4" x="526" y="318">Regulatory fines and IP leakage</text>
  <text class="latency-budget-sub" x="30" y="372">Streaming is preserved throughout, which matters for the argument: 3.5 ms is invisible next to a time-to-first-token measured in hundreds of milliseconds, so latency is never the reason not to do this.</text>
</svg>
