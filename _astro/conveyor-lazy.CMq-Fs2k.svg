<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Where the work happens.">
  <title>Made to order, or made in advance</title>
  <style>
    .conveyor-lazy-bg   { fill: #f8fafc; }
    .conveyor-lazy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conveyor-lazy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conveyor-lazy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conveyor-lazy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conveyor-lazy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conveyor-lazy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .conveyor-lazy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .conveyor-lazy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .conveyor-lazy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .conveyor-lazy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .conveyor-lazy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .conveyor-lazy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .conveyor-lazy-row { opacity: 1; }
    .conveyor-lazy-r0 { animation-delay: 0.00s; }
    .conveyor-lazy-r1 { animation-delay: 0.45s; }
    .conveyor-lazy-r2 { animation-delay: 0.90s; }
    .conveyor-lazy-r3 { animation-delay: 1.35s; }
    .conveyor-lazy-r4 { animation-delay: 1.80s; }
    .conveyor-lazy-row { animation: conveyor-lazy-reveal 7.3s ease-in-out infinite; }
    @keyframes conveyor-lazy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="conveyor-lazy-bg" width="980" height="390"/>
  <text class="conveyor-lazy-h1"  x="30" y="40">Made to order, or made in advance</text>
  <text class="conveyor-lazy-sub" x="30" y="64">Where the work happens.</text>
  <rect class="conveyor-lazy-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="conveyor-lazy-name" x="46" y="122">Made in advance</text>
  <text class="conveyor-lazy-desc" x="46" y="142">All at once.</text>
  <text class="conveyor-lazy-desc conveyor-lazy-row conveyor-lazy-r0" x="46" y="182">Everything produced before any is used</text>
  <text class="conveyor-lazy-desc conveyor-lazy-row conveyor-lazy-r1" x="46" y="216">Needs room for the whole batch</text>
  <text class="conveyor-lazy-desc conveyor-lazy-row conveyor-lazy-r2" x="46" y="250">Wasted if only some are needed</text>
  <text class="conveyor-lazy-desc conveyor-lazy-row conveyor-lazy-r3" x="46" y="284">Available immediately once done</text>
  <text class="conveyor-lazy-desc conveyor-lazy-row conveyor-lazy-r4" x="46" y="318">This is a list comprehension</text>
  <rect class="conveyor-lazy-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="conveyor-lazy-name" x="526" y="122">Made to order</text>
  <text class="conveyor-lazy-desc" x="526" y="142">One at a time.</text>
  <text class="conveyor-lazy-desc conveyor-lazy-row conveyor-lazy-r0" x="526" y="182">Produced only when requested</text>
  <text class="conveyor-lazy-desc conveyor-lazy-row conveyor-lazy-r1" x="526" y="216">Needs room for one</text>
  <text class="conveyor-lazy-desc conveyor-lazy-row conveyor-lazy-r2" x="526" y="250">Nothing wasted if you stop early</text>
  <text class="conveyor-lazy-desc conveyor-lazy-row conveyor-lazy-r3" x="526" y="284">Each one waits briefly</text>
  <text class="conveyor-lazy-desc conveyor-lazy-row conveyor-lazy-r4" x="526" y="318">This is a generator</text>
  <text class="conveyor-lazy-sub" x="30" y="372">Stopping early wasting nothing is the property that matters for large inputs: searching a million records for the first match should not build a million results.</text>
</svg>
