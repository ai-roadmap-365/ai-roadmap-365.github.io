<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four problems.">
  <title>What fairness work addresses</title>
  <style>
    .fairness-why-bg   { fill: #f8fafc; }
    .fairness-why-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fairness-why-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fairness-why-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fairness-why-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fairness-why-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fairness-why-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fairness-why-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fairness-why-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fairness-why-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fairness-why-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fairness-why-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fairness-why-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .fairness-why-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .fairness-why-stage { opacity: 1; }

    .fairness-why-s0 { animation-delay: 0.00s; }
    .fairness-why-e0 { animation-delay: 0.00s; }
    .fairness-why-s1 { animation-delay: 1.28s; }
    .fairness-why-e1 { animation-delay: 1.28s; }
    .fairness-why-s2 { animation-delay: 2.56s; }
    .fairness-why-e2 { animation-delay: 2.56s; }
    .fairness-why-s3 { animation-delay: 3.84s; }
    .fairness-why-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .fairness-why-conn  { animation: fairness-why-trace 6.4s ease-in-out infinite; }
      .fairness-why-stage { animation: fairness-why-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes fairness-why-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes fairness-why-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .fairness-why-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .fairness-why-stage { animation: fairness-why-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes fairness-why-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="fairness-why-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="fairness-why-bg" width="980" height="322"/>
  <text class="fairness-why-h1"  x="30" y="40">What fairness work addresses</text>
  <text class="fairness-why-sub" x="30" y="64">Four problems.</text>
  <g class="fairness-why-stage fairness-why-s0">
    <rect class="fairness-why-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="fairness-why-step" x="44" y="142">01</text>
    <text class="fairness-why-name" x="70" y="142">Historical data records historical discrimination</text>
    <text class="fairness-why-desc" x="44" y="166">And a model trained on it</text>
    <text class="fairness-why-desc" x="44" y="182">reproduces the pattern.</text>
  </g>
  <line class="fairness-why-line fairness-why-conn fairness-why-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#fairness-why-tip)"/>
  <g class="fairness-why-stage fairness-why-s1">
    <rect class="fairness-why-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="fairness-why-step" x="280" y="142">02</text>
    <text class="fairness-why-name" x="306" y="142">Removing the attribute does not remove the signal</text>
    <text class="fairness-why-desc" x="280" y="166">Proxies reconstruct it.</text>
  </g>
  <line class="fairness-why-line fairness-why-conn fairness-why-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#fairness-why-tip)"/>
  <g class="fairness-why-stage fairness-why-s2">
    <rect class="fairness-why-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="fairness-why-step" x="516" y="142">03</text>
    <text class="fairness-why-name" x="542" y="142">And automation applies the pattern at scale</text>
    <text class="fairness-why-desc" x="516" y="166">Consistently, to everyone,</text>
    <text class="fairness-why-desc" x="516" y="182">instantly.</text>
  </g>
  <line class="fairness-why-line fairness-why-conn fairness-why-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#fairness-why-tip)"/>
  <g class="fairness-why-stage fairness-why-s3">
    <rect class="fairness-why-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="fairness-why-step" x="752" y="142">04</text>
    <text class="fairness-why-name" x="778" y="142">With nobody obviously accountable</text>
    <text class="fairness-why-desc" x="752" y="166">Which is what regulation is now</text>
    <text class="fairness-why-desc" x="752" y="182">addressing.</text>
  </g>
  <text class="fairness-why-sub" x="30" y="304">Scale is what changes the character of the problem: a biased human decision affects one case, and a biased model applies the same bias uniformly and permanently.</text>
</svg>
