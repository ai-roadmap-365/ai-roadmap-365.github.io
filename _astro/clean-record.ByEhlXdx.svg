<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four rules.">
  <title>Making cleaning reproducible</title>
  <style>
    .clean-record-bg   { fill: #f8fafc; }
    .clean-record-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clean-record-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clean-record-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clean-record-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clean-record-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clean-record-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .clean-record-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .clean-record-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .clean-record-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .clean-record-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .clean-record-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .clean-record-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .clean-record-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .clean-record-stage { opacity: 1; }

    .clean-record-s0 { animation-delay: 0.00s; }
    .clean-record-e0 { animation-delay: 0.00s; }
    .clean-record-s1 { animation-delay: 1.28s; }
    .clean-record-e1 { animation-delay: 1.28s; }
    .clean-record-s2 { animation-delay: 2.56s; }
    .clean-record-e2 { animation-delay: 2.56s; }
    .clean-record-s3 { animation-delay: 3.84s; }
    .clean-record-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .clean-record-conn  { animation: clean-record-trace 6.4s ease-in-out infinite; }
      .clean-record-stage { animation: clean-record-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes clean-record-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes clean-record-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .clean-record-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .clean-record-stage { animation: clean-record-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes clean-record-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="clean-record-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="clean-record-bg" width="980" height="322"/>
  <text class="clean-record-h1"  x="30" y="40">Making cleaning reproducible</text>
  <text class="clean-record-sub" x="30" y="64">Four rules.</text>
  <g class="clean-record-stage clean-record-s0">
    <rect class="clean-record-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="clean-record-step" x="44" y="142">01</text>
    <text class="clean-record-name" x="70" y="142">Every step in a script, never edited by hand</text>
    <text class="clean-record-desc" x="44" y="166">So it can be rerun.</text>
  </g>
  <line class="clean-record-line clean-record-conn clean-record-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#clean-record-tip)"/>
  <g class="clean-record-stage clean-record-s1">
    <rect class="clean-record-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="clean-record-step" x="280" y="142">02</text>
    <text class="clean-record-name" x="306" y="142">The raw data preserved, unmodified</text>
    <text class="clean-record-desc" x="280" y="166">As the point you can always</text>
    <text class="clean-record-desc" x="280" y="182">return to.</text>
  </g>
  <line class="clean-record-line clean-record-conn clean-record-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#clean-record-tip)"/>
  <g class="clean-record-stage clean-record-s2">
    <rect class="clean-record-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="clean-record-step" x="516" y="142">03</text>
    <text class="clean-record-name" x="542" y="142">Row counts logged before and after each step</text>
    <text class="clean-record-desc" x="516" y="166">So silent drops are visible.</text>
  </g>
  <line class="clean-record-line clean-record-conn clean-record-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#clean-record-tip)"/>
  <g class="clean-record-stage clean-record-s3">
    <rect class="clean-record-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="clean-record-step" x="752" y="142">04</text>
    <text class="clean-record-name" x="778" y="142">And each decision documented with its reason</text>
    <text class="clean-record-desc" x="752" y="166">Because you will be asked.</text>
  </g>
  <text class="clean-record-sub" x="30" y="304">Preserving raw data untouched is non-negotiable in serious work, and the cleaned dataset should always be regenerable from it by running one script.</text>
</svg>
