<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The marks mean nothing.">
  <title>Seeing the exam paper</title>
  <style>
    .exam-leak-bg   { fill: #f8fafc; }
    .exam-leak-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exam-leak-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exam-leak-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exam-leak-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exam-leak-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exam-leak-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exam-leak-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .exam-leak-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .exam-leak-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .exam-leak-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .exam-leak-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .exam-leak-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exam-leak-row { opacity: 1; }
    .exam-leak-r0 { animation-delay: 0.00s; }
    .exam-leak-r1 { animation-delay: 0.45s; }
    .exam-leak-r2 { animation-delay: 0.90s; }
    .exam-leak-r3 { animation-delay: 1.35s; }
    .exam-leak-r4 { animation-delay: 1.80s; }
    .exam-leak-row { animation: exam-leak-reveal 7.3s ease-in-out infinite; }
    @keyframes exam-leak-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="exam-leak-bg" width="980" height="390"/>
  <text class="exam-leak-h1"  x="30" y="40">Seeing the exam paper</text>
  <text class="exam-leak-sub" x="30" y="64">The marks mean nothing.</text>
  <rect class="exam-leak-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="exam-leak-name" x="46" y="122">With the answers</text>
  <text class="exam-leak-desc" x="46" y="142">Perfect marks.</text>
  <text class="exam-leak-desc exam-leak-row exam-leak-r0" x="46" y="182">Every student scores highly</text>
  <text class="exam-leak-desc exam-leak-row exam-leak-r1" x="46" y="216">The marks are consistent and reproducible</text>
  <text class="exam-leak-desc exam-leak-row exam-leak-r2" x="46" y="250">Nothing about ability is measured</text>
  <text class="exam-leak-desc exam-leak-row exam-leak-r3" x="46" y="284">The failure appears at the next test</text>
  <text class="exam-leak-desc exam-leak-row exam-leak-r4" x="46" y="318">This is leakage</text>
  <rect class="exam-leak-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="exam-leak-name" x="526" y="122">Without them</text>
  <text class="exam-leak-desc" x="526" y="142">Honest marks.</text>
  <text class="exam-leak-desc exam-leak-row exam-leak-r0" x="526" y="182">Marks vary by preparation</text>
  <text class="exam-leak-desc exam-leak-row exam-leak-r1" x="526" y="216">Still consistent across sittings</text>
  <text class="exam-leak-desc exam-leak-row exam-leak-r2" x="526" y="250">Ability is measured</text>
  <text class="exam-leak-desc exam-leak-row exam-leak-r3" x="526" y="284">Later performance matches</text>
  <text class="exam-leak-desc exam-leak-row exam-leak-r4" x="526" y="318">This is a clean split</text>
  <text class="exam-leak-sub" x="30" y="372">Consistency appearing in both columns is the point of the analogy: reproducibility is not evidence of validity, which is precisely why leakage survives review.</text>
</svg>
