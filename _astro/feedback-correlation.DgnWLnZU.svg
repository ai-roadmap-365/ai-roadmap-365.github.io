<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The benchmark is missing something.">
  <title>When the benchmark disagrees with users</title>
  <style>
    .feedback-correlation-bg   { fill: #f8fafc; }
    .feedback-correlation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feedback-correlation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feedback-correlation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feedback-correlation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feedback-correlation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feedback-correlation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .feedback-correlation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .feedback-correlation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .feedback-correlation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .feedback-correlation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .feedback-correlation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .feedback-correlation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .feedback-correlation-row { opacity: 1; }
    .feedback-correlation-r0 { animation-delay: 0.00s; }
    .feedback-correlation-r1 { animation-delay: 0.45s; }
    .feedback-correlation-r2 { animation-delay: 0.90s; }
    .feedback-correlation-r3 { animation-delay: 1.35s; }
    .feedback-correlation-r4 { animation-delay: 1.80s; }
    .feedback-correlation-row { animation: feedback-correlation-reveal 7.3s ease-in-out infinite; }
    @keyframes feedback-correlation-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="feedback-correlation-bg" width="980" height="390"/>
  <text class="feedback-correlation-h1"  x="30" y="40">When the benchmark disagrees with users</text>
  <text class="feedback-correlation-sub" x="30" y="64">The benchmark is missing something.</text>
  <rect class="feedback-correlation-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="feedback-correlation-name" x="46" y="122">Aligned</text>
  <text class="feedback-correlation-desc" x="46" y="142">The benchmark predicts satisfaction.</text>
  <text class="feedback-correlation-desc feedback-correlation-row feedback-correlation-r0" x="46" y="182">Offline composite correlates with thumbs-up rate</text>
  <text class="feedback-correlation-desc feedback-correlation-row feedback-correlation-r1" x="46" y="216">A score gain shows up in production</text>
  <text class="feedback-correlation-desc feedback-correlation-row feedback-correlation-r2" x="46" y="250">The suite is measuring the right things</text>
  <text class="feedback-correlation-desc feedback-correlation-row feedback-correlation-r3" x="46" y="284">Changes can be trusted before release</text>
  <text class="feedback-correlation-desc feedback-correlation-row feedback-correlation-r4" x="46" y="318">Correlation computed, not assumed</text>
  <rect class="feedback-correlation-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="feedback-correlation-name" x="526" y="122">Misaligned</text>
  <text class="feedback-correlation-desc" x="526" y="142">95% offline, 20% thumbs-down.</text>
  <text class="feedback-correlation-desc feedback-correlation-row feedback-correlation-r0" x="526" y="182">The benchmark is confidently wrong</text>
  <text class="feedback-correlation-desc feedback-correlation-row feedback-correlation-r1" x="526" y="216">Dataset mismatch, or a missing dimension</text>
  <text class="feedback-correlation-desc feedback-correlation-row feedback-correlation-r2" x="526" y="250">Latency, formatting, domain terminology</text>
  <text class="feedback-correlation-desc feedback-correlation-row feedback-correlation-r3" x="526" y="284">None of them in the rubric</text>
  <text class="feedback-correlation-desc feedback-correlation-row feedback-correlation-r4" x="526" y="318">Add them, and re-correlate</text>
  <text class="feedback-correlation-sub" x="30" y="372">Computing the correlation is the step that most teams skip, and it is what turns an evaluation suite from an internal ritual into a predictor of something anyone outside the team cares about.</text>
</svg>
