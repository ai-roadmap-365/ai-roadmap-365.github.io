<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Different problems.">
  <title>Injection compared with jailbreaking</title>
  <style>
    .injection-compare-bg   { fill: #f8fafc; }
    .injection-compare-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-compare-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-compare-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-compare-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-compare-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-compare-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .injection-compare-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .injection-compare-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .injection-compare-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .injection-compare-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .injection-compare-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .injection-compare-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .injection-compare-row { opacity: 1; }
    .injection-compare-r0 { animation-delay: 0.00s; }
    .injection-compare-r1 { animation-delay: 0.45s; }
    .injection-compare-r2 { animation-delay: 0.90s; }
    .injection-compare-r3 { animation-delay: 1.35s; }
    .injection-compare-r4 { animation-delay: 1.80s; }
    .injection-compare-row { animation: injection-compare-reveal 7.3s ease-in-out infinite; }
    @keyframes injection-compare-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="injection-compare-bg" width="980" height="390"/>
  <text class="injection-compare-h1"  x="30" y="40">Injection compared with jailbreaking</text>
  <text class="injection-compare-sub" x="30" y="64">Different problems.</text>
  <rect class="injection-compare-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="injection-compare-name" x="46" y="122">Prompt injection</text>
  <text class="injection-compare-desc" x="46" y="142">A third party attacks.</text>
  <text class="injection-compare-desc injection-compare-row injection-compare-r0" x="46" y="182">Instructions arrive in content the model reads</text>
  <text class="injection-compare-desc injection-compare-row injection-compare-r1" x="46" y="216">The user is the victim, not the attacker</text>
  <text class="injection-compare-desc injection-compare-row injection-compare-r2" x="46" y="250">Targets the application's privileges</text>
  <text class="injection-compare-desc injection-compare-row injection-compare-r3" x="46" y="284">Defended by containment and least privilege</text>
  <text class="injection-compare-desc injection-compare-row injection-compare-r4" x="46" y="318">A systems security problem</text>
  <rect class="injection-compare-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="injection-compare-name" x="526" y="122">Jailbreaking</text>
  <text class="injection-compare-desc" x="526" y="142">The user attacks.</text>
  <text class="injection-compare-desc injection-compare-row injection-compare-r0" x="526" y="182">The user crafts their own prompt</text>
  <text class="injection-compare-desc injection-compare-row injection-compare-r1" x="526" y="216">The user is the attacker</text>
  <text class="injection-compare-desc injection-compare-row injection-compare-r2" x="526" y="250">Targets the model's safety training</text>
  <text class="injection-compare-desc injection-compare-row injection-compare-r3" x="526" y="284">Defended by alignment and refusal training</text>
  <text class="injection-compare-desc injection-compare-row injection-compare-r4" x="526" y="318">A model behaviour problem</text>
  <text class="injection-compare-sub" x="30" y="372">Conflating the two leads to the wrong defence: alignment training does nothing about an attacker who never speaks to the model directly.</text>
</svg>
