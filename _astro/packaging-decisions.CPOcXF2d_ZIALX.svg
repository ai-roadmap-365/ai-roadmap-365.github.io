<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two are always; three depend.">
  <title>The decisions, and their thresholds</title>
  <style>
    .packaging-decisions-bg   { fill: #f8fafc; }
    .packaging-decisions-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packaging-decisions-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packaging-decisions-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packaging-decisions-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packaging-decisions-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packaging-decisions-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .packaging-decisions-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .packaging-decisions-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .packaging-decisions-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .packaging-decisions-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .packaging-decisions-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .packaging-decisions-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .packaging-decisions-row { opacity: 1; }
    .packaging-decisions-r0 { animation-delay: 0.00s; }
    .packaging-decisions-r1 { animation-delay: 0.45s; }
    .packaging-decisions-r2 { animation-delay: 0.90s; }
    .packaging-decisions-r3 { animation-delay: 1.35s; }
    .packaging-decisions-r4 { animation-delay: 1.80s; }
    .packaging-decisions-row { animation: packaging-decisions-reveal 7.3s ease-in-out infinite; }
    @keyframes packaging-decisions-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="packaging-decisions-bg" width="980" height="390"/>
  <text class="packaging-decisions-h1"  x="30" y="40">The decisions, and their thresholds</text>
  <text class="packaging-decisions-sub" x="30" y="64">Two are always; three depend.</text>
  <rect class="packaging-decisions-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="packaging-decisions-name" x="46" y="122">Always</text>
  <text class="packaging-decisions-desc" x="46" y="142">Costs a few lines.</text>
  <text class="packaging-decisions-desc packaging-decisions-row packaging-decisions-r0" x="46" y="182">Separate build from runtime</text>
  <text class="packaging-decisions-desc packaging-decisions-row packaging-decisions-r1" x="46" y="216">cuda-runtime in the final stage</text>
  <text class="packaging-decisions-desc packaging-decisions-row packaging-decisions-r2" x="46" y="250">A non-root USER</text>
  <text class="packaging-decisions-desc packaging-decisions-row packaging-decisions-r3" x="46" y="284">Check the licence before publishing</text>
  <text class="packaging-decisions-desc packaging-decisions-row packaging-decisions-r4" x="46" y="318">This one is not reversible</text>
  <rect class="packaging-decisions-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="packaging-decisions-name" x="526" y="122">It depends</text>
  <text class="packaging-decisions-desc" x="526" y="142">On size and schedule.</text>
  <text class="packaging-decisions-desc packaging-decisions-row packaging-decisions-r0" x="526" y="182">Mount above roughly a gigabyte</text>
  <text class="packaging-decisions-desc packaging-decisions-row packaging-decisions-r1" x="526" y="216">Or when weights change on their own schedule</text>
  <text class="packaging-decisions-desc packaging-decisions-row packaging-decisions-r2" x="526" y="250">Bake in when reproducibility outranks size</text>
  <text class="packaging-decisions-desc packaging-decisions-row packaging-decisions-r3" x="526" y="284">Do not chase the last hundred megabytes</text>
  <text class="packaging-decisions-desc packaging-decisions-row packaging-decisions-r4" x="526" y="318">Distroless costs debuggability</text>
  <text class="packaging-decisions-sub" x="30" y="372">Both conditions for mounting are usually true at once, which makes the threshold easier than it looks: a model large enough to matter is almost always a model that changes on a different schedule from the code.</text>
</svg>
