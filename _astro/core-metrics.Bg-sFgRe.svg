<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each answering a different question.">
  <title>Four metrics from four cells</title>
  <style>
    .core-metrics-bg   { fill: #f8fafc; }
    .core-metrics-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .core-metrics-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .core-metrics-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .core-metrics-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .core-metrics-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .core-metrics-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .core-metrics-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .core-metrics-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .core-metrics-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .core-metrics-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .core-metrics-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .core-metrics-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .core-metrics-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .core-metrics-stage { opacity: 1; }

    .core-metrics-s0 { animation-delay: 0.00s; }
    .core-metrics-e0 { animation-delay: 0.00s; }
    .core-metrics-s1 { animation-delay: 1.28s; }
    .core-metrics-e1 { animation-delay: 1.28s; }
    .core-metrics-s2 { animation-delay: 2.56s; }
    .core-metrics-e2 { animation-delay: 2.56s; }
    .core-metrics-s3 { animation-delay: 3.84s; }
    .core-metrics-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .core-metrics-conn  { animation: core-metrics-trace 6.4s ease-in-out infinite; }
      .core-metrics-stage { animation: core-metrics-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes core-metrics-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes core-metrics-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .core-metrics-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .core-metrics-stage { animation: core-metrics-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes core-metrics-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="core-metrics-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="core-metrics-bg" width="980" height="322"/>
  <text class="core-metrics-h1"  x="30" y="40">Four metrics from four cells</text>
  <text class="core-metrics-sub" x="30" y="64">Each answering a different question.</text>
  <g class="core-metrics-stage core-metrics-s0">
    <rect class="core-metrics-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="core-metrics-step" x="44" y="142">01</text>
    <text class="core-metrics-name" x="70" y="142">Precision</text>
    <text class="core-metrics-desc" x="44" y="166">Of those flagged, how many were</text>
    <text class="core-metrics-desc" x="44" y="182">right? Cost of false alarms.</text>
  </g>
  <line class="core-metrics-line core-metrics-conn core-metrics-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#core-metrics-tip)"/>
  <g class="core-metrics-stage core-metrics-s1">
    <rect class="core-metrics-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="core-metrics-step" x="280" y="142">02</text>
    <text class="core-metrics-name" x="306" y="142">Recall</text>
    <text class="core-metrics-desc" x="280" y="166">Of those that mattered, how many</text>
    <text class="core-metrics-desc" x="280" y="182">were caught? Cost of misses.</text>
  </g>
  <line class="core-metrics-line core-metrics-conn core-metrics-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#core-metrics-tip)"/>
  <g class="core-metrics-stage core-metrics-s2">
    <rect class="core-metrics-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="core-metrics-step" x="516" y="142">03</text>
    <text class="core-metrics-name" x="542" y="142">Specificity</text>
    <text class="core-metrics-desc" x="516" y="166">Of the negatives, how many were</text>
    <text class="core-metrics-desc" x="516" y="182">left alone?</text>
  </g>
  <line class="core-metrics-line core-metrics-conn core-metrics-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#core-metrics-tip)"/>
  <g class="core-metrics-stage core-metrics-s3">
    <rect class="core-metrics-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="core-metrics-step" x="752" y="142">04</text>
    <text class="core-metrics-name" x="778" y="142">The harmonic mean of precision and recall</text>
    <text class="core-metrics-desc" x="752" y="166">One number, which hides which</text>
    <text class="core-metrics-desc" x="752" y="182">one is failing.</text>
  </g>
  <text class="core-metrics-sub" x="30" y="304">The combined score is convenient and lossy: two models with the same value can have completely different error profiles, and only the matrix shows that.</text>
</svg>
