<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The pattern, not the reading.">
  <title>A chart at a bedside</title>
  <style>
    .patient-chart-bg   { fill: #f8fafc; }
    .patient-chart-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .patient-chart-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .patient-chart-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .patient-chart-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .patient-chart-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .patient-chart-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .patient-chart-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .patient-chart-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .patient-chart-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .patient-chart-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .patient-chart-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .patient-chart-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .patient-chart-row { opacity: 1; }
    .patient-chart-r0 { animation-delay: 0.00s; }
    .patient-chart-r1 { animation-delay: 0.45s; }
    .patient-chart-r2 { animation-delay: 0.90s; }
    .patient-chart-r3 { animation-delay: 1.35s; }
    .patient-chart-r4 { animation-delay: 1.80s; }
    .patient-chart-row { animation: patient-chart-reveal 7.3s ease-in-out infinite; }
    @keyframes patient-chart-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="patient-chart-bg" width="980" height="390"/>
  <text class="patient-chart-h1"  x="30" y="40">A chart at a bedside</text>
  <text class="patient-chart-sub" x="30" y="64">The pattern, not the reading.</text>
  <rect class="patient-chart-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="patient-chart-name" x="46" y="122">The series</text>
  <text class="patient-chart-desc" x="46" y="142">Shows direction.</text>
  <text class="patient-chart-desc patient-chart-row patient-chart-r0" x="46" y="182">Readings over hours or days</text>
  <text class="patient-chart-desc patient-chart-row patient-chart-r1" x="46" y="216">Direction is visible</text>
  <text class="patient-chart-desc patient-chart-row patient-chart-r2" x="46" y="250">A change of pattern stands out</text>
  <text class="patient-chart-desc patient-chart-row patient-chart-r3" x="46" y="284">Context for any single value</text>
  <text class="patient-chart-desc patient-chart-row patient-chart-r4" x="46" y="318">This is a time series</text>
  <rect class="patient-chart-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="patient-chart-name" x="526" y="122">One reading</text>
  <text class="patient-chart-desc" x="526" y="142">Shows a level.</text>
  <text class="patient-chart-desc patient-chart-row patient-chart-r0" x="526" y="182">A single measurement</text>
  <text class="patient-chart-desc patient-chart-row patient-chart-r1" x="526" y="216">No direction</text>
  <text class="patient-chart-desc patient-chart-row patient-chart-r2" x="526" y="250">A change is invisible</text>
  <text class="patient-chart-desc patient-chart-row patient-chart-r3" x="526" y="284">No context</text>
  <text class="patient-chart-desc patient-chart-row patient-chart-r4" x="526" y="318">This is a snapshot</text>
  <text class="patient-chart-sub" x="30" y="372">A change of pattern standing out is the diagnostic value of the series, and it is why monitoring dashboards plot history rather than current values alone.</text>
</svg>
