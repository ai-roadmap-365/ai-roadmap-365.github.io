<svg role="img" aria-label="UNet architecture diagram showing contracting encoder path bottleneck expanding decoder path and lateral skip connections" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>U-Net Architecture: Encoder-Decoder with Skip Connections</title>
  <defs>
    <linearGradient id="bg216b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card216b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg216b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">U-NET ENCODER-DECODER SEGMENTATION ARCHITECTURE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Preserving High-Resolution Spatial Details via Lateral Skip Connections</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card216b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Left: Contracting Encoder Path -->
    <rect x="30" y="30" width="150" height="50" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="4"/>
    <text x="105" y="52" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">Encoder Stage 1</text>
    <text x="105" y="68" fill="#cbd5e1" font-size="8" text-anchor="middle">64ch | 256x256</text>

    <rect x="60" y="100" width="120" height="50" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="4"/>
    <text x="120" y="122" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">Encoder Stage 2</text>
    <text x="120" y="138" fill="#cbd5e1" font-size="8" text-anchor="middle">128ch | 128x128</text>

    <!-- Downsampling arrows -->
    <path d="M 105 80 L 105 100" stroke="#f43f5e" stroke-width="2"/>
    <path d="M 120 150 L 170 180" stroke="#f43f5e" stroke-width="2"/>

    <!-- Center: Bottleneck -->
    <rect x="280" y="180" width="200" height="50" fill="#0f172a" stroke="#fbbf24" stroke-width="2" rx="4"/>
    <text x="380" y="202" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">Bottleneck (Latent Code)</text>
    <text x="380" y="218" fill="#f8fafc" font-size="9" text-anchor="middle">512 channels | 32x32 Resolution</text>

    <!-- Right: Expansive Decoder Path -->
    <rect x="580" y="100" width="120" height="50" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="4"/>
    <text x="640" y="122" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">Decoder Stage 2</text>
    <text x="640" y="138" fill="#cbd5e1" font-size="8" text-anchor="middle">128ch | 128x128</text>

    <rect x="580" y="30" width="150" height="50" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="4"/>
    <text x="655" y="52" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">Decoder Stage 1</text>
    <text x="655" y="68" fill="#cbd5e1" font-size="8" text-anchor="middle">64ch | 256x256</text>

    <!-- Upsampling arrows -->
    <path d="M 480 180 L 580 140" stroke="#10b981" stroke-width="2"/>
    <path d="M 640 100 L 640 80" stroke="#10b981" stroke-width="2"/>

    <!-- High-Resolution Lateral Skip Connections -->
    <path d="M 180 55 L 580 55" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="5" fill="none"/>
    <polygon points="580,55 572,50 572,60" fill="#a855f7"/>
    <text x="380" y="48" fill="#c084fc" font-size="9" font-weight="700" text-anchor="middle">Lateral Skip Connection: Concatenate High-Res Spatial Features</text>

    <path d="M 180 125 L 580 125" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="5" fill="none"/>
    <polygon points="580,125 572,120 572,130" fill="#a855f7"/>
    <text x="380" y="118" fill="#c084fc" font-size="9" font-weight="700" text-anchor="middle">Skip Connection: Concatenate Mid-Level Features</text>

    <!-- Bottom summary -->
    <rect x="30" y="245" width="700" height="35" fill="#0f172a" stroke="#475569" rx="4"/>
    <text x="380" y="267" fill="#cbd5e1" font-size="9" text-anchor="middle">Final 1x1 Conv projects 64 channels to C class masks with per-pixel Cross-Entropy / Dice Loss</text>
  </g>
</svg>
