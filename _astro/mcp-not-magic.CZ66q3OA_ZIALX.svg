<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Including one it cannot.">
  <title>Three things it does not do</title>
  <style>
    .mcp-not-magic-bg   { fill: #f8fafc; }
    .mcp-not-magic-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-not-magic-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-not-magic-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-not-magic-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-not-magic-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-not-magic-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mcp-not-magic-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mcp-not-magic-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mcp-not-magic-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mcp-not-magic-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mcp-not-magic-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mcp-not-magic-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mcp-not-magic-row { opacity: 1; }
    .mcp-not-magic-r0 { animation-delay: 0.00s; }
    .mcp-not-magic-r1 { animation-delay: 0.45s; }
    .mcp-not-magic-r2 { animation-delay: 0.90s; }
    .mcp-not-magic-r3 { animation-delay: 1.35s; }
    .mcp-not-magic-r4 { animation-delay: 1.80s; }
    .mcp-not-magic-row { animation: mcp-not-magic-reveal 7.3s ease-in-out infinite; }
    @keyframes mcp-not-magic-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="mcp-not-magic-bg" width="980" height="390"/>
  <text class="mcp-not-magic-h1"  x="30" y="40">Three things it does not do</text>
  <text class="mcp-not-magic-sub" x="30" y="64">Including one it cannot.</text>
  <rect class="mcp-not-magic-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="mcp-not-magic-name" x="46" y="122">What it is</text>
  <text class="mcp-not-magic-desc" x="46" y="142">Configuration and processes.</text>
  <text class="mcp-not-magic-desc mcp-not-magic-row mcp-not-magic-r0" x="46" y="182">Registering commands, arguments and environment</text>
  <text class="mcp-not-magic-desc mcp-not-magic-row mcp-not-magic-r1" x="46" y="216">Spawning local or remote processes</text>
  <text class="mcp-not-magic-desc mcp-not-magic-row mcp-not-magic-r2" x="46" y="250">Clean JSON-RPC over pipes</text>
  <text class="mcp-not-magic-desc mcp-not-magic-row mcp-not-magic-r3" x="46" y="284">Dynamic tool catalogues</text>
  <text class="mcp-not-magic-desc mcp-not-magic-row mcp-not-magic-r4" x="46" y="318">Routing calls to services</text>
  <rect class="mcp-not-magic-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="mcp-not-magic-name" x="526" y="122">Three misconceptions</text>
  <text class="mcp-not-magic-desc" x="526" y="142">One matters for security.</text>
  <text class="mcp-not-magic-desc mcp-not-magic-row mcp-not-magic-r0" x="526" y="182">It does not alter model weights</text>
  <text class="mcp-not-magic-desc mcp-not-magic-row mcp-not-magic-r1" x="526" y="216">It does not write per-tool prompt wrappers</text>
  <text class="mcp-not-magic-desc mcp-not-magic-row mcp-not-magic-r2" x="526" y="250">It does not bypass OS permissions</text>
  <text class="mcp-not-magic-desc mcp-not-magic-row mcp-not-magic-r3" x="526" y="284">Servers run as the host user</text>
  <text class="mcp-not-magic-desc mcp-not-magic-row mcp-not-magic-r4" x="526" y="318">So the user's access is the ceiling</text>
  <text class="mcp-not-magic-sub" x="30" y="372">The last row cuts both ways: it bounds what a server can do to what you could already do, and it means a compromised server has everything you have.</text>
</svg>
