<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-label="Copyright Risk and Fair Use Matrix">
  <title>Copyright Risk and Fair Use Matrix</title>
  <rect width="100%" height="100%" fill="#f8fafc" />
  
    <style>
      .d286f-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d286f-header { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .d286f-text { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .d286f-accent { fill: #1d4ed8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .d286f-arrow { stroke: #1d4ed8; stroke-width: 2; stroke-linecap: round; marker-end: url(#d286f-arrowhead); }
      .d286f-pulse { animation: d286f-glow 2.5s infinite ease-in-out; }
      @keyframes d286f-glow {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(29, 78, 216, 0.2)); }
        50% { filter: drop-shadow(0 0 6px rgba(29, 78, 216, 0.6)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .d286f-pulse { animation: none; }
      }
    </style>
    
  
    <defs>
      <marker id="d286f-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8" />
      </marker>
    </defs>
    
  
  <g transform="translate(40, 40)">
    <rect class="d286f-box" x="0" y="0" width="220" height="180" />
    <text class="d286f-header" x="15" y="30">1. Fair Use Evaluation</text>
    <text class="d286f-text" x="15" y="60">• Purpose of Use (Transf.)</text>
    <text class="d286f-text" x="15" y="85">• Nature of Copyrighted Work</text>
    <text class="d286f-text" x="15" y="110">• Amount / Substantiality</text>
    <text class="d286f-accent" x="15" y="140">Market Effect Factor</text>

    <path class="d286f-arrow" d="M 220 90 L 280 90" />

    <rect class="d286f-box d286f-pulse" x="280" y="0" width="240" height="180" />
    <text class="d286f-header" x="15" y="30">2. IP Risk Guardrails</text>
    <text class="d286f-text" x="15" y="60">• Exact memorization filter</text>
    <text class="d286f-text" x="15" y="85">• Style cloning mitigations</text>
    <text class="d286f-text" x="15" y="110">• Opt-out robots.txt parsing</text>
    <text class="d286f-accent" x="15" y="140">Compliance Firewall</text>

    <path class="d286f-arrow" d="M 520 90 L 580 90" />

    <rect class="d286f-box" x="580" y="0" width="200" height="180" />
    <text class="d286f-header" x="15" y="30">3. Commercial Safety</text>
    <text class="d286f-text" x="15" y="60">• Enterprise Indemnification</text>
    <text class="d286f-text" x="15" y="85">• Licensable training datasets</text>
    <text class="d286f-accent" x="15" y="140">Legally Sound Production</text>
  </g>

</svg>