<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Specification Driven Prompting Anatomy">
  <title>Specification Driven Prompting Anatomy</title>
  <defs>
    <style>
      .d303a-bg { fill: #f8fafc; }
      .d303a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d303a-sec { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d303a-con { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; rx: 8px; }
      .d303a-veri { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d303a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d303a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d303a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d303a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d303a-bg" />
  
  <text x="40" y="40" class="d303a-title">Anatomy of a High-Leverage Developer Spec Prompt</text>
  <text x="40" y="65" class="d303a-subtitle">Specification Driven Prompting Anatomy diagram showing Goal, Context Files, Type Signatures, Explicit Constraints, Non-Goals, and Verification Plan</text>
  
  <!-- 1. Goal & Requirements -->
  <rect x="40" y="100" width="250" height="140" class="d303a-sec" />
  <text x="55" y="125" class="d303a-header" fill="#1d4ed8">1. Precise Objective &amp; Types</text>
  <text x="55" y="150" class="d303a-text">• User Story / Problem Statement</text>
  <text x="55" y="170" class="d303a-text">• Explicit Input &amp; Output Types</text>
  <text x="55" y="190" class="d303a-text">• Schema: Pydantic / TypeScript</text>
  <text x="55" y="210" class="d303a-text">• Target file paths to modify</text>
  
  <!-- 2. Surgical Context -->
  <rect x="325" y="100" width="250" height="140" class="d303a-card" />
  <text x="340" y="125" class="d303a-header">2. Surgical Context Pointers</text>
  <text x="340" y="150" class="d303a-text">• Interface signatures only</text>
  <text x="340" y="170" class="d303a-text">• Existing test file: `tests/test_x.py`</text>
  <text x="340" y="190" class="d303a-text">• Exact error traceback lines</text>
  <text x="340" y="210" class="d303a-text">• Omit unrelated modules</text>
  
  <!-- 3. Strict Non-Goals -->
  <rect x="610" y="100" width="250" height="140" class="d303a-con" />
  <text x="625" y="125" class="d303a-header" fill="#b91c1c">3. Hard Constraints &amp; Non-Goals</text>
  <text x="625" y="150" class="d303a-text">• DO NOT modify public API signatures</text>
  <text x="625" y="170" class="d303a-text">• DO NOT add new external packages</text>
  <text x="625" y="190" class="d303a-text">• DO NOT refactor legacy `utils.py`</text>
  <text x="625" y="210" class="d303a-text">• Preserve existing docstrings</text>
  
  <!-- 4. Verification Plan -->
  <rect x="40" y="260" width="820" height="140" class="d303a-veri" />
  <text x="60" y="290" class="d303a-header" fill="#15803d">4. Automated Verification &amp; Acceptance Gates</text>
  <text x="60" y="320" class="d303a-text" font-weight="600">Deterministic Commands the Agent Must Run to Verify Completion:</text>
  <text x="60" y="345" class="d303a-text">• `pytest tests/test_auth.py -k test_jwt_expiry -v` (Must exit 0 with 100% pass)</text>
  <text x="60" y="365" class="d303a-text">• `mypy auth_engine/ --strict` (Zero type errors allowed)</text>
  <text x="60" y="385" class="d303a-text">• `ruff check auth_engine/` (Zero linter warnings)</text>
</svg>