<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>The forward process</title>
  <style>
    .forward-process-bg   { fill: #f8fafc; }
    .forward-process-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forward-process-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forward-process-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forward-process-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forward-process-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forward-process-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .forward-process-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .forward-process-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .forward-process-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .forward-process-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .forward-process-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .forward-process-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .forward-process-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .forward-process-stage { opacity: 1; }

    .forward-process-s0 { animation-delay: 0.00s; }
    .forward-process-e0 { animation-delay: 0.00s; }
    .forward-process-s1 { animation-delay: 1.28s; }
    .forward-process-e1 { animation-delay: 1.28s; }
    .forward-process-s2 { animation-delay: 2.56s; }
    .forward-process-e2 { animation-delay: 2.56s; }
    .forward-process-s3 { animation-delay: 3.84s; }
    .forward-process-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .forward-process-conn  { animation: forward-process-trace 6.4s ease-in-out infinite; }
      .forward-process-stage { animation: forward-process-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes forward-process-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes forward-process-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .forward-process-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .forward-process-stage { animation: forward-process-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes forward-process-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="forward-process-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="forward-process-bg" width="980" height="322"/>
  <text class="forward-process-h1"  x="30" y="40">The forward process</text>
  <text class="forward-process-sub" x="30" y="64">Four properties.</text>
  <g class="forward-process-stage forward-process-s0">
    <rect class="forward-process-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="forward-process-step" x="44" y="142">01</text>
    <text class="forward-process-name" x="70" y="142">Noise is added in small steps</text>
    <text class="forward-process-desc" x="44" y="166">Each one a little Gaussian</text>
    <text class="forward-process-desc" x="44" y="182">noise.</text>
  </g>
  <line class="forward-process-line forward-process-conn forward-process-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#forward-process-tip)"/>
  <g class="forward-process-stage forward-process-s1">
    <rect class="forward-process-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="forward-process-step" x="280" y="142">02</text>
    <text class="forward-process-name" x="306" y="142">Following a fixed schedule</text>
    <text class="forward-process-desc" x="280" y="166">Which decides how fast the image</text>
    <text class="forward-process-desc" x="280" y="182">is destroyed.</text>
  </g>
  <line class="forward-process-line forward-process-conn forward-process-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#forward-process-tip)"/>
  <g class="forward-process-stage forward-process-s2">
    <rect class="forward-process-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="forward-process-step" x="516" y="142">03</text>
    <text class="forward-process-name" x="542" y="142">And the composition has a closed form</text>
    <text class="forward-process-desc" x="516" y="166">So any step is reachable in one</text>
    <text class="forward-process-desc" x="516" y="182">calculation.</text>
  </g>
  <line class="forward-process-line forward-process-conn forward-process-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#forward-process-tip)"/>
  <g class="forward-process-stage forward-process-s3">
    <rect class="forward-process-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="forward-process-step" x="752" y="142">04</text>
    <text class="forward-process-name" x="778" y="142">Which is what makes training cheap</text>
    <text class="forward-process-desc" x="752" y="166">Sample a random step directly,</text>
    <text class="forward-process-desc" x="752" y="182">rather than iterating to it.</text>
    <text class="forward-process-edge" x="752" y="242">O(1)</text>
  </g>
  <text class="forward-process-sub" x="30" y="304">The closed form is what makes training practical: without it, producing a training example at step eight hundred would require eight hundred sequential operations.</text>
</svg>
