<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when keywords are better.">
  <title>When to use embeddings</title>
  <style>
    .embedding-when-bg   { fill: #f8fafc; }
    .embedding-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .embedding-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .embedding-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .embedding-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .embedding-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .embedding-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .embedding-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .embedding-when-row { opacity: 1; }
    .embedding-when-r0 { animation-delay: 0.00s; }
    .embedding-when-r1 { animation-delay: 0.45s; }
    .embedding-when-r2 { animation-delay: 0.90s; }
    .embedding-when-r3 { animation-delay: 1.35s; }
    .embedding-when-r4 { animation-delay: 1.80s; }
    .embedding-when-row { animation: embedding-when-reveal 7.3s ease-in-out infinite; }
    @keyframes embedding-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="embedding-when-bg" width="980" height="390"/>
  <text class="embedding-when-h1"  x="30" y="40">When to use embeddings</text>
  <text class="embedding-when-sub" x="30" y="64">And when keywords are better.</text>
  <rect class="embedding-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="embedding-when-name" x="46" y="122">Use embeddings</text>
  <text class="embedding-when-desc" x="46" y="142">Meaning matters.</text>
  <text class="embedding-when-desc embedding-when-row embedding-when-r0" x="46" y="182">Questions phrased differently from the text</text>
  <text class="embedding-when-desc embedding-when-row embedding-when-r1" x="46" y="216">Synonyms and paraphrase</text>
  <text class="embedding-when-desc embedding-when-row embedding-when-r2" x="46" y="250">Clustering and deduplication</text>
  <text class="embedding-when-desc embedding-when-row embedding-when-r3" x="46" y="284">Recommendation and similarity</text>
  <text class="embedding-when-desc embedding-when-row embedding-when-r4" x="46" y="318">Cross-language and cross-modal search</text>
  <rect class="embedding-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="embedding-when-name" x="526" y="122">Use keywords</text>
  <text class="embedding-when-desc" x="526" y="142">Exactness matters.</text>
  <text class="embedding-when-desc embedding-when-row embedding-when-r0" x="526" y="182">Part numbers, identifiers, codes</text>
  <text class="embedding-when-desc embedding-when-row embedding-when-r1" x="526" y="216">Names and rare terms</text>
  <text class="embedding-when-desc embedding-when-row embedding-when-r2" x="526" y="250">Exact quotation</text>
  <text class="embedding-when-desc embedding-when-row embedding-when-r3" x="526" y="284">Small corpora</text>
  <text class="embedding-when-desc embedding-when-row embedding-when-r4" x="526" y="318">Where interpretability is required</text>
  <text class="embedding-when-sub" x="30" y="372">The default in production is both, combined — which is the subject of hybrid retrieval later in this course and consistently beats either alone.</text>
</svg>
