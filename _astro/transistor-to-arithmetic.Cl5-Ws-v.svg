<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Nothing is added from outside. Each stage is only the one before it, arranged.">
  <title>Arithmetic is a shape, not an ability</title>
  <style>
    .transistor-to-arithmetic-bg   { fill: #f8fafc; }
    .transistor-to-arithmetic-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transistor-to-arithmetic-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transistor-to-arithmetic-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transistor-to-arithmetic-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transistor-to-arithmetic-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transistor-to-arithmetic-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .transistor-to-arithmetic-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .transistor-to-arithmetic-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .transistor-to-arithmetic-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .transistor-to-arithmetic-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .transistor-to-arithmetic-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .transistor-to-arithmetic-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .transistor-to-arithmetic-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .transistor-to-arithmetic-stage { opacity: 1; }

    .transistor-to-arithmetic-s0 { animation-delay: 0.00s; }
    .transistor-to-arithmetic-e0 { animation-delay: 0.00s; }
    .transistor-to-arithmetic-s1 { animation-delay: 1.28s; }
    .transistor-to-arithmetic-e1 { animation-delay: 1.28s; }
    .transistor-to-arithmetic-s2 { animation-delay: 2.56s; }
    .transistor-to-arithmetic-e2 { animation-delay: 2.56s; }
    .transistor-to-arithmetic-s3 { animation-delay: 3.84s; }
    .transistor-to-arithmetic-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .transistor-to-arithmetic-conn  { animation: transistor-to-arithmetic-trace 6.4s ease-in-out infinite; }
      .transistor-to-arithmetic-stage { animation: transistor-to-arithmetic-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes transistor-to-arithmetic-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes transistor-to-arithmetic-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .transistor-to-arithmetic-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .transistor-to-arithmetic-stage { animation: transistor-to-arithmetic-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes transistor-to-arithmetic-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="transistor-to-arithmetic-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="transistor-to-arithmetic-bg" width="980" height="322"/>
  <text class="transistor-to-arithmetic-h1"  x="30" y="40">Arithmetic is a shape, not an ability</text>
  <text class="transistor-to-arithmetic-sub" x="30" y="64">Nothing is added from outside. Each stage is only the one before it, arranged.</text>
  <g class="transistor-to-arithmetic-stage transistor-to-arithmetic-s0">
    <rect class="transistor-to-arithmetic-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="transistor-to-arithmetic-step" x="44" y="142">01</text>
    <text class="transistor-to-arithmetic-name" x="70" y="142">Switch</text>
    <text class="transistor-to-arithmetic-desc" x="44" y="166">A voltage on one terminal</text>
    <text class="transistor-to-arithmetic-desc" x="44" y="182">decides whether current flows.</text>
    <text class="transistor-to-arithmetic-edge" x="44" y="242">1 bit</text>
  </g>
  <line class="transistor-to-arithmetic-line transistor-to-arithmetic-conn transistor-to-arithmetic-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#transistor-to-arithmetic-tip)"/>
  <g class="transistor-to-arithmetic-stage transistor-to-arithmetic-s1">
    <rect class="transistor-to-arithmetic-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="transistor-to-arithmetic-step" x="280" y="142">02</text>
    <text class="transistor-to-arithmetic-name" x="306" y="142">Gate</text>
    <text class="transistor-to-arithmetic-desc" x="280" y="166">A few switches wired to compute</text>
    <text class="transistor-to-arithmetic-desc" x="280" y="182">AND, OR or NOT.</text>
    <text class="transistor-to-arithmetic-edge" x="280" y="242">a rule</text>
  </g>
  <line class="transistor-to-arithmetic-line transistor-to-arithmetic-conn transistor-to-arithmetic-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#transistor-to-arithmetic-tip)"/>
  <g class="transistor-to-arithmetic-stage transistor-to-arithmetic-s2">
    <rect class="transistor-to-arithmetic-hi" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="transistor-to-arithmetic-step" x="516" y="142">03</text>
    <text class="transistor-to-arithmetic-name" x="542" y="142">Adder</text>
    <text class="transistor-to-arithmetic-desc" x="516" y="166">Gates cascaded so two binary</text>
    <text class="transistor-to-arithmetic-desc" x="516" y="182">numbers come out summed.</text>
    <text class="transistor-to-arithmetic-edge" x="516" y="242">arithmetic</text>
  </g>
  <line class="transistor-to-arithmetic-line transistor-to-arithmetic-conn transistor-to-arithmetic-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#transistor-to-arithmetic-tip)"/>
  <g class="transistor-to-arithmetic-stage transistor-to-arithmetic-s3">
    <rect class="transistor-to-arithmetic-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="transistor-to-arithmetic-step" x="752" y="142">04</text>
    <text class="transistor-to-arithmetic-name" x="778" y="142">Memory cell</text>
    <text class="transistor-to-arithmetic-desc" x="752" y="166">Gates looped back, so the</text>
    <text class="transistor-to-arithmetic-desc" x="752" y="182">circuit holds its own state.</text>
    <text class="transistor-to-arithmetic-edge" x="752" y="242">a stored bit</text>
  </g>
  <text class="transistor-to-arithmetic-sub" x="30" y="304">The machine does not have arithmetic and memory. It is arranged into them.</text>
</svg>
