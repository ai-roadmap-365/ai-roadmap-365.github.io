<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" font-family="system-ui, sans-serif">
  <title>A Python program with its three standard streams — stdin in, stdout and stderr out — and how print and input map onto them in a shell pipeline</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">A Python program has three standard streams</text>

  <!-- The program box in the middle -->
  <rect x="280" y="150" width="200" height="150" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5" rx="12"/>
  <text x="380" y="200" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">your Python</text>
  <text x="380" y="224" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">program</text>
  <text x="380" y="256" text-anchor="middle" font-size="13" fill="#1a202c">input()  reads stdin</text>
  <text x="380" y="276" text-anchor="middle" font-size="13" fill="#1a202c">print()  writes stdout</text>

  <!-- stdin on the left -->
  <rect x="40" y="195" width="180" height="60" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="130" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">stdin (0)</text>
  <text x="130" y="242" text-anchor="middle" font-size="13" fill="#1a202c">keyboard or a pipe</text>
  <line x1="220" y1="225" x2="272" y2="225" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="280,225 266,218 266,232" fill="#1d4ed8"/>
  <text x="248" y="215" text-anchor="middle" font-size="12" fill="#1a202c">in</text>

  <!-- stdout on the right (top) -->
  <rect x="540" y="150" width="180" height="60" fill="#dcfce7" stroke="#15803d" stroke-width="2" rx="8"/>
  <text x="630" y="175" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">stdout (1)</text>
  <text x="630" y="197" text-anchor="middle" font-size="13" fill="#1a202c">results — the data</text>
  <line x1="480" y1="185" x2="532" y2="180" stroke="#15803d" stroke-width="3"/>
  <polygon points="540,179 526,173 525,187" fill="#15803d"/>

  <!-- stderr on the right (bottom) -->
  <rect x="540" y="240" width="180" height="60" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" rx="8"/>
  <text x="630" y="265" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">stderr (2)</text>
  <text x="630" y="287" text-anchor="middle" font-size="13" fill="#1a202c">errors and warnings</text>
  <line x1="480" y1="265" x2="532" y2="270" stroke="#b91c1c" stroke-width="3"/>
  <polygon points="540,271 525,264 526,278" fill="#b91c1c"/>
  <text x="380" y="330" text-anchor="middle" font-size="12" fill="#1a202c">print(..., file=sys.stderr) writes the red channel</text>

  <!-- Pipeline strip at the bottom (tie to Day 10) -->
  <rect x="40" y="370" width="680" height="80" fill="#f1f5f9" stroke="#1d4ed8" stroke-width="1.5" rx="10"/>
  <text x="380" y="396" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">In a shell pipeline (Day 10), stdout of one program feeds stdin of the next</text>
  <text x="380" y="424" text-anchor="middle" font-size="15" fill="#1d4ed8">cat data.txt  |  python3 tool.py  |  sort</text>
  <text x="380" y="442" text-anchor="middle" font-size="12" fill="#1a202c">stderr stays out of the pipe, so error messages never corrupt the data</text>
</svg>
