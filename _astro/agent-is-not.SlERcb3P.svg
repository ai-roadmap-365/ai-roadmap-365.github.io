<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A loop with tools and a budget.">
  <title>What an agent is, and is not</title>
  <style>
    .agent-is-not-bg   { fill: #f8fafc; }
    .agent-is-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-is-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-is-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-is-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-is-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-is-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .agent-is-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .agent-is-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .agent-is-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .agent-is-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .agent-is-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .agent-is-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .agent-is-not-row { opacity: 1; }
    .agent-is-not-r0 { animation-delay: 0.00s; }
    .agent-is-not-r1 { animation-delay: 0.45s; }
    .agent-is-not-r2 { animation-delay: 0.90s; }
    .agent-is-not-r3 { animation-delay: 1.35s; }
    .agent-is-not-r4 { animation-delay: 1.80s; }
    .agent-is-not-row { animation: agent-is-not-reveal 7.3s ease-in-out infinite; }
    @keyframes agent-is-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="agent-is-not-bg" width="980" height="390"/>
  <text class="agent-is-not-h1"  x="30" y="40">What an agent is, and is not</text>
  <text class="agent-is-not-sub" x="30" y="64">A loop with tools and a budget.</text>
  <rect class="agent-is-not-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="agent-is-not-name" x="46" y="122">It is</text>
  <text class="agent-is-not-desc" x="46" y="142">A bounded, auditable loop.</text>
  <text class="agent-is-not-desc agent-is-not-row agent-is-not-r0" x="46" y="182">A loop: think, call a tool, observe, repeat</text>
  <text class="agent-is-not-desc agent-is-not-row agent-is-not-r1" x="46" y="216">Tools with declared schemas</text>
  <text class="agent-is-not-desc agent-is-not-row agent-is-not-r2" x="46" y="250">A hard cap on turns and tokens</text>
  <text class="agent-is-not-desc agent-is-not-row agent-is-not-r3" x="46" y="284">Every step logged and replayable</text>
  <text class="agent-is-not-desc agent-is-not-row agent-is-not-r4" x="46" y="318">Deterministic failure when the cap is hit</text>
  <rect class="agent-is-not-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="agent-is-not-name" x="526" y="122">It is not</text>
  <text class="agent-is-not-desc" x="526" y="142">Where expectations go wrong.</text>
  <text class="agent-is-not-desc agent-is-not-row agent-is-not-r0" x="526" y="182">Not autonomous — it is bounded by design</text>
  <text class="agent-is-not-desc agent-is-not-row agent-is-not-r1" x="526" y="216">Not a planner that guarantees progress</text>
  <text class="agent-is-not-desc agent-is-not-row agent-is-not-r2" x="526" y="250">Not trustworthy with unvalidated arguments</text>
  <text class="agent-is-not-desc agent-is-not-row agent-is-not-r3" x="526" y="284">Not cheaper than a direct call</text>
  <text class="agent-is-not-desc agent-is-not-row agent-is-not-r4" x="526" y="318">Not the right shape for a known sequence</text>
  <text class="agent-is-not-sub" x="30" y="372">If the sequence of steps is known in advance, write the sequence. An agent buys the ability to choose the next step, and you pay for that in tokens, latency and unpredictability.</text>
</svg>
