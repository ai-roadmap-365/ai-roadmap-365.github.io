<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A more tractable property.">
  <title>Checkable is not the same as true</title>
  <style>
    .checkable-not-true-bg   { fill: #f8fafc; }
    .checkable-not-true-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .checkable-not-true-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .checkable-not-true-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .checkable-not-true-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .checkable-not-true-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .checkable-not-true-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .checkable-not-true-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .checkable-not-true-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .checkable-not-true-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .checkable-not-true-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .checkable-not-true-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .checkable-not-true-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .checkable-not-true-row { opacity: 1; }
    .checkable-not-true-r0 { animation-delay: 0.00s; }
    .checkable-not-true-r1 { animation-delay: 0.45s; }
    .checkable-not-true-r2 { animation-delay: 0.90s; }
    .checkable-not-true-r3 { animation-delay: 1.35s; }
    .checkable-not-true-r4 { animation-delay: 1.80s; }
    .checkable-not-true-row { animation: checkable-not-true-reveal 7.3s ease-in-out infinite; }
    @keyframes checkable-not-true-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="checkable-not-true-bg" width="980" height="390"/>
  <text class="checkable-not-true-h1"  x="30" y="40">Checkable is not the same as true</text>
  <text class="checkable-not-true-sub" x="30" y="64">A more tractable property.</text>
  <rect class="checkable-not-true-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="checkable-not-true-name" x="46" y="122">Checkable</text>
  <text class="checkable-not-true-desc" x="46" y="142">What the tool decides.</text>
  <text class="checkable-not-true-desc checkable-not-true-row checkable-not-true-r0" x="46" y="182">Is there a measurement?</text>
  <text class="checkable-not-true-desc checkable-not-true-row checkable-not-true-r1" x="46" y="216">Is there a baseline?</text>
  <text class="checkable-not-true-desc checkable-not-true-row checkable-not-true-r2" x="46" y="250">Is the contribution stated?</text>
  <text class="checkable-not-true-desc checkable-not-true-row checkable-not-true-r3" x="46" y="284">Can a stranger open the link?</text>
  <text class="checkable-not-true-desc checkable-not-true-row checkable-not-true-r4" x="46" y="318">Decidable from the sentence</text>
  <rect class="checkable-not-true-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="checkable-not-true-name" x="526" y="122">True</text>
  <text class="checkable-not-true-desc" x="526" y="142">What the tool cannot decide.</text>
  <text class="checkable-not-true-desc checkable-not-true-row checkable-not-true-r0" x="526" y="182">Did the number come from a real run?</text>
  <text class="checkable-not-true-desc checkable-not-true-row checkable-not-true-r1" x="526" y="216">Was the sample honest?</text>
  <text class="checkable-not-true-desc checkable-not-true-row checkable-not-true-r2" x="526" y="250">Was the contribution as described?</text>
  <text class="checkable-not-true-desc checkable-not-true-row checkable-not-true-r3" x="526" y="284">Does the link show what it claims?</text>
  <text class="checkable-not-true-desc checkable-not-true-row checkable-not-true-r4" x="526" y="318">Decidable only by checking the work</text>
  <text class="checkable-not-true-sub" x="30" y="372">The checks make claims assessable rather than verified — which is exactly the point, since a reader who can check does not need you to be believed on trust.</text>
</svg>
