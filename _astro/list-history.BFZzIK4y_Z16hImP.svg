<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward specialisation.">
  <title>Four steps for sequence types</title>
  <style>
    .list-history-bg   { fill: #f8fafc; }
    .list-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .list-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .list-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .list-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .list-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .list-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .list-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .list-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .list-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .list-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .list-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .list-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .list-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .list-history-stage { opacity: 1; }

    .list-history-s0 { animation-delay: 0.00s; }
    .list-history-e0 { animation-delay: 0.00s; }
    .list-history-s1 { animation-delay: 1.28s; }
    .list-history-e1 { animation-delay: 1.28s; }
    .list-history-s2 { animation-delay: 2.56s; }
    .list-history-e2 { animation-delay: 2.56s; }
    .list-history-s3 { animation-delay: 3.84s; }
    .list-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .list-history-conn  { animation: list-history-trace 6.4s ease-in-out infinite; }
      .list-history-stage { animation: list-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes list-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes list-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .list-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .list-history-stage { animation: list-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes list-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="list-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="list-history-bg" width="980" height="322"/>
  <text class="list-history-h1"  x="30" y="40">Four steps for sequence types</text>
  <text class="list-history-sub" x="30" y="64">Toward specialisation.</text>
  <g class="list-history-stage list-history-s0">
    <rect class="list-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="list-history-step" x="44" y="142">01</text>
    <text class="list-history-name" x="70" y="142">Fixed-size arrays</text>
    <text class="list-history-desc" x="44" y="166">Whose length had to be known in</text>
    <text class="list-history-desc" x="44" y="182">advance.</text>
  </g>
  <line class="list-history-line list-history-conn list-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#list-history-tip)"/>
  <g class="list-history-stage list-history-s1">
    <rect class="list-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="list-history-step" x="280" y="142">02</text>
    <text class="list-history-name" x="306" y="142">Then dynamic arrays that grow</text>
    <text class="list-history-desc" x="280" y="166">Reallocating as needed.</text>
  </g>
  <line class="list-history-line list-history-conn list-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#list-history-tip)"/>
  <g class="list-history-stage list-history-s2">
    <rect class="list-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="list-history-step" x="516" y="142">03</text>
    <text class="list-history-name" x="542" y="142">And a general list holding any types</text>
    <text class="list-history-desc" x="516" y="166">Which is flexible and</text>
    <text class="list-history-desc" x="516" y="182">memory-hungry.</text>
  </g>
  <line class="list-history-line list-history-conn list-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#list-history-tip)"/>
  <g class="list-history-stage list-history-s3">
    <rect class="list-history-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="list-history-step" x="752" y="142">04</text>
    <text class="list-history-name" x="778" y="142">Then specialised containers for specific costs</text>
    <text class="list-history-desc" x="752" y="166">Deques, arrays, and typed</text>
    <text class="list-history-desc" x="752" y="182">buffers.</text>
  </g>
  <text class="list-history-sub" x="30" y="304">The specialised containers exist precisely because the general list makes one set of trade-offs, and some workloads need a different set.</text>
</svg>
