<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each with a control.">
  <title>Four streaming failure modes</title>
  <style>
    .backend-failures-bg   { fill: #f8fafc; }
    .backend-failures-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backend-failures-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backend-failures-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backend-failures-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backend-failures-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backend-failures-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .backend-failures-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .backend-failures-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .backend-failures-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .backend-failures-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .backend-failures-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .backend-failures-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .backend-failures-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .backend-failures-stage { opacity: 1; }

    .backend-failures-s0 { animation-delay: 0.00s; }
    .backend-failures-e0 { animation-delay: 0.00s; }
    .backend-failures-s1 { animation-delay: 1.28s; }
    .backend-failures-e1 { animation-delay: 1.28s; }
    .backend-failures-s2 { animation-delay: 2.56s; }
    .backend-failures-e2 { animation-delay: 2.56s; }
    .backend-failures-s3 { animation-delay: 3.84s; }
    .backend-failures-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .backend-failures-conn  { animation: backend-failures-trace 6.4s ease-in-out infinite; }
      .backend-failures-stage { animation: backend-failures-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes backend-failures-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes backend-failures-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .backend-failures-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .backend-failures-stage { animation: backend-failures-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes backend-failures-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="backend-failures-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="backend-failures-bg" width="980" height="322"/>
  <text class="backend-failures-h1"  x="30" y="40">Four streaming failure modes</text>
  <text class="backend-failures-sub" x="30" y="64">Each with a control.</text>
  <g class="backend-failures-stage backend-failures-s0">
    <rect class="backend-failures-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="backend-failures-step" x="44" y="142">01</text>
    <text class="backend-failures-name" x="70" y="142">Unbounded memory</text>
    <text class="backend-failures-desc" x="44" y="166">Buffered completions times</text>
    <text class="backend-failures-desc" x="44" y="182">concurrency. Stream instead.</text>
  </g>
  <line class="backend-failures-line backend-failures-conn backend-failures-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#backend-failures-tip)"/>
  <g class="backend-failures-stage backend-failures-s1">
    <rect class="backend-failures-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="backend-failures-step" x="280" y="142">02</text>
    <text class="backend-failures-name" x="306" y="142">Proxy buffering</text>
    <text class="backend-failures-desc" x="280" y="166">A reverse proxy that buffers</text>
    <text class="backend-failures-desc" x="280" y="182">defeats streaming entirely.</text>
    <text class="backend-failures-desc" x="280" y="198">Disable it explicitly.</text>
  </g>
  <line class="backend-failures-line backend-failures-conn backend-failures-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#backend-failures-tip)"/>
  <g class="backend-failures-stage backend-failures-s2">
    <rect class="backend-failures-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="backend-failures-step" x="516" y="142">03</text>
    <text class="backend-failures-name" x="542" y="142">Idempotency key expiry</text>
    <text class="backend-failures-desc" x="516" y="166">Too short, and a slow retry is</text>
    <text class="backend-failures-desc" x="516" y="182">billed twice.</text>
  </g>
  <line class="backend-failures-line backend-failures-conn backend-failures-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#backend-failures-tip)"/>
  <g class="backend-failures-stage backend-failures-s3">
    <rect class="backend-failures-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="backend-failures-step" x="752" y="142">04</text>
    <text class="backend-failures-name" x="778" y="142">Cascading upstream failure</text>
    <text class="backend-failures-desc" x="752" y="166">Retries against a failing</text>
    <text class="backend-failures-desc" x="752" y="182">provider make its outage worse.</text>
    <text class="backend-failures-edge" x="752" y="242">break</text>
  </g>
  <text class="backend-failures-sub" x="30" y="304">Proxy buffering is the one that produces the most confusing symptom: the application streams correctly, the client receives everything at the end, and nothing in either component is wrong.</text>
</svg>
