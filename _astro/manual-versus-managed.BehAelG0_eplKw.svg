<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 424" role="img"
     aria-label="The difference is not convenience. It is knowing what is on your machine.">
  <title>Installing by hand, and installing by manager</title>
  <style>
    .manual-versus-managed-bg   { fill: #f8fafc; }
    .manual-versus-managed-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .manual-versus-managed-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .manual-versus-managed-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .manual-versus-managed-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .manual-versus-managed-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .manual-versus-managed-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .manual-versus-managed-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .manual-versus-managed-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .manual-versus-managed-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .manual-versus-managed-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .manual-versus-managed-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .manual-versus-managed-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .manual-versus-managed-row { opacity: 1; }
    .manual-versus-managed-r0 { animation-delay: 0.00s; }
    .manual-versus-managed-r1 { animation-delay: 0.45s; }
    .manual-versus-managed-r2 { animation-delay: 0.90s; }
    .manual-versus-managed-r3 { animation-delay: 1.35s; }
    .manual-versus-managed-r4 { animation-delay: 1.80s; }
    .manual-versus-managed-r5 { animation-delay: 2.25s; }
    .manual-versus-managed-row { animation: manual-versus-managed-reveal 7.7s ease-in-out infinite; }
    @keyframes manual-versus-managed-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="manual-versus-managed-bg" width="980" height="424"/>
  <text class="manual-versus-managed-h1"  x="30" y="40">Installing by hand, and installing by manager</text>
  <text class="manual-versus-managed-sub" x="30" y="64">The difference is not convenience. It is knowing what is on your machine.</text>
  <rect class="manual-versus-managed-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="manual-versus-managed-name" x="46" y="122">By hand</text>
  <text class="manual-versus-managed-desc" x="46" y="142">Find a website, download, run it.</text>
  <text class="manual-versus-managed-desc manual-versus-managed-row manual-versus-managed-r0" x="46" y="182">You resolve dependencies yourself, by error</text>
  <text class="manual-versus-managed-desc manual-versus-managed-row manual-versus-managed-r1" x="46" y="216">No signature check unless you do it</text>
  <text class="manual-versus-managed-desc manual-versus-managed-row manual-versus-managed-r2" x="46" y="250">Updating means finding the site again</text>
  <text class="manual-versus-managed-desc manual-versus-managed-row manual-versus-managed-r3" x="46" y="284">Removing leaves files nobody tracks</text>
  <text class="manual-versus-managed-desc manual-versus-managed-row manual-versus-managed-r4" x="46" y="318">Nothing records what you installed</text>
  <text class="manual-versus-managed-desc manual-versus-managed-row manual-versus-managed-r5" x="46" y="352">"Works on my machine" starts here</text>
  <rect class="manual-versus-managed-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="manual-versus-managed-name" x="526" y="122">By manager</text>
  <text class="manual-versus-managed-desc" x="526" y="142">One command, one trusted source.</text>
  <text class="manual-versus-managed-desc manual-versus-managed-row manual-versus-managed-r0" x="526" y="182">Dependencies resolved and installed in order</text>
  <text class="manual-versus-managed-desc manual-versus-managed-row manual-versus-managed-r1" x="526" y="216">Checksums verified before anything is unpacked</text>
  <text class="manual-versus-managed-desc manual-versus-managed-row manual-versus-managed-r2" x="526" y="250">One command updates everything</text>
  <text class="manual-versus-managed-desc manual-versus-managed-row manual-versus-managed-r3" x="526" y="284">Removal knows every file it placed</text>
  <text class="manual-versus-managed-desc manual-versus-managed-row manual-versus-managed-r4" x="526" y="318">A local database lists it all</text>
  <text class="manual-versus-managed-desc manual-versus-managed-row manual-versus-managed-r5" x="526" y="352">A manifest reproduces it elsewhere</text>
  <text class="manual-versus-managed-sub" x="30" y="406">The database is the part people undervalue. Without it, an unused library from three years ago is indistinguishable from one your system needs.</text>
</svg>
