<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Most real systems combine them.">
  <title>One approach, or several</title>
  <style>
    .combination-bg   { fill: #f8fafc; }
    .combination-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .combination-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .combination-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .combination-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .combination-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .combination-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .combination-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .combination-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .combination-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .combination-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .combination-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .combination-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .combination-row { opacity: 1; }
    .combination-r0 { animation-delay: 0.00s; }
    .combination-r1 { animation-delay: 0.45s; }
    .combination-r2 { animation-delay: 0.90s; }
    .combination-r3 { animation-delay: 1.35s; }
    .combination-r4 { animation-delay: 1.80s; }
    .combination-row { animation: combination-reveal 7.3s ease-in-out infinite; }
    @keyframes combination-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="combination-bg" width="980" height="390"/>
  <text class="combination-h1"  x="30" y="40">One approach, or several</text>
  <text class="combination-sub" x="30" y="64">Most real systems combine them.</text>
  <rect class="combination-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="combination-name" x="46" y="122">One approach</text>
  <text class="combination-desc" x="46" y="142">Simple.</text>
  <text class="combination-desc combination-row combination-r0" x="46" y="182">Fewer moving parts</text>
  <text class="combination-desc combination-row combination-r1" x="46" y="216">One thing to evaluate</text>
  <text class="combination-desc combination-row combination-r2" x="46" y="250">Easy to reason about</text>
  <text class="combination-desc combination-row combination-r3" x="46" y="284">Right for a narrow problem</text>
  <text class="combination-desc combination-row combination-r4" x="46" y="318">And rare in production</text>
  <rect class="combination-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="combination-name" x="526" y="122">Combined</text>
  <text class="combination-desc" x="526" y="142">Usual.</text>
  <text class="combination-desc combination-row combination-r0" x="526" y="182">Retrieval for the facts</text>
  <text class="combination-desc combination-row combination-r1" x="526" y="216">A fine-tune for the format and tone</text>
  <text class="combination-desc combination-row combination-r2" x="526" y="250">A careful prompt over both</text>
  <text class="combination-desc combination-row combination-r3" x="526" y="284">Each solving what it is good at</text>
  <text class="combination-desc combination-row combination-r4" x="526" y="318">Which is what mature systems look like</text>
  <text class="combination-sub" x="30" y="372">The combination is not a compromise between the three but a division of labour, with each handling the deficiency the others cannot.</text>
</svg>
