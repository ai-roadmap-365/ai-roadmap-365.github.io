<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Everyone hears everyone, at once.">
  <title>A panel of experts</title>
  <style>
    .panel-discussion-bg   { fill: #f8fafc; }
    .panel-discussion-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .panel-discussion-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .panel-discussion-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .panel-discussion-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .panel-discussion-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .panel-discussion-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .panel-discussion-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .panel-discussion-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .panel-discussion-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .panel-discussion-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .panel-discussion-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .panel-discussion-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .panel-discussion-row { opacity: 1; }
    .panel-discussion-r0 { animation-delay: 0.00s; }
    .panel-discussion-r1 { animation-delay: 0.45s; }
    .panel-discussion-r2 { animation-delay: 0.90s; }
    .panel-discussion-r3 { animation-delay: 1.35s; }
    .panel-discussion-r4 { animation-delay: 1.80s; }
    .panel-discussion-row { animation: panel-discussion-reveal 7.3s ease-in-out infinite; }
    @keyframes panel-discussion-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="panel-discussion-bg" width="980" height="390"/>
  <text class="panel-discussion-h1"  x="30" y="40">A panel of experts</text>
  <text class="panel-discussion-sub" x="30" y="64">Everyone hears everyone, at once.</text>
  <rect class="panel-discussion-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="panel-discussion-name" x="46" y="122">A briefing chain</text>
  <text class="panel-discussion-desc" x="46" y="142">Passed along, in order.</text>
  <text class="panel-discussion-desc panel-discussion-row panel-discussion-r0" x="46" y="182">Each person told by the previous one</text>
  <text class="panel-discussion-desc panel-discussion-row panel-discussion-r1" x="46" y="216">Detail lost at every handover</text>
  <text class="panel-discussion-desc panel-discussion-row panel-discussion-r2" x="46" y="250">The last person hears a summary of a summary</text>
  <text class="panel-discussion-desc panel-discussion-row panel-discussion-r3" x="46" y="284">Nobody can be briefed until the one before</text>
  <text class="panel-discussion-desc panel-discussion-row panel-discussion-r4" x="46" y="318">This is recurrence</text>
  <rect class="panel-discussion-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="panel-discussion-name" x="526" y="122">A panel</text>
  <text class="panel-discussion-desc" x="526" y="142">All present, simultaneously.</text>
  <text class="panel-discussion-desc panel-discussion-row panel-discussion-r0" x="526" y="182">Everyone hears every contribution</text>
  <text class="panel-discussion-desc panel-discussion-row panel-discussion-r1" x="526" y="216">Each weighs what is relevant to them</text>
  <text class="panel-discussion-desc panel-discussion-row panel-discussion-r2" x="526" y="250">No degradation with distance</text>
  <text class="panel-discussion-desc panel-discussion-row panel-discussion-r3" x="526" y="284">All contributions considered at once</text>
  <text class="panel-discussion-desc panel-discussion-row panel-discussion-r4" x="526" y="318">This is self-attention</text>
  <text class="panel-discussion-sub" x="30" y="372">The absence of degradation with distance is the property that matters most: in the panel, the first speaker's point is as available to the last as to the second.</text>
</svg>
