<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Small steps, felt.">
  <title>Descending in fog</title>
  <style>
    .descent-fog-bg   { fill: #f8fafc; }
    .descent-fog-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .descent-fog-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .descent-fog-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .descent-fog-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .descent-fog-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .descent-fog-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .descent-fog-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .descent-fog-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .descent-fog-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .descent-fog-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .descent-fog-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .descent-fog-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .descent-fog-row { opacity: 1; }
    .descent-fog-r0 { animation-delay: 0.00s; }
    .descent-fog-r1 { animation-delay: 0.45s; }
    .descent-fog-r2 { animation-delay: 0.90s; }
    .descent-fog-r3 { animation-delay: 1.35s; }
    .descent-fog-r4 { animation-delay: 1.80s; }
    .descent-fog-row { animation: descent-fog-reveal 7.3s ease-in-out infinite; }
    @keyframes descent-fog-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="descent-fog-bg" width="980" height="390"/>
  <text class="descent-fog-h1"  x="30" y="40">Descending in fog</text>
  <text class="descent-fog-sub" x="30" y="64">Small steps, felt.</text>
  <rect class="descent-fog-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="descent-fog-name" x="46" y="122">Small steps</text>
  <text class="descent-fog-desc" x="46" y="142">Slow, safe.</text>
  <text class="descent-fog-desc descent-fog-row descent-fog-r0" x="46" y="182">Feel the slope, step a little</text>
  <text class="descent-fog-desc descent-fog-row descent-fog-r1" x="46" y="216">Re-check after every step</text>
  <text class="descent-fog-desc descent-fog-row descent-fog-r2" x="46" y="250">You stay on the descending path</text>
  <text class="descent-fog-desc descent-fog-row descent-fog-r3" x="46" y="284">Reaching the bottom takes a while</text>
  <text class="descent-fog-desc descent-fog-row descent-fog-r4" x="46" y="318">This is a small learning rate</text>
  <rect class="descent-fog-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="descent-fog-name" x="526" y="122">Large strides</text>
  <text class="descent-fog-desc" x="526" y="142">Fast, risky.</text>
  <text class="descent-fog-desc descent-fog-row descent-fog-r0" x="526" y="182">Step far in the felt direction</text>
  <text class="descent-fog-desc descent-fog-row descent-fog-r1" x="526" y="216">The slope may have changed</text>
  <text class="descent-fog-desc descent-fog-row descent-fog-r2" x="526" y="250">You cross the valley and climb</text>
  <text class="descent-fog-desc descent-fog-row descent-fog-r3" x="526" y="284">You may never settle</text>
  <text class="descent-fog-desc descent-fog-row descent-fog-r4" x="526" y="318">This is too large a learning rate</text>
  <text class="descent-fog-sub" x="30" y="372">Crossing the valley and climbing the other side is exactly what an oscillating loss curve shows, and it is diagnosable from the curve alone.</text>
</svg>
