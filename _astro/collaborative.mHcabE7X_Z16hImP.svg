<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Collaborative filtering</title>
  <style>
    .collaborative-bg   { fill: #f8fafc; }
    .collaborative-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collaborative-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collaborative-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collaborative-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collaborative-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collaborative-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .collaborative-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .collaborative-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .collaborative-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .collaborative-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .collaborative-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .collaborative-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .collaborative-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .collaborative-stage { opacity: 1; }

    .collaborative-s0 { animation-delay: 0.00s; }
    .collaborative-e0 { animation-delay: 0.00s; }
    .collaborative-s1 { animation-delay: 1.28s; }
    .collaborative-e1 { animation-delay: 1.28s; }
    .collaborative-s2 { animation-delay: 2.56s; }
    .collaborative-e2 { animation-delay: 2.56s; }
    .collaborative-s3 { animation-delay: 3.84s; }
    .collaborative-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .collaborative-conn  { animation: collaborative-trace 6.4s ease-in-out infinite; }
      .collaborative-stage { animation: collaborative-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes collaborative-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes collaborative-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .collaborative-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .collaborative-stage { animation: collaborative-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes collaborative-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="collaborative-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="collaborative-bg" width="980" height="322"/>
  <text class="collaborative-h1"  x="30" y="40">Collaborative filtering</text>
  <text class="collaborative-sub" x="30" y="64">Four steps.</text>
  <g class="collaborative-stage collaborative-s0">
    <rect class="collaborative-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="collaborative-step" x="44" y="142">01</text>
    <text class="collaborative-name" x="70" y="142">Find users who behaved like this one</text>
    <text class="collaborative-desc" x="44" y="166">Or items behaving like this</text>
    <text class="collaborative-desc" x="44" y="182">item.</text>
  </g>
  <line class="collaborative-line collaborative-conn collaborative-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#collaborative-tip)"/>
  <g class="collaborative-stage collaborative-s1">
    <rect class="collaborative-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="collaborative-step" x="280" y="142">02</text>
    <text class="collaborative-name" x="306" y="142">Measure similarity on the interaction vectors</text>
    <text class="collaborative-desc" x="280" y="166">Usually by angle, ignoring</text>
    <text class="collaborative-desc" x="280" y="182">magnitude.</text>
  </g>
  <line class="collaborative-line collaborative-conn collaborative-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#collaborative-tip)"/>
  <g class="collaborative-stage collaborative-s2">
    <rect class="collaborative-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="collaborative-step" x="516" y="142">03</text>
    <text class="collaborative-name" x="542" y="142">Recommend what those neighbours chose</text>
    <text class="collaborative-desc" x="516" y="166">Weighted by how similar they</text>
    <text class="collaborative-desc" x="516" y="182">are.</text>
  </g>
  <line class="collaborative-line collaborative-conn collaborative-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#collaborative-tip)"/>
  <g class="collaborative-stage collaborative-s3">
    <rect class="collaborative-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="collaborative-step" x="752" y="142">04</text>
    <text class="collaborative-name" x="778" y="142">But a new user or item has no interactions</text>
    <text class="collaborative-desc" x="752" y="166">Which is the cold start problem.</text>
  </g>
  <text class="collaborative-sub" x="30" y="304">The cold start is the structural limitation of every purely collaborative method, and it is why production systems always blend in content-based signals.</text>
</svg>
