<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Six phases that matter most.">
  <title>The tabular playbook</title>
  <style>
    .tabular-lifecycle-bg   { fill: #f8fafc; }
    .tabular-lifecycle-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-lifecycle-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-lifecycle-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-lifecycle-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-lifecycle-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-lifecycle-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tabular-lifecycle-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tabular-lifecycle-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tabular-lifecycle-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tabular-lifecycle-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tabular-lifecycle-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tabular-lifecycle-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tabular-lifecycle-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tabular-lifecycle-stage { opacity: 1; }

    .tabular-lifecycle-s0 { animation-delay: 0.00s; }
    .tabular-lifecycle-e0 { animation-delay: 0.00s; }
    .tabular-lifecycle-s1 { animation-delay: 1.37s; }
    .tabular-lifecycle-e1 { animation-delay: 1.37s; }
    .tabular-lifecycle-s2 { animation-delay: 2.74s; }
    .tabular-lifecycle-e2 { animation-delay: 2.74s; }
    .tabular-lifecycle-s3 { animation-delay: 4.11s; }
    .tabular-lifecycle-e3 { animation-delay: 4.11s; }
    .tabular-lifecycle-s4 { animation-delay: 5.49s; }
    .tabular-lifecycle-e4 { animation-delay: 5.49s; }
    .tabular-lifecycle-s5 { animation-delay: 6.86s; }
    .tabular-lifecycle-e5 { animation-delay: 6.86s; }
    @media (prefers-reduced-motion: no-preference) {
      .tabular-lifecycle-conn  { animation: tabular-lifecycle-trace 9.600000000000001s ease-in-out infinite; }
      .tabular-lifecycle-stage { animation: tabular-lifecycle-arrive 9.600000000000001s ease-in-out infinite; }
    }
    @keyframes tabular-lifecycle-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tabular-lifecycle-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tabular-lifecycle-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tabular-lifecycle-stage { animation: tabular-lifecycle-settle 9.600000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tabular-lifecycle-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tabular-lifecycle-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tabular-lifecycle-bg" width="980" height="322"/>
  <text class="tabular-lifecycle-h1"  x="30" y="40">The tabular playbook</text>
  <text class="tabular-lifecycle-sub" x="30" y="64">Six phases that matter most.</text>
  <g class="tabular-lifecycle-stage tabular-lifecycle-s0">
    <rect class="tabular-lifecycle-box" x="30" y="118" width="131" height="104" rx="10"/>
    <text class="tabular-lifecycle-step" x="44" y="142">01</text>
    <text class="tabular-lifecycle-name" x="70" y="142">Understand the data and how it was generated</text>
    <text class="tabular-lifecycle-desc" x="44" y="166">Which decides the</text>
    <text class="tabular-lifecycle-desc" x="44" y="182">validation strategy.</text>
  </g>
  <line class="tabular-lifecycle-line tabular-lifecycle-conn tabular-lifecycle-e0" x1="163" y1="170" x2="185" y2="170" marker-end="url(#tabular-lifecycle-tip)"/>
  <g class="tabular-lifecycle-stage tabular-lifecycle-s1">
    <rect class="tabular-lifecycle-warn" x="187" y="118" width="131" height="104" rx="10"/>
    <text class="tabular-lifecycle-step" x="201" y="142">02</text>
    <text class="tabular-lifecycle-name" x="227" y="142">Build the validation scheme first</text>
    <text class="tabular-lifecycle-desc" x="201" y="166">Before any</text>
    <text class="tabular-lifecycle-desc" x="201" y="182">modelling. It is the</text>
    <text class="tabular-lifecycle-desc" x="201" y="198">foundation.</text>
  </g>
  <line class="tabular-lifecycle-line tabular-lifecycle-conn tabular-lifecycle-e1" x1="320" y1="170" x2="342" y2="170" marker-end="url(#tabular-lifecycle-tip)"/>
  <g class="tabular-lifecycle-stage tabular-lifecycle-s2">
    <rect class="tabular-lifecycle-box" x="344" y="118" width="131" height="104" rx="10"/>
    <text class="tabular-lifecycle-step" x="358" y="142">03</text>
    <text class="tabular-lifecycle-name" x="384" y="142">Establish trivial and simple baselines</text>
    <text class="tabular-lifecycle-desc" x="358" y="166">So improvement is</text>
    <text class="tabular-lifecycle-desc" x="358" y="182">measurable.</text>
  </g>
  <line class="tabular-lifecycle-line tabular-lifecycle-conn tabular-lifecycle-e2" x1="477" y1="170" x2="499" y2="170" marker-end="url(#tabular-lifecycle-tip)"/>
  <g class="tabular-lifecycle-stage tabular-lifecycle-s3">
    <rect class="tabular-lifecycle-good" x="501" y="118" width="131" height="104" rx="10"/>
    <text class="tabular-lifecycle-step" x="515" y="142">04</text>
    <text class="tabular-lifecycle-name" x="541" y="142">Engineer features</text>
    <text class="tabular-lifecycle-desc" x="515" y="166">Where most of the</text>
    <text class="tabular-lifecycle-desc" x="515" y="182">real gain lives.</text>
  </g>
  <line class="tabular-lifecycle-line tabular-lifecycle-conn tabular-lifecycle-e3" x1="634" y1="170" x2="656" y2="170" marker-end="url(#tabular-lifecycle-tip)"/>
  <g class="tabular-lifecycle-stage tabular-lifecycle-s4">
    <rect class="tabular-lifecycle-box" x="658" y="118" width="131" height="104" rx="10"/>
    <text class="tabular-lifecycle-step" x="672" y="142">05</text>
    <text class="tabular-lifecycle-name" x="698" y="142">Then boosted trees, tuned modestly</text>
    <text class="tabular-lifecycle-desc" x="672" y="166">Which is the strong</text>
    <text class="tabular-lifecycle-desc" x="672" y="182">default.</text>
  </g>
  <line class="tabular-lifecycle-line tabular-lifecycle-conn tabular-lifecycle-e4" x1="791" y1="170" x2="813" y2="170" marker-end="url(#tabular-lifecycle-tip)"/>
  <g class="tabular-lifecycle-stage tabular-lifecycle-s5">
    <rect class="tabular-lifecycle-box" x="815" y="118" width="131" height="104" rx="10"/>
    <text class="tabular-lifecycle-step" x="829" y="142">06</text>
    <text class="tabular-lifecycle-name" x="855" y="142">And ensemble if the last point matters</text>
    <text class="tabular-lifecycle-desc" x="829" y="166">Stacking diverse</text>
    <text class="tabular-lifecycle-desc" x="829" y="182">models.</text>
    <text class="tabular-lifecycle-edge" x="829" y="242">diminishing</text>
  </g>
  <text class="tabular-lifecycle-sub" x="30" y="304">Feature engineering sitting above model selection in this ordering is the empirical finding, not a preference: it produces more gain per hour on tabular data than any model change.</text>
</svg>
