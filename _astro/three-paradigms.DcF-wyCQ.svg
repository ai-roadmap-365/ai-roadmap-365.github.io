<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="By what feedback exists.">
  <title>Three learning paradigms</title>
  <style>
    .three-paradigms-bg   { fill: #f8fafc; }
    .three-paradigms-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-paradigms-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-paradigms-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-paradigms-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-paradigms-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-paradigms-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-paradigms-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-paradigms-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-paradigms-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-paradigms-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-paradigms-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-paradigms-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .three-paradigms-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .three-paradigms-stage { opacity: 1; }

    .three-paradigms-s0 { animation-delay: 0.00s; }
    .three-paradigms-e0 { animation-delay: 0.00s; }
    .three-paradigms-s1 { animation-delay: 1.50s; }
    .three-paradigms-e1 { animation-delay: 1.50s; }
    .three-paradigms-s2 { animation-delay: 3.00s; }
    .three-paradigms-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .three-paradigms-conn  { animation: three-paradigms-trace 6s ease-in-out infinite; }
      .three-paradigms-stage { animation: three-paradigms-arrive 6s ease-in-out infinite; }
    }
    @keyframes three-paradigms-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes three-paradigms-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .three-paradigms-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .three-paradigms-stage { animation: three-paradigms-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes three-paradigms-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="three-paradigms-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="three-paradigms-bg" width="980" height="322"/>
  <text class="three-paradigms-h1"  x="30" y="40">Three learning paradigms</text>
  <text class="three-paradigms-sub" x="30" y="64">By what feedback exists.</text>
  <g class="three-paradigms-stage three-paradigms-s0">
    <rect class="three-paradigms-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="three-paradigms-step" x="44" y="142">01</text>
    <text class="three-paradigms-name" x="70" y="142">Supervised: the correct answer is given</text>
    <text class="three-paradigms-desc" x="44" y="166">For every training example. Learn to</text>
    <text class="three-paradigms-desc" x="44" y="182">reproduce it.</text>
  </g>
  <line class="three-paradigms-line three-paradigms-conn three-paradigms-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#three-paradigms-tip)"/>
  <g class="three-paradigms-stage three-paradigms-s1">
    <rect class="three-paradigms-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="three-paradigms-step" x="359" y="142">02</text>
    <text class="three-paradigms-name" x="385" y="142">Unsupervised: no answers at all</text>
    <text class="three-paradigms-desc" x="359" y="166">Find structure, and hope it is the structure</text>
    <text class="three-paradigms-desc" x="359" y="182">you wanted.</text>
  </g>
  <line class="three-paradigms-line three-paradigms-conn three-paradigms-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#three-paradigms-tip)"/>
  <g class="three-paradigms-stage three-paradigms-s2">
    <rect class="three-paradigms-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="three-paradigms-step" x="674" y="142">03</text>
    <text class="three-paradigms-name" x="700" y="142">Reinforcement: a reward, after the fact</text>
    <text class="three-paradigms-desc" x="674" y="166">Not the right answer, only how good the</text>
    <text class="three-paradigms-desc" x="674" y="182">outcome was.</text>
  </g>
  <text class="three-paradigms-sub" x="30" y="304">Classifying by feedback rather than by algorithm is what makes the taxonomy useful: it tells you which methods are even applicable before you choose one.</text>
</svg>
