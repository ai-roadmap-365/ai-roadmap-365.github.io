<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" role="img" aria-labelledby="d132a-title d132a-desc" width="1180" height="900">
  <title id="d132a-title">One dataset drawn honestly, surrounded by five distortions, each labelled with its measured lie factor</title>
  <desc id="d132a-desc">A reference map of the day: an honest two-bar chart at the centre with a lie factor of 1.00, and five distorted renderings of the same data arranged around it, each carrying the number it was measured at.</desc>

  <style>
    .d132a-bg     { fill: #f8fafc; }
    .d132a-title  { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 27px; font-weight: 700; }
    .d132a-sub    { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; }
    .d132a-panel  { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
    .d132a-core   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 3; rx: 12; }
    .d132a-head   { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 700; }
    .d132a-headok { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 19px; font-weight: 700; }
    .d132a-body   { fill: #334155; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d132a-lf     { fill: #b91c1c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; }
    .d132a-lfok   { fill: #15803d; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; }
    .d132a-bar    { fill: #1d4ed8; }
    .d132a-bar2   { fill: #60a5fa; }
    .d132a-axis   { stroke: #1a202c; stroke-width: 2; fill: none; }
    .d132a-cut    { stroke: #b91c1c; stroke-width: 2.5; stroke-dasharray: 7 5; fill: none; }
    .d132a-tick   { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d132a-arrow  { stroke: #94a3b8; stroke-width: 2; fill: none; }
    .d132a-line   { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .d132a-line2  { stroke: #b91c1c; stroke-width: 2.5; fill: none; }
    .d132a-note   { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-style: italic; }
  </style>

  <rect class="d132a-bg" x="0" y="0" width="1180" height="900" />

  <text class="d132a-title" x="590" y="42" text-anchor="middle">The same two numbers, drawn six ways</text>
  <text class="d132a-sub" x="590" y="70" text-anchor="middle">Values 100 and 102. Lie factor = effect shown in the graphic / effect in the data. Every number below was measured off the rendered chart.</text>

  <!-- connectors from the centre outward -->
  <path class="d132a-arrow" d="M 470 400 L 350 300" />
  <path class="d132a-arrow" d="M 710 400 L 830 300" />
  <path class="d132a-arrow" d="M 470 470 L 350 520" />
  <path class="d132a-arrow" d="M 710 470 L 830 520" />
  <path class="d132a-arrow" d="M 590 545 L 590 640" />

  <!-- ============ CENTRE: the truth ============ -->
  <rect class="d132a-core" x="450" y="330" width="280" height="215" />
  <text class="d132a-headok" x="590" y="360" text-anchor="middle">THE TRUTH</text>
  <text class="d132a-body" x="590" y="382" text-anchor="middle">zero baseline, bars, labelled axis</text>
  <path class="d132a-axis" d="M 520 505 L 520 400 M 520 505 L 665 505" />
  <rect class="d132a-bar"  x="545" y="410" width="38" height="95" />
  <rect class="d132a-bar2" x="608" y="408" width="38" height="97" />
  <text class="d132a-tick" x="512" y="509" text-anchor="end">0</text>
  <text class="d132a-tick" x="564" y="524" text-anchor="middle">100</text>
  <text class="d132a-tick" x="627" y="524" text-anchor="middle">102</text>
  <text class="d132a-lfok" x="590" y="540" text-anchor="middle">lie factor 1.00</text>

  <!-- ============ TOP LEFT: truncated baseline ============ -->
  <rect class="d132a-panel" x="45" y="105" width="310" height="205" />
  <text class="d132a-head" x="65" y="132">1. Truncated baseline</text>
  <text class="d132a-body" x="65" y="153">y axis set to 99 instead of 0</text>
  <path class="d132a-axis" d="M 105 280 L 105 175 M 105 280 L 250 280" />
  <rect class="d132a-bar"  x="130" y="245" width="38" height="35" />
  <rect class="d132a-bar2" x="193" y="175" width="38" height="105" />
  <path class="d132a-cut" d="M 95 280 L 260 280" />
  <text class="d132a-tick" x="88" y="284" text-anchor="end">99</text>
  <text class="d132a-body" x="278" y="230">3x the</text>
  <text class="d132a-body" x="278" y="248">height,</text>
  <text class="d132a-body" x="278" y="266">2% the</text>
  <text class="d132a-body" x="278" y="284">difference</text>
  <text class="d132a-lf" x="65" y="303">lie factor 2.94</text>

  <!-- ============ TOP RIGHT: dual axis ============ -->
  <rect class="d132a-panel" x="825" y="105" width="310" height="205" />
  <text class="d132a-head" x="845" y="132">2. Dual y-axis</text>
  <text class="d132a-body" x="845" y="153">two independent scales, one plot</text>
  <path class="d132a-axis" d="M 880 275 L 880 172 M 880 275 L 1090 275 M 1090 275 L 1090 172" />
  <path class="d132a-line"  d="M 885 245 L 925 205 L 965 255 L 1005 195 L 1045 235 L 1085 200" />
  <path class="d132a-line2" d="M 885 250 L 925 212 L 965 248 L 1005 202 L 1045 240 L 1085 208" />
  <text class="d132a-body" x="845" y="296">drawn gap 0.49 or 0.01, the author's choice</text>
  <text class="d132a-lf" x="1115" y="132" text-anchor="end">sign is a free parameter</text>

  <!-- ============ MIDDLE LEFT: radius encoding ============ -->
  <rect class="d132a-panel" x="45" y="405" width="310" height="205" />
  <text class="d132a-head" x="65" y="432">3. Encoded by radius</text>
  <text class="d132a-body" x="65" y="453">circle radius set from the value</text>
  <circle class="d132a-bar" cx="130" cy="530" r="18" />
  <circle class="d132a-bar2" cx="240" cy="530" r="72" />
  <text class="d132a-tick" x="130" y="574" text-anchor="middle">25</text>
  <text class="d132a-body" x="65" y="596">shown area ratio 16, data ratio 4</text>
  <text class="d132a-lf" x="330" y="432" text-anchor="end">lie factor 4.00</text>

  <!-- ============ MIDDLE RIGHT: 3D perspective ============ -->
  <rect class="d132a-panel" x="825" y="405" width="310" height="205" />
  <text class="d132a-head" x="845" y="432">4. 3D perspective</text>
  <text class="d132a-body" x="845" y="453">depth decides how big a bar looks</text>
  <path class="d132a-axis" d="M 875 570 L 1105 570" />
  <path class="d132a-bar" d="M 895 570 L 895 520 L 928 505 L 928 555 Z" />
  <path class="d132a-bar2" d="M 985 570 L 985 465 L 1048 440 L 1048 545 Z" />
  <path d="M 895 520 L 928 505 L 941 512 L 908 527 Z" fill="#93c5fd" />
  <path d="M 985 465 L 1048 440 L 1066 451 L 1003 476 Z" fill="#93c5fd" />
  <text class="d132a-body" x="845" y="596">data ratio 2, drawn 2.34 far / 4.20 near</text>
  <text class="d132a-lf" x="1115" y="432" text-anchor="end">up to 110% off</text>

  <!-- ============ BOTTOM: cherry-picked window ============ -->
  <rect class="d132a-panel" x="335" y="650" width="510" height="195" />
  <text class="d132a-head" x="358" y="678">5. Cherry-picked window</text>
  <text class="d132a-body" x="358" y="699">one series, two windows, opposite trends</text>
  <path class="d132a-axis" d="M 380 810 L 380 715 M 380 810 L 810 810" />
  <path class="d132a-line" d="M 390 725 L 440 752 L 490 775 L 540 790 L 590 793 L 640 780 L 690 757 L 740 733 L 790 722" />
  <path class="d132a-line2" d="M 390 738 L 585 795" />
  <path class="d132a-line2" d="M 595 795 L 790 735" />
  <text class="d132a-lf" x="470" y="757">-0.73 / week</text>
  <text class="d132a-lf" x="655" y="757">+0.70 / week</text>
  <text class="d132a-body" x="358" y="836">full series: -0.01 per week, flat</text>

  <text class="d132a-note" x="590" y="878" text-anchor="middle">Not one of these five changed a single number. Each is a formatting choice an honest person makes without noticing.</text>
</svg>
