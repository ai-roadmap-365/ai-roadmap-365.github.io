<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One of them certifies nothing.">
  <title>A road test, or a straight road</title>
  <style>
    .road-test-bg   { fill: #f8fafc; }
    .road-test-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .road-test-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .road-test-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .road-test-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .road-test-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .road-test-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .road-test-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .road-test-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .road-test-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .road-test-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .road-test-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .road-test-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .road-test-row { opacity: 1; }
    .road-test-r0 { animation-delay: 0.00s; }
    .road-test-r1 { animation-delay: 0.45s; }
    .road-test-r2 { animation-delay: 0.90s; }
    .road-test-r3 { animation-delay: 1.35s; }
    .road-test-r4 { animation-delay: 1.80s; }
    .road-test-row { animation: road-test-reveal 7.3s ease-in-out infinite; }
    @keyframes road-test-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="road-test-bg" width="980" height="390"/>
  <text class="road-test-h1"  x="30" y="40">A road test, or a straight road</text>
  <text class="road-test-sub" x="30" y="64">One of them certifies nothing.</text>
  <rect class="road-test-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="road-test-name" x="46" y="122">200 metres of empty highway</text>
  <text class="road-test-desc" x="46" y="142">100%, and meaningless.</text>
  <text class="road-test-desc road-test-row road-test-r0" x="46" y="182">Sunny, straight, no traffic</text>
  <text class="road-test-desc road-test-row road-test-r1" x="46" y="216">The student passes perfectly</text>
  <text class="road-test-desc road-test-row road-test-r2" x="46" y="250">Says nothing about rain</text>
  <text class="road-test-desc road-test-row road-test-r3" x="46" y="284">Says nothing about an emergency stop</text>
  <text class="road-test-desc road-test-row road-test-r4" x="46" y="318">Says nothing about a jaywalking pedestrian</text>
  <rect class="road-test-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="road-test-name" x="526" y="122">A stratified test</text>
  <text class="road-test-desc" x="526" y="142">Certifies something.</text>
  <text class="road-test-desc road-test-row road-test-r0" x="526" y="182">Merging, lane keeping, speed compliance</text>
  <text class="road-test-desc road-test-row road-test-r1" x="526" y="216">Downpours, ice, detours</text>
  <text class="road-test-desc road-test-row road-test-r2" x="526" y="250">Emergency stops, uphill parking</text>
  <text class="road-test-desc road-test-row road-test-r3" x="526" y="284">Sudden brake lights, right of way</text>
  <text class="road-test-desc road-test-row road-test-r4" x="526" y="318">A pass now means something</text>
  <text class="road-test-sub" x="30" y="372">The deceptive 100% is the specific danger: an unstratified suite does not merely fail to find problems, it actively reports that there are none.</text>
</svg>
