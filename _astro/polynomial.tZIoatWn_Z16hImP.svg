<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Bending a linear boundary</title>
  <style>
    .polynomial-bg   { fill: #f8fafc; }
    .polynomial-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .polynomial-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .polynomial-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .polynomial-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .polynomial-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .polynomial-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .polynomial-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .polynomial-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .polynomial-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .polynomial-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .polynomial-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .polynomial-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .polynomial-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .polynomial-stage { opacity: 1; }

    .polynomial-s0 { animation-delay: 0.00s; }
    .polynomial-e0 { animation-delay: 0.00s; }
    .polynomial-s1 { animation-delay: 1.28s; }
    .polynomial-e1 { animation-delay: 1.28s; }
    .polynomial-s2 { animation-delay: 2.56s; }
    .polynomial-e2 { animation-delay: 2.56s; }
    .polynomial-s3 { animation-delay: 3.84s; }
    .polynomial-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .polynomial-conn  { animation: polynomial-trace 6.4s ease-in-out infinite; }
      .polynomial-stage { animation: polynomial-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes polynomial-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes polynomial-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .polynomial-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .polynomial-stage { animation: polynomial-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes polynomial-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="polynomial-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="polynomial-bg" width="980" height="322"/>
  <text class="polynomial-h1"  x="30" y="40">Bending a linear boundary</text>
  <text class="polynomial-sub" x="30" y="64">Four steps.</text>
  <g class="polynomial-stage polynomial-s0">
    <rect class="polynomial-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="polynomial-step" x="44" y="142">01</text>
    <text class="polynomial-name" x="70" y="142">A linear model cannot separate a circle from its surroundings</text>
    <text class="polynomial-desc" x="44" y="166">No straight line will do it.</text>
  </g>
  <line class="polynomial-line polynomial-conn polynomial-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#polynomial-tip)"/>
  <g class="polynomial-stage polynomial-s1">
    <rect class="polynomial-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="polynomial-step" x="280" y="142">02</text>
    <text class="polynomial-name" x="306" y="142">Add squared and product terms as new features</text>
    <text class="polynomial-desc" x="280" y="166">The data now lives in a</text>
    <text class="polynomial-desc" x="280" y="182">higher-dimensional space.</text>
  </g>
  <line class="polynomial-line polynomial-conn polynomial-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#polynomial-tip)"/>
  <g class="polynomial-stage polynomial-s2">
    <rect class="polynomial-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="polynomial-step" x="516" y="142">03</text>
    <text class="polynomial-name" x="542" y="142">Where a flat boundary does separate them</text>
    <text class="polynomial-desc" x="516" y="166">The model is still entirely</text>
    <text class="polynomial-desc" x="516" y="182">linear.</text>
  </g>
  <line class="polynomial-line polynomial-conn polynomial-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#polynomial-tip)"/>
  <g class="polynomial-stage polynomial-s3">
    <rect class="polynomial-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="polynomial-step" x="752" y="142">04</text>
    <text class="polynomial-name" x="778" y="142">Projected back, that boundary is a curve</text>
    <text class="polynomial-desc" x="752" y="166">The curvature came from the</text>
    <text class="polynomial-desc" x="752" y="182">features, not the model.</text>
    <text class="polynomial-edge" x="752" y="242">engineering</text>
  </g>
  <text class="polynomial-sub" x="30" y="304">This is the same idea as the kernel trick and as a neural network's hidden layers: the model stays linear and the representation does the work.</text>
</svg>
