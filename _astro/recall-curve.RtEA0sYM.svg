<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four points, and a knee.">
  <title>The measured recall curve</title>
  <style>
    .recall-curve-bg   { fill: #f8fafc; }
    .recall-curve-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recall-curve-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recall-curve-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recall-curve-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recall-curve-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recall-curve-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .recall-curve-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .recall-curve-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .recall-curve-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .recall-curve-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .recall-curve-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .recall-curve-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .recall-curve-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .recall-curve-stage { opacity: 1; }

    .recall-curve-s0 { animation-delay: 0.00s; }
    .recall-curve-e0 { animation-delay: 0.00s; }
    .recall-curve-s1 { animation-delay: 1.28s; }
    .recall-curve-e1 { animation-delay: 1.28s; }
    .recall-curve-s2 { animation-delay: 2.56s; }
    .recall-curve-e2 { animation-delay: 2.56s; }
    .recall-curve-s3 { animation-delay: 3.84s; }
    .recall-curve-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .recall-curve-conn  { animation: recall-curve-trace 6.4s ease-in-out infinite; }
      .recall-curve-stage { animation: recall-curve-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes recall-curve-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes recall-curve-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .recall-curve-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .recall-curve-stage { animation: recall-curve-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes recall-curve-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="recall-curve-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="recall-curve-bg" width="980" height="322"/>
  <text class="recall-curve-h1"  x="30" y="40">The measured recall curve</text>
  <text class="recall-curve-sub" x="30" y="64">Four points, and a knee.</text>
  <g class="recall-curve-stage recall-curve-s0">
    <rect class="recall-curve-good" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="recall-curve-step" x="44" y="142">01</text>
    <text class="recall-curve-name" x="70" y="142">One probe: 81% recall, 15% of the work</text>
    <text class="recall-curve-desc" x="44" y="166">Often perfectly adequate ahead</text>
    <text class="recall-curve-desc" x="44" y="182">of a reranker.</text>
  </g>
  <line class="recall-curve-line recall-curve-conn recall-curve-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#recall-curve-tip)"/>
  <g class="recall-curve-stage recall-curve-s1">
    <rect class="recall-curve-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="recall-curve-step" x="280" y="142">02</text>
    <text class="recall-curve-name" x="306" y="142">Four probes: 16 points more, 3x the work</text>
    <text class="recall-curve-desc" x="280" y="166">The curve is not linear.</text>
  </g>
  <line class="recall-curve-line recall-curve-conn recall-curve-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#recall-curve-tip)"/>
  <g class="recall-curve-stage recall-curve-s2">
    <rect class="recall-curve-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="recall-curve-step" x="516" y="142">03</text>
    <text class="recall-curve-name" x="542" y="142">Eight probes: 3 more points, double again</text>
    <text class="recall-curve-desc" x="516" y="166">The knee sits around three or</text>
    <text class="recall-curve-desc" x="516" y="182">four.</text>
    <text class="recall-curve-edge" x="516" y="242">diminishing</text>
  </g>
  <line class="recall-curve-line recall-curve-conn recall-curve-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#recall-curve-tip)"/>
  <g class="recall-curve-stage recall-curve-s3">
    <rect class="recall-curve-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="recall-curve-step" x="752" y="142">04</text>
    <text class="recall-curve-name" x="778" y="142">Full probe costs more than exact</text>
    <text class="recall-curve-desc" x="752" y="166">40,160 comparisons against</text>
    <text class="recall-curve-desc" x="752" y="182">40,000. The extra are the</text>
    <text class="recall-curve-desc" x="752" y="198">centroids.</text>
  </g>
  <text class="recall-curve-sub" x="30" y="304">An ANN index configured for perfect recall is a slower exact search, which is worth knowing before somebody tunes a production index toward safety and makes it worse on both axes.</text>
</svg>
