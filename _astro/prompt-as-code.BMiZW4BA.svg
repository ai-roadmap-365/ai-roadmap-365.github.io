<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Treat it accordingly.">
  <title>A prompt is code</title>
  <style>
    .prompt-as-code-bg   { fill: #f8fafc; }
    .prompt-as-code-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-as-code-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-as-code-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-as-code-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-as-code-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-as-code-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prompt-as-code-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .prompt-as-code-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .prompt-as-code-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .prompt-as-code-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .prompt-as-code-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .prompt-as-code-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prompt-as-code-row { opacity: 1; }
    .prompt-as-code-r0 { animation-delay: 0.00s; }
    .prompt-as-code-r1 { animation-delay: 0.45s; }
    .prompt-as-code-r2 { animation-delay: 0.90s; }
    .prompt-as-code-r3 { animation-delay: 1.35s; }
    .prompt-as-code-r4 { animation-delay: 1.80s; }
    .prompt-as-code-row { animation: prompt-as-code-reveal 7.3s ease-in-out infinite; }
    @keyframes prompt-as-code-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="prompt-as-code-bg" width="980" height="390"/>
  <text class="prompt-as-code-h1"  x="30" y="40">A prompt is code</text>
  <text class="prompt-as-code-sub" x="30" y="64">Treat it accordingly.</text>
  <rect class="prompt-as-code-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="prompt-as-code-name" x="46" y="122">Prompts in the source</text>
  <text class="prompt-as-code-desc" x="46" y="142">Unversioned strings.</text>
  <text class="prompt-as-code-desc prompt-as-code-row prompt-as-code-r0" x="46" y="182">Edited inline, in several places</text>
  <text class="prompt-as-code-desc prompt-as-code-row prompt-as-code-r1" x="46" y="216">No record of what changed</text>
  <text class="prompt-as-code-desc prompt-as-code-row prompt-as-code-r2" x="46" y="250">No test when it changes</text>
  <text class="prompt-as-code-desc prompt-as-code-row prompt-as-code-r3" x="46" y="284">Rollback means remembering</text>
  <text class="prompt-as-code-desc prompt-as-code-row prompt-as-code-r4" x="46" y="318">Which fails within a month</text>
  <rect class="prompt-as-code-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="prompt-as-code-name" x="526" y="122">Prompts as artefacts</text>
  <text class="prompt-as-code-desc" x="526" y="142">Versioned and tested.</text>
  <text class="prompt-as-code-desc prompt-as-code-row prompt-as-code-r0" x="526" y="182">Stored separately, versioned</text>
  <text class="prompt-as-code-desc prompt-as-code-row prompt-as-code-r1" x="526" y="216">Every change reviewed</text>
  <text class="prompt-as-code-desc prompt-as-code-row prompt-as-code-r2" x="526" y="250">Evaluated before merging</text>
  <text class="prompt-as-code-desc prompt-as-code-row prompt-as-code-r3" x="526" y="284">Rollback by version</text>
  <text class="prompt-as-code-desc prompt-as-code-row prompt-as-code-r4" x="526" y="318">Which is ordinary engineering</text>
  <text class="prompt-as-code-sub" x="30" y="372">Nothing here is specific to language models: the discipline is the same as for any configuration that changes behaviour, and it is skipped because a prompt looks like prose.</text>
</svg>
