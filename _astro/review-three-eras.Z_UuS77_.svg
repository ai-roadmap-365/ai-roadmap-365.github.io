<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each adapted to a faster delivery cadence.">
  <title>Three traditions of the design review</title>
  <style>
    .review-three-eras-bg   { fill: #f8fafc; }
    .review-three-eras-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-three-eras-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-three-eras-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-three-eras-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-three-eras-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-three-eras-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .review-three-eras-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .review-three-eras-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .review-three-eras-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .review-three-eras-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .review-three-eras-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .review-three-eras-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .review-three-eras-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .review-three-eras-stage { opacity: 1; }

    .review-three-eras-s0 { animation-delay: 0.00s; }
    .review-three-eras-e0 { animation-delay: 0.00s; }
    .review-three-eras-s1 { animation-delay: 1.50s; }
    .review-three-eras-e1 { animation-delay: 1.50s; }
    .review-three-eras-s2 { animation-delay: 3.00s; }
    .review-three-eras-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .review-three-eras-conn  { animation: review-three-eras-trace 6s ease-in-out infinite; }
      .review-three-eras-stage { animation: review-three-eras-arrive 6s ease-in-out infinite; }
    }
    @keyframes review-three-eras-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes review-three-eras-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .review-three-eras-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .review-three-eras-stage { animation: review-three-eras-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes review-three-eras-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="review-three-eras-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="review-three-eras-bg" width="980" height="322"/>
  <text class="review-three-eras-h1"  x="30" y="40">Three traditions of the design review</text>
  <text class="review-three-eras-sub" x="30" y="64">Each adapted to a faster delivery cadence.</text>
  <g class="review-three-eras-stage review-three-eras-s0">
    <rect class="review-three-eras-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="review-three-eras-step" x="44" y="142">01</text>
    <text class="review-three-eras-name" x="70" y="142">Critical design review</text>
    <text class="review-three-eras-desc" x="44" y="166">NASA, 1960s. One heavyweight gate before</text>
    <text class="review-three-eras-desc" x="44" y="182">committing to build.</text>
    <text class="review-three-eras-edge" x="44" y="242">one gate</text>
  </g>
  <line class="review-three-eras-line review-three-eras-conn review-three-eras-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#review-three-eras-tip)"/>
  <g class="review-three-eras-stage review-three-eras-s1">
    <rect class="review-three-eras-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="review-three-eras-step" x="359" y="142">02</text>
    <text class="review-three-eras-name" x="385" y="142">Sprint review</text>
    <text class="review-three-eras-desc" x="359" y="166">2000s. Frequent, lighter, focused on</text>
    <text class="review-three-eras-desc" x="359" y="182">demonstrable increments.</text>
  </g>
  <line class="review-three-eras-line review-three-eras-conn review-three-eras-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#review-three-eras-tip)"/>
  <g class="review-three-eras-stage review-three-eras-s2">
    <rect class="review-three-eras-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="review-three-eras-step" x="674" y="142">03</text>
    <text class="review-three-eras-name" x="700" y="142">Continuous audit</text>
    <text class="review-three-eras-desc" x="674" y="166">Automated checks always running, with a human</text>
    <text class="review-three-eras-desc" x="674" y="182">gate at the milestone.</text>
    <text class="review-three-eras-edge" x="674" y="242">both</text>
  </g>
  <text class="review-three-eras-sub" x="30" y="304">The modern arrangement keeps both halves for a reason: automation catches regressions continuously, and a human review catches the things nobody thought to measure.</text>
</svg>
