<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="100%" height="100%" role="img" aria-label="Four Kinds of Index Drift showing the four regions formed by whether a document is present at the source and in the index: fresh, missing, stale, and orphaned">
  <title>Four Kinds of Index Drift</title>
  <defs>
    <style>
      .d325a-bg { fill: #f8fafc; }
      .d325a-ok { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; }
      .d325a-warn { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2px; }
      .d325a-bad { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; }
      .d325a-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d325a-sub { font-family: system-ui, sans-serif; font-size: 13px; fill: #475569; }
      .d325a-h { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .d325a-t { font-family: system-ui, sans-serif; font-size: 11px; fill: #334155; }
      .d325a-ax { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #475569; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d325a-bg"/>
  <text x="40" y="40" class="d325a-title">Four Kinds of Index Drift</text>
  <text x="40" y="64" class="d325a-sub">Two questions — is it at the source, is it in the index — produce four categories with very different consequences.</text>

  <text x="300" y="106" class="d325a-ax" text-anchor="middle">at the source</text>
  <text x="620" y="106" class="d325a-ax" text-anchor="middle">NOT at the source</text>
  <text x="150" y="180" class="d325a-ax" text-anchor="end">in the index</text>
  <text x="150" y="330" class="d325a-ax" text-anchor="end">NOT in the index</text>

  <rect x="170" y="120" width="260" height="120" rx="8" class="d325a-warn"/>
  <text x="300" y="152" class="d325a-h" text-anchor="middle">fresh  or  stale</text>
  <text x="300" y="178" class="d325a-t" text-anchor="middle">Same version: fresh, nothing to do.</text>
  <text x="300" y="198" class="d325a-t" text-anchor="middle">Different version: STALE — the system</text>
  <text x="300" y="216" class="d325a-t" text-anchor="middle">answers confidently from superseded text.</text>

  <rect x="490" y="120" width="260" height="120" rx="8" class="d325a-bad"/>
  <text x="620" y="152" class="d325a-h" text-anchor="middle">ORPHANED</text>
  <text x="620" y="178" class="d325a-t" text-anchor="middle">Deleted at the source, still indexed.</text>
  <text x="620" y="198" class="d325a-t" text-anchor="middle">The only category a source-driven scan</text>
  <text x="620" y="216" class="d325a-t" text-anchor="middle">can never find. Sometimes a legal problem.</text>

  <rect x="170" y="270" width="260" height="120" rx="8" class="d325a-warn"/>
  <text x="300" y="302" class="d325a-h" text-anchor="middle">missing</text>
  <text x="300" y="328" class="d325a-t" text-anchor="middle">Exists, not indexed. A user searches</text>
  <text x="300" y="348" class="d325a-t" text-anchor="middle">and finds nothing — so they complain,</text>
  <text x="300" y="366" class="d325a-t" text-anchor="middle">which makes this the self-reporting one.</text>

  <rect x="490" y="270" width="260" height="120" rx="8" class="d325a-ok"/>
  <text x="620" y="302" class="d325a-h" text-anchor="middle">not a document</text>
  <text x="620" y="330" class="d325a-t" text-anchor="middle">In neither place. Nothing to do.</text>

  <text x="40" y="432" class="d325a-t">Iterating the source visits only the left column, so orphans are structurally invisible to it. Compare the UNION of both id sets.</text>
  <text x="40" y="452" class="d325a-t">Risk is not uniform: missing complains, stale is silent, orphaned is silent AND may be content someone had a right to erase.</text>
</svg>
