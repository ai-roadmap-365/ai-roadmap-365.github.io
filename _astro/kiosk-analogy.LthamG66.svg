<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Structure removes ambiguity.">
  <title>A blank field, or a menu</title>
  <style>
    .kiosk-analogy-bg   { fill: #f8fafc; }
    .kiosk-analogy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kiosk-analogy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kiosk-analogy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kiosk-analogy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kiosk-analogy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kiosk-analogy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kiosk-analogy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .kiosk-analogy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .kiosk-analogy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .kiosk-analogy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .kiosk-analogy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .kiosk-analogy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kiosk-analogy-row { opacity: 1; }
    .kiosk-analogy-r0 { animation-delay: 0.00s; }
    .kiosk-analogy-r1 { animation-delay: 0.45s; }
    .kiosk-analogy-r2 { animation-delay: 0.90s; }
    .kiosk-analogy-r3 { animation-delay: 1.35s; }
    .kiosk-analogy-r4 { animation-delay: 1.80s; }
    .kiosk-analogy-row { animation: kiosk-analogy-reveal 7.3s ease-in-out infinite; }
    @keyframes kiosk-analogy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="kiosk-analogy-bg" width="980" height="390"/>
  <text class="kiosk-analogy-h1"  x="30" y="40">A blank field, or a menu</text>
  <text class="kiosk-analogy-sub" x="30" y="64">Structure removes ambiguity.</text>
  <rect class="kiosk-analogy-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="kiosk-analogy-name" x="46" y="122">A blank text field</text>
  <text class="kiosk-analogy-desc" x="46" y="142">"Type what you want."</text>
  <text class="kiosk-analogy-desc kiosk-analogy-row kiosk-analogy-r0" x="46" y="182">"Some food please"</text>
  <text class="kiosk-analogy-desc kiosk-analogy-row kiosk-analogy-r1" x="46" y="216">The kitchen cannot act on it</text>
  <text class="kiosk-analogy-desc kiosk-analogy-row kiosk-analogy-r2" x="46" y="250">No constraints to guide the order</text>
  <text class="kiosk-analogy-desc kiosk-analogy-row kiosk-analogy-r3" x="46" y="284">No way to detect an invalid order</text>
  <text class="kiosk-analogy-desc kiosk-analogy-row kiosk-analogy-r4" x="46" y="318">And no protection against a double tap</text>
  <rect class="kiosk-analogy-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="kiosk-analogy-name" x="526" y="122">A structured menu</text>
  <text class="kiosk-analogy-desc" x="526" y="142">Typed and bounded.</text>
  <text class="kiosk-analogy-desc kiosk-analogy-row kiosk-analogy-r0" x="526" y="182">Item: an enum of three options</text>
  <text class="kiosk-analogy-desc kiosk-analogy-row kiosk-analogy-r1" x="526" y="216">Cooking: medium or well-done</text>
  <text class="kiosk-analogy-desc kiosk-analogy-row kiosk-analogy-r2" x="526" y="250">Patties: integer, 1 to 4</text>
  <text class="kiosk-analogy-desc kiosk-analogy-row kiosk-analogy-r3" x="526" y="284">Invalid combinations impossible</text>
  <text class="kiosk-analogy-desc kiosk-analogy-row kiosk-analogy-r4" x="526" y="318">A payment token prevents a double charge</text>
  <text class="kiosk-analogy-sub" x="30" y="372">The payment token is the idempotency key, and its everyday form makes the point well: the interface assumes the customer will tap twice, because customers do.</text>
</svg>
