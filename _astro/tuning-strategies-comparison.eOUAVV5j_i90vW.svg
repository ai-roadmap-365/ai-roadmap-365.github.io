<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="Hyperparameter Tuning Comparison Diagram">
  <title>Hyperparameter Search Strategies Comparison</title>
  <defs>
    <style>
      .d166a-bg { fill: #f8fafc; }
      .d166a-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d166a-header { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; }
      .d166a-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
      .d166a-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
      .d166a-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 11px; font-weight: 600; }
      .d166a-grid-pt { fill: #ef4444; }
      .d166a-rand-pt { fill: #2563eb; }
      .d166a-bayes-pt { fill: #16a34a; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="d166a-bg" />

  <text x="40" y="45" class="d166a-header" font-size="22">Hyperparameter Search Space Exploration</text>
  <text x="40" y="70" class="d166a-text" font-size="13">Contrasting Grid Search, Random Search (Bergstra &amp; Bengio, 2012), and Bayesian Optimization (SMBO)</text>

  <!-- 1. Grid Search Panel -->
  <rect x="40" y="100" width="260" height="340" class="d166a-box" />
  <text x="60" y="130" class="d166a-title" fill="#b91c1c">1. Grid Search (Exhaustive)</text>
  
  <!-- Canvas 1 -->
  <rect x="60" y="150" width="220" height="180" fill="#f8fafc" stroke="#cbd5e1" />
  <!-- 3x3 Grid points: only 3 distinct values per axis! -->
  <circle cx="95" cy="180" r="5" class="d166a-grid-pt" />
  <circle cx="170" cy="180" r="5" class="d166a-grid-pt" />
  <circle cx="245" cy="180" r="5" class="d166a-grid-pt" />
  <circle cx="95" cy="240" r="5" class="d166a-grid-pt" />
  <circle cx="170" cy="240" r="5" class="d166a-grid-pt" />
  <circle cx="245" cy="240" r="5" class="d166a-grid-pt" />
  <circle cx="95" cy="300" r="5" class="d166a-grid-pt" />
  <circle cx="170" cy="300" r="5" class="d166a-grid-pt" />
  <circle cx="245" cy="300" r="5" class="d166a-grid-pt" />

  <text x="60" y="355" class="d166a-text">• 9 trials evaluate only <tspan font-weight="700">3 distinct values</tspan> along each parameter dimension.</text>
  <text x="60" y="380" class="d166a-text">• High waste on uninformative axes.</text>
  <text x="60" y="405" class="d166a-math" fill="#b91c1c">Complexity: O(k^P) exponential</text>

  <!-- 2. Random Search Panel -->
  <rect x="320" y="100" width="260" height="340" class="d166a-box" />
  <text x="340" y="130" class="d166a-title" fill="#1d4ed8">2. Random Search (Uniform)</text>
  
  <!-- Canvas 2 -->
  <rect x="340" y="150" width="220" height="180" fill="#f8fafc" stroke="#cbd5e1" />
  <!-- 9 randomly scattered points: 9 distinct values per axis! -->
  <circle cx="360" cy="170" r="5" class="d166a-rand-pt" />
  <circle cx="395" cy="290" r="5" class="d166a-rand-pt" />
  <circle cx="430" cy="210" r="5" class="d166a-rand-pt" />
  <circle cx="465" cy="315" r="5" class="d166a-rand-pt" />
  <circle cx="490" cy="185" r="5" class="d166a-rand-pt" />
  <circle cx="510" cy="250" r="5" class="d166a-rand-pt" />
  <circle cx="535" cy="280" r="5" class="d166a-rand-pt" />
  <circle cx="380" cy="240" r="5" class="d166a-rand-pt" />
  <circle cx="450" cy="165" r="5" class="d166a-rand-pt" />

  <text x="340" y="355" class="d166a-text">• 9 trials evaluate <tspan font-weight="700">9 distinct values</tspan> along every single axis.</text>
  <text x="340" y="380" class="d166a-text">• Vastly superior space coverage.</text>
  <text x="340" y="405" class="d166a-math" fill="#1d4ed8">Budget: Fixed N trials</text>

  <!-- 3. Bayesian Optimization Panel -->
  <rect x="600" y="100" width="260" height="340" class="d166a-box" />
  <text x="620" y="130" class="d166a-title" fill="#15803d">3. Bayesian Optimization (EI)</text>
  
  <!-- Canvas 3 -->
  <rect x="620" y="150" width="220" height="180" fill="#f8fafc" stroke="#cbd5e1" />
  <!-- Exploration + dense cluster near optimum (x=750, y=240) -->
  <circle cx="650" cy="180" r="5" class="d166a-bayes-pt" opacity="0.5" />
  <circle cx="810" cy="300" r="5" class="d166a-bayes-pt" opacity="0.5" />
  <circle cx="740" cy="235" r="5" class="d166a-bayes-pt" />
  <circle cx="750" cy="245" r="6" class="d166a-bayes-pt" />
  <circle cx="755" cy="238" r="7" fill="#22c55e" stroke="#15803d" stroke-width="1.5" />
  <circle cx="748" cy="250" r="5" class="d166a-bayes-pt" />
  <circle cx="680" cy="270" r="5" class="d166a-bayes-pt" opacity="0.6" />

  <text x="620" y="355" class="d166a-text">• Uses <tspan font-weight="700">Surrogate + Expected Improvement</tspan> to cluster trials near global optima.</text>
  <text x="620" y="380" class="d166a-text">• Balances explore vs exploit.</text>
  <text x="620" y="405" class="d166a-math" fill="#15803d">Optimal: Optuna TPE / GP</text>
</svg>
