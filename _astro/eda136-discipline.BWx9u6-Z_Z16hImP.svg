<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four rules.">
  <title>Keeping exploration honest</title>
  <style>
    .eda136-discipline-bg   { fill: #f8fafc; }
    .eda136-discipline-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda136-discipline-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda136-discipline-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda136-discipline-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda136-discipline-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda136-discipline-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eda136-discipline-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eda136-discipline-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eda136-discipline-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eda136-discipline-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eda136-discipline-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eda136-discipline-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .eda136-discipline-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .eda136-discipline-stage { opacity: 1; }

    .eda136-discipline-s0 { animation-delay: 0.00s; }
    .eda136-discipline-e0 { animation-delay: 0.00s; }
    .eda136-discipline-s1 { animation-delay: 1.28s; }
    .eda136-discipline-e1 { animation-delay: 1.28s; }
    .eda136-discipline-s2 { animation-delay: 2.56s; }
    .eda136-discipline-e2 { animation-delay: 2.56s; }
    .eda136-discipline-s3 { animation-delay: 3.84s; }
    .eda136-discipline-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .eda136-discipline-conn  { animation: eda136-discipline-trace 6.4s ease-in-out infinite; }
      .eda136-discipline-stage { animation: eda136-discipline-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes eda136-discipline-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes eda136-discipline-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .eda136-discipline-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .eda136-discipline-stage { animation: eda136-discipline-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes eda136-discipline-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="eda136-discipline-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="eda136-discipline-bg" width="980" height="322"/>
  <text class="eda136-discipline-h1"  x="30" y="40">Keeping exploration honest</text>
  <text class="eda136-discipline-sub" x="30" y="64">Four rules.</text>
  <g class="eda136-discipline-stage eda136-discipline-s0">
    <rect class="eda136-discipline-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="eda136-discipline-step" x="44" y="142">01</text>
    <text class="eda136-discipline-name" x="70" y="142">Record what you looked at, including what showed nothing</text>
    <text class="eda136-discipline-desc" x="44" y="166">Which is most of it.</text>
  </g>
  <line class="eda136-discipline-line eda136-discipline-conn eda136-discipline-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#eda136-discipline-tip)"/>
  <g class="eda136-discipline-stage eda136-discipline-s1">
    <rect class="eda136-discipline-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="eda136-discipline-step" x="280" y="142">02</text>
    <text class="eda136-discipline-name" x="306" y="142">Report negative results alongside positive ones</text>
    <text class="eda136-discipline-desc" x="280" y="166">Or the summary is a selection.</text>
  </g>
  <line class="eda136-discipline-line eda136-discipline-conn eda136-discipline-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#eda136-discipline-tip)"/>
  <g class="eda136-discipline-stage eda136-discipline-s2">
    <rect class="eda136-discipline-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="eda136-discipline-step" x="516" y="142">03</text>
    <text class="eda136-discipline-name" x="542" y="142">Remember that many comparisons find spurious patterns</text>
    <text class="eda136-discipline-desc" x="516" y="166">By construction.</text>
  </g>
  <line class="eda136-discipline-line eda136-discipline-conn eda136-discipline-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#eda136-discipline-tip)"/>
  <g class="eda136-discipline-stage eda136-discipline-s3">
    <rect class="eda136-discipline-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="eda136-discipline-step" x="752" y="142">04</text>
    <text class="eda136-discipline-name" x="778" y="142">And keep data aside to test what you found</text>
    <text class="eda136-discipline-desc" x="752" y="166">On data the exploration never</text>
    <text class="eda136-discipline-desc" x="752" y="182">touched.</text>
  </g>
  <text class="eda136-discipline-sub" x="30" y="304">Holding data back is the strongest available protection, because a pattern that survives on unseen data is far more likely to be real.</text>
</svg>
