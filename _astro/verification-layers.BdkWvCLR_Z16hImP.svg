<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each catches what the others cannot.">
  <title>Four verification layers</title>
  <style>
    .verification-layers-bg   { fill: #f8fafc; }
    .verification-layers-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .verification-layers-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .verification-layers-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .verification-layers-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .verification-layers-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .verification-layers-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .verification-layers-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .verification-layers-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .verification-layers-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .verification-layers-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .verification-layers-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .verification-layers-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .verification-layers-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .verification-layers-stage { opacity: 1; }

    .verification-layers-s0 { animation-delay: 0.00s; }
    .verification-layers-e0 { animation-delay: 0.00s; }
    .verification-layers-s1 { animation-delay: 1.28s; }
    .verification-layers-e1 { animation-delay: 1.28s; }
    .verification-layers-s2 { animation-delay: 2.56s; }
    .verification-layers-e2 { animation-delay: 2.56s; }
    .verification-layers-s3 { animation-delay: 3.84s; }
    .verification-layers-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .verification-layers-conn  { animation: verification-layers-trace 6.4s ease-in-out infinite; }
      .verification-layers-stage { animation: verification-layers-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes verification-layers-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes verification-layers-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .verification-layers-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .verification-layers-stage { animation: verification-layers-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes verification-layers-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="verification-layers-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="verification-layers-bg" width="980" height="322"/>
  <text class="verification-layers-h1"  x="30" y="40">Four verification layers</text>
  <text class="verification-layers-sub" x="30" y="64">Each catches what the others cannot.</text>
  <g class="verification-layers-stage verification-layers-s0">
    <rect class="verification-layers-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="verification-layers-step" x="44" y="142">01</text>
    <text class="verification-layers-name" x="70" y="142">Static analysis</text>
    <text class="verification-layers-desc" x="44" y="166">Types, known CVE patterns,</text>
    <text class="verification-layers-desc" x="44" y="182">unsafe calls. Seconds,</text>
    <text class="verification-layers-desc" x="44" y="198">exhaustive over branches.</text>
  </g>
  <line class="verification-layers-line verification-layers-conn verification-layers-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#verification-layers-tip)"/>
  <g class="verification-layers-stage verification-layers-s1">
    <rect class="verification-layers-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="verification-layers-step" x="280" y="142">02</text>
    <text class="verification-layers-name" x="306" y="142">Dependency audit</text>
    <text class="verification-layers-desc" x="280" y="166">Every new import against an</text>
    <text class="verification-layers-desc" x="280" y="182">approved registry. Hallucinated</text>
    <text class="verification-layers-desc" x="280" y="198">names blocked.</text>
  </g>
  <line class="verification-layers-line verification-layers-conn verification-layers-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#verification-layers-tip)"/>
  <g class="verification-layers-stage verification-layers-s2">
    <rect class="verification-layers-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="verification-layers-step" x="516" y="142">03</text>
    <text class="verification-layers-name" x="542" y="142">Mutation testing</text>
    <text class="verification-layers-desc" x="516" y="166">Does the test suite actually</text>
    <text class="verification-layers-desc" x="516" y="182">fail when the logic is broken?</text>
    <text class="verification-layers-edge" x="516" y="242">proves tests</text>
  </g>
  <line class="verification-layers-line verification-layers-conn verification-layers-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#verification-layers-tip)"/>
  <g class="verification-layers-stage verification-layers-s3">
    <rect class="verification-layers-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="verification-layers-step" x="752" y="142">04</text>
    <text class="verification-layers-name" x="778" y="142">Human architectural review</text>
    <text class="verification-layers-desc" x="752" y="166">Complexity, concurrency,</text>
    <text class="verification-layers-desc" x="752" y="182">authorisation, resource cleanup.</text>
  </g>
  <text class="verification-layers-sub" x="30" y="304">The third layer is the one that is new: when the model wrote both the code and the tests, a green suite is a claim by the same author, and mutation testing is what independently checks it.</text>
</svg>
