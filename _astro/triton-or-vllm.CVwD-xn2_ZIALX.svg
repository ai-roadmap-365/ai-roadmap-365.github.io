<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Multi-model throughput, or LLM concurrency.">
  <title>Triton or vLLM</title>
  <style>
    .triton-or-vllm-bg   { fill: #f8fafc; }
    .triton-or-vllm-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .triton-or-vllm-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .triton-or-vllm-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .triton-or-vllm-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .triton-or-vllm-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .triton-or-vllm-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .triton-or-vllm-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .triton-or-vllm-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .triton-or-vllm-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .triton-or-vllm-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .triton-or-vllm-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .triton-or-vllm-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .triton-or-vllm-row { opacity: 1; }
    .triton-or-vllm-r0 { animation-delay: 0.00s; }
    .triton-or-vllm-r1 { animation-delay: 0.45s; }
    .triton-or-vllm-r2 { animation-delay: 0.90s; }
    .triton-or-vllm-r3 { animation-delay: 1.35s; }
    .triton-or-vllm-r4 { animation-delay: 1.80s; }
    .triton-or-vllm-row { animation: triton-or-vllm-reveal 7.3s ease-in-out infinite; }
    @keyframes triton-or-vllm-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="triton-or-vllm-bg" width="980" height="390"/>
  <text class="triton-or-vllm-h1"  x="30" y="40">Triton or vLLM</text>
  <text class="triton-or-vllm-sub" x="30" y="64">Multi-model throughput, or LLM concurrency.</text>
  <rect class="triton-or-vllm-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="triton-or-vllm-name" x="46" y="122">Triton</text>
  <text class="triton-or-vllm-desc" x="46" y="142">Many models, one GPU.</text>
  <text class="triton-or-vllm-desc triton-or-vllm-row triton-or-vllm-r0" x="46" y="182">C++ backends, multi-model serving</text>
  <text class="triton-or-vllm-desc triton-or-vllm-row triton-or-vllm-r1" x="46" y="216">Dynamic batching for one-pass models</text>
  <text class="triton-or-vllm-desc triton-or-vllm-row triton-or-vllm-r2" x="46" y="250">Ensembles in shared GPU memory</text>
  <text class="triton-or-vllm-desc triton-or-vllm-row triton-or-vllm-r3" x="46" y="284">MIG-aware</text>
  <text class="triton-or-vllm-desc triton-or-vllm-row triton-or-vllm-r4" x="46" y="318">Right for embeddings and vision</text>
  <rect class="triton-or-vllm-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="triton-or-vllm-name" x="526" y="122">vLLM</text>
  <text class="triton-or-vllm-desc" x="526" y="142">One LLM, many clients.</text>
  <text class="triton-or-vllm-desc triton-or-vllm-row triton-or-vllm-r0" x="526" y="182">PagedAttention</text>
  <text class="triton-or-vllm-desc triton-or-vllm-row triton-or-vllm-r1" x="526" y="216">Continuous iteration-level batching</text>
  <text class="triton-or-vllm-desc triton-or-vllm-row triton-or-vllm-r2" x="526" y="250">Built for autoregressive generation</text>
  <text class="triton-or-vllm-desc triton-or-vllm-row triton-or-vllm-r3" x="526" y="284">Where the KV cache is the constraint</text>
  <text class="triton-or-vllm-desc triton-or-vllm-row triton-or-vllm-r4" x="526" y="318">Right for a chat or completion endpoint</text>
  <text class="triton-or-vllm-sub" x="30" y="372">The distinction follows from the earlier one: a model that answers in one forward pass wants request-level batching, and a model that emits tokens one at a time wants a scheduler that runs per iteration.</text>
</svg>
