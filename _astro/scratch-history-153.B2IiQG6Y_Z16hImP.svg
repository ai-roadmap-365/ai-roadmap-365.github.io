<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward stability.">
  <title>Four steps in solving least squares</title>
  <style>
    .scratch-history-153-bg   { fill: #f8fafc; }
    .scratch-history-153-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-history-153-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-history-153-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-history-153-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-history-153-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-history-153-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scratch-history-153-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scratch-history-153-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scratch-history-153-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scratch-history-153-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scratch-history-153-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scratch-history-153-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .scratch-history-153-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .scratch-history-153-stage { opacity: 1; }

    .scratch-history-153-s0 { animation-delay: 0.00s; }
    .scratch-history-153-e0 { animation-delay: 0.00s; }
    .scratch-history-153-s1 { animation-delay: 1.28s; }
    .scratch-history-153-e1 { animation-delay: 1.28s; }
    .scratch-history-153-s2 { animation-delay: 2.56s; }
    .scratch-history-153-e2 { animation-delay: 2.56s; }
    .scratch-history-153-s3 { animation-delay: 3.84s; }
    .scratch-history-153-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .scratch-history-153-conn  { animation: scratch-history-153-trace 6.4s ease-in-out infinite; }
      .scratch-history-153-stage { animation: scratch-history-153-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes scratch-history-153-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes scratch-history-153-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .scratch-history-153-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .scratch-history-153-stage { animation: scratch-history-153-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes scratch-history-153-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="scratch-history-153-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="scratch-history-153-bg" width="980" height="322"/>
  <text class="scratch-history-153-h1"  x="30" y="40">Four steps in solving least squares</text>
  <text class="scratch-history-153-sub" x="30" y="64">Toward stability.</text>
  <g class="scratch-history-153-stage scratch-history-153-s0">
    <rect class="scratch-history-153-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="scratch-history-153-step" x="44" y="142">01</text>
    <text class="scratch-history-153-name" x="70" y="142">Solved by hand, for small systems</text>
    <text class="scratch-history-153-desc" x="44" y="166">Where the normal equations were</text>
    <text class="scratch-history-153-desc" x="44" y="182">the only option.</text>
  </g>
  <line class="scratch-history-153-line scratch-history-153-conn scratch-history-153-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#scratch-history-153-tip)"/>
  <g class="scratch-history-153-stage scratch-history-153-s1">
    <rect class="scratch-history-153-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="scratch-history-153-step" x="280" y="142">02</text>
    <text class="scratch-history-153-name" x="306" y="142">Then by computer, using the same formula</text>
    <text class="scratch-history-153-desc" x="280" y="166">Which surfaced the precision</text>
    <text class="scratch-history-153-desc" x="280" y="182">problem at scale.</text>
  </g>
  <line class="scratch-history-153-line scratch-history-153-conn scratch-history-153-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#scratch-history-153-tip)"/>
  <g class="scratch-history-153-stage scratch-history-153-s2">
    <rect class="scratch-history-153-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="scratch-history-153-step" x="516" y="142">03</text>
    <text class="scratch-history-153-name" x="542" y="142">Stable decompositions were developed in response</text>
    <text class="scratch-history-153-desc" x="516" y="166">Which avoided forming the</text>
    <text class="scratch-history-153-desc" x="516" y="182">squared product.</text>
  </g>
  <line class="scratch-history-153-line scratch-history-153-conn scratch-history-153-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#scratch-history-153-tip)"/>
  <g class="scratch-history-153-stage scratch-history-153-s3">
    <rect class="scratch-history-153-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="scratch-history-153-step" x="752" y="142">04</text>
    <text class="scratch-history-153-name" x="778" y="142">And became the silent default in every library</text>
    <text class="scratch-history-153-desc" x="752" y="166">Which is why most people never</text>
    <text class="scratch-history-153-desc" x="752" y="182">meet the problem.</text>
  </g>
  <text class="scratch-history-153-sub" x="30" y="304">The problem being solved silently in the defaults is why it is worth meeting deliberately: you will not encounter it until you write the formula yourself.</text>
</svg>
