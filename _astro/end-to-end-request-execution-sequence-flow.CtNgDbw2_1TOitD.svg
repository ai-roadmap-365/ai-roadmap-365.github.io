<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="End-to-End Request Execution Sequence Flow">
  <title>End-to-End Request Execution Sequence Flow</title>
  <defs>
    <style>
      .d352b-bg { fill: #f8fafc; }
      .d352b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d352b-step { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d352b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d352b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d352b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; }
      .d352b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d352b-bg" />
  
  <text x="40" y="40" class="d352a-title">Request Execution Sequence Lifecycle</text>
  <text x="40" y="65" class="d352a-subtitle">End-to-End Request Execution Sequence Flow showing Ingress Gateway, PII Vault, Vector Retrieval, Agent Reasoning, Tool Execution, and Egress Canary Monitor</text>
  
  <!-- Step 1 -->
  <rect x="40" y="110" width="185" height="270" class="d352b-step" />
  <text x="55" y="145" class="d352b-header" fill="#1d4ed8">1. Client Ingress</text>
  <text x="55" y="180" class="d352b-text">• User submits prompt</text>
  <text x="55" y="205" class="d352b-text">• Next.js forwards SSE</text>
  <text x="55" y="230" class="d352b-text">• PII Vault pseudonymizes</text>
  <text x="55" y="255" class="d352b-text">• Ingress WAF checks rules</text>
  <text x="55" y="300" class="d352b-text" font-weight="600">Latency: under 5ms</text>
  
  <!-- Step 2 -->
  <rect x="250" y="110" width="185" height="270" class="d352b-step" />
  <text x="265" y="145" class="d352b-header" fill="#1d4ed8">2. Hybrid Retrieval</text>
  <text x="265" y="180" class="d352b-text">• Dense embedding query</text>
  <text x="265" y="205" class="d352b-text">• Sparse BM25 keyword scan</text>
  <text x="265" y="230" class="d352b-text">• Reciprocal Rank Fusion</text>
  <text x="265" y="255" class="d352b-text">• Cross-Encoder rerank</text>
  <text x="265" y="300" class="d352b-text" font-weight="600">Latency: under 80ms</text>
  
  <!-- Step 3 -->
  <rect x="460" y="110" width="185" height="270" class="d352b-step" />
  <text x="475" y="145" class="d352b-header" fill="#1d4ed8">3. Agent Execution</text>
  <text x="475" y="180" class="d352b-text">• ReAct thought cycle</text>
  <text x="475" y="205" class="d352b-text">• Structured JSON tool call</text>
  <text x="475" y="230" class="d352b-text">• SQL/Sandbox execution</text>
  <text x="475" y="255" class="d352b-text">• Grounded synthesis</text>
  <text x="475" y="300" class="d352b-text" font-weight="600">Latency: under 250ms</text>
  
  <!-- Step 4 -->
  <rect x="670" y="110" width="190" height="270" class="d352b-step" />
  <text x="685" y="145" class="d352b-header" fill="#1d4ed8">4. Egress Streaming</text>
  <text x="685" y="180" class="d352b-text">• Canary exfil scan</text>
  <text x="685" y="205" class="d352b-text">• PII detokenization</text>
  <text x="685" y="230" class="d352b-text">• Chunked SSE stream</text>
  <text x="685" y="255" class="d352b-text">• OpenTelemetry record</text>
  <text x="685" y="300" class="d352b-text" font-weight="600">p95 TTFT: under 380ms</text>
</svg>