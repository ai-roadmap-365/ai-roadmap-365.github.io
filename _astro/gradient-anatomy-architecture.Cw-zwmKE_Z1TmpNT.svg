<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" width="980" height="760" role="img" aria-labelledby="d109a-title d109a-desc">
  <title id="d109a-title">The anatomy of a gradient: two partial derivatives measured on a contour map, assembled into one arrow that points uphill at right angles to the contour</title>
  <desc id="d109a-desc">A contour map of the bowl f equals x squared plus three y squared, with the point (1, 1) marked on the contour f equals 4. Two arrows leave that point along the axes: one east of length 2, which is the partial derivative in x, and one north of length 6, which is the partial derivative in y. They compose into the gradient arrow (2, 6), whose length is the square root of 40, about 6.3246, and whose bearing is 71.5651 degrees. The gradient meets the tangent to the contour at exactly ninety degrees, and the dot product of (2, 6) with the tangent direction (6, minus 2) is exactly zero. Beside the map, two panels show where each partial comes from: freezing y at 1 leaves the single-variable function x squared plus 3, whose slope at x equals 1 is 2, and freezing x at 1 leaves 1 plus 3 y squared, whose slope at y equals 1 is 6.</desc>

  <style>
    .d109a-bg      { fill: #f8fafc; }
    .d109a-title   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 600; fill: #1a202c; }
    .d109a-head    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 600; fill: #1a202c; }
    .d109a-label   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #1a202c; }
    .d109a-small   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d109a-accent  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; fill: #1d4ed8; }
    .d109a-amber   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #b45309; }
    .d109a-panel   { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d109a-contour { fill: none; stroke: #94a3b8; stroke-width: 1.5; }
    .d109a-here    { fill: none; stroke: #0f766e; stroke-width: 2.5; }
    .d109a-axis    { stroke: #cbd5e1; stroke-width: 1.5; }
    .d109a-part    { stroke: #b45309; stroke-width: 2.5; fill: none; }
    .d109a-ghost   { stroke: #b45309; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
    .d109a-grad    { stroke: #1d4ed8; stroke-width: 3.5; fill: none; }
    .d109a-tangent { stroke: #0f766e; stroke-width: 2.5; stroke-dasharray: 9 5; fill: none; }
    .d109a-curve   { fill: none; stroke: #1a202c; stroke-width: 2; }
    .d109a-slope   { fill: none; stroke: #b45309; stroke-width: 2.5; }
    .d109a-rule    { stroke: #cbd5e1; stroke-width: 1.5; }
    .d109a-right   { fill: none; stroke: #0f766e; stroke-width: 1.5; }
  </style>

  <defs>
    <marker id="d109a-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309" />
    </marker>
    <marker id="d109a-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
  </defs>

  <rect class="d109a-bg" x="0" y="0" width="980" height="760" />

  <text class="d109a-title" x="30" y="38">A gradient, taken apart: two partial derivatives, one arrow, one right angle</text>
  <text class="d109a-small" x="30" y="62">f(x, y) = x² + 3y², standing at the point (1, 1), where f = 4. Every number below is exact.</text>

  <!-- ================= LEFT: the contour map ================= -->
  <rect class="d109a-panel" x="30" y="82" width="420" height="440" rx="4" />
  <text class="d109a-head" x="48" y="108">The flat map you are standing on</text>
  <text class="d109a-small" x="48" y="128">Each grey ring joins points of equal height — a contour, or level set.</text>

  <!-- axes: world origin at (230, 330), 55 px per unit -->
  <line class="d109a-axis" x1="55" y1="330" x2="430" y2="330" />
  <line class="d109a-axis" x1="230" y1="150" x2="230" y2="500" />
  <text class="d109a-small" x="412" y="349">x</text>
  <text class="d109a-small" x="238" y="162">y</text>

  <!-- contours f = 1, 4, 9 : rx = 55*sqrt(L), ry = 55*sqrt(L/3) -->
  <ellipse class="d109a-contour" cx="230" cy="330" rx="55" ry="31.75" />
  <ellipse class="d109a-here"    cx="230" cy="330" rx="110" ry="63.51" />
  <ellipse class="d109a-contour" cx="230" cy="330" rx="165" ry="95.26" />
  <text class="d109a-small" x="152" y="255">f = 9</text>
  <text class="d109a-small" x="196" y="290" fill="#0f766e">f = 4</text>
  <text class="d109a-small" x="238" y="322">f = 1</text>
  <text class="d109a-small" x="196" y="348">minimum</text>

  <!-- the tangent to the contour f = 4 at (1, 1): direction (6, -2) -->
  <line class="d109a-tangent" x1="213.9" y1="221.3" x2="356.2" y2="268.7" />
  <text class="d109a-small" x="330" y="290" fill="#0f766e">tangent to</text>
  <text class="d109a-small" x="330" y="308" fill="#0f766e">the contour</text>

  <!-- the composition rectangle -->
  <line class="d109a-ghost" x1="309" y1="245" x2="309" y2="173" />
  <line class="d109a-ghost" x1="285" y1="173" x2="309" y2="173" />

  <!-- the two partials -->
  <line class="d109a-part" x1="285" y1="245" x2="309" y2="245" marker-end="url(#d109a-arrow-amber)" />
  <line class="d109a-part" x1="285" y1="245" x2="285" y2="173" marker-end="url(#d109a-arrow-amber)" />

  <!-- the gradient -->
  <line class="d109a-grad" x1="285" y1="245" x2="309" y2="173" marker-end="url(#d109a-arrow-blue)" />

  <!-- the right angle between gradient and tangent -->
  <path class="d109a-right" d="M 258.8 263.6 L 270.2 267.4 L 266.4 278.8" transform="translate(26.2, -18.6)" />

  <circle cx="285" cy="245" r="5" fill="#1a202c" />
  <text class="d109a-label" x="252" y="270">(1, 1)</text>
  <text class="d109a-amber" x="316" y="252">∂f/∂x = 2</text>
  <text class="d109a-amber" x="196" y="166">∂f/∂y = 6</text>
  <text class="d109a-accent" x="318" y="168">∇f = (2, 6)</text>

  <text class="d109a-small" x="48" y="466">The gradient is drawn ON the map, not out of the hillside: it has two</text>
  <text class="d109a-small" x="48" y="486">components because f has two INPUTS, not three because its graph is a</text>
  <text class="d109a-small" x="48" y="506">surface. It is a direction to walk, not a place to stand.</text>

  <!-- ================= RIGHT: where each partial comes from ================= -->
  <rect class="d109a-panel" x="470" y="82" width="480" height="440" rx="4" />
  <text class="d109a-head" x="488" y="108">Where each number comes from: freeze one input, and it is Day 108 again</text>

  <!-- slice 1 -->
  <text class="d109a-label" x="488" y="140">Freeze y = 1:  g(x) = f(x, 1) = x² + 3</text>
  <line class="d109a-axis" x1="500" y1="330" x2="730" y2="330" />
  <line class="d109a-axis" x1="500" y1="160" x2="500" y2="330" />
  <path class="d109a-curve" d="M 500 320 Q 557 314, 615 277.5 T 730 160" />
  <line class="d109a-slope" x1="565" y1="314.5" x2="665" y2="240.5" />
  <circle cx="615" cy="277.5" r="5" fill="#1a202c" />
  <text class="d109a-small" x="490" y="348">x = 0</text>
  <text class="d109a-small" x="600" y="348">x = 1</text>
  <text class="d109a-small" x="706" y="348">x = 2</text>
  <text class="d109a-amber" x="628" y="232">slope = 2</text>
  <text class="d109a-small" x="488" y="372">The y² term became the constant 3, so it contributes nothing to</text>
  <text class="d109a-small" x="488" y="392">the slope. Differentiate x² + 3 and put x = 1:  ∂f/∂x = 2x = 2.</text>

  <!-- slice 2 -->
  <text class="d109a-label" x="760" y="140">Freeze x = 1:  k(y) = f(1, y) = 1 + 3y²</text>
  <line class="d109a-axis" x1="772" y1="330" x2="940" y2="330" />
  <line class="d109a-axis" x1="772" y1="160" x2="772" y2="330" />
  <path class="d109a-curve" d="M 772 320 Q 828 316, 884 235 T 940 152" />
  <line class="d109a-slope" x1="834" y1="295.7" x2="934" y2="174.3" />
  <circle cx="884" cy="235" r="5" fill="#1a202c" />
  <text class="d109a-small" x="762" y="348">y = 0</text>
  <text class="d109a-small" x="866" y="348">y = 1</text>
  <text class="d109a-amber" x="806" y="180">slope = 6</text>
  <text class="d109a-small" x="760" y="372">Steeper, because of the 3.</text>
  <text class="d109a-small" x="760" y="392">∂f/∂y = 6y = 6.</text>

  <line class="d109a-rule" x1="488" y1="412" x2="932" y2="412" />
  <text class="d109a-label" x="488" y="440">The symbol ∂ is a rounded d, and that is the whole of what it announces:</text>
  <text class="d109a-small" x="488" y="462">this function has other inputs, and they are being held still. The arithmetic</text>
  <text class="d109a-small" x="488" y="482">of differentiating is unchanged from yesterday. Nothing new was learned</text>
  <text class="d109a-small" x="488" y="502">about calculus; something new was learned about bookkeeping.</text>

  <!-- ================= FOOTER: the assembly ================= -->
  <rect class="d109a-panel" x="30" y="542" width="920" height="190" rx="4" />
  <text class="d109a-head" x="48" y="570">Assembling the two, and the right angle that follows for free</text>

  <text class="d109a-label" x="48" y="600">∇f(1, 1)  =  [ ∂f/∂x , ∂f/∂y ]  =  [ 2 , 6 ]</text>
  <text class="d109a-small" x="48" y="624">one component per input — write them side by side and you are done</text>

  <text class="d109a-label" x="48" y="656">| ∇f |  =  √(2² + 6²)  =  √40  =  6.324555</text>
  <text class="d109a-small" x="48" y="680">Day 99's norm. This is HOW STEEP the steepest way up is, in units of f</text>
  <text class="d109a-small" x="48" y="700">gained per unit of distance walked. It is not a height and not a distance.</text>

  <line class="d109a-rule" x1="500" y1="586" x2="500" y2="712" />

  <text class="d109a-accent" x="524" y="600">bearing = arctan(6 / 2) = 71.5651°</text>
  <text class="d109a-small" x="524" y="624">Not 45°. The bowl is three times steeper in y, so uphill leans north.</text>

  <text class="d109a-label" x="524" y="656">∇f · (6, −2)  =  2×6 + 6×(−2)  =  12 − 12  =  0</text>
  <text class="d109a-small" x="524" y="680">(6, −2) runs along the contour. A dot product of exactly zero means exactly</text>
  <text class="d109a-small" x="524" y="700">perpendicular — no tolerance, no approximation. This is why every</text>
  <text class="d109a-small" x="524" y="720">optimisation picture shows arrows crossing the contour lines at right angles.</text>
</svg>
