<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Sharding across devices</title>
  <style>
    .tensor-parallel-bg   { fill: #f8fafc; }
    .tensor-parallel-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tensor-parallel-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tensor-parallel-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tensor-parallel-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tensor-parallel-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tensor-parallel-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tensor-parallel-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tensor-parallel-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tensor-parallel-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tensor-parallel-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tensor-parallel-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tensor-parallel-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tensor-parallel-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tensor-parallel-stage { opacity: 1; }

    .tensor-parallel-s0 { animation-delay: 0.00s; }
    .tensor-parallel-e0 { animation-delay: 0.00s; }
    .tensor-parallel-s1 { animation-delay: 1.28s; }
    .tensor-parallel-e1 { animation-delay: 1.28s; }
    .tensor-parallel-s2 { animation-delay: 2.56s; }
    .tensor-parallel-e2 { animation-delay: 2.56s; }
    .tensor-parallel-s3 { animation-delay: 3.84s; }
    .tensor-parallel-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tensor-parallel-conn  { animation: tensor-parallel-trace 6.4s ease-in-out infinite; }
      .tensor-parallel-stage { animation: tensor-parallel-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tensor-parallel-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tensor-parallel-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tensor-parallel-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tensor-parallel-stage { animation: tensor-parallel-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tensor-parallel-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tensor-parallel-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tensor-parallel-bg" width="980" height="322"/>
  <text class="tensor-parallel-h1"  x="30" y="40">Sharding across devices</text>
  <text class="tensor-parallel-sub" x="30" y="64">Four steps.</text>
  <g class="tensor-parallel-stage tensor-parallel-s0">
    <rect class="tensor-parallel-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tensor-parallel-step" x="44" y="142">01</text>
    <text class="tensor-parallel-name" x="70" y="142">The model does not fit on one device</text>
    <text class="tensor-parallel-desc" x="44" y="166">Weights plus cache exceed its</text>
    <text class="tensor-parallel-desc" x="44" y="182">memory.</text>
  </g>
  <line class="tensor-parallel-line tensor-parallel-conn tensor-parallel-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tensor-parallel-tip)"/>
  <g class="tensor-parallel-stage tensor-parallel-s1">
    <rect class="tensor-parallel-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tensor-parallel-step" x="280" y="142">02</text>
    <text class="tensor-parallel-name" x="306" y="142">Split each weight matrix across devices</text>
    <text class="tensor-parallel-desc" x="280" y="166">By columns, then by rows.</text>
  </g>
  <line class="tensor-parallel-line tensor-parallel-conn tensor-parallel-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tensor-parallel-tip)"/>
  <g class="tensor-parallel-stage tensor-parallel-s2">
    <rect class="tensor-parallel-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tensor-parallel-step" x="516" y="142">03</text>
    <text class="tensor-parallel-name" x="542" y="142">Each computes its slice in parallel</text>
    <text class="tensor-parallel-desc" x="516" y="166">On the same input.</text>
  </g>
  <line class="tensor-parallel-line tensor-parallel-conn tensor-parallel-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tensor-parallel-tip)"/>
  <g class="tensor-parallel-stage tensor-parallel-s3">
    <rect class="tensor-parallel-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tensor-parallel-step" x="752" y="142">04</text>
    <text class="tensor-parallel-name" x="778" y="142">Then combine, which needs fast interconnect</text>
    <text class="tensor-parallel-desc" x="752" y="166">Twice per layer, so keep it</text>
    <text class="tensor-parallel-desc" x="752" y="182">inside one node.</text>
  </g>
  <text class="tensor-parallel-sub" x="30" y="304">The synchronisation frequency is what confines this within a node: crossing a slower network fabric twice per layer costs more than the parallelism gains.</text>
</svg>
