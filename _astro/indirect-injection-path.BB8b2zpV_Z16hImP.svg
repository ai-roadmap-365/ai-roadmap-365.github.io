<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps, and the attacker never appears.">
  <title>The indirect injection path</title>
  <style>
    .indirect-injection-path-bg   { fill: #f8fafc; }
    .indirect-injection-path-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .indirect-injection-path-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .indirect-injection-path-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .indirect-injection-path-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .indirect-injection-path-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .indirect-injection-path-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .indirect-injection-path-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .indirect-injection-path-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .indirect-injection-path-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .indirect-injection-path-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .indirect-injection-path-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .indirect-injection-path-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .indirect-injection-path-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .indirect-injection-path-stage { opacity: 1; }

    .indirect-injection-path-s0 { animation-delay: 0.00s; }
    .indirect-injection-path-e0 { animation-delay: 0.00s; }
    .indirect-injection-path-s1 { animation-delay: 1.28s; }
    .indirect-injection-path-e1 { animation-delay: 1.28s; }
    .indirect-injection-path-s2 { animation-delay: 2.56s; }
    .indirect-injection-path-e2 { animation-delay: 2.56s; }
    .indirect-injection-path-s3 { animation-delay: 3.84s; }
    .indirect-injection-path-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .indirect-injection-path-conn  { animation: indirect-injection-path-trace 6.4s ease-in-out infinite; }
      .indirect-injection-path-stage { animation: indirect-injection-path-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes indirect-injection-path-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes indirect-injection-path-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .indirect-injection-path-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .indirect-injection-path-stage { animation: indirect-injection-path-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes indirect-injection-path-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="indirect-injection-path-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="indirect-injection-path-bg" width="980" height="322"/>
  <text class="indirect-injection-path-h1"  x="30" y="40">The indirect injection path</text>
  <text class="indirect-injection-path-sub" x="30" y="64">Four steps, and the attacker never appears.</text>
  <g class="indirect-injection-path-stage indirect-injection-path-s0">
    <rect class="indirect-injection-path-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="indirect-injection-path-step" x="44" y="142">01</text>
    <text class="indirect-injection-path-name" x="70" y="142">A sentence is written into a document</text>
    <text class="indirect-injection-path-desc" x="44" y="166">An invoice PDF, a web page, a</text>
    <text class="indirect-injection-path-desc" x="44" y="182">support ticket. Not sent to you.</text>
  </g>
  <line class="indirect-injection-path-line indirect-injection-path-conn indirect-injection-path-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#indirect-injection-path-tip)"/>
  <g class="indirect-injection-path-stage indirect-injection-path-s1">
    <rect class="indirect-injection-path-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="indirect-injection-path-step" x="280" y="142">02</text>
    <text class="indirect-injection-path-name" x="306" y="142">Your pipeline retrieves it</text>
    <text class="indirect-injection-path-desc" x="280" y="166">Because it is relevant. That is</text>
    <text class="indirect-injection-path-desc" x="280" y="182">the system working correctly.</text>
  </g>
  <line class="indirect-injection-path-line indirect-injection-path-conn indirect-injection-path-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#indirect-injection-path-tip)"/>
  <g class="indirect-injection-path-stage indirect-injection-path-s2">
    <rect class="indirect-injection-path-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="indirect-injection-path-step" x="516" y="142">03</text>
    <text class="indirect-injection-path-name" x="542" y="142">It is concatenated into the prompt</text>
    <text class="indirect-injection-path-desc" x="516" y="166">Instructions and data, one</text>
    <text class="indirect-injection-path-desc" x="516" y="182">channel, no separator that means</text>
    <text class="indirect-injection-path-desc" x="516" y="198">anything.</text>
  </g>
  <line class="indirect-injection-path-line indirect-injection-path-conn indirect-injection-path-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#indirect-injection-path-tip)"/>
  <g class="indirect-injection-path-stage indirect-injection-path-s3">
    <rect class="indirect-injection-path-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="indirect-injection-path-step" x="752" y="142">04</text>
    <text class="indirect-injection-path-name" x="778" y="142">The agent calls a tool</text>
    <text class="indirect-injection-path-desc" x="752" y="166">With authority you granted it,</text>
    <text class="indirect-injection-path-desc" x="752" y="182">for a purpose you did not.</text>
    <text class="indirect-injection-path-edge" x="752" y="242">the action</text>
  </g>
  <text class="indirect-injection-path-sub" x="30" y="304">The attacker never interacts with your system, which is what makes this different from every threat model written before 2023: the input path is your own retrieval pipeline doing exactly what it was built to do.</text>
</svg>
