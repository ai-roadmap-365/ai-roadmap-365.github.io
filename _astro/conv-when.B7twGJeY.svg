<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And where the assumption is wrong.">
  <title>Where convolution belongs</title>
  <style>
    .conv-when-bg   { fill: #f8fafc; }
    .conv-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .conv-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .conv-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .conv-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .conv-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .conv-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .conv-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .conv-when-row { opacity: 1; }
    .conv-when-r0 { animation-delay: 0.00s; }
    .conv-when-r1 { animation-delay: 0.45s; }
    .conv-when-r2 { animation-delay: 0.90s; }
    .conv-when-r3 { animation-delay: 1.35s; }
    .conv-when-r4 { animation-delay: 1.80s; }
    .conv-when-row { animation: conv-when-reveal 7.3s ease-in-out infinite; }
    @keyframes conv-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="conv-when-bg" width="980" height="390"/>
  <text class="conv-when-h1"  x="30" y="40">Where convolution belongs</text>
  <text class="conv-when-sub" x="30" y="64">And where the assumption is wrong.</text>
  <rect class="conv-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="conv-when-name" x="46" y="122">Use it</text>
  <text class="conv-when-desc" x="46" y="142">Where position means adjacency.</text>
  <text class="conv-when-desc conv-when-row conv-when-r0" x="46" y="182">Images, video frames, spectrograms</text>
  <text class="conv-when-desc conv-when-row conv-when-r1" x="46" y="216">Medical scans and satellite imagery</text>
  <text class="conv-when-desc conv-when-row conv-when-r2" x="46" y="250">Anywhere neighbouring values are related</text>
  <text class="conv-when-desc conv-when-row conv-when-r3" x="46" y="284">Low-latency inference on constrained hardware</text>
  <text class="conv-when-desc conv-when-row conv-when-r4" x="46" y="318">One dimension for signals, three for volumes</text>
  <rect class="conv-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="conv-when-name" x="526" y="122">Do not</text>
  <text class="conv-when-desc" x="526" y="142">Where it is not.</text>
  <text class="conv-when-desc conv-when-row conv-when-r0" x="526" y="182">Tabular data — column order is arbitrary</text>
  <text class="conv-when-desc conv-when-row conv-when-r1" x="526" y="216">Long text — attention dominates</text>
  <text class="conv-when-desc conv-when-row conv-when-r2" x="526" y="250">Anywhere adjacency is meaningless</text>
  <text class="conv-when-desc conv-when-row conv-when-r3" x="526" y="284">The assumption is not neutral</text>
  <text class="conv-when-desc conv-when-row conv-when-r4" x="526" y="318">A wrong assumption costs accuracy</text>
  <text class="conv-when-sub" x="30" y="372">Column ordering in a table is the clearest case: adjacent columns have no relationship at all, so a convolution over them is enforcing a structure the data does not have.</text>
</svg>
