<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Expensive and stable first; cheap and volatile last.">
  <title>The ordering rule</title>
  <style>
    .order-expensive-first-bg   { fill: #f8fafc; }
    .order-expensive-first-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .order-expensive-first-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .order-expensive-first-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .order-expensive-first-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .order-expensive-first-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .order-expensive-first-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .order-expensive-first-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .order-expensive-first-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .order-expensive-first-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .order-expensive-first-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .order-expensive-first-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .order-expensive-first-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .order-expensive-first-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .order-expensive-first-stage { opacity: 1; }

    .order-expensive-first-s0 { animation-delay: 0.00s; }
    .order-expensive-first-e0 { animation-delay: 0.00s; }
    .order-expensive-first-s1 { animation-delay: 1.28s; }
    .order-expensive-first-e1 { animation-delay: 1.28s; }
    .order-expensive-first-s2 { animation-delay: 2.56s; }
    .order-expensive-first-e2 { animation-delay: 2.56s; }
    .order-expensive-first-s3 { animation-delay: 3.84s; }
    .order-expensive-first-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .order-expensive-first-conn  { animation: order-expensive-first-trace 6.4s ease-in-out infinite; }
      .order-expensive-first-stage { animation: order-expensive-first-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes order-expensive-first-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes order-expensive-first-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .order-expensive-first-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .order-expensive-first-stage { animation: order-expensive-first-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes order-expensive-first-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="order-expensive-first-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="order-expensive-first-bg" width="980" height="322"/>
  <text class="order-expensive-first-h1"  x="30" y="40">The ordering rule</text>
  <text class="order-expensive-first-sub" x="30" y="64">Expensive and stable first; cheap and volatile last.</text>
  <g class="order-expensive-first-stage order-expensive-first-s0">
    <rect class="order-expensive-first-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="order-expensive-first-step" x="44" y="142">01</text>
    <text class="order-expensive-first-name" x="70" y="142">Base image</text>
    <text class="order-expensive-first-desc" x="44" y="166">Changes rarely. Pin the tag, and</text>
    <text class="order-expensive-first-desc" x="44" y="182">the digest when reproducibility</text>
    <text class="order-expensive-first-desc" x="44" y="198">matters.</text>
  </g>
  <line class="order-expensive-first-line order-expensive-first-conn order-expensive-first-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#order-expensive-first-tip)"/>
  <g class="order-expensive-first-stage order-expensive-first-s1">
    <rect class="order-expensive-first-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="order-expensive-first-step" x="280" y="142">02</text>
    <text class="order-expensive-first-name" x="306" y="142">System packages</text>
    <text class="order-expensive-first-desc" x="280" y="166">Expensive, and changes with the</text>
    <text class="order-expensive-first-desc" x="280" y="182">manifest rather than with your</text>
    <text class="order-expensive-first-desc" x="280" y="198">code.</text>
  </g>
  <line class="order-expensive-first-line order-expensive-first-conn order-expensive-first-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#order-expensive-first-tip)"/>
  <g class="order-expensive-first-stage order-expensive-first-s2">
    <rect class="order-expensive-first-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="order-expensive-first-step" x="516" y="142">03</text>
    <text class="order-expensive-first-name" x="542" y="142">Dependency install</text>
    <text class="order-expensive-first-desc" x="516" y="166">The expensive layer. It must sit</text>
    <text class="order-expensive-first-desc" x="516" y="182">above the source copy.</text>
    <text class="order-expensive-first-edge" x="516" y="242">minutes</text>
  </g>
  <line class="order-expensive-first-line order-expensive-first-conn order-expensive-first-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#order-expensive-first-tip)"/>
  <g class="order-expensive-first-stage order-expensive-first-s3">
    <rect class="order-expensive-first-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="order-expensive-first-step" x="752" y="142">04</text>
    <text class="order-expensive-first-name" x="778" y="142">Application source</text>
    <text class="order-expensive-first-desc" x="752" y="166">Cheap, and changes every few</text>
    <text class="order-expensive-first-desc" x="752" y="182">minutes. Last.</text>
    <text class="order-expensive-first-edge" x="752" y="242">seconds</text>
  </g>
  <text class="order-expensive-first-sub" x="30" y="304">Read the rule as a sort: every instruction has a cost and a change frequency, and the correct order is descending cost, which for a Python service happens to be ascending volatility as well.</text>
</svg>
