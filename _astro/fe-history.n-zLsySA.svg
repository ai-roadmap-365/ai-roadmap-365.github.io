<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Displaced, except on tabular data.">
  <title>Four steps in feature engineering</title>
  <style>
    .fe-history-bg   { fill: #f8fafc; }
    .fe-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fe-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fe-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fe-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fe-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fe-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fe-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fe-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fe-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fe-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fe-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fe-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .fe-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .fe-history-stage { opacity: 1; }

    .fe-history-s0 { animation-delay: 0.00s; }
    .fe-history-e0 { animation-delay: 0.00s; }
    .fe-history-s1 { animation-delay: 1.28s; }
    .fe-history-e1 { animation-delay: 1.28s; }
    .fe-history-s2 { animation-delay: 2.56s; }
    .fe-history-e2 { animation-delay: 2.56s; }
    .fe-history-s3 { animation-delay: 3.84s; }
    .fe-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .fe-history-conn  { animation: fe-history-trace 6.4s ease-in-out infinite; }
      .fe-history-stage { animation: fe-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes fe-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes fe-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .fe-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .fe-history-stage { animation: fe-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes fe-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="fe-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="fe-history-bg" width="980" height="322"/>
  <text class="fe-history-h1"  x="30" y="40">Four steps in feature engineering</text>
  <text class="fe-history-sub" x="30" y="64">Displaced, except on tabular data.</text>
  <g class="fe-history-stage fe-history-s0">
    <rect class="fe-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="fe-history-step" x="44" y="142">01</text>
    <text class="fe-history-name" x="70" y="142">Everything hand-crafted, in every domain</text>
    <text class="fe-history-desc" x="44" y="166">Including edge detectors for</text>
    <text class="fe-history-desc" x="44" y="182">images and word counts for text.</text>
  </g>
  <line class="fe-history-line fe-history-conn fe-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#fe-history-tip)"/>
  <g class="fe-history-stage fe-history-s1">
    <rect class="fe-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="fe-history-step" x="280" y="142">02</text>
    <text class="fe-history-name" x="306" y="142">Domain-specific feature libraries emerged</text>
    <text class="fe-history-desc" x="280" y="166">Standardised, and still manual.</text>
  </g>
  <line class="fe-history-line fe-history-conn fe-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#fe-history-tip)"/>
  <g class="fe-history-stage fe-history-s2">
    <rect class="fe-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="fe-history-step" x="516" y="142">03</text>
    <text class="fe-history-name" x="542" y="142">Then networks learned representations directly</text>
    <text class="fe-history-desc" x="516" y="166">Which ended manual features for</text>
    <text class="fe-history-desc" x="516" y="182">images, audio and text.</text>
  </g>
  <line class="fe-history-line fe-history-conn fe-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#fe-history-tip)"/>
  <g class="fe-history-stage fe-history-s3">
    <rect class="fe-history-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="fe-history-step" x="752" y="142">04</text>
    <text class="fe-history-name" x="778" y="142">But not for tabular data</text>
    <text class="fe-history-desc" x="752" y="166">Where hand-built features still</text>
    <text class="fe-history-desc" x="752" y="182">win.</text>
  </g>
  <text class="fe-history-sub" x="30" y="304">The tabular exception has held for a decade despite repeated attempts, which is the same result that keeps boosted trees dominant there.</text>
</svg>
