<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Streaming markdown is not actuation.">
  <title>An agent is not a chatbot</title>
  <style>
    .agent-or-chatbot-bg   { fill: #f8fafc; }
    .agent-or-chatbot-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-or-chatbot-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-or-chatbot-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-or-chatbot-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-or-chatbot-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-or-chatbot-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .agent-or-chatbot-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .agent-or-chatbot-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .agent-or-chatbot-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .agent-or-chatbot-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .agent-or-chatbot-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .agent-or-chatbot-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .agent-or-chatbot-row { opacity: 1; }
    .agent-or-chatbot-r0 { animation-delay: 0.00s; }
    .agent-or-chatbot-r1 { animation-delay: 0.45s; }
    .agent-or-chatbot-r2 { animation-delay: 0.90s; }
    .agent-or-chatbot-r3 { animation-delay: 1.35s; }
    .agent-or-chatbot-r4 { animation-delay: 1.80s; }
    .agent-or-chatbot-row { animation: agent-or-chatbot-reveal 7.3s ease-in-out infinite; }
    @keyframes agent-or-chatbot-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="agent-or-chatbot-bg" width="980" height="390"/>
  <text class="agent-or-chatbot-h1"  x="30" y="40">An agent is not a chatbot</text>
  <text class="agent-or-chatbot-sub" x="30" y="64">Streaming markdown is not actuation.</text>
  <rect class="agent-or-chatbot-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="agent-or-chatbot-name" x="46" y="122">An agent</text>
  <text class="agent-or-chatbot-desc" x="46" y="142">Changes something.</text>
  <text class="agent-or-chatbot-desc agent-or-chatbot-row agent-or-chatbot-r0" x="46" y="182">Invokes tools with real effects</text>
  <text class="agent-or-chatbot-desc agent-or-chatbot-row agent-or-chatbot-r1" x="46" y="216">Reads results and adjusts</text>
  <text class="agent-or-chatbot-desc agent-or-chatbot-row agent-or-chatbot-r2" x="46" y="250">Holds state across many turns</text>
  <text class="agent-or-chatbot-desc agent-or-chatbot-row agent-or-chatbot-r3" x="46" y="284">Has a budget and a stopping rule</text>
  <text class="agent-or-chatbot-desc agent-or-chatbot-row agent-or-chatbot-r4" x="46" y="318">Produces a verified artefact</text>
  <rect class="agent-or-chatbot-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="agent-or-chatbot-name" x="526" y="122">A chatbot</text>
  <text class="agent-or-chatbot-desc" x="526" y="142">Says something.</text>
  <text class="agent-or-chatbot-desc agent-or-chatbot-row agent-or-chatbot-r0" x="526" y="182">Streams tokens to a frontend</text>
  <text class="agent-or-chatbot-desc agent-or-chatbot-row agent-or-chatbot-r1" x="526" y="216">No environment to observe</text>
  <text class="agent-or-chatbot-desc agent-or-chatbot-row agent-or-chatbot-r2" x="526" y="250">State is the conversation only</text>
  <text class="agent-or-chatbot-desc agent-or-chatbot-row agent-or-chatbot-r3" x="526" y="284">Bounded by the user's patience</text>
  <text class="agent-or-chatbot-desc agent-or-chatbot-row agent-or-chatbot-r4" x="526" y="318">Produces text</text>
  <text class="agent-or-chatbot-sub" x="30" y="372">A chat interface can be the front end of an agent and frequently is, which is why the distinction has to be drawn at the actuation boundary rather than at the user interface.</text>
</svg>
