<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Who will not ask questions.">
  <title>Briefing a capable stranger</title>
  <style>
    .briefing-bg   { fill: #f8fafc; }
    .briefing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .briefing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .briefing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .briefing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .briefing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .briefing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .briefing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .briefing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .briefing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .briefing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .briefing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .briefing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .briefing-row { opacity: 1; }
    .briefing-r0 { animation-delay: 0.00s; }
    .briefing-r1 { animation-delay: 0.45s; }
    .briefing-r2 { animation-delay: 0.90s; }
    .briefing-r3 { animation-delay: 1.35s; }
    .briefing-r4 { animation-delay: 1.80s; }
    .briefing-row { animation: briefing-reveal 7.3s ease-in-out infinite; }
    @keyframes briefing-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="briefing-bg" width="980" height="390"/>
  <text class="briefing-h1"  x="30" y="40">Briefing a capable stranger</text>
  <text class="briefing-sub" x="30" y="64">Who will not ask questions.</text>
  <rect class="briefing-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="briefing-name" x="46" y="122">A vague brief</text>
  <text class="briefing-desc" x="46" y="142">Assumes shared context.</text>
  <text class="briefing-desc briefing-row briefing-r0" x="46" y="182">Write something about the launch</text>
  <text class="briefing-desc briefing-row briefing-r1" x="46" y="216">No audience or length given</text>
  <text class="briefing-desc briefing-row briefing-r2" x="46" y="250">No example of what good looks like</text>
  <text class="briefing-desc briefing-row briefing-r3" x="46" y="284">No format specified</text>
  <text class="briefing-desc briefing-row briefing-r4" x="46" y="318">And they will not ask</text>
  <rect class="briefing-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="briefing-name" x="526" y="122">A complete brief</text>
  <text class="briefing-desc" x="526" y="142">Assumes nothing.</text>
  <text class="briefing-desc briefing-row briefing-r0" x="526" y="182">Audience, purpose and length stated</text>
  <text class="briefing-desc briefing-row briefing-r1" x="526" y="216">Two examples of acceptable work</text>
  <text class="briefing-desc briefing-row briefing-r2" x="526" y="250">The format written out</text>
  <text class="briefing-desc briefing-row briefing-r3" x="526" y="284">Constraints made explicit</text>
  <text class="briefing-desc briefing-row briefing-r4" x="526" y="318">And the source material attached</text>
  <text class="briefing-sub" x="30" y="372">The stranger is capable and has no context, which is exactly the right mental model: everything a colleague would infer has to be written down.</text>
</svg>
