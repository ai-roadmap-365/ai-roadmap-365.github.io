<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Terminating your TLS and starting its own.">
  <title>What a corporate proxy is actually doing</title>
  <style>
    .intercepting-proxy-bg   { fill: #f8fafc; }
    .intercepting-proxy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .intercepting-proxy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .intercepting-proxy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .intercepting-proxy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .intercepting-proxy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .intercepting-proxy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .intercepting-proxy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .intercepting-proxy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .intercepting-proxy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .intercepting-proxy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .intercepting-proxy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .intercepting-proxy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .intercepting-proxy-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .intercepting-proxy-stage { opacity: 1; }

    .intercepting-proxy-s0 { animation-delay: 0.00s; }
    .intercepting-proxy-e0 { animation-delay: 0.00s; }
    .intercepting-proxy-s1 { animation-delay: 1.28s; }
    .intercepting-proxy-e1 { animation-delay: 1.28s; }
    .intercepting-proxy-s2 { animation-delay: 2.56s; }
    .intercepting-proxy-e2 { animation-delay: 2.56s; }
    .intercepting-proxy-s3 { animation-delay: 3.84s; }
    .intercepting-proxy-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .intercepting-proxy-conn  { animation: intercepting-proxy-trace 6.4s ease-in-out infinite; }
      .intercepting-proxy-stage { animation: intercepting-proxy-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes intercepting-proxy-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes intercepting-proxy-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .intercepting-proxy-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .intercepting-proxy-stage { animation: intercepting-proxy-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes intercepting-proxy-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="intercepting-proxy-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="intercepting-proxy-bg" width="980" height="322"/>
  <text class="intercepting-proxy-h1"  x="30" y="40">What a corporate proxy is actually doing</text>
  <text class="intercepting-proxy-sub" x="30" y="64">Terminating your TLS and starting its own.</text>
  <g class="intercepting-proxy-stage intercepting-proxy-s0">
    <rect class="intercepting-proxy-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="intercepting-proxy-step" x="44" y="142">01</text>
    <text class="intercepting-proxy-name" x="70" y="142">Your connection stops at the proxy</text>
    <text class="intercepting-proxy-desc" x="44" y="166">Not at the site. The proxy</text>
    <text class="intercepting-proxy-desc" x="44" y="182">completes the handshake with</text>
    <text class="intercepting-proxy-desc" x="44" y="198">you.</text>
  </g>
  <line class="intercepting-proxy-line intercepting-proxy-conn intercepting-proxy-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#intercepting-proxy-tip)"/>
  <g class="intercepting-proxy-stage intercepting-proxy-s1">
    <rect class="intercepting-proxy-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="intercepting-proxy-step" x="280" y="142">02</text>
    <text class="intercepting-proxy-name" x="306" y="142">It decrypts everything</text>
    <text class="intercepting-proxy-desc" x="280" y="166">In the clear, on their</text>
    <text class="intercepting-proxy-desc" x="280" y="182">equipment. That is the point of</text>
    <text class="intercepting-proxy-desc" x="280" y="198">deploying it.</text>
  </g>
  <line class="intercepting-proxy-line intercepting-proxy-conn intercepting-proxy-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#intercepting-proxy-tip)"/>
  <g class="intercepting-proxy-stage intercepting-proxy-s2">
    <rect class="intercepting-proxy-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="intercepting-proxy-step" x="516" y="142">03</text>
    <text class="intercepting-proxy-name" x="542" y="142">Then makes its own connection onward</text>
    <text class="intercepting-proxy-desc" x="516" y="166">A second, separate TLS session</text>
    <text class="intercepting-proxy-desc" x="516" y="182">to the real site.</text>
  </g>
  <line class="intercepting-proxy-line intercepting-proxy-conn intercepting-proxy-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#intercepting-proxy-tip)"/>
  <g class="intercepting-proxy-stage intercepting-proxy-s3">
    <rect class="intercepting-proxy-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="intercepting-proxy-step" x="752" y="142">04</text>
    <text class="intercepting-proxy-name" x="778" y="142">And signs with its own root</text>
    <text class="intercepting-proxy-desc" x="752" y="166">Installed on managed machines,</text>
    <text class="intercepting-proxy-desc" x="752" y="182">which is why it does not warn</text>
    <text class="intercepting-proxy-desc" x="752" y="198">there.</text>
    <text class="intercepting-proxy-edge" x="752" y="242">their root</text>
  </g>
  <text class="intercepting-proxy-sub" x="30" y="304">This is why work laptops see "self signed certificate in certificate chain" from tools that do not use the system trust store. The fix is to point the tool at the corporate root, never to disable verification.</text>
</svg>
