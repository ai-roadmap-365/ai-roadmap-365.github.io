<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One is a secret you must not lose.">
  <title>Five consequences worth designing for</title>
  <style>
    .privacy-implications-bg   { fill: #f8fafc; }
    .privacy-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .privacy-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .privacy-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .privacy-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .privacy-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .privacy-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .privacy-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .privacy-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .privacy-implications-stage { opacity: 1; }

    .privacy-implications-s0 { animation-delay: 0.00s; }
    .privacy-implications-e0 { animation-delay: 0.00s; }
    .privacy-implications-s1 { animation-delay: 1.33s; }
    .privacy-implications-e1 { animation-delay: 1.33s; }
    .privacy-implications-s2 { animation-delay: 2.67s; }
    .privacy-implications-e2 { animation-delay: 2.67s; }
    .privacy-implications-s3 { animation-delay: 4.00s; }
    .privacy-implications-e3 { animation-delay: 4.00s; }
    .privacy-implications-s4 { animation-delay: 5.33s; }
    .privacy-implications-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .privacy-implications-conn  { animation: privacy-implications-trace 8s ease-in-out infinite; }
      .privacy-implications-stage { animation: privacy-implications-arrive 8s ease-in-out infinite; }
    }
    @keyframes privacy-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes privacy-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .privacy-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .privacy-implications-stage { animation: privacy-implications-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes privacy-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="privacy-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="privacy-implications-bg" width="980" height="322"/>
  <text class="privacy-implications-h1"  x="30" y="40">Five consequences worth designing for</text>
  <text class="privacy-implications-sub" x="30" y="64">One is a secret you must not lose.</text>
  <g class="privacy-implications-stage privacy-implications-s0">
    <rect class="privacy-implications-warn" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="privacy-implications-step" x="44" y="142">01</text>
    <text class="privacy-implications-name" x="70" y="142">The salt is a secret</text>
    <text class="privacy-implications-desc" x="44" y="166">Compromise turns every</text>
    <text class="privacy-implications-desc" x="44" y="182">pseudonym into a lookup —</text>
    <text class="privacy-implications-desc" x="44" y="198">the value spaces are</text>
    <text class="privacy-implications-edge" x="44" y="242">store it apart</text>
  </g>
  <line class="privacy-implications-line privacy-implications-conn privacy-implications-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#privacy-implications-tip)"/>
  <g class="privacy-implications-stage privacy-implications-s1">
    <rect class="privacy-implications-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="privacy-implications-step" x="233" y="142">02</text>
    <text class="privacy-implications-name" x="259" y="142">Embeddings are not anonymous</text>
    <text class="privacy-implications-desc" x="233" y="166">A vector index inherits</text>
    <text class="privacy-implications-desc" x="233" y="182">every obligation the</text>
    <text class="privacy-implications-desc" x="233" y="198">source documents carry.</text>
  </g>
  <line class="privacy-implications-line privacy-implications-conn privacy-implications-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#privacy-implications-tip)"/>
  <g class="privacy-implications-stage privacy-implications-s2">
    <rect class="privacy-implications-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="privacy-implications-step" x="422" y="142">03</text>
    <text class="privacy-implications-name" x="448" y="142">Redaction is negligible</text>
    <text class="privacy-implications-desc" x="422" y="166">A regex pass at</text>
    <text class="privacy-implications-desc" x="422" y="182">ingestion, next to</text>
    <text class="privacy-implications-desc" x="422" y="198">extraction and embedding.</text>
  </g>
  <line class="privacy-implications-line privacy-implications-conn privacy-implications-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#privacy-implications-tip)"/>
  <g class="privacy-implications-stage privacy-implications-s3">
    <rect class="privacy-implications-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="privacy-implications-step" x="611" y="142">04</text>
    <text class="privacy-implications-name" x="637" y="142">The flow record stays small</text>
    <text class="privacy-implications-desc" x="611" y="166">It grows with subjects</text>
    <text class="privacy-implications-desc" x="611" y="182">and stores, not with data</text>
    <text class="privacy-implications-desc" x="611" y="198">volume.</text>
  </g>
  <line class="privacy-implications-line privacy-implications-conn privacy-implications-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#privacy-implications-tip)"/>
  <g class="privacy-implications-stage privacy-implications-s4">
    <rect class="privacy-implications-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="privacy-implications-step" x="800" y="142">05</text>
    <text class="privacy-implications-name" x="826" y="142">Retention is a cost and a risk</text>
    <text class="privacy-implications-desc" x="800" y="166">Traces are usually the</text>
    <text class="privacy-implications-desc" x="800" y="182">largest and</text>
    <text class="privacy-implications-desc" x="800" y="198">least-examined store.</text>
  </g>
  <text class="privacy-implications-sub" x="30" y="304">Re-embedding after a redaction change is the expensive part of erasure, which is the strongest practical argument for redacting at the boundary rather than fixing it later.</text>
</svg>
