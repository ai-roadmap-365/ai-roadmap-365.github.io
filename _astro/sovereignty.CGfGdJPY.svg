<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four constraints that override cost.">
  <title>When the decision is not economic</title>
  <style>
    .sovereignty-bg   { fill: #f8fafc; }
    .sovereignty-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sovereignty-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sovereignty-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sovereignty-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sovereignty-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sovereignty-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sovereignty-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sovereignty-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sovereignty-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sovereignty-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sovereignty-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sovereignty-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .sovereignty-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .sovereignty-stage { opacity: 1; }

    .sovereignty-s0 { animation-delay: 0.00s; }
    .sovereignty-e0 { animation-delay: 0.00s; }
    .sovereignty-s1 { animation-delay: 1.28s; }
    .sovereignty-e1 { animation-delay: 1.28s; }
    .sovereignty-s2 { animation-delay: 2.56s; }
    .sovereignty-e2 { animation-delay: 2.56s; }
    .sovereignty-s3 { animation-delay: 3.84s; }
    .sovereignty-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .sovereignty-conn  { animation: sovereignty-trace 6.4s ease-in-out infinite; }
      .sovereignty-stage { animation: sovereignty-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes sovereignty-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes sovereignty-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .sovereignty-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .sovereignty-stage { animation: sovereignty-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes sovereignty-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="sovereignty-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="sovereignty-bg" width="980" height="322"/>
  <text class="sovereignty-h1"  x="30" y="40">When the decision is not economic</text>
  <text class="sovereignty-sub" x="30" y="64">Four constraints that override cost.</text>
  <g class="sovereignty-stage sovereignty-s0">
    <rect class="sovereignty-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="sovereignty-step" x="44" y="142">01</text>
    <text class="sovereignty-name" x="70" y="142">Data residency requirements</text>
    <text class="sovereignty-desc" x="44" y="166">Which name a jurisdiction the</text>
    <text class="sovereignty-desc" x="44" y="182">processing must stay inside.</text>
  </g>
  <line class="sovereignty-line sovereignty-conn sovereignty-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#sovereignty-tip)"/>
  <g class="sovereignty-stage sovereignty-s1">
    <rect class="sovereignty-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="sovereignty-step" x="280" y="142">02</text>
    <text class="sovereignty-name" x="306" y="142">Sector regulation</text>
    <text class="sovereignty-desc" x="280" y="166">Health, finance and government,</text>
    <text class="sovereignty-desc" x="280" y="182">each with its own rules.</text>
  </g>
  <line class="sovereignty-line sovereignty-conn sovereignty-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#sovereignty-tip)"/>
  <g class="sovereignty-stage sovereignty-s2">
    <rect class="sovereignty-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="sovereignty-step" x="516" y="142">03</text>
    <text class="sovereignty-name" x="542" y="142">Customer contracts</text>
    <text class="sovereignty-desc" x="516" y="166">Which frequently prohibit</text>
    <text class="sovereignty-desc" x="516" y="182">third-party processing outright.</text>
  </g>
  <line class="sovereignty-line sovereignty-conn sovereignty-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#sovereignty-tip)"/>
  <g class="sovereignty-stage sovereignty-s3">
    <rect class="sovereignty-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="sovereignty-step" x="752" y="142">04</text>
    <text class="sovereignty-name" x="778" y="142">Or no external network at all</text>
    <text class="sovereignty-desc" x="752" y="166">Where a hosted API is simply not</text>
    <text class="sovereignty-desc" x="752" y="182">an option.</text>
  </g>
  <text class="sovereignty-sub" x="30" y="304">These override the cost calculation rather than feeding into it: where they apply, the only question left is which open model to run, not whether to run one.</text>
</svg>
