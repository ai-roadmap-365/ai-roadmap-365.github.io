<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Regularisation</title>
  <style>
    .reg-idea-bg   { fill: #f8fafc; }
    .reg-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reg-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reg-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reg-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reg-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reg-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .reg-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .reg-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .reg-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .reg-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .reg-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .reg-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .reg-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .reg-idea-stage { opacity: 1; }

    .reg-idea-s0 { animation-delay: 0.00s; }
    .reg-idea-e0 { animation-delay: 0.00s; }
    .reg-idea-s1 { animation-delay: 1.28s; }
    .reg-idea-e1 { animation-delay: 1.28s; }
    .reg-idea-s2 { animation-delay: 2.56s; }
    .reg-idea-e2 { animation-delay: 2.56s; }
    .reg-idea-s3 { animation-delay: 3.84s; }
    .reg-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .reg-idea-conn  { animation: reg-idea-trace 6.4s ease-in-out infinite; }
      .reg-idea-stage { animation: reg-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes reg-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes reg-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .reg-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .reg-idea-stage { animation: reg-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes reg-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="reg-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="reg-idea-bg" width="980" height="322"/>
  <text class="reg-idea-h1"  x="30" y="40">Regularisation</text>
  <text class="reg-idea-sub" x="30" y="64">Four steps.</text>
  <g class="reg-idea-stage reg-idea-s0">
    <rect class="reg-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="reg-idea-step" x="44" y="142">01</text>
    <text class="reg-idea-name" x="70" y="142">Unpenalised fitting minimises error alone</text>
    <text class="reg-idea-desc" x="44" y="166">And will use any coefficient</text>
    <text class="reg-idea-desc" x="44" y="182">size to do it.</text>
  </g>
  <line class="reg-idea-line reg-idea-conn reg-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#reg-idea-tip)"/>
  <g class="reg-idea-stage reg-idea-s1">
    <rect class="reg-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="reg-idea-step" x="280" y="142">02</text>
    <text class="reg-idea-name" x="306" y="142">Add a penalty on coefficient magnitude</text>
    <text class="reg-idea-desc" x="280" y="166">So large coefficients must earn</text>
    <text class="reg-idea-desc" x="280" y="182">their size.</text>
  </g>
  <line class="reg-idea-line reg-idea-conn reg-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#reg-idea-tip)"/>
  <g class="reg-idea-stage reg-idea-s2">
    <rect class="reg-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="reg-idea-step" x="516" y="142">03</text>
    <text class="reg-idea-name" x="542" y="142">The fit now trades error against complexity</text>
    <text class="reg-idea-desc" x="516" y="166">Deliberately accepting a worse</text>
    <text class="reg-idea-desc" x="516" y="182">training fit.</text>
  </g>
  <line class="reg-idea-line reg-idea-conn reg-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#reg-idea-tip)"/>
  <g class="reg-idea-stage reg-idea-s3">
    <rect class="reg-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="reg-idea-step" x="752" y="142">04</text>
    <text class="reg-idea-name" x="778" y="142">With one parameter controlling the balance</text>
    <text class="reg-idea-desc" x="752" y="166">Chosen on validation data.</text>
    <text class="reg-idea-edge" x="752" y="242">one dial</text>
  </g>
  <text class="reg-idea-sub" x="30" y="304">Deliberately accepting a worse training fit is the whole idea, and it is why regularisation looks like sabotage until the validation score is checked.</text>
</svg>
