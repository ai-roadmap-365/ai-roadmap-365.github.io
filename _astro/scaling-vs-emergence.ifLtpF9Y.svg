<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The gap between them.">
  <title>Predictable loss, unpredictable capability</title>
  <style>
    .scaling-vs-emergence-bg   { fill: #f8fafc; }
    .scaling-vs-emergence-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-vs-emergence-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-vs-emergence-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-vs-emergence-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-vs-emergence-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-vs-emergence-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scaling-vs-emergence-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scaling-vs-emergence-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scaling-vs-emergence-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scaling-vs-emergence-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scaling-vs-emergence-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scaling-vs-emergence-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scaling-vs-emergence-row { opacity: 1; }
    .scaling-vs-emergence-r0 { animation-delay: 0.00s; }
    .scaling-vs-emergence-r1 { animation-delay: 0.45s; }
    .scaling-vs-emergence-r2 { animation-delay: 0.90s; }
    .scaling-vs-emergence-r3 { animation-delay: 1.35s; }
    .scaling-vs-emergence-r4 { animation-delay: 1.80s; }
    .scaling-vs-emergence-row { animation: scaling-vs-emergence-reveal 7.3s ease-in-out infinite; }
    @keyframes scaling-vs-emergence-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="scaling-vs-emergence-bg" width="980" height="390"/>
  <text class="scaling-vs-emergence-h1"  x="30" y="40">Predictable loss, unpredictable capability</text>
  <text class="scaling-vs-emergence-sub" x="30" y="64">The gap between them.</text>
  <rect class="scaling-vs-emergence-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="scaling-vs-emergence-name" x="46" y="122">Loss</text>
  <text class="scaling-vs-emergence-desc" x="46" y="142">Predictable.</text>
  <text class="scaling-vs-emergence-desc scaling-vs-emergence-row scaling-vs-emergence-r0" x="46" y="182">Falls as a smooth power law</text>
  <text class="scaling-vs-emergence-desc scaling-vs-emergence-row scaling-vs-emergence-r1" x="46" y="216">Extrapolates reliably</text>
  <text class="scaling-vs-emergence-desc scaling-vs-emergence-row scaling-vs-emergence-r2" x="46" y="250">Fitted from small runs</text>
  <text class="scaling-vs-emergence-desc scaling-vs-emergence-row scaling-vs-emergence-r3" x="46" y="284">The basis of every training plan</text>
  <text class="scaling-vs-emergence-desc scaling-vs-emergence-row scaling-vs-emergence-r4" x="46" y="318">And measurable continuously</text>
  <rect class="scaling-vs-emergence-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="scaling-vs-emergence-name" x="526" y="122">Capability</text>
  <text class="scaling-vs-emergence-desc" x="526" y="142">Much less so.</text>
  <text class="scaling-vs-emergence-desc scaling-vs-emergence-row scaling-vs-emergence-r0" x="526" y="182">Task performance moves unevenly</text>
  <text class="scaling-vs-emergence-desc scaling-vs-emergence-row scaling-vs-emergence-r1" x="526" y="216">Thresholds appear in the metrics</text>
  <text class="scaling-vs-emergence-desc scaling-vs-emergence-row scaling-vs-emergence-r2" x="526" y="250">Hard to forecast in advance</text>
  <text class="scaling-vs-emergence-desc scaling-vs-emergence-row scaling-vs-emergence-r3" x="526" y="284">Which is what users actually care about</text>
  <text class="scaling-vs-emergence-desc scaling-vs-emergence-row scaling-vs-emergence-r4" x="526" y="318">And what safety work needs predicted</text>
  <text class="scaling-vs-emergence-sub" x="30" y="372">This gap is the honest limit of scaling laws: they forecast the objective precisely and forecast the reason anyone trains the model only loosely.</text>
</svg>
