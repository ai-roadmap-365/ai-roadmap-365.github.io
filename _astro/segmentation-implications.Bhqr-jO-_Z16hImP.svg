<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are ethical.">
  <title>Four consequences of segmentation</title>
  <style>
    .segmentation-implications-bg   { fill: #f8fafc; }
    .segmentation-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .segmentation-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .segmentation-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .segmentation-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .segmentation-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .segmentation-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .segmentation-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .segmentation-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .segmentation-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .segmentation-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .segmentation-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .segmentation-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .segmentation-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .segmentation-implications-stage { opacity: 1; }

    .segmentation-implications-s0 { animation-delay: 0.00s; }
    .segmentation-implications-e0 { animation-delay: 0.00s; }
    .segmentation-implications-s1 { animation-delay: 1.28s; }
    .segmentation-implications-e1 { animation-delay: 1.28s; }
    .segmentation-implications-s2 { animation-delay: 2.56s; }
    .segmentation-implications-e2 { animation-delay: 2.56s; }
    .segmentation-implications-s3 { animation-delay: 3.84s; }
    .segmentation-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .segmentation-implications-conn  { animation: segmentation-implications-trace 6.4s ease-in-out infinite; }
      .segmentation-implications-stage { animation: segmentation-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes segmentation-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes segmentation-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .segmentation-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .segmentation-implications-stage { animation: segmentation-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes segmentation-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="segmentation-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="segmentation-implications-bg" width="980" height="322"/>
  <text class="segmentation-implications-h1"  x="30" y="40">Four consequences of segmentation</text>
  <text class="segmentation-implications-sub" x="30" y="64">Two are ethical.</text>
  <g class="segmentation-implications-stage segmentation-implications-s0">
    <rect class="segmentation-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="segmentation-implications-step" x="44" y="142">01</text>
    <text class="segmentation-implications-name" x="70" y="142">Differentiated treatment improves outcomes</text>
    <text class="segmentation-implications-desc" x="44" y="166">Which is the commercial</text>
    <text class="segmentation-implications-desc" x="44" y="182">justification.</text>
  </g>
  <line class="segmentation-implications-line segmentation-implications-conn segmentation-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#segmentation-implications-tip)"/>
  <g class="segmentation-implications-stage segmentation-implications-s1">
    <rect class="segmentation-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="segmentation-implications-step" x="280" y="142">02</text>
    <text class="segmentation-implications-name" x="306" y="142">But segments drift, so it needs periodic refitting</text>
    <text class="segmentation-implications-desc" x="280" y="166">With the drift itself monitored.</text>
  </g>
  <line class="segmentation-implications-line segmentation-implications-conn segmentation-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#segmentation-implications-tip)"/>
  <g class="segmentation-implications-stage segmentation-implications-s2">
    <rect class="segmentation-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="segmentation-implications-step" x="516" y="142">03</text>
    <text class="segmentation-implications-name" x="542" y="142">And behavioural histories are personal data</text>
    <text class="segmentation-implications-desc" x="516" y="166">With the handling obligations</text>
    <text class="segmentation-implications-desc" x="516" y="182">that implies.</text>
  </g>
  <line class="segmentation-implications-line segmentation-implications-conn segmentation-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#segmentation-implications-tip)"/>
  <g class="segmentation-implications-stage segmentation-implications-s3">
    <rect class="segmentation-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="segmentation-implications-step" x="752" y="142">04</text>
    <text class="segmentation-implications-name" x="778" y="142">While segments can proxy for protected characteristics</text>
    <text class="segmentation-implications-desc" x="752" y="166">Making differentiated treatment</text>
    <text class="segmentation-implications-desc" x="752" y="182">discriminatory.</text>
  </g>
  <text class="segmentation-implications-sub" x="30" y="304">The proxy risk is concrete: a segmentation on postcode and purchase history can reproduce a protected characteristic closely enough to matter legally.</text>
</svg>
