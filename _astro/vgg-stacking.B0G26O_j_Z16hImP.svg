<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Same receptive field, fewer parameters, more non-linearity.">
  <title>Why small kernels stacked</title>
  <style>
    .vgg-stacking-bg   { fill: #f8fafc; }
    .vgg-stacking-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vgg-stacking-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vgg-stacking-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vgg-stacking-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vgg-stacking-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vgg-stacking-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vgg-stacking-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .vgg-stacking-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .vgg-stacking-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .vgg-stacking-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .vgg-stacking-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .vgg-stacking-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .vgg-stacking-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .vgg-stacking-stage { opacity: 1; }

    .vgg-stacking-s0 { animation-delay: 0.00s; }
    .vgg-stacking-e0 { animation-delay: 0.00s; }
    .vgg-stacking-s1 { animation-delay: 1.28s; }
    .vgg-stacking-e1 { animation-delay: 1.28s; }
    .vgg-stacking-s2 { animation-delay: 2.56s; }
    .vgg-stacking-e2 { animation-delay: 2.56s; }
    .vgg-stacking-s3 { animation-delay: 3.84s; }
    .vgg-stacking-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .vgg-stacking-conn  { animation: vgg-stacking-trace 6.4s ease-in-out infinite; }
      .vgg-stacking-stage { animation: vgg-stacking-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes vgg-stacking-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes vgg-stacking-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .vgg-stacking-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .vgg-stacking-stage { animation: vgg-stacking-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes vgg-stacking-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="vgg-stacking-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="vgg-stacking-bg" width="980" height="322"/>
  <text class="vgg-stacking-h1"  x="30" y="40">Why small kernels stacked</text>
  <text class="vgg-stacking-sub" x="30" y="64">Same receptive field, fewer parameters, more non-linearity.</text>
  <g class="vgg-stacking-stage vgg-stacking-s0">
    <rect class="vgg-stacking-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="vgg-stacking-step" x="44" y="142">01</text>
    <text class="vgg-stacking-name" x="70" y="142">Three 3x3 layers see the same region</text>
    <text class="vgg-stacking-desc" x="44" y="166">As one 7x7 layer. Receptive</text>
    <text class="vgg-stacking-desc" x="44" y="182">field composes.</text>
  </g>
  <line class="vgg-stacking-line vgg-stacking-conn vgg-stacking-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#vgg-stacking-tip)"/>
  <g class="vgg-stacking-stage vgg-stacking-s1">
    <rect class="vgg-stacking-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="vgg-stacking-step" x="280" y="142">02</text>
    <text class="vgg-stacking-name" x="306" y="142">With about 45% fewer parameters</text>
    <text class="vgg-stacking-desc" x="280" y="166">Twenty-seven channel-squared</text>
    <text class="vgg-stacking-desc" x="280" y="182">against forty-nine.</text>
    <text class="vgg-stacking-edge" x="280" y="242">-45%</text>
  </g>
  <line class="vgg-stacking-line vgg-stacking-conn vgg-stacking-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#vgg-stacking-tip)"/>
  <g class="vgg-stacking-stage vgg-stacking-s2">
    <rect class="vgg-stacking-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="vgg-stacking-step" x="516" y="142">03</text>
    <text class="vgg-stacking-name" x="542" y="142">And three non-linearities instead of one</text>
    <text class="vgg-stacking-desc" x="516" y="166">Richer function approximation</text>
    <text class="vgg-stacking-desc" x="516" y="182">for less.</text>
  </g>
  <line class="vgg-stacking-line vgg-stacking-conn vgg-stacking-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#vgg-stacking-tip)"/>
  <g class="vgg-stacking-stage vgg-stacking-s3">
    <rect class="vgg-stacking-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="vgg-stacking-step" x="752" y="142">04</text>
    <text class="vgg-stacking-name" x="778" y="142">Which is why 3x3 became universal</text>
    <text class="vgg-stacking-desc" x="752" y="166">Large kernels essentially</text>
    <text class="vgg-stacking-desc" x="752" y="182">disappeared from vision</text>
    <text class="vgg-stacking-desc" x="752" y="198">architectures.</text>
  </g>
  <text class="vgg-stacking-sub" x="30" y="304">Getting more expressive power for fewer parameters is unusual enough to be worth noticing: most architectural choices trade one against the other, and this one improves both.</text>
</svg>
