<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label=""Regex" is a family, not a standard.">
  <title>Why a pattern moves badly between tools</title>
  <style>
    .regex-flavours-bg   { fill: #f8fafc; }
    .regex-flavours-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regex-flavours-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regex-flavours-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regex-flavours-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regex-flavours-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regex-flavours-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .regex-flavours-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .regex-flavours-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .regex-flavours-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .regex-flavours-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .regex-flavours-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .regex-flavours-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .regex-flavours-row { opacity: 1; }
    .regex-flavours-r0 { animation-delay: 0.00s; }
    .regex-flavours-r1 { animation-delay: 0.45s; }
    .regex-flavours-r2 { animation-delay: 0.90s; }
    .regex-flavours-r3 { animation-delay: 1.35s; }
    .regex-flavours-r4 { animation-delay: 1.80s; }
    .regex-flavours-row { animation: regex-flavours-reveal 7.3s ease-in-out infinite; }
    @keyframes regex-flavours-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="regex-flavours-bg" width="980" height="390"/>
  <text class="regex-flavours-h1"  x="30" y="40">Why a pattern moves badly between tools</text>
  <text class="regex-flavours-sub" x="30" y="64">"Regex" is a family, not a standard.</text>
  <rect class="regex-flavours-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="regex-flavours-name" x="46" y="122">Basic (grep, sed by default)</text>
  <text class="regex-flavours-desc" x="46" y="142">Older, and stricter.</text>
  <text class="regex-flavours-desc regex-flavours-row regex-flavours-r0" x="46" y="182">\\d usually unsupported — use [0-9]</text>
  <text class="regex-flavours-desc regex-flavours-row regex-flavours-r1" x="46" y="216">+ and ? need escaping, or -E</text>
  <text class="regex-flavours-desc regex-flavours-row regex-flavours-r2" x="46" y="250">No lookahead</text>
  <text class="regex-flavours-desc regex-flavours-row regex-flavours-r3" x="46" y="284">Parentheses need escaping to group</text>
  <text class="regex-flavours-desc regex-flavours-row regex-flavours-r4" x="46" y="318">Portable to almost anything</text>
  <rect class="regex-flavours-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="regex-flavours-name" x="526" y="122">Extended / Perl-style</text>
  <text class="regex-flavours-desc" x="526" y="142">grep -E, Python, editors.</text>
  <text class="regex-flavours-desc regex-flavours-row regex-flavours-r0" x="526" y="182">\\d, \\w, \\s all work</text>
  <text class="regex-flavours-desc regex-flavours-row regex-flavours-r1" x="526" y="216">+ and ? work unescaped</text>
  <text class="regex-flavours-desc regex-flavours-row regex-flavours-r2" x="526" y="250">Lookahead and lookbehind available</text>
  <text class="regex-flavours-desc regex-flavours-row regex-flavours-r3" x="526" y="284">Parentheses group directly</text>
  <text class="regex-flavours-desc regex-flavours-row regex-flavours-r4" x="526" y="318">What most tutorials assume</text>
  <text class="regex-flavours-sub" x="30" y="372">A pattern that works in your editor and fails in grep is almost always this, plus the shell eating backslashes. Single-quote patterns in the shell, always.</text>
</svg>
