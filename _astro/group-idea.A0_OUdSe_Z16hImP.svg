<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>What grouping does</title>
  <style>
    .group-idea-bg   { fill: #f8fafc; }
    .group-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .group-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .group-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .group-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .group-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .group-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .group-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .group-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .group-idea-stage { opacity: 1; }

    .group-idea-s0 { animation-delay: 0.00s; }
    .group-idea-e0 { animation-delay: 0.00s; }
    .group-idea-s1 { animation-delay: 1.28s; }
    .group-idea-e1 { animation-delay: 1.28s; }
    .group-idea-s2 { animation-delay: 2.56s; }
    .group-idea-e2 { animation-delay: 2.56s; }
    .group-idea-s3 { animation-delay: 3.84s; }
    .group-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .group-idea-conn  { animation: group-idea-trace 6.4s ease-in-out infinite; }
      .group-idea-stage { animation: group-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes group-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes group-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .group-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .group-idea-stage { animation: group-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes group-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="group-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="group-idea-bg" width="980" height="322"/>
  <text class="group-idea-h1"  x="30" y="40">What grouping does</text>
  <text class="group-idea-sub" x="30" y="64">Four steps.</text>
  <g class="group-idea-stage group-idea-s0">
    <rect class="group-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="group-idea-step" x="44" y="142">01</text>
    <text class="group-idea-name" x="70" y="142">Choose a key: one or more columns</text>
    <text class="group-idea-desc" x="44" y="166">Which defines the groups.</text>
  </g>
  <line class="group-idea-line group-idea-conn group-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#group-idea-tip)"/>
  <g class="group-idea-stage group-idea-s1">
    <rect class="group-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="group-idea-step" x="280" y="142">02</text>
    <text class="group-idea-name" x="306" y="142">Split the rows into one group per key value</text>
    <text class="group-idea-desc" x="280" y="166">Conceptually, not physically.</text>
  </g>
  <line class="group-idea-line group-idea-conn group-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#group-idea-tip)"/>
  <g class="group-idea-stage group-idea-s2">
    <rect class="group-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="group-idea-step" x="516" y="142">03</text>
    <text class="group-idea-name" x="542" y="142">Apply a function to each group independently</text>
    <text class="group-idea-desc" x="516" y="166">Aggregate, transform, or filter.</text>
  </g>
  <line class="group-idea-line group-idea-conn group-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#group-idea-tip)"/>
  <g class="group-idea-stage group-idea-s3">
    <rect class="group-idea-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="group-idea-step" x="752" y="142">04</text>
    <text class="group-idea-name" x="778" y="142">And combine the results back into one object</text>
    <text class="group-idea-desc" x="752" y="166">Indexed by the key.</text>
  </g>
  <text class="group-idea-sub" x="30" y="304">Split-apply-combine is one of the most transferable patterns in data work, and the same three words describe grouping in databases, spreadsheets and distributed engines.</text>
</svg>
