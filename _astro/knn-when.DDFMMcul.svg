<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to use nearest neighbours</title>
  <style>
    .knn-when-bg   { fill: #f8fafc; }
    .knn-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knn-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knn-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knn-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knn-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knn-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .knn-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .knn-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .knn-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .knn-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .knn-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .knn-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .knn-when-row { opacity: 1; }
    .knn-when-r0 { animation-delay: 0.00s; }
    .knn-when-r1 { animation-delay: 0.45s; }
    .knn-when-r2 { animation-delay: 0.90s; }
    .knn-when-r3 { animation-delay: 1.35s; }
    .knn-when-r4 { animation-delay: 1.80s; }
    .knn-when-row { animation: knn-when-reveal 7.3s ease-in-out infinite; }
    @keyframes knn-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="knn-when-bg" width="980" height="390"/>
  <text class="knn-when-h1"  x="30" y="40">When to use nearest neighbours</text>
  <text class="knn-when-sub" x="30" y="64">And when not to.</text>
  <rect class="knn-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="knn-when-name" x="46" y="122">Use it</text>
  <text class="knn-when-desc" x="46" y="142">Four cases.</text>
  <text class="knn-when-desc knn-when-row knn-when-r0" x="46" y="182">Small datasets with few features</text>
  <text class="knn-when-desc knn-when-row knn-when-r1" x="46" y="216">As a baseline that needs no fitting</text>
  <text class="knn-when-desc knn-when-row knn-when-r2" x="46" y="250">Recommendation by similarity</text>
  <text class="knn-when-desc knn-when-row knn-when-r3" x="46" y="284">Where explanation by example is wanted</text>
  <text class="knn-when-desc knn-when-row knn-when-r4" x="46" y="318">Where the boundary is irregular</text>
  <rect class="knn-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="knn-when-name" x="526" y="122">Do not</text>
  <text class="knn-when-desc" x="526" y="142">Also four.</text>
  <text class="knn-when-desc knn-when-row knn-when-r0" x="526" y="182">Large datasets with latency budgets</text>
  <text class="knn-when-desc knn-when-row knn-when-r1" x="526" y="216">High-dimensional raw features</text>
  <text class="knn-when-desc knn-when-row knn-when-r2" x="526" y="250">Where the training data is confidential</text>
  <text class="knn-when-desc knn-when-row knn-when-r3" x="526" y="284">Where features cannot be scaled reliably</text>
  <text class="knn-when-desc knn-when-row knn-when-r4" x="526" y="318">Streaming predictions at volume</text>
  <text class="knn-when-sub" x="30" y="372">The middle row of the second column rules it out more often than performance does: a model that ships its training set cannot hold confidential records.</text>
</svg>
