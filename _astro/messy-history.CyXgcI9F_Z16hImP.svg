<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward models that simply look.">
  <title>Four steps in document extraction</title>
  <style>
    .messy-history-bg   { fill: #f8fafc; }
    .messy-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .messy-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .messy-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .messy-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .messy-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .messy-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .messy-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .messy-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .messy-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .messy-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .messy-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .messy-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .messy-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .messy-history-stage { opacity: 1; }

    .messy-history-s0 { animation-delay: 0.00s; }
    .messy-history-e0 { animation-delay: 0.00s; }
    .messy-history-s1 { animation-delay: 1.28s; }
    .messy-history-e1 { animation-delay: 1.28s; }
    .messy-history-s2 { animation-delay: 2.56s; }
    .messy-history-e2 { animation-delay: 2.56s; }
    .messy-history-s3 { animation-delay: 3.84s; }
    .messy-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .messy-history-conn  { animation: messy-history-trace 6.4s ease-in-out infinite; }
      .messy-history-stage { animation: messy-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes messy-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes messy-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .messy-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .messy-history-stage { animation: messy-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes messy-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="messy-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="messy-history-bg" width="980" height="322"/>
  <text class="messy-history-h1"  x="30" y="40">Four steps in document extraction</text>
  <text class="messy-history-sub" x="30" y="64">Toward models that simply look.</text>
  <g class="messy-history-stage messy-history-s0">
    <rect class="messy-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="messy-history-step" x="44" y="142">01</text>
    <text class="messy-history-name" x="70" y="142">Format-specific parsers</text>
    <text class="messy-history-desc" x="44" y="166">One per format, each imperfect.</text>
  </g>
  <line class="messy-history-line messy-history-conn messy-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#messy-history-tip)"/>
  <g class="messy-history-stage messy-history-s1">
    <rect class="messy-history-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="messy-history-step" x="280" y="142">02</text>
    <text class="messy-history-name" x="306" y="142">Layout heuristics on top</text>
    <text class="messy-history-desc" x="280" y="166">Column detection, table</text>
    <text class="messy-history-desc" x="280" y="182">inference, reading order.</text>
  </g>
  <line class="messy-history-line messy-history-conn messy-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#messy-history-tip)"/>
  <g class="messy-history-stage messy-history-s2">
    <rect class="messy-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="messy-history-step" x="516" y="142">03</text>
    <text class="messy-history-name" x="542" y="142">Models trained on document structure</text>
    <text class="messy-history-desc" x="516" y="166">Learning layout rather than</text>
    <text class="messy-history-desc" x="516" y="182">encoding rules for it.</text>
  </g>
  <line class="messy-history-line messy-history-conn messy-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#messy-history-tip)"/>
  <g class="messy-history-stage messy-history-s3">
    <rect class="messy-history-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="messy-history-step" x="752" y="142">04</text>
    <text class="messy-history-name" x="778" y="142">Then general vision models reading the page</text>
    <text class="messy-history-desc" x="752" y="166">Which collapsed most of the</text>
    <text class="messy-history-desc" x="752" y="182">pipeline.</text>
  </g>
  <text class="messy-history-sub" x="30" y="304">Vision models did not remove the need for this stage so much as change its shape: extraction is now a routing decision about which documents need the expensive path.</text>
</svg>
