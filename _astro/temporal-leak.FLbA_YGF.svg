<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Temporal lookahead</title>
  <style>
    .temporal-leak-bg   { fill: #f8fafc; }
    .temporal-leak-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .temporal-leak-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .temporal-leak-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .temporal-leak-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .temporal-leak-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .temporal-leak-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .temporal-leak-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .temporal-leak-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .temporal-leak-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .temporal-leak-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .temporal-leak-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .temporal-leak-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .temporal-leak-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .temporal-leak-stage { opacity: 1; }

    .temporal-leak-s0 { animation-delay: 0.00s; }
    .temporal-leak-e0 { animation-delay: 0.00s; }
    .temporal-leak-s1 { animation-delay: 1.28s; }
    .temporal-leak-e1 { animation-delay: 1.28s; }
    .temporal-leak-s2 { animation-delay: 2.56s; }
    .temporal-leak-e2 { animation-delay: 2.56s; }
    .temporal-leak-s3 { animation-delay: 3.84s; }
    .temporal-leak-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .temporal-leak-conn  { animation: temporal-leak-trace 6.4s ease-in-out infinite; }
      .temporal-leak-stage { animation: temporal-leak-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes temporal-leak-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes temporal-leak-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .temporal-leak-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .temporal-leak-stage { animation: temporal-leak-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes temporal-leak-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="temporal-leak-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="temporal-leak-bg" width="980" height="322"/>
  <text class="temporal-leak-h1"  x="30" y="40">Temporal lookahead</text>
  <text class="temporal-leak-sub" x="30" y="64">Four steps.</text>
  <g class="temporal-leak-stage temporal-leak-s0">
    <rect class="temporal-leak-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="temporal-leak-step" x="44" y="142">01</text>
    <text class="temporal-leak-name" x="70" y="142">The data is ordered in time</text>
    <text class="temporal-leak-desc" x="44" y="166">Even when the column is not</text>
    <text class="temporal-leak-desc" x="44" y="182">obvious.</text>
  </g>
  <line class="temporal-leak-line temporal-leak-conn temporal-leak-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#temporal-leak-tip)"/>
  <g class="temporal-leak-stage temporal-leak-s1">
    <rect class="temporal-leak-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="temporal-leak-step" x="280" y="142">02</text>
    <text class="temporal-leak-name" x="306" y="142">A random split puts later rows in training</text>
    <text class="temporal-leak-desc" x="280" y="166">And earlier rows in validation.</text>
  </g>
  <line class="temporal-leak-line temporal-leak-conn temporal-leak-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#temporal-leak-tip)"/>
  <g class="temporal-leak-stage temporal-leak-s2">
    <rect class="temporal-leak-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="temporal-leak-step" x="516" y="142">03</text>
    <text class="temporal-leak-name" x="542" y="142">So the model predicts the past using the future</text>
    <text class="temporal-leak-desc" x="516" y="166">Which it will never be able to</text>
    <text class="temporal-leak-desc" x="516" y="182">do.</text>
  </g>
  <line class="temporal-leak-line temporal-leak-conn temporal-leak-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#temporal-leak-tip)"/>
  <g class="temporal-leak-stage temporal-leak-s3">
    <rect class="temporal-leak-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="temporal-leak-step" x="752" y="142">04</text>
    <text class="temporal-leak-name" x="778" y="142">Split by time, with a gap matching the forecast horizon</text>
    <text class="temporal-leak-desc" x="752" y="166">Which is the only honest</text>
    <text class="temporal-leak-desc" x="752" y="182">evaluation.</text>
  </g>
  <text class="temporal-leak-sub" x="30" y="304">Any dataset with a timestamp should be assumed time-ordered until shown otherwise, because the failure is silent and the correction is cheap.</text>
</svg>
