<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The flow is what a reader needs.">
  <title>Follow the data, not the components</title>
  <style>
    .data-flow-first-bg   { fill: #f8fafc; }
    .data-flow-first-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .data-flow-first-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .data-flow-first-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .data-flow-first-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .data-flow-first-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .data-flow-first-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .data-flow-first-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .data-flow-first-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .data-flow-first-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .data-flow-first-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .data-flow-first-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .data-flow-first-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .data-flow-first-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .data-flow-first-stage { opacity: 1; }

    .data-flow-first-s0 { animation-delay: 0.00s; }
    .data-flow-first-e0 { animation-delay: 0.00s; }
    .data-flow-first-s1 { animation-delay: 1.33s; }
    .data-flow-first-e1 { animation-delay: 1.33s; }
    .data-flow-first-s2 { animation-delay: 2.67s; }
    .data-flow-first-e2 { animation-delay: 2.67s; }
    .data-flow-first-s3 { animation-delay: 4.00s; }
    .data-flow-first-e3 { animation-delay: 4.00s; }
    .data-flow-first-s4 { animation-delay: 5.33s; }
    .data-flow-first-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .data-flow-first-conn  { animation: data-flow-first-trace 8s ease-in-out infinite; }
      .data-flow-first-stage { animation: data-flow-first-arrive 8s ease-in-out infinite; }
    }
    @keyframes data-flow-first-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes data-flow-first-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .data-flow-first-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .data-flow-first-stage { animation: data-flow-first-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes data-flow-first-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="data-flow-first-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="data-flow-first-bg" width="980" height="322"/>
  <text class="data-flow-first-h1"  x="30" y="40">Follow the data, not the components</text>
  <text class="data-flow-first-sub" x="30" y="64">The flow is what a reader needs.</text>
  <g class="data-flow-first-stage data-flow-first-s0">
    <rect class="data-flow-first-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="data-flow-first-step" x="44" y="142">01</text>
    <text class="data-flow-first-name" x="70" y="142">Ingress</text>
    <text class="data-flow-first-desc" x="44" y="166">Validated once, at the</text>
    <text class="data-flow-first-desc" x="44" y="182">boundary. Rejected here</text>
    <text class="data-flow-first-desc" x="44" y="198">or trusted after.</text>
    <text class="data-flow-first-edge" x="44" y="242">validate</text>
  </g>
  <line class="data-flow-first-line data-flow-first-conn data-flow-first-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#data-flow-first-tip)"/>
  <g class="data-flow-first-stage data-flow-first-s1">
    <rect class="data-flow-first-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="data-flow-first-step" x="233" y="142">02</text>
    <text class="data-flow-first-name" x="259" y="142">Retrieval</text>
    <text class="data-flow-first-desc" x="233" y="166">Query embedded,</text>
    <text class="data-flow-first-desc" x="233" y="182">candidates fetched,</text>
    <text class="data-flow-first-desc" x="233" y="198">reranked. Can return</text>
    <text class="data-flow-first-edge" x="233" y="242">~200ms</text>
  </g>
  <line class="data-flow-first-line data-flow-first-conn data-flow-first-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#data-flow-first-tip)"/>
  <g class="data-flow-first-stage data-flow-first-s2">
    <rect class="data-flow-first-warn" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="data-flow-first-step" x="422" y="142">03</text>
    <text class="data-flow-first-name" x="448" y="142">Prompt assembly</text>
    <text class="data-flow-first-desc" x="422" y="166">Context selected and</text>
    <text class="data-flow-first-desc" x="422" y="182">truncated to the token</text>
    <text class="data-flow-first-desc" x="422" y="198">budget. Can silently drop</text>
  </g>
  <line class="data-flow-first-line data-flow-first-conn data-flow-first-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#data-flow-first-tip)"/>
  <g class="data-flow-first-stage data-flow-first-s3">
    <rect class="data-flow-first-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="data-flow-first-step" x="611" y="142">04</text>
    <text class="data-flow-first-name" x="637" y="142">Generation</text>
    <text class="data-flow-first-desc" x="611" y="166">The model call. Can be</text>
    <text class="data-flow-first-desc" x="611" y="182">slow, refuse, or return</text>
    <text class="data-flow-first-desc" x="611" y="198">the wrong shape.</text>
    <text class="data-flow-first-edge" x="611" y="242">~900ms</text>
  </g>
  <line class="data-flow-first-line data-flow-first-conn data-flow-first-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#data-flow-first-tip)"/>
  <g class="data-flow-first-stage data-flow-first-s4">
    <rect class="data-flow-first-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="data-flow-first-step" x="800" y="142">05</text>
    <text class="data-flow-first-name" x="826" y="142">Response</text>
    <text class="data-flow-first-desc" x="800" y="166">Validated against the</text>
    <text class="data-flow-first-desc" x="800" y="182">schema, then streamed.</text>
    <text class="data-flow-first-edge" x="800" y="242">schema</text>
  </g>
  <text class="data-flow-first-sub" x="30" y="304">The third stage is the one people omit from the diagram and it is where the most common silent failure lives: context truncated to fit, taking the relevant passage out with it.</text>
</svg>
