<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Each has one right answer.">
  <title>Three questions the seams ask</title>
  <style>
    .three-seam-questions-bg   { fill: #f8fafc; }
    .three-seam-questions-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-seam-questions-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-seam-questions-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-seam-questions-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-seam-questions-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-seam-questions-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-seam-questions-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-seam-questions-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-seam-questions-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-seam-questions-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-seam-questions-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-seam-questions-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-seam-questions-row { opacity: 1; }
    .three-seam-questions-r0 { animation-delay: 0.00s; }
    .three-seam-questions-r1 { animation-delay: 0.45s; }
    .three-seam-questions-r2 { animation-delay: 0.90s; }
    .three-seam-questions-r3 { animation-delay: 1.35s; }
    .three-seam-questions-r4 { animation-delay: 1.80s; }
    .three-seam-questions-row { animation: three-seam-questions-reveal 7.3s ease-in-out infinite; }
    @keyframes three-seam-questions-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="three-seam-questions-bg" width="980" height="390"/>
  <text class="three-seam-questions-h1"  x="30" y="40">Three questions the seams ask</text>
  <text class="three-seam-questions-sub" x="30" y="64">Each has one right answer.</text>
  <rect class="three-seam-questions-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="three-seam-questions-name" x="46" y="122">The questions</text>
  <text class="three-seam-questions-desc" x="46" y="142">Invisible until assembly.</text>
  <text class="three-seam-questions-desc three-seam-questions-row three-seam-questions-r0" x="46" y="182">Where does redaction go?</text>
  <text class="three-seam-questions-desc three-seam-questions-row three-seam-questions-r1" x="46" y="216">Who pays for retrieval?</text>
  <text class="three-seam-questions-desc three-seam-questions-row three-seam-questions-r2" x="46" y="250">What does erasure have to touch?</text>
  <text class="three-seam-questions-desc three-seam-questions-row three-seam-questions-r3" x="46" y="284">None arises while building components</text>
  <text class="three-seam-questions-desc three-seam-questions-row three-seam-questions-r4" x="46" y="318">All three arise the moment they share a pipeline</text>
  <rect class="three-seam-questions-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="three-seam-questions-name" x="526" y="122">The answers</text>
  <text class="three-seam-questions-desc" x="526" y="142">Cheap now, expensive later.</text>
  <text class="three-seam-questions-desc three-seam-questions-row three-seam-questions-r0" x="526" y="182">Before chunking — after it, the vectors are contaminated</text>
  <text class="three-seam-questions-desc three-seam-questions-row three-seam-questions-r1" x="526" y="216">The same ledger as generation, or the cap has a gap</text>
  <text class="three-seam-questions-desc three-seam-questions-row three-seam-questions-r2" x="526" y="250">More stores than anyone lists from memory</text>
  <text class="three-seam-questions-desc three-seam-questions-row three-seam-questions-r3" x="526" y="284">Including the cache and the content hash</text>
  <text class="three-seam-questions-desc three-seam-questions-row three-seam-questions-r4" x="526" y="318">Each is free to arrange at assembly time</text>
  <text class="three-seam-questions-sub" x="30" y="372">"More stores than anyone lists from memory" is the honest form of the third answer, and it is why the deletion path is a registered list rather than a remembered one.</text>
</svg>
