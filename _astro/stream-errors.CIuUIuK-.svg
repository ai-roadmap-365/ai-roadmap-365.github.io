<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four cases to handle.">
  <title>Failing mid-stream</title>
  <style>
    .stream-errors-bg   { fill: #f8fafc; }
    .stream-errors-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stream-errors-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stream-errors-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stream-errors-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stream-errors-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stream-errors-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stream-errors-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stream-errors-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stream-errors-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stream-errors-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stream-errors-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stream-errors-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .stream-errors-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .stream-errors-stage { opacity: 1; }

    .stream-errors-s0 { animation-delay: 0.00s; }
    .stream-errors-e0 { animation-delay: 0.00s; }
    .stream-errors-s1 { animation-delay: 1.28s; }
    .stream-errors-e1 { animation-delay: 1.28s; }
    .stream-errors-s2 { animation-delay: 2.56s; }
    .stream-errors-e2 { animation-delay: 2.56s; }
    .stream-errors-s3 { animation-delay: 3.84s; }
    .stream-errors-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .stream-errors-conn  { animation: stream-errors-trace 6.4s ease-in-out infinite; }
      .stream-errors-stage { animation: stream-errors-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes stream-errors-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes stream-errors-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .stream-errors-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .stream-errors-stage { animation: stream-errors-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes stream-errors-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="stream-errors-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="stream-errors-bg" width="980" height="322"/>
  <text class="stream-errors-h1"  x="30" y="40">Failing mid-stream</text>
  <text class="stream-errors-sub" x="30" y="64">Four cases to handle.</text>
  <g class="stream-errors-stage stream-errors-s0">
    <rect class="stream-errors-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="stream-errors-step" x="44" y="142">01</text>
    <text class="stream-errors-name" x="70" y="142">An error can arrive after partial output</text>
    <text class="stream-errors-desc" x="44" y="166">Which the user has already seen.</text>
  </g>
  <line class="stream-errors-line stream-errors-conn stream-errors-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#stream-errors-tip)"/>
  <g class="stream-errors-stage stream-errors-s1">
    <rect class="stream-errors-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="stream-errors-step" x="280" y="142">02</text>
    <text class="stream-errors-name" x="306" y="142">Or the connection simply stops</text>
    <text class="stream-errors-desc" x="280" y="166">With no error at all.</text>
  </g>
  <line class="stream-errors-line stream-errors-conn stream-errors-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#stream-errors-tip)"/>
  <g class="stream-errors-stage stream-errors-s2">
    <rect class="stream-errors-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="stream-errors-step" x="516" y="142">03</text>
    <text class="stream-errors-name" x="542" y="142">So track what was delivered</text>
    <text class="stream-errors-desc" x="516" y="166">And decide whether to retry or</text>
    <text class="stream-errors-desc" x="516" y="182">resume from it.</text>
  </g>
  <line class="stream-errors-line stream-errors-conn stream-errors-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#stream-errors-tip)"/>
  <g class="stream-errors-stage stream-errors-s3">
    <rect class="stream-errors-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="stream-errors-step" x="752" y="142">04</text>
    <text class="stream-errors-name" x="778" y="142">And tell the user which happened</text>
    <text class="stream-errors-desc" x="752" y="166">A truncated answer presented as</text>
    <text class="stream-errors-desc" x="752" y="182">complete is the worst outcome.</text>
  </g>
  <text class="stream-errors-sub" x="30" y="304">Silently presenting a truncated answer as finished is the failure worth designing against: it is invisible to monitoring and entirely visible to the person relying on it.</text>
</svg>
