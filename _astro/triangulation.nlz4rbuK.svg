<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Triangulation</title>
  <style>
    .triangulation-bg   { fill: #f8fafc; }
    .triangulation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .triangulation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .triangulation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .triangulation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .triangulation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .triangulation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .triangulation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .triangulation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .triangulation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .triangulation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .triangulation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .triangulation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .triangulation-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .triangulation-stage { opacity: 1; }

    .triangulation-s0 { animation-delay: 0.00s; }
    .triangulation-e0 { animation-delay: 0.00s; }
    .triangulation-s1 { animation-delay: 1.28s; }
    .triangulation-e1 { animation-delay: 1.28s; }
    .triangulation-s2 { animation-delay: 2.56s; }
    .triangulation-e2 { animation-delay: 2.56s; }
    .triangulation-s3 { animation-delay: 3.84s; }
    .triangulation-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .triangulation-conn  { animation: triangulation-trace 6.4s ease-in-out infinite; }
      .triangulation-stage { animation: triangulation-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes triangulation-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes triangulation-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .triangulation-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .triangulation-stage { animation: triangulation-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes triangulation-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="triangulation-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="triangulation-bg" width="980" height="322"/>
  <text class="triangulation-h1"  x="30" y="40">Triangulation</text>
  <text class="triangulation-sub" x="30" y="64">Four steps.</text>
  <g class="triangulation-stage triangulation-s0">
    <rect class="triangulation-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="triangulation-step" x="44" y="142">01</text>
    <text class="triangulation-name" x="70" y="142">One test can be passed by returning a constant</text>
    <text class="triangulation-desc" x="44" y="166">Which is legitimate as a first</text>
    <text class="triangulation-desc" x="44" y="182">step.</text>
  </g>
  <line class="triangulation-line triangulation-conn triangulation-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#triangulation-tip)"/>
  <g class="triangulation-stage triangulation-s1">
    <rect class="triangulation-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="triangulation-step" x="280" y="142">02</text>
    <text class="triangulation-name" x="306" y="142">A second, different case forces generalisation</text>
    <text class="triangulation-desc" x="280" y="166">The constant no longer works.</text>
  </g>
  <line class="triangulation-line triangulation-conn triangulation-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#triangulation-tip)"/>
  <g class="triangulation-stage triangulation-s2">
    <rect class="triangulation-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="triangulation-step" x="516" y="142">03</text>
    <text class="triangulation-name" x="542" y="142">So the implementation is driven out by examples</text>
    <text class="triangulation-desc" x="516" y="166">Rather than designed up front.</text>
  </g>
  <line class="triangulation-line triangulation-conn triangulation-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#triangulation-tip)"/>
  <g class="triangulation-stage triangulation-s3">
    <rect class="triangulation-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="triangulation-step" x="752" y="142">04</text>
    <text class="triangulation-name" x="778" y="142">But when the general form is obvious, write it</text>
    <text class="triangulation-desc" x="752" y="166">Ritual triangulation is theatre.</text>
  </g>
  <text class="triangulation-sub" x="30" y="304">The honesty of the last point matters: the technique is a tool for when the design is unclear, not a ceremony to perform when it is not.</text>
</svg>
