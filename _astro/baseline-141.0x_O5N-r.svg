<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The baseline</title>
  <style>
    .baseline-141-bg   { fill: #f8fafc; }
    .baseline-141-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baseline-141-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baseline-141-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baseline-141-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baseline-141-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baseline-141-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .baseline-141-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .baseline-141-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .baseline-141-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .baseline-141-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .baseline-141-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .baseline-141-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .baseline-141-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .baseline-141-stage { opacity: 1; }

    .baseline-141-s0 { animation-delay: 0.00s; }
    .baseline-141-e0 { animation-delay: 0.00s; }
    .baseline-141-s1 { animation-delay: 1.28s; }
    .baseline-141-e1 { animation-delay: 1.28s; }
    .baseline-141-s2 { animation-delay: 2.56s; }
    .baseline-141-e2 { animation-delay: 2.56s; }
    .baseline-141-s3 { animation-delay: 3.84s; }
    .baseline-141-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .baseline-141-conn  { animation: baseline-141-trace 6.4s ease-in-out infinite; }
      .baseline-141-stage { animation: baseline-141-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes baseline-141-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes baseline-141-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .baseline-141-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .baseline-141-stage { animation: baseline-141-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes baseline-141-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="baseline-141-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="baseline-141-bg" width="980" height="322"/>
  <text class="baseline-141-h1"  x="30" y="40">The baseline</text>
  <text class="baseline-141-sub" x="30" y="64">Four steps.</text>
  <g class="baseline-141-stage baseline-141-s0">
    <rect class="baseline-141-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="baseline-141-step" x="44" y="142">01</text>
    <text class="baseline-141-name" x="70" y="142">Always predict the most common class</text>
    <text class="baseline-141-desc" x="44" y="166">Or the mean, for a number.</text>
  </g>
  <line class="baseline-141-line baseline-141-conn baseline-141-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#baseline-141-tip)"/>
  <g class="baseline-141-stage baseline-141-s1">
    <rect class="baseline-141-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="baseline-141-step" x="280" y="142">02</text>
    <text class="baseline-141-name" x="306" y="142">Measure that on the same held-out data</text>
    <text class="baseline-141-desc" x="280" y="166">With the same metric.</text>
  </g>
  <line class="baseline-141-line baseline-141-conn baseline-141-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#baseline-141-tip)"/>
  <g class="baseline-141-stage baseline-141-s2">
    <rect class="baseline-141-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="baseline-141-step" x="516" y="142">03</text>
    <text class="baseline-141-name" x="542" y="142">Any model must beat it to have said anything</text>
    <text class="baseline-141-desc" x="516" y="166">And many published results do</text>
    <text class="baseline-141-desc" x="516" y="182">not.</text>
  </g>
  <line class="baseline-141-line baseline-141-conn baseline-141-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#baseline-141-tip)"/>
  <g class="baseline-141-stage baseline-141-s3">
    <rect class="baseline-141-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="baseline-141-step" x="752" y="142">04</text>
    <text class="baseline-141-name" x="778" y="142">On imbalanced data the baseline is very high</text>
    <text class="baseline-141-desc" x="752" y="166">Which is why accuracy alone</text>
    <text class="baseline-141-desc" x="752" y="182">misleads.</text>
  </g>
  <text class="baseline-141-sub" x="30" y="304">The baseline costs one line and converts an unanchored percentage into a claim that can be argued with, which is the whole point of computing it.</text>
</svg>
