<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when you need an index.">
  <title>When exact search is enough</title>
  <style>
    .search-when-bg   { fill: #f8fafc; }
    .search-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .search-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .search-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .search-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .search-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .search-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .search-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .search-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .search-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .search-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .search-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .search-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .search-when-row { opacity: 1; }
    .search-when-r0 { animation-delay: 0.00s; }
    .search-when-r1 { animation-delay: 0.45s; }
    .search-when-r2 { animation-delay: 0.90s; }
    .search-when-r3 { animation-delay: 1.35s; }
    .search-when-r4 { animation-delay: 1.80s; }
    .search-when-row { animation: search-when-reveal 7.3s ease-in-out infinite; }
    @keyframes search-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="search-when-bg" width="980" height="390"/>
  <text class="search-when-h1"  x="30" y="40">When exact search is enough</text>
  <text class="search-when-sub" x="30" y="64">And when you need an index.</text>
  <rect class="search-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="search-when-name" x="46" y="122">Exact is enough</text>
  <text class="search-when-desc" x="46" y="142">More often than assumed.</text>
  <text class="search-when-desc search-when-row search-when-r0" x="46" y="182">Up to a few hundred thousand vectors</text>
  <text class="search-when-desc search-when-row search-when-r1" x="46" y="216">Frequently changing corpora</text>
  <text class="search-when-desc search-when-row search-when-r2" x="46" y="250">Where perfect recall is required</text>
  <text class="search-when-desc search-when-row search-when-r3" x="46" y="284">During development and evaluation</text>
  <text class="search-when-desc search-when-row search-when-r4" x="46" y="318">Where simplicity is worth more than speed</text>
  <rect class="search-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="search-when-name" x="526" y="122">You need an index</text>
  <text class="search-when-desc" x="526" y="142">Four signals.</text>
  <text class="search-when-desc search-when-row search-when-r0" x="526" y="182">Millions of vectors</text>
  <text class="search-when-desc search-when-row search-when-r1" x="526" y="216">Strict latency budgets</text>
  <text class="search-when-desc search-when-row search-when-r2" x="526" y="250">High query volume</text>
  <text class="search-when-desc search-when-row search-when-r3" x="526" y="284">A mostly static corpus</text>
  <text class="search-when-desc search-when-row search-when-r4" x="526" y="318">And you have measured the exact version first</text>
  <text class="search-when-sub" x="30" y="372">Measuring the exact version first is the step worth insisting on, because it establishes both the latency you are trying to beat and the recall you are about to give up.</text>
</svg>
