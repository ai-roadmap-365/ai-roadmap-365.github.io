<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="It moved out of the entrypoint.">
  <title>How startup ordering found its home</title>
  <style>
    .compose-eras-bg   { fill: #f8fafc; }
    .compose-eras-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compose-eras-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compose-eras-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compose-eras-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compose-eras-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compose-eras-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .compose-eras-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .compose-eras-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .compose-eras-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .compose-eras-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .compose-eras-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .compose-eras-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .compose-eras-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .compose-eras-stage { opacity: 1; }

    .compose-eras-s0 { animation-delay: 0.00s; }
    .compose-eras-e0 { animation-delay: 0.00s; }
    .compose-eras-s1 { animation-delay: 1.28s; }
    .compose-eras-e1 { animation-delay: 1.28s; }
    .compose-eras-s2 { animation-delay: 2.56s; }
    .compose-eras-e2 { animation-delay: 2.56s; }
    .compose-eras-s3 { animation-delay: 3.84s; }
    .compose-eras-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .compose-eras-conn  { animation: compose-eras-trace 6.4s ease-in-out infinite; }
      .compose-eras-stage { animation: compose-eras-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes compose-eras-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes compose-eras-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .compose-eras-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .compose-eras-stage { animation: compose-eras-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes compose-eras-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="compose-eras-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="compose-eras-bg" width="980" height="322"/>
  <text class="compose-eras-h1"  x="30" y="40">How startup ordering found its home</text>
  <text class="compose-eras-sub" x="30" y="64">It moved out of the entrypoint.</text>
  <g class="compose-eras-stage compose-eras-s0">
    <rect class="compose-eras-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="compose-eras-step" x="44" y="142">01</text>
    <text class="compose-eras-name" x="70" y="142">Fig, 2013</text>
    <text class="compose-eras-desc" x="44" y="166">One declarative file for a whole</text>
    <text class="compose-eras-desc" x="44" y="182">local stack. Barely changed in a</text>
    <text class="compose-eras-desc" x="44" y="198">decade.</text>
  </g>
  <line class="compose-eras-line compose-eras-conn compose-eras-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#compose-eras-tip)"/>
  <g class="compose-eras-stage compose-eras-s1">
    <rect class="compose-eras-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="compose-eras-step" x="280" y="142">02</text>
    <text class="compose-eras-name" x="306" y="142">The v2 and v3 schism</text>
    <text class="compose-eras-desc" x="280" y="166">v3 was designed for Swarm and</text>
    <text class="compose-eras-desc" x="280" y="182">dropped single-host options.</text>
    <text class="compose-eras-desc" x="280" y="198">Merged again in 2020.</text>
  </g>
  <line class="compose-eras-line compose-eras-conn compose-eras-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#compose-eras-tip)"/>
  <g class="compose-eras-stage compose-eras-s2">
    <rect class="compose-eras-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="compose-eras-step" x="516" y="142">03</text>
    <text class="compose-eras-name" x="542" y="142">wait-for-it.sh</text>
    <text class="compose-eras-desc" x="516" y="166">A script polling a port before</text>
    <text class="compose-eras-desc" x="516" y="182">exec'ing the real command. In</text>
    <text class="compose-eras-desc" x="516" y="198">every entrypoint.</text>
    <text class="compose-eras-edge" x="516" y="242">wrong place</text>
  </g>
  <line class="compose-eras-line compose-eras-conn compose-eras-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#compose-eras-tip)"/>
  <g class="compose-eras-stage compose-eras-s3">
    <rect class="compose-eras-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="compose-eras-step" x="752" y="142">04</text>
    <text class="compose-eras-name" x="778" y="142">Healthchecks and conditions</text>
    <text class="compose-eras-desc" x="752" y="166">The orchestrator waits; the</text>
    <text class="compose-eras-desc" x="752" y="182">application need not know it was</text>
    <text class="compose-eras-desc" x="752" y="198">waited for.</text>
    <text class="compose-eras-edge" x="752" y="242">right place</text>
  </g>
  <text class="compose-eras-sub" x="30" y="304">The third row is why the fourth matters: startup ordering is a property of the deployment rather than of the application, and baking it into every image's entrypoint puts it where it cannot be changed without a rebuild.</text>
</svg>
