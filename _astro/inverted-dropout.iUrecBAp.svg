<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Scale during training, not at inference.">
  <title>Inverted dropout</title>
  <style>
    .inverted-dropout-bg   { fill: #f8fafc; }
    .inverted-dropout-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inverted-dropout-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inverted-dropout-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inverted-dropout-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inverted-dropout-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inverted-dropout-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .inverted-dropout-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .inverted-dropout-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .inverted-dropout-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .inverted-dropout-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .inverted-dropout-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .inverted-dropout-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .inverted-dropout-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .inverted-dropout-stage { opacity: 1; }

    .inverted-dropout-s0 { animation-delay: 0.00s; }
    .inverted-dropout-e0 { animation-delay: 0.00s; }
    .inverted-dropout-s1 { animation-delay: 1.28s; }
    .inverted-dropout-e1 { animation-delay: 1.28s; }
    .inverted-dropout-s2 { animation-delay: 2.56s; }
    .inverted-dropout-e2 { animation-delay: 2.56s; }
    .inverted-dropout-s3 { animation-delay: 3.84s; }
    .inverted-dropout-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .inverted-dropout-conn  { animation: inverted-dropout-trace 6.4s ease-in-out infinite; }
      .inverted-dropout-stage { animation: inverted-dropout-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes inverted-dropout-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes inverted-dropout-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .inverted-dropout-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .inverted-dropout-stage { animation: inverted-dropout-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes inverted-dropout-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="inverted-dropout-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="inverted-dropout-bg" width="980" height="322"/>
  <text class="inverted-dropout-h1"  x="30" y="40">Inverted dropout</text>
  <text class="inverted-dropout-sub" x="30" y="64">Scale during training, not at inference.</text>
  <g class="inverted-dropout-stage inverted-dropout-s0">
    <rect class="inverted-dropout-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="inverted-dropout-step" x="44" y="142">01</text>
    <text class="inverted-dropout-name" x="70" y="142">Mask units at random</text>
    <text class="inverted-dropout-desc" x="44" y="166">Each unit zeroed independently</text>
    <text class="inverted-dropout-desc" x="44" y="182">with probability p.</text>
  </g>
  <line class="inverted-dropout-line inverted-dropout-conn inverted-dropout-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#inverted-dropout-tip)"/>
  <g class="inverted-dropout-stage inverted-dropout-s1">
    <rect class="inverted-dropout-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="inverted-dropout-step" x="280" y="142">02</text>
    <text class="inverted-dropout-name" x="306" y="142">Scale the survivors up</text>
    <text class="inverted-dropout-desc" x="280" y="166">Divide by the keep probability,</text>
    <text class="inverted-dropout-desc" x="280" y="182">during training.</text>
    <text class="inverted-dropout-edge" x="280" y="242">1/(1-p)</text>
  </g>
  <line class="inverted-dropout-line inverted-dropout-conn inverted-dropout-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#inverted-dropout-tip)"/>
  <g class="inverted-dropout-stage inverted-dropout-s2">
    <rect class="inverted-dropout-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="inverted-dropout-step" x="516" y="142">03</text>
    <text class="inverted-dropout-name" x="542" y="142">So the expected activation is unchanged</text>
    <text class="inverted-dropout-desc" x="516" y="166">Which is the whole point of</text>
    <text class="inverted-dropout-desc" x="516" y="182">inverting the scaling.</text>
  </g>
  <line class="inverted-dropout-line inverted-dropout-conn inverted-dropout-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#inverted-dropout-tip)"/>
  <g class="inverted-dropout-stage inverted-dropout-s3">
    <rect class="inverted-dropout-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="inverted-dropout-step" x="752" y="142">04</text>
    <text class="inverted-dropout-name" x="778" y="142">Inference does nothing at all</text>
    <text class="inverted-dropout-desc" x="752" y="166">No mask, no scaling. The layer</text>
    <text class="inverted-dropout-desc" x="752" y="182">is an identity.</text>
  </g>
  <text class="inverted-dropout-sub" x="30" y="304">Scaling at training time rather than inference time is a deployment decision as much as a mathematical one: it keeps the inference path free of any dropout-specific arithmetic.</text>
</svg>
