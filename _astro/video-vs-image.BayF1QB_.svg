<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="What changes.">
  <title>Video against image generation</title>
  <style>
    .video-vs-image-bg   { fill: #f8fafc; }
    .video-vs-image-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .video-vs-image-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .video-vs-image-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .video-vs-image-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .video-vs-image-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .video-vs-image-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .video-vs-image-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .video-vs-image-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .video-vs-image-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .video-vs-image-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .video-vs-image-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .video-vs-image-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .video-vs-image-row { opacity: 1; }
    .video-vs-image-r0 { animation-delay: 0.00s; }
    .video-vs-image-r1 { animation-delay: 0.45s; }
    .video-vs-image-r2 { animation-delay: 0.90s; }
    .video-vs-image-r3 { animation-delay: 1.35s; }
    .video-vs-image-r4 { animation-delay: 1.80s; }
    .video-vs-image-row { animation: video-vs-image-reveal 7.3s ease-in-out infinite; }
    @keyframes video-vs-image-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="video-vs-image-bg" width="980" height="390"/>
  <text class="video-vs-image-h1"  x="30" y="40">Video against image generation</text>
  <text class="video-vs-image-sub" x="30" y="64">What changes.</text>
  <rect class="video-vs-image-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="video-vs-image-name" x="46" y="122">Images</text>
  <text class="video-vs-image-desc" x="46" y="142">One frame.</text>
  <text class="video-vs-image-desc video-vs-image-row video-vs-image-r0" x="46" y="182">Two dimensions</text>
  <text class="video-vs-image-desc video-vs-image-row video-vs-image-r1" x="46" y="216">Seconds to generate</text>
  <text class="video-vs-image-desc video-vs-image-row video-vs-image-r2" x="46" y="250">Runs on consumer hardware</text>
  <text class="video-vs-image-desc video-vs-image-row video-vs-image-r3" x="46" y="284">Quality judged per image</text>
  <text class="video-vs-image-desc video-vs-image-row video-vs-image-r4" x="46" y="318">Largely solved</text>
  <rect class="video-vs-image-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="video-vs-image-name" x="526" y="122">Video</text>
  <text class="video-vs-image-desc" x="526" y="142">Many, consistent.</text>
  <text class="video-vs-image-desc video-vs-image-row video-vs-image-r0" x="526" y="182">Three dimensions</text>
  <text class="video-vs-image-desc video-vs-image-row video-vs-image-r1" x="526" y="216">Minutes for seconds of output</text>
  <text class="video-vs-image-desc video-vs-image-row video-vs-image-r2" x="526" y="250">Needs substantial accelerators</text>
  <text class="video-vs-image-desc video-vs-image-row video-vs-image-r3" x="526" y="284">Quality judged across frames</text>
  <text class="video-vs-image-desc video-vs-image-row video-vs-image-r4" x="526" y="318">Clips remain short for a reason</text>
  <text class="video-vs-image-sub" x="30" y="372">Clip length being limited by cost rather than by capability is worth knowing: the models can generate longer, and almost nobody can afford to.</text>
</svg>
