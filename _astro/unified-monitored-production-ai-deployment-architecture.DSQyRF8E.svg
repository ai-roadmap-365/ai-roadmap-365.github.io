<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Unified Monitored Production AI Deployment Architecture">
  <title>Unified Monitored Production AI Deployment Architecture</title>
  <defs>
    <style>
      .d343a-bg { fill: #f8fafc; }
      .d343a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d343a-gtw { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d343a-srv { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d343a-obs { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d343a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d343a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d343a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d343a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d343a-bg" />
  
  <text x="40" y="40" class="d343a-title">Unified Monitored Production AI Platform</text>
  <text x="40" y="65" class="d343a-subtitle">Unified Monitored Production AI Deployment Architecture showing Client Traffic, AI Gateway with PII Redaction &amp; Circuit Breaker, GPU Triton Serving Pool, Prometheus Metrics, and ClickHouse Financial Ledger</text>
  
  <!-- AI Gateway -->
  <rect x="40" y="110" width="240" height="270" class="d343a-gtw" />
  <text x="55" y="145" class="d343a-header" fill="#1d4ed8">1. AI Gateway &amp; Router</text>
  <text x="55" y="180" class="d343a-text">• W3C Trace ID Injection</text>
  <text x="55" y="205" class="d343a-text">• In-Memory PII Sanitizer</text>
  <text x="55" y="230" class="d343a-text">• Feature Flag Cohort Hash</text>
  <text x="55" y="255" class="d343a-text">• Automated Circuit Breaker</text>
  <text x="55" y="295" class="d343a-text" font-weight="600" fill="#1d4ed8">Self-Healing Ingress</text>
  <text x="55" y="320" class="d343a-text">Sub-millisecond routing overhead</text>
  
  <!-- GPU Inference Pool -->
  <rect x="315" y="110" width="240" height="270" class="d343a-srv" />
  <text x="330" y="145" class="d343a-header" fill="#7e22ce">2. GPU Serving Cluster</text>
  <text x="330" y="180" class="d343a-text">• Dynamic Batching Scheduler</text>
  <text x="330" y="205" class="d343a-text">• NVLink 900 GB/s Interconnect</text>
  <text x="330" y="230" class="d343a-text">• PagedAttention KV Cache</text>
  <text x="330" y="255" class="d343a-text">• Blue-Green Revisions</text>
  <text x="330" y="295" class="d343a-text" font-weight="600" fill="#7e22ce">High-Throughput Compute</text>
  <text x="330" y="320" class="d343a-text">95%+ Hardware Saturation</text>
  
  <!-- Observability & Billing -->
  <rect x="590" y="110" width="270" height="270" class="d343a-obs" />
  <text x="605" y="145" class="d343a-header" fill="#15803d">3. Observability &amp; Ledger</text>
  <text x="605" y="180" class="d343a-text">• Prometheus: P95 TTFT, ITL</text>
  <text x="605" y="205" class="d343a-text">• Grafana Live Dashboards</text>
  <text x="605" y="230" class="d343a-text">• ClickHouse Token Ledger</text>
  <text x="605" y="255" class="d343a-text">• PagerDuty Automated Escalation</text>
  <text x="605" y="295" class="d343a-text" font-weight="600" fill="#15803d">Full-Stack Transparency</text>
  <text x="605" y="320" class="d343a-text">Trace-correlated operational ledger</text>
</svg>