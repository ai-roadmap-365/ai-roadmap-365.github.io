<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Dimension, threshold, refresh.">
  <title>Three semantic cache rules</title>
  <style>
    .semantic-cache-rules-bg   { fill: #f8fafc; }
    .semantic-cache-rules-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .semantic-cache-rules-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .semantic-cache-rules-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .semantic-cache-rules-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .semantic-cache-rules-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .semantic-cache-rules-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .semantic-cache-rules-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .semantic-cache-rules-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .semantic-cache-rules-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .semantic-cache-rules-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .semantic-cache-rules-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .semantic-cache-rules-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .semantic-cache-rules-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .semantic-cache-rules-stage { opacity: 1; }

    .semantic-cache-rules-s0 { animation-delay: 0.00s; }
    .semantic-cache-rules-e0 { animation-delay: 0.00s; }
    .semantic-cache-rules-s1 { animation-delay: 1.50s; }
    .semantic-cache-rules-e1 { animation-delay: 1.50s; }
    .semantic-cache-rules-s2 { animation-delay: 3.00s; }
    .semantic-cache-rules-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .semantic-cache-rules-conn  { animation: semantic-cache-rules-trace 6s ease-in-out infinite; }
      .semantic-cache-rules-stage { animation: semantic-cache-rules-arrive 6s ease-in-out infinite; }
    }
    @keyframes semantic-cache-rules-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes semantic-cache-rules-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .semantic-cache-rules-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .semantic-cache-rules-stage { animation: semantic-cache-rules-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes semantic-cache-rules-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="semantic-cache-rules-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="semantic-cache-rules-bg" width="980" height="322"/>
  <text class="semantic-cache-rules-h1"  x="30" y="40">Three semantic cache rules</text>
  <text class="semantic-cache-rules-sub" x="30" y="64">Dimension, threshold, refresh.</text>
  <g class="semantic-cache-rules-stage semantic-cache-rules-s0">
    <rect class="semantic-cache-rules-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="semantic-cache-rules-step" x="44" y="142">01</text>
    <text class="semantic-cache-rules-name" x="70" y="142">Compact embeddings</text>
    <text class="semantic-cache-rules-desc" x="44" y="166">Fewer dimensions: less memory, faster dot</text>
    <text class="semantic-cache-rules-desc" x="44" y="182">products.</text>
  </g>
  <line class="semantic-cache-rules-line semantic-cache-rules-conn semantic-cache-rules-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#semantic-cache-rules-tip)"/>
  <g class="semantic-cache-rules-stage semantic-cache-rules-s1">
    <rect class="semantic-cache-rules-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="semantic-cache-rules-step" x="359" y="142">02</text>
    <text class="semantic-cache-rules-name" x="385" y="142">Threshold by query length</text>
    <text class="semantic-cache-rules-desc" x="359" y="166">0.96 for short queries, 0.93 for long ones.</text>
    <text class="semantic-cache-rules-desc" x="359" y="182">Short text is easy to confuse.</text>
  </g>
  <line class="semantic-cache-rules-line semantic-cache-rules-conn semantic-cache-rules-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#semantic-cache-rules-tip)"/>
  <g class="semantic-cache-rules-stage semantic-cache-rules-s2">
    <rect class="semantic-cache-rules-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="semantic-cache-rules-step" x="674" y="142">03</text>
    <text class="semantic-cache-rules-name" x="700" y="142">Refresh the stored response</text>
    <text class="semantic-cache-rules-desc" x="674" y="166">Keep the query embedding, update the answer</text>
    <text class="semantic-cache-rules-desc" x="674" y="182">when a better model produces one.</text>
  </g>
  <text class="semantic-cache-rules-sub" x="30" y="304">The length-dependent threshold matters because short queries are semantically dense: two five-word questions can be 0.94 similar and mean entirely different things.</text>
</svg>
