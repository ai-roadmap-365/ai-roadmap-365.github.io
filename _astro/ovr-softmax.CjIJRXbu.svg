<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="They differ in practice.">
  <title>Two ways to do multiclass</title>
  <style>
    .ovr-softmax-bg   { fill: #f8fafc; }
    .ovr-softmax-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ovr-softmax-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ovr-softmax-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ovr-softmax-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ovr-softmax-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ovr-softmax-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ovr-softmax-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ovr-softmax-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ovr-softmax-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ovr-softmax-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ovr-softmax-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ovr-softmax-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ovr-softmax-row { opacity: 1; }
    .ovr-softmax-r0 { animation-delay: 0.00s; }
    .ovr-softmax-r1 { animation-delay: 0.45s; }
    .ovr-softmax-r2 { animation-delay: 0.90s; }
    .ovr-softmax-r3 { animation-delay: 1.35s; }
    .ovr-softmax-r4 { animation-delay: 1.80s; }
    .ovr-softmax-row { animation: ovr-softmax-reveal 7.3s ease-in-out infinite; }
    @keyframes ovr-softmax-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="ovr-softmax-bg" width="980" height="390"/>
  <text class="ovr-softmax-h1"  x="30" y="40">Two ways to do multiclass</text>
  <text class="ovr-softmax-sub" x="30" y="64">They differ in practice.</text>
  <rect class="ovr-softmax-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="ovr-softmax-name" x="46" y="122">One versus rest</text>
  <text class="ovr-softmax-desc" x="46" y="142">Many binary models.</text>
  <text class="ovr-softmax-desc ovr-softmax-row ovr-softmax-r0" x="46" y="182">One classifier per class</text>
  <text class="ovr-softmax-desc ovr-softmax-row ovr-softmax-r1" x="46" y="216">Each trained independently</text>
  <text class="ovr-softmax-desc ovr-softmax-row ovr-softmax-r2" x="46" y="250">Scores are not comparable</text>
  <text class="ovr-softmax-desc ovr-softmax-row ovr-softmax-r3" x="46" y="284">Can leave ambiguous regions</text>
  <text class="ovr-softmax-desc ovr-softmax-row ovr-softmax-r4" x="46" y="318">Works with any binary classifier</text>
  <rect class="ovr-softmax-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="ovr-softmax-name" x="526" y="122">Softmax</text>
  <text class="ovr-softmax-desc" x="526" y="142">One joint model.</text>
  <text class="ovr-softmax-desc ovr-softmax-row ovr-softmax-r0" x="526" y="182">A single model, trained jointly</text>
  <text class="ovr-softmax-desc ovr-softmax-row ovr-softmax-r1" x="526" y="216">Classes compete during training</text>
  <text class="ovr-softmax-desc ovr-softmax-row ovr-softmax-r2" x="526" y="250">Probabilities sum to one</text>
  <text class="ovr-softmax-desc ovr-softmax-row ovr-softmax-r3" x="526" y="284">Partitions the space completely</text>
  <text class="ovr-softmax-desc ovr-softmax-row ovr-softmax-r4" x="526" y="318">Requires a model that supports it</text>
  <text class="ovr-softmax-sub" x="30" y="372">Ambiguous regions where every one-versus-rest classifier says no are a real defect, and they are exactly what joint training eliminates.</text>
</svg>
