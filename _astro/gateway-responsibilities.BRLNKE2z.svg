<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three responsibilities.">
  <title>What the gateway owns</title>
  <style>
    .gateway-responsibilities-bg   { fill: #f8fafc; }
    .gateway-responsibilities-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-responsibilities-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-responsibilities-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-responsibilities-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-responsibilities-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gateway-responsibilities-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gateway-responsibilities-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gateway-responsibilities-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gateway-responsibilities-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gateway-responsibilities-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gateway-responsibilities-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gateway-responsibilities-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .gateway-responsibilities-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .gateway-responsibilities-stage { opacity: 1; }

    .gateway-responsibilities-s0 { animation-delay: 0.00s; }
    .gateway-responsibilities-e0 { animation-delay: 0.00s; }
    .gateway-responsibilities-s1 { animation-delay: 1.50s; }
    .gateway-responsibilities-e1 { animation-delay: 1.50s; }
    .gateway-responsibilities-s2 { animation-delay: 3.00s; }
    .gateway-responsibilities-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .gateway-responsibilities-conn  { animation: gateway-responsibilities-trace 6s ease-in-out infinite; }
      .gateway-responsibilities-stage { animation: gateway-responsibilities-arrive 6s ease-in-out infinite; }
    }
    @keyframes gateway-responsibilities-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes gateway-responsibilities-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .gateway-responsibilities-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .gateway-responsibilities-stage { animation: gateway-responsibilities-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes gateway-responsibilities-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="gateway-responsibilities-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="gateway-responsibilities-bg" width="980" height="322"/>
  <text class="gateway-responsibilities-h1"  x="30" y="40">What the gateway owns</text>
  <text class="gateway-responsibilities-sub" x="30" y="64">Three responsibilities.</text>
  <g class="gateway-responsibilities-stage gateway-responsibilities-s0">
    <rect class="gateway-responsibilities-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="gateway-responsibilities-step" x="44" y="142">01</text>
    <text class="gateway-responsibilities-name" x="70" y="142">Normalise the schema</text>
    <text class="gateway-responsibilities-desc" x="44" y="166">One interface: model, messages, temperature,</text>
    <text class="gateway-responsibilities-desc" x="44" y="182">max tokens. Every provider behind it.</text>
  </g>
  <line class="gateway-responsibilities-line gateway-responsibilities-conn gateway-responsibilities-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#gateway-responsibilities-tip)"/>
  <g class="gateway-responsibilities-stage gateway-responsibilities-s1">
    <rect class="gateway-responsibilities-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="gateway-responsibilities-step" x="359" y="142">02</text>
    <text class="gateway-responsibilities-name" x="385" y="142">Route failover</text>
    <text class="gateway-responsibilities-desc" x="359" y="166">429, 500 or 503 on the primary: retry the</text>
    <text class="gateway-responsibilities-desc" x="359" y="182">secondary, in milliseconds.</text>
  </g>
  <line class="gateway-responsibilities-line gateway-responsibilities-conn gateway-responsibilities-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#gateway-responsibilities-tip)"/>
  <g class="gateway-responsibilities-stage gateway-responsibilities-s2">
    <rect class="gateway-responsibilities-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="gateway-responsibilities-step" x="674" y="142">03</text>
    <text class="gateway-responsibilities-name" x="700" y="142">Cascade by complexity</text>
    <text class="gateway-responsibilities-desc" x="674" y="166">Simple queries to small models; escalate the</text>
    <text class="gateway-responsibilities-desc" x="674" y="182">hard ones.</text>
    <text class="gateway-responsibilities-edge" x="674" y="242">money</text>
  </g>
  <text class="gateway-responsibilities-sub" x="30" y="304">The third is where the money is: failover protects availability occasionally, and cascading reduces cost on the majority of traffic continuously.</text>
</svg>
