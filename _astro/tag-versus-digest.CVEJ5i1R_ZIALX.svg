<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A digest is.">
  <title>A tag is not an identity</title>
  <style>
    .tag-versus-digest-bg   { fill: #f8fafc; }
    .tag-versus-digest-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tag-versus-digest-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tag-versus-digest-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tag-versus-digest-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tag-versus-digest-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tag-versus-digest-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tag-versus-digest-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tag-versus-digest-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tag-versus-digest-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tag-versus-digest-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tag-versus-digest-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tag-versus-digest-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tag-versus-digest-row { opacity: 1; }
    .tag-versus-digest-r0 { animation-delay: 0.00s; }
    .tag-versus-digest-r1 { animation-delay: 0.45s; }
    .tag-versus-digest-r2 { animation-delay: 0.90s; }
    .tag-versus-digest-r3 { animation-delay: 1.35s; }
    .tag-versus-digest-r4 { animation-delay: 1.80s; }
    .tag-versus-digest-row { animation: tag-versus-digest-reveal 7.3s ease-in-out infinite; }
    @keyframes tag-versus-digest-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tag-versus-digest-bg" width="980" height="390"/>
  <text class="tag-versus-digest-h1"  x="30" y="40">A tag is not an identity</text>
  <text class="tag-versus-digest-sub" x="30" y="64">A digest is.</text>
  <rect class="tag-versus-digest-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tag-versus-digest-name" x="46" y="122">Tag</text>
  <text class="tag-versus-digest-desc" x="46" y="142">A promise about compatibility.</text>
  <text class="tag-versus-digest-desc tag-versus-digest-row tag-versus-digest-r0" x="46" y="182">python:3.12-slim</text>
  <text class="tag-versus-digest-desc tag-versus-digest-row tag-versus-digest-r1" x="46" y="216">A mutable pointer</text>
  <text class="tag-versus-digest-desc tag-versus-digest-row tag-versus-digest-r2" x="46" y="250">Moves as the publisher rebuilds</text>
  <text class="tag-versus-digest-desc tag-versus-digest-row tag-versus-digest-r3" x="46" y="284">Convenient, and correct for development</text>
  <text class="tag-versus-digest-desc tag-versus-digest-row tag-versus-digest-r4" x="46" y="318">Says nothing about which bytes</text>
  <rect class="tag-versus-digest-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tag-versus-digest-name" x="526" y="122">Digest</text>
  <text class="tag-versus-digest-desc" x="526" y="142">An identity.</text>
  <text class="tag-versus-digest-desc tag-versus-digest-row tag-versus-digest-r0" x="526" y="182">sha256:...</text>
  <text class="tag-versus-digest-desc tag-versus-digest-row tag-versus-digest-r1" x="526" y="216">Exact bytes, permanently</text>
  <text class="tag-versus-digest-desc tag-versus-digest-row tag-versus-digest-r2" x="526" y="250">Never moves</text>
  <text class="tag-versus-digest-desc tag-versus-digest-row tag-versus-digest-r3" x="526" y="284">What a reproducible build needs</text>
  <text class="tag-versus-digest-desc tag-versus-digest-row tag-versus-digest-r4" x="526" y="318">What a supply-chain control needs</text>
  <text class="tag-versus-digest-sub" x="30" y="372">Day 359's preflight check treats an unpinned digest as a supply-chain finding for exactly this reason: `latest` and a floating tag are decisions someone else can change after you deployed.</text>
</svg>
