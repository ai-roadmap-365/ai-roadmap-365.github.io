<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What it is not</title>
  <style>
    .pca-not-bg   { fill: #f8fafc; }
    .pca-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pca-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pca-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pca-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pca-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pca-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pca-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pca-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pca-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pca-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pca-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pca-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pca-not-row { opacity: 1; }
    .pca-not-r0 { animation-delay: 0.00s; }
    .pca-not-r1 { animation-delay: 0.45s; }
    .pca-not-r2 { animation-delay: 0.90s; }
    .pca-not-r3 { animation-delay: 1.35s; }
    .pca-not-r4 { animation-delay: 1.80s; }
    .pca-not-row { animation: pca-not-reveal 7.3s ease-in-out infinite; }
    @keyframes pca-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="pca-not-bg" width="980" height="390"/>
  <text class="pca-not-h1"  x="30" y="40">What it is not</text>
  <text class="pca-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="pca-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="pca-not-name" x="46" y="122">The misconception</text>
  <text class="pca-not-desc" x="46" y="142">Commonly held.</text>
  <text class="pca-not-desc pca-not-row pca-not-r0" x="46" y="182">It selects the most important features</text>
  <text class="pca-not-desc pca-not-row pca-not-r1" x="46" y="216">Components are interpretable</text>
  <text class="pca-not-desc pca-not-row pca-not-r2" x="46" y="250">It always improves a model</text>
  <text class="pca-not-desc pca-not-row pca-not-r3" x="46" y="284">Scaling is optional</text>
  <text class="pca-not-desc pca-not-row pca-not-r4" x="46" y="318">High variance means high information</text>
  <rect class="pca-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="pca-not-name" x="526" y="122">What is true</text>
  <text class="pca-not-desc" x="526" y="142">Actually.</text>
  <text class="pca-not-desc pca-not-row pca-not-r0" x="526" y="182">It creates combinations of all features</text>
  <text class="pca-not-desc pca-not-row pca-not-r1" x="526" y="216">They are directions, rarely meaningful ones</text>
  <text class="pca-not-desc pca-not-row pca-not-r2" x="526" y="250">It can discard exactly the signal you needed</text>
  <text class="pca-not-desc pca-not-row pca-not-r3" x="526" y="284">Without it, units decide the components</text>
  <text class="pca-not-desc pca-not-row pca-not-r4" x="526" y="318">Variance is a proxy, and sometimes wrong</text>
  <text class="pca-not-sub" x="30" y="372">It discarding the signal is a real failure mode: a low-variance direction can carry the class separation entirely, and this method has no way to know that.</text>
</svg>
