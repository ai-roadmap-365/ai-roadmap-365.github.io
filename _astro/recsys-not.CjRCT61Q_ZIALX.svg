<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What recommenders are not</title>
  <style>
    .recsys-not-bg   { fill: #f8fafc; }
    .recsys-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recsys-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recsys-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recsys-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recsys-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recsys-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .recsys-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .recsys-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .recsys-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .recsys-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .recsys-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .recsys-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .recsys-not-row { opacity: 1; }
    .recsys-not-r0 { animation-delay: 0.00s; }
    .recsys-not-r1 { animation-delay: 0.45s; }
    .recsys-not-r2 { animation-delay: 0.90s; }
    .recsys-not-r3 { animation-delay: 1.35s; }
    .recsys-not-r4 { animation-delay: 1.80s; }
    .recsys-not-row { animation: recsys-not-reveal 7.3s ease-in-out infinite; }
    @keyframes recsys-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="recsys-not-bg" width="980" height="390"/>
  <text class="recsys-not-h1"  x="30" y="40">What recommenders are not</text>
  <text class="recsys-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="recsys-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="recsys-not-name" x="46" y="122">The misconception</text>
  <text class="recsys-not-desc" x="46" y="142">Commonly held.</text>
  <text class="recsys-not-desc recsys-not-row recsys-not-r0" x="46" y="182">Accuracy is the right measure</text>
  <text class="recsys-not-desc recsys-not-row recsys-not-r1" x="46" y="216">More personalisation is always better</text>
  <text class="recsys-not-desc recsys-not-row recsys-not-r2" x="46" y="250">No interaction means dislike</text>
  <text class="recsys-not-desc recsys-not-row recsys-not-r3" x="46" y="284">They show users what users want</text>
  <text class="recsys-not-desc recsys-not-row recsys-not-r4" x="46" y="318">They are a neutral ranking of options</text>
  <rect class="recsys-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="recsys-not-name" x="526" y="122">What is true</text>
  <text class="recsys-not-desc" x="526" y="142">Actually.</text>
  <text class="recsys-not-desc recsys-not-row recsys-not-r0" x="526" y="182">Ranking quality and diversity matter more</text>
  <text class="recsys-not-desc recsys-not-row recsys-not-r1" x="526" y="216">Filter bubbles reduce discovery and revenue</text>
  <text class="recsys-not-desc recsys-not-row recsys-not-r2" x="526" y="250">It usually means never seen</text>
  <text class="recsys-not-desc recsys-not-row recsys-not-r3" x="526" y="284">They show what similar users engaged with</text>
  <text class="recsys-not-desc recsys-not-row recsys-not-r4" x="526" y="318">They shape demand as much as reflect it</text>
  <text class="recsys-not-sub" x="30" y="372">Shaping demand rather than reflecting it is the point with the widest consequences: a recommender's output becomes tomorrow's training data.</text>
</svg>
