<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two requirements that conflict.">
  <title>The chunking tension</title>
  <style>
    .chunk-idea-bg   { fill: #f8fafc; }
    .chunk-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunk-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunk-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunk-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunk-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunk-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chunk-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .chunk-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .chunk-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .chunk-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .chunk-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .chunk-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .chunk-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .chunk-idea-stage { opacity: 1; }

    .chunk-idea-s0 { animation-delay: 0.00s; }
    .chunk-idea-e0 { animation-delay: 0.00s; }
    .chunk-idea-s1 { animation-delay: 1.28s; }
    .chunk-idea-e1 { animation-delay: 1.28s; }
    .chunk-idea-s2 { animation-delay: 2.56s; }
    .chunk-idea-e2 { animation-delay: 2.56s; }
    .chunk-idea-s3 { animation-delay: 3.84s; }
    .chunk-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .chunk-idea-conn  { animation: chunk-idea-trace 6.4s ease-in-out infinite; }
      .chunk-idea-stage { animation: chunk-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes chunk-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes chunk-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .chunk-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .chunk-idea-stage { animation: chunk-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes chunk-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="chunk-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="chunk-idea-bg" width="980" height="322"/>
  <text class="chunk-idea-h1"  x="30" y="40">The chunking tension</text>
  <text class="chunk-idea-sub" x="30" y="64">Two requirements that conflict.</text>
  <g class="chunk-idea-stage chunk-idea-s0">
    <rect class="chunk-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="chunk-idea-step" x="44" y="142">01</text>
    <text class="chunk-idea-name" x="70" y="142">Small chunks match precisely</text>
    <text class="chunk-idea-desc" x="44" y="166">The embedding is about one</text>
    <text class="chunk-idea-desc" x="44" y="182">thing.</text>
  </g>
  <line class="chunk-idea-line chunk-idea-conn chunk-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#chunk-idea-tip)"/>
  <g class="chunk-idea-stage chunk-idea-s1">
    <rect class="chunk-idea-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="chunk-idea-step" x="280" y="142">02</text>
    <text class="chunk-idea-name" x="306" y="142">But may not contain the answer</text>
    <text class="chunk-idea-desc" x="280" y="166">Which needed the sentence before</text>
    <text class="chunk-idea-desc" x="280" y="182">it.</text>
  </g>
  <line class="chunk-idea-line chunk-idea-conn chunk-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#chunk-idea-tip)"/>
  <g class="chunk-idea-stage chunk-idea-s2">
    <rect class="chunk-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="chunk-idea-step" x="516" y="142">03</text>
    <text class="chunk-idea-name" x="542" y="142">Large chunks are self-contained</text>
    <text class="chunk-idea-desc" x="516" y="166">Everything needed is present.</text>
  </g>
  <line class="chunk-idea-line chunk-idea-conn chunk-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#chunk-idea-tip)"/>
  <g class="chunk-idea-stage chunk-idea-s3">
    <rect class="chunk-idea-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="chunk-idea-step" x="752" y="142">04</text>
    <text class="chunk-idea-name" x="778" y="142">But their embedding is diluted</text>
    <text class="chunk-idea-desc" x="752" y="166">An average of several topics</text>
    <text class="chunk-idea-desc" x="752" y="182">matches none of them well.</text>
  </g>
  <text class="chunk-idea-sub" x="30" y="304">This tension is the whole subject, and the resolution below — retrieve small, supply large — is what most production systems converge on.</text>
</svg>
