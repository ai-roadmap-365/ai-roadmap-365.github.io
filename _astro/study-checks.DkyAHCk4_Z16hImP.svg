<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four questions.">
  <title>Checking your own study</title>
  <style>
    .study-checks-bg   { fill: #f8fafc; }
    .study-checks-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .study-checks-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .study-checks-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .study-checks-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .study-checks-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .study-checks-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .study-checks-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .study-checks-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .study-checks-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .study-checks-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .study-checks-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .study-checks-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .study-checks-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .study-checks-stage { opacity: 1; }

    .study-checks-s0 { animation-delay: 0.00s; }
    .study-checks-e0 { animation-delay: 0.00s; }
    .study-checks-s1 { animation-delay: 1.28s; }
    .study-checks-e1 { animation-delay: 1.28s; }
    .study-checks-s2 { animation-delay: 2.56s; }
    .study-checks-e2 { animation-delay: 2.56s; }
    .study-checks-s3 { animation-delay: 3.84s; }
    .study-checks-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .study-checks-conn  { animation: study-checks-trace 6.4s ease-in-out infinite; }
      .study-checks-stage { animation: study-checks-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes study-checks-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes study-checks-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .study-checks-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .study-checks-stage { animation: study-checks-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes study-checks-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="study-checks-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="study-checks-bg" width="980" height="322"/>
  <text class="study-checks-h1"  x="30" y="40">Checking your own study</text>
  <text class="study-checks-sub" x="30" y="64">Four questions.</text>
  <g class="study-checks-stage study-checks-s0">
    <rect class="study-checks-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="study-checks-step" x="44" y="142">01</text>
    <text class="study-checks-name" x="70" y="142">Can someone else rerun it and get these numbers?</text>
    <text class="study-checks-desc" x="44" y="166">From a clean environment.</text>
  </g>
  <line class="study-checks-line study-checks-conn study-checks-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#study-checks-tip)"/>
  <g class="study-checks-stage study-checks-s1">
    <rect class="study-checks-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="study-checks-step" x="280" y="142">02</text>
    <text class="study-checks-name" x="306" y="142">Does the data actually support each claim?</text>
    <text class="study-checks-desc" x="280" y="166">Or does the claim go further?</text>
  </g>
  <line class="study-checks-line study-checks-conn study-checks-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#study-checks-tip)"/>
  <g class="study-checks-stage study-checks-s2">
    <rect class="study-checks-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="study-checks-step" x="516" y="142">03</text>
    <text class="study-checks-name" x="542" y="142">What else could explain what you found?</text>
    <text class="study-checks-desc" x="516" y="166">Confounding, selection, chance.</text>
  </g>
  <line class="study-checks-line study-checks-conn study-checks-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#study-checks-tip)"/>
  <g class="study-checks-stage study-checks-s3">
    <rect class="study-checks-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="study-checks-step" x="752" y="142">04</text>
    <text class="study-checks-name" x="778" y="142">And have you stated the uncertainty plainly?</text>
    <text class="study-checks-desc" x="752" y="166">In words, not only in intervals.</text>
  </g>
  <text class="study-checks-sub" x="30" y="304">Asking what else could explain the finding is the check that most improves a study, and it is best done before someone else asks it for you.</text>
</svg>
