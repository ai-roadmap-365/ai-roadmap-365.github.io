<svg role="img" aria-label="Microservice production deployment stack showing Docker container Uvicorn ASGI workers Gunicorn process manager and Prometheus telemetry" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Production ML Container Deployment Architecture</title>
  <defs>
    <linearGradient id="bg194b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="stackCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg194b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">PRODUCTION CONTAINER &amp; PROCESS ARCHITECTURE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Gunicorn Master Process Managing Pre-Forked Uvicorn Workers with Prometheus Metrics</text>
  <g transform="translate(50, 85)">
    <rect width="750" height="295" fill="url(#stackCard)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Docker Boundary -->
    <rect x="25" y="25" width="700" height="245" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4" rx="6"/>
    <text x="45" y="48" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700">Docker Container Boundary (Alpine / Debian-Slim)</text>
    <!-- Gunicorn Master -->
    <rect x="50" y="70" width="180" height="175" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" rx="6"/>
    <text x="140" y="95" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Gunicorn Master</text>
    <text x="65" y="125" fill="#cbd5e1" font-family="system-ui" font-size="9">• Process Supervisor</text>
    <text x="65" y="150" fill="#cbd5e1" font-family="system-ui" font-size="9">• Fork Worker Pool</text>
    <text x="65" y="175" fill="#cbd5e1" font-family="system-ui" font-size="9">• Auto-Restart Dead</text>
    <text x="65" y="200" fill="#cbd5e1" font-family="system-ui" font-size="9">• Heartbeat Signal</text>
    <!-- Workers -->
    <rect x="270" y="60" width="220" height="60" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="4"/>
    <text x="380" y="85" fill="#34d399" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">Uvicorn Worker 1 (CPU Core 0)</text>
    <text x="380" y="105" fill="#94a3b8" font-family="system-ui" font-size="8" text-anchor="middle">Preloaded In-Memory Model Artifact</text>

    <rect x="270" y="130" width="220" height="60" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="4"/>
    <text x="380" y="155" fill="#34d399" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">Uvicorn Worker 2 (CPU Core 1)</text>
    <text x="380" y="175" fill="#94a3b8" font-family="system-ui" font-size="8" text-anchor="middle">Preloaded In-Memory Model Artifact</text>

    <rect x="270" y="200" width="220" height="60" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="4"/>
    <text x="380" y="225" fill="#34d399" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">Uvicorn Worker 3 (CPU Core 2)</text>
    <text x="380" y="245" fill="#94a3b8" font-family="system-ui" font-size="8" text-anchor="middle">Preloaded In-Memory Model Artifact</text>

    <!-- Telemetry -->
    <rect x="520" y="70" width="180" height="175" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" rx="6"/>
    <text x="610" y="95" fill="#f472b6" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Prometheus Exporter</text>
    <text x="535" y="125" fill="#cbd5e1" font-family="system-ui" font-size="9">• http_requests_total</text>
    <text x="535" y="150" fill="#cbd5e1" font-family="system-ui" font-size="9">• inference_latency_seconds</text>
    <text x="535" y="175" fill="#cbd5e1" font-family="system-ui" font-size="9">• prediction_distribution</text>
    <text x="535" y="200" fill="#cbd5e1" font-family="system-ui" font-size="9">• fallback_invocations</text>
  </g>
</svg>
