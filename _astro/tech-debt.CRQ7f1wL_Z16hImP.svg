<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four forms.">
  <title>Hidden technical debt</title>
  <style>
    .tech-debt-bg   { fill: #f8fafc; }
    .tech-debt-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tech-debt-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tech-debt-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tech-debt-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tech-debt-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tech-debt-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tech-debt-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tech-debt-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tech-debt-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tech-debt-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tech-debt-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tech-debt-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tech-debt-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tech-debt-stage { opacity: 1; }

    .tech-debt-s0 { animation-delay: 0.00s; }
    .tech-debt-e0 { animation-delay: 0.00s; }
    .tech-debt-s1 { animation-delay: 1.28s; }
    .tech-debt-e1 { animation-delay: 1.28s; }
    .tech-debt-s2 { animation-delay: 2.56s; }
    .tech-debt-e2 { animation-delay: 2.56s; }
    .tech-debt-s3 { animation-delay: 3.84s; }
    .tech-debt-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tech-debt-conn  { animation: tech-debt-trace 6.4s ease-in-out infinite; }
      .tech-debt-stage { animation: tech-debt-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tech-debt-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tech-debt-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tech-debt-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tech-debt-stage { animation: tech-debt-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tech-debt-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tech-debt-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tech-debt-bg" width="980" height="322"/>
  <text class="tech-debt-h1"  x="30" y="40">Hidden technical debt</text>
  <text class="tech-debt-sub" x="30" y="64">Four forms.</text>
  <g class="tech-debt-stage tech-debt-s0">
    <rect class="tech-debt-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tech-debt-step" x="44" y="142">01</text>
    <text class="tech-debt-name" x="70" y="142">Changing anything changes everything</text>
    <text class="tech-debt-desc" x="44" y="166">Features interact; no change is</text>
    <text class="tech-debt-desc" x="44" y="182">local.</text>
  </g>
  <line class="tech-debt-line tech-debt-conn tech-debt-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tech-debt-tip)"/>
  <g class="tech-debt-stage tech-debt-s1">
    <rect class="tech-debt-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tech-debt-step" x="280" y="142">02</text>
    <text class="tech-debt-name" x="306" y="142">Undeclared consumers depend on your outputs</text>
    <text class="tech-debt-desc" x="280" y="166">And break when you improve the</text>
    <text class="tech-debt-desc" x="280" y="182">model.</text>
  </g>
  <line class="tech-debt-line tech-debt-conn tech-debt-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tech-debt-tip)"/>
  <g class="tech-debt-stage tech-debt-s2">
    <rect class="tech-debt-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tech-debt-step" x="516" y="142">03</text>
    <text class="tech-debt-name" x="542" y="142">Unstable upstream data dependencies</text>
    <text class="tech-debt-desc" x="516" y="166">Which change without telling</text>
    <text class="tech-debt-desc" x="516" y="182">you.</text>
  </g>
  <line class="tech-debt-line tech-debt-conn tech-debt-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tech-debt-tip)"/>
  <g class="tech-debt-stage tech-debt-s3">
    <rect class="tech-debt-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tech-debt-step" x="752" y="142">04</text>
    <text class="tech-debt-name" x="778" y="142">And configuration sprawl</text>
    <text class="tech-debt-desc" x="752" y="166">Which is where most production</text>
    <text class="tech-debt-desc" x="752" y="182">errors actually originate.</text>
  </g>
  <text class="tech-debt-sub" x="30" y="304">Configuration being the leading source of production errors is the finding most teams find surprising, and it argues for treating configuration as code.</text>
</svg>
