<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four transformations.">
  <title>From logits to a token</title>
  <style>
    .sampling-pipeline-bg   { fill: #f8fafc; }
    .sampling-pipeline-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sampling-pipeline-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sampling-pipeline-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sampling-pipeline-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sampling-pipeline-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sampling-pipeline-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sampling-pipeline-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sampling-pipeline-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sampling-pipeline-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sampling-pipeline-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sampling-pipeline-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sampling-pipeline-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .sampling-pipeline-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .sampling-pipeline-stage { opacity: 1; }

    .sampling-pipeline-s0 { animation-delay: 0.00s; }
    .sampling-pipeline-e0 { animation-delay: 0.00s; }
    .sampling-pipeline-s1 { animation-delay: 1.28s; }
    .sampling-pipeline-e1 { animation-delay: 1.28s; }
    .sampling-pipeline-s2 { animation-delay: 2.56s; }
    .sampling-pipeline-e2 { animation-delay: 2.56s; }
    .sampling-pipeline-s3 { animation-delay: 3.84s; }
    .sampling-pipeline-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .sampling-pipeline-conn  { animation: sampling-pipeline-trace 6.4s ease-in-out infinite; }
      .sampling-pipeline-stage { animation: sampling-pipeline-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes sampling-pipeline-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes sampling-pipeline-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .sampling-pipeline-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .sampling-pipeline-stage { animation: sampling-pipeline-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes sampling-pipeline-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="sampling-pipeline-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="sampling-pipeline-bg" width="980" height="322"/>
  <text class="sampling-pipeline-h1"  x="30" y="40">From logits to a token</text>
  <text class="sampling-pipeline-sub" x="30" y="64">Four transformations.</text>
  <g class="sampling-pipeline-stage sampling-pipeline-s0">
    <rect class="sampling-pipeline-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="sampling-pipeline-step" x="44" y="142">01</text>
    <text class="sampling-pipeline-name" x="70" y="142">The model outputs a score per token</text>
    <text class="sampling-pipeline-desc" x="44" y="166">One for every entry in the</text>
    <text class="sampling-pipeline-desc" x="44" y="182">vocabulary.</text>
  </g>
  <line class="sampling-pipeline-line sampling-pipeline-conn sampling-pipeline-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#sampling-pipeline-tip)"/>
  <g class="sampling-pipeline-stage sampling-pipeline-s1">
    <rect class="sampling-pipeline-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="sampling-pipeline-step" x="280" y="142">02</text>
    <text class="sampling-pipeline-name" x="306" y="142">Temperature sharpens or flattens them</text>
    <text class="sampling-pipeline-desc" x="280" y="166">Low is nearly deterministic,</text>
    <text class="sampling-pipeline-desc" x="280" y="182">high is nearly uniform.</text>
    <text class="sampling-pipeline-edge" x="280" y="242">randomness</text>
  </g>
  <line class="sampling-pipeline-line sampling-pipeline-conn sampling-pipeline-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#sampling-pipeline-tip)"/>
  <g class="sampling-pipeline-stage sampling-pipeline-s2">
    <rect class="sampling-pipeline-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="sampling-pipeline-step" x="516" y="142">03</text>
    <text class="sampling-pipeline-name" x="542" y="142">Truncate the unlikely tail</text>
    <text class="sampling-pipeline-desc" x="516" y="166">By probability mass, or by rank.</text>
  </g>
  <line class="sampling-pipeline-line sampling-pipeline-conn sampling-pipeline-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#sampling-pipeline-tip)"/>
  <g class="sampling-pipeline-stage sampling-pipeline-s3">
    <rect class="sampling-pipeline-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="sampling-pipeline-step" x="752" y="142">04</text>
    <text class="sampling-pipeline-name" x="778" y="142">Then draw one at random</text>
    <text class="sampling-pipeline-desc" x="752" y="166">From what survives. That token</text>
    <text class="sampling-pipeline-desc" x="752" y="182">is appended and the loop</text>
    <text class="sampling-pipeline-desc" x="752" y="198">repeats.</text>
  </g>
  <text class="sampling-pipeline-sub" x="30" y="304">Truncation is what makes sampling usable: without it, the long tail of implausible tokens is collectively likely enough to be drawn, and one bad token derails everything after it.</text>
</svg>
