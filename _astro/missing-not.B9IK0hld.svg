<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What handling missing data is not</title>
  <style>
    .missing-not-bg   { fill: #f8fafc; }
    .missing-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .missing-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .missing-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .missing-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .missing-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .missing-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .missing-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .missing-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .missing-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .missing-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .missing-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .missing-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .missing-not-row { opacity: 1; }
    .missing-not-r0 { animation-delay: 0.00s; }
    .missing-not-r1 { animation-delay: 0.45s; }
    .missing-not-r2 { animation-delay: 0.90s; }
    .missing-not-r3 { animation-delay: 1.35s; }
    .missing-not-r4 { animation-delay: 1.80s; }
    .missing-not-row { animation: missing-not-reveal 7.3s ease-in-out infinite; }
    @keyframes missing-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="missing-not-bg" width="980" height="390"/>
  <text class="missing-not-h1"  x="30" y="40">What handling missing data is not</text>
  <text class="missing-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="missing-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="missing-not-name" x="46" y="122">The misconception</text>
  <text class="missing-not-desc" x="46" y="142">Commonly held.</text>
  <text class="missing-not-desc missing-not-row missing-not-r0" x="46" y="182">Dropping incomplete rows is the safe default</text>
  <text class="missing-not-desc missing-not-row missing-not-r1" x="46" y="216">Mean imputation is harmless</text>
  <text class="missing-not-desc missing-not-row missing-not-r2" x="46" y="250">Imputation can be fitted on all the data</text>
  <text class="missing-not-desc missing-not-row missing-not-r3" x="46" y="284">Missingness carries no information</text>
  <text class="missing-not-desc missing-not-row missing-not-r4" x="46" y="318">More sophisticated imputation is always better</text>
  <rect class="missing-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="missing-not-name" x="526" y="122">What is true</text>
  <text class="missing-not-desc" x="526" y="142">Actually.</text>
  <text class="missing-not-desc missing-not-row missing-not-r0" x="526" y="182">It biases the data whenever missingness relates to the outcome</text>
  <text class="missing-not-desc missing-not-row missing-not-r1" x="526" y="216">It shrinks variance and distorts relationships</text>
  <text class="missing-not-desc missing-not-row missing-not-r2" x="526" y="250">That leaks, exactly as scaling does</text>
  <text class="missing-not-desc missing-not-row missing-not-r3" x="526" y="284">It is frequently among the strongest signals</text>
  <text class="missing-not-desc missing-not-row missing-not-r4" x="526" y="318">Native handling often beats all of it</text>
  <text class="missing-not-sub" x="30" y="372">Dropping rows feeling safe is the most damaging of these, because the bias it introduces is invisible: the remaining data looks entirely clean.</text>
</svg>
