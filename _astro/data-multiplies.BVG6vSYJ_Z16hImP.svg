<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And the deletion reached one.">
  <title>One document, six copies</title>
  <style>
    .data-multiplies-bg   { fill: #f8fafc; }
    .data-multiplies-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .data-multiplies-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .data-multiplies-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .data-multiplies-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .data-multiplies-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .data-multiplies-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .data-multiplies-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .data-multiplies-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .data-multiplies-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .data-multiplies-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .data-multiplies-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .data-multiplies-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .data-multiplies-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .data-multiplies-stage { opacity: 1; }

    .data-multiplies-s0 { animation-delay: 0.00s; }
    .data-multiplies-e0 { animation-delay: 0.00s; }
    .data-multiplies-s1 { animation-delay: 1.33s; }
    .data-multiplies-e1 { animation-delay: 1.33s; }
    .data-multiplies-s2 { animation-delay: 2.67s; }
    .data-multiplies-e2 { animation-delay: 2.67s; }
    .data-multiplies-s3 { animation-delay: 4.00s; }
    .data-multiplies-e3 { animation-delay: 4.00s; }
    .data-multiplies-s4 { animation-delay: 5.33s; }
    .data-multiplies-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .data-multiplies-conn  { animation: data-multiplies-trace 8s ease-in-out infinite; }
      .data-multiplies-stage { animation: data-multiplies-arrive 8s ease-in-out infinite; }
    }
    @keyframes data-multiplies-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes data-multiplies-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .data-multiplies-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .data-multiplies-stage { animation: data-multiplies-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes data-multiplies-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="data-multiplies-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="data-multiplies-bg" width="980" height="322"/>
  <text class="data-multiplies-h1"  x="30" y="40">One document, six copies</text>
  <text class="data-multiplies-sub" x="30" y="64">And the deletion reached one.</text>
  <g class="data-multiplies-stage data-multiplies-s0">
    <rect class="data-multiplies-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="data-multiplies-step" x="44" y="142">01</text>
    <text class="data-multiplies-name" x="70" y="142">The document</text>
    <text class="data-multiplies-desc" x="44" y="166">Arrives, and is stored.</text>
  </g>
  <line class="data-multiplies-line data-multiplies-conn data-multiplies-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#data-multiplies-tip)"/>
  <g class="data-multiplies-stage data-multiplies-s1">
    <rect class="data-multiplies-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="data-multiplies-step" x="233" y="142">02</text>
    <text class="data-multiplies-name" x="259" y="142">Extracted text</text>
    <text class="data-multiplies-desc" x="233" y="166">A second copy, in a</text>
    <text class="data-multiplies-desc" x="233" y="182">different store.</text>
  </g>
  <line class="data-multiplies-line data-multiplies-conn data-multiplies-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#data-multiplies-tip)"/>
  <g class="data-multiplies-stage data-multiplies-s2">
    <rect class="data-multiplies-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="data-multiplies-step" x="422" y="142">03</text>
    <text class="data-multiplies-name" x="448" y="142">Chunks</text>
    <text class="data-multiplies-desc" x="422" y="166">Many copies, split.</text>
  </g>
  <line class="data-multiplies-line data-multiplies-conn data-multiplies-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#data-multiplies-tip)"/>
  <g class="data-multiplies-stage data-multiplies-s3">
    <rect class="data-multiplies-warn" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="data-multiplies-step" x="611" y="142">04</text>
    <text class="data-multiplies-name" x="637" y="142">Vectors</text>
    <text class="data-multiplies-desc" x="611" y="166">In the index. Not</text>
    <text class="data-multiplies-desc" x="611" y="182">anonymous — inversion</text>
    <text class="data-multiplies-desc" x="611" y="198">recovers content.</text>
  </g>
  <line class="data-multiplies-line data-multiplies-conn data-multiplies-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#data-multiplies-tip)"/>
  <g class="data-multiplies-stage data-multiplies-s4">
    <rect class="data-multiplies-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="data-multiplies-step" x="800" y="142">05</text>
    <text class="data-multiplies-name" x="826" y="142">Cached responses and traces</text>
    <text class="data-multiplies-desc" x="800" y="166">Quoting the content,</text>
    <text class="data-multiplies-desc" x="800" y="182">retained longest,</text>
    <text class="data-multiplies-desc" x="800" y="198">examined least.</text>
  </g>
  <text class="data-multiplies-sub" x="30" y="304">The data multiplied and the deletion did not, which is the defining privacy problem of these systems and an architectural one rather than a legal one.</text>
</svg>
