<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And where it is overhead.">
  <title>Where this belongs</title>
  <style>
    .logging-when-bg   { fill: #f8fafc; }
    .logging-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .logging-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .logging-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .logging-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .logging-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .logging-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .logging-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .logging-when-row { opacity: 1; }
    .logging-when-r0 { animation-delay: 0.00s; }
    .logging-when-r1 { animation-delay: 0.45s; }
    .logging-when-r2 { animation-delay: 0.90s; }
    .logging-when-r3 { animation-delay: 1.35s; }
    .logging-when-r4 { animation-delay: 1.80s; }
    .logging-when-row { animation: logging-when-reveal 7.3s ease-in-out infinite; }
    @keyframes logging-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="logging-when-bg" width="980" height="390"/>
  <text class="logging-when-h1"  x="30" y="40">Where this belongs</text>
  <text class="logging-when-sub" x="30" y="64">And where it is overhead.</text>
  <rect class="logging-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="logging-when-name" x="46" y="122">Deploy it</text>
  <text class="logging-when-desc" x="46" y="142">Anywhere money or law applies.</text>
  <text class="logging-when-desc logging-when-row logging-when-r0" x="46" y="182">Multi-tenant SaaS products</text>
  <text class="logging-when-desc logging-when-row logging-when-r1" x="46" y="216">Customer-facing AI applications</text>
  <text class="logging-when-desc logging-when-row logging-when-r2" x="46" y="250">Regulated environments</text>
  <text class="logging-when-desc logging-when-row logging-when-r3" x="46" y="284">Pay-per-token API services</text>
  <text class="logging-when-desc logging-when-row logging-when-r4" x="46" y="318">Anywhere a bill must be explained</text>
  <rect class="logging-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="logging-when-name" x="526" y="122">Do not</text>
  <text class="logging-when-desc" x="526" y="142">No tenants, no regulator.</text>
  <text class="logging-when-desc logging-when-row logging-when-r0" x="526" y="182">Single-user local scripts</text>
  <text class="logging-when-desc logging-when-row logging-when-r1" x="526" y="216">Offline evaluation benchmarks</text>
  <text class="logging-when-desc logging-when-row logging-when-r2" x="526" y="250">ClickHouse for a hundred events</text>
  <text class="logging-when-desc logging-when-row logging-when-r3" x="526" y="284">But scrub PII anyway</text>
  <text class="logging-when-desc logging-when-row logging-when-r4" x="526" y="318">And structure the events anyway</text>
  <text class="logging-when-sub" x="30" y="372">The two carve-outs on the right are deliberate: the storage tier is proportional to scale and the scrubbing is not, because a prompt written to a local file is still a prompt written to a file.</text>
</svg>
