<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Distance with missing values</title>
  <style>
    .nan-euclidean-bg   { fill: #f8fafc; }
    .nan-euclidean-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nan-euclidean-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nan-euclidean-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nan-euclidean-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nan-euclidean-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nan-euclidean-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nan-euclidean-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .nan-euclidean-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .nan-euclidean-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .nan-euclidean-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .nan-euclidean-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .nan-euclidean-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .nan-euclidean-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .nan-euclidean-stage { opacity: 1; }

    .nan-euclidean-s0 { animation-delay: 0.00s; }
    .nan-euclidean-e0 { animation-delay: 0.00s; }
    .nan-euclidean-s1 { animation-delay: 1.28s; }
    .nan-euclidean-e1 { animation-delay: 1.28s; }
    .nan-euclidean-s2 { animation-delay: 2.56s; }
    .nan-euclidean-e2 { animation-delay: 2.56s; }
    .nan-euclidean-s3 { animation-delay: 3.84s; }
    .nan-euclidean-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .nan-euclidean-conn  { animation: nan-euclidean-trace 6.4s ease-in-out infinite; }
      .nan-euclidean-stage { animation: nan-euclidean-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes nan-euclidean-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes nan-euclidean-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .nan-euclidean-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .nan-euclidean-stage { animation: nan-euclidean-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes nan-euclidean-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="nan-euclidean-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="nan-euclidean-bg" width="980" height="322"/>
  <text class="nan-euclidean-h1"  x="30" y="40">Distance with missing values</text>
  <text class="nan-euclidean-sub" x="30" y="64">Four steps.</text>
  <g class="nan-euclidean-stage nan-euclidean-s0">
    <rect class="nan-euclidean-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="nan-euclidean-step" x="44" y="142">01</text>
    <text class="nan-euclidean-name" x="70" y="142">Ordinary distance needs every dimension</text>
    <text class="nan-euclidean-desc" x="44" y="166">One missing value makes it</text>
    <text class="nan-euclidean-desc" x="44" y="182">undefined.</text>
  </g>
  <line class="nan-euclidean-line nan-euclidean-conn nan-euclidean-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#nan-euclidean-tip)"/>
  <g class="nan-euclidean-stage nan-euclidean-s1">
    <rect class="nan-euclidean-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="nan-euclidean-step" x="280" y="142">02</text>
    <text class="nan-euclidean-name" x="306" y="142">So compute over the dimensions both rows have</text>
    <text class="nan-euclidean-desc" x="280" y="166">Ignoring the rest.</text>
  </g>
  <line class="nan-euclidean-line nan-euclidean-conn nan-euclidean-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#nan-euclidean-tip)"/>
  <g class="nan-euclidean-stage nan-euclidean-s2">
    <rect class="nan-euclidean-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="nan-euclidean-step" x="516" y="142">03</text>
    <text class="nan-euclidean-name" x="542" y="142">Then rescale by the proportion present</text>
    <text class="nan-euclidean-desc" x="516" y="166">So rows with fewer shared</text>
    <text class="nan-euclidean-desc" x="516" y="182">dimensions are not artificially</text>
    <text class="nan-euclidean-desc" x="516" y="198">close.</text>
  </g>
  <line class="nan-euclidean-line nan-euclidean-conn nan-euclidean-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#nan-euclidean-tip)"/>
  <g class="nan-euclidean-stage nan-euclidean-s3">
    <rect class="nan-euclidean-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="nan-euclidean-step" x="752" y="142">04</text>
    <text class="nan-euclidean-name" x="778" y="142">Which lets neighbour-based imputation work</text>
    <text class="nan-euclidean-desc" x="752" y="166">On incomplete data.</text>
    <text class="nan-euclidean-edge" x="752" y="242">approximate</text>
  </g>
  <text class="nan-euclidean-sub" x="30" y="304">The rescaling is what stops rows that share only one observed column from appearing to be near neighbours, which would otherwise corrupt the imputation.</text>
</svg>
