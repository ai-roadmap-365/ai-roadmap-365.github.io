<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when to use a desktop host.">
  <title>When to build a client</title>
  <style>
    .build-client-when-bg   { fill: #f8fafc; }
    .build-client-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .build-client-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .build-client-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .build-client-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .build-client-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .build-client-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .build-client-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .build-client-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .build-client-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .build-client-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .build-client-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .build-client-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .build-client-when-row { opacity: 1; }
    .build-client-when-r0 { animation-delay: 0.00s; }
    .build-client-when-r1 { animation-delay: 0.45s; }
    .build-client-when-r2 { animation-delay: 0.90s; }
    .build-client-when-r3 { animation-delay: 1.35s; }
    .build-client-when-r4 { animation-delay: 1.80s; }
    .build-client-when-row { animation: build-client-when-reveal 7.3s ease-in-out infinite; }
    @keyframes build-client-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="build-client-when-bg" width="980" height="390"/>
  <text class="build-client-when-h1"  x="30" y="40">When to build a client</text>
  <text class="build-client-when-sub" x="30" y="64">And when to use a desktop host.</text>
  <rect class="build-client-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="build-client-when-name" x="46" y="122">Build one</text>
  <text class="build-client-when-desc" x="46" y="142">Programmatic control.</text>
  <text class="build-client-when-desc build-client-when-row build-client-when-r0" x="46" y="182">Backend autonomous agents</text>
  <text class="build-client-when-desc build-client-when-row build-client-when-r1" x="46" y="216">Background automation services</text>
  <text class="build-client-when-desc build-client-when-row build-client-when-r2" x="46" y="250">CLI assistants and CI bots</text>
  <text class="build-client-when-desc build-client-when-row build-client-when-r3" x="46" y="284">Connecting to any ecosystem server</text>
  <text class="build-client-when-desc build-client-when-row build-client-when-r4" x="46" y="318">Custom approval and audit requirements</text>
  <rect class="build-client-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="build-client-when-name" x="526" y="122">Use an existing host</text>
  <text class="build-client-when-desc" x="526" y="142">Interactive work.</text>
  <text class="build-client-when-desc build-client-when-row build-client-when-r0" x="526" y="182">Claude Desktop, Cursor, Zed</text>
  <text class="build-client-when-desc build-client-when-row build-client-when-r1" x="526" y="216">Personal interactive chat</text>
  <text class="build-client-when-desc build-client-when-row build-client-when-r2" x="526" y="250">AI coding assistance</text>
  <text class="build-client-when-desc build-client-when-row build-client-when-r3" x="526" y="284">A single fixed database, no modularity</text>
  <text class="build-client-when-desc build-client-when-row build-client-when-r4" x="526" y="318">Nothing to orchestrate</text>
  <text class="build-client-when-sub" x="30" y="372">The dividing question is whether anything needs to happen without a person present: an interactive host is excellent at what it does and cannot be scheduled, gated or embedded in a pipeline.</text>
</svg>
