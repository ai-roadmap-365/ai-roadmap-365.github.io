<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And where attention replaced it.">
  <title>Where recurrence still fits</title>
  <style>
    .rnn-when-bg   { fill: #f8fafc; }
    .rnn-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rnn-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rnn-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rnn-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rnn-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rnn-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rnn-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rnn-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rnn-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rnn-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rnn-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rnn-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rnn-when-row { opacity: 1; }
    .rnn-when-r0 { animation-delay: 0.00s; }
    .rnn-when-r1 { animation-delay: 0.45s; }
    .rnn-when-r2 { animation-delay: 0.90s; }
    .rnn-when-r3 { animation-delay: 1.35s; }
    .rnn-when-r4 { animation-delay: 1.80s; }
    .rnn-when-row { animation: rnn-when-reveal 7.3s ease-in-out infinite; }
    @keyframes rnn-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="rnn-when-bg" width="980" height="390"/>
  <text class="rnn-when-h1"  x="30" y="40">Where recurrence still fits</text>
  <text class="rnn-when-sub" x="30" y="64">And where attention replaced it.</text>
  <rect class="rnn-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="rnn-when-name" x="46" y="122">Recurrence fits</text>
  <text class="rnn-when-desc" x="46" y="142">Streaming and constrained.</text>
  <text class="rnn-when-desc rnn-when-row rnn-when-r0" x="46" y="182">Streaming input with no end</text>
  <text class="rnn-when-desc rnn-when-row rnn-when-r1" x="46" y="216">Constant memory per step required</text>
  <text class="rnn-when-desc rnn-when-row rnn-when-r2" x="46" y="250">Very constrained inference hardware</text>
  <text class="rnn-when-desc rnn-when-row rnn-when-r3" x="46" y="284">Short sequences with strong order</text>
  <text class="rnn-when-desc rnn-when-row rnn-when-r4" x="46" y="318">Real-time signal processing</text>
  <rect class="rnn-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="rnn-when-name" x="526" y="122">Attention dominates</text>
  <text class="rnn-when-desc" x="526" y="142">Nearly everything else.</text>
  <text class="rnn-when-desc rnn-when-row rnn-when-r0" x="526" y="182">Long-range dependencies</text>
  <text class="rnn-when-desc rnn-when-row rnn-when-r1" x="526" y="216">Anything trainable on parallel hardware</text>
  <text class="rnn-when-desc rnn-when-row rnn-when-r2" x="526" y="250">Language modelling at scale</text>
  <text class="rnn-when-desc rnn-when-row rnn-when-r3" x="526" y="284">Where training throughput matters</text>
  <text class="rnn-when-desc rnn-when-row rnn-when-r4" x="526" y="318">Which is most of modern NLP</text>
  <text class="rnn-when-sub" x="30" y="372">The streaming case is the one that has not been fully displaced: a model that must process an unbounded stream with bounded memory is a recurrent problem regardless of what is fashionable.</text>
</svg>
