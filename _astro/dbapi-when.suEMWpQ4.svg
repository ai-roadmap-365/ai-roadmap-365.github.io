<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the situation.">
  <title>Raw interface or an object mapper</title>
  <style>
    .dbapi-when-bg   { fill: #f8fafc; }
    .dbapi-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dbapi-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dbapi-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dbapi-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dbapi-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dbapi-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dbapi-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dbapi-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dbapi-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dbapi-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dbapi-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dbapi-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dbapi-when-row { opacity: 1; }
    .dbapi-when-r0 { animation-delay: 0.00s; }
    .dbapi-when-r1 { animation-delay: 0.45s; }
    .dbapi-when-r2 { animation-delay: 0.90s; }
    .dbapi-when-r3 { animation-delay: 1.35s; }
    .dbapi-when-r4 { animation-delay: 1.80s; }
    .dbapi-when-row { animation: dbapi-when-reveal 7.3s ease-in-out infinite; }
    @keyframes dbapi-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="dbapi-when-bg" width="980" height="390"/>
  <text class="dbapi-when-h1"  x="30" y="40">Raw interface or an object mapper</text>
  <text class="dbapi-when-sub" x="30" y="64">By the situation.</text>
  <rect class="dbapi-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="dbapi-when-name" x="46" y="122">Raw interface</text>
  <text class="dbapi-when-desc" x="46" y="142">Four cases.</text>
  <text class="dbapi-when-desc dbapi-when-row dbapi-when-r0" x="46" y="182">Scripts and analysis</text>
  <text class="dbapi-when-desc dbapi-when-row dbapi-when-r1" x="46" y="216">Queries you want full control over</text>
  <text class="dbapi-when-desc dbapi-when-row dbapi-when-r2" x="46" y="250">Performance-critical access paths</text>
  <text class="dbapi-when-desc dbapi-when-row dbapi-when-r3" x="46" y="284">Learning what actually runs</text>
  <text class="dbapi-when-desc dbapi-when-row dbapi-when-r4" x="46" y="318">A small number of statements</text>
  <rect class="dbapi-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="dbapi-when-name" x="526" y="122">An object mapper</text>
  <text class="dbapi-when-desc" x="526" y="142">Also four.</text>
  <text class="dbapi-when-desc dbapi-when-row dbapi-when-r0" x="526" y="182">An application with many entities</text>
  <text class="dbapi-when-desc dbapi-when-row dbapi-when-r1" x="526" y="216">Schema migrations to manage</text>
  <text class="dbapi-when-desc dbapi-when-row dbapi-when-r2" x="526" y="250">A team wanting one access pattern</text>
  <text class="dbapi-when-desc dbapi-when-row dbapi-when-r3" x="526" y="284">Where mapping rows to objects is repetitive</text>
  <text class="dbapi-when-desc dbapi-when-row dbapi-when-r4" x="526" y="318">Provided you can still see the queries</text>
  <text class="dbapi-when-sub" x="30" y="372">Still being able to see the generated queries is the condition worth insisting on, because a mapper that hides its statements hides its performance too.</text>
</svg>
