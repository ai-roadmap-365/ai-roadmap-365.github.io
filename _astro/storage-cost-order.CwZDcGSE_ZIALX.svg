<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Not percentages, which is what makes this decision matter.">
  <title>The cost differences are orders of magnitude</title>
  <style>
    .storage-cost-order-bg   { fill: #f8fafc; }
    .storage-cost-order-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .storage-cost-order-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .storage-cost-order-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .storage-cost-order-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .storage-cost-order-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .storage-cost-order-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .storage-cost-order-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .storage-cost-order-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .storage-cost-order-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .storage-cost-order-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .storage-cost-order-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .storage-cost-order-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .storage-cost-order-row { opacity: 1; }
    .storage-cost-order-r0 { animation-delay: 0.00s; }
    .storage-cost-order-r1 { animation-delay: 0.45s; }
    .storage-cost-order-r2 { animation-delay: 0.90s; }
    .storage-cost-order-r3 { animation-delay: 1.35s; }
    .storage-cost-order-r4 { animation-delay: 1.80s; }
    .storage-cost-order-row { animation: storage-cost-order-reveal 7.3s ease-in-out infinite; }
    @keyframes storage-cost-order-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="storage-cost-order-bg" width="980" height="390"/>
  <text class="storage-cost-order-h1"  x="30" y="40">The cost differences are orders of magnitude</text>
  <text class="storage-cost-order-sub" x="30" y="64">Not percentages, which is what makes this decision matter.</text>
  <rect class="storage-cost-order-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="storage-cost-order-name" x="46" y="122">Database storage</text>
  <text class="storage-cost-order-desc" x="46" y="142">Expensive, and you are buying something.</text>
  <text class="storage-cost-order-desc storage-cost-order-row storage-cost-order-r0" x="46" y="182">Roughly ten times the price per terabyte</text>
  <text class="storage-cost-order-desc storage-cost-order-row storage-cost-order-r1" x="46" y="216">Buys indexes, transactions, query planning</text>
  <text class="storage-cost-order-desc storage-cost-order-row storage-cost-order-r2" x="46" y="250">Worth it when you query selectively</text>
  <text class="storage-cost-order-desc storage-cost-order-row storage-cost-order-r3" x="46" y="284">Wasted entirely on a full sequential scan</text>
  <text class="storage-cost-order-desc storage-cost-order-row storage-cost-order-r4" x="46" y="318">Backups scale with it, and cost too</text>
  <rect class="storage-cost-order-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="storage-cost-order-name" x="526" y="122">Object storage</text>
  <text class="storage-cost-order-desc" x="526" y="142">Cheap, durable, and dumb.</text>
  <text class="storage-cost-order-desc storage-cost-order-row storage-cost-order-r0" x="526" y="182">Roughly a tenth the price per terabyte</text>
  <text class="storage-cost-order-desc storage-cost-order-row storage-cost-order-r1" x="526" y="216">Multiple copies across machines</text>
  <text class="storage-cost-order-desc storage-cost-order-row storage-cost-order-r2" x="526" y="250">Effectively unlimited capacity</text>
  <text class="storage-cost-order-desc storage-cost-order-row storage-cost-order-r3" x="526" y="284">Cannot answer any question about contents</text>
  <text class="storage-cost-order-desc storage-cost-order-row storage-cost-order-r4" x="526" y="318">Egress often costs more than storage does</text>
  <text class="storage-cost-order-sub" x="30" y="372">That last line catches people out: moving data out is frequently the larger bill, which is why "query it where it sits" services exist and why region choice matters.</text>
</svg>
