<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Not sophistication.">
  <title>Severity is blast radius</title>
  <style>
    .severity-weighting-bg   { fill: #f8fafc; }
    .severity-weighting-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .severity-weighting-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .severity-weighting-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .severity-weighting-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .severity-weighting-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .severity-weighting-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .severity-weighting-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .severity-weighting-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .severity-weighting-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .severity-weighting-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .severity-weighting-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .severity-weighting-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .severity-weighting-row { opacity: 1; }
    .severity-weighting-r0 { animation-delay: 0.00s; }
    .severity-weighting-r1 { animation-delay: 0.45s; }
    .severity-weighting-r2 { animation-delay: 0.90s; }
    .severity-weighting-r3 { animation-delay: 1.35s; }
    .severity-weighting-r4 { animation-delay: 1.80s; }
    .severity-weighting-row { animation: severity-weighting-reveal 7.3s ease-in-out infinite; }
    @keyframes severity-weighting-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="severity-weighting-bg" width="980" height="390"/>
  <text class="severity-weighting-h1"  x="30" y="40">Severity is blast radius</text>
  <text class="severity-weighting-sub" x="30" y="64">Not sophistication.</text>
  <rect class="severity-weighting-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="severity-weighting-name" x="46" y="122">By consequence</text>
  <text class="severity-weighting-desc" x="46" y="142">What the review should do.</text>
  <text class="severity-weighting-desc severity-weighting-row severity-weighting-r0" x="46" y="182">A missing spend cap is HIGH</text>
  <text class="severity-weighting-desc severity-weighting-row severity-weighting-r1" x="46" y="216">Dull, and it takes the service down</text>
  <text class="severity-weighting-desc severity-weighting-row severity-weighting-r2" x="46" y="250">Ordinary configuration decisions</text>
  <text class="severity-weighting-desc severity-weighting-row severity-weighting-r3" x="46" y="284">Ranked by what happens if exploited</text>
  <text class="severity-weighting-desc severity-weighting-row severity-weighting-r4" x="46" y="318">Fix order follows directly</text>
  <rect class="severity-weighting-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="severity-weighting-name" x="526" y="122">By cleverness</text>
  <text class="severity-weighting-desc" x="526" y="142">What reviews drift into.</text>
  <text class="severity-weighting-desc severity-weighting-row severity-weighting-r0" x="526" y="182">The interesting finding gets attention</text>
  <text class="severity-weighting-desc severity-weighting-row severity-weighting-r1" x="526" y="216">Sophistication mistaken for severity</text>
  <text class="severity-weighting-desc severity-weighting-row severity-weighting-r2" x="526" y="250">Exotic paths over common ones</text>
  <text class="severity-weighting-desc severity-weighting-row severity-weighting-r3" x="526" y="284">Ranked by how clever the attack is</text>
  <text class="severity-weighting-desc severity-weighting-row severity-weighting-r4" x="526" y="318">The boring, likely failure stays open</text>
  <text class="severity-weighting-sub" x="30" y="372">This is why the OWASP lists rank by what actually causes incidents rather than by what is most interesting: the boring, common failures are the ones that keep happening.</text>
</svg>
