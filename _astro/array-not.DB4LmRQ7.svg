<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things arrays are not</title>
  <style>
    .array-not-bg   { fill: #f8fafc; }
    .array-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .array-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .array-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .array-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .array-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .array-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .array-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .array-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .array-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .array-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .array-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .array-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .array-not-row { opacity: 1; }
    .array-not-r0 { animation-delay: 0.00s; }
    .array-not-r1 { animation-delay: 0.45s; }
    .array-not-r2 { animation-delay: 0.90s; }
    .array-not-r3 { animation-delay: 1.35s; }
    .array-not-r4 { animation-delay: 1.80s; }
    .array-not-row { animation: array-not-reveal 7.3s ease-in-out infinite; }
    @keyframes array-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="array-not-bg" width="980" height="390"/>
  <text class="array-not-h1"  x="30" y="40">Four things arrays are not</text>
  <text class="array-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="array-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="array-not-name" x="46" y="122">The misconception</text>
  <text class="array-not-desc" x="46" y="142">Commonly held.</text>
  <text class="array-not-desc array-not-row array-not-r0" x="46" y="182">An array is a fast list</text>
  <text class="array-not-desc array-not-row array-not-r1" x="46" y="216">Slicing gives an independent copy</text>
  <text class="array-not-desc array-not-row array-not-r2" x="46" y="250">Integer arrays cannot overflow</text>
  <text class="array-not-desc array-not-row array-not-r3" x="46" y="284">Missing values compare equal to themselves</text>
  <text class="array-not-desc array-not-row array-not-r4" x="46" y="318">Looping over an array is fine</text>
  <rect class="array-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="array-not-name" x="526" y="122">What is true</text>
  <text class="array-not-desc" x="526" y="142">Actually.</text>
  <text class="array-not-desc array-not-row array-not-r0" x="526" y="182">It is a typed, contiguous block; lists are neither</text>
  <text class="array-not-desc array-not-row array-not-r1" x="526" y="216">It usually gives a view sharing memory</text>
  <text class="array-not-desc array-not-row array-not-r2" x="526" y="250">They wrap around silently</text>
  <text class="array-not-desc array-not-row array-not-r3" x="526" y="284">They are unequal to everything, including themselves</text>
  <text class="array-not-desc array-not-row array-not-r4" x="526" y="318">It discards the entire performance advantage</text>
  <text class="array-not-sub" x="30" y="372">The last row is the one that matters most in practice: an explicit loop over an array is slower than the equivalent loop over a list, not faster.</text>
</svg>
