<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The central trade.">
  <title>Open weights against a hosted API</title>
  <style>
    .open-vs-closed-bg   { fill: #f8fafc; }
    .open-vs-closed-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .open-vs-closed-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .open-vs-closed-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .open-vs-closed-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .open-vs-closed-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .open-vs-closed-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .open-vs-closed-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .open-vs-closed-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .open-vs-closed-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .open-vs-closed-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .open-vs-closed-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .open-vs-closed-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .open-vs-closed-row { opacity: 1; }
    .open-vs-closed-r0 { animation-delay: 0.00s; }
    .open-vs-closed-r1 { animation-delay: 0.45s; }
    .open-vs-closed-r2 { animation-delay: 0.90s; }
    .open-vs-closed-r3 { animation-delay: 1.35s; }
    .open-vs-closed-r4 { animation-delay: 1.80s; }
    .open-vs-closed-row { animation: open-vs-closed-reveal 7.3s ease-in-out infinite; }
    @keyframes open-vs-closed-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="open-vs-closed-bg" width="980" height="390"/>
  <text class="open-vs-closed-h1"  x="30" y="40">Open weights against a hosted API</text>
  <text class="open-vs-closed-sub" x="30" y="64">The central trade.</text>
  <rect class="open-vs-closed-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="open-vs-closed-name" x="46" y="122">Open weights</text>
  <text class="open-vs-closed-desc" x="46" y="142">Control.</text>
  <text class="open-vs-closed-desc open-vs-closed-row open-vs-closed-r0" x="46" y="182">The model runs on your infrastructure</text>
  <text class="open-vs-closed-desc open-vs-closed-row open-vs-closed-r1" x="46" y="216">Data never leaves it</text>
  <text class="open-vs-closed-desc open-vs-closed-row open-vs-closed-r2" x="46" y="250">The version never changes underneath you</text>
  <text class="open-vs-closed-desc open-vs-closed-row open-vs-closed-r3" x="46" y="284">Fixed infrastructure cost, not per token</text>
  <text class="open-vs-closed-desc open-vs-closed-row open-vs-closed-r4" x="46" y="318">And you own the operations</text>
  <rect class="open-vs-closed-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="open-vs-closed-name" x="526" y="122">Hosted API</text>
  <text class="open-vs-closed-desc" x="526" y="142">Convenience.</text>
  <text class="open-vs-closed-desc open-vs-closed-row open-vs-closed-r0" x="526" y="182">No infrastructure at all</text>
  <text class="open-vs-closed-desc open-vs-closed-row open-vs-closed-r1" x="526" y="216">Frontier capability immediately</text>
  <text class="open-vs-closed-desc open-vs-closed-row open-vs-closed-r2" x="526" y="250">Scales without planning</text>
  <text class="open-vs-closed-desc open-vs-closed-row open-vs-closed-r3" x="526" y="284">Per-token cost, zero when idle</text>
  <text class="open-vs-closed-desc open-vs-closed-row open-vs-closed-r4" x="526" y="318">And you own none of the operations</text>
  <text class="open-vs-closed-sub" x="30" y="372">Neither column is the advanced choice: the decision is set by volume, data constraints and the capability the task actually needs, and it changes as any of those move.</text>
</svg>
