<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="It is not free, and the cost is real.">
  <title>What streaming costs</title>
  <style>
    .streaming-tradeoff-bg   { fill: #f8fafc; }
    .streaming-tradeoff-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-tradeoff-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-tradeoff-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-tradeoff-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-tradeoff-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-tradeoff-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .streaming-tradeoff-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .streaming-tradeoff-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .streaming-tradeoff-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .streaming-tradeoff-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .streaming-tradeoff-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .streaming-tradeoff-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .streaming-tradeoff-row { opacity: 1; }
    .streaming-tradeoff-r0 { animation-delay: 0.00s; }
    .streaming-tradeoff-r1 { animation-delay: 0.45s; }
    .streaming-tradeoff-r2 { animation-delay: 0.90s; }
    .streaming-tradeoff-r3 { animation-delay: 1.35s; }
    .streaming-tradeoff-r4 { animation-delay: 1.80s; }
    .streaming-tradeoff-row { animation: streaming-tradeoff-reveal 7.3s ease-in-out infinite; }
    @keyframes streaming-tradeoff-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="streaming-tradeoff-bg" width="980" height="390"/>
  <text class="streaming-tradeoff-h1"  x="30" y="40">What streaming costs</text>
  <text class="streaming-tradeoff-sub" x="30" y="64">It is not free, and the cost is real.</text>
  <rect class="streaming-tradeoff-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="streaming-tradeoff-name" x="46" y="122">What it gives</text>
  <text class="streaming-tradeoff-desc" x="46" y="142">Perceived speed, mostly.</text>
  <text class="streaming-tradeoff-desc streaming-tradeoff-row streaming-tradeoff-r0" x="46" y="182">First useful moment arrives much earlier</text>
  <text class="streaming-tradeoff-desc streaming-tradeoff-row streaming-tradeoff-r1" x="46" y="216">Partial output is readable on its own</text>
  <text class="streaming-tradeoff-desc streaming-tradeoff-row streaming-tradeoff-r2" x="46" y="250">Cancellation becomes possible</text>
  <text class="streaming-tradeoff-desc streaming-tradeoff-row streaming-tradeoff-r3" x="46" y="284">Failure keeps what already arrived</text>
  <text class="streaming-tradeoff-desc streaming-tradeoff-row streaming-tradeoff-r4" x="46" y="318">The user sees evidence of progress</text>
  <rect class="streaming-tradeoff-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="streaming-tradeoff-name" x="526" y="122">What it costs</text>
  <text class="streaming-tradeoff-desc" x="526" y="142">Whole-response checks.</text>
  <text class="streaming-tradeoff-desc streaming-tradeoff-row streaming-tradeoff-r0" x="526" y="182">Cannot moderate a response before showing it</text>
  <text class="streaming-tradeoff-desc streaming-tradeoff-row streaming-tradeoff-r1" x="526" y="216">Escaping must happen on every append</text>
  <text class="streaming-tradeoff-desc streaming-tradeoff-row streaming-tradeoff-r2" x="526" y="250">A half-parsed structure is worse than a spinner</text>
  <text class="streaming-tradeoff-desc streaming-tradeoff-row streaming-tradeoff-r3" x="526" y="284">Connections held open, not requests served</text>
  <text class="streaming-tradeoff-desc streaming-tradeoff-row streaming-tradeoff-r4" x="526" y="318">No reduction in total work</text>
  <text class="streaming-tradeoff-sub" x="30" y="372">The right-hand column is why streaming is a default rather than a rule: for structured output or content requiring moderation, a spinner and a validated whole answer is the better design.</text>
</svg>
