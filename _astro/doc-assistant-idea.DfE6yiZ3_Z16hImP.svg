<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five requirements beyond retrieval.">
  <title>The documentation assistant</title>
  <style>
    .doc-assistant-idea-bg   { fill: #f8fafc; }
    .doc-assistant-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .doc-assistant-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .doc-assistant-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .doc-assistant-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .doc-assistant-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .doc-assistant-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .doc-assistant-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .doc-assistant-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .doc-assistant-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .doc-assistant-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .doc-assistant-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .doc-assistant-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .doc-assistant-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .doc-assistant-idea-stage { opacity: 1; }

    .doc-assistant-idea-s0 { animation-delay: 0.00s; }
    .doc-assistant-idea-e0 { animation-delay: 0.00s; }
    .doc-assistant-idea-s1 { animation-delay: 1.33s; }
    .doc-assistant-idea-e1 { animation-delay: 1.33s; }
    .doc-assistant-idea-s2 { animation-delay: 2.67s; }
    .doc-assistant-idea-e2 { animation-delay: 2.67s; }
    .doc-assistant-idea-s3 { animation-delay: 4.00s; }
    .doc-assistant-idea-e3 { animation-delay: 4.00s; }
    .doc-assistant-idea-s4 { animation-delay: 5.33s; }
    .doc-assistant-idea-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .doc-assistant-idea-conn  { animation: doc-assistant-idea-trace 8s ease-in-out infinite; }
      .doc-assistant-idea-stage { animation: doc-assistant-idea-arrive 8s ease-in-out infinite; }
    }
    @keyframes doc-assistant-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes doc-assistant-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .doc-assistant-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .doc-assistant-idea-stage { animation: doc-assistant-idea-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes doc-assistant-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="doc-assistant-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="doc-assistant-idea-bg" width="980" height="322"/>
  <text class="doc-assistant-idea-h1"  x="30" y="40">The documentation assistant</text>
  <text class="doc-assistant-idea-sub" x="30" y="64">Five requirements beyond retrieval.</text>
  <g class="doc-assistant-idea-stage doc-assistant-idea-s0">
    <rect class="doc-assistant-idea-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="doc-assistant-idea-step" x="44" y="142">01</text>
    <text class="doc-assistant-idea-name" x="70" y="142">Freshness</text>
    <text class="doc-assistant-idea-desc" x="44" y="166">Answers must reflect the</text>
    <text class="doc-assistant-idea-desc" x="44" y="182">current documentation,</text>
    <text class="doc-assistant-idea-desc" x="44" y="198">not last quarter's.</text>
  </g>
  <line class="doc-assistant-idea-line doc-assistant-idea-conn doc-assistant-idea-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#doc-assistant-idea-tip)"/>
  <g class="doc-assistant-idea-stage doc-assistant-idea-s1">
    <rect class="doc-assistant-idea-warn" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="doc-assistant-idea-step" x="233" y="142">02</text>
    <text class="doc-assistant-idea-name" x="259" y="142">Authorisation</text>
    <text class="doc-assistant-idea-desc" x="233" y="166">Filtered before</text>
    <text class="doc-assistant-idea-desc" x="233" y="182">retrieval, never after.</text>
  </g>
  <line class="doc-assistant-idea-line doc-assistant-idea-conn doc-assistant-idea-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#doc-assistant-idea-tip)"/>
  <g class="doc-assistant-idea-stage doc-assistant-idea-s2">
    <rect class="doc-assistant-idea-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="doc-assistant-idea-step" x="422" y="142">03</text>
    <text class="doc-assistant-idea-name" x="448" y="142">Abstention</text>
    <text class="doc-assistant-idea-desc" x="422" y="166">Declining is a designed</text>
    <text class="doc-assistant-idea-desc" x="422" y="182">outcome, not a failure.</text>
  </g>
  <line class="doc-assistant-idea-line doc-assistant-idea-conn doc-assistant-idea-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#doc-assistant-idea-tip)"/>
  <g class="doc-assistant-idea-stage doc-assistant-idea-s3">
    <rect class="doc-assistant-idea-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="doc-assistant-idea-step" x="611" y="142">04</text>
    <text class="doc-assistant-idea-name" x="637" y="142">Caching</text>
    <text class="doc-assistant-idea-desc" x="611" y="166">At two levels, because</text>
    <text class="doc-assistant-idea-desc" x="611" y="182">documentation questions</text>
    <text class="doc-assistant-idea-desc" x="611" y="198">repeat heavily.</text>
  </g>
  <line class="doc-assistant-idea-line doc-assistant-idea-conn doc-assistant-idea-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#doc-assistant-idea-tip)"/>
  <g class="doc-assistant-idea-stage doc-assistant-idea-s4">
    <rect class="doc-assistant-idea-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="doc-assistant-idea-step" x="800" y="142">05</text>
    <text class="doc-assistant-idea-name" x="826" y="142">And planned degradation</text>
    <text class="doc-assistant-idea-desc" x="800" y="166">Decided before the</text>
    <text class="doc-assistant-idea-desc" x="800" y="182">incident, not during it.</text>
  </g>
  <text class="doc-assistant-idea-sub" x="30" y="304">None of these five is about retrieval quality, which is the lesson: the difference between a demonstration and a production system is almost entirely operational.</text>
</svg>
