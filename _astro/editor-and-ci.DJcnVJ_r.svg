<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One is a courtesy to you; the other is a guarantee to everyone else.">
  <title>The same tools, twice, on purpose</title>
  <style>
    .editor-and-ci-bg   { fill: #f8fafc; }
    .editor-and-ci-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .editor-and-ci-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .editor-and-ci-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .editor-and-ci-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .editor-and-ci-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .editor-and-ci-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .editor-and-ci-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .editor-and-ci-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .editor-and-ci-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .editor-and-ci-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .editor-and-ci-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .editor-and-ci-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .editor-and-ci-row { opacity: 1; }
    .editor-and-ci-r0 { animation-delay: 0.00s; }
    .editor-and-ci-r1 { animation-delay: 0.45s; }
    .editor-and-ci-r2 { animation-delay: 0.90s; }
    .editor-and-ci-r3 { animation-delay: 1.35s; }
    .editor-and-ci-r4 { animation-delay: 1.80s; }
    .editor-and-ci-row { animation: editor-and-ci-reveal 7.3s ease-in-out infinite; }
    @keyframes editor-and-ci-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="editor-and-ci-bg" width="980" height="390"/>
  <text class="editor-and-ci-h1"  x="30" y="40">The same tools, twice, on purpose</text>
  <text class="editor-and-ci-sub" x="30" y="64">One is a courtesy to you; the other is a guarantee to everyone else.</text>
  <rect class="editor-and-ci-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="editor-and-ci-name" x="46" y="122">In your editor</text>
  <text class="editor-and-ci-desc" x="46" y="142">Fast and private.</text>
  <text class="editor-and-ci-desc editor-and-ci-row editor-and-ci-r0" x="46" y="182">Runs as you type</text>
  <text class="editor-and-ci-desc editor-and-ci-row editor-and-ci-r1" x="46" y="216">Mistakes surface in seconds</text>
  <text class="editor-and-ci-desc editor-and-ci-row editor-and-ci-r2" x="46" y="250">Nobody else sees them</text>
  <text class="editor-and-ci-desc editor-and-ci-row editor-and-ci-r3" x="46" y="284">Advisory — you can ignore it</text>
  <text class="editor-and-ci-desc editor-and-ci-row editor-and-ci-r4" x="46" y="318">Incremental, so it stays fast</text>
  <rect class="editor-and-ci-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="editor-and-ci-name" x="526" y="122">In CI</text>
  <text class="editor-and-ci-desc" x="526" y="142">Slow and binding.</text>
  <text class="editor-and-ci-desc editor-and-ci-row editor-and-ci-r0" x="526" y="182">Runs on every push</text>
  <text class="editor-and-ci-desc editor-and-ci-row editor-and-ci-r1" x="526" y="216">Minutes, not seconds</text>
  <text class="editor-and-ci-desc editor-and-ci-row editor-and-ci-r2" x="526" y="250">Everyone sees the result</text>
  <text class="editor-and-ci-desc editor-and-ci-row editor-and-ci-r3" x="526" y="284">A gate — the change cannot land</text>
  <text class="editor-and-ci-desc editor-and-ci-row editor-and-ci-r4" x="526" y="318">Full run, every time</text>
  <text class="editor-and-ci-sub" x="30" y="372">Running identical tools and identical config in both places is the point: what you see locally is exactly what the gate enforces, so CI never surprises you.</text>
</svg>
