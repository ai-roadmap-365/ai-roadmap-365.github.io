<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And the middle one surprises people.">
  <title>Three depths of copying</title>
  <style>
    .copy-depth-bg   { fill: #f8fafc; }
    .copy-depth-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .copy-depth-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .copy-depth-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .copy-depth-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .copy-depth-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .copy-depth-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .copy-depth-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .copy-depth-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .copy-depth-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .copy-depth-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .copy-depth-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .copy-depth-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .copy-depth-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .copy-depth-stage { opacity: 1; }

    .copy-depth-s0 { animation-delay: 0.00s; }
    .copy-depth-e0 { animation-delay: 0.00s; }
    .copy-depth-s1 { animation-delay: 1.50s; }
    .copy-depth-e1 { animation-delay: 1.50s; }
    .copy-depth-s2 { animation-delay: 3.00s; }
    .copy-depth-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .copy-depth-conn  { animation: copy-depth-trace 6s ease-in-out infinite; }
      .copy-depth-stage { animation: copy-depth-arrive 6s ease-in-out infinite; }
    }
    @keyframes copy-depth-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes copy-depth-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .copy-depth-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .copy-depth-stage { animation: copy-depth-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes copy-depth-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="copy-depth-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="copy-depth-bg" width="980" height="322"/>
  <text class="copy-depth-h1"  x="30" y="40">Three depths of copying</text>
  <text class="copy-depth-sub" x="30" y="64">And the middle one surprises people.</text>
  <g class="copy-depth-stage copy-depth-s0">
    <rect class="copy-depth-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="copy-depth-step" x="44" y="142">01</text>
    <text class="copy-depth-name" x="70" y="142">b = a</text>
    <text class="copy-depth-desc" x="44" y="166">No copy at all. One object, two names.</text>
    <text class="copy-depth-edge" x="44" y="242">shared</text>
  </g>
  <line class="copy-depth-line copy-depth-conn copy-depth-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#copy-depth-tip)"/>
  <g class="copy-depth-stage copy-depth-s1">
    <rect class="copy-depth-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="copy-depth-step" x="359" y="142">02</text>
    <text class="copy-depth-name" x="385" y="142">copy.copy(a)</text>
    <text class="copy-depth-desc" x="359" y="166">A new outer container — whose ELEMENTS are</text>
    <text class="copy-depth-desc" x="359" y="182">still the same objects.</text>
    <text class="copy-depth-edge" x="359" y="242">shallow</text>
  </g>
  <line class="copy-depth-line copy-depth-conn copy-depth-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#copy-depth-tip)"/>
  <g class="copy-depth-stage copy-depth-s2">
    <rect class="copy-depth-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="copy-depth-step" x="674" y="142">03</text>
    <text class="copy-depth-name" x="700" y="142">copy.deepcopy(a)</text>
    <text class="copy-depth-desc" x="674" y="166">New objects all the way down. Nothing shared.</text>
    <text class="copy-depth-edge" x="674" y="242">deep</text>
  </g>
  <text class="copy-depth-sub" x="30" y="304">The shallow case is the subtle one: a copied list of lists gives you a new outer list whose inner lists are still shared, so mutating one of them still shows through both.</text>
</svg>
