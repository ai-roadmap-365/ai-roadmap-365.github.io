<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" font-family="system-ui, sans-serif">
  <title>The process lifecycle: spawn, ready, running, waiting, and exit, with the zombie state before cleanup</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The process lifecycle</text>

  <!-- Spawn -->
  <rect x="30" y="150" width="130" height="64" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="95" y="177" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Spawn</text>
  <text x="95" y="197" text-anchor="middle" font-size="14" fill="#1a202c">kernel builds it</text>

  <!-- Ready -->
  <rect x="230" y="150" width="140" height="64" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="300" y="177" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Ready</text>
  <text x="300" y="197" text-anchor="middle" font-size="14" fill="#1a202c">queued for a core</text>

  <!-- Running -->
  <rect x="450" y="150" width="140" height="64" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="520" y="177" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Running</text>
  <text x="520" y="197" text-anchor="middle" font-size="14" fill="#1a202c">executing on a core</text>

  <!-- Waiting -->
  <rect x="340" y="310" width="160" height="64" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="420" y="337" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Waiting</text>
  <text x="420" y="357" text-anchor="middle" font-size="14" fill="#1a202c">blocked on disk/net/timer</text>

  <!-- Exit -->
  <rect x="640" y="150" width="95" height="64" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="687" y="177" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Exit</text>
  <text x="687" y="197" text-anchor="middle" font-size="14" fill="#1a202c">exit code left</text>

  <!-- Zombie note -->
  <rect x="600" y="270" width="140" height="76" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="670" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Zombie</text>
  <text x="670" y="315" text-anchor="middle" font-size="13" fill="#1a202c">exited, exit code not</text>
  <text x="670" y="333" text-anchor="middle" font-size="13" fill="#1a202c">yet read by parent</text>

  <!-- Spawn -> Ready -->
  <line x1="160" y1="182" x2="222" y2="182" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="230,182 216,175 216,189" fill="#1d4ed8"/>

  <!-- Ready -> Running (dispatch), upper arrow -->
  <line x1="370" y1="167" x2="442" y2="167" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="450,167 436,160 436,174" fill="#1d4ed8"/>
  <text x="410" y="150" text-anchor="middle" font-size="14" fill="#1d4ed8" font-weight="bold">dispatched</text>

  <!-- Running -> Ready (preempt), lower arrow -->
  <line x1="450" y1="199" x2="378" y2="199" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="370,199 384,192 384,206" fill="#1d4ed8"/>
  <text x="410" y="232" text-anchor="middle" font-size="14" fill="#1d4ed8" font-weight="bold">time slice ends</text>

  <!-- Running -> Waiting -->
  <line x1="505" y1="214" x2="452" y2="304" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="448,311 449,295 462,302" fill="#1d4ed8"/>
  <text x="545" y="268" text-anchor="middle" font-size="14" fill="#1d4ed8" font-weight="bold">asks for slow I/O</text>

  <!-- Waiting -> Ready -->
  <line x1="365" y1="310" x2="311" y2="222" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="307,214 319,224 307,231" fill="#1d4ed8"/>
  <text x="273" y="278" text-anchor="middle" font-size="14" fill="#1d4ed8" font-weight="bold">event arrives</text>

  <!-- Running -> Exit -->
  <line x1="590" y1="182" x2="632" y2="182" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="640,182 626,175 626,189" fill="#1d4ed8"/>
  <text x="614" y="150" text-anchor="middle" font-size="14" fill="#1d4ed8" font-weight="bold">finishes</text>

  <!-- Exit -> Zombie -->
  <line x1="683" y1="214" x2="675" y2="262" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="673,270 668,255 682,257" fill="#1d4ed8"/>

  <!-- Bottom caption -->
  <rect x="30" y="392" width="700" height="36" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="415" text-anchor="middle" font-size="14" fill="#1a202c">The ready–running loop is the scheduler's territory; exit code 0 means success, 128 + N means death by signal N.</text>
</svg>
