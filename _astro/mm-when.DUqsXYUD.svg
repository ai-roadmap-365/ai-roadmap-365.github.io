<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when one modality is enough.">
  <title>When to build multimodal</title>
  <style>
    .mm-when-bg   { fill: #f8fafc; }
    .mm-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mm-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mm-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mm-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mm-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mm-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mm-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mm-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mm-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mm-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mm-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mm-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mm-when-row { opacity: 1; }
    .mm-when-r0 { animation-delay: 0.00s; }
    .mm-when-r1 { animation-delay: 0.45s; }
    .mm-when-r2 { animation-delay: 0.90s; }
    .mm-when-r3 { animation-delay: 1.35s; }
    .mm-when-r4 { animation-delay: 1.80s; }
    .mm-when-row { animation: mm-when-reveal 7.3s ease-in-out infinite; }
    @keyframes mm-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="mm-when-bg" width="980" height="390"/>
  <text class="mm-when-h1"  x="30" y="40">When to build multimodal</text>
  <text class="mm-when-sub" x="30" y="64">And when one modality is enough.</text>
  <rect class="mm-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="mm-when-name" x="46" y="122">Go multimodal</text>
  <text class="mm-when-desc" x="46" y="142">Four signals.</text>
  <text class="mm-when-desc mm-when-row mm-when-r0" x="46" y="182">Input genuinely arrives in several forms</text>
  <text class="mm-when-desc mm-when-row mm-when-r1" x="46" y="216">Meaning is spread across them</text>
  <text class="mm-when-desc mm-when-row mm-when-r2" x="46" y="250">Users cannot pre-convert it</text>
  <text class="mm-when-desc mm-when-row mm-when-r3" x="46" y="284">Where the combination is the product</text>
  <text class="mm-when-desc mm-when-row mm-when-r4" x="46" y="318">And each stage is measured</text>
  <rect class="mm-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="mm-when-name" x="526" y="122">Stay single</text>
  <text class="mm-when-desc" x="526" y="142">Also four.</text>
  <text class="mm-when-desc mm-when-row mm-when-r0" x="526" y="182">One modality carries the meaning</text>
  <text class="mm-when-desc mm-when-row mm-when-r1" x="526" y="216">Conversion upstream is cheap and reliable</text>
  <text class="mm-when-desc mm-when-row mm-when-r2" x="526" y="250">Where a stage would add cost and no accuracy</text>
  <text class="mm-when-desc mm-when-row mm-when-r3" x="526" y="284">Prototypes</text>
  <text class="mm-when-desc mm-when-row mm-when-r4" x="526" y="318">And where the cascade would cost more than it gains</text>
  <text class="mm-when-sub" x="30" y="372">Adding a modality that contributes little still multiplies into the accuracy, the cost and the failure surface — which is why each stage has to earn its place by measurement.</text>
</svg>
