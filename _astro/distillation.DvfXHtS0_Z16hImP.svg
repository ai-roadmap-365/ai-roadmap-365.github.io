<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Learning from a model, not a label.">
  <title>Knowledge distillation</title>
  <style>
    .distillation-bg   { fill: #f8fafc; }
    .distillation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distillation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distillation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distillation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distillation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distillation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .distillation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .distillation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .distillation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .distillation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .distillation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .distillation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .distillation-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .distillation-stage { opacity: 1; }

    .distillation-s0 { animation-delay: 0.00s; }
    .distillation-e0 { animation-delay: 0.00s; }
    .distillation-s1 { animation-delay: 1.28s; }
    .distillation-e1 { animation-delay: 1.28s; }
    .distillation-s2 { animation-delay: 2.56s; }
    .distillation-e2 { animation-delay: 2.56s; }
    .distillation-s3 { animation-delay: 3.84s; }
    .distillation-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .distillation-conn  { animation: distillation-trace 6.4s ease-in-out infinite; }
      .distillation-stage { animation: distillation-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes distillation-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes distillation-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .distillation-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .distillation-stage { animation: distillation-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes distillation-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="distillation-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="distillation-bg" width="980" height="322"/>
  <text class="distillation-h1"  x="30" y="40">Knowledge distillation</text>
  <text class="distillation-sub" x="30" y="64">Learning from a model, not a label.</text>
  <g class="distillation-stage distillation-s0">
    <rect class="distillation-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="distillation-step" x="44" y="142">01</text>
    <text class="distillation-name" x="70" y="142">A large teacher predicts</text>
    <text class="distillation-desc" x="44" y="166">Not just a label, but a</text>
    <text class="distillation-desc" x="44" y="182">probability for every class.</text>
  </g>
  <line class="distillation-line distillation-conn distillation-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#distillation-tip)"/>
  <g class="distillation-stage distillation-s1">
    <rect class="distillation-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="distillation-step" x="280" y="142">02</text>
    <text class="distillation-name" x="306" y="142">Those probabilities carry information</text>
    <text class="distillation-desc" x="280" y="166">Which wrong answers were nearly</text>
    <text class="distillation-desc" x="280" y="182">right. Labels do not say that.</text>
  </g>
  <line class="distillation-line distillation-conn distillation-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#distillation-tip)"/>
  <g class="distillation-stage distillation-s2">
    <rect class="distillation-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="distillation-step" x="516" y="142">03</text>
    <text class="distillation-name" x="542" y="142">The student matches both</text>
    <text class="distillation-desc" x="516" y="166">The true labels and the</text>
    <text class="distillation-desc" x="516" y="182">teacher's distribution.</text>
    <text class="distillation-edge" x="516" y="242">two terms</text>
  </g>
  <line class="distillation-line distillation-conn distillation-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#distillation-tip)"/>
  <g class="distillation-stage distillation-s3">
    <rect class="distillation-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="distillation-step" x="752" y="142">04</text>
    <text class="distillation-name" x="778" y="142">Producing a small, capable model</text>
    <text class="distillation-desc" x="752" y="166">Much faster, with most of the</text>
    <text class="distillation-desc" x="752" y="182">accuracy.</text>
  </g>
  <text class="distillation-sub" x="30" y="304">The soft targets are the whole mechanism: a hard label says only which class is correct, while a distribution says how the teacher sees the relationships between all of them.</text>
</svg>
