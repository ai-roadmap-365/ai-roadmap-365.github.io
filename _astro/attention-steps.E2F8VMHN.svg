<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And that is the whole operation.">
  <title>Four steps, two matrix multiplies</title>
  <style>
    .attention-steps-bg   { fill: #f8fafc; }
    .attention-steps-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-steps-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-steps-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-steps-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-steps-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-steps-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .attention-steps-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .attention-steps-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .attention-steps-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .attention-steps-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .attention-steps-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .attention-steps-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .attention-steps-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .attention-steps-stage { opacity: 1; }

    .attention-steps-s0 { animation-delay: 0.00s; }
    .attention-steps-e0 { animation-delay: 0.00s; }
    .attention-steps-s1 { animation-delay: 1.28s; }
    .attention-steps-e1 { animation-delay: 1.28s; }
    .attention-steps-s2 { animation-delay: 2.56s; }
    .attention-steps-e2 { animation-delay: 2.56s; }
    .attention-steps-s3 { animation-delay: 3.84s; }
    .attention-steps-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .attention-steps-conn  { animation: attention-steps-trace 6.4s ease-in-out infinite; }
      .attention-steps-stage { animation: attention-steps-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes attention-steps-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes attention-steps-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .attention-steps-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .attention-steps-stage { animation: attention-steps-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes attention-steps-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="attention-steps-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="attention-steps-bg" width="980" height="322"/>
  <text class="attention-steps-h1"  x="30" y="40">Four steps, two matrix multiplies</text>
  <text class="attention-steps-sub" x="30" y="64">And that is the whole operation.</text>
  <g class="attention-steps-stage attention-steps-s0">
    <rect class="attention-steps-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="attention-steps-step" x="44" y="142">01</text>
    <text class="attention-steps-name" x="70" y="142">Queries against keys</text>
    <text class="attention-steps-desc" x="44" y="166">One matrix multiply producing an</text>
    <text class="attention-steps-desc" x="44" y="182">N-by-N score matrix.</text>
    <text class="attention-steps-edge" x="44" y="242">GEMM 1</text>
  </g>
  <line class="attention-steps-line attention-steps-conn attention-steps-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#attention-steps-tip)"/>
  <g class="attention-steps-stage attention-steps-s1">
    <rect class="attention-steps-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="attention-steps-step" x="280" y="142">02</text>
    <text class="attention-steps-name" x="306" y="142">Scale by the square root of the key dimension</text>
    <text class="attention-steps-desc" x="280" y="166">Keeping scores in a range where</text>
    <text class="attention-steps-desc" x="280" y="182">softmax has gradient.</text>
  </g>
  <line class="attention-steps-line attention-steps-conn attention-steps-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#attention-steps-tip)"/>
  <g class="attention-steps-stage attention-steps-s2">
    <rect class="attention-steps-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="attention-steps-step" x="516" y="142">03</text>
    <text class="attention-steps-name" x="542" y="142">Softmax over each row</text>
    <text class="attention-steps-desc" x="516" y="166">Each position gets a</text>
    <text class="attention-steps-desc" x="516" y="182">distribution over all positions.</text>
  </g>
  <line class="attention-steps-line attention-steps-conn attention-steps-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#attention-steps-tip)"/>
  <g class="attention-steps-stage attention-steps-s3">
    <rect class="attention-steps-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="attention-steps-step" x="752" y="142">04</text>
    <text class="attention-steps-name" x="778" y="142">Weights against values</text>
    <text class="attention-steps-desc" x="752" y="166">A second matrix multiply. The</text>
    <text class="attention-steps-desc" x="752" y="182">output.</text>
    <text class="attention-steps-edge" x="752" y="242">GEMM 2</text>
  </g>
  <text class="attention-steps-sub" x="30" y="304">Two matrix multiplies with a softmax between them is the entire mechanism, and its simplicity is exactly why it maps so well onto hardware built for dense linear algebra.</text>
</svg>
