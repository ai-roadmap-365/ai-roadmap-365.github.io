<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Latency included.">
  <title>Four consequences of reasoning prompts</title>
  <style>
    .cot-implications-bg   { fill: #f8fafc; }
    .cot-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cot-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cot-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cot-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cot-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cot-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cot-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cot-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cot-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cot-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cot-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cot-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cot-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cot-implications-stage { opacity: 1; }

    .cot-implications-s0 { animation-delay: 0.00s; }
    .cot-implications-e0 { animation-delay: 0.00s; }
    .cot-implications-s1 { animation-delay: 1.28s; }
    .cot-implications-e1 { animation-delay: 1.28s; }
    .cot-implications-s2 { animation-delay: 2.56s; }
    .cot-implications-e2 { animation-delay: 2.56s; }
    .cot-implications-s3 { animation-delay: 3.84s; }
    .cot-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cot-implications-conn  { animation: cot-implications-trace 6.4s ease-in-out infinite; }
      .cot-implications-stage { animation: cot-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cot-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cot-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cot-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cot-implications-stage { animation: cot-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cot-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cot-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cot-implications-bg" width="980" height="322"/>
  <text class="cot-implications-h1"  x="30" y="40">Four consequences of reasoning prompts</text>
  <text class="cot-implications-sub" x="30" y="64">Latency included.</text>
  <g class="cot-implications-stage cot-implications-s0">
    <rect class="cot-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cot-implications-step" x="44" y="142">01</text>
    <text class="cot-implications-name" x="70" y="142">Accuracy rises on multi-step problems</text>
    <text class="cot-implications-desc" x="44" y="166">Substantially, and reliably.</text>
  </g>
  <line class="cot-implications-line cot-implications-conn cot-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cot-implications-tip)"/>
  <g class="cot-implications-stage cot-implications-s1">
    <rect class="cot-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cot-implications-step" x="280" y="142">02</text>
    <text class="cot-implications-name" x="306" y="142">But output tokens multiply</text>
    <text class="cot-implications-desc" x="280" y="166">And output is the expensive</text>
    <text class="cot-implications-desc" x="280" y="182">direction.</text>
  </g>
  <line class="cot-implications-line cot-implications-conn cot-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cot-implications-tip)"/>
  <g class="cot-implications-stage cot-implications-s2">
    <rect class="cot-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cot-implications-step" x="516" y="142">03</text>
    <text class="cot-implications-name" x="542" y="142">So latency rises with them</text>
    <text class="cot-implications-desc" x="516" y="166">Which users feel directly.</text>
  </g>
  <line class="cot-implications-line cot-implications-conn cot-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cot-implications-tip)"/>
  <g class="cot-implications-stage cot-implications-s3">
    <rect class="cot-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cot-implications-step" x="752" y="142">04</text>
    <text class="cot-implications-name" x="778" y="142">And the trace looks like an explanation</text>
    <text class="cot-implications-desc" x="752" y="166">Which it may not be. Do not</text>
    <text class="cot-implications-desc" x="752" y="182">treat it as an audit.</text>
  </g>
  <text class="cot-implications-sub" x="30" y="304">Hiding the reasoning from the user while keeping it for the model is the usual production compromise, and it keeps the accuracy without the latency being felt as waiting.</text>
</svg>
