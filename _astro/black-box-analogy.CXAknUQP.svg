<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Synchronised sensors, not a voice memo.">
  <title>A flight data recorder</title>
  <style>
    .black-box-analogy-bg   { fill: #f8fafc; }
    .black-box-analogy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .black-box-analogy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .black-box-analogy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .black-box-analogy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .black-box-analogy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .black-box-analogy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .black-box-analogy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .black-box-analogy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .black-box-analogy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .black-box-analogy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .black-box-analogy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .black-box-analogy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .black-box-analogy-row { opacity: 1; }
    .black-box-analogy-r0 { animation-delay: 0.00s; }
    .black-box-analogy-r1 { animation-delay: 0.45s; }
    .black-box-analogy-r2 { animation-delay: 0.90s; }
    .black-box-analogy-r3 { animation-delay: 1.35s; }
    .black-box-analogy-r4 { animation-delay: 1.80s; }
    .black-box-analogy-row { animation: black-box-analogy-reveal 7.3s ease-in-out infinite; }
    @keyframes black-box-analogy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="black-box-analogy-bg" width="980" height="390"/>
  <text class="black-box-analogy-h1"  x="30" y="40">A flight data recorder</text>
  <text class="black-box-analogy-sub" x="30" y="64">Synchronised sensors, not a voice memo.</text>
  <rect class="black-box-analogy-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="black-box-analogy-name" x="46" y="122">A voice memo</text>
  <text class="black-box-analogy-desc" x="46" y="142">Unreliable and unstructured.</text>
  <text class="black-box-analogy-desc black-box-analogy-row black-box-analogy-r0" x="46" y="182">Whatever someone thought to say</text>
  <text class="black-box-analogy-desc black-box-analogy-row black-box-analogy-r1" x="46" y="216">No synchronised clock</text>
  <text class="black-box-analogy-desc black-box-analogy-row black-box-analogy-r2" x="46" y="250">Nothing to correlate against</text>
  <text class="black-box-analogy-desc black-box-analogy-row black-box-analogy-r3" x="46" y="284">Cannot reconstruct the sequence</text>
  <text class="black-box-analogy-desc black-box-analogy-row black-box-analogy-r4" x="46" y="318">And nobody can bill from it</text>
  <rect class="black-box-analogy-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="black-box-analogy-name" x="526" y="122">The black box</text>
  <text class="black-box-analogy-desc" x="526" y="142">Deterministic telemetry.</text>
  <text class="black-box-analogy-desc black-box-analogy-row black-box-analogy-r0" x="526" y="182">Airspeed, altitude, engine temperature, throttle</text>
  <text class="black-box-analogy-desc black-box-analogy-row black-box-analogy-r1" x="526" y="216">Every millisecond, one clock</text>
  <text class="black-box-analogy-desc black-box-analogy-row black-box-analogy-r2" x="526" y="250">Every value has a defined field</text>
  <text class="black-box-analogy-desc black-box-analogy-row black-box-analogy-r3" x="526" y="284">The whole sequence reconstructs</text>
  <text class="black-box-analogy-desc black-box-analogy-row black-box-analogy-r4" x="526" y="318">And the tower bills fuel per airline</text>
  <text class="black-box-analogy-sub" x="30" y="372">The single synchronised clock is what makes reconstruction possible, and it is exactly the role a propagated trace ID plays across five services that each have their own idea of the time.</text>
</svg>
