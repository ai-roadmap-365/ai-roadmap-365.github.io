<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four things.">
  <title>What a schema decides</title>
  <style>
    .schema-idea-bg   { fill: #f8fafc; }
    .schema-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .schema-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .schema-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .schema-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .schema-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .schema-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .schema-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .schema-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .schema-idea-stage { opacity: 1; }

    .schema-idea-s0 { animation-delay: 0.00s; }
    .schema-idea-e0 { animation-delay: 0.00s; }
    .schema-idea-s1 { animation-delay: 1.28s; }
    .schema-idea-e1 { animation-delay: 1.28s; }
    .schema-idea-s2 { animation-delay: 2.56s; }
    .schema-idea-e2 { animation-delay: 2.56s; }
    .schema-idea-s3 { animation-delay: 3.84s; }
    .schema-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .schema-idea-conn  { animation: schema-idea-trace 6.4s ease-in-out infinite; }
      .schema-idea-stage { animation: schema-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes schema-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes schema-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .schema-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .schema-idea-stage { animation: schema-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes schema-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="schema-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="schema-idea-bg" width="980" height="322"/>
  <text class="schema-idea-h1"  x="30" y="40">What a schema decides</text>
  <text class="schema-idea-sub" x="30" y="64">Four things.</text>
  <g class="schema-idea-stage schema-idea-s0">
    <rect class="schema-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="schema-idea-step" x="44" y="142">01</text>
    <text class="schema-idea-name" x="70" y="142">Which entities exist, as tables</text>
    <text class="schema-idea-desc" x="44" y="166">One table per kind of thing.</text>
  </g>
  <line class="schema-idea-line schema-idea-conn schema-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#schema-idea-tip)"/>
  <g class="schema-idea-stage schema-idea-s1">
    <rect class="schema-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="schema-idea-step" x="280" y="142">02</text>
    <text class="schema-idea-name" x="306" y="142">Which attributes each has, with types</text>
    <text class="schema-idea-desc" x="280" y="166">Named, and typed.</text>
  </g>
  <line class="schema-idea-line schema-idea-conn schema-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#schema-idea-tip)"/>
  <g class="schema-idea-stage schema-idea-s2">
    <rect class="schema-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="schema-idea-step" x="516" y="142">03</text>
    <text class="schema-idea-name" x="542" y="142">Which column identifies a row</text>
    <text class="schema-idea-desc" x="516" y="166">The primary key.</text>
  </g>
  <line class="schema-idea-line schema-idea-conn schema-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#schema-idea-tip)"/>
  <g class="schema-idea-stage schema-idea-s3">
    <rect class="schema-idea-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="schema-idea-step" x="752" y="142">04</text>
    <text class="schema-idea-name" x="778" y="142">And which rules must always hold</text>
    <text class="schema-idea-desc" x="752" y="166">Enforced by the database, not</text>
    <text class="schema-idea-desc" x="752" y="182">the code.</text>
  </g>
  <text class="schema-idea-sub" x="30" y="304">Rules enforced by the database hold for every writer, which matters because the second program to touch a table rarely knows the first one's assumptions.</text>
</svg>
