<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By problem shape.">
  <title>Direct solution against iteration</title>
  <style>
    .closed-form-cost-bg   { fill: #f8fafc; }
    .closed-form-cost-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .closed-form-cost-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .closed-form-cost-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .closed-form-cost-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .closed-form-cost-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .closed-form-cost-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .closed-form-cost-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .closed-form-cost-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .closed-form-cost-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .closed-form-cost-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .closed-form-cost-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .closed-form-cost-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .closed-form-cost-row { opacity: 1; }
    .closed-form-cost-r0 { animation-delay: 0.00s; }
    .closed-form-cost-r1 { animation-delay: 0.45s; }
    .closed-form-cost-r2 { animation-delay: 0.90s; }
    .closed-form-cost-r3 { animation-delay: 1.35s; }
    .closed-form-cost-r4 { animation-delay: 1.80s; }
    .closed-form-cost-row { animation: closed-form-cost-reveal 7.3s ease-in-out infinite; }
    @keyframes closed-form-cost-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="closed-form-cost-bg" width="980" height="390"/>
  <text class="closed-form-cost-h1"  x="30" y="40">Direct solution against iteration</text>
  <text class="closed-form-cost-sub" x="30" y="64">By problem shape.</text>
  <rect class="closed-form-cost-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="closed-form-cost-name" x="46" y="122">Direct solution</text>
  <text class="closed-form-cost-desc" x="46" y="142">Exact, once.</text>
  <text class="closed-form-cost-desc closed-form-cost-row closed-form-cost-r0" x="46" y="182">One decomposition, no iteration</text>
  <text class="closed-form-cost-desc closed-form-cost-row closed-form-cost-r1" x="46" y="216">Cost grows with the cube of the feature count</text>
  <text class="closed-form-cost-desc closed-form-cost-row closed-form-cost-r2" x="46" y="250">Exact to available precision</text>
  <text class="closed-form-cost-desc closed-form-cost-row closed-form-cost-r3" x="46" y="284">No learning rate to choose</text>
  <text class="closed-form-cost-desc closed-form-cost-row closed-form-cost-r4" x="46" y="318">Right for modest feature counts</text>
  <rect class="closed-form-cost-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="closed-form-cost-name" x="526" y="122">Iterative</text>
  <text class="closed-form-cost-desc" x="526" y="142">Approximate, repeatedly.</text>
  <text class="closed-form-cost-desc closed-form-cost-row closed-form-cost-r0" x="526" y="182">Many passes over the data</text>
  <text class="closed-form-cost-desc closed-form-cost-row closed-form-cost-r1" x="526" y="216">Cost grows linearly with features</text>
  <text class="closed-form-cost-desc closed-form-cost-row closed-form-cost-r2" x="526" y="250">Approximate, to a tolerance</text>
  <text class="closed-form-cost-desc closed-form-cost-row closed-form-cost-r3" x="526" y="284">A learning rate to tune</text>
  <text class="closed-form-cost-desc closed-form-cost-row closed-form-cost-r4" x="526" y="318">Right for very many features or rows</text>
  <text class="closed-form-cost-sub" x="30" y="372">The crossover is at a few thousand features, above which the cubic cost of the direct route dominates and iteration becomes the only option.</text>
</svg>
