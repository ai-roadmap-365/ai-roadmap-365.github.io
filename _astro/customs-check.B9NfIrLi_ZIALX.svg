<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Once, or repeatedly.">
  <title>A checkpoint at the border</title>
  <style>
    .customs-check-bg   { fill: #f8fafc; }
    .customs-check-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .customs-check-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .customs-check-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .customs-check-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .customs-check-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .customs-check-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .customs-check-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .customs-check-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .customs-check-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .customs-check-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .customs-check-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .customs-check-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .customs-check-row { opacity: 1; }
    .customs-check-r0 { animation-delay: 0.00s; }
    .customs-check-r1 { animation-delay: 0.45s; }
    .customs-check-r2 { animation-delay: 0.90s; }
    .customs-check-r3 { animation-delay: 1.35s; }
    .customs-check-r4 { animation-delay: 1.80s; }
    .customs-check-row { animation: customs-check-reveal 7.3s ease-in-out infinite; }
    @keyframes customs-check-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="customs-check-bg" width="980" height="390"/>
  <text class="customs-check-h1"  x="30" y="40">A checkpoint at the border</text>
  <text class="customs-check-sub" x="30" y="64">Once, or repeatedly.</text>
  <rect class="customs-check-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="customs-check-name" x="46" y="122">Checked at the border</text>
  <text class="customs-check-desc" x="46" y="142">Once.</text>
  <text class="customs-check-desc customs-check-row customs-check-r0" x="46" y="182">Everything inspected on entry</text>
  <text class="customs-check-desc customs-check-row customs-check-r1" x="46" y="216">Anything wrong is turned back</text>
  <text class="customs-check-desc customs-check-row customs-check-r2" x="46" y="250">Inside, movement is unrestricted</text>
  <text class="customs-check-desc customs-check-row customs-check-r3" x="46" y="284">One place to update the rules</text>
  <text class="customs-check-desc customs-check-row customs-check-r4" x="46" y="318">This is boundary validation</text>
  <rect class="customs-check-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="customs-check-name" x="526" y="122">Checked everywhere</text>
  <text class="customs-check-desc" x="526" y="142">Repeatedly.</text>
  <text class="customs-check-desc customs-check-row customs-check-r0" x="526" y="182">Every office inspects again</text>
  <text class="customs-check-desc customs-check-row customs-check-r1" x="526" y="216">Slow, and inconsistent</text>
  <text class="customs-check-desc customs-check-row customs-check-r2" x="526" y="250">Some offices forget</text>
  <text class="customs-check-desc customs-check-row customs-check-r3" x="526" y="284">Rules updated in twenty places</text>
  <text class="customs-check-desc customs-check-row customs-check-r4" x="526" y="318">This is defensive checking</text>
  <text class="customs-check-sub" x="30" y="372">Rules updated in twenty places is the maintenance cost, and it explains why scattered checks drift apart until they disagree about what is valid.</text>
</svg>
