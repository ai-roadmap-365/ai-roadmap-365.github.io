<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" role="img" aria-labelledby="d154f-title d154f-desc" width="1040" height="700">
  <title id="d154f-title">The leaky-selection gap and the prediction interval's realised coverage, both across eight sampled seeds</title>
  <desc id="d154f-desc">Two bar-chart panels revealed left to right. The top panel plots the gap between a leaky test-set-peeking selection and the honest cross-validated one, in RMSE points, at eight of twenty independently seeded runs; every bar sits above zero, and never below it. The bottom panel plots the realised coverage of a 95 percent prediction interval at the same eight seeds against a dashed line marking the 0.95 nominal rate; the bars scatter closely around that line, both above and below it.</desc>
  <style>
    .d154f-bg { fill: #f8fafc; }
    .d154f-title { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 24px; font-weight: 700; }
    .d154f-muted { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d154f-head { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; }
    .d154f-label { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d154f-val { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; font-weight: 700; }
    .d154f-axis { stroke: #1a202c; stroke-width: 2; }
    .d154f-zero { stroke: #1a202c; stroke-width: 2; }
    .d154f-nomline { stroke: #1d4ed8; stroke-width: 2; stroke-dasharray: 7 5; }
    .d154f-gapbar { fill: #93c5fd; stroke: #1d4ed8; stroke-width: 2; }
    .d154f-covbar { fill: #bbf7d0; stroke: #15803d; stroke-width: 2; }
    .d154f-note { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 2; }
    .d154f-b0 { animation: d154f-rise 8s ease-out 0.00s infinite; }
    .d154f-b1 { animation: d154f-rise 8s ease-out 0.45s infinite; }
    .d154f-b2 { animation: d154f-rise 8s ease-out 0.90s infinite; }
    .d154f-b3 { animation: d154f-rise 8s ease-out 1.35s infinite; }
    .d154f-b4 { animation: d154f-rise 8s ease-out 1.80s infinite; }
    .d154f-b5 { animation: d154f-rise 8s ease-out 2.25s infinite; }
    .d154f-b6 { animation: d154f-rise 8s ease-out 2.70s infinite; }
    .d154f-b7 { animation: d154f-rise 8s ease-out 3.15s infinite; }
    .d154f-c0 { animation: d154f-rise 8s ease-out 3.80s infinite; }
    .d154f-c1 { animation: d154f-rise 8s ease-out 4.10s infinite; }
    .d154f-c2 { animation: d154f-rise 8s ease-out 4.40s infinite; }
    .d154f-c3 { animation: d154f-rise 8s ease-out 4.70s infinite; }
    .d154f-c4 { animation: d154f-rise 8s ease-out 5.00s infinite; }
    .d154f-c5 { animation: d154f-rise 8s ease-out 5.30s infinite; }
    .d154f-c6 { animation: d154f-rise 8s ease-out 5.60s infinite; }
    .d154f-c7 { animation: d154f-rise 8s ease-out 5.90s infinite; }
    @keyframes d154f-rise {
      0%   { opacity: 0.15; }
      6%   { opacity: 1; }
      100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .d154f-b0, .d154f-b1, .d154f-b2, .d154f-b3, .d154f-b4, .d154f-b5, .d154f-b6, .d154f-b7,
      .d154f-c0, .d154f-c1, .d154f-c2, .d154f-c3, .d154f-c4, .d154f-c5, .d154f-c6, .d154f-c7 {
        animation: none; opacity: 1;
      }
    }
  </style>
  <rect class="d154f-bg" x="0" y="0" width="1040" height="700"/>

  <text class="d154f-title" x="520" y="34" text-anchor="middle">A leak that never helps by chance, and an interval checked against reality</text>
  <text class="d154f-muted" x="520" y="56" text-anchor="middle">23 candidate pipelines, 5-fold cross-validation, eight of twenty independently seeded runs shown</text>

  <text class="d154f-head" x="80" y="86">Top: leaky RMSE gap (honest minus leaky, in the leak's favour when positive)</text>
  <line class="d154f-zero" x1="96" y1="380" x2="1000" y2="380"/>
  <text class="d154f-muted" x="96" y="398">zero</text>

  <rect class="d154f-gapbar d154f-b0" x="120" y="224.7" width="46" height="155.3" rx="3"/>
  <rect class="d154f-gapbar d154f-b1" x="220" y="335.7" width="46" height="44.3" rx="3"/>
  <rect class="d154f-gapbar d154f-b2" x="320" y="315.6" width="46" height="64.4" rx="3"/>
  <rect class="d154f-gapbar d154f-b3" x="420" y="326.0" width="46" height="54.0" rx="3"/>
  <rect class="d154f-gapbar d154f-b4" x="520" y="368.6" width="46" height="11.4" rx="3"/>
  <rect class="d154f-gapbar d154f-b5" x="620" y="273.5" width="46" height="106.5" rx="3"/>
  <rect class="d154f-gapbar d154f-b6" x="720" y="222.3" width="46" height="157.7" rx="3"/>
  <rect class="d154f-gapbar d154f-b7" x="820" y="289.1" width="46" height="90.9" rx="3"/>

  <text class="d154f-val" x="143" y="216" text-anchor="middle">1.0354</text>
  <text class="d154f-val" x="243" y="327" text-anchor="middle">0.2955</text>
  <text class="d154f-val" x="343" y="307" text-anchor="middle">0.4291</text>
  <text class="d154f-val" x="443" y="318" text-anchor="middle">0.3597</text>
  <text class="d154f-val" x="543" y="360" text-anchor="middle">0.0761</text>
  <text class="d154f-val" x="643" y="265" text-anchor="middle">0.7100</text>
  <text class="d154f-val" x="743" y="214" text-anchor="middle">1.0515</text>
  <text class="d154f-val" x="843" y="281" text-anchor="middle">0.6057</text>

  <text class="d154f-label" x="143" y="414" text-anchor="middle">seed 0</text>
  <text class="d154f-label" x="243" y="414" text-anchor="middle">seed 1</text>
  <text class="d154f-label" x="343" y="414" text-anchor="middle">seed 2</text>
  <text class="d154f-label" x="443" y="414" text-anchor="middle">seed 3</text>
  <text class="d154f-label" x="543" y="414" text-anchor="middle">seed 4</text>
  <text class="d154f-label" x="643" y="414" text-anchor="middle">seed 5</text>
  <text class="d154f-label" x="743" y="414" text-anchor="middle">seed 6</text>
  <text class="d154f-label" x="843" y="414" text-anchor="middle">seed 7</text>

  <text class="d154f-head" x="80" y="466">Bottom: realised prediction-interval coverage against the 0.95 nominal rate</text>
  <line class="d154f-nomline" x1="96" y1="520" x2="1000" y2="520"/>
  <text class="d154f-val" x="1000" y="514" text-anchor="end">nominal, 0.95</text>
  <line class="d154f-zero" x1="96" y1="600" x2="1000" y2="600"/>
  <text class="d154f-muted" x="96" y="618">floor, 0.90</text>

  <rect class="d154f-covbar d154f-c0" x="120" y="526.6" width="46" height="73.4" rx="3"/>
  <rect class="d154f-covbar d154f-c1" x="220" y="526.6" width="46" height="73.4" rx="3"/>
  <rect class="d154f-covbar d154f-c2" x="320" y="497.6" width="46" height="102.4" rx="3"/>
  <rect class="d154f-covbar d154f-c3" x="420" y="512.0" width="46" height="88.0" rx="3"/>
  <rect class="d154f-covbar d154f-c4" x="520" y="526.6" width="46" height="73.4" rx="3"/>
  <rect class="d154f-covbar d154f-c5" x="620" y="483.2" width="46" height="116.8" rx="3"/>
  <rect class="d154f-covbar d154f-c6" x="720" y="541.0" width="46" height="59.0" rx="3"/>
  <rect class="d154f-covbar d154f-c7" x="820" y="526.6" width="46" height="73.4" rx="3"/>

  <text class="d154f-val" x="143" y="518" text-anchor="middle">0.9459</text>
  <text class="d154f-val" x="243" y="518" text-anchor="middle">0.9459</text>
  <text class="d154f-val" x="343" y="489" text-anchor="middle">0.9640</text>
  <text class="d154f-val" x="443" y="504" text-anchor="middle">0.9550</text>
  <text class="d154f-val" x="543" y="518" text-anchor="middle">0.9459</text>
  <text class="d154f-val" x="643" y="475" text-anchor="middle">0.9730</text>
  <text class="d154f-val" x="743" y="533" text-anchor="middle">0.9369</text>
  <text class="d154f-val" x="843" y="518" text-anchor="middle">0.9459</text>

  <text class="d154f-label" x="143" y="624" text-anchor="middle">seed 0</text>
  <text class="d154f-label" x="243" y="624" text-anchor="middle">seed 1</text>
  <text class="d154f-label" x="343" y="624" text-anchor="middle">seed 2</text>
  <text class="d154f-label" x="443" y="624" text-anchor="middle">seed 3</text>
  <text class="d154f-label" x="543" y="624" text-anchor="middle">seed 4</text>
  <text class="d154f-label" x="643" y="624" text-anchor="middle">seed 5</text>
  <text class="d154f-label" x="743" y="624" text-anchor="middle">seed 6</text>
  <text class="d154f-label" x="843" y="624" text-anchor="middle">seed 7</text>

  <rect class="d154f-note" x="70" y="648" width="900" height="40" rx="6"/>
  <text class="d154f-label" x="90" y="673">Over all twenty seeds: mean leaky gap +0.5279 RMSE points, never negative once. Ten-seed mean coverage: 0.9558 against a 0.95 nominal rate.</text>
</svg>
