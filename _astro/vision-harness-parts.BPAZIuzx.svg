<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each independently swappable.">
  <title>Five components, one pipeline</title>
  <style>
    .vision-harness-parts-bg   { fill: #f8fafc; }
    .vision-harness-parts-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vision-harness-parts-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vision-harness-parts-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vision-harness-parts-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vision-harness-parts-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vision-harness-parts-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vision-harness-parts-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .vision-harness-parts-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .vision-harness-parts-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .vision-harness-parts-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .vision-harness-parts-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .vision-harness-parts-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .vision-harness-parts-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .vision-harness-parts-stage { opacity: 1; }

    .vision-harness-parts-s0 { animation-delay: 0.00s; }
    .vision-harness-parts-e0 { animation-delay: 0.00s; }
    .vision-harness-parts-s1 { animation-delay: 1.33s; }
    .vision-harness-parts-e1 { animation-delay: 1.33s; }
    .vision-harness-parts-s2 { animation-delay: 2.67s; }
    .vision-harness-parts-e2 { animation-delay: 2.67s; }
    .vision-harness-parts-s3 { animation-delay: 4.00s; }
    .vision-harness-parts-e3 { animation-delay: 4.00s; }
    .vision-harness-parts-s4 { animation-delay: 5.33s; }
    .vision-harness-parts-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .vision-harness-parts-conn  { animation: vision-harness-parts-trace 8s ease-in-out infinite; }
      .vision-harness-parts-stage { animation: vision-harness-parts-arrive 8s ease-in-out infinite; }
    }
    @keyframes vision-harness-parts-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes vision-harness-parts-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .vision-harness-parts-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .vision-harness-parts-stage { animation: vision-harness-parts-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes vision-harness-parts-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="vision-harness-parts-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="vision-harness-parts-bg" width="980" height="322"/>
  <text class="vision-harness-parts-h1"  x="30" y="40">Five components, one pipeline</text>
  <text class="vision-harness-parts-sub" x="30" y="64">Each independently swappable.</text>
  <g class="vision-harness-parts-stage vision-harness-parts-s0">
    <rect class="vision-harness-parts-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="vision-harness-parts-step" x="44" y="142">01</text>
    <text class="vision-harness-parts-name" x="70" y="142">High-throughput data</text>
    <text class="vision-harness-parts-desc" x="44" y="166">Workers, pinned memory,</text>
    <text class="vision-harness-parts-desc" x="44" y="182">prefetching. Keep the</text>
    <text class="vision-harness-parts-desc" x="44" y="198">accelerator fed.</text>
  </g>
  <line class="vision-harness-parts-line vision-harness-parts-conn vision-harness-parts-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#vision-harness-parts-tip)"/>
  <g class="vision-harness-parts-stage vision-harness-parts-s1">
    <rect class="vision-harness-parts-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="vision-harness-parts-step" x="233" y="142">02</text>
    <text class="vision-harness-parts-name" x="259" y="142">Mixed precision</text>
    <text class="vision-harness-parts-desc" x="233" y="166">Half-precision compute</text>
    <text class="vision-harness-parts-desc" x="233" y="182">with loss scaling. Two to</text>
    <text class="vision-harness-parts-desc" x="233" y="198">four times faster.</text>
    <text class="vision-harness-parts-edge" x="233" y="242">free speed</text>
  </g>
  <line class="vision-harness-parts-line vision-harness-parts-conn vision-harness-parts-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#vision-harness-parts-tip)"/>
  <g class="vision-harness-parts-stage vision-harness-parts-s2">
    <rect class="vision-harness-parts-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="vision-harness-parts-step" x="422" y="142">03</text>
    <text class="vision-harness-parts-name" x="448" y="142">The training loop</text>
    <text class="vision-harness-parts-desc" x="422" y="166">Forward, loss, backward,</text>
    <text class="vision-harness-parts-desc" x="422" y="182">clip, step, schedule.</text>
  </g>
  <line class="vision-harness-parts-line vision-harness-parts-conn vision-harness-parts-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#vision-harness-parts-tip)"/>
  <g class="vision-harness-parts-stage vision-harness-parts-s3">
    <rect class="vision-harness-parts-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="vision-harness-parts-step" x="611" y="142">04</text>
    <text class="vision-harness-parts-name" x="637" y="142">Evaluation</text>
    <text class="vision-harness-parts-desc" x="611" y="166">Held-out split,</text>
    <text class="vision-harness-parts-desc" x="611" y="182">class-balanced metrics, a</text>
    <text class="vision-harness-parts-desc" x="611" y="198">confusion matrix.</text>
  </g>
  <line class="vision-harness-parts-line vision-harness-parts-conn vision-harness-parts-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#vision-harness-parts-tip)"/>
  <g class="vision-harness-parts-stage vision-harness-parts-s4">
    <rect class="vision-harness-parts-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="vision-harness-parts-step" x="800" y="142">05</text>
    <text class="vision-harness-parts-name" x="826" y="142">Serialisation</text>
    <text class="vision-harness-parts-desc" x="800" y="166">Full checkpoints, and an</text>
    <text class="vision-harness-parts-desc" x="800" y="182">exported artefact for</text>
    <text class="vision-harness-parts-desc" x="800" y="198">serving.</text>
  </g>
  <text class="vision-harness-parts-sub" x="30" y="304">None of these is novel on its own, and the pipeline's value is that they are separated: a data change, a precision change and a metric change are three independent edits.</text>
</svg>
