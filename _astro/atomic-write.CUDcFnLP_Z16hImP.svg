<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Writing atomically</title>
  <style>
    .atomic-write-bg   { fill: #f8fafc; }
    .atomic-write-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .atomic-write-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .atomic-write-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .atomic-write-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .atomic-write-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .atomic-write-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .atomic-write-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .atomic-write-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .atomic-write-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .atomic-write-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .atomic-write-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .atomic-write-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .atomic-write-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .atomic-write-stage { opacity: 1; }

    .atomic-write-s0 { animation-delay: 0.00s; }
    .atomic-write-e0 { animation-delay: 0.00s; }
    .atomic-write-s1 { animation-delay: 1.28s; }
    .atomic-write-e1 { animation-delay: 1.28s; }
    .atomic-write-s2 { animation-delay: 2.56s; }
    .atomic-write-e2 { animation-delay: 2.56s; }
    .atomic-write-s3 { animation-delay: 3.84s; }
    .atomic-write-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .atomic-write-conn  { animation: atomic-write-trace 6.4s ease-in-out infinite; }
      .atomic-write-stage { animation: atomic-write-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes atomic-write-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes atomic-write-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .atomic-write-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .atomic-write-stage { animation: atomic-write-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes atomic-write-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="atomic-write-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="atomic-write-bg" width="980" height="322"/>
  <text class="atomic-write-h1"  x="30" y="40">Writing atomically</text>
  <text class="atomic-write-sub" x="30" y="64">Four steps.</text>
  <g class="atomic-write-stage atomic-write-s0">
    <rect class="atomic-write-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="atomic-write-step" x="44" y="142">01</text>
    <text class="atomic-write-name" x="70" y="142">Writing in place risks a partial file</text>
    <text class="atomic-write-desc" x="44" y="166">If the process dies midway.</text>
  </g>
  <line class="atomic-write-line atomic-write-conn atomic-write-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#atomic-write-tip)"/>
  <g class="atomic-write-stage atomic-write-s1">
    <rect class="atomic-write-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="atomic-write-step" x="280" y="142">02</text>
    <text class="atomic-write-name" x="306" y="142">So write to a temporary file alongside</text>
    <text class="atomic-write-desc" x="280" y="166">Leaving the original untouched.</text>
  </g>
  <line class="atomic-write-line atomic-write-conn atomic-write-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#atomic-write-tip)"/>
  <g class="atomic-write-stage atomic-write-s2">
    <rect class="atomic-write-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="atomic-write-step" x="516" y="142">03</text>
    <text class="atomic-write-name" x="542" y="142">Flush it to disk before proceeding</text>
    <text class="atomic-write-desc" x="516" y="166">Since buffers are not the file.</text>
  </g>
  <line class="atomic-write-line atomic-write-conn atomic-write-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#atomic-write-tip)"/>
  <g class="atomic-write-stage atomic-write-s3">
    <rect class="atomic-write-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="atomic-write-step" x="752" y="142">04</text>
    <text class="atomic-write-name" x="778" y="142">Then rename over the original, which is atomic</text>
    <text class="atomic-write-desc" x="752" y="166">So readers see the old or the</text>
    <text class="atomic-write-desc" x="752" y="182">new, never a half.</text>
  </g>
  <text class="atomic-write-sub" x="30" y="304">The rename being atomic on the same filesystem is the property the whole pattern rests on, and it is why the temporary file must be in the same directory.</text>
</svg>
