<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One attempt, on the day.">
  <title>A driving test</title>
  <style>
    .driving-test-bg   { fill: #f8fafc; }
    .driving-test-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .driving-test-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .driving-test-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .driving-test-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .driving-test-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .driving-test-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .driving-test-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .driving-test-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .driving-test-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .driving-test-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .driving-test-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .driving-test-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .driving-test-row { opacity: 1; }
    .driving-test-r0 { animation-delay: 0.00s; }
    .driving-test-r1 { animation-delay: 0.45s; }
    .driving-test-r2 { animation-delay: 0.90s; }
    .driving-test-r3 { animation-delay: 1.35s; }
    .driving-test-r4 { animation-delay: 1.80s; }
    .driving-test-row { animation: driving-test-reveal 7.3s ease-in-out infinite; }
    @keyframes driving-test-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="driving-test-bg" width="980" height="390"/>
  <text class="driving-test-h1"  x="30" y="40">A driving test</text>
  <text class="driving-test-sub" x="30" y="64">One attempt, on the day.</text>
  <rect class="driving-test-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="driving-test-name" x="46" y="122">Practice</text>
  <text class="driving-test-desc" x="46" y="142">As much as you like.</text>
  <text class="driving-test-desc driving-test-row driving-test-r0" x="46" y="182">Repeated, on any route</text>
  <text class="driving-test-desc driving-test-row driving-test-r1" x="46" y="216">Mistakes are how you improve</text>
  <text class="driving-test-desc driving-test-row driving-test-r2" x="46" y="250">The instructor corrects continuously</text>
  <text class="driving-test-desc driving-test-row driving-test-r3" x="46" y="284">No record kept</text>
  <text class="driving-test-desc driving-test-row driving-test-r4" x="46" y="318">This is training and validation</text>
  <rect class="driving-test-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="driving-test-name" x="526" y="122">The test</text>
  <text class="driving-test-desc" x="526" y="142">Once, and recorded.</text>
  <text class="driving-test-desc driving-test-row driving-test-r0" x="526" y="182">One attempt, on the day</text>
  <text class="driving-test-desc driving-test-row driving-test-r1" x="526" y="216">Mistakes count against you</text>
  <text class="driving-test-desc driving-test-row driving-test-r2" x="526" y="250">No coaching during it</text>
  <text class="driving-test-desc driving-test-row driving-test-r3" x="526" y="284">The result stands</text>
  <text class="driving-test-desc driving-test-row driving-test-r4" x="526" y="318">This is the test set</text>
  <text class="driving-test-sub" x="30" y="372">Being coached during the test would make the result meaningless, which is precisely what tuning against a test set does to a reported score.</text>
</svg>
