<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The hard margin</title>
  <style>
    .hard-margin-bg   { fill: #f8fafc; }
    .hard-margin-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hard-margin-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hard-margin-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hard-margin-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hard-margin-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hard-margin-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hard-margin-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hard-margin-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hard-margin-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hard-margin-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hard-margin-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hard-margin-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .hard-margin-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .hard-margin-stage { opacity: 1; }

    .hard-margin-s0 { animation-delay: 0.00s; }
    .hard-margin-e0 { animation-delay: 0.00s; }
    .hard-margin-s1 { animation-delay: 1.28s; }
    .hard-margin-e1 { animation-delay: 1.28s; }
    .hard-margin-s2 { animation-delay: 2.56s; }
    .hard-margin-e2 { animation-delay: 2.56s; }
    .hard-margin-s3 { animation-delay: 3.84s; }
    .hard-margin-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .hard-margin-conn  { animation: hard-margin-trace 6.4s ease-in-out infinite; }
      .hard-margin-stage { animation: hard-margin-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes hard-margin-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes hard-margin-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .hard-margin-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .hard-margin-stage { animation: hard-margin-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes hard-margin-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="hard-margin-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="hard-margin-bg" width="980" height="322"/>
  <text class="hard-margin-h1"  x="30" y="40">The hard margin</text>
  <text class="hard-margin-sub" x="30" y="64">Four steps.</text>
  <g class="hard-margin-stage hard-margin-s0">
    <rect class="hard-margin-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="hard-margin-step" x="44" y="142">01</text>
    <text class="hard-margin-name" x="70" y="142">Require every point on the correct side</text>
    <text class="hard-margin-desc" x="44" y="166">By at least a fixed distance.</text>
  </g>
  <line class="hard-margin-line hard-margin-conn hard-margin-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#hard-margin-tip)"/>
  <g class="hard-margin-stage hard-margin-s1">
    <rect class="hard-margin-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="hard-margin-step" x="280" y="142">02</text>
    <text class="hard-margin-name" x="306" y="142">The margin width is inversely proportional to the weight norm</text>
    <text class="hard-margin-desc" x="280" y="166">Which is the geometric link.</text>
  </g>
  <line class="hard-margin-line hard-margin-conn hard-margin-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#hard-margin-tip)"/>
  <g class="hard-margin-stage hard-margin-s2">
    <rect class="hard-margin-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="hard-margin-step" x="516" y="142">03</text>
    <text class="hard-margin-name" x="542" y="142">So minimising the norm maximises the margin</text>
    <text class="hard-margin-desc" x="516" y="166">A convex problem with a unique</text>
    <text class="hard-margin-desc" x="516" y="182">solution.</text>
  </g>
  <line class="hard-margin-line hard-margin-conn hard-margin-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#hard-margin-tip)"/>
  <g class="hard-margin-stage hard-margin-s3">
    <rect class="hard-margin-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="hard-margin-step" x="752" y="142">04</text>
    <text class="hard-margin-name" x="778" y="142">But one mislabelled point makes it infeasible</text>
    <text class="hard-margin-desc" x="752" y="166">Which is why the soft margin</text>
    <text class="hard-margin-desc" x="752" y="182">exists.</text>
  </g>
  <text class="hard-margin-sub" x="30" y="304">Convexity with a unique solution was a major selling point at the time: unlike neural networks then, the same data always gave the same answer.</text>
</svg>
