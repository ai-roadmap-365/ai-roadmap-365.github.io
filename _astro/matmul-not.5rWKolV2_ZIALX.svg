<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things it is not</title>
  <style>
    .matmul-not-bg   { fill: #f8fafc; }
    .matmul-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matmul-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matmul-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matmul-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matmul-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matmul-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .matmul-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .matmul-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .matmul-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .matmul-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .matmul-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .matmul-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .matmul-not-row { opacity: 1; }
    .matmul-not-r0 { animation-delay: 0.00s; }
    .matmul-not-r1 { animation-delay: 0.45s; }
    .matmul-not-r2 { animation-delay: 0.90s; }
    .matmul-not-r3 { animation-delay: 1.35s; }
    .matmul-not-r4 { animation-delay: 1.80s; }
    .matmul-not-row { animation: matmul-not-reveal 7.3s ease-in-out infinite; }
    @keyframes matmul-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="matmul-not-bg" width="980" height="390"/>
  <text class="matmul-not-h1"  x="30" y="40">Four things it is not</text>
  <text class="matmul-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="matmul-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="matmul-not-name" x="46" y="122">The misconception</text>
  <text class="matmul-not-desc" x="46" y="142">Commonly held.</text>
  <text class="matmul-not-desc matmul-not-row matmul-not-r0" x="46" y="182">It multiplies corresponding entries</text>
  <text class="matmul-not-desc matmul-not-row matmul-not-r1" x="46" y="216">Order does not matter much</text>
  <text class="matmul-not-desc matmul-not-row matmul-not-r2" x="46" y="250">Any two matrices can be multiplied</text>
  <text class="matmul-not-desc matmul-not-row matmul-not-r3" x="46" y="284">It is a computational trick</text>
  <text class="matmul-not-desc matmul-not-row matmul-not-r4" x="46" y="318">The star operator does it</text>
  <rect class="matmul-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="matmul-not-name" x="526" y="122">What is true</text>
  <text class="matmul-not-desc" x="526" y="142">Actually.</text>
  <text class="matmul-not-desc matmul-not-row matmul-not-r0" x="526" y="182">That is a different operation entirely</text>
  <text class="matmul-not-desc matmul-not-row matmul-not-r1" x="526" y="216">It is not commutative, ever</text>
  <text class="matmul-not-desc matmul-not-row matmul-not-r2" x="526" y="250">Inner dimensions must match</text>
  <text class="matmul-not-desc matmul-not-row matmul-not-r3" x="526" y="284">It is composition of transformations</text>
  <text class="matmul-not-desc matmul-not-row matmul-not-r4" x="526" y="318">The at operator does; star is elementwise</text>
  <text class="matmul-not-sub" x="30" y="372">The first and last rows describe the same bug from two directions, and it is the one that produces wrong numbers rather than an exception.</text>
</svg>
