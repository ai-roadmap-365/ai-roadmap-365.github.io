<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three properties a plan does not supply.">
  <title>What makes a commitment</title>
  <style>
    .three-properties-commitment-bg   { fill: #f8fafc; }
    .three-properties-commitment-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-properties-commitment-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-properties-commitment-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-properties-commitment-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-properties-commitment-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-properties-commitment-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-properties-commitment-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-properties-commitment-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-properties-commitment-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-properties-commitment-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-properties-commitment-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-properties-commitment-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .three-properties-commitment-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .three-properties-commitment-stage { opacity: 1; }

    .three-properties-commitment-s0 { animation-delay: 0.00s; }
    .three-properties-commitment-e0 { animation-delay: 0.00s; }
    .three-properties-commitment-s1 { animation-delay: 1.28s; }
    .three-properties-commitment-e1 { animation-delay: 1.28s; }
    .three-properties-commitment-s2 { animation-delay: 2.56s; }
    .three-properties-commitment-e2 { animation-delay: 2.56s; }
    .three-properties-commitment-s3 { animation-delay: 3.84s; }
    .three-properties-commitment-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .three-properties-commitment-conn  { animation: three-properties-commitment-trace 6.4s ease-in-out infinite; }
      .three-properties-commitment-stage { animation: three-properties-commitment-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes three-properties-commitment-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes three-properties-commitment-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .three-properties-commitment-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .three-properties-commitment-stage { animation: three-properties-commitment-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes three-properties-commitment-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="three-properties-commitment-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="three-properties-commitment-bg" width="980" height="322"/>
  <text class="three-properties-commitment-h1"  x="30" y="40">What makes a commitment</text>
  <text class="three-properties-commitment-sub" x="30" y="64">Three properties a plan does not supply.</text>
  <g class="three-properties-commitment-stage three-properties-commitment-s0">
    <rect class="three-properties-commitment-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="three-properties-commitment-step" x="44" y="142">01</text>
    <text class="three-properties-commitment-name" x="70" y="142">A next action</text>
    <text class="three-properties-commitment-desc" x="44" y="166">Something you could open a</text>
    <text class="three-properties-commitment-desc" x="44" y="182">terminal and begin within the</text>
    <text class="three-properties-commitment-desc" x="44" y="198">hour.</text>
  </g>
  <line class="three-properties-commitment-line three-properties-commitment-conn three-properties-commitment-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#three-properties-commitment-tip)"/>
  <g class="three-properties-commitment-stage three-properties-commitment-s1">
    <rect class="three-properties-commitment-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="three-properties-commitment-step" x="280" y="142">02</text>
    <text class="three-properties-commitment-name" x="306" y="142">An artifact</text>
    <text class="three-properties-commitment-desc" x="280" y="166">A repository, a merged pull</text>
    <text class="three-properties-commitment-desc" x="280" y="182">request, a post, a benchmark. It</text>
    <text class="three-properties-commitment-desc" x="280" y="198">did not exist before.</text>
    <text class="three-properties-commitment-edge" x="280" y="242">checkable</text>
  </g>
  <line class="three-properties-commitment-line three-properties-commitment-conn three-properties-commitment-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#three-properties-commitment-tip)"/>
  <g class="three-properties-commitment-stage three-properties-commitment-s2">
    <rect class="three-properties-commitment-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="three-properties-commitment-step" x="516" y="142">03</text>
    <text class="three-properties-commitment-name" x="542" y="142">Hours you actually have</text>
    <text class="three-properties-commitment-desc" x="516" y="166">Measured, then multiplied by</text>
    <text class="three-properties-commitment-desc" x="516" y="182">your own calibration ratio.</text>
    <text class="three-properties-commitment-edge" x="516" y="242">your hours</text>
  </g>
  <line class="three-properties-commitment-line three-properties-commitment-conn three-properties-commitment-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#three-properties-commitment-tip)"/>
  <g class="three-properties-commitment-stage three-properties-commitment-s3">
    <rect class="three-properties-commitment-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="three-properties-commitment-step" x="752" y="142">04</text>
    <text class="three-properties-commitment-name" x="778" y="142">Then the arithmetic</text>
    <text class="three-properties-commitment-desc" x="752" y="166">Total, compare, and cut whole</text>
    <text class="three-properties-commitment-desc" x="752" y="182">commitments if it does not fit.</text>
    <text class="three-properties-commitment-edge" x="752" y="242">before week one</text>
  </g>
  <text class="three-properties-commitment-sub" x="30" y="304">The second property is what lets you tell progress from activity three months from now, when the only alternative evidence is a feeling about whether the time was well spent.</text>
</svg>
