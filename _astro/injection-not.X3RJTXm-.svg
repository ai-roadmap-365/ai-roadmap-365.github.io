<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things prompt injection is not</title>
  <style>
    .injection-not-bg   { fill: #f8fafc; }
    .injection-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .injection-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .injection-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .injection-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .injection-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .injection-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .injection-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .injection-not-row { opacity: 1; }
    .injection-not-r0 { animation-delay: 0.00s; }
    .injection-not-r1 { animation-delay: 0.45s; }
    .injection-not-r2 { animation-delay: 0.90s; }
    .injection-not-r3 { animation-delay: 1.35s; }
    .injection-not-r4 { animation-delay: 1.80s; }
    .injection-not-row { animation: injection-not-reveal 7.3s ease-in-out infinite; }
    @keyframes injection-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="injection-not-bg" width="980" height="390"/>
  <text class="injection-not-h1"  x="30" y="40">Four things prompt injection is not</text>
  <text class="injection-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="injection-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="injection-not-name" x="46" y="122">The misconception</text>
  <text class="injection-not-desc" x="46" y="142">Commonly held.</text>
  <text class="injection-not-desc injection-not-row injection-not-r0" x="46" y="182">A better system prompt fixes it</text>
  <text class="injection-not-desc injection-not-row injection-not-r1" x="46" y="216">It only affects chat interfaces</text>
  <text class="injection-not-desc injection-not-row injection-not-r2" x="46" y="250">Filtering known attack strings is enough</text>
  <text class="injection-not-desc injection-not-row injection-not-r3" x="46" y="284">It requires the attacker to reach the model</text>
  <text class="injection-not-desc injection-not-row injection-not-r4" x="46" y="318">A model that refuses once will keep refusing</text>
  <rect class="injection-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="injection-not-name" x="526" y="122">What is true</text>
  <text class="injection-not-desc" x="526" y="142">Actually.</text>
  <text class="injection-not-desc injection-not-row injection-not-r0" x="526" y="182">Instructions and content share one channel</text>
  <text class="injection-not-desc injection-not-row injection-not-r1" x="526" y="216">Any retrieved or tool-returned text carries it</text>
  <text class="injection-not-desc injection-not-row injection-not-r2" x="526" y="250">Phrasings are unbounded; filters are bypassed</text>
  <text class="injection-not-desc injection-not-row injection-not-r3" x="526" y="284">Indirect injection arrives through documents</text>
  <text class="injection-not-desc injection-not-row injection-not-r4" x="526" y="318">Rephrasing and context length both defeat it</text>
  <text class="injection-not-sub" x="30" y="372">Indirect injection is the row that changes system design, because it means every document, web page and tool response your agent reads is untrusted input.</text>
</svg>
