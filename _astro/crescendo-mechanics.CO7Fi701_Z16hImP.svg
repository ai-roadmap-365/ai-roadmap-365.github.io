<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four stages, with pruning.">
  <title>How a crescendo is automated</title>
  <style>
    .crescendo-mechanics-bg   { fill: #f8fafc; }
    .crescendo-mechanics-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .crescendo-mechanics-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .crescendo-mechanics-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .crescendo-mechanics-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .crescendo-mechanics-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .crescendo-mechanics-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .crescendo-mechanics-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .crescendo-mechanics-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .crescendo-mechanics-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .crescendo-mechanics-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .crescendo-mechanics-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .crescendo-mechanics-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .crescendo-mechanics-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .crescendo-mechanics-stage { opacity: 1; }

    .crescendo-mechanics-s0 { animation-delay: 0.00s; }
    .crescendo-mechanics-e0 { animation-delay: 0.00s; }
    .crescendo-mechanics-s1 { animation-delay: 1.28s; }
    .crescendo-mechanics-e1 { animation-delay: 1.28s; }
    .crescendo-mechanics-s2 { animation-delay: 2.56s; }
    .crescendo-mechanics-e2 { animation-delay: 2.56s; }
    .crescendo-mechanics-s3 { animation-delay: 3.84s; }
    .crescendo-mechanics-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .crescendo-mechanics-conn  { animation: crescendo-mechanics-trace 6.4s ease-in-out infinite; }
      .crescendo-mechanics-stage { animation: crescendo-mechanics-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes crescendo-mechanics-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes crescendo-mechanics-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .crescendo-mechanics-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .crescendo-mechanics-stage { animation: crescendo-mechanics-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes crescendo-mechanics-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="crescendo-mechanics-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="crescendo-mechanics-bg" width="980" height="322"/>
  <text class="crescendo-mechanics-h1"  x="30" y="40">How a crescendo is automated</text>
  <text class="crescendo-mechanics-sub" x="30" y="64">Four stages, with pruning.</text>
  <g class="crescendo-mechanics-stage crescendo-mechanics-s0">
    <rect class="crescendo-mechanics-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="crescendo-mechanics-step" x="44" y="142">01</text>
    <text class="crescendo-mechanics-name" x="70" y="142">A benign root</text>
    <text class="crescendo-mechanics-desc" x="44" y="166">An academic or historical query</text>
    <text class="crescendo-mechanics-desc" x="44" y="182">in the target domain.</text>
  </g>
  <line class="crescendo-mechanics-line crescendo-mechanics-conn crescendo-mechanics-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#crescendo-mechanics-tip)"/>
  <g class="crescendo-mechanics-stage crescendo-mechanics-s1">
    <rect class="crescendo-mechanics-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="crescendo-mechanics-step" x="280" y="142">02</text>
    <text class="crescendo-mechanics-name" x="306" y="142">Semantic anchoring, turns 2-3</text>
    <text class="crescendo-mechanics-desc" x="280" y="166">Follow-ups quoting the model's</text>
    <text class="crescendo-mechanics-desc" x="280" y="182">own words back to it.</text>
    <text class="crescendo-mechanics-edge" x="280" y="242">its own text</text>
  </g>
  <line class="crescendo-mechanics-line crescendo-mechanics-conn crescendo-mechanics-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#crescendo-mechanics-tip)"/>
  <g class="crescendo-mechanics-stage crescendo-mechanics-s2">
    <rect class="crescendo-mechanics-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="crescendo-mechanics-step" x="516" y="142">03</text>
    <text class="crescendo-mechanics-name" x="542" y="142">The pivot, turn 4</text>
    <text class="crescendo-mechanics-desc" x="516" y="166">From theoretical discussion to</text>
    <text class="crescendo-mechanics-desc" x="516" y="182">an actionable request.</text>
  </g>
  <line class="crescendo-mechanics-line crescendo-mechanics-conn crescendo-mechanics-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#crescendo-mechanics-tip)"/>
  <g class="crescendo-mechanics-stage crescendo-mechanics-s3">
    <rect class="crescendo-mechanics-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="crescendo-mechanics-step" x="752" y="142">04</text>
    <text class="crescendo-mechanics-name" x="778" y="142">Prune and retry</text>
    <text class="crescendo-mechanics-desc" x="752" y="166">A branch that triggers refusal</text>
    <text class="crescendo-mechanics-desc" x="752" y="182">is abandoned; alternative</text>
    <text class="crescendo-mechanics-desc" x="752" y="198">phrasings explored.</text>
    <text class="crescendo-mechanics-edge" x="752" y="242">TAP</text>
  </g>
  <text class="crescendo-mechanics-sub" x="30" y="304">Anchoring on the model's own output is what makes this effective: the model is being asked to remain consistent with statements it already made, which is a pressure its safety instructions were not written against.</text>
</svg>
