<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Principal component analysis</title>
  <style>
    .pca-idea-bg   { fill: #f8fafc; }
    .pca-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pca-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pca-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pca-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pca-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pca-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pca-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pca-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pca-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pca-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pca-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pca-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pca-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pca-idea-stage { opacity: 1; }

    .pca-idea-s0 { animation-delay: 0.00s; }
    .pca-idea-e0 { animation-delay: 0.00s; }
    .pca-idea-s1 { animation-delay: 1.28s; }
    .pca-idea-e1 { animation-delay: 1.28s; }
    .pca-idea-s2 { animation-delay: 2.56s; }
    .pca-idea-e2 { animation-delay: 2.56s; }
    .pca-idea-s3 { animation-delay: 3.84s; }
    .pca-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .pca-idea-conn  { animation: pca-idea-trace 6.4s ease-in-out infinite; }
      .pca-idea-stage { animation: pca-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes pca-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pca-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pca-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pca-idea-stage { animation: pca-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pca-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pca-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pca-idea-bg" width="980" height="322"/>
  <text class="pca-idea-h1"  x="30" y="40">Principal component analysis</text>
  <text class="pca-idea-sub" x="30" y="64">Four steps.</text>
  <g class="pca-idea-stage pca-idea-s0">
    <rect class="pca-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="pca-idea-step" x="44" y="142">01</text>
    <text class="pca-idea-name" x="70" y="142">Centre the data</text>
    <text class="pca-idea-desc" x="44" y="166">And scale it, if the units</text>
    <text class="pca-idea-desc" x="44" y="182">differ.</text>
  </g>
  <line class="pca-idea-line pca-idea-conn pca-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#pca-idea-tip)"/>
  <g class="pca-idea-stage pca-idea-s1">
    <rect class="pca-idea-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="pca-idea-step" x="280" y="142">02</text>
    <text class="pca-idea-name" x="306" y="142">Find the direction of greatest variance</text>
    <text class="pca-idea-desc" x="280" y="166">Which is the first component.</text>
  </g>
  <line class="pca-idea-line pca-idea-conn pca-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#pca-idea-tip)"/>
  <g class="pca-idea-stage pca-idea-s2">
    <rect class="pca-idea-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="pca-idea-step" x="516" y="142">03</text>
    <text class="pca-idea-name" x="542" y="142">Then the next, perpendicular to it</text>
    <text class="pca-idea-desc" x="516" y="166">And so on, each orthogonal to</text>
    <text class="pca-idea-desc" x="516" y="182">all before.</text>
  </g>
  <line class="pca-idea-line pca-idea-conn pca-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#pca-idea-tip)"/>
  <g class="pca-idea-stage pca-idea-s3">
    <rect class="pca-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="pca-idea-step" x="752" y="142">04</text>
    <text class="pca-idea-name" x="778" y="142">Project onto the first few</text>
    <text class="pca-idea-desc" x="752" y="166">Keeping most of the variance in</text>
    <text class="pca-idea-desc" x="752" y="182">far fewer dimensions.</text>
    <text class="pca-idea-edge" x="752" y="242">lossy</text>
  </g>
  <text class="pca-idea-sub" x="30" y="304">Orthogonality is what makes the components a basis rather than a list: each one carries variance that none of the others already accounted for.</text>
</svg>
