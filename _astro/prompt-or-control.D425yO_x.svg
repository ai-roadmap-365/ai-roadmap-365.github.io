<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And an OS permission is not a substitute either.">
  <title>A prompt is not a control</title>
  <style>
    .prompt-or-control-bg   { fill: #f8fafc; }
    .prompt-or-control-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-or-control-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-or-control-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-or-control-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-or-control-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-or-control-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prompt-or-control-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .prompt-or-control-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .prompt-or-control-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .prompt-or-control-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .prompt-or-control-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .prompt-or-control-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prompt-or-control-row { opacity: 1; }
    .prompt-or-control-r0 { animation-delay: 0.00s; }
    .prompt-or-control-r1 { animation-delay: 0.45s; }
    .prompt-or-control-r2 { animation-delay: 0.90s; }
    .prompt-or-control-r3 { animation-delay: 1.35s; }
    .prompt-or-control-r4 { animation-delay: 1.80s; }
    .prompt-or-control-row { animation: prompt-or-control-reveal 7.3s ease-in-out infinite; }
    @keyframes prompt-or-control-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="prompt-or-control-bg" width="980" height="390"/>
  <text class="prompt-or-control-h1"  x="30" y="40">A prompt is not a control</text>
  <text class="prompt-or-control-sub" x="30" y="64">And an OS permission is not a substitute either.</text>
  <rect class="prompt-or-control-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="prompt-or-control-name" x="46" y="122">Enforced controls</text>
  <text class="prompt-or-control-desc" x="46" y="142">Deterministic and testable.</text>
  <text class="prompt-or-control-desc prompt-or-control-row prompt-or-control-r0" x="46" y="182">Validation, canonicalisation, timeouts</text>
  <text class="prompt-or-control-desc prompt-or-control-row prompt-or-control-r1" x="46" y="216">Approval gates on mutations</text>
  <text class="prompt-or-control-desc prompt-or-control-row prompt-or-control-r2" x="46" y="250">Isolated process permissions</text>
  <text class="prompt-or-control-desc prompt-or-control-row prompt-or-control-r3" x="46" y="284">Environment secrets scoped per server</text>
  <text class="prompt-or-control-desc prompt-or-control-row prompt-or-control-r4" x="46" y="318">Every decision logged</text>
  <rect class="prompt-or-control-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="prompt-or-control-name" x="526" y="122">Not controls</text>
  <text class="prompt-or-control-desc" x="526" y="142">Two common substitutes.</text>
  <text class="prompt-or-control-desc prompt-or-control-row prompt-or-control-r0" x="526" y="182">"Please do not execute bad commands"</text>
  <text class="prompt-or-control-desc prompt-or-control-row prompt-or-control-r1" x="526" y="216">Bypassed by any adversarial phrasing</text>
  <text class="prompt-or-control-desc prompt-or-control-row prompt-or-control-r2" x="526" y="250">OS permissions alone</text>
  <text class="prompt-or-control-desc prompt-or-control-row prompt-or-control-r3" x="526" y="284">They bound the ceiling, not the blast radius</text>
  <text class="prompt-or-control-desc prompt-or-control-row prompt-or-control-r4" x="526" y="318">The agent already has your access</text>
  <text class="prompt-or-control-sub" x="30" y="372">The second row on the right is the subtle one: OS permissions do exactly what they are meant to, and they permit everything you are permitted to do, which is the entire problem.</text>
</svg>
