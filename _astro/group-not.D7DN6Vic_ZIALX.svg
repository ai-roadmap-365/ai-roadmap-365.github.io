<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things grouping is not</title>
  <style>
    .group-not-bg   { fill: #f8fafc; }
    .group-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .group-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .group-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .group-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .group-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .group-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .group-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .group-not-row { opacity: 1; }
    .group-not-r0 { animation-delay: 0.00s; }
    .group-not-r1 { animation-delay: 0.45s; }
    .group-not-r2 { animation-delay: 0.90s; }
    .group-not-r3 { animation-delay: 1.35s; }
    .group-not-r4 { animation-delay: 1.80s; }
    .group-not-row { animation: group-not-reveal 7.3s ease-in-out infinite; }
    @keyframes group-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="group-not-bg" width="980" height="390"/>
  <text class="group-not-h1"  x="30" y="40">Four things grouping is not</text>
  <text class="group-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="group-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="group-not-name" x="46" y="122">The misconception</text>
  <text class="group-not-desc" x="46" y="142">Commonly held.</text>
  <text class="group-not-desc group-not-row group-not-r0" x="46" y="182">Grouping physically splits the data</text>
  <text class="group-not-desc group-not-row group-not-r1" x="46" y="216">Every group operation aggregates</text>
  <text class="group-not-desc group-not-row group-not-r2" x="46" y="250">Missing keys form their own group</text>
  <text class="group-not-desc group-not-row group-not-r3" x="46" y="284">The mean is over all rows in the group</text>
  <text class="group-not-desc group-not-row group-not-r4" x="46" y="318">Group order is arbitrary</text>
  <rect class="group-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="group-not-name" x="526" y="122">What is true</text>
  <text class="group-not-desc" x="526" y="142">Actually.</text>
  <text class="group-not-desc group-not-row group-not-r0" x="526" y="182">It is a lazy specification until applied</text>
  <text class="group-not-desc group-not-row group-not-r1" x="526" y="216">Transform and filter return other shapes</text>
  <text class="group-not-desc group-not-row group-not-r2" x="526" y="250">They are dropped unless you ask</text>
  <text class="group-not-desc group-not-row group-not-r3" x="526" y="284">It skips missing values</text>
  <text class="group-not-desc group-not-row group-not-r4" x="526" y="318">It follows the key by default</text>
  <text class="group-not-sub" x="30" y="372">Grouping being lazy until something is applied is worth knowing for performance, because the split itself costs nothing until you ask for a result.</text>
</svg>
