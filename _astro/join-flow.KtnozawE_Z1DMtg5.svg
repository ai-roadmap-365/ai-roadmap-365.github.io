<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" width="1040" height="660" role="img" aria-labelledby="d087f-title d087f-desc">
  <title id="d087f-title">How a join matches rows: a probe row travels from the left table, tests each right-hand row, and assembles an output row</title>
  <desc id="d087f-desc">Two small tables sit side by side. The members table on the left has four rows; the loans table on the right has three. A probe token travels from each left row across to the right table, where candidate rows light up as they are tested. Matching pairs assemble into the output table below, joining member name to loan id. The last left row, Eli, matches nothing: under INNER JOIN it is dropped, and under LEFT JOIN it still appears in the output with NULL in every column that came from the right table. Every value, label and result row is drawn in the still frame.</desc>

  <style>
    .d087f-bg      { fill: #f8fafc; }
    .d087f-title   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 19px; font-weight: 600; fill: #1a202c; }
    .d087f-sub     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d087f-hd      { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; fill: #1a202c; }
    .d087f-cell    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1a202c; }
    .d087f-null    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #b45309; }
    .d087f-note    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d087f-lbl     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #1d4ed8; }
    .d087f-box     { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d087f-head    { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d087f-out     { fill: #ffffff; stroke: #1d4ed8; stroke-width: 2; }
    .d087f-orphan  { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }

    /* Motion 3 — each right-hand row lights up as the probe tests it. */
    .d087f-cand { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5;
                  animation: d087f-test 8s ease-in-out infinite; }
    .d087f-c1 { animation-delay: 0.2s; }
    .d087f-c2 { animation-delay: 2.2s; }
    .d087f-c3 { animation-delay: 4.2s; }
    @keyframes d087f-test {
      0%, 18%, 100% { fill: #ffffff; }
      5%, 12%       { fill: #bfdbfe; }
    }

    /* Motion 2 — the join predicate flows between the two tables. */
    .d087f-wire { fill: none; stroke: #1d4ed8; stroke-width: 2.5;
                  stroke-dasharray: 10 8; animation: d087f-march 1.6s linear infinite; }
    @keyframes d087f-march { to { stroke-dashoffset: -18; } }

    /* Motion 1 — the probe row travels left to right, resting visible at home. */
    .d087f-probe { fill: #1d4ed8; animation: d087f-travel 8s ease-in-out infinite; }
    @keyframes d087f-travel {
      0%,  4%  { transform: translate(0, 0);      opacity: 1; }
      14%, 20% { transform: translate(300px, 0);  opacity: 1; }
      27%      { transform: translate(300px, 46px);  opacity: 1; }
      37%, 43% { transform: translate(300px, 92px);  opacity: 1; }
      52%      { transform: translate(300px, 138px); opacity: 1; }
      66%, 74% { transform: translate(300px, 138px); opacity: 1; }
      88%,100% { transform: translate(0, 0);      opacity: 1; }
    }

    /* The matched output rows are emphasised as they assemble. */
    .d087f-row { animation: d087f-settle 8s ease-in-out infinite; }
    .d087f-r1 { animation-delay: 0.6s; }
    .d087f-r2 { animation-delay: 2.6s; }
    .d087f-r3 { animation-delay: 4.6s; }
    @keyframes d087f-settle {
      0%, 22%, 100% { opacity: 0.9; }
      8%, 16%       { opacity: 1; }
    }

    /* The unmatched row: emphasised last, and always visible. */
    .d087f-orphan-row { animation: d087f-keep 8s ease-in-out infinite; }
    @keyframes d087f-keep {
      0%, 62%, 100% { opacity: 0.9; }
      70%, 82%      { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d087f-cand       { animation: none; fill: #ffffff; }
      .d087f-wire       { animation: none; stroke-dasharray: none; }
      .d087f-probe      { animation: none; transform: none; opacity: 1; }
      .d087f-row        { animation: none; opacity: 1; }
      .d087f-orphan-row { animation: none; opacity: 1; }
    }
  </style>

  <defs>
    <marker id="d087f-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
  </defs>

  <rect class="d087f-bg" x="0" y="0" width="1040" height="660" />
  <text class="d087f-title" x="32" y="38">One join, row by row: probe, test, assemble</text>
  <text class="d087f-sub" x="32" y="62">ON m.member_id = l.member_id — for each row on the left, find the rows on the right whose key is equal.</text>

  <!-- LEFT TABLE -->
  <text class="d087f-hd" x="60" y="106">members  (left)</text>
  <rect class="d087f-head" x="60" y="118" width="250" height="34" />
  <text class="d087f-cell" x="76" y="140">member_id</text>
  <text class="d087f-cell" x="186" y="140">name</text>

  <rect class="d087f-box" x="60" y="152" width="250" height="46" />
  <text class="d087f-cell" x="76" y="181">1</text>
  <text class="d087f-cell" x="186" y="181">Ada</text>

  <rect class="d087f-box" x="60" y="198" width="250" height="46" />
  <text class="d087f-cell" x="76" y="227">2</text>
  <text class="d087f-cell" x="186" y="227">Bruno</text>

  <rect class="d087f-box" x="60" y="244" width="250" height="46" />
  <text class="d087f-cell" x="76" y="273">3</text>
  <text class="d087f-cell" x="186" y="273">Chandra</text>

  <rect class="d087f-orphan" x="60" y="290" width="250" height="46" />
  <text class="d087f-cell" x="76" y="319">5</text>
  <text class="d087f-cell" x="186" y="319">Eli</text>

  <!-- RIGHT TABLE -->
  <text class="d087f-hd" x="470" y="106">loans  (right)</text>
  <rect class="d087f-head" x="470" y="118" width="290" height="34" />
  <text class="d087f-cell" x="486" y="140">loan_id</text>
  <text class="d087f-cell" x="590" y="140">member_id</text>

  <rect class="d087f-cand d087f-c1" x="470" y="152" width="290" height="46" />
  <text class="d087f-cell" x="486" y="181">1</text>
  <text class="d087f-cell" x="590" y="181">1</text>

  <rect class="d087f-cand d087f-c2" x="470" y="198" width="290" height="46" />
  <text class="d087f-cell" x="486" y="227">3</text>
  <text class="d087f-cell" x="590" y="227">2</text>

  <rect class="d087f-cand d087f-c3" x="470" y="244" width="290" height="46" />
  <text class="d087f-cell" x="486" y="273">4</text>
  <text class="d087f-cell" x="590" y="273">3</text>

  <text class="d087f-note" x="470" y="322">No loan anywhere has member_id 5.</text>

  <!-- the predicate wire -->
  <path class="d087f-wire" d="M 320 175 L 460 175" marker-end="url(#d087f-arrow)" />
  <text class="d087f-lbl" x="390" y="164" text-anchor="middle">probe</text>

  <!-- the travelling probe token -->
  <circle class="d087f-probe" cx="335" cy="175" r="9" />

  <text class="d087f-note" x="800" y="181">tested, equal — keep</text>
  <text class="d087f-note" x="800" y="227">tested, equal — keep</text>
  <text class="d087f-note" x="800" y="273">tested, equal — keep</text>
  <text class="d087f-note" x="800" y="319">nothing to test against</text>

  <!-- OUTPUT -->
  <text class="d087f-hd" x="60" y="392">output — one row per matching pair</text>
  <rect class="d087f-head" x="60" y="404" width="700" height="34" />
  <text class="d087f-cell" x="76" y="426">name</text>
  <text class="d087f-cell" x="300" y="426">loan_id</text>
  <text class="d087f-cell" x="500" y="426">kept by</text>

  <g class="d087f-row d087f-r1">
    <rect class="d087f-out" x="60" y="438" width="700" height="42" />
    <text class="d087f-cell" x="76" y="465">Ada</text>
    <text class="d087f-cell" x="300" y="465">1</text>
    <text class="d087f-cell" x="500" y="465">INNER and LEFT</text>
  </g>
  <g class="d087f-row d087f-r2">
    <rect class="d087f-out" x="60" y="480" width="700" height="42" />
    <text class="d087f-cell" x="76" y="507">Bruno</text>
    <text class="d087f-cell" x="300" y="507">3</text>
    <text class="d087f-cell" x="500" y="507">INNER and LEFT</text>
  </g>
  <g class="d087f-row d087f-r3">
    <rect class="d087f-out" x="60" y="522" width="700" height="42" />
    <text class="d087f-cell" x="76" y="549">Chandra</text>
    <text class="d087f-cell" x="300" y="549">4</text>
    <text class="d087f-cell" x="500" y="549">INNER and LEFT</text>
  </g>
  <g class="d087f-orphan-row">
    <rect class="d087f-orphan" x="60" y="564" width="700" height="42" />
    <text class="d087f-cell" x="76" y="591">Eli</text>
    <text class="d087f-null" x="300" y="591">NULL</text>
    <text class="d087f-cell" x="500" y="591">LEFT only — INNER drops this row</text>
  </g>

  <text class="d087f-note" x="790" y="465">INNER JOIN returns 3 rows.</text>
  <text class="d087f-note" x="790" y="491">LEFT JOIN returns 4: every left</text>
  <text class="d087f-note" x="790" y="511">row survives, matched or not.</text>
  <text class="d087f-note" x="790" y="549">The NULL is not stored anywhere.</text>
  <text class="d087f-note" x="790" y="569">The join invents it, to fill the</text>
  <text class="d087f-note" x="790" y="589">columns that had no matching row.</text>

  <text class="d087f-sub" x="32" y="636">WHERE loan_id IS NULL keeps only the last row — that is the anti-join: find the left rows with no match on the right.</text>
</svg>
