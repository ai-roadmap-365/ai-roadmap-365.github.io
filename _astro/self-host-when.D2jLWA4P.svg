<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to self-host</title>
  <style>
    .self-host-when-bg   { fill: #f8fafc; }
    .self-host-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .self-host-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .self-host-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .self-host-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .self-host-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .self-host-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .self-host-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .self-host-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .self-host-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .self-host-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .self-host-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .self-host-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .self-host-when-row { opacity: 1; }
    .self-host-when-r0 { animation-delay: 0.00s; }
    .self-host-when-r1 { animation-delay: 0.45s; }
    .self-host-when-r2 { animation-delay: 0.90s; }
    .self-host-when-r3 { animation-delay: 1.35s; }
    .self-host-when-r4 { animation-delay: 1.80s; }
    .self-host-when-row { animation: self-host-when-reveal 7.3s ease-in-out infinite; }
    @keyframes self-host-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="self-host-when-bg" width="980" height="390"/>
  <text class="self-host-when-h1"  x="30" y="40">When to self-host</text>
  <text class="self-host-when-sub" x="30" y="64">And when not to.</text>
  <rect class="self-host-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="self-host-when-name" x="46" y="122">Self-host</text>
  <text class="self-host-when-desc" x="46" y="142">Volume or constraint.</text>
  <text class="self-host-when-desc self-host-when-row self-host-when-r0" x="46" y="182">Sustained high request volume</text>
  <text class="self-host-when-desc self-host-when-row self-host-when-r1" x="46" y="216">Data that cannot leave your infrastructure</text>
  <text class="self-host-when-desc self-host-when-row self-host-when-r2" x="46" y="250">Offline or air-gapped deployment</text>
  <text class="self-host-when-desc self-host-when-row self-host-when-r3" x="46" y="284">Where version stability is required</text>
  <text class="self-host-when-desc self-host-when-row self-host-when-r4" x="46" y="318">And you have the operations capability</text>
  <rect class="self-host-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="self-host-when-name" x="526" y="122">Use the API</text>
  <text class="self-host-when-desc" x="526" y="142">Usually, at first.</text>
  <text class="self-host-when-desc self-host-when-row self-host-when-r0" x="526" y="182">Prototyping and early product</text>
  <text class="self-host-when-desc self-host-when-row self-host-when-r1" x="526" y="216">Spiky or unpredictable traffic</text>
  <text class="self-host-when-desc self-host-when-row self-host-when-r2" x="526" y="250">Where frontier capability is needed</text>
  <text class="self-host-when-desc self-host-when-row self-host-when-r3" x="526" y="284">Small teams without operations</text>
  <text class="self-host-when-desc self-host-when-row self-host-when-r4" x="526" y="318">And where the cost is not yet material</text>
  <text class="self-host-when-sub" x="30" y="372">Starting hosted and moving to self-hosting once the volume justifies it is the sequence that goes wrong least often, provided the code was written to swap the model out.</text>
</svg>
