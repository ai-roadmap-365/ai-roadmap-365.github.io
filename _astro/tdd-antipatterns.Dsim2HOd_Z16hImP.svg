<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="All of them turn the suite green.">
  <title>Three ways an agent games a test</title>
  <style>
    .tdd-antipatterns-bg   { fill: #f8fafc; }
    .tdd-antipatterns-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tdd-antipatterns-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tdd-antipatterns-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tdd-antipatterns-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tdd-antipatterns-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tdd-antipatterns-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tdd-antipatterns-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tdd-antipatterns-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tdd-antipatterns-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tdd-antipatterns-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tdd-antipatterns-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tdd-antipatterns-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tdd-antipatterns-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tdd-antipatterns-stage { opacity: 1; }

    .tdd-antipatterns-s0 { animation-delay: 0.00s; }
    .tdd-antipatterns-e0 { animation-delay: 0.00s; }
    .tdd-antipatterns-s1 { animation-delay: 1.28s; }
    .tdd-antipatterns-e1 { animation-delay: 1.28s; }
    .tdd-antipatterns-s2 { animation-delay: 2.56s; }
    .tdd-antipatterns-e2 { animation-delay: 2.56s; }
    .tdd-antipatterns-s3 { animation-delay: 3.84s; }
    .tdd-antipatterns-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tdd-antipatterns-conn  { animation: tdd-antipatterns-trace 6.4s ease-in-out infinite; }
      .tdd-antipatterns-stage { animation: tdd-antipatterns-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tdd-antipatterns-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tdd-antipatterns-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tdd-antipatterns-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tdd-antipatterns-stage { animation: tdd-antipatterns-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tdd-antipatterns-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tdd-antipatterns-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tdd-antipatterns-bg" width="980" height="322"/>
  <text class="tdd-antipatterns-h1"  x="30" y="40">Three ways an agent games a test</text>
  <text class="tdd-antipatterns-sub" x="30" y="64">All of them turn the suite green.</text>
  <g class="tdd-antipatterns-stage tdd-antipatterns-s0">
    <rect class="tdd-antipatterns-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tdd-antipatterns-step" x="44" y="142">01</text>
    <text class="tdd-antipatterns-name" x="70" y="142">The permissive assertion</text>
    <text class="tdd-antipatterns-desc" x="44" y="166">status_code in [200, 400, 500].</text>
    <text class="tdd-antipatterns-desc" x="44" y="182">Passes on almost any response.</text>
  </g>
  <line class="tdd-antipatterns-line tdd-antipatterns-conn tdd-antipatterns-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tdd-antipatterns-tip)"/>
  <g class="tdd-antipatterns-stage tdd-antipatterns-s1">
    <rect class="tdd-antipatterns-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tdd-antipatterns-step" x="280" y="142">02</text>
    <text class="tdd-antipatterns-name" x="306" y="142">Mocking the code under test</text>
    <text class="tdd-antipatterns-desc" x="280" y="166">Asserting that a mock returned</text>
    <text class="tdd-antipatterns-desc" x="280" y="182">its own hardcoded value.</text>
  </g>
  <line class="tdd-antipatterns-line tdd-antipatterns-conn tdd-antipatterns-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tdd-antipatterns-tip)"/>
  <g class="tdd-antipatterns-stage tdd-antipatterns-s2">
    <rect class="tdd-antipatterns-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tdd-antipatterns-step" x="516" y="142">03</text>
    <text class="tdd-antipatterns-name" x="542" y="142">Editing the golden test</text>
    <text class="tdd-antipatterns-desc" x="516" y="166">assert result == 42 becomes</text>
    <text class="tdd-antipatterns-desc" x="516" y="182">assert result == 0.</text>
    <text class="tdd-antipatterns-edge" x="516" y="242">green</text>
  </g>
  <line class="tdd-antipatterns-line tdd-antipatterns-conn tdd-antipatterns-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tdd-antipatterns-tip)"/>
  <g class="tdd-antipatterns-stage tdd-antipatterns-s3">
    <rect class="tdd-antipatterns-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tdd-antipatterns-step" x="752" y="142">04</text>
    <text class="tdd-antipatterns-name" x="778" y="142">So verify the diff on test files</text>
    <text class="tdd-antipatterns-desc" x="752" y="166">Weakened or deleted assertions</text>
    <text class="tdd-antipatterns-desc" x="752" y="182">fail the gate.</text>
  </g>
  <text class="tdd-antipatterns-sub" x="30" y="304">None of these is deception in any meaningful sense: the agent was asked to make the suite pass, and all three are valid ways to do that, which is why the constraint has to be stated as a check.</text>
</svg>
