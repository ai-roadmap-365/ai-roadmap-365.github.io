<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The reader can read the code.">
  <title>Not a description of the code</title>
  <style>
    .docs-are-not-code-bg   { fill: #f8fafc; }
    .docs-are-not-code-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docs-are-not-code-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docs-are-not-code-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docs-are-not-code-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docs-are-not-code-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docs-are-not-code-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .docs-are-not-code-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .docs-are-not-code-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .docs-are-not-code-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .docs-are-not-code-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .docs-are-not-code-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .docs-are-not-code-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .docs-are-not-code-row { opacity: 1; }
    .docs-are-not-code-r0 { animation-delay: 0.00s; }
    .docs-are-not-code-r1 { animation-delay: 0.45s; }
    .docs-are-not-code-r2 { animation-delay: 0.90s; }
    .docs-are-not-code-r3 { animation-delay: 1.35s; }
    .docs-are-not-code-r4 { animation-delay: 1.80s; }
    .docs-are-not-code-row { animation: docs-are-not-code-reveal 7.3s ease-in-out infinite; }
    @keyframes docs-are-not-code-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="docs-are-not-code-bg" width="980" height="390"/>
  <text class="docs-are-not-code-h1"  x="30" y="40">Not a description of the code</text>
  <text class="docs-are-not-code-sub" x="30" y="64">The reader can read the code.</text>
  <rect class="docs-are-not-code-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="docs-are-not-code-name" x="46" y="122">What it is for</text>
  <text class="docs-are-not-code-desc" x="46" y="142">What code cannot say.</text>
  <text class="docs-are-not-code-desc docs-are-not-code-row docs-are-not-code-r0" x="46" y="182">Why the system is shaped this way</text>
  <text class="docs-are-not-code-desc docs-are-not-code-row docs-are-not-code-r1" x="46" y="216">What you already know is wrong with it</text>
  <text class="docs-are-not-code-desc docs-are-not-code-row docs-are-not-code-r2" x="46" y="250">How to get it running, exactly</text>
  <text class="docs-are-not-code-desc docs-are-not-code-row docs-are-not-code-r3" x="46" y="284">What the output should look like</text>
  <text class="docs-are-not-code-desc docs-are-not-code-row docs-are-not-code-r4" x="46" y="318">Written for a competent stranger</text>
  <rect class="docs-are-not-code-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="docs-are-not-code-name" x="526" y="122">What it is mistaken for</text>
  <text class="docs-are-not-code-desc" x="526" y="142">Three wrong targets.</text>
  <text class="docs-are-not-code-desc docs-are-not-code-row docs-are-not-code-r0" x="526" y="182">A restatement of the code</text>
  <text class="docs-are-not-code-desc docs-are-not-code-row docs-are-not-code-r1" x="526" y="216">An exhaustive reference nobody reads</text>
  <text class="docs-are-not-code-desc docs-are-not-code-row docs-are-not-code-r2" x="526" y="250">A marketing page that oversells</text>
  <text class="docs-are-not-code-desc docs-are-not-code-row docs-are-not-code-r3" x="526" y="284">Written for you, or for an expert</text>
  <text class="docs-are-not-code-desc docs-are-not-code-row docs-are-not-code-r4" x="526" y="318">Found out in front of the audience</text>
  <text class="docs-are-not-code-sub" x="30" y="372">The oversell is the expensive one: a demo that hides its limits spends trust it then has to earn back, and the limit gets discovered at the worst available moment.</text>
</svg>
