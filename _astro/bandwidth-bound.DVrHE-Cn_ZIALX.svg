<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Bandwidth, not arithmetic.">
  <title>Why smaller weights are faster</title>
  <style>
    .bandwidth-bound-bg   { fill: #f8fafc; }
    .bandwidth-bound-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bandwidth-bound-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bandwidth-bound-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bandwidth-bound-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bandwidth-bound-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bandwidth-bound-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bandwidth-bound-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bandwidth-bound-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bandwidth-bound-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bandwidth-bound-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bandwidth-bound-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bandwidth-bound-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bandwidth-bound-row { opacity: 1; }
    .bandwidth-bound-r0 { animation-delay: 0.00s; }
    .bandwidth-bound-r1 { animation-delay: 0.45s; }
    .bandwidth-bound-r2 { animation-delay: 0.90s; }
    .bandwidth-bound-r3 { animation-delay: 1.35s; }
    .bandwidth-bound-r4 { animation-delay: 1.80s; }
    .bandwidth-bound-row { animation: bandwidth-bound-reveal 7.3s ease-in-out infinite; }
    @keyframes bandwidth-bound-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="bandwidth-bound-bg" width="980" height="390"/>
  <text class="bandwidth-bound-h1"  x="30" y="40">Why smaller weights are faster</text>
  <text class="bandwidth-bound-sub" x="30" y="64">Bandwidth, not arithmetic.</text>
  <rect class="bandwidth-bound-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="bandwidth-bound-name" x="46" y="122">Generation</text>
  <text class="bandwidth-bound-desc" x="46" y="142">Waiting on memory.</text>
  <text class="bandwidth-bound-desc bandwidth-bound-row bandwidth-bound-r0" x="46" y="182">Reads every weight per token</text>
  <text class="bandwidth-bound-desc bandwidth-bound-row bandwidth-bound-r1" x="46" y="216">Almost no arithmetic per byte</text>
  <text class="bandwidth-bound-desc bandwidth-bound-row bandwidth-bound-r2" x="46" y="250">Arithmetic units mostly idle</text>
  <text class="bandwidth-bound-desc bandwidth-bound-row bandwidth-bound-r3" x="46" y="284">Smaller weights are directly faster</text>
  <text class="bandwidth-bound-desc bandwidth-bound-row bandwidth-bound-r4" x="46" y="318">This is where quantisation pays</text>
  <rect class="bandwidth-bound-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="bandwidth-bound-name" x="526" y="122">Prompt processing</text>
  <text class="bandwidth-bound-desc" x="526" y="142">Saturating the units.</text>
  <text class="bandwidth-bound-desc bandwidth-bound-row bandwidth-bound-r0" x="526" y="182">All tokens processed at once</text>
  <text class="bandwidth-bound-desc bandwidth-bound-row bandwidth-bound-r1" x="526" y="216">Much arithmetic per byte</text>
  <text class="bandwidth-bound-desc bandwidth-bound-row bandwidth-bound-r2" x="526" y="250">Arithmetic units busy</text>
  <text class="bandwidth-bound-desc bandwidth-bound-row bandwidth-bound-r3" x="526" y="284">Smaller weights help less here</text>
  <text class="bandwidth-bound-desc bandwidth-bound-row bandwidth-bound-r4" x="526" y="318">Compute bound</text>
  <text class="bandwidth-bound-sub" x="30" y="372">Quantisation speeding up generation but not prompt processing follows directly from this, and it is why the two phases are measured separately.</text>
</svg>
