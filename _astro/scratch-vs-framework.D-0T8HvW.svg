<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="When each is right.">
  <title>From scratch against a framework</title>
  <style>
    .scratch-vs-framework-bg   { fill: #f8fafc; }
    .scratch-vs-framework-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-vs-framework-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-vs-framework-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-vs-framework-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-vs-framework-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-vs-framework-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scratch-vs-framework-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scratch-vs-framework-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scratch-vs-framework-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scratch-vs-framework-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scratch-vs-framework-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scratch-vs-framework-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scratch-vs-framework-row { opacity: 1; }
    .scratch-vs-framework-r0 { animation-delay: 0.00s; }
    .scratch-vs-framework-r1 { animation-delay: 0.45s; }
    .scratch-vs-framework-r2 { animation-delay: 0.90s; }
    .scratch-vs-framework-r3 { animation-delay: 1.35s; }
    .scratch-vs-framework-r4 { animation-delay: 1.80s; }
    .scratch-vs-framework-row { animation: scratch-vs-framework-reveal 7.3s ease-in-out infinite; }
    @keyframes scratch-vs-framework-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="scratch-vs-framework-bg" width="980" height="390"/>
  <text class="scratch-vs-framework-h1"  x="30" y="40">From scratch against a framework</text>
  <text class="scratch-vs-framework-sub" x="30" y="64">When each is right.</text>
  <rect class="scratch-vs-framework-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="scratch-vs-framework-name" x="46" y="122">From scratch</text>
  <text class="scratch-vs-framework-desc" x="46" y="142">You understand it.</text>
  <text class="scratch-vs-framework-desc scratch-vs-framework-row scratch-vs-framework-r0" x="46" y="182">Every decision visible and yours</text>
  <text class="scratch-vs-framework-desc scratch-vs-framework-row scratch-vs-framework-r1" x="46" y="216">Debuggable end to end</text>
  <text class="scratch-vs-framework-desc scratch-vs-framework-row scratch-vs-framework-r2" x="46" y="250">No abstraction to fight</text>
  <text class="scratch-vs-framework-desc scratch-vs-framework-row scratch-vs-framework-r3" x="46" y="284">More code to maintain</text>
  <text class="scratch-vs-framework-desc scratch-vs-framework-row scratch-vs-framework-r4" x="46" y="318">Do this once, to learn</text>
  <rect class="scratch-vs-framework-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="scratch-vs-framework-name" x="526" y="122">A framework</text>
  <text class="scratch-vs-framework-desc" x="526" y="142">You ship faster.</text>
  <text class="scratch-vs-framework-desc scratch-vs-framework-row scratch-vs-framework-r0" x="526" y="182">Connectors and integrations included</text>
  <text class="scratch-vs-framework-desc scratch-vs-framework-row scratch-vs-framework-r1" x="526" y="216">Operational features already built</text>
  <text class="scratch-vs-framework-desc scratch-vs-framework-row scratch-vs-framework-r2" x="526" y="250">Community patterns to follow</text>
  <text class="scratch-vs-framework-desc scratch-vs-framework-row scratch-vs-framework-r3" x="526" y="284">Debugging through layers you did not write</text>
  <text class="scratch-vs-framework-desc scratch-vs-framework-row scratch-vs-framework-r4" x="526" y="318">Do this to build</text>
  <text class="scratch-vs-framework-sub" x="30" y="372">The sequence matters more than the choice: building it once makes the framework legible, and adopting one first makes its failures mysterious.</text>
</svg>
