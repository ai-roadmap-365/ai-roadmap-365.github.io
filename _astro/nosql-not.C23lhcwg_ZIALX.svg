<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things non-relational stores are not</title>
  <style>
    .nosql-not-bg   { fill: #f8fafc; }
    .nosql-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nosql-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .nosql-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .nosql-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .nosql-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .nosql-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .nosql-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nosql-not-row { opacity: 1; }
    .nosql-not-r0 { animation-delay: 0.00s; }
    .nosql-not-r1 { animation-delay: 0.45s; }
    .nosql-not-r2 { animation-delay: 0.90s; }
    .nosql-not-r3 { animation-delay: 1.35s; }
    .nosql-not-r4 { animation-delay: 1.80s; }
    .nosql-not-row { animation: nosql-not-reveal 7.3s ease-in-out infinite; }
    @keyframes nosql-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="nosql-not-bg" width="980" height="390"/>
  <text class="nosql-not-h1"  x="30" y="40">Four things non-relational stores are not</text>
  <text class="nosql-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="nosql-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="nosql-not-name" x="46" y="122">The misconception</text>
  <text class="nosql-not-desc" x="46" y="142">Commonly held.</text>
  <text class="nosql-not-desc nosql-not-row nosql-not-r0" x="46" y="182">Schemaless means no schema</text>
  <text class="nosql-not-desc nosql-not-row nosql-not-r1" x="46" y="216">They are always faster</text>
  <text class="nosql-not-desc nosql-not-row nosql-not-r2" x="46" y="250">They replaced relational databases</text>
  <text class="nosql-not-desc nosql-not-row nosql-not-r3" x="46" y="284">Scaling out is automatic</text>
  <text class="nosql-not-desc nosql-not-row nosql-not-r4" x="46" y="318">One store fits every workload</text>
  <rect class="nosql-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="nosql-not-name" x="526" y="122">What is true</text>
  <text class="nosql-not-desc" x="526" y="142">Actually.</text>
  <text class="nosql-not-desc nosql-not-row nosql-not-r0" x="526" y="182">The schema lives in the application</text>
  <text class="nosql-not-desc nosql-not-row nosql-not-r1" x="526" y="216">Faster for their access pattern only</text>
  <text class="nosql-not-desc nosql-not-row nosql-not-r2" x="526" y="250">Both are widely used, for different work</text>
  <text class="nosql-not-desc nosql-not-row nosql-not-r3" x="526" y="284">Sharding is a design decision</text>
  <text class="nosql-not-desc nosql-not-row nosql-not-r4" x="526" y="318">The families differ fundamentally</text>
  <text class="nosql-not-sub" x="30" y="372">The schema moving into the application is the central point: undeclared structure is still structure, and it is now enforced by nobody.</text>
</svg>
