<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>What a coordinate is</title>
  <style>
    .basis-bg   { fill: #f8fafc; }
    .basis-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .basis-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .basis-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .basis-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .basis-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .basis-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .basis-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .basis-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .basis-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .basis-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .basis-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .basis-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .basis-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .basis-stage { opacity: 1; }

    .basis-s0 { animation-delay: 0.00s; }
    .basis-e0 { animation-delay: 0.00s; }
    .basis-s1 { animation-delay: 1.28s; }
    .basis-e1 { animation-delay: 1.28s; }
    .basis-s2 { animation-delay: 2.56s; }
    .basis-e2 { animation-delay: 2.56s; }
    .basis-s3 { animation-delay: 3.84s; }
    .basis-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .basis-conn  { animation: basis-trace 6.4s ease-in-out infinite; }
      .basis-stage { animation: basis-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes basis-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes basis-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .basis-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .basis-stage { animation: basis-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes basis-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="basis-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="basis-bg" width="980" height="322"/>
  <text class="basis-h1"  x="30" y="40">What a coordinate is</text>
  <text class="basis-sub" x="30" y="64">Four steps.</text>
  <g class="basis-stage basis-s0">
    <rect class="basis-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="basis-step" x="44" y="142">01</text>
    <text class="basis-name" x="70" y="142">Choose a set of reference directions</text>
    <text class="basis-desc" x="44" y="166">The basis. Usually the axes.</text>
  </g>
  <line class="basis-line basis-conn basis-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#basis-tip)"/>
  <g class="basis-stage basis-s1">
    <rect class="basis-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="basis-step" x="280" y="142">02</text>
    <text class="basis-name" x="306" y="142">Every vector is a combination of them</text>
    <text class="basis-desc" x="280" y="166">So much along each.</text>
  </g>
  <line class="basis-line basis-conn basis-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#basis-tip)"/>
  <g class="basis-stage basis-s2">
    <rect class="basis-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="basis-step" x="516" y="142">03</text>
    <text class="basis-name" x="542" y="142">The coordinates are those amounts</text>
    <text class="basis-desc" x="516" y="166">Which is all a coordinate ever</text>
    <text class="basis-desc" x="516" y="182">is.</text>
  </g>
  <line class="basis-line basis-conn basis-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#basis-tip)"/>
  <g class="basis-stage basis-s3">
    <rect class="basis-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="basis-step" x="752" y="142">04</text>
    <text class="basis-name" x="778" y="142">Change the basis and the coordinates change</text>
    <text class="basis-desc" x="752" y="166">While the vector itself does</text>
    <text class="basis-desc" x="752" y="182">not.</text>
  </g>
  <text class="basis-sub" x="30" y="304">The vector being unchanged while its coordinates change is the idea behind dimensionality reduction, which is a change of basis and nothing more.</text>
</svg>
