<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Left side kept, right side rewritten.">
  <title>A whiteboard of standing proofs</title>
  <style>
    .whiteboard-bg   { fill: #f8fafc; }
    .whiteboard-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .whiteboard-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .whiteboard-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .whiteboard-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .whiteboard-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .whiteboard-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .whiteboard-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .whiteboard-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .whiteboard-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .whiteboard-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .whiteboard-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .whiteboard-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .whiteboard-row { opacity: 1; }
    .whiteboard-r0 { animation-delay: 0.00s; }
    .whiteboard-r1 { animation-delay: 0.45s; }
    .whiteboard-r2 { animation-delay: 0.90s; }
    .whiteboard-r3 { animation-delay: 1.35s; }
    .whiteboard-r4 { animation-delay: 1.80s; }
    .whiteboard-row { animation: whiteboard-reveal 7.3s ease-in-out infinite; }
    @keyframes whiteboard-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="whiteboard-bg" width="980" height="390"/>
  <text class="whiteboard-h1"  x="30" y="40">A whiteboard of standing proofs</text>
  <text class="whiteboard-sub" x="30" y="64">Left side kept, right side rewritten.</text>
  <rect class="whiteboard-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="whiteboard-name" x="46" y="122">Erasing every time</text>
  <text class="whiteboard-desc" x="46" y="142">Fifty pages, re-derived.</text>
  <text class="whiteboard-desc whiteboard-row whiteboard-r0" x="46" y="182">The board is wiped per question</text>
  <text class="whiteboard-desc whiteboard-row whiteboard-r1" x="46" y="216">Fifty pages of proofs redone</text>
  <text class="whiteboard-desc whiteboard-row whiteboard-r2" x="46" y="250">Then the actual question answered</text>
  <text class="whiteboard-desc whiteboard-row whiteboard-r3" x="46" y="284">Identical work, every time</text>
  <text class="whiteboard-desc whiteboard-row whiteboard-r4" x="46" y="318">And billed every time</text>
  <rect class="whiteboard-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="whiteboard-name" x="526" y="122">Keeping the left side</text>
  <text class="whiteboard-desc" x="526" y="142">Glance, then solve.</text>
  <text class="whiteboard-desc whiteboard-row whiteboard-r0" x="526" y="182">The standing proofs stay drawn</text>
  <text class="whiteboard-desc whiteboard-row whiteboard-r1" x="526" y="216">A glance is enough</text>
  <text class="whiteboard-desc whiteboard-row whiteboard-r2" x="526" y="250">Only the solution is written</text>
  <text class="whiteboard-desc whiteboard-row whiteboard-r3" x="526" y="284">The reuse is the saving</text>
  <text class="whiteboard-desc whiteboard-row whiteboard-r4" x="526" y="318">This is a prefix cache</text>
  <text class="whiteboard-sub" x="30" y="372">The prefix has to be genuinely static for this to work, which is the practical constraint: anything variable at the top of the board means the whole thing gets wiped.</text>
</svg>
