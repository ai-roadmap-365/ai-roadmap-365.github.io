<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four properties.">
  <title>What a decision tree is</title>
  <style>
    .tree-is-bg   { fill: #f8fafc; }
    .tree-is-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-is-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-is-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-is-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-is-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-is-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tree-is-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tree-is-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tree-is-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tree-is-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tree-is-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tree-is-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tree-is-row { opacity: 1; }
    .tree-is-r0 { animation-delay: 0.00s; }
    .tree-is-r1 { animation-delay: 0.45s; }
    .tree-is-r2 { animation-delay: 0.90s; }
    .tree-is-r3 { animation-delay: 1.35s; }
    .tree-is-r4 { animation-delay: 1.80s; }
    .tree-is-row { animation: tree-is-reveal 7.3s ease-in-out infinite; }
    @keyframes tree-is-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tree-is-bg" width="980" height="390"/>
  <text class="tree-is-h1"  x="30" y="40">What a decision tree is</text>
  <text class="tree-is-sub" x="30" y="64">Four properties.</text>
  <rect class="tree-is-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tree-is-name" x="46" y="122">The property</text>
  <text class="tree-is-desc" x="46" y="142">What it is.</text>
  <text class="tree-is-desc tree-is-row tree-is-r0" x="46" y="182">A hierarchy of single-feature tests</text>
  <text class="tree-is-desc tree-is-row tree-is-r1" x="46" y="216">Fitted greedily, top down</text>
  <text class="tree-is-desc tree-is-row tree-is-r2" x="46" y="250">Partitions space into rectangles</text>
  <text class="tree-is-desc tree-is-row tree-is-r3" x="46" y="284">Piecewise-constant predictions</text>
  <text class="tree-is-desc tree-is-row tree-is-r4" x="46" y="318">Non-parametric and scale-invariant</text>
  <rect class="tree-is-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tree-is-name" x="526" y="122">What follows</text>
  <text class="tree-is-desc" x="526" y="142">The consequence.</text>
  <text class="tree-is-desc tree-is-row tree-is-r0" x="526" y="182">Every path is a readable rule</text>
  <text class="tree-is-desc tree-is-row tree-is-r1" x="526" y="216">Locally optimal, never globally</text>
  <text class="tree-is-desc tree-is-row tree-is-r2" x="526" y="250">Cannot represent a diagonal boundary cheaply</text>
  <text class="tree-is-desc tree-is-row tree-is-r3" x="526" y="284">No smooth gradients anywhere</text>
  <text class="tree-is-desc tree-is-row tree-is-r4" x="526" y="318">No preprocessing needed</text>
  <text class="tree-is-sub" x="30" y="372">Not representing a diagonal boundary cheaply is the structural limitation: a tree approximates one with a staircase of many axis-aligned splits.</text>
</svg>
