<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things loops are not</title>
  <style>
    .loops-not-bg   { fill: #f8fafc; }
    .loops-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loops-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loops-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loops-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loops-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loops-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .loops-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .loops-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .loops-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .loops-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .loops-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .loops-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .loops-not-row { opacity: 1; }
    .loops-not-r0 { animation-delay: 0.00s; }
    .loops-not-r1 { animation-delay: 0.45s; }
    .loops-not-r2 { animation-delay: 0.90s; }
    .loops-not-r3 { animation-delay: 1.35s; }
    .loops-not-r4 { animation-delay: 1.80s; }
    .loops-not-row { animation: loops-not-reveal 7.3s ease-in-out infinite; }
    @keyframes loops-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="loops-not-bg" width="980" height="390"/>
  <text class="loops-not-h1"  x="30" y="40">Four things loops are not</text>
  <text class="loops-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="loops-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="loops-not-name" x="46" y="122">The misconception</text>
  <text class="loops-not-desc" x="46" y="142">Commonly held.</text>
  <text class="loops-not-desc loops-not-row loops-not-r0" x="46" y="182">You need an index to iterate</text>
  <text class="loops-not-desc loops-not-row loops-not-r1" x="46" y="216">Modifying a list while looping over it is fine</text>
  <text class="loops-not-desc loops-not-row loops-not-r2" x="46" y="250">The loop variable is scoped to the loop</text>
  <text class="loops-not-desc loops-not-row loops-not-r3" x="46" y="284">A loop is the way to process data</text>
  <text class="loops-not-desc loops-not-row loops-not-r4" x="46" y="318">Range materialises a list</text>
  <rect class="loops-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="loops-not-name" x="526" y="122">What is true</text>
  <text class="loops-not-desc" x="526" y="142">Actually.</text>
  <text class="loops-not-desc loops-not-row loops-not-r0" x="526" y="182">Iterate directly; use enumerate if you need one</text>
  <text class="loops-not-desc loops-not-row loops-not-r1" x="526" y="216">It silently skips elements</text>
  <text class="loops-not-desc loops-not-row loops-not-r2" x="526" y="250">It leaks into the surrounding scope</text>
  <text class="loops-not-desc loops-not-row loops-not-r3" x="526" y="284">Vectorised operations are usually better</text>
  <text class="loops-not-desc loops-not-row loops-not-r4" x="526" y="318">It generates lazily</text>
  <text class="loops-not-sub" x="30" y="372">Modifying a collection while iterating over it is the one that produces wrong answers rather than an error, because the iterator's position shifts underneath it.</text>
</svg>
