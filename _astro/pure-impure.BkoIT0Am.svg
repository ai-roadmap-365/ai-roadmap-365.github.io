<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="What each guarantees.">
  <title>Pure against impure</title>
  <style>
    .pure-impure-bg   { fill: #f8fafc; }
    .pure-impure-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pure-impure-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pure-impure-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pure-impure-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pure-impure-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pure-impure-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pure-impure-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pure-impure-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pure-impure-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pure-impure-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pure-impure-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pure-impure-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pure-impure-row { opacity: 1; }
    .pure-impure-r0 { animation-delay: 0.00s; }
    .pure-impure-r1 { animation-delay: 0.45s; }
    .pure-impure-r2 { animation-delay: 0.90s; }
    .pure-impure-r3 { animation-delay: 1.35s; }
    .pure-impure-r4 { animation-delay: 1.80s; }
    .pure-impure-row { animation: pure-impure-reveal 7.3s ease-in-out infinite; }
    @keyframes pure-impure-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="pure-impure-bg" width="980" height="390"/>
  <text class="pure-impure-h1"  x="30" y="40">Pure against impure</text>
  <text class="pure-impure-sub" x="30" y="64">What each guarantees.</text>
  <rect class="pure-impure-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="pure-impure-name" x="46" y="122">Pure</text>
  <text class="pure-impure-desc" x="46" y="142">Output depends only on input.</text>
  <text class="pure-impure-desc pure-impure-row pure-impure-r0" x="46" y="182">Same input, same output, always</text>
  <text class="pure-impure-desc pure-impure-row pure-impure-r1" x="46" y="216">No state read or written outside</text>
  <text class="pure-impure-desc pure-impure-row pure-impure-r2" x="46" y="250">Trivially testable</text>
  <text class="pure-impure-desc pure-impure-row pure-impure-r3" x="46" y="284">Safe to cache and to parallelise</text>
  <text class="pure-impure-desc pure-impure-row pure-impure-r4" x="46" y="318">Easy to reason about</text>
  <rect class="pure-impure-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="pure-impure-name" x="526" y="122">Impure</text>
  <text class="pure-impure-desc" x="526" y="142">Touches the outside.</text>
  <text class="pure-impure-desc pure-impure-row pure-impure-r0" x="526" y="182">Output can depend on hidden state</text>
  <text class="pure-impure-desc pure-impure-row pure-impure-r1" x="526" y="216">Reads or writes files, time, globals</text>
  <text class="pure-impure-desc pure-impure-row pure-impure-r2" x="526" y="250">Needs setup and teardown to test</text>
  <text class="pure-impure-desc pure-impure-row pure-impure-r3" x="526" y="284">Caching and parallelism are unsafe</text>
  <text class="pure-impure-desc pure-impure-row pure-impure-r4" x="526" y="318">Necessary; keep it at the edges</text>
  <text class="pure-impure-sub" x="30" y="372">Pushing impurity to the edges and keeping the core pure is the design pattern that makes most of a codebase easy to test.</text>
</svg>
