<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One time series per distinct value, forever.">
  <title>The label that explodes your bill</title>
  <style>
    .cardinality-cost-bg   { fill: #f8fafc; }
    .cardinality-cost-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cardinality-cost-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cardinality-cost-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cardinality-cost-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cardinality-cost-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cardinality-cost-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cardinality-cost-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cardinality-cost-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cardinality-cost-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cardinality-cost-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cardinality-cost-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cardinality-cost-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cardinality-cost-row { opacity: 1; }
    .cardinality-cost-r0 { animation-delay: 0.00s; }
    .cardinality-cost-r1 { animation-delay: 0.45s; }
    .cardinality-cost-r2 { animation-delay: 0.90s; }
    .cardinality-cost-r3 { animation-delay: 1.35s; }
    .cardinality-cost-r4 { animation-delay: 1.80s; }
    .cardinality-cost-row { animation: cardinality-cost-reveal 7.3s ease-in-out infinite; }
    @keyframes cardinality-cost-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cardinality-cost-bg" width="980" height="390"/>
  <text class="cardinality-cost-h1"  x="30" y="40">The label that explodes your bill</text>
  <text class="cardinality-cost-sub" x="30" y="64">One time series per distinct value, forever.</text>
  <rect class="cardinality-cost-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cardinality-cost-name" x="46" y="122">Bounded labels</text>
  <text class="cardinality-cost-desc" x="46" y="142">A handful of values.</text>
  <text class="cardinality-cost-desc cardinality-cost-row cardinality-cost-r0" x="46" y="182">status: 200, 404, 500</text>
  <text class="cardinality-cost-desc cardinality-cost-row cardinality-cost-r1" x="46" y="216">region: three or four</text>
  <text class="cardinality-cost-desc cardinality-cost-row cardinality-cost-r2" x="46" y="250">endpoint: a few dozen</text>
  <text class="cardinality-cost-desc cardinality-cost-row cardinality-cost-r3" x="46" y="284">A manageable number of series</text>
  <text class="cardinality-cost-desc cardinality-cost-row cardinality-cost-r4" x="46" y="318">Costs what you expect</text>
  <rect class="cardinality-cost-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cardinality-cost-name" x="526" y="122">Unbounded labels</text>
  <text class="cardinality-cost-desc" x="526" y="142">One series per value.</text>
  <text class="cardinality-cost-desc cardinality-cost-row cardinality-cost-r0" x="526" y="182">user_id: one per user</text>
  <text class="cardinality-cost-desc cardinality-cost-row cardinality-cost-r1" x="526" y="216">request_id: one per request</text>
  <text class="cardinality-cost-desc cardinality-cost-row cardinality-cost-r2" x="526" y="250">Full URL with query string</text>
  <text class="cardinality-cost-desc cardinality-cost-row cardinality-cost-r3" x="526" y="284">Millions of series, kept indefinitely</text>
  <text class="cardinality-cost-desc cardinality-cost-row cardinality-cost-r4" x="526" y="318">A bill exceeding the system it measures</text>
  <text class="cardinality-cost-sub" x="30" y="372">Unbounded values belong in logs and traces, where they are stored once per event, not in metric labels, where each distinct value creates a permanent new series to store and index.</text>
</svg>
