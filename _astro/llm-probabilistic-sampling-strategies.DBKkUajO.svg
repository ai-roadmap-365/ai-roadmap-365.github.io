<svg role="img" aria-label="Visual comparison of LLM sampling strategies comparing Greedy, Temperature, Top-k, and Nucleus Top-p sampling" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>LLM Probabilistic Sampling Strategies</title>
  <defs>
    <linearGradient id="bg243a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card243" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg243a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">LLM DECODING &amp; PROBABILISTIC SAMPLING STRATEGIES</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Controlling Creativity, Determinism, and Coherence via Logit Transformations</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card243)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Strategy 1: Greedy (T=0) -->
    <rect x="20" y="25" width="165" height="255" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="102" y="48" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">1. Greedy (T = 0)</text>
    <text x="30" y="75" fill="#cbd5e1" font-size="8">• Always picks argmax P(w)</text>
    <text x="30" y="95" fill="#cbd5e1" font-size="8">• 100% Deterministic</text>
    <text x="30" y="115" fill="#cbd5e1" font-size="8">• Best for: Math, Code, SQL</text>
    <text x="30" y="135" fill="#fb7185" font-size="8">• Risk: Repetitive loops</text>
    <rect x="30" y="160" width="145" height="100" fill="#1e293b" rx="4"/>
    <rect x="40" y="180" width="125" height="20" fill="#38bdf8" rx="2"/>
    <text x="102" y="194" fill="#0f172a" font-size="8" font-weight="700" text-anchor="middle">Token 1 (P=0.82)</text>

    <!-- Strategy 2: Temperature Scaling -->
    <rect x="205" y="25" width="165" height="255" fill="#0f172a" stroke="#fbbf24" rx="6"/>
    <text x="287" y="48" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">2. Temperature (T)</text>
    <text x="215" y="75" fill="#cbd5e1" font-size="8">• Rescales logits: z_i / T</text>
    <text x="215" y="95" fill="#cbd5e1" font-size="8">• T &lt; 1.0: Sharper peak</text>
    <text x="215" y="115" fill="#cbd5e1" font-size="8">• T &gt; 1.0: Flattened tail</text>
    <text x="215" y="135" fill="#cbd5e1" font-size="8">• Creative writing: 0.7 - 0.9</text>
    <rect x="215" y="160" width="145" height="100" fill="#1e293b" rx="4"/>
    <rect x="225" y="180" width="80" height="20" fill="#fbbf24" rx="2"/>
    <rect x="225" y="205" width="60" height="20" fill="#f59e0b" rx="2"/>
    <rect x="225" y="230" width="40" height="20" fill="#d97706" rx="2"/>

    <!-- Strategy 3: Top-k Truncation -->
    <rect x="390" y="25" width="165" height="255" fill="#0f172a" stroke="#10b981" rx="6"/>
    <text x="472" y="48" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">3. Top-k Filtering</text>
    <text x="400" y="75" fill="#cbd5e1" font-size="8">• Keeps only top K tokens</text>
    <text x="400" y="95" fill="#cbd5e1" font-size="8">• Typical K: 20 to 50</text>
    <text x="400" y="115" fill="#cbd5e1" font-size="8">• Cuts bizarre tail words</text>
    <text x="400" y="135" fill="#fb7185" font-size="8">• Flaw: Fixed K on flat dist</text>
    <rect x="400" y="160" width="145" height="100" fill="#1e293b" rx="4"/>
    <text x="472" y="210" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Truncate rank &gt; K</text>
    <text x="472" y="230" fill="#94a3b8" font-size="8" text-anchor="middle">Set tail logits to -inf</text>

    <!-- Strategy 4: Top-p Nucleus -->
    <rect x="575" y="25" width="165" height="255" fill="#0f172a" stroke="#a855f7" stroke-width="2" rx="6"/>
    <text x="657" y="48" fill="#c084fc" font-size="10" font-weight="700" text-anchor="middle">4. Top-p (Nucleus)</text>
    <text x="585" y="75" fill="#cbd5e1" font-size="8">• Cumulative mass sum &gt;= P</text>
    <text x="585" y="95" fill="#cbd5e1" font-size="8">• Typical P: 0.90 to 0.95</text>
    <text x="585" y="115" fill="#cbd5e1" font-size="8">• Dynamic pool size!</text>
    <text x="585" y="135" fill="#34d399" font-size="8">• Modern industry standard</text>
    <rect x="585" y="160" width="145" height="100" fill="#1e293b" rx="4"/>
    <text x="657" y="200" fill="#c084fc" font-size="8" font-weight="700" text-anchor="middle">Small pool when sure</text>
    <text x="657" y="220" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">Wide pool when unsure</text>
  </g>
</svg>
