<svg role="img" aria-label="Sliding window overlap context preservation diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Sliding Window Overlap Context Preservation</title>
  <defs>
    <linearGradient id="bg263b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card263b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg263b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">SLIDING WINDOW OVERLAP: CONTEXT PRESERVATION</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">How Chunk Overlap Eliminates Boundary Semantic Fragmentation</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card263b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Original Document Stream -->
    <rect x="25" y="25" width="710" height="45" fill="#0f172a" stroke="#475569" rx="4"/>
    <text x="35" y="52" fill="#cbd5e1" font-size="9" font-family="monospace">... The API key expires in 30 days. However, all refreshed tokens retain admin privileges ...</text>

    <!-- Chunk 1 -->
    <rect x="25" y="95" width="380" height="60" fill="#0f172a" stroke="#38bdf8" rx="4"/>
    <text x="35" y="115" fill="#38bdf8" font-size="9" font-weight="700">Chunk 1 [Tokens 0 - 300]</text>
    <text x="35" y="135" fill="#94a3b8" font-size="8" font-family="monospace">... The API key expires in 30 days. However ...</text>

    <!-- Overlap Region -->
    <rect x="330" y="95" width="75" height="135" fill="#fbbf24" fill-opacity="0.2" stroke="#fbbf24" stroke-dasharray="3,3" rx="4"/>
    <text x="367" y="165" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">50-Token Overlap</text>

    <!-- Chunk 2 -->
    <rect x="330" y="170" width="405" height="60" fill="#0f172a" stroke="#34d399" rx="4"/>
    <text x="415" y="190" fill="#34d399" font-size="9" font-weight="700">Chunk 2 [Tokens 250 - 550]</text>
    <text x="415" y="210" fill="#94a3b8" font-size="8" font-family="monospace">... However, all refreshed tokens retain admin privileges ...</text>

    <rect x="25" y="245" width="710" height="35" fill="#1e293b" rx="4"/>
    <text x="380" y="267" fill="#34d399" font-size="8.5" font-weight="700" text-anchor="middle">Boundary Protection: Queries matching "refreshed tokens admin" successfully match Chunk 2 without truncation loss!</text>
  </g>
</svg>
