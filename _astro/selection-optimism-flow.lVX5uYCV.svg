<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" role="img" aria-labelledby="d144f-title d144f-desc" width="1040" height="660">
  <title id="d144f-title">Selection optimism climbing with the number of candidates, while the test score never moves</title>
  <desc id="d144f-desc">A bar chart with one pair of bars per number of candidates considered. The tall bar is the best validation score, which rises steadily from 0.4984 at one candidate to 0.5720 at a thousand. The narrow bar beside it is that same candidate's test score, which stays level at chance throughout. Every candidate is a coin flip with no skill at all.</desc>
  <style>
    .d144f-bg { fill: #f8fafc; }
    .d144f-title { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 25px; font-weight: 700; }
    .d144f-head { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; }
    .d144f-label { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; }
    .d144f-muted { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d144f-tick { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; }
    .d144f-val { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; }
    .d144f-vbar { fill: #93c5fd; stroke: #1d4ed8; stroke-width: 2; }
    .d144f-tbar { fill: #ffffff; stroke: #1a202c; stroke-width: 2; }
    .d144f-axis { stroke: #1a202c; stroke-width: 2; }
    .d144f-chance { stroke: #1d4ed8; stroke-width: 2; stroke-dasharray: 7 5; }
    .d144f-note { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 2; }
    .d144f-b0 { animation: d144f-rise 7s ease-out 0.00s infinite; }
    .d144f-b1 { animation: d144f-rise 7s ease-out 0.55s infinite; }
    .d144f-b2 { animation: d144f-rise 7s ease-out 1.10s infinite; }
    .d144f-b3 { animation: d144f-rise 7s ease-out 1.65s infinite; }
    .d144f-b4 { animation: d144f-rise 7s ease-out 2.20s infinite; }
    .d144f-b5 { animation: d144f-rise 7s ease-out 2.75s infinite; }
    .d144f-b6 { animation: d144f-rise 7s ease-out 3.30s infinite; }
    .d144f-b7 { animation: d144f-rise 7s ease-out 3.85s infinite; }
    .d144f-b8 { animation: d144f-rise 7s ease-out 4.40s infinite; }
    @keyframes d144f-rise {
      0%   { opacity: 0.15; }
      8%   { opacity: 1; }
      100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .d144f-b0 { animation: none; opacity: 1; }
      .d144f-b1 { animation: none; opacity: 1; }
      .d144f-b2 { animation: none; opacity: 1; }
      .d144f-b3 { animation: none; opacity: 1; }
      .d144f-b4 { animation: none; opacity: 1; }
      .d144f-b5 { animation: none; opacity: 1; }
      .d144f-b6 { animation: none; opacity: 1; }
      .d144f-b7 { animation: none; opacity: 1; }
      .d144f-b8 { animation: none; opacity: 1; }
    }
  </style>
  <rect class="d144f-bg" x="0" y="0" width="1040" height="660"/>

  <text class="d144f-title" x="520" y="40" text-anchor="middle">What trying more things does to the score you tried them on</text>
  <text class="d144f-muted" x="520" y="66" text-anchor="middle">Every candidate here is a coin flip with exactly zero skill. 500-row validation set, 500-row test set, 400 replications.</text>

  <line class="d144f-axis" x1="96" y1="470" x2="1000" y2="470"/>
  <line class="d144f-chance" x1="96" y1="436.7" x2="1000" y2="436.7"/>
  <text class="d144f-muted" x="96" y="428.7">chance, 0.5000</text>

  <rect class="d144f-vbar d144f-b0" x="120" y="442.0" width="62" height="28.0" rx="3"/>
  <rect class="d144f-vbar d144f-b1" x="212" y="398.3" width="62" height="71.7" rx="3"/>
  <rect class="d144f-vbar d144f-b2" x="304" y="351.3" width="62" height="118.7" rx="3"/>
  <rect class="d144f-vbar d144f-b3" x="396" y="326.3" width="62" height="143.7" rx="3"/>
  <rect class="d144f-vbar d144f-b4" x="488" y="291.3" width="62" height="178.7" rx="3"/>
  <rect class="d144f-vbar d144f-b5" x="580" y="267.3" width="62" height="202.7" rx="3"/>
  <rect class="d144f-vbar d144f-b6" x="672" y="247.7" width="62" height="222.3" rx="3"/>
  <rect class="d144f-vbar d144f-b7" x="764" y="209.3" width="62" height="260.7" rx="3"/>
  <rect class="d144f-vbar d144f-b8" x="856" y="196.7" width="62" height="273.3" rx="3"/>
  <rect class="d144f-tbar" x="188" y="433.0" width="18" height="37.0" rx="3"/>
  <rect class="d144f-tbar" x="280" y="439.3" width="18" height="30.7" rx="3"/>
  <rect class="d144f-tbar" x="372" y="435.0" width="18" height="35.0" rx="3"/>
  <rect class="d144f-tbar" x="464" y="437.0" width="18" height="33.0" rx="3"/>
  <rect class="d144f-tbar" x="556" y="433.7" width="18" height="36.3" rx="3"/>
  <rect class="d144f-tbar" x="648" y="432.0" width="18" height="38.0" rx="3"/>
  <rect class="d144f-tbar" x="740" y="439.3" width="18" height="30.7" rx="3"/>
  <rect class="d144f-tbar" x="832" y="444.0" width="18" height="26.0" rx="3"/>
  <rect class="d144f-tbar" x="924" y="439.3" width="18" height="30.7" rx="3"/>
  <text class="d144f-val d144f-b0" x="151" y="432.0" text-anchor="middle">0.4984</text>
  <text class="d144f-val d144f-b1" x="243" y="388.3" text-anchor="middle">0.5115</text>
  <text class="d144f-val d144f-b2" x="335" y="341.3" text-anchor="middle">0.5256</text>
  <text class="d144f-val d144f-b3" x="427" y="316.3" text-anchor="middle">0.5331</text>
  <text class="d144f-val d144f-b4" x="519" y="281.3" text-anchor="middle">0.5436</text>
  <text class="d144f-val d144f-b5" x="611" y="257.3" text-anchor="middle">0.5508</text>
  <text class="d144f-val d144f-b6" x="703" y="237.7" text-anchor="middle">0.5567</text>
  <text class="d144f-val d144f-b7" x="795" y="199.3" text-anchor="middle">0.5682</text>
  <text class="d144f-val d144f-b8" x="887" y="186.7" text-anchor="middle">0.5720</text>
  <text class="d144f-tick" x="163" y="494" text-anchor="middle">1</text>
  <text class="d144f-tick" x="255" y="494" text-anchor="middle">2</text>
  <text class="d144f-tick" x="347" y="494" text-anchor="middle">5</text>
  <text class="d144f-tick" x="439" y="494" text-anchor="middle">10</text>
  <text class="d144f-tick" x="531" y="494" text-anchor="middle">25</text>
  <text class="d144f-tick" x="623" y="494" text-anchor="middle">50</text>
  <text class="d144f-tick" x="715" y="494" text-anchor="middle">100</text>
  <text class="d144f-tick" x="807" y="494" text-anchor="middle">500</text>
  <text class="d144f-tick" x="899" y="494" text-anchor="middle">1000</text>
  <text class="d144f-label" x="548" y="520" text-anchor="middle">number of candidates you tried before picking the best one</text>

  <rect class="d144f-vbar" x="120" y="120" width="26" height="18" rx="3"/>
  <text class="d144f-head" x="156" y="135">best validation score -- the one you would report</text>
  <rect class="d144f-tbar" x="120" y="150" width="26" height="18" rx="3"/>
  <text class="d144f-head" x="156" y="165">that same candidate's test score -- the one that is true</text>

  <rect class="d144f-note" x="96" y="536" width="904" height="102" rx="10"/>
  <text class="d144f-label" x="548" y="566" text-anchor="middle">The narrow bars never move. They cannot: the test set was never selected on, so nothing inflated it.</text>
  <text class="d144f-label" x="548" y="590" text-anchor="middle">The wide bars climb to 0.5720 on candidates that are coin flips -- because the maximum of many noisy draws</text>
  <text class="d144f-label" x="548" y="614" text-anchor="middle">is systematically larger than any one of them. That gap is why the third set exists, and it is a computable quantity.</text>
  <text class="d144f-muted" x="548" y="634" text-anchor="middle">With motion switched off, every bar and every number is already in its final position.</text>
</svg>
