<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two ways to answer "where is the second disk?"">
  <title>Why Unix has no drive letters</title>
  <style>
    .one-tree-mounting-bg   { fill: #f8fafc; }
    .one-tree-mounting-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-tree-mounting-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-tree-mounting-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-tree-mounting-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-tree-mounting-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-tree-mounting-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .one-tree-mounting-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .one-tree-mounting-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .one-tree-mounting-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .one-tree-mounting-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .one-tree-mounting-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .one-tree-mounting-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .one-tree-mounting-row { opacity: 1; }
    .one-tree-mounting-r0 { animation-delay: 0.00s; }
    .one-tree-mounting-r1 { animation-delay: 0.45s; }
    .one-tree-mounting-r2 { animation-delay: 0.90s; }
    .one-tree-mounting-r3 { animation-delay: 1.35s; }
    .one-tree-mounting-r4 { animation-delay: 1.80s; }
    .one-tree-mounting-row { animation: one-tree-mounting-reveal 7.3s ease-in-out infinite; }
    @keyframes one-tree-mounting-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="one-tree-mounting-bg" width="980" height="390"/>
  <text class="one-tree-mounting-h1"  x="30" y="40">Why Unix has no drive letters</text>
  <text class="one-tree-mounting-sub" x="30" y="64">Two ways to answer "where is the second disk?"</text>
  <rect class="one-tree-mounting-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="one-tree-mounting-name" x="46" y="122">A namespace per disk</text>
  <text class="one-tree-mounting-desc" x="46" y="142">Each device gets its own root.</text>
  <text class="one-tree-mounting-desc one-tree-mounting-row one-tree-mounting-r0" x="46" y="182">C:, D:, E: — one root each</text>
  <text class="one-tree-mounting-desc one-tree-mounting-row one-tree-mounting-r1" x="46" y="216">A path names the device it lives on</text>
  <text class="one-tree-mounting-desc one-tree-mounting-row one-tree-mounting-r2" x="46" y="250">Move the data, rewrite every path</text>
  <text class="one-tree-mounting-desc one-tree-mounting-row one-tree-mounting-r3" x="46" y="284">Network shares get their own letters</text>
  <text class="one-tree-mounting-desc one-tree-mounting-row one-tree-mounting-r4" x="46" y="318">Running out of letters is a real limit</text>
  <rect class="one-tree-mounting-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="one-tree-mounting-name" x="526" y="122">One tree, with mounts</text>
  <text class="one-tree-mounting-desc" x="526" y="142">Every filesystem appears as a directory.</text>
  <text class="one-tree-mounting-desc one-tree-mounting-row one-tree-mounting-r0" x="526" y="182">A single root: /</text>
  <text class="one-tree-mounting-desc one-tree-mounting-row one-tree-mounting-r1" x="526" y="216">A path names a location, not a device</text>
  <text class="one-tree-mounting-desc one-tree-mounting-row one-tree-mounting-r2" x="526" y="250">Move the data, mount it at the same path</text>
  <text class="one-tree-mounting-desc one-tree-mounting-row one-tree-mounting-r3" x="526" y="284">Network shares mount like anything else</text>
  <text class="one-tree-mounting-desc one-tree-mounting-row one-tree-mounting-r4" x="526" y="318">No syntax to learn for new storage</text>
  <text class="one-tree-mounting-sub" x="30" y="372">This is why a container can mount a host directory at the path your code already expects: the tree does not care what is underneath.</text>
</svg>
