<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" font-family="system-ui, sans-serif">
  <title>The six domains of your computing foundations arranged as one connected system: the machine at the center, the command line, the internet, and APIs as expanding layers, with git and systems foundations wrapping the whole stack</title>
  <rect x="0" y="0" width="760" height="560" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Your computing foundations: six connected domains</text>

  <!-- Outer wrapper: git + systems foundations wrap everything -->
  <rect x="40" y="60" width="680" height="430" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 5" rx="14"/>
  <text x="380" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">Git &amp; GitHub (29-35) and Systems foundations (36-41) wrap every layer</text>

  <!-- Layer 4: APIs -->
  <rect x="80" y="100" width="600" height="330" fill="#eef2ff" stroke="#1d4ed8" stroke-width="2" rx="12"/>
  <text x="380" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">APIs — programs talk to programs (22-28)</text>

  <!-- Layer 3: internet -->
  <rect x="120" y="140" width="520" height="250" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="380" y="162" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">The internet — machines talk to machines (15-21)</text>

  <!-- Layer 2: command line -->
  <rect x="165" y="182" width="430" height="168" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="380" y="204" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">The command line — you drive the machine (8-14)</text>

  <!-- Layer 1: the machine (center) -->
  <rect x="220" y="224" width="320" height="100" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="380" y="262" text-anchor="middle" font-size="17" font-weight="bold" fill="#f8fafc">The machine (1-7)</text>
  <text x="380" y="288" text-anchor="middle" font-size="14" fill="#f8fafc">CPU cycle · memory hierarchy</text>
  <text x="380" y="308" text-anchor="middle" font-size="14" fill="#f8fafc">binary data · operating system</text>

  <!-- Wrapping-domain callouts -->
  <rect x="60" y="440" width="300" height="40" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="1.5" rx="8"/>
  <text x="210" y="465" text-anchor="middle" font-size="14" fill="#1a202c">Git &amp; GitHub: version and share every change</text>

  <rect x="400" y="440" width="300" height="40" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="1.5" rx="8"/>
  <text x="550" y="465" text-anchor="middle" font-size="14" fill="#1a202c">Systems: storage · observability · automation</text>

  <text x="380" y="524" text-anchor="middle" font-size="15" fill="#1a202c">Each layer runs on the one inside it; the dashed wrapper applies at every layer.</text>
  <text x="380" y="546" text-anchor="middle" font-size="14" fill="#1a202c">A request travels from the outside in and back — a stack you now understand end to end.</text>
</svg>
