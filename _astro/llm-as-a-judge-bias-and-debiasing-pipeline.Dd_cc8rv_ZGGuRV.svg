<svg role="img" aria-label="LLM as a Judge debiasing pipeline diagram showing dual-pass position swapping and rubric scoring" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>LLM-as-a-Judge Debiasing Pipeline</title>
  <defs>
    <linearGradient id="bg245b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card245b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg245b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">LLM-AS-A-JUDGE DEBIASING ARCHITECTURE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Dual-Pass Position Swapping to Eliminate Positional, Length, and Self-Enhancement Biases</text>
  <g transform="translate(65, 85)">
    <rect width="720" height="295" fill="url(#card245b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Pass 1: Forward Position -->
    <rect x="25" y="25" width="325" height="120" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="187" y="48" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">Pass 1: Forward Order (Prompt: [Candidate A, Candidate B])</text>
    <text x="40" y="75" fill="#cbd5e1" font-size="8">• Judge Evaluates on Rubric: Correctness, Conciseness, Factuality</text>
    <text x="40" y="95" fill="#cbd5e1" font-size="8">• Raw Output: Score_A1 vs Score_B1</text>
    <text x="40" y="115" fill="#fb7185" font-size="8">• Subject to Positional Bias (Candidate 1 favored 60%+ of time)</text>

    <!-- Pass 2: Swapped Position -->
    <rect x="370" y="25" width="325" height="120" fill="#0f172a" stroke="#fbbf24" rx="6"/>
    <text x="532" y="48" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">Pass 2: Swapped Order (Prompt: [Candidate B, Candidate A])</text>
    <text x="385" y="75" fill="#cbd5e1" font-size="8">• Same Judge, Identical Rubric, Inverted Prompt Order</text>
    <text x="385" y="95" fill="#cbd5e1" font-size="8">• Raw Output: Score_B2 vs Score_A2</text>
    <text x="385" y="115" fill="#34d399" font-size="8">• Counters Positional and Verbosity Biases</text>

    <!-- Aggregator & Statistical Bootstrap -->
    <rect x="25" y="165" width="670" height="105" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="360" y="190" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">Aggregator &amp; Statistical Bootstrap Validation</text>
    <text x="40" y="215" fill="#cbd5e1" font-size="8">• Final Score: Score_A = (Score_A1 + Score_A2) / 2 | Score_B = (Score_B1 + Score_B2) / 2</text>
    <text x="40" y="235" fill="#cbd5e1" font-size="8">• If (Winner_Pass1 != Winner_Pass2) -&gt; Flag as Inconclusive Tie / High Ambiguity</text>
    <text x="40" y="255" fill="#38bdf8" font-size="8" font-weight="700">• Bootstrap Resampling (B = 1,000): Computes 95% Confidence Interval for ELO Difference</text>
  </g>
</svg>
