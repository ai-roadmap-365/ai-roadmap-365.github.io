<svg role="img" aria-label="End-to-end disciplined deep learning training framework architecture connecting configuration, seeding, data loaders, training engine, checkpointer, and early stopping" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Disciplined Deep Learning Training Engine Architecture</title>
  <defs>
    <linearGradient id="bg210a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card210" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg210a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">DISCIPLINED TRAINING ENGINE ARCHITECTURE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Modular, Deterministic, and Reproducible Production PyTorch Pipeline</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card210)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Stage 1: Config & Seeding -->
    <rect x="25" y="25" width="220" height="75" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="135" y="48" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">1. Config &amp; Determinism</text>
    <text x="135" y="68" fill="#cbd5e1" font-size="9" text-anchor="middle">dataclass TrainingConfig</text>
    <text x="135" y="85" fill="#94a3b8" font-size="8" text-anchor="middle">seed_everything(seed=42)</text>

    <!-- Stage 2: Data Pipeline -->
    <rect x="270" y="25" width="220" height="75" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="380" y="48" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">2. Data Ingestion &amp; Split</text>
    <text x="380" y="68" fill="#cbd5e1" font-size="9" text-anchor="middle">Train/Val DataLoader</text>
    <text x="380" y="85" fill="#94a3b8" font-size="8" text-anchor="middle">num_workers, pin_memory</text>

    <!-- Stage 3: Model & Optimizer -->
    <rect x="515" y="25" width="220" height="75" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="625" y="48" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">3. Model &amp; Optimizers</text>
    <text x="625" y="68" fill="#cbd5e1" font-size="9" text-anchor="middle">nn.Module + AdamW</text>
    <text x="625" y="85" fill="#94a3b8" font-size="8" text-anchor="middle">CosineAnnealingLR + GradClip</text>

    <!-- Middle Flow Arrow -->
    <path d="M 135 100 L 135 130 L 380 130 L 380 145" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <path d="M 625 100 L 625 130 L 380 130 L 380 145" stroke="#fbbf24" stroke-width="2" fill="none"/>

    <!-- Stage 4: Training & Validation Loop -->
    <rect x="25" y="150" width="710" height="120" fill="#0f172a" stroke="#a855f7" stroke-width="2" rx="6"/>
    <text x="380" y="175" fill="#c084fc" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">4. Industrial Training &amp; Validation Engine (Trainer Class)</text>
    
    <!-- Sub-boxes inside Engine -->
    <rect x="45" y="190" width="200" height="65" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="145" y="210" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">Train Step (model.train())</text>
    <text x="145" y="228" fill="#cbd5e1" font-size="8" text-anchor="middle">zero_grad -&gt; forward -&gt; backward</text>
    <text x="145" y="244" fill="#94a3b8" font-size="8" text-anchor="middle">clip_grad_norm_ -&gt; step</text>

    <rect x="280" y="190" width="200" height="65" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="380" y="210" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">Val Step (model.eval())</text>
    <text x="380" y="228" fill="#cbd5e1" font-size="8" text-anchor="middle">with torch.no_grad():</text>
    <text x="380" y="244" fill="#94a3b8" font-size="8" text-anchor="middle">Compute exact Val Loss &amp; Acc</text>

    <rect x="515" y="190" width="200" height="65" fill="#1e293b" stroke="#f43f5e" rx="4"/>
    <text x="615" y="210" fill="#fb7185" font-size="10" font-weight="700" text-anchor="middle">Checkpointer &amp; Early Stop</text>
    <text x="615" y="228" fill="#cbd5e1" font-size="8" text-anchor="middle">Save best_model.pt state_dict</text>
    <text x="615" y="244" fill="#94a3b8" font-size="8" text-anchor="middle">Patience counter &amp; stop trigger</text>
  </g>
</svg>
