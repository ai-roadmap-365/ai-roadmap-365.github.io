<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 850" width="1260" height="850" role="img" aria-labelledby="d099a-title d099a-desc">
  <title id="d099a-title">One vector shown three ways at once: a list of numbers, an arrow with direction and magnitude, and a row in a table of many items</title>
  <desc id="d099a-desc">The vector v equals 3, 4 drawn three times. On the left it is a list of two numbers with each component labelled east and north, the dimension given as 2, and a note that the order is fixed. In the middle it is an arrow on labelled axes running from the origin to the point 3 east and 4 north, with dashed lines dropping its components to each axis, the magnitude 5 marked along the arrow and the direction marked as an angle of about 53.1 degrees from the east axis. On the right it is one highlighted row in a table of five places, each with an east and a north column, where Brookend is twice Ashfield and Dunmore is the zero vector. A panel across the foot derives the magnitude from Pythagoras as the square root of 3 squared plus 4 squared, which is the square root of 25, which is 5, and shows the unit vector 0.6, 0.8 obtained by scaling by one fifth.</desc>

  <style>
    .d099a-bg     { fill: #f8fafc; }
    .d099a-h1     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 21px; font-weight: 600; fill: #1a202c; }
    .d099a-sub    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #334155; }
    .d099a-ph     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 600; fill: #1d4ed8; }
    .d099a-txt    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #1a202c; }
    .d099a-note   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d099a-strong { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; fill: #1a202c; }
    .d099a-big    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 26px; font-weight: 600; fill: #1d4ed8; }
    .d099a-acc    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 600; fill: #1d4ed8; }
    .d099a-mono   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; fill: #1a202c; }
    .d099a-monob  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 16px; font-weight: 600; fill: #1a202c; }
    .d099a-panel  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d099a-foot   { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d099a-hl     { fill: #e0e7ff; }
    .d099a-axis   { fill: none; stroke: #64748b; stroke-width: 2; }
    .d099a-tick   { fill: none; stroke: #94a3b8; stroke-width: 1.5; }
    .d099a-grid   { fill: none; stroke: #cbd5e1; stroke-width: 1; }
    .d099a-arrow  { fill: none; stroke: #1d4ed8; stroke-width: 4; }
    .d099a-drop   { fill: none; stroke: #b45309; stroke-width: 2; stroke-dasharray: 6 5; }
    .d099a-arc    { fill: none; stroke: #047857; stroke-width: 2; }
    .d099a-dot    { fill: #b45309; }
    .d099a-rule   { fill: none; stroke: #94a3b8; stroke-width: 1.5; }
    .d099a-east   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; fill: #b45309; }
    .d099a-dir    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; fill: #047857; }
  </style>

  <defs>
    <marker id="d099a-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
    <marker id="d099a-head-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857" />
    </marker>
  </defs>

  <rect class="d099a-bg" x="0" y="0" width="1260" height="850" />

  <text class="d099a-h1" x="40" y="46">One vector, three pictures: v = [3, 4]</text>
  <text class="d099a-sub" x="40" y="74">All three panels describe the same object. Holding them together at once is the whole skill.</text>

  <!-- ================= Panel 1: the list ================= -->
  <rect class="d099a-panel" x="40" y="100" width="330" height="560" rx="6" />
  <text class="d099a-ph" x="64" y="136">1 . as a list of numbers</text>

  <text class="d099a-big" x="64" y="196">v = [ 3, 4 ]</text>

  <text class="d099a-txt" x="64" y="240">component 1 = 3</text>
  <text class="d099a-note" x="64" y="262">how far east, in kilometres</text>
  <text class="d099a-txt" x="64" y="294">component 2 = 4</text>
  <text class="d099a-note" x="64" y="316">how far north, in kilometres</text>

  <text class="d099a-strong" x="64" y="358">dimension = 2</text>
  <text class="d099a-note" x="64" y="380">The number of components. That is</text>
  <text class="d099a-note" x="64" y="400">all the word means here. A hundred</text>
  <text class="d099a-note" x="64" y="420">numbers is a 100-dimensional vector.</text>

  <text class="d099a-strong" x="64" y="460">The order is fixed.</text>
  <text class="d099a-note" x="64" y="482">[4, 3] is a different place. Position</text>
  <text class="d099a-note" x="64" y="502">carries the meaning: slot 1 is always</text>
  <text class="d099a-note" x="64" y="522">east, slot 2 is always north.</text>

  <text class="d099a-strong" x="64" y="562">This is what you type.</text>
  <text class="d099a-note" x="64" y="584">A Python list. A CSV line. A row in</text>
  <text class="d099a-note" x="64" y="604">a spreadsheet.</text>

  <!-- ================= Panel 2: the arrow ================= -->
  <rect class="d099a-panel" x="395" y="100" width="430" height="560" rx="6" />
  <text class="d099a-ph" x="419" y="136">2 . as an arrow: direction and magnitude</text>

  <!-- grid -->
  <path class="d099a-grid" d="M 525 540 L 525 265 M 580 540 L 580 265 M 635 540 L 635 265 M 690 540 L 690 265 M 745 540 L 745 265" />
  <path class="d099a-grid" d="M 470 485 L 800 485 M 470 430 L 800 430 M 470 375 L 800 375 M 470 320 L 800 320 M 470 265 L 800 265" />

  <!-- axes -->
  <path class="d099a-axis" d="M 470 540 L 805 540" marker-end="url(#d099a-head)" />
  <path class="d099a-axis" d="M 470 540 L 470 245" marker-end="url(#d099a-head)" />
  <text class="d099a-note" x="470" y="232" text-anchor="middle">north (km)</text>
  <text class="d099a-note" x="790" y="578" text-anchor="end">east (km)</text>

  <!-- ticks -->
  <path class="d099a-tick" d="M 525 540 L 525 547 M 580 540 L 580 547 M 635 540 L 635 547 M 690 540 L 690 547 M 745 540 L 745 547" />
  <path class="d099a-tick" d="M 470 485 L 463 485 M 470 430 L 463 430 M 470 375 L 463 375 M 470 320 L 463 320 M 470 265 L 463 265" />
  <text class="d099a-note" x="525" y="562" text-anchor="middle">1</text>
  <text class="d099a-note" x="580" y="562" text-anchor="middle">2</text>
  <text class="d099a-note" x="635" y="562" text-anchor="middle">3</text>
  <text class="d099a-note" x="690" y="562" text-anchor="middle">4</text>
  <text class="d099a-note" x="745" y="562" text-anchor="middle">5</text>
  <text class="d099a-note" x="456" y="490" text-anchor="end">1</text>
  <text class="d099a-note" x="456" y="435" text-anchor="end">2</text>
  <text class="d099a-note" x="456" y="380" text-anchor="end">3</text>
  <text class="d099a-note" x="456" y="325" text-anchor="end">4</text>
  <text class="d099a-note" x="456" y="270" text-anchor="end">5</text>
  <text class="d099a-note" x="456" y="556" text-anchor="end">0</text>

  <!-- components dropped to each axis -->
  <path class="d099a-drop" d="M 635 320 L 635 540" />
  <path class="d099a-drop" d="M 635 320 L 470 320" />
  <circle class="d099a-dot" cx="635" cy="540" r="5" />
  <circle class="d099a-dot" cx="470" cy="320" r="5" />
  <text class="d099a-east" x="552" y="590" text-anchor="middle">3 east</text>
  <text class="d099a-east" x="480" y="356">4 north</text>

  <!-- the vector itself -->
  <path class="d099a-arrow" d="M 470 540 L 630 327" marker-end="url(#d099a-head)" />
  <circle cx="470" cy="540" r="5" fill="#1d4ed8" />

  <!-- magnitude, called out to the free space on the right of the arrow -->
  <path class="d099a-rule" d="M 660 398 L 601 379" />
  <text class="d099a-acc" x="668" y="394">|v| = 5 km</text>
  <text class="d099a-note" x="668" y="414">the magnitude</text>

  <!-- direction -->
  <path class="d099a-arc" d="M 530 540 A 60 60 0 0 1 506 492" marker-end="url(#d099a-head-green)" />
  <path class="d099a-rule" d="M 660 470 L 545 505" />
  <text class="d099a-dir" x="668" y="466">53.1 degrees</text>
  <text class="d099a-note" x="668" y="486">the direction</text>

  <text class="d099a-note" x="419" y="606">Magnitude is how long. Direction is</text>
  <text class="d099a-note" x="419" y="626">which way. A vector is exactly both.</text>

  <!-- ================= Panel 3: the table ================= -->
  <rect class="d099a-panel" x="850" y="100" width="370" height="560" rx="6" />
  <text class="d099a-ph" x="874" y="136">3 . as one row in a table</text>

  <text class="d099a-strong" x="874" y="186">place</text>
  <text class="d099a-strong" x="1092" y="186" text-anchor="end">east</text>
  <text class="d099a-strong" x="1182" y="186" text-anchor="end">north</text>
  <path class="d099a-rule" d="M 866 198 L 1204 198" />

  <rect class="d099a-hl" x="866" y="208" width="338" height="34" rx="4" />
  <text class="d099a-monob" x="874" y="231">Ashfield</text>
  <text class="d099a-monob" x="1092" y="231" text-anchor="end">3</text>
  <text class="d099a-monob" x="1182" y="231" text-anchor="end">4</text>

  <text class="d099a-mono" x="874" y="271">Brookend</text>
  <text class="d099a-mono" x="1092" y="271" text-anchor="end">6</text>
  <text class="d099a-mono" x="1182" y="271" text-anchor="end">8</text>

  <text class="d099a-mono" x="874" y="307">Calder</text>
  <text class="d099a-mono" x="1092" y="307" text-anchor="end">-2</text>
  <text class="d099a-mono" x="1182" y="307" text-anchor="end">5</text>

  <text class="d099a-mono" x="874" y="343">Dunmore</text>
  <text class="d099a-mono" x="1092" y="343" text-anchor="end">0</text>
  <text class="d099a-mono" x="1182" y="343" text-anchor="end">0</text>

  <text class="d099a-mono" x="874" y="379">Elton</text>
  <text class="d099a-mono" x="1092" y="379" text-anchor="end">12</text>
  <text class="d099a-mono" x="1182" y="379" text-anchor="end">5</text>

  <path class="d099a-rule" d="M 866 396 L 1204 396" />

  <text class="d099a-note" x="874" y="426">The shaded row is the same v as the</text>
  <text class="d099a-note" x="874" y="446">list on the left and the arrow in the</text>
  <text class="d099a-note" x="874" y="466">middle. Nothing has changed but the</text>
  <text class="d099a-note" x="874" y="486">notation.</text>

  <text class="d099a-strong" x="874" y="522">Every row here is a vector.</text>
  <text class="d099a-note" x="874" y="544">Brookend is 2 times Ashfield: same</text>
  <text class="d099a-note" x="874" y="564">direction, twice as far, magnitude 10.</text>
  <text class="d099a-note" x="874" y="584">Dunmore is the zero vector: magnitude</text>
  <text class="d099a-note" x="874" y="604">0, and no direction at all.</text>

  <!-- ================= Foot: the arithmetic ================= -->
  <rect class="d099a-foot" x="40" y="690" width="1180" height="145" rx="6" />
  <text class="d099a-ph" x="64" y="724">The magnitude is Pythagoras, and you can check it with a pen</text>
  <text class="d099a-monob" x="64" y="756">|v| = sqrt(3^2 + 4^2) = sqrt(9 + 16) = sqrt(25) = 5</text>
  <text class="d099a-note" x="660" y="756">the straight-line distance from Dunmore to Ashfield, 5 km, not the 7 km you would walk</text>
  <text class="d099a-monob" x="64" y="786">v_unit = (1 / 5) * [3, 4] = [0.6, 0.8]</text>
  <text class="d099a-note" x="660" y="786">normalising: same direction, magnitude 1 - the length is thrown away, the way is kept</text>
  <text class="d099a-strong" x="64" y="818">The list is what you type. The arrow is what you picture. The row is where it lives. One object, three notations - and in 300 dimensions only the arrow goes away.</text>
</svg>
