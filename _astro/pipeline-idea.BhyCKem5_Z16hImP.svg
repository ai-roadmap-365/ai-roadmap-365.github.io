<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two halves, six stages.">
  <title>The whole pipeline</title>
  <style>
    .pipeline-idea-bg   { fill: #f8fafc; }
    .pipeline-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pipeline-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pipeline-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pipeline-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pipeline-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pipeline-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pipeline-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pipeline-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pipeline-idea-stage { opacity: 1; }

    .pipeline-idea-s0 { animation-delay: 0.00s; }
    .pipeline-idea-e0 { animation-delay: 0.00s; }
    .pipeline-idea-s1 { animation-delay: 1.37s; }
    .pipeline-idea-e1 { animation-delay: 1.37s; }
    .pipeline-idea-s2 { animation-delay: 2.74s; }
    .pipeline-idea-e2 { animation-delay: 2.74s; }
    .pipeline-idea-s3 { animation-delay: 4.11s; }
    .pipeline-idea-e3 { animation-delay: 4.11s; }
    .pipeline-idea-s4 { animation-delay: 5.49s; }
    .pipeline-idea-e4 { animation-delay: 5.49s; }
    .pipeline-idea-s5 { animation-delay: 6.86s; }
    .pipeline-idea-e5 { animation-delay: 6.86s; }
    @media (prefers-reduced-motion: no-preference) {
      .pipeline-idea-conn  { animation: pipeline-idea-trace 9.600000000000001s ease-in-out infinite; }
      .pipeline-idea-stage { animation: pipeline-idea-arrive 9.600000000000001s ease-in-out infinite; }
    }
    @keyframes pipeline-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pipeline-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pipeline-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pipeline-idea-stage { animation: pipeline-idea-settle 9.600000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pipeline-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pipeline-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pipeline-idea-bg" width="980" height="322"/>
  <text class="pipeline-idea-h1"  x="30" y="40">The whole pipeline</text>
  <text class="pipeline-idea-sub" x="30" y="64">Two halves, six stages.</text>
  <g class="pipeline-idea-stage pipeline-idea-s0">
    <rect class="pipeline-idea-box" x="30" y="118" width="131" height="104" rx="10"/>
    <text class="pipeline-idea-step" x="44" y="142">01</text>
    <text class="pipeline-idea-name" x="70" y="142">Parse the documents</text>
    <text class="pipeline-idea-desc" x="44" y="166">Offline. Text,</text>
    <text class="pipeline-idea-desc" x="44" y="182">structure and</text>
    <text class="pipeline-idea-desc" x="44" y="198">metadata out.</text>
  </g>
  <line class="pipeline-idea-line pipeline-idea-conn pipeline-idea-e0" x1="163" y1="170" x2="185" y2="170" marker-end="url(#pipeline-idea-tip)"/>
  <g class="pipeline-idea-stage pipeline-idea-s1">
    <rect class="pipeline-idea-box" x="187" y="118" width="131" height="104" rx="10"/>
    <text class="pipeline-idea-step" x="201" y="142">02</text>
    <text class="pipeline-idea-name" x="227" y="142">Chunk them</text>
    <text class="pipeline-idea-desc" x="201" y="166">Offline.</text>
    <text class="pipeline-idea-desc" x="201" y="182">Structure-aware,</text>
    <text class="pipeline-idea-desc" x="201" y="198">with parents</text>
  </g>
  <line class="pipeline-idea-line pipeline-idea-conn pipeline-idea-e1" x1="320" y1="170" x2="342" y2="170" marker-end="url(#pipeline-idea-tip)"/>
  <g class="pipeline-idea-stage pipeline-idea-s2">
    <rect class="pipeline-idea-good" x="344" y="118" width="131" height="104" rx="10"/>
    <text class="pipeline-idea-step" x="358" y="142">03</text>
    <text class="pipeline-idea-name" x="384" y="142">Embed and index</text>
    <text class="pipeline-idea-desc" x="358" y="166">Offline. Dense and</text>
    <text class="pipeline-idea-desc" x="358" y="182">lexical, both.</text>
  </g>
  <line class="pipeline-idea-line pipeline-idea-conn pipeline-idea-e2" x1="477" y1="170" x2="499" y2="170" marker-end="url(#pipeline-idea-tip)"/>
  <g class="pipeline-idea-stage pipeline-idea-s3">
    <rect class="pipeline-idea-box" x="501" y="118" width="131" height="104" rx="10"/>
    <text class="pipeline-idea-step" x="515" y="142">04</text>
    <text class="pipeline-idea-name" x="541" y="142">Retrieve on a query</text>
    <text class="pipeline-idea-desc" x="515" y="166">At request time.</text>
    <text class="pipeline-idea-desc" x="515" y="182">Both indexes, fused.</text>
  </g>
  <line class="pipeline-idea-line pipeline-idea-conn pipeline-idea-e3" x1="634" y1="170" x2="656" y2="170" marker-end="url(#pipeline-idea-tip)"/>
  <g class="pipeline-idea-stage pipeline-idea-s4">
    <rect class="pipeline-idea-box" x="658" y="118" width="131" height="104" rx="10"/>
    <text class="pipeline-idea-step" x="672" y="142">05</text>
    <text class="pipeline-idea-name" x="698" y="142">Rerank the candidates</text>
    <text class="pipeline-idea-desc" x="672" y="166">At request time.</text>
    <text class="pipeline-idea-desc" x="672" y="182">Down to a handful.</text>
  </g>
  <line class="pipeline-idea-line pipeline-idea-conn pipeline-idea-e4" x1="791" y1="170" x2="813" y2="170" marker-end="url(#pipeline-idea-tip)"/>
  <g class="pipeline-idea-stage pipeline-idea-s5">
    <rect class="pipeline-idea-box" x="815" y="118" width="131" height="104" rx="10"/>
    <text class="pipeline-idea-step" x="829" y="142">06</text>
    <text class="pipeline-idea-name" x="855" y="142">And generate with citations</text>
    <text class="pipeline-idea-desc" x="829" y="166">At request time.</text>
    <text class="pipeline-idea-desc" x="829" y="182">Grounded in what was</text>
    <text class="pipeline-idea-desc" x="829" y="198">retrieved.</text>
    <text class="pipeline-idea-edge" x="829" y="242">the answer</text>
  </g>
  <text class="pipeline-idea-sub" x="30" y="304">The split between offline and request-time work is the architecture: everything expensive happens once during ingestion, and the request path only searches.</text>
</svg>
