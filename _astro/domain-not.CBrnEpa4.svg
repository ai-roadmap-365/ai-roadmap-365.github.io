<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things domain modelling is not</title>
  <style>
    .domain-not-bg   { fill: #f8fafc; }
    .domain-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .domain-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .domain-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .domain-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .domain-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .domain-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .domain-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .domain-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .domain-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .domain-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .domain-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .domain-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .domain-not-row { opacity: 1; }
    .domain-not-r0 { animation-delay: 0.00s; }
    .domain-not-r1 { animation-delay: 0.45s; }
    .domain-not-r2 { animation-delay: 0.90s; }
    .domain-not-r3 { animation-delay: 1.35s; }
    .domain-not-r4 { animation-delay: 1.80s; }
    .domain-not-row { animation: domain-not-reveal 7.3s ease-in-out infinite; }
    @keyframes domain-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="domain-not-bg" width="980" height="390"/>
  <text class="domain-not-h1"  x="30" y="40">Four things domain modelling is not</text>
  <text class="domain-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="domain-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="domain-not-name" x="46" y="122">The misconception</text>
  <text class="domain-not-desc" x="46" y="142">Commonly held.</text>
  <text class="domain-not-desc domain-not-row domain-not-r0" x="46" y="182">The model should mirror the database tables</text>
  <text class="domain-not-desc domain-not-row domain-not-r1" x="46" y="216">Every noun deserves a class</text>
  <text class="domain-not-desc domain-not-row domain-not-r2" x="46" y="250">More layers means better design</text>
  <text class="domain-not-desc domain-not-row domain-not-r3" x="46" y="284">Getters and setters are encapsulation</text>
  <text class="domain-not-desc domain-not-row domain-not-r4" x="46" y="318">The model is designed once</text>
  <rect class="domain-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="domain-not-name" x="526" y="122">What is true</text>
  <text class="domain-not-desc" x="526" y="142">Actually.</text>
  <text class="domain-not-desc domain-not-row domain-not-r0" x="526" y="182">It should mirror the domain; storage is separate</text>
  <text class="domain-not-desc domain-not-row domain-not-r1" x="526" y="216">Some nouns are attributes, not types</text>
  <text class="domain-not-desc domain-not-row domain-not-r2" x="526" y="250">Layers you cannot justify are cost</text>
  <text class="domain-not-desc domain-not-row domain-not-r3" x="526" y="284">Enforced invariants are</text>
  <text class="domain-not-desc domain-not-row domain-not-r4" x="526" y="318">It changes as the domain is understood</text>
  <text class="domain-not-sub" x="30" y="372">Mirroring the database is the most consequential of these, because it imports storage decisions into the vocabulary the business is supposed to recognise.</text>
</svg>
