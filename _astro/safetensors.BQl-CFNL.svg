<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A security problem, not a performance one.">
  <title>Why the checkpoint format changed</title>
  <style>
    .safetensors-bg   { fill: #f8fafc; }
    .safetensors-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safetensors-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safetensors-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safetensors-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safetensors-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safetensors-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .safetensors-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .safetensors-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .safetensors-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .safetensors-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .safetensors-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .safetensors-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .safetensors-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .safetensors-stage { opacity: 1; }

    .safetensors-s0 { animation-delay: 0.00s; }
    .safetensors-e0 { animation-delay: 0.00s; }
    .safetensors-s1 { animation-delay: 1.28s; }
    .safetensors-e1 { animation-delay: 1.28s; }
    .safetensors-s2 { animation-delay: 2.56s; }
    .safetensors-e2 { animation-delay: 2.56s; }
    .safetensors-s3 { animation-delay: 3.84s; }
    .safetensors-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .safetensors-conn  { animation: safetensors-trace 6.4s ease-in-out infinite; }
      .safetensors-stage { animation: safetensors-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes safetensors-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes safetensors-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .safetensors-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .safetensors-stage { animation: safetensors-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes safetensors-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="safetensors-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="safetensors-bg" width="980" height="322"/>
  <text class="safetensors-h1"  x="30" y="40">Why the checkpoint format changed</text>
  <text class="safetensors-sub" x="30" y="64">A security problem, not a performance one.</text>
  <g class="safetensors-stage safetensors-s0">
    <rect class="safetensors-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="safetensors-step" x="44" y="142">01</text>
    <text class="safetensors-name" x="70" y="142">Pickle executes code on load</text>
    <text class="safetensors-desc" x="44" y="166">Arbitrary code, from a file</text>
    <text class="safetensors-desc" x="44" y="182">somebody else produced.</text>
  </g>
  <line class="safetensors-line safetensors-conn safetensors-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#safetensors-tip)"/>
  <g class="safetensors-stage safetensors-s1">
    <rect class="safetensors-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="safetensors-step" x="280" y="142">02</text>
    <text class="safetensors-name" x="306" y="142">Which is a remote code execution primitive</text>
    <text class="safetensors-desc" x="280" y="166">Downloading a checkpoint becomes</text>
    <text class="safetensors-desc" x="280" y="182">running a program.</text>
  </g>
  <line class="safetensors-line safetensors-conn safetensors-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#safetensors-tip)"/>
  <g class="safetensors-stage safetensors-s2">
    <rect class="safetensors-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="safetensors-step" x="516" y="142">03</text>
    <text class="safetensors-name" x="542" y="142">A header plus raw tensors instead</text>
    <text class="safetensors-desc" x="516" y="166">Parsed, never evaluated. The</text>
    <text class="safetensors-desc" x="516" y="182">class of attack disappears.</text>
  </g>
  <line class="safetensors-line safetensors-conn safetensors-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#safetensors-tip)"/>
  <g class="safetensors-stage safetensors-s3">
    <rect class="safetensors-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="safetensors-step" x="752" y="142">04</text>
    <text class="safetensors-name" x="778" y="142">And it loads faster</text>
    <text class="safetensors-desc" x="752" y="166">Memory-mapped, with no</text>
    <text class="safetensors-desc" x="752" y="182">deserialisation pass.</text>
  </g>
  <text class="safetensors-sub" x="30" y="304">The performance benefit is genuine and secondary: the format was designed to remove an attack surface, and being faster is a consequence of not needing to deserialise objects.</text>
</svg>
