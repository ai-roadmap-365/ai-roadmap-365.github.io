<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Scrub before anything is durable.">
  <title>The pipeline, in order</title>
  <style>
    .logging-pipeline-bg   { fill: #f8fafc; }
    .logging-pipeline-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-pipeline-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-pipeline-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-pipeline-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-pipeline-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-pipeline-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .logging-pipeline-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .logging-pipeline-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .logging-pipeline-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .logging-pipeline-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .logging-pipeline-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .logging-pipeline-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .logging-pipeline-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .logging-pipeline-stage { opacity: 1; }

    .logging-pipeline-s0 { animation-delay: 0.00s; }
    .logging-pipeline-e0 { animation-delay: 0.00s; }
    .logging-pipeline-s1 { animation-delay: 1.33s; }
    .logging-pipeline-e1 { animation-delay: 1.33s; }
    .logging-pipeline-s2 { animation-delay: 2.67s; }
    .logging-pipeline-e2 { animation-delay: 2.67s; }
    .logging-pipeline-s3 { animation-delay: 4.00s; }
    .logging-pipeline-e3 { animation-delay: 4.00s; }
    .logging-pipeline-s4 { animation-delay: 5.33s; }
    .logging-pipeline-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .logging-pipeline-conn  { animation: logging-pipeline-trace 8s ease-in-out infinite; }
      .logging-pipeline-stage { animation: logging-pipeline-arrive 8s ease-in-out infinite; }
    }
    @keyframes logging-pipeline-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes logging-pipeline-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .logging-pipeline-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .logging-pipeline-stage { animation: logging-pipeline-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes logging-pipeline-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="logging-pipeline-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="logging-pipeline-bg" width="980" height="322"/>
  <text class="logging-pipeline-h1"  x="30" y="40">The pipeline, in order</text>
  <text class="logging-pipeline-sub" x="30" y="64">Scrub before anything is durable.</text>
  <g class="logging-pipeline-stage logging-pipeline-s0">
    <rect class="logging-pipeline-warn" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="logging-pipeline-step" x="44" y="142">01</text>
    <text class="logging-pipeline-name" x="70" y="142">Scrub in memory</text>
    <text class="logging-pipeline-desc" x="44" y="166">Emails, national IDs,</text>
    <text class="logging-pipeline-desc" x="44" y="182">phone numbers, API keys —</text>
    <text class="logging-pipeline-desc" x="44" y="198">before any write.</text>
    <text class="logging-pipeline-edge" x="44" y="242">first</text>
  </g>
  <line class="logging-pipeline-line logging-pipeline-conn logging-pipeline-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#logging-pipeline-tip)"/>
  <g class="logging-pipeline-stage logging-pipeline-s1">
    <rect class="logging-pipeline-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="logging-pipeline-step" x="233" y="142">02</text>
    <text class="logging-pipeline-name" x="259" y="142">Structure as validated JSON</text>
    <text class="logging-pipeline-desc" x="233" y="166">A schema, not a</text>
    <text class="logging-pipeline-desc" x="233" y="182">convention. Missing</text>
    <text class="logging-pipeline-desc" x="233" y="198">fields fail.</text>
  </g>
  <line class="logging-pipeline-line logging-pipeline-conn logging-pipeline-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#logging-pipeline-tip)"/>
  <g class="logging-pipeline-stage logging-pipeline-s2">
    <rect class="logging-pipeline-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="logging-pipeline-step" x="422" y="142">03</text>
    <text class="logging-pipeline-name" x="448" y="142">Inject and propagate the trace ID</text>
    <text class="logging-pipeline-desc" x="422" y="166">W3C traceparent,</text>
    <text class="logging-pipeline-desc" x="422" y="182">forwarded across every</text>
    <text class="logging-pipeline-desc" x="422" y="198">hop.</text>
  </g>
  <line class="logging-pipeline-line logging-pipeline-conn logging-pipeline-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#logging-pipeline-tip)"/>
  <g class="logging-pipeline-stage logging-pipeline-s3">
    <rect class="logging-pipeline-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="logging-pipeline-step" x="611" y="142">04</text>
    <text class="logging-pipeline-name" x="637" y="142">Ship from stdout</text>
    <text class="logging-pipeline-desc" x="611" y="166">A Rust shipper reads the</text>
    <text class="logging-pipeline-desc" x="611" y="182">buffer at 100,000</text>
    <text class="logging-pipeline-desc" x="611" y="198">events/sec, with a disk</text>
  </g>
  <line class="logging-pipeline-line logging-pipeline-conn logging-pipeline-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#logging-pipeline-tip)"/>
  <g class="logging-pipeline-stage logging-pipeline-s4">
    <rect class="logging-pipeline-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="logging-pipeline-step" x="800" y="142">05</text>
    <text class="logging-pipeline-name" x="826" y="142">Aggregate per tenant</text>
    <text class="logging-pipeline-desc" x="800" y="166">Real-time cost</text>
    <text class="logging-pipeline-desc" x="800" y="182">attribution against the</text>
    <text class="logging-pipeline-desc" x="800" y="198">model's pricing tier.</text>
  </g>
  <text class="logging-pipeline-sub" x="30" y="304">The ordering is the control: scrubbing after the write is not scrubbing, and every stage after the first assumes the event is already safe to keep, which is only true if step one happened in memory.</text>
</svg>
