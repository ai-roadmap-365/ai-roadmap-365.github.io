<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Why splitting fails</title>
  <style>
    .split-fails-bg   { fill: #f8fafc; }
    .split-fails-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .split-fails-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .split-fails-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .split-fails-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .split-fails-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .split-fails-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .split-fails-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .split-fails-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .split-fails-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .split-fails-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .split-fails-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .split-fails-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .split-fails-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .split-fails-stage { opacity: 1; }

    .split-fails-s0 { animation-delay: 0.00s; }
    .split-fails-e0 { animation-delay: 0.00s; }
    .split-fails-s1 { animation-delay: 1.28s; }
    .split-fails-e1 { animation-delay: 1.28s; }
    .split-fails-s2 { animation-delay: 2.56s; }
    .split-fails-e2 { animation-delay: 2.56s; }
    .split-fails-s3 { animation-delay: 3.84s; }
    .split-fails-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .split-fails-conn  { animation: split-fails-trace 6.4s ease-in-out infinite; }
      .split-fails-stage { animation: split-fails-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes split-fails-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes split-fails-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .split-fails-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .split-fails-stage { animation: split-fails-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes split-fails-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="split-fails-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="split-fails-bg" width="980" height="322"/>
  <text class="split-fails-h1"  x="30" y="40">Why splitting fails</text>
  <text class="split-fails-sub" x="30" y="64">Four steps.</text>
  <g class="split-fails-stage split-fails-s0">
    <rect class="split-fails-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="split-fails-step" x="44" y="142">01</text>
    <text class="split-fails-name" x="70" y="142">Splitting a line on the delimiter looks correct</text>
    <text class="split-fails-desc" x="44" y="166">On the examples you tried.</text>
  </g>
  <line class="split-fails-line split-fails-conn split-fails-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#split-fails-tip)"/>
  <g class="split-fails-stage split-fails-s1">
    <rect class="split-fails-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="split-fails-step" x="280" y="142">02</text>
    <text class="split-fails-name" x="306" y="142">Until a field legitimately contains one</text>
    <text class="split-fails-desc" x="280" y="166">An address, a description, a</text>
    <text class="split-fails-desc" x="280" y="182">name.</text>
  </g>
  <line class="split-fails-line split-fails-conn split-fails-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#split-fails-tip)"/>
  <g class="split-fails-stage split-fails-s2">
    <rect class="split-fails-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="split-fails-step" x="516" y="142">03</text>
    <text class="split-fails-name" x="542" y="142">Which produces an extra field, shifting everything after it</text>
    <text class="split-fails-desc" x="516" y="166">For that row only.</text>
  </g>
  <line class="split-fails-line split-fails-conn split-fails-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#split-fails-tip)"/>
  <g class="split-fails-stage split-fails-s3">
    <rect class="split-fails-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="split-fails-step" x="752" y="142">04</text>
    <text class="split-fails-name" x="778" y="142">With no error, so the wrong data flows onward</text>
    <text class="split-fails-desc" x="752" y="166">Which is the worst kind of</text>
    <text class="split-fails-desc" x="752" y="182">failure.</text>
  </g>
  <text class="split-fails-sub" x="30" y="304">The failure being silent and row-specific is what makes it so damaging: most rows parse correctly, and the corrupted ones are invisible in a summary.</text>
</svg>
