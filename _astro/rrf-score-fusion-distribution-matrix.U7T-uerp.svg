<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="RRF Score Fusion Distribution Matrix">
  <title>RRF Score Fusion Distribution Matrix</title>
  <defs>
    <style>
      .d353b-bg { fill: #f8fafc; }
      .d353b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d353b-row { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5px; rx: 6px; }
      .d353b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d353b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d353b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #1e293b; }
      .d353b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d353b-bg" />
  
  <text x="40" y="40" class="d353b-title">Reciprocal Rank Fusion (RRF) Calculation Model</text>
  <text x="40" y="65" class="d353b-subtitle">RRF Score Fusion Distribution Matrix comparing Dense Vector ranks, Sparse BM25 ranks, and fused composite RRF scores</text>
  
  <!-- Table Header -->
  <rect x="40" y="110" width="820" height="40" fill="#e2e8f0" rx="6" />
  <text x="60" y="135" class="d353b-header">Document ID</text>
  <text x="230" y="135" class="d353b-header">Dense Rank (r_dense)</text>
  <text x="430" y="135" class="d353b-header">BM25 Rank (r_sparse)</text>
  <text x="650" y="135" class="d353b-header">RRF Score (k = 60)</text>
  
  <!-- Row 1 -->
  <rect x="40" y="160" width="820" height="45" class="d353b-card" />
  <text x="60" y="188" class="d353b-text" font-weight="600">Doc #104 (Contract SLA)</text>
  <text x="230" y="188" class="d353b-text">Rank 1 (1 / 61 = 0.01639)</text>
  <text x="430" y="188" class="d353b-text">Rank 2 (1 / 62 = 0.01613)</text>
  <text x="650" y="188" class="d353b-text" font-weight="700" fill="#15803d">0.03252 (Rank 1)</text>
  
  <!-- Row 2 -->
  <rect x="40" y="215" width="820" height="45" class="d353b-card" />
  <text x="60" y="243" class="d353b-text" font-weight="600">Doc #208 (Exact Clause)</text>
  <text x="230" y="243" class="d353b-text">Rank 15 (1 / 75 = 0.01333)</text>
  <text x="430" y="243" class="d353b-text">Rank 1 (1 / 61 = 0.01639)</text>
  <text x="650" y="243" class="d353b-text" font-weight="700" fill="#15803d">0.02972 (Rank 2)</text>
  
  <!-- Row 3 -->
  <rect x="40" y="270" width="820" height="45" class="d353b-card" />
  <text x="60" y="298" class="d353b-text" font-weight="600">Doc #042 (General FAQ)</text>
  <text x="230" y="298" class="d353b-text">Rank 2 (1 / 62 = 0.01613)</text>
  <text x="430" y="298" class="d353b-text">Rank 38 (1 / 98 = 0.01020)</text>
  <text x="650" y="298" class="d353b-text" font-weight="700" fill="#1d4ed8">0.02633 (Rank 3)</text>
  
  <text x="40" y="360" class="d353b-text" font-style="italic">Formula: RRF_Score = (1 / (60 + Dense_Rank)) + (1 / (60 + Sparse_Rank))</text>
  <text x="40" y="385" class="d353b-text">RRF eliminates score calibration bias and guarantees robust fusion across heterogeneous retrieval algorithms.</text>
</svg>