<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What fairness work is not</title>
  <style>
    .fairness-not-bg   { fill: #f8fafc; }
    .fairness-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fairness-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fairness-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fairness-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fairness-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fairness-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fairness-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fairness-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fairness-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fairness-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fairness-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fairness-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fairness-not-row { opacity: 1; }
    .fairness-not-r0 { animation-delay: 0.00s; }
    .fairness-not-r1 { animation-delay: 0.45s; }
    .fairness-not-r2 { animation-delay: 0.90s; }
    .fairness-not-r3 { animation-delay: 1.35s; }
    .fairness-not-r4 { animation-delay: 1.80s; }
    .fairness-not-row { animation: fairness-not-reveal 7.3s ease-in-out infinite; }
    @keyframes fairness-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="fairness-not-bg" width="980" height="390"/>
  <text class="fairness-not-h1"  x="30" y="40">What fairness work is not</text>
  <text class="fairness-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="fairness-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="fairness-not-name" x="46" y="122">The misconception</text>
  <text class="fairness-not-desc" x="46" y="142">Commonly held.</text>
  <text class="fairness-not-desc fairness-not-row fairness-not-r0" x="46" y="182">Removing protected attributes makes a model fair</text>
  <text class="fairness-not-desc fairness-not-row fairness-not-r1" x="46" y="216">There is one correct fairness metric</text>
  <text class="fairness-not-desc fairness-not-row fairness-not-r2" x="46" y="250">Fairness is a technical problem</text>
  <text class="fairness-not-desc fairness-not-row fairness-not-r3" x="46" y="284">A fair model makes the outcome fair</text>
  <text class="fairness-not-desc fairness-not-row fairness-not-r4" x="46" y="318">Accuracy and fairness always conflict</text>
  <rect class="fairness-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="fairness-not-name" x="526" y="122">What is true</text>
  <text class="fairness-not-desc" x="526" y="142">Actually.</text>
  <text class="fairness-not-desc fairness-not-row fairness-not-r0" x="526" y="182">Proxies reconstruct them almost perfectly</text>
  <text class="fairness-not-desc fairness-not-row fairness-not-r1" x="526" y="216">They are mutually incompatible</text>
  <text class="fairness-not-desc fairness-not-row fairness-not-r2" x="526" y="250">It is a policy choice implemented technically</text>
  <text class="fairness-not-desc fairness-not-row fairness-not-r3" x="526" y="284">The model is one part of a wider system</text>
  <text class="fairness-not-desc fairness-not-row fairness-not-r4" x="526" y="318">Sometimes; often the conflict is small</text>
  <text class="fairness-not-sub" x="30" y="372">Removing the protected attribute while leaving postcode, name and purchase history in place changes almost nothing, which is why fairness-through-unawareness fails.</text>
</svg>
