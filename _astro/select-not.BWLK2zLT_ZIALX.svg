<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things a query is not</title>
  <style>
    .select-not-bg   { fill: #f8fafc; }
    .select-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .select-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .select-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .select-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .select-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .select-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .select-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .select-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .select-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .select-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .select-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .select-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .select-not-row { opacity: 1; }
    .select-not-r0 { animation-delay: 0.00s; }
    .select-not-r1 { animation-delay: 0.45s; }
    .select-not-r2 { animation-delay: 0.90s; }
    .select-not-r3 { animation-delay: 1.35s; }
    .select-not-r4 { animation-delay: 1.80s; }
    .select-not-row { animation: select-not-reveal 7.3s ease-in-out infinite; }
    @keyframes select-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="select-not-bg" width="980" height="390"/>
  <text class="select-not-h1"  x="30" y="40">Four things a query is not</text>
  <text class="select-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="select-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="select-not-name" x="46" y="122">The misconception</text>
  <text class="select-not-desc" x="46" y="142">Commonly held.</text>
  <text class="select-not-desc select-not-row select-not-r0" x="46" y="182">Clauses run in the order written</text>
  <text class="select-not-desc select-not-row select-not-r1" x="46" y="216">Results come back in a stable order</text>
  <text class="select-not-desc select-not-row select-not-r2" x="46" y="250">Selecting everything is harmless</text>
  <text class="select-not-desc select-not-row select-not-r3" x="46" y="284">Missing values compare like ordinary ones</text>
  <text class="select-not-desc select-not-row select-not-r4" x="46" y="318">Filtering later costs the same</text>
  <rect class="select-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="select-not-name" x="526" y="122">What is true</text>
  <text class="select-not-desc" x="526" y="142">Actually.</text>
  <text class="select-not-desc select-not-row select-not-r0" x="526" y="182">Filtering happens before grouping</text>
  <text class="select-not-desc select-not-row select-not-r1" x="526" y="216">Without an ordering clause, order is undefined</text>
  <text class="select-not-desc select-not-row select-not-r2" x="526" y="250">It moves data you do not need</text>
  <text class="select-not-desc select-not-row select-not-r3" x="526" y="284">They need their own comparison</text>
  <text class="select-not-desc select-not-row select-not-r4" x="526" y="318">Filtering early avoids reading rows</text>
  <text class="select-not-sub" x="30" y="372">Undefined ordering without an explicit clause is the bug that hides longest, because the order is usually stable until the data or the plan changes.</text>
</svg>
