<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One of them scales.">
  <title>Tracking against remembering</title>
  <style>
    .tracking-vs-notes-bg   { fill: #f8fafc; }
    .tracking-vs-notes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-vs-notes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-vs-notes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-vs-notes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-vs-notes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-vs-notes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tracking-vs-notes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tracking-vs-notes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tracking-vs-notes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tracking-vs-notes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tracking-vs-notes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tracking-vs-notes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tracking-vs-notes-row { opacity: 1; }
    .tracking-vs-notes-r0 { animation-delay: 0.00s; }
    .tracking-vs-notes-r1 { animation-delay: 0.45s; }
    .tracking-vs-notes-r2 { animation-delay: 0.90s; }
    .tracking-vs-notes-r3 { animation-delay: 1.35s; }
    .tracking-vs-notes-r4 { animation-delay: 1.80s; }
    .tracking-vs-notes-row { animation: tracking-vs-notes-reveal 7.3s ease-in-out infinite; }
    @keyframes tracking-vs-notes-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tracking-vs-notes-bg" width="980" height="390"/>
  <text class="tracking-vs-notes-h1"  x="30" y="40">Tracking against remembering</text>
  <text class="tracking-vs-notes-sub" x="30" y="64">One of them scales.</text>
  <rect class="tracking-vs-notes-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tracking-vs-notes-name" x="46" y="122">Notes and filenames</text>
  <text class="tracking-vs-notes-desc" x="46" y="142">Works for a week.</text>
  <text class="tracking-vs-notes-desc tracking-vs-notes-row tracking-vs-notes-r0" x="46" y="182">Results in a spreadsheet, by hand</text>
  <text class="tracking-vs-notes-desc tracking-vs-notes-row tracking-vs-notes-r1" x="46" y="216">Checkpoints named model_final_v3_real</text>
  <text class="tracking-vs-notes-desc tracking-vs-notes-row tracking-vs-notes-r2" x="46" y="250">Configuration remembered, not recorded</text>
  <text class="tracking-vs-notes-desc tracking-vs-notes-row tracking-vs-notes-r3" x="46" y="284">No link from result to code</text>
  <text class="tracking-vs-notes-desc tracking-vs-notes-row tracking-vs-notes-r4" x="46" y="318">Unreproducible within a month</text>
  <rect class="tracking-vs-notes-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tracking-vs-notes-name" x="526" y="122">Systematic tracking</text>
  <text class="tracking-vs-notes-desc" x="526" y="142">Works for years.</text>
  <text class="tracking-vs-notes-desc tracking-vs-notes-row tracking-vs-notes-r0" x="526" y="182">Every run logged automatically</text>
  <text class="tracking-vs-notes-desc tracking-vs-notes-row tracking-vs-notes-r1" x="526" y="216">Checkpoints keyed to their run</text>
  <text class="tracking-vs-notes-desc tracking-vs-notes-row tracking-vs-notes-r2" x="526" y="250">Configuration captured from the code</text>
  <text class="tracking-vs-notes-desc tracking-vs-notes-row tracking-vs-notes-r3" x="526" y="284">Result traceable to commit and data</text>
  <text class="tracking-vs-notes-desc tracking-vs-notes-row tracking-vs-notes-r4" x="526" y="318">Comparable across the whole project</text>
  <text class="tracking-vs-notes-sub" x="30" y="372">The failure mode is not losing a single result but losing the ability to say why two runs differed, which is what makes a project stop making progress.</text>
</svg>
