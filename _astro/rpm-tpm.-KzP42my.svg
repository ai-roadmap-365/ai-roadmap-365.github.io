<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Which one depends on your traffic.">
  <title>Two limits, either can bind</title>
  <style>
    .rpm-tpm-bg   { fill: #f8fafc; }
    .rpm-tpm-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rpm-tpm-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rpm-tpm-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rpm-tpm-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rpm-tpm-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rpm-tpm-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rpm-tpm-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rpm-tpm-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rpm-tpm-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rpm-tpm-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rpm-tpm-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rpm-tpm-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rpm-tpm-row { opacity: 1; }
    .rpm-tpm-r0 { animation-delay: 0.00s; }
    .rpm-tpm-r1 { animation-delay: 0.45s; }
    .rpm-tpm-r2 { animation-delay: 0.90s; }
    .rpm-tpm-r3 { animation-delay: 1.35s; }
    .rpm-tpm-r4 { animation-delay: 1.80s; }
    .rpm-tpm-row { animation: rpm-tpm-reveal 7.3s ease-in-out infinite; }
    @keyframes rpm-tpm-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="rpm-tpm-bg" width="980" height="390"/>
  <text class="rpm-tpm-h1"  x="30" y="40">Two limits, either can bind</text>
  <text class="rpm-tpm-sub" x="30" y="64">Which one depends on your traffic.</text>
  <rect class="rpm-tpm-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="rpm-tpm-name" x="46" y="122">Requests per minute</text>
  <text class="rpm-tpm-desc" x="46" y="142">Binds on many small calls.</text>
  <text class="rpm-tpm-desc rpm-tpm-row rpm-tpm-r0" x="46" y="182">Counts calls, not size</text>
  <text class="rpm-tpm-desc rpm-tpm-row rpm-tpm-r1" x="46" y="216">Binds for classification workloads</text>
  <text class="rpm-tpm-desc rpm-tpm-row rpm-tpm-r2" x="46" y="250">Fixed by batching several items per call</text>
  <text class="rpm-tpm-desc rpm-tpm-row rpm-tpm-r3" x="46" y="284">Unaffected by prompt length</text>
  <text class="rpm-tpm-desc rpm-tpm-row rpm-tpm-r4" x="46" y="318">Often the first limit hit</text>
  <rect class="rpm-tpm-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="rpm-tpm-name" x="526" y="122">Tokens per minute</text>
  <text class="rpm-tpm-desc" x="526" y="142">Binds on few large calls.</text>
  <text class="rpm-tpm-desc rpm-tpm-row rpm-tpm-r0" x="526" y="182">Counts tokens, not calls</text>
  <text class="rpm-tpm-desc rpm-tpm-row rpm-tpm-r1" x="526" y="216">Binds for long-context workloads</text>
  <text class="rpm-tpm-desc rpm-tpm-row rpm-tpm-r2" x="526" y="250">Fixed by shortening prompts or retrieving less</text>
  <text class="rpm-tpm-desc rpm-tpm-row rpm-tpm-r3" x="526" y="284">Unaffected by call count</text>
  <text class="rpm-tpm-desc rpm-tpm-row rpm-tpm-r4" x="526" y="318">Often invisible until it bites</text>
  <text class="rpm-tpm-sub" x="30" y="372">Diagnosing which limit is binding before optimising saves real effort: batching helps one and makes the other worse.</text>
</svg>
