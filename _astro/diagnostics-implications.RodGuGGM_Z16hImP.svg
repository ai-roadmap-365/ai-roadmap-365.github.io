<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are savings.">
  <title>Four consequences of diagnosing first</title>
  <style>
    .diagnostics-implications-bg   { fill: #f8fafc; }
    .diagnostics-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diagnostics-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diagnostics-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diagnostics-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diagnostics-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diagnostics-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .diagnostics-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .diagnostics-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .diagnostics-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .diagnostics-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .diagnostics-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .diagnostics-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .diagnostics-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .diagnostics-implications-stage { opacity: 1; }

    .diagnostics-implications-s0 { animation-delay: 0.00s; }
    .diagnostics-implications-e0 { animation-delay: 0.00s; }
    .diagnostics-implications-s1 { animation-delay: 1.28s; }
    .diagnostics-implications-e1 { animation-delay: 1.28s; }
    .diagnostics-implications-s2 { animation-delay: 2.56s; }
    .diagnostics-implications-e2 { animation-delay: 2.56s; }
    .diagnostics-implications-s3 { animation-delay: 3.84s; }
    .diagnostics-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .diagnostics-implications-conn  { animation: diagnostics-implications-trace 6.4s ease-in-out infinite; }
      .diagnostics-implications-stage { animation: diagnostics-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes diagnostics-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes diagnostics-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .diagnostics-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .diagnostics-implications-stage { animation: diagnostics-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes diagnostics-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="diagnostics-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="diagnostics-implications-bg" width="980" height="322"/>
  <text class="diagnostics-implications-h1"  x="30" y="40">Four consequences of diagnosing first</text>
  <text class="diagnostics-implications-sub" x="30" y="64">Two are savings.</text>
  <g class="diagnostics-implications-stage diagnostics-implications-s0">
    <rect class="diagnostics-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="diagnostics-implications-step" x="44" y="142">01</text>
    <text class="diagnostics-implications-name" x="70" y="142">Effort goes to the fix that can work</text>
    <text class="diagnostics-implications-desc" x="44" y="166">Rather than to the one tried</text>
    <text class="diagnostics-implications-desc" x="44" y="182">first.</text>
  </g>
  <line class="diagnostics-implications-line diagnostics-implications-conn diagnostics-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#diagnostics-implications-tip)"/>
  <g class="diagnostics-implications-stage diagnostics-implications-s1">
    <rect class="diagnostics-implications-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="diagnostics-implications-step" x="280" y="142">02</text>
    <text class="diagnostics-implications-name" x="306" y="142">Which avoids buying data that will not help</text>
    <text class="diagnostics-implications-desc" x="280" y="166">Often the most expensive wrong</text>
    <text class="diagnostics-implications-desc" x="280" y="182">move.</text>
  </g>
  <line class="diagnostics-implications-line diagnostics-implications-conn diagnostics-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#diagnostics-implications-tip)"/>
  <g class="diagnostics-implications-stage diagnostics-implications-s2">
    <rect class="diagnostics-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="diagnostics-implications-step" x="516" y="142">03</text>
    <text class="diagnostics-implications-name" x="542" y="142">And tells you when the model is near the noise floor</text>
    <text class="diagnostics-implications-desc" x="516" y="166">So the project can stop.</text>
  </g>
  <line class="diagnostics-implications-line diagnostics-implications-conn diagnostics-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#diagnostics-implications-tip)"/>
  <g class="diagnostics-implications-stage diagnostics-implications-s3">
    <rect class="diagnostics-implications-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="diagnostics-implications-step" x="752" y="142">04</text>
    <text class="diagnostics-implications-name" x="778" y="142">Which sets expectations honestly</text>
    <text class="diagnostics-implications-desc" x="752" y="166">Rather than promising</text>
    <text class="diagnostics-implications-desc" x="752" y="182">improvement that is unavailable.</text>
  </g>
  <text class="diagnostics-implications-sub" x="30" y="304">Knowing when to stop is an underrated output: a model at the irreducible noise floor is finished, and further work is expenditure without return.</text>
</svg>
