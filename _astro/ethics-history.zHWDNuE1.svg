<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward regulation.">
  <title>Four steps in data ethics</title>
  <style>
    .ethics-history-bg   { fill: #f8fafc; }
    .ethics-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ethics-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ethics-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ethics-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ethics-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ethics-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ethics-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ethics-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ethics-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ethics-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ethics-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ethics-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .ethics-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .ethics-history-stage { opacity: 1; }

    .ethics-history-s0 { animation-delay: 0.00s; }
    .ethics-history-e0 { animation-delay: 0.00s; }
    .ethics-history-s1 { animation-delay: 1.28s; }
    .ethics-history-e1 { animation-delay: 1.28s; }
    .ethics-history-s2 { animation-delay: 2.56s; }
    .ethics-history-e2 { animation-delay: 2.56s; }
    .ethics-history-s3 { animation-delay: 3.84s; }
    .ethics-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .ethics-history-conn  { animation: ethics-history-trace 6.4s ease-in-out infinite; }
      .ethics-history-stage { animation: ethics-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes ethics-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes ethics-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .ethics-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ethics-history-stage { animation: ethics-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes ethics-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ethics-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="ethics-history-bg" width="980" height="322"/>
  <text class="ethics-history-h1"  x="30" y="40">Four steps in data ethics</text>
  <text class="ethics-history-sub" x="30" y="64">Toward regulation.</text>
  <g class="ethics-history-stage ethics-history-s0">
    <rect class="ethics-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="ethics-history-step" x="44" y="142">01</text>
    <text class="ethics-history-name" x="70" y="142">Research ethics rules after documented harms</text>
    <text class="ethics-history-desc" x="44" y="166">Consent, review, oversight.</text>
  </g>
  <line class="ethics-history-line ethics-history-conn ethics-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#ethics-history-tip)"/>
  <g class="ethics-history-stage ethics-history-s1">
    <rect class="ethics-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="ethics-history-step" x="280" y="142">02</text>
    <text class="ethics-history-name" x="306" y="142">Then data protection law giving individuals rights</text>
    <text class="ethics-history-desc" x="280" y="166">Over data about them.</text>
  </g>
  <line class="ethics-history-line ethics-history-conn ethics-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#ethics-history-tip)"/>
  <g class="ethics-history-stage ethics-history-s2">
    <rect class="ethics-history-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="ethics-history-step" x="516" y="142">03</text>
    <text class="ethics-history-name" x="542" y="142">Then work on algorithmic accountability and fairness</text>
    <text class="ethics-history-desc" x="516" y="166">As automated decisions spread.</text>
  </g>
  <line class="ethics-history-line ethics-history-conn ethics-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#ethics-history-tip)"/>
  <g class="ethics-history-stage ethics-history-s3">
    <rect class="ethics-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="ethics-history-step" x="752" y="142">04</text>
    <text class="ethics-history-name" x="778" y="142">And regulation of automated systems by risk level</text>
    <text class="ethics-history-desc" x="752" y="166">Which is now arriving.</text>
  </g>
  <text class="ethics-history-sub" x="30" y="304">Each stage followed documented harm rather than preceding it, which is a pattern worth noticing when judging whether current practice is sufficient.</text>
</svg>
