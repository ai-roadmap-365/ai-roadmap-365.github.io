<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Overfitting, and unstable scale.">
  <title>Three mechanisms, two problems</title>
  <style>
    .three-mechanisms-bg   { fill: #f8fafc; }
    .three-mechanisms-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-mechanisms-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-mechanisms-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-mechanisms-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-mechanisms-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-mechanisms-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-mechanisms-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-mechanisms-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-mechanisms-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-mechanisms-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-mechanisms-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-mechanisms-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .three-mechanisms-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .three-mechanisms-stage { opacity: 1; }

    .three-mechanisms-s0 { animation-delay: 0.00s; }
    .three-mechanisms-e0 { animation-delay: 0.00s; }
    .three-mechanisms-s1 { animation-delay: 1.50s; }
    .three-mechanisms-e1 { animation-delay: 1.50s; }
    .three-mechanisms-s2 { animation-delay: 3.00s; }
    .three-mechanisms-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .three-mechanisms-conn  { animation: three-mechanisms-trace 6s ease-in-out infinite; }
      .three-mechanisms-stage { animation: three-mechanisms-arrive 6s ease-in-out infinite; }
    }
    @keyframes three-mechanisms-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes three-mechanisms-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .three-mechanisms-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .three-mechanisms-stage { animation: three-mechanisms-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes three-mechanisms-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="three-mechanisms-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="three-mechanisms-bg" width="980" height="322"/>
  <text class="three-mechanisms-h1"  x="30" y="40">Three mechanisms, two problems</text>
  <text class="three-mechanisms-sub" x="30" y="64">Overfitting, and unstable scale.</text>
  <g class="three-mechanisms-stage three-mechanisms-s0">
    <rect class="three-mechanisms-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="three-mechanisms-step" x="44" y="142">01</text>
    <text class="three-mechanisms-name" x="70" y="142">Dropout: random unit removal</text>
    <text class="three-mechanisms-desc" x="44" y="166">Forces redundancy. No feature can rely on a</text>
    <text class="three-mechanisms-desc" x="44" y="182">specific partner.</text>
    <text class="three-mechanisms-edge" x="44" y="242">overfitting</text>
  </g>
  <line class="three-mechanisms-line three-mechanisms-conn three-mechanisms-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#three-mechanisms-tip)"/>
  <g class="three-mechanisms-stage three-mechanisms-s1">
    <rect class="three-mechanisms-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="three-mechanisms-step" x="359" y="142">02</text>
    <text class="three-mechanisms-name" x="385" y="142">Normalisation: stabilise scale</text>
    <text class="three-mechanisms-desc" x="359" y="166">Keeps activation distributions steady across</text>
    <text class="three-mechanisms-desc" x="359" y="182">depth.</text>
    <text class="three-mechanisms-edge" x="359" y="242">trainability</text>
  </g>
  <line class="three-mechanisms-line three-mechanisms-conn three-mechanisms-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#three-mechanisms-tip)"/>
  <g class="three-mechanisms-stage three-mechanisms-s2">
    <rect class="three-mechanisms-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="three-mechanisms-step" x="674" y="142">03</text>
    <text class="three-mechanisms-name" x="700" y="142">Weight decay: shrink parameters</text>
    <text class="three-mechanisms-desc" x="674" y="166">Prefers smaller weights, all else equal.</text>
    <text class="three-mechanisms-edge" x="674" y="242">overfitting</text>
  </g>
  <text class="three-mechanisms-sub" x="30" y="304">Two of these attack overfitting and one attacks trainability, which is worth keeping straight: normalisation is not primarily a regulariser, even though it often behaves like one.</text>
</svg>
