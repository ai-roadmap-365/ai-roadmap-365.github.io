<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="GOSS and EFB Optimization Flow">
  <title>LightGBM: GOSS and EFB Optimization Flow</title>
  <defs>
    <style>
      .d165f-bg { fill: #f8fafc; }
      .d165f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d165f-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; }
      .d165f-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; }
      .d165f-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 12px; font-weight: 600; }
      
      @keyframes d165f-pulse {
        0%, 100% { fill: #eff6ff; }
        50% { fill: #dbeafe; }
      }
      .d165f-pulse-box { animation: d165f-pulse 3s infinite ease-in-out; }
      
      @media (prefers-reduced-motion: reduce) {
        .d165f-pulse-box { animation: none; fill: #eff6ff; }
      }
    </style>
  </defs>

  <rect width="100%" height="100%" class="d165f-bg" />

  <text x="40" y="45" class="d165f-title" font-size="22">LightGBM Acceleration: GOSS &amp; Feature Bundling</text>
  <text x="40" y="70" class="d165f-text">Subsampling instance dimension (GOSS) and compressing feature dimension (EFB)</text>

  <!-- Left: GOSS Mechanism -->
  <rect x="40" y="100" width="390" height="340" class="d165f-card" />
  <text x="60" y="130" class="d165f-title" fill="#1e40af">Gradient-based One-Side Sampling (GOSS)</text>

  <!-- Step 1: Sort by gradient -->
  <rect x="60" y="150" width="350" height="50" fill="#f8fafc" stroke="#e2e8f0" rx="6" />
  <text x="75" y="172" class="d165f-title" font-size="12" fill="#1e293b">1. Sort Instances by Gradient |g_i|</text>
  <text x="75" y="190" class="d165f-text" font-size="11">Identify under-trained vs well-trained instances.</text>

  <!-- Step 2: Keep Top A% -->
  <rect x="60" y="210" width="350" height="55" fill="#fef2f2" stroke="#fecaca" rx="6" />
  <text x="75" y="232" class="d165f-title" font-size="12" fill="#dc2626">2. Retain Top a × 100% Large Gradients</text>
  <text x="75" y="250" class="d165f-text" font-size="11">Keeps 100% of the hardest, high-error samples.</text>

  <!-- Step 3: Random Sample from Bottom B% -->
  <rect x="60" y="275" width="350" height="65" class="d165f-pulse-box" stroke="#bfdbfe" rx="6" />
  <text x="75" y="297" class="d165f-title" font-size="12" fill="#1d4ed8">3. Sample b × 100% Small Gradients</text>
  <text x="75" y="315" class="d165f-math" font-size="10">Weight multiplier: w = (1 - a) / b</text>
  <text x="75" y="330" class="d165f-text" font-size="10" fill="#1e40af">Scales small gradients to preserve unbiased distribution.</text>

  <!-- Right: EFB Mechanism -->
  <rect x="470" y="100" width="390" height="340" class="d165f-card" />
  <text x="490" y="130" class="d165f-title" fill="#15803d">Exclusive Feature Bundling (EFB)</text>

  <!-- Step 1: Graph Coloring -->
  <rect x="490" y="150" width="350" height="60" fill="#f8fafc" stroke="#e2e8f0" rx="6" />
  <text x="505" y="172" class="d165f-title" font-size="12" fill="#1e293b">1. Conflict Graph Construction</text>
  <text x="505" y="190" class="d165f-text" font-size="11">Find feature pairs that rarely take non-zero values simultaneously.</text>

  <!-- Step 2: Merge Sparse Features -->
  <rect x="490" y="220" width="350" height="60" fill="#f0fdf4" stroke="#bbf7d0" rx="6" />
  <text x="505" y="242" class="d165f-title" font-size="12" fill="#16a34a">2. Bundle Non-Conflicting Features</text>
  <text x="505" y="260" class="d165f-text" font-size="11">Merge sparse one-hot columns into single dense integer bins.</text>

  <!-- Step 3: Offset Values -->
  <rect x="490" y="290" width="350" height="65" fill="#f8fafc" stroke="#e2e8f0" rx="6" />
  <text x="505" y="312" class="d165f-title" font-size="12" fill="#1e293b">3. Value Offset Binning</text>
  <text x="505" y="332" class="d165f-math" font-size="11">Bundle_Val = Feat_A + Offset_B</text>
  <text x="505" y="347" class="d165f-text" font-size="10" fill="#64748b">Ensures distinct non-overlapping bin ranges.</text>

  <text x="470" y="415" class="d165f-text" font-size="12">Result: Reduces both sample count (N) and feature count (D) with zero loss in predictive fidelity.</text>
</svg>
