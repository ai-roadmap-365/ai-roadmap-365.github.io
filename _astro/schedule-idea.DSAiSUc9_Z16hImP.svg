<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>What a scheduled job needs</title>
  <style>
    .schedule-idea-bg   { fill: #f8fafc; }
    .schedule-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .schedule-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .schedule-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .schedule-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .schedule-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .schedule-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .schedule-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .schedule-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .schedule-idea-stage { opacity: 1; }

    .schedule-idea-s0 { animation-delay: 0.00s; }
    .schedule-idea-e0 { animation-delay: 0.00s; }
    .schedule-idea-s1 { animation-delay: 1.28s; }
    .schedule-idea-e1 { animation-delay: 1.28s; }
    .schedule-idea-s2 { animation-delay: 2.56s; }
    .schedule-idea-e2 { animation-delay: 2.56s; }
    .schedule-idea-s3 { animation-delay: 3.84s; }
    .schedule-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .schedule-idea-conn  { animation: schedule-idea-trace 6.4s ease-in-out infinite; }
      .schedule-idea-stage { animation: schedule-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes schedule-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes schedule-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .schedule-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .schedule-idea-stage { animation: schedule-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes schedule-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="schedule-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="schedule-idea-bg" width="980" height="322"/>
  <text class="schedule-idea-h1"  x="30" y="40">What a scheduled job needs</text>
  <text class="schedule-idea-sub" x="30" y="64">Four properties.</text>
  <g class="schedule-idea-stage schedule-idea-s0">
    <rect class="schedule-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="schedule-idea-step" x="44" y="142">01</text>
    <text class="schedule-idea-name" x="70" y="142">Idempotent: safe to run twice</text>
    <text class="schedule-idea-desc" x="44" y="166">Because it will be, eventually.</text>
  </g>
  <line class="schedule-idea-line schedule-idea-conn schedule-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#schedule-idea-tip)"/>
  <g class="schedule-idea-stage schedule-idea-s1">
    <rect class="schedule-idea-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="schedule-idea-step" x="280" y="142">02</text>
    <text class="schedule-idea-name" x="306" y="142">Locked, so two runs cannot overlap</text>
    <text class="schedule-idea-desc" x="280" y="166">Or they corrupt each other's</text>
    <text class="schedule-idea-desc" x="280" y="182">state.</text>
  </g>
  <line class="schedule-idea-line schedule-idea-conn schedule-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#schedule-idea-tip)"/>
  <g class="schedule-idea-stage schedule-idea-s2">
    <rect class="schedule-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="schedule-idea-step" x="516" y="142">03</text>
    <text class="schedule-idea-name" x="542" y="142">Bounded by a timeout</text>
    <text class="schedule-idea-desc" x="516" y="166">So a hung run does not hold the</text>
    <text class="schedule-idea-desc" x="516" y="182">lock forever.</text>
  </g>
  <line class="schedule-idea-line schedule-idea-conn schedule-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#schedule-idea-tip)"/>
  <g class="schedule-idea-stage schedule-idea-s3">
    <rect class="schedule-idea-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="schedule-idea-step" x="752" y="142">04</text>
    <text class="schedule-idea-name" x="778" y="142">And observable: logged, with a heartbeat</text>
    <text class="schedule-idea-desc" x="752" y="166">Or a job that stopped goes</text>
    <text class="schedule-idea-desc" x="752" y="182">unnoticed.</text>
  </g>
  <text class="schedule-idea-sub" x="30" y="304">The heartbeat is the property people omit: a job that fails loudly is fine, and a job that silently stops running is invisible for weeks.</text>
</svg>
