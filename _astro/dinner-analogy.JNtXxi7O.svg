<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The hoovering was never the problem.">
  <title>Getting dinner ready</title>
  <style>
    .dinner-analogy-bg   { fill: #f8fafc; }
    .dinner-analogy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dinner-analogy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dinner-analogy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dinner-analogy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dinner-analogy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dinner-analogy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dinner-analogy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dinner-analogy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dinner-analogy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dinner-analogy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dinner-analogy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dinner-analogy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dinner-analogy-row { opacity: 1; }
    .dinner-analogy-r0 { animation-delay: 0.00s; }
    .dinner-analogy-r1 { animation-delay: 0.45s; }
    .dinner-analogy-r2 { animation-delay: 0.90s; }
    .dinner-analogy-r3 { animation-delay: 1.35s; }
    .dinner-analogy-r4 { animation-delay: 1.80s; }
    .dinner-analogy-row { animation: dinner-analogy-reveal 7.3s ease-in-out infinite; }
    @keyframes dinner-analogy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="dinner-analogy-bg" width="980" height="390"/>
  <text class="dinner-analogy-h1"  x="30" y="40">Getting dinner ready</text>
  <text class="dinner-analogy-sub" x="30" y="64">The hoovering was never the problem.</text>
  <rect class="dinner-analogy-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="dinner-analogy-name" x="46" y="122">The cooking</text>
  <text class="dinner-analogy-desc" x="46" y="142">Everything is timed around it.</text>
  <text class="dinner-analogy-desc dinner-analogy-row dinner-analogy-r0" x="46" y="182">Shopping, prep, oven, serving</text>
  <text class="dinner-analogy-desc dinner-analogy-row dinner-analogy-r1" x="46" y="216">Two hours, in sequence</text>
  <text class="dinner-analogy-desc dinner-analogy-row dinner-analogy-r2" x="46" y="250">This is the critical path</text>
  <text class="dinner-analogy-desc dinner-analogy-row dinner-analogy-r3" x="46" y="284">Pre-chopped vegetables: 20 min earlier</text>
  <text class="dinner-analogy-desc dinner-analogy-row dinner-analogy-r4" x="46" y="318">Because the oven was waiting</text>
  <rect class="dinner-analogy-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="dinner-analogy-name" x="526" y="122">The hoovering</text>
  <text class="dinner-analogy-desc" x="526" y="142">Twenty minutes, in parallel.</text>
  <text class="dinner-analogy-desc dinner-analogy-row dinner-analogy-r0" x="526" y="182">Happens while the oven is on</text>
  <text class="dinner-analogy-desc dinner-analogy-row dinner-analogy-r1" x="526" y="216">Costs somebody's effort</text>
  <text class="dinner-analogy-desc dinner-analogy-row dinner-analogy-r2" x="526" y="250">Costs zero minutes of when dinner is ready</text>
  <text class="dinner-analogy-desc dinner-analogy-row dinner-analogy-r3" x="526" y="284">Cancel it and dinner arrives at the same time</text>
  <text class="dinner-analogy-desc dinner-analogy-row dinner-analogy-r4" x="526" y="318">The most annoying item on the list</text>
  <text class="dinner-analogy-sub" x="30" y="372">Annoyance is not the same measurement as delay, and a pipeline review that ranks jobs by how much people dislike them will reliably optimise the wrong thing.</text>
</svg>
