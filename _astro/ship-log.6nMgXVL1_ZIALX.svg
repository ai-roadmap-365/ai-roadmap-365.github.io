<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Written as you go.">
  <title>A ship's log</title>
  <style>
    .ship-log-bg   { fill: #f8fafc; }
    .ship-log-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ship-log-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ship-log-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ship-log-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ship-log-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ship-log-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ship-log-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ship-log-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ship-log-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ship-log-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ship-log-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ship-log-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ship-log-row { opacity: 1; }
    .ship-log-r0 { animation-delay: 0.00s; }
    .ship-log-r1 { animation-delay: 0.45s; }
    .ship-log-r2 { animation-delay: 0.90s; }
    .ship-log-r3 { animation-delay: 1.35s; }
    .ship-log-r4 { animation-delay: 1.80s; }
    .ship-log-row { animation: ship-log-reveal 7.3s ease-in-out infinite; }
    @keyframes ship-log-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="ship-log-bg" width="980" height="390"/>
  <text class="ship-log-h1"  x="30" y="40">A ship's log</text>
  <text class="ship-log-sub" x="30" y="64">Written as you go.</text>
  <rect class="ship-log-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="ship-log-name" x="46" y="122">Logged as it happened</text>
  <text class="ship-log-desc" x="46" y="142">Reconstructable.</text>
  <text class="ship-log-desc ship-log-row ship-log-r0" x="46" y="182">Entries written at the time</text>
  <text class="ship-log-desc ship-log-row ship-log-r1" x="46" y="216">Position, conditions, decisions</text>
  <text class="ship-log-desc ship-log-row ship-log-r2" x="46" y="250">An incident can be traced</text>
  <text class="ship-log-desc ship-log-row ship-log-r3" x="46" y="284">Others can read it</text>
  <text class="ship-log-desc ship-log-row ship-log-r4" x="46" y="318">This is application logging</text>
  <rect class="ship-log-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="ship-log-name" x="526" y="122">Recalled afterwards</text>
  <text class="ship-log-desc" x="526" y="142">Guesswork.</text>
  <text class="ship-log-desc ship-log-row ship-log-r0" x="526" y="182">Nothing written down</text>
  <text class="ship-log-desc ship-log-row ship-log-r1" x="526" y="216">Only what someone remembers</text>
  <text class="ship-log-desc ship-log-row ship-log-r2" x="526" y="250">An incident is speculation</text>
  <text class="ship-log-desc ship-log-row ship-log-r3" x="526" y="284">Nobody else can verify</text>
  <text class="ship-log-desc ship-log-row ship-log-r4" x="526" y="318">This is debugging without logs</text>
  <text class="ship-log-sub" x="30" y="372">Tracing an incident is the moment logs justify themselves entirely, and it is always after the fact, which is why they must be written before.</text>
</svg>
