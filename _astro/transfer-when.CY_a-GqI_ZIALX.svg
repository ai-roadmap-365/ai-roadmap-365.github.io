<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And the rare case against.">
  <title>When to transfer</title>
  <style>
    .transfer-when-bg   { fill: #f8fafc; }
    .transfer-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transfer-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transfer-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transfer-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transfer-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transfer-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .transfer-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .transfer-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .transfer-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .transfer-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .transfer-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .transfer-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .transfer-when-row { opacity: 1; }
    .transfer-when-r0 { animation-delay: 0.00s; }
    .transfer-when-r1 { animation-delay: 0.45s; }
    .transfer-when-r2 { animation-delay: 0.90s; }
    .transfer-when-r3 { animation-delay: 1.35s; }
    .transfer-when-r4 { animation-delay: 1.80s; }
    .transfer-when-row { animation: transfer-when-reveal 7.3s ease-in-out infinite; }
    @keyframes transfer-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="transfer-when-bg" width="980" height="390"/>
  <text class="transfer-when-h1"  x="30" y="40">When to transfer</text>
  <text class="transfer-when-sub" x="30" y="64">And the rare case against.</text>
  <rect class="transfer-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="transfer-when-name" x="46" y="122">Transfer</text>
  <text class="transfer-when-desc" x="46" y="142">Nearly always.</text>
  <text class="transfer-when-desc transfer-when-row transfer-when-r0" x="46" y="182">Fewer than a million training images</text>
  <text class="transfer-when-desc transfer-when-row transfer-when-r1" x="46" y="216">Timelines measured in hours or days</text>
  <text class="transfer-when-desc transfer-when-row transfer-when-r2" x="46" y="250">Any natural-image domain</text>
  <text class="transfer-when-desc transfer-when-row transfer-when-r3" x="46" y="284">Medical, industrial, satellite imagery</text>
  <text class="transfer-when-desc transfer-when-row transfer-when-r4" x="46" y="318">Which covers almost every project</text>
  <rect class="transfer-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="transfer-when-name" x="526" y="122">Train from scratch</text>
  <text class="transfer-when-desc" x="526" y="142">Rarely.</text>
  <text class="transfer-when-desc transfer-when-row transfer-when-r0" x="526" y="182">A modality that violates the pretraining assumptions</text>
  <text class="transfer-when-desc transfer-when-row transfer-when-r1" x="526" y="216">Raw one-dimensional signals</text>
  <text class="transfer-when-desc transfer-when-row transfer-when-r2" x="526" y="250">Genuinely enormous labelled datasets</text>
  <text class="transfer-when-desc transfer-when-row transfer-when-r3" x="526" y="284">Research into pretraining itself</text>
  <text class="transfer-when-desc transfer-when-row transfer-when-r4" x="526" y="318">Expect it to be harder than it looks</text>
  <text class="transfer-when-sub" x="30" y="372">The threshold of a million images is worth remembering as a rule of thumb: below it, a pretrained backbone almost always wins, and above it the calculation starts to change.</text>
</svg>
