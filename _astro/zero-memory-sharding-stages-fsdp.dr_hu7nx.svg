<svg role="img" aria-label="ZeRO memory sharding stages comparison showing Baseline DDP ZeRO 1 ZeRO 2 and ZeRO 3 Fully Sharded Data Parallel" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>ZeRO Memory Sharding Stages (ZeRO-1, ZeRO-2, ZeRO-3 / FSDP)</title>
  <defs>
    <linearGradient id="bg234b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card234b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg234b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">ZERO MEMORY SHARDING (DEEPSPEED / PYTORCH FSDP)</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Eliminating Redundancy across Optimizer States (ZeRO-1), Gradients (ZeRO-2), and Parameters (ZeRO-3)</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card234b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- 1. Standard DDP Baseline (16x Memory) -->
    <g transform="translate(25, 20)">
      <rect width="165" height="255" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" rx="6"/>
      <text x="82" y="30" fill="#fb7185" font-size="11" font-weight="700" text-anchor="middle">Standard DDP</text>
      <!-- Params (2B) -->
      <rect x="15" y="45" width="135" height="35" fill="#38bdf8" rx="3"/>
      <text x="82" y="67" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">Params (2B/p) [All]</text>
      <!-- Grads (2B) -->
      <rect x="15" y="85" width="135" height="35" fill="#fbbf24" rx="3"/>
      <text x="82" y="107" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">Grads (2B/p) [All]</text>
      <!-- Optim (12B) -->
      <rect x="15" y="125" width="135" height="100" fill="#a855f7" rx="3"/>
      <text x="82" y="175" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">Optimizer (12B/p) [All]</text>
      <text x="82" y="240" fill="#fb7185" font-size="9" font-weight="700" text-anchor="middle">Total: 16 Bytes / Param</text>
    </g>

    <!-- 2. ZeRO-1: Optimizer Sharded -->
    <g transform="translate(210, 20)">
      <rect width="165" height="255" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
      <text x="82" y="30" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">ZeRO-1 (Pos)</text>
      <rect x="15" y="45" width="135" height="35" fill="#38bdf8" rx="3"/>
      <text x="82" y="67" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">Params (2B/p) [All]</text>
      <rect x="15" y="85" width="135" height="35" fill="#fbbf24" rx="3"/>
      <text x="82" y="107" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">Grads (2B/p) [All]</text>
      <!-- Optim Sharded -->
      <rect x="15" y="125" width="135" height="25" fill="#a855f7" rx="3"/>
      <text x="82" y="142" fill="#ffffff" font-size="8" font-weight="700" text-anchor="middle">Optim Sharded (12/N)</text>
      <text x="82" y="240" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">4x Memory Cut (5.5B/p)</text>
    </g>

    <!-- 3. ZeRO-2: Gradients Sharded -->
    <g transform="translate(395, 20)">
      <rect width="165" height="255" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
      <text x="82" y="30" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">ZeRO-2 (Pos+g)</text>
      <rect x="15" y="45" width="135" height="35" fill="#38bdf8" rx="3"/>
      <text x="82" y="67" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">Params (2B/p) [All]</text>
      <rect x="15" y="85" width="135" height="15" fill="#fbbf24" rx="3"/>
      <text x="82" y="97" fill="#0f172a" font-size="7" font-weight="700" text-anchor="middle">Grads Sharded (2/N)</text>
      <rect x="15" y="105" width="135" height="25" fill="#a855f7" rx="3"/>
      <text x="82" y="122" fill="#ffffff" font-size="8" font-weight="700" text-anchor="middle">Optim Sharded (12/N)</text>
      <text x="82" y="240" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">8x Memory Cut (3.7B/p)</text>
    </g>

    <!-- 4. ZeRO-3 / FSDP: Parameters Sharded -->
    <g transform="translate(580, 20)">
      <rect width="155" height="255" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="6"/>
      <text x="77" y="30" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">ZeRO-3 / FSDP</text>
      <rect x="15" y="45" width="125" height="15" fill="#38bdf8" rx="3"/>
      <text x="77" y="57" fill="#0f172a" font-size="7" font-weight="700" text-anchor="middle">Params (2/N)</text>
      <rect x="15" y="65" width="125" height="15" fill="#fbbf24" rx="3"/>
      <text x="77" y="77" fill="#0f172a" font-size="7" font-weight="700" text-anchor="middle">Grads (2/N)</text>
      <rect x="15" y="85" width="125" height="20" fill="#a855f7" rx="3"/>
      <text x="77" y="99" fill="#ffffff" font-size="7" font-weight="700" text-anchor="middle">Optim (12/N)</text>
      <text x="77" y="240" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">Linear Scaling (16/N)</text>
    </g>
  </g>
</svg>
