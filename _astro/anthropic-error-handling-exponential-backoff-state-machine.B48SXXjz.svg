<svg role="img" aria-label="Anthropic API exponential backoff error handling state machine diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>API Error Handling &amp; Exponential Backoff State Machine</title>
  <defs>
    <linearGradient id="bg253b" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card253b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg253b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">API ERROR TAXONOMY &amp; EXPONENTIAL RETRIES</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Classifying Transient vs Fatal Status Codes with Jittered Backoff Resilience</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card253b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Transient Errors (Retryable) -->
    <rect x="25" y="25" width="340" height="245" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="195" y="50" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">1. Transient Errors (Auto-Retryable)</text>
    
    <rect x="35" y="70" width="320" height="50" fill="#1e293b" rx="4"/>
    <text x="45" y="90" fill="#fbbf24" font-size="8" font-weight="700">429 RateLimitError:</text>
    <text x="45" y="108" fill="#cbd5e1" font-size="7">Token/RPM limits exceeded. Backoff: t = min(t_max, 2^attempt * t_0) + jitter</text>

    <rect x="35" y="130" width="320" height="50" fill="#1e293b" rx="4"/>
    <text x="45" y="150" fill="#fbbf24" font-size="8" font-weight="700">529 OverloadedError / 500 InternalError:</text>
    <text x="45" y="168" fill="#cbd5e1" font-size="7">Temporary GPU capacity saturation. Retry with exponential backoff.</text>

    <text x="195" y="235" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Action: Exponential Backoff (max 5 retries)</text>

    <!-- Fatal Errors (Non-Retryable) -->
    <rect x="395" y="25" width="340" height="245" fill="#0f172a" stroke="#fb7185" stroke-width="1.5" rx="6"/>
    <text x="565" y="50" fill="#fb7185" font-size="11" font-weight="700" text-anchor="middle">2. Fatal Errors (Non-Retryable)</text>
    
    <rect x="405" y="70" width="320" height="50" fill="#1e293b" rx="4"/>
    <text x="415" y="90" fill="#fb7185" font-size="8" font-weight="700">401 AuthenticationError:</text>
    <text x="415" y="108" fill="#cbd5e1" font-size="7">Invalid ANTHROPIC_API_KEY. Prompt engineer/user immediately.</text>

    <rect x="405" y="130" width="320" height="50" fill="#1e293b" rx="4"/>
    <text x="415" y="150" fill="#fb7185" font-size="8" font-weight="700">400 BadRequestError / InvalidRequestError:</text>
    <text x="415" y="168" fill="#cbd5e1" font-size="7">Malformed schema, missing required params, or context window overflow.</text>

    <text x="565" y="235" fill="#fb7185" font-size="8" font-weight="700" text-anchor="middle">Action: Raise Fatal Exception &amp; Abort</text>
  </g>
</svg>
