<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things feature engineering is not</title>
  <style>
    .feat-not-bg   { fill: #f8fafc; }
    .feat-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feat-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feat-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feat-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feat-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feat-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .feat-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .feat-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .feat-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .feat-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .feat-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .feat-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .feat-not-row { opacity: 1; }
    .feat-not-r0 { animation-delay: 0.00s; }
    .feat-not-r1 { animation-delay: 0.45s; }
    .feat-not-r2 { animation-delay: 0.90s; }
    .feat-not-r3 { animation-delay: 1.35s; }
    .feat-not-r4 { animation-delay: 1.80s; }
    .feat-not-row { animation: feat-not-reveal 7.3s ease-in-out infinite; }
    @keyframes feat-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="feat-not-bg" width="980" height="390"/>
  <text class="feat-not-h1"  x="30" y="40">Four things feature engineering is not</text>
  <text class="feat-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="feat-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="feat-not-name" x="46" y="122">The misconception</text>
  <text class="feat-not-desc" x="46" y="142">Commonly held.</text>
  <text class="feat-not-desc feat-not-row feat-not-r0" x="46" y="182">More features means a better model</text>
  <text class="feat-not-desc feat-not-row feat-not-r1" x="46" y="216">Deep learning removes the need</text>
  <text class="feat-not-desc feat-not-row feat-not-r2" x="46" y="250">A high score proves the features are good</text>
  <text class="feat-not-desc feat-not-row feat-not-r3" x="46" y="284">Any available column can be a feature</text>
  <text class="feat-not-desc feat-not-row feat-not-r4" x="46" y="318">Feature importance shows causation</text>
  <rect class="feat-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="feat-not-name" x="526" y="122">What is true</text>
  <text class="feat-not-desc" x="526" y="142">Actually.</text>
  <text class="feat-not-desc feat-not-row feat-not-r0" x="526" y="182">Irrelevant features add noise and cost</text>
  <text class="feat-not-desc feat-not-row feat-not-r1" x="526" y="216">It helps for text and images, less for tables</text>
  <text class="feat-not-desc feat-not-row feat-not-r2" x="526" y="250">It may indicate leakage</text>
  <text class="feat-not-desc feat-not-row feat-not-r3" x="526" y="284">Only what exists at prediction time</text>
  <text class="feat-not-desc feat-not-row feat-not-r4" x="526" y="318">It shows what the model used</text>
  <text class="feat-not-sub" x="30" y="372">A suspiciously high score being a leakage symptom rather than a success is worth treating as the default hypothesis, because it usually is.</text>
</svg>
