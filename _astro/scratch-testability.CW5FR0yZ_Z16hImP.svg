<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three properties, all measurable.">
  <title>What owning the loop buys</title>
  <style>
    .scratch-testability-bg   { fill: #f8fafc; }
    .scratch-testability-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-testability-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-testability-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-testability-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-testability-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-testability-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scratch-testability-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scratch-testability-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scratch-testability-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scratch-testability-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scratch-testability-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scratch-testability-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .scratch-testability-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .scratch-testability-stage { opacity: 1; }

    .scratch-testability-s0 { animation-delay: 0.00s; }
    .scratch-testability-e0 { animation-delay: 0.00s; }
    .scratch-testability-s1 { animation-delay: 1.50s; }
    .scratch-testability-e1 { animation-delay: 1.50s; }
    .scratch-testability-s2 { animation-delay: 3.00s; }
    .scratch-testability-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .scratch-testability-conn  { animation: scratch-testability-trace 6s ease-in-out infinite; }
      .scratch-testability-stage { animation: scratch-testability-arrive 6s ease-in-out infinite; }
    }
    @keyframes scratch-testability-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes scratch-testability-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .scratch-testability-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .scratch-testability-stage { animation: scratch-testability-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes scratch-testability-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="scratch-testability-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="scratch-testability-bg" width="980" height="322"/>
  <text class="scratch-testability-h1"  x="30" y="40">What owning the loop buys</text>
  <text class="scratch-testability-sub" x="30" y="64">Three properties, all measurable.</text>
  <g class="scratch-testability-stage scratch-testability-s0">
    <rect class="scratch-testability-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="scratch-testability-step" x="44" y="142">01</text>
    <text class="scratch-testability-name" x="70" y="142">Every prompt is inspectable</text>
    <text class="scratch-testability-desc" x="44" y="166">Which makes token cost an engineering</text>
    <text class="scratch-testability-desc" x="44" y="182">variable rather than a surprise.</text>
  </g>
  <line class="scratch-testability-line scratch-testability-conn scratch-testability-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#scratch-testability-tip)"/>
  <g class="scratch-testability-stage scratch-testability-s1">
    <rect class="scratch-testability-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="scratch-testability-step" x="359" y="142">02</text>
    <text class="scratch-testability-name" x="385" y="142">Overhead under 150 microseconds</text>
    <text class="scratch-testability-desc" x="359" y="166">No async reflection, no meta-programming, no</text>
    <text class="scratch-testability-desc" x="359" y="182">logging cascade.</text>
    <text class="scratch-testability-edge" x="359" y="242">0.15 ms</text>
  </g>
  <line class="scratch-testability-line scratch-testability-conn scratch-testability-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#scratch-testability-tip)"/>
  <g class="scratch-testability-stage scratch-testability-s2">
    <rect class="scratch-testability-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="scratch-testability-step" x="674" y="142">03</text>
    <text class="scratch-testability-name" x="700" y="142">Tests run offline in seconds</text>
    <text class="scratch-testability-desc" x="674" y="166">A mocked gateway turns agent behaviour into</text>
    <text class="scratch-testability-desc" x="674" y="182">an ordinary unit test.</text>
  </g>
  <text class="scratch-testability-sub" x="30" y="304">The third is the one that compounds: agents are hard to test precisely because the model is non-deterministic, and a stubbed gateway makes everything except the model deterministic again.</text>
</svg>
