<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Beginning and end are read best.">
  <title>Position affects accuracy</title>
  <style>
    .lost-middle-bg   { fill: #f8fafc; }
    .lost-middle-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lost-middle-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lost-middle-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lost-middle-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lost-middle-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lost-middle-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lost-middle-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .lost-middle-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .lost-middle-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .lost-middle-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .lost-middle-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .lost-middle-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .lost-middle-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .lost-middle-stage { opacity: 1; }

    .lost-middle-s0 { animation-delay: 0.00s; }
    .lost-middle-e0 { animation-delay: 0.00s; }
    .lost-middle-s1 { animation-delay: 1.28s; }
    .lost-middle-e1 { animation-delay: 1.28s; }
    .lost-middle-s2 { animation-delay: 2.56s; }
    .lost-middle-e2 { animation-delay: 2.56s; }
    .lost-middle-s3 { animation-delay: 3.84s; }
    .lost-middle-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .lost-middle-conn  { animation: lost-middle-trace 6.4s ease-in-out infinite; }
      .lost-middle-stage { animation: lost-middle-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes lost-middle-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes lost-middle-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .lost-middle-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .lost-middle-stage { animation: lost-middle-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes lost-middle-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="lost-middle-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="lost-middle-bg" width="980" height="322"/>
  <text class="lost-middle-h1"  x="30" y="40">Position affects accuracy</text>
  <text class="lost-middle-sub" x="30" y="64">Beginning and end are read best.</text>
  <g class="lost-middle-stage lost-middle-s0">
    <rect class="lost-middle-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="lost-middle-step" x="44" y="142">01</text>
    <text class="lost-middle-name" x="70" y="142">Information at the start is used reliably</text>
    <text class="lost-middle-desc" x="44" y="166">Instructions belong here.</text>
  </g>
  <line class="lost-middle-line lost-middle-conn lost-middle-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#lost-middle-tip)"/>
  <g class="lost-middle-stage lost-middle-s1">
    <rect class="lost-middle-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="lost-middle-step" x="280" y="142">02</text>
    <text class="lost-middle-name" x="306" y="142">Information in the middle is used least</text>
    <text class="lost-middle-desc" x="280" y="166">Measurably, and the effect is</text>
    <text class="lost-middle-desc" x="280" y="182">large.</text>
  </g>
  <line class="lost-middle-line lost-middle-conn lost-middle-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#lost-middle-tip)"/>
  <g class="lost-middle-stage lost-middle-s2">
    <rect class="lost-middle-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="lost-middle-step" x="516" y="142">03</text>
    <text class="lost-middle-name" x="542" y="142">Information at the end is used well again</text>
    <text class="lost-middle-desc" x="516" y="166">Recency, as well as primacy.</text>
  </g>
  <line class="lost-middle-line lost-middle-conn lost-middle-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#lost-middle-tip)"/>
  <g class="lost-middle-stage lost-middle-s3">
    <rect class="lost-middle-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="lost-middle-step" x="752" y="142">04</text>
    <text class="lost-middle-name" x="778" y="142">So place what matters at the edges</text>
    <text class="lost-middle-desc" x="752" y="166">And keep the context short</text>
    <text class="lost-middle-desc" x="752" y="182">enough to have no middle.</text>
  </g>
  <text class="lost-middle-sub" x="30" y="304">This turns prompt layout into a correctness question rather than a matter of taste, and it is a strong argument for retrieving less rather than supplying more.</text>
</svg>
