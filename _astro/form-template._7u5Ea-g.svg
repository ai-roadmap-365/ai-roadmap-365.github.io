<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Declared rather than assembled.">
  <title>A form with named fields</title>
  <style>
    .form-template-bg   { fill: #f8fafc; }
    .form-template-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .form-template-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .form-template-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .form-template-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .form-template-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .form-template-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .form-template-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .form-template-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .form-template-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .form-template-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .form-template-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .form-template-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .form-template-row { opacity: 1; }
    .form-template-r0 { animation-delay: 0.00s; }
    .form-template-r1 { animation-delay: 0.45s; }
    .form-template-r2 { animation-delay: 0.90s; }
    .form-template-r3 { animation-delay: 1.35s; }
    .form-template-r4 { animation-delay: 1.80s; }
    .form-template-row { animation: form-template-reveal 7.3s ease-in-out infinite; }
    @keyframes form-template-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="form-template-bg" width="980" height="390"/>
  <text class="form-template-h1"  x="30" y="40">A form with named fields</text>
  <text class="form-template-sub" x="30" y="64">Declared rather than assembled.</text>
  <rect class="form-template-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="form-template-name" x="46" y="122">Written by hand</text>
  <text class="form-template-desc" x="46" y="142">Every time.</text>
  <text class="form-template-desc form-template-row form-template-r0" x="46" y="182">Each field assigned explicitly</text>
  <text class="form-template-desc form-template-row form-template-r1" x="46" y="216">Comparison written out</text>
  <text class="form-template-desc form-template-row form-template-r2" x="46" y="250">Printing written out</text>
  <text class="form-template-desc form-template-row form-template-r3" x="46" y="284">Easy to miss one when adding a field</text>
  <text class="form-template-desc form-template-row form-template-r4" x="46" y="318">This is a hand-written class</text>
  <rect class="form-template-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="form-template-name" x="526" y="122">Declared once</text>
  <text class="form-template-desc" x="526" y="142">Generated.</text>
  <text class="form-template-desc form-template-row form-template-r0" x="526" y="182">Fields listed with their types</text>
  <text class="form-template-desc form-template-row form-template-r1" x="526" y="216">Comparison generated</text>
  <text class="form-template-desc form-template-row form-template-r2" x="526" y="250">Printing generated</text>
  <text class="form-template-desc form-template-row form-template-r3" x="526" y="284">Adding a field updates everything</text>
  <text class="form-template-desc form-template-row form-template-r4" x="526" y="318">This is a dataclass</text>
  <text class="form-template-sub" x="30" y="372">Missing one place when adding a field is the specific bug this removes, and it is common enough in hand-written records to justify the decorator on its own.</text>
</svg>
