<svg role="img" aria-label="Bahdanau Additive Attention mechanism showing dynamic soft attention weights connecting decoder query state to all encoder keys" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Bahdanau Additive Attention Alignment Mechanism</title>
  <defs>
    <linearGradient id="bg222b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card222b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg222b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">BAHDANAU ADDITIVE ATTENTION MECHANISM</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Dynamic Context Vector c_t = Σ (α_t,i * h_i) Eliminating the Information Bottleneck</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card222b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Encoder Hidden States h_1, h_2, h_3, h_4 at Bottom -->
    <rect x="50" y="210" width="400" height="65" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="250" y="230" fill="#38bdf8" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">Encoder Memory Bank: [ h_1, h_2, h_3, h_4 ]</text>
    
    <circle cx="100" cy="255" r="14" fill="#38bdf8"/>
    <text x="100" y="259" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">h_1</text>
    
    <circle cx="200" cy="255" r="14" fill="#38bdf8"/>
    <text x="200" y="259" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">h_2</text>
    
    <circle cx="300" cy="255" r="14" fill="#38bdf8"/>
    <text x="300" y="259" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">h_3</text>
    
    <circle cx="400" cy="255" r="14" fill="#38bdf8"/>
    <text x="400" y="259" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">h_4</text>

    <!-- Decoder State s_{t-1} at Right -->
    <rect x="520" y="210" width="190" height="65" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" rx="6"/>
    <text x="615" y="230" fill="#c084fc" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">Decoder Query: s_{t-1}</text>
    <circle cx="615" cy="255" r="14" fill="#a855f7"/>
    <text x="615" y="259" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">s_{t-1}</text>

    <!-- Attention Alignment Engine in Center -->
    <rect x="180" y="105" width="400" height="65" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="380" y="125" fill="#fbbf24" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">Alignment Score: e_{t,i} = v_a^T tanh(W_a s_{t-1} + U_a h_i)</text>
    <text x="380" y="150" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Softmax Attention Weights: α_{t,i} = exp(e_{t,i}) / Σ exp(e_{t,j})</text>

    <!-- Connectors -->
    <line x1="250" y1="210" x2="280" y2="170" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="615" y1="210" x2="480" y2="170" stroke="#a855f7" stroke-width="1.5"/>

    <!-- Dynamic Context Vector Output at Top -->
    <rect x="250" y="20" width="260" height="55" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="380" y="40" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Dynamic Context Vector: c_t</text>
    <text x="380" y="60" fill="#f8fafc" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">c_t = 0.05 h_1 + 0.85 h_2 + 0.08 h_3 + 0.02 h_4</text>
    <line x1="380" y1="105" x2="380" y2="75" stroke="#10b981" stroke-width="2.5"/>
  </g>
</svg>
