<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One is filtered; one is earned.">
  <title>Single-turn against multi-turn</title>
  <style>
    .single-or-multi-turn-bg   { fill: #f8fafc; }
    .single-or-multi-turn-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .single-or-multi-turn-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .single-or-multi-turn-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .single-or-multi-turn-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .single-or-multi-turn-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .single-or-multi-turn-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .single-or-multi-turn-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .single-or-multi-turn-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .single-or-multi-turn-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .single-or-multi-turn-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .single-or-multi-turn-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .single-or-multi-turn-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .single-or-multi-turn-row { opacity: 1; }
    .single-or-multi-turn-r0 { animation-delay: 0.00s; }
    .single-or-multi-turn-r1 { animation-delay: 0.45s; }
    .single-or-multi-turn-r2 { animation-delay: 0.90s; }
    .single-or-multi-turn-r3 { animation-delay: 1.35s; }
    .single-or-multi-turn-r4 { animation-delay: 1.80s; }
    .single-or-multi-turn-row { animation: single-or-multi-turn-reveal 7.3s ease-in-out infinite; }
    @keyframes single-or-multi-turn-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="single-or-multi-turn-bg" width="980" height="390"/>
  <text class="single-or-multi-turn-h1"  x="30" y="40">Single-turn against multi-turn</text>
  <text class="single-or-multi-turn-sub" x="30" y="64">One is filtered; one is earned.</text>
  <rect class="single-or-multi-turn-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="single-or-multi-turn-name" x="46" y="122">Single turn</text>
  <text class="single-or-multi-turn-desc" x="46" y="142">One prompt, one judgement.</text>
  <text class="single-or-multi-turn-desc single-or-multi-turn-row single-or-multi-turn-r0" x="46" y="182">"Ignore previous instructions"</text>
  <text class="single-or-multi-turn-desc single-or-multi-turn-row single-or-multi-turn-r1" x="46" y="216">Visible to an input firewall</text>
  <text class="single-or-multi-turn-desc single-or-multi-turn-row single-or-multi-turn-r2" x="46" y="250">Blocklists and classifiers apply</text>
  <text class="single-or-multi-turn-desc single-or-multi-turn-row single-or-multi-turn-r3" x="46" y="284">Caught by most defences today</text>
  <text class="single-or-multi-turn-desc single-or-multi-turn-row single-or-multi-turn-r4" x="46" y="318">The attack of 2022</text>
  <rect class="single-or-multi-turn-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="single-or-multi-turn-name" x="526" y="122">Multi-turn</text>
  <text class="single-or-multi-turn-desc" x="526" y="142">Four turns, none of them hostile.</text>
  <text class="single-or-multi-turn-desc single-or-multi-turn-row single-or-multi-turn-r0" x="526" y="182">Turns 1-3 establish a benign persona</text>
  <text class="single-or-multi-turn-desc single-or-multi-turn-row single-or-multi-turn-r1" x="526" y="216">Each individually passes every filter</text>
  <text class="single-or-multi-turn-desc single-or-multi-turn-row single-or-multi-turn-r2" x="526" y="250">Turn 4 pivots to execution</text>
  <text class="single-or-multi-turn-desc single-or-multi-turn-row single-or-multi-turn-r3" x="526" y="284">No single message is adversarial</text>
  <text class="single-or-multi-turn-desc single-or-multi-turn-row single-or-multi-turn-r4" x="526" y="318">Single-turn firewalls see nothing</text>
  <text class="single-or-multi-turn-sub" x="30" y="372">This is why a per-message filter is structurally unable to catch a crescendo: the attack is a property of the sequence, and every element of the sequence is innocuous when examined alone.</text>
</svg>
