<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Default stacking assumes equal shapes.">
  <title>Why sequences need a custom collate</title>
  <style>
    .collate-bg   { fill: #f8fafc; }
    .collate-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collate-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collate-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collate-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collate-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collate-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .collate-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .collate-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .collate-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .collate-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .collate-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .collate-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .collate-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .collate-stage { opacity: 1; }

    .collate-s0 { animation-delay: 0.00s; }
    .collate-e0 { animation-delay: 0.00s; }
    .collate-s1 { animation-delay: 1.28s; }
    .collate-e1 { animation-delay: 1.28s; }
    .collate-s2 { animation-delay: 2.56s; }
    .collate-e2 { animation-delay: 2.56s; }
    .collate-s3 { animation-delay: 3.84s; }
    .collate-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .collate-conn  { animation: collate-trace 6.4s ease-in-out infinite; }
      .collate-stage { animation: collate-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes collate-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes collate-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .collate-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .collate-stage { animation: collate-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes collate-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="collate-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="collate-bg" width="980" height="322"/>
  <text class="collate-h1"  x="30" y="40">Why sequences need a custom collate</text>
  <text class="collate-sub" x="30" y="64">Default stacking assumes equal shapes.</text>
  <g class="collate-stage collate-s0">
    <rect class="collate-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="collate-step" x="44" y="142">01</text>
    <text class="collate-name" x="70" y="142">The default stacks along a new dimension</text>
    <text class="collate-desc" x="44" y="166">Which requires every sample to</text>
    <text class="collate-desc" x="44" y="182">have the same shape.</text>
  </g>
  <line class="collate-line collate-conn collate-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#collate-tip)"/>
  <g class="collate-stage collate-s1">
    <rect class="collate-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="collate-step" x="280" y="142">02</text>
    <text class="collate-name" x="306" y="142">Text does not</text>
    <text class="collate-desc" x="280" y="166">Sentences differ in length.</text>
    <text class="collate-desc" x="280" y="182">Stacking fails immediately.</text>
  </g>
  <line class="collate-line collate-conn collate-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#collate-tip)"/>
  <g class="collate-stage collate-s2">
    <rect class="collate-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="collate-step" x="516" y="142">03</text>
    <text class="collate-name" x="542" y="142">Pad to the longest in the batch</text>
    <text class="collate-desc" x="516" y="166">Not to a global maximum —</text>
    <text class="collate-desc" x="516" y="182">per-batch padding wastes far</text>
    <text class="collate-desc" x="516" y="198">less.</text>
  </g>
  <line class="collate-line collate-conn collate-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#collate-tip)"/>
  <g class="collate-stage collate-s3">
    <rect class="collate-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="collate-step" x="752" y="142">04</text>
    <text class="collate-name" x="778" y="142">And return a mask</text>
    <text class="collate-desc" x="752" y="166">So the model knows which</text>
    <text class="collate-desc" x="752" y="182">positions are real.</text>
  </g>
  <text class="collate-sub" x="30" y="304">Padding per batch rather than globally is a substantial saving in language work: a batch of short sentences pads to a short length, and a global maximum would pad everything to the longest document in the corpus.</text>
</svg>
