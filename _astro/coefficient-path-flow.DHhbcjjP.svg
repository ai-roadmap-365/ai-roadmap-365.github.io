<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="d151f-title d151f-desc" width="1100" height="700">
  <title id="d151f-title">The coefficient path: lasso's bars fall to exactly zero in sequence, ridge's never do</title>
  <desc id="d151f-desc">Ten coefficient bars for each of two models -- ridge and lasso -- as alpha rises left to right. Lasso's bars shrink and, one at a time in order, drop to exactly zero and stay there. Ridge's bars shrink together but every one stays visibly above zero at every step.</desc>
  <style>
    .d151f-bg { fill: #f8fafc; }
    .d151f-title { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 24px; font-weight: 700; }
    .d151f-sub { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14.5px; }
    .d151f-head { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 700; }
    .d151f-label { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; }
    .d151f-muted { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; }
    .d151f-axis { stroke: #94a3b8; stroke-width: 1.5; }
    .d151f-baseline { stroke: #1a202c; stroke-width: 1.5; }
    .d151f-panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }

    /* Ridge bars: shrink together, always visibly above the baseline */
    .d151f-ridgebar { fill: #93c5fd; stroke: #1d4ed8; stroke-width: 1.5; transform-box: fill-box; transform-origin: bottom; animation: d151f-shrink-ridge 8s ease-in-out infinite; }
    @keyframes d151f-shrink-ridge {
      0%, 8%   { transform: scaleY(1); }
      45%      { transform: scaleY(0.55); }
      100%     { transform: scaleY(0.55); }
    }

    /* Lasso bars: shrink further, and the marked ones drop to zero and STAY at zero */
    .d151f-lassobar { fill: #bfdbfe; stroke: #1d4ed8; stroke-width: 1.5; transform-box: fill-box; transform-origin: bottom; animation: d151f-shrink-lasso 8s ease-in-out infinite; }
    @keyframes d151f-shrink-lasso {
      0%, 8%   { transform: scaleY(1); }
      45%      { transform: scaleY(0.32); }
      100%     { transform: scaleY(0.32); }
    }
    .d151f-lassozero { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4 3; transform-box: fill-box; transform-origin: bottom; animation: d151f-drop-zero 8s ease-in-out infinite; }
    @keyframes d151f-drop-zero {
      0%, 8%   { transform: scaleY(1); fill: #bfdbfe; stroke: #1d4ed8; stroke-dasharray: 0; }
      55%      { transform: scaleY(0.001); fill: #e2e8f0; stroke: #94a3b8; stroke-dasharray: 4 3; }
      100%     { transform: scaleY(0.001); fill: #e2e8f0; stroke: #94a3b8; stroke-dasharray: 4 3; }
    }
    .d151f-z1 { animation-delay: 0s; }
    .d151f-z2 { animation-delay: 0.6s; }
    .d151f-z3 { animation-delay: 1.2s; }
    .d151f-z4 { animation-delay: 1.8s; }
    .d151f-z5 { animation-delay: 2.4s; }
    .d151f-z6 { animation-delay: 3.0s; }
    .d151f-z7 { animation-delay: 3.6s; }
    .d151f-z8 { animation-delay: 4.2s; }

    /* alpha marker sweeping left to right beneath both panels */
    .d151f-marker { fill: #1d4ed8; }
    .d151f-markerwrap { animation: d151f-sweep 8s ease-in-out infinite; }
    @keyframes d151f-sweep {
      0%, 8%  { transform: translateX(0px); }
      100%    { transform: translateX(430px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .d151f-ridgebar { animation: none; transform: scaleY(0.55); }
      .d151f-lassobar { animation: none; transform: scaleY(0.32); }
      .d151f-lassozero { animation: none; transform: scaleY(0.001); fill: #e2e8f0; stroke: #94a3b8; stroke-dasharray: 4 3; }
      .d151f-markerwrap { animation: none; transform: translateX(430px); }
    }
  </style>
  <rect class="d151f-bg" x="0" y="0" width="1100" height="700"/>

  <text class="d151f-title" x="550" y="36" text-anchor="middle">As alpha rises: ridge shrinks everything, lasso empties bags</text>
  <text class="d151f-sub" x="550" y="58" text-anchor="middle">Ten coefficients per model. Watch which bars ever reach the dashed floor.</text>

  <!-- RIDGE PANEL -->
  <rect class="d151f-panel" x="40" y="86" width="480" height="330" rx="10"/>
  <text class="d151f-head" x="280" y="114" text-anchor="middle">RIDGE -- shrinks together, none reach zero</text>
  <line class="d151f-baseline" x1="70" y1="380" x2="490" y2="380"/>
  <g>
    <!-- 10 ridge bars, evenly spaced, all shrinking but staying above the floor -->
    <rect class="d151f-ridgebar" x="75"  y="240" width="30" height="140"/>
    <rect class="d151f-ridgebar" x="117" y="220" width="30" height="160"/>
    <rect class="d151f-ridgebar" x="159" y="260" width="30" height="120"/>
    <rect class="d151f-ridgebar" x="201" y="200" width="30" height="180"/>
    <rect class="d151f-ridgebar" x="243" y="250" width="30" height="130"/>
    <rect class="d151f-ridgebar" x="285" y="270" width="30" height="110"/>
    <rect class="d151f-ridgebar" x="327" y="230" width="30" height="150"/>
    <rect class="d151f-ridgebar" x="369" y="255" width="30" height="125"/>
    <rect class="d151f-ridgebar" x="411" y="210" width="30" height="170"/>
    <rect class="d151f-ridgebar" x="453" y="265" width="30" height="115"/>
  </g>
  <text class="d151f-muted" x="70" y="400">alpha: 0.001</text>
  <g class="d151f-markerwrap">
    <path class="d151f-marker" d="M 70 405 L 60 418 L 80 418 Z"/>
  </g>
  <text class="d151f-muted" x="440" y="400" text-anchor="end">alpha: 100</text>

  <!-- LASSO PANEL -->
  <rect class="d151f-panel" x="580" y="86" width="480" height="330" rx="10"/>
  <text class="d151f-head" x="820" y="114" text-anchor="middle">LASSO -- some bars hit the floor and stay there</text>
  <line class="d151f-baseline" x1="610" y1="380" x2="1030" y2="380"/>
  <g>
    <!-- 8 of 10 lasso bars reach exactly zero, staggered; 2 (bp, bmi) stay -->
    <rect class="d151f-lassozero d151f-z1" x="615" y="240" width="30" height="140"/>
    <rect class="d151f-lassozero d151f-z2" x="657" y="220" width="30" height="160"/>
    <rect class="d151f-lassozero d151f-z3" x="699" y="260" width="30" height="120"/>
    <rect class="d151f-lassozero d151f-z4" x="741" y="200" width="30" height="180"/>
    <rect class="d151f-lassozero d151f-z5" x="783" y="250" width="30" height="130"/>
    <rect class="d151f-lassozero d151f-z6" x="825" y="270" width="30" height="110"/>
    <rect class="d151f-lassozero d151f-z7" x="867" y="230" width="30" height="150"/>
    <rect class="d151f-lassozero d151f-z8" x="909" y="255" width="30" height="125"/>
    <rect class="d151f-lassobar" x="951" y="210" width="30" height="170"/>
    <rect class="d151f-lassobar" x="993" y="265" width="30" height="115"/>
  </g>
  <text class="d151f-muted" x="610" y="400">alpha: 0.001</text>
  <g class="d151f-markerwrap">
    <path class="d151f-marker" d="M 610 405 L 600 418 L 620 418 Z"/>
  </g>
  <text class="d151f-muted" x="980" y="400" text-anchor="end">alpha: 100</text>

  <!-- static measured summary, always readable, carries the whole result -->
  <rect class="d151f-panel" x="40" y="440" width="1020" height="230" rx="10"/>
  <text class="d151f-head" x="60" y="470">Measured, across a 60-point sweep from alpha=0.001 to alpha=100:</text>
  <text class="d151f-label" x="60" y="500">-  Every one of lasso's 10 coefficients hits EXACTLY zero somewhere in the sweep.</text>
  <text class="d151f-label" x="60" y="524">-  Not one of ridge's 10 coefficients ever hits zero, at any alpha in the same sweep.</text>
  <text class="d151f-label" x="60" y="548">-  The order is not arbitrary: s3 zeros FIRST, at alpha=0.0032. bmi zeros LAST, at alpha=2.4538.</text>
  <text class="d151f-label" x="60" y="572">-  At alpha=1.0 on the real diabetes split: lasso has zeroed 8 of 10 coefficients (test R2 0.2782);</text>
  <text class="d151f-label" x="80" y="594">ridge has zeroed 0 of 10 (test R2 0.3570).</text>
  <text class="d151f-muted" x="60" y="626">A reader with motion turned off sees this final state directly: lasso's eight shaded, dashed-outline</text>
  <text class="d151f-muted" x="60" y="646">bars are at the floor; its two solid bars and every one of ridge's ten bars sit above it.</text>
</svg>
