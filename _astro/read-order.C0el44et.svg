<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The order reads backwards</title>
  <style>
    .read-order-bg   { fill: #f8fafc; }
    .read-order-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .read-order-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .read-order-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .read-order-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .read-order-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .read-order-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .read-order-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .read-order-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .read-order-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .read-order-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .read-order-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .read-order-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .read-order-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .read-order-stage { opacity: 1; }

    .read-order-s0 { animation-delay: 0.00s; }
    .read-order-e0 { animation-delay: 0.00s; }
    .read-order-s1 { animation-delay: 1.28s; }
    .read-order-e1 { animation-delay: 1.28s; }
    .read-order-s2 { animation-delay: 2.56s; }
    .read-order-e2 { animation-delay: 2.56s; }
    .read-order-s3 { animation-delay: 3.84s; }
    .read-order-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .read-order-conn  { animation: read-order-trace 6.4s ease-in-out infinite; }
      .read-order-stage { animation: read-order-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes read-order-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes read-order-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .read-order-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .read-order-stage { animation: read-order-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes read-order-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="read-order-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="read-order-bg" width="980" height="322"/>
  <text class="read-order-h1"  x="30" y="40">The order reads backwards</text>
  <text class="read-order-sub" x="30" y="64">Four steps.</text>
  <g class="read-order-stage read-order-s0">
    <rect class="read-order-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="read-order-step" x="44" y="142">01</text>
    <text class="read-order-name" x="70" y="142">Written as one matrix times another times a vector</text>
    <text class="read-order-desc" x="44" y="166">Left to right on the page.</text>
  </g>
  <line class="read-order-line read-order-conn read-order-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#read-order-tip)"/>
  <g class="read-order-stage read-order-s1">
    <rect class="read-order-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="read-order-step" x="280" y="142">02</text>
    <text class="read-order-name" x="306" y="142">But the rightmost acts on the vector first</text>
    <text class="read-order-desc" x="280" y="166">Then the next, and so on.</text>
  </g>
  <line class="read-order-line read-order-conn read-order-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#read-order-tip)"/>
  <g class="read-order-stage read-order-s2">
    <rect class="read-order-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="read-order-step" x="516" y="142">03</text>
    <text class="read-order-name" x="542" y="142">So the sequence reads right to left</text>
    <text class="read-order-desc" x="516" y="166">Opposite to how it is written.</text>
  </g>
  <line class="read-order-line read-order-conn read-order-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#read-order-tip)"/>
  <g class="read-order-stage read-order-s3">
    <rect class="read-order-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="read-order-step" x="752" y="142">04</text>
    <text class="read-order-name" x="778" y="142">Which is why layer order and matrix order look reversed</text>
    <text class="read-order-desc" x="752" y="166">In every framework.</text>
  </g>
  <text class="read-order-sub" x="30" y="304">This single reversal accounts for a large share of confusion when reading model code, and naming it explicitly usually resolves it permanently.</text>
</svg>
