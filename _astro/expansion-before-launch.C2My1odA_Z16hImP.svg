<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Step 2 of the loop, in detail — and the source of most surprises.">
  <title>The shell rewrites your line before anything runs</title>
  <style>
    .expansion-before-launch-bg   { fill: #f8fafc; }
    .expansion-before-launch-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .expansion-before-launch-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .expansion-before-launch-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .expansion-before-launch-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .expansion-before-launch-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .expansion-before-launch-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .expansion-before-launch-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .expansion-before-launch-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .expansion-before-launch-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .expansion-before-launch-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .expansion-before-launch-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .expansion-before-launch-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .expansion-before-launch-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .expansion-before-launch-stage { opacity: 1; }

    .expansion-before-launch-s0 { animation-delay: 0.00s; }
    .expansion-before-launch-e0 { animation-delay: 0.00s; }
    .expansion-before-launch-s1 { animation-delay: 1.28s; }
    .expansion-before-launch-e1 { animation-delay: 1.28s; }
    .expansion-before-launch-s2 { animation-delay: 2.56s; }
    .expansion-before-launch-e2 { animation-delay: 2.56s; }
    .expansion-before-launch-s3 { animation-delay: 3.84s; }
    .expansion-before-launch-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .expansion-before-launch-conn  { animation: expansion-before-launch-trace 6.4s ease-in-out infinite; }
      .expansion-before-launch-stage { animation: expansion-before-launch-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes expansion-before-launch-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes expansion-before-launch-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .expansion-before-launch-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .expansion-before-launch-stage { animation: expansion-before-launch-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes expansion-before-launch-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="expansion-before-launch-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="expansion-before-launch-bg" width="980" height="322"/>
  <text class="expansion-before-launch-h1"  x="30" y="40">The shell rewrites your line before anything runs</text>
  <text class="expansion-before-launch-sub" x="30" y="64">Step 2 of the loop, in detail — and the source of most surprises.</text>
  <g class="expansion-before-launch-stage expansion-before-launch-s0">
    <rect class="expansion-before-launch-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="expansion-before-launch-step" x="44" y="142">01</text>
    <text class="expansion-before-launch-name" x="70" y="142">Tilde becomes home</text>
    <text class="expansion-before-launch-desc" x="44" y="166">~/data turns into</text>
    <text class="expansion-before-launch-desc" x="44" y="182">/Users/you/data before the</text>
    <text class="expansion-before-launch-desc" x="44" y="198">program sees it.</text>
    <text class="expansion-before-launch-edge" x="44" y="242">~</text>
  </g>
  <line class="expansion-before-launch-line expansion-before-launch-conn expansion-before-launch-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#expansion-before-launch-tip)"/>
  <g class="expansion-before-launch-stage expansion-before-launch-s1">
    <rect class="expansion-before-launch-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="expansion-before-launch-step" x="280" y="142">02</text>
    <text class="expansion-before-launch-name" x="306" y="142">Variables become values</text>
    <text class="expansion-before-launch-desc" x="280" y="166">$HOME is replaced by its</text>
    <text class="expansion-before-launch-desc" x="280" y="182">contents, not passed along as a</text>
    <text class="expansion-before-launch-desc" x="280" y="198">name.</text>
    <text class="expansion-before-launch-edge" x="280" y="242">$VAR</text>
  </g>
  <line class="expansion-before-launch-line expansion-before-launch-conn expansion-before-launch-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#expansion-before-launch-tip)"/>
  <g class="expansion-before-launch-stage expansion-before-launch-s2">
    <rect class="expansion-before-launch-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="expansion-before-launch-step" x="516" y="142">03</text>
    <text class="expansion-before-launch-name" x="542" y="142">Wildcards become filenames</text>
    <text class="expansion-before-launch-desc" x="516" y="166">*.csv becomes the actual list of</text>
    <text class="expansion-before-launch-desc" x="516" y="182">matching files, expanded by the</text>
    <text class="expansion-before-launch-desc" x="516" y="198">shell.</text>
    <text class="expansion-before-launch-edge" x="516" y="242">*</text>
  </g>
  <line class="expansion-before-launch-line expansion-before-launch-conn expansion-before-launch-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#expansion-before-launch-tip)"/>
  <g class="expansion-before-launch-stage expansion-before-launch-s3">
    <rect class="expansion-before-launch-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="expansion-before-launch-step" x="752" y="142">04</text>
    <text class="expansion-before-launch-name" x="778" y="142">Then the program starts</text>
    <text class="expansion-before-launch-desc" x="752" y="166">It receives the finished words.</text>
    <text class="expansion-before-launch-desc" x="752" y="182">It never saw the star.</text>
  </g>
  <text class="expansion-before-launch-sub" x="30" y="304">This is why quoting matters: "*.csv" in quotes reaches the program unexpanded, and some programs want it that way.</text>
</svg>
