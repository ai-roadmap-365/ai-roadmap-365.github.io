<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which is why a single rate is misleading.">
  <title>Four prices for one request</title>
  <style>
    .pricing-matrix-bg   { fill: #f8fafc; }
    .pricing-matrix-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pricing-matrix-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pricing-matrix-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pricing-matrix-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pricing-matrix-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pricing-matrix-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pricing-matrix-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pricing-matrix-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pricing-matrix-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pricing-matrix-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pricing-matrix-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pricing-matrix-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pricing-matrix-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pricing-matrix-stage { opacity: 1; }

    .pricing-matrix-s0 { animation-delay: 0.00s; }
    .pricing-matrix-e0 { animation-delay: 0.00s; }
    .pricing-matrix-s1 { animation-delay: 1.28s; }
    .pricing-matrix-e1 { animation-delay: 1.28s; }
    .pricing-matrix-s2 { animation-delay: 2.56s; }
    .pricing-matrix-e2 { animation-delay: 2.56s; }
    .pricing-matrix-s3 { animation-delay: 3.84s; }
    .pricing-matrix-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .pricing-matrix-conn  { animation: pricing-matrix-trace 6.4s ease-in-out infinite; }
      .pricing-matrix-stage { animation: pricing-matrix-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes pricing-matrix-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pricing-matrix-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pricing-matrix-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pricing-matrix-stage { animation: pricing-matrix-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pricing-matrix-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pricing-matrix-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pricing-matrix-bg" width="980" height="322"/>
  <text class="pricing-matrix-h1"  x="30" y="40">Four prices for one request</text>
  <text class="pricing-matrix-sub" x="30" y="64">Which is why a single rate is misleading.</text>
  <g class="pricing-matrix-stage pricing-matrix-s0">
    <rect class="pricing-matrix-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="pricing-matrix-step" x="44" y="142">01</text>
    <text class="pricing-matrix-name" x="70" y="142">Ordinary input tokens</text>
    <text class="pricing-matrix-desc" x="44" y="166">The baseline rate.</text>
  </g>
  <line class="pricing-matrix-line pricing-matrix-conn pricing-matrix-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#pricing-matrix-tip)"/>
  <g class="pricing-matrix-stage pricing-matrix-s1">
    <rect class="pricing-matrix-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="pricing-matrix-step" x="280" y="142">02</text>
    <text class="pricing-matrix-name" x="306" y="142">Cache writes</text>
    <text class="pricing-matrix-desc" x="280" y="166">A premium over input, paid once</text>
    <text class="pricing-matrix-desc" x="280" y="182">per prefix.</text>
  </g>
  <line class="pricing-matrix-line pricing-matrix-conn pricing-matrix-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#pricing-matrix-tip)"/>
  <g class="pricing-matrix-stage pricing-matrix-s2">
    <rect class="pricing-matrix-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="pricing-matrix-step" x="516" y="142">03</text>
    <text class="pricing-matrix-name" x="542" y="142">Cache reads</text>
    <text class="pricing-matrix-desc" x="516" y="166">A fraction of the input rate.</text>
    <text class="pricing-matrix-desc" x="516" y="182">Where the saving is.</text>
  </g>
  <line class="pricing-matrix-line pricing-matrix-conn pricing-matrix-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#pricing-matrix-tip)"/>
  <g class="pricing-matrix-stage pricing-matrix-s3">
    <rect class="pricing-matrix-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="pricing-matrix-step" x="752" y="142">04</text>
    <text class="pricing-matrix-name" x="778" y="142">Output tokens</text>
    <text class="pricing-matrix-desc" x="752" y="166">Several times the input rate,</text>
    <text class="pricing-matrix-desc" x="752" y="182">always.</text>
    <text class="pricing-matrix-edge" x="752" y="242">the expensive one</text>
  </g>
  <text class="pricing-matrix-sub" x="30" y="304">Output being the expensive direction is the fact to design around: an instruction to answer briefly is a larger cost lever than most prompt-shortening work.</text>
</svg>
