<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="End-to-End Production AI Serving Architecture">
  <title>End-to-End Production AI Serving Architecture</title>
  <defs>
    <style>
      .d336a-bg { fill: #f8fafc; }
      .d336a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d336a-gtw { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d336a-pod { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d336a-mon { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d336a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d336a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d336a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d336a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d336a-bg" />
  
  <text x="40" y="40" class="d336a-title">Production AI Serving System Architecture</text>
  <text x="40" y="65" class="d336a-subtitle">End-to-End Production AI Serving Architecture showing Client Requests hitting AI Gateway Reverse Proxy with LOR Load Balancing, Multi-Replica vLLM GPU Pods, Prometheus Telemetry, and Circuit Breaker Failover</text>
  
  <!-- AI Gateway -->
  <rect x="40" y="110" width="240" height="270" class="d336a-gtw" />
  <text x="55" y="145" class="d336a-header" fill="#1d4ed8">1. AI Reverse Proxy Gateway</text>
  <text x="55" y="180" class="d336a-text">• API Key Auth &amp; Rate Limiting</text>
  <text x="55" y="205" class="d336a-text">• **Load Balancer:**</text>
  <text x="55" y="225" class="d336a-text">  Least-Outstanding-Requests (LOR)</text>
  <text x="55" y="255" class="d336a-text">• **Circuit Breaker:** Fail-fast on 500s</text>
  <text x="55" y="295" class="d336a-text" font-weight="600" fill="#1d4ed8">Intelligent Traffic Routing</text>
  <text x="55" y="320" class="d336a-text">Prevents replica congestion</text>
  
  <!-- Multi-Replica Pods -->
  <rect x="315" y="110" width="240" height="270" class="d336a-pod" />
  <text x="330" y="145" class="d336a-header" fill="#7e22ce">2. Multi-Replica GPU Pods</text>
  <text x="330" y="180" class="d336a-text">• Pod 1: vLLM (Active: 4 streams)</text>
  <text x="330" y="205" class="d336a-text">• Pod 2: vLLM (Active: 12 streams)</text>
  <text x="330" y="230" class="d336a-text">• Pod 3: vLLM (Active: 2 streams)</text>
  <text x="330" y="260" class="d336a-text">• Startup / Readiness Probes</text>
  <text x="330" y="295" class="d336a-text" font-weight="600" fill="#7e22ce">Continuous Serving</text>
  <text x="330" y="320" class="d336a-text">Zero-downtime rolling updates</text>
  
  <!-- Telemetry & SRE -->
  <rect x="590" y="110" width="270" height="270" class="d336a-mon" />
  <text x="605" y="145" class="d336a-header" fill="#15803d">3. Telemetry &amp; SRE Observability</text>
  <text x="605" y="180" class="d336a-text">• **Time-to-First-Token (TTFT):** 140ms</text>
  <text x="605" y="205" class="d336a-text">• **Inter-Token Latency (ITL):** 15ms</text>
  <text x="605" y="230" class="d336a-text">• **Queue Depth:** 0 waiting requests</text>
  <text x="605" y="255" class="d336a-text">• **Availability:** 99.99% SLA</text>
  <text x="605" y="295" class="d336a-text" font-weight="600" fill="#15803d">Full SRE Telemetry</text>
  <text x="605" y="320" class="d336a-text">Real-time Grafana dashboards</text>
</svg>