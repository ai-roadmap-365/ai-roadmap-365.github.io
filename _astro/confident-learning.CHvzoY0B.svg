<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Finding label errors</title>
  <style>
    .confident-learning-bg   { fill: #f8fafc; }
    .confident-learning-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .confident-learning-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .confident-learning-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .confident-learning-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .confident-learning-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .confident-learning-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .confident-learning-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .confident-learning-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .confident-learning-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .confident-learning-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .confident-learning-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .confident-learning-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .confident-learning-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .confident-learning-stage { opacity: 1; }

    .confident-learning-s0 { animation-delay: 0.00s; }
    .confident-learning-e0 { animation-delay: 0.00s; }
    .confident-learning-s1 { animation-delay: 1.28s; }
    .confident-learning-e1 { animation-delay: 1.28s; }
    .confident-learning-s2 { animation-delay: 2.56s; }
    .confident-learning-e2 { animation-delay: 2.56s; }
    .confident-learning-s3 { animation-delay: 3.84s; }
    .confident-learning-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .confident-learning-conn  { animation: confident-learning-trace 6.4s ease-in-out infinite; }
      .confident-learning-stage { animation: confident-learning-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes confident-learning-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes confident-learning-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .confident-learning-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .confident-learning-stage { animation: confident-learning-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes confident-learning-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="confident-learning-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="confident-learning-bg" width="980" height="322"/>
  <text class="confident-learning-h1"  x="30" y="40">Finding label errors</text>
  <text class="confident-learning-sub" x="30" y="64">Four steps.</text>
  <g class="confident-learning-stage confident-learning-s0">
    <rect class="confident-learning-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="confident-learning-step" x="44" y="142">01</text>
    <text class="confident-learning-name" x="70" y="142">Predict every example out of fold</text>
    <text class="confident-learning-desc" x="44" y="166">So no example influenced its own</text>
    <text class="confident-learning-desc" x="44" y="182">prediction.</text>
  </g>
  <line class="confident-learning-line confident-learning-conn confident-learning-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#confident-learning-tip)"/>
  <g class="confident-learning-stage confident-learning-s1">
    <rect class="confident-learning-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="confident-learning-step" x="280" y="142">02</text>
    <text class="confident-learning-name" x="306" y="142">Find cases where the model confidently disagrees with the label</text>
    <text class="confident-learning-desc" x="280" y="166">High confidence, different</text>
    <text class="confident-learning-desc" x="280" y="182">class.</text>
  </g>
  <line class="confident-learning-line confident-learning-conn confident-learning-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#confident-learning-tip)"/>
  <g class="confident-learning-stage confident-learning-s2">
    <rect class="confident-learning-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="confident-learning-step" x="516" y="142">03</text>
    <text class="confident-learning-name" x="542" y="142">Rank them by that confidence</text>
    <text class="confident-learning-desc" x="516" y="166">Which prioritises the likeliest</text>
    <text class="confident-learning-desc" x="516" y="182">errors.</text>
  </g>
  <line class="confident-learning-line confident-learning-conn confident-learning-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#confident-learning-tip)"/>
  <g class="confident-learning-stage confident-learning-s3">
    <rect class="confident-learning-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="confident-learning-step" x="752" y="142">04</text>
    <text class="confident-learning-name" x="778" y="142">Then review the top of the list by hand</text>
    <text class="confident-learning-desc" x="752" y="166">Where a substantial fraction are</text>
    <text class="confident-learning-desc" x="752" y="182">genuinely mislabelled.</text>
  </g>
  <text class="confident-learning-sub" x="30" y="304">Published benchmark datasets have been found to contain meaningful label error rates by exactly this method, which is worth knowing before trusting a benchmark number.</text>
</svg>
