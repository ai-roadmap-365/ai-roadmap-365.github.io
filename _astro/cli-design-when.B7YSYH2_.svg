<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the tool.">
  <title>Which interface shape when</title>
  <style>
    .cli-design-when-bg   { fill: #f8fafc; }
    .cli-design-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-design-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-design-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-design-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-design-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-design-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cli-design-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cli-design-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cli-design-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cli-design-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cli-design-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cli-design-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cli-design-when-row { opacity: 1; }
    .cli-design-when-r0 { animation-delay: 0.00s; }
    .cli-design-when-r1 { animation-delay: 0.45s; }
    .cli-design-when-r2 { animation-delay: 0.90s; }
    .cli-design-when-r3 { animation-delay: 1.35s; }
    .cli-design-when-r4 { animation-delay: 1.80s; }
    .cli-design-when-row { animation: cli-design-when-reveal 7.3s ease-in-out infinite; }
    @keyframes cli-design-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cli-design-when-bg" width="980" height="390"/>
  <text class="cli-design-when-h1"  x="30" y="40">Which interface shape when</text>
  <text class="cli-design-when-sub" x="30" y="64">By the tool.</text>
  <rect class="cli-design-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cli-design-when-name" x="46" y="122">The tool</text>
  <text class="cli-design-when-desc" x="46" y="142">What it does.</text>
  <text class="cli-design-when-desc cli-design-when-row cli-design-when-r0" x="46" y="182">One operation, one input</text>
  <text class="cli-design-when-desc cli-design-when-row cli-design-when-r1" x="46" y="216">One operation, many settings</text>
  <text class="cli-design-when-desc cli-design-when-row cli-design-when-r2" x="46" y="250">Several related operations</text>
  <text class="cli-design-when-desc cli-design-when-row cli-design-when-r3" x="46" y="284">A whole toolkit</text>
  <text class="cli-design-when-desc cli-design-when-row cli-design-when-r4" x="46" y="318">Something run mostly by scripts</text>
  <rect class="cli-design-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cli-design-when-name" x="526" y="122">The shape</text>
  <text class="cli-design-when-desc" x="526" y="142">What to build.</text>
  <text class="cli-design-when-desc cli-design-when-row cli-design-when-r0" x="526" y="182">One positional argument, and defaults</text>
  <text class="cli-design-when-desc cli-design-when-row cli-design-when-r1" x="526" y="216">Positional plus options</text>
  <text class="cli-design-when-desc cli-design-when-row cli-design-when-r2" x="526" y="250">Subcommands</text>
  <text class="cli-design-when-desc cli-design-when-row cli-design-when-r3" x="526" y="284">Subcommands, possibly nested</text>
  <text class="cli-design-when-desc cli-design-when-row cli-design-when-r4" x="526" y="318">Machine-readable output, and strict exit codes</text>
  <text class="cli-design-when-sub" x="30" y="372">The last row is worth designing for deliberately: a tool intended for scripts should offer structured output rather than prose a script must parse.</text>
</svg>
