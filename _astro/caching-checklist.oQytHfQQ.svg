<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One of them is a tenancy boundary.">
  <title>Four operational checks</title>
  <style>
    .caching-checklist-bg   { fill: #f8fafc; }
    .caching-checklist-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .caching-checklist-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .caching-checklist-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .caching-checklist-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .caching-checklist-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .caching-checklist-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .caching-checklist-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .caching-checklist-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .caching-checklist-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .caching-checklist-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .caching-checklist-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .caching-checklist-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .caching-checklist-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .caching-checklist-stage { opacity: 1; }

    .caching-checklist-s0 { animation-delay: 0.00s; }
    .caching-checklist-e0 { animation-delay: 0.00s; }
    .caching-checklist-s1 { animation-delay: 1.28s; }
    .caching-checklist-e1 { animation-delay: 1.28s; }
    .caching-checklist-s2 { animation-delay: 2.56s; }
    .caching-checklist-e2 { animation-delay: 2.56s; }
    .caching-checklist-s3 { animation-delay: 3.84s; }
    .caching-checklist-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .caching-checklist-conn  { animation: caching-checklist-trace 6.4s ease-in-out infinite; }
      .caching-checklist-stage { animation: caching-checklist-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes caching-checklist-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes caching-checklist-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .caching-checklist-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .caching-checklist-stage { animation: caching-checklist-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes caching-checklist-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="caching-checklist-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="caching-checklist-bg" width="980" height="322"/>
  <text class="caching-checklist-h1"  x="30" y="40">Four operational checks</text>
  <text class="caching-checklist-sub" x="30" y="64">One of them is a tenancy boundary.</text>
  <g class="caching-checklist-stage caching-checklist-s0">
    <rect class="caching-checklist-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="caching-checklist-step" x="44" y="142">01</text>
    <text class="caching-checklist-name" x="70" y="142">Tenant ID in every key</text>
    <text class="caching-checklist-desc" x="44" y="166">Exact hashes and vector metadata</text>
    <text class="caching-checklist-desc" x="44" y="182">both. No cross-tenant hits.</text>
  </g>
  <line class="caching-checklist-line caching-checklist-conn caching-checklist-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#caching-checklist-tip)"/>
  <g class="caching-checklist-stage caching-checklist-s1">
    <rect class="caching-checklist-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="caching-checklist-step" x="280" y="142">02</text>
    <text class="caching-checklist-name" x="306" y="142">Normalised unit vectors</text>
    <text class="caching-checklist-desc" x="280" y="166">Or cosine distances are not what</text>
    <text class="caching-checklist-desc" x="280" y="182">you think they are.</text>
  </g>
  <line class="caching-checklist-line caching-checklist-conn caching-checklist-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#caching-checklist-tip)"/>
  <g class="caching-checklist-stage caching-checklist-s2">
    <rect class="caching-checklist-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="caching-checklist-step" x="516" y="142">03</text>
    <text class="caching-checklist-name" x="542" y="142">Static prefixes long enough to cache</text>
    <text class="caching-checklist-desc" x="516" y="166">Continuous, and above the</text>
    <text class="caching-checklist-desc" x="516" y="182">provider's minimum.</text>
  </g>
  <line class="caching-checklist-line caching-checklist-conn caching-checklist-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#caching-checklist-tip)"/>
  <g class="caching-checklist-stage caching-checklist-s3">
    <rect class="caching-checklist-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="caching-checklist-step" x="752" y="142">04</text>
    <text class="caching-checklist-name" x="778" y="142">Explicit TTLs</text>
    <text class="caching-checklist-desc" x="752" y="166">So an obsolete answer expires</text>
    <text class="caching-checklist-desc" x="752" y="182">rather than persisting forever.</text>
  </g>
  <text class="caching-checklist-sub" x="30" y="304">The first is a data-leak control rather than a correctness one: an unscoped cache key means one tenant's question can return another tenant's answer, which is the worst possible cache hit.</text>
</svg>
