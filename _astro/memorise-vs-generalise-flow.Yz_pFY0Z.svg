<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="d141f-title d141f-desc" width="980" height="560">
  <title id="d141f-title">A memorising model and a simpler model side by side, with unseen points arriving into both, showing that the better training score belongs to the worse model</title>
  <desc id="d141f-desc">Two panels share the same seven training points. On the left a model with capacity to spare passes through every one of them and scores 1.000 in training, but unseen points land far from it and it scores 0.6535 on them. On the right a straight-line model misses several training points, scoring 0.780, and unseen points land close to it, scoring 0.7655.</desc>
  <style>
    .d141f-bg { fill: #f8fafc; }
    .d141f-panel { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d141f-h { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 22px; font-weight: 700; fill: #1a202c; }
    .d141f-ph { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 700; fill: #1d4ed8; }
    .d141f-t { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #1a202c; }
    .d141f-s { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #475569; }
    .d141f-good { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; fill: #15803d; }
    .d141f-bad { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; fill: #b45309; }
    .d141f-fit { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .d141f-train { fill: #1d4ed8; }
    .d141f-new { fill: #f59e0b; stroke: #b45309; stroke-width: 1.2; }
    .d141f-err { stroke: #b45309; stroke-width: 2; stroke-dasharray: 4 3; }

    .d141f-feed { stroke: #b45309; stroke-width: 2.5; fill: none; stroke-dasharray: 10 8;
                  animation: d141f-march 1.8s linear infinite; }
    @keyframes d141f-march { to { stroke-dashoffset: -18; } }

    .d141f-arrive { animation: d141f-drop 6s ease-in-out infinite; }
    .d141f-a1 { animation-delay: 0s; }
    .d141f-a2 { animation-delay: 0.7s; }
    .d141f-a3 { animation-delay: 1.4s; }
    @keyframes d141f-drop {
      0%        { transform: translate(0, -70px); opacity: 0.45; }
      22%, 100% { transform: translate(0, 0); opacity: 1; }
    }

    .d141f-pulse { animation: d141f-glow 6s ease-in-out infinite; }
    @keyframes d141f-glow {
      0%, 34%, 100% { opacity: 1; }
      44%, 60%      { opacity: 0.45; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d141f-feed   { animation: none; stroke-dasharray: none; }
      .d141f-arrive { animation: none; transform: none; opacity: 1; }
      .d141f-pulse  { animation: none; opacity: 1; }
    }
  </style>
  <rect class="d141f-bg" x="0" y="0" width="980" height="560" />

  <text class="d141f-h" x="30" y="36">The better training score belongs to the worse model</text>
  <text class="d141f-s" x="30" y="60">Same seven training points, same day, same data. Unseen points arrive from the same distribution.</text>

  <path class="d141f-feed" d="M 255 70 L 255 96" marker-end="url(#d141f-arrow)" />
  <path class="d141f-feed" d="M 725 70 L 725 96" marker-end="url(#d141f-arrow)" />

  <rect class="d141f-panel" x="30" y="96" width="450" height="360" rx="12" />
  <rect class="d141f-panel" x="500" y="96" width="450" height="360" rx="12" />

  <text class="d141f-ph" x="50" y="126">Memorises: full-depth tree</text>
  <text class="d141f-s" x="50" y="148">Passes through every training point exactly</text>

  <text class="d141f-ph" x="520" y="126">Generalises: one straight boundary</text>
  <text class="d141f-s" x="520" y="148">Misses several training points on purpose</text>

  <polyline class="d141f-fit" points="90,330 140,260 195,350 250,230 305,320 360,210 415,280" />
  <circle class="d141f-train" cx="90" cy="330" r="6" />
  <circle class="d141f-train" cx="140" cy="260" r="6" />
  <circle class="d141f-train" cx="195" cy="350" r="6" />
  <circle class="d141f-train" cx="250" cy="230" r="6" />
  <circle class="d141f-train" cx="305" cy="320" r="6" />
  <circle class="d141f-train" cx="360" cy="210" r="6" />
  <circle class="d141f-train" cx="415" cy="280" r="6" />

  <g class="d141f-arrive d141f-a1">
    <line class="d141f-err" x1="170" y1="180" x2="170" y2="309" />
    <circle class="d141f-new" cx="170" cy="180" r="7" />
  </g>
  <g class="d141f-arrive d141f-a2">
    <line class="d141f-err" x1="280" y1="390" x2="280" y2="279" />
    <circle class="d141f-new" cx="280" cy="390" r="7" />
  </g>
  <g class="d141f-arrive d141f-a3">
    <line class="d141f-err" x1="390" y1="350" x2="390" y2="248" />
    <circle class="d141f-new" cx="390" cy="350" r="7" />
  </g>

  <line class="d141f-fit" x1="530" y1="335" x2="880" y2="235" />
  <circle class="d141f-train" cx="540" cy="330" r="6" />
  <circle class="d141f-train" cx="590" cy="260" r="6" />
  <circle class="d141f-train" cx="645" cy="350" r="6" />
  <circle class="d141f-train" cx="700" cy="230" r="6" />
  <circle class="d141f-train" cx="755" cy="320" r="6" />
  <circle class="d141f-train" cx="810" cy="210" r="6" />
  <circle class="d141f-train" cx="865" cy="280" r="6" />

  <g class="d141f-arrive d141f-a1">
    <line class="d141f-err" x1="620" y1="295" x2="620" y2="309" />
    <circle class="d141f-new" cx="620" cy="295" r="7" />
  </g>
  <g class="d141f-arrive d141f-a2">
    <line class="d141f-err" x1="730" y1="285" x2="730" y2="278" />
    <circle class="d141f-new" cx="730" cy="285" r="7" />
  </g>
  <g class="d141f-arrive d141f-a3">
    <line class="d141f-err" x1="840" y1="260" x2="840" y2="246" />
    <circle class="d141f-new" cx="840" cy="260" r="7" />
  </g>

  <text class="d141f-good" x="50" y="404">Training accuracy 1.000</text>
  <text class="d141f-bad d141f-pulse" x="50" y="430">Accuracy on unseen data 0.6535</text>
  <text class="d141f-s" x="270" y="430">Long orange bars: how far each</text>
  <text class="d141f-s" x="270" y="448">unseen point lands from the fit</text>

  <text class="d141f-t" x="520" y="404">Training accuracy 0.780</text>
  <text class="d141f-good d141f-pulse" x="520" y="430">Accuracy on unseen data 0.7655</text>
  <text class="d141f-s" x="740" y="430">Short bars: the unseen points</text>
  <text class="d141f-s" x="740" y="448">land close to the fit</text>

  <text class="d141f-t" x="30" y="496">Measured on the same 300 training rows and the same 2000 unseen rows, with 20 percent of the labels flipped.</text>
  <text class="d141f-t" x="30" y="520">The model that scored a perfect 1.000 on what it had seen scores 0.6535 on what it had not: 11.2 points below the simpler model.</text>
  <text class="d141f-s" x="30" y="544">With motion switched off every point, bar, fit and score already sits in its final position; the animation only shows the unseen points arriving.</text>

  <defs>
    <marker id="d141f-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309" />
    </marker>
  </defs>
</svg>
