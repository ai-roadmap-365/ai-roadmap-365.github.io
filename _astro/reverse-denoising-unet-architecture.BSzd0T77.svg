<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 160" role="img" aria-label="Reverse Denoising UNet Architecture">
  <title>Reverse Denoising UNet Architecture</title>
  <rect width="100%" height="100%" fill="#f8fafc" />
  
    <style>
      .d281f-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d281f-header { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .d281f-text { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .d281f-accent { fill: #1d4ed8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .d281f-arrow { stroke: #1d4ed8; stroke-width: 2; stroke-linecap: round; marker-end: url(#d281f-arrowhead); }
      .d281f-pulse { animation: d281f-glow 2.5s infinite ease-in-out; }
      @keyframes d281f-glow {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(29, 78, 216, 0.2)); }
        50% { filter: drop-shadow(0 0 6px rgba(29, 78, 216, 0.6)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .d281f-pulse { animation: none; }
      }
    </style>
    
  
    <defs>
      <marker id="d281f-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8" />
      </marker>
    </defs>
    
  
  <g transform="translate(40, 40)">
    <rect class="d281f-box" x="0" y="0" width="220" height="80" />
    <text class="d281f-header" x="15" y="30">1. Latent Noise Sample</text>
    <text class="d281f-text" x="15" y="50">xT ~ N(0, I) standard Gaussian</text>

    <path class="d281f-arrow" d="M 220 40 L 280 40" />

    <rect class="d281f-box d281f-pulse" x="280" y="0" width="240" height="80" />
    <text class="d281f-header" x="15" y="30">2. U-Net / DiT Predictor</text>
    <text class="d281f-accent" x="15" y="50">Predict noise epsilon_theta(xt, t, c)</text>

    <path class="d281f-arrow" d="M 520 40 L 580 40" />

    <rect class="d281f-box" x="580" y="0" width="220" height="80" />
    <text class="d281f-header" x="15" y="30">3. Reverse Step</text>
    <text class="d281f-text" x="15" y="50">xt-1 = denoise(xt, epsilon)</text>
  </g>

</svg>