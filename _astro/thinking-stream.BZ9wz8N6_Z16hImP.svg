<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Streaming reasoning separately</title>
  <style>
    .thinking-stream-bg   { fill: #f8fafc; }
    .thinking-stream-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .thinking-stream-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .thinking-stream-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .thinking-stream-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .thinking-stream-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .thinking-stream-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .thinking-stream-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .thinking-stream-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .thinking-stream-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .thinking-stream-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .thinking-stream-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .thinking-stream-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .thinking-stream-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .thinking-stream-stage { opacity: 1; }

    .thinking-stream-s0 { animation-delay: 0.00s; }
    .thinking-stream-e0 { animation-delay: 0.00s; }
    .thinking-stream-s1 { animation-delay: 1.28s; }
    .thinking-stream-e1 { animation-delay: 1.28s; }
    .thinking-stream-s2 { animation-delay: 2.56s; }
    .thinking-stream-e2 { animation-delay: 2.56s; }
    .thinking-stream-s3 { animation-delay: 3.84s; }
    .thinking-stream-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .thinking-stream-conn  { animation: thinking-stream-trace 6.4s ease-in-out infinite; }
      .thinking-stream-stage { animation: thinking-stream-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes thinking-stream-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes thinking-stream-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .thinking-stream-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .thinking-stream-stage { animation: thinking-stream-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes thinking-stream-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="thinking-stream-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="thinking-stream-bg" width="980" height="322"/>
  <text class="thinking-stream-h1"  x="30" y="40">Streaming reasoning separately</text>
  <text class="thinking-stream-sub" x="30" y="64">Four steps.</text>
  <g class="thinking-stream-stage thinking-stream-s0">
    <rect class="thinking-stream-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="thinking-stream-step" x="44" y="142">01</text>
    <text class="thinking-stream-name" x="70" y="142">Reasoning tokens arrive on their own channel</text>
    <text class="thinking-stream-desc" x="44" y="166">Marked distinctly from the</text>
    <text class="thinking-stream-desc" x="44" y="182">answer.</text>
  </g>
  <line class="thinking-stream-line thinking-stream-conn thinking-stream-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#thinking-stream-tip)"/>
  <g class="thinking-stream-stage thinking-stream-s1">
    <rect class="thinking-stream-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="thinking-stream-step" x="280" y="142">02</text>
    <text class="thinking-stream-name" x="306" y="142">Which lets the interface show progress</text>
    <text class="thinking-stream-desc" x="280" y="166">Without presenting the working</text>
    <text class="thinking-stream-desc" x="280" y="182">as the answer.</text>
  </g>
  <line class="thinking-stream-line thinking-stream-conn thinking-stream-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#thinking-stream-tip)"/>
  <g class="thinking-stream-stage thinking-stream-s2">
    <rect class="thinking-stream-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="thinking-stream-step" x="516" y="142">03</text>
    <text class="thinking-stream-name" x="542" y="142">Then the answer streams normally</text>
    <text class="thinking-stream-desc" x="516" y="166">Once the reasoning completes.</text>
  </g>
  <line class="thinking-stream-line thinking-stream-conn thinking-stream-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#thinking-stream-tip)"/>
  <g class="thinking-stream-stage thinking-stream-s3">
    <rect class="thinking-stream-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="thinking-stream-step" x="752" y="142">04</text>
    <text class="thinking-stream-name" x="778" y="142">And the product decides what to reveal</text>
    <text class="thinking-stream-desc" x="752" y="166">Summarised, collapsed, or hidden</text>
    <text class="thinking-stream-desc" x="752" y="182">entirely.</text>
  </g>
  <text class="thinking-stream-sub" x="30" y="304">Showing that work is happening without showing the work itself is the useful middle option, and it addresses the long silence that reasoning models would otherwise produce.</text>
</svg>
