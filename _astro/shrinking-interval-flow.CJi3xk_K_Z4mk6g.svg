<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="d108f-title d108f-desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
  <title id="d108f-title">The secant pivoting into the tangent as the interval shrinks, with the width and the computed slope at every step</title>
  <desc id="d108f-desc">Four secant lines fan out from the fixed point at x equals 3 on the curve y equals x squared. As the second point slides down the curve towards the fixed point, the interval width falls from 2 to 1 to 0.5 to 0.1 and the computed slope falls from 8 to 7 to 6.5 to 6.1, closing on the tangent slope of 6. A readout table lists every width, second point and slope, and the animation lights each secant and its row in turn while a marker slides down the curve. With motion reduced, every line, number and label is still present.</desc>

  <style>
    .d108f-bg    { fill: #f8fafc; }
    .d108f-h1    { fill: #1a202c; font-size: 25px; font-weight: 700; }
    .d108f-h2    { fill: #1d4ed8; font-size: 18px; font-weight: 700; }
    .d108f-lbl   { fill: #1a202c; font-size: 15px; }
    .d108f-note  { fill: #475569; font-size: 14px; }
    .d108f-mono  { fill: #1a202c; font-size: 15px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .d108f-monob { fill: #1d4ed8; font-size: 16px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .d108f-plot  { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .d108f-curve { fill: none; stroke: #1a202c; stroke-width: 3; }
    .d108f-tan   { fill: none; stroke: #1d4ed8; stroke-width: 3.5; }
    .d108f-dot   { fill: #1d4ed8; }
    .d108f-amber { fill: #b45309; }
    .d108f-panel { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.5; }

    /* The four secants. They rest fully drawn and fully opaque; the
       animation only thickens and brightens each one in turn. */
    .d108f-sec {
      fill: none; stroke: #b45309; stroke-width: 2.2; opacity: 0.9;
      animation: d108f-emphasise 8s ease-in-out infinite;
    }
    .d108f-s1 { animation-delay: 0s; }
    .d108f-s2 { animation-delay: 2s; }
    .d108f-s3 { animation-delay: 4s; }
    .d108f-s4 { animation-delay: 6s; }

    @keyframes d108f-emphasise {
      0%, 25%, 100% { stroke-width: 2.2; opacity: 0.9;  stroke: #b45309; }
      6%,  19%      { stroke-width: 5;   opacity: 1;    stroke: #d97706; }
    }

    /* The row highlights in the readout, on the same clock. */
    .d108f-row {
      fill: #dbeafe; opacity: 0;
      animation: d108f-rowlight 8s ease-in-out infinite;
    }
    .d108f-r1 { animation-delay: 0s; }
    .d108f-r2 { animation-delay: 2s; }
    .d108f-r3 { animation-delay: 4s; }
    .d108f-r4 { animation-delay: 6s; }

    @keyframes d108f-rowlight {
      0%, 25%, 100% { opacity: 0; }
      6%,  19%      { opacity: 1; }
    }

    /* The marker sliding down the curve. It rests at the first second point,
       which is where the sequence starts, so the still frame is honest. */
    .d108f-marker {
      fill: #b45309; stroke: #ffffff; stroke-width: 2;
      animation: d108f-slide 8s ease-in-out infinite;
    }
    @keyframes d108f-slide {
      0%,  18%  { transform: translate(0px, 0px); }
      25%, 43%  { transform: translate(-192.6px, 163.7px); }
      50%, 68%  { transform: translate(-288.9px, 231.9px); }
      75%, 93%  { transform: translate(-365.9px, 279.9px); }
      100%      { transform: translate(0px, 0px); }
    }

    /* The tangent breathes very gently so the eye is drawn to what the
       secants are converging on. It never leaves full legibility. */
    .d108f-pulse { animation: d108f-breathe 8s ease-in-out infinite; }
    @keyframes d108f-breathe {
      0%, 60%, 100% { stroke-width: 3.5; }
      80%, 90%      { stroke-width: 6; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d108f-sec    { animation: none; stroke-width: 2.2; opacity: 0.9; stroke: #b45309; }
      /* Band every row instead of lighting one at a time. The table stays
         readable; only the sequencing, which the numbers already give, goes. */
      .d108f-row    { animation: none; opacity: 1; }
      .d108f-marker { animation: none; transform: translate(0px, 0px); }
      .d108f-pulse  { animation: none; stroke-width: 3.5; }
    }
  </style>

  <rect class="d108f-bg" width="960" height="640"/>

  <text class="d108f-h1" x="40" y="44">Shrink the interval, and watch the slope settle</text>
  <text class="d108f-lbl" x="40" y="72">y = x², fixed point P = (3, 9). Each secant runs from P to a second point that is closer than the last. The tangent is what they are heading for.</text>
  <text class="d108f-note" x="40" y="94">Every slope below is exact: for this curve the secant over [3, 3 + h] has slope 6 + h, at every h, with no approximation anywhere.</text>

  <!-- ============ the plot ============ -->
  <rect class="d108f-plot" x="60" y="140" width="520" height="400"/>

  <!-- the tangent, drawn first so the secants sit over it -->
  <line class="d108f-tan d108f-pulse" x1="137.0" y1="494.5" x2="580.0" y2="243.6"/>

  <!-- the four secants, longest interval first -->
  <line class="d108f-sec d108f-s1" x1="137.0" y1="494.5" x2="580.0" y2="160.0"/>
  <line class="d108f-sec d108f-s2" x1="137.0" y1="494.5" x2="580.0" y2="201.8"/>
  <line class="d108f-sec d108f-s3" x1="137.0" y1="494.5" x2="580.0" y2="222.7"/>
  <line class="d108f-sec d108f-s4" x1="137.0" y1="494.5" x2="580.0" y2="239.5"/>

  <polyline class="d108f-curve" points="60.0,535.3 79.3,525.6 98.5,515.6 117.8,505.3 137.0,494.5 156.3,483.5 175.6,472.0 194.8,460.2 214.1,448.0 233.3,435.5 252.6,422.5 271.9,409.3 291.1,395.6 310.4,381.6 329.6,367.3 348.9,352.5 368.1,337.5 387.4,322.0 406.7,306.2 425.9,290.0 445.2,273.5 464.4,256.5 483.7,239.3 503.0,221.6 522.2,203.6 541.5,185.3 560.7,166.5 580.0,147.5"/>

  <!-- the four second points, all present in the still frame -->
  <circle class="d108f-amber" cx="522.2" cy="203.6" r="4.5"/>
  <circle class="d108f-amber" cx="329.6" cy="367.3" r="4.5"/>
  <circle class="d108f-amber" cx="233.3" cy="435.5" r="4.5"/>
  <circle class="d108f-amber" cx="156.3" cy="483.5" r="4.5"/>

  <!-- the marker that slides between them -->
  <circle class="d108f-marker" cx="522.2" cy="203.6" r="9"/>

  <!-- the fixed point -->
  <circle class="d108f-dot" cx="137.0" cy="494.5" r="7"/>
  <text class="d108f-mono" x="90" y="522">P (3, 9)</text>

  <!-- point labels -->
  <text class="d108f-mono" x="466" y="192" fill="#b45309">(5, 25)</text>
  <text class="d108f-mono" x="274" y="360" fill="#b45309">(4, 16)</text>
  <text class="d108f-mono" x="176" y="428" fill="#b45309">(3.5, 12.25)</text>
  <text class="d108f-mono" x="164" y="504" fill="#b45309">(3.1, 9.61)</text>

  <!-- slope labels on the fan -->
  <text class="d108f-mono" x="490" y="152" fill="#b45309">h = 2 → 8.00</text>
  <text class="d108f-mono" x="490" y="216" fill="#b45309">h = 1 → 7.00</text>
  <text class="d108f-mono" x="490" y="236" fill="#b45309">0.5 → 6.50</text>
  <text class="d108f-mono" x="490" y="256" fill="#b45309">0.1 → 6.10</text>
  <text class="d108f-monob" x="486" y="278">tangent → 6.00</text>

  <!-- ============ the readout ============ -->
  <rect class="d108f-panel" x="612" y="140" width="308" height="400" rx="6"/>
  <text class="d108f-h2" x="632" y="172">The readout</text>
  <text class="d108f-mono" x="632" y="200">h       point         slope</text>

  <rect class="d108f-row d108f-r1" x="622" y="212" width="288" height="26" rx="4"/>
  <text class="d108f-mono" x="632" y="230">2       (5, 25)       8.00</text>

  <rect class="d108f-row d108f-r2" x="622" y="242" width="288" height="26" rx="4"/>
  <text class="d108f-mono" x="632" y="260">1       (4, 16)       7.00</text>

  <rect class="d108f-row d108f-r3" x="622" y="272" width="288" height="26" rx="4"/>
  <text class="d108f-mono" x="632" y="290">0.5     (3.5, 12.25)  6.50</text>

  <rect class="d108f-row d108f-r4" x="622" y="302" width="288" height="26" rx="4"/>
  <text class="d108f-mono" x="632" y="320">0.1     (3.1, 9.61)   6.10</text>

  <text class="d108f-mono" x="632" y="350">0.01    (3.01, ...)   6.01</text>
  <text class="d108f-mono" x="632" y="370">0.001   (3.001, ...)  6.001</text>
  <line x1="622" y1="384" x2="910" y2="384" stroke="#1d4ed8" stroke-width="1.5"/>
  <text class="d108f-monob" x="632" y="406">h → 0   the tangent   6.00</text>

  <text class="d108f-lbl" x="632" y="440">The sequence is 6 + h, so it settles</text>
  <text class="d108f-lbl" x="632" y="460">on 6. That settling is the limit, and</text>
  <text class="d108f-lbl" x="632" y="480">6 is the derivative of x² at x = 3.</text>
  <text class="d108f-note" x="632" y="508">Nothing ever reaches h = 0: rise ÷ run</text>
  <text class="d108f-note" x="632" y="526">at h = 0 is 0 ÷ 0, which is not a number.</text>

  <!-- ============ footer ============ -->
  <text class="d108f-lbl" x="40" y="578">The tangent line is y = 6x − 9. It is not "the line that touches the curve once" — plenty of lines do that and are not tangents.</text>
  <text class="d108f-lbl" x="40" y="600">It is the line the secants approach, and its slope is the derivative: the rate of change of x² right at the point x = 3.</text>
  <text class="d108f-note" x="40" y="624">Motion adds ordering only. With reduced motion every secant, point, width and slope in this picture is still drawn and still labelled.</text>
</svg>
