<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four consequences.">
  <title>Removing the intercept</title>
  <style>
    .no-intercept-bg   { fill: #f8fafc; }
    .no-intercept-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .no-intercept-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .no-intercept-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .no-intercept-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .no-intercept-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .no-intercept-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .no-intercept-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .no-intercept-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .no-intercept-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .no-intercept-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .no-intercept-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .no-intercept-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .no-intercept-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .no-intercept-stage { opacity: 1; }

    .no-intercept-s0 { animation-delay: 0.00s; }
    .no-intercept-e0 { animation-delay: 0.00s; }
    .no-intercept-s1 { animation-delay: 1.28s; }
    .no-intercept-e1 { animation-delay: 1.28s; }
    .no-intercept-s2 { animation-delay: 2.56s; }
    .no-intercept-e2 { animation-delay: 2.56s; }
    .no-intercept-s3 { animation-delay: 3.84s; }
    .no-intercept-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .no-intercept-conn  { animation: no-intercept-trace 6.4s ease-in-out infinite; }
      .no-intercept-stage { animation: no-intercept-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes no-intercept-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes no-intercept-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .no-intercept-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .no-intercept-stage { animation: no-intercept-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes no-intercept-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="no-intercept-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="no-intercept-bg" width="980" height="322"/>
  <text class="no-intercept-h1"  x="30" y="40">Removing the intercept</text>
  <text class="no-intercept-sub" x="30" y="64">Four consequences.</text>
  <g class="no-intercept-stage no-intercept-s0">
    <rect class="no-intercept-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="no-intercept-step" x="44" y="142">01</text>
    <text class="no-intercept-name" x="70" y="142">The line is forced through the origin</text>
    <text class="no-intercept-desc" x="44" y="166">Which is a strong claim about</text>
    <text class="no-intercept-desc" x="44" y="182">the data.</text>
  </g>
  <line class="no-intercept-line no-intercept-conn no-intercept-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#no-intercept-tip)"/>
  <g class="no-intercept-stage no-intercept-s1">
    <rect class="no-intercept-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="no-intercept-step" x="280" y="142">02</text>
    <text class="no-intercept-name" x="306" y="142">Residuals no longer sum to zero</text>
    <text class="no-intercept-desc" x="280" y="166">So the usual arithmetic checks</text>
    <text class="no-intercept-desc" x="280" y="182">stop applying.</text>
  </g>
  <line class="no-intercept-line no-intercept-conn no-intercept-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#no-intercept-tip)"/>
  <g class="no-intercept-stage no-intercept-s2">
    <rect class="no-intercept-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="no-intercept-step" x="516" y="142">03</text>
    <text class="no-intercept-name" x="542" y="142">And the fit statistic is computed against a different baseline</text>
    <text class="no-intercept-desc" x="516" y="166">So it is not comparable to the</text>
    <text class="no-intercept-desc" x="516" y="182">usual one.</text>
  </g>
  <line class="no-intercept-line no-intercept-conn no-intercept-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#no-intercept-tip)"/>
  <g class="no-intercept-stage no-intercept-s3">
    <rect class="no-intercept-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="no-intercept-step" x="752" y="142">04</text>
    <text class="no-intercept-name" x="778" y="142">Use it only when zero input genuinely means zero output</text>
    <text class="no-intercept-desc" x="752" y="166">Which is rarer than it is</text>
    <text class="no-intercept-desc" x="752" y="182">assumed.</text>
  </g>
  <text class="no-intercept-sub" x="30" y="304">The incomparable fit statistic is the trap: a no-intercept model can report a far higher score than a fitted one on identical data, and it means something different.</text>
</svg>
