<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One job, three requirements.">
  <title>What an activation function is for</title>
  <style>
    .activation-role-bg   { fill: #f8fafc; }
    .activation-role-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .activation-role-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .activation-role-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .activation-role-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .activation-role-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .activation-role-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .activation-role-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .activation-role-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .activation-role-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .activation-role-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .activation-role-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .activation-role-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .activation-role-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .activation-role-stage { opacity: 1; }

    .activation-role-s0 { animation-delay: 0.00s; }
    .activation-role-e0 { animation-delay: 0.00s; }
    .activation-role-s1 { animation-delay: 1.28s; }
    .activation-role-e1 { animation-delay: 1.28s; }
    .activation-role-s2 { animation-delay: 2.56s; }
    .activation-role-e2 { animation-delay: 2.56s; }
    .activation-role-s3 { animation-delay: 3.84s; }
    .activation-role-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .activation-role-conn  { animation: activation-role-trace 6.4s ease-in-out infinite; }
      .activation-role-stage { animation: activation-role-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes activation-role-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes activation-role-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .activation-role-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .activation-role-stage { animation: activation-role-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes activation-role-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="activation-role-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="activation-role-bg" width="980" height="322"/>
  <text class="activation-role-h1"  x="30" y="40">What an activation function is for</text>
  <text class="activation-role-sub" x="30" y="64">One job, three requirements.</text>
  <g class="activation-role-stage activation-role-s0">
    <rect class="activation-role-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="activation-role-step" x="44" y="142">01</text>
    <text class="activation-role-name" x="70" y="142">Introduce non-linearity</text>
    <text class="activation-role-desc" x="44" y="166">Without it, depth collapses into</text>
    <text class="activation-role-desc" x="44" y="182">a single linear map.</text>
    <text class="activation-role-edge" x="44" y="242">the whole job</text>
  </g>
  <line class="activation-role-line activation-role-conn activation-role-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#activation-role-tip)"/>
  <g class="activation-role-stage activation-role-s1">
    <rect class="activation-role-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="activation-role-step" x="280" y="142">02</text>
    <text class="activation-role-name" x="306" y="142">Be differentiable</text>
    <text class="activation-role-desc" x="280" y="166">Or gradients cannot flow and the</text>
    <text class="activation-role-desc" x="280" y="182">network cannot be trained.</text>
  </g>
  <line class="activation-role-line activation-role-conn activation-role-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#activation-role-tip)"/>
  <g class="activation-role-stage activation-role-s2">
    <rect class="activation-role-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="activation-role-step" x="516" y="142">03</text>
    <text class="activation-role-name" x="542" y="142">Not saturate everywhere</text>
    <text class="activation-role-desc" x="516" y="166">A function whose derivative is</text>
    <text class="activation-role-desc" x="516" y="182">near zero stops learning.</text>
  </g>
  <line class="activation-role-line activation-role-conn activation-role-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#activation-role-tip)"/>
  <g class="activation-role-stage activation-role-s3">
    <rect class="activation-role-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="activation-role-step" x="752" y="142">04</text>
    <text class="activation-role-name" x="778" y="142">And be cheap</text>
    <text class="activation-role-desc" x="752" y="166">It runs once per neuron per</text>
    <text class="activation-role-desc" x="752" y="182">forward pass, on billions of</text>
    <text class="activation-role-desc" x="752" y="198">neurons.</text>
  </g>
  <text class="activation-role-sub" x="30" y="304">The first requirement is the one that justifies the whole component: a network of linear layers with no activation between them has exactly the expressive power of one linear layer.</text>
</svg>
