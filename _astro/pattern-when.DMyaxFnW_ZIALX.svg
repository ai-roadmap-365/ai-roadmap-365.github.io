<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when a string is fine.">
  <title>When to formalise patterns</title>
  <style>
    .pattern-when-bg   { fill: #f8fafc; }
    .pattern-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pattern-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pattern-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pattern-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pattern-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pattern-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pattern-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pattern-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pattern-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pattern-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pattern-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pattern-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pattern-when-row { opacity: 1; }
    .pattern-when-r0 { animation-delay: 0.00s; }
    .pattern-when-r1 { animation-delay: 0.45s; }
    .pattern-when-r2 { animation-delay: 0.90s; }
    .pattern-when-r3 { animation-delay: 1.35s; }
    .pattern-when-r4 { animation-delay: 1.80s; }
    .pattern-when-row { animation: pattern-when-reveal 7.3s ease-in-out infinite; }
    @keyframes pattern-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="pattern-when-bg" width="980" height="390"/>
  <text class="pattern-when-h1"  x="30" y="40">When to formalise patterns</text>
  <text class="pattern-when-sub" x="30" y="64">And when a string is fine.</text>
  <rect class="pattern-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="pattern-when-name" x="46" y="122">Formalise</text>
  <text class="pattern-when-desc" x="46" y="142">Scale and sharing.</text>
  <text class="pattern-when-desc pattern-when-row pattern-when-r0" x="46" y="182">More than a handful of prompts</text>
  <text class="pattern-when-desc pattern-when-row pattern-when-r1" x="46" y="216">Shared fragments across features</text>
  <text class="pattern-when-desc pattern-when-row pattern-when-r2" x="46" y="250">More than one person editing them</text>
  <text class="pattern-when-desc pattern-when-row pattern-when-r3" x="46" y="284">Anything user-facing</text>
  <text class="pattern-when-desc pattern-when-row pattern-when-r4" x="46" y="318">Where prompts change often</text>
  <rect class="pattern-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="pattern-when-name" x="526" y="122">Keep it simple</text>
  <text class="pattern-when-desc" x="526" y="142">Small and stable.</text>
  <text class="pattern-when-desc pattern-when-row pattern-when-r0" x="526" y="182">One or two prompts</text>
  <text class="pattern-when-desc pattern-when-row pattern-when-r1" x="526" y="216">A script or a prototype</text>
  <text class="pattern-when-desc pattern-when-row pattern-when-r2" x="526" y="250">A single author</text>
  <text class="pattern-when-desc pattern-when-row pattern-when-r3" x="526" y="284">Prompts that never change</text>
  <text class="pattern-when-desc pattern-when-row pattern-when-r4" x="526" y="318">Where the template would exceed the prompt</text>
  <text class="pattern-when-sub" x="30" y="372">The threshold is usually the second person rather than the tenth prompt: templating pays for itself as soon as two people are editing the same behaviour.</text>
</svg>
