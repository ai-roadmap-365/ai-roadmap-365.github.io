<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three requirements beyond text.">
  <title>Serving binary resources</title>
  <style>
    .binary-resources-bg   { fill: #f8fafc; }
    .binary-resources-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .binary-resources-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .binary-resources-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .binary-resources-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .binary-resources-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .binary-resources-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .binary-resources-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .binary-resources-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .binary-resources-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .binary-resources-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .binary-resources-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .binary-resources-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .binary-resources-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .binary-resources-stage { opacity: 1; }

    .binary-resources-s0 { animation-delay: 0.00s; }
    .binary-resources-e0 { animation-delay: 0.00s; }
    .binary-resources-s1 { animation-delay: 1.50s; }
    .binary-resources-e1 { animation-delay: 1.50s; }
    .binary-resources-s2 { animation-delay: 3.00s; }
    .binary-resources-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .binary-resources-conn  { animation: binary-resources-trace 6s ease-in-out infinite; }
      .binary-resources-stage { animation: binary-resources-arrive 6s ease-in-out infinite; }
    }
    @keyframes binary-resources-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes binary-resources-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .binary-resources-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .binary-resources-stage { animation: binary-resources-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes binary-resources-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="binary-resources-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="binary-resources-bg" width="980" height="322"/>
  <text class="binary-resources-h1"  x="30" y="40">Serving binary resources</text>
  <text class="binary-resources-sub" x="30" y="64">Three requirements beyond text.</text>
  <g class="binary-resources-stage binary-resources-s0">
    <rect class="binary-resources-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="binary-resources-step" x="44" y="142">01</text>
    <text class="binary-resources-name" x="70" y="142">Base64-encode the blob</text>
    <text class="binary-resources-desc" x="44" y="166">PDFs, screenshots, compiled artefacts, audio.</text>
  </g>
  <line class="binary-resources-line binary-resources-conn binary-resources-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#binary-resources-tip)"/>
  <g class="binary-resources-stage binary-resources-s1">
    <rect class="binary-resources-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="binary-resources-step" x="359" y="142">02</text>
    <text class="binary-resources-name" x="385" y="142">Declare a strict MIME type</text>
    <text class="binary-resources-desc" x="359" y="166">So the client knows whether it can render or</text>
    <text class="binary-resources-desc" x="359" y="182">must link.</text>
    <text class="binary-resources-edge" x="359" y="242">negotiated</text>
  </g>
  <line class="binary-resources-line binary-resources-conn binary-resources-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#binary-resources-tip)"/>
  <g class="binary-resources-stage binary-resources-s2">
    <rect class="binary-resources-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="binary-resources-step" x="674" y="142">03</text>
    <text class="binary-resources-name" x="700" y="142">Multimodal clients decode and see it</text>
    <text class="binary-resources-desc" x="674" y="166">The image enters the vision context directly,</text>
    <text class="binary-resources-desc" x="674" y="182">with no description in between.</text>
  </g>
  <text class="binary-resources-sub" x="30" y="304">Passing an image straight into a vision context is qualitatively different from describing it: the model reads the chart rather than reading somebody's summary of the chart.</text>
</svg>
