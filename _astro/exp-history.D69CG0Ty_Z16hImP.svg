<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward pre-registration.">
  <title>Four steps in experimental method</title>
  <style>
    .exp-history-bg   { fill: #f8fafc; }
    .exp-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exp-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exp-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exp-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exp-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exp-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exp-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .exp-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .exp-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .exp-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .exp-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .exp-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .exp-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .exp-history-stage { opacity: 1; }

    .exp-history-s0 { animation-delay: 0.00s; }
    .exp-history-e0 { animation-delay: 0.00s; }
    .exp-history-s1 { animation-delay: 1.28s; }
    .exp-history-e1 { animation-delay: 1.28s; }
    .exp-history-s2 { animation-delay: 2.56s; }
    .exp-history-e2 { animation-delay: 2.56s; }
    .exp-history-s3 { animation-delay: 3.84s; }
    .exp-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .exp-history-conn  { animation: exp-history-trace 6.4s ease-in-out infinite; }
      .exp-history-stage { animation: exp-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes exp-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes exp-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .exp-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .exp-history-stage { animation: exp-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes exp-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="exp-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="exp-history-bg" width="980" height="322"/>
  <text class="exp-history-h1"  x="30" y="40">Four steps in experimental method</text>
  <text class="exp-history-sub" x="30" y="64">Toward pre-registration.</text>
  <g class="exp-history-stage exp-history-s0">
    <rect class="exp-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="exp-history-step" x="44" y="142">01</text>
    <text class="exp-history-name" x="70" y="142">Observation and argument from cases</text>
    <text class="exp-history-desc" x="44" y="166">Which confounds everything.</text>
  </g>
  <line class="exp-history-line exp-history-conn exp-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#exp-history-tip)"/>
  <g class="exp-history-stage exp-history-s1">
    <rect class="exp-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="exp-history-step" x="280" y="142">02</text>
    <text class="exp-history-name" x="306" y="142">Then controlled comparison with a control group</text>
    <text class="exp-history-desc" x="280" y="166">Which isolated one factor.</text>
  </g>
  <line class="exp-history-line exp-history-conn exp-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#exp-history-tip)"/>
  <g class="exp-history-stage exp-history-s2">
    <rect class="exp-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="exp-history-step" x="516" y="142">03</text>
    <text class="exp-history-name" x="542" y="142">Then randomised assignment</text>
    <text class="exp-history-desc" x="516" y="166">Which balanced the unmeasured</text>
    <text class="exp-history-desc" x="516" y="182">factors.</text>
  </g>
  <line class="exp-history-line exp-history-conn exp-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#exp-history-tip)"/>
  <g class="exp-history-stage exp-history-s3">
    <rect class="exp-history-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="exp-history-step" x="752" y="142">04</text>
    <text class="exp-history-name" x="778" y="142">And pre-registration of the analysis plan</text>
    <text class="exp-history-desc" x="752" y="166">Which addressed analytical</text>
    <text class="exp-history-desc" x="752" y="182">flexibility.</text>
  </g>
  <text class="exp-history-sub" x="30" y="304">Pre-registration is the most recent step and the one still spreading, and it addresses a problem that randomisation alone never could.</text>
</svg>
