<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Compliance travels with the traffic.">
  <title>A fallback provider is a data decision</title>
  <style>
    .failover-privacy-bg   { fill: #f8fafc; }
    .failover-privacy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .failover-privacy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .failover-privacy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .failover-privacy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .failover-privacy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .failover-privacy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .failover-privacy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .failover-privacy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .failover-privacy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .failover-privacy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .failover-privacy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .failover-privacy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .failover-privacy-row { opacity: 1; }
    .failover-privacy-r0 { animation-delay: 0.00s; }
    .failover-privacy-r1 { animation-delay: 0.45s; }
    .failover-privacy-r2 { animation-delay: 0.90s; }
    .failover-privacy-r3 { animation-delay: 1.35s; }
    .failover-privacy-r4 { animation-delay: 1.80s; }
    .failover-privacy-row { animation: failover-privacy-reveal 7.3s ease-in-out infinite; }
    @keyframes failover-privacy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="failover-privacy-bg" width="980" height="390"/>
  <text class="failover-privacy-h1"  x="30" y="40">A fallback provider is a data decision</text>
  <text class="failover-privacy-sub" x="30" y="64">Compliance travels with the traffic.</text>
  <rect class="failover-privacy-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="failover-privacy-name" x="46" y="122">Verified</text>
  <text class="failover-privacy-desc" x="46" y="142">Same obligations, both providers.</text>
  <text class="failover-privacy-desc failover-privacy-row failover-privacy-r0" x="46" y="182">Zero-data-retention agreements in place</text>
  <text class="failover-privacy-desc failover-privacy-row failover-privacy-r1" x="46" y="216">Regional and regulatory alignment checked</text>
  <text class="failover-privacy-desc failover-privacy-row failover-privacy-r2" x="46" y="250">Certifications verified for both</text>
  <text class="failover-privacy-desc failover-privacy-row failover-privacy-r3" x="46" y="284">Failover is a routing decision only</text>
  <text class="failover-privacy-desc failover-privacy-row failover-privacy-r4" x="46" y="318">Nothing changes for the customer</text>
  <rect class="failover-privacy-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="failover-privacy-name" x="526" y="122">Unverified</text>
  <text class="failover-privacy-desc" x="526" y="142">An unnoticed data transfer.</text>
  <text class="failover-privacy-desc failover-privacy-row failover-privacy-r0" x="526" y="182">Added for uptime alone</text>
  <text class="failover-privacy-desc failover-privacy-row failover-privacy-r1" x="526" y="216">Different retention policy</text>
  <text class="failover-privacy-desc failover-privacy-row failover-privacy-r2" x="526" y="250">Possibly a different jurisdiction</text>
  <text class="failover-privacy-desc failover-privacy-row failover-privacy-r3" x="526" y="284">Failover becomes a compliance event</text>
  <text class="failover-privacy-desc failover-privacy-row failover-privacy-r4" x="526" y="318">Discovered during an audit</text>
  <text class="failover-privacy-sub" x="30" y="372">The failover happens automatically at 3am, which is exactly why the compliance check has to happen at configuration time: nobody is present to notice where the traffic went.</text>
</svg>
