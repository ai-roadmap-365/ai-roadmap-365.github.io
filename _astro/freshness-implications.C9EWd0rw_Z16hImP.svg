<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One of them is the erasure path.">
  <title>Five consequences of reconciling</title>
  <style>
    .freshness-implications-bg   { fill: #f8fafc; }
    .freshness-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .freshness-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .freshness-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .freshness-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .freshness-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .freshness-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .freshness-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .freshness-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .freshness-implications-stage { opacity: 1; }

    .freshness-implications-s0 { animation-delay: 0.00s; }
    .freshness-implications-e0 { animation-delay: 0.00s; }
    .freshness-implications-s1 { animation-delay: 1.33s; }
    .freshness-implications-e1 { animation-delay: 1.33s; }
    .freshness-implications-s2 { animation-delay: 2.67s; }
    .freshness-implications-e2 { animation-delay: 2.67s; }
    .freshness-implications-s3 { animation-delay: 4.00s; }
    .freshness-implications-e3 { animation-delay: 4.00s; }
    .freshness-implications-s4 { animation-delay: 5.33s; }
    .freshness-implications-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .freshness-implications-conn  { animation: freshness-implications-trace 8s ease-in-out infinite; }
      .freshness-implications-stage { animation: freshness-implications-arrive 8s ease-in-out infinite; }
    }
    @keyframes freshness-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes freshness-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .freshness-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .freshness-implications-stage { animation: freshness-implications-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes freshness-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="freshness-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="freshness-implications-bg" width="980" height="322"/>
  <text class="freshness-implications-h1"  x="30" y="40">Five consequences of reconciling</text>
  <text class="freshness-implications-sub" x="30" y="64">One of them is the erasure path.</text>
  <g class="freshness-implications-stage freshness-implications-s0">
    <rect class="freshness-implications-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="freshness-implications-step" x="44" y="142">01</text>
    <text class="freshness-implications-name" x="70" y="142">It needs broad read access</text>
    <text class="freshness-implications-desc" x="44" y="166">Full id lists from both</text>
    <text class="freshness-implications-desc" x="44" y="182">sides. A legitimate</text>
    <text class="freshness-implications-desc" x="44" y="198">least-privilege review</text>
    <text class="freshness-implications-edge" x="44" y="242">security</text>
  </g>
  <line class="freshness-implications-line freshness-implications-conn freshness-implications-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#freshness-implications-tip)"/>
  <g class="freshness-implications-stage freshness-implications-s1">
    <rect class="freshness-implications-warn" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="freshness-implications-step" x="233" y="142">02</text>
    <text class="freshness-implications-name" x="259" y="142">This is where erasure is honoured</text>
    <text class="freshness-implications-desc" x="233" y="166">Deletion propagation</text>
    <text class="freshness-implications-desc" x="233" y="182">deserves its own test and</text>
    <text class="freshness-implications-desc" x="233" y="198">its own alert.</text>
    <text class="freshness-implications-edge" x="233" y="242">privacy</text>
  </g>
  <line class="freshness-implications-line freshness-implications-conn freshness-implications-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#freshness-implications-tip)"/>
  <g class="freshness-implications-stage freshness-implications-s2">
    <rect class="freshness-implications-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="freshness-implications-step" x="422" y="142">03</text>
    <text class="freshness-implications-name" x="448" y="142">Compare ids and hashes, not content</text>
    <text class="freshness-implications-desc" x="422" y="166">Cheap and linear.</text>
    <text class="freshness-implications-desc" x="422" y="182">Re-reading documents to</text>
    <text class="freshness-implications-desc" x="422" y="198">compute versions is what</text>
  </g>
  <line class="freshness-implications-line freshness-implications-conn freshness-implications-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#freshness-implications-tip)"/>
  <g class="freshness-implications-stage freshness-implications-s3">
    <rect class="freshness-implications-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="freshness-implications-step" x="611" y="142">04</text>
    <text class="freshness-implications-name" x="637" y="142">Partition at scale</text>
    <text class="freshness-implications-desc" x="611" y="166">One slice per run, so</text>
    <text class="freshness-implications-desc" x="611" y="182">every document is checked</text>
    <text class="freshness-implications-desc" x="611" y="198">within a bounded window.</text>
  </g>
  <line class="freshness-implications-line freshness-implications-conn freshness-implications-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#freshness-implications-tip)"/>
  <g class="freshness-implications-stage freshness-implications-s4">
    <rect class="freshness-implications-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="freshness-implications-step" x="800" y="142">05</text>
    <text class="freshness-implications-name" x="826" y="142">Reconciliation is cheap; what it triggers is not</text>
    <text class="freshness-implications-desc" x="800" y="166">An over-eager version</text>
    <text class="freshness-implications-desc" x="800" y="182">definition re-embeds</text>
    <text class="freshness-implications-desc" x="800" y="198">unnecessarily.</text>
  </g>
  <text class="freshness-implications-sub" x="30" y="304">The delete guard is also a security control worth naming: it bounds the damage a compromised or misconfigured source enumeration can do to a derived index.</text>
</svg>
