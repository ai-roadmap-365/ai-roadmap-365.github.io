<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four cases.">
  <title>Status codes that mean something</title>
  <style>
    .api-status-bg   { fill: #f8fafc; }
    .api-status-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-status-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-status-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-status-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-status-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-status-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .api-status-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .api-status-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .api-status-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .api-status-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .api-status-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .api-status-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .api-status-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .api-status-stage { opacity: 1; }

    .api-status-s0 { animation-delay: 0.00s; }
    .api-status-e0 { animation-delay: 0.00s; }
    .api-status-s1 { animation-delay: 1.28s; }
    .api-status-e1 { animation-delay: 1.28s; }
    .api-status-s2 { animation-delay: 2.56s; }
    .api-status-e2 { animation-delay: 2.56s; }
    .api-status-s3 { animation-delay: 3.84s; }
    .api-status-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .api-status-conn  { animation: api-status-trace 6.4s ease-in-out infinite; }
      .api-status-stage { animation: api-status-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes api-status-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes api-status-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .api-status-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .api-status-stage { animation: api-status-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes api-status-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="api-status-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="api-status-bg" width="980" height="322"/>
  <text class="api-status-h1"  x="30" y="40">Status codes that mean something</text>
  <text class="api-status-sub" x="30" y="64">Four cases.</text>
  <g class="api-status-stage api-status-s0">
    <rect class="api-status-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="api-status-step" x="44" y="142">01</text>
    <text class="api-status-name" x="70" y="142">The request succeeded: a success code, and the data</text>
    <text class="api-status-desc" x="44" y="166">Which is the ordinary case.</text>
  </g>
  <line class="api-status-line api-status-conn api-status-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#api-status-tip)"/>
  <g class="api-status-stage api-status-s1">
    <rect class="api-status-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="api-status-step" x="280" y="142">02</text>
    <text class="api-status-name" x="306" y="142">The input was wrong: a client error, naming the field</text>
    <text class="api-status-desc" x="280" y="166">So the caller can fix it.</text>
  </g>
  <line class="api-status-line api-status-conn api-status-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#api-status-tip)"/>
  <g class="api-status-stage api-status-s2">
    <rect class="api-status-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="api-status-step" x="516" y="142">03</text>
    <text class="api-status-name" x="542" y="142">The thing does not exist: a not-found code</text>
    <text class="api-status-desc" x="516" y="166">Distinct from a bad request.</text>
  </g>
  <line class="api-status-line api-status-conn api-status-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#api-status-tip)"/>
  <g class="api-status-stage api-status-s3">
    <rect class="api-status-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="api-status-step" x="752" y="142">04</text>
    <text class="api-status-name" x="778" y="142">Something broke on your side: a server error</text>
    <text class="api-status-desc" x="752" y="166">And no internal detail in the</text>
    <text class="api-status-desc" x="752" y="182">body.</text>
  </g>
  <text class="api-status-sub" x="30" y="304">Keeping internal detail out of server error responses matters: a stack trace returned to a caller is a map of your system handed to a stranger.</text>
</svg>
