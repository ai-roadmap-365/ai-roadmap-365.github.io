<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Shorter, faster, and easier to extend.">
  <title>A long elif chain wants to be a dictionary</title>
  <style>
    .chain-or-dict-bg   { fill: #f8fafc; }
    .chain-or-dict-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-or-dict-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-or-dict-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-or-dict-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-or-dict-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-or-dict-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chain-or-dict-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .chain-or-dict-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .chain-or-dict-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .chain-or-dict-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .chain-or-dict-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .chain-or-dict-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chain-or-dict-row { opacity: 1; }
    .chain-or-dict-r0 { animation-delay: 0.00s; }
    .chain-or-dict-r1 { animation-delay: 0.45s; }
    .chain-or-dict-r2 { animation-delay: 0.90s; }
    .chain-or-dict-r3 { animation-delay: 1.35s; }
    .chain-or-dict-r4 { animation-delay: 1.80s; }
    .chain-or-dict-row { animation: chain-or-dict-reveal 7.3s ease-in-out infinite; }
    @keyframes chain-or-dict-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="chain-or-dict-bg" width="980" height="390"/>
  <text class="chain-or-dict-h1"  x="30" y="40">A long elif chain wants to be a dictionary</text>
  <text class="chain-or-dict-sub" x="30" y="64">Shorter, faster, and easier to extend.</text>
  <rect class="chain-or-dict-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="chain-or-dict-name" x="46" y="122">Twenty elif branches</text>
  <text class="chain-or-dict-desc" x="46" y="142">Linear, and repetitive.</text>
  <text class="chain-or-dict-desc chain-or-dict-row chain-or-dict-r0" x="46" y="182">Checked in order, one at a time</text>
  <text class="chain-or-dict-desc chain-or-dict-row chain-or-dict-r1" x="46" y="216">Adding a case is two lines</text>
  <text class="chain-or-dict-desc chain-or-dict-row chain-or-dict-r2" x="46" y="250">The pattern is repeated twenty times</text>
  <text class="chain-or-dict-desc chain-or-dict-row chain-or-dict-r3" x="46" y="284">Easy to duplicate a condition by accident</text>
  <text class="chain-or-dict-desc chain-or-dict-row chain-or-dict-r4" x="46" y="318">The structure hides the data</text>
  <rect class="chain-or-dict-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="chain-or-dict-name" x="526" y="122">A dictionary lookup</text>
  <text class="chain-or-dict-desc" x="526" y="142">The mapping IS the data.</text>
  <text class="chain-or-dict-desc chain-or-dict-row chain-or-dict-r0" x="526" y="182">One lookup, whatever the size</text>
  <text class="chain-or-dict-desc chain-or-dict-row chain-or-dict-r1" x="526" y="216">Adding a case is one line</text>
  <text class="chain-or-dict-desc chain-or-dict-row chain-or-dict-r2" x="526" y="250">The mapping is visible as a table</text>
  <text class="chain-or-dict-desc chain-or-dict-row chain-or-dict-r3" x="526" y="284">.get(key, default) handles the else</text>
  <text class="chain-or-dict-desc chain-or-dict-row chain-or-dict-r4" x="526" y="318">Testable as data, not as branches</text>
  <text class="chain-or-dict-sub" x="30" y="372">This applies when the branches map a value to a result. It does not apply when each branch does genuinely different work — then the chain is honest, and the alternative is polymorphism rather than a dictionary.</text>
</svg>
