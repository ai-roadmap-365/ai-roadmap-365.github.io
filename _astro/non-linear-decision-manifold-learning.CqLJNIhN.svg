<svg role="img" aria-label="Non linear decision boundary classification results on moons and spiral datasets showing smooth probability contours separating interlocking classes" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Non-Linear Decision Manifold Formation in Pure NumPy</title>
  <defs>
    <linearGradient id="bg201b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="contourCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg201b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">NON-LINEAR DECISION MANIFOLD LEARNING</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Pure NumPy Multi-Layer Perceptron Solving Interlocking Two Moons and Concentric Circles</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#contourCard)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Plot 1: Two Moons Dataset -->
    <rect x="35" y="25" width="325" height="245" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="197" y="50" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Two Moons Manifold (99.2% Accuracy)</text>
    <!-- Decision Boundary Contour Curve -->
    <path d="M 60 130 C 120 70, 240 70, 270 140 C 290 200, 180 230, 330 230" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <!-- Moon 1 dots -->
    <circle cx="80" cy="110" r="4" fill="#38bdf8"/> <circle cx="120" cy="95" r="4" fill="#38bdf8"/>
    <circle cx="160" cy="90" r="4" fill="#38bdf8"/> <circle cx="200" cy="100" r="4" fill="#38bdf8"/>
    <circle cx="240" cy="120" r="4" fill="#38bdf8"/>
    <!-- Moon 2 dots -->
    <circle cx="150" cy="180" r="4" fill="#f43f5e"/> <circle cx="190" cy="190" r="4" fill="#f43f5e"/>
    <circle cx="230" cy="185" r="4" fill="#f43f5e"/> <circle cx="270" cy="160" r="4" fill="#f43f5e"/>
    <text x="197" y="255" fill="#94a3b8" font-size="9" text-anchor="middle">Smooth Non-Linear S-Curve Partition</text>

    <!-- Plot 2: Concentric Circles -->
    <rect x="400" y="25" width="325" height="245" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="562" y="50" fill="#34d399" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Concentric Circles (100.0% Accuracy)</text>
    <!-- Inner ring -->
    <circle cx="562" cy="147" r="35" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
    <circle cx="562" cy="147" r="5" fill="#38bdf8"/>
    <circle cx="545" cy="135" r="4" fill="#38bdf8"/> <circle cx="580" cy="140" r="4" fill="#38bdf8"/>
    <circle cx="560" cy="165" r="4" fill="#38bdf8"/>
    <!-- Outer ring -->
    <circle cx="510" cy="110" r="4" fill="#f43f5e"/> <circle cx="615" cy="110" r="4" fill="#f43f5e"/>
    <circle cx="505" cy="180" r="4" fill="#f43f5e"/> <circle cx="620" cy="180" r="4" fill="#f43f5e"/>
    <text x="562" y="255" fill="#94a3b8" font-size="9" text-anchor="middle">Circular Non-Linear Enclosing Boundary</text>
  </g>
</svg>
