<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="100%" height="100%" role="img" aria-label="Where Incidents Were Caught showing five detection stages ordered by cost, with the two that reached production marked as where next project's effort belongs">
  <title>Where Incidents Were Caught</title>
  <defs>
    <style>
      .d364b-bg { fill: #f8fafc; }
      .d364b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; }
      .d364b-cheap { fill: #dcfce7; stroke: #22c55e; stroke-width: 2px; }
      .d364b-mid { fill: #fef9c3; stroke: #eab308; stroke-width: 2px; }
      .d364b-dear { fill: #fee2e2; stroke: #ef4444; stroke-width: 2px; }
      .d364b-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d364b-h { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .d364b-t { font-family: system-ui, sans-serif; font-size: 13px; fill: #334155; }
      .d364b-s { font-family: system-ui, sans-serif; font-size: 12px; fill: #64748b; }
      .d364b-arrow { stroke: #94a3b8; stroke-width: 2px; fill: none; }
    </style>
    <marker id="d364b-head" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8" />
    </marker>
  </defs>
  <rect class="d364b-bg" width="900" height="430" />
  <text class="d364b-title" x="30" y="38">Where Incidents Were Caught</text>
  <text class="d364b-s" x="30" y="60">Five incidents, one per stage. The stage is the cost — the count alone tells you nothing.</text>

  <line class="d364b-arrow" x1="40" y1="98" x2="860" y2="98" marker-end="url(#d364b-head)" />
  <text class="d364b-s" x="40" y="90">cheaper to fix</text>
  <text class="d364b-s" x="760" y="90">more expensive</text>

  <rect class="d364b-cheap" x="30" y="118" width="152" height="96" rx="8" />
  <text class="d364b-h" x="46" y="144">review</text>
  <text class="d364b-s" x="46" y="164">before it ran</text>
  <text class="d364b-s" x="46" y="182">anywhere</text>
  <text class="d364b-t" x="46" y="204">1 incident</text>

  <rect class="d364b-cheap" x="196" y="118" width="152" height="96" rx="8" />
  <text class="d364b-h" x="212" y="144">tests</text>
  <text class="d364b-s" x="212" y="164">before it</text>
  <text class="d364b-s" x="212" y="182">deployed</text>
  <text class="d364b-t" x="212" y="204">1 incident</text>

  <rect class="d364b-mid" x="362" y="118" width="152" height="96" rx="8" />
  <text class="d364b-h" x="378" y="144">staging</text>
  <text class="d364b-s" x="378" y="164">deployed, no</text>
  <text class="d364b-s" x="378" y="182">user affected</text>
  <text class="d364b-t" x="378" y="204">1 incident</text>

  <rect class="d364b-dear" x="528" y="118" width="152" height="96" rx="8" />
  <text class="d364b-h" x="544" y="144">monitoring</text>
  <text class="d364b-s" x="544" y="164">in production,</text>
  <text class="d364b-s" x="544" y="182">a signal found it</text>
  <text class="d364b-t" x="544" y="204">1 incident</text>

  <rect class="d364b-dear" x="694" y="118" width="176" height="96" rx="8" />
  <text class="d364b-h" x="710" y="144">user</text>
  <text class="d364b-s" x="710" y="164">in production,</text>
  <text class="d364b-s" x="710" y="182">a person found it</text>
  <text class="d364b-t" x="710" y="204">1 incident</text>

  <rect x="528" y="230" width="342" height="30" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2" />
  <text class="d364b-t" x="546" y="250" fill="#7f1d1d">escaped: 2 of 5 (40%) reached production</text>

  <rect class="d364b-card" x="30" y="286" width="840" height="120" rx="8" />
  <text class="d364b-h" x="48" y="312">For each escape, name the gate that would have caught it</text>
  <text class="d364b-t" x="48" y="340">spend spike from a retry loop</text>
  <text class="d364b-t" x="440" y="340">a per-request cap</text>
  <text class="d364b-t" x="48" y="364">answers citing nothing after an index rebuild</text>
  <text class="d364b-t" x="440" y="364">a groundedness signal</text>
  <text class="d364b-s" x="48" y="392">Two sentences, two work items. "Improve monitoring" would have produced neither.</text>
</svg>
