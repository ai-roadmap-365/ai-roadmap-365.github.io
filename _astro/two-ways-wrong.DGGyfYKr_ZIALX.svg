<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Both invisible in the score.">
  <title>Two ways a good fit misleads</title>
  <style>
    .two-ways-wrong-bg   { fill: #f8fafc; }
    .two-ways-wrong-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-ways-wrong-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-ways-wrong-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-ways-wrong-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-ways-wrong-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-ways-wrong-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .two-ways-wrong-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .two-ways-wrong-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .two-ways-wrong-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .two-ways-wrong-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .two-ways-wrong-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .two-ways-wrong-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .two-ways-wrong-row { opacity: 1; }
    .two-ways-wrong-r0 { animation-delay: 0.00s; }
    .two-ways-wrong-r1 { animation-delay: 0.45s; }
    .two-ways-wrong-r2 { animation-delay: 0.90s; }
    .two-ways-wrong-r3 { animation-delay: 1.35s; }
    .two-ways-wrong-r4 { animation-delay: 1.80s; }
    .two-ways-wrong-row { animation: two-ways-wrong-reveal 7.3s ease-in-out infinite; }
    @keyframes two-ways-wrong-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="two-ways-wrong-bg" width="980" height="390"/>
  <text class="two-ways-wrong-h1"  x="30" y="40">Two ways a good fit misleads</text>
  <text class="two-ways-wrong-sub" x="30" y="64">Both invisible in the score.</text>
  <rect class="two-ways-wrong-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="two-ways-wrong-name" x="46" y="122">Wrong functional form</text>
  <text class="two-ways-wrong-desc" x="46" y="142">A curve fitted with a line.</text>
  <text class="two-ways-wrong-desc two-ways-wrong-row two-ways-wrong-r0" x="46" y="182">The relationship is not straight</text>
  <text class="two-ways-wrong-desc two-ways-wrong-row two-ways-wrong-r1" x="46" y="216">A line still fits reasonably</text>
  <text class="two-ways-wrong-desc two-ways-wrong-row two-ways-wrong-r2" x="46" y="250">The score looks acceptable</text>
  <text class="two-ways-wrong-desc two-ways-wrong-row two-ways-wrong-r3" x="46" y="284">Residuals show a clear pattern</text>
  <text class="two-ways-wrong-desc two-ways-wrong-row two-ways-wrong-r4" x="46" y="318">Visible only in the residual plot</text>
  <rect class="two-ways-wrong-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="two-ways-wrong-name" x="526" y="122">A single influential point</text>
  <text class="two-ways-wrong-desc" x="526" y="142">One row moves the line.</text>
  <text class="two-ways-wrong-desc two-ways-wrong-row two-ways-wrong-r0" x="526" y="182">One extreme point dominates the fit</text>
  <text class="two-ways-wrong-desc two-ways-wrong-row two-ways-wrong-r1" x="526" y="216">Removing it changes the slope entirely</text>
  <text class="two-ways-wrong-desc two-ways-wrong-row two-ways-wrong-r2" x="526" y="250">The score may even improve</text>
  <text class="two-ways-wrong-desc two-ways-wrong-row two-ways-wrong-r3" x="526" y="284">Leverage and residual both large</text>
  <text class="two-ways-wrong-desc two-ways-wrong-row two-ways-wrong-r4" x="526" y="318">Visible only by checking influence</text>
  <text class="two-ways-wrong-sub" x="30" y="372">Neither is detectable from the fit statistic alone, which is the argument for residual plots being a required step rather than an optional one.</text>
</svg>
