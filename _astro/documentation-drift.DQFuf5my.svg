<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="100%" height="100%" role="img" aria-label="What Documentation Drift Looks Like showing a README that was correct at write time diverging from a project that kept changing">
  <title>What Documentation Drift Looks Like</title>
  <defs>
    <style>
      .d362a-bg { fill: #f8fafc; }
      .d362a-code { stroke: #3b82f6; stroke-width: 3px; fill: none; }
      .d362a-doc { stroke: #ef4444; stroke-width: 3px; fill: none; stroke-dasharray: 6 4; }
      .d362a-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d362a-sub { font-family: system-ui, sans-serif; font-size: 13px; fill: #475569; }
      .d362a-h { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; }
      .d362a-t { font-family: system-ui, sans-serif; font-size: 11px; fill: #334155; }
      .d362a-key { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #b91c1c; }
      .d362a-axis { stroke: #94a3b8; stroke-width: 2px; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d362a-bg"/>
  <text x="40" y="40" class="d362a-title">What Documentation Drift Looks Like</text>
  <text x="40" y="64" class="d362a-sub">Nothing dramatic happens. The code keeps changing and the prose does not, and the gap widens quietly.</text>

  <line x1="110" y1="110" x2="110" y2="250" class="d362a-axis"/>
  <line x1="110" y1="250" x2="820" y2="250" class="d362a-axis"/>
  <text x="98" y="116" class="d362a-t" text-anchor="end">truth</text>
  <text x="98" y="254" class="d362a-t" text-anchor="end">day 1</text>
  <text x="465" y="278" class="d362a-t" text-anchor="middle">time</text>

  <path d="M 130 230 L 260 200 L 390 160 L 520 140 L 650 125 L 790 115" class="d362a-code"/>
  <text x="800" y="112" class="d362a-h">the project</text>

  <path d="M 130 230 L 260 228 L 390 228 L 520 227 L 650 227 L 790 226" class="d362a-doc"/>
  <text x="800" y="240" class="d362a-h">the README</text>

  <line x1="520" y1="140" x2="520" y2="227" class="d362a-axis" stroke-dasharray="3 3"/>
  <text x="530" y="190" class="d362a-key">this gap is now wrong,</text>
  <text x="530" y="206" class="d362a-key">not merely incomplete</text>

  <text x="40" y="320" class="d362a-h">Why the author never notices</text>
  <text x="40" y="344" class="d362a-t">Renaming a command, changing an output, dropping a flag — none of these touches the README, and no test fails.</text>
  <text x="40" y="362" class="d362a-t">The one person who could spot the divergence is the author, and the author is the one person who no longer reads it.</text>
  <text x="40" y="390" class="d362a-t">Code has tests. Prose has good intentions. The fix is to make the prose CHECKABLE: every documented command must</text>
  <text x="40" y="408" class="d362a-t">exist, every claimed output must match a real capture, and drift then fails a gate instead of accumulating.</text>
</svg>
