<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four reasons.">
  <title>Mocking a model call</title>
  <style>
    .mock-model-calls-bg   { fill: #f8fafc; }
    .mock-model-calls-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mock-model-calls-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mock-model-calls-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mock-model-calls-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mock-model-calls-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mock-model-calls-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mock-model-calls-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mock-model-calls-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mock-model-calls-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mock-model-calls-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mock-model-calls-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mock-model-calls-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .mock-model-calls-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .mock-model-calls-stage { opacity: 1; }

    .mock-model-calls-s0 { animation-delay: 0.00s; }
    .mock-model-calls-e0 { animation-delay: 0.00s; }
    .mock-model-calls-s1 { animation-delay: 1.28s; }
    .mock-model-calls-e1 { animation-delay: 1.28s; }
    .mock-model-calls-s2 { animation-delay: 2.56s; }
    .mock-model-calls-e2 { animation-delay: 2.56s; }
    .mock-model-calls-s3 { animation-delay: 3.84s; }
    .mock-model-calls-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .mock-model-calls-conn  { animation: mock-model-calls-trace 6.4s ease-in-out infinite; }
      .mock-model-calls-stage { animation: mock-model-calls-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes mock-model-calls-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes mock-model-calls-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .mock-model-calls-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .mock-model-calls-stage { animation: mock-model-calls-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes mock-model-calls-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="mock-model-calls-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="mock-model-calls-bg" width="980" height="322"/>
  <text class="mock-model-calls-h1"  x="30" y="40">Mocking a model call</text>
  <text class="mock-model-calls-sub" x="30" y="64">Four reasons.</text>
  <g class="mock-model-calls-stage mock-model-calls-s0">
    <rect class="mock-model-calls-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="mock-model-calls-step" x="44" y="142">01</text>
    <text class="mock-model-calls-name" x="70" y="142">Real calls cost money, on every run</text>
    <text class="mock-model-calls-desc" x="44" y="166">Which a test suite runs</text>
    <text class="mock-model-calls-desc" x="44" y="182">constantly.</text>
  </g>
  <line class="mock-model-calls-line mock-model-calls-conn mock-model-calls-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#mock-model-calls-tip)"/>
  <g class="mock-model-calls-stage mock-model-calls-s1">
    <rect class="mock-model-calls-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="mock-model-calls-step" x="280" y="142">02</text>
    <text class="mock-model-calls-name" x="306" y="142">And take seconds rather than milliseconds</text>
    <text class="mock-model-calls-desc" x="280" y="166">Which makes the suite unusable.</text>
  </g>
  <line class="mock-model-calls-line mock-model-calls-conn mock-model-calls-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#mock-model-calls-tip)"/>
  <g class="mock-model-calls-stage mock-model-calls-s2">
    <rect class="mock-model-calls-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="mock-model-calls-step" x="516" y="142">03</text>
    <text class="mock-model-calls-name" x="542" y="142">And return different text each time</text>
    <text class="mock-model-calls-desc" x="516" y="166">So exact assertions cannot hold.</text>
  </g>
  <line class="mock-model-calls-line mock-model-calls-conn mock-model-calls-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#mock-model-calls-tip)"/>
  <g class="mock-model-calls-stage mock-model-calls-s3">
    <rect class="mock-model-calls-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="mock-model-calls-step" x="752" y="142">04</text>
    <text class="mock-model-calls-name" x="778" y="142">A recorded response makes the test fast and deterministic</text>
    <text class="mock-model-calls-desc" x="752" y="166">And lets you assert on the</text>
    <text class="mock-model-calls-desc" x="752" y="182">parsing.</text>
  </g>
  <text class="mock-model-calls-sub" x="30" y="304">Recording a real response once and replaying it is the practical pattern: the test exercises your parsing and prompt assembly against realistic output.</text>
</svg>
