<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One of them can revise.">
  <title>Speaking, or writing</title>
  <style>
    .improv-writer-bg   { fill: #f8fafc; }
    .improv-writer-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .improv-writer-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .improv-writer-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .improv-writer-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .improv-writer-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .improv-writer-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .improv-writer-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .improv-writer-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .improv-writer-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .improv-writer-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .improv-writer-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .improv-writer-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .improv-writer-row { opacity: 1; }
    .improv-writer-r0 { animation-delay: 0.00s; }
    .improv-writer-r1 { animation-delay: 0.45s; }
    .improv-writer-r2 { animation-delay: 0.90s; }
    .improv-writer-r3 { animation-delay: 1.35s; }
    .improv-writer-r4 { animation-delay: 1.80s; }
    .improv-writer-row { animation: improv-writer-reveal 7.3s ease-in-out infinite; }
    @keyframes improv-writer-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="improv-writer-bg" width="980" height="390"/>
  <text class="improv-writer-h1"  x="30" y="40">Speaking, or writing</text>
  <text class="improv-writer-sub" x="30" y="64">One of them can revise.</text>
  <rect class="improv-writer-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="improv-writer-name" x="46" y="122">Speaking</text>
  <text class="improv-writer-desc" x="46" y="142">Committed, word by word.</text>
  <text class="improv-writer-desc improv-writer-row improv-writer-r0" x="46" y="182">Each word chosen from what came before</text>
  <text class="improv-writer-desc improv-writer-row improv-writer-r1" x="46" y="216">Nothing can be unsaid</text>
  <text class="improv-writer-desc improv-writer-row improv-writer-r2" x="46" y="250">No planning beyond a phrase</text>
  <text class="improv-writer-desc improv-writer-row improv-writer-r3" x="46" y="284">A wrong turn must be built on</text>
  <text class="improv-writer-desc improv-writer-row improv-writer-r4" x="46" y="318">This is generation</text>
  <rect class="improv-writer-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="improv-writer-name" x="526" y="122">Writing</text>
  <text class="improv-writer-desc" x="526" y="142">Everything is provisional.</text>
  <text class="improv-writer-desc improv-writer-row improv-writer-r0" x="526" y="182">Draft and reconsider</text>
  <text class="improv-writer-desc improv-writer-row improv-writer-r1" x="526" y="216">Later edits change earlier text</text>
  <text class="improv-writer-desc improv-writer-row improv-writer-r2" x="526" y="250">Structure planned first</text>
  <text class="improv-writer-desc improv-writer-row improv-writer-r3" x="526" y="284">Mistakes removed entirely</text>
  <text class="improv-writer-desc improv-writer-row improv-writer-r4" x="526" y="318">Which the model cannot do</text>
  <text class="improv-writer-sub" x="30" y="372">The inability to revise is why asking for reasoning before an answer helps: it gives the model spoken words to build on instead of requiring it to plan silently.</text>
</svg>
