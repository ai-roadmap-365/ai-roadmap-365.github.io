<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Expected value</title>
  <style>
    .expected-value-bg   { fill: #f8fafc; }
    .expected-value-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .expected-value-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .expected-value-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .expected-value-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .expected-value-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .expected-value-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .expected-value-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .expected-value-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .expected-value-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .expected-value-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .expected-value-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .expected-value-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .expected-value-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .expected-value-stage { opacity: 1; }

    .expected-value-s0 { animation-delay: 0.00s; }
    .expected-value-e0 { animation-delay: 0.00s; }
    .expected-value-s1 { animation-delay: 1.28s; }
    .expected-value-e1 { animation-delay: 1.28s; }
    .expected-value-s2 { animation-delay: 2.56s; }
    .expected-value-e2 { animation-delay: 2.56s; }
    .expected-value-s3 { animation-delay: 3.84s; }
    .expected-value-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .expected-value-conn  { animation: expected-value-trace 6.4s ease-in-out infinite; }
      .expected-value-stage { animation: expected-value-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes expected-value-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes expected-value-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .expected-value-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .expected-value-stage { animation: expected-value-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes expected-value-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="expected-value-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="expected-value-bg" width="980" height="322"/>
  <text class="expected-value-h1"  x="30" y="40">Expected value</text>
  <text class="expected-value-sub" x="30" y="64">Four steps.</text>
  <g class="expected-value-stage expected-value-s0">
    <rect class="expected-value-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="expected-value-step" x="44" y="142">01</text>
    <text class="expected-value-name" x="70" y="142">Write a cost or benefit for each confusion cell</text>
    <text class="expected-value-desc" x="44" y="166">Four numbers, in real units.</text>
  </g>
  <line class="expected-value-line expected-value-conn expected-value-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#expected-value-tip)"/>
  <g class="expected-value-stage expected-value-s1">
    <rect class="expected-value-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="expected-value-step" x="280" y="142">02</text>
    <text class="expected-value-name" x="306" y="142">Multiply by how often each outcome occurs</text>
    <text class="expected-value-desc" x="280" y="166">At a given threshold.</text>
  </g>
  <line class="expected-value-line expected-value-conn expected-value-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#expected-value-tip)"/>
  <g class="expected-value-stage expected-value-s2">
    <rect class="expected-value-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="expected-value-step" x="516" y="142">03</text>
    <text class="expected-value-name" x="542" y="142">Sum to get expected value per decision</text>
    <text class="expected-value-desc" x="516" y="166">Which is directly meaningful.</text>
  </g>
  <line class="expected-value-line expected-value-conn expected-value-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#expected-value-tip)"/>
  <g class="expected-value-stage expected-value-s3">
    <rect class="expected-value-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="expected-value-step" x="752" y="142">04</text>
    <text class="expected-value-name" x="778" y="142">And choose the threshold that maximises it</text>
    <text class="expected-value-desc" x="752" y="166">Removing the need for a proxy</text>
    <text class="expected-value-desc" x="752" y="182">metric entirely.</text>
  </g>
  <text class="expected-value-sub" x="30" y="304">This is the strongest available framing because it eliminates the proxy: there is no need to argue about which metric approximates value when value itself is computable.</text>
</svg>
