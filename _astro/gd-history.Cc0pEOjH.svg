<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward adaptive methods.">
  <title>Four steps in optimisation by gradients</title>
  <style>
    .gd-history-bg   { fill: #f8fafc; }
    .gd-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gd-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gd-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gd-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gd-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gd-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gd-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gd-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gd-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gd-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gd-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gd-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .gd-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .gd-history-stage { opacity: 1; }

    .gd-history-s0 { animation-delay: 0.00s; }
    .gd-history-e0 { animation-delay: 0.00s; }
    .gd-history-s1 { animation-delay: 1.28s; }
    .gd-history-e1 { animation-delay: 1.28s; }
    .gd-history-s2 { animation-delay: 2.56s; }
    .gd-history-e2 { animation-delay: 2.56s; }
    .gd-history-s3 { animation-delay: 3.84s; }
    .gd-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .gd-history-conn  { animation: gd-history-trace 6.4s ease-in-out infinite; }
      .gd-history-stage { animation: gd-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes gd-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes gd-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .gd-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .gd-history-stage { animation: gd-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes gd-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="gd-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="gd-history-bg" width="980" height="322"/>
  <text class="gd-history-h1"  x="30" y="40">Four steps in optimisation by gradients</text>
  <text class="gd-history-sub" x="30" y="64">Toward adaptive methods.</text>
  <g class="gd-history-stage gd-history-s0">
    <rect class="gd-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="gd-history-step" x="44" y="142">01</text>
    <text class="gd-history-name" x="70" y="142">The basic method, described in the nineteenth century</text>
    <text class="gd-history-desc" x="44" y="166">Long before computers.</text>
  </g>
  <line class="gd-history-line gd-history-conn gd-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#gd-history-tip)"/>
  <g class="gd-history-stage gd-history-s1">
    <rect class="gd-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="gd-history-step" x="280" y="142">02</text>
    <text class="gd-history-name" x="306" y="142">Then stochastic variants using samples</text>
    <text class="gd-history-desc" x="280" y="166">Which made large datasets</text>
    <text class="gd-history-desc" x="280" y="182">feasible.</text>
  </g>
  <line class="gd-history-line gd-history-conn gd-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#gd-history-tip)"/>
  <g class="gd-history-stage gd-history-s2">
    <rect class="gd-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="gd-history-step" x="516" y="142">03</text>
    <text class="gd-history-name" x="542" y="142">Then momentum, accumulating direction</text>
    <text class="gd-history-desc" x="516" y="166">Which smooths noisy paths.</text>
  </g>
  <line class="gd-history-line gd-history-conn gd-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#gd-history-tip)"/>
  <g class="gd-history-stage gd-history-s3">
    <rect class="gd-history-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="gd-history-step" x="752" y="142">04</text>
    <text class="gd-history-name" x="778" y="142">And adaptive per-parameter rates</text>
    <text class="gd-history-desc" x="752" y="166">Which is what most training uses</text>
    <text class="gd-history-desc" x="752" y="182">today.</text>
  </g>
  <text class="gd-history-sub" x="30" y="304">Each refinement addressed a specific failure of the previous one, which is why the modern optimisers look complicated but are assembled from simple ideas.</text>
</svg>
