<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One is a supply-chain decision.">
  <title>Three operational hazards</title>
  <style>
    .mcp-ops-hazards-bg   { fill: #f8fafc; }
    .mcp-ops-hazards-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-ops-hazards-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-ops-hazards-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-ops-hazards-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-ops-hazards-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-ops-hazards-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mcp-ops-hazards-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mcp-ops-hazards-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mcp-ops-hazards-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mcp-ops-hazards-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mcp-ops-hazards-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mcp-ops-hazards-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .mcp-ops-hazards-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .mcp-ops-hazards-stage { opacity: 1; }

    .mcp-ops-hazards-s0 { animation-delay: 0.00s; }
    .mcp-ops-hazards-e0 { animation-delay: 0.00s; }
    .mcp-ops-hazards-s1 { animation-delay: 1.50s; }
    .mcp-ops-hazards-e1 { animation-delay: 1.50s; }
    .mcp-ops-hazards-s2 { animation-delay: 3.00s; }
    .mcp-ops-hazards-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .mcp-ops-hazards-conn  { animation: mcp-ops-hazards-trace 6s ease-in-out infinite; }
      .mcp-ops-hazards-stage { animation: mcp-ops-hazards-arrive 6s ease-in-out infinite; }
    }
    @keyframes mcp-ops-hazards-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes mcp-ops-hazards-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .mcp-ops-hazards-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .mcp-ops-hazards-stage { animation: mcp-ops-hazards-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes mcp-ops-hazards-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="mcp-ops-hazards-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="mcp-ops-hazards-bg" width="980" height="322"/>
  <text class="mcp-ops-hazards-h1"  x="30" y="40">Three operational hazards</text>
  <text class="mcp-ops-hazards-sub" x="30" y="64">One is a supply-chain decision.</text>
  <g class="mcp-ops-hazards-stage mcp-ops-hazards-s0">
    <rect class="mcp-ops-hazards-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="mcp-ops-hazards-step" x="44" y="142">01</text>
    <text class="mcp-ops-hazards-name" x="70" y="142">A malicious package is a compromise</text>
    <text class="mcp-ops-hazards-desc" x="44" y="166">It runs with your shell privileges.</text>
    <text class="mcp-ops-hazards-desc" x="44" y="182">Installing one is a supply-chain decision.</text>
    <text class="mcp-ops-hazards-edge" x="44" y="242">Day 347</text>
  </g>
  <line class="mcp-ops-hazards-line mcp-ops-hazards-conn mcp-ops-hazards-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#mcp-ops-hazards-tip)"/>
  <g class="mcp-ops-hazards-stage mcp-ops-hazards-s1">
    <rect class="mcp-ops-hazards-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="mcp-ops-hazards-step" x="359" y="142">02</text>
    <text class="mcp-ops-hazards-name" x="385" y="142">Pipe deadlocks</text>
    <text class="mcp-ops-hazards-desc" x="359" y="166">A full buffer nobody drains stops both sides.</text>
    <text class="mcp-ops-hazards-desc" x="359" y="182">Read stderr continuously.</text>
  </g>
  <line class="mcp-ops-hazards-line mcp-ops-hazards-conn mcp-ops-hazards-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#mcp-ops-hazards-tip)"/>
  <g class="mcp-ops-hazards-stage mcp-ops-hazards-s2">
    <rect class="mcp-ops-hazards-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="mcp-ops-hazards-step" x="674" y="142">03</text>
    <text class="mcp-ops-hazards-name" x="700" y="142">Diagnostics live in stderr logs</text>
    <text class="mcp-ops-hazards-desc" x="674" y="166">Exit code 127 is a missing binary; the log</text>
    <text class="mcp-ops-hazards-desc" x="674" y="182">says which.</text>
  </g>
  <text class="mcp-ops-hazards-sub" x="30" y="304">The deadlock is the failure that presents as a hang rather than an error: the server is alive, the client is waiting, and nothing in either process reports a problem.</text>
</svg>
