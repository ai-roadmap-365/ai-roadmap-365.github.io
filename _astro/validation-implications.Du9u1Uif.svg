<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are safety.">
  <title>Four consequences of model validation</title>
  <style>
    .validation-implications-bg   { fill: #f8fafc; }
    .validation-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validation-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validation-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validation-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validation-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validation-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .validation-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .validation-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .validation-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .validation-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .validation-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .validation-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .validation-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .validation-implications-stage { opacity: 1; }

    .validation-implications-s0 { animation-delay: 0.00s; }
    .validation-implications-e0 { animation-delay: 0.00s; }
    .validation-implications-s1 { animation-delay: 1.28s; }
    .validation-implications-e1 { animation-delay: 1.28s; }
    .validation-implications-s2 { animation-delay: 2.56s; }
    .validation-implications-e2 { animation-delay: 2.56s; }
    .validation-implications-s3 { animation-delay: 3.84s; }
    .validation-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .validation-implications-conn  { animation: validation-implications-trace 6.4s ease-in-out infinite; }
      .validation-implications-stage { animation: validation-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes validation-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes validation-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .validation-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .validation-implications-stage { animation: validation-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes validation-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="validation-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="validation-implications-bg" width="980" height="322"/>
  <text class="validation-implications-h1"  x="30" y="40">Four consequences of model validation</text>
  <text class="validation-implications-sub" x="30" y="64">Two are safety.</text>
  <g class="validation-implications-stage validation-implications-s0">
    <rect class="validation-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="validation-implications-step" x="44" y="142">01</text>
    <text class="validation-implications-name" x="70" y="142">Malformed data fails immediately, with a clear message</text>
    <text class="validation-implications-desc" x="44" y="166">Rather than deep in the logic.</text>
  </g>
  <line class="validation-implications-line validation-implications-conn validation-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#validation-implications-tip)"/>
  <g class="validation-implications-stage validation-implications-s1">
    <rect class="validation-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="validation-implications-step" x="280" y="142">02</text>
    <text class="validation-implications-name" x="306" y="142">And input constraints become a security control</text>
    <text class="validation-implications-desc" x="280" y="166">Lengths, patterns, allowed</text>
    <text class="validation-implications-desc" x="280" y="182">values.</text>
  </g>
  <line class="validation-implications-line validation-implications-conn validation-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#validation-implications-tip)"/>
  <g class="validation-implications-stage validation-implications-s2">
    <rect class="validation-implications-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="validation-implications-step" x="516" y="142">03</text>
    <text class="validation-implications-name" x="542" y="142">While the model documents the expected shape</text>
    <text class="validation-implications-desc" x="516" y="166">Executably.</text>
  </g>
  <line class="validation-implications-line validation-implications-conn validation-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#validation-implications-tip)"/>
  <g class="validation-implications-stage validation-implications-s3">
    <rect class="validation-implications-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="validation-implications-step" x="752" y="142">04</text>
    <text class="validation-implications-name" x="778" y="142">At a real but usually small runtime cost</text>
    <text class="validation-implications-desc" x="752" y="166">Which matters only in hot loops.</text>
  </g>
  <text class="validation-implications-sub" x="30" y="304">Treating constraints as a security control is worth doing deliberately: an unbounded string field is a denial-of-service vector as well as a data quality problem.</text>
</svg>
