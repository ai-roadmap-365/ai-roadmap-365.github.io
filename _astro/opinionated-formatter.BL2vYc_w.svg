<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="gofmt's insight, in 2009.">
  <title>Why the best formatter has no options</title>
  <style>
    .opinionated-formatter-bg   { fill: #f8fafc; }
    .opinionated-formatter-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .opinionated-formatter-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .opinionated-formatter-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .opinionated-formatter-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .opinionated-formatter-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .opinionated-formatter-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .opinionated-formatter-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .opinionated-formatter-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .opinionated-formatter-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .opinionated-formatter-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .opinionated-formatter-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .opinionated-formatter-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .opinionated-formatter-row { opacity: 1; }
    .opinionated-formatter-r0 { animation-delay: 0.00s; }
    .opinionated-formatter-r1 { animation-delay: 0.45s; }
    .opinionated-formatter-r2 { animation-delay: 0.90s; }
    .opinionated-formatter-r3 { animation-delay: 1.35s; }
    .opinionated-formatter-r4 { animation-delay: 1.80s; }
    .opinionated-formatter-row { animation: opinionated-formatter-reveal 7.3s ease-in-out infinite; }
    @keyframes opinionated-formatter-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="opinionated-formatter-bg" width="980" height="390"/>
  <text class="opinionated-formatter-h1"  x="30" y="40">Why the best formatter has no options</text>
  <text class="opinionated-formatter-sub" x="30" y="64">gofmt's insight, in 2009.</text>
  <rect class="opinionated-formatter-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="opinionated-formatter-name" x="46" y="122">Configurable</text>
  <text class="opinionated-formatter-desc" x="46" y="142">Every setting is a decision.</text>
  <text class="opinionated-formatter-desc opinionated-formatter-row opinionated-formatter-r0" x="46" y="182">Someone must choose each option</text>
  <text class="opinionated-formatter-desc opinionated-formatter-row opinionated-formatter-r1" x="46" y="216">Which means someone can disagree</text>
  <text class="opinionated-formatter-desc opinionated-formatter-row opinionated-formatter-r2" x="46" y="250">The argument moves to the config file</text>
  <text class="opinionated-formatter-desc opinionated-formatter-row opinionated-formatter-r3" x="46" y="284">Different projects, different output</text>
  <text class="opinionated-formatter-desc opinionated-formatter-row opinionated-formatter-r4" x="46" y="318">The problem is relocated, not solved</text>
  <rect class="opinionated-formatter-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="opinionated-formatter-name" x="526" y="122">Opinionated</text>
  <text class="opinionated-formatter-desc" x="526" y="142">Few options, or none.</text>
  <text class="opinionated-formatter-desc opinionated-formatter-row opinionated-formatter-r0" x="526" y="182">Nothing to choose</text>
  <text class="opinionated-formatter-desc opinionated-formatter-row opinionated-formatter-r1" x="526" y="216">Nothing to disagree about</text>
  <text class="opinionated-formatter-desc opinionated-formatter-row opinionated-formatter-r2" x="526" y="250">No config file to argue in</text>
  <text class="opinionated-formatter-desc opinionated-formatter-row opinionated-formatter-r3" x="526" y="284">Every project looks the same</text>
  <text class="opinionated-formatter-desc opinionated-formatter-row opinionated-formatter-r4" x="526" y="318">The argument is genuinely over</text>
  <text class="opinionated-formatter-sub" x="30" y="372">If a formatter is configurable enough to argue about, it is configured wrong. Prettier and Black followed gofmt deliberately, and the category settled where it did for this reason.</text>
</svg>
