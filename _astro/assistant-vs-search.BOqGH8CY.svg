<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="What the reader has to do.">
  <title>An assistant against a search box</title>
  <style>
    .assistant-vs-search-bg   { fill: #f8fafc; }
    .assistant-vs-search-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assistant-vs-search-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assistant-vs-search-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assistant-vs-search-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assistant-vs-search-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assistant-vs-search-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .assistant-vs-search-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .assistant-vs-search-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .assistant-vs-search-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .assistant-vs-search-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .assistant-vs-search-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .assistant-vs-search-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .assistant-vs-search-row { opacity: 1; }
    .assistant-vs-search-r0 { animation-delay: 0.00s; }
    .assistant-vs-search-r1 { animation-delay: 0.45s; }
    .assistant-vs-search-r2 { animation-delay: 0.90s; }
    .assistant-vs-search-r3 { animation-delay: 1.35s; }
    .assistant-vs-search-r4 { animation-delay: 1.80s; }
    .assistant-vs-search-row { animation: assistant-vs-search-reveal 7.3s ease-in-out infinite; }
    @keyframes assistant-vs-search-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="assistant-vs-search-bg" width="980" height="390"/>
  <text class="assistant-vs-search-h1"  x="30" y="40">An assistant against a search box</text>
  <text class="assistant-vs-search-sub" x="30" y="64">What the reader has to do.</text>
  <rect class="assistant-vs-search-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="assistant-vs-search-name" x="46" y="122">A search box</text>
  <text class="assistant-vs-search-desc" x="46" y="142">Returns pages.</text>
  <text class="assistant-vs-search-desc assistant-vs-search-row assistant-vs-search-r0" x="46" y="182">Ranked documents</text>
  <text class="assistant-vs-search-desc assistant-vs-search-row assistant-vs-search-r1" x="46" y="216">The reader synthesises</text>
  <text class="assistant-vs-search-desc assistant-vs-search-row assistant-vs-search-r2" x="46" y="250">Nothing can be fabricated</text>
  <text class="assistant-vs-search-desc assistant-vs-search-row assistant-vs-search-r3" x="46" y="284">Instant and free</text>
  <text class="assistant-vs-search-desc assistant-vs-search-row assistant-vs-search-r4" x="46" y="318">Right when the reader knows the vocabulary</text>
  <rect class="assistant-vs-search-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="assistant-vs-search-name" x="526" y="122">An assistant</text>
  <text class="assistant-vs-search-desc" x="526" y="142">Returns an answer.</text>
  <text class="assistant-vs-search-desc assistant-vs-search-row assistant-vs-search-r0" x="526" y="182">One answer across several pages</text>
  <text class="assistant-vs-search-desc assistant-vs-search-row assistant-vs-search-r1" x="526" y="216">The system synthesises</text>
  <text class="assistant-vs-search-desc assistant-vs-search-row assistant-vs-search-r2" x="526" y="250">Fabrication possible, so cite and verify</text>
  <text class="assistant-vs-search-desc assistant-vs-search-row assistant-vs-search-r3" x="526" y="284">Seconds, and metered</text>
  <text class="assistant-vs-search-desc assistant-vs-search-row assistant-vs-search-r4" x="526" y="318">Right when the answer spans documents</text>
  <text class="assistant-vs-search-sub" x="30" y="372">Offering both is nearly free and covers the cases where the reader wanted the page rather than a summary, which is more often than the assistant framing suggests.</text>
</svg>
