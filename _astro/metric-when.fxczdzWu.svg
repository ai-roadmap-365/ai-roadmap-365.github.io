<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the task.">
  <title>Which metric when</title>
  <style>
    .metric-when-bg   { fill: #f8fafc; }
    .metric-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .metric-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .metric-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .metric-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .metric-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .metric-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .metric-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .metric-when-row { opacity: 1; }
    .metric-when-r0 { animation-delay: 0.00s; }
    .metric-when-r1 { animation-delay: 0.45s; }
    .metric-when-r2 { animation-delay: 0.90s; }
    .metric-when-r3 { animation-delay: 1.35s; }
    .metric-when-r4 { animation-delay: 1.80s; }
    .metric-when-row { animation: metric-when-reveal 7.3s ease-in-out infinite; }
    @keyframes metric-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="metric-when-bg" width="980" height="390"/>
  <text class="metric-when-h1"  x="30" y="40">Which metric when</text>
  <text class="metric-when-sub" x="30" y="64">By the task.</text>
  <rect class="metric-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="metric-when-name" x="46" y="122">The task</text>
  <text class="metric-when-desc" x="46" y="142">What you are doing.</text>
  <text class="metric-when-desc metric-when-row metric-when-r0" x="46" y="182">Balanced classification</text>
  <text class="metric-when-desc metric-when-row metric-when-r1" x="46" y="216">Imbalanced classification</text>
  <text class="metric-when-desc metric-when-row metric-when-r2" x="46" y="250">Costs known in real units</text>
  <text class="metric-when-desc metric-when-row metric-when-r3" x="46" y="284">Regression with outliers</text>
  <text class="metric-when-desc metric-when-row metric-when-r4" x="46" y="318">Ranking or recommendation</text>
  <rect class="metric-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="metric-when-name" x="526" y="122">The metric</text>
  <text class="metric-when-desc" x="526" y="142">What to use.</text>
  <text class="metric-when-desc metric-when-row metric-when-r0" x="526" y="182">Accuracy, plus the confusion matrix</text>
  <text class="metric-when-desc metric-when-row metric-when-r1" x="526" y="216">Precision-recall curve, or the correlation coefficient</text>
  <text class="metric-when-desc metric-when-row metric-when-r2" x="526" y="250">Expected value, directly</text>
  <text class="metric-when-desc metric-when-row metric-when-r3" x="526" y="284">Mean absolute error, not squared</text>
  <text class="metric-when-desc metric-when-row metric-when-r4" x="526" y="318">Discounted cumulative gain</text>
  <text class="metric-when-sub" x="30" y="372">The third row supersedes all the others whenever it is available, and the effort of establishing the four costs is usually less than the effort of arguing about metrics.</text>
</svg>
