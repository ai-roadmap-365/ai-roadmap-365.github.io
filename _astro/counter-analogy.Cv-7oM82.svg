<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Only one is somewhere you return to.">
  <title>Two counters, identical food</title>
  <style>
    .counter-analogy-bg   { fill: #f8fafc; }
    .counter-analogy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .counter-analogy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .counter-analogy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .counter-analogy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .counter-analogy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .counter-analogy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .counter-analogy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .counter-analogy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .counter-analogy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .counter-analogy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .counter-analogy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .counter-analogy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .counter-analogy-row { opacity: 1; }
    .counter-analogy-r0 { animation-delay: 0.00s; }
    .counter-analogy-r1 { animation-delay: 0.45s; }
    .counter-analogy-r2 { animation-delay: 0.90s; }
    .counter-analogy-r3 { animation-delay: 1.35s; }
    .counter-analogy-r4 { animation-delay: 1.80s; }
    .counter-analogy-row { animation: counter-analogy-reveal 7.3s ease-in-out infinite; }
    @keyframes counter-analogy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="counter-analogy-bg" width="980" height="390"/>
  <text class="counter-analogy-h1"  x="30" y="40">Two counters, identical food</text>
  <text class="counter-analogy-sub" x="30" y="64">Only one is somewhere you return to.</text>
  <rect class="counter-analogy-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="counter-analogy-name" x="46" y="122">No acknowledgement</text>
  <text class="counter-analogy-desc" x="46" y="142">You cannot tell it worked.</text>
  <text class="counter-analogy-desc counter-analogy-row counter-analogy-r0" x="46" y="182">The server turns away silently</text>
  <text class="counter-analogy-desc counter-analogy-row counter-analogy-r1" x="46" y="216">Nothing happens for a while</text>
  <text class="counter-analogy-desc counter-analogy-row counter-analogy-r2" x="46" y="250">You wonder whether to ask again</text>
  <text class="counter-analogy-desc counter-analogy-row counter-analogy-r3" x="46" y="284">Everything arrives at once</text>
  <text class="counter-analogy-desc counter-analogy-row counter-analogy-r4" x="46" y="318">One item missing cancels the order</text>
  <rect class="counter-analogy-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="counter-analogy-name" x="526" y="122">Acknowledged</text>
  <text class="counter-analogy-desc" x="526" y="142">Same food, different experience.</text>
  <text class="counter-analogy-desc counter-analogy-row counter-analogy-r0" x="526" y="182">The order is repeated back at once</text>
  <text class="counter-analogy-desc counter-analogy-row counter-analogy-r1" x="526" y="216">Items arrive as they are ready</text>
  <text class="counter-analogy-desc counter-analogy-row counter-analogy-r2" x="526" y="250">You always know where you stand</text>
  <text class="counter-analogy-desc counter-analogy-row counter-analogy-r3" x="526" y="284">A missing item is told to you</text>
  <text class="counter-analogy-desc counter-analogy-row counter-analogy-r4" x="526" y="318">The rest of the order stands</text>
  <text class="counter-analogy-sub" x="30" y="372">The repeat-back costs nothing and changes everything, which is exactly the position of the waiting state in a streaming interface.</text>
</svg>
