<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="One-vs-Rest Multiclass Decision Flow">
  <title>One-vs-Rest (OvR) Multiclass Decision Flow</title>
  <defs>
    <style>
      .d156f-bg { fill: #f8fafc; }
      .d156f-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d156f-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; }
      .d156f-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; }
      .d156f-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 14px; font-weight: 600; }
      .d156f-arrow { stroke: #2563eb; stroke-width: 2; marker-end: url(#d156f-arr); fill: none; }
      
      @keyframes d156f-glow {
        0%, 100% { stroke: #3b82f6; stroke-width: 2; }
        50% { stroke: #1d4ed8; stroke-width: 3.5; }
      }
      .d156f-pulse { animation: d156f-glow 3s infinite ease-in-out; }
      
      @media (prefers-reduced-motion: reduce) {
        .d156f-pulse { animation: none; stroke: #3b82f6; stroke-width: 2; }
      }
    </style>
    <marker id="d156f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="d156f-bg" />

  <text x="40" y="45" class="d156f-title" font-size="22">One-vs-Rest (OvR) Decision Space Partitioning</text>
  <text x="40" y="70" class="d156f-text">Combining K binary linear classifiers into a complete multiclass partition</text>

  <!-- Query input -->
  <rect x="40" y="190" width="130" height="90" class="d156f-box" />
  <text x="55" y="225" class="d156f-title" font-size="14">Query Point</text>
  <text x="55" y="255" class="d156f-math">x = [x₁, x₂]</text>

  <!-- Arrows to 3 models -->
  <path d="M 170 215 L 230 145" class="d156f-arrow" />
  <path d="M 170 235 L 230 235" class="d156f-arrow" />
  <path d="M 170 255 L 230 325" class="d156f-arrow" />

  <!-- Binary Classifier A -->
  <rect x="240" y="100" width="220" height="80" class="d156f-box" />
  <text x="255" y="125" class="d156f-title" font-size="13" fill="#dc2626">Model A (Class 0 vs Rest)</text>
  <text x="255" y="150" class="d156f-math">z₀ = w₀ᵀx + b₀ = +1.8</text>
  <text x="255" y="170" class="d156f-text" font-size="11" fill="#64748b">P(Class 0) = 0.858</text>

  <!-- Binary Classifier B -->
  <rect x="240" y="195" width="220" height="80" class="d156f-box" />
  <text x="255" y="220" class="d156f-title" font-size="13" fill="#16a34a">Model B (Class 1 vs Rest)</text>
  <text x="255" y="245" class="d156f-math">z₁ = w₁ᵀx + b₁ = -0.4</text>
  <text x="255" y="265" class="d156f-text" font-size="11" fill="#64748b">P(Class 1) = 0.401</text>

  <!-- Binary Classifier C -->
  <rect x="240" y="290" width="220" height="80" class="d156f-box" />
  <text x="255" y="315" class="d156f-title" font-size="13" fill="#2563eb">Model C (Class 2 vs Rest)</text>
  <text x="255" y="340" class="d156f-math">z₂ = w₂ᵀx + b₂ = -2.1</text>
  <text x="255" y="360" class="d156f-text" font-size="11" fill="#64748b">P(Class 2) = 0.109</text>

  <!-- Arrows to Aggregator -->
  <path d="M 460 140 L 520 215" class="d156f-arrow" />
  <path d="M 460 235 L 520 235" class="d156f-arrow" />
  <path d="M 460 330 L 520 255" class="d156f-arrow" />

  <!-- Argmax Aggregator -->
  <rect x="530" y="170" width="160" height="130" class="d156f-box d156f-pulse" />
  <text x="545" y="200" class="d156f-title" font-size="14" fill="#1e40af">Argmax Rule</text>
  <text x="545" y="230" class="d156f-math">ŷ = argmax (z_k)</text>
  <text x="545" y="260" class="d156f-text">Winner: Model A</text>
  <text x="545" y="280" class="d156f-math" fill="#dc2626">z₀ = +1.8 (max)</text>

  <!-- Arrow to Output -->
  <path d="M 690 235 L 740 235" class="d156f-arrow" />

  <!-- Final Prediction -->
  <rect x="750" y="190" width="120" height="90" fill="#fef2f2" stroke="#ef4444" stroke-width="2" rx="8" />
  <text x="765" y="225" class="d156f-title" font-size="14" fill="#991b1b">Prediction</text>
  <text x="765" y="255" class="d156f-math" font-size="16" fill="#991b1b">Class 0</text>

  <!-- Footer note -->
  <rect x="40" y="400" width="830" height="60" fill="#f1f5f9" stroke="#cbd5e1" rx="6" />
  <text x="60" y="425" class="d156f-text" font-weight="700" fill="#0f172a">Multiclass Partitioning Property:</text>
  <text x="60" y="445" class="d156f-text">The resulting decision regions in feature space form convex polyhedra separated by piecewise linear boundaries.</text>
</svg>
