<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each with its measurement.">
  <title>Four GPU serving hazards</title>
  <style>
    .gpu-hazards-bg   { fill: #f8fafc; }
    .gpu-hazards-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gpu-hazards-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gpu-hazards-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gpu-hazards-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gpu-hazards-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gpu-hazards-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gpu-hazards-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gpu-hazards-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gpu-hazards-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gpu-hazards-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gpu-hazards-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gpu-hazards-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .gpu-hazards-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .gpu-hazards-stage { opacity: 1; }

    .gpu-hazards-s0 { animation-delay: 0.00s; }
    .gpu-hazards-e0 { animation-delay: 0.00s; }
    .gpu-hazards-s1 { animation-delay: 1.28s; }
    .gpu-hazards-e1 { animation-delay: 1.28s; }
    .gpu-hazards-s2 { animation-delay: 2.56s; }
    .gpu-hazards-e2 { animation-delay: 2.56s; }
    .gpu-hazards-s3 { animation-delay: 3.84s; }
    .gpu-hazards-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .gpu-hazards-conn  { animation: gpu-hazards-trace 6.4s ease-in-out infinite; }
      .gpu-hazards-stage { animation: gpu-hazards-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes gpu-hazards-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes gpu-hazards-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .gpu-hazards-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .gpu-hazards-stage { animation: gpu-hazards-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes gpu-hazards-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="gpu-hazards-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="gpu-hazards-bg" width="980" height="322"/>
  <text class="gpu-hazards-h1"  x="30" y="40">Four GPU serving hazards</text>
  <text class="gpu-hazards-sub" x="30" y="64">Each with its measurement.</text>
  <g class="gpu-hazards-stage gpu-hazards-s0">
    <rect class="gpu-hazards-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="gpu-hazards-step" x="44" y="142">01</text>
    <text class="gpu-hazards-name" x="70" y="142">PCIe instead of NVLink</text>
    <text class="gpu-hazards-desc" x="44" y="166">64 GB/s against 900. Tensor</text>
    <text class="gpu-hazards-desc" x="44" y="182">cores stall on activations.</text>
    <text class="gpu-hazards-edge" x="44" y="242">14x</text>
  </g>
  <line class="gpu-hazards-line gpu-hazards-conn gpu-hazards-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#gpu-hazards-tip)"/>
  <g class="gpu-hazards-stage gpu-hazards-s1">
    <rect class="gpu-hazards-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="gpu-hazards-step" x="280" y="142">02</text>
    <text class="gpu-hazards-name" x="306" y="142">No dynamic batching</text>
    <text class="gpu-hazards-desc" x="280" y="166">85% of matrix-multiply capacity</text>
    <text class="gpu-hazards-desc" x="280" y="182">lost to kernel launch overhead.</text>
    <text class="gpu-hazards-edge" x="280" y="242">85%</text>
  </g>
  <line class="gpu-hazards-line gpu-hazards-conn gpu-hazards-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#gpu-hazards-tip)"/>
  <g class="gpu-hazards-stage gpu-hazards-s2">
    <rect class="gpu-hazards-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="gpu-hazards-step" x="516" y="142">03</text>
    <text class="gpu-hazards-name" x="542" y="142">Unpinned host memory</text>
    <text class="gpu-hazards-desc" x="516" y="166">15-30 ms of synchronous page</text>
    <text class="gpu-hazards-desc" x="516" y="182">locking before any computation.</text>
    <text class="gpu-hazards-edge" x="516" y="242">30 ms</text>
  </g>
  <line class="gpu-hazards-line gpu-hazards-conn gpu-hazards-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#gpu-hazards-tip)"/>
  <g class="gpu-hazards-stage gpu-hazards-s3">
    <rect class="gpu-hazards-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="gpu-hazards-step" x="752" y="142">04</text>
    <text class="gpu-hazards-name" x="778" y="142">KV cache exhaustion</text>
    <text class="gpu-hazards-desc" x="752" y="166">Requests queue on memory, not</text>
    <text class="gpu-hazards-desc" x="752" y="182">compute. Cap the allocation</text>
    <text class="gpu-hazards-desc" x="752" y="198">pool.</text>
    <text class="gpu-hazards-edge" x="752" y="242">OOM</text>
  </g>
  <text class="gpu-hazards-sub" x="30" y="304">The fourth presents as a throughput cliff rather than an error: concurrency rises smoothly until the cache is full, and then new requests wait for memory that only completing requests can release.</text>
</svg>
