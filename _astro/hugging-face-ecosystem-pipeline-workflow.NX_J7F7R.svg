<svg role="img" aria-label="Hugging Face ecosystem pipeline diagram showing Hub model download AutoTokenizer tokenization Dataset collation Trainer execution and evaluation" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>Hugging Face Ecosystem Training Pipeline</title>
  <defs>
    <linearGradient id="bg230a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card230" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg230a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">HUGGING FACE TRANSFORMERS END-TO-END PIPELINE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">From Raw Text to Production Fine-Tuned Model: Tokenizer, Dataset, Trainer, and Evaluator</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card230)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Step 1: Raw Text & Dataset -->
    <rect x="25" y="35" width="150" height="100" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="100" y="60" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">1. HF Datasets</text>
    <text x="100" y="85" fill="#cbd5e1" font-size="9" text-anchor="middle">Raw Text Records</text>
    <text x="100" y="105" fill="#94a3b8" font-size="8" text-anchor="middle">Arrow / Memory-Mapped</text>
    <text x="100" y="122" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">load_dataset("imdb")</text>

    <!-- Arrow 1 -> 2 -->
    <line x1="175" y1="85" x2="205" y2="85" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="205,85 197,80 197,90" fill="#38bdf8"/>

    <!-- Step 2: AutoTokenizer -->
    <rect x="210" y="35" width="155" height="100" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="287" y="60" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">2. AutoTokenizer</text>
    <text x="287" y="85" fill="#cbd5e1" font-size="9" text-anchor="middle">Rust Fast Tokenizer</text>
    <text x="287" y="105" fill="#94a3b8" font-size="8" text-anchor="middle">input_ids, attn_mask</text>
    <text x="287" y="122" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">truncation=True</text>

    <!-- Arrow 2 -> 3 -->
    <line x1="365" y1="85" x2="395" y2="85" stroke="#fbbf24" stroke-width="2"/>
    <polygon points="395,85 387,80 387,90" fill="#fbbf24"/>

    <!-- Step 3: DataCollator -->
    <rect x="400" y="35" width="155" height="100" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" rx="6"/>
    <text x="477" y="60" fill="#c084fc" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">3. DataCollator</text>
    <text x="477" y="85" fill="#cbd5e1" font-size="9" text-anchor="middle">Dynamic Batch Padding</text>
    <text x="477" y="105" fill="#94a3b8" font-size="8" text-anchor="middle">Pads to batch max len</text>
    <text x="477" y="122" fill="#c084fc" font-size="8" font-weight="700" text-anchor="middle">DataCollatorWithPadding</text>

    <!-- Arrow 3 -> 4 -->
    <line x1="555" y1="85" x2="585" y2="85" stroke="#a855f7" stroke-width="2"/>
    <polygon points="585,85 577,80 577,90" fill="#a855f7"/>

    <!-- Step 4: AutoModel & Trainer -->
    <rect x="590" y="35" width="145" height="100" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="662" y="60" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">4. HF Trainer</text>
    <text x="662" y="85" fill="#cbd5e1" font-size="9" text-anchor="middle">AutoModelForSeqClf</text>
    <text x="662" y="105" fill="#94a3b8" font-size="8" text-anchor="middle">Mixed Precision (fp16)</text>
    <text x="662" y="122" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">trainer.train()</text>

    <!-- Bottom Container: Production Training Loop Details -->
    <rect x="25" y="160" width="710" height="115" fill="#0f172a" stroke="#64748b" rx="6"/>
    <text x="380" y="185" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">TRAINING PIPELINE HIGHLIGHTS &amp; BEST PRACTICES</text>
    <text x="70" y="212" fill="#38bdf8" font-size="9">• Dynamic Padding:</text>
    <text x="210" y="212" fill="#cbd5e1" font-size="9">Pads to batch length instead of dataset max (slashes padding waste by 60%).</text>
    <text x="70" y="235" fill="#34d399" font-size="9">• Metric Compute:</text>
    <text x="210" y="235" fill="#cbd5e1" font-size="9">`compute_metrics` converts logits via argmax and calculates Accuracy/F1.</text>
    <text x="70" y="258" fill="#fbbf24" font-size="9">• Model Export:</text>
    <text x="210" y="258" fill="#cbd5e1" font-size="9">`model.save_pretrained("./model")` saves config, tokenizer, and safetensors.</text>
  </g>
</svg>
