<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And nothing else.">
  <title>Three ingredients</title>
  <style>
    .three-ingredients-bg   { fill: #f8fafc; }
    .three-ingredients-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-ingredients-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-ingredients-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-ingredients-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-ingredients-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-ingredients-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-ingredients-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-ingredients-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-ingredients-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-ingredients-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-ingredients-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-ingredients-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .three-ingredients-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .three-ingredients-stage { opacity: 1; }

    .three-ingredients-s0 { animation-delay: 0.00s; }
    .three-ingredients-e0 { animation-delay: 0.00s; }
    .three-ingredients-s1 { animation-delay: 1.50s; }
    .three-ingredients-e1 { animation-delay: 1.50s; }
    .three-ingredients-s2 { animation-delay: 3.00s; }
    .three-ingredients-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .three-ingredients-conn  { animation: three-ingredients-trace 6s ease-in-out infinite; }
      .three-ingredients-stage { animation: three-ingredients-arrive 6s ease-in-out infinite; }
    }
    @keyframes three-ingredients-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes three-ingredients-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .three-ingredients-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .three-ingredients-stage { animation: three-ingredients-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes three-ingredients-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="three-ingredients-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="three-ingredients-bg" width="980" height="322"/>
  <text class="three-ingredients-h1"  x="30" y="40">Three ingredients</text>
  <text class="three-ingredients-sub" x="30" y="64">And nothing else.</text>
  <g class="three-ingredients-stage three-ingredients-s0">
    <rect class="three-ingredients-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="three-ingredients-step" x="44" y="142">01</text>
    <text class="three-ingredients-name" x="70" y="142">A family of candidate rules</text>
    <text class="three-ingredients-desc" x="44" y="166">Straight lines, trees, networks. Chosen</text>
    <text class="three-ingredients-desc" x="44" y="182">before fitting.</text>
  </g>
  <line class="three-ingredients-line three-ingredients-conn three-ingredients-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#three-ingredients-tip)"/>
  <g class="three-ingredients-stage three-ingredients-s1">
    <rect class="three-ingredients-good" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="three-ingredients-step" x="359" y="142">02</text>
    <text class="three-ingredients-name" x="385" y="142">A measure of how badly a candidate fits</text>
    <text class="three-ingredients-desc" x="359" y="166">The loss, which encodes what you care about.</text>
  </g>
  <line class="three-ingredients-line three-ingredients-conn three-ingredients-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#three-ingredients-tip)"/>
  <g class="three-ingredients-stage three-ingredients-s2">
    <rect class="three-ingredients-box" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="three-ingredients-step" x="674" y="142">03</text>
    <text class="three-ingredients-name" x="700" y="142">And a search for the candidate that scores best</text>
    <text class="three-ingredients-desc" x="674" y="166">Which is all that training ever is.</text>
  </g>
  <text class="three-ingredients-sub" x="30" y="304">Every method in this curriculum is these three choices, which is why the differences between them are less mysterious once the three are named.</text>
</svg>
