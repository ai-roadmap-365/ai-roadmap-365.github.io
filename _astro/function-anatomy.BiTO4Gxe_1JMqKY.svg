<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" font-family="system-ui, sans-serif">
  <title>The anatomy of a Python function: the def keyword, the function name, the parameter list in parentheses, the indented body with its docstring, and the return statement that hands a value back to the caller</title>
  <rect x="0" y="0" width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Anatomy of a function</text>

  <!-- The definition block -->
  <rect x="150" y="70" width="460" height="212" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="8"/>

  <!-- The def line, drawn as labelled tokens -->
  <text x="176" y="118" font-size="18" font-weight="bold" fill="#1d4ed8">def</text>
  <text x="224" y="118" font-size="18" font-weight="bold" fill="#1a202c">summarize</text>
  <text x="330" y="118" font-size="18" fill="#1a202c">(</text>
  <text x="344" y="118" font-size="18" font-weight="bold" fill="#1a202c">numbers</text>
  <text x="432" y="118" font-size="18" fill="#1a202c">) :</text>

  <!-- body -->
  <text x="200" y="152" font-size="15" fill="#1a202c" font-style="italic">"""Return (count, total, min, max, mean)."""</text>
  <text x="200" y="178" font-size="15" fill="#1a202c">count = len(numbers)</text>
  <text x="200" y="200" font-size="15" fill="#1a202c">total = sum(numbers)</text>
  <text x="200" y="230" font-size="16" fill="#1a202c"><tspan font-weight="bold" fill="#1d4ed8">return</tspan> (count, total, min(numbers), ...)</text>

  <!-- Labels with leader lines -->
  <!-- def keyword -->
  <text x="30" y="96" font-size="14" font-weight="bold" fill="#1d4ed8">def keyword</text>
  <line x1="90" y1="102" x2="174" y2="110" stroke="#1d4ed8" stroke-width="1.5"/>

  <!-- name -->
  <text x="270" y="60" font-size="14" font-weight="bold" fill="#1d4ed8">name</text>
  <line x1="272" y1="66" x2="260" y2="104" stroke="#1d4ed8" stroke-width="1.5"/>

  <!-- parameters -->
  <text x="470" y="60" font-size="14" font-weight="bold" fill="#1d4ed8">parameter(s)</text>
  <line x1="470" y1="66" x2="392" y2="104" stroke="#1d4ed8" stroke-width="1.5"/>

  <!-- docstring -->
  <text x="628" y="150" font-size="14" font-weight="bold" fill="#1d4ed8">docstring</text>
  <line x1="626" y1="146" x2="474" y2="148" stroke="#1d4ed8" stroke-width="1.5"/>

  <!-- body -->
  <text x="640" y="192" font-size="14" font-weight="bold" fill="#1d4ed8">body</text>
  <line x1="638" y1="188" x2="440" y2="192" stroke="#1d4ed8" stroke-width="1.5"/>

  <!-- return -->
  <text x="628" y="228" font-size="14" font-weight="bold" fill="#1d4ed8">return value</text>
  <line x1="626" y1="224" x2="470" y2="226" stroke="#1d4ed8" stroke-width="1.5"/>

  <!-- The call and the value coming back -->
  <rect x="150" y="330" width="220" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="260" y="360" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">The call (in the caller)</text>
  <text x="260" y="384" text-anchor="middle" font-size="15" fill="#1a202c">result = summarize(data)</text>

  <rect x="440" y="330" width="220" height="70" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="550" y="360" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">The returned value</text>
  <text x="550" y="384" text-anchor="middle" font-size="15" fill="#1a202c">(3, 12, 2, 6, 4.0)</text>

  <!-- arguments go up into the definition -->
  <line x1="260" y1="330" x2="260" y2="288" stroke="#1a202c" stroke-width="2"/>
  <polygon points="260,282 254,294 266,294" fill="#1a202c"/>
  <text x="150" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">arguments in</text>

  <!-- return comes back to the value -->
  <line x1="470" y1="240" x2="550" y2="326" stroke="#1a202c" stroke-width="2"/>
  <polygon points="550,326 540,318 546,330" fill="#1a202c"/>
  <text x="600" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">value out</text>

  <text x="380" y="440" text-anchor="middle" font-size="14" fill="#1a202c">A parameter is a name in the definition; an argument is the value you pass at the call.</text>
</svg>
