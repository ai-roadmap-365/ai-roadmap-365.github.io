<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two failures, and the compromise.">
  <title>Words, characters, or subwords</title>
  <style>
    .words-or-subwords-bg   { fill: #f8fafc; }
    .words-or-subwords-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .words-or-subwords-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .words-or-subwords-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .words-or-subwords-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .words-or-subwords-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .words-or-subwords-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .words-or-subwords-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .words-or-subwords-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .words-or-subwords-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .words-or-subwords-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .words-or-subwords-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .words-or-subwords-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .words-or-subwords-row { opacity: 1; }
    .words-or-subwords-r0 { animation-delay: 0.00s; }
    .words-or-subwords-r1 { animation-delay: 0.45s; }
    .words-or-subwords-r2 { animation-delay: 0.90s; }
    .words-or-subwords-r3 { animation-delay: 1.35s; }
    .words-or-subwords-r4 { animation-delay: 1.80s; }
    .words-or-subwords-row { animation: words-or-subwords-reveal 7.3s ease-in-out infinite; }
    @keyframes words-or-subwords-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="words-or-subwords-bg" width="980" height="390"/>
  <text class="words-or-subwords-h1"  x="30" y="40">Words, characters, or subwords</text>
  <text class="words-or-subwords-sub" x="30" y="64">Two failures, and the compromise.</text>
  <rect class="words-or-subwords-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="words-or-subwords-name" x="46" y="122">The two extremes</text>
  <text class="words-or-subwords-desc" x="46" y="142">Both fail.</text>
  <text class="words-or-subwords-desc words-or-subwords-row words-or-subwords-r0" x="46" y="182">Whole words: an enormous vocabulary</text>
  <text class="words-or-subwords-desc words-or-subwords-row words-or-subwords-r1" x="46" y="216">And every unseen word is unknown</text>
  <text class="words-or-subwords-desc words-or-subwords-row words-or-subwords-r2" x="46" y="250">Characters: a tiny vocabulary</text>
  <text class="words-or-subwords-desc words-or-subwords-row words-or-subwords-r3" x="46" y="284">And sequences many times longer</text>
  <text class="words-or-subwords-desc words-or-subwords-row words-or-subwords-r4" x="46" y="318">Neither is usable at scale</text>
  <rect class="words-or-subwords-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="words-or-subwords-name" x="526" y="122">Subwords</text>
  <text class="words-or-subwords-desc" x="526" y="142">Between them.</text>
  <text class="words-or-subwords-desc words-or-subwords-row words-or-subwords-r0" x="526" y="182">Frequent words stay whole</text>
  <text class="words-or-subwords-desc words-or-subwords-row words-or-subwords-r1" x="526" y="216">Rare words split into known pieces</text>
  <text class="words-or-subwords-desc words-or-subwords-row words-or-subwords-r2" x="526" y="250">No unknown token, ever</text>
  <text class="words-or-subwords-desc words-or-subwords-row words-or-subwords-r3" x="526" y="284">Vocabulary in the tens of thousands</text>
  <text class="words-or-subwords-desc words-or-subwords-row words-or-subwords-r4" x="526" y="318">Sequence length close to word count</text>
  <text class="words-or-subwords-sub" x="30" y="372">"No unknown token, ever" is the property that mattered most: a subword vocabulary covering every byte can represent any string, including ones the training corpus never contained.</text>
</svg>
