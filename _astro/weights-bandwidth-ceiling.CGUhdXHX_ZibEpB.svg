<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" role="img"
     aria-label="How model size and memory bandwidth set a token-per-second ceiling">
  <title>Weights, bandwidth, and the token ceiling</title>
  <style>
    .d003b-bg    { fill: #f8fafc; }
    .d003b-h1    { fill: #1a202c; font-size: 22px; font-weight: 700;
                   font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .d003b-sub   { fill: #475569; font-size: 14px;
                   font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .d003b-lbl   { fill: #1a202c; font-size: 14px; font-weight: 600;
                   font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .d003b-note  { fill: #475569; font-size: 13px;
                   font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .d003b-mono  { fill: #1a202c; font-size: 14px;
                   font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .d003b-big   { fill: #1d4ed8; font-size: 26px; font-weight: 700;
                   font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .d003b-box   { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d003b-fp16  { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; }
    .d003b-int4  { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .d003b-arrow { stroke: #64748b; stroke-width: 2; fill: none; }

    /* Motion: a token's worth of weights streams along each bus. The static
       frame already shows both buses and both ceilings; the movement only
       draws attention to the fact that the lower bus carries a quarter of it. */
    .d003b-pkt   { fill: #1d4ed8; opacity: 1; }
    .d003b-pkt-b { fill: #047857; opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
      .d003b-pkt   { animation: d003b-run 4s linear infinite; }
      .d003b-pkt-b { animation: d003b-run 1s linear infinite; }
    }
    @keyframes d003b-run {
      0%   { transform: translateX(0); opacity: 1; }
      100% { transform: translateX(300px); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .d003b-pkt, .d003b-pkt-b { animation: none; transform: translateX(0); opacity: 1; }
    }
  </style>

  <rect class="d003b-bg" width="980" height="470"/>
  <text class="d003b-h1"  x="34" y="40">Inference is a memory-bandwidth problem wearing a maths costume</text>
  <text class="d003b-sub" x="34" y="64">Every token read essentially all the weights once. Bus speed, not arithmetic speed, sets the ceiling.</text>

  <!-- fp16 row -->
  <rect class="d003b-fp16" x="34" y="96" width="210" height="96" rx="8"/>
  <text class="d003b-lbl"  x="50" y="122">7B parameters, fp16</text>
  <text class="d003b-mono" x="50" y="146">2 bytes x 7e9</text>
  <text class="d003b-big"  x="50" y="178">14 GB</text>

  <line class="d003b-arrow" x1="256" y1="144" x2="560" y2="144"/>
  <rect class="d003b-pkt" x="262" y="136" width="56" height="16" rx="3"/>
  <text class="d003b-note" x="300" y="128">one token = one full read of the weights</text>

  <rect class="d003b-box" x="576" y="96" width="170" height="96" rx="8"/>
  <text class="d003b-lbl"  x="592" y="122">memory bus</text>
  <text class="d003b-big"  x="592" y="160">400 GB/s</text>

  <line class="d003b-arrow" x1="758" y1="144" x2="812" y2="144"/>
  <rect class="d003b-fp16" x="820" y="96" width="126" height="96" rx="8"/>
  <text class="d003b-mono" x="836" y="126">400 / 14</text>
  <text class="d003b-big"  x="836" y="164">~30/s</text>

  <!-- int4 row -->
  <rect class="d003b-int4" x="34" y="268" width="210" height="96" rx="8"/>
  <text class="d003b-lbl"  x="50" y="294">same model, 4-bit</text>
  <text class="d003b-mono" x="50" y="318">0.5 bytes x 7e9</text>
  <text class="d003b-big"  x="50" y="350" fill="#047857">3.5 GB</text>

  <line class="d003b-arrow" x1="256" y1="316" x2="560" y2="316"/>
  <rect class="d003b-pkt-b" x="262" y="308" width="14" height="16" rx="3"/>
  <text class="d003b-note" x="300" y="300">a quarter of the bytes, so four times as often</text>

  <rect class="d003b-box" x="576" y="268" width="170" height="96" rx="8"/>
  <text class="d003b-lbl"  x="592" y="294">same bus</text>
  <text class="d003b-big"  x="592" y="332">400 GB/s</text>

  <line class="d003b-arrow" x1="758" y1="316" x2="812" y2="316"/>
  <rect class="d003b-int4" x="820" y="268" width="126" height="96" rx="8"/>
  <text class="d003b-mono" x="836" y="298">400 / 3.5</text>
  <text class="d003b-big"  x="836" y="336" fill="#047857">~114/s</text>

  <text class="d003b-note" x="34" y="410">Quantisation buys twice: the model now fits in fast memory, and each token moves a quarter of the bytes.</text>
  <text class="d003b-note" x="34" y="434">Spill out of fast memory and the weights stream from the level below — a step down the pyramid, not a small penalty.</text>
  <text class="d003b-note" x="34" y="458">Figures are order-of-magnitude: they show the shape of the constraint, not a benchmark of any particular machine.</text>
</svg>
