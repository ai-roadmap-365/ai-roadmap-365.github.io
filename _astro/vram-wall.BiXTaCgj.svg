<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Why full fine-tuning does not fit.">
  <title>The memory wall</title>
  <style>
    .vram-wall-bg   { fill: #f8fafc; }
    .vram-wall-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vram-wall-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vram-wall-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vram-wall-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vram-wall-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vram-wall-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vram-wall-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .vram-wall-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .vram-wall-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .vram-wall-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .vram-wall-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .vram-wall-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .vram-wall-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .vram-wall-stage { opacity: 1; }

    .vram-wall-s0 { animation-delay: 0.00s; }
    .vram-wall-e0 { animation-delay: 0.00s; }
    .vram-wall-s1 { animation-delay: 1.28s; }
    .vram-wall-e1 { animation-delay: 1.28s; }
    .vram-wall-s2 { animation-delay: 2.56s; }
    .vram-wall-e2 { animation-delay: 2.56s; }
    .vram-wall-s3 { animation-delay: 3.84s; }
    .vram-wall-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .vram-wall-conn  { animation: vram-wall-trace 6.4s ease-in-out infinite; }
      .vram-wall-stage { animation: vram-wall-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes vram-wall-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes vram-wall-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .vram-wall-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .vram-wall-stage { animation: vram-wall-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes vram-wall-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="vram-wall-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="vram-wall-bg" width="980" height="322"/>
  <text class="vram-wall-h1"  x="30" y="40">The memory wall</text>
  <text class="vram-wall-sub" x="30" y="64">Why full fine-tuning does not fit.</text>
  <g class="vram-wall-stage vram-wall-s0">
    <rect class="vram-wall-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="vram-wall-step" x="44" y="142">01</text>
    <text class="vram-wall-name" x="70" y="142">The weights themselves</text>
    <text class="vram-wall-desc" x="44" y="166">Which fit for inference.</text>
  </g>
  <line class="vram-wall-line vram-wall-conn vram-wall-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#vram-wall-tip)"/>
  <g class="vram-wall-stage vram-wall-s1">
    <rect class="vram-wall-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="vram-wall-step" x="280" y="142">02</text>
    <text class="vram-wall-name" x="306" y="142">Plus a gradient per weight</text>
    <text class="vram-wall-desc" x="280" y="166">Held through the backward pass.</text>
  </g>
  <line class="vram-wall-line vram-wall-conn vram-wall-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#vram-wall-tip)"/>
  <g class="vram-wall-stage vram-wall-s2">
    <rect class="vram-wall-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="vram-wall-step" x="516" y="142">03</text>
    <text class="vram-wall-name" x="542" y="142">Plus two optimiser tensors per weight</text>
    <text class="vram-wall-desc" x="516" y="166">Which is the largest share.</text>
  </g>
  <line class="vram-wall-line vram-wall-conn vram-wall-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#vram-wall-tip)"/>
  <g class="vram-wall-stage vram-wall-s3">
    <rect class="vram-wall-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="vram-wall-step" x="752" y="142">04</text>
    <text class="vram-wall-name" x="778" y="142">Several times the model, to train it</text>
    <text class="vram-wall-desc" x="752" y="166">Which is why inference fits and</text>
    <text class="vram-wall-desc" x="752" y="182">training does not.</text>
  </g>
  <text class="vram-wall-sub" x="30" y="304">Adapters attack the third row specifically: with almost nothing trainable, the optimiser state nearly disappears and the requirement collapses back toward inference.</text>
</svg>
