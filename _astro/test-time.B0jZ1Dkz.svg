<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Instead of at training.">
  <title>Buying capability at inference</title>
  <style>
    .test-time-bg   { fill: #f8fafc; }
    .test-time-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-time-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-time-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-time-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-time-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-time-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .test-time-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .test-time-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .test-time-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .test-time-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .test-time-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .test-time-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .test-time-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .test-time-stage { opacity: 1; }

    .test-time-s0 { animation-delay: 0.00s; }
    .test-time-e0 { animation-delay: 0.00s; }
    .test-time-s1 { animation-delay: 1.28s; }
    .test-time-e1 { animation-delay: 1.28s; }
    .test-time-s2 { animation-delay: 2.56s; }
    .test-time-e2 { animation-delay: 2.56s; }
    .test-time-s3 { animation-delay: 3.84s; }
    .test-time-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .test-time-conn  { animation: test-time-trace 6.4s ease-in-out infinite; }
      .test-time-stage { animation: test-time-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes test-time-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes test-time-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .test-time-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .test-time-stage { animation: test-time-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes test-time-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="test-time-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="test-time-bg" width="980" height="322"/>
  <text class="test-time-h1"  x="30" y="40">Buying capability at inference</text>
  <text class="test-time-sub" x="30" y="64">Instead of at training.</text>
  <g class="test-time-stage test-time-s0">
    <rect class="test-time-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="test-time-step" x="44" y="142">01</text>
    <text class="test-time-name" x="70" y="142">The model is fixed</text>
    <text class="test-time-desc" x="44" y="166">No training, no fine-tuning.</text>
  </g>
  <line class="test-time-line test-time-conn test-time-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#test-time-tip)"/>
  <g class="test-time-stage test-time-s1">
    <rect class="test-time-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="test-time-step" x="280" y="142">02</text>
    <text class="test-time-name" x="306" y="142">Spend more compute per question</text>
    <text class="test-time-desc" x="280" y="166">Longer reasoning, or several</text>
    <text class="test-time-desc" x="280" y="182">attempts.</text>
  </g>
  <line class="test-time-line test-time-conn test-time-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#test-time-tip)"/>
  <g class="test-time-stage test-time-s2">
    <rect class="test-time-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="test-time-step" x="516" y="142">03</text>
    <text class="test-time-name" x="542" y="142">Aggregate or select among them</text>
    <text class="test-time-desc" x="516" y="166">By voting, or by a verifier.</text>
  </g>
  <line class="test-time-line test-time-conn test-time-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#test-time-tip)"/>
  <g class="test-time-stage test-time-s3">
    <rect class="test-time-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="test-time-step" x="752" y="142">04</text>
    <text class="test-time-name" x="778" y="142">Matching a much larger model on hard problems</text>
    <text class="test-time-desc" x="752" y="166">At a cost paid per request</text>
    <text class="test-time-desc" x="752" y="182">rather than once.</text>
    <text class="test-time-edge" x="752" y="242">per query</text>
  </g>
  <text class="test-time-sub" x="30" y="304">The economics differ from training compute in an important way: this is paid on every request forever, so it suits problems that are rare and valuable rather than high-volume.</text>
</svg>
