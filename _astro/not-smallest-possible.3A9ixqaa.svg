<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Debuggability has a cost that megabytes do not show.">
  <title>Not "as small as possible"</title>
  <style>
    .not-smallest-possible-bg   { fill: #f8fafc; }
    .not-smallest-possible-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-smallest-possible-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-smallest-possible-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-smallest-possible-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-smallest-possible-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-smallest-possible-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-smallest-possible-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .not-smallest-possible-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .not-smallest-possible-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .not-smallest-possible-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .not-smallest-possible-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .not-smallest-possible-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-smallest-possible-row { opacity: 1; }
    .not-smallest-possible-r0 { animation-delay: 0.00s; }
    .not-smallest-possible-r1 { animation-delay: 0.45s; }
    .not-smallest-possible-r2 { animation-delay: 0.90s; }
    .not-smallest-possible-r3 { animation-delay: 1.35s; }
    .not-smallest-possible-r4 { animation-delay: 1.80s; }
    .not-smallest-possible-row { animation: not-smallest-possible-reveal 7.3s ease-in-out infinite; }
    @keyframes not-smallest-possible-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="not-smallest-possible-bg" width="980" height="390"/>
  <text class="not-smallest-possible-h1"  x="30" y="40">Not "as small as possible"</text>
  <text class="not-smallest-possible-sub" x="30" y="64">Debuggability has a cost that megabytes do not show.</text>
  <rect class="not-smallest-possible-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="not-smallest-possible-name" x="46" y="122">The goal</text>
  <text class="not-smallest-possible-desc" x="46" y="142">Deploy time, not disk.</text>
  <text class="not-smallest-possible-desc not-smallest-possible-row not-smallest-possible-r0" x="46" y="182">Nobody minds a big file on a laptop</text>
  <text class="not-smallest-possible-desc not-smallest-possible-row not-smallest-possible-r1" x="46" y="216">Everybody minds a slow rollout</text>
  <text class="not-smallest-possible-desc not-smallest-possible-row not-smallest-possible-r2" x="46" y="250">Size times nodes is the real number</text>
  <text class="not-smallest-possible-desc not-smallest-possible-row not-smallest-possible-r3" x="46" y="284">Ship the framework once</text>
  <text class="not-smallest-possible-desc not-smallest-possible-row not-smallest-possible-r4" x="46" y="318">Get the weights out</text>
  <rect class="not-smallest-possible-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="not-smallest-possible-name" x="526" y="122">Misreadings</text>
  <text class="not-smallest-possible-desc" x="526" y="142">Three, all common.</text>
  <text class="not-smallest-possible-desc not-smallest-possible-row not-smallest-possible-r0" x="526" y="182">"Make it as small as possible"</text>
  <text class="not-smallest-possible-desc not-smallest-possible-row not-smallest-possible-r1" x="526" y="216">A distroless image you cannot debug at 3am</text>
  <text class="not-smallest-possible-desc not-smallest-possible-row not-smallest-possible-r2" x="526" y="250">"Avoid large frameworks" — torch is 2.4 GB because it does a lot</text>
  <text class="not-smallest-possible-desc not-smallest-possible-row not-smallest-possible-r3" x="526" y="284">"Compression will fix it" — these are compressed sizes</text>
  <text class="not-smallest-possible-desc not-smallest-possible-row not-smallest-possible-r4" x="526" y="318">Squashing layers reduces count, not size</text>
  <text class="not-smallest-possible-sub" x="30" y="372">What reduces size is not putting the thing in. Every other mechanism — squashing, compression, layer tricks — is rearranging bytes that are still travelling to every node.</text>
</svg>
