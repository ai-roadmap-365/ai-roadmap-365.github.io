<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things these metrics are not</title>
  <style>
    .metric-not-152-bg   { fill: #f8fafc; }
    .metric-not-152-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-not-152-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-not-152-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-not-152-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-not-152-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-not-152-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .metric-not-152-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .metric-not-152-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .metric-not-152-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .metric-not-152-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .metric-not-152-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .metric-not-152-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .metric-not-152-row { opacity: 1; }
    .metric-not-152-r0 { animation-delay: 0.00s; }
    .metric-not-152-r1 { animation-delay: 0.45s; }
    .metric-not-152-r2 { animation-delay: 0.90s; }
    .metric-not-152-r3 { animation-delay: 1.35s; }
    .metric-not-152-r4 { animation-delay: 1.80s; }
    .metric-not-152-row { animation: metric-not-152-reveal 7.3s ease-in-out infinite; }
    @keyframes metric-not-152-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="metric-not-152-bg" width="980" height="390"/>
  <text class="metric-not-152-h1"  x="30" y="40">Four things these metrics are not</text>
  <text class="metric-not-152-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="metric-not-152-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="metric-not-152-name" x="46" y="122">The misconception</text>
  <text class="metric-not-152-desc" x="46" y="142">Commonly held.</text>
  <text class="metric-not-152-desc metric-not-152-row metric-not-152-r0" x="46" y="182">R-squared runs from zero to one</text>
  <text class="metric-not-152-desc metric-not-152-row metric-not-152-r1" x="46" y="216">A high training statistic means a good model</text>
  <text class="metric-not-152-desc metric-not-152-row metric-not-152-r2" x="46" y="250">The adjusted version solves the noise problem</text>
  <text class="metric-not-152-desc metric-not-152-row metric-not-152-r3" x="46" y="284">Percentage error penalises the two directions differently</text>
  <text class="metric-not-152-desc metric-not-152-row metric-not-152-r4" x="46" y="318">Metrics are comparable across datasets</text>
  <rect class="metric-not-152-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="metric-not-152-name" x="526" y="122">What is true</text>
  <text class="metric-not-152-desc" x="526" y="142">Actually.</text>
  <text class="metric-not-152-desc metric-not-152-row metric-not-152-r0" x="526" y="182">It is unbounded below; -4.7009 was measured</text>
  <text class="metric-not-152-desc metric-not-152-row metric-not-152-r1" x="526" y="216">It rises with any added column, including noise</text>
  <text class="metric-not-152-desc metric-not-152-row metric-not-152-r2" x="526" y="250">Only until predictors approach rows</text>
  <text class="metric-not-152-desc metric-not-152-row metric-not-152-r3" x="526" y="284">Equal-magnitude errors score identically</text>
  <text class="metric-not-152-desc metric-not-152-row metric-not-152-r4" x="526" y="318">Only against the same baseline variance</text>
  <text class="metric-not-152-sub" x="30" y="372">Every row on the right was measured rather than reasoned about, which is what makes this lesson's corrections worth carrying forward.</text>
</svg>
