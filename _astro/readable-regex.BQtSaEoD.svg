<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Wrongly, in three months.">
  <title>The regex you cannot read is the one you will rewrite</title>
  <style>
    .readable-regex-bg   { fill: #f8fafc; }
    .readable-regex-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readable-regex-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readable-regex-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readable-regex-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readable-regex-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readable-regex-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .readable-regex-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .readable-regex-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .readable-regex-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .readable-regex-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .readable-regex-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .readable-regex-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .readable-regex-row { opacity: 1; }
    .readable-regex-r0 { animation-delay: 0.00s; }
    .readable-regex-r1 { animation-delay: 0.45s; }
    .readable-regex-r2 { animation-delay: 0.90s; }
    .readable-regex-r3 { animation-delay: 1.35s; }
    .readable-regex-r4 { animation-delay: 1.80s; }
    .readable-regex-row { animation: readable-regex-reveal 7.3s ease-in-out infinite; }
    @keyframes readable-regex-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="readable-regex-bg" width="980" height="390"/>
  <text class="readable-regex-h1"  x="30" y="40">The regex you cannot read is the one you will rewrite</text>
  <text class="readable-regex-sub" x="30" y="64">Wrongly, in three months.</text>
  <rect class="readable-regex-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="readable-regex-name" x="46" y="122">One dense line</text>
  <text class="readable-regex-desc" x="46" y="142">Write-only.</text>
  <text class="readable-regex-desc readable-regex-row readable-regex-r0" x="46" y="182">No indication of intent</text>
  <text class="readable-regex-desc readable-regex-row readable-regex-r1" x="46" y="216">Numbered groups: what was \\3 again?</text>
  <text class="readable-regex-desc readable-regex-row readable-regex-r2" x="46" y="250">Impossible to review meaningfully</text>
  <text class="readable-regex-desc readable-regex-row readable-regex-r3" x="46" y="284">Nobody dares change it</text>
  <text class="readable-regex-desc readable-regex-row readable-regex-r4" x="46" y="318">So it gets rewritten from scratch</text>
  <rect class="readable-regex-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="readable-regex-name" x="526" y="122">Named, commented, or split</text>
  <text class="readable-regex-desc" x="526" y="142">Readable in six months.</text>
  <text class="readable-regex-desc readable-regex-row readable-regex-r0" x="526" y="182">Named groups say what each field is</text>
  <text class="readable-regex-desc readable-regex-row readable-regex-r1" x="526" y="216">Verbose mode allows comments inline</text>
  <text class="readable-regex-desc readable-regex-row readable-regex-r2" x="526" y="250">Two simple patterns beat one clever one</text>
  <text class="readable-regex-desc readable-regex-row readable-regex-r3" x="526" y="284">A reviewer can actually check it</text>
  <text class="readable-regex-desc readable-regex-row readable-regex-r4" x="526" y="318">Changeable without fear</text>
  <text class="readable-regex-sub" x="30" y="372">Comment anything longer than about thirty characters. The cost is one line; the alternative is a pattern nobody in the team will touch, which is a liability whatever it does.</text>
</svg>
