<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things a tool is not</title>
  <style>
    .cli-not-bg   { fill: #f8fafc; }
    .cli-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cli-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cli-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cli-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cli-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cli-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cli-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cli-not-row { opacity: 1; }
    .cli-not-r0 { animation-delay: 0.00s; }
    .cli-not-r1 { animation-delay: 0.45s; }
    .cli-not-r2 { animation-delay: 0.90s; }
    .cli-not-r3 { animation-delay: 1.35s; }
    .cli-not-r4 { animation-delay: 1.80s; }
    .cli-not-row { animation: cli-not-reveal 7.3s ease-in-out infinite; }
    @keyframes cli-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cli-not-bg" width="980" height="390"/>
  <text class="cli-not-h1"  x="30" y="40">Four things a tool is not</text>
  <text class="cli-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="cli-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cli-not-name" x="46" y="122">The misconception</text>
  <text class="cli-not-desc" x="46" y="142">Commonly held.</text>
  <text class="cli-not-desc cli-not-row cli-not-r0" x="46" y="182">Printing the error is enough</text>
  <text class="cli-not-desc cli-not-row cli-not-r1" x="46" y="216">Any output stream will do</text>
  <text class="cli-not-desc cli-not-row cli-not-r2" x="46" y="250">Exit codes are a formality</text>
  <text class="cli-not-desc cli-not-row cli-not-r3" x="46" y="284">Arguments can be parsed by hand</text>
  <text class="cli-not-desc cli-not-row cli-not-r4" x="46" y="318">A tool is just a script with arguments</text>
  <rect class="cli-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cli-not-name" x="526" y="122">What is true</text>
  <text class="cli-not-desc" x="526" y="142">Actually.</text>
  <text class="cli-not-desc cli-not-row cli-not-r0" x="526" y="182">The exit code is what scripts read</text>
  <text class="cli-not-desc cli-not-row cli-not-r1" x="526" y="216">Diagnostics on standard output break pipes</text>
  <text class="cli-not-desc cli-not-row cli-not-r2" x="526" y="250">They are the tool's return value</text>
  <text class="cli-not-desc cli-not-row cli-not-r3" x="526" y="284">Parsing by hand loses help and validation</text>
  <text class="cli-not-desc cli-not-row cli-not-r4" x="526" y="318">A tool has a contract other programs rely on</text>
  <text class="cli-not-sub" x="30" y="372">The contract framing is the useful one: once another program invokes your tool, its arguments, output format and exit codes are an interface.</text>
</svg>
