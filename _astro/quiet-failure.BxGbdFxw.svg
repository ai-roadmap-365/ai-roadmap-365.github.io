<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Which is what makes it expensive.">
  <title>Extraction fails quietly</title>
  <style>
    .quiet-failure-bg   { fill: #f8fafc; }
    .quiet-failure-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quiet-failure-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quiet-failure-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quiet-failure-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quiet-failure-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quiet-failure-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .quiet-failure-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .quiet-failure-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .quiet-failure-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .quiet-failure-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .quiet-failure-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .quiet-failure-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .quiet-failure-row { opacity: 1; }
    .quiet-failure-r0 { animation-delay: 0.00s; }
    .quiet-failure-r1 { animation-delay: 0.45s; }
    .quiet-failure-r2 { animation-delay: 0.90s; }
    .quiet-failure-r3 { animation-delay: 1.35s; }
    .quiet-failure-r4 { animation-delay: 1.80s; }
    .quiet-failure-row { animation: quiet-failure-reveal 7.3s ease-in-out infinite; }
    @keyframes quiet-failure-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="quiet-failure-bg" width="980" height="390"/>
  <text class="quiet-failure-h1"  x="30" y="40">Extraction fails quietly</text>
  <text class="quiet-failure-sub" x="30" y="64">Which is what makes it expensive.</text>
  <rect class="quiet-failure-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="quiet-failure-name" x="46" y="122">A loud failure</text>
  <text class="quiet-failure-desc" x="46" y="142">An exception.</text>
  <text class="quiet-failure-desc quiet-failure-row quiet-failure-r0" x="46" y="182">The extractor raises</text>
  <text class="quiet-failure-desc quiet-failure-row quiet-failure-r1" x="46" y="216">The document is dead-lettered</text>
  <text class="quiet-failure-desc quiet-failure-row quiet-failure-r2" x="46" y="250">Someone sees the error</text>
  <text class="quiet-failure-desc quiet-failure-row quiet-failure-r3" x="46" y="284">The gap is known</text>
  <text class="quiet-failure-desc quiet-failure-row quiet-failure-r4" x="46" y="318">Recoverable</text>
  <rect class="quiet-failure-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="quiet-failure-name" x="526" y="122">A quiet failure</text>
  <text class="quiet-failure-desc" x="526" y="142">A non-empty string.</text>
  <text class="quiet-failure-desc quiet-failure-row quiet-failure-r0" x="526" y="182">A table becomes a run-on sentence</text>
  <text class="quiet-failure-desc quiet-failure-row quiet-failure-r1" x="526" y="216">Two columns spliced line by line</text>
  <text class="quiet-failure-desc quiet-failure-row quiet-failure-r2" x="526" y="250">A scan yields four characters of noise</text>
  <text class="quiet-failure-desc quiet-failure-row quiet-failure-r3" x="526" y="284">It embeds happily and indexes cleanly</text>
  <text class="quiet-failure-desc quiet-failure-row quiet-failure-r4" x="526" y="318">And looks like an embedding problem</text>
  <text class="quiet-failure-sub" x="30" y="372">You can swap embedding models all week and it will not help, because the text was already wrong before it reached them — which is why the gate belongs at extraction rather than downstream.</text>
</svg>
