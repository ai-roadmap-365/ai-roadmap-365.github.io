<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>The pipeline as a state machine</title>
  <style>
    .state-machine-bg   { fill: #f8fafc; }
    .state-machine-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .state-machine-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .state-machine-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .state-machine-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .state-machine-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .state-machine-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .state-machine-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .state-machine-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .state-machine-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .state-machine-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .state-machine-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .state-machine-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .state-machine-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .state-machine-stage { opacity: 1; }

    .state-machine-s0 { animation-delay: 0.00s; }
    .state-machine-e0 { animation-delay: 0.00s; }
    .state-machine-s1 { animation-delay: 1.28s; }
    .state-machine-e1 { animation-delay: 1.28s; }
    .state-machine-s2 { animation-delay: 2.56s; }
    .state-machine-e2 { animation-delay: 2.56s; }
    .state-machine-s3 { animation-delay: 3.84s; }
    .state-machine-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .state-machine-conn  { animation: state-machine-trace 6.4s ease-in-out infinite; }
      .state-machine-stage { animation: state-machine-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes state-machine-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes state-machine-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .state-machine-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .state-machine-stage { animation: state-machine-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes state-machine-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="state-machine-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="state-machine-bg" width="980" height="322"/>
  <text class="state-machine-h1"  x="30" y="40">The pipeline as a state machine</text>
  <text class="state-machine-sub" x="30" y="64">Four properties.</text>
  <g class="state-machine-stage state-machine-s0">
    <rect class="state-machine-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="state-machine-step" x="44" y="142">01</text>
    <text class="state-machine-name" x="70" y="142">Every stage is an explicit state</text>
    <text class="state-machine-desc" x="44" y="166">Not an implicit step in a</text>
    <text class="state-machine-desc" x="44" y="182">function.</text>
  </g>
  <line class="state-machine-line state-machine-conn state-machine-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#state-machine-tip)"/>
  <g class="state-machine-stage state-machine-s1">
    <rect class="state-machine-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="state-machine-step" x="280" y="142">02</text>
    <text class="state-machine-name" x="306" y="142">With defined transitions between them</text>
    <text class="state-machine-desc" x="280" y="166">Including the ones that skip</text>
    <text class="state-machine-desc" x="280" y="182">stages.</text>
  </g>
  <line class="state-machine-line state-machine-conn state-machine-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#state-machine-tip)"/>
  <g class="state-machine-stage state-machine-s2">
    <rect class="state-machine-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="state-machine-step" x="516" y="142">03</text>
    <text class="state-machine-name" x="542" y="142">And a defined failure path from each</text>
    <text class="state-machine-desc" x="516" y="166">Which is what stops a partial</text>
    <text class="state-machine-desc" x="516" y="182">result being served.</text>
  </g>
  <line class="state-machine-line state-machine-conn state-machine-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#state-machine-tip)"/>
  <g class="state-machine-stage state-machine-s3">
    <rect class="state-machine-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="state-machine-step" x="752" y="142">04</text>
    <text class="state-machine-name" x="778" y="142">Every transition recorded</text>
    <text class="state-machine-desc" x="752" y="166">So a failure is attributable to</text>
    <text class="state-machine-desc" x="752" y="182">a stage.</text>
  </g>
  <text class="state-machine-sub" x="30" y="304">Making the states explicit is what makes a multimodal pipeline debuggable: without it, a bad answer gives no indication of which of five stages produced it.</text>
</svg>
