<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Same methods, same codes, different wire.">
  <title>Head-of-line blocking, and what fixed it</title>
  <style>
    .http-multiplexing-bg   { fill: #f8fafc; }
    .http-multiplexing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .http-multiplexing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .http-multiplexing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .http-multiplexing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .http-multiplexing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .http-multiplexing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .http-multiplexing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .http-multiplexing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .http-multiplexing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .http-multiplexing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .http-multiplexing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .http-multiplexing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .http-multiplexing-row { opacity: 1; }
    .http-multiplexing-r0 { animation-delay: 0.00s; }
    .http-multiplexing-r1 { animation-delay: 0.45s; }
    .http-multiplexing-r2 { animation-delay: 0.90s; }
    .http-multiplexing-r3 { animation-delay: 1.35s; }
    .http-multiplexing-r4 { animation-delay: 1.80s; }
    .http-multiplexing-row { animation: http-multiplexing-reveal 7.3s ease-in-out infinite; }
    @keyframes http-multiplexing-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="http-multiplexing-bg" width="980" height="390"/>
  <text class="http-multiplexing-h1"  x="30" y="40">Head-of-line blocking, and what fixed it</text>
  <text class="http-multiplexing-sub" x="30" y="64">Same methods, same codes, different wire.</text>
  <rect class="http-multiplexing-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="http-multiplexing-name" x="46" y="122">HTTP/1.1</text>
  <text class="http-multiplexing-desc" x="46" y="142">One exchange at a time per connection.</text>
  <text class="http-multiplexing-desc http-multiplexing-row http-multiplexing-r0" x="46" y="182">Human-readable text on the wire</text>
  <text class="http-multiplexing-desc http-multiplexing-row http-multiplexing-r1" x="46" y="216">Connections reused, but used serially</text>
  <text class="http-multiplexing-desc http-multiplexing-row http-multiplexing-r2" x="46" y="250">A slow response blocks everything behind it</text>
  <text class="http-multiplexing-desc http-multiplexing-row http-multiplexing-r3" x="46" y="284">Sites opened six connections to work around it</text>
  <text class="http-multiplexing-desc http-multiplexing-row http-multiplexing-r4" x="46" y="318">And bundled files together to reduce requests</text>
  <rect class="http-multiplexing-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="http-multiplexing-name" x="526" y="122">HTTP/2</text>
  <text class="http-multiplexing-desc" x="526" y="142">Many exchanges, one connection.</text>
  <text class="http-multiplexing-desc http-multiplexing-row http-multiplexing-r0" x="526" y="182">Identical methods, headers and status codes</text>
  <text class="http-multiplexing-desc http-multiplexing-row http-multiplexing-r1" x="526" y="216">Compact binary framing</text>
  <text class="http-multiplexing-desc http-multiplexing-row http-multiplexing-r2" x="526" y="250">Streams interleave; a slow one blocks nobody</text>
  <text class="http-multiplexing-desc http-multiplexing-row http-multiplexing-r3" x="526" y="284">One connection is now enough</text>
  <text class="http-multiplexing-desc http-multiplexing-row http-multiplexing-r4" x="526" y="318">The bundling workarounds became unnecessary</text>
  <text class="http-multiplexing-sub" x="30" y="372">HTTP/3 keeps this model and moves it onto QUIC, removing the last blocking that lived in TCP itself. Your mental model does not change across any of the three.</text>
</svg>
