<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And with whom.">
  <title>When to raise ethical questions</title>
  <style>
    .ethics-when-bg   { fill: #f8fafc; }
    .ethics-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ethics-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ethics-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ethics-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ethics-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ethics-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ethics-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ethics-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ethics-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ethics-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ethics-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ethics-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ethics-when-row { opacity: 1; }
    .ethics-when-r0 { animation-delay: 0.00s; }
    .ethics-when-r1 { animation-delay: 0.45s; }
    .ethics-when-r2 { animation-delay: 0.90s; }
    .ethics-when-r3 { animation-delay: 1.35s; }
    .ethics-when-r4 { animation-delay: 1.80s; }
    .ethics-when-row { animation: ethics-when-reveal 7.3s ease-in-out infinite; }
    @keyframes ethics-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="ethics-when-bg" width="980" height="390"/>
  <text class="ethics-when-h1"  x="30" y="40">When to raise ethical questions</text>
  <text class="ethics-when-sub" x="30" y="64">And with whom.</text>
  <rect class="ethics-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="ethics-when-name" x="46" y="122">Review is required</text>
  <text class="ethics-when-desc" x="46" y="142">Four cases.</text>
  <text class="ethics-when-desc ethics-when-row ethics-when-r0" x="46" y="182">Decisions affecting individuals</text>
  <text class="ethics-when-desc ethics-when-row ethics-when-r1" x="46" y="216">Personal or sensitive data</text>
  <text class="ethics-when-desc ethics-when-row ethics-when-r2" x="46" y="250">Systems used at scale</text>
  <text class="ethics-when-desc ethics-when-row ethics-when-r3" x="46" y="284">Any protected characteristic involved</text>
  <text class="ethics-when-desc ethics-when-row ethics-when-r4" x="46" y="318">Before collection, not after</text>
  <rect class="ethics-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="ethics-when-name" x="526" y="122">What it must cover</text>
  <text class="ethics-when-desc" x="526" y="142">Also four.</text>
  <text class="ethics-when-desc ethics-when-row ethics-when-r0" x="526" y="182">Who is represented and who is not</text>
  <text class="ethics-when-desc ethics-when-row ethics-when-r1" x="526" y="216">How errors are distributed across groups</text>
  <text class="ethics-when-desc ethics-when-row ethics-when-r2" x="526" y="250">What recourse an affected person has</text>
  <text class="ethics-when-desc ethics-when-row ethics-when-r3" x="526" y="284">Who is accountable for outcomes</text>
  <text class="ethics-when-desc ethics-when-row ethics-when-r4" x="526" y="318">And how the answer is documented</text>
  <text class="ethics-when-sub" x="30" y="372">Recourse for an affected person is the element most often missing entirely, and a system that offers none is difficult to defend whatever its accuracy.</text>
</svg>
