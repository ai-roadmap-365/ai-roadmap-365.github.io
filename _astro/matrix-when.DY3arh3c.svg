<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to reach for arrays</title>
  <style>
    .matrix-when-bg   { fill: #f8fafc; }
    .matrix-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matrix-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matrix-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matrix-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matrix-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matrix-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .matrix-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .matrix-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .matrix-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .matrix-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .matrix-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .matrix-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .matrix-when-row { opacity: 1; }
    .matrix-when-r0 { animation-delay: 0.00s; }
    .matrix-when-r1 { animation-delay: 0.45s; }
    .matrix-when-r2 { animation-delay: 0.90s; }
    .matrix-when-r3 { animation-delay: 1.35s; }
    .matrix-when-r4 { animation-delay: 1.80s; }
    .matrix-when-row { animation: matrix-when-reveal 7.3s ease-in-out infinite; }
    @keyframes matrix-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="matrix-when-bg" width="980" height="390"/>
  <text class="matrix-when-h1"  x="30" y="40">When to reach for arrays</text>
  <text class="matrix-when-sub" x="30" y="64">And when not to.</text>
  <rect class="matrix-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="matrix-when-name" x="46" y="122">Use arrays</text>
  <text class="matrix-when-desc" x="46" y="142">Four cases.</text>
  <text class="matrix-when-desc matrix-when-row matrix-when-r0" x="46" y="182">Numerical data of uniform type</text>
  <text class="matrix-when-desc matrix-when-row matrix-when-r1" x="46" y="216">The same operation across many values</text>
  <text class="matrix-when-desc matrix-when-row matrix-when-r2" x="46" y="250">Where speed matters</text>
  <text class="matrix-when-desc matrix-when-row matrix-when-r3" x="46" y="284">Anything feeding a model</text>
  <text class="matrix-when-desc matrix-when-row matrix-when-r4" x="46" y="318">Where the shape is known and fixed</text>
  <rect class="matrix-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="matrix-when-name" x="526" y="122">Use something else</text>
  <text class="matrix-when-desc" x="526" y="142">Also four.</text>
  <text class="matrix-when-desc matrix-when-row matrix-when-r0" x="526" y="182">Mixed types per column — use a dataframe</text>
  <text class="matrix-when-desc matrix-when-row matrix-when-r1" x="526" y="216">Ragged or variable-length data</text>
  <text class="matrix-when-desc matrix-when-row matrix-when-r2" x="526" y="250">Small collections where clarity wins</text>
  <text class="matrix-when-desc matrix-when-row matrix-when-r3" x="526" y="284">Where each element needs different logic</text>
  <text class="matrix-when-desc matrix-when-row matrix-when-r4" x="526" y="318">Text and records, before encoding</text>
  <text class="matrix-when-sub" x="30" y="372">The dataframe row is the practical one: real datasets have mixed types per column, which is exactly what arrays are bad at and dataframes exist for.</text>
</svg>
