<svg role="img" aria-label="Visual taxonomy of computer vision tasks comparing image classification object detection semantic segmentation and instance segmentation" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Computer Vision Task Taxonomy: Classification to Segmentation</title>
  <defs>
    <linearGradient id="bg216a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card216" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg216a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">COMPUTER VISION DENSE PREDICTION TAXONOMY</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">From Global Image Categorization to Pixel-Level Instance Segmentation</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card216)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Task 1: Classification -->
    <rect x="20" y="25" width="170" height="245" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="105" y="48" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">1. Classification</text>
    <rect x="30" y="65" width="150" height="90" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="105" y="105" fill="#f8fafc" font-size="10" text-anchor="middle">Global Image Label</text>
    <text x="105" y="130" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">"Dog" (p = 0.98)</text>
    <text x="105" y="180" fill="#cbd5e1" font-size="8" text-anchor="middle">Output: Single Category ID</text>
    <text x="105" y="200" fill="#cbd5e1" font-size="8" text-anchor="middle">No spatial localization</text>
    <text x="105" y="235" fill="#94a3b8" font-size="8" text-anchor="middle">ResNet / ConvNeXt / ViT</text>

    <!-- Task 2: Object Detection -->
    <rect x="205" y="25" width="170" height="245" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="290" y="48" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">2. Object Detection</text>
    <rect x="215" y="65" width="150" height="90" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <rect x="240" y="80" width="100" height="60" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3"/>
    <text x="290" y="115" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">Dog [x, y, w, h]</text>
    <text x="290" y="180" fill="#cbd5e1" font-size="8" text-anchor="middle">Output: Bounding Boxes + IDs</text>
    <text x="290" y="200" fill="#cbd5e1" font-size="8" text-anchor="middle">IoU &amp; Non-Max Suppression</text>
    <text x="290" y="235" fill="#fbbf24" font-size="8" text-anchor="middle">YOLOv8 / Faster R-CNN</text>

    <!-- Task 3: Semantic Segmentation -->
    <rect x="390" y="25" width="170" height="245" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="475" y="48" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">3. Semantic Seg</text>
    <rect x="400" y="65" width="150" height="90" fill="#1e293b" stroke="#10b981" rx="4"/>
    <circle cx="475" cy="110" r="30" fill="#10b981" fill-opacity="0.4"/>
    <text x="475" y="114" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">Dog Pixels</text>
    <text x="475" y="180" fill="#cbd5e1" font-size="8" text-anchor="middle">Output: (H, W) Class Map</text>
    <text x="475" y="200" fill="#cbd5e1" font-size="8" text-anchor="middle">Pixel-level classification</text>
    <text x="475" y="235" fill="#34d399" font-size="8" text-anchor="middle">U-Net / DeepLabV3+</text>

    <!-- Task 4: Instance Segmentation -->
    <rect x="575" y="25" width="170" height="245" fill="#0f172a" stroke="#a855f7" stroke-width="2" rx="6"/>
    <text x="660" y="48" fill="#c084fc" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">4. Instance Seg</text>
    <rect x="585" y="65" width="150" height="90" fill="#1e293b" stroke="#a855f7" rx="4"/>
    <circle cx="635" cy="110" r="22" fill="#38bdf8" fill-opacity="0.4"/>
    <circle cx="685" cy="110" r="22" fill="#f43f5e" fill-opacity="0.4"/>
    <text x="660" y="145" fill="#f8fafc" font-size="8" text-anchor="middle">Dog #1 vs Dog #2</text>
    <text x="660" y="180" fill="#cbd5e1" font-size="8" text-anchor="middle">Output: Distinct entity masks</text>
    <text x="660" y="200" fill="#cbd5e1" font-size="8" text-anchor="middle">Box + Pixel Mask per object</text>
    <text x="660" y="235" fill="#c084fc" font-size="8" font-weight="700" text-anchor="middle">Mask R-CNN / SAM</text>
  </g>
</svg>
