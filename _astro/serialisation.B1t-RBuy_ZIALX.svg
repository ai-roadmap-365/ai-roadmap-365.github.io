<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By portability and safety.">
  <title>Four serialisation formats</title>
  <style>
    .serialisation-bg   { fill: #f8fafc; }
    .serialisation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serialisation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serialisation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serialisation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serialisation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serialisation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .serialisation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .serialisation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .serialisation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .serialisation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .serialisation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .serialisation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .serialisation-row { opacity: 1; }
    .serialisation-r0 { animation-delay: 0.00s; }
    .serialisation-r1 { animation-delay: 0.45s; }
    .serialisation-r2 { animation-delay: 0.90s; }
    .serialisation-r3 { animation-delay: 1.35s; }
    .serialisation-r4 { animation-delay: 1.80s; }
    .serialisation-row { animation: serialisation-reveal 7.3s ease-in-out infinite; }
    @keyframes serialisation-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="serialisation-bg" width="980" height="390"/>
  <text class="serialisation-h1"  x="30" y="40">Four serialisation formats</text>
  <text class="serialisation-sub" x="30" y="64">By portability and safety.</text>
  <rect class="serialisation-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="serialisation-name" x="46" y="122">The format</text>
  <text class="serialisation-desc" x="46" y="142">What it stores.</text>
  <text class="serialisation-desc serialisation-row serialisation-r0" x="46" y="182">Native pickle — the live object graph</text>
  <text class="serialisation-desc serialisation-row serialisation-r1" x="46" y="216">Joblib — the same, optimised for arrays</text>
  <text class="serialisation-desc serialisation-row serialisation-r2" x="46" y="250">Portable graph format — the computation itself</text>
  <text class="serialisation-desc serialisation-row serialisation-r3" x="46" y="284">Tensor container — weights, and nothing executable</text>
  <text class="serialisation-desc serialisation-row serialisation-r4" x="46" y="318">Library-native — the framework's own</text>
  <rect class="serialisation-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="serialisation-name" x="526" y="122">The trade</text>
  <text class="serialisation-desc" x="526" y="142">And its risk.</text>
  <text class="serialisation-desc serialisation-row serialisation-r0" x="526" y="182">Executes code on load; unsafe from strangers</text>
  <text class="serialisation-desc serialisation-row serialisation-r1" x="526" y="216">Same risk, better with large arrays</text>
  <text class="serialisation-desc serialisation-row serialisation-r2" x="526" y="250">Framework-independent; conversion can differ subtly</text>
  <text class="serialisation-desc serialisation-row serialisation-r3" x="526" y="284">Safe by construction; weights only</text>
  <text class="serialisation-desc serialisation-row serialisation-r4" x="526" y="318">Convenient, and version-fragile</text>
  <text class="serialisation-sub" x="30" y="372">The first two executing code on load is a security property rather than a quirk, and it is why loading a checkpoint from an untrusted source is running a program.</text>
</svg>
