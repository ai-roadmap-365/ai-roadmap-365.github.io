<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four approaches.">
  <title>Making it scale</title>
  <style>
    .knn-approximate-bg   { fill: #f8fafc; }
    .knn-approximate-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knn-approximate-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knn-approximate-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knn-approximate-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knn-approximate-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knn-approximate-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .knn-approximate-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .knn-approximate-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .knn-approximate-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .knn-approximate-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .knn-approximate-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .knn-approximate-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .knn-approximate-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .knn-approximate-stage { opacity: 1; }

    .knn-approximate-s0 { animation-delay: 0.00s; }
    .knn-approximate-e0 { animation-delay: 0.00s; }
    .knn-approximate-s1 { animation-delay: 1.28s; }
    .knn-approximate-e1 { animation-delay: 1.28s; }
    .knn-approximate-s2 { animation-delay: 2.56s; }
    .knn-approximate-e2 { animation-delay: 2.56s; }
    .knn-approximate-s3 { animation-delay: 3.84s; }
    .knn-approximate-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .knn-approximate-conn  { animation: knn-approximate-trace 6.4s ease-in-out infinite; }
      .knn-approximate-stage { animation: knn-approximate-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes knn-approximate-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes knn-approximate-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .knn-approximate-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .knn-approximate-stage { animation: knn-approximate-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes knn-approximate-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="knn-approximate-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="knn-approximate-bg" width="980" height="322"/>
  <text class="knn-approximate-h1"  x="30" y="40">Making it scale</text>
  <text class="knn-approximate-sub" x="30" y="64">Four approaches.</text>
  <g class="knn-approximate-stage knn-approximate-s0">
    <rect class="knn-approximate-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="knn-approximate-step" x="44" y="142">01</text>
    <text class="knn-approximate-name" x="70" y="142">Scan everything</text>
    <text class="knn-approximate-desc" x="44" y="166">Exact, and linear in the dataset</text>
    <text class="knn-approximate-desc" x="44" y="182">size.</text>
  </g>
  <line class="knn-approximate-line knn-approximate-conn knn-approximate-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#knn-approximate-tip)"/>
  <g class="knn-approximate-stage knn-approximate-s1">
    <rect class="knn-approximate-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="knn-approximate-step" x="280" y="142">02</text>
    <text class="knn-approximate-name" x="306" y="142">Tree-based indexes</text>
    <text class="knn-approximate-desc" x="280" y="166">Fast in low dimensions, useless</text>
    <text class="knn-approximate-desc" x="280" y="182">in high ones.</text>
  </g>
  <line class="knn-approximate-line knn-approximate-conn knn-approximate-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#knn-approximate-tip)"/>
  <g class="knn-approximate-stage knn-approximate-s2">
    <rect class="knn-approximate-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="knn-approximate-step" x="516" y="142">03</text>
    <text class="knn-approximate-name" x="542" y="142">Approximate graph indexes</text>
    <text class="knn-approximate-desc" x="516" y="166">Sub-linear, with recall below</text>
    <text class="knn-approximate-desc" x="516" y="182">one.</text>
  </g>
  <line class="knn-approximate-line knn-approximate-conn knn-approximate-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#knn-approximate-tip)"/>
  <g class="knn-approximate-stage knn-approximate-s3">
    <rect class="knn-approximate-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="knn-approximate-step" x="752" y="142">04</text>
    <text class="knn-approximate-name" x="778" y="142">Or reduce the dimensions first</text>
    <text class="knn-approximate-desc" x="752" y="166">Which attacks the cause rather</text>
    <text class="knn-approximate-desc" x="752" y="182">than the symptom.</text>
  </g>
  <text class="knn-approximate-sub" x="30" y="304">Tree indexes failing in high dimensions is the specific reason vector databases use graph-based structures instead, which connects this lesson directly to Day 262.</text>
</svg>
