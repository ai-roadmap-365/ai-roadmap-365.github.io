<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Plausible deniability, with recoverable statistics.">
  <title>The coin-flip survey</title>
  <style>
    .coin-flip-survey-bg   { fill: #f8fafc; }
    .coin-flip-survey-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .coin-flip-survey-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .coin-flip-survey-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .coin-flip-survey-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .coin-flip-survey-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .coin-flip-survey-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .coin-flip-survey-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .coin-flip-survey-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .coin-flip-survey-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .coin-flip-survey-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .coin-flip-survey-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .coin-flip-survey-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .coin-flip-survey-row { opacity: 1; }
    .coin-flip-survey-r0 { animation-delay: 0.00s; }
    .coin-flip-survey-r1 { animation-delay: 0.45s; }
    .coin-flip-survey-r2 { animation-delay: 0.90s; }
    .coin-flip-survey-r3 { animation-delay: 1.35s; }
    .coin-flip-survey-r4 { animation-delay: 1.80s; }
    .coin-flip-survey-row { animation: coin-flip-survey-reveal 7.3s ease-in-out infinite; }
    @keyframes coin-flip-survey-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="coin-flip-survey-bg" width="980" height="390"/>
  <text class="coin-flip-survey-h1"  x="30" y="40">The coin-flip survey</text>
  <text class="coin-flip-survey-sub" x="30" y="64">Plausible deniability, with recoverable statistics.</text>
  <rect class="coin-flip-survey-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="coin-flip-survey-name" x="46" y="122">What the observer sees</text>
  <text class="coin-flip-survey-desc" x="46" y="142">An unusable individual answer.</text>
  <text class="coin-flip-survey-desc coin-flip-survey-row coin-flip-survey-r0" x="46" y="182">Flip a coin: heads, answer truthfully</text>
  <text class="coin-flip-survey-desc coin-flip-survey-row coin-flip-survey-r1" x="46" y="216">Tails: flip again and answer at random</text>
  <text class="coin-flip-survey-desc coin-flip-survey-row coin-flip-survey-r2" x="46" y="250">A "yes" might be an admission</text>
  <text class="coin-flip-survey-desc coin-flip-survey-row coin-flip-survey-r3" x="46" y="284">Or two tails</text>
  <text class="coin-flip-survey-desc coin-flip-survey-row coin-flip-survey-r4" x="46" y="318">Nobody can tell which</text>
  <rect class="coin-flip-survey-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="coin-flip-survey-name" x="526" y="122">What the analyst gets</text>
  <text class="coin-flip-survey-desc" x="526" y="142">An accurate rate.</text>
  <text class="coin-flip-survey-desc coin-flip-survey-row coin-flip-survey-r0" x="526" y="182">25% of responses are known noise</text>
  <text class="coin-flip-survey-desc coin-flip-survey-row coin-flip-survey-r1" x="526" y="216">The noise distribution is known exactly</text>
  <text class="coin-flip-survey-desc coin-flip-survey-row coin-flip-survey-r2" x="526" y="250">Subtract it algebraically</text>
  <text class="coin-flip-survey-desc coin-flip-survey-row coin-flip-survey-r3" x="526" y="284">The true rate emerges precisely</text>
  <text class="coin-flip-survey-desc coin-flip-survey-row coin-flip-survey-r4" x="526" y="318">Privacy and utility, simultaneously</text>
  <text class="coin-flip-survey-sub" x="30" y="372">This is the whole intuition behind differential privacy in one protocol: the noise is calibrated and known, so it destroys individual inference while leaving the aggregate recoverable.</text>
</svg>
