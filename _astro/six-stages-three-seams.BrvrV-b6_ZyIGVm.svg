<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="100%" height="100%" role="img" aria-label="Six Stages, Three Seams showing the assembled pipeline from ingestion through processing, freshness, retrieval, cost and privacy, with the three interactions that only appear once the stages share a system">
  <title>Six Stages, Three Seams</title>
  <defs>
    <style>
      .d329a-bg { fill: #f8fafc; }
      .d329a-stage { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; }
      .d329a-seam { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2px; }
      .d329a-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d329a-sub { font-family: system-ui, sans-serif; font-size: 13px; fill: #475569; }
      .d329a-h { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #0f172a; }
      .d329a-t { font-family: system-ui, sans-serif; font-size: 10px; fill: #334155; }
      .d329a-seamh { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #92400e; }
      .d329a-flow { stroke: #64748b; stroke-width: 2px; fill: none; }
    </style>
    <marker id="d329a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="100%" height="100%" class="d329a-bg"/>
  <text x="40" y="40" class="d329a-title">Six Stages, Three Seams</text>
  <text x="40" y="64" class="d329a-sub">Each stage passed its own tests. Systems fail at the seams, and the seams only exist once the stages share a pipeline.</text>

  <rect x="40" y="100" width="125" height="62" rx="8" class="d329a-stage"/>
  <text x="102" y="124" class="d329a-h" text-anchor="middle">323 Ingest</text>
  <text x="102" y="143" class="d329a-t" text-anchor="middle">cursor, dead letters</text>

  <rect x="185" y="100" width="125" height="62" rx="8" class="d329a-stage"/>
  <text x="247" y="124" class="d329a-h" text-anchor="middle">324 Process</text>
  <text x="247" y="143" class="d329a-t" text-anchor="middle">quality gate</text>

  <rect x="330" y="100" width="125" height="62" rx="8" class="d329a-stage"/>
  <text x="392" y="124" class="d329a-h" text-anchor="middle">328 Redact</text>
  <text x="392" y="143" class="d329a-t" text-anchor="middle">at the boundary</text>

  <rect x="475" y="100" width="125" height="62" rx="8" class="d329a-stage"/>
  <text x="537" y="124" class="d329a-h" text-anchor="middle">325 Index</text>
  <text x="537" y="143" class="d329a-t" text-anchor="middle">stable ids, no orphans</text>

  <rect x="620" y="100" width="115" height="62" rx="8" class="d329a-stage"/>
  <text x="677" y="124" class="d329a-h" text-anchor="middle">326 Retrieve</text>
  <text x="677" y="143" class="d329a-t" text-anchor="middle">recall vs cost</text>

  <rect x="755" y="100" width="105" height="62" rx="8" class="d329a-stage"/>
  <text x="807" y="124" class="d329a-h" text-anchor="middle">327 Answer</text>
  <text x="807" y="143" class="d329a-t" text-anchor="middle">routed, capped</text>

  <path d="M 165 131 L 179 131" class="d329a-flow" marker-end="url(#d329a-a)"/>
  <path d="M 310 131 L 324 131" class="d329a-flow" marker-end="url(#d329a-a)"/>
  <path d="M 455 131 L 469 131" class="d329a-flow" marker-end="url(#d329a-a)"/>
  <path d="M 600 131 L 614 131" class="d329a-flow" marker-end="url(#d329a-a)"/>
  <path d="M 735 131 L 749 131" class="d329a-flow" marker-end="url(#d329a-a)"/>

  <rect x="40" y="215" width="255" height="95" rx="8" class="d329a-seam"/>
  <text x="167" y="240" class="d329a-seamh" text-anchor="middle">SEAM 1 — ordering</text>
  <text x="167" y="262" class="d329a-t" text-anchor="middle">Redact BEFORE indexing.</text>
  <text x="167" y="280" class="d329a-t" text-anchor="middle">Do it after and the identifiers are</text>
  <text x="167" y="296" class="d329a-t" text-anchor="middle">inside the vectors — removing</text>

  <rect x="322" y="215" width="255" height="95" rx="8" class="d329a-seam"/>
  <text x="450" y="240" class="d329a-seamh" text-anchor="middle">SEAM 2 — one ledger</text>
  <text x="450" y="262" class="d329a-t" text-anchor="middle">Retrieval charges the same budget</text>
  <text x="450" y="280" class="d329a-t" text-anchor="middle">as generation, so a recall setting</text>
  <text x="450" y="296" class="d329a-t" text-anchor="middle">is also a cost setting.</text>

  <rect x="604" y="215" width="256" height="95" rx="8" class="d329a-seam"/>
  <text x="732" y="240" class="d329a-seamh" text-anchor="middle">SEAM 3 — deletion path</text>
  <text x="732" y="262" class="d329a-t" text-anchor="middle">Erasure reaches the index, the</text>
  <text x="732" y="280" class="d329a-t" text-anchor="middle">hashes AND the cache. The cache</text>
  <text x="732" y="296" class="d329a-t" text-anchor="middle">is the one that gets forgotten.</text>

  <text x="167" y="312" class="d329a-t" text-anchor="middle">them means re-embedding.</text>

  <path d="M 392 166 L 392 211" class="d329a-flow" marker-end="url(#d329a-a)"/>
  <path d="M 677 166 L 500 211" class="d329a-flow" marker-end="url(#d329a-a)"/>
  <path d="M 807 166 L 780 211" class="d329a-flow" marker-end="url(#d329a-a)"/>

  <text x="40" y="360" class="d329a-h">Why all three are ordering or ownership questions, not algorithms</text>
  <text x="40" y="384" class="d329a-t">None of these is hard to implement. Each is nearly free while building and genuinely expensive to retrofit — re-embedding a</text>
  <text x="40" y="402" class="d329a-t">corpus, finding an uncapped path in production, discovering a store that kept answering from deleted content.</text>
  <text x="40" y="428" class="d329a-t">That asymmetry is the whole argument for fixing them on day one, and it is why a section project is worth the time: the</text>
  <text x="40" y="446" class="d329a-t">individual labs cannot show you a seam.</text>
</svg>
