<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Tool access is the deciding question.">
  <title>How much defence to build</title>
  <style>
    .prompt-defense-when-bg   { fill: #f8fafc; }
    .prompt-defense-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-defense-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-defense-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-defense-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-defense-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-defense-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prompt-defense-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .prompt-defense-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .prompt-defense-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .prompt-defense-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .prompt-defense-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .prompt-defense-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prompt-defense-when-row { opacity: 1; }
    .prompt-defense-when-r0 { animation-delay: 0.00s; }
    .prompt-defense-when-r1 { animation-delay: 0.45s; }
    .prompt-defense-when-r2 { animation-delay: 0.90s; }
    .prompt-defense-when-r3 { animation-delay: 1.35s; }
    .prompt-defense-when-r4 { animation-delay: 1.80s; }
    .prompt-defense-when-row { animation: prompt-defense-when-reveal 7.3s ease-in-out infinite; }
    @keyframes prompt-defense-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="prompt-defense-when-bg" width="980" height="390"/>
  <text class="prompt-defense-when-h1"  x="30" y="40">How much defence to build</text>
  <text class="prompt-defense-when-sub" x="30" y="64">Tool access is the deciding question.</text>
  <rect class="prompt-defense-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="prompt-defense-when-name" x="46" y="122">Full pipeline</text>
  <text class="prompt-defense-when-desc" x="46" y="142">Anything with tools or external data.</text>
  <text class="prompt-defense-when-desc prompt-defense-when-row prompt-defense-when-r0" x="46" y="182">Any LLM connected to tools</text>
  <text class="prompt-defense-when-desc prompt-defense-when-row prompt-defense-when-r1" x="46" y="216">Database access, email, API calls</text>
  <text class="prompt-defense-when-desc prompt-defense-when-row prompt-defense-when-r2" x="46" y="250">Anything ingesting untrusted external data</text>
  <text class="prompt-defense-when-desc prompt-defense-when-row prompt-defense-when-r3" x="46" y="284">Web scraping, uploads, RAG</text>
  <text class="prompt-defense-when-desc prompt-defense-when-row prompt-defense-when-r4" x="46" y="318">Confidential system prompts</text>
  <rect class="prompt-defense-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="prompt-defense-when-name" x="526" y="122">Lightweight</text>
  <text class="prompt-defense-when-desc" x="526" y="142">No tools, no external data.</text>
  <text class="prompt-defense-when-desc prompt-defense-when-row prompt-defense-when-r0" x="526" y="182">Pure text completion</text>
  <text class="prompt-defense-when-desc prompt-defense-when-row prompt-defense-when-r1" x="526" y="216">No retrieval, no browsing</text>
  <text class="prompt-defense-when-desc prompt-defense-when-row prompt-defense-when-r2" x="526" y="250">No tool execution at all</text>
  <text class="prompt-defense-when-desc prompt-defense-when-row prompt-defense-when-r3" x="526" y="284">Injection produces a bad answer</text>
  <text class="prompt-defense-when-desc prompt-defense-when-row prompt-defense-when-r4" x="526" y="318">And nothing else</text>
  <text class="prompt-defense-when-sub" x="30" y="372">The distinction is entirely about consequence: without tools an injection yields text you did not want, and with them it yields an action you did not authorise.</text>
</svg>
