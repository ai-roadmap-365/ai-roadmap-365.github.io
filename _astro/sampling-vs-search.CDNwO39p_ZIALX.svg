<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two ways to pick tokens.">
  <title>Sampling against search</title>
  <style>
    .sampling-vs-search-bg   { fill: #f8fafc; }
    .sampling-vs-search-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sampling-vs-search-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sampling-vs-search-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sampling-vs-search-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sampling-vs-search-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sampling-vs-search-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sampling-vs-search-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sampling-vs-search-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sampling-vs-search-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sampling-vs-search-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sampling-vs-search-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sampling-vs-search-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sampling-vs-search-row { opacity: 1; }
    .sampling-vs-search-r0 { animation-delay: 0.00s; }
    .sampling-vs-search-r1 { animation-delay: 0.45s; }
    .sampling-vs-search-r2 { animation-delay: 0.90s; }
    .sampling-vs-search-r3 { animation-delay: 1.35s; }
    .sampling-vs-search-r4 { animation-delay: 1.80s; }
    .sampling-vs-search-row { animation: sampling-vs-search-reveal 7.3s ease-in-out infinite; }
    @keyframes sampling-vs-search-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="sampling-vs-search-bg" width="980" height="390"/>
  <text class="sampling-vs-search-h1"  x="30" y="40">Sampling against search</text>
  <text class="sampling-vs-search-sub" x="30" y="64">Two ways to pick tokens.</text>
  <rect class="sampling-vs-search-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="sampling-vs-search-name" x="46" y="122">Sampling</text>
  <text class="sampling-vs-search-desc" x="46" y="142">Draw from the distribution.</text>
  <text class="sampling-vs-search-desc sampling-vs-search-row sampling-vs-search-r0" x="46" y="182">Varied and natural output</text>
  <text class="sampling-vs-search-desc sampling-vs-search-row sampling-vs-search-r1" x="46" y="216">One forward pass per token</text>
  <text class="sampling-vs-search-desc sampling-vs-search-row sampling-vs-search-r2" x="46" y="250">Cheap</text>
  <text class="sampling-vs-search-desc sampling-vs-search-row sampling-vs-search-r3" x="46" y="284">Can produce a poor token</text>
  <text class="sampling-vs-search-desc sampling-vs-search-row sampling-vs-search-r4" x="46" y="318">Right for open-ended text</text>
  <rect class="sampling-vs-search-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="sampling-vs-search-name" x="526" y="122">Beam search</text>
  <text class="sampling-vs-search-desc" x="526" y="142">Search for the likeliest sequence.</text>
  <text class="sampling-vs-search-desc sampling-vs-search-row sampling-vs-search-r0" x="526" y="182">Several candidates kept in parallel</text>
  <text class="sampling-vs-search-desc sampling-vs-search-row sampling-vs-search-r1" x="526" y="216">Several times the compute</text>
  <text class="sampling-vs-search-desc sampling-vs-search-row sampling-vs-search-r2" x="526" y="250">Expensive</text>
  <text class="sampling-vs-search-desc sampling-vs-search-row sampling-vs-search-r3" x="526" y="284">Finds the highest-probability sequence</text>
  <text class="sampling-vs-search-desc sampling-vs-search-row sampling-vs-search-r4" x="526" y="318">Right for translation, wrong for prose</text>
  <text class="sampling-vs-search-sub" x="30" y="372">The most probable long sequence being dull and repetitive is the finding that settled this: open-ended generation wants a typical sample, not a maximum.</text>
</svg>
