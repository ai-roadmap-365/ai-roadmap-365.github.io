<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>What machine learning is</title>
  <style>
    .ml-idea-bg   { fill: #f8fafc; }
    .ml-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ml-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ml-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ml-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ml-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ml-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ml-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ml-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ml-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ml-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ml-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ml-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .ml-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .ml-idea-stage { opacity: 1; }

    .ml-idea-s0 { animation-delay: 0.00s; }
    .ml-idea-e0 { animation-delay: 0.00s; }
    .ml-idea-s1 { animation-delay: 1.28s; }
    .ml-idea-e1 { animation-delay: 1.28s; }
    .ml-idea-s2 { animation-delay: 2.56s; }
    .ml-idea-e2 { animation-delay: 2.56s; }
    .ml-idea-s3 { animation-delay: 3.84s; }
    .ml-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .ml-idea-conn  { animation: ml-idea-trace 6.4s ease-in-out infinite; }
      .ml-idea-stage { animation: ml-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes ml-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes ml-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .ml-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ml-idea-stage { animation: ml-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes ml-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ml-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="ml-idea-bg" width="980" height="322"/>
  <text class="ml-idea-h1"  x="30" y="40">What machine learning is</text>
  <text class="ml-idea-sub" x="30" y="64">Four steps.</text>
  <g class="ml-idea-stage ml-idea-s0">
    <rect class="ml-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="ml-idea-step" x="44" y="142">01</text>
    <text class="ml-idea-name" x="70" y="142">Ordinarily you write the rule yourself</text>
    <text class="ml-idea-desc" x="44" y="166">If income is above this and age</text>
    <text class="ml-idea-desc" x="44" y="182">below that, then.</text>
  </g>
  <line class="ml-idea-line ml-idea-conn ml-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#ml-idea-tip)"/>
  <g class="ml-idea-stage ml-idea-s1">
    <rect class="ml-idea-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="ml-idea-step" x="280" y="142">02</text>
    <text class="ml-idea-name" x="306" y="142">Instead, supply examples of inputs and correct outputs</text>
    <text class="ml-idea-desc" x="280" y="166">Many of them.</text>
  </g>
  <line class="ml-idea-line ml-idea-conn ml-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#ml-idea-tip)"/>
  <g class="ml-idea-stage ml-idea-s2">
    <rect class="ml-idea-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="ml-idea-step" x="516" y="142">03</text>
    <text class="ml-idea-name" x="542" y="142">An algorithm searches for a rule that fits them</text>
    <text class="ml-idea-desc" x="516" y="166">Within a family of rules you</text>
    <text class="ml-idea-desc" x="516" y="182">chose.</text>
  </g>
  <line class="ml-idea-line ml-idea-conn ml-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#ml-idea-tip)"/>
  <g class="ml-idea-stage ml-idea-s3">
    <rect class="ml-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="ml-idea-step" x="752" y="142">04</text>
    <text class="ml-idea-name" x="778" y="142">Then applies that rule to new inputs</text>
    <text class="ml-idea-desc" x="752" y="166">Which is the only part anyone</text>
    <text class="ml-idea-desc" x="752" y="182">actually wanted.</text>
    <text class="ml-idea-edge" x="752" y="242">the product</text>
  </g>
  <text class="ml-idea-sub" x="30" y="304">The last step is the product and the first three are the machinery, which is why a model that performs well only on its training examples has produced nothing at all.</text>
</svg>
