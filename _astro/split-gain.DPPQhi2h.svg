<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four components.">
  <title>The split gain</title>
  <style>
    .split-gain-bg   { fill: #f8fafc; }
    .split-gain-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .split-gain-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .split-gain-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .split-gain-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .split-gain-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .split-gain-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .split-gain-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .split-gain-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .split-gain-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .split-gain-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .split-gain-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .split-gain-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .split-gain-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .split-gain-stage { opacity: 1; }

    .split-gain-s0 { animation-delay: 0.00s; }
    .split-gain-e0 { animation-delay: 0.00s; }
    .split-gain-s1 { animation-delay: 1.28s; }
    .split-gain-e1 { animation-delay: 1.28s; }
    .split-gain-s2 { animation-delay: 2.56s; }
    .split-gain-e2 { animation-delay: 2.56s; }
    .split-gain-s3 { animation-delay: 3.84s; }
    .split-gain-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .split-gain-conn  { animation: split-gain-trace 6.4s ease-in-out infinite; }
      .split-gain-stage { animation: split-gain-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes split-gain-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes split-gain-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .split-gain-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .split-gain-stage { animation: split-gain-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes split-gain-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="split-gain-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="split-gain-bg" width="980" height="322"/>
  <text class="split-gain-h1"  x="30" y="40">The split gain</text>
  <text class="split-gain-sub" x="30" y="64">Four components.</text>
  <g class="split-gain-stage split-gain-s0">
    <rect class="split-gain-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="split-gain-step" x="44" y="142">01</text>
    <text class="split-gain-name" x="70" y="142">The score the left child would achieve</text>
    <text class="split-gain-desc" x="44" y="166">From its gradients and</text>
    <text class="split-gain-desc" x="44" y="182">curvatures.</text>
  </g>
  <line class="split-gain-line split-gain-conn split-gain-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#split-gain-tip)"/>
  <g class="split-gain-stage split-gain-s1">
    <rect class="split-gain-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="split-gain-step" x="280" y="142">02</text>
    <text class="split-gain-name" x="306" y="142">Plus the score of the right child</text>
    <text class="split-gain-desc" x="280" y="166">Computed the same way.</text>
  </g>
  <line class="split-gain-line split-gain-conn split-gain-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#split-gain-tip)"/>
  <g class="split-gain-stage split-gain-s2">
    <rect class="split-gain-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="split-gain-step" x="516" y="142">03</text>
    <text class="split-gain-name" x="542" y="142">Minus the score of the unsplit parent</text>
    <text class="split-gain-desc" x="516" y="166">Which is what the split has to</text>
    <text class="split-gain-desc" x="516" y="182">beat.</text>
  </g>
  <line class="split-gain-line split-gain-conn split-gain-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#split-gain-tip)"/>
  <g class="split-gain-stage split-gain-s3">
    <rect class="split-gain-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="split-gain-step" x="752" y="142">04</text>
    <text class="split-gain-name" x="778" y="142">Minus a fixed penalty for adding a leaf</text>
    <text class="split-gain-desc" x="752" y="166">So marginal splits are rejected</text>
    <text class="split-gain-desc" x="752" y="182">outright.</text>
  </g>
  <text class="split-gain-sub" x="30" y="304">The fixed penalty is regularisation built into the structure search itself, which is why these models prune naturally rather than needing a separate pass.</text>
</svg>
