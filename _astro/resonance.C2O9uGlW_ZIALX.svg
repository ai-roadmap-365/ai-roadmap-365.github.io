<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Push it any other way and it fights back.">
  <title>The frequency something prefers</title>
  <style>
    .resonance-bg   { fill: #f8fafc; }
    .resonance-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resonance-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resonance-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resonance-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resonance-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .resonance-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .resonance-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .resonance-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .resonance-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .resonance-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .resonance-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .resonance-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .resonance-row { opacity: 1; }
    .resonance-r0 { animation-delay: 0.00s; }
    .resonance-r1 { animation-delay: 0.45s; }
    .resonance-r2 { animation-delay: 0.90s; }
    .resonance-r3 { animation-delay: 1.35s; }
    .resonance-r4 { animation-delay: 1.80s; }
    .resonance-row { animation: resonance-reveal 7.3s ease-in-out infinite; }
    @keyframes resonance-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="resonance-bg" width="980" height="390"/>
  <text class="resonance-h1"  x="30" y="40">The frequency something prefers</text>
  <text class="resonance-sub" x="30" y="64">Push it any other way and it fights back.</text>
  <rect class="resonance-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="resonance-name" x="46" y="122">Along its natural axis</text>
  <text class="resonance-desc" x="46" y="142">It simply moves.</text>
  <text class="resonance-desc resonance-row resonance-r0" x="46" y="182">The object moves the way it was pushed</text>
  <text class="resonance-desc resonance-row resonance-r1" x="46" y="216">No twisting or resistance</text>
  <text class="resonance-desc resonance-row resonance-r2" x="46" y="250">Only the amount changes</text>
  <text class="resonance-desc resonance-row resonance-r3" x="46" y="284">The direction is preserved</text>
  <text class="resonance-desc resonance-row resonance-r4" x="46" y="318">This is an eigenvector</text>
  <rect class="resonance-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="resonance-name" x="526" y="122">Obliquely</text>
  <text class="resonance-desc" x="526" y="142">It turns.</text>
  <text class="resonance-desc resonance-row resonance-r0" x="526" y="182">The object twists as it moves</text>
  <text class="resonance-desc resonance-row resonance-r1" x="526" y="216">The response is not along the push</text>
  <text class="resonance-desc resonance-row resonance-r2" x="526" y="250">Both direction and amount change</text>
  <text class="resonance-desc resonance-row resonance-r3" x="526" y="284">The direction is not preserved</text>
  <text class="resonance-desc resonance-row resonance-r4" x="526" y="318">This is any other vector</text>
  <text class="resonance-sub" x="30" y="372">Every physical object has axes it prefers, and finding them is exactly what an eigen-decomposition does for a transformation.</text>
</svg>
