<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Shape decided by what is there.">
  <title>Constellations against a seating plan</title>
  <style>
    .constellations-bg   { fill: #f8fafc; }
    .constellations-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .constellations-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .constellations-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .constellations-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .constellations-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .constellations-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .constellations-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .constellations-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .constellations-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .constellations-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .constellations-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .constellations-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .constellations-row { opacity: 1; }
    .constellations-r0 { animation-delay: 0.00s; }
    .constellations-r1 { animation-delay: 0.45s; }
    .constellations-r2 { animation-delay: 0.90s; }
    .constellations-r3 { animation-delay: 1.35s; }
    .constellations-r4 { animation-delay: 1.80s; }
    .constellations-row { animation: constellations-reveal 7.3s ease-in-out infinite; }
    @keyframes constellations-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="constellations-bg" width="980" height="390"/>
  <text class="constellations-h1"  x="30" y="40">Constellations against a seating plan</text>
  <text class="constellations-sub" x="30" y="64">Shape decided by what is there.</text>
  <rect class="constellations-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="constellations-name" x="46" y="122">A seating plan</text>
  <text class="constellations-desc" x="46" y="142">Groups decided first.</text>
  <text class="constellations-desc constellations-row constellations-r0" x="46" y="182">A fixed number of tables</text>
  <text class="constellations-desc constellations-row constellations-r1" x="46" y="216">Everyone is seated somewhere</text>
  <text class="constellations-desc constellations-row constellations-r2" x="46" y="250">Tables are roughly equal</text>
  <text class="constellations-desc constellations-row constellations-r3" x="46" y="284">Shape imposed by the plan</text>
  <text class="constellations-desc constellations-row constellations-r4" x="46" y="318">This is k-means</text>
  <rect class="constellations-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="constellations-name" x="526" y="122">Constellations</text>
  <text class="constellations-desc" x="526" y="142">Groups from density.</text>
  <text class="constellations-desc constellations-row constellations-r0" x="526" y="182">As many as the sky contains</text>
  <text class="constellations-desc constellations-row constellations-r1" x="526" y="216">Isolated stars belong to none</text>
  <text class="constellations-desc constellations-row constellations-r2" x="526" y="250">Wildly different sizes</text>
  <text class="constellations-desc constellations-row constellations-r3" x="526" y="284">Shape follows the arrangement</text>
  <text class="constellations-desc constellations-row constellations-r4" x="526" y="318">This is density clustering</text>
  <text class="constellations-sub" x="30" y="372">Isolated stars belonging to nothing is the property that matters: forcing them into the nearest constellation would be a distortion, not a completion.</text>
</svg>
