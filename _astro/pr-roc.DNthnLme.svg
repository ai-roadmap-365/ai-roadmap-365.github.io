<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when each is honest.">
  <title>Two curves</title>
  <style>
    .pr-roc-bg   { fill: #f8fafc; }
    .pr-roc-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pr-roc-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pr-roc-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pr-roc-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pr-roc-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pr-roc-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pr-roc-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pr-roc-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pr-roc-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pr-roc-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pr-roc-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pr-roc-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pr-roc-row { opacity: 1; }
    .pr-roc-r0 { animation-delay: 0.00s; }
    .pr-roc-r1 { animation-delay: 0.45s; }
    .pr-roc-r2 { animation-delay: 0.90s; }
    .pr-roc-r3 { animation-delay: 1.35s; }
    .pr-roc-r4 { animation-delay: 1.80s; }
    .pr-roc-row { animation: pr-roc-reveal 7.3s ease-in-out infinite; }
    @keyframes pr-roc-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="pr-roc-bg" width="980" height="390"/>
  <text class="pr-roc-h1"  x="30" y="40">Two curves</text>
  <text class="pr-roc-sub" x="30" y="64">And when each is honest.</text>
  <rect class="pr-roc-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="pr-roc-name" x="46" y="122">Receiver operating characteristic</text>
  <text class="pr-roc-desc" x="46" y="142">Recall against false alarm rate.</text>
  <text class="pr-roc-desc pr-roc-row pr-roc-r0" x="46" y="182">Plots recall against false positive rate</text>
  <text class="pr-roc-desc pr-roc-row pr-roc-r1" x="46" y="216">Insensitive to class balance</text>
  <text class="pr-roc-desc pr-roc-row pr-roc-r2" x="46" y="250">Looks good even on rare classes</text>
  <text class="pr-roc-desc pr-roc-row pr-roc-r3" x="46" y="284">Area under it is widely reported</text>
  <text class="pr-roc-desc pr-roc-row pr-roc-r4" x="46" y="318">Misleading when positives are rare</text>
  <rect class="pr-roc-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="pr-roc-name" x="526" y="122">Precision-recall</text>
  <text class="pr-roc-desc" x="526" y="142">Recall against precision.</text>
  <text class="pr-roc-desc pr-roc-row pr-roc-r0" x="526" y="182">Plots precision against recall</text>
  <text class="pr-roc-desc pr-roc-row pr-roc-r1" x="526" y="216">Directly sensitive to class balance</text>
  <text class="pr-roc-desc pr-roc-row pr-roc-r2" x="526" y="250">Degrades visibly on rare classes</text>
  <text class="pr-roc-desc pr-roc-row pr-roc-r3" x="526" y="284">Baseline is the positive rate</text>
  <text class="pr-roc-desc pr-roc-row pr-roc-r4" x="526" y="318">The honest choice when positives are rare</text>
  <text class="pr-roc-sub" x="30" y="372">The first curve looking good on a rare-class problem is a genuine trap: its false positive rate stays low simply because the negatives are numerous.</text>
</svg>
