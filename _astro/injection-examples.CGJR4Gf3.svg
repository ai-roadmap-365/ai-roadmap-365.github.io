<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Beyond the chat box.">
  <title>Four places injection arrives</title>
  <style>
    .injection-examples-bg   { fill: #f8fafc; }
    .injection-examples-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-examples-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-examples-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-examples-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-examples-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-examples-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .injection-examples-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .injection-examples-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .injection-examples-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .injection-examples-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .injection-examples-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .injection-examples-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .injection-examples-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .injection-examples-stage { opacity: 1; }

    .injection-examples-s0 { animation-delay: 0.00s; }
    .injection-examples-e0 { animation-delay: 0.00s; }
    .injection-examples-s1 { animation-delay: 1.28s; }
    .injection-examples-e1 { animation-delay: 1.28s; }
    .injection-examples-s2 { animation-delay: 2.56s; }
    .injection-examples-e2 { animation-delay: 2.56s; }
    .injection-examples-s3 { animation-delay: 3.84s; }
    .injection-examples-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .injection-examples-conn  { animation: injection-examples-trace 6.4s ease-in-out infinite; }
      .injection-examples-stage { animation: injection-examples-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes injection-examples-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes injection-examples-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .injection-examples-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .injection-examples-stage { animation: injection-examples-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes injection-examples-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="injection-examples-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="injection-examples-bg" width="980" height="322"/>
  <text class="injection-examples-h1"  x="30" y="40">Four places injection arrives</text>
  <text class="injection-examples-sub" x="30" y="64">Beyond the chat box.</text>
  <g class="injection-examples-stage injection-examples-s0">
    <rect class="injection-examples-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="injection-examples-step" x="44" y="142">01</text>
    <text class="injection-examples-name" x="70" y="142">Retrieved documents in a search-augmented system</text>
    <text class="injection-examples-desc" x="44" y="166">Which the model reads as</text>
    <text class="injection-examples-desc" x="44" y="182">context.</text>
  </g>
  <line class="injection-examples-line injection-examples-conn injection-examples-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#injection-examples-tip)"/>
  <g class="injection-examples-stage injection-examples-s1">
    <rect class="injection-examples-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="injection-examples-step" x="280" y="142">02</text>
    <text class="injection-examples-name" x="306" y="142">Responses from tools and external interfaces</text>
    <text class="injection-examples-desc" x="280" y="166">Which are rarely treated as</text>
    <text class="injection-examples-desc" x="280" y="182">untrusted.</text>
  </g>
  <line class="injection-examples-line injection-examples-conn injection-examples-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#injection-examples-tip)"/>
  <g class="injection-examples-stage injection-examples-s2">
    <rect class="injection-examples-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="injection-examples-step" x="516" y="142">03</text>
    <text class="injection-examples-name" x="542" y="142">Files a user uploads for summarising</text>
    <text class="injection-examples-desc" x="516" y="166">Including hidden or invisible</text>
    <text class="injection-examples-desc" x="516" y="182">text.</text>
  </g>
  <line class="injection-examples-line injection-examples-conn injection-examples-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#injection-examples-tip)"/>
  <g class="injection-examples-stage injection-examples-s3">
    <rect class="injection-examples-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="injection-examples-step" x="752" y="142">04</text>
    <text class="injection-examples-name" x="778" y="142">And messages passed between cooperating agents</text>
    <text class="injection-examples-desc" x="752" y="166">Where one compromised agent</text>
    <text class="injection-examples-desc" x="752" y="182">reaches the rest.</text>
  </g>
  <text class="injection-examples-sub" x="30" y="304">Agent-to-agent messages are the newest and least defended channel, since a system that trusts its own components will propagate an injection through all of them.</text>
</svg>
