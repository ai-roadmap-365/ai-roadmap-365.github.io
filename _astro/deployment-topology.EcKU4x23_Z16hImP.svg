<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four layers of infrastructure.">
  <title>Where each tier runs</title>
  <style>
    .deployment-topology-bg   { fill: #f8fafc; }
    .deployment-topology-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deployment-topology-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deployment-topology-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deployment-topology-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deployment-topology-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deployment-topology-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .deployment-topology-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .deployment-topology-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .deployment-topology-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .deployment-topology-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .deployment-topology-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .deployment-topology-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .deployment-topology-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .deployment-topology-stage { opacity: 1; }

    .deployment-topology-s0 { animation-delay: 0.00s; }
    .deployment-topology-e0 { animation-delay: 0.00s; }
    .deployment-topology-s1 { animation-delay: 1.28s; }
    .deployment-topology-e1 { animation-delay: 1.28s; }
    .deployment-topology-s2 { animation-delay: 2.56s; }
    .deployment-topology-e2 { animation-delay: 2.56s; }
    .deployment-topology-s3 { animation-delay: 3.84s; }
    .deployment-topology-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .deployment-topology-conn  { animation: deployment-topology-trace 6.4s ease-in-out infinite; }
      .deployment-topology-stage { animation: deployment-topology-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes deployment-topology-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes deployment-topology-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .deployment-topology-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .deployment-topology-stage { animation: deployment-topology-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes deployment-topology-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="deployment-topology-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="deployment-topology-bg" width="980" height="322"/>
  <text class="deployment-topology-h1"  x="30" y="40">Where each tier runs</text>
  <text class="deployment-topology-sub" x="30" y="64">Four layers of infrastructure.</text>
  <g class="deployment-topology-stage deployment-topology-s0">
    <rect class="deployment-topology-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="deployment-topology-step" x="44" y="142">01</text>
    <text class="deployment-topology-name" x="70" y="142">Edge</text>
    <text class="deployment-topology-desc" x="44" y="166">TLS termination, firewall rules,</text>
    <text class="deployment-topology-desc" x="44" y="182">HTTP/2 proxying for streams.</text>
  </g>
  <line class="deployment-topology-line deployment-topology-conn deployment-topology-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#deployment-topology-tip)"/>
  <g class="deployment-topology-stage deployment-topology-s1">
    <rect class="deployment-topology-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="deployment-topology-step" x="280" y="142">02</text>
    <text class="deployment-topology-name" x="306" y="142">Application gateway</text>
    <text class="deployment-topology-desc" x="280" y="166">Async services, autoscaled on</text>
    <text class="deployment-topology-desc" x="280" y="182">active stream count rather than</text>
    <text class="deployment-topology-desc" x="280" y="198">CPU.</text>
    <text class="deployment-topology-edge" x="280" y="242">the right metric</text>
  </g>
  <line class="deployment-topology-line deployment-topology-conn deployment-topology-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#deployment-topology-tip)"/>
  <g class="deployment-topology-stage deployment-topology-s2">
    <rect class="deployment-topology-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="deployment-topology-step" x="516" y="142">03</text>
    <text class="deployment-topology-name" x="542" y="142">Data and caching</text>
    <text class="deployment-topology-desc" x="516" y="166">In-memory for exact hashes and</text>
    <text class="deployment-topology-desc" x="516" y="182">sessions; vector store for</text>
    <text class="deployment-topology-desc" x="516" y="198">semantic; relational for</text>
  </g>
  <line class="deployment-topology-line deployment-topology-conn deployment-topology-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#deployment-topology-tip)"/>
  <g class="deployment-topology-stage deployment-topology-s3">
    <rect class="deployment-topology-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="deployment-topology-step" x="752" y="142">04</text>
    <text class="deployment-topology-name" x="778" y="142">Model fabric</text>
    <text class="deployment-topology-desc" x="752" y="166">Outbound endpoints to several</text>
    <text class="deployment-topology-desc" x="752" y="182">providers, plus self-hosted</text>
    <text class="deployment-topology-desc" x="752" y="198">capacity.</text>
  </g>
  <text class="deployment-topology-sub" x="30" y="304">Autoscaling on active connections rather than CPU is the AI-specific detail: a gateway holding a thousand slow streams shows modest CPU and is entirely full.</text>
</svg>
