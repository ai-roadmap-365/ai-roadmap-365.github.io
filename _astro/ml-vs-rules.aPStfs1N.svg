<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="When each wins.">
  <title>Machine learning against writing rules</title>
  <style>
    .ml-vs-rules-bg   { fill: #f8fafc; }
    .ml-vs-rules-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ml-vs-rules-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ml-vs-rules-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ml-vs-rules-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ml-vs-rules-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ml-vs-rules-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ml-vs-rules-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ml-vs-rules-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ml-vs-rules-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ml-vs-rules-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ml-vs-rules-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ml-vs-rules-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ml-vs-rules-row { opacity: 1; }
    .ml-vs-rules-r0 { animation-delay: 0.00s; }
    .ml-vs-rules-r1 { animation-delay: 0.45s; }
    .ml-vs-rules-r2 { animation-delay: 0.90s; }
    .ml-vs-rules-r3 { animation-delay: 1.35s; }
    .ml-vs-rules-r4 { animation-delay: 1.80s; }
    .ml-vs-rules-row { animation: ml-vs-rules-reveal 7.3s ease-in-out infinite; }
    @keyframes ml-vs-rules-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="ml-vs-rules-bg" width="980" height="390"/>
  <text class="ml-vs-rules-h1"  x="30" y="40">Machine learning against writing rules</text>
  <text class="ml-vs-rules-sub" x="30" y="64">When each wins.</text>
  <rect class="ml-vs-rules-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="ml-vs-rules-name" x="46" y="122">Write the rule</text>
  <text class="ml-vs-rules-desc" x="46" y="142">When you can.</text>
  <text class="ml-vs-rules-desc ml-vs-rules-row ml-vs-rules-r0" x="46" y="182">The logic is known and stable</text>
  <text class="ml-vs-rules-desc ml-vs-rules-row ml-vs-rules-r1" x="46" y="216">Exact, auditable, and testable</text>
  <text class="ml-vs-rules-desc ml-vs-rules-row ml-vs-rules-r2" x="46" y="250">No training data needed</text>
  <text class="ml-vs-rules-desc ml-vs-rules-row ml-vs-rules-r3" x="46" y="284">Fails visibly when wrong</text>
  <text class="ml-vs-rules-desc ml-vs-rules-row ml-vs-rules-r4" x="46" y="318">Cheaper to build and to run</text>
  <rect class="ml-vs-rules-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="ml-vs-rules-name" x="526" y="122">Learn the rule</text>
  <text class="ml-vs-rules-desc" x="526" y="142">When you cannot.</text>
  <text class="ml-vs-rules-desc ml-vs-rules-row ml-vs-rules-r0" x="526" y="182">The pattern is real but unstateable</text>
  <text class="ml-vs-rules-desc ml-vs-rules-row ml-vs-rules-r1" x="526" y="216">Approximate, and hard to audit</text>
  <text class="ml-vs-rules-desc ml-vs-rules-row ml-vs-rules-r2" x="526" y="250">Needs labelled examples</text>
  <text class="ml-vs-rules-desc ml-vs-rules-row ml-vs-rules-r3" x="526" y="284">Fails silently when wrong</text>
  <text class="ml-vs-rules-desc ml-vs-rules-row ml-vs-rules-r4" x="526" y="318">More expensive in every respect</text>
  <text class="ml-vs-rules-sub" x="30" y="372">Writing the rule where a rule exists is the underrated option, and the failure-visibility row is the strongest argument for it.</text>
</svg>
