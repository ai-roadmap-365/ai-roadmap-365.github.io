<svg role="img" aria-label="Hierarchical checklist matrix displaying deployment gate evaluation criteria spanning offline accuracy slice performance latency limits and fallback triggers" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Production ML Quality Gate Matrix</title>
  <defs>
    <linearGradient id="bg190b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="matrixCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg190b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">PRODUCTION ML DEPLOYMENT QUALITY GATES</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Mandatory Checkpoints Before Promoting Candidate Models to Live Traffic</text>
  <g transform="translate(60, 90)">
    <rect width="730" height="290" fill="url(#matrixCard)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Gate 1 -->
    <rect x="30" y="30" width="320" height="100" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="45" y="55" fill="#34d399" font-family="system-ui" font-size="12" font-weight="700">Gate 1: Metric Superiority</text>
    <text x="45" y="80" fill="#cbd5e1" font-family="system-ui" font-size="10">• Beats Champion Model PR-AUC by &gt;= 1.5%</text>
    <text x="45" y="100" fill="#cbd5e1" font-family="system-ui" font-size="10">• Zero regression on Critical Subgroups (Fairness)</text>
    <!-- Gate 2 -->
    <rect x="380" y="30" width="320" height="100" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="395" y="55" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700">Gate 2: Operational SLA Bounds</text>
    <text x="395" y="80" fill="#cbd5e1" font-family="system-ui" font-size="10">• p99 Inference Latency &lt; 15 ms under 1,000 QPS</text>
    <text x="395" y="100" fill="#cbd5e1" font-family="system-ui" font-size="10">• Memory footprint &lt; 1.5 GB in container</text>
    <!-- Gate 3 -->
    <rect x="30" y="155" width="320" height="100" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" rx="6"/>
    <text x="45" y="180" fill="#fbbf24" font-family="system-ui" font-size="12" font-weight="700">Gate 3: Data Lineage &amp; Schema</text>
    <text x="45" y="205" fill="#cbd5e1" font-family="system-ui" font-size="10">• Pydantic input schema strict validation</text>
    <text x="45" y="225" fill="#cbd5e1" font-family="system-ui" font-size="10">• Immutable model artifact hash logged to Registry</text>
    <!-- Gate 4 -->
    <rect x="380" y="155" width="320" height="100" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" rx="6"/>
    <text x="395" y="180" fill="#f472b6" font-family="system-ui" font-size="12" font-weight="700">Gate 4: Fallback &amp; Circuit Breaker</text>
    <text x="395" y="205" fill="#cbd5e1" font-family="system-ui" font-size="10">• Automatic fallback to heuristic baseline on error</text>
    <text x="395" y="225" fill="#cbd5e1" font-family="system-ui" font-size="10">• Canary routing (5% traffic -&gt; 100% over 24h)</text>
  </g>
</svg>
