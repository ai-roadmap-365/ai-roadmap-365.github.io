<svg role="img" aria-label="Comparative mathematical curves of neural activation functions showing Sigmoid Tanh ReLU Leaky ReLU and GeLU with forward output and gradient derivatives" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Neural Network Activation Functions and Gradient Landscapes</title>
  <defs>
    <linearGradient id="bg198a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card198" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg198a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">NEURAL ACTIVATION FUNCTIONS &amp; GRADIENT DYNAMICS</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Mathematical Properties, Non-Linearity, Saturation Regions, and Gradient Flow</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card198)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Sigmoid Card -->
    <rect x="25" y="25" width="220" height="120" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="135" y="48" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Sigmoid: sigma(z)</text>
    <text x="135" y="66" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">Range: (0, 1) | Max Grad: 0.25</text>
    <path d="M 45 120 C 100 120, 120 75, 225 75" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text x="135" y="135" fill="#f87171" font-size="8" text-anchor="middle">Vanishing Gradient at Tails</text>

    <!-- Tanh Card -->
    <rect x="270" y="25" width="220" height="120" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="380" y="48" fill="#34d399" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Tanh: tanh(z)</text>
    <text x="380" y="66" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">Range: (-1, 1) | Zero-Centered</text>
    <path d="M 290 125 C 345 125, 370 85, 470 70" fill="none" stroke="#10b981" stroke-width="2"/>
    <text x="380" y="135" fill="#f87171" font-size="8" text-anchor="middle">Vanishing Gradient at |z| &gt; 3</text>

    <!-- ReLU Card -->
    <rect x="515" y="25" width="220" height="120" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="625" y="48" fill="#fbbf24" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">ReLU: max(0, z)</text>
    <text x="625" y="66" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">Range: [0, inf) | Grad: 1 if z&gt;0</text>
    <path d="M 535 115 L 625 115 L 715 70" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <text x="625" y="135" fill="#38bdf8" font-size="8" text-anchor="middle">No Upper Saturation | Fast</text>

    <!-- Leaky ReLU / ELU Card -->
    <rect x="25" y="155" width="345" height="115" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" rx="6"/>
    <text x="197" y="178" fill="#c084fc" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Leaky ReLU &amp; Parametric PReLU</text>
    <text x="197" y="196" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">f(z) = max(alpha * z, z) | Prevents Dead ReLUs</text>
    <path d="M 55 245 L 197 235 L 340 190" fill="none" stroke="#c084fc" stroke-width="2"/>

    <!-- GeLU / Swish Card -->
    <rect x="390" y="155" width="345" height="115" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" rx="6"/>
    <text x="562" y="178" fill="#fb7185" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">GeLU &amp; Swish / SiLU (Modern LLMs)</text>
    <text x="562" y="196" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">Smooth, Non-Monotonic | Standard in Transformers &amp; GPT</text>
    <path d="M 420 245 C 480 250, 520 240, 705 190" fill="none" stroke="#f43f5e" stroke-width="2"/>
  </g>
</svg>
