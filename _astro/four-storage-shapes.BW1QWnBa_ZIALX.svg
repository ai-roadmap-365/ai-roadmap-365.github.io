<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The wrong choice shows up later as cost or latency, not as an error.">
  <title>Four shapes, chosen by the question you will ask</title>
  <style>
    .four-storage-shapes-bg   { fill: #f8fafc; }
    .four-storage-shapes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-storage-shapes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-storage-shapes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-storage-shapes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-storage-shapes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-storage-shapes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .four-storage-shapes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .four-storage-shapes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .four-storage-shapes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .four-storage-shapes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .four-storage-shapes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .four-storage-shapes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .four-storage-shapes-row { opacity: 1; }
    .four-storage-shapes-r0 { animation-delay: 0.00s; }
    .four-storage-shapes-r1 { animation-delay: 0.45s; }
    .four-storage-shapes-r2 { animation-delay: 0.90s; }
    .four-storage-shapes-r3 { animation-delay: 1.35s; }
    .four-storage-shapes-r4 { animation-delay: 1.80s; }
    .four-storage-shapes-row { animation: four-storage-shapes-reveal 7.3s ease-in-out infinite; }
    @keyframes four-storage-shapes-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="four-storage-shapes-bg" width="980" height="390"/>
  <text class="four-storage-shapes-h1"  x="30" y="40">Four shapes, chosen by the question you will ask</text>
  <text class="four-storage-shapes-sub" x="30" y="64">The wrong choice shows up later as cost or latency, not as an error.</text>
  <rect class="four-storage-shapes-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="four-storage-shapes-name" x="46" y="122">Written once, read whole</text>
  <text class="four-storage-shapes-desc" x="46" y="142">Files and object storage</text>
  <text class="four-storage-shapes-desc four-storage-shapes-row four-storage-shapes-r0" x="46" y="182">A file: simplest thing that works for one reader</text>
  <text class="four-storage-shapes-desc four-storage-shapes-row four-storage-shapes-r1" x="46" y="216">Object storage: a bucket and a key, fetched entire</text>
  <text class="four-storage-shapes-desc four-storage-shapes-row four-storage-shapes-r2" x="46" y="250">Large, immutable, cheap per byte</text>
  <text class="four-storage-shapes-desc four-storage-shapes-row four-storage-shapes-r3" x="46" y="284">Datasets and model weights live here</text>
  <text class="four-storage-shapes-desc four-storage-shapes-row four-storage-shapes-r4" x="46" y="318">No querying — you get the whole object</text>
  <rect class="four-storage-shapes-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="four-storage-shapes-name" x="526" y="122">Queried, or thrown away</text>
  <text class="four-storage-shapes-desc" x="526" y="142">Databases and caches</text>
  <text class="four-storage-shapes-desc four-storage-shapes-row four-storage-shapes-r0" x="526" y="182">Relational: transactions, joins, many dimensions</text>
  <text class="four-storage-shapes-desc four-storage-shapes-row four-storage-shapes-r1" x="526" y="216">Vector: nearest-neighbour rather than equality</text>
  <text class="four-storage-shapes-desc four-storage-shapes-row four-storage-shapes-r2" x="526" y="250">Cache: a fast volatile copy of something else</text>
  <text class="four-storage-shapes-desc four-storage-shapes-row four-storage-shapes-r3" x="526" y="284">Losing a cache costs latency and nothing more</text>
  <text class="four-storage-shapes-desc four-storage-shapes-row four-storage-shapes-r4" x="526" y="318">A cache that is the only copy is not a cache</text>
  <text class="four-storage-shapes-sub" x="30" y="372">Retrieval-augmented generation is a database query. The knowledge it searches is data at rest, in one of these shapes.</text>
</svg>
