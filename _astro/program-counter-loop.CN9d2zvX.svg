<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The program counter is just a register — and that is the whole trick.">
  <title>The register that makes software possible</title>
  <style>
    .program-counter-loop-bg   { fill: #f8fafc; }
    .program-counter-loop-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .program-counter-loop-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .program-counter-loop-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .program-counter-loop-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .program-counter-loop-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .program-counter-loop-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .program-counter-loop-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .program-counter-loop-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .program-counter-loop-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .program-counter-loop-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .program-counter-loop-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .program-counter-loop-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .program-counter-loop-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .program-counter-loop-stage { opacity: 1; }

    .program-counter-loop-s0 { animation-delay: 0.00s; }
    .program-counter-loop-e0 { animation-delay: 0.00s; }
    .program-counter-loop-s1 { animation-delay: 1.28s; }
    .program-counter-loop-e1 { animation-delay: 1.28s; }
    .program-counter-loop-s2 { animation-delay: 2.56s; }
    .program-counter-loop-e2 { animation-delay: 2.56s; }
    .program-counter-loop-s3 { animation-delay: 3.84s; }
    .program-counter-loop-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .program-counter-loop-conn  { animation: program-counter-loop-trace 6.4s ease-in-out infinite; }
      .program-counter-loop-stage { animation: program-counter-loop-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes program-counter-loop-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes program-counter-loop-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .program-counter-loop-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .program-counter-loop-stage { animation: program-counter-loop-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes program-counter-loop-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="program-counter-loop-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="program-counter-loop-bg" width="980" height="322"/>
  <text class="program-counter-loop-h1"  x="30" y="40">The register that makes software possible</text>
  <text class="program-counter-loop-sub" x="30" y="64">The program counter is just a register — and that is the whole trick.</text>
  <g class="program-counter-loop-stage program-counter-loop-s0">
    <rect class="program-counter-loop-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="program-counter-loop-step" x="44" y="142">01</text>
    <text class="program-counter-loop-name" x="70" y="142">Advance</text>
    <text class="program-counter-loop-desc" x="44" y="166">After each fetch the PC moves</text>
    <text class="program-counter-loop-desc" x="44" y="182">on. Instructions run in order.</text>
    <text class="program-counter-loop-edge" x="44" y="242">sequence</text>
  </g>
  <line class="program-counter-loop-line program-counter-loop-conn program-counter-loop-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#program-counter-loop-tip)"/>
  <g class="program-counter-loop-stage program-counter-loop-s1">
    <rect class="program-counter-loop-hi" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="program-counter-loop-step" x="280" y="142">02</text>
    <text class="program-counter-loop-name" x="306" y="142">Overwrite it</text>
    <text class="program-counter-loop-desc" x="280" y="166">An instruction can write to the</text>
    <text class="program-counter-loop-desc" x="280" y="182">PC like any register.</text>
    <text class="program-counter-loop-edge" x="280" y="242">a jump</text>
  </g>
  <line class="program-counter-loop-line program-counter-loop-conn program-counter-loop-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#program-counter-loop-tip)"/>
  <g class="program-counter-loop-stage program-counter-loop-s2">
    <rect class="program-counter-loop-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="program-counter-loop-step" x="516" y="142">03</text>
    <text class="program-counter-loop-name" x="542" y="142">Jump backward</text>
    <text class="program-counter-loop-desc" x="516" y="166">Point it at an earlier address</text>
    <text class="program-counter-loop-desc" x="516" y="182">and the same code runs again.</text>
    <text class="program-counter-loop-edge" x="516" y="242">a loop</text>
  </g>
  <line class="program-counter-loop-line program-counter-loop-conn program-counter-loop-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#program-counter-loop-tip)"/>
  <g class="program-counter-loop-stage program-counter-loop-s3">
    <rect class="program-counter-loop-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="program-counter-loop-step" x="752" y="142">04</text>
    <text class="program-counter-loop-name" x="778" y="142">Jump on a flag</text>
    <text class="program-counter-loop-desc" x="752" y="166">Jump only if the last result was</text>
    <text class="program-counter-loop-desc" x="752" y="182">zero, or negative.</text>
    <text class="program-counter-loop-edge" x="752" y="242">a decision</text>
  </g>
  <text class="program-counter-loop-sub" x="30" y="304">Loops plus decisions plus arithmetic over stored data is everything software is made of.</text>
</svg>
