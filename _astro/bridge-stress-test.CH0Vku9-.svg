<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Tapping bolts, or 10,000 frequencies.">
  <title>Stress-testing a bridge</title>
  <style>
    .bridge-stress-test-bg   { fill: #f8fafc; }
    .bridge-stress-test-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bridge-stress-test-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bridge-stress-test-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bridge-stress-test-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bridge-stress-test-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bridge-stress-test-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bridge-stress-test-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bridge-stress-test-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bridge-stress-test-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bridge-stress-test-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bridge-stress-test-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bridge-stress-test-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bridge-stress-test-row { opacity: 1; }
    .bridge-stress-test-r0 { animation-delay: 0.00s; }
    .bridge-stress-test-r1 { animation-delay: 0.45s; }
    .bridge-stress-test-r2 { animation-delay: 0.90s; }
    .bridge-stress-test-r3 { animation-delay: 1.35s; }
    .bridge-stress-test-r4 { animation-delay: 1.80s; }
    .bridge-stress-test-row { animation: bridge-stress-test-reveal 7.3s ease-in-out infinite; }
    @keyframes bridge-stress-test-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="bridge-stress-test-bg" width="980" height="390"/>
  <text class="bridge-stress-test-h1"  x="30" y="40">Stress-testing a bridge</text>
  <text class="bridge-stress-test-sub" x="30" y="64">Tapping bolts, or 10,000 frequencies.</text>
  <rect class="bridge-stress-test-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="bridge-stress-test-name" x="46" y="122">The visual inspection</text>
  <text class="bridge-stress-test-desc" x="46" y="142">An engineer with a wrench.</text>
  <text class="bridge-stress-test-desc bridge-stress-test-row bridge-stress-test-r0" x="46" y="182">Walks the bridge, taps a few bolts</text>
  <text class="bridge-stress-test-desc bridge-stress-test-row bridge-stress-test-r1" x="46" y="216">Finds what a person notices</text>
  <text class="bridge-stress-test-desc bridge-stress-test-row bridge-stress-test-r2" x="46" y="250">Annual, at best</text>
  <text class="bridge-stress-test-desc bridge-stress-test-row bridge-stress-test-r3" x="46" y="284">Coverage depends on the inspector</text>
  <text class="bridge-stress-test-desc bridge-stress-test-row bridge-stress-test-r4" x="46" y="318">This is manual red teaming</text>
  <rect class="bridge-stress-test-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="bridge-stress-test-name" x="526" y="122">Automated stress testing</text>
  <text class="bridge-stress-test-desc" x="526" y="142">10,000 frequencies.</text>
  <text class="bridge-stress-test-desc bridge-stress-test-row bridge-stress-test-r0" x="526" y="182">Hydraulic pistons across the spectrum</text>
  <text class="bridge-stress-test-desc bridge-stress-test-row bridge-stress-test-r1" x="526" y="216">Finds hidden resonant fracture points</text>
  <text class="bridge-stress-test-desc bridge-stress-test-row bridge-stress-test-r2" x="526" y="250">Continuous, and repeatable</text>
  <text class="bridge-stress-test-desc bridge-stress-test-row bridge-stress-test-r3" x="526" y="284">Coverage is a parameter</text>
  <text class="bridge-stress-test-desc bridge-stress-test-row bridge-stress-test-r4" x="526" y="318">And 1,000 small cars, not one tank</text>
  <text class="bridge-stress-test-sub" x="30" y="372">The last row is the crescendo: a hundred-ton load trips the weight sensor and a thousand cars arriving one at a time do not, while the total on the cables is identical.</text>
</svg>
