<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One says an error occurred.">
  <title>A flat log, or a span tree</title>
  <style>
    .logs-or-traces-bg   { fill: #f8fafc; }
    .logs-or-traces-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logs-or-traces-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logs-or-traces-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logs-or-traces-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logs-or-traces-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logs-or-traces-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .logs-or-traces-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .logs-or-traces-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .logs-or-traces-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .logs-or-traces-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .logs-or-traces-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .logs-or-traces-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .logs-or-traces-row { opacity: 1; }
    .logs-or-traces-r0 { animation-delay: 0.00s; }
    .logs-or-traces-r1 { animation-delay: 0.45s; }
    .logs-or-traces-r2 { animation-delay: 0.90s; }
    .logs-or-traces-r3 { animation-delay: 1.35s; }
    .logs-or-traces-r4 { animation-delay: 1.80s; }
    .logs-or-traces-row { animation: logs-or-traces-reveal 7.3s ease-in-out infinite; }
    @keyframes logs-or-traces-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="logs-or-traces-bg" width="980" height="390"/>
  <text class="logs-or-traces-h1"  x="30" y="40">A flat log, or a span tree</text>
  <text class="logs-or-traces-sub" x="30" y="64">One says an error occurred.</text>
  <rect class="logs-or-traces-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="logs-or-traces-name" x="46" y="122">Flat logs</text>
  <text class="logs-or-traces-desc" x="46" y="142">"Error: 500".</text>
  <text class="logs-or-traces-desc logs-or-traces-row logs-or-traces-r0" x="46" y="182">A text search across services</text>
  <text class="logs-or-traces-desc logs-or-traces-row logs-or-traces-r1" x="46" y="216">Timestamps to correlate by hand</text>
  <text class="logs-or-traces-desc logs-or-traces-row logs-or-traces-r2" x="46" y="250">No parent-child structure</text>
  <text class="logs-or-traces-desc logs-or-traces-row logs-or-traces-r3" x="46" y="284">Which stage failed is a guess</text>
  <text class="logs-or-traces-desc logs-or-traces-row logs-or-traces-r4" x="46" y="318">Hours of reconstruction</text>
  <rect class="logs-or-traces-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="logs-or-traces-name" x="526" y="122">A span tree</text>
  <text class="logs-or-traces-desc" x="526" y="142">The failing node, clicked.</text>
  <text class="logs-or-traces-desc logs-or-traces-row logs-or-traces-r0" x="526" y="182">One trace ID across every hop</text>
  <text class="logs-or-traces-desc logs-or-traces-row logs-or-traces-r1" x="526" y="216">Nested spans with exact durations</text>
  <text class="logs-or-traces-desc logs-or-traces-row logs-or-traces-r2" x="526" y="250">Inputs and outputs per stage</text>
  <text class="logs-or-traces-desc logs-or-traces-row logs-or-traces-r3" x="526" y="284">The slow span is visibly the slow one</text>
  <text class="logs-or-traces-desc logs-or-traces-row logs-or-traces-r4" x="526" y="318">Seconds</text>
  <text class="logs-or-traces-sub" x="30" y="372">The question a user asks — "it was wrong and slow" — decomposes into four different possible causes, and only the right-hand column can tell you which of them it was.</text>
</svg>
