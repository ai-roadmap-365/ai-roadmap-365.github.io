<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img" aria-label="Continuous Batching Request Lifecycle">
  <title>Continuous Batching Request Lifecycle</title>
  <rect width="100%" height="100%" fill="#f8fafc" />
  
    <style>
      .d279f-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d279f-header { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .d279f-text { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .d279f-accent { fill: #1d4ed8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .d279f-arrow { stroke: #1d4ed8; stroke-width: 2; stroke-linecap: round; marker-end: url(#d279f-arrowhead); }
      .d279f-pulse { animation: d279f-glow 2.5s infinite ease-in-out; }
      @keyframes d279f-glow {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(29, 78, 216, 0.2)); }
        50% { filter: drop-shadow(0 0 6px rgba(29, 78, 216, 0.6)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .d279f-pulse { animation: none; }
      }
    </style>
    
  
    <defs>
      <marker id="d279f-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8" />
      </marker>
    </defs>
    
  
  <g transform="translate(40, 40)">
    <rect class="d279f-box" x="0" y="0" width="180" height="70" />
    <text class="d279f-header" x="15" y="30">Client API Request</text>
    <text class="d279f-text" x="15" y="50">OpenAI /v1/chat format</text>

    <path class="d279f-arrow" d="M 180 35 L 240 35" />

    <rect class="d279f-box d279f-pulse" x="240" y="0" width="220" height="70" />
    <text class="d279f-header" x="15" y="30">Scheduler Queue</text>
    <text class="d279f-text" x="15" y="50">Continuous batch allocator</text>

    <path class="d279f-arrow" d="M 460 35 L 520 35" />

    <rect class="d279f-box" x="520" y="0" width="220" height="70" />
    <text class="d279f-header" x="15" y="30">PagedAttention Worker</text>
    <text class="d279f-accent" x="15" y="50">Block table lookup &amp; step</text>

    <path class="d279f-arrow" d="M 630 70 L 630 130" />

    <rect class="d279f-box" x="520" y="130" width="220" height="70" />
    <text class="d279f-header" x="15" y="30">SSE Streaming Output</text>
    <text class="d279f-text" x="15" y="50">Emit token chunks to client</text>
  </g>

</svg>