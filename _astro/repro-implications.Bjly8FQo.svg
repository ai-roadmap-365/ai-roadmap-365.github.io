<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are about the field.">
  <title>Four consequences of reproduction work</title>
  <style>
    .repro-implications-bg   { fill: #f8fafc; }
    .repro-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .repro-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .repro-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .repro-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .repro-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .repro-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .repro-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .repro-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .repro-implications-stage { opacity: 1; }

    .repro-implications-s0 { animation-delay: 0.00s; }
    .repro-implications-e0 { animation-delay: 0.00s; }
    .repro-implications-s1 { animation-delay: 1.28s; }
    .repro-implications-e1 { animation-delay: 1.28s; }
    .repro-implications-s2 { animation-delay: 2.56s; }
    .repro-implications-e2 { animation-delay: 2.56s; }
    .repro-implications-s3 { animation-delay: 3.84s; }
    .repro-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .repro-implications-conn  { animation: repro-implications-trace 6.4s ease-in-out infinite; }
      .repro-implications-stage { animation: repro-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes repro-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes repro-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .repro-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .repro-implications-stage { animation: repro-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes repro-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="repro-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="repro-implications-bg" width="980" height="322"/>
  <text class="repro-implications-h1"  x="30" y="40">Four consequences of reproduction work</text>
  <text class="repro-implications-sub" x="30" y="64">Two are about the field.</text>
  <g class="repro-implications-stage repro-implications-s0">
    <rect class="repro-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="repro-implications-step" x="44" y="142">01</text>
    <text class="repro-implications-name" x="70" y="142">It is the fastest way to learn a method</text>
    <text class="repro-implications-desc" x="44" y="166">Because every gap has to be</text>
    <text class="repro-implications-desc" x="44" y="182">closed with understanding.</text>
  </g>
  <line class="repro-implications-line repro-implications-conn repro-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#repro-implications-tip)"/>
  <g class="repro-implications-stage repro-implications-s1">
    <rect class="repro-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="repro-implications-step" x="280" y="142">02</text>
    <text class="repro-implications-name" x="306" y="142">And it tests claims the field relies on</text>
    <text class="repro-implications-desc" x="280" y="166">Some of which do not survive.</text>
  </g>
  <line class="repro-implications-line repro-implications-conn repro-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#repro-implications-tip)"/>
  <g class="repro-implications-stage repro-implications-s2">
    <rect class="repro-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="repro-implications-step" x="516" y="142">03</text>
    <text class="repro-implications-name" x="542" y="142">But it costs real compute</text>
    <text class="repro-implications-desc" x="516" y="166">Sometimes more than the</text>
    <text class="repro-implications-desc" x="516" y="182">original, since you will run it</text>
    <text class="repro-implications-desc" x="516" y="198">twice.</text>
  </g>
  <line class="repro-implications-line repro-implications-conn repro-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#repro-implications-tip)"/>
  <g class="repro-implications-stage repro-implications-s3">
    <rect class="repro-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="repro-implications-step" x="752" y="142">04</text>
    <text class="repro-implications-name" x="778" y="142">And it is increasingly published in its own right</text>
    <text class="repro-implications-desc" x="752" y="166">Which is a healthy change.</text>
  </g>
  <text class="repro-implications-sub" x="30" y="304">Reproduction being publishable is a recent and consequential shift: it makes verification something a career can be built on rather than unrewarded service work.</text>
</svg>
