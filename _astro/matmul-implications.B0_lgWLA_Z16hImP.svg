<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are practical.">
  <title>Four consequences</title>
  <style>
    .matmul-implications-bg   { fill: #f8fafc; }
    .matmul-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matmul-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matmul-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matmul-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matmul-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .matmul-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .matmul-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .matmul-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .matmul-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .matmul-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .matmul-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .matmul-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .matmul-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .matmul-implications-stage { opacity: 1; }

    .matmul-implications-s0 { animation-delay: 0.00s; }
    .matmul-implications-e0 { animation-delay: 0.00s; }
    .matmul-implications-s1 { animation-delay: 1.28s; }
    .matmul-implications-e1 { animation-delay: 1.28s; }
    .matmul-implications-s2 { animation-delay: 2.56s; }
    .matmul-implications-e2 { animation-delay: 2.56s; }
    .matmul-implications-s3 { animation-delay: 3.84s; }
    .matmul-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .matmul-implications-conn  { animation: matmul-implications-trace 6.4s ease-in-out infinite; }
      .matmul-implications-stage { animation: matmul-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes matmul-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes matmul-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .matmul-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .matmul-implications-stage { animation: matmul-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes matmul-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="matmul-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="matmul-implications-bg" width="980" height="322"/>
  <text class="matmul-implications-h1"  x="30" y="40">Four consequences</text>
  <text class="matmul-implications-sub" x="30" y="64">Two are practical.</text>
  <g class="matmul-implications-stage matmul-implications-s0">
    <rect class="matmul-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="matmul-implications-step" x="44" y="142">01</text>
    <text class="matmul-implications-name" x="70" y="142">It dominates the runtime of every model</text>
    <text class="matmul-implications-desc" x="44" y="166">Both training and inference.</text>
  </g>
  <line class="matmul-implications-line matmul-implications-conn matmul-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#matmul-implications-tip)"/>
  <g class="matmul-implications-stage matmul-implications-s1">
    <rect class="matmul-implications-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="matmul-implications-step" x="280" y="142">02</text>
    <text class="matmul-implications-name" x="306" y="142">Which is why accelerators exist at all</text>
    <text class="matmul-implications-desc" x="280" y="166">Built for this one operation.</text>
  </g>
  <line class="matmul-implications-line matmul-implications-conn matmul-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#matmul-implications-tip)"/>
  <g class="matmul-implications-stage matmul-implications-s2">
    <rect class="matmul-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="matmul-implications-step" x="516" y="142">03</text>
    <text class="matmul-implications-name" x="542" y="142">Shape errors are the commonest failure in model code</text>
    <text class="matmul-implications-desc" x="516" y="166">And usually a transpose away</text>
    <text class="matmul-implications-desc" x="516" y="182">from correct.</text>
  </g>
  <line class="matmul-implications-line matmul-implications-conn matmul-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#matmul-implications-tip)"/>
  <g class="matmul-implications-stage matmul-implications-s3">
    <rect class="matmul-implications-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="matmul-implications-step" x="752" y="142">04</text>
    <text class="matmul-implications-name" x="778" y="142">And cost grows with the product of three dimensions</text>
    <text class="matmul-implications-desc" x="752" y="166">Which is why model size and cost</text>
    <text class="matmul-implications-desc" x="752" y="182">track together.</text>
  </g>
  <text class="matmul-implications-sub" x="30" y="304">The cost growing with the product of three dimensions is what makes model scaling expensive in the specific way it is, and it explains the compute formulas in later courses.</text>
</svg>
