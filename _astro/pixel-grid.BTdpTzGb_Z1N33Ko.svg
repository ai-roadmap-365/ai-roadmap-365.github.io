<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" role="img" font-family="system-ui, sans-serif">
  <title>A two-by-two pixel image shown as a grid of red, green, blue, and white squares, each labeled with its three RGB channel values</title>
  <rect x="0" y="0" width="700" height="480" fill="#f8fafc"/>
  <text x="350" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">A 2×2 image is twelve numbers</text>

  <!-- Pixel (0,0): red -->
  <rect x="150" y="70" width="130" height="130" fill="#ff0000" stroke="#1d4ed8" stroke-width="2"/>
  <text x="215" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">R=255 G=0 B=0</text>

  <!-- Pixel (0,1): green -->
  <rect x="290" y="70" width="130" height="130" fill="#00ff00" stroke="#1d4ed8" stroke-width="2"/>
  <text x="355" y="245" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">R=0 G=255 B=0</text>

  <!-- Pixel (1,0): blue -->
  <rect x="150" y="256" width="130" height="130" fill="#0000ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="215" y="408" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">R=0 G=0 B=255</text>

  <!-- Pixel (1,1): white -->
  <rect x="290" y="256" width="130" height="130" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="355" y="431" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">R=255 G=255 B=255</text>

  <!-- Side annotations -->
  <text x="450" y="94" font-size="14" fill="#1a202c">Each square is one pixel.</text>
  <text x="450" y="118" font-size="14" fill="#1a202c">Each pixel is three numbers,</text>
  <text x="450" y="142" font-size="14" fill="#1a202c">0–255: red, green, and blue</text>
  <text x="450" y="166" font-size="14" fill="#1a202c">light mixed by your screen.</text>

  <text x="450" y="290" font-size="14" fill="#1a202c">At one byte per number, the</text>
  <text x="450" y="314" font-size="14" fill="#1a202c">whole picture is 12 bytes of</text>
  <text x="450" y="338" font-size="14" fill="#1a202c">pixel data — the same values</text>
  <text x="450" y="362" font-size="14" fill="#1a202c">inside this lab's tiny.png.</text>

  <!-- Accent bracket -->
  <line x1="140" y1="70" x2="140" y2="386" stroke="#1d4ed8" stroke-width="3"/>
  <text x="130" y="228" font-size="14" font-weight="bold" fill="#1d4ed8" transform="rotate(-90 130 228)" text-anchor="middle">2 rows × 2 columns</text>

  <text x="350" y="462" text-anchor="middle" font-size="15" fill="#1a202c">Zoom out to 12 million pixels and you have an ordinary phone photo.</text>
</svg>
