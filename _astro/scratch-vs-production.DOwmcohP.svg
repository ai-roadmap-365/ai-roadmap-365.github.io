<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Same algorithm, different system.">
  <title>The minimal version against production</title>
  <style>
    .scratch-vs-production-bg   { fill: #f8fafc; }
    .scratch-vs-production-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-vs-production-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-vs-production-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-vs-production-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-vs-production-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-vs-production-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scratch-vs-production-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scratch-vs-production-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scratch-vs-production-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scratch-vs-production-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scratch-vs-production-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scratch-vs-production-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scratch-vs-production-row { opacity: 1; }
    .scratch-vs-production-r0 { animation-delay: 0.00s; }
    .scratch-vs-production-r1 { animation-delay: 0.45s; }
    .scratch-vs-production-r2 { animation-delay: 0.90s; }
    .scratch-vs-production-r3 { animation-delay: 1.35s; }
    .scratch-vs-production-r4 { animation-delay: 1.80s; }
    .scratch-vs-production-row { animation: scratch-vs-production-reveal 7.3s ease-in-out infinite; }
    @keyframes scratch-vs-production-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="scratch-vs-production-bg" width="980" height="390"/>
  <text class="scratch-vs-production-h1"  x="30" y="40">The minimal version against production</text>
  <text class="scratch-vs-production-sub" x="30" y="64">Same algorithm, different system.</text>
  <rect class="scratch-vs-production-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="scratch-vs-production-name" x="46" y="122">Minimal</text>
  <text class="scratch-vs-production-desc" x="46" y="142">Two hundred lines.</text>
  <text class="scratch-vs-production-desc scratch-vs-production-row scratch-vs-production-r0" x="46" y="182">Everything in memory</text>
  <text class="scratch-vs-production-desc scratch-vs-production-row scratch-vs-production-r1" x="46" y="216">Rebuilt on every change</text>
  <text class="scratch-vs-production-desc scratch-vs-production-row scratch-vs-production-r2" x="46" y="250">One user, no permissions</text>
  <text class="scratch-vs-production-desc scratch-vs-production-row scratch-vs-production-r3" x="46" y="284">No monitoring</text>
  <text class="scratch-vs-production-desc scratch-vs-production-row scratch-vs-production-r4" x="46" y="318">Correct, and complete as an algorithm</text>
  <rect class="scratch-vs-production-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="scratch-vs-production-name" x="526" y="122">Production</text>
  <text class="scratch-vs-production-desc" x="526" y="142">Thousands.</text>
  <text class="scratch-vs-production-desc scratch-vs-production-row scratch-vs-production-r0" x="526" y="182">Persistent, indexed storage</text>
  <text class="scratch-vs-production-desc scratch-vs-production-row scratch-vs-production-r1" x="526" y="216">Incremental updates by content hash</text>
  <text class="scratch-vs-production-desc scratch-vs-production-row scratch-vs-production-r2" x="526" y="250">Multi-tenant, permission-filtered</text>
  <text class="scratch-vs-production-desc scratch-vs-production-row scratch-vs-production-r3" x="526" y="284">Traced and continuously evaluated</text>
  <text class="scratch-vs-production-desc scratch-vs-production-row scratch-vs-production-r4" x="526" y="318">The same algorithm, operated</text>
  <text class="scratch-vs-production-sub" x="30" y="372">The algorithm column is identical, which is the point of building the minimal version: everything production adds is operations rather than retrieval.</text>
</svg>
