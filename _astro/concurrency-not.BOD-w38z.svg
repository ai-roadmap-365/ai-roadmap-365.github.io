<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things concurrency is not</title>
  <style>
    .concurrency-not-bg   { fill: #f8fafc; }
    .concurrency-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .concurrency-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .concurrency-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .concurrency-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .concurrency-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .concurrency-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .concurrency-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .concurrency-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .concurrency-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .concurrency-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .concurrency-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .concurrency-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .concurrency-not-row { opacity: 1; }
    .concurrency-not-r0 { animation-delay: 0.00s; }
    .concurrency-not-r1 { animation-delay: 0.45s; }
    .concurrency-not-r2 { animation-delay: 0.90s; }
    .concurrency-not-r3 { animation-delay: 1.35s; }
    .concurrency-not-r4 { animation-delay: 1.80s; }
    .concurrency-not-row { animation: concurrency-not-reveal 7.3s ease-in-out infinite; }
    @keyframes concurrency-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="concurrency-not-bg" width="980" height="390"/>
  <text class="concurrency-not-h1"  x="30" y="40">Four things concurrency is not</text>
  <text class="concurrency-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="concurrency-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="concurrency-not-name" x="46" y="122">The misconception</text>
  <text class="concurrency-not-desc" x="46" y="142">Commonly held.</text>
  <text class="concurrency-not-desc concurrency-not-row concurrency-not-r0" x="46" y="182">Concurrency means parallelism</text>
  <text class="concurrency-not-desc concurrency-not-row concurrency-not-r1" x="46" y="216">Threads speed up computation in Python</text>
  <text class="concurrency-not-desc concurrency-not-row concurrency-not-r2" x="46" y="250">Asynchronous code is always faster</text>
  <text class="concurrency-not-desc concurrency-not-row concurrency-not-r3" x="46" y="284">More workers is always better</text>
  <text class="concurrency-not-desc concurrency-not-row concurrency-not-r4" x="46" y="318">Shared state is fine if writes are quick</text>
  <rect class="concurrency-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="concurrency-not-name" x="526" y="122">What is true</text>
  <text class="concurrency-not-desc" x="526" y="142">Actually.</text>
  <text class="concurrency-not-desc concurrency-not-row concurrency-not-r0" x="526" y="182">Interleaving is not simultaneity</text>
  <text class="concurrency-not-desc concurrency-not-row concurrency-not-r1" x="526" y="216">The interpreter lock prevents that</text>
  <text class="concurrency-not-desc concurrency-not-row concurrency-not-r2" x="526" y="250">Only for waiting-dominated work</text>
  <text class="concurrency-not-desc concurrency-not-row concurrency-not-r3" x="526" y="284">Contention and memory both grow</text>
  <text class="concurrency-not-desc concurrency-not-row concurrency-not-r4" x="526" y="318">A quick write is still a race</text>
  <text class="concurrency-not-sub" x="30" y="372">Concurrency and parallelism being different is the distinction that clears up most of the confusion: one is about structure, and the other about hardware.</text>
</svg>
