<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four capabilities, one process.">
  <title>What the daemon provides</title>
  <style>
    .personal-server-parts-bg   { fill: #f8fafc; }
    .personal-server-parts-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .personal-server-parts-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .personal-server-parts-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .personal-server-parts-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .personal-server-parts-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .personal-server-parts-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .personal-server-parts-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .personal-server-parts-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .personal-server-parts-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .personal-server-parts-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .personal-server-parts-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .personal-server-parts-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .personal-server-parts-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .personal-server-parts-stage { opacity: 1; }

    .personal-server-parts-s0 { animation-delay: 0.00s; }
    .personal-server-parts-e0 { animation-delay: 0.00s; }
    .personal-server-parts-s1 { animation-delay: 1.28s; }
    .personal-server-parts-e1 { animation-delay: 1.28s; }
    .personal-server-parts-s2 { animation-delay: 2.56s; }
    .personal-server-parts-e2 { animation-delay: 2.56s; }
    .personal-server-parts-s3 { animation-delay: 3.84s; }
    .personal-server-parts-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .personal-server-parts-conn  { animation: personal-server-parts-trace 6.4s ease-in-out infinite; }
      .personal-server-parts-stage { animation: personal-server-parts-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes personal-server-parts-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes personal-server-parts-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .personal-server-parts-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .personal-server-parts-stage { animation: personal-server-parts-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes personal-server-parts-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="personal-server-parts-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="personal-server-parts-bg" width="980" height="322"/>
  <text class="personal-server-parts-h1"  x="30" y="40">What the daemon provides</text>
  <text class="personal-server-parts-sub" x="30" y="64">Four capabilities, one process.</text>
  <g class="personal-server-parts-stage personal-server-parts-s0">
    <rect class="personal-server-parts-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="personal-server-parts-step" x="44" y="142">01</text>
    <text class="personal-server-parts-name" x="70" y="142">Persistent notes and tasks</text>
    <text class="personal-server-parts-desc" x="44" y="166">A local SQLite store the model</text>
    <text class="personal-server-parts-desc" x="44" y="182">can search across sessions.</text>
    <text class="personal-server-parts-edge" x="44" y="242">memory</text>
  </g>
  <line class="personal-server-parts-line personal-server-parts-conn personal-server-parts-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#personal-server-parts-tip)"/>
  <g class="personal-server-parts-stage personal-server-parts-s1">
    <rect class="personal-server-parts-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="personal-server-parts-step" x="280" y="142">02</text>
    <text class="personal-server-parts-name" x="306" y="142">Repository state</text>
    <text class="personal-server-parts-desc" x="280" y="166">Commits, status and diffs, as a</text>
    <text class="personal-server-parts-desc" x="280" y="182">resource rather than a command</text>
    <text class="personal-server-parts-desc" x="280" y="198">you run.</text>
  </g>
  <line class="personal-server-parts-line personal-server-parts-conn personal-server-parts-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#personal-server-parts-tip)"/>
  <g class="personal-server-parts-stage personal-server-parts-s2">
    <rect class="personal-server-parts-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="personal-server-parts-step" x="516" y="142">03</text>
    <text class="personal-server-parts-name" x="542" y="142">System telemetry</text>
    <text class="personal-server-parts-desc" x="516" y="166">Memory and CPU, so the assistant</text>
    <text class="personal-server-parts-desc" x="516" y="182">can warn before a heavy job.</text>
  </g>
  <line class="personal-server-parts-line personal-server-parts-conn personal-server-parts-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#personal-server-parts-tip)"/>
  <g class="personal-server-parts-stage personal-server-parts-s3">
    <rect class="personal-server-parts-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="personal-server-parts-step" x="752" y="142">04</text>
    <text class="personal-server-parts-name" x="778" y="142">Workflow prompts</text>
    <text class="personal-server-parts-desc" x="752" y="166">Standup, release notes, security</text>
    <text class="personal-server-parts-desc" x="752" y="182">audit — the same shape every</text>
    <text class="personal-server-parts-desc" x="752" y="198">time.</text>
  </g>
  <text class="personal-server-parts-sub" x="30" y="304">The first is the one that changes daily use most: a model with no memory between conversations becomes one that remembers what you were doing yesterday afternoon, without any change to the model.</text>
</svg>
