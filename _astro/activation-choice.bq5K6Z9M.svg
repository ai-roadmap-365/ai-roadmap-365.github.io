<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four defaults, by architecture.">
  <title>Choosing an activation</title>
  <style>
    .activation-choice-bg   { fill: #f8fafc; }
    .activation-choice-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .activation-choice-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .activation-choice-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .activation-choice-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .activation-choice-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .activation-choice-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .activation-choice-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .activation-choice-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .activation-choice-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .activation-choice-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .activation-choice-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .activation-choice-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .activation-choice-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .activation-choice-stage { opacity: 1; }

    .activation-choice-s0 { animation-delay: 0.00s; }
    .activation-choice-e0 { animation-delay: 0.00s; }
    .activation-choice-s1 { animation-delay: 1.28s; }
    .activation-choice-e1 { animation-delay: 1.28s; }
    .activation-choice-s2 { animation-delay: 2.56s; }
    .activation-choice-e2 { animation-delay: 2.56s; }
    .activation-choice-s3 { animation-delay: 3.84s; }
    .activation-choice-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .activation-choice-conn  { animation: activation-choice-trace 6.4s ease-in-out infinite; }
      .activation-choice-stage { animation: activation-choice-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes activation-choice-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes activation-choice-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .activation-choice-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .activation-choice-stage { animation: activation-choice-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes activation-choice-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="activation-choice-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="activation-choice-bg" width="980" height="322"/>
  <text class="activation-choice-h1"  x="30" y="40">Choosing an activation</text>
  <text class="activation-choice-sub" x="30" y="64">Four defaults, by architecture.</text>
  <g class="activation-choice-stage activation-choice-s0">
    <rect class="activation-choice-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="activation-choice-step" x="44" y="142">01</text>
    <text class="activation-choice-name" x="70" y="142">Hidden layers in vision: ReLU</text>
    <text class="activation-choice-desc" x="44" y="166">Fast, effective, still the</text>
    <text class="activation-choice-desc" x="44" y="182">default.</text>
  </g>
  <line class="activation-choice-line activation-choice-conn activation-choice-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#activation-choice-tip)"/>
  <g class="activation-choice-stage activation-choice-s1">
    <rect class="activation-choice-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="activation-choice-step" x="280" y="142">02</text>
    <text class="activation-choice-name" x="306" y="142">Transformers: GeLU or Swish</text>
    <text class="activation-choice-desc" x="280" y="166">Smooth variants, empirically</text>
    <text class="activation-choice-desc" x="280" y="182">better at scale.</text>
    <text class="activation-choice-edge" x="280" y="242">modern</text>
  </g>
  <line class="activation-choice-line activation-choice-conn activation-choice-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#activation-choice-tip)"/>
  <g class="activation-choice-stage activation-choice-s2">
    <rect class="activation-choice-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="activation-choice-step" x="516" y="142">03</text>
    <text class="activation-choice-name" x="542" y="142">Binary output: sigmoid</text>
    <text class="activation-choice-desc" x="516" y="166">One probability.</text>
  </g>
  <line class="activation-choice-line activation-choice-conn activation-choice-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#activation-choice-tip)"/>
  <g class="activation-choice-stage activation-choice-s3">
    <rect class="activation-choice-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="activation-choice-step" x="752" y="142">04</text>
    <text class="activation-choice-name" x="778" y="142">Multi-class output: softmax</text>
    <text class="activation-choice-desc" x="752" y="166">A distribution over classes.</text>
    <text class="activation-choice-desc" x="752" y="182">Once, at the end.</text>
  </g>
  <text class="activation-choice-sub" x="30" y="304">Sigmoid and tanh remain correct at the output and are rarely the right choice in a hidden layer, which is a useful summary of the whole lesson: the failure was never the function, it was where it was used.</text>
</svg>
