<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three mechanisms.">
  <title>Batching variable-length text</title>
  <style>
    .padding-masks-bg   { fill: #f8fafc; }
    .padding-masks-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .padding-masks-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .padding-masks-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .padding-masks-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .padding-masks-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .padding-masks-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .padding-masks-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .padding-masks-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .padding-masks-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .padding-masks-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .padding-masks-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .padding-masks-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .padding-masks-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .padding-masks-stage { opacity: 1; }

    .padding-masks-s0 { animation-delay: 0.00s; }
    .padding-masks-e0 { animation-delay: 0.00s; }
    .padding-masks-s1 { animation-delay: 1.28s; }
    .padding-masks-e1 { animation-delay: 1.28s; }
    .padding-masks-s2 { animation-delay: 2.56s; }
    .padding-masks-e2 { animation-delay: 2.56s; }
    .padding-masks-s3 { animation-delay: 3.84s; }
    .padding-masks-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .padding-masks-conn  { animation: padding-masks-trace 6.4s ease-in-out infinite; }
      .padding-masks-stage { animation: padding-masks-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes padding-masks-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes padding-masks-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .padding-masks-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .padding-masks-stage { animation: padding-masks-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes padding-masks-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="padding-masks-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="padding-masks-bg" width="980" height="322"/>
  <text class="padding-masks-h1"  x="30" y="40">Batching variable-length text</text>
  <text class="padding-masks-sub" x="30" y="64">Three mechanisms.</text>
  <g class="padding-masks-stage padding-masks-s0">
    <rect class="padding-masks-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="padding-masks-step" x="44" y="142">01</text>
    <text class="padding-masks-name" x="70" y="142">Pad to a common length</text>
    <text class="padding-masks-desc" x="44" y="166">Because a batch must be one</text>
    <text class="padding-masks-desc" x="44" y="182">rectangular tensor.</text>
  </g>
  <line class="padding-masks-line padding-masks-conn padding-masks-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#padding-masks-tip)"/>
  <g class="padding-masks-stage padding-masks-s1">
    <rect class="padding-masks-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="padding-masks-step" x="280" y="142">02</text>
    <text class="padding-masks-name" x="306" y="142">And mask the padding</text>
    <text class="padding-masks-desc" x="280" y="166">So attention and loss ignore</text>
    <text class="padding-masks-desc" x="280" y="182">positions that are not real.</text>
  </g>
  <line class="padding-masks-line padding-masks-conn padding-masks-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#padding-masks-tip)"/>
  <g class="padding-masks-stage padding-masks-s2">
    <rect class="padding-masks-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="padding-masks-step" x="516" y="142">03</text>
    <text class="padding-masks-name" x="542" y="142">Truncate what exceeds the limit</text>
    <text class="padding-masks-desc" x="516" y="166">From the start or the end — and</text>
    <text class="padding-masks-desc" x="516" y="182">which end matters.</text>
  </g>
  <line class="padding-masks-line padding-masks-conn padding-masks-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#padding-masks-tip)"/>
  <g class="padding-masks-stage padding-masks-s3">
    <rect class="padding-masks-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="padding-masks-step" x="752" y="142">04</text>
    <text class="padding-masks-name" x="778" y="142">Pad per batch, not globally</text>
    <text class="padding-masks-desc" x="752" y="166">To the longest in this batch.</text>
    <text class="padding-masks-desc" x="752" y="182">Far less wasted computation.</text>
  </g>
  <text class="padding-masks-sub" x="30" y="304">Forgetting the mask is a silent bug: the model attends to padding tokens, learns something from them, and produces results that are worse for no visible reason.</text>
</svg>
