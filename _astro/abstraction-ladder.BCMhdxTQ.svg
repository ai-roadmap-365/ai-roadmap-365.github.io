<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each rung is built only from the rung below it. Nothing else is added.">
  <title>From a switch to a running program</title>
  <style>
    .abstraction-ladder-bg   { fill: #f8fafc; }
    .abstraction-ladder-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .abstraction-ladder-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .abstraction-ladder-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .abstraction-ladder-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .abstraction-ladder-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .abstraction-ladder-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .abstraction-ladder-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .abstraction-ladder-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .abstraction-ladder-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .abstraction-ladder-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .abstraction-ladder-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .abstraction-ladder-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .abstraction-ladder-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .abstraction-ladder-stage { opacity: 1; }

    .abstraction-ladder-s0 { animation-delay: 0.00s; }
    .abstraction-ladder-e0 { animation-delay: 0.00s; }
    .abstraction-ladder-s1 { animation-delay: 1.33s; }
    .abstraction-ladder-e1 { animation-delay: 1.33s; }
    .abstraction-ladder-s2 { animation-delay: 2.67s; }
    .abstraction-ladder-e2 { animation-delay: 2.67s; }
    .abstraction-ladder-s3 { animation-delay: 4.00s; }
    .abstraction-ladder-e3 { animation-delay: 4.00s; }
    .abstraction-ladder-s4 { animation-delay: 5.33s; }
    .abstraction-ladder-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .abstraction-ladder-conn  { animation: abstraction-ladder-trace 8s ease-in-out infinite; }
      .abstraction-ladder-stage { animation: abstraction-ladder-arrive 8s ease-in-out infinite; }
    }
    @keyframes abstraction-ladder-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes abstraction-ladder-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .abstraction-ladder-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .abstraction-ladder-stage { animation: abstraction-ladder-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes abstraction-ladder-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="abstraction-ladder-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="abstraction-ladder-bg" width="980" height="322"/>
  <text class="abstraction-ladder-h1"  x="30" y="40">From a switch to a running program</text>
  <text class="abstraction-ladder-sub" x="30" y="64">Each rung is built only from the rung below it. Nothing else is added.</text>
  <g class="abstraction-ladder-stage abstraction-ladder-s0">
    <rect class="abstraction-ladder-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="abstraction-ladder-step" x="44" y="142">01</text>
    <text class="abstraction-ladder-name" x="70" y="142">Transistor</text>
    <text class="abstraction-ladder-desc" x="44" y="166">A switch. On or off,</text>
    <text class="abstraction-ladder-desc" x="44" y="182">nothing more.</text>
    <text class="abstraction-ladder-edge" x="44" y="242">physics</text>
  </g>
  <line class="abstraction-ladder-line abstraction-ladder-conn abstraction-ladder-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#abstraction-ladder-tip)"/>
  <g class="abstraction-ladder-stage abstraction-ladder-s1">
    <rect class="abstraction-ladder-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="abstraction-ladder-step" x="233" y="142">02</text>
    <text class="abstraction-ladder-name" x="259" y="142">Logic gate</text>
    <text class="abstraction-ladder-desc" x="233" y="166">A few switches wired to</text>
    <text class="abstraction-ladder-desc" x="233" y="182">compute AND, OR, NOT.</text>
    <text class="abstraction-ladder-edge" x="233" y="242">~2-6 transistors</text>
  </g>
  <line class="abstraction-ladder-line abstraction-ladder-conn abstraction-ladder-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#abstraction-ladder-tip)"/>
  <g class="abstraction-ladder-stage abstraction-ladder-s2">
    <rect class="abstraction-ladder-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="abstraction-ladder-step" x="422" y="142">03</text>
    <text class="abstraction-ladder-name" x="448" y="142">Adder</text>
    <text class="abstraction-ladder-desc" x="422" y="166">Gates arranged to add two</text>
    <text class="abstraction-ladder-desc" x="422" y="182">binary numbers.</text>
    <text class="abstraction-ladder-edge" x="422" y="242">~30 gates</text>
  </g>
  <line class="abstraction-ladder-line abstraction-ladder-conn abstraction-ladder-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#abstraction-ladder-tip)"/>
  <g class="abstraction-ladder-stage abstraction-ladder-s3">
    <rect class="abstraction-ladder-hi" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="abstraction-ladder-step" x="611" y="142">04</text>
    <text class="abstraction-ladder-name" x="637" y="142">Processor</text>
    <text class="abstraction-ladder-desc" x="611" y="166">Adders, registers and</text>
    <text class="abstraction-ladder-desc" x="611" y="182">control, driven by a</text>
    <text class="abstraction-ladder-desc" x="611" y="198">clock.</text>
    <text class="abstraction-ladder-edge" x="611" y="242">billions</text>
  </g>
  <line class="abstraction-ladder-line abstraction-ladder-conn abstraction-ladder-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#abstraction-ladder-tip)"/>
  <g class="abstraction-ladder-stage abstraction-ladder-s4">
    <rect class="abstraction-ladder-box" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="abstraction-ladder-step" x="800" y="142">05</text>
    <text class="abstraction-ladder-name" x="826" y="142">Program</text>
    <text class="abstraction-ladder-desc" x="800" y="166">Instructions held in</text>
    <text class="abstraction-ladder-desc" x="800" y="182">memory as data, fetched</text>
    <text class="abstraction-ladder-desc" x="800" y="198">and run.</text>
    <text class="abstraction-ladder-edge" x="800" y="242">software</text>
  </g>
  <text class="abstraction-ladder-sub" x="30" y="304">The jump that matters is the last one: instructions live in memory as data, which is why one machine can do any job.</text>
</svg>
