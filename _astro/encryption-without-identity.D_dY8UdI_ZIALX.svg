<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A perfectly private channel to an impostor is worth nothing.">
  <title>Encryption alone protects the wrong person</title>
  <style>
    .encryption-without-identity-bg   { fill: #f8fafc; }
    .encryption-without-identity-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encryption-without-identity-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encryption-without-identity-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encryption-without-identity-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encryption-without-identity-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encryption-without-identity-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .encryption-without-identity-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .encryption-without-identity-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .encryption-without-identity-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .encryption-without-identity-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .encryption-without-identity-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .encryption-without-identity-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .encryption-without-identity-row { opacity: 1; }
    .encryption-without-identity-r0 { animation-delay: 0.00s; }
    .encryption-without-identity-r1 { animation-delay: 0.45s; }
    .encryption-without-identity-r2 { animation-delay: 0.90s; }
    .encryption-without-identity-r3 { animation-delay: 1.35s; }
    .encryption-without-identity-r4 { animation-delay: 1.80s; }
    .encryption-without-identity-row { animation: encryption-without-identity-reveal 7.3s ease-in-out infinite; }
    @keyframes encryption-without-identity-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="encryption-without-identity-bg" width="980" height="390"/>
  <text class="encryption-without-identity-h1"  x="30" y="40">Encryption alone protects the wrong person</text>
  <text class="encryption-without-identity-sub" x="30" y="64">A perfectly private channel to an impostor is worth nothing.</text>
  <rect class="encryption-without-identity-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="encryption-without-identity-name" x="46" y="122">Encryption only</text>
  <text class="encryption-without-identity-desc" x="46" y="142">Nobody on the path can read it.</text>
  <text class="encryption-without-identity-desc encryption-without-identity-row encryption-without-identity-r0" x="46" y="182">The data is unreadable in transit</text>
  <text class="encryption-without-identity-desc encryption-without-identity-row encryption-without-identity-r1" x="46" y="216">But you never checked who answered</text>
  <text class="encryption-without-identity-desc encryption-without-identity-row encryption-without-identity-r2" x="46" y="250">An impostor who answered first reads everything</text>
  <text class="encryption-without-identity-desc encryption-without-identity-row encryption-without-identity-r3" x="46" y="284">They re-encrypt onward; both ends see normal traffic</text>
  <text class="encryption-without-identity-desc encryption-without-identity-row encryption-without-identity-r4" x="46" y="318">The padlock would still appear</text>
  <rect class="encryption-without-identity-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="encryption-without-identity-name" x="526" y="122">Encryption plus identity</text>
  <text class="encryption-without-identity-desc" x="526" y="142">And you know who you are talking to.</text>
  <text class="encryption-without-identity-desc encryption-without-identity-row encryption-without-identity-r0" x="526" y="182">The certificate binds a public key to a name</text>
  <text class="encryption-without-identity-desc encryption-without-identity-row encryption-without-identity-r1" x="526" y="216">Only the private-key holder can complete the handshake</text>
  <text class="encryption-without-identity-desc encryption-without-identity-row encryption-without-identity-r2" x="526" y="250">An impostor cannot produce a valid signature</text>
  <text class="encryption-without-identity-desc encryption-without-identity-row encryption-without-identity-r3" x="526" y="284">Interception is visible as a broken chain</text>
  <text class="encryption-without-identity-desc encryption-without-identity-row encryption-without-identity-r4" x="526" y="318">This is why verification is not optional</text>
  <text class="encryption-without-identity-sub" x="30" y="372">Which is why disabling certificate verification does not "skip a check" — it removes the half of TLS that makes the other half meaningful.</text>
</svg>
