<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="During an incident there is one answer.">
  <title>Roll back, or fix forward</title>
  <style>
    .rollback-or-forward-bg   { fill: #f8fafc; }
    .rollback-or-forward-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rollback-or-forward-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rollback-or-forward-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rollback-or-forward-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rollback-or-forward-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rollback-or-forward-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rollback-or-forward-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rollback-or-forward-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rollback-or-forward-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rollback-or-forward-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rollback-or-forward-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rollback-or-forward-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rollback-or-forward-row { opacity: 1; }
    .rollback-or-forward-r0 { animation-delay: 0.00s; }
    .rollback-or-forward-r1 { animation-delay: 0.45s; }
    .rollback-or-forward-r2 { animation-delay: 0.90s; }
    .rollback-or-forward-r3 { animation-delay: 1.35s; }
    .rollback-or-forward-r4 { animation-delay: 1.80s; }
    .rollback-or-forward-row { animation: rollback-or-forward-reveal 7.3s ease-in-out infinite; }
    @keyframes rollback-or-forward-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="rollback-or-forward-bg" width="980" height="390"/>
  <text class="rollback-or-forward-h1"  x="30" y="40">Roll back, or fix forward</text>
  <text class="rollback-or-forward-sub" x="30" y="64">During an incident there is one answer.</text>
  <rect class="rollback-or-forward-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="rollback-or-forward-name" x="46" y="122">Roll back</text>
  <text class="rollback-or-forward-desc" x="46" y="142">A state you know works.</text>
  <text class="rollback-or-forward-desc rollback-or-forward-row rollback-or-forward-r0" x="46" y="182">Automated, in 500 milliseconds</text>
  <text class="rollback-or-forward-desc rollback-or-forward-row rollback-or-forward-r1" x="46" y="216">No new code under pressure</text>
  <text class="rollback-or-forward-desc rollback-or-forward-row rollback-or-forward-r2" x="46" y="250">The incident ends, then you investigate</text>
  <text class="rollback-or-forward-desc rollback-or-forward-row rollback-or-forward-r3" x="46" y="284">Reversible again if it was wrong</text>
  <text class="rollback-or-forward-desc rollback-or-forward-row rollback-or-forward-r4" x="46" y="318">Almost always right during an outage</text>
  <rect class="rollback-or-forward-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="rollback-or-forward-name" x="526" y="122">Fix forward</text>
  <text class="rollback-or-forward-desc" x="526" y="142">After it has ended.</text>
  <text class="rollback-or-forward-desc rollback-or-forward-row rollback-or-forward-r0" x="526" y="182">Needs a correct diagnosis first</text>
  <text class="rollback-or-forward-desc rollback-or-forward-row rollback-or-forward-r1" x="526" y="216">Takes a full deployment cycle</text>
  <text class="rollback-or-forward-desc rollback-or-forward-row rollback-or-forward-r2" x="526" y="250">Written by tired people at speed</text>
  <text class="rollback-or-forward-desc rollback-or-forward-row rollback-or-forward-r3" x="526" y="284">The outage runs throughout</text>
  <text class="rollback-or-forward-desc rollback-or-forward-row rollback-or-forward-r4" x="526" y="318">Right only when rollback is impossible</text>
  <text class="rollback-or-forward-sub" x="30" y="372">Day 359 reached the same conclusion from the deployment side, which is worth noticing: it is the same decision viewed from either end, and both ends prefer the option that is already known to work.</text>
</svg>
