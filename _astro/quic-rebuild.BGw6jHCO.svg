<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Because UDP gave up almost nothing that could not be added back.">
  <title>Why QUIC was built on UDP</title>
  <style>
    .quic-rebuild-bg   { fill: #f8fafc; }
    .quic-rebuild-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quic-rebuild-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quic-rebuild-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quic-rebuild-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quic-rebuild-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quic-rebuild-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .quic-rebuild-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .quic-rebuild-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .quic-rebuild-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .quic-rebuild-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .quic-rebuild-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .quic-rebuild-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .quic-rebuild-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .quic-rebuild-stage { opacity: 1; }

    .quic-rebuild-s0 { animation-delay: 0.00s; }
    .quic-rebuild-e0 { animation-delay: 0.00s; }
    .quic-rebuild-s1 { animation-delay: 1.28s; }
    .quic-rebuild-e1 { animation-delay: 1.28s; }
    .quic-rebuild-s2 { animation-delay: 2.56s; }
    .quic-rebuild-e2 { animation-delay: 2.56s; }
    .quic-rebuild-s3 { animation-delay: 3.84s; }
    .quic-rebuild-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .quic-rebuild-conn  { animation: quic-rebuild-trace 6.4s ease-in-out infinite; }
      .quic-rebuild-stage { animation: quic-rebuild-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes quic-rebuild-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes quic-rebuild-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .quic-rebuild-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .quic-rebuild-stage { animation: quic-rebuild-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes quic-rebuild-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="quic-rebuild-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="quic-rebuild-bg" width="980" height="322"/>
  <text class="quic-rebuild-h1"  x="30" y="40">Why QUIC was built on UDP</text>
  <text class="quic-rebuild-sub" x="30" y="64">Because UDP gave up almost nothing that could not be added back.</text>
  <g class="quic-rebuild-stage quic-rebuild-s0">
    <rect class="quic-rebuild-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="quic-rebuild-step" x="44" y="142">01</text>
    <text class="quic-rebuild-name" x="70" y="142">Start from UDP</text>
    <text class="quic-rebuild-desc" x="44" y="166">Ports, a length, a checksum.</text>
    <text class="quic-rebuild-desc" x="44" y="182">Nothing else in the way.</text>
  </g>
  <line class="quic-rebuild-line quic-rebuild-conn quic-rebuild-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#quic-rebuild-tip)"/>
  <g class="quic-rebuild-stage quic-rebuild-s1">
    <rect class="quic-rebuild-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="quic-rebuild-step" x="280" y="142">02</text>
    <text class="quic-rebuild-name" x="306" y="142">Add reliability in user space</text>
    <text class="quic-rebuild-desc" x="280" y="166">Sequence numbers and</text>
    <text class="quic-rebuild-desc" x="280" y="182">retransmission, but written by</text>
    <text class="quic-rebuild-desc" x="280" y="198">the application.</text>
  </g>
  <line class="quic-rebuild-line quic-rebuild-conn quic-rebuild-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#quic-rebuild-tip)"/>
  <g class="quic-rebuild-stage quic-rebuild-s2">
    <rect class="quic-rebuild-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="quic-rebuild-step" x="516" y="142">03</text>
    <text class="quic-rebuild-name" x="542" y="142">Fold in the encryption handshake</text>
    <text class="quic-rebuild-desc" x="516" y="166">Transport and security</text>
    <text class="quic-rebuild-desc" x="516" y="182">negotiated together, saving a</text>
    <text class="quic-rebuild-desc" x="516" y="198">round trip.</text>
    <text class="quic-rebuild-edge" x="516" y="242">1 RTT</text>
  </g>
  <line class="quic-rebuild-line quic-rebuild-conn quic-rebuild-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#quic-rebuild-tip)"/>
  <g class="quic-rebuild-stage quic-rebuild-s3">
    <rect class="quic-rebuild-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="quic-rebuild-step" x="752" y="142">04</text>
    <text class="quic-rebuild-name" x="778" y="142">Multiplex independent streams</text>
    <text class="quic-rebuild-desc" x="752" y="166">One slow stream no longer blocks</text>
    <text class="quic-rebuild-desc" x="752" y="182">the others sharing the</text>
    <text class="quic-rebuild-desc" x="752" y="198">connection.</text>
  </g>
  <text class="quic-rebuild-sub" x="30" y="304">TCP could not be changed this way because it lives in the kernel of every device on earth. Building on UDP meant it could ship as a library instead.</text>
</svg>
