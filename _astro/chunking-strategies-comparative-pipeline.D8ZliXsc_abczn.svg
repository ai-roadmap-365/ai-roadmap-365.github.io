<svg role="img" aria-label="Chunking strategies comparative pipeline diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>Document Chunking Strategies Comparison</title>
  <defs>
    <linearGradient id="bg263a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card263" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg263a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">RAG CHUNKING STRATEGIES COMPARISON</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Comparing Fixed Window, Structure-Aware, Semantic, and Hierarchical Chunking</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card263)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- 1. Fixed Window -->
    <rect x="25" y="25" width="165" height="255" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="107" y="50" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">1. Fixed Sliding Window</text>
    <rect x="35" y="65" width="145" height="65" fill="#1e293b" rx="4"/>
    <text x="45" y="82" fill="#cbd5e1" font-size="7.5">• 500 tokens + 50 overlap</text>
    <text x="45" y="96" fill="#fb7185" font-size="7.5">• Cuts sentences midway</text>
    <text x="45" y="110" fill="#34d399" font-size="7.5">• O(1) Fast character split</text>
    <text x="107" y="260" fill="#38bdf8" font-size="7.5" font-weight="700" text-anchor="middle">Baseline Prototypes</text>

    <!-- 2. Structure-Aware -->
    <rect x="205" y="25" width="165" height="255" fill="#0f172a" stroke="#fbbf24" rx="6"/>
    <text x="287" y="50" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">2. Structure-Aware</text>
    <rect x="215" y="65" width="145" height="65" fill="#1e293b" rx="4"/>
    <text x="225" y="82" fill="#cbd5e1" font-size="7.5">• Markdown H1/H2/H3 splits</text>
    <text x="225" y="96" fill="#34d399" font-size="7.5">• Respects code/tables</text>
    <text x="225" y="110" fill="#34d399" font-size="7.5">• Preserves headers in meta</text>
    <text x="287" y="260" fill="#fbbf24" font-size="7.5" font-weight="700" text-anchor="middle">Docs, Tech Specs, Code</text>

    <!-- 3. Semantic Similarity -->
    <rect x="385" y="25" width="165" height="255" fill="#0f172a" stroke="#34d399" rx="6"/>
    <text x="467" y="50" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">3. Semantic Chunking</text>
    <rect x="395" y="65" width="145" height="65" fill="#1e293b" rx="4"/>
    <text x="405" y="82" fill="#cbd5e1" font-size="7.5">• Splits on cosine drops</text>
    <text x="405" y="96" fill="#34d399" font-size="7.5">• Cohesive topic groups</text>
    <text x="405" y="110" fill="#fbbf24" font-size="7.5">• Extra embedding compute</text>
    <text x="467" y="260" fill="#34d399" font-size="7.5" font-weight="700" text-anchor="middle">Unstructured Text/Essays</text>

    <!-- 4. Parent-Child Hierarchical -->
    <rect x="565" y="25" width="170" height="255" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5" rx="6"/>
    <text x="650" y="50" fill="#a78bfa" font-size="10" font-weight="700" text-anchor="middle">4. Parent-Child / Tree</text>
    <rect x="575" y="65" width="150" height="65" fill="#1e293b" rx="4"/>
    <text x="585" y="82" fill="#cbd5e1" font-size="7.5">• Embed 128t child chunks</text>
    <text x="585" y="96" fill="#34d399" font-size="7.5">• Return 1024t parent doc</text>
    <text x="585" y="110" fill="#38bdf8" font-size="7.5">• Perfect context richness</text>
    <text x="650" y="260" fill="#a78bfa" font-size="7.5" font-weight="700" text-anchor="middle">Production Enterprise RAG</text>
  </g>
</svg>
