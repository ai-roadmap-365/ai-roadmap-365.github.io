<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A defect no test would have caught.">
  <title>Syntactically flawless, financially wrong</title>
  <style>
    .decimal-case-bg   { fill: #f8fafc; }
    .decimal-case-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decimal-case-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decimal-case-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decimal-case-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decimal-case-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decimal-case-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .decimal-case-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .decimal-case-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .decimal-case-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .decimal-case-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .decimal-case-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .decimal-case-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .decimal-case-row { opacity: 1; }
    .decimal-case-r0 { animation-delay: 0.00s; }
    .decimal-case-r1 { animation-delay: 0.45s; }
    .decimal-case-r2 { animation-delay: 0.90s; }
    .decimal-case-r3 { animation-delay: 1.35s; }
    .decimal-case-r4 { animation-delay: 1.80s; }
    .decimal-case-row { animation: decimal-case-reveal 7.3s ease-in-out infinite; }
    @keyframes decimal-case-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="decimal-case-bg" width="980" height="390"/>
  <text class="decimal-case-h1"  x="30" y="40">Syntactically flawless, financially wrong</text>
  <text class="decimal-case-sub" x="30" y="64">A defect no test would have caught.</text>
  <rect class="decimal-case-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="decimal-case-name" x="46" y="122">Floating point</text>
  <text class="decimal-case-desc" x="46" y="142">Passes every test.</text>
  <text class="decimal-case-desc decimal-case-row decimal-case-r0" x="46" y="182">amount * rate * (1.0 - fee_pct)</text>
  <text class="decimal-case-desc decimal-case-row decimal-case-r1" x="46" y="216">Idiomatic, readable, correct-looking</text>
  <text class="decimal-case-desc decimal-case-row decimal-case-r2" x="46" y="250">Binary rounding artefacts per operation</text>
  <text class="decimal-case-desc decimal-case-row decimal-case-r3" x="46" y="284">Fractional cents, accumulating</text>
  <text class="decimal-case-desc decimal-case-row decimal-case-r4" x="46" y="318">Found by a reviewer, not by a suite</text>
  <rect class="decimal-case-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="decimal-case-name" x="526" y="122">Decimal</text>
  <text class="decimal-case-desc" x="526" y="142">Exact, and explicit.</text>
  <text class="decimal-case-desc decimal-case-row decimal-case-r0" x="526" y="182">decimal.Decimal throughout</text>
  <text class="decimal-case-desc decimal-case-row decimal-case-r1" x="526" y="216">ROUND_HALF_EVEN stated deliberately</text>
  <text class="decimal-case-desc decimal-case-row decimal-case-r2" x="526" y="250">No binary representation error</text>
  <text class="decimal-case-desc decimal-case-row decimal-case-r3" x="526" y="284">Auditable to the cent</text>
  <text class="decimal-case-desc decimal-case-row decimal-case-r4" x="526" y="318">The domain requires it</text>
  <text class="decimal-case-sub" x="30" y="372">This is the archetype of a defect that survives every automated gate: the code is valid, the tests pass, and the error is a property of the numeric type that only domain knowledge flags.</text>
</svg>
