<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Dense did not replace lexical.">
  <title>Four steps to hybrid retrieval</title>
  <style>
    .hybrid-history-bg   { fill: #f8fafc; }
    .hybrid-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hybrid-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hybrid-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hybrid-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hybrid-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hybrid-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hybrid-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hybrid-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hybrid-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hybrid-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hybrid-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hybrid-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .hybrid-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .hybrid-history-stage { opacity: 1; }

    .hybrid-history-s0 { animation-delay: 0.00s; }
    .hybrid-history-e0 { animation-delay: 0.00s; }
    .hybrid-history-s1 { animation-delay: 1.28s; }
    .hybrid-history-e1 { animation-delay: 1.28s; }
    .hybrid-history-s2 { animation-delay: 2.56s; }
    .hybrid-history-e2 { animation-delay: 2.56s; }
    .hybrid-history-s3 { animation-delay: 3.84s; }
    .hybrid-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .hybrid-history-conn  { animation: hybrid-history-trace 6.4s ease-in-out infinite; }
      .hybrid-history-stage { animation: hybrid-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes hybrid-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes hybrid-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .hybrid-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .hybrid-history-stage { animation: hybrid-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes hybrid-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="hybrid-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="hybrid-history-bg" width="980" height="322"/>
  <text class="hybrid-history-h1"  x="30" y="40">Four steps to hybrid retrieval</text>
  <text class="hybrid-history-sub" x="30" y="64">Dense did not replace lexical.</text>
  <g class="hybrid-history-stage hybrid-history-s0">
    <rect class="hybrid-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="hybrid-history-step" x="44" y="142">01</text>
    <text class="hybrid-history-name" x="70" y="142">Statistical lexical ranking, for decades</text>
    <text class="hybrid-history-desc" x="44" y="166">Well understood, and hard to</text>
    <text class="hybrid-history-desc" x="44" y="182">beat.</text>
  </g>
  <line class="hybrid-history-line hybrid-history-conn hybrid-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#hybrid-history-tip)"/>
  <g class="hybrid-history-stage hybrid-history-s1">
    <rect class="hybrid-history-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="hybrid-history-step" x="280" y="142">02</text>
    <text class="hybrid-history-name" x="306" y="142">Dense retrieval arrives</text>
    <text class="hybrid-history-desc" x="280" y="166">Better on paraphrase, worse on</text>
    <text class="hybrid-history-desc" x="280" y="182">exact terms.</text>
  </g>
  <line class="hybrid-history-line hybrid-history-conn hybrid-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#hybrid-history-tip)"/>
  <g class="hybrid-history-stage hybrid-history-s2">
    <rect class="hybrid-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="hybrid-history-step" x="516" y="142">03</text>
    <text class="hybrid-history-name" x="542" y="142">And the two are found to be complementary</text>
    <text class="hybrid-history-desc" x="516" y="166">Each strong where the other is</text>
    <text class="hybrid-history-desc" x="516" y="182">weak.</text>
  </g>
  <line class="hybrid-history-line hybrid-history-conn hybrid-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#hybrid-history-tip)"/>
  <g class="hybrid-history-stage hybrid-history-s3">
    <rect class="hybrid-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="hybrid-history-step" x="752" y="142">04</text>
    <text class="hybrid-history-name" x="778" y="142">Producing the standard two-stage pipeline</text>
    <text class="hybrid-history-desc" x="752" y="166">Both, fused, then reranked.</text>
  </g>
  <text class="hybrid-history-sub" x="30" y="304">The expectation was replacement and the outcome was combination, which is worth remembering as a general caution about new methods in this field.</text>
</svg>
