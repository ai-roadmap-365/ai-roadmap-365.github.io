<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A retry is not a second intent.">
  <title>Why mutating tools need a key</title>
  <style>
    .idempotency-bg   { fill: #f8fafc; }
    .idempotency-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .idempotency-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .idempotency-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .idempotency-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .idempotency-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .idempotency-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .idempotency-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .idempotency-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .idempotency-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .idempotency-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .idempotency-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .idempotency-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .idempotency-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .idempotency-stage { opacity: 1; }

    .idempotency-s0 { animation-delay: 0.00s; }
    .idempotency-e0 { animation-delay: 0.00s; }
    .idempotency-s1 { animation-delay: 1.28s; }
    .idempotency-e1 { animation-delay: 1.28s; }
    .idempotency-s2 { animation-delay: 2.56s; }
    .idempotency-e2 { animation-delay: 2.56s; }
    .idempotency-s3 { animation-delay: 3.84s; }
    .idempotency-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .idempotency-conn  { animation: idempotency-trace 6.4s ease-in-out infinite; }
      .idempotency-stage { animation: idempotency-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes idempotency-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes idempotency-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .idempotency-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .idempotency-stage { animation: idempotency-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes idempotency-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="idempotency-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="idempotency-bg" width="980" height="322"/>
  <text class="idempotency-h1"  x="30" y="40">Why mutating tools need a key</text>
  <text class="idempotency-sub" x="30" y="64">A retry is not a second intent.</text>
  <g class="idempotency-stage idempotency-s0">
    <rect class="idempotency-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="idempotency-step" x="44" y="142">01</text>
    <text class="idempotency-name" x="70" y="142">The failure</text>
    <text class="idempotency-desc" x="44" y="166">charge_credit_card(50), the</text>
    <text class="idempotency-desc" x="44" y="182">connection drops, the agent</text>
    <text class="idempotency-desc" x="44" y="198">retries twice. $150.</text>
  </g>
  <line class="idempotency-line idempotency-conn idempotency-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#idempotency-tip)"/>
  <g class="idempotency-stage idempotency-s1">
    <rect class="idempotency-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="idempotency-step" x="280" y="142">02</text>
    <text class="idempotency-name" x="306" y="142">Derive a key</text>
    <text class="idempotency-desc" x="280" y="166">SHA256 of the tool name plus</text>
    <text class="idempotency-desc" x="280" y="182">canonical JSON of the sorted</text>
    <text class="idempotency-desc" x="280" y="198">arguments.</text>
  </g>
  <line class="idempotency-line idempotency-conn idempotency-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#idempotency-tip)"/>
  <g class="idempotency-stage idempotency-s2">
    <rect class="idempotency-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="idempotency-step" x="516" y="142">03</text>
    <text class="idempotency-name" x="542" y="142">Check the cache first</text>
    <text class="idempotency-desc" x="516" y="166">Present: return the cached</text>
    <text class="idempotency-desc" x="516" y="182">response without re-executing.</text>
  </g>
  <line class="idempotency-line idempotency-conn idempotency-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#idempotency-tip)"/>
  <g class="idempotency-stage idempotency-s3">
    <rect class="idempotency-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="idempotency-step" x="752" y="142">04</text>
    <text class="idempotency-name" x="778" y="142">So a retry is safe</text>
    <text class="idempotency-desc" x="752" y="166">Same intent, same key, one side</text>
    <text class="idempotency-desc" x="752" y="182">effect.</text>
  </g>
  <text class="idempotency-sub" x="30" y="304">This matters more with a model than with a human caller: a person who is unsure whether a charge went through checks, and an agent's natural response to an ambiguous failure is to try again.</text>
</svg>
