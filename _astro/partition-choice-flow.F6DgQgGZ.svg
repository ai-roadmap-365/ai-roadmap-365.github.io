<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" width="1280" height="880" role="img" aria-labelledby="d092f-title d092f-desc">
  <title id="d092f-title">The CAP choice drawn as what it actually is: what a replicated store does with a write while the network between its replicas is broken</title>
  <desc id="d092f-desc">A write travels from a librarian in London into replica A. Replica A and replica B normally keep each other up to date, but the link between them is broken, so a partition has occurred. From that moment the store has exactly two options and it must pick one. Branch one refuses the write, because replica A cannot confirm it with replica B: consistency is kept, no reader anywhere ever sees two different answers, and the price is that the desk cannot issue the book until the link heals. Branch two accepts the write on whichever side receives it: availability is kept, both desks keep working, and the price is that the two sides disagree until the link heals and something reconciles them, by last-write-wins, by a version vector, or by a person. A panel at the foot states what the CAP theorem actually claims — that during a partition a store cannot be both consistent and available — and corrects the popular pick-two-of-three reading, since nobody chooses partition tolerance and a store with no partition can be both consistent and available at once.</desc>

  <style>
    .d092f-bg    { fill: #f8fafc; }
    .d092f-h1    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 600; fill: #1a202c; }
    .d092f-sub   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d092f-lab   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 600; fill: #1a202c; }
    .d092f-txt   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1a202c; }
    .d092f-small { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d092f-warn  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 600; fill: #b45309; }
    .d092f-good  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 600; fill: #047857; }
    .d092f-blue  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 600; fill: #1d4ed8; }
    .d092f-box   { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d092f-panel { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d092f-cp    { fill: #ffffff; stroke: #047857; stroke-width: 2.5; }
    .d092f-ap    { fill: #ffffff; stroke: #b45309; stroke-width: 2.5; }

    /* Motion 3 — the two replicas and then the two branches take emphasis in turn. */
    .d092f-stage { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5; animation: d092f-lift 8s ease-in-out infinite; }
    .d092f-s1 { animation-delay: 0.6s; }
    .d092f-s2 { animation-delay: 1.4s; }
    @keyframes d092f-lift {
      0%, 22%, 100% { fill: #e0e7ff; }
      6%, 16%       { fill: #bfdbfe; }
    }

    /* Motion 2 — the healthy wires flow; reduced motion makes them solid arrows. */
    .d092f-wire {
      fill: none; stroke: #1d4ed8; stroke-width: 2.5;
      stroke-dasharray: 10 8; animation: d092f-march 1.6s linear infinite;
    }
    @keyframes d092f-march { to { stroke-dashoffset: -18; } }

    /* Motion 1 — the write travels from the desk into replica A and rests visible. */
    .d092f-token { fill: #1d4ed8; animation: d092f-travel 8s ease-in-out infinite; }
    @keyframes d092f-travel {
      0%   { transform: translateX(0);   opacity: 1; }
      6%   { transform: translateX(0);   opacity: 1; }
      18%  { transform: translateX(96px); opacity: 1; }
      100% { transform: translateX(96px); opacity: 1; }
    }

    /* The severed link pulses so the eye finds the cause. It never disappears. */
    .d092f-cut { stroke: #b45309; stroke-width: 4; fill: none; animation: d092f-throb 8s ease-in-out infinite; }
    @keyframes d092f-throb {
      0%, 20%, 60%, 100% { opacity: 0.85; }
      30%, 46%           { opacity: 1; }
    }

    /* The two outcomes take their turn, one after the other, never both at once. */
    .d092f-branchA { animation: d092f-turnA 8s ease-in-out infinite; }
    .d092f-branchB { animation: d092f-turnB 8s ease-in-out infinite; }
    @keyframes d092f-turnA {
      0%, 34%, 62%, 100% { opacity: 0.88; }
      42%, 54%           { opacity: 1; }
    }
    @keyframes d092f-turnB {
      0%, 62%, 92%, 100% { opacity: 0.88; }
      70%, 84%           { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d092f-stage   { animation: none; fill: #e0e7ff; }
      .d092f-wire    { animation: none; stroke-dasharray: none; }
      .d092f-token   { animation: none; transform: none; opacity: 1; }
      .d092f-cut     { animation: none; opacity: 1; }
      .d092f-branchA { animation: none; opacity: 1; }
      .d092f-branchB { animation: none; opacity: 1; }
    }
  </style>

  <defs>
    <marker id="d092f-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
    <marker id="d092f-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857" />
    </marker>
    <marker id="d092f-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309" />
    </marker>
  </defs>

  <rect class="d092f-bg" x="0" y="0" width="1280" height="880" />

  <text class="d092f-h1"  x="32" y="38">The partition choice — what CAP is actually about</text>
  <text class="d092f-sub" x="32" y="62">Two replicas of the library catalogue, one in London and one in Mumbai. They normally copy every write to each other within milliseconds.</text>
  <text class="d092f-sub" x="32" y="82">Right now the link between them is down. That, and only that, is when the choice below exists.</text>

  <!-- the write arrives -->
  <rect class="d092f-box" x="32" y="124" width="176" height="86" rx="8" />
  <text class="d092f-lab"   x="120" y="152" text-anchor="middle">London desk</text>
  <text class="d092f-small" x="120" y="174" text-anchor="middle">writes: book 101</text>
  <text class="d092f-small" x="120" y="194" text-anchor="middle">shelf A3 → B7</text>

  <path class="d092f-wire" d="M 214 167 L 292 167" marker-end="url(#d092f-arrow)" />
  <circle class="d092f-token" cx="222" cy="167" r="8" />

  <rect class="d092f-stage d092f-s1" x="300" y="118" width="228" height="98" rx="8" />
  <text class="d092f-lab"   x="414" y="150" text-anchor="middle">Replica A · London</text>
  <text class="d092f-small" x="414" y="174" text-anchor="middle">has the new value</text>
  <text class="d092f-small" x="414" y="196" text-anchor="middle">shelf = B7</text>

  <!-- the partition -->
  <path class="d092f-cut" d="M 536 167 L 592 167" />
  <path class="d092f-cut" d="M 686 167 L 742 167" />
  <path class="d092f-cut" d="M 606 140 L 628 167 L 606 167 L 628 194" />
  <text class="d092f-warn"  x="639" y="118" text-anchor="middle">network partition</text>
  <text class="d092f-small" x="639" y="228" text-anchor="middle">A and B cannot reach each other.</text>
  <text class="d092f-small" x="639" y="248" text-anchor="middle">Neither knows whether the other is</text>
  <text class="d092f-small" x="639" y="268" text-anchor="middle">dead or merely unreachable.</text>

  <rect class="d092f-stage d092f-s2" x="750" y="118" width="228" height="98" rx="8" />
  <text class="d092f-lab"   x="864" y="150" text-anchor="middle">Replica B · Mumbai</text>
  <text class="d092f-small" x="864" y="174" text-anchor="middle">still has the old value</text>
  <text class="d092f-small" x="864" y="196" text-anchor="middle">shelf = A3</text>

  <path class="d092f-wire" d="M 1064 167 L 986 167" marker-end="url(#d092f-arrow)" />

  <rect class="d092f-box" x="1072" y="124" width="176" height="86" rx="8" />
  <text class="d092f-lab"   x="1160" y="152" text-anchor="middle">Mumbai desk</text>
  <text class="d092f-small" x="1160" y="174" text-anchor="middle">asks: where is</text>
  <text class="d092f-small" x="1160" y="194" text-anchor="middle">book 101?</text>

  <!-- branch A: refuse -->
  <g class="d092f-branchA">
    <path class="d092f-wire" d="M 380 224 L 300 314" marker-end="url(#d092f-arrow)" />

    <rect class="d092f-cp" x="32" y="320" width="580" height="112" rx="8" />
    <text class="d092f-good" x="52" y="350">Choice 1 · refuse the write</text>
    <text class="d092f-txt"  x="52" y="376">Replica A will not accept a change it cannot confirm with B.</text>
    <text class="d092f-txt"  x="52" y="398">The librarian gets an error, not a receipt.</text>
    <text class="d092f-small" x="52" y="420">In the literature: a CP system. Majority-quorum stores behave this way.</text>

    <path class="d092f-cp" d="M 322 434 L 322 470" marker-end="url(#d092f-arrow-green)" />

    <rect class="d092f-cp" x="32" y="476" width="580" height="176" rx="8" />
    <text class="d092f-good" x="52" y="506">The consequence, spelled out</text>
    <text class="d092f-txt"  x="52" y="532">No reader anywhere is ever told a different answer from</text>
    <text class="d092f-txt"  x="52" y="554">another reader. There is one truth about book 101.</text>
    <text class="d092f-txt"  x="52" y="582">And the London desk cannot issue that book until the</text>
    <text class="d092f-txt"  x="52" y="604">link heals. The queue waits on a network cable.</text>
    <text class="d092f-small" x="52" y="632">You did not lose the data. You lost the minutes.</text>

    <rect class="d092f-panel" x="32" y="662" width="580" height="44" rx="6" />
    <text class="d092f-blue" x="52" y="691">consistency kept  ·  availability given up</text>
  </g>

  <!-- branch B: accept -->
  <g class="d092f-branchB">
    <path class="d092f-wire" d="M 898 224 L 978 314" marker-end="url(#d092f-arrow)" />

    <rect class="d092f-ap" x="668" y="320" width="580" height="112" rx="8" />
    <text class="d092f-warn" x="688" y="350">Choice 2 · accept the write</text>
    <text class="d092f-txt"  x="688" y="376">Each side serves whoever can reach it and records what it did.</text>
    <text class="d092f-txt"  x="688" y="398">The librarian gets a receipt. So does everyone in Mumbai.</text>
    <text class="d092f-small" x="688" y="420">In the literature: an AP system. Eventually-consistent stores behave this way.</text>

    <path class="d092f-ap" d="M 958 434 L 958 470" marker-end="url(#d092f-arrow-amber)" />

    <rect class="d092f-ap" x="668" y="476" width="580" height="176" rx="8" />
    <text class="d092f-warn" x="688" y="506">The consequence, spelled out</text>
    <text class="d092f-txt"  x="688" y="532">Both desks keep working. Nobody is turned away.</text>
    <text class="d092f-txt"  x="688" y="554">And for as long as the link is down, London says B7</text>
    <text class="d092f-txt"  x="688" y="576">and Mumbai says A3. Both are answering honestly.</text>
    <text class="d092f-txt"  x="688" y="604">When the link heals, something must merge them:</text>
    <text class="d092f-small" x="688" y="632">last-write-wins, a version vector, or a person deciding.</text>

    <rect class="d092f-panel" x="668" y="662" width="580" height="44" rx="6" />
    <text class="d092f-blue" x="688" y="691">availability kept  ·  consistency deferred to a repair</text>
  </g>

  <!-- what CAP actually says -->
  <rect class="d092f-panel" x="32" y="722" width="1216" height="132" rx="8" />
  <text class="d092f-lab"   x="52" y="752">What the theorem actually claims</text>
  <text class="d092f-txt"   x="52" y="778">When a partition occurs, a distributed store cannot be both consistent and available. It must give up one of them, for as long as the partition lasts.</text>
  <text class="d092f-txt"   x="52" y="804">It does NOT say pick two of three. Nobody chooses partition tolerance — networks fail whether or not you agreed to it — so P is a condition, not an option.</text>
  <text class="d092f-txt"   x="52" y="830">And when there is no partition, which is nearly always, a well-built store gives you consistency and availability at the same time. There is no trade to make.</text>
</svg>
