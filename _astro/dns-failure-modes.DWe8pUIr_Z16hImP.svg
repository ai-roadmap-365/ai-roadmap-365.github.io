<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four failures that look like something else entirely.">
  <title>When DNS is the actual problem</title>
  <style>
    .dns-failure-modes-bg   { fill: #f8fafc; }
    .dns-failure-modes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dns-failure-modes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dns-failure-modes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dns-failure-modes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dns-failure-modes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dns-failure-modes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dns-failure-modes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dns-failure-modes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dns-failure-modes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dns-failure-modes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dns-failure-modes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dns-failure-modes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .dns-failure-modes-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .dns-failure-modes-stage { opacity: 1; }

    .dns-failure-modes-s0 { animation-delay: 0.00s; }
    .dns-failure-modes-e0 { animation-delay: 0.00s; }
    .dns-failure-modes-s1 { animation-delay: 1.28s; }
    .dns-failure-modes-e1 { animation-delay: 1.28s; }
    .dns-failure-modes-s2 { animation-delay: 2.56s; }
    .dns-failure-modes-e2 { animation-delay: 2.56s; }
    .dns-failure-modes-s3 { animation-delay: 3.84s; }
    .dns-failure-modes-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .dns-failure-modes-conn  { animation: dns-failure-modes-trace 6.4s ease-in-out infinite; }
      .dns-failure-modes-stage { animation: dns-failure-modes-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes dns-failure-modes-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes dns-failure-modes-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .dns-failure-modes-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .dns-failure-modes-stage { animation: dns-failure-modes-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes dns-failure-modes-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="dns-failure-modes-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="dns-failure-modes-bg" width="980" height="322"/>
  <text class="dns-failure-modes-h1"  x="30" y="40">When DNS is the actual problem</text>
  <text class="dns-failure-modes-sub" x="30" y="64">Four failures that look like something else entirely.</text>
  <g class="dns-failure-modes-stage dns-failure-modes-s0">
    <rect class="dns-failure-modes-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="dns-failure-modes-step" x="44" y="142">01</text>
    <text class="dns-failure-modes-name" x="70" y="142">No resolver in the container</text>
    <text class="dns-failure-modes-desc" x="44" y="166">Everything times out. Looks like</text>
    <text class="dns-failure-modes-desc" x="44" y="182">a network outage; is a missing</text>
    <text class="dns-failure-modes-desc" x="44" y="198">config file.</text>
    <text class="dns-failure-modes-edge" x="44" y="242">timeouts</text>
  </g>
  <line class="dns-failure-modes-line dns-failure-modes-conn dns-failure-modes-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#dns-failure-modes-tip)"/>
  <g class="dns-failure-modes-stage dns-failure-modes-s1">
    <rect class="dns-failure-modes-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="dns-failure-modes-step" x="280" y="142">02</text>
    <text class="dns-failure-modes-name" x="306" y="142">A stale cached record</text>
    <text class="dns-failure-modes-desc" x="280" y="166">Half your users reach the old</text>
    <text class="dns-failure-modes-desc" x="280" y="182">server. Looks intermittent; is a</text>
    <text class="dns-failure-modes-desc" x="280" y="198">TTL.</text>
  </g>
  <line class="dns-failure-modes-line dns-failure-modes-conn dns-failure-modes-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#dns-failure-modes-tip)"/>
  <g class="dns-failure-modes-stage dns-failure-modes-s2">
    <rect class="dns-failure-modes-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="dns-failure-modes-step" x="516" y="142">03</text>
    <text class="dns-failure-modes-name" x="542" y="142">A lapsed registration</text>
    <text class="dns-failure-modes-desc" x="516" y="166">The domain simply stops</text>
    <text class="dns-failure-modes-desc" x="516" y="182">resolving. Cheapest catastrophic</text>
    <text class="dns-failure-modes-desc" x="516" y="198">failure available.</text>
    <text class="dns-failure-modes-edge" x="516" y="242">auto-renew</text>
  </g>
  <line class="dns-failure-modes-line dns-failure-modes-conn dns-failure-modes-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#dns-failure-modes-tip)"/>
  <g class="dns-failure-modes-stage dns-failure-modes-s3">
    <rect class="dns-failure-modes-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="dns-failure-modes-step" x="752" y="142">04</text>
    <text class="dns-failure-modes-name" x="778" y="142">An intercepted answer</text>
    <text class="dns-failure-modes-desc" x="752" y="166">You reach the wrong server and</text>
    <text class="dns-failure-modes-desc" x="752" y="182">everything else looks correct.</text>
    <text class="dns-failure-modes-edge" x="752" y="242">DNSSEC</text>
  </g>
  <text class="dns-failure-modes-sub" x="30" y="304">Run dig before assuming an application is broken. A large share of "the service is down" turns out to be resolution.</text>
</svg>
