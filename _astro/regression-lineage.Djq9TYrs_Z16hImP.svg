<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Determinism, Pass@k, then CI.">
  <title>Three steps to a prompt gate</title>
  <style>
    .regression-lineage-bg   { fill: #f8fafc; }
    .regression-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regression-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regression-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regression-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regression-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regression-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .regression-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .regression-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .regression-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .regression-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .regression-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .regression-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .regression-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .regression-lineage-stage { opacity: 1; }

    .regression-lineage-s0 { animation-delay: 0.00s; }
    .regression-lineage-e0 { animation-delay: 0.00s; }
    .regression-lineage-s1 { animation-delay: 1.50s; }
    .regression-lineage-e1 { animation-delay: 1.50s; }
    .regression-lineage-s2 { animation-delay: 3.00s; }
    .regression-lineage-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .regression-lineage-conn  { animation: regression-lineage-trace 6s ease-in-out infinite; }
      .regression-lineage-stage { animation: regression-lineage-arrive 6s ease-in-out infinite; }
    }
    @keyframes regression-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes regression-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .regression-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .regression-lineage-stage { animation: regression-lineage-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes regression-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="regression-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="regression-lineage-bg" width="980" height="322"/>
  <text class="regression-lineage-h1"  x="30" y="40">Three steps to a prompt gate</text>
  <text class="regression-lineage-sub" x="30" y="64">Determinism, Pass@k, then CI.</text>
  <g class="regression-lineage-stage regression-lineage-s0">
    <rect class="regression-lineage-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="regression-lineage-step" x="44" y="142">01</text>
    <text class="regression-lineage-name" x="70" y="142">Deterministic assumptions, 2015-2020</text>
    <text class="regression-lineage-desc" x="44" y="166">Exact string matching against natural</text>
    <text class="regression-lineage-desc" x="44" y="182">language. Constant false failures.</text>
  </g>
  <line class="regression-lineage-line regression-lineage-conn regression-lineage-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#regression-lineage-tip)"/>
  <g class="regression-lineage-stage regression-lineage-s1">
    <rect class="regression-lineage-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="regression-lineage-step" x="359" y="142">02</text>
    <text class="regression-lineage-name" x="385" y="142">Pass@k, 2021</text>
    <text class="regression-lineage-desc" x="359" y="166">HumanEval formalised evaluating a stochastic</text>
    <text class="regression-lineage-desc" x="359" y="182">generator over n samples.</text>
  </g>
  <line class="regression-lineage-line regression-lineage-conn regression-lineage-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#regression-lineage-tip)"/>
  <g class="regression-lineage-stage regression-lineage-s2">
    <rect class="regression-lineage-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="regression-lineage-step" x="674" y="142">03</text>
    <text class="regression-lineage-name" x="700" y="142">CI gating, 2023</text>
    <text class="regression-lineage-desc" x="674" y="166">Prompts versioned in git, regression runs on</text>
    <text class="regression-lineage-desc" x="674" y="182">every pull request.</text>
  </g>
  <text class="regression-lineage-sub" x="30" y="304">The middle step is the conceptual bridge: once you accept that a model produces a distribution rather than an answer, evaluating it becomes a sampling problem with established statistics.</text>
</svg>
