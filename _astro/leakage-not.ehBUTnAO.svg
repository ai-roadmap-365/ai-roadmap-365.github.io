<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What leakage is not</title>
  <style>
    .leakage-not-bg   { fill: #f8fafc; }
    .leakage-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .leakage-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .leakage-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .leakage-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .leakage-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .leakage-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .leakage-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .leakage-not-row { opacity: 1; }
    .leakage-not-r0 { animation-delay: 0.00s; }
    .leakage-not-r1 { animation-delay: 0.45s; }
    .leakage-not-r2 { animation-delay: 0.90s; }
    .leakage-not-r3 { animation-delay: 1.35s; }
    .leakage-not-r4 { animation-delay: 1.80s; }
    .leakage-not-row { animation: leakage-not-reveal 7.3s ease-in-out infinite; }
    @keyframes leakage-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="leakage-not-bg" width="980" height="390"/>
  <text class="leakage-not-h1"  x="30" y="40">What leakage is not</text>
  <text class="leakage-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="leakage-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="leakage-not-name" x="46" y="122">The misconception</text>
  <text class="leakage-not-desc" x="46" y="142">Commonly held.</text>
  <text class="leakage-not-desc leakage-not-row leakage-not-r0" x="46" y="182">It only affects careless work</text>
  <text class="leakage-not-desc leakage-not-row leakage-not-r1" x="46" y="216">A high score means the model is good</text>
  <text class="leakage-not-desc leakage-not-row leakage-not-r2" x="46" y="250">Cross-validation catches it</text>
  <text class="leakage-not-desc leakage-not-row leakage-not-r3" x="46" y="284">It is obvious when it happens</text>
  <text class="leakage-not-desc leakage-not-row leakage-not-r4" x="46" y="318">It only matters in research</text>
  <rect class="leakage-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="leakage-not-name" x="526" y="122">What is true</text>
  <text class="leakage-not-desc" x="526" y="142">Actually.</text>
  <text class="leakage-not-desc leakage-not-row leakage-not-r0" x="526" y="182">It affects careful work most, because it is subtle</text>
  <text class="leakage-not-desc leakage-not-row leakage-not-r1" x="526" y="216">An implausibly high score is a warning sign</text>
  <text class="leakage-not-desc leakage-not-row leakage-not-r2" x="526" y="250">It is present in every fold equally</text>
  <text class="leakage-not-desc leakage-not-row leakage-not-r3" x="526" y="284">Most cases are found only in production</text>
  <text class="leakage-not-desc leakage-not-row leakage-not-r4" x="526" y="318">It is a production failure above all</text>
  <text class="leakage-not-sub" x="30" y="372">Cross-validation not catching it is the crucial point: the leak is in the data or the pipeline, so rotating folds reproduces it faithfully every time.</text>
</svg>
