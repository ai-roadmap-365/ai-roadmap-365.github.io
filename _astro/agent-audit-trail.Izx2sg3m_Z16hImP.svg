<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Log the whole turn, every time.">
  <title>An agent you cannot replay cannot be debugged</title>
  <style>
    .agent-audit-trail-bg   { fill: #f8fafc; }
    .agent-audit-trail-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-audit-trail-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-audit-trail-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-audit-trail-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-audit-trail-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-audit-trail-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .agent-audit-trail-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .agent-audit-trail-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .agent-audit-trail-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .agent-audit-trail-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .agent-audit-trail-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .agent-audit-trail-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .agent-audit-trail-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .agent-audit-trail-stage { opacity: 1; }

    .agent-audit-trail-s0 { animation-delay: 0.00s; }
    .agent-audit-trail-e0 { animation-delay: 0.00s; }
    .agent-audit-trail-s1 { animation-delay: 1.28s; }
    .agent-audit-trail-e1 { animation-delay: 1.28s; }
    .agent-audit-trail-s2 { animation-delay: 2.56s; }
    .agent-audit-trail-e2 { animation-delay: 2.56s; }
    .agent-audit-trail-s3 { animation-delay: 3.84s; }
    .agent-audit-trail-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .agent-audit-trail-conn  { animation: agent-audit-trail-trace 6.4s ease-in-out infinite; }
      .agent-audit-trail-stage { animation: agent-audit-trail-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes agent-audit-trail-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes agent-audit-trail-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .agent-audit-trail-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .agent-audit-trail-stage { animation: agent-audit-trail-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes agent-audit-trail-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="agent-audit-trail-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="agent-audit-trail-bg" width="980" height="322"/>
  <text class="agent-audit-trail-h1"  x="30" y="40">An agent you cannot replay cannot be debugged</text>
  <text class="agent-audit-trail-sub" x="30" y="64">Log the whole turn, every time.</text>
  <g class="agent-audit-trail-stage agent-audit-trail-s0">
    <rect class="agent-audit-trail-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="agent-audit-trail-step" x="44" y="142">01</text>
    <text class="agent-audit-trail-name" x="70" y="142">The prompt as sent</text>
    <text class="agent-audit-trail-desc" x="44" y="166">Including the assembled context.</text>
    <text class="agent-audit-trail-desc" x="44" y="182">Not the template — the actual</text>
    <text class="agent-audit-trail-desc" x="44" y="198">text.</text>
  </g>
  <line class="agent-audit-trail-line agent-audit-trail-conn agent-audit-trail-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#agent-audit-trail-tip)"/>
  <g class="agent-audit-trail-stage agent-audit-trail-s1">
    <rect class="agent-audit-trail-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="agent-audit-trail-step" x="280" y="142">02</text>
    <text class="agent-audit-trail-name" x="306" y="142">The proposed call</text>
    <text class="agent-audit-trail-desc" x="280" y="166">Tool and arguments, before</text>
    <text class="agent-audit-trail-desc" x="280" y="182">validation, so rejections are</text>
    <text class="agent-audit-trail-desc" x="280" y="198">visible too.</text>
    <text class="agent-audit-trail-edge" x="280" y="242">proposed</text>
  </g>
  <line class="agent-audit-trail-line agent-audit-trail-conn agent-audit-trail-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#agent-audit-trail-tip)"/>
  <g class="agent-audit-trail-stage agent-audit-trail-s2">
    <rect class="agent-audit-trail-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="agent-audit-trail-step" x="516" y="142">03</text>
    <text class="agent-audit-trail-name" x="542" y="142">The tool result</text>
    <text class="agent-audit-trail-desc" x="516" y="166">What came back, truncated</text>
    <text class="agent-audit-trail-desc" x="516" y="182">sensibly, with its source.</text>
  </g>
  <line class="agent-audit-trail-line agent-audit-trail-conn agent-audit-trail-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#agent-audit-trail-tip)"/>
  <g class="agent-audit-trail-stage agent-audit-trail-s3">
    <rect class="agent-audit-trail-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="agent-audit-trail-step" x="752" y="142">04</text>
    <text class="agent-audit-trail-name" x="778" y="142">Tokens, latency, outcome</text>
    <text class="agent-audit-trail-desc" x="752" y="166">Per turn. This is what makes</text>
    <text class="agent-audit-trail-desc" x="752" y="182">cost attributable.</text>
    <text class="agent-audit-trail-edge" x="752" y="242">per turn</text>
  </g>
  <text class="agent-audit-trail-sub" x="30" y="304">Agent failures are rarely reproducible on demand: the interesting ones depend on a particular tool result at a particular moment. A replayable log is the only practical way to investigate them.</text>
</svg>
