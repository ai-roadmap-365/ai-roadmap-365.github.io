<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are engineering.">
  <title>Four consequences of provenance requirements</title>
  <style>
    .compliance-implications-bg   { fill: #f8fafc; }
    .compliance-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compliance-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compliance-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compliance-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compliance-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compliance-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .compliance-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .compliance-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .compliance-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .compliance-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .compliance-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .compliance-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .compliance-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .compliance-implications-stage { opacity: 1; }

    .compliance-implications-s0 { animation-delay: 0.00s; }
    .compliance-implications-e0 { animation-delay: 0.00s; }
    .compliance-implications-s1 { animation-delay: 1.28s; }
    .compliance-implications-e1 { animation-delay: 1.28s; }
    .compliance-implications-s2 { animation-delay: 2.56s; }
    .compliance-implications-e2 { animation-delay: 2.56s; }
    .compliance-implications-s3 { animation-delay: 3.84s; }
    .compliance-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .compliance-implications-conn  { animation: compliance-implications-trace 6.4s ease-in-out infinite; }
      .compliance-implications-stage { animation: compliance-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes compliance-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes compliance-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .compliance-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .compliance-implications-stage { animation: compliance-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes compliance-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="compliance-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="compliance-implications-bg" width="980" height="322"/>
  <text class="compliance-implications-h1"  x="30" y="40">Four consequences of provenance requirements</text>
  <text class="compliance-implications-sub" x="30" y="64">Two are engineering.</text>
  <g class="compliance-implications-stage compliance-implications-s0">
    <rect class="compliance-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="compliance-implications-step" x="44" y="142">01</text>
    <text class="compliance-implications-name" x="70" y="142">Disclosure is becoming legally required</text>
    <text class="compliance-implications-desc" x="44" y="166">In several jurisdictions, with</text>
    <text class="compliance-implications-desc" x="44" y="182">more following.</text>
  </g>
  <line class="compliance-implications-line compliance-implications-conn compliance-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#compliance-implications-tip)"/>
  <g class="compliance-implications-stage compliance-implications-s1">
    <rect class="compliance-implications-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="compliance-implications-step" x="280" y="142">02</text>
    <text class="compliance-implications-name" x="306" y="142">Which means signing at generation time</text>
    <text class="compliance-implications-desc" x="280" y="166">Not as a later batch process.</text>
  </g>
  <line class="compliance-implications-line compliance-implications-conn compliance-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#compliance-implications-tip)"/>
  <g class="compliance-implications-stage compliance-implications-s2">
    <rect class="compliance-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="compliance-implications-step" x="516" y="142">03</text>
    <text class="compliance-implications-name" x="542" y="142">And signing keys must be protected</text>
    <text class="compliance-implications-desc" x="516" y="166">A leaked key lets anyone forge</text>
    <text class="compliance-implications-desc" x="516" y="182">your provenance.</text>
  </g>
  <line class="compliance-implications-line compliance-implications-conn compliance-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#compliance-implications-tip)"/>
  <g class="compliance-implications-stage compliance-implications-s3">
    <rect class="compliance-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="compliance-implications-step" x="752" y="142">04</text>
    <text class="compliance-implications-name" x="778" y="142">While platforms routinely strip metadata</text>
    <text class="compliance-implications-desc" x="752" y="166">So watermarking is needed</text>
    <text class="compliance-implications-desc" x="752" y="182">alongside it.</text>
  </g>
  <text class="compliance-implications-sub" x="30" y="304">Key custody is the part usually underestimated: provenance signing is a code-signing problem, and it needs the same protection code signing gets.</text>
</svg>
