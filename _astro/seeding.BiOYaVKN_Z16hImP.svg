<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four sources, all needing a seed.">
  <title>Where randomness enters</title>
  <style>
    .seeding-bg   { fill: #f8fafc; }
    .seeding-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .seeding-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .seeding-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .seeding-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .seeding-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .seeding-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .seeding-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .seeding-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .seeding-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .seeding-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .seeding-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .seeding-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .seeding-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .seeding-stage { opacity: 1; }

    .seeding-s0 { animation-delay: 0.00s; }
    .seeding-e0 { animation-delay: 0.00s; }
    .seeding-s1 { animation-delay: 1.28s; }
    .seeding-e1 { animation-delay: 1.28s; }
    .seeding-s2 { animation-delay: 2.56s; }
    .seeding-e2 { animation-delay: 2.56s; }
    .seeding-s3 { animation-delay: 3.84s; }
    .seeding-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .seeding-conn  { animation: seeding-trace 6.4s ease-in-out infinite; }
      .seeding-stage { animation: seeding-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes seeding-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes seeding-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .seeding-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .seeding-stage { animation: seeding-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes seeding-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="seeding-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="seeding-bg" width="980" height="322"/>
  <text class="seeding-h1"  x="30" y="40">Where randomness enters</text>
  <text class="seeding-sub" x="30" y="64">Four sources, all needing a seed.</text>
  <g class="seeding-stage seeding-s0">
    <rect class="seeding-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="seeding-step" x="44" y="142">01</text>
    <text class="seeding-name" x="70" y="142">Weight initialisation</text>
    <text class="seeding-desc" x="44" y="166">The framework's generator.</text>
  </g>
  <line class="seeding-line seeding-conn seeding-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#seeding-tip)"/>
  <g class="seeding-stage seeding-s1">
    <rect class="seeding-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="seeding-step" x="280" y="142">02</text>
    <text class="seeding-name" x="306" y="142">Data shuffling and sampling</text>
    <text class="seeding-desc" x="280" y="166">Often a different generator, and</text>
    <text class="seeding-desc" x="280" y="182">per worker process.</text>
  </g>
  <line class="seeding-line seeding-conn seeding-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#seeding-tip)"/>
  <g class="seeding-stage seeding-s2">
    <rect class="seeding-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="seeding-step" x="516" y="142">03</text>
    <text class="seeding-name" x="542" y="142">Augmentation</text>
    <text class="seeding-desc" x="516" y="166">Which may use yet another</text>
    <text class="seeding-desc" x="516" y="182">library's generator.</text>
  </g>
  <line class="seeding-line seeding-conn seeding-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#seeding-tip)"/>
  <g class="seeding-stage seeding-s3">
    <rect class="seeding-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="seeding-step" x="752" y="142">04</text>
    <text class="seeding-name" x="778" y="142">Accelerator kernels</text>
    <text class="seeding-desc" x="752" y="166">Some are non-deterministic by</text>
    <text class="seeding-desc" x="752" y="182">default. Determinism costs</text>
    <text class="seeding-desc" x="752" y="198">speed.</text>
  </g>
  <text class="seeding-sub" x="30" y="304">The fourth source is the one people meet last: even with every seed set, some accelerated operations produce different results run to run unless determinism is explicitly requested.</text>
</svg>
