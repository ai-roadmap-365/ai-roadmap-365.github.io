<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Throughput, memory, evaluation and deployment.">
  <title>Four bottlenecks the harness removes</title>
  <style>
    .harness-bottlenecks-bg   { fill: #f8fafc; }
    .harness-bottlenecks-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-bottlenecks-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-bottlenecks-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-bottlenecks-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-bottlenecks-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-bottlenecks-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .harness-bottlenecks-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .harness-bottlenecks-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .harness-bottlenecks-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .harness-bottlenecks-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .harness-bottlenecks-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .harness-bottlenecks-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .harness-bottlenecks-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .harness-bottlenecks-stage { opacity: 1; }

    .harness-bottlenecks-s0 { animation-delay: 0.00s; }
    .harness-bottlenecks-e0 { animation-delay: 0.00s; }
    .harness-bottlenecks-s1 { animation-delay: 1.28s; }
    .harness-bottlenecks-e1 { animation-delay: 1.28s; }
    .harness-bottlenecks-s2 { animation-delay: 2.56s; }
    .harness-bottlenecks-e2 { animation-delay: 2.56s; }
    .harness-bottlenecks-s3 { animation-delay: 3.84s; }
    .harness-bottlenecks-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .harness-bottlenecks-conn  { animation: harness-bottlenecks-trace 6.4s ease-in-out infinite; }
      .harness-bottlenecks-stage { animation: harness-bottlenecks-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes harness-bottlenecks-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes harness-bottlenecks-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .harness-bottlenecks-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .harness-bottlenecks-stage { animation: harness-bottlenecks-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes harness-bottlenecks-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="harness-bottlenecks-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="harness-bottlenecks-bg" width="980" height="322"/>
  <text class="harness-bottlenecks-h1"  x="30" y="40">Four bottlenecks the harness removes</text>
  <text class="harness-bottlenecks-sub" x="30" y="64">Throughput, memory, evaluation and deployment.</text>
  <g class="harness-bottlenecks-stage harness-bottlenecks-s0">
    <rect class="harness-bottlenecks-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="harness-bottlenecks-step" x="44" y="142">01</text>
    <text class="harness-bottlenecks-name" x="70" y="142">Accelerator starvation</text>
    <text class="harness-bottlenecks-desc" x="44" y="166">Workers and prefetching keep</text>
    <text class="harness-bottlenecks-desc" x="44" y="182">utilisation high.</text>
  </g>
  <line class="harness-bottlenecks-line harness-bottlenecks-conn harness-bottlenecks-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#harness-bottlenecks-tip)"/>
  <g class="harness-bottlenecks-stage harness-bottlenecks-s1">
    <rect class="harness-bottlenecks-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="harness-bottlenecks-step" x="280" y="142">02</text>
    <text class="harness-bottlenecks-name" x="306" y="142">Memory limits</text>
    <text class="harness-bottlenecks-desc" x="280" y="166">Mixed precision and accumulation</text>
    <text class="harness-bottlenecks-desc" x="280" y="182">decouple batch size from</text>
    <text class="harness-bottlenecks-desc" x="280" y="198">hardware.</text>
  </g>
  <line class="harness-bottlenecks-line harness-bottlenecks-conn harness-bottlenecks-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#harness-bottlenecks-tip)"/>
  <g class="harness-bottlenecks-stage harness-bottlenecks-s2">
    <rect class="harness-bottlenecks-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="harness-bottlenecks-step" x="516" y="142">03</text>
    <text class="harness-bottlenecks-name" x="542" y="142">Optimistic evaluation</text>
    <text class="harness-bottlenecks-desc" x="516" y="166">Class-balanced metrics and a</text>
    <text class="harness-bottlenecks-desc" x="516" y="182">confusion matrix, not overall</text>
    <text class="harness-bottlenecks-desc" x="516" y="198">accuracy alone.</text>
  </g>
  <line class="harness-bottlenecks-line harness-bottlenecks-conn harness-bottlenecks-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#harness-bottlenecks-tip)"/>
  <g class="harness-bottlenecks-stage harness-bottlenecks-s3">
    <rect class="harness-bottlenecks-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="harness-bottlenecks-step" x="752" y="142">04</text>
    <text class="harness-bottlenecks-name" x="778" y="142">Deployment as an afterthought</text>
    <text class="harness-bottlenecks-desc" x="752" y="166">Export tested during development</text>
    <text class="harness-bottlenecks-desc" x="752" y="182">rather than discovered at the</text>
    <text class="harness-bottlenecks-desc" x="752" y="198">end.</text>
  </g>
  <text class="harness-bottlenecks-sub" x="30" y="304">The third is worth insisting on: overall accuracy on an imbalanced dataset can be high while an entire minority class is never predicted correctly, and only a per-class view shows it.</text>
</svg>
