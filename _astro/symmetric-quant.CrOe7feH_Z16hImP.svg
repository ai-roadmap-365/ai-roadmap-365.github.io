<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The quantisation arithmetic</title>
  <style>
    .symmetric-quant-bg   { fill: #f8fafc; }
    .symmetric-quant-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .symmetric-quant-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .symmetric-quant-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .symmetric-quant-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .symmetric-quant-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .symmetric-quant-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .symmetric-quant-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .symmetric-quant-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .symmetric-quant-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .symmetric-quant-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .symmetric-quant-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .symmetric-quant-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .symmetric-quant-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .symmetric-quant-stage { opacity: 1; }

    .symmetric-quant-s0 { animation-delay: 0.00s; }
    .symmetric-quant-e0 { animation-delay: 0.00s; }
    .symmetric-quant-s1 { animation-delay: 1.28s; }
    .symmetric-quant-e1 { animation-delay: 1.28s; }
    .symmetric-quant-s2 { animation-delay: 2.56s; }
    .symmetric-quant-e2 { animation-delay: 2.56s; }
    .symmetric-quant-s3 { animation-delay: 3.84s; }
    .symmetric-quant-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .symmetric-quant-conn  { animation: symmetric-quant-trace 6.4s ease-in-out infinite; }
      .symmetric-quant-stage { animation: symmetric-quant-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes symmetric-quant-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes symmetric-quant-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .symmetric-quant-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .symmetric-quant-stage { animation: symmetric-quant-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes symmetric-quant-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="symmetric-quant-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="symmetric-quant-bg" width="980" height="322"/>
  <text class="symmetric-quant-h1"  x="30" y="40">The quantisation arithmetic</text>
  <text class="symmetric-quant-sub" x="30" y="64">Four steps.</text>
  <g class="symmetric-quant-stage symmetric-quant-s0">
    <rect class="symmetric-quant-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="symmetric-quant-step" x="44" y="142">01</text>
    <text class="symmetric-quant-name" x="70" y="142">Take the largest magnitude in the block</text>
    <text class="symmetric-quant-desc" x="44" y="166">Which sets the range to be</text>
    <text class="symmetric-quant-desc" x="44" y="182">represented.</text>
  </g>
  <line class="symmetric-quant-line symmetric-quant-conn symmetric-quant-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#symmetric-quant-tip)"/>
  <g class="symmetric-quant-stage symmetric-quant-s1">
    <rect class="symmetric-quant-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="symmetric-quant-step" x="280" y="142">02</text>
    <text class="symmetric-quant-name" x="306" y="142">Divide by the largest representable integer</text>
    <text class="symmetric-quant-desc" x="280" y="166">Giving a scale factor for the</text>
    <text class="symmetric-quant-desc" x="280" y="182">block.</text>
  </g>
  <line class="symmetric-quant-line symmetric-quant-conn symmetric-quant-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#symmetric-quant-tip)"/>
  <g class="symmetric-quant-stage symmetric-quant-s2">
    <rect class="symmetric-quant-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="symmetric-quant-step" x="516" y="142">03</text>
    <text class="symmetric-quant-name" x="542" y="142">Divide each weight by it, and round</text>
    <text class="symmetric-quant-desc" x="516" y="166">The rounding is where the loss</text>
    <text class="symmetric-quant-desc" x="516" y="182">happens.</text>
  </g>
  <line class="symmetric-quant-line symmetric-quant-conn symmetric-quant-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#symmetric-quant-tip)"/>
  <g class="symmetric-quant-stage symmetric-quant-s3">
    <rect class="symmetric-quant-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="symmetric-quant-step" x="752" y="142">04</text>
    <text class="symmetric-quant-name" x="778" y="142">Multiply back when computing</text>
    <text class="symmetric-quant-desc" x="752" y="166">Recovering an approximation of</text>
    <text class="symmetric-quant-desc" x="752" y="182">the original.</text>
  </g>
  <text class="symmetric-quant-sub" x="30" y="304">The loss is entirely in the rounding step, which is why block size matters: a smaller block means a tighter range and less rounding error per weight.</text>
</svg>
