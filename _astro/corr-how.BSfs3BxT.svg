<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>Reading a relationship</title>
  <style>
    .corr-how-bg   { fill: #f8fafc; }
    .corr-how-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .corr-how-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .corr-how-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .corr-how-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .corr-how-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .corr-how-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .corr-how-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .corr-how-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .corr-how-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .corr-how-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .corr-how-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .corr-how-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .corr-how-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .corr-how-stage { opacity: 1; }

    .corr-how-s0 { animation-delay: 0.00s; }
    .corr-how-e0 { animation-delay: 0.00s; }
    .corr-how-s1 { animation-delay: 1.28s; }
    .corr-how-e1 { animation-delay: 1.28s; }
    .corr-how-s2 { animation-delay: 2.56s; }
    .corr-how-e2 { animation-delay: 2.56s; }
    .corr-how-s3 { animation-delay: 3.84s; }
    .corr-how-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .corr-how-conn  { animation: corr-how-trace 6.4s ease-in-out infinite; }
      .corr-how-stage { animation: corr-how-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes corr-how-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes corr-how-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .corr-how-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .corr-how-stage { animation: corr-how-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes corr-how-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="corr-how-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="corr-how-bg" width="980" height="322"/>
  <text class="corr-how-h1"  x="30" y="40">Reading a relationship</text>
  <text class="corr-how-sub" x="30" y="64">Four properties.</text>
  <g class="corr-how-stage corr-how-s0">
    <rect class="corr-how-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="corr-how-step" x="44" y="142">01</text>
    <text class="corr-how-name" x="70" y="142">Direction: do they rise together, or oppose?</text>
    <text class="corr-how-desc" x="44" y="166">The sign.</text>
  </g>
  <line class="corr-how-line corr-how-conn corr-how-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#corr-how-tip)"/>
  <g class="corr-how-stage corr-how-s1">
    <rect class="corr-how-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="corr-how-step" x="280" y="142">02</text>
    <text class="corr-how-name" x="306" y="142">Form: straight, curved, or stepped?</text>
    <text class="corr-how-desc" x="280" y="166">Which decides what statistic</text>
    <text class="corr-how-desc" x="280" y="182">applies.</text>
  </g>
  <line class="corr-how-line corr-how-conn corr-how-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#corr-how-tip)"/>
  <g class="corr-how-stage corr-how-s2">
    <rect class="corr-how-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="corr-how-step" x="516" y="142">03</text>
    <text class="corr-how-name" x="542" y="142">Strength: how tightly do points follow it?</text>
    <text class="corr-how-desc" x="516" y="166">The scatter around the form.</text>
  </g>
  <line class="corr-how-line corr-how-conn corr-how-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#corr-how-tip)"/>
  <g class="corr-how-stage corr-how-s3">
    <rect class="corr-how-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="corr-how-step" x="752" y="142">04</text>
    <text class="corr-how-name" x="778" y="142">And outliers, which can create or destroy it</text>
    <text class="corr-how-desc" x="752" y="166">A single point can dominate.</text>
  </g>
  <text class="corr-how-sub" x="30" y="304">A correlation coefficient summarises only the linear part, which is why a curved relationship can produce a near-zero correlation and a strong pattern.</text>
</svg>
