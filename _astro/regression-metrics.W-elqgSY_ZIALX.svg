<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By what they punish.">
  <title>Four regression metrics</title>
  <style>
    .regression-metrics-bg   { fill: #f8fafc; }
    .regression-metrics-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regression-metrics-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regression-metrics-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regression-metrics-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regression-metrics-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .regression-metrics-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .regression-metrics-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .regression-metrics-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .regression-metrics-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .regression-metrics-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .regression-metrics-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .regression-metrics-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .regression-metrics-row { opacity: 1; }
    .regression-metrics-r0 { animation-delay: 0.00s; }
    .regression-metrics-r1 { animation-delay: 0.45s; }
    .regression-metrics-r2 { animation-delay: 0.90s; }
    .regression-metrics-r3 { animation-delay: 1.35s; }
    .regression-metrics-r4 { animation-delay: 1.80s; }
    .regression-metrics-row { animation: regression-metrics-reveal 7.3s ease-in-out infinite; }
    @keyframes regression-metrics-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="regression-metrics-bg" width="980" height="390"/>
  <text class="regression-metrics-h1"  x="30" y="40">Four regression metrics</text>
  <text class="regression-metrics-sub" x="30" y="64">By what they punish.</text>
  <rect class="regression-metrics-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="regression-metrics-name" x="46" y="122">The metric</text>
  <text class="regression-metrics-desc" x="46" y="142">What it measures.</text>
  <text class="regression-metrics-desc regression-metrics-row regression-metrics-r0" x="46" y="182">Mean squared error — average squared gap</text>
  <text class="regression-metrics-desc regression-metrics-row regression-metrics-r1" x="46" y="216">Root mean squared error — the same, in original units</text>
  <text class="regression-metrics-desc regression-metrics-row regression-metrics-r2" x="46" y="250">Mean absolute error — average gap</text>
  <text class="regression-metrics-desc regression-metrics-row regression-metrics-r3" x="46" y="284">Mean absolute percentage error — relative gap</text>
  <text class="regression-metrics-desc regression-metrics-row regression-metrics-r4" x="46" y="318">R-squared — variance explained</text>
  <rect class="regression-metrics-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="regression-metrics-name" x="526" y="122">What it emphasises</text>
  <text class="regression-metrics-desc" x="526" y="142">And its catch.</text>
  <text class="regression-metrics-desc regression-metrics-row regression-metrics-r0" x="526" y="182">Punishes large errors heavily</text>
  <text class="regression-metrics-desc regression-metrics-row regression-metrics-r1" x="526" y="216">Readable, still outlier-sensitive</text>
  <text class="regression-metrics-desc regression-metrics-row regression-metrics-r2" x="526" y="250">Treats all errors equally; robust</text>
  <text class="regression-metrics-desc regression-metrics-row regression-metrics-r3" x="526" y="284">Breaks near zero; asymmetric</text>
  <text class="regression-metrics-desc regression-metrics-row regression-metrics-r4" x="526" y="318">Comparable across problems; hides scale</text>
  <text class="regression-metrics-sub" x="30" y="372">The percentage metric breaking near zero is a real trap for demand or count forecasting, where actual values legitimately reach zero and the metric becomes infinite.</text>
</svg>
