<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Frustrated users, and disabled rails.">
  <title>The cost of over-blocking</title>
  <style>
    .false-positives-bg   { fill: #f8fafc; }
    .false-positives-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .false-positives-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .false-positives-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .false-positives-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .false-positives-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .false-positives-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .false-positives-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .false-positives-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .false-positives-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .false-positives-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .false-positives-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .false-positives-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .false-positives-row { opacity: 1; }
    .false-positives-r0 { animation-delay: 0.00s; }
    .false-positives-r1 { animation-delay: 0.45s; }
    .false-positives-r2 { animation-delay: 0.90s; }
    .false-positives-r3 { animation-delay: 1.35s; }
    .false-positives-r4 { animation-delay: 1.80s; }
    .false-positives-row { animation: false-positives-reveal 7.3s ease-in-out infinite; }
    @keyframes false-positives-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="false-positives-bg" width="980" height="390"/>
  <text class="false-positives-h1"  x="30" y="40">The cost of over-blocking</text>
  <text class="false-positives-sub" x="30" y="64">Frustrated users, and disabled rails.</text>
  <rect class="false-positives-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="false-positives-name" x="46" y="122">Over-blocking</text>
  <text class="false-positives-desc" x="46" y="142">Legitimate users refused.</text>
  <text class="false-positives-desc false-positives-row false-positives-r0" x="46" y="182">"How do I change my security settings?"</text>
  <text class="false-positives-desc false-positives-row false-positives-r1" x="46" y="216">Blocked because it matched "security"</text>
  <text class="false-positives-desc false-positives-row false-positives-r2" x="46" y="250">The user concludes the product is broken</text>
  <text class="false-positives-desc false-positives-row false-positives-r3" x="46" y="284">Support tickets rise</text>
  <text class="false-positives-desc false-positives-row false-positives-r4" x="46" y="318">And someone loosens the rail entirely</text>
  <rect class="false-positives-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="false-positives-name" x="526" y="122">Precisely scoped</text>
  <text class="false-positives-desc" x="526" y="142">Specific patterns and semantics.</text>
  <text class="false-positives-desc false-positives-row false-positives-r0" x="526" y="182">Specific phrase matching</text>
  <text class="false-positives-desc false-positives-row false-positives-r1" x="526" y="216">Semantic classifiers for ambiguity</text>
  <text class="false-positives-desc false-positives-row false-positives-r2" x="526" y="250">False rejection rate measured</text>
  <text class="false-positives-desc false-positives-row false-positives-r3" x="526" y="284">Latency kept under 2 ms</text>
  <text class="false-positives-desc false-positives-row false-positives-r4" x="526" y="318">And the rail stays enabled</text>
  <text class="false-positives-sub" x="30" y="372">Measuring the false rejection rate is what keeps this honest: an unmeasured rail is tuned by whoever complains loudest, and the usual resolution is to weaken it until nobody does.</text>
</svg>
