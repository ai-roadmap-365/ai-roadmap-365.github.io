<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Layers, not one stroke.">
  <title>A drafting table</title>
  <style>
    .drawing-tools-bg   { fill: #f8fafc; }
    .drawing-tools-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drawing-tools-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drawing-tools-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drawing-tools-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drawing-tools-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drawing-tools-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .drawing-tools-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .drawing-tools-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .drawing-tools-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .drawing-tools-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .drawing-tools-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .drawing-tools-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .drawing-tools-row { opacity: 1; }
    .drawing-tools-r0 { animation-delay: 0.00s; }
    .drawing-tools-r1 { animation-delay: 0.45s; }
    .drawing-tools-r2 { animation-delay: 0.90s; }
    .drawing-tools-r3 { animation-delay: 1.35s; }
    .drawing-tools-r4 { animation-delay: 1.80s; }
    .drawing-tools-row { animation: drawing-tools-reveal 7.3s ease-in-out infinite; }
    @keyframes drawing-tools-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="drawing-tools-bg" width="980" height="390"/>
  <text class="drawing-tools-h1"  x="30" y="40">A drafting table</text>
  <text class="drawing-tools-sub" x="30" y="64">Layers, not one stroke.</text>
  <rect class="drawing-tools-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="drawing-tools-name" x="46" y="122">Layered</text>
  <text class="drawing-tools-desc" x="46" y="142">Composable.</text>
  <text class="drawing-tools-desc drawing-tools-row drawing-tools-r0" x="46" y="182">Draw the axes, then the data, then the labels</text>
  <text class="drawing-tools-desc drawing-tools-row drawing-tools-r1" x="46" y="216">Adjust any layer independently</text>
  <text class="drawing-tools-desc drawing-tools-row drawing-tools-r2" x="46" y="250">Combine several panels</text>
  <text class="drawing-tools-desc drawing-tools-row drawing-tools-r3" x="46" y="284">Anything can be customised</text>
  <text class="drawing-tools-desc drawing-tools-row drawing-tools-r4" x="46" y="318">This is the explicit interface</text>
  <rect class="drawing-tools-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="drawing-tools-name" x="526" y="122">A fixed template</text>
  <text class="drawing-tools-desc" x="526" y="142">Take it or leave it.</text>
  <text class="drawing-tools-desc drawing-tools-row drawing-tools-r0" x="526" y="182">One command produces a whole chart</text>
  <text class="drawing-tools-desc drawing-tools-row drawing-tools-r1" x="526" y="216">Adjustment means starting over</text>
  <text class="drawing-tools-desc drawing-tools-row drawing-tools-r2" x="526" y="250">Panels are awkward</text>
  <text class="drawing-tools-desc drawing-tools-row drawing-tools-r3" x="526" y="284">Only what the template exposes</text>
  <text class="drawing-tools-desc drawing-tools-row drawing-tools-r4" x="526" y="318">This is a convenience wrapper</text>
  <text class="drawing-tools-sub" x="30" y="372">Wrappers are excellent for the common case and frustrating for anything else, which is why knowing the layer underneath them remains worthwhile.</text>
</svg>
