<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Held open, or not.">
  <title>A conversation with a specialist</title>
  <style>
    .phone-call-bg   { fill: #f8fafc; }
    .phone-call-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .phone-call-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .phone-call-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .phone-call-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .phone-call-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .phone-call-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .phone-call-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .phone-call-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .phone-call-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .phone-call-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .phone-call-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .phone-call-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .phone-call-row { opacity: 1; }
    .phone-call-r0 { animation-delay: 0.00s; }
    .phone-call-r1 { animation-delay: 0.45s; }
    .phone-call-r2 { animation-delay: 0.90s; }
    .phone-call-r3 { animation-delay: 1.35s; }
    .phone-call-r4 { animation-delay: 1.80s; }
    .phone-call-row { animation: phone-call-reveal 7.3s ease-in-out infinite; }
    @keyframes phone-call-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="phone-call-bg" width="980" height="390"/>
  <text class="phone-call-h1"  x="30" y="40">A conversation with a specialist</text>
  <text class="phone-call-sub" x="30" y="64">Held open, or not.</text>
  <rect class="phone-call-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="phone-call-name" x="46" y="122">One conversation</text>
  <text class="phone-call-desc" x="46" y="142">Efficient.</text>
  <text class="phone-call-desc phone-call-row phone-call-r0" x="46" y="182">Connect once</text>
  <text class="phone-call-desc phone-call-row phone-call-r1" x="46" y="216">Ask several questions</text>
  <text class="phone-call-desc phone-call-row phone-call-r2" x="46" y="250">Context is retained between them</text>
  <text class="phone-call-desc phone-call-row phone-call-r3" x="46" y="284">Hang up when finished</text>
  <text class="phone-call-desc phone-call-row phone-call-r4" x="46" y="318">This is a connection</text>
  <rect class="phone-call-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="phone-call-name" x="526" y="122">One call per question</text>
  <text class="phone-call-desc" x="526" y="142">Wasteful.</text>
  <text class="phone-call-desc phone-call-row phone-call-r0" x="526" y="182">Dial for every question</text>
  <text class="phone-call-desc phone-call-row phone-call-r1" x="526" y="216">Re-establish who you are each time</text>
  <text class="phone-call-desc phone-call-row phone-call-r2" x="526" y="250">No shared context</text>
  <text class="phone-call-desc phone-call-row phone-call-r3" x="526" y="284">Most of the time is setup</text>
  <text class="phone-call-desc phone-call-row phone-call-r4" x="526" y="318">This is connecting per query</text>
  <text class="phone-call-sub" x="30" y="372">Most of the time being setup is literally true for network databases, where connection establishment can cost more than the query it carries.</text>
</svg>
