<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Retry one, never the other.">
  <title>Two kinds of failure</title>
  <style>
    .error-taxonomy-bg   { fill: #f8fafc; }
    .error-taxonomy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .error-taxonomy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .error-taxonomy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .error-taxonomy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .error-taxonomy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .error-taxonomy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .error-taxonomy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .error-taxonomy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .error-taxonomy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .error-taxonomy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .error-taxonomy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .error-taxonomy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .error-taxonomy-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .error-taxonomy-stage { opacity: 1; }

    .error-taxonomy-s0 { animation-delay: 0.00s; }
    .error-taxonomy-e0 { animation-delay: 0.00s; }
    .error-taxonomy-s1 { animation-delay: 1.28s; }
    .error-taxonomy-e1 { animation-delay: 1.28s; }
    .error-taxonomy-s2 { animation-delay: 2.56s; }
    .error-taxonomy-e2 { animation-delay: 2.56s; }
    .error-taxonomy-s3 { animation-delay: 3.84s; }
    .error-taxonomy-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .error-taxonomy-conn  { animation: error-taxonomy-trace 6.4s ease-in-out infinite; }
      .error-taxonomy-stage { animation: error-taxonomy-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes error-taxonomy-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes error-taxonomy-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .error-taxonomy-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .error-taxonomy-stage { animation: error-taxonomy-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes error-taxonomy-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="error-taxonomy-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="error-taxonomy-bg" width="980" height="322"/>
  <text class="error-taxonomy-h1"  x="30" y="40">Two kinds of failure</text>
  <text class="error-taxonomy-sub" x="30" y="64">Retry one, never the other.</text>
  <g class="error-taxonomy-stage error-taxonomy-s0">
    <rect class="error-taxonomy-good" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="error-taxonomy-step" x="44" y="142">01</text>
    <text class="error-taxonomy-name" x="70" y="142">Rate limits, timeouts and server errors</text>
    <text class="error-taxonomy-desc" x="44" y="166">Transient. The same request may</text>
    <text class="error-taxonomy-desc" x="44" y="182">succeed shortly.</text>
  </g>
  <line class="error-taxonomy-line error-taxonomy-conn error-taxonomy-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#error-taxonomy-tip)"/>
  <g class="error-taxonomy-stage error-taxonomy-s1">
    <rect class="error-taxonomy-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="error-taxonomy-step" x="280" y="142">02</text>
    <text class="error-taxonomy-name" x="306" y="142">Bad requests, bad credentials and refusals</text>
    <text class="error-taxonomy-desc" x="280" y="166">Fatal. Retrying changes nothing.</text>
  </g>
  <line class="error-taxonomy-line error-taxonomy-conn error-taxonomy-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#error-taxonomy-tip)"/>
  <g class="error-taxonomy-stage error-taxonomy-s2">
    <rect class="error-taxonomy-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="error-taxonomy-step" x="516" y="142">03</text>
    <text class="error-taxonomy-name" x="542" y="142">Classify before deciding</text>
    <text class="error-taxonomy-desc" x="516" y="166">On the status code, not on the</text>
    <text class="error-taxonomy-desc" x="516" y="182">message text.</text>
  </g>
  <line class="error-taxonomy-line error-taxonomy-conn error-taxonomy-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#error-taxonomy-tip)"/>
  <g class="error-taxonomy-stage error-taxonomy-s3">
    <rect class="error-taxonomy-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="error-taxonomy-step" x="752" y="142">04</text>
    <text class="error-taxonomy-name" x="778" y="142">Retry the first, surface the second</text>
    <text class="error-taxonomy-desc" x="752" y="166">A retried fatal error is a cost</text>
    <text class="error-taxonomy-desc" x="752" y="182">with no chance of success.</text>
  </g>
  <text class="error-taxonomy-sub" x="30" y="304">Classifying on the status code rather than the message is worth insisting on: message text changes between provider versions and will silently break a text-matching handler.</text>
</svg>
