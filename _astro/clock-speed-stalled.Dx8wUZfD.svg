<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The change that put thousands of cores in front of every AI practitioner.">
  <title>Why chips stopped getting faster and started getting wider</title>
  <style>
    .clock-speed-stalled-bg   { fill: #f8fafc; }
    .clock-speed-stalled-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clock-speed-stalled-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clock-speed-stalled-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clock-speed-stalled-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clock-speed-stalled-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clock-speed-stalled-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .clock-speed-stalled-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .clock-speed-stalled-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .clock-speed-stalled-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .clock-speed-stalled-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .clock-speed-stalled-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .clock-speed-stalled-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .clock-speed-stalled-row { opacity: 1; }
    .clock-speed-stalled-r0 { animation-delay: 0.00s; }
    .clock-speed-stalled-r1 { animation-delay: 0.45s; }
    .clock-speed-stalled-r2 { animation-delay: 0.90s; }
    .clock-speed-stalled-r3 { animation-delay: 1.35s; }
    .clock-speed-stalled-r4 { animation-delay: 1.80s; }
    .clock-speed-stalled-row { animation: clock-speed-stalled-reveal 7.3s ease-in-out infinite; }
    @keyframes clock-speed-stalled-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="clock-speed-stalled-bg" width="980" height="390"/>
  <text class="clock-speed-stalled-h1"  x="30" y="40">Why chips stopped getting faster and started getting wider</text>
  <text class="clock-speed-stalled-sub" x="30" y="64">The change that put thousands of cores in front of every AI practitioner.</text>
  <rect class="clock-speed-stalled-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="clock-speed-stalled-name" x="46" y="122">Raise the clock</text>
  <text class="clock-speed-stalled-desc" x="46" y="142">The old answer, until about 2005</text>
  <text class="clock-speed-stalled-desc clock-speed-stalled-row clock-speed-stalled-r0" x="46" y="182">Every instruction finishes sooner</text>
  <text class="clock-speed-stalled-desc clock-speed-stalled-row clock-speed-stalled-r1" x="46" y="216">No change needed to any program</text>
  <text class="clock-speed-stalled-desc clock-speed-stalled-row clock-speed-stalled-r2" x="46" y="250">Power rises faster than speed does</text>
  <text class="clock-speed-stalled-desc clock-speed-stalled-row clock-speed-stalled-r3" x="46" y="284">Heat became the hard limit</text>
  <text class="clock-speed-stalled-desc clock-speed-stalled-row clock-speed-stalled-r4" x="46" y="318">Stalled around 3-5 GHz and stayed there</text>
  <rect class="clock-speed-stalled-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="clock-speed-stalled-name" x="526" y="122">Add cores</text>
  <text class="clock-speed-stalled-desc" x="526" y="142">The answer since</text>
  <text class="clock-speed-stalled-desc clock-speed-stalled-row clock-speed-stalled-r0" x="526" y="182">More work in flight at the same clock</text>
  <text class="clock-speed-stalled-desc clock-speed-stalled-row clock-speed-stalled-r1" x="526" y="216">Only helps work that can be split</text>
  <text class="clock-speed-stalled-desc clock-speed-stalled-row clock-speed-stalled-r2" x="526" y="250">Programs must be written to use it</text>
  <text class="clock-speed-stalled-desc clock-speed-stalled-row clock-speed-stalled-r3" x="526" y="284">Led to GPUs: thousands of simple cores</text>
  <text class="clock-speed-stalled-desc clock-speed-stalled-row clock-speed-stalled-r4" x="526" y="318">Which is the shape a neural network needs</text>
  <text class="clock-speed-stalled-sub" x="30" y="372">A 3 GHz chip from 2005 and one from today run at a similar clock. Everything since has been width, not speed.</text>
</svg>
