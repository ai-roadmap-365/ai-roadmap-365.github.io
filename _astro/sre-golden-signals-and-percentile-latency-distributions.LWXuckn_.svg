<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="SRE Golden Signals and Percentile Latency Distributions">
  <title>SRE Golden Signals and Percentile Latency Distributions</title>
  <defs>
    <style>
      .d339b-bg { fill: #f8fafc; }
      .d339b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d339b-lat { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d339b-brn { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; rx: 8px; }
      .d339b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d339b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d339b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d339b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d339b-bg" />
  
  <text x="40" y="40" class="d339a-title">Percentile Latencies &amp; Error Budget Tracking</text>
  <text x="40" y="65" class="d339a-subtitle">SRE Golden Signals and Percentile Latency Distributions comparing Mean Latency against P50, P95, and P99 tail latency spikes and Error Budget Burn Rates</text>
  
  <!-- Percentile Breakdown -->
  <rect x="40" y="110" width="390" height="270" class="d339b-lat" />
  <text x="60" y="145" class="d339b-header" fill="#1d4ed8">Percentile Latency Reality (Heavy-Tailed)</text>
  <text x="60" y="180" class="d339b-text">• **Mean (Average):** 45ms (Deceptive! Looks fine)</text>
  <text x="60" y="205" class="d339b-text">• **P50 (Median):** 35ms (Fast 10-token queries)</text>
  <text x="60" y="230" class="d339b-text">• **P95 Latency:** 420ms (Prompt queue buildup)</text>
  <text x="60" y="255" class="d339b-text">• **P99 Tail Latency:** 4,800ms (Severe GPU contention!)</text>
  <text x="60" y="300" class="d339b-text" font-weight="600" fill="#1d4ed8">Percentiles Expose True Customer Experience</text>
  
  <!-- Error Budget Burn -->
  <rect x="470" y="110" width="390" height="270" class="d339b-brn" />
  <text x="490" y="145" class="d339b-header" fill="#b91c1c">Error Budget Burn Rate (99.9% SLO)</text>
  <text x="490" y="180" class="d339b-text">• **Monthly Allowed Downtime:** 43.2 minutes</text>
  <text x="490" y="205" class="d339b-text">• **1x Burn Rate:** Normal consumption over 30 days</text>
  <text x="490" y="230" class="d339b-text">• **14.4x Burn Rate:** Consumes 100% budget in 2 days!</text>
  <text x="490" y="255" class="d339b-text">• **Alert Action:** Page on-call immediately on &gt;14x burn</text>
  <text x="490" y="300" class="d339b-text" font-weight="600" fill="#b91c1c">Early Warning Prevents SLA Breach</text>
</svg>