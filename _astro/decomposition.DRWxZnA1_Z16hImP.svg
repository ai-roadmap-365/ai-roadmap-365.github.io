<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four components.">
  <title>Decomposing a series</title>
  <style>
    .decomposition-bg   { fill: #f8fafc; }
    .decomposition-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decomposition-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decomposition-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decomposition-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decomposition-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decomposition-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .decomposition-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .decomposition-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .decomposition-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .decomposition-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .decomposition-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .decomposition-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .decomposition-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .decomposition-stage { opacity: 1; }

    .decomposition-s0 { animation-delay: 0.00s; }
    .decomposition-e0 { animation-delay: 0.00s; }
    .decomposition-s1 { animation-delay: 1.28s; }
    .decomposition-e1 { animation-delay: 1.28s; }
    .decomposition-s2 { animation-delay: 2.56s; }
    .decomposition-e2 { animation-delay: 2.56s; }
    .decomposition-s3 { animation-delay: 3.84s; }
    .decomposition-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .decomposition-conn  { animation: decomposition-trace 6.4s ease-in-out infinite; }
      .decomposition-stage { animation: decomposition-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes decomposition-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes decomposition-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .decomposition-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .decomposition-stage { animation: decomposition-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes decomposition-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="decomposition-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="decomposition-bg" width="980" height="322"/>
  <text class="decomposition-h1"  x="30" y="40">Decomposing a series</text>
  <text class="decomposition-sub" x="30" y="64">Four components.</text>
  <g class="decomposition-stage decomposition-s0">
    <rect class="decomposition-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="decomposition-step" x="44" y="142">01</text>
    <text class="decomposition-name" x="70" y="142">Trend</text>
    <text class="decomposition-desc" x="44" y="166">The long-run direction, ignoring</text>
    <text class="decomposition-desc" x="44" y="182">wiggles.</text>
  </g>
  <line class="decomposition-line decomposition-conn decomposition-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#decomposition-tip)"/>
  <g class="decomposition-stage decomposition-s1">
    <rect class="decomposition-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="decomposition-step" x="280" y="142">02</text>
    <text class="decomposition-name" x="306" y="142">Seasonality</text>
    <text class="decomposition-desc" x="280" y="166">Repeating patterns at a fixed</text>
    <text class="decomposition-desc" x="280" y="182">period. Often several at once.</text>
  </g>
  <line class="decomposition-line decomposition-conn decomposition-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#decomposition-tip)"/>
  <g class="decomposition-stage decomposition-s2">
    <rect class="decomposition-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="decomposition-step" x="516" y="142">03</text>
    <text class="decomposition-name" x="542" y="142">Cyclical variation</text>
    <text class="decomposition-desc" x="516" y="166">Longer irregular swings, without</text>
    <text class="decomposition-desc" x="516" y="182">a fixed period.</text>
  </g>
  <line class="decomposition-line decomposition-conn decomposition-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#decomposition-tip)"/>
  <g class="decomposition-stage decomposition-s3">
    <rect class="decomposition-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="decomposition-step" x="752" y="142">04</text>
    <text class="decomposition-name" x="778" y="142">And the residual</text>
    <text class="decomposition-desc" x="752" y="166">What remains, which is what a</text>
    <text class="decomposition-desc" x="752" y="182">model tries to predict.</text>
  </g>
  <text class="decomposition-sub" x="30" y="304">Several seasonalities at once is the normal case in business data — hourly, weekly and annual together — and modelling only one leaves obvious structure unused.</text>
</svg>
