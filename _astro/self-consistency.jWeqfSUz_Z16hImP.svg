<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Sample several, take the majority.">
  <title>Self-consistency</title>
  <style>
    .self-consistency-bg   { fill: #f8fafc; }
    .self-consistency-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .self-consistency-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .self-consistency-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .self-consistency-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .self-consistency-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .self-consistency-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .self-consistency-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .self-consistency-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .self-consistency-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .self-consistency-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .self-consistency-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .self-consistency-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .self-consistency-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .self-consistency-stage { opacity: 1; }

    .self-consistency-s0 { animation-delay: 0.00s; }
    .self-consistency-e0 { animation-delay: 0.00s; }
    .self-consistency-s1 { animation-delay: 1.28s; }
    .self-consistency-e1 { animation-delay: 1.28s; }
    .self-consistency-s2 { animation-delay: 2.56s; }
    .self-consistency-e2 { animation-delay: 2.56s; }
    .self-consistency-s3 { animation-delay: 3.84s; }
    .self-consistency-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .self-consistency-conn  { animation: self-consistency-trace 6.4s ease-in-out infinite; }
      .self-consistency-stage { animation: self-consistency-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes self-consistency-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes self-consistency-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .self-consistency-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .self-consistency-stage { animation: self-consistency-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes self-consistency-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="self-consistency-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="self-consistency-bg" width="980" height="322"/>
  <text class="self-consistency-h1"  x="30" y="40">Self-consistency</text>
  <text class="self-consistency-sub" x="30" y="64">Sample several, take the majority.</text>
  <g class="self-consistency-stage self-consistency-s0">
    <rect class="self-consistency-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="self-consistency-step" x="44" y="142">01</text>
    <text class="self-consistency-name" x="70" y="142">One reasoning path can go wrong early</text>
    <text class="self-consistency-desc" x="44" y="166">And everything after it inherits</text>
    <text class="self-consistency-desc" x="44" y="182">the error.</text>
  </g>
  <line class="self-consistency-line self-consistency-conn self-consistency-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#self-consistency-tip)"/>
  <g class="self-consistency-stage self-consistency-s1">
    <rect class="self-consistency-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="self-consistency-step" x="280" y="142">02</text>
    <text class="self-consistency-name" x="306" y="142">Sample several independently</text>
    <text class="self-consistency-desc" x="280" y="166">At a temperature high enough to</text>
    <text class="self-consistency-desc" x="280" y="182">diverge.</text>
  </g>
  <line class="self-consistency-line self-consistency-conn self-consistency-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#self-consistency-tip)"/>
  <g class="self-consistency-stage self-consistency-s2">
    <rect class="self-consistency-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="self-consistency-step" x="516" y="142">03</text>
    <text class="self-consistency-name" x="542" y="142">And take the most common final answer</text>
    <text class="self-consistency-desc" x="516" y="166">Errors scatter, correct answers</text>
    <text class="self-consistency-desc" x="516" y="182">agree.</text>
  </g>
  <line class="self-consistency-line self-consistency-conn self-consistency-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#self-consistency-tip)"/>
  <g class="self-consistency-stage self-consistency-s3">
    <rect class="self-consistency-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="self-consistency-step" x="752" y="142">04</text>
    <text class="self-consistency-name" x="778" y="142">At several times the cost</text>
    <text class="self-consistency-desc" x="752" y="166">Which is the trade being made.</text>
    <text class="self-consistency-edge" x="752" y="242">5-10x</text>
  </g>
  <text class="self-consistency-sub" x="30" y="304">Wrong answers scattering while right ones converge is the assumption the method rests on, and it holds for problems with a single correct answer far better than for open-ended ones.</text>
</svg>
