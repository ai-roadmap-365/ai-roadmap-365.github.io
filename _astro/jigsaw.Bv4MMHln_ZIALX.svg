<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Edges must match.">
  <title>Fitting pieces together</title>
  <style>
    .jigsaw-bg   { fill: #f8fafc; }
    .jigsaw-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .jigsaw-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .jigsaw-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .jigsaw-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .jigsaw-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .jigsaw-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .jigsaw-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .jigsaw-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .jigsaw-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .jigsaw-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .jigsaw-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .jigsaw-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .jigsaw-row { opacity: 1; }
    .jigsaw-r0 { animation-delay: 0.00s; }
    .jigsaw-r1 { animation-delay: 0.45s; }
    .jigsaw-r2 { animation-delay: 0.90s; }
    .jigsaw-r3 { animation-delay: 1.35s; }
    .jigsaw-r4 { animation-delay: 1.80s; }
    .jigsaw-row { animation: jigsaw-reveal 7.3s ease-in-out infinite; }
    @keyframes jigsaw-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="jigsaw-bg" width="980" height="390"/>
  <text class="jigsaw-h1"  x="30" y="40">Fitting pieces together</text>
  <text class="jigsaw-sub" x="30" y="64">Edges must match.</text>
  <rect class="jigsaw-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="jigsaw-name" x="46" y="122">Matching edges</text>
  <text class="jigsaw-desc" x="46" y="142">They join.</text>
  <text class="jigsaw-desc jigsaw-row jigsaw-r0" x="46" y="182">Same shape on both sides</text>
  <text class="jigsaw-desc jigsaw-row jigsaw-r1" x="46" y="216">Every piece finds its place</text>
  <text class="jigsaw-desc jigsaw-row jigsaw-r2" x="46" y="250">The picture comes together</text>
  <text class="jigsaw-desc jigsaw-row jigsaw-r3" x="46" y="284">Missing pieces are obvious</text>
  <text class="jigsaw-desc jigsaw-row jigsaw-r4" x="46" y="318">This is a clean merge</text>
  <rect class="jigsaw-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="jigsaw-name" x="526" y="122">Mismatched</text>
  <text class="jigsaw-desc" x="526" y="142">They do not.</text>
  <text class="jigsaw-desc jigsaw-row jigsaw-r0" x="526" y="182">Nearly the same, but not quite</text>
  <text class="jigsaw-desc jigsaw-row jigsaw-r1" x="526" y="216">Pieces left over</text>
  <text class="jigsaw-desc jigsaw-row jigsaw-r2" x="526" y="250">Gaps in the picture</text>
  <text class="jigsaw-desc jigsaw-row jigsaw-r3" x="526" y="284">Missing pieces look like design</text>
  <text class="jigsaw-desc jigsaw-row jigsaw-r4" x="526" y="318">This is a key type mismatch</text>
  <text class="jigsaw-sub" x="30" y="372">Missing pieces looking like design is the danger with merges: an unmatched row simply is not there, and nothing in the result announces its absence.</text>
</svg>
