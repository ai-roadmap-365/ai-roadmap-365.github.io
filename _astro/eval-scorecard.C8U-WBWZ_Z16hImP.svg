<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four numbers, compared against something.">
  <title>What a scorecard should carry</title>
  <style>
    .eval-scorecard-bg   { fill: #f8fafc; }
    .eval-scorecard-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-scorecard-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-scorecard-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-scorecard-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-scorecard-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-scorecard-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eval-scorecard-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eval-scorecard-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eval-scorecard-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eval-scorecard-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eval-scorecard-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eval-scorecard-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .eval-scorecard-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .eval-scorecard-stage { opacity: 1; }

    .eval-scorecard-s0 { animation-delay: 0.00s; }
    .eval-scorecard-e0 { animation-delay: 0.00s; }
    .eval-scorecard-s1 { animation-delay: 1.28s; }
    .eval-scorecard-e1 { animation-delay: 1.28s; }
    .eval-scorecard-s2 { animation-delay: 2.56s; }
    .eval-scorecard-e2 { animation-delay: 2.56s; }
    .eval-scorecard-s3 { animation-delay: 3.84s; }
    .eval-scorecard-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .eval-scorecard-conn  { animation: eval-scorecard-trace 6.4s ease-in-out infinite; }
      .eval-scorecard-stage { animation: eval-scorecard-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes eval-scorecard-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes eval-scorecard-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .eval-scorecard-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .eval-scorecard-stage { animation: eval-scorecard-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes eval-scorecard-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="eval-scorecard-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="eval-scorecard-bg" width="980" height="322"/>
  <text class="eval-scorecard-h1"  x="30" y="40">What a scorecard should carry</text>
  <text class="eval-scorecard-sub" x="30" y="64">Four numbers, compared against something.</text>
  <g class="eval-scorecard-stage eval-scorecard-s0">
    <rect class="eval-scorecard-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="eval-scorecard-step" x="44" y="142">01</text>
    <text class="eval-scorecard-name" x="70" y="142">Retrieval: recall and precision</text>
    <text class="eval-scorecard-desc" x="44" y="166">Was the answer available, and</text>
    <text class="eval-scorecard-desc" x="44" y="182">near the top?</text>
    <text class="eval-scorecard-edge" x="44" y="242">@5</text>
  </g>
  <line class="eval-scorecard-line eval-scorecard-conn eval-scorecard-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#eval-scorecard-tip)"/>
  <g class="eval-scorecard-stage eval-scorecard-s1">
    <rect class="eval-scorecard-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="eval-scorecard-step" x="280" y="142">02</text>
    <text class="eval-scorecard-name" x="306" y="142">Grounding: claims traceable</text>
    <text class="eval-scorecard-desc" x="280" y="166">What proportion of statements</text>
    <text class="eval-scorecard-desc" x="280" y="182">cite a retrieved passage?</text>
  </g>
  <line class="eval-scorecard-line eval-scorecard-conn eval-scorecard-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#eval-scorecard-tip)"/>
  <g class="eval-scorecard-stage eval-scorecard-s2">
    <rect class="eval-scorecard-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="eval-scorecard-step" x="516" y="142">03</text>
    <text class="eval-scorecard-name" x="542" y="142">Relevance: does it answer</text>
    <text class="eval-scorecard-desc" x="516" y="166">Judged against a rubric, by a</text>
    <text class="eval-scorecard-desc" x="516" y="182">calibrated judge.</text>
  </g>
  <line class="eval-scorecard-line eval-scorecard-conn eval-scorecard-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#eval-scorecard-tip)"/>
  <g class="eval-scorecard-stage eval-scorecard-s3">
    <rect class="eval-scorecard-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="eval-scorecard-step" x="752" y="142">04</text>
    <text class="eval-scorecard-name" x="778" y="142">Cost and latency per query</text>
    <text class="eval-scorecard-desc" x="752" y="166">Because a quality gain that</text>
    <text class="eval-scorecard-desc" x="752" y="182">triples cost is a trade, not a</text>
    <text class="eval-scorecard-desc" x="752" y="198">win.</text>
    <text class="eval-scorecard-edge" x="752" y="242">per query</text>
  </g>
  <text class="eval-scorecard-sub" x="30" y="304">Every number needs a comparison to mean anything. "Groundedness 0.86" is not a result; "0.71 to 0.86 after reranking, for 140ms and no extra tokens" is.</text>
</svg>
