<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what not to.">
  <title>What to test</title>
  <style>
    .test-when-bg   { fill: #f8fafc; }
    .test-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .test-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .test-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .test-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .test-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .test-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .test-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .test-when-row { opacity: 1; }
    .test-when-r0 { animation-delay: 0.00s; }
    .test-when-r1 { animation-delay: 0.45s; }
    .test-when-r2 { animation-delay: 0.90s; }
    .test-when-r3 { animation-delay: 1.35s; }
    .test-when-r4 { animation-delay: 1.80s; }
    .test-when-row { animation: test-when-reveal 7.3s ease-in-out infinite; }
    @keyframes test-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="test-when-bg" width="980" height="390"/>
  <text class="test-when-h1"  x="30" y="40">What to test</text>
  <text class="test-when-sub" x="30" y="64">And what not to.</text>
  <rect class="test-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="test-when-name" x="46" y="122">Test it</text>
  <text class="test-when-desc" x="46" y="142">Four cases.</text>
  <text class="test-when-desc test-when-row test-when-r0" x="46" y="182">Business rules and logic</text>
  <text class="test-when-desc test-when-row test-when-r1" x="46" y="216">Edge cases and boundaries</text>
  <text class="test-when-desc test-when-row test-when-r2" x="46" y="250">Anything that has broken before</text>
  <text class="test-when-desc test-when-row test-when-r3" x="46" y="284">Public interfaces</text>
  <text class="test-when-desc test-when-row test-when-r4" x="46" y="318">Anything you would check by hand</text>
  <rect class="test-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="test-when-name" x="526" y="122">Do not</text>
  <text class="test-when-desc" x="526" y="142">Also four.</text>
  <text class="test-when-desc test-when-row test-when-r0" x="526" y="182">Third-party libraries</text>
  <text class="test-when-desc test-when-row test-when-r1" x="526" y="216">Trivial getters and setters</text>
  <text class="test-when-desc test-when-row test-when-r2" x="526" y="250">Implementation details</text>
  <text class="test-when-desc test-when-row test-when-r3" x="526" y="284">Generated code</text>
  <text class="test-when-desc test-when-row test-when-r4" x="526" y="318">Anything whose test restates the code</text>
  <text class="test-when-sub" x="30" y="372">Adding a test for every bug found is the highest-value rule here, because a defect that occurred once is far more likely than average to occur again.</text>
</svg>
