<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="None of them is CPU.">
  <title>Four AI-specific signals</title>
  <style>
    .telemetry-signals-bg   { fill: #f8fafc; }
    .telemetry-signals-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .telemetry-signals-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .telemetry-signals-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .telemetry-signals-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .telemetry-signals-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .telemetry-signals-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .telemetry-signals-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .telemetry-signals-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .telemetry-signals-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .telemetry-signals-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .telemetry-signals-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .telemetry-signals-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .telemetry-signals-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .telemetry-signals-stage { opacity: 1; }

    .telemetry-signals-s0 { animation-delay: 0.00s; }
    .telemetry-signals-e0 { animation-delay: 0.00s; }
    .telemetry-signals-s1 { animation-delay: 1.28s; }
    .telemetry-signals-e1 { animation-delay: 1.28s; }
    .telemetry-signals-s2 { animation-delay: 2.56s; }
    .telemetry-signals-e2 { animation-delay: 2.56s; }
    .telemetry-signals-s3 { animation-delay: 3.84s; }
    .telemetry-signals-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .telemetry-signals-conn  { animation: telemetry-signals-trace 6.4s ease-in-out infinite; }
      .telemetry-signals-stage { animation: telemetry-signals-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes telemetry-signals-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes telemetry-signals-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .telemetry-signals-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .telemetry-signals-stage { animation: telemetry-signals-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes telemetry-signals-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="telemetry-signals-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="telemetry-signals-bg" width="980" height="322"/>
  <text class="telemetry-signals-h1"  x="30" y="40">Four AI-specific signals</text>
  <text class="telemetry-signals-sub" x="30" y="64">None of them is CPU.</text>
  <g class="telemetry-signals-stage telemetry-signals-s0">
    <rect class="telemetry-signals-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="telemetry-signals-step" x="44" y="142">01</text>
    <text class="telemetry-signals-name" x="70" y="142">Time to first token</text>
    <text class="telemetry-signals-desc" x="44" y="166">What the user experiences as</text>
    <text class="telemetry-signals-desc" x="44" y="182">speed. Alert above 500 ms.</text>
    <text class="telemetry-signals-edge" x="44" y="242">TTFT</text>
  </g>
  <line class="telemetry-signals-line telemetry-signals-conn telemetry-signals-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#telemetry-signals-tip)"/>
  <g class="telemetry-signals-stage telemetry-signals-s1">
    <rect class="telemetry-signals-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="telemetry-signals-step" x="280" y="142">02</text>
    <text class="telemetry-signals-name" x="306" y="142">Inter-token latency</text>
    <text class="telemetry-signals-desc" x="280" y="166">How fast the answer unfolds once</text>
    <text class="telemetry-signals-desc" x="280" y="182">it starts.</text>
    <text class="telemetry-signals-edge" x="280" y="242">ITL</text>
  </g>
  <line class="telemetry-signals-line telemetry-signals-conn telemetry-signals-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#telemetry-signals-tip)"/>
  <g class="telemetry-signals-stage telemetry-signals-s2">
    <rect class="telemetry-signals-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="telemetry-signals-step" x="516" y="142">03</text>
    <text class="telemetry-signals-name" x="542" y="142">Queue depth</text>
    <text class="telemetry-signals-desc" x="516" y="166">num_requests_waiting. The</text>
    <text class="telemetry-signals-desc" x="516" y="182">autoscaling signal, and the</text>
    <text class="telemetry-signals-desc" x="516" y="198">saturation signal.</text>
    <text class="telemetry-signals-edge" x="516" y="242">KEDA</text>
  </g>
  <line class="telemetry-signals-line telemetry-signals-conn telemetry-signals-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#telemetry-signals-tip)"/>
  <g class="telemetry-signals-stage telemetry-signals-s3">
    <rect class="telemetry-signals-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="telemetry-signals-step" x="752" y="142">04</text>
    <text class="telemetry-signals-name" x="778" y="142">Error rate</text>
    <text class="telemetry-signals-desc" x="752" y="166">Alert above 1%. And the input to</text>
    <text class="telemetry-signals-desc" x="752" y="182">the circuit breaker.</text>
    <text class="telemetry-signals-edge" x="752" y="242">1%</text>
  </g>
  <text class="telemetry-signals-sub" x="30" y="304">Three of these four have no equivalent in a conventional web service, which is why an AI deployment instrumented with a standard dashboard reports healthy while its users are waiting eight seconds for a first token.</text>
</svg>
