<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four stages, all asynchronous.">
  <title>Getting telemetry off the request path</title>
  <style>
    .telemetry-pipeline-bg   { fill: #f8fafc; }
    .telemetry-pipeline-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .telemetry-pipeline-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .telemetry-pipeline-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .telemetry-pipeline-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .telemetry-pipeline-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .telemetry-pipeline-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .telemetry-pipeline-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .telemetry-pipeline-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .telemetry-pipeline-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .telemetry-pipeline-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .telemetry-pipeline-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .telemetry-pipeline-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .telemetry-pipeline-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .telemetry-pipeline-stage { opacity: 1; }

    .telemetry-pipeline-s0 { animation-delay: 0.00s; }
    .telemetry-pipeline-e0 { animation-delay: 0.00s; }
    .telemetry-pipeline-s1 { animation-delay: 1.28s; }
    .telemetry-pipeline-e1 { animation-delay: 1.28s; }
    .telemetry-pipeline-s2 { animation-delay: 2.56s; }
    .telemetry-pipeline-e2 { animation-delay: 2.56s; }
    .telemetry-pipeline-s3 { animation-delay: 3.84s; }
    .telemetry-pipeline-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .telemetry-pipeline-conn  { animation: telemetry-pipeline-trace 6.4s ease-in-out infinite; }
      .telemetry-pipeline-stage { animation: telemetry-pipeline-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes telemetry-pipeline-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes telemetry-pipeline-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .telemetry-pipeline-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .telemetry-pipeline-stage { animation: telemetry-pipeline-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes telemetry-pipeline-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="telemetry-pipeline-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="telemetry-pipeline-bg" width="980" height="322"/>
  <text class="telemetry-pipeline-h1"  x="30" y="40">Getting telemetry off the request path</text>
  <text class="telemetry-pipeline-sub" x="30" y="64">Four stages, all asynchronous.</text>
  <g class="telemetry-pipeline-stage telemetry-pipeline-s0">
    <rect class="telemetry-pipeline-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="telemetry-pipeline-step" x="44" y="142">01</text>
    <text class="telemetry-pipeline-name" x="70" y="142">Buffer in memory</text>
    <text class="telemetry-pipeline-desc" x="44" y="166">A ring buffer, dispatched in</text>
    <text class="telemetry-pipeline-desc" x="44" y="182">background batches. Never on the</text>
    <text class="telemetry-pipeline-desc" x="44" y="198">request thread.</text>
  </g>
  <line class="telemetry-pipeline-line telemetry-pipeline-conn telemetry-pipeline-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#telemetry-pipeline-tip)"/>
  <g class="telemetry-pipeline-stage telemetry-pipeline-s1">
    <rect class="telemetry-pipeline-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="telemetry-pipeline-step" x="280" y="142">02</text>
    <text class="telemetry-pipeline-name" x="306" y="142">Stream into a queue</text>
    <text class="telemetry-pipeline-desc" x="280" y="166">Kafka or similar, so a slow</text>
    <text class="telemetry-pipeline-desc" x="280" y="182">store does not become a slow</text>
    <text class="telemetry-pipeline-desc" x="280" y="198">request.</text>
  </g>
  <line class="telemetry-pipeline-line telemetry-pipeline-conn telemetry-pipeline-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#telemetry-pipeline-tip)"/>
  <g class="telemetry-pipeline-stage telemetry-pipeline-s2">
    <rect class="telemetry-pipeline-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="telemetry-pipeline-step" x="516" y="142">03</text>
    <text class="telemetry-pipeline-name" x="542" y="142">Columnar analytical storage</text>
    <text class="telemetry-pipeline-desc" x="516" y="166">Sub-second queries across</text>
    <text class="telemetry-pipeline-desc" x="516" y="182">billions of spans.</text>
    <text class="telemetry-pipeline-edge" x="516" y="242">OLAP</text>
  </g>
  <line class="telemetry-pipeline-line telemetry-pipeline-conn telemetry-pipeline-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#telemetry-pipeline-tip)"/>
  <g class="telemetry-pipeline-stage telemetry-pipeline-s3">
    <rect class="telemetry-pipeline-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="telemetry-pipeline-step" x="752" y="142">04</text>
    <text class="telemetry-pipeline-name" x="778" y="142">Dashboards</text>
    <text class="telemetry-pipeline-desc" x="752" y="166">p95, TTFT, token rate, cost per</text>
    <text class="telemetry-pipeline-desc" x="752" y="182">tenant.</text>
  </g>
  <text class="telemetry-pipeline-sub" x="30" y="304">Synchronous export is the anti-pattern worth naming: shipping a span over HTTP inside the request adds 100-300 ms of latency to the thing you instrumented in order to make it faster.</text>
</svg>
