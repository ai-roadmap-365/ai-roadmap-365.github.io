<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Matching them is the 40-60%.">
  <title>Three traffic classes, three price points</title>
  <style>
    .cost-arbitrage-bg   { fill: #f8fafc; }
    .cost-arbitrage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-arbitrage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-arbitrage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-arbitrage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-arbitrage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-arbitrage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cost-arbitrage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cost-arbitrage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cost-arbitrage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cost-arbitrage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cost-arbitrage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cost-arbitrage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cost-arbitrage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cost-arbitrage-stage { opacity: 1; }

    .cost-arbitrage-s0 { animation-delay: 0.00s; }
    .cost-arbitrage-e0 { animation-delay: 0.00s; }
    .cost-arbitrage-s1 { animation-delay: 1.50s; }
    .cost-arbitrage-e1 { animation-delay: 1.50s; }
    .cost-arbitrage-s2 { animation-delay: 3.00s; }
    .cost-arbitrage-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .cost-arbitrage-conn  { animation: cost-arbitrage-trace 6s ease-in-out infinite; }
      .cost-arbitrage-stage { animation: cost-arbitrage-arrive 6s ease-in-out infinite; }
    }
    @keyframes cost-arbitrage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cost-arbitrage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cost-arbitrage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cost-arbitrage-stage { animation: cost-arbitrage-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cost-arbitrage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cost-arbitrage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cost-arbitrage-bg" width="980" height="322"/>
  <text class="cost-arbitrage-h1"  x="30" y="40">Three traffic classes, three price points</text>
  <text class="cost-arbitrage-sub" x="30" y="64">Matching them is the 40-60%.</text>
  <g class="cost-arbitrage-stage cost-arbitrage-s0">
    <rect class="cost-arbitrage-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="cost-arbitrage-step" x="44" y="142">01</text>
    <text class="cost-arbitrage-name" x="70" y="142">Baseline, ~60% of traffic</text>
    <text class="cost-arbitrage-desc" x="44" y="166">A one- or three-year commitment. Roughly 45%</text>
    <text class="cost-arbitrage-desc" x="44" y="182">off.</text>
    <text class="cost-arbitrage-edge" x="44" y="242">-45%</text>
  </g>
  <line class="cost-arbitrage-line cost-arbitrage-conn cost-arbitrage-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#cost-arbitrage-tip)"/>
  <g class="cost-arbitrage-stage cost-arbitrage-s1">
    <rect class="cost-arbitrage-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="cost-arbitrage-step" x="359" y="142">02</text>
    <text class="cost-arbitrage-name" x="385" y="142">Daily peaks, ~30%</text>
    <text class="cost-arbitrage-desc" x="359" y="166">On-demand, at full price. You are paying for</text>
    <text class="cost-arbitrage-desc" x="359" y="182">elasticity.</text>
  </g>
  <line class="cost-arbitrage-line cost-arbitrage-conn cost-arbitrage-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#cost-arbitrage-tip)"/>
  <g class="cost-arbitrage-stage cost-arbitrage-s2">
    <rect class="cost-arbitrage-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="cost-arbitrage-step" x="674" y="142">03</text>
    <text class="cost-arbitrage-name" x="700" y="142">Offline batch, ~10%</text>
    <text class="cost-arbitrage-desc" x="674" y="166">Spot or preemptible. Roughly 70% off, and</text>
    <text class="cost-arbitrage-desc" x="674" y="182">interruptible.</text>
    <text class="cost-arbitrage-edge" x="674" y="242">-70%</text>
  </g>
  <text class="cost-arbitrage-sub" x="30" y="304">The mistake is buying one price point for all three: committing to peak capacity wastes the commitment overnight, and running baseline on-demand pays a premium for flexibility that steady traffic never uses.</text>
</svg>
