<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Signal against noise.">
  <title>Measuring context relevance</title>
  <style>
    .context-relevance-bg   { fill: #f8fafc; }
    .context-relevance-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .context-relevance-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .context-relevance-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .context-relevance-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .context-relevance-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .context-relevance-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .context-relevance-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .context-relevance-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .context-relevance-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .context-relevance-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .context-relevance-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .context-relevance-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .context-relevance-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .context-relevance-stage { opacity: 1; }

    .context-relevance-s0 { animation-delay: 0.00s; }
    .context-relevance-e0 { animation-delay: 0.00s; }
    .context-relevance-s1 { animation-delay: 1.28s; }
    .context-relevance-e1 { animation-delay: 1.28s; }
    .context-relevance-s2 { animation-delay: 2.56s; }
    .context-relevance-e2 { animation-delay: 2.56s; }
    .context-relevance-s3 { animation-delay: 3.84s; }
    .context-relevance-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .context-relevance-conn  { animation: context-relevance-trace 6.4s ease-in-out infinite; }
      .context-relevance-stage { animation: context-relevance-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes context-relevance-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes context-relevance-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .context-relevance-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .context-relevance-stage { animation: context-relevance-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes context-relevance-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="context-relevance-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="context-relevance-bg" width="980" height="322"/>
  <text class="context-relevance-h1"  x="30" y="40">Measuring context relevance</text>
  <text class="context-relevance-sub" x="30" y="64">Signal against noise.</text>
  <g class="context-relevance-stage context-relevance-s0">
    <rect class="context-relevance-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="context-relevance-step" x="44" y="142">01</text>
    <text class="context-relevance-name" x="70" y="142">Split the retrieved context into sentences</text>
    <text class="context-relevance-desc" x="44" y="166">The unit of relevance.</text>
  </g>
  <line class="context-relevance-line context-relevance-conn context-relevance-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#context-relevance-tip)"/>
  <g class="context-relevance-stage context-relevance-s1">
    <rect class="context-relevance-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="context-relevance-step" x="280" y="142">02</text>
    <text class="context-relevance-name" x="306" y="142">Mark each as relevant to the question or not</text>
    <text class="context-relevance-desc" x="280" y="166">By a judge, against a written</text>
    <text class="context-relevance-desc" x="280" y="182">rubric.</text>
  </g>
  <line class="context-relevance-line context-relevance-conn context-relevance-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#context-relevance-tip)"/>
  <g class="context-relevance-stage context-relevance-s2">
    <rect class="context-relevance-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="context-relevance-step" x="516" y="142">03</text>
    <text class="context-relevance-name" x="542" y="142">Score as the relevant fraction</text>
    <text class="context-relevance-desc" x="516" y="166">Which is a signal-to-noise</text>
    <text class="context-relevance-desc" x="516" y="182">ratio.</text>
  </g>
  <line class="context-relevance-line context-relevance-conn context-relevance-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#context-relevance-tip)"/>
  <g class="context-relevance-stage context-relevance-s3">
    <rect class="context-relevance-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="context-relevance-step" x="752" y="142">04</text>
    <text class="context-relevance-name" x="778" y="142">Low means retrieval is dragging in noise</text>
    <text class="context-relevance-desc" x="752" y="166">Which costs tokens and dilutes</text>
    <text class="context-relevance-desc" x="752" y="182">attention.</text>
  </g>
  <text class="context-relevance-sub" x="30" y="304">Noise is not harmless: irrelevant passages both cost money and measurably reduce the model's use of the relevant ones, which is why precision matters alongside recall.</text>
</svg>
