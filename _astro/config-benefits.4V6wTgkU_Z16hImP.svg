<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Secrets, composition, reload, portability.">
  <title>Four operational wins</title>
  <style>
    .config-benefits-bg   { fill: #f8fafc; }
    .config-benefits-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .config-benefits-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .config-benefits-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .config-benefits-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .config-benefits-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .config-benefits-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .config-benefits-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .config-benefits-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .config-benefits-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .config-benefits-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .config-benefits-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .config-benefits-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .config-benefits-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .config-benefits-stage { opacity: 1; }

    .config-benefits-s0 { animation-delay: 0.00s; }
    .config-benefits-e0 { animation-delay: 0.00s; }
    .config-benefits-s1 { animation-delay: 1.28s; }
    .config-benefits-e1 { animation-delay: 1.28s; }
    .config-benefits-s2 { animation-delay: 2.56s; }
    .config-benefits-e2 { animation-delay: 2.56s; }
    .config-benefits-s3 { animation-delay: 3.84s; }
    .config-benefits-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .config-benefits-conn  { animation: config-benefits-trace 6.4s ease-in-out infinite; }
      .config-benefits-stage { animation: config-benefits-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes config-benefits-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes config-benefits-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .config-benefits-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .config-benefits-stage { animation: config-benefits-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes config-benefits-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="config-benefits-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="config-benefits-bg" width="980" height="322"/>
  <text class="config-benefits-h1"  x="30" y="40">Four operational wins</text>
  <text class="config-benefits-sub" x="30" y="64">Secrets, composition, reload, portability.</text>
  <g class="config-benefits-stage config-benefits-s0">
    <rect class="config-benefits-good" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="config-benefits-step" x="44" y="142">01</text>
    <text class="config-benefits-name" x="70" y="142">Secrets via the environment</text>
    <text class="config-benefits-desc" x="44" y="166">Injected into the child process.</text>
    <text class="config-benefits-desc" x="44" y="182">Never in a system prompt.</text>
    <text class="config-benefits-edge" x="44" y="242">no leakage</text>
  </g>
  <line class="config-benefits-line config-benefits-conn config-benefits-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#config-benefits-tip)"/>
  <g class="config-benefits-stage config-benefits-s1">
    <rect class="config-benefits-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="config-benefits-step" x="280" y="142">02</text>
    <text class="config-benefits-name" x="306" y="142">Ten servers, one tool list</text>
    <text class="config-benefits-desc" x="280" y="166">The model neither knows nor</text>
    <text class="config-benefits-desc" x="280" y="182">cares which process hosts which</text>
    <text class="config-benefits-desc" x="280" y="198">tool.</text>
  </g>
  <line class="config-benefits-line config-benefits-conn config-benefits-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#config-benefits-tip)"/>
  <g class="config-benefits-stage config-benefits-s2">
    <rect class="config-benefits-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="config-benefits-step" x="516" y="142">03</text>
    <text class="config-benefits-name" x="542" y="142">Restart one server, not the client</text>
    <text class="config-benefits-desc" x="516" y="166">Updated tools re-register</text>
    <text class="config-benefits-desc" x="516" y="182">without restarting the IDE.</text>
    <text class="config-benefits-edge" x="516" y="242">hot reload</text>
  </g>
  <line class="config-benefits-line config-benefits-conn config-benefits-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#config-benefits-tip)"/>
  <g class="config-benefits-stage config-benefits-s3">
    <rect class="config-benefits-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="config-benefits-step" x="752" y="142">04</text>
    <text class="config-benefits-name" x="778" y="142">Portable configuration</text>
    <text class="config-benefits-desc" x="752" y="166">The same JSON moves between</text>
    <text class="config-benefits-desc" x="752" y="182">hosts and platforms with path</text>
    <text class="config-benefits-desc" x="752" y="198">adjustments.</text>
  </g>
  <text class="config-benefits-sub" x="30" y="304">The first is the security property that matters most day to day: a database password in a system prompt is one prompt-injection away from being read aloud, and a password in the environment is not in the context at all.</text>
</svg>
