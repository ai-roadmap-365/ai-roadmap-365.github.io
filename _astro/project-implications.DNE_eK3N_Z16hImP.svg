<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are organisational.">
  <title>Four consequences of doing it properly</title>
  <style>
    .project-implications-bg   { fill: #f8fafc; }
    .project-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .project-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .project-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .project-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .project-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .project-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .project-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .project-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .project-implications-stage { opacity: 1; }

    .project-implications-s0 { animation-delay: 0.00s; }
    .project-implications-e0 { animation-delay: 0.00s; }
    .project-implications-s1 { animation-delay: 1.28s; }
    .project-implications-e1 { animation-delay: 1.28s; }
    .project-implications-s2 { animation-delay: 2.56s; }
    .project-implications-e2 { animation-delay: 2.56s; }
    .project-implications-s3 { animation-delay: 3.84s; }
    .project-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .project-implications-conn  { animation: project-implications-trace 6.4s ease-in-out infinite; }
      .project-implications-stage { animation: project-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes project-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes project-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .project-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .project-implications-stage { animation: project-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes project-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="project-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="project-implications-bg" width="980" height="322"/>
  <text class="project-implications-h1"  x="30" y="40">Four consequences of doing it properly</text>
  <text class="project-implications-sub" x="30" y="64">Two are organisational.</text>
  <g class="project-implications-stage project-implications-s0">
    <rect class="project-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="project-implications-step" x="44" y="142">01</text>
    <text class="project-implications-name" x="70" y="142">Results hold up in production</text>
    <text class="project-implications-desc" x="44" y="166">Which is the entire point of the</text>
    <text class="project-implications-desc" x="44" y="182">gates.</text>
  </g>
  <line class="project-implications-line project-implications-conn project-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#project-implications-tip)"/>
  <g class="project-implications-stage project-implications-s1">
    <rect class="project-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="project-implications-step" x="280" y="142">02</text>
    <text class="project-implications-name" x="306" y="142">But it looks slower than jumping to modelling</text>
    <text class="project-implications-desc" x="280" y="166">Because the first score arrives</text>
    <text class="project-implications-desc" x="280" y="182">later.</text>
  </g>
  <line class="project-implications-line project-implications-conn project-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#project-implications-tip)"/>
  <g class="project-implications-stage project-implications-s2">
    <rect class="project-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="project-implications-step" x="516" y="142">03</text>
    <text class="project-implications-name" x="542" y="142">And every decision is recorded</text>
    <text class="project-implications-desc" x="516" y="166">Which regulators and auditors</text>
    <text class="project-implications-desc" x="516" y="182">ask for.</text>
  </g>
  <line class="project-implications-line project-implications-conn project-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#project-implications-tip)"/>
  <g class="project-implications-stage project-implications-s3">
    <rect class="project-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="project-implications-step" x="752" y="142">04</text>
    <text class="project-implications-name" x="778" y="142">While honest numbers set expectations correctly</text>
    <text class="project-implications-desc" x="752" y="166">Rather than promising what will</text>
    <text class="project-implications-desc" x="752" y="182">not survive.</text>
  </g>
  <text class="project-implications-sub" x="30" y="304">The apparent slowness is the reason the discipline gets abandoned, and the cost of abandoning it is paid later as a model that disappoints in production.</text>
</svg>
