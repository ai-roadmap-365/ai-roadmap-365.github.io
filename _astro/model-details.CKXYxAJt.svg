<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four fields.">
  <title>The identifying details</title>
  <style>
    .model-details-bg   { fill: #f8fafc; }
    .model-details-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-details-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-details-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-details-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-details-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-details-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .model-details-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .model-details-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .model-details-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .model-details-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .model-details-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .model-details-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .model-details-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .model-details-stage { opacity: 1; }

    .model-details-s0 { animation-delay: 0.00s; }
    .model-details-e0 { animation-delay: 0.00s; }
    .model-details-s1 { animation-delay: 1.28s; }
    .model-details-e1 { animation-delay: 1.28s; }
    .model-details-s2 { animation-delay: 2.56s; }
    .model-details-e2 { animation-delay: 2.56s; }
    .model-details-s3 { animation-delay: 3.84s; }
    .model-details-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .model-details-conn  { animation: model-details-trace 6.4s ease-in-out infinite; }
      .model-details-stage { animation: model-details-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes model-details-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes model-details-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .model-details-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .model-details-stage { animation: model-details-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes model-details-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="model-details-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="model-details-bg" width="980" height="322"/>
  <text class="model-details-h1"  x="30" y="40">The identifying details</text>
  <text class="model-details-sub" x="30" y="64">Four fields.</text>
  <g class="model-details-stage model-details-s0">
    <rect class="model-details-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="model-details-step" x="44" y="142">01</text>
    <text class="model-details-name" x="70" y="142">Version and date</text>
    <text class="model-details-desc" x="44" y="166">So the report and the artefact</text>
    <text class="model-details-desc" x="44" y="182">cannot drift apart.</text>
  </g>
  <line class="model-details-line model-details-conn model-details-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#model-details-tip)"/>
  <g class="model-details-stage model-details-s1">
    <rect class="model-details-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="model-details-step" x="280" y="142">02</text>
    <text class="model-details-name" x="306" y="142">Training data version and code commit</text>
    <text class="model-details-desc" x="280" y="166">Which makes it reproducible.</text>
  </g>
  <line class="model-details-line model-details-conn model-details-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#model-details-tip)"/>
  <g class="model-details-stage model-details-s2">
    <rect class="model-details-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="model-details-step" x="516" y="142">03</text>
    <text class="model-details-name" x="542" y="142">The owner, by name or team</text>
    <text class="model-details-desc" x="516" y="166">So questions have a destination.</text>
  </g>
  <line class="model-details-line model-details-conn model-details-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#model-details-tip)"/>
  <g class="model-details-stage model-details-s3">
    <rect class="model-details-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="model-details-step" x="752" y="142">04</text>
    <text class="model-details-name" x="778" y="142">And upstream dependencies</text>
    <text class="model-details-desc" x="752" y="166">Libraries, base models, feature</text>
    <text class="model-details-desc" x="752" y="182">sources.</text>
  </g>
  <text class="model-details-sub" x="30" y="304">Naming an owner is the field most often left blank and the one that matters most a year later, when the model misbehaves and nobody knows who maintains it.</text>
</svg>
