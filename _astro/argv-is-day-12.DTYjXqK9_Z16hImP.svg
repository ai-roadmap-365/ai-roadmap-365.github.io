<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Positional parameters, same rules.">
  <title>sys.argv is Day 12, in Python</title>
  <style>
    .argv-is-day-12-bg   { fill: #f8fafc; }
    .argv-is-day-12-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .argv-is-day-12-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .argv-is-day-12-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .argv-is-day-12-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .argv-is-day-12-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .argv-is-day-12-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .argv-is-day-12-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .argv-is-day-12-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .argv-is-day-12-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .argv-is-day-12-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .argv-is-day-12-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .argv-is-day-12-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .argv-is-day-12-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .argv-is-day-12-stage { opacity: 1; }

    .argv-is-day-12-s0 { animation-delay: 0.00s; }
    .argv-is-day-12-e0 { animation-delay: 0.00s; }
    .argv-is-day-12-s1 { animation-delay: 1.28s; }
    .argv-is-day-12-e1 { animation-delay: 1.28s; }
    .argv-is-day-12-s2 { animation-delay: 2.56s; }
    .argv-is-day-12-e2 { animation-delay: 2.56s; }
    .argv-is-day-12-s3 { animation-delay: 3.84s; }
    .argv-is-day-12-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .argv-is-day-12-conn  { animation: argv-is-day-12-trace 6.4s ease-in-out infinite; }
      .argv-is-day-12-stage { animation: argv-is-day-12-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes argv-is-day-12-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes argv-is-day-12-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .argv-is-day-12-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .argv-is-day-12-stage { animation: argv-is-day-12-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes argv-is-day-12-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="argv-is-day-12-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="argv-is-day-12-bg" width="980" height="322"/>
  <text class="argv-is-day-12-h1"  x="30" y="40">sys.argv is Day 12, in Python</text>
  <text class="argv-is-day-12-sub" x="30" y="64">Positional parameters, same rules.</text>
  <g class="argv-is-day-12-stage argv-is-day-12-s0">
    <rect class="argv-is-day-12-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="argv-is-day-12-step" x="44" y="142">01</text>
    <text class="argv-is-day-12-name" x="70" y="142">sys.argv[0] is the script</text>
    <text class="argv-is-day-12-desc" x="44" y="166">Its own name — like $0 in a</text>
    <text class="argv-is-day-12-desc" x="44" y="182">shell script.</text>
    <text class="argv-is-day-12-edge" x="44" y="242">$0</text>
  </g>
  <line class="argv-is-day-12-line argv-is-day-12-conn argv-is-day-12-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#argv-is-day-12-tip)"/>
  <g class="argv-is-day-12-stage argv-is-day-12-s1">
    <rect class="argv-is-day-12-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="argv-is-day-12-step" x="280" y="142">02</text>
    <text class="argv-is-day-12-name" x="306" y="142">Arguments start at index 1</text>
    <text class="argv-is-day-12-desc" x="280" y="166">argv[1] is $1, argv[2] is $2.</text>
    <text class="argv-is-day-12-edge" x="280" y="242">$1 $2</text>
  </g>
  <line class="argv-is-day-12-line argv-is-day-12-conn argv-is-day-12-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#argv-is-day-12-tip)"/>
  <g class="argv-is-day-12-stage argv-is-day-12-s2">
    <rect class="argv-is-day-12-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="argv-is-day-12-step" x="516" y="142">03</text>
    <text class="argv-is-day-12-name" x="542" y="142">They are always strings</text>
    <text class="argv-is-day-12-desc" x="516" y="166">Exactly like input(). Convert,</text>
    <text class="argv-is-day-12-desc" x="516" y="182">and handle the failure.</text>
  </g>
  <line class="argv-is-day-12-line argv-is-day-12-conn argv-is-day-12-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#argv-is-day-12-tip)"/>
  <g class="argv-is-day-12-stage argv-is-day-12-s3">
    <rect class="argv-is-day-12-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="argv-is-day-12-step" x="752" y="142">04</text>
    <text class="argv-is-day-12-name" x="778" y="142">Default when absent</text>
    <text class="argv-is-day-12-desc" x="752" y="166">argv[1] if len(argv) &gt; 1 else</text>
    <text class="argv-is-day-12-desc" x="752" y="182">"." — the shell's default-value</text>
    <text class="argv-is-day-12-desc" x="752" y="198">idiom.</text>
    <text class="argv-is-day-12-edge" x="752" y="242">default</text>
  </g>
  <text class="argv-is-day-12-sub" x="30" y="304">argparse replaces all of this the moment you want named options, help text or validation, and that is Day 80. sys.argv is what it is built on and what you reach for in a ten-line script.</text>
</svg>
