<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Not with a password. Platforms stopped accepting them.">
  <title>How to authenticate to a remote</title>
  <style>
    .ssh-or-token-bg   { fill: #f8fafc; }
    .ssh-or-token-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ssh-or-token-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ssh-or-token-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ssh-or-token-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ssh-or-token-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ssh-or-token-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ssh-or-token-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ssh-or-token-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ssh-or-token-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ssh-or-token-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ssh-or-token-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ssh-or-token-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ssh-or-token-row { opacity: 1; }
    .ssh-or-token-r0 { animation-delay: 0.00s; }
    .ssh-or-token-r1 { animation-delay: 0.45s; }
    .ssh-or-token-r2 { animation-delay: 0.90s; }
    .ssh-or-token-r3 { animation-delay: 1.35s; }
    .ssh-or-token-r4 { animation-delay: 1.80s; }
    .ssh-or-token-row { animation: ssh-or-token-reveal 7.3s ease-in-out infinite; }
    @keyframes ssh-or-token-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="ssh-or-token-bg" width="980" height="390"/>
  <text class="ssh-or-token-h1"  x="30" y="40">How to authenticate to a remote</text>
  <text class="ssh-or-token-sub" x="30" y="64">Not with a password. Platforms stopped accepting them.</text>
  <rect class="ssh-or-token-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="ssh-or-token-name" x="46" y="122">SSH keys</text>
  <text class="ssh-or-token-desc" x="46" y="142">Set up once, then invisible.</text>
  <text class="ssh-or-token-desc ssh-or-token-row ssh-or-token-r0" x="46" y="182">A key pair; the public half goes to the platform</text>
  <text class="ssh-or-token-desc ssh-or-token-row ssh-or-token-r1" x="46" y="216">No credential typed, ever again</text>
  <text class="ssh-or-token-desc ssh-or-token-row ssh-or-token-r2" x="46" y="250">Revoke one key without affecting others</text>
  <text class="ssh-or-token-desc ssh-or-token-row ssh-or-token-r3" x="46" y="284">Works for every repository at once</text>
  <text class="ssh-or-token-desc ssh-or-token-row ssh-or-token-r4" x="46" y="318">The single biggest quality-of-life change here</text>
  <rect class="ssh-or-token-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="ssh-or-token-name" x="526" y="122">Access tokens</text>
  <text class="ssh-or-token-desc" x="526" y="142">A scoped, revocable password.</text>
  <text class="ssh-or-token-desc ssh-or-token-row ssh-or-token-r0" x="526" y="182">Generated on the platform, with chosen scopes</text>
  <text class="ssh-or-token-desc ssh-or-token-row ssh-or-token-r1" x="526" y="216">Used over HTTPS, stored by a credential helper</text>
  <text class="ssh-or-token-desc ssh-or-token-row ssh-or-token-r2" x="526" y="250">Scope it narrowly — Day 25's rule</text>
  <text class="ssh-or-token-desc ssh-or-token-row ssh-or-token-r3" x="526" y="284">Revoke individually</text>
  <text class="ssh-or-token-desc ssh-or-token-row ssh-or-token-r4" x="526" y="318">Necessary where SSH is blocked</text>
  <text class="ssh-or-token-sub" x="30" y="372">Both are better than a password because both can be scoped and revoked separately. A password cannot be limited, and changing it breaks everything at once.</text>
</svg>
