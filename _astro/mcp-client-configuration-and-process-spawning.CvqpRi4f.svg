<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="MCP Client Configuration and Process Spawning">
  <title>MCP Client Configuration and Process Spawning</title>
  <defs>
    <style>
      .d296a-bg { fill: #f8fafc; }
      .d296a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d296a-client { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d296a-srv { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d296a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d296a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d296a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
      .d296a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
      .d296a-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #0f172a; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d296a-bg" />
  
  <text x="40" y="40" class="d296a-title">MCP Client Configuration &amp; Process Spawning</text>
  <text x="40" y="65" class="d296a-subtitle">MCP Client Configuration and Process Spawning diagram showing configuration JSON parsing, subprocess spawning, and stdio pipe routing</text>
  
  <!-- Left: Config JSON -->
  <rect x="40" y="100" width="340" height="300" class="d296a-card" />
  <text x="60" y="130" class="d296a-header">claude_desktop_config.json</text>
  <text x="60" y="160" class="d296a-code">{"mcpServers": {</text>
  <text x="80" y="180" class="d296a-code">"sqlite": {</text>
  <text x="100" y="200" class="d296a-code">"command": "python",</text>
  <text x="100" y="220" class="d296a-code">"args": ["-u", "-m", "mcp_server_sqlite",</text>
  <text x="145" y="240" class="d296a-code">"--db-path", "/data/prod.db"],</text>
  <text x="100" y="260" class="d296a-code">"env": {"API_KEY": "secret-token"}</text>
  <text x="80" y="280" class="d296a-code">},</text>
  <text x="80" y="300" class="d296a-code">"github": { ... }</text>
  <text x="60" y="320" class="d296a-code">}}</text>
  
  <!-- Center: Client Host -->
  <rect x="420" y="100" width="200" height="300" class="d296a-client" />
  <text x="440" y="130" class="d296a-header" fill="#1d4ed8">Host Process</text>
  <text x="440" y="160" class="d296a-text">• Parses JSON config</text>
  <text x="440" y="180" class="d296a-text">• Spawns child subprocesses</text>
  <text x="440" y="200" class="d296a-text">• Hooks stdin / stdout pipes</text>
  <text x="440" y="220" class="d296a-text">• Injects environment map</text>
  <text x="440" y="250" class="d296a-text" font-weight="600">Lifecycle Control:</text>
  <text x="440" y="270" class="d296a-text">Auto-restart on crash</text>
  <text x="440" y="290" class="d296a-text">SIGTERM on exit</text>
  
  <!-- Right: Spawned Servers -->
  <rect x="660" y="100" width="200" height="140" class="d296a-srv" />
  <text x="680" y="130" class="d296a-header" fill="#15803d">Subprocess 1: SQLite</text>
  <text x="680" y="155" class="d296a-text">• PID: 48201</text>
  <text x="680" y="175" class="d296a-text">• stdin &lt;-- JSON-RPC</text>
  <text x="680" y="195" class="d296a-text">• stdout --&gt; JSON-RPC</text>
  <text x="680" y="215" class="d296a-text">• stderr --&gt; log file</text>
  
  <rect x="660" y="260" width="200" height="140" class="d296a-srv" />
  <text x="680" y="290" class="d296a-header" fill="#15803d">Subprocess 2: GitHub</text>
  <text x="680" y="315" class="d296a-text">• PID: 48202</text>
  <text x="680" y="335" class="d296a-text">• stdin &lt;-- JSON-RPC</text>
  <text x="680" y="355" class="d296a-text">• stdout --&gt; JSON-RPC</text>
  <text x="680" y="375" class="d296a-text">• stderr --&gt; log file</text>
</svg>