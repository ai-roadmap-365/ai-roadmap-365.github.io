<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when it is overhead.">
  <title>When a rigorous system prompt pays</title>
  <style>
    .system-when-bg   { fill: #f8fafc; }
    .system-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .system-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .system-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .system-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .system-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .system-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .system-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .system-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .system-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .system-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .system-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .system-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .system-when-row { opacity: 1; }
    .system-when-r0 { animation-delay: 0.00s; }
    .system-when-r1 { animation-delay: 0.45s; }
    .system-when-r2 { animation-delay: 0.90s; }
    .system-when-r3 { animation-delay: 1.35s; }
    .system-when-r4 { animation-delay: 1.80s; }
    .system-when-row { animation: system-when-reveal 7.3s ease-in-out infinite; }
    @keyframes system-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="system-when-bg" width="980" height="390"/>
  <text class="system-when-h1"  x="30" y="40">When a rigorous system prompt pays</text>
  <text class="system-when-sub" x="30" y="64">And when it is overhead.</text>
  <rect class="system-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="system-when-name" x="46" y="122">Invest in it</text>
  <text class="system-when-desc" x="46" y="142">Four cases.</text>
  <text class="system-when-desc system-when-row system-when-r0" x="46" y="182">A user-facing product</text>
  <text class="system-when-desc system-when-row system-when-r1" x="46" y="216">Regulated or sensitive domains</text>
  <text class="system-when-desc system-when-row system-when-r2" x="46" y="250">Where tone is part of the brand</text>
  <text class="system-when-desc system-when-row system-when-r3" x="46" y="284">Multi-turn conversations</text>
  <text class="system-when-desc system-when-row system-when-r4" x="46" y="318">And where behaviour must be auditable</text>
  <rect class="system-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="system-when-name" x="526" y="122">Keep it short</text>
  <text class="system-when-desc" x="526" y="142">Also four.</text>
  <text class="system-when-desc system-when-row system-when-r0" x="526" y="182">Single-shot extraction or classification</text>
  <text class="system-when-desc system-when-row system-when-r1" x="526" y="216">Internal tooling</text>
  <text class="system-when-desc system-when-row system-when-r2" x="526" y="250">Where the task prompt says everything</text>
  <text class="system-when-desc system-when-row system-when-r3" x="526" y="284">High-volume, cost-sensitive calls</text>
  <text class="system-when-desc system-when-row system-when-r4" x="526" y="318">Where every token is billed millions of times</text>
  <text class="system-when-sub" x="30" y="372">For a high-volume classification call, a long system prompt is pure cost: the task prompt already fully determines the behaviour, and the persona does nothing.</text>
</svg>
