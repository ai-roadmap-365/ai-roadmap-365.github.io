<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each has one tool that answers it.">
  <title>Five gates, in order, stop at the first no</title>
  <style>
    .five-gates-bg   { fill: #f8fafc; }
    .five-gates-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .five-gates-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .five-gates-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .five-gates-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .five-gates-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .five-gates-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .five-gates-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .five-gates-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .five-gates-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .five-gates-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .five-gates-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .five-gates-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .five-gates-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .five-gates-stage { opacity: 1; }

    .five-gates-s0 { animation-delay: 0.00s; }
    .five-gates-e0 { animation-delay: 0.00s; }
    .five-gates-s1 { animation-delay: 1.33s; }
    .five-gates-e1 { animation-delay: 1.33s; }
    .five-gates-s2 { animation-delay: 2.67s; }
    .five-gates-e2 { animation-delay: 2.67s; }
    .five-gates-s3 { animation-delay: 4.00s; }
    .five-gates-e3 { animation-delay: 4.00s; }
    .five-gates-s4 { animation-delay: 5.33s; }
    .five-gates-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .five-gates-conn  { animation: five-gates-trace 8s ease-in-out infinite; }
      .five-gates-stage { animation: five-gates-arrive 8s ease-in-out infinite; }
    }
    @keyframes five-gates-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes five-gates-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .five-gates-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .five-gates-stage { animation: five-gates-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes five-gates-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="five-gates-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="five-gates-bg" width="980" height="322"/>
  <text class="five-gates-h1"  x="30" y="40">Five gates, in order, stop at the first no</text>
  <text class="five-gates-sub" x="30" y="64">Each has one tool that answers it.</text>
  <g class="five-gates-stage five-gates-s0">
    <rect class="five-gates-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="five-gates-step" x="44" y="142">01</text>
    <text class="five-gates-name" x="70" y="142">Did the name resolve?</text>
    <text class="five-gates-desc" x="44" y="166">dig, or curl's first *</text>
    <text class="five-gates-desc" x="44" y="182">line. A typo lives here.</text>
    <text class="five-gates-edge" x="44" y="242">DNS</text>
  </g>
  <line class="five-gates-line five-gates-conn five-gates-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#five-gates-tip)"/>
  <g class="five-gates-stage five-gates-s1">
    <rect class="five-gates-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="five-gates-step" x="233" y="142">02</text>
    <text class="five-gates-name" x="259" y="142">Did the connection open?</text>
    <text class="five-gates-desc" x="233" y="166">Service down, wrong port,</text>
    <text class="five-gates-desc" x="233" y="182">or a firewall dropping</text>
    <text class="five-gates-desc" x="233" y="198">packets.</text>
    <text class="five-gates-edge" x="233" y="242">TCP</text>
  </g>
  <line class="five-gates-line five-gates-conn five-gates-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#five-gates-tip)"/>
  <g class="five-gates-stage five-gates-s2">
    <rect class="five-gates-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="five-gates-step" x="422" y="142">03</text>
    <text class="five-gates-name" x="448" y="142">Did TLS succeed?</text>
    <text class="five-gates-desc" x="422" y="166">Expired, untrusted, or</text>
    <text class="five-gates-desc" x="422" y="182">wrong hostname on the</text>
    <text class="five-gates-desc" x="422" y="198">certificate.</text>
    <text class="five-gates-edge" x="422" y="242">TLS</text>
  </g>
  <line class="five-gates-line five-gates-conn five-gates-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#five-gates-tip)"/>
  <g class="five-gates-stage five-gates-s3">
    <rect class="five-gates-warn" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="five-gates-step" x="611" y="142">04</text>
    <text class="five-gates-name" x="637" y="142">What status came back?</text>
    <text class="five-gates-desc" x="611" y="166">4xx is your request. 5xx</text>
    <text class="five-gates-desc" x="611" y="182">is their server.</text>
    <text class="five-gates-edge" x="611" y="242">HTTP</text>
  </g>
  <line class="five-gates-line five-gates-conn five-gates-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#five-gates-tip)"/>
  <g class="five-gates-stage five-gates-s4">
    <rect class="five-gates-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="five-gates-step" x="800" y="142">05</text>
    <text class="five-gates-name" x="826" y="142">Is the body the right shape?</text>
    <text class="five-gates-desc" x="800" y="166">Only ask once you have a</text>
    <text class="five-gates-desc" x="800" y="182">2xx.</text>
    <text class="five-gates-edge" x="800" y="242">payload</text>
  </g>
  <text class="five-gates-sub" x="30" y="304">Walking these in order is what stops you rewriting request-sending code to fix a DNS problem, which is the single most common wasted afternoon in this work.</text>
</svg>
