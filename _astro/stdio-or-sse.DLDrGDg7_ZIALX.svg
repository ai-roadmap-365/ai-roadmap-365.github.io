<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Local subprocess, or a remote stream.">
  <title>Two transports</title>
  <style>
    .stdio-or-sse-bg   { fill: #f8fafc; }
    .stdio-or-sse-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stdio-or-sse-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stdio-or-sse-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stdio-or-sse-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stdio-or-sse-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stdio-or-sse-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stdio-or-sse-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stdio-or-sse-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stdio-or-sse-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stdio-or-sse-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stdio-or-sse-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stdio-or-sse-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stdio-or-sse-row { opacity: 1; }
    .stdio-or-sse-r0 { animation-delay: 0.00s; }
    .stdio-or-sse-r1 { animation-delay: 0.45s; }
    .stdio-or-sse-r2 { animation-delay: 0.90s; }
    .stdio-or-sse-r3 { animation-delay: 1.35s; }
    .stdio-or-sse-r4 { animation-delay: 1.80s; }
    .stdio-or-sse-row { animation: stdio-or-sse-reveal 7.3s ease-in-out infinite; }
    @keyframes stdio-or-sse-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="stdio-or-sse-bg" width="980" height="390"/>
  <text class="stdio-or-sse-h1"  x="30" y="40">Two transports</text>
  <text class="stdio-or-sse-sub" x="30" y="64">Local subprocess, or a remote stream.</text>
  <rect class="stdio-or-sse-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="stdio-or-sse-name" x="46" y="122">stdio</text>
  <text class="stdio-or-sse-desc" x="46" y="142">A local child process.</text>
  <text class="stdio-or-sse-desc stdio-or-sse-row stdio-or-sse-r0" x="46" y="182">The host spawns the server</text>
  <text class="stdio-or-sse-desc stdio-or-sse-row stdio-or-sse-r1" x="46" y="216">Newline-delimited JSON over pipes</text>
  <text class="stdio-or-sse-desc stdio-or-sse-row stdio-or-sse-r2" x="46" y="250">Under 0.5 ms, no network stack</text>
  <text class="stdio-or-sse-desc stdio-or-sse-row stdio-or-sse-r3" x="46" y="284">Zero network attack surface</text>
  <text class="stdio-or-sse-desc stdio-or-sse-row stdio-or-sse-r4" x="46" y="318">Lifecycle coupled: host exits, server exits</text>
  <rect class="stdio-or-sse-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="stdio-or-sse-name" x="526" y="122">SSE over HTTP</text>
  <text class="stdio-or-sse-desc" x="526" y="142">A remote server.</text>
  <text class="stdio-or-sse-desc stdio-or-sse-row stdio-or-sse-r0" x="526" y="182">A GET to /sse for streaming notifications</text>
  <text class="stdio-or-sse-desc stdio-or-sse-row stdio-or-sse-r1" x="526" y="216">POSTs to /messages for requests</text>
  <text class="stdio-or-sse-desc stdio-or-sse-row stdio-or-sse-r2" x="526" y="250">Works across machines and containers</text>
  <text class="stdio-or-sse-desc stdio-or-sse-row stdio-or-sse-r3" x="526" y="284">Needs auth, TLS and network policy</text>
  <text class="stdio-or-sse-desc stdio-or-sse-row stdio-or-sse-r4" x="526" y="318">Lifecycle is yours to manage</text>
  <text class="stdio-or-sse-sub" x="30" y="372">For local developer tooling stdio is almost always right, and the automatic lifecycle coupling is a larger practical benefit than the latency: nothing is left running after the host closes.</text>
</svg>
