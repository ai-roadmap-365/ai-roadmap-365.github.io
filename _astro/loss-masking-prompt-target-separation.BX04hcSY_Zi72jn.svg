<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-label="Loss Masking Prompt Target Separation">
  <title>Loss Masking Prompt Target Separation</title>
  <rect width="100%" height="100%" fill="#f8fafc" />
  
    <style>
      .d276f-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d276f-header { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .d276f-text { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .d276f-accent { fill: #1d4ed8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .d276f-arrow { stroke: #1d4ed8; stroke-width: 2; stroke-linecap: round; marker-end: url(#d276f-arrowhead); }
      .d276f-pulse { animation: d276f-glow 2.5s infinite ease-in-out; }
      @keyframes d276f-glow {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(29, 78, 216, 0.2)); }
        50% { filter: drop-shadow(0 0 6px rgba(29, 78, 216, 0.6)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .d276f-pulse { animation: none; }
      }
    </style>
    
  
    <defs>
      <marker id="d276f-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8" />
      </marker>
    </defs>
    
  
  <g transform="translate(60, 40)">
    <rect class="d276f-box" x="0" y="0" width="300" height="180" />
    <text class="d276f-header" x="20" y="35">Input Prompt (Label Mask = -100)</text>
    <text class="d276f-text" x="20" y="65">&lt;|im_start|&gt;system</text>
    <text class="d276f-text" x="20" y="90">You are a SQL engine.&lt;|im_end|&gt;</text>
    <text class="d276f-text" x="20" y="115">&lt;|im_start|&gt;user</text>
    <text class="d276f-text" x="20" y="140">List all users.&lt;|im_end|&gt;</text>
    <text class="d276f-accent" x="20" y="165">LOSS: 0.0 (Ignored)</text>
  </g>
  <g transform="translate(420, 40)">
    <rect class="d276f-box d276f-pulse" x="0" y="0" width="320" height="180" />
    <text class="d276f-header" x="20" y="35">Target Output (Label Mask = Token ID)</text>
    <text class="d276f-text" x="20" y="65">&lt;|im_start|&gt;assistant</text>
    <text class="d276f-text" x="20" y="90">SELECT id, name FROM users;&lt;|im_end|&gt;</text>
    <text class="d276f-accent" x="20" y="140">COMPUTE CROSS-ENTROPY LOSS</text>
    <text class="d276f-text" x="20" y="165">Backpropagate gradients here</text>
  </g>

</svg>