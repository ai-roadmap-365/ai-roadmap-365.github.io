<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One of them costs standby capacity.">
  <title>Four consequences of fast rollback</title>
  <style>
    .incident-implications-bg   { fill: #f8fafc; }
    .incident-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .incident-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .incident-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .incident-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .incident-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .incident-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .incident-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .incident-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .incident-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .incident-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .incident-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .incident-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .incident-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .incident-implications-stage { opacity: 1; }

    .incident-implications-s0 { animation-delay: 0.00s; }
    .incident-implications-e0 { animation-delay: 0.00s; }
    .incident-implications-s1 { animation-delay: 1.28s; }
    .incident-implications-e1 { animation-delay: 1.28s; }
    .incident-implications-s2 { animation-delay: 2.56s; }
    .incident-implications-e2 { animation-delay: 2.56s; }
    .incident-implications-s3 { animation-delay: 3.84s; }
    .incident-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .incident-implications-conn  { animation: incident-implications-trace 6.4s ease-in-out infinite; }
      .incident-implications-stage { animation: incident-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes incident-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes incident-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .incident-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .incident-implications-stage { animation: incident-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes incident-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="incident-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="incident-implications-bg" width="980" height="322"/>
  <text class="incident-implications-h1"  x="30" y="40">Four consequences of fast rollback</text>
  <text class="incident-implications-sub" x="30" y="64">One of them costs standby capacity.</text>
  <g class="incident-implications-stage incident-implications-s0">
    <rect class="incident-implications-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="incident-implications-step" x="44" y="142">01</text>
    <text class="incident-implications-name" x="70" y="142">Rotate secrets after an exposure</text>
    <text class="incident-implications-desc" x="44" y="166">A prompt injection that reached</text>
    <text class="incident-implications-desc" x="44" y="182">a key is a rotation,</text>
    <text class="incident-implications-desc" x="44" y="198">immediately.</text>
    <text class="incident-implications-edge" x="44" y="242">security</text>
  </g>
  <line class="incident-implications-line incident-implications-conn incident-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#incident-implications-tip)"/>
  <g class="incident-implications-stage incident-implications-s1">
    <rect class="incident-implications-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="incident-implications-step" x="280" y="142">02</text>
    <text class="incident-implications-name" x="306" y="142">A warm baseline costs idle capacity</text>
    <text class="incident-implications-desc" x="280" y="166">That idle capacity is what makes</text>
    <text class="incident-implications-desc" x="280" y="182">rollback instant.</text>
    <text class="incident-implications-edge" x="280" y="242">money</text>
  </g>
  <line class="incident-implications-line incident-implications-conn incident-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#incident-implications-tip)"/>
  <g class="incident-implications-stage incident-implications-s2">
    <rect class="incident-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="incident-implications-step" x="516" y="142">03</text>
    <text class="incident-implications-name" x="542" y="142">MTTR falls from 45 minutes to 500 ms</text>
    <text class="incident-implications-desc" x="516" y="166">Because no human is in the loop</text>
    <text class="incident-implications-desc" x="516" y="182">for the mitigation.</text>
    <text class="incident-implications-edge" x="516" y="242">reliability</text>
  </g>
  <line class="incident-implications-line incident-implications-conn incident-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#incident-implications-tip)"/>
  <g class="incident-implications-stage incident-implications-s3">
    <rect class="incident-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="incident-implications-step" x="752" y="142">04</text>
    <text class="incident-implications-name" x="778" y="142">Velocity rises with safety</text>
    <text class="incident-implications-desc" x="752" y="166">Teams that know a defect is</text>
    <text class="incident-implications-desc" x="752" y="182">caught and analysed blamelessly</text>
    <text class="incident-implications-desc" x="752" y="198">deploy more.</text>
  </g>
  <text class="incident-implications-sub" x="30" y="304">The last is the counter-intuitive one and the best argument for the whole practice: the organisations that ship fastest are the ones that made shipping safe to get wrong.</text>
</svg>
