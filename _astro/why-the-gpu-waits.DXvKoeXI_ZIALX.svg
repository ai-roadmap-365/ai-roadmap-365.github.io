<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The expensive hardware is idle because something cheaper cannot keep up.">
  <title>A GPU at 40% utilisation is not a GPU problem</title>
  <style>
    .why-the-gpu-waits-bg   { fill: #f8fafc; }
    .why-the-gpu-waits-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-the-gpu-waits-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-the-gpu-waits-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-the-gpu-waits-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-the-gpu-waits-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-the-gpu-waits-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .why-the-gpu-waits-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .why-the-gpu-waits-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .why-the-gpu-waits-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .why-the-gpu-waits-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .why-the-gpu-waits-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .why-the-gpu-waits-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .why-the-gpu-waits-row { opacity: 1; }
    .why-the-gpu-waits-r0 { animation-delay: 0.00s; }
    .why-the-gpu-waits-r1 { animation-delay: 0.45s; }
    .why-the-gpu-waits-r2 { animation-delay: 0.90s; }
    .why-the-gpu-waits-r3 { animation-delay: 1.35s; }
    .why-the-gpu-waits-r4 { animation-delay: 1.80s; }
    .why-the-gpu-waits-row { animation: why-the-gpu-waits-reveal 7.3s ease-in-out infinite; }
    @keyframes why-the-gpu-waits-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="why-the-gpu-waits-bg" width="980" height="390"/>
  <text class="why-the-gpu-waits-h1"  x="30" y="40">A GPU at 40% utilisation is not a GPU problem</text>
  <text class="why-the-gpu-waits-sub" x="30" y="64">The expensive hardware is idle because something cheaper cannot keep up.</text>
  <rect class="why-the-gpu-waits-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="why-the-gpu-waits-name" x="46" y="122">GPU-bound</text>
  <text class="why-the-gpu-waits-desc" x="46" y="142">The accelerator is the limit</text>
  <text class="why-the-gpu-waits-desc why-the-gpu-waits-row why-the-gpu-waits-r0" x="46" y="182">Utilisation sits near 100%</text>
  <text class="why-the-gpu-waits-desc why-the-gpu-waits-row why-the-gpu-waits-r1" x="46" y="216">The maths itself is the bottleneck</text>
  <text class="why-the-gpu-waits-desc why-the-gpu-waits-row why-the-gpu-waits-r2" x="46" y="250">Fix: a bigger batch, a faster card, or fewer parameters</text>
  <text class="why-the-gpu-waits-desc why-the-gpu-waits-row why-the-gpu-waits-r3" x="46" y="284">This is the state you want to be in</text>
  <text class="why-the-gpu-waits-desc why-the-gpu-waits-row why-the-gpu-waits-r4" x="46" y="318">You are paying for what you are using</text>
  <rect class="why-the-gpu-waits-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="why-the-gpu-waits-name" x="526" y="122">CPU-bound</text>
  <text class="why-the-gpu-waits-desc" x="526" y="142">The accelerator is waiting</text>
  <text class="why-the-gpu-waits-desc why-the-gpu-waits-row why-the-gpu-waits-r0" x="526" y="182">Utilisation sawtooths, often under 50%</text>
  <text class="why-the-gpu-waits-desc why-the-gpu-waits-row why-the-gpu-waits-r1" x="526" y="216">Data loading and preprocessing cannot keep pace</text>
  <text class="why-the-gpu-waits-desc why-the-gpu-waits-row why-the-gpu-waits-r2" x="526" y="250">A faster GPU changes nothing at all</text>
  <text class="why-the-gpu-waits-desc why-the-gpu-waits-row why-the-gpu-waits-r3" x="526" y="284">Fix: more loader workers, cheaper preprocessing</text>
  <text class="why-the-gpu-waits-desc why-the-gpu-waits-row why-the-gpu-waits-r4" x="526" y="318">You are paying for idle silicon</text>
  <text class="why-the-gpu-waits-sub" x="30" y="372">Pipelining is the same idea one level up: overlap loading the next batch with computing on the current one.</text>
</svg>
