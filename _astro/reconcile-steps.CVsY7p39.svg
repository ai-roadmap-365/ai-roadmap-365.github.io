<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And the guard is the important one.">
  <title>Five steps to reconcile</title>
  <style>
    .reconcile-steps-bg   { fill: #f8fafc; }
    .reconcile-steps-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reconcile-steps-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reconcile-steps-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reconcile-steps-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reconcile-steps-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reconcile-steps-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .reconcile-steps-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .reconcile-steps-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .reconcile-steps-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .reconcile-steps-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .reconcile-steps-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .reconcile-steps-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .reconcile-steps-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .reconcile-steps-stage { opacity: 1; }

    .reconcile-steps-s0 { animation-delay: 0.00s; }
    .reconcile-steps-e0 { animation-delay: 0.00s; }
    .reconcile-steps-s1 { animation-delay: 1.33s; }
    .reconcile-steps-e1 { animation-delay: 1.33s; }
    .reconcile-steps-s2 { animation-delay: 2.67s; }
    .reconcile-steps-e2 { animation-delay: 2.67s; }
    .reconcile-steps-s3 { animation-delay: 4.00s; }
    .reconcile-steps-e3 { animation-delay: 4.00s; }
    .reconcile-steps-s4 { animation-delay: 5.33s; }
    .reconcile-steps-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .reconcile-steps-conn  { animation: reconcile-steps-trace 8s ease-in-out infinite; }
      .reconcile-steps-stage { animation: reconcile-steps-arrive 8s ease-in-out infinite; }
    }
    @keyframes reconcile-steps-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes reconcile-steps-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .reconcile-steps-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .reconcile-steps-stage { animation: reconcile-steps-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes reconcile-steps-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="reconcile-steps-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="reconcile-steps-bg" width="980" height="322"/>
  <text class="reconcile-steps-h1"  x="30" y="40">Five steps to reconcile</text>
  <text class="reconcile-steps-sub" x="30" y="64">And the guard is the important one.</text>
  <g class="reconcile-steps-stage reconcile-steps-s0">
    <rect class="reconcile-steps-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="reconcile-steps-step" x="44" y="142">01</text>
    <text class="reconcile-steps-name" x="70" y="142">Enumerate both sides</text>
    <text class="reconcile-steps-desc" x="44" y="166">Ids and versions. Version</text>
    <text class="reconcile-steps-desc" x="44" y="182">means a content hash in</text>
    <text class="reconcile-steps-desc" x="44" y="198">production.</text>
  </g>
  <line class="reconcile-steps-line reconcile-steps-conn reconcile-steps-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#reconcile-steps-tip)"/>
  <g class="reconcile-steps-stage reconcile-steps-s1">
    <rect class="reconcile-steps-warn" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="reconcile-steps-step" x="233" y="142">02</text>
    <text class="reconcile-steps-name" x="259" y="142">Compare over the union</text>
    <text class="reconcile-steps-desc" x="233" y="166">Iterating only the source</text>
    <text class="reconcile-steps-desc" x="233" y="182">is the commonest mistake,</text>
    <text class="reconcile-steps-desc" x="233" y="198">and hides orphans</text>
  </g>
  <line class="reconcile-steps-line reconcile-steps-conn reconcile-steps-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#reconcile-steps-tip)"/>
  <g class="reconcile-steps-stage reconcile-steps-s2">
    <rect class="reconcile-steps-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="reconcile-steps-step" x="422" y="142">03</text>
    <text class="reconcile-steps-name" x="448" y="142">Measure ages, not counts</text>
    <text class="reconcile-steps-desc" x="422" y="166">One document stale by</text>
    <text class="reconcile-steps-desc" x="422" y="182">thirty seconds and one by</text>
    <text class="reconcile-steps-desc" x="422" y="198">three weeks are the same</text>
  </g>
  <line class="reconcile-steps-line reconcile-steps-conn reconcile-steps-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#reconcile-steps-tip)"/>
  <g class="reconcile-steps-stage reconcile-steps-s3">
    <rect class="reconcile-steps-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="reconcile-steps-step" x="611" y="142">04</text>
    <text class="reconcile-steps-name" x="637" y="142">Guard the deletes</text>
    <text class="reconcile-steps-desc" x="611" y="166">Sanity-check the</text>
    <text class="reconcile-steps-desc" x="611" y="182">proportion before acting</text>
    <text class="reconcile-steps-desc" x="611" y="198">on orphans.</text>
    <text class="reconcile-steps-edge" x="611" y="242">the guard</text>
  </g>
  <line class="reconcile-steps-line reconcile-steps-conn reconcile-steps-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#reconcile-steps-tip)"/>
  <g class="reconcile-steps-stage reconcile-steps-s4">
    <rect class="reconcile-steps-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="reconcile-steps-step" x="800" y="142">05</text>
    <text class="reconcile-steps-name" x="826" y="142">Reconcile, then compare again</text>
    <text class="reconcile-steps-desc" x="800" y="166">A correct reconciliation</text>
    <text class="reconcile-steps-desc" x="800" y="182">is idempotent. The second</text>
    <text class="reconcile-steps-desc" x="800" y="198">run should do nothing.</text>
  </g>
  <text class="reconcile-steps-sub" x="30" y="304">The second comparison is worth building in permanently: a reconciler that does not converge is telling you its notion of "same version" disagrees with the writer's, which is a bug worth knowing about.</text>
</svg>
