<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Synthetic data with rejection</title>
  <style>
    .rejection-sampling-bg   { fill: #f8fafc; }
    .rejection-sampling-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rejection-sampling-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rejection-sampling-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rejection-sampling-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rejection-sampling-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rejection-sampling-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rejection-sampling-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rejection-sampling-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rejection-sampling-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rejection-sampling-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rejection-sampling-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rejection-sampling-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .rejection-sampling-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .rejection-sampling-stage { opacity: 1; }

    .rejection-sampling-s0 { animation-delay: 0.00s; }
    .rejection-sampling-e0 { animation-delay: 0.00s; }
    .rejection-sampling-s1 { animation-delay: 1.28s; }
    .rejection-sampling-e1 { animation-delay: 1.28s; }
    .rejection-sampling-s2 { animation-delay: 2.56s; }
    .rejection-sampling-e2 { animation-delay: 2.56s; }
    .rejection-sampling-s3 { animation-delay: 3.84s; }
    .rejection-sampling-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .rejection-sampling-conn  { animation: rejection-sampling-trace 6.4s ease-in-out infinite; }
      .rejection-sampling-stage { animation: rejection-sampling-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes rejection-sampling-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes rejection-sampling-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .rejection-sampling-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .rejection-sampling-stage { animation: rejection-sampling-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes rejection-sampling-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="rejection-sampling-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="rejection-sampling-bg" width="980" height="322"/>
  <text class="rejection-sampling-h1"  x="30" y="40">Synthetic data with rejection</text>
  <text class="rejection-sampling-sub" x="30" y="64">Four steps.</text>
  <g class="rejection-sampling-stage rejection-sampling-s0">
    <rect class="rejection-sampling-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="rejection-sampling-step" x="44" y="142">01</text>
    <text class="rejection-sampling-name" x="70" y="142">Generate candidate examples with a strong model</text>
    <text class="rejection-sampling-desc" x="44" y="166">Many more than you need.</text>
  </g>
  <line class="rejection-sampling-line rejection-sampling-conn rejection-sampling-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#rejection-sampling-tip)"/>
  <g class="rejection-sampling-stage rejection-sampling-s1">
    <rect class="rejection-sampling-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="rejection-sampling-step" x="280" y="142">02</text>
    <text class="rejection-sampling-name" x="306" y="142">Verify each one</text>
    <text class="rejection-sampling-desc" x="280" y="166">By execution, by a checker, or</text>
    <text class="rejection-sampling-desc" x="280" y="182">by a second model.</text>
  </g>
  <line class="rejection-sampling-line rejection-sampling-conn rejection-sampling-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#rejection-sampling-tip)"/>
  <g class="rejection-sampling-stage rejection-sampling-s2">
    <rect class="rejection-sampling-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="rejection-sampling-step" x="516" y="142">03</text>
    <text class="rejection-sampling-name" x="542" y="142">Discard everything that fails</text>
    <text class="rejection-sampling-desc" x="516" y="166">Often most of them, which is</text>
    <text class="rejection-sampling-desc" x="516" y="182">fine.</text>
  </g>
  <line class="rejection-sampling-line rejection-sampling-conn rejection-sampling-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#rejection-sampling-tip)"/>
  <g class="rejection-sampling-stage rejection-sampling-s3">
    <rect class="rejection-sampling-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="rejection-sampling-step" x="752" y="142">04</text>
    <text class="rejection-sampling-name" x="778" y="142">And keep what survives</text>
    <text class="rejection-sampling-desc" x="752" y="166">A smaller, verified, consistent</text>
    <text class="rejection-sampling-desc" x="752" y="182">set.</text>
    <text class="rejection-sampling-edge" x="752" y="242">quality over volume</text>
  </g>
  <text class="rejection-sampling-sub" x="30" y="304">The rejection step is what separates this from simply generating data: unfiltered synthetic examples reliably make a fine-tune worse rather than better.</text>
</svg>
