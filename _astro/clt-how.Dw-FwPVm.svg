<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>What the central limit theorem says</title>
  <style>
    .clt-how-bg   { fill: #f8fafc; }
    .clt-how-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clt-how-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clt-how-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clt-how-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clt-how-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clt-how-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .clt-how-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .clt-how-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .clt-how-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .clt-how-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .clt-how-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .clt-how-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .clt-how-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .clt-how-stage { opacity: 1; }

    .clt-how-s0 { animation-delay: 0.00s; }
    .clt-how-e0 { animation-delay: 0.00s; }
    .clt-how-s1 { animation-delay: 1.28s; }
    .clt-how-e1 { animation-delay: 1.28s; }
    .clt-how-s2 { animation-delay: 2.56s; }
    .clt-how-e2 { animation-delay: 2.56s; }
    .clt-how-s3 { animation-delay: 3.84s; }
    .clt-how-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .clt-how-conn  { animation: clt-how-trace 6.4s ease-in-out infinite; }
      .clt-how-stage { animation: clt-how-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes clt-how-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes clt-how-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .clt-how-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .clt-how-stage { animation: clt-how-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes clt-how-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="clt-how-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="clt-how-bg" width="980" height="322"/>
  <text class="clt-how-h1"  x="30" y="40">What the central limit theorem says</text>
  <text class="clt-how-sub" x="30" y="64">Four steps.</text>
  <g class="clt-how-stage clt-how-s0">
    <rect class="clt-how-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="clt-how-step" x="44" y="142">01</text>
    <text class="clt-how-name" x="70" y="142">Draw many samples of the same size</text>
    <text class="clt-how-desc" x="44" y="166">Each gives a slightly different</text>
    <text class="clt-how-desc" x="44" y="182">mean.</text>
  </g>
  <line class="clt-how-line clt-how-conn clt-how-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#clt-how-tip)"/>
  <g class="clt-how-stage clt-how-s1">
    <rect class="clt-how-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="clt-how-step" x="280" y="142">02</text>
    <text class="clt-how-name" x="306" y="142">Collect those means into their own distribution</text>
    <text class="clt-how-desc" x="280" y="166">The sampling distribution.</text>
  </g>
  <line class="clt-how-line clt-how-conn clt-how-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#clt-how-tip)"/>
  <g class="clt-how-stage clt-how-s2">
    <rect class="clt-how-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="clt-how-step" x="516" y="142">03</text>
    <text class="clt-how-name" x="542" y="142">Which becomes approximately normal</text>
    <text class="clt-how-desc" x="516" y="166">Whatever the population's shape.</text>
  </g>
  <line class="clt-how-line clt-how-conn clt-how-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#clt-how-tip)"/>
  <g class="clt-how-stage clt-how-s3">
    <rect class="clt-how-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="clt-how-step" x="752" y="142">04</text>
    <text class="clt-how-name" x="778" y="142">And narrows as the square root of sample size</text>
    <text class="clt-how-desc" x="752" y="166">So four times the data halves</text>
    <text class="clt-how-desc" x="752" y="182">the error.</text>
  </g>
  <text class="clt-how-sub" x="30" y="304">The square-root relationship sets expectations correctly: halving your uncertainty requires quadrupling your data, which is often the decisive practical constraint.</text>
</svg>
