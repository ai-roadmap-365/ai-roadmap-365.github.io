<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The engine takes as much as it can, then gives back only if it must.">
  <title>Why &lt;.*&gt; matches far more than you meant</title>
  <style>
    .greedy-versus-lazy-bg   { fill: #f8fafc; }
    .greedy-versus-lazy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .greedy-versus-lazy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .greedy-versus-lazy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .greedy-versus-lazy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .greedy-versus-lazy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .greedy-versus-lazy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .greedy-versus-lazy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .greedy-versus-lazy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .greedy-versus-lazy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .greedy-versus-lazy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .greedy-versus-lazy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .greedy-versus-lazy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .greedy-versus-lazy-row { opacity: 1; }
    .greedy-versus-lazy-r0 { animation-delay: 0.00s; }
    .greedy-versus-lazy-r1 { animation-delay: 0.45s; }
    .greedy-versus-lazy-r2 { animation-delay: 0.90s; }
    .greedy-versus-lazy-r3 { animation-delay: 1.35s; }
    .greedy-versus-lazy-r4 { animation-delay: 1.80s; }
    .greedy-versus-lazy-row { animation: greedy-versus-lazy-reveal 7.3s ease-in-out infinite; }
    @keyframes greedy-versus-lazy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="greedy-versus-lazy-bg" width="980" height="390"/>
  <text class="greedy-versus-lazy-h1"  x="30" y="40">Why &lt;.*&gt; matches far more than you meant</text>
  <text class="greedy-versus-lazy-sub" x="30" y="64">The engine takes as much as it can, then gives back only if it must.</text>
  <rect class="greedy-versus-lazy-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="greedy-versus-lazy-name" x="46" y="122">&lt;.*&gt;  — greedy</text>
  <text class="greedy-versus-lazy-desc" x="46" y="142">Takes everything it can</text>
  <text class="greedy-versus-lazy-desc greedy-versus-lazy-row greedy-versus-lazy-r0" x="46" y="182">Input: &lt;b&gt;bold&lt;/b&gt; and &lt;i&gt;italic&lt;/i&gt;</text>
  <text class="greedy-versus-lazy-desc greedy-versus-lazy-row greedy-versus-lazy-r1" x="46" y="216">Matches the WHOLE line, angle to angle</text>
  <text class="greedy-versus-lazy-desc greedy-versus-lazy-row greedy-versus-lazy-r2" x="46" y="250">.* runs to the end, then backtracks to the last &gt;</text>
  <text class="greedy-versus-lazy-desc greedy-versus-lazy-row greedy-versus-lazy-r3" x="46" y="284">One match, not four</text>
  <text class="greedy-versus-lazy-desc greedy-versus-lazy-row greedy-versus-lazy-r4" x="46" y="318">Almost never what you wanted</text>
  <rect class="greedy-versus-lazy-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="greedy-versus-lazy-name" x="526" y="122">&lt;.*?&gt;  — lazy</text>
  <text class="greedy-versus-lazy-desc" x="526" y="142">Takes as little as it can</text>
  <text class="greedy-versus-lazy-desc greedy-versus-lazy-row greedy-versus-lazy-r0" x="526" y="182">Same input</text>
  <text class="greedy-versus-lazy-desc greedy-versus-lazy-row greedy-versus-lazy-r1" x="526" y="216">Matches &lt;b&gt;, then &lt;/b&gt;, then &lt;i&gt;, then &lt;/i&gt;</text>
  <text class="greedy-versus-lazy-desc greedy-versus-lazy-row greedy-versus-lazy-r2" x="526" y="250">.*? stops at the first &gt; that lets the match succeed</text>
  <text class="greedy-versus-lazy-desc greedy-versus-lazy-row greedy-versus-lazy-r3" x="526" y="284">Four matches</text>
  <text class="greedy-versus-lazy-desc greedy-versus-lazy-row greedy-versus-lazy-r4" x="526" y="318">Usually what you meant</text>
  <text class="greedy-versus-lazy-sub" x="30" y="372">Nested quantifiers on hostile input can force near-exponential backtracking — a way to hang a process, not just slow it.</text>
</svg>
