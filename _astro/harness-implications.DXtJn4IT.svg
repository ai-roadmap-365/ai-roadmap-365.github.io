<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Cost now, and what it prevents.">
  <title>Four consequences of discipline</title>
  <style>
    .harness-implications-bg   { fill: #f8fafc; }
    .harness-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .harness-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .harness-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .harness-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .harness-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .harness-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .harness-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .harness-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .harness-implications-stage { opacity: 1; }

    .harness-implications-s0 { animation-delay: 0.00s; }
    .harness-implications-e0 { animation-delay: 0.00s; }
    .harness-implications-s1 { animation-delay: 1.28s; }
    .harness-implications-e1 { animation-delay: 1.28s; }
    .harness-implications-s2 { animation-delay: 2.56s; }
    .harness-implications-e2 { animation-delay: 2.56s; }
    .harness-implications-s3 { animation-delay: 3.84s; }
    .harness-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .harness-implications-conn  { animation: harness-implications-trace 6.4s ease-in-out infinite; }
      .harness-implications-stage { animation: harness-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes harness-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes harness-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .harness-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .harness-implications-stage { animation: harness-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes harness-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="harness-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="harness-implications-bg" width="980" height="322"/>
  <text class="harness-implications-h1"  x="30" y="40">Four consequences of discipline</text>
  <text class="harness-implications-sub" x="30" y="64">Cost now, and what it prevents.</text>
  <g class="harness-implications-stage harness-implications-s0">
    <rect class="harness-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="harness-implications-step" x="44" y="142">01</text>
    <text class="harness-implications-name" x="70" y="142">Determinism costs some speed</text>
    <text class="harness-implications-desc" x="44" y="166">Deterministic kernels are</text>
    <text class="harness-implications-desc" x="44" y="182">slower. Worth it for a result</text>
    <text class="harness-implications-desc" x="44" y="198">you must defend.</text>
  </g>
  <line class="harness-implications-line harness-implications-conn harness-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#harness-implications-tip)"/>
  <g class="harness-implications-stage harness-implications-s1">
    <rect class="harness-implications-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="harness-implications-step" x="280" y="142">02</text>
    <text class="harness-implications-name" x="306" y="142">Resumption saves days</text>
    <text class="harness-implications-desc" x="280" y="166">A multi-day run that dies at</text>
    <text class="harness-implications-desc" x="280" y="182">hour forty resumes rather than</text>
    <text class="harness-implications-desc" x="280" y="198">restarts.</text>
  </g>
  <line class="harness-implications-line harness-implications-conn harness-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#harness-implications-tip)"/>
  <g class="harness-implications-stage harness-implications-s2">
    <rect class="harness-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="harness-implications-step" x="516" y="142">03</text>
    <text class="harness-implications-name" x="542" y="142">Comparability is the real payoff</text>
    <text class="harness-implications-desc" x="516" y="166">Two runs differing in one</text>
    <text class="harness-implications-desc" x="516" y="182">parameter is an experiment;</text>
    <text class="harness-implications-desc" x="516" y="198">otherwise it is an anecdote.</text>
  </g>
  <line class="harness-implications-line harness-implications-conn harness-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#harness-implications-tip)"/>
  <g class="harness-implications-stage harness-implications-s3">
    <rect class="harness-implications-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="harness-implications-step" x="752" y="142">04</text>
    <text class="harness-implications-name" x="778" y="142">Export late is export never</text>
    <text class="harness-implications-desc" x="752" y="166">Deployment constraints</text>
    <text class="harness-implications-desc" x="752" y="182">discovered at the end are</text>
    <text class="harness-implications-desc" x="752" y="198">expensive.</text>
  </g>
  <text class="harness-implications-sub" x="30" y="304">The comparability point is the strongest argument for the whole practice: without controlled configuration, the difference between two runs cannot be attributed to the change you made.</text>
</svg>
