<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Pinning says what; signing says who.">
  <title>Signed images, verified at admission</title>
  <style>
    .signed-images-bg   { fill: #f8fafc; }
    .signed-images-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .signed-images-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .signed-images-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .signed-images-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .signed-images-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .signed-images-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .signed-images-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .signed-images-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .signed-images-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .signed-images-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .signed-images-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .signed-images-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .signed-images-row { opacity: 1; }
    .signed-images-r0 { animation-delay: 0.00s; }
    .signed-images-r1 { animation-delay: 0.45s; }
    .signed-images-r2 { animation-delay: 0.90s; }
    .signed-images-r3 { animation-delay: 1.35s; }
    .signed-images-r4 { animation-delay: 1.80s; }
    .signed-images-row { animation: signed-images-reveal 7.3s ease-in-out infinite; }
    @keyframes signed-images-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="signed-images-bg" width="980" height="390"/>
  <text class="signed-images-h1"  x="30" y="40">Signed images, verified at admission</text>
  <text class="signed-images-sub" x="30" y="64">Pinning says what; signing says who.</text>
  <rect class="signed-images-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="signed-images-name" x="46" y="122">Pinned by digest</text>
  <text class="signed-images-desc" x="46" y="142">Exact bytes.</text>
  <text class="signed-images-desc signed-images-row signed-images-r0" x="46" y="182">Immutable identity</text>
  <text class="signed-images-desc signed-images-row signed-images-r1" x="46" y="216">Reproducible deployments</text>
  <text class="signed-images-desc signed-images-row signed-images-r2" x="46" y="250">Day 330's supply-chain control</text>
  <text class="signed-images-desc signed-images-row signed-images-r3" x="46" y="284">Says which bytes</text>
  <text class="signed-images-desc signed-images-row signed-images-r4" x="46" y="318">Says nothing about who built them</text>
  <rect class="signed-images-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="signed-images-name" x="526" y="122">Signed and verified</text>
  <text class="signed-images-desc" x="526" y="142">Known provenance.</text>
  <text class="signed-images-desc signed-images-row signed-images-r0" x="526" y="182">Signed at build with Sigstore or Cosign</text>
  <text class="signed-images-desc signed-images-row signed-images-r1" x="526" y="216">Verified by an admission controller</text>
  <text class="signed-images-desc signed-images-row signed-images-r2" x="526" y="250">An unsigned image cannot run</text>
  <text class="signed-images-desc signed-images-row signed-images-r3" x="526" y="284">Says who built it, and when</text>
  <text class="signed-images-desc signed-images-row signed-images-r4" x="526" y="318">Catches an image nobody in your org produced</text>
  <text class="signed-images-sub" x="30" y="372">The two controls answer different questions and are usually deployed together: the digest guarantees you got what you asked for, and the signature guarantees you should have been asking for it.</text>
</svg>
