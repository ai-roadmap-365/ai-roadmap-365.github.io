<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And where it is not.">
  <title>Where the forward pass is the cost</title>
  <style>
    .forward-when-bg   { fill: #f8fafc; }
    .forward-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forward-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forward-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forward-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forward-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forward-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .forward-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .forward-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .forward-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .forward-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .forward-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .forward-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .forward-when-row { opacity: 1; }
    .forward-when-r0 { animation-delay: 0.00s; }
    .forward-when-r1 { animation-delay: 0.45s; }
    .forward-when-r2 { animation-delay: 0.90s; }
    .forward-when-r3 { animation-delay: 1.35s; }
    .forward-when-r4 { animation-delay: 1.80s; }
    .forward-when-row { animation: forward-when-reveal 7.3s ease-in-out infinite; }
    @keyframes forward-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="forward-when-bg" width="980" height="390"/>
  <text class="forward-when-h1"  x="30" y="40">Where the forward pass is the cost</text>
  <text class="forward-when-sub" x="30" y="64">And where it is not.</text>
  <rect class="forward-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="forward-when-name" x="46" y="122">Forward dominates</text>
  <text class="forward-when-desc" x="46" y="142">Inference, mostly.</text>
  <text class="forward-when-desc forward-when-row forward-when-r0" x="46" y="182">Serving a trained model</text>
  <text class="forward-when-desc forward-when-row forward-when-r1" x="46" y="216">Every request is one forward pass</text>
  <text class="forward-when-desc forward-when-row forward-when-r2" x="46" y="250">Latency is this arithmetic</text>
  <text class="forward-when-desc forward-when-row forward-when-r3" x="46" y="284">Batch size trades latency for throughput</text>
  <text class="forward-when-desc forward-when-row forward-when-r4" x="46" y="318">Optimise here for cost per request</text>
  <rect class="forward-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="forward-when-name" x="526" y="122">Something else dominates</text>
  <text class="forward-when-desc" x="526" y="142">Training, and data.</text>
  <text class="forward-when-desc forward-when-row forward-when-r0" x="526" y="182">Training: backward is roughly twice forward</text>
  <text class="forward-when-desc forward-when-row forward-when-r1" x="526" y="216">Data loading can starve the GPU entirely</text>
  <text class="forward-when-desc forward-when-row forward-when-r2" x="526" y="250">A pipeline bottleneck looks like a slow model</text>
  <text class="forward-when-desc forward-when-row forward-when-r3" x="526" y="284">Profile before optimising</text>
  <text class="forward-when-desc forward-when-row forward-when-r4" x="526" y="318">Day 209's discipline</text>
  <text class="forward-when-sub" x="30" y="372">The data-loading case is worth watching for specifically: a GPU at 30% utilisation is almost never a slow forward pass, it is a loader that cannot keep up.</text>
</svg>
