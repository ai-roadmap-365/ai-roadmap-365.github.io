<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A cost decision, made per request.">
  <title>Two resolution modes</title>
  <style>
    .detail-modes-bg   { fill: #f8fafc; }
    .detail-modes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .detail-modes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .detail-modes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .detail-modes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .detail-modes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .detail-modes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .detail-modes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .detail-modes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .detail-modes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .detail-modes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .detail-modes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .detail-modes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .detail-modes-row { opacity: 1; }
    .detail-modes-r0 { animation-delay: 0.00s; }
    .detail-modes-r1 { animation-delay: 0.45s; }
    .detail-modes-r2 { animation-delay: 0.90s; }
    .detail-modes-r3 { animation-delay: 1.35s; }
    .detail-modes-r4 { animation-delay: 1.80s; }
    .detail-modes-row { animation: detail-modes-reveal 7.3s ease-in-out infinite; }
    @keyframes detail-modes-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="detail-modes-bg" width="980" height="390"/>
  <text class="detail-modes-h1"  x="30" y="40">Two resolution modes</text>
  <text class="detail-modes-sub" x="30" y="64">A cost decision, made per request.</text>
  <rect class="detail-modes-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="detail-modes-name" x="46" y="122">Low detail</text>
  <text class="detail-modes-desc" x="46" y="142">One pass, few tokens.</text>
  <text class="detail-modes-desc detail-modes-row detail-modes-r0" x="46" y="182">A single downscaled view</text>
  <text class="detail-modes-desc detail-modes-row detail-modes-r1" x="46" y="216">A fixed, small token cost</text>
  <text class="detail-modes-desc detail-modes-row detail-modes-r2" x="46" y="250">Enough to say what the image is</text>
  <text class="detail-modes-desc detail-modes-row detail-modes-r3" x="46" y="284">Enough for classification</text>
  <text class="detail-modes-desc detail-modes-row detail-modes-r4" x="46" y="318">Not enough to read small text</text>
  <rect class="detail-modes-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="detail-modes-name" x="526" y="122">High detail</text>
  <text class="detail-modes-desc" x="526" y="142">Tiled, many tokens.</text>
  <text class="detail-modes-desc detail-modes-row detail-modes-r0" x="526" y="182">Tiled at full resolution</text>
  <text class="detail-modes-desc detail-modes-row detail-modes-r1" x="526" y="216">Cost scales with dimensions</text>
  <text class="detail-modes-desc detail-modes-row detail-modes-r2" x="526" y="250">Reads small text and fine structure</text>
  <text class="detail-modes-desc detail-modes-row detail-modes-r3" x="526" y="284">Needed for documents and charts</text>
  <text class="detail-modes-desc detail-modes-row detail-modes-r4" x="526" y="318">Many times the price</text>
  <text class="detail-modes-sub" x="30" y="372">Choosing the mode per request rather than globally is where the saving is: most images in a pipeline only need to be identified, and a few need to be read.</text>
</svg>
