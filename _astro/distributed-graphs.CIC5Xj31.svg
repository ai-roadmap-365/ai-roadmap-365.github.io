<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three requirements the local version hides.">
  <title>Distributing the graph</title>
  <style>
    .distributed-graphs-bg   { fill: #f8fafc; }
    .distributed-graphs-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distributed-graphs-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distributed-graphs-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distributed-graphs-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distributed-graphs-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distributed-graphs-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .distributed-graphs-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .distributed-graphs-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .distributed-graphs-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .distributed-graphs-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .distributed-graphs-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .distributed-graphs-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .distributed-graphs-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .distributed-graphs-stage { opacity: 1; }

    .distributed-graphs-s0 { animation-delay: 0.00s; }
    .distributed-graphs-e0 { animation-delay: 0.00s; }
    .distributed-graphs-s1 { animation-delay: 1.50s; }
    .distributed-graphs-e1 { animation-delay: 1.50s; }
    .distributed-graphs-s2 { animation-delay: 3.00s; }
    .distributed-graphs-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .distributed-graphs-conn  { animation: distributed-graphs-trace 6s ease-in-out infinite; }
      .distributed-graphs-stage { animation: distributed-graphs-arrive 6s ease-in-out infinite; }
    }
    @keyframes distributed-graphs-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes distributed-graphs-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .distributed-graphs-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .distributed-graphs-stage { animation: distributed-graphs-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes distributed-graphs-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="distributed-graphs-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="distributed-graphs-bg" width="980" height="322"/>
  <text class="distributed-graphs-h1"  x="30" y="40">Distributing the graph</text>
  <text class="distributed-graphs-sub" x="30" y="64">Three requirements the local version hides.</text>
  <g class="distributed-graphs-stage distributed-graphs-s0">
    <rect class="distributed-graphs-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="distributed-graphs-step" x="44" y="142">01</text>
    <text class="distributed-graphs-name" x="70" y="142">A transactional messaging backbone</text>
    <text class="distributed-graphs-desc" x="44" y="166">Kafka, SQS or Redis Streams. Not an</text>
    <text class="distributed-graphs-desc" x="44" y="182">in-process queue.</text>
    <text class="distributed-graphs-edge" x="44" y="242">durable</text>
  </g>
  <line class="distributed-graphs-line distributed-graphs-conn distributed-graphs-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#distributed-graphs-tip)"/>
  <g class="distributed-graphs-stage distributed-graphs-s1">
    <rect class="distributed-graphs-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="distributed-graphs-step" x="359" y="142">02</text>
    <text class="distributed-graphs-name" x="385" y="142">Strictly serialisable state</text>
    <text class="distributed-graphs-desc" x="359" y="166">No open connections, sockets or thread pools</text>
    <text class="distributed-graphs-desc" x="359" y="182">in the state dictionary.</text>
  </g>
  <line class="distributed-graphs-line distributed-graphs-conn distributed-graphs-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#distributed-graphs-tip)"/>
  <g class="distributed-graphs-stage distributed-graphs-s2">
    <rect class="distributed-graphs-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="distributed-graphs-step" x="674" y="142">03</text>
    <text class="distributed-graphs-name" x="700" y="142">Acquire resources inside nodes</text>
    <text class="distributed-graphs-desc" x="674" y="166">A connection pool created on demand,</text>
    <text class="distributed-graphs-desc" x="674" y="182">credentials from a vault.</text>
  </g>
  <text class="distributed-graphs-sub" x="30" y="304">The second requirement is the one that bites during migration: a graph that ran fine locally fails to checkpoint the moment somebody puts a live database handle into the state object.</text>
</svg>
