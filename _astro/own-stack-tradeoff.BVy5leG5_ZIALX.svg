<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="What you gain and take on.">
  <title>Owning the stack against renting it</title>
  <style>
    .own-stack-tradeoff-bg   { fill: #f8fafc; }
    .own-stack-tradeoff-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .own-stack-tradeoff-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .own-stack-tradeoff-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .own-stack-tradeoff-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .own-stack-tradeoff-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .own-stack-tradeoff-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .own-stack-tradeoff-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .own-stack-tradeoff-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .own-stack-tradeoff-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .own-stack-tradeoff-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .own-stack-tradeoff-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .own-stack-tradeoff-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .own-stack-tradeoff-row { opacity: 1; }
    .own-stack-tradeoff-r0 { animation-delay: 0.00s; }
    .own-stack-tradeoff-r1 { animation-delay: 0.45s; }
    .own-stack-tradeoff-r2 { animation-delay: 0.90s; }
    .own-stack-tradeoff-r3 { animation-delay: 1.35s; }
    .own-stack-tradeoff-r4 { animation-delay: 1.80s; }
    .own-stack-tradeoff-row { animation: own-stack-tradeoff-reveal 7.3s ease-in-out infinite; }
    @keyframes own-stack-tradeoff-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="own-stack-tradeoff-bg" width="980" height="390"/>
  <text class="own-stack-tradeoff-h1"  x="30" y="40">Owning the stack against renting it</text>
  <text class="own-stack-tradeoff-sub" x="30" y="64">What you gain and take on.</text>
  <rect class="own-stack-tradeoff-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="own-stack-tradeoff-name" x="46" y="122">Your own stack</text>
  <text class="own-stack-tradeoff-desc" x="46" y="142">Complete control.</text>
  <text class="own-stack-tradeoff-desc own-stack-tradeoff-row own-stack-tradeoff-r0" x="46" y="182">Data never leaves your infrastructure</text>
  <text class="own-stack-tradeoff-desc own-stack-tradeoff-row own-stack-tradeoff-r1" x="46" y="216">The model never changes underneath you</text>
  <text class="own-stack-tradeoff-desc own-stack-tradeoff-row own-stack-tradeoff-r2" x="46" y="250">No per-token cost</text>
  <text class="own-stack-tradeoff-desc own-stack-tradeoff-row own-stack-tradeoff-r3" x="46" y="284">Runs air-gapped</text>
  <text class="own-stack-tradeoff-desc own-stack-tradeoff-row own-stack-tradeoff-r4" x="46" y="318">Specialised to your task</text>
  <rect class="own-stack-tradeoff-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="own-stack-tradeoff-name" x="526" y="122">A hosted model</text>
  <text class="own-stack-tradeoff-desc" x="526" y="142">No operations.</text>
  <text class="own-stack-tradeoff-desc own-stack-tradeoff-row own-stack-tradeoff-r0" x="526" y="182">Frontier capability immediately</text>
  <text class="own-stack-tradeoff-desc own-stack-tradeoff-row own-stack-tradeoff-r1" x="526" y="216">Nothing to train or maintain</text>
  <text class="own-stack-tradeoff-desc own-stack-tradeoff-row own-stack-tradeoff-r2" x="526" y="250">Scales without planning</text>
  <text class="own-stack-tradeoff-desc own-stack-tradeoff-row own-stack-tradeoff-r3" x="526" y="284">Metered, and zero when idle</text>
  <text class="own-stack-tradeoff-desc own-stack-tradeoff-row own-stack-tradeoff-r4" x="526" y="318">General, not specialised</text>
  <text class="own-stack-tradeoff-sub" x="30" y="372">The version-stability row is easy to overlook and matters for anything that must behave identically next year as it does today.</text>
</svg>
