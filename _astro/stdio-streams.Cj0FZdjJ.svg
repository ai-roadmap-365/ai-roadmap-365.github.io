<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" font-family="system-ui, sans-serif">
  <title>A program's three standard streams — standard input, standard output, and standard error — and how pipes and redirects connect them</title>
  <rect x="0" y="0" width="780" height="470" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The three standard streams of every program</text>

  <!-- The program box in the center -->
  <rect x="300" y="180" width="180" height="110" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="390" y="230" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a202c">a program</text>
  <text x="390" y="256" text-anchor="middle" font-size="14" fill="#1a202c">(e.g. grep)</text>

  <!-- stdin from the left -->
  <rect x="30" y="205" width="150" height="60" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="105" y="230" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">standard input</text>
  <text x="105" y="251" text-anchor="middle" font-size="14" fill="#1a202c">stdin (fd 0)</text>
  <line x1="180" y1="235" x2="292" y2="235" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="300,235 286,228 286,242" fill="#1d4ed8"/>
  <text x="238" y="222" text-anchor="middle" font-size="13" fill="#1a202c">keyboard, a file (&lt;), or a pipe</text>

  <!-- stdout to the top-right -->
  <rect x="600" y="120" width="150" height="60" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="675" y="145" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">standard output</text>
  <text x="675" y="166" text-anchor="middle" font-size="14" fill="#1a202c">stdout (fd 1)</text>
  <line x1="480" y1="210" x2="596" y2="160" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="600,150 585,153 592,166" fill="#1d4ed8"/>
  <text x="548" y="205" text-anchor="middle" font-size="13" fill="#1a202c">results</text>

  <!-- stderr to the bottom-right -->
  <rect x="600" y="300" width="150" height="60" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="675" y="325" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">standard error</text>
  <text x="675" y="346" text-anchor="middle" font-size="14" fill="#1a202c">stderr (fd 2)</text>
  <line x1="480" y1="262" x2="596" y2="320" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="600,330 592,315 585,328" fill="#1d4ed8"/>
  <text x="548" y="312" text-anchor="middle" font-size="13" fill="#1a202c">error messages</text>

  <!-- Connectors legend -->
  <rect x="40" y="360" width="700" height="90" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="60" y="386" font-size="15" font-weight="bold" fill="#1a202c">How they connect:</text>
  <text x="60" y="410" font-size="14" fill="#1a202c">|  pipe: sends stdout into the next program's stdin.    &gt;  redirect stdout to a file (overwrite).</text>
  <text x="60" y="432" font-size="14" fill="#1a202c">&gt;&gt;  redirect stdout to a file (append).    &lt;  take stdin from a file.    2&gt;  redirect stderr to a file.</text>

  <!-- Note about why two output streams -->
  <text x="390" y="316" text-anchor="middle" font-size="13" fill="#1a202c">Two output streams keep results (stdout) separate from</text>
  <text x="390" y="334" text-anchor="middle" font-size="13" fill="#1a202c">diagnostics (stderr), so a pipe carries data, not error text.</text>
</svg>
