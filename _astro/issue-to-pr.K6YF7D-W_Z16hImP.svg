<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five phases, and phase two can halt it.">
  <title>The issue-to-PR pipeline</title>
  <style>
    .issue-to-pr-bg   { fill: #f8fafc; }
    .issue-to-pr-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .issue-to-pr-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .issue-to-pr-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .issue-to-pr-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .issue-to-pr-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .issue-to-pr-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .issue-to-pr-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .issue-to-pr-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .issue-to-pr-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .issue-to-pr-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .issue-to-pr-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .issue-to-pr-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .issue-to-pr-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .issue-to-pr-stage { opacity: 1; }

    .issue-to-pr-s0 { animation-delay: 0.00s; }
    .issue-to-pr-e0 { animation-delay: 0.00s; }
    .issue-to-pr-s1 { animation-delay: 1.33s; }
    .issue-to-pr-e1 { animation-delay: 1.33s; }
    .issue-to-pr-s2 { animation-delay: 2.67s; }
    .issue-to-pr-e2 { animation-delay: 2.67s; }
    .issue-to-pr-s3 { animation-delay: 4.00s; }
    .issue-to-pr-e3 { animation-delay: 4.00s; }
    .issue-to-pr-s4 { animation-delay: 5.33s; }
    .issue-to-pr-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .issue-to-pr-conn  { animation: issue-to-pr-trace 8s ease-in-out infinite; }
      .issue-to-pr-stage { animation: issue-to-pr-arrive 8s ease-in-out infinite; }
    }
    @keyframes issue-to-pr-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes issue-to-pr-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .issue-to-pr-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .issue-to-pr-stage { animation: issue-to-pr-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes issue-to-pr-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="issue-to-pr-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="issue-to-pr-bg" width="980" height="322"/>
  <text class="issue-to-pr-h1"  x="30" y="40">The issue-to-PR pipeline</text>
  <text class="issue-to-pr-sub" x="30" y="64">Five phases, and phase two can halt it.</text>
  <g class="issue-to-pr-stage issue-to-pr-s0">
    <rect class="issue-to-pr-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="issue-to-pr-step" x="44" y="142">01</text>
    <text class="issue-to-pr-name" x="70" y="142">Triage and scope</text>
    <text class="issue-to-pr-desc" x="44" y="166">Parse the issue, query</text>
    <text class="issue-to-pr-desc" x="44" y="182">the repo-map, decide if</text>
    <text class="issue-to-pr-desc" x="44" y="198">it is within the</text>
  </g>
  <line class="issue-to-pr-line issue-to-pr-conn issue-to-pr-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#issue-to-pr-tip)"/>
  <g class="issue-to-pr-stage issue-to-pr-s1">
    <rect class="issue-to-pr-warn" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="issue-to-pr-step" x="233" y="142">02</text>
    <text class="issue-to-pr-name" x="259" y="142">Write a reproduction test</text>
    <text class="issue-to-pr-desc" x="233" y="166">If it passes immediately,</text>
    <text class="issue-to-pr-desc" x="233" y="182">halt: the bug was not</text>
    <text class="issue-to-pr-desc" x="233" y="198">reproduced.</text>
    <text class="issue-to-pr-edge" x="233" y="242">the gate</text>
  </g>
  <line class="issue-to-pr-line issue-to-pr-conn issue-to-pr-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#issue-to-pr-tip)"/>
  <g class="issue-to-pr-stage issue-to-pr-s2">
    <rect class="issue-to-pr-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="issue-to-pr-step" x="422" y="142">03</text>
    <text class="issue-to-pr-name" x="448" y="142">Synthesise the repair</text>
    <text class="issue-to-pr-desc" x="422" y="166">Targeted patches until</text>
    <text class="issue-to-pr-desc" x="422" y="182">the reproduction test</text>
    <text class="issue-to-pr-desc" x="422" y="198">passes.</text>
  </g>
  <line class="issue-to-pr-line issue-to-pr-conn issue-to-pr-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#issue-to-pr-tip)"/>
  <g class="issue-to-pr-stage issue-to-pr-s3">
    <rect class="issue-to-pr-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="issue-to-pr-step" x="611" y="142">04</text>
    <text class="issue-to-pr-name" x="637" y="142">Full regression gate</text>
    <text class="issue-to-pr-desc" x="611" y="166">The whole suite, the</text>
    <text class="issue-to-pr-desc" x="611" y="182">linter and the type</text>
    <text class="issue-to-pr-desc" x="611" y="198">checker.</text>
  </g>
  <line class="issue-to-pr-line issue-to-pr-conn issue-to-pr-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#issue-to-pr-tip)"/>
  <g class="issue-to-pr-stage issue-to-pr-s4">
    <rect class="issue-to-pr-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="issue-to-pr-step" x="800" y="142">05</text>
    <text class="issue-to-pr-name" x="826" y="142">Open a draft PR</text>
    <text class="issue-to-pr-desc" x="800" y="166">With the reproduction as</text>
    <text class="issue-to-pr-desc" x="800" y="182">evidence, for a human to</text>
    <text class="issue-to-pr-desc" x="800" y="198">review.</text>
  </g>
  <text class="issue-to-pr-sub" x="30" y="304">Halting when the bug cannot be reproduced is what keeps the acceptance rate high: an agent that patches a symptom it never demonstrated produces plausible diffs that reviewers cannot evaluate.</text>
</svg>
