<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each far faster and far smaller.">
  <title>Four tiers of memory</title>
  <style>
    .memory-hierarchy-bg   { fill: #f8fafc; }
    .memory-hierarchy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .memory-hierarchy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .memory-hierarchy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .memory-hierarchy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .memory-hierarchy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .memory-hierarchy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .memory-hierarchy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .memory-hierarchy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .memory-hierarchy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .memory-hierarchy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .memory-hierarchy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .memory-hierarchy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .memory-hierarchy-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .memory-hierarchy-stage { opacity: 1; }

    .memory-hierarchy-s0 { animation-delay: 0.00s; }
    .memory-hierarchy-e0 { animation-delay: 0.00s; }
    .memory-hierarchy-s1 { animation-delay: 1.28s; }
    .memory-hierarchy-e1 { animation-delay: 1.28s; }
    .memory-hierarchy-s2 { animation-delay: 2.56s; }
    .memory-hierarchy-e2 { animation-delay: 2.56s; }
    .memory-hierarchy-s3 { animation-delay: 3.84s; }
    .memory-hierarchy-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .memory-hierarchy-conn  { animation: memory-hierarchy-trace 6.4s ease-in-out infinite; }
      .memory-hierarchy-stage { animation: memory-hierarchy-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes memory-hierarchy-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes memory-hierarchy-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .memory-hierarchy-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .memory-hierarchy-stage { animation: memory-hierarchy-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes memory-hierarchy-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="memory-hierarchy-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="memory-hierarchy-bg" width="980" height="322"/>
  <text class="memory-hierarchy-h1"  x="30" y="40">Four tiers of memory</text>
  <text class="memory-hierarchy-sub" x="30" y="64">Each far faster and far smaller.</text>
  <g class="memory-hierarchy-stage memory-hierarchy-s0">
    <rect class="memory-hierarchy-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="memory-hierarchy-step" x="44" y="142">01</text>
    <text class="memory-hierarchy-name" x="70" y="142">Device memory</text>
    <text class="memory-hierarchy-desc" x="44" y="166">Tens of gigabytes. The slowest</text>
    <text class="memory-hierarchy-desc" x="44" y="182">tier, and where everything</text>
    <text class="memory-hierarchy-desc" x="44" y="198">starts.</text>
  </g>
  <line class="memory-hierarchy-line memory-hierarchy-conn memory-hierarchy-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#memory-hierarchy-tip)"/>
  <g class="memory-hierarchy-stage memory-hierarchy-s1">
    <rect class="memory-hierarchy-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="memory-hierarchy-step" x="280" y="142">02</text>
    <text class="memory-hierarchy-name" x="306" y="142">Shared cache</text>
    <text class="memory-hierarchy-desc" x="280" y="166">Tens of megabytes, shared across</text>
    <text class="memory-hierarchy-desc" x="280" y="182">the chip.</text>
  </g>
  <line class="memory-hierarchy-line memory-hierarchy-conn memory-hierarchy-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#memory-hierarchy-tip)"/>
  <g class="memory-hierarchy-stage memory-hierarchy-s2">
    <rect class="memory-hierarchy-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="memory-hierarchy-step" x="516" y="142">03</text>
    <text class="memory-hierarchy-name" x="542" y="142">On-chip scratchpad</text>
    <text class="memory-hierarchy-desc" x="516" y="166">Hundreds of kilobytes per unit,</text>
    <text class="memory-hierarchy-desc" x="516" y="182">explicitly managed.</text>
  </g>
  <line class="memory-hierarchy-line memory-hierarchy-conn memory-hierarchy-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#memory-hierarchy-tip)"/>
  <g class="memory-hierarchy-stage memory-hierarchy-s3">
    <rect class="memory-hierarchy-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="memory-hierarchy-step" x="752" y="142">04</text>
    <text class="memory-hierarchy-name" x="778" y="142">Registers</text>
    <text class="memory-hierarchy-desc" x="752" y="166">Kilobytes, single-cycle. Where</text>
    <text class="memory-hierarchy-desc" x="752" y="182">arithmetic actually happens.</text>
  </g>
  <text class="memory-hierarchy-sub" x="30" y="304">Fused attention kernels exist entirely because of this hierarchy: keeping the intermediate matrix in on-chip memory rather than writing it to device memory is the whole optimisation.</text>
</svg>
