<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Managing conversation memory</title>
  <style>
    .context-window-mgmt-bg   { fill: #f8fafc; }
    .context-window-mgmt-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .context-window-mgmt-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .context-window-mgmt-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .context-window-mgmt-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .context-window-mgmt-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .context-window-mgmt-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .context-window-mgmt-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .context-window-mgmt-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .context-window-mgmt-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .context-window-mgmt-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .context-window-mgmt-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .context-window-mgmt-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .context-window-mgmt-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .context-window-mgmt-stage { opacity: 1; }

    .context-window-mgmt-s0 { animation-delay: 0.00s; }
    .context-window-mgmt-e0 { animation-delay: 0.00s; }
    .context-window-mgmt-s1 { animation-delay: 1.28s; }
    .context-window-mgmt-e1 { animation-delay: 1.28s; }
    .context-window-mgmt-s2 { animation-delay: 2.56s; }
    .context-window-mgmt-e2 { animation-delay: 2.56s; }
    .context-window-mgmt-s3 { animation-delay: 3.84s; }
    .context-window-mgmt-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .context-window-mgmt-conn  { animation: context-window-mgmt-trace 6.4s ease-in-out infinite; }
      .context-window-mgmt-stage { animation: context-window-mgmt-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes context-window-mgmt-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes context-window-mgmt-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .context-window-mgmt-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .context-window-mgmt-stage { animation: context-window-mgmt-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes context-window-mgmt-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="context-window-mgmt-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="context-window-mgmt-bg" width="980" height="322"/>
  <text class="context-window-mgmt-h1"  x="30" y="40">Managing conversation memory</text>
  <text class="context-window-mgmt-sub" x="30" y="64">Four steps.</text>
  <g class="context-window-mgmt-stage context-window-mgmt-s0">
    <rect class="context-window-mgmt-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="context-window-mgmt-step" x="44" y="142">01</text>
    <text class="context-window-mgmt-name" x="70" y="142">History grows with every turn</text>
    <text class="context-window-mgmt-desc" x="44" y="166">And is re-sent, and re-billed,</text>
    <text class="context-window-mgmt-desc" x="44" y="182">each time.</text>
  </g>
  <line class="context-window-mgmt-line context-window-mgmt-conn context-window-mgmt-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#context-window-mgmt-tip)"/>
  <g class="context-window-mgmt-stage context-window-mgmt-s1">
    <rect class="context-window-mgmt-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="context-window-mgmt-step" x="280" y="142">02</text>
    <text class="context-window-mgmt-name" x="306" y="142">Set a token budget below the model's limit</text>
    <text class="context-window-mgmt-desc" x="280" y="166">Leaving room for the answer.</text>
  </g>
  <line class="context-window-mgmt-line context-window-mgmt-conn context-window-mgmt-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#context-window-mgmt-tip)"/>
  <g class="context-window-mgmt-stage context-window-mgmt-s2">
    <rect class="context-window-mgmt-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="context-window-mgmt-step" x="516" y="142">03</text>
    <text class="context-window-mgmt-name" x="542" y="142">Drop the oldest turns as it fills</text>
    <text class="context-window-mgmt-desc" x="516" y="166">Keeping the system prompt</text>
    <text class="context-window-mgmt-desc" x="516" y="182">pinned.</text>
  </g>
  <line class="context-window-mgmt-line context-window-mgmt-conn context-window-mgmt-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#context-window-mgmt-tip)"/>
  <g class="context-window-mgmt-stage context-window-mgmt-s3">
    <rect class="context-window-mgmt-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="context-window-mgmt-step" x="752" y="142">04</text>
    <text class="context-window-mgmt-name" x="778" y="142">Or summarise them instead of dropping</text>
    <text class="context-window-mgmt-desc" x="752" y="166">Which preserves the thread at a</text>
    <text class="context-window-mgmt-desc" x="752" y="182">small cost.</text>
  </g>
  <text class="context-window-mgmt-sub" x="30" y="304">Pinning the system prompt while trimming history is the detail that keeps behaviour stable, and dropping it is a common cause of an assistant that degrades over a long session.</text>
</svg>
