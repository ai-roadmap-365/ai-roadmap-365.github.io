<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps, repeated.">
  <title>What gradient descent does</title>
  <style>
    .gd-idea-bg   { fill: #f8fafc; }
    .gd-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gd-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gd-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gd-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gd-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gd-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gd-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gd-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gd-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gd-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gd-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gd-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .gd-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .gd-idea-stage { opacity: 1; }

    .gd-idea-s0 { animation-delay: 0.00s; }
    .gd-idea-e0 { animation-delay: 0.00s; }
    .gd-idea-s1 { animation-delay: 1.28s; }
    .gd-idea-e1 { animation-delay: 1.28s; }
    .gd-idea-s2 { animation-delay: 2.56s; }
    .gd-idea-e2 { animation-delay: 2.56s; }
    .gd-idea-s3 { animation-delay: 3.84s; }
    .gd-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .gd-idea-conn  { animation: gd-idea-trace 6.4s ease-in-out infinite; }
      .gd-idea-stage { animation: gd-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes gd-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes gd-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .gd-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .gd-idea-stage { animation: gd-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes gd-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="gd-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="gd-idea-bg" width="980" height="322"/>
  <text class="gd-idea-h1"  x="30" y="40">What gradient descent does</text>
  <text class="gd-idea-sub" x="30" y="64">Four steps, repeated.</text>
  <g class="gd-idea-stage gd-idea-s0">
    <rect class="gd-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="gd-idea-step" x="44" y="142">01</text>
    <text class="gd-idea-name" x="70" y="142">Evaluate the loss at the current parameters</text>
    <text class="gd-idea-desc" x="44" y="166">How wrong the model is now.</text>
  </g>
  <line class="gd-idea-line gd-idea-conn gd-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#gd-idea-tip)"/>
  <g class="gd-idea-stage gd-idea-s1">
    <rect class="gd-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="gd-idea-step" x="280" y="142">02</text>
    <text class="gd-idea-name" x="306" y="142">Compute the gradient of that loss</text>
    <text class="gd-idea-desc" x="280" y="166">Which way is uphill.</text>
  </g>
  <line class="gd-idea-line gd-idea-conn gd-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#gd-idea-tip)"/>
  <g class="gd-idea-stage gd-idea-s2">
    <rect class="gd-idea-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="gd-idea-step" x="516" y="142">03</text>
    <text class="gd-idea-name" x="542" y="142">Step a small distance in the opposite direction</text>
    <text class="gd-idea-desc" x="516" y="166">Scaled by the learning rate.</text>
  </g>
  <line class="gd-idea-line gd-idea-conn gd-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#gd-idea-tip)"/>
  <g class="gd-idea-stage gd-idea-s3">
    <rect class="gd-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="gd-idea-step" x="752" y="142">04</text>
    <text class="gd-idea-name" x="778" y="142">And repeat until the loss stops improving</text>
    <text class="gd-idea-desc" x="752" y="166">Which may take many thousands of</text>
    <text class="gd-idea-desc" x="752" y="182">steps.</text>
  </g>
  <text class="gd-idea-sub" x="30" y="304">The loop is genuinely this simple, and nearly all of the sophistication in modern training is in how the step size and direction are adjusted.</text>
</svg>
