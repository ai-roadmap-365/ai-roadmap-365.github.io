<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are opportunities.">
  <title>Four consequences of cheap fine-tuning</title>
  <style>
    .lora-implications-bg   { fill: #f8fafc; }
    .lora-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lora-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lora-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lora-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lora-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lora-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lora-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .lora-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .lora-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .lora-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .lora-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .lora-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .lora-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .lora-implications-stage { opacity: 1; }

    .lora-implications-s0 { animation-delay: 0.00s; }
    .lora-implications-e0 { animation-delay: 0.00s; }
    .lora-implications-s1 { animation-delay: 1.28s; }
    .lora-implications-e1 { animation-delay: 1.28s; }
    .lora-implications-s2 { animation-delay: 2.56s; }
    .lora-implications-e2 { animation-delay: 2.56s; }
    .lora-implications-s3 { animation-delay: 3.84s; }
    .lora-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .lora-implications-conn  { animation: lora-implications-trace 6.4s ease-in-out infinite; }
      .lora-implications-stage { animation: lora-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes lora-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes lora-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .lora-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .lora-implications-stage { animation: lora-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes lora-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="lora-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="lora-implications-bg" width="980" height="322"/>
  <text class="lora-implications-h1"  x="30" y="40">Four consequences of cheap fine-tuning</text>
  <text class="lora-implications-sub" x="30" y="64">Two are opportunities.</text>
  <g class="lora-implications-stage lora-implications-s0">
    <rect class="lora-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="lora-implications-step" x="44" y="142">01</text>
    <text class="lora-implications-name" x="70" y="142">Fine-tuning became widely accessible</text>
    <text class="lora-implications-desc" x="44" y="166">One device rather than a</text>
    <text class="lora-implications-desc" x="44" y="182">cluster.</text>
  </g>
  <line class="lora-implications-line lora-implications-conn lora-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#lora-implications-tip)"/>
  <g class="lora-implications-stage lora-implications-s1">
    <rect class="lora-implications-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="lora-implications-step" x="280" y="142">02</text>
    <text class="lora-implications-name" x="306" y="142">And storage per task collapsed</text>
    <text class="lora-implications-desc" x="280" y="166">Which makes many specialised</text>
    <text class="lora-implications-desc" x="280" y="182">models practical.</text>
  </g>
  <line class="lora-implications-line lora-implications-conn lora-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#lora-implications-tip)"/>
  <g class="lora-implications-stage lora-implications-s2">
    <rect class="lora-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="lora-implications-step" x="516" y="142">03</text>
    <text class="lora-implications-name" x="542" y="142">But the adapter still encodes its training data</text>
    <text class="lora-implications-desc" x="516" y="166">So it inherits that data's</text>
    <text class="lora-implications-desc" x="516" y="182">confidentiality.</text>
  </g>
  <line class="lora-implications-line lora-implications-conn lora-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#lora-implications-tip)"/>
  <g class="lora-implications-stage lora-implications-s3">
    <rect class="lora-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="lora-implications-step" x="752" y="142">04</text>
    <text class="lora-implications-name" x="778" y="142">And serving many from one backbone is a design choice</text>
    <text class="lora-implications-desc" x="752" y="166">With real operational</text>
    <text class="lora-implications-desc" x="752" y="182">consequences.</text>
  </g>
  <text class="lora-implications-sub" x="30" y="304">Confidentiality is the point most often missed: a small adapter trained on private data is itself private, whatever the base model's licence permits.</text>
</svg>
