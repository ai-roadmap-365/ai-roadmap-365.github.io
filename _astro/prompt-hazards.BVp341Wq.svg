<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are about what you built, two about what you trusted.">
  <title>Four failure modes</title>
  <style>
    .prompt-hazards-bg   { fill: #f8fafc; }
    .prompt-hazards-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-hazards-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-hazards-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-hazards-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-hazards-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-hazards-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prompt-hazards-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .prompt-hazards-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .prompt-hazards-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .prompt-hazards-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .prompt-hazards-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .prompt-hazards-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .prompt-hazards-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .prompt-hazards-stage { opacity: 1; }

    .prompt-hazards-s0 { animation-delay: 0.00s; }
    .prompt-hazards-e0 { animation-delay: 0.00s; }
    .prompt-hazards-s1 { animation-delay: 1.28s; }
    .prompt-hazards-e1 { animation-delay: 1.28s; }
    .prompt-hazards-s2 { animation-delay: 2.56s; }
    .prompt-hazards-e2 { animation-delay: 2.56s; }
    .prompt-hazards-s3 { animation-delay: 3.84s; }
    .prompt-hazards-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .prompt-hazards-conn  { animation: prompt-hazards-trace 6.4s ease-in-out infinite; }
      .prompt-hazards-stage { animation: prompt-hazards-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes prompt-hazards-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes prompt-hazards-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .prompt-hazards-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .prompt-hazards-stage { animation: prompt-hazards-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes prompt-hazards-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="prompt-hazards-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="prompt-hazards-bg" width="980" height="322"/>
  <text class="prompt-hazards-h1"  x="30" y="40">Four failure modes</text>
  <text class="prompt-hazards-sub" x="30" y="64">Two are about what you built, two about what you trusted.</text>
  <g class="prompt-hazards-stage prompt-hazards-s0">
    <rect class="prompt-hazards-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-hazards-step" x="44" y="142">01</text>
    <text class="prompt-hazards-name" x="70" y="142">Unescaped user text</text>
    <text class="prompt-hazards-desc" x="44" y="166">A closing tag inside the input</text>
    <text class="prompt-hazards-desc" x="44" y="182">ends your delimiter early.</text>
  </g>
  <line class="prompt-hazards-line prompt-hazards-conn prompt-hazards-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#prompt-hazards-tip)"/>
  <g class="prompt-hazards-stage prompt-hazards-s1">
    <rect class="prompt-hazards-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-hazards-step" x="280" y="142">02</text>
    <text class="prompt-hazards-name" x="306" y="142">A quarantine worker with tools</text>
    <text class="prompt-hazards-desc" x="280" y="166">Which is not a quarantine. Zero</text>
    <text class="prompt-hazards-desc" x="280" y="182">capability is the whole</text>
    <text class="prompt-hazards-desc" x="280" y="198">mechanism.</text>
  </g>
  <line class="prompt-hazards-line prompt-hazards-conn prompt-hazards-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#prompt-hazards-tip)"/>
  <g class="prompt-hazards-stage prompt-hazards-s2">
    <rect class="prompt-hazards-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-hazards-step" x="516" y="142">03</text>
    <text class="prompt-hazards-name" x="542" y="142">No outbound scan</text>
    <text class="prompt-hazards-desc" x="516" y="166">A successful extraction returns</text>
    <text class="prompt-hazards-desc" x="516" y="182">to the attacker and nothing</text>
    <text class="prompt-hazards-desc" x="516" y="198">notices.</text>
  </g>
  <line class="prompt-hazards-line prompt-hazards-conn prompt-hazards-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#prompt-hazards-tip)"/>
  <g class="prompt-hazards-stage prompt-hazards-s3">
    <rect class="prompt-hazards-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-hazards-step" x="752" y="142">04</text>
    <text class="prompt-hazards-name" x="778" y="142">Model output into an interpreter</text>
    <text class="prompt-hazards-desc" x="752" y="166">Straight into SQL or a shell.</text>
    <text class="prompt-hazards-desc" x="752" y="182">The classic injection, with a</text>
    <text class="prompt-hazards-desc" x="752" y="198">new source.</text>
    <text class="prompt-hazards-edge" x="752" y="242">parameterise</text>
  </g>
  <text class="prompt-hazards-sub" x="30" y="304">The fourth is the oldest vulnerability in the list wearing new clothes: an LLM is a very fluent source of untrusted strings, and passing one into an interpreter is the same mistake it always was.</text>
</svg>
