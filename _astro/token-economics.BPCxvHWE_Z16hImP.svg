<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three numbers worth watching.">
  <title>Token economics on the dashboard</title>
  <style>
    .token-economics-bg   { fill: #f8fafc; }
    .token-economics-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .token-economics-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .token-economics-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .token-economics-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .token-economics-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .token-economics-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .token-economics-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .token-economics-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .token-economics-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .token-economics-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .token-economics-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .token-economics-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .token-economics-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .token-economics-stage { opacity: 1; }

    .token-economics-s0 { animation-delay: 0.00s; }
    .token-economics-e0 { animation-delay: 0.00s; }
    .token-economics-s1 { animation-delay: 1.50s; }
    .token-economics-e1 { animation-delay: 1.50s; }
    .token-economics-s2 { animation-delay: 3.00s; }
    .token-economics-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .token-economics-conn  { animation: token-economics-trace 6s ease-in-out infinite; }
      .token-economics-stage { animation: token-economics-arrive 6s ease-in-out infinite; }
    }
    @keyframes token-economics-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes token-economics-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .token-economics-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .token-economics-stage { animation: token-economics-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes token-economics-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="token-economics-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="token-economics-bg" width="980" height="322"/>
  <text class="token-economics-h1"  x="30" y="40">Token economics on the dashboard</text>
  <text class="token-economics-sub" x="30" y="64">Three numbers worth watching.</text>
  <g class="token-economics-stage token-economics-s0">
    <rect class="token-economics-good" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="token-economics-step" x="44" y="142">01</text>
    <text class="token-economics-name" x="70" y="142">Cache hit ratio</text>
    <text class="token-economics-desc" x="44" y="166">Above 80% cuts input cost by up to 90% and</text>
    <text class="token-economics-desc" x="44" y="182">halves time to first token.</text>
    <text class="token-economics-edge" x="44" y="242">the big one</text>
  </g>
  <line class="token-economics-line token-economics-conn token-economics-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#token-economics-tip)"/>
  <g class="token-economics-stage token-economics-s1">
    <rect class="token-economics-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="token-economics-step" x="359" y="142">02</text>
    <text class="token-economics-name" x="385" y="142">Per-tenant quotas</text>
    <text class="token-economics-desc" x="359" y="166">Dynamic budget limits, so one agent loop</text>
    <text class="token-economics-desc" x="359" y="182">cannot bill the company.</text>
  </g>
  <line class="token-economics-line token-economics-conn token-economics-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#token-economics-tip)"/>
  <g class="token-economics-stage token-economics-s2">
    <rect class="token-economics-box" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="token-economics-step" x="674" y="142">03</text>
    <text class="token-economics-name" x="700" y="142">Anomaly alerts</text>
    <text class="token-economics-desc" x="674" y="166">Average tokens per query up 25% in an hour:</text>
    <text class="token-economics-desc" x="674" y="182">page somebody.</text>
    <text class="token-economics-edge" x="674" y="242">Day 360</text>
  </g>
  <text class="token-economics-sub" x="30" y="304">The cache ratio is the highest-leverage number because it improves cost and latency simultaneously, which almost nothing else on an AI dashboard does.</text>
</svg>
