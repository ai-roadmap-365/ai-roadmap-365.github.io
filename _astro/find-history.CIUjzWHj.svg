<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward open publication.">
  <title>Four steps in data availability</title>
  <style>
    .find-history-bg   { fill: #f8fafc; }
    .find-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .find-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .find-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .find-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .find-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .find-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .find-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .find-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .find-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .find-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .find-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .find-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .find-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .find-history-stage { opacity: 1; }

    .find-history-s0 { animation-delay: 0.00s; }
    .find-history-e0 { animation-delay: 0.00s; }
    .find-history-s1 { animation-delay: 1.28s; }
    .find-history-e1 { animation-delay: 1.28s; }
    .find-history-s2 { animation-delay: 2.56s; }
    .find-history-e2 { animation-delay: 2.56s; }
    .find-history-s3 { animation-delay: 3.84s; }
    .find-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .find-history-conn  { animation: find-history-trace 6.4s ease-in-out infinite; }
      .find-history-stage { animation: find-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes find-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes find-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .find-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .find-history-stage { animation: find-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes find-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="find-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="find-history-bg" width="980" height="322"/>
  <text class="find-history-h1"  x="30" y="40">Four steps in data availability</text>
  <text class="find-history-sub" x="30" y="64">Toward open publication.</text>
  <g class="find-history-stage find-history-s0">
    <rect class="find-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="find-history-step" x="44" y="142">01</text>
    <text class="find-history-name" x="70" y="142">Official statistics, published as printed reports</text>
    <text class="find-history-desc" x="44" y="166">Hard to reuse.</text>
  </g>
  <line class="find-history-line find-history-conn find-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#find-history-tip)"/>
  <g class="find-history-stage find-history-s1">
    <rect class="find-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="find-history-step" x="280" y="142">02</text>
    <text class="find-history-name" x="306" y="142">Then open data policies, machine-readable</text>
    <text class="find-history-desc" x="280" y="166">Which enabled independent</text>
    <text class="find-history-desc" x="280" y="182">analysis.</text>
  </g>
  <line class="find-history-line find-history-conn find-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#find-history-tip)"/>
  <g class="find-history-stage find-history-s2">
    <rect class="find-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="find-history-step" x="516" y="142">03</text>
    <text class="find-history-name" x="542" y="142">Then interfaces offering live access</text>
    <text class="find-history-desc" x="516" y="166">With terms and rate limits.</text>
  </g>
  <line class="find-history-line find-history-conn find-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#find-history-tip)"/>
  <g class="find-history-stage find-history-s3">
    <rect class="find-history-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="find-history-step" x="752" y="142">04</text>
    <text class="find-history-name" x="778" y="142">And commercial marketplaces and licensed corpora</text>
    <text class="find-history-desc" x="752" y="166">Where provenance is the product.</text>
  </g>
  <text class="find-history-sub" x="30" y="304">Provenance becoming the product is a notable recent shift, driven largely by the legal uncertainty around training data collected without clear permission.</text>
</svg>
