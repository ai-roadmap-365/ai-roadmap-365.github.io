<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Git declining to guess is the feature.">
  <title>A conflict is a question, not a failure</title>
  <style>
    .conflict-is-not-an-error-bg   { fill: #f8fafc; }
    .conflict-is-not-an-error-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conflict-is-not-an-error-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conflict-is-not-an-error-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conflict-is-not-an-error-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conflict-is-not-an-error-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conflict-is-not-an-error-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .conflict-is-not-an-error-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .conflict-is-not-an-error-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .conflict-is-not-an-error-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .conflict-is-not-an-error-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .conflict-is-not-an-error-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .conflict-is-not-an-error-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .conflict-is-not-an-error-row { opacity: 1; }
    .conflict-is-not-an-error-r0 { animation-delay: 0.00s; }
    .conflict-is-not-an-error-r1 { animation-delay: 0.45s; }
    .conflict-is-not-an-error-r2 { animation-delay: 0.90s; }
    .conflict-is-not-an-error-r3 { animation-delay: 1.35s; }
    .conflict-is-not-an-error-r4 { animation-delay: 1.80s; }
    .conflict-is-not-an-error-row { animation: conflict-is-not-an-error-reveal 7.3s ease-in-out infinite; }
    @keyframes conflict-is-not-an-error-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="conflict-is-not-an-error-bg" width="980" height="390"/>
  <text class="conflict-is-not-an-error-h1"  x="30" y="40">A conflict is a question, not a failure</text>
  <text class="conflict-is-not-an-error-sub" x="30" y="64">Git declining to guess is the feature.</text>
  <rect class="conflict-is-not-an-error-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="conflict-is-not-an-error-name" x="46" y="122">What it is not</text>
  <text class="conflict-is-not-an-error-desc" x="46" y="142">Common misreadings.</text>
  <text class="conflict-is-not-an-error-desc conflict-is-not-an-error-row conflict-is-not-an-error-r0" x="46" y="182">Not a bug in Git</text>
  <text class="conflict-is-not-an-error-desc conflict-is-not-an-error-row conflict-is-not-an-error-r1" x="46" y="216">Not something you did wrong</text>
  <text class="conflict-is-not-an-error-desc conflict-is-not-an-error-row conflict-is-not-an-error-r2" x="46" y="250">Not a sign the branches are incompatible</text>
  <text class="conflict-is-not-an-error-desc conflict-is-not-an-error-row conflict-is-not-an-error-r3" x="46" y="284">Not resolved by picking the longer side</text>
  <text class="conflict-is-not-an-error-desc conflict-is-not-an-error-row conflict-is-not-an-error-r4" x="46" y="318">Not rare — it is normal</text>
  <rect class="conflict-is-not-an-error-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="conflict-is-not-an-error-name" x="526" y="122">What it is</text>
  <text class="conflict-is-not-an-error-desc" x="526" y="142">A decision only a person can make.</text>
  <text class="conflict-is-not-an-error-desc conflict-is-not-an-error-row conflict-is-not-an-error-r0" x="526" y="182">Both sides changed the SAME lines</text>
  <text class="conflict-is-not-an-error-desc conflict-is-not-an-error-row conflict-is-not-an-error-r1" x="526" y="216">Differently, and both deliberately</text>
  <text class="conflict-is-not-an-error-desc conflict-is-not-an-error-row conflict-is-not-an-error-r2" x="526" y="250">Git could pick one and will not</text>
  <text class="conflict-is-not-an-error-desc conflict-is-not-an-error-row conflict-is-not-an-error-r3" x="526" y="284">Because it cannot know which is right</text>
  <text class="conflict-is-not-an-error-desc conflict-is-not-an-error-row conflict-is-not-an-error-r4" x="526" y="318">git merge --abort backs out entirely</text>
  <text class="conflict-is-not-an-error-sub" x="30" y="372">Git merges edits to different parts of a file silently and constantly. You only ever see a conflict in the narrow case where two intentions genuinely collide.</text>
</svg>
