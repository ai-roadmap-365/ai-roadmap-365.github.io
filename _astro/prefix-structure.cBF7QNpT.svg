<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Static first, dynamic last.">
  <title>Structuring a prompt for cache reuse</title>
  <style>
    .prefix-structure-bg   { fill: #f8fafc; }
    .prefix-structure-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prefix-structure-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prefix-structure-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prefix-structure-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prefix-structure-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prefix-structure-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prefix-structure-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .prefix-structure-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .prefix-structure-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .prefix-structure-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .prefix-structure-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .prefix-structure-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .prefix-structure-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .prefix-structure-stage { opacity: 1; }

    .prefix-structure-s0 { animation-delay: 0.00s; }
    .prefix-structure-e0 { animation-delay: 0.00s; }
    .prefix-structure-s1 { animation-delay: 1.28s; }
    .prefix-structure-e1 { animation-delay: 1.28s; }
    .prefix-structure-s2 { animation-delay: 2.56s; }
    .prefix-structure-e2 { animation-delay: 2.56s; }
    .prefix-structure-s3 { animation-delay: 3.84s; }
    .prefix-structure-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .prefix-structure-conn  { animation: prefix-structure-trace 6.4s ease-in-out infinite; }
      .prefix-structure-stage { animation: prefix-structure-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes prefix-structure-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes prefix-structure-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .prefix-structure-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .prefix-structure-stage { animation: prefix-structure-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes prefix-structure-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="prefix-structure-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="prefix-structure-bg" width="980" height="322"/>
  <text class="prefix-structure-h1"  x="30" y="40">Structuring a prompt for cache reuse</text>
  <text class="prefix-structure-sub" x="30" y="64">Static first, dynamic last.</text>
  <g class="prefix-structure-stage prefix-structure-s0">
    <rect class="prefix-structure-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="prefix-structure-step" x="44" y="142">01</text>
    <text class="prefix-structure-name" x="70" y="142">Static system context first</text>
    <text class="prefix-structure-desc" x="44" y="166">Instructions, schemas, the long</text>
    <text class="prefix-structure-desc" x="44" y="182">document. Unchanging.</text>
    <text class="prefix-structure-edge" x="44" y="242">cacheable</text>
  </g>
  <line class="prefix-structure-line prefix-structure-conn prefix-structure-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#prefix-structure-tip)"/>
  <g class="prefix-structure-stage prefix-structure-s1">
    <rect class="prefix-structure-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="prefix-structure-step" x="280" y="142">02</text>
    <text class="prefix-structure-name" x="306" y="142">Matching must be exact from token zero</text>
    <text class="prefix-structure-desc" x="280" y="166">One changed character</text>
    <text class="prefix-structure-desc" x="280" y="182">invalidates everything after it.</text>
  </g>
  <line class="prefix-structure-line prefix-structure-conn prefix-structure-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#prefix-structure-tip)"/>
  <g class="prefix-structure-stage prefix-structure-s2">
    <rect class="prefix-structure-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="prefix-structure-step" x="516" y="142">03</text>
    <text class="prefix-structure-name" x="542" y="142">Dynamic content last</text>
    <text class="prefix-structure-desc" x="516" y="166">Timestamps, user IDs and the</text>
    <text class="prefix-structure-desc" x="516" y="182">query, at the bottom.</text>
  </g>
  <line class="prefix-structure-line prefix-structure-conn prefix-structure-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#prefix-structure-tip)"/>
  <g class="prefix-structure-stage prefix-structure-s3">
    <rect class="prefix-structure-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="prefix-structure-step" x="752" y="142">04</text>
    <text class="prefix-structure-name" x="778" y="142">Above the minimum prefix length</text>
    <text class="prefix-structure-desc" x="752" y="166">Providers require a substantial</text>
    <text class="prefix-structure-desc" x="752" y="182">prefix before caching applies.</text>
    <text class="prefix-structure-edge" x="752" y="242">1,024+</text>
  </g>
  <text class="prefix-structure-sub" x="30" y="304">Putting a timestamp at the top of a prompt is the specific mistake that produces a zero percent cache hit rate on an otherwise perfectly cacheable workload.</text>
</svg>
