<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" role="img" font-family="system-ui, sans-serif">
  <title>The two separate paths one annotated source file takes. On the static path the file is read but never executed: a type checker parses it, builds a model of every annotation, compares each expression against what the annotations promise, and reports contradictions before the program runs. On the runtime path the interpreter executes the file: it evaluates each annotation and stores it in __annotations__, where dataclasses.fields and other tools can read it, but it never compares a value against one, so a function annotated to return str can return a float and a call that passes the wrong type runs happily until something unrelated breaks. The two paths never meet, which is why the annotation is documentation to the interpreter and an enforceable claim only to the checker.</title>
  <rect x="0" y="0" width="980" height="700" fill="#f8fafc"/>

  <text x="490" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a202c">One annotated file, two paths that never meet</text>
  <text x="490" y="62" text-anchor="middle" font-size="14" fill="#1a202c">Annotations are enforced on the left. On the right they are only recorded.</text>

  <!-- shared source -->
  <rect x="300" y="84" width="380" height="122" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="490" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">the same source file</text>
  <text x="318" y="136" font-size="14" fill="#1a202c">def label(record: EvalRecord) -&gt; str:</text>
  <text x="332" y="158" font-size="14" fill="#1a202c">return record.score</text>
  <text x="318" y="184" font-size="14" font-weight="bold" fill="#1d4ed8">the annotation says str; the body gives a float</text>

  <!-- split arrows -->
  <line x1="400" y1="206" x2="250" y2="248" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="244,250 256,242 258,254" fill="#1d4ed8"/>
  <line x1="580" y1="206" x2="730" y2="248" stroke="#1a202c" stroke-width="2"/>
  <polygon points="736,250 722,254 724,242" fill="#1a202c"/>

  <text x="240" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">STATIC PATH</text>
  <text x="240" y="252" text-anchor="middle" font-size="14" fill="#1d4ed8">the file is read, never run</text>
  <text x="760" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">RUNTIME PATH</text>
  <text x="760" y="252" text-anchor="middle" font-size="14" fill="#1a202c">the file is executed</text>

  <!-- LEFT COLUMN -->
  <rect x="40" y="272" width="400" height="76" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="240" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">a type checker parses the file</text>
  <text x="240" y="326" text-anchor="middle" font-size="14" fill="#1a202c">mypy, pyright, or an editor running one for you</text>

  <line x1="240" y1="348" x2="240" y2="382" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="240,388 234,376 246,376" fill="#1d4ed8"/>

  <rect x="40" y="398" width="400" height="96" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="240" y="426" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">it builds a model of every annotation</text>
  <text x="240" y="450" text-anchor="middle" font-size="14" fill="#1a202c">then compares every expression, call and return</text>
  <text x="240" y="472" text-anchor="middle" font-size="14" fill="#1a202c">against what those annotations promise</text>

  <line x1="240" y1="494" x2="240" y2="528" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="240,534 234,522 246,522" fill="#1d4ed8"/>

  <rect x="40" y="544" width="400" height="116" fill="#dcfce7" stroke="#1d4ed8" stroke-width="3" rx="8"/>
  <text x="240" y="572" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">contradictions reported BEFORE running</text>
  <text x="240" y="598" text-anchor="middle" font-size="14" fill="#1a202c">the return type does not match the annotation</text>
  <text x="240" y="620" text-anchor="middle" font-size="14" fill="#1a202c">the argument type does not match the parameter</text>
  <text x="240" y="644" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">nothing has executed — no data was touched</text>

  <!-- RIGHT COLUMN -->
  <rect x="560" y="272" width="400" height="76" fill="#fef9c3" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="760" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">the interpreter executes the file</text>
  <text x="760" y="326" text-anchor="middle" font-size="14" fill="#1a202c">def statements run; the class body runs</text>

  <line x1="760" y1="348" x2="760" y2="382" stroke="#1a202c" stroke-width="2"/>
  <polygon points="760,388 754,376 766,376" fill="#1a202c"/>

  <rect x="560" y="398" width="400" height="96" fill="#fef9c3" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="760" y="426" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">annotations are STORED, not checked</text>
  <text x="760" y="450" text-anchor="middle" font-size="14" fill="#1d4ed8">__annotations__ holds them for tools to read</text>
  <text x="760" y="472" text-anchor="middle" font-size="14" fill="#1d4ed8">— which is exactly how @dataclass finds its fields</text>

  <line x1="760" y1="494" x2="760" y2="528" stroke="#1a202c" stroke-width="2"/>
  <polygon points="760,534 754,522 766,522" fill="#1a202c"/>

  <rect x="560" y="544" width="400" height="116" fill="#f8fafc" stroke="#1a202c" stroke-width="3" rx="8" stroke-dasharray="6 4"/>
  <text x="760" y="572" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">no value is ever compared to an annotation</text>
  <text x="760" y="598" text-anchor="middle" font-size="14" fill="#1a202c">the float is returned; nothing raises</text>
  <text x="760" y="620" text-anchor="middle" font-size="14" fill="#1a202c">the program keeps going with the wrong type</text>
  <text x="760" y="644" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">the failure surfaces later, somewhere else</text>

  <!-- divider -->
  <line x1="500" y1="264" x2="500" y2="670" stroke="#1a202c" stroke-width="1" stroke-dasharray="4 6"/>
  <text x="500" y="686" text-anchor="middle" font-size="14" fill="#1a202c">only __post_init__ or an explicit isinstance check enforces a type at runtime</text>
</svg>
