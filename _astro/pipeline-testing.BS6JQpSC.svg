<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four levels.">
  <title>Testing a pipeline</title>
  <style>
    .pipeline-testing-bg   { fill: #f8fafc; }
    .pipeline-testing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-testing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-testing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-testing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-testing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-testing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pipeline-testing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pipeline-testing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pipeline-testing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pipeline-testing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pipeline-testing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pipeline-testing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pipeline-testing-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pipeline-testing-stage { opacity: 1; }

    .pipeline-testing-s0 { animation-delay: 0.00s; }
    .pipeline-testing-e0 { animation-delay: 0.00s; }
    .pipeline-testing-s1 { animation-delay: 1.28s; }
    .pipeline-testing-e1 { animation-delay: 1.28s; }
    .pipeline-testing-s2 { animation-delay: 2.56s; }
    .pipeline-testing-e2 { animation-delay: 2.56s; }
    .pipeline-testing-s3 { animation-delay: 3.84s; }
    .pipeline-testing-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .pipeline-testing-conn  { animation: pipeline-testing-trace 6.4s ease-in-out infinite; }
      .pipeline-testing-stage { animation: pipeline-testing-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes pipeline-testing-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pipeline-testing-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pipeline-testing-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pipeline-testing-stage { animation: pipeline-testing-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pipeline-testing-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pipeline-testing-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pipeline-testing-bg" width="980" height="322"/>
  <text class="pipeline-testing-h1"  x="30" y="40">Testing a pipeline</text>
  <text class="pipeline-testing-sub" x="30" y="64">Four levels.</text>
  <g class="pipeline-testing-stage pipeline-testing-s0">
    <rect class="pipeline-testing-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="pipeline-testing-step" x="44" y="142">01</text>
    <text class="pipeline-testing-name" x="70" y="142">Transformations tested as pure functions</text>
    <text class="pipeline-testing-desc" x="44" y="166">With no source or store</text>
    <text class="pipeline-testing-desc" x="44" y="182">involved.</text>
  </g>
  <line class="pipeline-testing-line pipeline-testing-conn pipeline-testing-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#pipeline-testing-tip)"/>
  <g class="pipeline-testing-stage pipeline-testing-s1">
    <rect class="pipeline-testing-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="pipeline-testing-step" x="280" y="142">02</text>
    <text class="pipeline-testing-name" x="306" y="142">Validation tested with deliberately bad input</text>
    <text class="pipeline-testing-desc" x="280" y="166">To check it rejects what it</text>
    <text class="pipeline-testing-desc" x="280" y="182">should.</text>
  </g>
  <line class="pipeline-testing-line pipeline-testing-conn pipeline-testing-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#pipeline-testing-tip)"/>
  <g class="pipeline-testing-stage pipeline-testing-s2">
    <rect class="pipeline-testing-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="pipeline-testing-step" x="516" y="142">03</text>
    <text class="pipeline-testing-name" x="542" y="142">Loading tested against a temporary database</text>
    <text class="pipeline-testing-desc" x="516" y="166">Created and discarded per test.</text>
  </g>
  <line class="pipeline-testing-line pipeline-testing-conn pipeline-testing-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#pipeline-testing-tip)"/>
  <g class="pipeline-testing-stage pipeline-testing-s3">
    <rect class="pipeline-testing-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="pipeline-testing-step" x="752" y="142">04</text>
    <text class="pipeline-testing-name" x="778" y="142">And the whole run tested with a recorded sample</text>
    <text class="pipeline-testing-desc" x="752" y="166">Which catches wiring mistakes.</text>
  </g>
  <text class="pipeline-testing-sub" x="30" y="304">Keeping transformations pure is what makes the bulk of a pipeline testable at all, and it is the main reason to separate them from input and output.</text>
</svg>
