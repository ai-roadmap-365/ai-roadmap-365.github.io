<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things a data frame is not</title>
  <style>
    .df-not-bg   { fill: #f8fafc; }
    .df-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .df-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .df-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .df-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .df-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .df-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .df-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .df-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .df-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .df-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .df-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .df-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .df-not-row { opacity: 1; }
    .df-not-r0 { animation-delay: 0.00s; }
    .df-not-r1 { animation-delay: 0.45s; }
    .df-not-r2 { animation-delay: 0.90s; }
    .df-not-r3 { animation-delay: 1.35s; }
    .df-not-r4 { animation-delay: 1.80s; }
    .df-not-row { animation: df-not-reveal 7.3s ease-in-out infinite; }
    @keyframes df-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="df-not-bg" width="980" height="390"/>
  <text class="df-not-h1"  x="30" y="40">Four things a data frame is not</text>
  <text class="df-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="df-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="df-not-name" x="46" y="122">The misconception</text>
  <text class="df-not-desc" x="46" y="142">Commonly held.</text>
  <text class="df-not-desc df-not-row df-not-r0" x="46" y="182">It is a spreadsheet</text>
  <text class="df-not-desc df-not-row df-not-r1" x="46" y="216">Looping over rows is normal</text>
  <text class="df-not-desc df-not-row df-not-r2" x="46" y="250">Operations align by position</text>
  <text class="df-not-desc df-not-row df-not-r3" x="46" y="284">It is a database</text>
  <text class="df-not-desc df-not-row df-not-r4" x="46" y="318">Memory use matches the file size</text>
  <rect class="df-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="df-not-name" x="526" y="122">What is true</text>
  <text class="df-not-desc" x="526" y="142">Actually.</text>
  <text class="df-not-desc df-not-row df-not-r0" x="526" y="182">It is typed, indexed and programmable</text>
  <text class="df-not-desc df-not-row df-not-r1" x="526" y="216">Vectorised operations are the idiom</text>
  <text class="df-not-desc df-not-row df-not-r2" x="526" y="250">They align by index label</text>
  <text class="df-not-desc df-not-row df-not-r3" x="526" y="284">It is in memory, single process</text>
  <text class="df-not-desc df-not-row df-not-r4" x="526" y="318">It is often several times larger</text>
  <text class="df-not-sub" x="30" y="372">Memory being several times the file size catches people out constantly, and it is why a file that opens fine in a text editor can exhaust a laptop's memory.</text>
</svg>
