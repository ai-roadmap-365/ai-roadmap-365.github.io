<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Not the index.">
  <title>Most patterns change the query</title>
  <style>
    .advanced-idea-bg   { fill: #f8fafc; }
    .advanced-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .advanced-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .advanced-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .advanced-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .advanced-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .advanced-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .advanced-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .advanced-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .advanced-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .advanced-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .advanced-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .advanced-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .advanced-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .advanced-idea-stage { opacity: 1; }

    .advanced-idea-s0 { animation-delay: 0.00s; }
    .advanced-idea-e0 { animation-delay: 0.00s; }
    .advanced-idea-s1 { animation-delay: 1.28s; }
    .advanced-idea-e1 { animation-delay: 1.28s; }
    .advanced-idea-s2 { animation-delay: 2.56s; }
    .advanced-idea-e2 { animation-delay: 2.56s; }
    .advanced-idea-s3 { animation-delay: 3.84s; }
    .advanced-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .advanced-idea-conn  { animation: advanced-idea-trace 6.4s ease-in-out infinite; }
      .advanced-idea-stage { animation: advanced-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes advanced-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes advanced-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .advanced-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .advanced-idea-stage { animation: advanced-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes advanced-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="advanced-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="advanced-idea-bg" width="980" height="322"/>
  <text class="advanced-idea-h1"  x="30" y="40">Most patterns change the query</text>
  <text class="advanced-idea-sub" x="30" y="64">Not the index.</text>
  <g class="advanced-idea-stage advanced-idea-s0">
    <rect class="advanced-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="advanced-idea-step" x="44" y="142">01</text>
    <text class="advanced-idea-name" x="70" y="142">Rewrite or expand the query</text>
    <text class="advanced-idea-desc" x="44" y="166">Before retrieval. Cheap, and the</text>
    <text class="advanced-idea-desc" x="44" y="182">largest single gain.</text>
  </g>
  <line class="advanced-idea-line advanced-idea-conn advanced-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#advanced-idea-tip)"/>
  <g class="advanced-idea-stage advanced-idea-s1">
    <rect class="advanced-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="advanced-idea-step" x="280" y="142">02</text>
    <text class="advanced-idea-name" x="306" y="142">Retrieve as before</text>
    <text class="advanced-idea-desc" x="280" y="166">Unchanged. The index does not</text>
    <text class="advanced-idea-desc" x="280" y="182">move.</text>
  </g>
  <line class="advanced-idea-line advanced-idea-conn advanced-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#advanced-idea-tip)"/>
  <g class="advanced-idea-stage advanced-idea-s2">
    <rect class="advanced-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="advanced-idea-step" x="516" y="142">03</text>
    <text class="advanced-idea-name" x="542" y="142">Expand what was retrieved</text>
    <text class="advanced-idea-desc" x="516" y="166">From a matched chunk to its</text>
    <text class="advanced-idea-desc" x="516" y="182">surrounding section.</text>
  </g>
  <line class="advanced-idea-line advanced-idea-conn advanced-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#advanced-idea-tip)"/>
  <g class="advanced-idea-stage advanced-idea-s3">
    <rect class="advanced-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="advanced-idea-step" x="752" y="142">04</text>
    <text class="advanced-idea-name" x="778" y="142">Then rerank</text>
    <text class="advanced-idea-desc" x="752" y="166">Which is the other large gain.</text>
    <text class="advanced-idea-edge" x="752" y="242">latency</text>
  </g>
  <text class="advanced-idea-sub" x="30" y="304">That most of these operate before or after retrieval is what makes them cheap to try: no re-indexing, no re-embedding, and each can be measured independently.</text>
</svg>
