<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Declarative IaC Cloud Deployment Pipeline">
  <title>Declarative IaC Cloud Deployment Pipeline</title>
  <defs>
    <style>
      .d337a-bg { fill: #f8fafc; }
      .d337a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d337a-iac { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d337a-reg { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d337a-srv { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d337a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d337a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d337a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d337a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d337a-bg" />
  
  <text x="40" y="40" class="d337a-title">Declarative Cloud AI Infrastructure Pipeline</text>
  <text x="40" y="65" class="d337a-subtitle">Declarative IaC Cloud Deployment Pipeline showing Terraform Plan &amp; Apply, Secure Container Registry, IAM Role Attachment, and Cloud Run / Kubernetes Pod Provisioning with Zero Downtime Cutover</text>
  
  <!-- Step 1: Terraform IaC -->
  <rect x="40" y="110" width="240" height="270" class="d337a-iac" />
  <text x="55" y="145" class="d337a-header" fill="#1d4ed8">1. Terraform IaC Engine</text>
  <text x="55" y="180" class="d337a-text">• `main.tf` defines GPU pool</text>
  <text x="55" y="205" class="d337a-text">• Declarative VPC &amp; Subnets</text>
  <text x="55" y="230" class="d337a-text">• Least-Privilege IAM Roles</text>
  <text x="55" y="255" class="d337a-text">• Secret Manager Integrations</text>
  <text x="55" y="295" class="d337a-text" font-weight="600" fill="#1d4ed8">Reproducible Infra</text>
  <text x="55" y="320" class="d337a-text">100% Drift-free configuration</text>
  
  <!-- Step 2: Container Registry -->
  <rect x="315" y="110" width="240" height="270" class="d337a-reg" />
  <text x="330" y="145" class="d337a-header" fill="#7e22ce">2. Secure Registry (ECR/GCR)</text>
  <text x="330" y="180" class="d337a-text">• Immutable Tagged Images</text>
  <text x="330" y="205" class="d337a-text">• `sha256:7f9a8b1c...` digest</text>
  <text x="330" y="230" class="d337a-text">• Vulnerability CVE Scanning</text>
  <text x="330" y="255" class="d337a-text">• Fast Regional Layer Caching</text>
  <text x="330" y="295" class="d337a-text" font-weight="600" fill="#7e22ce">Secure Artifacts</text>
  <text x="330" y="320" class="d337a-text">Cryptographically signed</text>
  
  <!-- Step 3: Cloud Serving Runtime -->
  <rect x="590" y="110" width="270" height="270" class="d337a-srv" />
  <text x="605" y="145" class="d337a-header" fill="#15803d">3. Cloud Serving Runtime</text>
  <text x="605" y="180" class="d337a-text">• Google Cloud Run with Nvidia L4</text>
  <text x="605" y="205" class="d337a-text">• Or AWS EKS Managed GPU Pool</text>
  <text x="605" y="230" class="d337a-text">• Rolling Zero-Downtime Update</text>
  <text x="605" y="255" class="d337a-text">• Automated Load Balancer Bind</text>
  <text x="605" y="295" class="d337a-text" font-weight="600" fill="#15803d">99.99% Availability</text>
  <text x="605" y="320" class="d337a-text">Live Production Traffic Serving</text>
</svg>