<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="What you are responsible for.">
  <title>A local runtime against a hosted service</title>
  <style>
    .local-vs-hosted-bg   { fill: #f8fafc; }
    .local-vs-hosted-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-vs-hosted-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-vs-hosted-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-vs-hosted-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-vs-hosted-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-vs-hosted-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .local-vs-hosted-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .local-vs-hosted-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .local-vs-hosted-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .local-vs-hosted-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .local-vs-hosted-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .local-vs-hosted-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .local-vs-hosted-row { opacity: 1; }
    .local-vs-hosted-r0 { animation-delay: 0.00s; }
    .local-vs-hosted-r1 { animation-delay: 0.45s; }
    .local-vs-hosted-r2 { animation-delay: 0.90s; }
    .local-vs-hosted-r3 { animation-delay: 1.35s; }
    .local-vs-hosted-r4 { animation-delay: 1.80s; }
    .local-vs-hosted-row { animation: local-vs-hosted-reveal 7.3s ease-in-out infinite; }
    @keyframes local-vs-hosted-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="local-vs-hosted-bg" width="980" height="390"/>
  <text class="local-vs-hosted-h1"  x="30" y="40">A local runtime against a hosted service</text>
  <text class="local-vs-hosted-sub" x="30" y="64">What you are responsible for.</text>
  <rect class="local-vs-hosted-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="local-vs-hosted-name" x="46" y="122">Local runtime</text>
  <text class="local-vs-hosted-desc" x="46" y="142">Yours to run.</text>
  <text class="local-vs-hosted-desc local-vs-hosted-row local-vs-hosted-r0" x="46" y="182">You choose and pin the model</text>
  <text class="local-vs-hosted-desc local-vs-hosted-row local-vs-hosted-r1" x="46" y="216">You own the hardware and its limits</text>
  <text class="local-vs-hosted-desc local-vs-hosted-row local-vs-hosted-r2" x="46" y="250">You update the runtime</text>
  <text class="local-vs-hosted-desc local-vs-hosted-row local-vs-hosted-r3" x="46" y="284">No usage metering</text>
  <text class="local-vs-hosted-desc local-vs-hosted-row local-vs-hosted-r4" x="46" y="318">One machine's throughput</text>
  <rect class="local-vs-hosted-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="local-vs-hosted-name" x="526" y="122">Hosted service</text>
  <text class="local-vs-hosted-desc" x="526" y="142">Theirs to run.</text>
  <text class="local-vs-hosted-desc local-vs-hosted-row local-vs-hosted-r0" x="526" y="182">Model versions move under you</text>
  <text class="local-vs-hosted-desc local-vs-hosted-row local-vs-hosted-r1" x="526" y="216">Capacity is somebody else's problem</text>
  <text class="local-vs-hosted-desc local-vs-hosted-row local-vs-hosted-r2" x="526" y="250">Updates arrive automatically</text>
  <text class="local-vs-hosted-desc local-vs-hosted-row local-vs-hosted-r3" x="526" y="284">Metered per token</text>
  <text class="local-vs-hosted-desc local-vs-hosted-row local-vs-hosted-r4" x="526" y="318">Effectively unlimited throughput</text>
  <text class="local-vs-hosted-sub" x="30" y="372">The first row of each column is the durable difference: local serving gives version stability, which is a correctness property rather than a cost one.</text>
</svg>
