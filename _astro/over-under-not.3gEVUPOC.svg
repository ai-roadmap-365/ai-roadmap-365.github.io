<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things this is not</title>
  <style>
    .over-under-not-bg   { fill: #f8fafc; }
    .over-under-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .over-under-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .over-under-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .over-under-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .over-under-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .over-under-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .over-under-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .over-under-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .over-under-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .over-under-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .over-under-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .over-under-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .over-under-not-row { opacity: 1; }
    .over-under-not-r0 { animation-delay: 0.00s; }
    .over-under-not-r1 { animation-delay: 0.45s; }
    .over-under-not-r2 { animation-delay: 0.90s; }
    .over-under-not-r3 { animation-delay: 1.35s; }
    .over-under-not-r4 { animation-delay: 1.80s; }
    .over-under-not-row { animation: over-under-not-reveal 7.3s ease-in-out infinite; }
    @keyframes over-under-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="over-under-not-bg" width="980" height="390"/>
  <text class="over-under-not-h1"  x="30" y="40">Four things this is not</text>
  <text class="over-under-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="over-under-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="over-under-not-name" x="46" y="122">The misconception</text>
  <text class="over-under-not-desc" x="46" y="142">Commonly held.</text>
  <text class="over-under-not-desc over-under-not-row over-under-not-r0" x="46" y="182">Any gap means overfitting</text>
  <text class="over-under-not-desc over-under-not-row over-under-not-r1" x="46" y="216">More parameters always overfit</text>
  <text class="over-under-not-desc over-under-not-row over-under-not-r2" x="46" y="250">More data always helps</text>
  <text class="over-under-not-desc over-under-not-row over-under-not-r3" x="46" y="284">Overfitting is the main risk</text>
  <text class="over-under-not-desc over-under-not-row over-under-not-r4" x="46" y="318">Complexity is one number</text>
  <rect class="over-under-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="over-under-not-name" x="526" y="122">What is true</text>
  <text class="over-under-not-desc" x="526" y="142">Actually.</text>
  <text class="over-under-not-desc over-under-not-row over-under-not-r0" x="526" y="182">Some gap is normal; a growing one is not</text>
  <text class="over-under-not-desc over-under-not-row over-under-not-r1" x="526" y="216">Past the interpolation threshold, not necessarily</text>
  <text class="over-under-not-desc over-under-not-row over-under-not-r2" x="526" y="250">Not when the model underfits</text>
  <text class="over-under-not-desc over-under-not-row over-under-not-r3" x="526" y="284">Underfitting is at least as common, and less noticed</text>
  <text class="over-under-not-desc over-under-not-row over-under-not-r4" x="526" y="318">Capacity, features, regularisation and time all move it</text>
  <text class="over-under-not-sub" x="30" y="372">Underfitting being less noticed is the practical asymmetry: overfitting announces itself with a gap, and underfitting just looks like a disappointing model.</text>
</svg>
