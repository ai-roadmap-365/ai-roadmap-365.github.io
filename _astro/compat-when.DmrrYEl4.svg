<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when to go direct.">
  <title>When to use a compatible layer</title>
  <style>
    .compat-when-bg   { fill: #f8fafc; }
    .compat-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compat-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compat-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compat-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compat-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compat-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .compat-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .compat-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .compat-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .compat-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .compat-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .compat-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .compat-when-row { opacity: 1; }
    .compat-when-r0 { animation-delay: 0.00s; }
    .compat-when-r1 { animation-delay: 0.45s; }
    .compat-when-r2 { animation-delay: 0.90s; }
    .compat-when-r3 { animation-delay: 1.35s; }
    .compat-when-r4 { animation-delay: 1.80s; }
    .compat-when-row { animation: compat-when-reveal 7.3s ease-in-out infinite; }
    @keyframes compat-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="compat-when-bg" width="980" height="390"/>
  <text class="compat-when-h1"  x="30" y="40">When to use a compatible layer</text>
  <text class="compat-when-sub" x="30" y="64">And when to go direct.</text>
  <rect class="compat-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="compat-when-name" x="46" y="122">Use the common interface</text>
  <text class="compat-when-desc" x="46" y="142">Portability.</text>
  <text class="compat-when-desc compat-when-row compat-when-r0" x="46" y="182">Several providers, or planned failover</text>
  <text class="compat-when-desc compat-when-row compat-when-r1" x="46" y="216">Local development against open models</text>
  <text class="compat-when-desc compat-when-row compat-when-r2" x="46" y="250">Cost routing between tiers</text>
  <text class="compat-when-desc compat-when-row compat-when-r3" x="46" y="284">Where lock-in is a stated concern</text>
  <text class="compat-when-desc compat-when-row compat-when-r4" x="46" y="318">And the common features suffice</text>
  <rect class="compat-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="compat-when-name" x="526" y="122">Go direct</text>
  <text class="compat-when-desc" x="526" y="142">Depth.</text>
  <text class="compat-when-desc compat-when-row compat-when-r0" x="526" y="182">Provider-specific caching or batch pricing</text>
  <text class="compat-when-desc compat-when-row compat-when-r1" x="526" y="216">Advanced tool-use semantics</text>
  <text class="compat-when-desc compat-when-row compat-when-r2" x="526" y="250">Newest features on release day</text>
  <text class="compat-when-desc compat-when-row compat-when-r3" x="526" y="284">One provider by policy</text>
  <text class="compat-when-desc compat-when-row compat-when-r4" x="526" y="318">Where the abstraction would cost more than it saves</text>
  <text class="compat-when-sub" x="30" y="372">Most systems end up doing both: a compatible path for the bulk of traffic, and a direct call where one provider's specific feature is worth the coupling.</text>
</svg>
