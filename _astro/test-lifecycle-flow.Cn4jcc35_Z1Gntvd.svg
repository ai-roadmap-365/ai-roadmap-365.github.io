<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 800" role="img" font-family="system-ui, sans-serif">
  <title>The life of a single test, in eight steps: it is collected as an item with an id, its module is imported once with assertions rewritten, its fixtures are resolved by name, it arranges its inputs, acts by calling the code under test, asserts one thing, is reported as a dot or an F with both sides of the comparison, and finally contributes to the summary line and the process exit code</title>
  <rect x="0" y="0" width="860" height="800" fill="#f8fafc"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The life of one test</text>
  <text x="430" y="56" text-anchor="middle" font-size="14" fill="#1a202c">followed here for test_word_count_of_the_sample_is_twelve</text>

  <!-- 1 -->
  <rect x="50" y="76" width="360" height="62" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="70" y="102" font-size="15" font-weight="bold" fill="#1a202c">1. Collected</text>
  <text x="70" y="124" font-size="14" fill="#1a202c">the name begins with test_, so it becomes an item</text>
  <text x="430" y="113" font-size="14" fill="#1d4ed8">id: test_textstats.py::test_word_count_of_the_sample_is_twelve</text>
  <line x1="230" y1="138" x2="230" y2="156" stroke="#1a202c" stroke-width="2"/>
  <polygon points="230,158 224,144 236,144" fill="#1a202c"/>

  <!-- 2 -->
  <rect x="50" y="158" width="360" height="62" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="70" y="184" font-size="15" font-weight="bold" fill="#1a202c">2. Module imported, assertions rewritten</text>
  <text x="70" y="206" font-size="14" fill="#1a202c">once per file, before any test runs</text>
  <text x="430" y="195" font-size="14" fill="#1d4ed8">import time is when assert gains its explanation</text>
  <line x1="230" y1="220" x2="230" y2="238" stroke="#1a202c" stroke-width="2"/>
  <polygon points="230,240 224,226 236,226" fill="#1a202c"/>

  <!-- 3 -->
  <rect x="50" y="240" width="360" height="62" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="70" y="266" font-size="15" font-weight="bold" fill="#1a202c">3. Fixtures resolved by name</text>
  <text x="70" y="288" font-size="14" fill="#1a202c">every parameter is looked up, not passed in</text>
  <text x="430" y="277" font-size="14" fill="#1d4ed8">sample_text comes from conftest.py</text>
  <line x1="230" y1="302" x2="230" y2="320" stroke="#1a202c" stroke-width="2"/>
  <polygon points="230,322 224,308 236,308" fill="#1a202c"/>

  <!-- 4 -->
  <rect x="50" y="322" width="360" height="62" fill="#ffffff" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="70" y="348" font-size="15" font-weight="bold" fill="#1a202c">4. Arrange — build the inputs</text>
  <text x="70" y="370" font-size="14" fill="#1a202c">a literal, a fixture, or a few lines of setup</text>
  <text x="430" y="359" font-size="14" fill="#1d4ed8">the twelve-word sample sentence, counted by hand</text>
  <line x1="230" y1="384" x2="230" y2="402" stroke="#1a202c" stroke-width="2"/>
  <polygon points="230,404 224,390 236,390" fill="#1a202c"/>

  <!-- 5 -->
  <rect x="50" y="404" width="360" height="62" fill="#ffffff" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="70" y="430" font-size="15" font-weight="bold" fill="#1a202c">5. Act — call the code under test</text>
  <text x="70" y="452" font-size="14" fill="#1a202c">exactly one call, so one thing can be wrong</text>
  <text x="430" y="441" font-size="14" fill="#1d4ed8">word_count(sample_text)</text>
  <line x1="230" y1="466" x2="230" y2="484" stroke="#1a202c" stroke-width="2"/>
  <polygon points="230,486 224,472 236,472" fill="#1a202c"/>

  <!-- 6 -->
  <rect x="50" y="486" width="360" height="62" fill="#ffffff" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="70" y="512" font-size="15" font-weight="bold" fill="#1a202c">6. Assert — state what must be true</text>
  <text x="70" y="534" font-size="14" fill="#1a202c">true: nothing happens · false: AssertionError</text>
  <text x="430" y="523" font-size="14" fill="#1d4ed8">assert word_count(sample_text) == 12</text>
  <line x1="230" y1="548" x2="230" y2="566" stroke="#1a202c" stroke-width="2"/>
  <polygon points="230,568 224,554 236,554" fill="#1a202c"/>

  <!-- 7: branch -->
  <rect x="50" y="568" width="360" height="88" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="70" y="594" font-size="15" font-weight="bold" fill="#1a202c">7. Reported</text>
  <text x="70" y="616" font-size="14" fill="#1a202c">passed: a single dot, and nothing else</text>
  <text x="70" y="636" font-size="14" fill="#1a202c">failed: an F now, the full body at the end</text>
  <text x="430" y="606" font-size="14" fill="#1d4ed8">E   assert 13 == 12</text>
  <text x="430" y="628" font-size="14" fill="#1d4ed8">E    +  where 13 = word_count('The quick brown ...')</text>
  <line x1="230" y1="656" x2="230" y2="674" stroke="#1a202c" stroke-width="2"/>
  <polygon points="230,676 224,662 236,662" fill="#1a202c"/>

  <!-- 8 -->
  <rect x="50" y="676" width="360" height="88" fill="#ffffff" stroke="#1d4ed8" stroke-width="3" rx="8"/>
  <text x="70" y="702" font-size="15" font-weight="bold" fill="#1a202c">8. Counted, then the process ends</text>
  <text x="70" y="724" font-size="14" fill="#1a202c">the summary line adds this test to the totals</text>
  <text x="70" y="744" font-size="14" fill="#1a202c">and the totals decide the exit code</text>
  <text x="430" y="714" font-size="14" fill="#1d4ed8">19 passed in 0.01s  →  exit 0</text>
  <text x="430" y="736" font-size="14" fill="#1d4ed8">4 failed, 15 passed in 0.01s  →  exit 1</text>

  <text x="430" y="788" text-anchor="middle" font-size="14" fill="#1a202c">A test that cannot fail never reaches step 7 with an F — and a suite you have never seen go red is a suite you have never tested.</text>
</svg>
