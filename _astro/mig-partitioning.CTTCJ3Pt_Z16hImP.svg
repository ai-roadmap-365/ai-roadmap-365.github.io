<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three properties you cannot get by sharing.">
  <title>Partitioning one large GPU</title>
  <style>
    .mig-partitioning-bg   { fill: #f8fafc; }
    .mig-partitioning-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mig-partitioning-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mig-partitioning-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mig-partitioning-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mig-partitioning-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mig-partitioning-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mig-partitioning-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mig-partitioning-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mig-partitioning-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mig-partitioning-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mig-partitioning-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mig-partitioning-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .mig-partitioning-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .mig-partitioning-stage { opacity: 1; }

    .mig-partitioning-s0 { animation-delay: 0.00s; }
    .mig-partitioning-e0 { animation-delay: 0.00s; }
    .mig-partitioning-s1 { animation-delay: 1.50s; }
    .mig-partitioning-e1 { animation-delay: 1.50s; }
    .mig-partitioning-s2 { animation-delay: 3.00s; }
    .mig-partitioning-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .mig-partitioning-conn  { animation: mig-partitioning-trace 6s ease-in-out infinite; }
      .mig-partitioning-stage { animation: mig-partitioning-arrive 6s ease-in-out infinite; }
    }
    @keyframes mig-partitioning-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes mig-partitioning-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .mig-partitioning-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .mig-partitioning-stage { animation: mig-partitioning-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes mig-partitioning-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="mig-partitioning-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="mig-partitioning-bg" width="980" height="322"/>
  <text class="mig-partitioning-h1"  x="30" y="40">Partitioning one large GPU</text>
  <text class="mig-partitioning-sub" x="30" y="64">Three properties you cannot get by sharing.</text>
  <g class="mig-partitioning-stage mig-partitioning-s0">
    <rect class="mig-partitioning-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="mig-partitioning-step" x="44" y="142">01</text>
    <text class="mig-partitioning-name" x="70" y="142">Dedicated hardware per slice</text>
    <text class="mig-partitioning-desc" x="44" y="166">Its own SMs, memory controllers and isolated</text>
    <text class="mig-partitioning-desc" x="44" y="182">VRAM. Up to seven slices.</text>
    <text class="mig-partitioning-edge" x="44" y="242">physical</text>
  </g>
  <line class="mig-partitioning-line mig-partitioning-conn mig-partitioning-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#mig-partitioning-tip)"/>
  <g class="mig-partitioning-stage mig-partitioning-s1">
    <rect class="mig-partitioning-good" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="mig-partitioning-step" x="359" y="142">02</text>
    <text class="mig-partitioning-name" x="385" y="142">Fault isolation</text>
    <text class="mig-partitioning-desc" x="359" y="166">A CUDA error in slice 1 leaves slices 2 to 7</text>
    <text class="mig-partitioning-desc" x="359" y="182">serving.</text>
  </g>
  <line class="mig-partitioning-line mig-partitioning-conn mig-partitioning-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#mig-partitioning-tip)"/>
  <g class="mig-partitioning-stage mig-partitioning-s2">
    <rect class="mig-partitioning-box" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="mig-partitioning-step" x="674" y="142">03</text>
    <text class="mig-partitioning-name" x="700" y="142">Deterministic quality of service</text>
    <text class="mig-partitioning-desc" x="674" y="166">A latency-sensitive endpoint gets a slice</text>
    <text class="mig-partitioning-desc" x="674" y="182">batch jobs cannot steal from.</text>
  </g>
  <text class="mig-partitioning-sub" x="30" y="304">Software-level GPU sharing gives none of these three: a crashed process can take the context down, and a background batch job can starve an interactive endpoint at exactly the wrong moment.</text>
</svg>
