<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are economic.">
  <title>Four consequences of readability</title>
  <style>
    .readable-implications-bg   { fill: #f8fafc; }
    .readable-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readable-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readable-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readable-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readable-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readable-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .readable-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .readable-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .readable-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .readable-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .readable-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .readable-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .readable-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .readable-implications-stage { opacity: 1; }

    .readable-implications-s0 { animation-delay: 0.00s; }
    .readable-implications-e0 { animation-delay: 0.00s; }
    .readable-implications-s1 { animation-delay: 1.28s; }
    .readable-implications-e1 { animation-delay: 1.28s; }
    .readable-implications-s2 { animation-delay: 2.56s; }
    .readable-implications-e2 { animation-delay: 2.56s; }
    .readable-implications-s3 { animation-delay: 3.84s; }
    .readable-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .readable-implications-conn  { animation: readable-implications-trace 6.4s ease-in-out infinite; }
      .readable-implications-stage { animation: readable-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes readable-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes readable-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .readable-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .readable-implications-stage { animation: readable-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes readable-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="readable-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="readable-implications-bg" width="980" height="322"/>
  <text class="readable-implications-h1"  x="30" y="40">Four consequences of readability</text>
  <text class="readable-implications-sub" x="30" y="64">Two are economic.</text>
  <g class="readable-implications-stage readable-implications-s0">
    <rect class="readable-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="readable-implications-step" x="44" y="142">01</text>
    <text class="readable-implications-name" x="70" y="142">Reviews find real problems</text>
    <text class="readable-implications-desc" x="44" y="166">Rather than being spent on</text>
    <text class="readable-implications-desc" x="44" y="182">formatting.</text>
  </g>
  <line class="readable-implications-line readable-implications-conn readable-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#readable-implications-tip)"/>
  <g class="readable-implications-stage readable-implications-s1">
    <rect class="readable-implications-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="readable-implications-step" x="280" y="142">02</text>
    <text class="readable-implications-name" x="306" y="142">And defects are visible by inspection</text>
    <text class="readable-implications-desc" x="280" y="166">Which is the cheapest place to</text>
    <text class="readable-implications-desc" x="280" y="182">find them.</text>
  </g>
  <line class="readable-implications-line readable-implications-conn readable-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#readable-implications-tip)"/>
  <g class="readable-implications-stage readable-implications-s2">
    <rect class="readable-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="readable-implications-step" x="516" y="142">03</text>
    <text class="readable-implications-name" x="542" y="142">New people become productive sooner</text>
    <text class="readable-implications-desc" x="516" y="166">Which is a real and measurable</text>
    <text class="readable-implications-desc" x="516" y="182">cost.</text>
  </g>
  <line class="readable-implications-line readable-implications-conn readable-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#readable-implications-tip)"/>
  <g class="readable-implications-stage readable-implications-s3">
    <rect class="readable-implications-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="readable-implications-step" x="752" y="142">04</text>
    <text class="readable-implications-name" x="778" y="142">While change gets cheaper rather than riskier</text>
    <text class="readable-implications-desc" x="752" y="166">Which compounds over a</text>
    <text class="readable-implications-desc" x="752" y="182">codebase's life.</text>
  </g>
  <text class="readable-implications-sub" x="30" y="304">Change getting cheaper rather than riskier is the compounding effect: unreadable code accumulates workarounds because nobody dares modify it.</text>
</svg>
