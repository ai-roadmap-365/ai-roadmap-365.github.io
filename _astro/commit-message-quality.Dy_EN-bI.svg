<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The diff already says what changed.">
  <title>The one part of a commit a machine cannot reconstruct</title>
  <style>
    .commit-message-quality-bg   { fill: #f8fafc; }
    .commit-message-quality-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .commit-message-quality-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .commit-message-quality-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .commit-message-quality-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .commit-message-quality-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .commit-message-quality-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .commit-message-quality-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .commit-message-quality-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .commit-message-quality-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .commit-message-quality-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .commit-message-quality-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .commit-message-quality-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .commit-message-quality-row { opacity: 1; }
    .commit-message-quality-r0 { animation-delay: 0.00s; }
    .commit-message-quality-r1 { animation-delay: 0.45s; }
    .commit-message-quality-r2 { animation-delay: 0.90s; }
    .commit-message-quality-r3 { animation-delay: 1.35s; }
    .commit-message-quality-r4 { animation-delay: 1.80s; }
    .commit-message-quality-row { animation: commit-message-quality-reveal 7.3s ease-in-out infinite; }
    @keyframes commit-message-quality-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="commit-message-quality-bg" width="980" height="390"/>
  <text class="commit-message-quality-h1"  x="30" y="40">The one part of a commit a machine cannot reconstruct</text>
  <text class="commit-message-quality-sub" x="30" y="64">The diff already says what changed.</text>
  <rect class="commit-message-quality-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="commit-message-quality-name" x="46" y="122">Says what</text>
  <text class="commit-message-quality-desc" x="46" y="142">The diff already told you this.</text>
  <text class="commit-message-quality-desc commit-message-quality-row commit-message-quality-r0" x="46" y="182">"Updated file"</text>
  <text class="commit-message-quality-desc commit-message-quality-row commit-message-quality-r1" x="46" y="216">"Fixed bug"</text>
  <text class="commit-message-quality-desc commit-message-quality-row commit-message-quality-r2" x="46" y="250">"Changes"</text>
  <text class="commit-message-quality-desc commit-message-quality-row commit-message-quality-r3" x="46" y="284">"WIP"</text>
  <text class="commit-message-quality-desc commit-message-quality-row commit-message-quality-r4" x="46" y="318">Worthless in six months</text>
  <rect class="commit-message-quality-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="commit-message-quality-name" x="526" y="122">Says why</text>
  <text class="commit-message-quality-desc" x="526" y="142">The part that is otherwise lost.</text>
  <text class="commit-message-quality-desc commit-message-quality-row commit-message-quality-r0" x="526" y="182">"Retry only idempotent requests"</text>
  <text class="commit-message-quality-desc commit-message-quality-row commit-message-quality-r1" x="526" y="216">"Pin tokenizer: v0.15 changed whitespace handling"</text>
  <text class="commit-message-quality-desc commit-message-quality-row commit-message-quality-r2" x="526" y="250">"Cache embeddings; recomputing cost 40 minutes per run"</text>
  <text class="commit-message-quality-desc commit-message-quality-row commit-message-quality-r3" x="526" y="284">"Revert batching: it broke ordering under load"</text>
  <text class="commit-message-quality-desc commit-message-quality-row commit-message-quality-r4" x="526" y="318">Still useful in six years</text>
  <text class="commit-message-quality-sub" x="30" y="372">Write the message for the person who finds this commit while debugging something unrelated, eighteen months from now. That person is usually you, and they have forgotten everything.</text>
</svg>
