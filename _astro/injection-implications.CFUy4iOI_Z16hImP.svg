<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Design ones.">
  <title>Four consequences of injection risk</title>
  <style>
    .injection-implications-bg   { fill: #f8fafc; }
    .injection-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .injection-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .injection-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .injection-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .injection-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .injection-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .injection-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .injection-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .injection-implications-stage { opacity: 1; }

    .injection-implications-s0 { animation-delay: 0.00s; }
    .injection-implications-e0 { animation-delay: 0.00s; }
    .injection-implications-s1 { animation-delay: 1.28s; }
    .injection-implications-e1 { animation-delay: 1.28s; }
    .injection-implications-s2 { animation-delay: 2.56s; }
    .injection-implications-e2 { animation-delay: 2.56s; }
    .injection-implications-s3 { animation-delay: 3.84s; }
    .injection-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .injection-implications-conn  { animation: injection-implications-trace 6.4s ease-in-out infinite; }
      .injection-implications-stage { animation: injection-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes injection-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes injection-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .injection-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .injection-implications-stage { animation: injection-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes injection-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="injection-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="injection-implications-bg" width="980" height="322"/>
  <text class="injection-implications-h1"  x="30" y="40">Four consequences of injection risk</text>
  <text class="injection-implications-sub" x="30" y="64">Design ones.</text>
  <g class="injection-implications-stage injection-implications-s0">
    <rect class="injection-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="injection-implications-step" x="44" y="142">01</text>
    <text class="injection-implications-name" x="70" y="142">Every piece of content the model reads is untrusted</text>
    <text class="injection-implications-desc" x="44" y="166">Including internal documents</text>
    <text class="injection-implications-desc" x="44" y="182">somebody else can write to.</text>
  </g>
  <line class="injection-implications-line injection-implications-conn injection-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#injection-implications-tip)"/>
  <g class="injection-implications-stage injection-implications-s1">
    <rect class="injection-implications-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="injection-implications-step" x="280" y="142">02</text>
    <text class="injection-implications-name" x="306" y="142">So tools run with the least privilege that works</text>
    <text class="injection-implications-desc" x="280" y="166">And write access is separated</text>
    <text class="injection-implications-desc" x="280" y="182">from read access.</text>
  </g>
  <line class="injection-implications-line injection-implications-conn injection-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#injection-implications-tip)"/>
  <g class="injection-implications-stage injection-implications-s2">
    <rect class="injection-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="injection-implications-step" x="516" y="142">03</text>
    <text class="injection-implications-name" x="542" y="142">Log every tool call with its trigger</text>
    <text class="injection-implications-desc" x="516" y="166">Because an incident has to be</text>
    <text class="injection-implications-desc" x="516" y="182">reconstructable.</text>
  </g>
  <line class="injection-implications-line injection-implications-conn injection-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#injection-implications-tip)"/>
  <g class="injection-implications-stage injection-implications-s3">
    <rect class="injection-implications-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="injection-implications-step" x="752" y="142">04</text>
    <text class="injection-implications-name" x="778" y="142">And design assuming injection succeeds</text>
    <text class="injection-implications-desc" x="752" y="166">The question is what it can then</text>
    <text class="injection-implications-desc" x="752" y="182">do.</text>
  </g>
  <text class="injection-implications-sub" x="30" y="304">Designing for the assumption that injection succeeds is the only defensible posture given that no defence is complete, and it changes architecture rather than adding filters.</text>
</svg>
