<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two threads, one counter, and nothing that crashes.">
  <title>How an increment goes missing</title>
  <style>
    .race-condition-bg   { fill: #f8fafc; }
    .race-condition-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .race-condition-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .race-condition-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .race-condition-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .race-condition-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .race-condition-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .race-condition-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .race-condition-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .race-condition-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .race-condition-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .race-condition-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .race-condition-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .race-condition-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .race-condition-stage { opacity: 1; }

    .race-condition-s0 { animation-delay: 0.00s; }
    .race-condition-e0 { animation-delay: 0.00s; }
    .race-condition-s1 { animation-delay: 1.33s; }
    .race-condition-e1 { animation-delay: 1.33s; }
    .race-condition-s2 { animation-delay: 2.67s; }
    .race-condition-e2 { animation-delay: 2.67s; }
    .race-condition-s3 { animation-delay: 4.00s; }
    .race-condition-e3 { animation-delay: 4.00s; }
    .race-condition-s4 { animation-delay: 5.33s; }
    .race-condition-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .race-condition-conn  { animation: race-condition-trace 8s ease-in-out infinite; }
      .race-condition-stage { animation: race-condition-arrive 8s ease-in-out infinite; }
    }
    @keyframes race-condition-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes race-condition-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .race-condition-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .race-condition-stage { animation: race-condition-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes race-condition-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="race-condition-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="race-condition-bg" width="980" height="322"/>
  <text class="race-condition-h1"  x="30" y="40">How an increment goes missing</text>
  <text class="race-condition-sub" x="30" y="64">Two threads, one counter, and nothing that crashes.</text>
  <g class="race-condition-stage race-condition-s0">
    <rect class="race-condition-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="race-condition-step" x="44" y="142">01</text>
    <text class="race-condition-name" x="70" y="142">The counter holds 41</text>
    <text class="race-condition-desc" x="44" y="166">Two threads are about to</text>
    <text class="race-condition-desc" x="44" y="182">run counter = counter +</text>
    <text class="race-condition-desc" x="44" y="198">1.</text>
  </g>
  <line class="race-condition-line race-condition-conn race-condition-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#race-condition-tip)"/>
  <g class="race-condition-stage race-condition-s1">
    <rect class="race-condition-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="race-condition-step" x="233" y="142">02</text>
    <text class="race-condition-name" x="259" y="142">Thread A reads</text>
    <text class="race-condition-desc" x="233" y="166">It has 41 in hand. Its</text>
    <text class="race-condition-desc" x="233" y="182">time slice ends here.</text>
    <text class="race-condition-edge" x="233" y="242">reads 41</text>
  </g>
  <line class="race-condition-line race-condition-conn race-condition-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#race-condition-tip)"/>
  <g class="race-condition-stage race-condition-s2">
    <rect class="race-condition-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="race-condition-step" x="422" y="142">03</text>
    <text class="race-condition-name" x="448" y="142">Thread B reads</text>
    <text class="race-condition-desc" x="422" y="166">It also has 41. Neither</text>
    <text class="race-condition-desc" x="422" y="182">has written yet.</text>
    <text class="race-condition-edge" x="422" y="242">reads 41</text>
  </g>
  <line class="race-condition-line race-condition-conn race-condition-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#race-condition-tip)"/>
  <g class="race-condition-stage race-condition-s3">
    <rect class="race-condition-warn" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="race-condition-step" x="611" y="142">04</text>
    <text class="race-condition-name" x="637" y="142">Both add one and write</text>
    <text class="race-condition-desc" x="611" y="166">A writes 42. B writes 42.</text>
    <text class="race-condition-edge" x="611" y="242">writes 42</text>
  </g>
  <line class="race-condition-line race-condition-conn race-condition-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#race-condition-tip)"/>
  <g class="race-condition-stage race-condition-s4">
    <rect class="race-condition-warn" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="race-condition-step" x="800" y="142">05</text>
    <text class="race-condition-name" x="826" y="142">Two increments, one increase</text>
    <text class="race-condition-desc" x="800" y="166">The counter reads 42, not</text>
    <text class="race-condition-desc" x="800" y="182">43. Nothing raised.</text>
    <text class="race-condition-desc" x="800" y="198">Nothing logged.</text>
    <text class="race-condition-edge" x="800" y="242">lost</text>
  </g>
  <text class="race-condition-sub" x="30" y="304">Race conditions are among the hardest bugs in software because the timing that triggers them is not reliably reproducible.</text>
</svg>
