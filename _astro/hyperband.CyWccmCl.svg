<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Stopping bad runs early</title>
  <style>
    .hyperband-bg   { fill: #f8fafc; }
    .hyperband-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hyperband-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hyperband-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hyperband-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hyperband-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hyperband-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hyperband-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hyperband-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hyperband-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hyperband-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hyperband-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hyperband-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .hyperband-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .hyperband-stage { opacity: 1; }

    .hyperband-s0 { animation-delay: 0.00s; }
    .hyperband-e0 { animation-delay: 0.00s; }
    .hyperband-s1 { animation-delay: 1.28s; }
    .hyperband-e1 { animation-delay: 1.28s; }
    .hyperband-s2 { animation-delay: 2.56s; }
    .hyperband-e2 { animation-delay: 2.56s; }
    .hyperband-s3 { animation-delay: 3.84s; }
    .hyperband-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .hyperband-conn  { animation: hyperband-trace 6.4s ease-in-out infinite; }
      .hyperband-stage { animation: hyperband-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes hyperband-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes hyperband-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .hyperband-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .hyperband-stage { animation: hyperband-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes hyperband-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="hyperband-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="hyperband-bg" width="980" height="322"/>
  <text class="hyperband-h1"  x="30" y="40">Stopping bad runs early</text>
  <text class="hyperband-sub" x="30" y="64">Four steps.</text>
  <g class="hyperband-stage hyperband-s0">
    <rect class="hyperband-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="hyperband-step" x="44" y="142">01</text>
    <text class="hyperband-name" x="70" y="142">Start many configurations with a tiny budget</text>
    <text class="hyperband-desc" x="44" y="166">A few epochs, or a fraction of</text>
    <text class="hyperband-desc" x="44" y="182">the data.</text>
  </g>
  <line class="hyperband-line hyperband-conn hyperband-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#hyperband-tip)"/>
  <g class="hyperband-stage hyperband-s1">
    <rect class="hyperband-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="hyperband-step" x="280" y="142">02</text>
    <text class="hyperband-name" x="306" y="142">Rank them on that partial result</text>
    <text class="hyperband-desc" x="280" y="166">Which correlates with the final</text>
    <text class="hyperband-desc" x="280" y="182">one, imperfectly.</text>
  </g>
  <line class="hyperband-line hyperband-conn hyperband-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#hyperband-tip)"/>
  <g class="hyperband-stage hyperband-s2">
    <rect class="hyperband-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="hyperband-step" x="516" y="142">03</text>
    <text class="hyperband-name" x="542" y="142">Discard the worst half and continue the rest</text>
    <text class="hyperband-desc" x="516" y="166">With double the budget each.</text>
  </g>
  <line class="hyperband-line hyperband-conn hyperband-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#hyperband-tip)"/>
  <g class="hyperband-stage hyperband-s3">
    <rect class="hyperband-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="hyperband-step" x="752" y="142">04</text>
    <text class="hyperband-name" x="778" y="142">Repeating until one remains</text>
    <text class="hyperband-desc" x="752" y="166">Which explores far more</text>
    <text class="hyperband-desc" x="752" y="182">configurations per unit compute.</text>
  </g>
  <text class="hyperband-sub" x="30" y="304">The imperfect correlation is the risk: a configuration that starts slowly and finishes strongly gets eliminated, which is why the aggressiveness is itself a parameter.</text>
</svg>
