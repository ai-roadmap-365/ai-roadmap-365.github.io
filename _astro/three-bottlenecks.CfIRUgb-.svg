<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="None of them is the model.">
  <title>Three physical bottlenecks</title>
  <style>
    .three-bottlenecks-bg   { fill: #f8fafc; }
    .three-bottlenecks-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-bottlenecks-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-bottlenecks-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-bottlenecks-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-bottlenecks-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-bottlenecks-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-bottlenecks-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-bottlenecks-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-bottlenecks-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-bottlenecks-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-bottlenecks-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-bottlenecks-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .three-bottlenecks-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .three-bottlenecks-stage { opacity: 1; }

    .three-bottlenecks-s0 { animation-delay: 0.00s; }
    .three-bottlenecks-e0 { animation-delay: 0.00s; }
    .three-bottlenecks-s1 { animation-delay: 1.50s; }
    .three-bottlenecks-e1 { animation-delay: 1.50s; }
    .three-bottlenecks-s2 { animation-delay: 3.00s; }
    .three-bottlenecks-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .three-bottlenecks-conn  { animation: three-bottlenecks-trace 6s ease-in-out infinite; }
      .three-bottlenecks-stage { animation: three-bottlenecks-arrive 6s ease-in-out infinite; }
    }
    @keyframes three-bottlenecks-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes three-bottlenecks-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .three-bottlenecks-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .three-bottlenecks-stage { animation: three-bottlenecks-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes three-bottlenecks-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="three-bottlenecks-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="three-bottlenecks-bg" width="980" height="322"/>
  <text class="three-bottlenecks-h1"  x="30" y="40">Three physical bottlenecks</text>
  <text class="three-bottlenecks-sub" x="30" y="64">None of them is the model.</text>
  <g class="three-bottlenecks-stage three-bottlenecks-s0">
    <rect class="three-bottlenecks-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="three-bottlenecks-step" x="44" y="142">01</text>
    <text class="three-bottlenecks-name" x="70" y="142">Inter-GPU bandwidth</text>
    <text class="three-bottlenecks-desc" x="44" y="166">PCIe caps at 64 GB/s. Tensor cores stall</text>
    <text class="three-bottlenecks-desc" x="44" y="182">waiting for activations.</text>
    <text class="three-bottlenecks-edge" x="44" y="242">64 GB/s</text>
  </g>
  <line class="three-bottlenecks-line three-bottlenecks-conn three-bottlenecks-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#three-bottlenecks-tip)"/>
  <g class="three-bottlenecks-stage three-bottlenecks-s1">
    <rect class="three-bottlenecks-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="three-bottlenecks-step" x="359" y="142">02</text>
    <text class="three-bottlenecks-name" x="385" y="142">Single-request thrashing</text>
    <text class="three-bottlenecks-desc" x="359" y="166">Kernel launch overhead wastes 85% of</text>
    <text class="three-bottlenecks-desc" x="359" y="182">matrix-multiply capacity.</text>
    <text class="three-bottlenecks-edge" x="359" y="242">85%</text>
  </g>
  <line class="three-bottlenecks-line three-bottlenecks-conn three-bottlenecks-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#three-bottlenecks-tip)"/>
  <g class="three-bottlenecks-stage three-bottlenecks-s2">
    <rect class="three-bottlenecks-box" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="three-bottlenecks-step" x="674" y="142">03</text>
    <text class="three-bottlenecks-name" x="700" y="142">Unpinned host memory</text>
    <text class="three-bottlenecks-desc" x="674" y="166">Synchronous page locking adds 15-30 ms before</text>
    <text class="three-bottlenecks-desc" x="674" y="182">computation starts.</text>
    <text class="three-bottlenecks-edge" x="674" y="242">30 ms</text>
  </g>
  <text class="three-bottlenecks-sub" x="30" y="304">All three are systems problems rather than model problems, which is the shape of the whole lesson: the expensive asset is the GPU, and almost every serving improvement is about keeping it busy rather than making it faster.</text>
</svg>
