<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What these metrics are not</title>
  <style>
    .metrics-not-bg   { fill: #f8fafc; }
    .metrics-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metrics-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metrics-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metrics-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metrics-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metrics-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .metrics-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .metrics-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .metrics-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .metrics-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .metrics-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .metrics-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .metrics-not-row { opacity: 1; }
    .metrics-not-r0 { animation-delay: 0.00s; }
    .metrics-not-r1 { animation-delay: 0.45s; }
    .metrics-not-r2 { animation-delay: 0.90s; }
    .metrics-not-r3 { animation-delay: 1.35s; }
    .metrics-not-r4 { animation-delay: 1.80s; }
    .metrics-not-row { animation: metrics-not-reveal 7.3s ease-in-out infinite; }
    @keyframes metrics-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="metrics-not-bg" width="980" height="390"/>
  <text class="metrics-not-h1"  x="30" y="40">What these metrics are not</text>
  <text class="metrics-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="metrics-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="metrics-not-name" x="46" y="122">The misconception</text>
  <text class="metrics-not-desc" x="46" y="142">Commonly held.</text>
  <text class="metrics-not-desc metrics-not-row metrics-not-r0" x="46" y="182">A higher score is always a better model</text>
  <text class="metrics-not-desc metrics-not-row metrics-not-r1" x="46" y="216">One metric can summarise performance</text>
  <text class="metrics-not-desc metrics-not-row metrics-not-r2" x="46" y="250">The threshold is fixed at one half</text>
  <text class="metrics-not-desc metrics-not-row metrics-not-r3" x="46" y="284">Area under the curve is model quality</text>
  <text class="metrics-not-desc metrics-not-row metrics-not-r4" x="46" y="318">Metrics are comparable across datasets</text>
  <rect class="metrics-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="metrics-not-name" x="526" y="122">What is true</text>
  <text class="metrics-not-desc" x="526" y="142">Actually.</text>
  <text class="metrics-not-desc metrics-not-row metrics-not-r0" x="526" y="182">Better on this metric, at this threshold</text>
  <text class="metrics-not-desc metrics-not-row metrics-not-r1" x="526" y="216">Different errors need different metrics</text>
  <text class="metrics-not-desc metrics-not-row metrics-not-r2" x="526" y="250">It is a separate, revisable choice</text>
  <text class="metrics-not-desc metrics-not-row metrics-not-r3" x="526" y="284">It summarises all thresholds, including useless ones</text>
  <text class="metrics-not-desc metrics-not-row metrics-not-r4" x="526" y="318">Only within the same class balance</text>
  <text class="metrics-not-sub" x="30" y="372">The fourth row matters when comparing published results: a single area figure averages over operating points nobody would ever deploy.</text>
</svg>
