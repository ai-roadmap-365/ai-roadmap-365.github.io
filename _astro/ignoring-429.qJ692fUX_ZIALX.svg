<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The limit is the polite version.">
  <title>What ignoring a 429 escalates to</title>
  <style>
    .ignoring-429-bg   { fill: #f8fafc; }
    .ignoring-429-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ignoring-429-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ignoring-429-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ignoring-429-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ignoring-429-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ignoring-429-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ignoring-429-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ignoring-429-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ignoring-429-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ignoring-429-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ignoring-429-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ignoring-429-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ignoring-429-row { opacity: 1; }
    .ignoring-429-r0 { animation-delay: 0.00s; }
    .ignoring-429-r1 { animation-delay: 0.45s; }
    .ignoring-429-r2 { animation-delay: 0.90s; }
    .ignoring-429-r3 { animation-delay: 1.35s; }
    .ignoring-429-r4 { animation-delay: 1.80s; }
    .ignoring-429-row { animation: ignoring-429-reveal 7.3s ease-in-out infinite; }
    @keyframes ignoring-429-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="ignoring-429-bg" width="980" height="390"/>
  <text class="ignoring-429-h1"  x="30" y="40">What ignoring a 429 escalates to</text>
  <text class="ignoring-429-sub" x="30" y="64">The limit is the polite version.</text>
  <rect class="ignoring-429-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="ignoring-429-name" x="46" y="122">Respect it</text>
  <text class="ignoring-429-desc" x="46" y="142">Wait, then continue.</text>
  <text class="ignoring-429-desc ignoring-429-row ignoring-429-r0" x="46" y="182">Obey Retry-After exactly</text>
  <text class="ignoring-429-desc ignoring-429-row ignoring-429-r1" x="46" y="216">Or back off with jitter</text>
  <text class="ignoring-429-desc ignoring-429-row ignoring-429-r2" x="46" y="250">Total runtime is SHORTER</text>
  <text class="ignoring-429-desc ignoring-429-row ignoring-429-r3" x="46" y="284">The service stays healthy</text>
  <text class="ignoring-429-desc ignoring-429-row ignoring-429-r4" x="46" y="318">Your account stays in good standing</text>
  <rect class="ignoring-429-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="ignoring-429-name" x="526" y="122">Ignore it</text>
  <text class="ignoring-429-desc" x="526" y="142">Keep sending anyway.</text>
  <text class="ignoring-429-desc ignoring-429-row ignoring-429-r0" x="526" y="182">Every request is refused and wasted</text>
  <text class="ignoring-429-desc ignoring-429-row ignoring-429-r1" x="526" y="216">Longer backoff windows imposed</text>
  <text class="ignoring-429-desc ignoring-429-row ignoring-429-r2" x="526" y="250">Then a temporary block</text>
  <text class="ignoring-429-desc ignoring-429-row ignoring-429-r3" x="526" y="284">Then a key revoked, or an account suspended</text>
  <text class="ignoring-429-desc ignoring-429-row ignoring-429-r4" x="526" y="318">And a conversation with the provider</text>
  <text class="ignoring-429-sub" x="30" y="372">A 429 is the service choosing to refuse you rather than fall over — which makes it a cooperative signal, and treating it as an obstacle to push through is what turns it into an enforcement one.</text>
</svg>
