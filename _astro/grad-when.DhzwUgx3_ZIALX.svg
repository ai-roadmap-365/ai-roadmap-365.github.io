<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not.">
  <title>When gradients are usable</title>
  <style>
    .grad-when-bg   { fill: #f8fafc; }
    .grad-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grad-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grad-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grad-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grad-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grad-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .grad-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .grad-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .grad-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .grad-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .grad-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .grad-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .grad-when-row { opacity: 1; }
    .grad-when-r0 { animation-delay: 0.00s; }
    .grad-when-r1 { animation-delay: 0.45s; }
    .grad-when-r2 { animation-delay: 0.90s; }
    .grad-when-r3 { animation-delay: 1.35s; }
    .grad-when-r4 { animation-delay: 1.80s; }
    .grad-when-row { animation: grad-when-reveal 7.3s ease-in-out infinite; }
    @keyframes grad-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="grad-when-bg" width="980" height="390"/>
  <text class="grad-when-h1"  x="30" y="40">When gradients are usable</text>
  <text class="grad-when-sub" x="30" y="64">And when not.</text>
  <rect class="grad-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="grad-when-name" x="46" y="122">Usable</text>
  <text class="grad-when-desc" x="46" y="142">Four cases.</text>
  <text class="grad-when-desc grad-when-row grad-when-r0" x="46" y="182">Differentiable objectives</text>
  <text class="grad-when-desc grad-when-row grad-when-r1" x="46" y="216">Continuous parameters</text>
  <text class="grad-when-desc grad-when-row grad-when-r2" x="46" y="250">Very high dimensions</text>
  <text class="grad-when-desc grad-when-row grad-when-r3" x="46" y="284">Where an automatic framework exists</text>
  <text class="grad-when-desc grad-when-row grad-when-r4" x="46" y="318">Large-scale model training</text>
  <rect class="grad-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="grad-when-name" x="526" y="122">Not usable</text>
  <text class="grad-when-desc" x="526" y="142">Also four.</text>
  <text class="grad-when-desc grad-when-row grad-when-r0" x="526" y="182">Discrete or categorical decisions</text>
  <text class="grad-when-desc grad-when-row grad-when-r1" x="526" y="216">Non-differentiable objectives</text>
  <text class="grad-when-desc grad-when-row grad-when-r2" x="526" y="250">Black-box simulations</text>
  <text class="grad-when-desc grad-when-row grad-when-r3" x="526" y="284">Where evaluation is extremely costly</text>
  <text class="grad-when-desc grad-when-row grad-when-r4" x="526" y="318">Combinatorial structures</text>
  <text class="grad-when-sub" x="30" y="372">High dimensions appearing in the usable column is worth noticing: gradients are one of very few methods whose cost does not explode with parameter count.</text>
</svg>
