<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Claimed, then verified.">
  <title>Two eras of grounding</title>
  <style>
    .citation-history-bg   { fill: #f8fafc; }
    .citation-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .citation-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .citation-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .citation-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .citation-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .citation-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .citation-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .citation-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .citation-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .citation-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .citation-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .citation-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .citation-history-row { opacity: 1; }
    .citation-history-r0 { animation-delay: 0.00s; }
    .citation-history-r1 { animation-delay: 0.45s; }
    .citation-history-r2 { animation-delay: 0.90s; }
    .citation-history-r3 { animation-delay: 1.35s; }
    .citation-history-r4 { animation-delay: 1.80s; }
    .citation-history-row { animation: citation-history-reveal 7.3s ease-in-out infinite; }
    @keyframes citation-history-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="citation-history-bg" width="980" height="390"/>
  <text class="citation-history-h1"  x="30" y="40">Two eras of grounding</text>
  <text class="citation-history-sub" x="30" y="64">Claimed, then verified.</text>
  <rect class="citation-history-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="citation-history-name" x="46" y="122">Ask it to cite</text>
  <text class="citation-history-desc" x="46" y="142">The first approach.</text>
  <text class="citation-history-desc citation-history-row citation-history-r0" x="46" y="182">An instruction in the prompt</text>
  <text class="citation-history-desc citation-history-row citation-history-r1" x="46" y="216">Citations produced, and sometimes wrong</text>
  <text class="citation-history-desc citation-history-row citation-history-r2" x="46" y="250">Attribution can be fabricated</text>
  <text class="citation-history-desc citation-history-row citation-history-r3" x="46" y="284">No measurement of correctness</text>
  <text class="citation-history-desc citation-history-row citation-history-r4" x="46" y="318">Which reads as rigorous</text>
  <rect class="citation-history-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="citation-history-name" x="526" y="122">Verify the citations</text>
  <text class="citation-history-desc" x="526" y="142">The current one.</text>
  <text class="citation-history-desc citation-history-row citation-history-r0" x="526" y="182">Claims extracted and checked</text>
  <text class="citation-history-desc citation-history-row citation-history-r1" x="526" y="216">Unsupported ones removed</text>
  <text class="citation-history-desc citation-history-row citation-history-r2" x="526" y="250">Attribution guaranteed by construction</text>
  <text class="citation-history-desc citation-history-row citation-history-r3" x="526" y="284">Precision and recall reported</text>
  <text class="citation-history-desc citation-history-row citation-history-r4" x="526" y="318">Which is rigorous</text>
  <text class="citation-history-sub" x="30" y="372">The shift happened because fabricated citations reached courtrooms and newspapers, which made the difference between claimed and verified attribution concrete.</text>
</svg>
