<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A container shares the host kernel.">
  <title>Isolation is not security</title>
  <style>
    .not-a-security-boundary-bg   { fill: #f8fafc; }
    .not-a-security-boundary-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-security-boundary-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-security-boundary-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-security-boundary-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-security-boundary-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-security-boundary-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-a-security-boundary-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .not-a-security-boundary-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .not-a-security-boundary-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .not-a-security-boundary-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .not-a-security-boundary-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .not-a-security-boundary-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-a-security-boundary-row { opacity: 1; }
    .not-a-security-boundary-r0 { animation-delay: 0.00s; }
    .not-a-security-boundary-r1 { animation-delay: 0.45s; }
    .not-a-security-boundary-r2 { animation-delay: 0.90s; }
    .not-a-security-boundary-r3 { animation-delay: 1.35s; }
    .not-a-security-boundary-r4 { animation-delay: 1.80s; }
    .not-a-security-boundary-row { animation: not-a-security-boundary-reveal 7.3s ease-in-out infinite; }
    @keyframes not-a-security-boundary-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="not-a-security-boundary-bg" width="980" height="390"/>
  <text class="not-a-security-boundary-h1"  x="30" y="40">Isolation is not security</text>
  <text class="not-a-security-boundary-sub" x="30" y="64">A container shares the host kernel.</text>
  <rect class="not-a-security-boundary-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="not-a-security-boundary-name" x="46" y="122">What it gives you</text>
  <text class="not-a-security-boundary-desc" x="46" y="142">A strong isolation boundary.</text>
  <text class="not-a-security-boundary-desc not-a-security-boundary-row not-a-security-boundary-r0" x="46" y="182">Its own filesystem view</text>
  <text class="not-a-security-boundary-desc not-a-security-boundary-row not-a-security-boundary-r1" x="46" y="216">Its own process table and network</text>
  <text class="not-a-security-boundary-desc not-a-security-boundary-row not-a-security-boundary-r2" x="46" y="250">Resource limits via cgroups</text>
  <text class="not-a-security-boundary-desc not-a-security-boundary-row not-a-security-boundary-r3" x="46" y="284">Starts in milliseconds</text>
  <text class="not-a-security-boundary-desc not-a-security-boundary-row not-a-security-boundary-r4" x="46" y="318">Enough for your own code</text>
  <rect class="not-a-security-boundary-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="not-a-security-boundary-name" x="526" y="122">What it does not</text>
  <text class="not-a-security-boundary-desc" x="526" y="142">A weak security boundary.</text>
  <text class="not-a-security-boundary-desc not-a-security-boundary-row not-a-security-boundary-r0" x="526" y="182">No guest kernel — the host's is shared</text>
  <text class="not-a-security-boundary-desc not-a-security-boundary-row not-a-security-boundary-r1" x="526" y="216">A kernel bug is an escape</text>
  <text class="not-a-security-boundary-desc not-a-security-boundary-row not-a-security-boundary-r2" x="526" y="250">Root inside is uid 0 unless you say otherwise</text>
  <text class="not-a-security-boundary-desc not-a-security-boundary-row not-a-security-boundary-r3" x="526" y="284">Not a sandbox for hostile code</text>
  <text class="not-a-security-boundary-desc not-a-security-boundary-row not-a-security-boundary-r4" x="526" y="318">Use gVisor, Firecracker or a real VM</text>
  <text class="not-a-security-boundary-sub" x="30" y="372">Treating it as the first column is correct and treating it as the second is how untrusted workloads get run on shared hosts — the same distinction people re-learn painfully with chroot.</text>
</svg>
