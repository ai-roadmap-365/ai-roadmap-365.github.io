<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Same question, incomparable outputs.">
  <title>A skim, or an investigation</title>
  <style>
    .skim-or-investigate-bg   { fill: #f8fafc; }
    .skim-or-investigate-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .skim-or-investigate-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .skim-or-investigate-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .skim-or-investigate-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .skim-or-investigate-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .skim-or-investigate-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .skim-or-investigate-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .skim-or-investigate-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .skim-or-investigate-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .skim-or-investigate-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .skim-or-investigate-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .skim-or-investigate-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .skim-or-investigate-row { opacity: 1; }
    .skim-or-investigate-r0 { animation-delay: 0.00s; }
    .skim-or-investigate-r1 { animation-delay: 0.45s; }
    .skim-or-investigate-r2 { animation-delay: 0.90s; }
    .skim-or-investigate-r3 { animation-delay: 1.35s; }
    .skim-or-investigate-r4 { animation-delay: 1.80s; }
    .skim-or-investigate-row { animation: skim-or-investigate-reveal 7.3s ease-in-out infinite; }
    @keyframes skim-or-investigate-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="skim-or-investigate-bg" width="980" height="390"/>
  <text class="skim-or-investigate-h1"  x="30" y="40">A skim, or an investigation</text>
  <text class="skim-or-investigate-sub" x="30" y="64">Same question, incomparable outputs.</text>
  <rect class="skim-or-investigate-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="skim-or-investigate-name" x="46" y="122">One prompt</text>
  <text class="skim-or-investigate-desc" x="46" y="142">From memory and the top result.</text>
  <text class="skim-or-investigate-desc skim-or-investigate-row skim-or-investigate-r0" x="46" y="182">Skims one headline</text>
  <text class="skim-or-investigate-desc skim-or-investigate-row skim-or-investigate-r1" x="46" y="216">Writes from recall</text>
  <text class="skim-or-investigate-desc skim-or-investigate-row skim-or-investigate-r2" x="46" y="250">Hallucinates studies that do not exist</text>
  <text class="skim-or-investigate-desc skim-or-investigate-row skim-or-investigate-r3" x="46" y="284">Summarises outdated figures</text>
  <text class="skim-or-investigate-desc skim-or-investigate-row skim-or-investigate-r4" x="46" y="318">No source a reader can check</text>
  <rect class="skim-or-investigate-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="skim-or-investigate-name" x="526" y="122">An investigation</text>
  <text class="skim-or-investigate-desc" x="526" y="142">Decomposed and sourced.</text>
  <text class="skim-or-investigate-desc skim-or-investigate-row skim-or-investigate-r0" x="526" y="182">Four orthogonal sub-questions</text>
  <text class="skim-or-investigate-desc skim-or-investigate-row skim-or-investigate-r1" x="526" y="216">Patents, papers and earnings transcripts</text>
  <text class="skim-or-investigate-desc skim-or-investigate-row skim-or-investigate-r2" x="526" y="250">Exact numbers into a notebook</text>
  <text class="skim-or-investigate-desc skim-or-investigate-row skim-or-investigate-r3" x="526" y="284">Conflicts noted, with assumptions</text>
  <text class="skim-or-investigate-desc skim-or-investigate-row skim-or-investigate-r4" x="526" y="318">Every assertion cited</text>
  <text class="skim-or-investigate-sub" x="30" y="372">The distinguishing property is not effort but structure: the second column can be wrong and a reader can find out, which is the only kind of research output worth acting on.</text>
</svg>
