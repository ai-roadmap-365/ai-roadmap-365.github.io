<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are security.">
  <title>Four things the protocol buys</title>
  <style>
    .mcp-benefits-bg   { fill: #f8fafc; }
    .mcp-benefits-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-benefits-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-benefits-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-benefits-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-benefits-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-benefits-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mcp-benefits-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mcp-benefits-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mcp-benefits-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mcp-benefits-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mcp-benefits-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mcp-benefits-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .mcp-benefits-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .mcp-benefits-stage { opacity: 1; }

    .mcp-benefits-s0 { animation-delay: 0.00s; }
    .mcp-benefits-e0 { animation-delay: 0.00s; }
    .mcp-benefits-s1 { animation-delay: 1.28s; }
    .mcp-benefits-e1 { animation-delay: 1.28s; }
    .mcp-benefits-s2 { animation-delay: 2.56s; }
    .mcp-benefits-e2 { animation-delay: 2.56s; }
    .mcp-benefits-s3 { animation-delay: 3.84s; }
    .mcp-benefits-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .mcp-benefits-conn  { animation: mcp-benefits-trace 6.4s ease-in-out infinite; }
      .mcp-benefits-stage { animation: mcp-benefits-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes mcp-benefits-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes mcp-benefits-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .mcp-benefits-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .mcp-benefits-stage { animation: mcp-benefits-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes mcp-benefits-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="mcp-benefits-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="mcp-benefits-bg" width="980" height="322"/>
  <text class="mcp-benefits-h1"  x="30" y="40">Four things the protocol buys</text>
  <text class="mcp-benefits-sub" x="30" y="64">Two are security.</text>
  <g class="mcp-benefits-stage mcp-benefits-s0">
    <rect class="mcp-benefits-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="mcp-benefits-step" x="44" y="142">01</text>
    <text class="mcp-benefits-name" x="70" y="142">One server per backend</text>
    <text class="mcp-benefits-desc" x="44" y="166">Rather than a wrapper per</text>
    <text class="mcp-benefits-desc" x="44" y="182">client, per backend.</text>
  </g>
  <line class="mcp-benefits-line mcp-benefits-conn mcp-benefits-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#mcp-benefits-tip)"/>
  <g class="mcp-benefits-stage mcp-benefits-s1">
    <rect class="mcp-benefits-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="mcp-benefits-step" x="280" y="142">02</text>
    <text class="mcp-benefits-name" x="306" y="142">Discovery at run time</text>
    <text class="mcp-benefits-desc" x="280" y="166">tools/list on startup. No</text>
    <text class="mcp-benefits-desc" x="280" y="182">compile-time tool inventory.</text>
    <text class="mcp-benefits-edge" x="280" y="242">dynamic</text>
  </g>
  <line class="mcp-benefits-line mcp-benefits-conn mcp-benefits-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#mcp-benefits-tip)"/>
  <g class="mcp-benefits-stage mcp-benefits-s2">
    <rect class="mcp-benefits-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="mcp-benefits-step" x="516" y="142">03</text>
    <text class="mcp-benefits-name" x="542" y="142">Process isolation</text>
    <text class="mcp-benefits-desc" x="516" y="166">Third-party code runs as a child</text>
    <text class="mcp-benefits-desc" x="516" y="182">process, not in the host's</text>
    <text class="mcp-benefits-desc" x="516" y="198">memory.</text>
    <text class="mcp-benefits-edge" x="516" y="242">security</text>
  </g>
  <line class="mcp-benefits-line mcp-benefits-conn mcp-benefits-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#mcp-benefits-tip)"/>
  <g class="mcp-benefits-stage mcp-benefits-s3">
    <rect class="mcp-benefits-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="mcp-benefits-step" x="752" y="142">04</text>
    <text class="mcp-benefits-name" x="778" y="142">A standard approval point</text>
    <text class="mcp-benefits-desc" x="752" y="166">The host can render the exact</text>
    <text class="mcp-benefits-desc" x="752" y="182">arguments before a destructive</text>
    <text class="mcp-benefits-desc" x="752" y="198">call.</text>
    <text class="mcp-benefits-edge" x="752" y="242">HITL</text>
  </g>
  <text class="mcp-benefits-sub" x="30" y="304">The third benefit is easy to underrate: without it, adding a community tool means loading somebody else's Node or Python into your editor's process, where a crash or a memory bug is yours.</text>
</svg>
