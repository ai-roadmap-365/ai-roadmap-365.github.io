<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Multiplication of small numbers.">
  <title>Why deep networks stopped learning</title>
  <style>
    .vanishing-gradient-bg   { fill: #f8fafc; }
    .vanishing-gradient-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vanishing-gradient-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vanishing-gradient-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vanishing-gradient-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vanishing-gradient-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vanishing-gradient-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vanishing-gradient-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .vanishing-gradient-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .vanishing-gradient-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .vanishing-gradient-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .vanishing-gradient-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .vanishing-gradient-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .vanishing-gradient-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .vanishing-gradient-stage { opacity: 1; }

    .vanishing-gradient-s0 { animation-delay: 0.00s; }
    .vanishing-gradient-e0 { animation-delay: 0.00s; }
    .vanishing-gradient-s1 { animation-delay: 1.28s; }
    .vanishing-gradient-e1 { animation-delay: 1.28s; }
    .vanishing-gradient-s2 { animation-delay: 2.56s; }
    .vanishing-gradient-e2 { animation-delay: 2.56s; }
    .vanishing-gradient-s3 { animation-delay: 3.84s; }
    .vanishing-gradient-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .vanishing-gradient-conn  { animation: vanishing-gradient-trace 6.4s ease-in-out infinite; }
      .vanishing-gradient-stage { animation: vanishing-gradient-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes vanishing-gradient-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes vanishing-gradient-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .vanishing-gradient-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .vanishing-gradient-stage { animation: vanishing-gradient-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes vanishing-gradient-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="vanishing-gradient-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="vanishing-gradient-bg" width="980" height="322"/>
  <text class="vanishing-gradient-h1"  x="30" y="40">Why deep networks stopped learning</text>
  <text class="vanishing-gradient-sub" x="30" y="64">Multiplication of small numbers.</text>
  <g class="vanishing-gradient-stage vanishing-gradient-s0">
    <rect class="vanishing-gradient-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="vanishing-gradient-step" x="44" y="142">01</text>
    <text class="vanishing-gradient-name" x="70" y="142">Sigmoid's derivative peaks at 0.25</text>
    <text class="vanishing-gradient-desc" x="44" y="166">And is far smaller once the unit</text>
    <text class="vanishing-gradient-desc" x="44" y="182">saturates.</text>
  </g>
  <line class="vanishing-gradient-line vanishing-gradient-conn vanishing-gradient-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#vanishing-gradient-tip)"/>
  <g class="vanishing-gradient-stage vanishing-gradient-s1">
    <rect class="vanishing-gradient-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="vanishing-gradient-step" x="280" y="142">02</text>
    <text class="vanishing-gradient-name" x="306" y="142">Backpropagation multiplies them</text>
    <text class="vanishing-gradient-desc" x="280" y="166">One factor per layer, by the</text>
    <text class="vanishing-gradient-desc" x="280" y="182">chain rule.</text>
  </g>
  <line class="vanishing-gradient-line vanishing-gradient-conn vanishing-gradient-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#vanishing-gradient-tip)"/>
  <g class="vanishing-gradient-stage vanishing-gradient-s2">
    <rect class="vanishing-gradient-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="vanishing-gradient-step" x="516" y="142">03</text>
    <text class="vanishing-gradient-name" x="542" y="142">Ten layers: 0.25 to the tenth</text>
    <text class="vanishing-gradient-desc" x="516" y="166">About one in a million, at best.</text>
    <text class="vanishing-gradient-edge" x="516" y="242">exponential</text>
  </g>
  <line class="vanishing-gradient-line vanishing-gradient-conn vanishing-gradient-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#vanishing-gradient-tip)"/>
  <g class="vanishing-gradient-stage vanishing-gradient-s3">
    <rect class="vanishing-gradient-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="vanishing-gradient-step" x="752" y="142">04</text>
    <text class="vanishing-gradient-name" x="778" y="142">So early layers barely move</text>
    <text class="vanishing-gradient-desc" x="752" y="166">The network trains its last</text>
    <text class="vanishing-gradient-desc" x="752" y="182">layers and ignores the rest.</text>
  </g>
  <text class="vanishing-gradient-sub" x="30" y="304">The failure is quiet rather than dramatic: the loss decreases, the network appears to be training, and the layers doing the representation learning are effectively frozen.</text>
</svg>
