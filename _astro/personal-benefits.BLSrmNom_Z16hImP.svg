<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are workflow; two are privacy.">
  <title>Four problems it solves</title>
  <style>
    .personal-benefits-bg   { fill: #f8fafc; }
    .personal-benefits-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .personal-benefits-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .personal-benefits-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .personal-benefits-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .personal-benefits-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .personal-benefits-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .personal-benefits-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .personal-benefits-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .personal-benefits-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .personal-benefits-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .personal-benefits-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .personal-benefits-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .personal-benefits-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .personal-benefits-stage { opacity: 1; }

    .personal-benefits-s0 { animation-delay: 0.00s; }
    .personal-benefits-e0 { animation-delay: 0.00s; }
    .personal-benefits-s1 { animation-delay: 1.28s; }
    .personal-benefits-e1 { animation-delay: 1.28s; }
    .personal-benefits-s2 { animation-delay: 2.56s; }
    .personal-benefits-e2 { animation-delay: 2.56s; }
    .personal-benefits-s3 { animation-delay: 3.84s; }
    .personal-benefits-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .personal-benefits-conn  { animation: personal-benefits-trace 6.4s ease-in-out infinite; }
      .personal-benefits-stage { animation: personal-benefits-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes personal-benefits-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes personal-benefits-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .personal-benefits-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .personal-benefits-stage { animation: personal-benefits-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes personal-benefits-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="personal-benefits-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="personal-benefits-bg" width="980" height="322"/>
  <text class="personal-benefits-h1"  x="30" y="40">Four problems it solves</text>
  <text class="personal-benefits-sub" x="30" y="64">Two are workflow; two are privacy.</text>
  <g class="personal-benefits-stage personal-benefits-s0">
    <rect class="personal-benefits-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="personal-benefits-step" x="44" y="142">01</text>
    <text class="personal-benefits-name" x="70" y="142">No context switching</text>
    <text class="personal-benefits-desc" x="44" y="166">No leaving the conversation to</text>
    <text class="personal-benefits-desc" x="44" y="182">run git log or look up a schema.</text>
  </g>
  <line class="personal-benefits-line personal-benefits-conn personal-benefits-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#personal-benefits-tip)"/>
  <g class="personal-benefits-stage personal-benefits-s1">
    <rect class="personal-benefits-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="personal-benefits-step" x="280" y="142">02</text>
    <text class="personal-benefits-name" x="306" y="142">Consistent across tools</text>
    <text class="personal-benefits-desc" x="280" y="166">Editor, chat and background</text>
    <text class="personal-benefits-desc" x="280" y="182">agent share one memory and one</text>
    <text class="personal-benefits-desc" x="280" y="198">toolset.</text>
  </g>
  <line class="personal-benefits-line personal-benefits-conn personal-benefits-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#personal-benefits-tip)"/>
  <g class="personal-benefits-stage personal-benefits-s2">
    <rect class="personal-benefits-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="personal-benefits-step" x="516" y="142">03</text>
    <text class="personal-benefits-name" x="542" y="142">Nothing leaves the machine</text>
    <text class="personal-benefits-desc" x="516" y="166">Local SQLite. No notes or diffs</text>
    <text class="personal-benefits-desc" x="516" y="182">to a third-party service.</text>
    <text class="personal-benefits-edge" x="516" y="242">privacy</text>
  </g>
  <line class="personal-benefits-line personal-benefits-conn personal-benefits-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#personal-benefits-tip)"/>
  <g class="personal-benefits-stage personal-benefits-s3">
    <rect class="personal-benefits-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="personal-benefits-step" x="752" y="142">04</text>
    <text class="personal-benefits-name" x="778" y="142">Repeatable routines</text>
    <text class="personal-benefits-desc" x="752" y="166">A standup report with the same</text>
    <text class="personal-benefits-desc" x="752" y="182">structure every day.</text>
  </g>
  <text class="personal-benefits-sub" x="30" y="304">The privacy property is the one that has no alternative: any hosted integration necessarily sees the data it integrates, and a local stdio daemon structurally cannot send anything you did not configure.</text>
</svg>
