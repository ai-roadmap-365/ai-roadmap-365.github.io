<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things a relational database is not</title>
  <style>
    .rdb-not-bg   { fill: #f8fafc; }
    .rdb-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rdb-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rdb-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rdb-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rdb-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rdb-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rdb-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rdb-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rdb-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rdb-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rdb-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rdb-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rdb-not-row { opacity: 1; }
    .rdb-not-r0 { animation-delay: 0.00s; }
    .rdb-not-r1 { animation-delay: 0.45s; }
    .rdb-not-r2 { animation-delay: 0.90s; }
    .rdb-not-r3 { animation-delay: 1.35s; }
    .rdb-not-r4 { animation-delay: 1.80s; }
    .rdb-not-row { animation: rdb-not-reveal 7.3s ease-in-out infinite; }
    @keyframes rdb-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="rdb-not-bg" width="980" height="390"/>
  <text class="rdb-not-h1"  x="30" y="40">Four things a relational database is not</text>
  <text class="rdb-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="rdb-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="rdb-not-name" x="46" y="122">The misconception</text>
  <text class="rdb-not-desc" x="46" y="142">Commonly held.</text>
  <text class="rdb-not-desc rdb-not-row rdb-not-r0" x="46" y="182">An embedded database is a toy</text>
  <text class="rdb-not-desc rdb-not-row rdb-not-r1" x="46" y="216">Databases are always slower than files</text>
  <text class="rdb-not-desc rdb-not-row rdb-not-r2" x="46" y="250">Schemas are bureaucracy</text>
  <text class="rdb-not-desc rdb-not-row rdb-not-r3" x="46" y="284">Application checks are enough</text>
  <text class="rdb-not-desc rdb-not-row rdb-not-r4" x="46" y="318">Relational means slow for analytics</text>
  <rect class="rdb-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="rdb-not-name" x="526" y="122">What is true</text>
  <text class="rdb-not-desc" x="526" y="142">Actually.</text>
  <text class="rdb-not-desc rdb-not-row rdb-not-r0" x="526" y="182">It handles most single-machine workloads</text>
  <text class="rdb-not-desc rdb-not-row rdb-not-r1" x="526" y="216">Indexed lookups beat scanning files</text>
  <text class="rdb-not-desc rdb-not-row rdb-not-r2" x="526" y="250">A schema is enforced documentation</text>
  <text class="rdb-not-desc rdb-not-row rdb-not-r3" x="526" y="284">Applications change; data outlives them</text>
  <text class="rdb-not-desc rdb-not-row rdb-not-r4" x="526" y="318">Column stores are relational too</text>
  <text class="rdb-not-sub" x="30" y="372">Data outliving applications is the argument that settles the constraints question: the rules must live where the data lives, not where the code does.</text>
</svg>
