<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Ambiguity produces noise.">
  <title>Writing a survey question</title>
  <style>
    .survey-design-bg   { fill: #f8fafc; }
    .survey-design-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .survey-design-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .survey-design-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .survey-design-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .survey-design-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .survey-design-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .survey-design-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .survey-design-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .survey-design-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .survey-design-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .survey-design-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .survey-design-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .survey-design-row { opacity: 1; }
    .survey-design-r0 { animation-delay: 0.00s; }
    .survey-design-r1 { animation-delay: 0.45s; }
    .survey-design-r2 { animation-delay: 0.90s; }
    .survey-design-r3 { animation-delay: 1.35s; }
    .survey-design-r4 { animation-delay: 1.80s; }
    .survey-design-row { animation: survey-design-reveal 7.3s ease-in-out infinite; }
    @keyframes survey-design-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="survey-design-bg" width="980" height="390"/>
  <text class="survey-design-h1"  x="30" y="40">Writing a survey question</text>
  <text class="survey-design-sub" x="30" y="64">Ambiguity produces noise.</text>
  <rect class="survey-design-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="survey-design-name" x="46" y="122">Ambiguous</text>
  <text class="survey-design-desc" x="46" y="142">Everyone interprets it differently.</text>
  <text class="survey-design-desc survey-design-row survey-design-r0" x="46" y="182">Is this review negative?</text>
  <text class="survey-design-desc survey-design-row survey-design-r1" x="46" y="216">No definition of negative</text>
  <text class="survey-design-desc survey-design-row survey-design-r2" x="46" y="250">Annotators disagree constantly</text>
  <text class="survey-design-desc survey-design-row survey-design-r3" x="46" y="284">The disagreement enters the model</text>
  <text class="survey-design-desc survey-design-row survey-design-r4" x="46" y="318">This is a poor guideline</text>
  <rect class="survey-design-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="survey-design-name" x="526" y="122">Well specified</text>
  <text class="survey-design-desc" x="526" y="142">One reading.</text>
  <text class="survey-design-desc survey-design-row survey-design-r0" x="526" y="182">Does this review state a specific complaint?</text>
  <text class="survey-design-desc survey-design-row survey-design-r1" x="526" y="216">Definition and examples given</text>
  <text class="survey-design-desc survey-design-row survey-design-r2" x="526" y="250">Annotators agree strongly</text>
  <text class="survey-design-desc survey-design-row survey-design-r3" x="526" y="284">The label means something consistent</text>
  <text class="survey-design-desc survey-design-row survey-design-r4" x="526" y="318">This is a good guideline</text>
  <text class="survey-design-sub" x="30" y="372">Survey methodologists have spent decades on question wording for the same reason, and labelling guidelines benefit from exactly the same discipline.</text>
</svg>
