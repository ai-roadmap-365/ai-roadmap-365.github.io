<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" role="img" font-family="system-ui, sans-serif">
  <title>How a closure captures an enclosing variable and outlives its parent call: calling make_counter creates an enclosing frame holding count, the inner counter function captures a reference to count, make_counter returns counter and its frame would normally vanish, but the closure keeps count alive, so each later call to counter reads and updates the same captured count</title>
  <rect x="0" y="0" width="760" height="540" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">A closure capturing state: make_counter</text>

  <!-- Step 1 -->
  <rect x="60" y="56" width="640" height="58" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="80" y="80" font-size="15" font-weight="bold" fill="#1a202c">1. Call make_counter(start=0)</text>
  <text x="80" y="101" font-size="14" fill="#1a202c">an enclosing frame is created, holding the variable count = 0</text>

  <line x1="380" y1="114" x2="380" y2="138" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,138 374,126 386,126" fill="#1a202c"/>

  <!-- Step 2 -->
  <rect x="60" y="138" width="640" height="58" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="80" y="162" font-size="15" font-weight="bold" fill="#1a202c">2. def counter(): ... nonlocal count</text>
  <text x="80" y="183" font-size="14" fill="#1a202c">the inner function captures a reference to count (not a copy)</text>

  <line x1="380" y1="196" x2="380" y2="220" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,220 374,208 386,208" fill="#1a202c"/>

  <!-- Step 3 -->
  <rect x="60" y="220" width="640" height="58" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="80" y="244" font-size="15" font-weight="bold" fill="#1a202c">3. return counter</text>
  <text x="80" y="265" font-size="14" fill="#1a202c">make_counter finishes; its frame would normally be discarded ...</text>

  <line x1="380" y1="278" x2="380" y2="302" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,302 374,290 386,290" fill="#1a202c"/>

  <!-- Step 4: closure keeps alive -->
  <rect x="60" y="302" width="640" height="70" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="80" y="326" font-size="15" font-weight="bold" fill="#1d4ed8">4. ... but the closure keeps count alive</text>
  <text x="80" y="347" font-size="14" fill="#1a202c">the returned counter still holds count in a captured cell, so the</text>
  <text x="80" y="366" font-size="14" fill="#1a202c">value survives even though make_counter has already returned</text>

  <line x1="380" y1="372" x2="380" y2="396" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,396 374,384 386,384" fill="#1a202c"/>

  <!-- Step 5: calls -->
  <rect x="60" y="396" width="640" height="78" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="80" y="420" font-size="15" font-weight="bold" fill="#1a202c">5. Each call reads and updates the same captured count</text>
  <text x="80" y="441" font-size="14" fill="#1a202c">counter() -&gt; 0, counter() -&gt; 1, counter() -&gt; 2 ...</text>
  <text x="80" y="462" font-size="14" fill="#1a202c">a second make_counter() call has its own independent count</text>

  <text x="380" y="502" text-anchor="middle" font-size="14" fill="#1a202c">A closure is a function plus the enclosing variables it captured — private, remembered state.</text>
  <text x="380" y="524" text-anchor="middle" font-size="14" fill="#1a202c">nonlocal lets the inner function rebind that captured variable instead of shadowing it locally.</text>
</svg>
