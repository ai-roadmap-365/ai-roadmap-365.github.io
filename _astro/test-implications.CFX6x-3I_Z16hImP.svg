<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are costs.">
  <title>Four consequences of testing</title>
  <style>
    .test-implications-bg   { fill: #f8fafc; }
    .test-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .test-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .test-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .test-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .test-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .test-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .test-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .test-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .test-implications-stage { opacity: 1; }

    .test-implications-s0 { animation-delay: 0.00s; }
    .test-implications-e0 { animation-delay: 0.00s; }
    .test-implications-s1 { animation-delay: 1.28s; }
    .test-implications-e1 { animation-delay: 1.28s; }
    .test-implications-s2 { animation-delay: 2.56s; }
    .test-implications-e2 { animation-delay: 2.56s; }
    .test-implications-s3 { animation-delay: 3.84s; }
    .test-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .test-implications-conn  { animation: test-implications-trace 6.4s ease-in-out infinite; }
      .test-implications-stage { animation: test-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes test-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes test-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .test-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .test-implications-stage { animation: test-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes test-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="test-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="test-implications-bg" width="980" height="322"/>
  <text class="test-implications-h1"  x="30" y="40">Four consequences of testing</text>
  <text class="test-implications-sub" x="30" y="64">Two are costs.</text>
  <g class="test-implications-stage test-implications-s0">
    <rect class="test-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="test-implications-step" x="44" y="142">01</text>
    <text class="test-implications-name" x="70" y="142">Change becomes safe rather than risky</text>
    <text class="test-implications-desc" x="44" y="166">Which is what keeps a codebase</text>
    <text class="test-implications-desc" x="44" y="182">alive.</text>
  </g>
  <line class="test-implications-line test-implications-conn test-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#test-implications-tip)"/>
  <g class="test-implications-stage test-implications-s1">
    <rect class="test-implications-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="test-implications-step" x="280" y="142">02</text>
    <text class="test-implications-name" x="306" y="142">And regressions are caught in seconds</text>
    <text class="test-implications-desc" x="280" y="166">Rather than in production.</text>
  </g>
  <line class="test-implications-line test-implications-conn test-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#test-implications-tip)"/>
  <g class="test-implications-stage test-implications-s2">
    <rect class="test-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="test-implications-step" x="516" y="142">03</text>
    <text class="test-implications-name" x="542" y="142">But tests are code, and must be maintained</text>
    <text class="test-implications-desc" x="516" y="166">A brittle suite is a liability.</text>
  </g>
  <line class="test-implications-line test-implications-conn test-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#test-implications-tip)"/>
  <g class="test-implications-stage test-implications-s3">
    <rect class="test-implications-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="test-implications-step" x="752" y="142">04</text>
    <text class="test-implications-name" x="778" y="142">And a passing suite can give false confidence</text>
    <text class="test-implications-desc" x="752" y="166">It only covers what was tested.</text>
  </g>
  <text class="test-implications-sub" x="30" y="304">A brittle suite being a liability is the honest cost: tests coupled to implementation details break on every refactor and get deleted rather than fixed.</text>
</svg>
