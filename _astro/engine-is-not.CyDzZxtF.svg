<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what belongs to the layers around it.">
  <title>What the core engine owns</title>
  <style>
    .engine-is-not-bg   { fill: #f8fafc; }
    .engine-is-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .engine-is-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .engine-is-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .engine-is-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .engine-is-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .engine-is-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .engine-is-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .engine-is-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .engine-is-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .engine-is-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .engine-is-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .engine-is-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .engine-is-not-row { opacity: 1; }
    .engine-is-not-r0 { animation-delay: 0.00s; }
    .engine-is-not-r1 { animation-delay: 0.45s; }
    .engine-is-not-r2 { animation-delay: 0.90s; }
    .engine-is-not-r3 { animation-delay: 1.35s; }
    .engine-is-not-r4 { animation-delay: 1.80s; }
    .engine-is-not-row { animation: engine-is-not-reveal 7.3s ease-in-out infinite; }
    @keyframes engine-is-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="engine-is-not-bg" width="980" height="390"/>
  <text class="engine-is-not-h1"  x="30" y="40">What the core engine owns</text>
  <text class="engine-is-not-sub" x="30" y="64">And what belongs to the layers around it.</text>
  <rect class="engine-is-not-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="engine-is-not-name" x="46" y="122">The engine owns</text>
  <text class="engine-is-not-desc" x="46" y="142">Turning context into a trusted object.</text>
  <text class="engine-is-not-desc engine-is-not-row engine-is-not-r0" x="46" y="182">Prompt assembly within the token budget</text>
  <text class="engine-is-not-desc engine-is-not-row engine-is-not-r1" x="46" y="216">Model selection and fallback</text>
  <text class="engine-is-not-desc engine-is-not-row engine-is-not-r2" x="46" y="250">Output schema and validation</text>
  <text class="engine-is-not-desc engine-is-not-row engine-is-not-r3" x="46" y="284">Circuit breaking and timeouts</text>
  <text class="engine-is-not-desc engine-is-not-row engine-is-not-r4" x="46" y="318">Citations, checked against retrieval</text>
  <rect class="engine-is-not-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="engine-is-not-name" x="526" y="122">It does not own</text>
  <text class="engine-is-not-desc" x="526" y="142">Neighbouring concerns.</text>
  <text class="engine-is-not-desc engine-is-not-row engine-is-not-r0" x="526" y="182">Finding the passages — that is retrieval</text>
  <text class="engine-is-not-desc engine-is-not-row engine-is-not-r1" x="526" y="216">Rendering the answer — that is the interface</text>
  <text class="engine-is-not-desc engine-is-not-row engine-is-not-r2" x="526" y="250">Deciding if the answer is good — that is evaluation</text>
  <text class="engine-is-not-desc engine-is-not-row engine-is-not-r3" x="526" y="284">Storing the conversation — that is state</text>
  <text class="engine-is-not-desc engine-is-not-row engine-is-not-r4" x="526" y="318">Each is separately testable</text>
  <text class="engine-is-not-sub" x="30" y="372">The boundary matters for testing: an engine that only transforms inputs into validated outputs can be tested with fixed context and a stubbed model, on a laptop, in milliseconds.</text>
</svg>
