<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four checks.">
  <title>Segment stability</title>
  <style>
    .cluster-stability-bg   { fill: #f8fafc; }
    .cluster-stability-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cluster-stability-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cluster-stability-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cluster-stability-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cluster-stability-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cluster-stability-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cluster-stability-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cluster-stability-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cluster-stability-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cluster-stability-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cluster-stability-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cluster-stability-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cluster-stability-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cluster-stability-stage { opacity: 1; }

    .cluster-stability-s0 { animation-delay: 0.00s; }
    .cluster-stability-e0 { animation-delay: 0.00s; }
    .cluster-stability-s1 { animation-delay: 1.28s; }
    .cluster-stability-e1 { animation-delay: 1.28s; }
    .cluster-stability-s2 { animation-delay: 2.56s; }
    .cluster-stability-e2 { animation-delay: 2.56s; }
    .cluster-stability-s3 { animation-delay: 3.84s; }
    .cluster-stability-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cluster-stability-conn  { animation: cluster-stability-trace 6.4s ease-in-out infinite; }
      .cluster-stability-stage { animation: cluster-stability-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cluster-stability-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cluster-stability-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cluster-stability-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cluster-stability-stage { animation: cluster-stability-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cluster-stability-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cluster-stability-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cluster-stability-bg" width="980" height="322"/>
  <text class="cluster-stability-h1"  x="30" y="40">Segment stability</text>
  <text class="cluster-stability-sub" x="30" y="64">Four checks.</text>
  <g class="cluster-stability-stage cluster-stability-s0">
    <rect class="cluster-stability-good" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cluster-stability-step" x="44" y="142">01</text>
    <text class="cluster-stability-name" x="70" y="142">Refit with different seeds</text>
    <text class="cluster-stability-desc" x="44" y="166">Stable segments reappear;</text>
    <text class="cluster-stability-desc" x="44" y="182">unstable ones do not.</text>
  </g>
  <line class="cluster-stability-line cluster-stability-conn cluster-stability-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cluster-stability-tip)"/>
  <g class="cluster-stability-stage cluster-stability-s1">
    <rect class="cluster-stability-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cluster-stability-step" x="280" y="142">02</text>
    <text class="cluster-stability-name" x="306" y="142">Refit on bootstrap samples</text>
    <text class="cluster-stability-desc" x="280" y="166">Which tests robustness to the</text>
    <text class="cluster-stability-desc" x="280" y="182">particular customers.</text>
  </g>
  <line class="cluster-stability-line cluster-stability-conn cluster-stability-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cluster-stability-tip)"/>
  <g class="cluster-stability-stage cluster-stability-s2">
    <rect class="cluster-stability-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cluster-stability-step" x="516" y="142">03</text>
    <text class="cluster-stability-name" x="542" y="142">Refit on a later period</text>
    <text class="cluster-stability-desc" x="516" y="166">To see whether the structure</text>
    <text class="cluster-stability-desc" x="516" y="182">persists.</text>
  </g>
  <line class="cluster-stability-line cluster-stability-conn cluster-stability-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cluster-stability-tip)"/>
  <g class="cluster-stability-stage cluster-stability-s3">
    <rect class="cluster-stability-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cluster-stability-step" x="752" y="142">04</text>
    <text class="cluster-stability-name" x="778" y="142">And track how many customers change segment</text>
    <text class="cluster-stability-desc" x="752" y="166">High churn means the</text>
    <text class="cluster-stability-desc" x="752" y="182">segmentation is not describing</text>
    <text class="cluster-stability-desc" x="752" y="198">anything stable.</text>
  </g>
  <text class="cluster-stability-sub" x="30" y="304">Membership churn is the most informative of these: segments that most customers leave every month are describing noise rather than customer types.</text>
</svg>
