<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four elements.">
  <title>Documenting the evaluation</title>
  <style>
    .eval-setup-bg   { fill: #f8fafc; }
    .eval-setup-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-setup-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-setup-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-setup-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-setup-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-setup-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eval-setup-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eval-setup-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eval-setup-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eval-setup-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eval-setup-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eval-setup-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .eval-setup-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .eval-setup-stage { opacity: 1; }

    .eval-setup-s0 { animation-delay: 0.00s; }
    .eval-setup-e0 { animation-delay: 0.00s; }
    .eval-setup-s1 { animation-delay: 1.28s; }
    .eval-setup-e1 { animation-delay: 1.28s; }
    .eval-setup-s2 { animation-delay: 2.56s; }
    .eval-setup-e2 { animation-delay: 2.56s; }
    .eval-setup-s3 { animation-delay: 3.84s; }
    .eval-setup-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .eval-setup-conn  { animation: eval-setup-trace 6.4s ease-in-out infinite; }
      .eval-setup-stage { animation: eval-setup-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes eval-setup-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes eval-setup-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .eval-setup-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .eval-setup-stage { animation: eval-setup-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes eval-setup-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="eval-setup-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="eval-setup-bg" width="980" height="322"/>
  <text class="eval-setup-h1"  x="30" y="40">Documenting the evaluation</text>
  <text class="eval-setup-sub" x="30" y="64">Four elements.</text>
  <g class="eval-setup-stage eval-setup-s0">
    <rect class="eval-setup-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="eval-setup-step" x="44" y="142">01</text>
    <text class="eval-setup-name" x="70" y="142">The metric, and why it was chosen</text>
    <text class="eval-setup-desc" x="44" y="166">Which encodes the cost</text>
    <text class="eval-setup-desc" x="44" y="182">assumption.</text>
  </g>
  <line class="eval-setup-line eval-setup-conn eval-setup-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#eval-setup-tip)"/>
  <g class="eval-setup-stage eval-setup-s1">
    <rect class="eval-setup-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="eval-setup-step" x="280" y="142">02</text>
    <text class="eval-setup-name" x="306" y="142">The evaluation data, and how it was split</text>
    <text class="eval-setup-desc" x="280" y="166">Including whether it was grouped</text>
    <text class="eval-setup-desc" x="280" y="182">or time-ordered.</text>
  </g>
  <line class="eval-setup-line eval-setup-conn eval-setup-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#eval-setup-tip)"/>
  <g class="eval-setup-stage eval-setup-s2">
    <rect class="eval-setup-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="eval-setup-step" x="516" y="142">03</text>
    <text class="eval-setup-name" x="542" y="142">The operating point</text>
    <text class="eval-setup-desc" x="516" y="166">Because a metric without a</text>
    <text class="eval-setup-desc" x="516" y="182">threshold is incomplete.</text>
  </g>
  <line class="eval-setup-line eval-setup-conn eval-setup-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#eval-setup-tip)"/>
  <g class="eval-setup-stage eval-setup-s3">
    <rect class="eval-setup-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="eval-setup-step" x="752" y="142">04</text>
    <text class="eval-setup-name" x="778" y="142">And the baseline it is compared against</text>
    <text class="eval-setup-desc" x="752" y="166">Which is what makes the number</text>
    <text class="eval-setup-desc" x="752" y="182">mean something.</text>
  </g>
  <text class="eval-setup-sub" x="30" y="304">Recording why the metric was chosen is what lets a later reader judge whether it still fits, since the costs that justified it will have changed.</text>
</svg>
