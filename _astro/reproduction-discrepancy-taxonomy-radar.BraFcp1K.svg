<svg role="img" aria-label="Reproduction discrepancy taxonomy radar comparing published claimed metrics against observed experimental results" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Reproduction Discrepancy Taxonomy</title>
  <defs>
    <linearGradient id="bg238b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card238b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg238b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">REPRODUCTION DISCREPANCY TAXONOMY</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Isolating Why Experimental Results Diverge from Published Academic Claims</text>
  <g transform="translate(65, 85)">
    <rect width="720" height="295" fill="url(#card238b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- 5 Discrepancy Pillars -->
    <!-- Pillar 1: Data Drift -->
    <rect x="25" y="25" width="125" height="245" fill="#0f172a" stroke="#f43f5e" rx="4"/>
    <text x="87" y="48" fill="#fb7185" font-size="10" font-weight="700" text-anchor="middle">1. Data Shift</text>
    <text x="35" y="75" fill="#cbd5e1" font-size="8">• Hidden filtering</text>
    <text x="35" y="95" fill="#cbd5e1" font-size="8">• Different splits</text>
    <text x="35" y="115" fill="#cbd5e1" font-size="8">• Tokenizer diffs</text>
    <text x="35" y="135" fill="#cbd5e1" font-size="8">• Pre-padding bias</text>

    <!-- Pillar 2: Hyperparameters -->
    <rect x="165" y="25" width="125" height="245" fill="#0f172a" stroke="#fbbf24" rx="4"/>
    <text x="227" y="48" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">2. Hyperparams</text>
    <text x="175" y="75" fill="#cbd5e1" font-size="8">• Warmup steps</text>
    <text x="175" y="95" fill="#cbd5e1" font-size="8">• Adam epsilon</text>
    <text x="175" y="115" fill="#cbd5e1" font-size="8">• Weight decay</text>
    <text x="175" y="135" fill="#cbd5e1" font-size="8">• Grad clip norm</text>

    <!-- Pillar 3: Hardware Precision -->
    <rect x="305" y="25" width="125" height="245" fill="#0f172a" stroke="#38bdf8" rx="4"/>
    <text x="367" y="48" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">3. Precision</text>
    <text x="315" y="75" fill="#cbd5e1" font-size="8">• FP32 vs BF16</text>
    <text x="315" y="95" fill="#cbd5e1" font-size="8">• Tensor Core MAC</text>
    <text x="315" y="115" fill="#cbd5e1" font-size="8">• Non-deterministic</text>
    <text x="315" y="135" fill="#cbd5e1" font-size="8">• Atomic additions</text>

    <!-- Pillar 4: Seed Variance -->
    <rect x="445" y="25" width="125" height="245" fill="#0f172a" stroke="#a855f7" rx="4"/>
    <text x="507" y="48" fill="#c084fc" font-size="10" font-weight="700" text-anchor="middle">4. Seed Luck</text>
    <text x="455" y="75" fill="#cbd5e1" font-size="8">• "Cherry-picked"</text>
    <text x="455" y="95" fill="#cbd5e1" font-size="8">• High std dev</text>
    <text x="455" y="115" fill="#cbd5e1" font-size="8">• Init luck on head</text>
    <text x="455" y="135" fill="#cbd5e1" font-size="8">• Report 5+ seeds</text>

    <!-- Pillar 5: Implementation -->
    <rect x="585" y="25" width="110" height="245" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="640" y="48" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">5. Details</text>
    <text x="595" y="75" fill="#cbd5e1" font-size="8">• Pre-LN vs Post</text>
    <text x="595" y="95" fill="#cbd5e1" font-size="8">• LayerNorm eps</text>
    <text x="595" y="115" fill="#cbd5e1" font-size="8">• Softmax mask</text>
    <text x="595" y="135" fill="#cbd5e1" font-size="8">• Eval reduction</text>
  </g>
</svg>
