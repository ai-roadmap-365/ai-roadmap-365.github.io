<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The window moves when the data does.">
  <title>Why offset pagination loses rows</title>
  <style>
    .offset-shifts-bg   { fill: #f8fafc; }
    .offset-shifts-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .offset-shifts-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .offset-shifts-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .offset-shifts-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .offset-shifts-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .offset-shifts-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .offset-shifts-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .offset-shifts-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .offset-shifts-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .offset-shifts-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .offset-shifts-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .offset-shifts-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .offset-shifts-row { opacity: 1; }
    .offset-shifts-r0 { animation-delay: 0.00s; }
    .offset-shifts-r1 { animation-delay: 0.45s; }
    .offset-shifts-r2 { animation-delay: 0.90s; }
    .offset-shifts-r3 { animation-delay: 1.35s; }
    .offset-shifts-r4 { animation-delay: 1.80s; }
    .offset-shifts-row { animation: offset-shifts-reveal 7.3s ease-in-out infinite; }
    @keyframes offset-shifts-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="offset-shifts-bg" width="980" height="390"/>
  <text class="offset-shifts-h1"  x="30" y="40">Why offset pagination loses rows</text>
  <text class="offset-shifts-sub" x="30" y="64">The window moves when the data does.</text>
  <rect class="offset-shifts-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="offset-shifts-name" x="46" y="122">Offset</text>
  <text class="offset-shifts-desc" x="46" y="142">A position measured by counting.</text>
  <text class="offset-shifts-desc offset-shifts-row offset-shifts-r0" x="46" y="182">Page 1: rows 1 to 10</text>
  <text class="offset-shifts-desc offset-shifts-row offset-shifts-r1" x="46" y="216">A new row is inserted at the top</text>
  <text class="offset-shifts-desc offset-shifts-row offset-shifts-r2" x="46" y="250">Page 2 now starts one row later</text>
  <text class="offset-shifts-desc offset-shifts-row offset-shifts-r3" x="46" y="284">You see row 10 twice, or miss one</text>
  <text class="offset-shifts-desc offset-shifts-row offset-shifts-r4" x="46" y="318">And deep pages slow down as the count grows</text>
  <rect class="offset-shifts-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="offset-shifts-name" x="526" y="122">Cursor</text>
  <text class="offset-shifts-desc" x="526" y="142">A marker anchored to a row.</text>
  <text class="offset-shifts-desc offset-shifts-row offset-shifts-r0" x="526" y="182">Page 1 ends with a cursor for row 10</text>
  <text class="offset-shifts-desc offset-shifts-row offset-shifts-r1" x="526" y="216">A new row is inserted at the top</text>
  <text class="offset-shifts-desc offset-shifts-row offset-shifts-r2" x="526" y="250">The cursor still names row 10</text>
  <text class="offset-shifts-desc offset-shifts-row offset-shifts-r3" x="526" y="284">Page 2 continues exactly where you were</text>
  <text class="offset-shifts-desc offset-shifts-row offset-shifts-r4" x="526" y="318">And stays fast a million rows deep</text>
  <text class="offset-shifts-sub" x="30" y="372">The cost of the cursor is that you cannot jump to page 500. If nobody needs to jump — and for a data export, nobody does — it is strictly better.</text>
</svg>
