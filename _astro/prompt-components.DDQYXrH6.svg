<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Six parts, in order.">
  <title>What a production prompt contains</title>
  <style>
    .prompt-components-bg   { fill: #f8fafc; }
    .prompt-components-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-components-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-components-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-components-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-components-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-components-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prompt-components-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .prompt-components-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .prompt-components-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .prompt-components-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .prompt-components-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .prompt-components-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .prompt-components-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .prompt-components-stage { opacity: 1; }

    .prompt-components-s0 { animation-delay: 0.00s; }
    .prompt-components-e0 { animation-delay: 0.00s; }
    .prompt-components-s1 { animation-delay: 1.37s; }
    .prompt-components-e1 { animation-delay: 1.37s; }
    .prompt-components-s2 { animation-delay: 2.74s; }
    .prompt-components-e2 { animation-delay: 2.74s; }
    .prompt-components-s3 { animation-delay: 4.11s; }
    .prompt-components-e3 { animation-delay: 4.11s; }
    .prompt-components-s4 { animation-delay: 5.49s; }
    .prompt-components-e4 { animation-delay: 5.49s; }
    .prompt-components-s5 { animation-delay: 6.86s; }
    .prompt-components-e5 { animation-delay: 6.86s; }
    @media (prefers-reduced-motion: no-preference) {
      .prompt-components-conn  { animation: prompt-components-trace 9.600000000000001s ease-in-out infinite; }
      .prompt-components-stage { animation: prompt-components-arrive 9.600000000000001s ease-in-out infinite; }
    }
    @keyframes prompt-components-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes prompt-components-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .prompt-components-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .prompt-components-stage { animation: prompt-components-settle 9.600000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes prompt-components-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="prompt-components-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="prompt-components-bg" width="980" height="322"/>
  <text class="prompt-components-h1"  x="30" y="40">What a production prompt contains</text>
  <text class="prompt-components-sub" x="30" y="64">Six parts, in order.</text>
  <g class="prompt-components-stage prompt-components-s0">
    <rect class="prompt-components-box" x="30" y="118" width="131" height="104" rx="10"/>
    <text class="prompt-components-step" x="44" y="142">01</text>
    <text class="prompt-components-name" x="70" y="142">The role and the constraints</text>
    <text class="prompt-components-desc" x="44" y="166">Who the model is</text>
    <text class="prompt-components-desc" x="44" y="182">acting as, and what</text>
    <text class="prompt-components-desc" x="44" y="198">it must not do.</text>
  </g>
  <line class="prompt-components-line prompt-components-conn prompt-components-e0" x1="163" y1="170" x2="185" y2="170" marker-end="url(#prompt-components-tip)"/>
  <g class="prompt-components-stage prompt-components-s1">
    <rect class="prompt-components-box" x="187" y="118" width="131" height="104" rx="10"/>
    <text class="prompt-components-step" x="201" y="142">02</text>
    <text class="prompt-components-name" x="227" y="142">The task</text>
    <text class="prompt-components-desc" x="201" y="166">Stated once,</text>
    <text class="prompt-components-desc" x="201" y="182">precisely, in the</text>
    <text class="prompt-components-desc" x="201" y="198">imperative.</text>
  </g>
  <line class="prompt-components-line prompt-components-conn prompt-components-e1" x1="320" y1="170" x2="342" y2="170" marker-end="url(#prompt-components-tip)"/>
  <g class="prompt-components-stage prompt-components-s2">
    <rect class="prompt-components-good" x="344" y="118" width="131" height="104" rx="10"/>
    <text class="prompt-components-step" x="358" y="142">03</text>
    <text class="prompt-components-name" x="384" y="142">The context</text>
    <text class="prompt-components-desc" x="358" y="166">Retrieved documents,</text>
    <text class="prompt-components-desc" x="358" y="182">or the relevant</text>
    <text class="prompt-components-desc" x="358" y="198">state.</text>
  </g>
  <line class="prompt-components-line prompt-components-conn prompt-components-e2" x1="477" y1="170" x2="499" y2="170" marker-end="url(#prompt-components-tip)"/>
  <g class="prompt-components-stage prompt-components-s3">
    <rect class="prompt-components-box" x="501" y="118" width="131" height="104" rx="10"/>
    <text class="prompt-components-step" x="515" y="142">04</text>
    <text class="prompt-components-name" x="541" y="142">Examples</text>
    <text class="prompt-components-desc" x="515" y="166">Two or three,</text>
    <text class="prompt-components-desc" x="515" y="182">showing the exact</text>
    <text class="prompt-components-desc" x="515" y="198">shape of a good</text>
  </g>
  <line class="prompt-components-line prompt-components-conn prompt-components-e3" x1="634" y1="170" x2="656" y2="170" marker-end="url(#prompt-components-tip)"/>
  <g class="prompt-components-stage prompt-components-s4">
    <rect class="prompt-components-box" x="658" y="118" width="131" height="104" rx="10"/>
    <text class="prompt-components-step" x="672" y="142">05</text>
    <text class="prompt-components-name" x="698" y="142">The output format</text>
    <text class="prompt-components-desc" x="672" y="166">Explicitly, with a</text>
    <text class="prompt-components-desc" x="672" y="182">schema where one</text>
    <text class="prompt-components-desc" x="672" y="198">exists.</text>
  </g>
  <line class="prompt-components-line prompt-components-conn prompt-components-e4" x1="791" y1="170" x2="813" y2="170" marker-end="url(#prompt-components-tip)"/>
  <g class="prompt-components-stage prompt-components-s5">
    <rect class="prompt-components-box" x="815" y="118" width="131" height="104" rx="10"/>
    <text class="prompt-components-step" x="829" y="142">06</text>
    <text class="prompt-components-name" x="855" y="142">Then the input, last</text>
    <text class="prompt-components-desc" x="829" y="166">Clearly delimited,</text>
    <text class="prompt-components-desc" x="829" y="182">and treated as</text>
    <text class="prompt-components-desc" x="829" y="198">untrusted.</text>
    <text class="prompt-components-edge" x="829" y="242">ordering matters</text>
  </g>
  <text class="prompt-components-sub" x="30" y="304">The ordering is not stylistic: everything fixed sits before everything variable, which is what allows the prefix to be cached and what keeps instructions ahead of untrusted text.</text>
</svg>
