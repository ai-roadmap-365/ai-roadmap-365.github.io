<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="ROC vs PR Curves Comparison">
  <title>ROC Curve vs Precision-Recall Curve</title>
  <defs>
    <style>
      .d159a-bg { fill: #f8fafc; }
      .d159a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d159a-header { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; }
      .d159a-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; }
      .d159a-math { fill: #0f172a; font-family: "Courier New", monospace; font-size: 14px; font-weight: 600; }
      .d159a-curve-roc { stroke: #2563eb; stroke-width: 3; fill: none; }
      .d159a-curve-pr { stroke: #dc2626; stroke-width: 3; fill: none; }
      .d159a-dash { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="d159a-bg" />

  <text x="40" y="45" class="d159a-header" font-size="22">Evaluation Space: ROC Curve vs Precision-Recall Curve</text>
  <text x="40" y="70" class="d159a-text">Contrasting evaluation metrics under rare positive class prevalence (1% Positives)</text>

  <!-- Panel 1: ROC Space -->
  <rect x="40" y="100" width="390" height="340" class="d159a-card" />
  <text x="60" y="130" class="d159a-header" font-size="16" fill="#1d4ed8">1. ROC Space (TPR vs FPR)</text>
  <text x="60" y="155" class="d159a-math">ROC AUC = 0.94 (Looks Stellar)</text>
  <text x="60" y="175" class="d159a-text" font-size="12" fill="#64748b">FPR = FP / (TN + FP) dominated by large TN</text>

  <!-- Axes -->
  <line x1="80" y1="380" x2="380" y2="380" stroke="#64748b" stroke-width="1.5" />
  <line x1="80" y1="380" x2="80" y2="200" stroke="#64748b" stroke-width="1.5" />
  <text x="210" y="405" class="d159a-text" font-size="12">False Positive Rate (FPR)</text>
  <text x="50" y="290" class="d159a-text" font-size="12" transform="rotate(-90 50 290)">True Positive Rate (TPR)</text>

  <!-- Diagonal baseline -->
  <line x1="80" y1="380" x2="380" y2="200" class="d159a-dash" />

  <!-- ROC Curve -->
  <path d="M 80 380 Q 100 210 380 200" class="d159a-curve-roc" />

  <text x="90" y="425" class="d159a-text" font-size="12" fill="#1e40af">Can mask high false positive volume in imbalanced data</text>

  <!-- Panel 2: PR Space -->
  <rect x="470" y="100" width="390" height="340" class="d159a-card" />
  <text x="490" y="130" class="d159a-header" font-size="16" fill="#dc2626">2. PR Space (Precision vs Recall)</text>
  <text x="490" y="155" class="d159a-math">PR AUC = 0.42 (Reveals False Alarms)</text>
  <text x="490" y="175" class="d159a-text" font-size="12" fill="#64748b">Precision = TP / (TP + FP) directly exposes FP</text>

  <!-- Axes -->
  <line x1="510" y1="380" x2="810" y2="380" stroke="#64748b" stroke-width="1.5" />
  <line x1="510" y1="380" x2="510" y2="200" stroke="#64748b" stroke-width="1.5" />
  <text x="640" y="405" class="d159a-text" font-size="12">Recall (Sensitivity)</text>
  <text x="480" y="290" class="d159a-text" font-size="12" transform="rotate(-90 480 290)">Precision</text>

  <!-- PR Baseline (prevalence = 0.01) -->
  <line x1="510" y1="378" x2="810" y2="378" class="d159a-dash" stroke="#ef4444" />

  <!-- PR Curve -->
  <path d="M 510 210 Q 560 220 650 310 T 810 375" class="d159a-curve-pr" />

  <text x="500" y="425" class="d159a-text" font-size="12" fill="#991b1b">Mandatory standard for rare-event detection and fraud</text>
</svg>
