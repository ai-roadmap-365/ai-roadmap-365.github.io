<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two questions decide it.">
  <title>Which undo do you want?</title>
  <style>
    .undo-decision-bg   { fill: #f8fafc; }
    .undo-decision-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .undo-decision-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .undo-decision-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .undo-decision-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .undo-decision-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .undo-decision-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .undo-decision-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .undo-decision-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .undo-decision-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .undo-decision-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .undo-decision-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .undo-decision-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .undo-decision-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .undo-decision-stage { opacity: 1; }

    .undo-decision-s0 { animation-delay: 0.00s; }
    .undo-decision-e0 { animation-delay: 0.00s; }
    .undo-decision-s1 { animation-delay: 1.28s; }
    .undo-decision-e1 { animation-delay: 1.28s; }
    .undo-decision-s2 { animation-delay: 2.56s; }
    .undo-decision-e2 { animation-delay: 2.56s; }
    .undo-decision-s3 { animation-delay: 3.84s; }
    .undo-decision-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .undo-decision-conn  { animation: undo-decision-trace 6.4s ease-in-out infinite; }
      .undo-decision-stage { animation: undo-decision-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes undo-decision-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes undo-decision-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .undo-decision-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .undo-decision-stage { animation: undo-decision-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes undo-decision-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="undo-decision-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="undo-decision-bg" width="980" height="322"/>
  <text class="undo-decision-h1"  x="30" y="40">Which undo do you want?</text>
  <text class="undo-decision-sub" x="30" y="64">Two questions decide it.</text>
  <g class="undo-decision-stage undo-decision-s0">
    <rect class="undo-decision-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="undo-decision-step" x="44" y="142">01</text>
    <text class="undo-decision-name" x="70" y="142">Not committed, want it gone?</text>
    <text class="undo-decision-desc" x="44" y="166">git restore &lt;file&gt;. Destructive,</text>
    <text class="undo-decision-desc" x="44" y="182">and nothing can bring it back.</text>
    <text class="undo-decision-edge" x="44" y="242">restore</text>
  </g>
  <line class="undo-decision-line undo-decision-conn undo-decision-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#undo-decision-tip)"/>
  <g class="undo-decision-stage undo-decision-s1">
    <rect class="undo-decision-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="undo-decision-step" x="280" y="142">02</text>
    <text class="undo-decision-name" x="306" y="142">Not committed, want it later?</text>
    <text class="undo-decision-desc" x="280" y="166">git stash. Set aside,</text>
    <text class="undo-decision-desc" x="280" y="182">retrievable.</text>
    <text class="undo-decision-edge" x="280" y="242">stash</text>
  </g>
  <line class="undo-decision-line undo-decision-conn undo-decision-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#undo-decision-tip)"/>
  <g class="undo-decision-stage undo-decision-s2">
    <rect class="undo-decision-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="undo-decision-step" x="516" y="142">03</text>
    <text class="undo-decision-name" x="542" y="142">Committed, not shared?</text>
    <text class="undo-decision-desc" x="516" y="166">git reset — soft to keep the</text>
    <text class="undo-decision-desc" x="516" y="182">changes, hard to discard</text>
    <text class="undo-decision-desc" x="516" y="198">everything.</text>
    <text class="undo-decision-edge" x="516" y="242">reset</text>
  </g>
  <line class="undo-decision-line undo-decision-conn undo-decision-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#undo-decision-tip)"/>
  <g class="undo-decision-stage undo-decision-s3">
    <rect class="undo-decision-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="undo-decision-step" x="752" y="142">04</text>
    <text class="undo-decision-name" x="778" y="142">Committed and shared?</text>
    <text class="undo-decision-desc" x="752" y="166">git revert. Additive, so</text>
    <text class="undo-decision-desc" x="752" y="182">everyone stays in sync.</text>
    <text class="undo-decision-edge" x="752" y="242">revert</text>
  </g>
  <text class="undo-decision-sub" x="30" y="304">And whatever has happened, git status and git reflog are both read-only. Run them before anything else — most Git panics end there.</text>
</svg>
