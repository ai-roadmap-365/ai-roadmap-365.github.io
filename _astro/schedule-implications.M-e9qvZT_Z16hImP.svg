<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Reproducibility, resumption, and two costs.">
  <title>Four consequences of scheduling</title>
  <style>
    .schedule-implications-bg   { fill: #f8fafc; }
    .schedule-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .schedule-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .schedule-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .schedule-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .schedule-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .schedule-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .schedule-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .schedule-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .schedule-implications-stage { opacity: 1; }

    .schedule-implications-s0 { animation-delay: 0.00s; }
    .schedule-implications-e0 { animation-delay: 0.00s; }
    .schedule-implications-s1 { animation-delay: 1.28s; }
    .schedule-implications-e1 { animation-delay: 1.28s; }
    .schedule-implications-s2 { animation-delay: 2.56s; }
    .schedule-implications-e2 { animation-delay: 2.56s; }
    .schedule-implications-s3 { animation-delay: 3.84s; }
    .schedule-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .schedule-implications-conn  { animation: schedule-implications-trace 6.4s ease-in-out infinite; }
      .schedule-implications-stage { animation: schedule-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes schedule-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes schedule-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .schedule-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .schedule-implications-stage { animation: schedule-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes schedule-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="schedule-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="schedule-implications-bg" width="980" height="322"/>
  <text class="schedule-implications-h1"  x="30" y="40">Four consequences of scheduling</text>
  <text class="schedule-implications-sub" x="30" y="64">Reproducibility, resumption, and two costs.</text>
  <g class="schedule-implications-stage schedule-implications-s0">
    <rect class="schedule-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="schedule-implications-step" x="44" y="142">01</text>
    <text class="schedule-implications-name" x="70" y="142">The schedule depends on total steps</text>
    <text class="schedule-implications-desc" x="44" y="166">Change the epoch count and the</text>
    <text class="schedule-implications-desc" x="44" y="182">shape changes with it.</text>
  </g>
  <line class="schedule-implications-line schedule-implications-conn schedule-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#schedule-implications-tip)"/>
  <g class="schedule-implications-stage schedule-implications-s1">
    <rect class="schedule-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="schedule-implications-step" x="280" y="142">02</text>
    <text class="schedule-implications-name" x="306" y="142">Resuming needs the scheduler state</text>
    <text class="schedule-implications-desc" x="280" y="166">A checkpoint without it restarts</text>
    <text class="schedule-implications-desc" x="280" y="182">the schedule from the top.</text>
  </g>
  <line class="schedule-implications-line schedule-implications-conn schedule-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#schedule-implications-tip)"/>
  <g class="schedule-implications-stage schedule-implications-s2">
    <rect class="schedule-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="schedule-implications-step" x="516" y="142">03</text>
    <text class="schedule-implications-name" x="542" y="142">Warmup reduces sensitivity to the peak</text>
    <text class="schedule-implications-desc" x="516" y="166">A slightly high peak survives if</text>
    <text class="schedule-implications-desc" x="516" y="182">it is approached gradually.</text>
  </g>
  <line class="schedule-implications-line schedule-implications-conn schedule-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#schedule-implications-tip)"/>
  <g class="schedule-implications-stage schedule-implications-s3">
    <rect class="schedule-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="schedule-implications-step" x="752" y="142">04</text>
    <text class="schedule-implications-name" x="778" y="142">Annealing improves generalisation</text>
    <text class="schedule-implications-desc" x="752" y="166">Small final steps settle into</text>
    <text class="schedule-implications-desc" x="752" y="182">flatter minima.</text>
  </g>
  <text class="schedule-implications-sub" x="30" y="304">The resumption case is a genuine and common bug: a run resumed from a checkpoint that saved only the model weights restarts warmup, and the large early steps undo hours of training.</text>
</svg>
