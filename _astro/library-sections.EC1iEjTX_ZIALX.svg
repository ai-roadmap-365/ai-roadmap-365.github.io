<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Every spine, or the right section.">
  <title>Finding a book in a library</title>
  <style>
    .library-sections-bg   { fill: #f8fafc; }
    .library-sections-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-sections-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-sections-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-sections-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-sections-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-sections-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .library-sections-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .library-sections-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .library-sections-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .library-sections-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .library-sections-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .library-sections-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .library-sections-row { opacity: 1; }
    .library-sections-r0 { animation-delay: 0.00s; }
    .library-sections-r1 { animation-delay: 0.45s; }
    .library-sections-r2 { animation-delay: 0.90s; }
    .library-sections-r3 { animation-delay: 1.35s; }
    .library-sections-r4 { animation-delay: 1.80s; }
    .library-sections-row { animation: library-sections-reveal 7.3s ease-in-out infinite; }
    @keyframes library-sections-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="library-sections-bg" width="980" height="390"/>
  <text class="library-sections-h1"  x="30" y="40">Finding a book in a library</text>
  <text class="library-sections-sub" x="30" y="64">Every spine, or the right section.</text>
  <rect class="library-sections-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="library-sections-name" x="46" y="122">Every spine</text>
  <text class="library-sections-desc" x="46" y="142">You will find it.</text>
  <text class="library-sections-desc library-sections-row library-sections-r0" x="46" y="182">Read the whole building</text>
  <text class="library-sections-desc library-sections-row library-sections-r1" x="46" y="216">Certain, and slow</text>
  <text class="library-sections-desc library-sections-row library-sections-r2" x="46" y="250">No possibility of missing it</text>
  <text class="library-sections-desc library-sections-row library-sections-r3" x="46" y="284">This is exact search</text>
  <text class="library-sections-desc library-sections-row library-sections-r4" x="46" y="318">And checking every section is worse still</text>
  <rect class="library-sections-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="library-sections-name" x="526" y="122">By section</text>
  <text class="library-sections-desc" x="526" y="142">Fast, with one failure.</text>
  <text class="library-sections-desc library-sections-row library-sections-r0" x="526" y="182">Walk to the sign that best matches</text>
  <text class="library-sections-desc library-sections-row library-sections-r1" x="526" y="216">Scan only that section</text>
  <text class="library-sections-desc library-sections-row library-sections-r2" x="526" y="250">Signs are the centroids</text>
  <text class="library-sections-desc library-sections-row library-sections-r3" x="526" y="284">A book shelved under the wrong subject</text>
  <text class="library-sections-desc library-sections-row library-sections-r4" x="526" y="318">Is not harder to find — you will not find it</text>
  <text class="library-sections-sub" x="30" y="372">The last row on the left is the ceiling of the technique: checking every section costs all the same reading plus the walking, which is why full-probe search is strictly worse than exact.</text>
</svg>
