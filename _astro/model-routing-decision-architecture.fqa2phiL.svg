<svg role="img" aria-label="Production multi-model routing pipeline architecture diagram directing user queries to optimal cost and latency tiers" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Model Routing &amp; Cost Optimization Pipeline</title>
  <defs>
    <linearGradient id="bg241b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card241b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg241b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">PRODUCTION MODEL ROUTING ARCHITECTURE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Dynamic Multi-Tier Routing: Slashing API Costs by 80% while Preserving Quality</text>
  <g transform="translate(50, 85)">
    <rect width="750" height="295" fill="url(#card241b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Step 1: User Request -->
    <rect x="25" y="100" width="120" height="75" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="85" y="130" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">Incoming Query</text>
    <text x="85" y="150" fill="#cbd5e1" font-size="8" text-anchor="middle">Prompt + Context</text>

    <!-- Arrow 1 -->
    <line x1="145" y1="137" x2="195" y2="137" stroke="#38bdf8" stroke-width="2"/>

    <!-- Step 2: Semantic Router -->
    <rect x="195" y="80" width="160" height="115" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="275" y="105" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">Semantic Router</text>
    <text x="210" y="130" fill="#cbd5e1" font-size="8">• Fast embedding / intent check</text>
    <text x="210" y="148" fill="#cbd5e1" font-size="8">• Token length &amp; complexity score</text>
    <text x="210" y="166" fill="#cbd5e1" font-size="8">• Code / math detection</text>

    <!-- Branch Arrows -->
    <path d="M 355 120 L 425 60" fill="none" stroke="#10b981" stroke-width="2"/>
    <path d="M 355 155 L 425 210" fill="none" stroke="#f43f5e" stroke-width="2"/>

    <!-- Tier 1: Cheap / Fast -->
    <rect x="425" y="25" width="280" height="85" fill="#0f172a" stroke="#10b981" rx="6"/>
    <text x="565" y="48" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">Tier 1: Fast &amp; Cheap (80% Traffic)</text>
    <text x="440" y="70" fill="#cbd5e1" font-size="8">• Gemini 2.0 Flash / Haiku / GPT-4o-mini</text>
    <text x="440" y="88" fill="#cbd5e1" font-size="8">• Simple Q&amp;A, extraction, summarization, translation ($0.15/M)</text>

    <!-- Tier 2: Heavy / Reasoning -->
    <rect x="425" y="175" width="280" height="95" fill="#0f172a" stroke="#f43f5e" rx="6"/>
    <text x="565" y="198" fill="#fb7185" font-size="11" font-weight="700" text-anchor="middle">Tier 2: Frontier Reasoning (20% Traffic)</text>
    <text x="440" y="220" fill="#cbd5e1" font-size="8">• Claude 3.5 Sonnet / OpenAI o1 / GPT-4o</text>
    <text x="440" y="238" fill="#cbd5e1" font-size="8">• Complex multi-step coding, architectural synthesis ($3-$15/M)</text>
    <text x="440" y="256" fill="#38bdf8" font-size="8" font-weight="700">Blended Cost Savings: ~75% vs. using Sonnet for all traffic!</text>
  </g>
</svg>
