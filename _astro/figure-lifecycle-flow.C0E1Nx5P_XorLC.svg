<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 700" role="img" aria-labelledby="d133f-title d133f-desc" width="1220" height="700">
  <title id="d133f-title">The life of a candidate figure: twelve enter three gates, seven are discarded, five reach the report</title>
  <desc id="d133f-desc">Candidate figures travel left to right through a question gate, a claim gate and a so-what gate. Most are turned aside into a tray of one-line null results. The survivors are drawn into the report with numbered captions.</desc>
  <style>
    .d133f-bg     { fill: #f8fafc; }
    .d133f-lead   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 26px; font-weight: 700; fill: #1d4ed8; }
    .d133f-note   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #1a202c; }
    .d133f-h      { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 700; fill: #1a202c; }
    .d133f-t      { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #1a202c; }
    .d133f-sm     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1a202c; }
    .d133f-count  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 19px; font-weight: 700; fill: #b91c1c; }
    .d133f-cap    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; fill: #1a202c; font-style: italic; }
    .d133f-cand   { fill: #e2e8f0; stroke: #64748b; stroke-width: 1.5; }
    .d133f-tray   { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2; }
    .d133f-panel  { fill: #ffffff; stroke: #1d4ed8; stroke-width: 2.5; }
    .d133f-fig    { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 1.2; }
    .d133f-line   { stroke: #94a3b8; stroke-width: 3; }
    .d133f-rule   { stroke: #94a3b8; stroke-width: 1.5; fill: none; }

    .d133f-gate   { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 2;
                    animation: d133f-lift 6s ease-in-out infinite; }
    .d133f-g1     { animation-delay: 0s; }
    .d133f-g2     { animation-delay: 1.6s; }
    .d133f-g3     { animation-delay: 3.2s; }
    @keyframes d133f-lift {
      0%, 26%, 100% { fill: #e0e7ff; }
      8%, 18%       { fill: #bfdbfe; }
    }

    .d133f-wire   { stroke: #1d4ed8; stroke-width: 3; fill: none;
                    stroke-dasharray: 10 8; animation: d133f-march 1.6s linear infinite; }
    @keyframes d133f-march { to { stroke-dashoffset: -18; } }

    .d133f-token  { fill: #1d4ed8; animation: d133f-travel 6s ease-in-out infinite; }
    @keyframes d133f-travel {
      0%   { transform: translateX(0); }
      100% { transform: translateX(760px); }
    }

    .d133f-drop   { fill: #b91c1c; animation: d133f-fall 6s ease-in-out infinite; }
    .d133f-d1     { animation-delay: 0.4s; }
    .d133f-d2     { animation-delay: 2.0s; }
    .d133f-d3     { animation-delay: 3.6s; }
    @keyframes d133f-fall {
      0%, 8%    { transform: translateY(0); }
      30%, 100% { transform: translateY(150px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .d133f-gate  { animation: none; fill: #e0e7ff; }
      .d133f-wire  { animation: none; stroke-dasharray: none; }
      .d133f-token { animation: none; transform: none; }
      .d133f-drop  { animation: none; transform: translateY(150px); }
    }
  </style>

  <rect class="d133f-bg" x="0" y="0" width="1220" height="700" />
  <text class="d133f-lead" x="40" y="46">Twelve candidate figures in. Five out. That is the honest ratio.</text>
  <text class="d133f-note" x="40" y="74">Exploration is wide and private. A report is narrow and public. Three gates stand between them, and most candidates never pass the first.</text>

  <defs>
    <marker id="d133f-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
    <marker id="d133f-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c" />
    </marker>
  </defs>

  <!-- Candidate stack -->
  <text class="d133f-h" x="40" y="118">12 candidates</text>
  <rect class="d133f-cand" x="40"  y="130" width="70" height="30" rx="5" />
  <rect class="d133f-cand" x="120" y="130" width="70" height="30" rx="5" />
  <rect class="d133f-cand" x="40"  y="168" width="70" height="30" rx="5" />
  <rect class="d133f-cand" x="120" y="168" width="70" height="30" rx="5" />
  <rect class="d133f-cand" x="40"  y="206" width="70" height="30" rx="5" />
  <rect class="d133f-cand" x="120" y="206" width="70" height="30" rx="5" />
  <rect class="d133f-cand" x="40"  y="244" width="70" height="30" rx="5" />
  <rect class="d133f-cand" x="120" y="244" width="70" height="30" rx="5" />
  <rect class="d133f-cand" x="40"  y="282" width="70" height="30" rx="5" />
  <rect class="d133f-cand" x="120" y="282" width="70" height="30" rx="5" />
  <rect class="d133f-cand" x="40"  y="320" width="70" height="30" rx="5" />
  <rect class="d133f-cand" x="120" y="320" width="70" height="30" rx="5" />
  <text class="d133f-sm" x="40" y="374">every chart you made</text>
  <text class="d133f-sm" x="40" y="394">while exploring</text>

  <!-- Gates -->
  <rect class="d133f-gate d133f-g1" x="260" y="150" width="180" height="160" rx="10" />
  <text class="d133f-h" x="350" y="182" text-anchor="middle">Gate 1</text>
  <text class="d133f-t" x="350" y="210" text-anchor="middle">Does it answer a</text>
  <text class="d133f-t" x="350" y="232" text-anchor="middle">stated question?</text>
  <text class="d133f-sm" x="350" y="264" text-anchor="middle">no question,</text>
  <text class="d133f-sm" x="350" y="284" text-anchor="middle">no figure</text>

  <rect class="d133f-gate d133f-g2" x="500" y="150" width="180" height="160" rx="10" />
  <text class="d133f-h" x="590" y="182" text-anchor="middle">Gate 2</text>
  <text class="d133f-t" x="590" y="210" text-anchor="middle">Does the caption</text>
  <text class="d133f-t" x="590" y="232" text-anchor="middle">carry a claim?</text>
  <text class="d133f-sm" x="590" y="264" text-anchor="middle">a label is not</text>
  <text class="d133f-sm" x="590" y="284" text-anchor="middle">a finding</text>

  <rect class="d133f-gate d133f-g3" x="740" y="150" width="180" height="160" rx="10" />
  <text class="d133f-h" x="830" y="182" text-anchor="middle">Gate 3</text>
  <text class="d133f-t" x="830" y="210" text-anchor="middle">So what? Would</text>
  <text class="d133f-t" x="830" y="232" text-anchor="middle">the decision move?</text>
  <text class="d133f-sm" x="830" y="264" text-anchor="middle">true but idle</text>
  <text class="d133f-sm" x="830" y="284" text-anchor="middle">is still cut</text>

  <!-- Main wire -->
  <path class="d133f-wire" d="M 196 230 L 258 230" marker-end="url(#d133f-arrow)" />
  <path class="d133f-wire" d="M 442 230 L 498 230" marker-end="url(#d133f-arrow)" />
  <path class="d133f-wire" d="M 682 230 L 738 230" marker-end="url(#d133f-arrow)" />
  <path class="d133f-wire" d="M 922 230 L 968 230" marker-end="url(#d133f-arrow)" />
  <circle class="d133f-token" cx="210" cy="230" r="9" />

  <!-- Discard paths -->
  <path class="d133f-rule" d="M 350 312 L 350 466" stroke="#b91c1c" marker-end="url(#d133f-arrow-red)" />
  <text class="d133f-count" x="362" y="400">4 dropped</text>
  <circle class="d133f-drop d133f-d1" cx="330" cy="330" r="8" />

  <path class="d133f-rule" d="M 590 312 L 590 466" stroke="#b91c1c" marker-end="url(#d133f-arrow-red)" />
  <text class="d133f-count" x="602" y="400">2 dropped</text>
  <circle class="d133f-drop d133f-d2" cx="570" cy="330" r="8" />

  <path class="d133f-rule" d="M 830 312 L 830 466" stroke="#b91c1c" marker-end="url(#d133f-arrow-red)" />
  <text class="d133f-count" x="842" y="400">1 dropped</text>
  <circle class="d133f-drop d133f-d3" cx="810" cy="330" r="8" />

  <!-- Tray -->
  <rect class="d133f-tray" x="250" y="470" width="670" height="96" rx="10" />
  <text class="d133f-h" x="270" y="500">7 discarded — and kept as one line each</text>
  <text class="d133f-t" x="270" y="526">"A cumulative revenue curve was drawn and discarded: it rises whatever the</text>
  <text class="d133f-t" x="270" y="548">months do, so it answered no question the monthly series had not answered."</text>

  <!-- Report panel -->
  <rect class="d133f-panel" x="968" y="110" width="212" height="330" rx="8" />
  <text class="d133f-h" x="984" y="138">The report</text>
  <rect class="d133f-fig" x="984" y="150" width="180" height="30" rx="3" />
  <text class="d133f-sm" x="984" y="196">Fig 1 — claim, with number</text>
  <rect class="d133f-fig" x="984" y="206" width="180" height="30" rx="3" />
  <text class="d133f-sm" x="984" y="252">Fig 2 — claim, with number</text>
  <rect class="d133f-fig" x="984" y="262" width="180" height="30" rx="3" />
  <text class="d133f-sm" x="984" y="308">Fig 3 — claim, with number</text>
  <rect class="d133f-fig" x="984" y="318" width="180" height="30" rx="3" />
  <text class="d133f-sm" x="984" y="364">Fig 4 — claim, with number</text>
  <rect class="d133f-fig" x="984" y="374" width="180" height="30" rx="3" />
  <text class="d133f-sm" x="984" y="420">Fig 5 — claim, with number</text>
  <text class="d133f-sm" x="968" y="464">5 survivors, each with its</text>
  <text class="d133f-sm" x="968" y="484">question and its claim</text>

  <path class="d133f-rule" d="M 40 596 L 1180 596" />
  <text class="d133f-cap" x="40" y="626">Turn motion off and nothing is lost: every tile, gate, count, caption and survivor is already drawn in its final position.</text>
  <text class="d133f-cap" x="40" y="652">The animation only shows the order things happen in — it carries no fact of its own.</text>
  <text class="d133f-sm"  x="40" y="682">In this lesson's own candidate list all seven fall at Gate 1. The three-gate split shown here is the general shape, not one run.</text>
</svg>
