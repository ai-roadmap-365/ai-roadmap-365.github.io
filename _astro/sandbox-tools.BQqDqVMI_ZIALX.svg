<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Which makes the sandbox part of the loop.">
  <title>Every action executes real code</title>
  <style>
    .sandbox-tools-bg   { fill: #f8fafc; }
    .sandbox-tools-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sandbox-tools-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sandbox-tools-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sandbox-tools-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sandbox-tools-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sandbox-tools-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sandbox-tools-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sandbox-tools-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sandbox-tools-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sandbox-tools-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sandbox-tools-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sandbox-tools-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sandbox-tools-row { opacity: 1; }
    .sandbox-tools-r0 { animation-delay: 0.00s; }
    .sandbox-tools-r1 { animation-delay: 0.45s; }
    .sandbox-tools-r2 { animation-delay: 0.90s; }
    .sandbox-tools-r3 { animation-delay: 1.35s; }
    .sandbox-tools-r4 { animation-delay: 1.80s; }
    .sandbox-tools-row { animation: sandbox-tools-reveal 7.3s ease-in-out infinite; }
    @keyframes sandbox-tools-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="sandbox-tools-bg" width="980" height="390"/>
  <text class="sandbox-tools-h1"  x="30" y="40">Every action executes real code</text>
  <text class="sandbox-tools-sub" x="30" y="64">Which makes the sandbox part of the loop.</text>
  <rect class="sandbox-tools-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="sandbox-tools-name" x="46" y="122">Sandboxed</text>
  <text class="sandbox-tools-desc" x="46" y="142">Bounded blast radius.</text>
  <text class="sandbox-tools-desc sandbox-tools-row sandbox-tools-r0" x="46" y="182">A restricted container or a WASM runtime</text>
  <text class="sandbox-tools-desc sandbox-tools-row sandbox-tools-r1" x="46" y="216">A hard timeout, around three seconds</text>
  <text class="sandbox-tools-desc sandbox-tools-row sandbox-tools-r2" x="46" y="250">No ambient credentials</text>
  <text class="sandbox-tools-desc sandbox-tools-row sandbox-tools-r3" x="46" y="284">Network egress allowlisted</text>
  <text class="sandbox-tools-desc sandbox-tools-row sandbox-tools-r4" x="46" y="318">A runaway call is contained</text>
  <rect class="sandbox-tools-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="sandbox-tools-name" x="526" y="122">Direct</text>
  <text class="sandbox-tools-desc" x="526" y="142">The agent's authority is yours.</text>
  <text class="sandbox-tools-desc sandbox-tools-row sandbox-tools-r0" x="526" y="182">Shell or Python in the host process</text>
  <text class="sandbox-tools-desc sandbox-tools-row sandbox-tools-r1" x="526" y="216">No timeout, so one call can hang the loop</text>
  <text class="sandbox-tools-desc sandbox-tools-row sandbox-tools-r2" x="526" y="250">Environment variables in reach</text>
  <text class="sandbox-tools-desc sandbox-tools-row sandbox-tools-r3" x="526" y="284">Arbitrary outbound requests</text>
  <text class="sandbox-tools-desc sandbox-tools-row sandbox-tools-r4" x="526" y="318">An injected instruction becomes an action</text>
  <text class="sandbox-tools-sub" x="30" y="372">The timeout is the underrated control: without one, a single tool call that blocks turns a bounded agent into an indefinitely hung process that has consumed its budget and produced nothing.</text>
</svg>
