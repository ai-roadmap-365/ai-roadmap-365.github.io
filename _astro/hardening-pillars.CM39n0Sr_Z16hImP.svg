<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each is a number, not a judgement.">
  <title>The six thresholds</title>
  <style>
    .hardening-pillars-bg   { fill: #f8fafc; }
    .hardening-pillars-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hardening-pillars-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hardening-pillars-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hardening-pillars-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hardening-pillars-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hardening-pillars-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hardening-pillars-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hardening-pillars-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hardening-pillars-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hardening-pillars-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hardening-pillars-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hardening-pillars-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .hardening-pillars-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .hardening-pillars-stage { opacity: 1; }

    .hardening-pillars-s0 { animation-delay: 0.00s; }
    .hardening-pillars-e0 { animation-delay: 0.00s; }
    .hardening-pillars-s1 { animation-delay: 1.37s; }
    .hardening-pillars-e1 { animation-delay: 1.37s; }
    .hardening-pillars-s2 { animation-delay: 2.74s; }
    .hardening-pillars-e2 { animation-delay: 2.74s; }
    .hardening-pillars-s3 { animation-delay: 4.11s; }
    .hardening-pillars-e3 { animation-delay: 4.11s; }
    .hardening-pillars-s4 { animation-delay: 5.49s; }
    .hardening-pillars-e4 { animation-delay: 5.49s; }
    .hardening-pillars-s5 { animation-delay: 6.86s; }
    .hardening-pillars-e5 { animation-delay: 6.86s; }
    @media (prefers-reduced-motion: no-preference) {
      .hardening-pillars-conn  { animation: hardening-pillars-trace 9.600000000000001s ease-in-out infinite; }
      .hardening-pillars-stage { animation: hardening-pillars-arrive 9.600000000000001s ease-in-out infinite; }
    }
    @keyframes hardening-pillars-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes hardening-pillars-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .hardening-pillars-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .hardening-pillars-stage { animation: hardening-pillars-settle 9.600000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes hardening-pillars-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="hardening-pillars-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="hardening-pillars-bg" width="980" height="322"/>
  <text class="hardening-pillars-h1"  x="30" y="40">The six thresholds</text>
  <text class="hardening-pillars-sub" x="30" y="64">Each is a number, not a judgement.</text>
  <g class="hardening-pillars-stage hardening-pillars-s0">
    <rect class="hardening-pillars-box" x="30" y="118" width="131" height="104" rx="10"/>
    <text class="hardening-pillars-step" x="44" y="142">01</text>
    <text class="hardening-pillars-name" x="70" y="142">DREAD composite under 4.0</text>
    <text class="hardening-pillars-desc" x="44" y="166">With trust</text>
    <text class="hardening-pillars-desc" x="44" y="182">perimeters</text>
    <text class="hardening-pillars-desc" x="44" y="198">separating untrusted</text>
    <text class="hardening-pillars-edge" x="44" y="242">&lt; 4.0</text>
  </g>
  <line class="hardening-pillars-line hardening-pillars-conn hardening-pillars-e0" x1="163" y1="170" x2="185" y2="170" marker-end="url(#hardening-pillars-tip)"/>
  <g class="hardening-pillars-stage hardening-pillars-s1">
    <rect class="hardening-pillars-box" x="187" y="118" width="131" height="104" rx="10"/>
    <text class="hardening-pillars-step" x="201" y="142">02</text>
    <text class="hardening-pillars-name" x="227" y="142">Zero outbound canary leaks</text>
    <text class="hardening-pillars-desc" x="201" y="166">Escaping, delimiters</text>
    <text class="hardening-pillars-desc" x="201" y="182">and a per-session</text>
    <text class="hardening-pillars-desc" x="201" y="198">token, all active.</text>
  </g>
  <line class="hardening-pillars-line hardening-pillars-conn hardening-pillars-e1" x1="320" y1="170" x2="342" y2="170" marker-end="url(#hardening-pillars-tip)"/>
  <g class="hardening-pillars-stage hardening-pillars-s2">
    <rect class="hardening-pillars-box" x="344" y="118" width="131" height="104" rx="10"/>
    <text class="hardening-pillars-step" x="358" y="142">03</text>
    <text class="hardening-pillars-name" x="384" y="142">Bidirectional vault active</text>
    <text class="hardening-pillars-desc" x="358" y="166">SSNs, emails and</text>
    <text class="hardening-pillars-desc" x="358" y="182">cards tokenised in</text>
    <text class="hardening-pillars-desc" x="358" y="198">memory, with</text>
  </g>
  <line class="hardening-pillars-line hardening-pillars-conn hardening-pillars-e2" x1="477" y1="170" x2="499" y2="170" marker-end="url(#hardening-pillars-tip)"/>
  <g class="hardening-pillars-stage hardening-pillars-s3">
    <rect class="hardening-pillars-box" x="501" y="118" width="131" height="104" rx="10"/>
    <text class="hardening-pillars-step" x="515" y="142">04</text>
    <text class="hardening-pillars-name" x="541" y="142">100% SafeTensors</text>
    <text class="hardening-pillars-desc" x="515" y="166">Zero .pt or .pkl.</text>
    <text class="hardening-pillars-desc" x="515" y="182">ModelScan clean. A</text>
    <text class="hardening-pillars-desc" x="515" y="198">CycloneDX AIBOM</text>
    <text class="hardening-pillars-edge" x="515" y="242">0 pickle</text>
  </g>
  <line class="hardening-pillars-line hardening-pillars-conn hardening-pillars-e3" x1="634" y1="170" x2="656" y2="170" marker-end="url(#hardening-pillars-tip)"/>
  <g class="hardening-pillars-stage hardening-pillars-s4">
    <rect class="hardening-pillars-box" x="658" y="118" width="131" height="104" rx="10"/>
    <text class="hardening-pillars-step" x="672" y="142">05</text>
    <text class="hardening-pillars-name" x="698" y="142">Fairness ratio above 0.80</text>
    <text class="hardening-pillars-desc" x="672" y="166">Risk tier assessed,</text>
    <text class="hardening-pillars-desc" x="672" y="182">model card</text>
    <text class="hardening-pillars-desc" x="672" y="198">version-controlled.</text>
  </g>
  <line class="hardening-pillars-line hardening-pillars-conn hardening-pillars-e4" x1="791" y1="170" x2="813" y2="170" marker-end="url(#hardening-pillars-tip)"/>
  <g class="hardening-pillars-stage hardening-pillars-s5">
    <rect class="hardening-pillars-good" x="815" y="118" width="131" height="104" rx="10"/>
    <text class="hardening-pillars-step" x="829" y="142">06</text>
    <text class="hardening-pillars-name" x="855" y="142">ASR at 0.0% on critical categories</text>
    <text class="hardening-pillars-desc" x="829" y="166">Before deployment</text>
    <text class="hardening-pillars-desc" x="829" y="182">admission.</text>
    <text class="hardening-pillars-edge" x="829" y="242">the gate</text>
  </g>
  <text class="hardening-pillars-sub" x="30" y="304">Every threshold here is computable, which is the property that lets the review run unattended: a pipeline can block a release on any one of the six without a person needing to form an opinion.</text>
</svg>
