<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One is a consequence.">
  <title>The boundary against the model</title>
  <style>
    .boundary-vs-model-bg   { fill: #f8fafc; }
    .boundary-vs-model-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boundary-vs-model-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boundary-vs-model-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boundary-vs-model-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boundary-vs-model-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boundary-vs-model-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .boundary-vs-model-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .boundary-vs-model-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .boundary-vs-model-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .boundary-vs-model-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .boundary-vs-model-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .boundary-vs-model-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .boundary-vs-model-row { opacity: 1; }
    .boundary-vs-model-r0 { animation-delay: 0.00s; }
    .boundary-vs-model-r1 { animation-delay: 0.45s; }
    .boundary-vs-model-r2 { animation-delay: 0.90s; }
    .boundary-vs-model-r3 { animation-delay: 1.35s; }
    .boundary-vs-model-r4 { animation-delay: 1.80s; }
    .boundary-vs-model-row { animation: boundary-vs-model-reveal 7.3s ease-in-out infinite; }
    @keyframes boundary-vs-model-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="boundary-vs-model-bg" width="980" height="390"/>
  <text class="boundary-vs-model-h1"  x="30" y="40">The boundary against the model</text>
  <text class="boundary-vs-model-sub" x="30" y="64">One is a consequence.</text>
  <rect class="boundary-vs-model-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="boundary-vs-model-name" x="46" y="122">The boundary</text>
  <text class="boundary-vs-model-desc" x="46" y="142">What it does.</text>
  <text class="boundary-vs-model-desc boundary-vs-model-row boundary-vs-model-r0" x="46" y="182">A surface in feature space</text>
  <text class="boundary-vs-model-desc boundary-vs-model-row boundary-vs-model-r1" x="46" y="216">Visible in two dimensions</text>
  <text class="boundary-vs-model-desc boundary-vs-model-row boundary-vs-model-r2" x="46" y="250">Determined entirely by the model</text>
  <text class="boundary-vs-model-desc boundary-vs-model-row boundary-vs-model-r3" x="46" y="284">Shows what can be separated</text>
  <text class="boundary-vs-model-desc boundary-vs-model-row boundary-vs-model-r4" x="46" y="318">A consequence, not a parameter</text>
  <rect class="boundary-vs-model-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="boundary-vs-model-name" x="526" y="122">The model</text>
  <text class="boundary-vs-model-desc" x="526" y="142">How it does it.</text>
  <text class="boundary-vs-model-desc boundary-vs-model-row boundary-vs-model-r0" x="526" y="182">Weights, or rules, or neighbours</text>
  <text class="boundary-vs-model-desc boundary-vs-model-row boundary-vs-model-r1" x="526" y="216">Not visible directly</text>
  <text class="boundary-vs-model-desc boundary-vs-model-row boundary-vs-model-r2" x="526" y="250">Determines the boundary</text>
  <text class="boundary-vs-model-desc boundary-vs-model-row boundary-vs-model-r3" x="526" y="284">Shows how the decision is computed</text>
  <text class="boundary-vs-model-desc boundary-vs-model-row boundary-vs-model-r4" x="526" y="318">What is actually fitted</text>
  <text class="boundary-vs-model-sub" x="30" y="372">Boundaries can only be drawn in two or three dimensions, so the pictures are always of a projection — which is a real limit on this kind of intuition.</text>
</svg>
