<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two lists.">
  <title>Where it helps and where it does not</title>
  <style>
    .tdd-good-bad-bg   { fill: #f8fafc; }
    .tdd-good-bad-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tdd-good-bad-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tdd-good-bad-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tdd-good-bad-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tdd-good-bad-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tdd-good-bad-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tdd-good-bad-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tdd-good-bad-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tdd-good-bad-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tdd-good-bad-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tdd-good-bad-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tdd-good-bad-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tdd-good-bad-row { opacity: 1; }
    .tdd-good-bad-r0 { animation-delay: 0.00s; }
    .tdd-good-bad-r1 { animation-delay: 0.45s; }
    .tdd-good-bad-r2 { animation-delay: 0.90s; }
    .tdd-good-bad-r3 { animation-delay: 1.35s; }
    .tdd-good-bad-r4 { animation-delay: 1.80s; }
    .tdd-good-bad-row { animation: tdd-good-bad-reveal 7.3s ease-in-out infinite; }
    @keyframes tdd-good-bad-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tdd-good-bad-bg" width="980" height="390"/>
  <text class="tdd-good-bad-h1"  x="30" y="40">Where it helps and where it does not</text>
  <text class="tdd-good-bad-sub" x="30" y="64">Two lists.</text>
  <rect class="tdd-good-bad-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tdd-good-bad-name" x="46" y="122">Unusually good at</text>
  <text class="tdd-good-bad-desc" x="46" y="142">Four cases.</text>
  <text class="tdd-good-bad-desc tdd-good-bad-row tdd-good-bad-r0" x="46" y="182">Well-specified logic with clear inputs and outputs</text>
  <text class="tdd-good-bad-desc tdd-good-bad-row tdd-good-bad-r1" x="46" y="216">Bug fixes: reproduce first, then fix</text>
  <text class="tdd-good-bad-desc tdd-good-bad-row tdd-good-bad-r2" x="46" y="250">Refactoring under a safety net</text>
  <text class="tdd-good-bad-desc tdd-good-bad-row tdd-good-bad-r3" x="46" y="284">Designing an interface from the caller's side</text>
  <text class="tdd-good-bad-desc tdd-good-bad-row tdd-good-bad-r4" x="46" y="318">Anything with many edge cases</text>
  <rect class="tdd-good-bad-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tdd-good-bad-name" x="526" y="122">Bad at</text>
  <text class="tdd-good-bad-desc" x="526" y="142">Also four.</text>
  <text class="tdd-good-bad-desc tdd-good-bad-row tdd-good-bad-r0" x="526" y="182">Exploratory work where the goal is unclear</text>
  <text class="tdd-good-bad-desc tdd-good-bad-row tdd-good-bad-r1" x="526" y="216">User interface and visual work</text>
  <text class="tdd-good-bad-desc tdd-good-bad-row tdd-good-bad-r2" x="526" y="250">Integration with unpredictable systems</text>
  <text class="tdd-good-bad-desc tdd-good-bad-row tdd-good-bad-r3" x="526" y="284">Performance work, which needs measurement</text>
  <text class="tdd-good-bad-desc tdd-good-bad-row tdd-good-bad-r4" x="526" y="318">Where the design is already known</text>
  <text class="tdd-good-bad-sub" x="30" y="372">Exploration being a poor fit is the honest limit: writing a test for behaviour you have not yet decided on is guessing rather than specifying.</text>
</svg>
