<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Why the loss fails</title>
  <style>
    .unweighted-failure-bg   { fill: #f8fafc; }
    .unweighted-failure-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unweighted-failure-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unweighted-failure-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unweighted-failure-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unweighted-failure-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .unweighted-failure-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .unweighted-failure-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .unweighted-failure-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .unweighted-failure-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .unweighted-failure-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .unweighted-failure-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .unweighted-failure-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .unweighted-failure-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .unweighted-failure-stage { opacity: 1; }

    .unweighted-failure-s0 { animation-delay: 0.00s; }
    .unweighted-failure-e0 { animation-delay: 0.00s; }
    .unweighted-failure-s1 { animation-delay: 1.28s; }
    .unweighted-failure-e1 { animation-delay: 1.28s; }
    .unweighted-failure-s2 { animation-delay: 2.56s; }
    .unweighted-failure-e2 { animation-delay: 2.56s; }
    .unweighted-failure-s3 { animation-delay: 3.84s; }
    .unweighted-failure-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .unweighted-failure-conn  { animation: unweighted-failure-trace 6.4s ease-in-out infinite; }
      .unweighted-failure-stage { animation: unweighted-failure-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes unweighted-failure-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes unweighted-failure-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .unweighted-failure-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .unweighted-failure-stage { animation: unweighted-failure-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes unweighted-failure-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="unweighted-failure-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="unweighted-failure-bg" width="980" height="322"/>
  <text class="unweighted-failure-h1"  x="30" y="40">Why the loss fails</text>
  <text class="unweighted-failure-sub" x="30" y="64">Four steps.</text>
  <g class="unweighted-failure-stage unweighted-failure-s0">
    <rect class="unweighted-failure-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="unweighted-failure-step" x="44" y="142">01</text>
    <text class="unweighted-failure-name" x="70" y="142">Each example contributes its own loss</text>
    <text class="unweighted-failure-desc" x="44" y="166">Weighted equally in the average.</text>
  </g>
  <line class="unweighted-failure-line unweighted-failure-conn unweighted-failure-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#unweighted-failure-tip)"/>
  <g class="unweighted-failure-stage unweighted-failure-s1">
    <rect class="unweighted-failure-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="unweighted-failure-step" x="280" y="142">02</text>
    <text class="unweighted-failure-name" x="306" y="142">With one percent positives, they are one percent of the total</text>
    <text class="unweighted-failure-desc" x="280" y="166">Even when every one is wrong.</text>
  </g>
  <line class="unweighted-failure-line unweighted-failure-conn unweighted-failure-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#unweighted-failure-tip)"/>
  <g class="unweighted-failure-stage unweighted-failure-s2">
    <rect class="unweighted-failure-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="unweighted-failure-step" x="516" y="142">03</text>
    <text class="unweighted-failure-name" x="542" y="142">So the gradient is dominated by the majority</text>
    <text class="unweighted-failure-desc" x="516" y="166">By a factor of ninety-nine to</text>
    <text class="unweighted-failure-desc" x="516" y="182">one.</text>
  </g>
  <line class="unweighted-failure-line unweighted-failure-conn unweighted-failure-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#unweighted-failure-tip)"/>
  <g class="unweighted-failure-stage unweighted-failure-s3">
    <rect class="unweighted-failure-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="unweighted-failure-step" x="752" y="142">04</text>
    <text class="unweighted-failure-name" x="778" y="142">And weighting restores the balance exactly</text>
    <text class="unweighted-failure-desc" x="752" y="166">By multiplying rare examples up.</text>
  </g>
  <text class="unweighted-failure-sub" x="30" y="304">Seeing the ratio explicitly makes the fix obvious: the weight needed is precisely the imbalance ratio, which is why balanced weighting is the default recipe.</text>
</svg>
