<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 580" role="img" font-family="system-ui, sans-serif">
  <title>The design loop for a small program: start from a spec and examples, decompose the work into small single-responsibility functions, design their signatures and docstrings before any bodies, implement the pure core, add the thin imperative shell, test the core directly and the shell end to end, then refactor with the tests holding — looping back to grow the program one working slice at a time</title>
  <rect x="0" y="0" width="780" height="580" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The design loop: spec to refactor</text>

  <!-- Step boxes -->
  <rect x="230" y="60" width="300" height="50" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">1. Spec + examples</text>
  <text x="380" y="101" text-anchor="middle" font-size="14" fill="#1a202c">start from the problem, not the code</text>

  <line x1="380" y1="110" x2="380" y2="132" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,132 374,120 386,120" fill="#1a202c"/>

  <rect x="230" y="132" width="300" height="50" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="154" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">2. Decompose into functions</text>
  <text x="380" y="173" text-anchor="middle" font-size="14" fill="#1a202c">one responsibility each; high cohesion</text>

  <line x1="380" y1="182" x2="380" y2="204" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,204 374,192 386,192" fill="#1a202c"/>

  <rect x="230" y="204" width="300" height="50" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="226" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">3. Design signatures + docstrings</text>
  <text x="380" y="245" text-anchor="middle" font-size="14" fill="#1a202c">the contract, before any body</text>

  <line x1="380" y1="254" x2="380" y2="276" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,276 374,264 386,264" fill="#1a202c"/>

  <rect x="230" y="276" width="300" height="50" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">4. Implement the pure core</text>
  <text x="380" y="317" text-anchor="middle" font-size="14" fill="#1a202c">logic only — no I/O in here</text>

  <line x1="380" y1="326" x2="380" y2="348" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,348 374,336 386,336" fill="#1a202c"/>

  <rect x="230" y="348" width="300" height="50" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="370" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">5. Add the thin shell</text>
  <text x="380" y="389" text-anchor="middle" font-size="14" fill="#1a202c">argv, files, stdout, exit code</text>

  <line x1="380" y1="398" x2="380" y2="420" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,420 374,408 386,408" fill="#1a202c"/>

  <rect x="230" y="420" width="300" height="50" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="442" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">6. Test</text>
  <text x="380" y="461" text-anchor="middle" font-size="14" fill="#1a202c">core directly; shell end to end</text>

  <line x1="380" y1="470" x2="380" y2="492" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,492 374,480 386,480" fill="#1a202c"/>

  <rect x="230" y="492" width="300" height="50" fill="#fef9c3" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="514" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">7. Refactor (tests holding)</text>
  <text x="380" y="533" text-anchor="middle" font-size="14" fill="#1a202c">clean up; stop when good enough (YAGNI)</text>

  <!-- Loop-back arrow: refactor -> decompose (grow incrementally) -->
  <path d="M 530 517 H 610 V 157 H 530" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 5"/>
  <polygon points="530,157 542,151 542,163" fill="#1d4ed8"/>
  <text x="626" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8" transform="rotate(90 626 330)">grow one working slice at a time</text>

  <!-- Left annotation grouping -->
  <text x="150" y="150" text-anchor="middle" font-size="13" fill="#1a202c" transform="rotate(-90 150 150)">design (on paper)</text>
  <text x="150" y="360" text-anchor="middle" font-size="13" fill="#1a202c" transform="rotate(-90 150 360)">build the pieces</text>
</svg>
