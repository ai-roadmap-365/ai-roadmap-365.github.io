<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four controls.">
  <title>Sandboxing local tools</title>
  <style>
    .sandboxing-bg   { fill: #f8fafc; }
    .sandboxing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sandboxing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sandboxing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sandboxing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sandboxing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sandboxing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sandboxing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sandboxing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sandboxing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sandboxing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sandboxing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sandboxing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .sandboxing-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .sandboxing-stage { opacity: 1; }

    .sandboxing-s0 { animation-delay: 0.00s; }
    .sandboxing-e0 { animation-delay: 0.00s; }
    .sandboxing-s1 { animation-delay: 1.28s; }
    .sandboxing-e1 { animation-delay: 1.28s; }
    .sandboxing-s2 { animation-delay: 2.56s; }
    .sandboxing-e2 { animation-delay: 2.56s; }
    .sandboxing-s3 { animation-delay: 3.84s; }
    .sandboxing-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .sandboxing-conn  { animation: sandboxing-trace 6.4s ease-in-out infinite; }
      .sandboxing-stage { animation: sandboxing-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes sandboxing-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes sandboxing-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .sandboxing-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .sandboxing-stage { animation: sandboxing-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes sandboxing-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="sandboxing-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="sandboxing-bg" width="980" height="322"/>
  <text class="sandboxing-h1"  x="30" y="40">Sandboxing local tools</text>
  <text class="sandboxing-sub" x="30" y="64">Four controls.</text>
  <g class="sandboxing-stage sandboxing-s0">
    <rect class="sandboxing-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="sandboxing-step" x="44" y="142">01</text>
    <text class="sandboxing-name" x="70" y="142">Restrict operations to a declared root</text>
    <text class="sandboxing-desc" x="44" y="166">And reject anything outside it.</text>
  </g>
  <line class="sandboxing-line sandboxing-conn sandboxing-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#sandboxing-tip)"/>
  <g class="sandboxing-stage sandboxing-s1">
    <rect class="sandboxing-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="sandboxing-step" x="280" y="142">02</text>
    <text class="sandboxing-name" x="306" y="142">Resolve paths fully before checking</text>
    <text class="sandboxing-desc" x="280" y="166">Or a relative path or a symbolic</text>
    <text class="sandboxing-desc" x="280" y="182">link walks straight out.</text>
  </g>
  <line class="sandboxing-line sandboxing-conn sandboxing-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#sandboxing-tip)"/>
  <g class="sandboxing-stage sandboxing-s2">
    <rect class="sandboxing-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="sandboxing-step" x="516" y="142">03</text>
    <text class="sandboxing-name" x="542" y="142">Allowlist commands rather than blocklisting them</text>
    <text class="sandboxing-desc" x="516" y="166">A blocklist is always</text>
    <text class="sandboxing-desc" x="516" y="182">incomplete.</text>
  </g>
  <line class="sandboxing-line sandboxing-conn sandboxing-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#sandboxing-tip)"/>
  <g class="sandboxing-stage sandboxing-s3">
    <rect class="sandboxing-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="sandboxing-step" x="752" y="142">04</text>
    <text class="sandboxing-name" x="778" y="142">And require confirmation for writes and deletes</text>
    <text class="sandboxing-desc" x="752" y="166">Which is the control that</text>
    <text class="sandboxing-desc" x="752" y="182">actually holds.</text>
  </g>
  <text class="sandboxing-sub" x="30" y="304">Checking a path before resolving it is the classic escape, and it is why canonicalisation has to come first rather than being treated as a tidying step.</text>
</svg>
