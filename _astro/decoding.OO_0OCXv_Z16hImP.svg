<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The same model, different behaviour.">
  <title>Four decoding strategies</title>
  <style>
    .decoding-bg   { fill: #f8fafc; }
    .decoding-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decoding-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decoding-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decoding-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decoding-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decoding-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .decoding-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .decoding-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .decoding-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .decoding-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .decoding-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .decoding-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .decoding-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .decoding-stage { opacity: 1; }

    .decoding-s0 { animation-delay: 0.00s; }
    .decoding-e0 { animation-delay: 0.00s; }
    .decoding-s1 { animation-delay: 1.28s; }
    .decoding-e1 { animation-delay: 1.28s; }
    .decoding-s2 { animation-delay: 2.56s; }
    .decoding-e2 { animation-delay: 2.56s; }
    .decoding-s3 { animation-delay: 3.84s; }
    .decoding-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .decoding-conn  { animation: decoding-trace 6.4s ease-in-out infinite; }
      .decoding-stage { animation: decoding-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes decoding-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes decoding-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .decoding-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .decoding-stage { animation: decoding-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes decoding-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="decoding-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="decoding-bg" width="980" height="322"/>
  <text class="decoding-h1"  x="30" y="40">Four decoding strategies</text>
  <text class="decoding-sub" x="30" y="64">The same model, different behaviour.</text>
  <g class="decoding-stage decoding-s0">
    <rect class="decoding-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="decoding-step" x="44" y="142">01</text>
    <text class="decoding-name" x="70" y="142">Greedy</text>
    <text class="decoding-desc" x="44" y="166">Always the highest-probability</text>
    <text class="decoding-desc" x="44" y="182">token. Deterministic, and</text>
    <text class="decoding-desc" x="44" y="198">repetitive.</text>
  </g>
  <line class="decoding-line decoding-conn decoding-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#decoding-tip)"/>
  <g class="decoding-stage decoding-s1">
    <rect class="decoding-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="decoding-step" x="280" y="142">02</text>
    <text class="decoding-name" x="306" y="142">Temperature</text>
    <text class="decoding-desc" x="280" y="166">Sharpen or flatten the</text>
    <text class="decoding-desc" x="280" y="182">distribution before sampling.</text>
    <text class="decoding-edge" x="280" y="242">randomness</text>
  </g>
  <line class="decoding-line decoding-conn decoding-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#decoding-tip)"/>
  <g class="decoding-stage decoding-s2">
    <rect class="decoding-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="decoding-step" x="516" y="142">03</text>
    <text class="decoding-name" x="542" y="142">Nucleus sampling</text>
    <text class="decoding-desc" x="516" y="166">Sample from the smallest set</text>
    <text class="decoding-desc" x="516" y="182">covering a probability mass.</text>
    <text class="decoding-desc" x="516" y="198">Adaptive.</text>
  </g>
  <line class="decoding-line decoding-conn decoding-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#decoding-tip)"/>
  <g class="decoding-stage decoding-s3">
    <rect class="decoding-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="decoding-step" x="752" y="142">04</text>
    <text class="decoding-name" x="778" y="142">Beam search</text>
    <text class="decoding-desc" x="752" y="166">Keep several candidates. Better</text>
    <text class="decoding-desc" x="752" y="182">for translation, worse for open</text>
    <text class="decoding-desc" x="752" y="198">text.</text>
  </g>
  <text class="decoding-sub" x="30" y="304">Beam search producing worse open-ended text than sampling is a genuinely counter-intuitive result: the most probable continuation of a long text is systematically bland and repetitive.</text>
</svg>
