<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Not just the drawings.">
  <title>An as-built record</title>
  <style>
    .blueprint-bg   { fill: #f8fafc; }
    .blueprint-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blueprint-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blueprint-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blueprint-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blueprint-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blueprint-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .blueprint-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .blueprint-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .blueprint-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .blueprint-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .blueprint-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .blueprint-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .blueprint-row { opacity: 1; }
    .blueprint-r0 { animation-delay: 0.00s; }
    .blueprint-r1 { animation-delay: 0.45s; }
    .blueprint-r2 { animation-delay: 0.90s; }
    .blueprint-r3 { animation-delay: 1.35s; }
    .blueprint-r4 { animation-delay: 1.80s; }
    .blueprint-row { animation: blueprint-reveal 7.3s ease-in-out infinite; }
    @keyframes blueprint-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="blueprint-bg" width="980" height="390"/>
  <text class="blueprint-h1"  x="30" y="40">An as-built record</text>
  <text class="blueprint-sub" x="30" y="64">Not just the drawings.</text>
  <rect class="blueprint-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="blueprint-name" x="46" y="122">Drawings only</text>
  <text class="blueprint-desc" x="46" y="142">How it was meant to be.</text>
  <text class="blueprint-desc blueprint-row blueprint-r0" x="46" y="182">The intended design</text>
  <text class="blueprint-desc blueprint-row blueprint-r1" x="46" y="216">Not what was actually built</text>
  <text class="blueprint-desc blueprint-row blueprint-r2" x="46" y="250">Materials and substitutions unrecorded</text>
  <text class="blueprint-desc blueprint-row blueprint-r3" x="46" y="284">Cannot be rebuilt faithfully</text>
  <text class="blueprint-desc blueprint-row blueprint-r4" x="46" y="318">This is a saved model file</text>
  <rect class="blueprint-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="blueprint-name" x="526" y="122">An as-built record</text>
  <text class="blueprint-desc" x="526" y="142">What was actually built.</text>
  <text class="blueprint-desc blueprint-row blueprint-r0" x="526" y="182">Design, materials, batch numbers, dates</text>
  <text class="blueprint-desc blueprint-row blueprint-r1" x="526" y="216">Matches what exists</text>
  <text class="blueprint-desc blueprint-row blueprint-r2" x="526" y="250">Every substitution recorded</text>
  <text class="blueprint-desc blueprint-row blueprint-r3" x="526" y="284">Can be rebuilt or repaired</text>
  <text class="blueprint-desc blueprint-row blueprint-r4" x="526" y="318">This is a versioned artefact</text>
  <text class="blueprint-sub" x="30" y="372">The as-built record is what a later engineer actually needs, and the same is true of a model: the intent is less useful than the exact composition.</text>
</svg>
