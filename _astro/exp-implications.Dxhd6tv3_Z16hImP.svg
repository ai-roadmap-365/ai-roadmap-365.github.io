<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are cost.">
  <title>Four consequences of experimentation</title>
  <style>
    .exp-implications-bg   { fill: #f8fafc; }
    .exp-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exp-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exp-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exp-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exp-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exp-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exp-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .exp-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .exp-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .exp-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .exp-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .exp-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .exp-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .exp-implications-stage { opacity: 1; }

    .exp-implications-s0 { animation-delay: 0.00s; }
    .exp-implications-e0 { animation-delay: 0.00s; }
    .exp-implications-s1 { animation-delay: 1.28s; }
    .exp-implications-e1 { animation-delay: 1.28s; }
    .exp-implications-s2 { animation-delay: 2.56s; }
    .exp-implications-e2 { animation-delay: 2.56s; }
    .exp-implications-s3 { animation-delay: 3.84s; }
    .exp-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .exp-implications-conn  { animation: exp-implications-trace 6.4s ease-in-out infinite; }
      .exp-implications-stage { animation: exp-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes exp-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes exp-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .exp-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .exp-implications-stage { animation: exp-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes exp-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="exp-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="exp-implications-bg" width="980" height="322"/>
  <text class="exp-implications-h1"  x="30" y="40">Four consequences of experimentation</text>
  <text class="exp-implications-sub" x="30" y="64">Two are cost.</text>
  <g class="exp-implications-stage exp-implications-s0">
    <rect class="exp-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="exp-implications-step" x="44" y="142">01</text>
    <text class="exp-implications-name" x="70" y="142">Causal claims become defensible</text>
    <text class="exp-implications-desc" x="44" y="166">Which observation alone cannot</text>
    <text class="exp-implications-desc" x="44" y="182">support.</text>
  </g>
  <line class="exp-implications-line exp-implications-conn exp-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#exp-implications-tip)"/>
  <g class="exp-implications-stage exp-implications-s1">
    <rect class="exp-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="exp-implications-step" x="280" y="142">02</text>
    <text class="exp-implications-name" x="306" y="142">But experiments cost time and traffic</text>
    <text class="exp-implications-desc" x="280" y="166">And half the participants get</text>
    <text class="exp-implications-desc" x="280" y="182">the worse option.</text>
  </g>
  <line class="exp-implications-line exp-implications-conn exp-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#exp-implications-tip)"/>
  <g class="exp-implications-stage exp-implications-s2">
    <rect class="exp-implications-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="exp-implications-step" x="516" y="142">03</text>
    <text class="exp-implications-name" x="542" y="142">And there are real ethical constraints</text>
    <text class="exp-implications-desc" x="516" y="166">On what may be tested, and on</text>
    <text class="exp-implications-desc" x="516" y="182">whom.</text>
  </g>
  <line class="exp-implications-line exp-implications-conn exp-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#exp-implications-tip)"/>
  <g class="exp-implications-stage exp-implications-s3">
    <rect class="exp-implications-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="exp-implications-step" x="752" y="142">04</text>
    <text class="exp-implications-name" x="778" y="142">While results generalise only to similar contexts</text>
    <text class="exp-implications-desc" x="752" y="166">Which is often overstated.</text>
  </g>
  <text class="exp-implications-sub" x="30" y="304">The ethical dimension is not optional in product experimentation either, and experimenting on users without consent has caused genuine public controversy.</text>
</svg>
