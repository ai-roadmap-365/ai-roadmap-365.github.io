<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The range a port falls in tells you what it is for.">
  <title>Why your server needs sudo and your browser does not</title>
  <style>
    .port-ranges-bg   { fill: #f8fafc; }
    .port-ranges-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .port-ranges-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .port-ranges-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .port-ranges-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .port-ranges-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .port-ranges-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .port-ranges-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .port-ranges-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .port-ranges-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .port-ranges-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .port-ranges-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .port-ranges-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .port-ranges-row { opacity: 1; }
    .port-ranges-r0 { animation-delay: 0.00s; }
    .port-ranges-r1 { animation-delay: 0.45s; }
    .port-ranges-r2 { animation-delay: 0.90s; }
    .port-ranges-r3 { animation-delay: 1.35s; }
    .port-ranges-r4 { animation-delay: 1.80s; }
    .port-ranges-row { animation: port-ranges-reveal 7.3s ease-in-out infinite; }
    @keyframes port-ranges-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="port-ranges-bg" width="980" height="390"/>
  <text class="port-ranges-h1"  x="30" y="40">Why your server needs sudo and your browser does not</text>
  <text class="port-ranges-sub" x="30" y="64">The range a port falls in tells you what it is for.</text>
  <rect class="port-ranges-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="port-ranges-name" x="46" y="122">Well-known (0-1023)</text>
  <text class="port-ranges-desc" x="46" y="142">The server's side.</text>
  <text class="port-ranges-desc port-ranges-row port-ranges-r0" x="46" y="182">Assigned by convention and registry</text>
  <text class="port-ranges-desc port-ranges-row port-ranges-r1" x="46" y="216">22 SSH, 53 DNS, 80 HTTP, 443 HTTPS</text>
  <text class="port-ranges-desc port-ranges-row port-ranges-r2" x="46" y="250">Usually needs admin rights to bind</text>
  <text class="port-ranges-desc port-ranges-row port-ranges-r3" x="46" y="284">Fixed, so clients know where to look</text>
  <text class="port-ranges-desc port-ranges-row port-ranges-r4" x="46" y="318">This is why dev servers use 8080</text>
  <rect class="port-ranges-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="port-ranges-name" x="526" y="122">Ephemeral (49152-65535)</text>
  <text class="port-ranges-desc" x="526" y="142">The client's side.</text>
  <text class="port-ranges-desc port-ranges-row port-ranges-r0" x="526" y="182">Handed out by the kernel, temporarily</text>
  <text class="port-ranges-desc port-ranges-row port-ranges-r1" x="526" y="216">Your browser gets a fresh one per connection</text>
  <text class="port-ranges-desc port-ranges-row port-ranges-r2" x="526" y="250">No privileges needed</text>
  <text class="port-ranges-desc port-ranges-row port-ranges-r3" x="526" y="284">Released when the connection ends</text>
  <text class="port-ranges-desc port-ranges-row port-ranges-r4" x="526" y="318">Finite — a busy machine can exhaust them</text>
  <text class="port-ranges-sub" x="30" y="372">Registered ports sit between them (1024-49151): 3306 for MySQL, 5432 for PostgreSQL, 6379 for Redis.</text>
</svg>
