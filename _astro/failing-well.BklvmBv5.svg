<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>Failing well</title>
  <style>
    .failing-well-bg   { fill: #f8fafc; }
    .failing-well-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .failing-well-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .failing-well-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .failing-well-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .failing-well-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .failing-well-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .failing-well-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .failing-well-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .failing-well-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .failing-well-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .failing-well-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .failing-well-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .failing-well-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .failing-well-stage { opacity: 1; }

    .failing-well-s0 { animation-delay: 0.00s; }
    .failing-well-e0 { animation-delay: 0.00s; }
    .failing-well-s1 { animation-delay: 1.28s; }
    .failing-well-e1 { animation-delay: 1.28s; }
    .failing-well-s2 { animation-delay: 2.56s; }
    .failing-well-e2 { animation-delay: 2.56s; }
    .failing-well-s3 { animation-delay: 3.84s; }
    .failing-well-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .failing-well-conn  { animation: failing-well-trace 6.4s ease-in-out infinite; }
      .failing-well-stage { animation: failing-well-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes failing-well-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes failing-well-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .failing-well-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .failing-well-stage { animation: failing-well-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes failing-well-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="failing-well-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="failing-well-bg" width="980" height="322"/>
  <text class="failing-well-h1"  x="30" y="40">Failing well</text>
  <text class="failing-well-sub" x="30" y="64">Four properties.</text>
  <g class="failing-well-stage failing-well-s0">
    <rect class="failing-well-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="failing-well-step" x="44" y="142">01</text>
    <text class="failing-well-name" x="70" y="142">Fail as early as possible</text>
    <text class="failing-well-desc" x="44" y="166">At the stage boundary where the</text>
    <text class="failing-well-desc" x="44" y="182">problem entered.</text>
  </g>
  <line class="failing-well-line failing-well-conn failing-well-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#failing-well-tip)"/>
  <g class="failing-well-stage failing-well-s1">
    <rect class="failing-well-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="failing-well-step" x="280" y="142">02</text>
    <text class="failing-well-name" x="306" y="142">Fail loudly, not silently</text>
    <text class="failing-well-desc" x="280" y="166">An exception, not a default</text>
    <text class="failing-well-desc" x="280" y="182">value.</text>
  </g>
  <line class="failing-well-line failing-well-conn failing-well-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#failing-well-tip)"/>
  <g class="failing-well-stage failing-well-s2">
    <rect class="failing-well-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="failing-well-step" x="516" y="142">03</text>
    <text class="failing-well-name" x="542" y="142">Leave no partial output behind</text>
    <text class="failing-well-desc" x="516" y="166">Or the next run consumes corrupt</text>
    <text class="failing-well-desc" x="516" y="182">intermediates.</text>
  </g>
  <line class="failing-well-line failing-well-conn failing-well-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#failing-well-tip)"/>
  <g class="failing-well-stage failing-well-s3">
    <rect class="failing-well-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="failing-well-step" x="752" y="142">04</text>
    <text class="failing-well-name" x="778" y="142">And say enough to diagnose it</text>
    <text class="failing-well-desc" x="752" y="166">Which stage, which field, which</text>
    <text class="failing-well-desc" x="752" y="182">expectation.</text>
  </g>
  <text class="failing-well-sub" x="30" y="304">The partial-write rule is the one most often missed, and it produces the worst class of bug: a pipeline that succeeds using half-written data from a previous failure.</text>
</svg>
