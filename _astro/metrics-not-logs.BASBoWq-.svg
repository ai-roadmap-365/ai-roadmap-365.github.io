<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Different jobs, both needed.">
  <title>Metrics are not logs</title>
  <style>
    .metrics-not-logs-bg   { fill: #f8fafc; }
    .metrics-not-logs-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metrics-not-logs-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metrics-not-logs-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metrics-not-logs-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metrics-not-logs-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metrics-not-logs-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .metrics-not-logs-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .metrics-not-logs-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .metrics-not-logs-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .metrics-not-logs-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .metrics-not-logs-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .metrics-not-logs-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .metrics-not-logs-row { opacity: 1; }
    .metrics-not-logs-r0 { animation-delay: 0.00s; }
    .metrics-not-logs-r1 { animation-delay: 0.45s; }
    .metrics-not-logs-r2 { animation-delay: 0.90s; }
    .metrics-not-logs-r3 { animation-delay: 1.35s; }
    .metrics-not-logs-r4 { animation-delay: 1.80s; }
    .metrics-not-logs-row { animation: metrics-not-logs-reveal 7.3s ease-in-out infinite; }
    @keyframes metrics-not-logs-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="metrics-not-logs-bg" width="980" height="390"/>
  <text class="metrics-not-logs-h1"  x="30" y="40">Metrics are not logs</text>
  <text class="metrics-not-logs-sub" x="30" y="64">Different jobs, both needed.</text>
  <rect class="metrics-not-logs-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="metrics-not-logs-name" x="46" y="122">Metrics</text>
  <text class="metrics-not-logs-desc" x="46" y="142">For noticing.</text>
  <text class="metrics-not-logs-desc metrics-not-logs-row metrics-not-logs-r0" x="46" y="182">Cheap aggregates over windows</text>
  <text class="metrics-not-logs-desc metrics-not-logs-row metrics-not-logs-r1" x="46" y="216">Answer: is something wrong now?</text>
  <text class="metrics-not-logs-desc metrics-not-logs-row metrics-not-logs-r2" x="46" y="250">Drive alerts</text>
  <text class="metrics-not-logs-desc metrics-not-logs-row metrics-not-logs-r3" x="46" y="284">Bounded memory and cardinality</text>
  <text class="metrics-not-logs-desc metrics-not-logs-row metrics-not-logs-r4" x="46" y="318">Useless for reconstructing one request</text>
  <rect class="metrics-not-logs-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="metrics-not-logs-name" x="526" y="122">Logs and traces</text>
  <text class="metrics-not-logs-desc" x="526" y="142">For investigating.</text>
  <text class="metrics-not-logs-desc metrics-not-logs-row metrics-not-logs-r0" x="526" y="182">Full records, per request</text>
  <text class="metrics-not-logs-desc metrics-not-logs-row metrics-not-logs-r1" x="526" y="216">Answer: what happened in this one?</text>
  <text class="metrics-not-logs-desc metrics-not-logs-row metrics-not-logs-r2" x="526" y="250">Consulted after an alert fires</text>
  <text class="metrics-not-logs-desc metrics-not-logs-row metrics-not-logs-r3" x="526" y="284">Expensive, and personal data</text>
  <text class="metrics-not-logs-desc metrics-not-logs-row metrics-not-logs-r4" x="526" y="318">Useless as a detection mechanism</text>
  <text class="metrics-not-logs-sub" x="30" y="372">A dashboard nobody is watching detects nothing. The alert is the detection; the dashboard and the traces are where you go once it has fired.</text>
</svg>
