<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when it does not.">
  <title>When a linear boundary suffices</title>
  <style>
    .boundary-when-bg   { fill: #f8fafc; }
    .boundary-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boundary-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boundary-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boundary-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boundary-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boundary-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .boundary-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .boundary-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .boundary-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .boundary-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .boundary-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .boundary-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .boundary-when-row { opacity: 1; }
    .boundary-when-r0 { animation-delay: 0.00s; }
    .boundary-when-r1 { animation-delay: 0.45s; }
    .boundary-when-r2 { animation-delay: 0.90s; }
    .boundary-when-r3 { animation-delay: 1.35s; }
    .boundary-when-r4 { animation-delay: 1.80s; }
    .boundary-when-row { animation: boundary-when-reveal 7.3s ease-in-out infinite; }
    @keyframes boundary-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="boundary-when-bg" width="980" height="390"/>
  <text class="boundary-when-h1"  x="30" y="40">When a linear boundary suffices</text>
  <text class="boundary-when-sub" x="30" y="64">And when it does not.</text>
  <rect class="boundary-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="boundary-when-name" x="46" y="122">Linear is enough</text>
  <text class="boundary-when-desc" x="46" y="142">More often than expected.</text>
  <text class="boundary-when-desc boundary-when-row boundary-when-r0" x="46" y="182">High-dimensional sparse data such as text</text>
  <text class="boundary-when-desc boundary-when-row boundary-when-r1" x="46" y="216">Limited training data</text>
  <text class="boundary-when-desc boundary-when-row boundary-when-r2" x="46" y="250">Where explanation is required</text>
  <text class="boundary-when-desc boundary-when-row boundary-when-r3" x="46" y="284">As a baseline, always</text>
  <text class="boundary-when-desc boundary-when-row boundary-when-r4" x="46" y="318">Where classes are broadly separable</text>
  <rect class="boundary-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="boundary-when-name" x="526" y="122">You need more</text>
  <text class="boundary-when-desc" x="526" y="142">Four signals.</text>
  <text class="boundary-when-desc boundary-when-row boundary-when-r0" x="526" y="182">Clear interaction between features</text>
  <text class="boundary-when-desc boundary-when-row boundary-when-r1" x="526" y="216">Images, audio and raw signals</text>
  <text class="boundary-when-desc boundary-when-row boundary-when-r2" x="526" y="250">Where the baseline plateaus well below target</text>
  <text class="boundary-when-desc boundary-when-row boundary-when-r3" x="526" y="284">Known non-linear physical structure</text>
  <text class="boundary-when-desc boundary-when-row boundary-when-r4" x="526" y="318">And you have data enough to fit it</text>
  <text class="boundary-when-sub" x="30" y="372">High-dimensional data is often linearly separable purely because of the dimensionality, which is why linear models remain strong on text long after they were written off.</text>
</svg>
