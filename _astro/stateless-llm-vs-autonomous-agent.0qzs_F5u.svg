<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img">
  <title>Stateless Llm Vs Autonomous Agent</title>
  <defs>
    <style>
      .d288f-bg { fill: #f8fafc; }
      .d288f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d288f-stateless { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; rx: 8px; }
      .d288f-agentic { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d288f-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d288f-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d288f-header { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 600; }
      .d288f-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .d288f-badge { font-family: monospace; font-size: 11px; fill: #64748b; }
      .d288f-flow { stroke: #64748b; stroke-width: 2px; stroke-dasharray: 4,4; fill: none; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d288f-bg" />
  
  <text x="40" y="40" class="d288f-title">Stateless LLM vs Autonomous Agent</text>
  <text x="40" y="65" class="d288f-subtitle">Single-pass generation versus multi-step dynamic execution loops</text>
  
  <!-- Left Side: Stateless LLM Completion -->
  <rect x="40" y="90" width="380" height="310" class="d288f-stateless" />
  <text x="60" y="125" class="d288f-header" fill="#b91c1c">Stateless LLM (Prompt -> Completion)</text>
  
  <rect x="60" y="145" width="340" height="50" class="d288f-card" />
  <text x="75" y="175" class="d288f-text">Input: Single Prompt + System Instructions</text>
  
  <path d="M 230 195 L 230 220" class="d288f-flow" />
  
  <rect x="60" y="220" width="340" height="50" class="d288f-card" />
  <text x="75" y="250" class="d288f-text">Processing: 1-Pass Autoregressive Sampling</text>
  
  <path d="M 230 270 L 230 295" class="d288f-flow" />
  
  <rect x="60" y="295" width="340" height="50" class="d288f-card" />
  <text x="75" y="325" class="d288f-text">Output: Static Text Stream (No Env Validation)</text>
  
  <text x="60" y="375" class="d288f-badge">Risk: Hallucination, zero verification, blind execution</text>
  
  <!-- Right Side: Autonomous Agent Loop -->
  <rect x="480" y="90" width="380" height="310" class="d288f-agentic" />
  <text x="500" y="125" class="d288f-header" fill="#15803d">Autonomous Agent (Reason -> Act -> Observe)</text>
  
  <rect x="500" y="145" width="340" height="40" class="d288f-card" />
  <text x="515" y="170" class="d288f-text">1. Goal Perception &amp; Plan Formulation</text>
  
  <path d="M 670 185 L 670 205" class="d288f-flow" />
  
  <rect x="500" y="205" width="340" height="40" class="d288f-card" />
  <text x="515" y="230" class="d288f-text">2. Tool Call Execution (Sandbox, DB, Web)</text>
  
  <path d="M 670 245 L 670 265" class="d288f-flow" />
  
  <rect x="500" y="265" width="340" height="40" class="d288f-card" />
  <text x="515" y="290" class="d288f-text">3. Observe Result &amp; Evaluate Goal Progress</text>
  
  <!-- Feedback Loop Arrow -->
  <path d="M 840 285 C 870 285, 870 165, 840 165" class="d288f-flow" stroke="#15803d" />
  <text x="800" y="225" class="d288f-badge" fill="#15803d">Loop</text>
  
  <rect x="500" y="325" width="340" height="40" class="d288f-card" />
  <text x="515" y="350" class="d288f-text">4. Emit Verified Final Answer on Success</text>
  
  <text x="500" y="390" class="d288f-badge" fill="#15803d">Benefit: Closed-loop self-correction, grounded truth</text>
</svg>