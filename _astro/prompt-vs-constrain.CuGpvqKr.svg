<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Probability against guarantee.">
  <title>Asking against constraining</title>
  <style>
    .prompt-vs-constrain-bg   { fill: #f8fafc; }
    .prompt-vs-constrain-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-vs-constrain-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-vs-constrain-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-vs-constrain-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-vs-constrain-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-vs-constrain-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prompt-vs-constrain-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .prompt-vs-constrain-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .prompt-vs-constrain-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .prompt-vs-constrain-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .prompt-vs-constrain-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .prompt-vs-constrain-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prompt-vs-constrain-row { opacity: 1; }
    .prompt-vs-constrain-r0 { animation-delay: 0.00s; }
    .prompt-vs-constrain-r1 { animation-delay: 0.45s; }
    .prompt-vs-constrain-r2 { animation-delay: 0.90s; }
    .prompt-vs-constrain-r3 { animation-delay: 1.35s; }
    .prompt-vs-constrain-r4 { animation-delay: 1.80s; }
    .prompt-vs-constrain-row { animation: prompt-vs-constrain-reveal 7.3s ease-in-out infinite; }
    @keyframes prompt-vs-constrain-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="prompt-vs-constrain-bg" width="980" height="390"/>
  <text class="prompt-vs-constrain-h1"  x="30" y="40">Asking against constraining</text>
  <text class="prompt-vs-constrain-sub" x="30" y="64">Probability against guarantee.</text>
  <rect class="prompt-vs-constrain-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="prompt-vs-constrain-name" x="46" y="122">Ask in the prompt</text>
  <text class="prompt-vs-constrain-desc" x="46" y="142">Usually valid.</text>
  <text class="prompt-vs-constrain-desc prompt-vs-constrain-row prompt-vs-constrain-r0" x="46" y="182">No special infrastructure</text>
  <text class="prompt-vs-constrain-desc prompt-vs-constrain-row prompt-vs-constrain-r1" x="46" y="216">Works with any provider</text>
  <text class="prompt-vs-constrain-desc prompt-vs-constrain-row prompt-vs-constrain-r2" x="46" y="250">No sampling overhead</text>
  <text class="prompt-vs-constrain-desc prompt-vs-constrain-row prompt-vs-constrain-r3" x="46" y="284">Fails a small percentage of the time</text>
  <text class="prompt-vs-constrain-desc prompt-vs-constrain-row prompt-vs-constrain-r4" x="46" y="318">Which is an incident at volume</text>
  <rect class="prompt-vs-constrain-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="prompt-vs-constrain-name" x="526" y="122">Constrain the sampler</text>
  <text class="prompt-vs-constrain-desc" x="526" y="142">Always valid.</text>
  <text class="prompt-vs-constrain-desc prompt-vs-constrain-row prompt-vs-constrain-r0" x="526" y="182">Needs provider or server support</text>
  <text class="prompt-vs-constrain-desc prompt-vs-constrain-row prompt-vs-constrain-r1" x="526" y="216">Not available everywhere</text>
  <text class="prompt-vs-constrain-desc prompt-vs-constrain-row prompt-vs-constrain-r2" x="526" y="250">Small per-token overhead</text>
  <text class="prompt-vs-constrain-desc prompt-vs-constrain-row prompt-vs-constrain-r3" x="526" y="284">Cannot produce invalid output</text>
  <text class="prompt-vs-constrain-desc prompt-vs-constrain-row prompt-vs-constrain-r4" x="526" y="318">Which removes the error path</text>
  <text class="prompt-vs-constrain-sub" x="30" y="372">At a thousand requests a day, a one-percent failure rate is ten failures a day, which is the arithmetic that usually decides this.</text>
</svg>
