<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="It is a retrieval decision, made early.">
  <title>Chunking decides what can be found</title>
  <style>
    .chunking-decides-bg   { fill: #f8fafc; }
    .chunking-decides-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunking-decides-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunking-decides-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunking-decides-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunking-decides-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chunking-decides-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chunking-decides-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .chunking-decides-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .chunking-decides-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .chunking-decides-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .chunking-decides-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .chunking-decides-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chunking-decides-row { opacity: 1; }
    .chunking-decides-r0 { animation-delay: 0.00s; }
    .chunking-decides-r1 { animation-delay: 0.45s; }
    .chunking-decides-r2 { animation-delay: 0.90s; }
    .chunking-decides-r3 { animation-delay: 1.35s; }
    .chunking-decides-r4 { animation-delay: 1.80s; }
    .chunking-decides-row { animation: chunking-decides-reveal 7.3s ease-in-out infinite; }
    @keyframes chunking-decides-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="chunking-decides-bg" width="980" height="390"/>
  <text class="chunking-decides-h1"  x="30" y="40">Chunking decides what can be found</text>
  <text class="chunking-decides-sub" x="30" y="64">It is a retrieval decision, made early.</text>
  <rect class="chunking-decides-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="chunking-decides-name" x="46" y="122">Small chunks</text>
  <text class="chunking-decides-desc" x="46" y="142">Precise, and possibly incomplete.</text>
  <text class="chunking-decides-desc chunking-decides-row chunking-decides-r0" x="46" y="182">The match is tightly on-topic</text>
  <text class="chunking-decides-desc chunking-decides-row chunking-decides-r1" x="46" y="216">Less irrelevant text in the prompt</text>
  <text class="chunking-decides-desc chunking-decides-row chunking-decides-r2" x="46" y="250">The answer may span two chunks</text>
  <text class="chunking-decides-desc chunking-decides-row chunking-decides-r3" x="46" y="284">Neither chunk alone is sufficient</text>
  <text class="chunking-decides-desc chunking-decides-row chunking-decides-r4" x="46" y="318">Overlap mitigates it, at a cost</text>
  <rect class="chunking-decides-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="chunking-decides-name" x="526" y="122">Large chunks</text>
  <text class="chunking-decides-desc" x="526" y="142">Complete, and possibly diluted.</text>
  <text class="chunking-decides-desc chunking-decides-row chunking-decides-r0" x="526" y="182">The whole answer is in one unit</text>
  <text class="chunking-decides-desc chunking-decides-row chunking-decides-r1" x="526" y="216">Embedding averages over more topics</text>
  <text class="chunking-decides-desc chunking-decides-row chunking-decides-r2" x="526" y="250">Weaker match on a specific question</text>
  <text class="chunking-decides-desc chunking-decides-row chunking-decides-r3" x="526" y="284">More tokens spent per retrieved item</text>
  <text class="chunking-decides-desc chunking-decides-row chunking-decides-r4" x="526" y="318">Fewer chunks fit in the budget</text>
  <text class="chunking-decides-sub" x="30" y="372">There is no universally right size, and the decision is testable: build the evaluation set first and let the numbers choose, rather than picking a size and hoping.</text>
</svg>
