<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward lexical rules.">
  <title>Four steps in scoping</title>
  <style>
    .scope-history-bg   { fill: #f8fafc; }
    .scope-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scope-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scope-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scope-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scope-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scope-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scope-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .scope-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .scope-history-stage { opacity: 1; }

    .scope-history-s0 { animation-delay: 0.00s; }
    .scope-history-e0 { animation-delay: 0.00s; }
    .scope-history-s1 { animation-delay: 1.28s; }
    .scope-history-e1 { animation-delay: 1.28s; }
    .scope-history-s2 { animation-delay: 2.56s; }
    .scope-history-e2 { animation-delay: 2.56s; }
    .scope-history-s3 { animation-delay: 3.84s; }
    .scope-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .scope-history-conn  { animation: scope-history-trace 6.4s ease-in-out infinite; }
      .scope-history-stage { animation: scope-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes scope-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes scope-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .scope-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .scope-history-stage { animation: scope-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes scope-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="scope-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="scope-history-bg" width="980" height="322"/>
  <text class="scope-history-h1"  x="30" y="40">Four steps in scoping</text>
  <text class="scope-history-sub" x="30" y="64">Toward lexical rules.</text>
  <g class="scope-history-stage scope-history-s0">
    <rect class="scope-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="scope-history-step" x="44" y="142">01</text>
    <text class="scope-history-name" x="70" y="142">All names global</text>
    <text class="scope-history-desc" x="44" y="166">So every function could disturb</text>
    <text class="scope-history-desc" x="44" y="182">every other.</text>
  </g>
  <line class="scope-history-line scope-history-conn scope-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#scope-history-tip)"/>
  <g class="scope-history-stage scope-history-s1">
    <rect class="scope-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="scope-history-step" x="280" y="142">02</text>
    <text class="scope-history-name" x="306" y="142">Then local scopes per function</text>
    <text class="scope-history-desc" x="280" y="166">Which made functions</text>
    <text class="scope-history-desc" x="280" y="182">independent.</text>
  </g>
  <line class="scope-history-line scope-history-conn scope-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#scope-history-tip)"/>
  <g class="scope-history-stage scope-history-s2">
    <rect class="scope-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="scope-history-step" x="516" y="142">03</text>
    <text class="scope-history-name" x="542" y="142">Then lexical nesting and closures</text>
    <text class="scope-history-desc" x="516" y="166">Which made functions composable</text>
    <text class="scope-history-desc" x="516" y="182">as values.</text>
  </g>
  <line class="scope-history-line scope-history-conn scope-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#scope-history-tip)"/>
  <g class="scope-history-stage scope-history-s3">
    <rect class="scope-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="scope-history-step" x="752" y="142">04</text>
    <text class="scope-history-name" x="778" y="142">And explicit keywords for rebinding outward</text>
    <text class="scope-history-desc" x="752" y="166">Making the unusual case visible</text>
    <text class="scope-history-desc" x="752" y="182">in the code.</text>
  </g>
  <text class="scope-history-sub" x="30" y="304">Requiring a keyword to rebind outward is a deliberate design choice: it makes the rare, dangerous operation visible rather than accidental.</text>
</svg>
