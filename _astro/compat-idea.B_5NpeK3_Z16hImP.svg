<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four consequences.">
  <title>One interface, many providers</title>
  <style>
    .compat-idea-bg   { fill: #f8fafc; }
    .compat-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compat-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compat-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compat-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compat-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compat-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .compat-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .compat-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .compat-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .compat-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .compat-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .compat-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .compat-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .compat-idea-stage { opacity: 1; }

    .compat-idea-s0 { animation-delay: 0.00s; }
    .compat-idea-e0 { animation-delay: 0.00s; }
    .compat-idea-s1 { animation-delay: 1.28s; }
    .compat-idea-e1 { animation-delay: 1.28s; }
    .compat-idea-s2 { animation-delay: 2.56s; }
    .compat-idea-e2 { animation-delay: 2.56s; }
    .compat-idea-s3 { animation-delay: 3.84s; }
    .compat-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .compat-idea-conn  { animation: compat-idea-trace 6.4s ease-in-out infinite; }
      .compat-idea-stage { animation: compat-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes compat-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes compat-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .compat-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .compat-idea-stage { animation: compat-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes compat-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="compat-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="compat-idea-bg" width="980" height="322"/>
  <text class="compat-idea-h1"  x="30" y="40">One interface, many providers</text>
  <text class="compat-idea-sub" x="30" y="64">Four consequences.</text>
  <g class="compat-idea-stage compat-idea-s0">
    <rect class="compat-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="compat-idea-step" x="44" y="142">01</text>
    <text class="compat-idea-name" x="70" y="142">One provider's request shape became the convention</text>
    <text class="compat-idea-desc" x="44" y="166">Adopted by nearly everyone else.</text>
  </g>
  <line class="compat-idea-line compat-idea-conn compat-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#compat-idea-tip)"/>
  <g class="compat-idea-stage compat-idea-s1">
    <rect class="compat-idea-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="compat-idea-step" x="280" y="142">02</text>
    <text class="compat-idea-name" x="306" y="142">So the client differs only by address and credential</text>
    <text class="compat-idea-desc" x="280" y="166">The code stays the same.</text>
  </g>
  <line class="compat-idea-line compat-idea-conn compat-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#compat-idea-tip)"/>
  <g class="compat-idea-stage compat-idea-s2">
    <rect class="compat-idea-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="compat-idea-step" x="516" y="142">03</text>
    <text class="compat-idea-name" x="542" y="142">Which makes switching a configuration change</text>
    <text class="compat-idea-desc" x="516" y="166">Rather than a rewrite.</text>
  </g>
  <line class="compat-idea-line compat-idea-conn compat-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#compat-idea-tip)"/>
  <g class="compat-idea-stage compat-idea-s3">
    <rect class="compat-idea-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="compat-idea-step" x="752" y="142">04</text>
    <text class="compat-idea-name" x="778" y="142">Though compatibility is partial</text>
    <text class="compat-idea-desc" x="752" y="166">The edges differ, and that is</text>
    <text class="compat-idea-desc" x="752" y="182">where the work is.</text>
  </g>
  <text class="compat-idea-sub" x="30" y="304">Compatibility being partial is the practical caveat: the common path is genuinely portable and tool calling, streaming details and error shapes are where providers diverge.</text>
</svg>
