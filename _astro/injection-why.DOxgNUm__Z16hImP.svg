<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four goals.">
  <title>What the defences are trying to buy</title>
  <style>
    .injection-why-bg   { fill: #f8fafc; }
    .injection-why-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-why-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-why-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-why-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-why-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-why-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .injection-why-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .injection-why-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .injection-why-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .injection-why-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .injection-why-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .injection-why-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .injection-why-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .injection-why-stage { opacity: 1; }

    .injection-why-s0 { animation-delay: 0.00s; }
    .injection-why-e0 { animation-delay: 0.00s; }
    .injection-why-s1 { animation-delay: 1.28s; }
    .injection-why-e1 { animation-delay: 1.28s; }
    .injection-why-s2 { animation-delay: 2.56s; }
    .injection-why-e2 { animation-delay: 2.56s; }
    .injection-why-s3 { animation-delay: 3.84s; }
    .injection-why-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .injection-why-conn  { animation: injection-why-trace 6.4s ease-in-out infinite; }
      .injection-why-stage { animation: injection-why-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes injection-why-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes injection-why-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .injection-why-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .injection-why-stage { animation: injection-why-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes injection-why-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="injection-why-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="injection-why-bg" width="980" height="322"/>
  <text class="injection-why-h1"  x="30" y="40">What the defences are trying to buy</text>
  <text class="injection-why-sub" x="30" y="64">Four goals.</text>
  <g class="injection-why-stage injection-why-s0">
    <rect class="injection-why-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="injection-why-step" x="44" y="142">01</text>
    <text class="injection-why-name" x="70" y="142">Limit what a successful injection can reach</text>
    <text class="injection-why-desc" x="44" y="166">Least privilege on every tool</text>
    <text class="injection-why-desc" x="44" y="182">and credential.</text>
  </g>
  <line class="injection-why-line injection-why-conn injection-why-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#injection-why-tip)"/>
  <g class="injection-why-stage injection-why-s1">
    <rect class="injection-why-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="injection-why-step" x="280" y="142">02</text>
    <text class="injection-why-name" x="306" y="142">Detect that it happened</text>
    <text class="injection-why-desc" x="280" y="166">Logging inputs, outputs and tool</text>
    <text class="injection-why-desc" x="280" y="182">calls.</text>
  </g>
  <line class="injection-why-line injection-why-conn injection-why-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#injection-why-tip)"/>
  <g class="injection-why-stage injection-why-s2">
    <rect class="injection-why-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="injection-why-step" x="516" y="142">03</text>
    <text class="injection-why-name" x="542" y="142">Recover without lasting damage</text>
    <text class="injection-why-desc" x="516" y="166">Reversible actions, confirmation</text>
    <text class="injection-why-desc" x="516" y="182">on irreversible ones.</text>
  </g>
  <line class="injection-why-line injection-why-conn injection-why-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#injection-why-tip)"/>
  <g class="injection-why-stage injection-why-s3">
    <rect class="injection-why-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="injection-why-step" x="752" y="142">04</text>
    <text class="injection-why-name" x="778" y="142">And stop promising prevention you cannot deliver</text>
    <text class="injection-why-desc" x="752" y="166">Which is the honest position.</text>
  </g>
  <text class="injection-why-sub" x="30" y="304">Designing for containment rather than prevention is the practical stance, because a defence that assumes the model will always refuse has no fallback when it does not.</text>
</svg>
