<svg role="img" aria-label="Rosenblatt artificial perceptron architectural diagram showing input weights linear sum step activation function and binary output" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Rosenblatt Artificial Perceptron Model</title>
  <defs>
    <linearGradient id="bg197a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card197" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg197a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">THE ARTIFICIAL PERCEPTRON (ROSENBLATT, 1958)</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">The Foundational Mathematical Atom of Artificial Neural Networks</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card197)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Inputs -->
    <circle cx="80" cy="50" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="80" y="55" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">x1</text>
    <circle cx="80" cy="115" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="80" y="120" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">x2</text>
    <circle cx="80" cy="180" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="80" y="185" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">x3</text>
    <circle cx="80" cy="245" r="22" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="80" y="250" fill="#fbbf24" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">+1 (b)</text>

    <!-- Weights lines -->
    <line x1="102" y1="50" x2="320" y2="147" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="190" y="85" fill="#cbd5e1" font-family="system-ui" font-size="10">w1</text>
    <line x1="102" y1="115" x2="320" y2="147" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="190" y="125" fill="#cbd5e1" font-family="system-ui" font-size="10">w2</text>
    <line x1="102" y1="180" x2="320" y2="147" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="190" y="175" fill="#cbd5e1" font-family="system-ui" font-size="10">w3</text>
    <line x1="102" y1="245" x2="320" y2="147" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="190" y="225" fill="#fbbf24" font-family="system-ui" font-size="10">bias (b)</text>

    <!-- Summation Node -->
    <circle cx="350" cy="147" r="45" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="350" y="142" fill="#34d399" font-family="system-ui" font-size="16" font-weight="700" text-anchor="middle">Sigma</text>
    <text x="350" y="162" fill="#cbd5e1" font-family="system-ui" font-size="10" text-anchor="middle">z = w.x + b</text>

    <!-- Arrow to Activation -->
    <line x1="395" y1="147" x2="475" y2="147" stroke="#64748b" stroke-width="2"/>

    <!-- Step Function Node -->
    <rect x="475" y="107" width="90" height="80" fill="#0f172a" stroke="#ec4899" stroke-width="2" rx="6"/>
    <text x="520" y="132" fill="#f472b6" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">f(z)</text>
    <!-- Step icon -->
    <path d="M 495 165 L 520 165 L 520 145 L 545 145" fill="none" stroke="#f472b6" stroke-width="2"/>

    <!-- Arrow to Output -->
    <line x1="565" y1="147" x2="645" y2="147" stroke="#64748b" stroke-width="2"/>

    <!-- Output -->
    <circle cx="680" cy="147" r="30" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
    <text x="680" y="152" fill="#c084fc" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">y_hat</text>
    <text x="680" y="200" fill="#cbd5e1" font-family="system-ui" font-size="10" text-anchor="middle">Output in {0, 1}</text>
  </g>
</svg>
