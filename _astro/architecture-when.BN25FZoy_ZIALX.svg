<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what a prototype still needs.">
  <title>When the full architecture is warranted</title>
  <style>
    .architecture-when-bg   { fill: #f8fafc; }
    .architecture-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .architecture-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .architecture-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .architecture-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .architecture-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .architecture-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .architecture-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .architecture-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .architecture-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .architecture-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .architecture-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .architecture-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .architecture-when-row { opacity: 1; }
    .architecture-when-r0 { animation-delay: 0.00s; }
    .architecture-when-r1 { animation-delay: 0.45s; }
    .architecture-when-r2 { animation-delay: 0.90s; }
    .architecture-when-r3 { animation-delay: 1.35s; }
    .architecture-when-r4 { animation-delay: 1.80s; }
    .architecture-when-row { animation: architecture-when-reveal 7.3s ease-in-out infinite; }
    @keyframes architecture-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="architecture-when-bg" width="980" height="390"/>
  <text class="architecture-when-h1"  x="30" y="40">When the full architecture is warranted</text>
  <text class="architecture-when-sub" x="30" y="64">And what a prototype still needs.</text>
  <rect class="architecture-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="architecture-when-name" x="46" y="122">Build the tiers</text>
  <text class="architecture-when-desc" x="46" y="142">Real users, real tenants.</text>
  <text class="architecture-when-desc architecture-when-row architecture-when-r0" x="46" y="182">Customer-facing SaaS</text>
  <text class="architecture-when-desc architecture-when-row architecture-when-r1" x="46" y="216">Internal enterprise copilots</text>
  <text class="architecture-when-desc architecture-when-row architecture-when-r2" x="46" y="250">Multi-user chat assistants</text>
  <text class="architecture-when-desc architecture-when-row architecture-when-r3" x="46" y="284">Anything metered per tenant</text>
  <text class="architecture-when-desc architecture-when-row architecture-when-r4" x="46" y="318">Anything with an availability target</text>
  <rect class="architecture-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="architecture-when-name" x="526" y="122">Not needed</text>
  <text class="architecture-when-desc" x="526" y="142">Single-user work.</text>
  <text class="architecture-when-desc architecture-when-row architecture-when-r0" x="526" y="182">Offline research notebooks</text>
  <text class="architecture-when-desc architecture-when-row architecture-when-r1" x="526" y="216">Single-batch data scripts</text>
  <text class="architecture-when-desc architecture-when-row architecture-when-r2" x="526" y="250">A hackathon proof of concept</text>
  <text class="architecture-when-desc architecture-when-row architecture-when-r3" x="526" y="284">But keep the key server-side anyway</text>
  <text class="architecture-when-desc architecture-when-row architecture-when-r4" x="526" y="318">And put a budget cap on it</text>
  <text class="architecture-when-sub" x="30" y="372">The two carve-outs on the right have no threshold: a key in client code is exposed at any scale, and an uncapped prototype can produce a bill that outlives the prototype.</text>
</svg>
