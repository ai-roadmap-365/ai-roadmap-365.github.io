<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Polling, sockets, SSE, middleware.">
  <title>Four stages of transport</title>
  <style>
    .transport-lineage-bg   { fill: #f8fafc; }
    .transport-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transport-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transport-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transport-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transport-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transport-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .transport-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .transport-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .transport-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .transport-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .transport-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .transport-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .transport-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .transport-lineage-stage { opacity: 1; }

    .transport-lineage-s0 { animation-delay: 0.00s; }
    .transport-lineage-e0 { animation-delay: 0.00s; }
    .transport-lineage-s1 { animation-delay: 1.28s; }
    .transport-lineage-e1 { animation-delay: 1.28s; }
    .transport-lineage-s2 { animation-delay: 2.56s; }
    .transport-lineage-e2 { animation-delay: 2.56s; }
    .transport-lineage-s3 { animation-delay: 3.84s; }
    .transport-lineage-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .transport-lineage-conn  { animation: transport-lineage-trace 6.4s ease-in-out infinite; }
      .transport-lineage-stage { animation: transport-lineage-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes transport-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes transport-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .transport-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .transport-lineage-stage { animation: transport-lineage-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes transport-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="transport-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="transport-lineage-bg" width="980" height="322"/>
  <text class="transport-lineage-h1"  x="30" y="40">Four stages of transport</text>
  <text class="transport-lineage-sub" x="30" y="64">Polling, sockets, SSE, middleware.</text>
  <g class="transport-lineage-stage transport-lineage-s0">
    <rect class="transport-lineage-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="transport-lineage-step" x="44" y="142">01</text>
    <text class="transport-lineage-name" x="70" y="142">Short polling, 2000-2008</text>
    <text class="transport-lineage-desc" x="44" y="166">GET /status every two seconds.</text>
    <text class="transport-lineage-desc" x="44" y="182">Enormous wasted bandwidth.</text>
  </g>
  <line class="transport-lineage-line transport-lineage-conn transport-lineage-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#transport-lineage-tip)"/>
  <g class="transport-lineage-stage transport-lineage-s1">
    <rect class="transport-lineage-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="transport-lineage-step" x="280" y="142">02</text>
    <text class="transport-lineage-name" x="306" y="142">WebSockets, 2011-2020</text>
    <text class="transport-lineage-desc" x="280" y="166">Bidirectional, stateful, and</text>
    <text class="transport-lineage-desc" x="280" y="182">awkward through proxies and</text>
    <text class="transport-lineage-desc" x="280" y="198">firewalls.</text>
  </g>
  <line class="transport-lineage-line transport-lineage-conn transport-lineage-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#transport-lineage-tip)"/>
  <g class="transport-lineage-stage transport-lineage-s2">
    <rect class="transport-lineage-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="transport-lineage-step" x="516" y="142">03</text>
    <text class="transport-lineage-name" x="542" y="142">SSE, 2015</text>
    <text class="transport-lineage-desc" x="516" y="166">Unidirectional text over</text>
    <text class="transport-lineage-desc" x="516" y="182">ordinary HTTP. The right shape</text>
    <text class="transport-lineage-desc" x="516" y="198">for token streams.</text>
  </g>
  <line class="transport-lineage-line transport-lineage-conn transport-lineage-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#transport-lineage-tip)"/>
  <g class="transport-lineage-stage transport-lineage-s3">
    <rect class="transport-lineage-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="transport-lineage-step" x="752" y="142">04</text>
    <text class="transport-lineage-name" x="778" y="142">Resilience middleware, 2023</text>
    <text class="transport-lineage-desc" x="752" y="166">Breakers, limiters and</text>
    <text class="transport-lineage-desc" x="752" y="182">idempotency built into the</text>
    <text class="transport-lineage-desc" x="752" y="198">application server.</text>
  </g>
  <text class="transport-lineage-sub" x="30" y="304">SSE won for generative AI because the traffic is one-directional: the server has a lot to say and the client has nothing to add mid-generation, which is exactly what SSE was designed for.</text>
</svg>
