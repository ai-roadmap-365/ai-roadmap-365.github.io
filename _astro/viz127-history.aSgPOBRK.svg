<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward perceptual grounding.">
  <title>Four steps in statistical graphics</title>
  <style>
    .viz127-history-bg   { fill: #f8fafc; }
    .viz127-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz127-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz127-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz127-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz127-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz127-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .viz127-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .viz127-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .viz127-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .viz127-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .viz127-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .viz127-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .viz127-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .viz127-history-stage { opacity: 1; }

    .viz127-history-s0 { animation-delay: 0.00s; }
    .viz127-history-e0 { animation-delay: 0.00s; }
    .viz127-history-s1 { animation-delay: 1.28s; }
    .viz127-history-e1 { animation-delay: 1.28s; }
    .viz127-history-s2 { animation-delay: 2.56s; }
    .viz127-history-e2 { animation-delay: 2.56s; }
    .viz127-history-s3 { animation-delay: 3.84s; }
    .viz127-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .viz127-history-conn  { animation: viz127-history-trace 6.4s ease-in-out infinite; }
      .viz127-history-stage { animation: viz127-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes viz127-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes viz127-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .viz127-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .viz127-history-stage { animation: viz127-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes viz127-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="viz127-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="viz127-history-bg" width="980" height="322"/>
  <text class="viz127-history-h1"  x="30" y="40">Four steps in statistical graphics</text>
  <text class="viz127-history-sub" x="30" y="64">Toward perceptual grounding.</text>
  <g class="viz127-history-stage viz127-history-s0">
    <rect class="viz127-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="viz127-history-step" x="44" y="142">01</text>
    <text class="viz127-history-name" x="70" y="142">The first bar, line and pie charts</text>
    <text class="viz127-history-desc" x="44" y="166">Invented to make numbers</text>
    <text class="viz127-history-desc" x="44" y="182">arguable.</text>
  </g>
  <line class="viz127-history-line viz127-history-conn viz127-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#viz127-history-tip)"/>
  <g class="viz127-history-stage viz127-history-s1">
    <rect class="viz127-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="viz127-history-step" x="280" y="142">02</text>
    <text class="viz127-history-name" x="306" y="142">Then a rich period of hand-drawn statistical maps</text>
    <text class="viz127-history-desc" x="280" y="166">Some never bettered.</text>
  </g>
  <line class="viz127-history-line viz127-history-conn viz127-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#viz127-history-tip)"/>
  <g class="viz127-history-stage viz127-history-s2">
    <rect class="viz127-history-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="viz127-history-step" x="516" y="142">03</text>
    <text class="viz127-history-name" x="542" y="142">Then experiments on how encodings are perceived</text>
    <text class="viz127-history-desc" x="516" y="166">Which made design</text>
    <text class="viz127-history-desc" x="516" y="182">evidence-based.</text>
  </g>
  <line class="viz127-history-line viz127-history-conn viz127-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#viz127-history-tip)"/>
  <g class="viz127-history-stage viz127-history-s3">
    <rect class="viz127-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="viz127-history-step" x="752" y="142">04</text>
    <text class="viz127-history-name" x="778" y="142">And grammars of graphics, composing charts from parts</text>
    <text class="viz127-history-desc" x="752" y="166">Which is how modern libraries</text>
    <text class="viz127-history-desc" x="752" y="182">work.</text>
  </g>
  <text class="viz127-history-sub" x="30" y="304">The grammar-based approach is why modern plotting libraries feel composable: a chart is a mapping from variables to encodings rather than a named chart type.</text>
</svg>
