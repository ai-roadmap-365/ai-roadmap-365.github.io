<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when it does not.">
  <title>When machine learning fits</title>
  <style>
    .ml-when-bg   { fill: #f8fafc; }
    .ml-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ml-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ml-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ml-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ml-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ml-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ml-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ml-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ml-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ml-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ml-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ml-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ml-when-row { opacity: 1; }
    .ml-when-r0 { animation-delay: 0.00s; }
    .ml-when-r1 { animation-delay: 0.45s; }
    .ml-when-r2 { animation-delay: 0.90s; }
    .ml-when-r3 { animation-delay: 1.35s; }
    .ml-when-r4 { animation-delay: 1.80s; }
    .ml-when-row { animation: ml-when-reveal 7.3s ease-in-out infinite; }
    @keyframes ml-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="ml-when-bg" width="980" height="390"/>
  <text class="ml-when-h1"  x="30" y="40">When machine learning fits</text>
  <text class="ml-when-sub" x="30" y="64">And when it does not.</text>
  <rect class="ml-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="ml-when-name" x="46" y="122">Use it</text>
  <text class="ml-when-desc" x="46" y="142">Four signals.</text>
  <text class="ml-when-desc ml-when-row ml-when-r0" x="46" y="182">The pattern is real but cannot be stated</text>
  <text class="ml-when-desc ml-when-row ml-when-r1" x="46" y="216">Labelled examples exist in useful numbers</text>
  <text class="ml-when-desc ml-when-row ml-when-r2" x="46" y="250">Approximate answers are acceptable</text>
  <text class="ml-when-desc ml-when-row ml-when-r3" x="46" y="284">The pattern is stable enough to relearn</text>
  <text class="ml-when-desc ml-when-row ml-when-r4" x="46" y="318">And a wrong answer is recoverable</text>
  <rect class="ml-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="ml-when-name" x="526" y="122">Do not</text>
  <text class="ml-when-desc" x="526" y="142">Also four.</text>
  <text class="ml-when-desc ml-when-row ml-when-r0" x="526" y="182">The rule is known — write it</text>
  <text class="ml-when-desc ml-when-row ml-when-r1" x="526" y="216">Too few examples to learn from</text>
  <text class="ml-when-desc ml-when-row ml-when-r2" x="526" y="250">Exact answers are required</text>
  <text class="ml-when-desc ml-when-row ml-when-r3" x="526" y="284">No baseline has been measured</text>
  <text class="ml-when-desc ml-when-row ml-when-r4" x="526" y="318">Where silent failure is unacceptable</text>
  <text class="ml-when-sub" x="30" y="372">The fourth row of the second column is a precondition rather than a case: without a baseline there is no way to know whether the model helped.</text>
</svg>
