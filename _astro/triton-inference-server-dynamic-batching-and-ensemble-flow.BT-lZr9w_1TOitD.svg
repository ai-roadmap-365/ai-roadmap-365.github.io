<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Triton Inference Server Dynamic Batching and Ensemble Flow">
  <title>Triton Inference Server Dynamic Batching and Ensemble Flow</title>
  <defs>
    <style>
      .d338b-bg { fill: #f8fafc; }
      .d338b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d338b-dyn { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d338b-ens { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d338b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d338b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d338b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d338b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d338b-bg" />
  
  <text x="40" y="40" class="d338a-title">Triton Dynamic Batching &amp; Ensemble Architecture</text>
  <text x="40" y="65" class="d338a-subtitle">Triton Inference Server Dynamic Batching and Ensemble Flow showing Dynamic Batch Scheduler aggregating incoming requests into unified batch tensors and passing them through Tokenizer, Model, and Postprocessing Ensembles</text>
  
  <!-- Dynamic Batching -->
  <rect x="40" y="110" width="390" height="270" class="d338b-dyn" />
  <text x="60" y="145" class="d338b-header" fill="#1d4ed8">Dynamic Batch Scheduler</text>
  <text x="60" y="180" class="d338b-text">• **max_queue_delay_microseconds:** 5,000 (5ms)</text>
  <text x="60" y="205" class="d338b-text">• **max_batch_size:** 64</text>
  <text x="60" y="230" class="d338b-text">• Aggregates 14 distinct HTTP requests in 5ms</text>
  <text x="60" y="255" class="d338b-text">• Converts 14 scalar calls into 1 GPU matrix multiply</text>
  <text x="60" y="280" class="d338b-text">• 6x Higher Throughput at 4ms Latency Cost</text>
  <text x="60" y="320" class="d338b-text" font-weight="600" fill="#1d4ed8">GPU Compute Saturation</text>
  
  <!-- Ensemble Pipeline -->
  <rect x="470" y="110" width="390" height="270" class="d338b-ens" />
  <text x="490" y="145" class="d338b-header" fill="#15803d">In-Memory Ensemble Pipeline</text>
  <text x="490" y="180" class="d338b-text">• **Stage 1 (C++ Tokenizer):** String ➔ Token IDs</text>
  <text x="490" y="205" class="d338b-text">• **Stage 2 (TensorRT Model):** Transformer Forward</text>
  <text x="490" y="230" class="d338b-text">• **Stage 3 (Softmax / Top-K):** Logits ➔ Probabilities</text>
  <text x="490" y="255" class="d338b-text">• **Zero Inter-Process Copying:** Shared GPU VRAM</text>
  <text x="490" y="280" class="d338b-text">• Returns finalized JSON response to client</text>
  <text x="490" y="320" class="d338b-text" font-weight="600" fill="#15803d">Sub-10ms End-to-End Pipeline</text>
</svg>