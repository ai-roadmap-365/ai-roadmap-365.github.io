<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Ask for structure; do not pattern-match prose.">
  <title>Parsing model output</title>
  <style>
    .model-output-parsing-bg   { fill: #f8fafc; }
    .model-output-parsing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-output-parsing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-output-parsing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-output-parsing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-output-parsing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .model-output-parsing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .model-output-parsing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .model-output-parsing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .model-output-parsing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .model-output-parsing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .model-output-parsing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .model-output-parsing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .model-output-parsing-row { opacity: 1; }
    .model-output-parsing-r0 { animation-delay: 0.00s; }
    .model-output-parsing-r1 { animation-delay: 0.45s; }
    .model-output-parsing-r2 { animation-delay: 0.90s; }
    .model-output-parsing-r3 { animation-delay: 1.35s; }
    .model-output-parsing-r4 { animation-delay: 1.80s; }
    .model-output-parsing-row { animation: model-output-parsing-reveal 7.3s ease-in-out infinite; }
    @keyframes model-output-parsing-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="model-output-parsing-bg" width="980" height="390"/>
  <text class="model-output-parsing-h1"  x="30" y="40">Parsing model output</text>
  <text class="model-output-parsing-sub" x="30" y="64">Ask for structure; do not pattern-match prose.</text>
  <rect class="model-output-parsing-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="model-output-parsing-name" x="46" y="122">Regex on prose</text>
  <text class="model-output-parsing-desc" x="46" y="142">Fragile in a specific way.</text>
  <text class="model-output-parsing-desc model-output-parsing-row model-output-parsing-r0" x="46" y="182">Works on the outputs you tested</text>
  <text class="model-output-parsing-desc model-output-parsing-row model-output-parsing-r1" x="46" y="216">Breaks when the phrasing shifts slightly</text>
  <text class="model-output-parsing-desc model-output-parsing-row model-output-parsing-r2" x="46" y="250">Silently extracts the wrong thing</text>
  <text class="model-output-parsing-desc model-output-parsing-row model-output-parsing-r3" x="46" y="284">No way to tell a miss from a bad value</text>
  <text class="model-output-parsing-desc model-output-parsing-row model-output-parsing-r4" x="46" y="318">And prose phrasing is not stable</text>
  <rect class="model-output-parsing-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="model-output-parsing-name" x="526" y="122">Structured output</text>
  <text class="model-output-parsing-desc" x="526" y="142">Day 24's argument, applied.</text>
  <text class="model-output-parsing-desc model-output-parsing-row model-output-parsing-r0" x="526" y="182">Ask for JSON, with a schema</text>
  <text class="model-output-parsing-desc model-output-parsing-row model-output-parsing-r1" x="526" y="216">Parse it, catching the error</text>
  <text class="model-output-parsing-desc model-output-parsing-row model-output-parsing-r2" x="526" y="250">Validate against the schema</text>
  <text class="model-output-parsing-desc model-output-parsing-row model-output-parsing-r3" x="526" y="284">A miss is an exception, not a wrong value</text>
  <text class="model-output-parsing-desc model-output-parsing-row model-output-parsing-r4" x="526" y="318">One regex left: stripping the code fence</text>
  <text class="model-output-parsing-sub" x="30" y="372">That last line is the honest exception. Stripping a markdown fence from a response is the one regex you will write most often in AI work, and it is the right tool for it.</text>
</svg>
