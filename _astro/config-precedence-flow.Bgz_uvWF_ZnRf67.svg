<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="d097f-title d097f-desc">
  <title id="d097f-title">One setting resolved through four layers, each overriding the last, with the provenance printed at the end</title>
  <desc id="d097f-desc">An animated flow diagram in four stages, readable in full as a still image. One setting, batch_size, is given a different value in every layer. Stage one is the default written in the code, 32, which is what everybody gets. Stage two is the config file, where config.toml says 64, which is what this deployment gets. Stage three is the environment, where APP_BATCH_SIZE is 128, which is what this process gets. Stage four is the command line, where the flag reads dash dash batch dash size 256, which is what this invocation gets, typed by a person looking at the problem right now. Each stage carries the value it supplies and the provenance string the resolver records: default, then file colon config.toml, then env colon APP_BATCH_SIZE, then flag colon dash dash batch dash size. A blue token travels left to right along a marching-dash wire, and each stage lights up as the token reaches it. A green result panel at the right prints the answer: batch_size is 256, and it came from the flag. A panel across the foot states the rule that decides the ordering, namely that each layer is more specific than the one below it, and lists the two things this design buys, which are a five-second answer to why is it doing that and a startup validator whose messages name the layer to go and edit. A prefers-reduced-motion block stops every animation and restores the resting state, in which all four stages are shaded, the wire is a solid arrow, every value and provenance string is written out and the token sits at the first stage.</desc>

  <style>
    .d097f-bg    { fill: #f8fafc; }
    .d097f-h1    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 600; fill: #1a202c; }
    .d097f-sub   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d097f-name  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 600; fill: #1a202c; }
    .d097f-val   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 30px; font-weight: 600; fill: #1d4ed8; }
    .d097f-prov  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #1d4ed8; }
    .d097f-note  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d097f-good  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #047857; }
    .d097f-gval  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 30px; font-weight: 600; fill: #047857; }
    .d097f-panel { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d097f-result { fill: #ecfdf5; stroke: #047857; stroke-width: 2.5; }

    /* Stages light up in order. The resting fill is the readable state. */
    .d097f-stage { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5;
                   animation: d097f-lift 8s ease-in-out infinite; }
    .d097f-s1 { animation-delay: 0.4s; }
    .d097f-s2 { animation-delay: 2.0s; }
    .d097f-s3 { animation-delay: 3.6s; }
    .d097f-s4 { animation-delay: 5.2s; }
    @keyframes d097f-lift {
      0%, 16%, 100% { fill: #e0e7ff; }
      5%, 11%       { fill: #bfdbfe; }
    }

    /* The wire flows. Reduced motion turns it into a plain solid arrow. */
    .d097f-wire { fill: none; stroke: #1d4ed8; stroke-width: 2.5;
                  stroke-dasharray: 10 8; animation: d097f-march 1.6s linear infinite; }
    @keyframes d097f-march { to { stroke-dashoffset: -18; } }

    /* The token travels the four stages, resting visible at the first. */
    .d097f-token { fill: #1d4ed8; animation: d097f-travel 8s ease-in-out infinite; }
    @keyframes d097f-travel {
      0%   { transform: translateX(0);    opacity: 1; }
      6%   { transform: translateX(0);    opacity: 1; }
      27%  { transform: translateX(270px); opacity: 1; }
      48%  { transform: translateX(540px); opacity: 1; }
      70%  { transform: translateX(810px); opacity: 1; }
      100% { transform: translateX(810px); opacity: 1; }
    }

    /* The answer is emphasised once the token has arrived. */
    .d097f-answer { animation: d097f-reveal 8s ease-in-out infinite; }
    @keyframes d097f-reveal {
      0%, 68%   { opacity: 0.85; }
      76%, 100% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d097f-stage  { animation: none; fill: #e0e7ff; }
      .d097f-wire   { animation: none; stroke-dasharray: none; }
      .d097f-token  { animation: none; transform: none; opacity: 1; }
      .d097f-answer { animation: none; opacity: 1; }
    }
  </style>

  <defs>
    <marker id="d097f-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
  </defs>

  <rect class="d097f-bg" x="0" y="0" width="1200" height="620" />

  <text class="d097f-h1"  x="32" y="38">One setting, four layers, four different values — and the answer knows where it came from</text>
  <text class="d097f-sub" x="32" y="62">Lowest precedence on the left. Each layer that has a value overwrites the one before it AND records its own name as the provenance.</text>

  <!-- the wire the token runs along -->
  <path class="d097f-wire" d="M 120 300 L 1010 300" marker-end="url(#d097f-arrow)" />

  <!-- stage 1: the default -->
  <rect class="d097f-stage d097f-s1" x="40" y="96" width="230" height="176" rx="10" />
  <text class="d097f-name" x="58" y="124">1 · default</text>
  <text class="d097f-note" x="58" y="146">written in the code</text>
  <text class="d097f-val"  x="58" y="190">32</text>
  <text class="d097f-note" x="58" y="216">batch_size = 32</text>
  <text class="d097f-prov" x="58" y="242">source: default</text>
  <text class="d097f-note" x="58" y="262">what everybody gets</text>

  <!-- stage 2: the file -->
  <rect class="d097f-stage d097f-s2" x="310" y="96" width="230" height="176" rx="10" />
  <text class="d097f-name" x="328" y="124">2 · config file</text>
  <text class="d097f-note" x="328" y="146">read with tomllib</text>
  <text class="d097f-val"  x="328" y="190">64</text>
  <text class="d097f-note" x="328" y="216">batch_size = 64</text>
  <text class="d097f-prov" x="328" y="242">source: file:config.toml</text>
  <text class="d097f-note" x="328" y="262">what this deployment gets</text>

  <!-- stage 3: the environment -->
  <rect class="d097f-stage d097f-s3" x="580" y="96" width="230" height="176" rx="10" />
  <text class="d097f-name" x="598" y="124">3 · environment</text>
  <text class="d097f-note" x="598" y="146">arrives as TEXT</text>
  <text class="d097f-val"  x="598" y="190">128</text>
  <text class="d097f-note" x="598" y="216">APP_BATCH_SIZE="128"</text>
  <text class="d097f-prov" x="598" y="242">source: env:APP_BATCH_SIZE</text>
  <text class="d097f-note" x="598" y="262">what this process gets</text>

  <!-- stage 4: the flag -->
  <rect class="d097f-stage d097f-s4" x="850" y="96" width="230" height="176" rx="10" />
  <text class="d097f-name" x="868" y="124">4 · command line</text>
  <text class="d097f-note" x="868" y="146">argparse, no defaults</text>
  <text class="d097f-val"  x="868" y="190">256</text>
  <text class="d097f-note" x="868" y="216">--batch-size 256</text>
  <text class="d097f-prov" x="868" y="242">source: flag:--batch-size</text>
  <text class="d097f-note" x="868" y="262">what THIS invocation gets</text>

  <!-- the travelling token -->
  <circle class="d097f-token" cx="155" cy="300" r="10" />

  <!-- the answer -->
  <g class="d097f-answer">
    <rect class="d097f-result" x="40" y="330" width="1040" height="96" rx="10" />
    <text class="d097f-name" x="60" y="358">The resolved answer, and the third column is the whole point</text>
    <text class="d097f-gval" x="60" y="400">256</text>
    <text class="d097f-good" x="140" y="400">batch_size = 256, from flag:--batch-size</text>
    <text class="d097f-note" x="560" y="392">Without provenance, "why is batch_size 256?" means reading a TOML file, a</text>
    <text class="d097f-note" x="560" y="412">deployment manifest, a shell wrapper and an argparse definition, in the dark.</text>
  </g>

  <!-- foot panel -->
  <rect class="d097f-panel" x="40" y="444" width="1040" height="146" rx="10" />
  <text class="d097f-name" x="60" y="470">Why this ordering, and what it buys</text>
  <text class="d097f-note" x="60" y="494">Each layer is MORE SPECIFIC than the one below it. A default is what everybody gets; a file is what this deployment gets; a variable is what this</text>
  <text class="d097f-note" x="60" y="514">process gets; a flag is what this invocation gets, typed by a person looking at the problem right now. The more specific statement wins.</text>
  <text class="d097f-note" x="60" y="540">Two things follow. Printing the table answers "why is it doing that?" in five seconds. And a startup validator can say "batch_size: 0 is below the</text>
  <text class="d097f-note" x="60" y="560">minimum of 1 (from flag:--batch-size)" — which names not just the fault but the one of four places to go and fix it.</text>
  <text class="d097f-note" x="60" y="582">One setting is missing from this picture on purpose: the API key. It has no flag, because a secret on a command line is in `ps` and in shell history.</text>
</svg>
