<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four methods, one convention.">
  <title>The estimator contract</title>
  <style>
    .estimator-contract-bg   { fill: #f8fafc; }
    .estimator-contract-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .estimator-contract-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .estimator-contract-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .estimator-contract-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .estimator-contract-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .estimator-contract-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .estimator-contract-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .estimator-contract-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .estimator-contract-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .estimator-contract-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .estimator-contract-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .estimator-contract-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .estimator-contract-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .estimator-contract-stage { opacity: 1; }

    .estimator-contract-s0 { animation-delay: 0.00s; }
    .estimator-contract-e0 { animation-delay: 0.00s; }
    .estimator-contract-s1 { animation-delay: 1.28s; }
    .estimator-contract-e1 { animation-delay: 1.28s; }
    .estimator-contract-s2 { animation-delay: 2.56s; }
    .estimator-contract-e2 { animation-delay: 2.56s; }
    .estimator-contract-s3 { animation-delay: 3.84s; }
    .estimator-contract-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .estimator-contract-conn  { animation: estimator-contract-trace 6.4s ease-in-out infinite; }
      .estimator-contract-stage { animation: estimator-contract-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes estimator-contract-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes estimator-contract-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .estimator-contract-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .estimator-contract-stage { animation: estimator-contract-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes estimator-contract-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="estimator-contract-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="estimator-contract-bg" width="980" height="322"/>
  <text class="estimator-contract-h1"  x="30" y="40">The estimator contract</text>
  <text class="estimator-contract-sub" x="30" y="64">Four methods, one convention.</text>
  <g class="estimator-contract-stage estimator-contract-s0">
    <rect class="estimator-contract-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="estimator-contract-step" x="44" y="142">01</text>
    <text class="estimator-contract-name" x="70" y="142">Construction stores parameters, computes nothing</text>
    <text class="estimator-contract-desc" x="44" y="166">Which is why an unfitted</text>
    <text class="estimator-contract-desc" x="44" y="182">estimator is cheap.</text>
  </g>
  <line class="estimator-contract-line estimator-contract-conn estimator-contract-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#estimator-contract-tip)"/>
  <g class="estimator-contract-stage estimator-contract-s1">
    <rect class="estimator-contract-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="estimator-contract-step" x="280" y="142">02</text>
    <text class="estimator-contract-name" x="306" y="142">Fitting learns from data and stores state</text>
    <text class="estimator-contract-desc" x="280" y="166">Marked with a trailing</text>
    <text class="estimator-contract-desc" x="280" y="182">underscore, by convention.</text>
  </g>
  <line class="estimator-contract-line estimator-contract-conn estimator-contract-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#estimator-contract-tip)"/>
  <g class="estimator-contract-stage estimator-contract-s2">
    <rect class="estimator-contract-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="estimator-contract-step" x="516" y="142">03</text>
    <text class="estimator-contract-name" x="542" y="142">Predicting applies that state to new inputs</text>
    <text class="estimator-contract-desc" x="516" y="166">And learns nothing further.</text>
  </g>
  <line class="estimator-contract-line estimator-contract-conn estimator-contract-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#estimator-contract-tip)"/>
  <g class="estimator-contract-stage estimator-contract-s3">
    <rect class="estimator-contract-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="estimator-contract-step" x="752" y="142">04</text>
    <text class="estimator-contract-name" x="778" y="142">Configuration is separate from learned state</text>
    <text class="estimator-contract-desc" x="752" y="166">Which is what makes cloning and</text>
    <text class="estimator-contract-desc" x="752" y="182">tuning possible.</text>
    <text class="estimator-contract-edge" x="752" y="242">the whole API</text>
  </g>
  <text class="estimator-contract-sub" x="30" y="304">Keeping configuration separate from learned state is what allows a search to clone an estimator hundreds of times, and it is why the convention is enforced so strictly.</text>
</svg>
