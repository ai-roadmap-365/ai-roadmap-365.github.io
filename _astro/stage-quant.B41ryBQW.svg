<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Quantising for serving</title>
  <style>
    .stage-quant-bg   { fill: #f8fafc; }
    .stage-quant-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-quant-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-quant-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-quant-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-quant-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage-quant-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stage-quant-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stage-quant-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stage-quant-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stage-quant-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stage-quant-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stage-quant-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .stage-quant-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .stage-quant-stage { opacity: 1; }

    .stage-quant-s0 { animation-delay: 0.00s; }
    .stage-quant-e0 { animation-delay: 0.00s; }
    .stage-quant-s1 { animation-delay: 1.28s; }
    .stage-quant-e1 { animation-delay: 1.28s; }
    .stage-quant-s2 { animation-delay: 2.56s; }
    .stage-quant-e2 { animation-delay: 2.56s; }
    .stage-quant-s3 { animation-delay: 3.84s; }
    .stage-quant-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .stage-quant-conn  { animation: stage-quant-trace 6.4s ease-in-out infinite; }
      .stage-quant-stage { animation: stage-quant-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes stage-quant-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes stage-quant-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .stage-quant-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .stage-quant-stage { animation: stage-quant-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes stage-quant-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="stage-quant-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="stage-quant-bg" width="980" height="322"/>
  <text class="stage-quant-h1"  x="30" y="40">Quantising for serving</text>
  <text class="stage-quant-sub" x="30" y="64">Four steps.</text>
  <g class="stage-quant-stage stage-quant-s0">
    <rect class="stage-quant-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="stage-quant-step" x="44" y="142">01</text>
    <text class="stage-quant-name" x="70" y="142">Convert the merged model to the serving format</text>
    <text class="stage-quant-desc" x="44" y="166">Self-describing, with tokeniser</text>
    <text class="stage-quant-desc" x="44" y="182">and template included.</text>
  </g>
  <line class="stage-quant-line stage-quant-conn stage-quant-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#stage-quant-tip)"/>
  <g class="stage-quant-stage stage-quant-s1">
    <rect class="stage-quant-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="stage-quant-step" x="280" y="142">02</text>
    <text class="stage-quant-name" x="306" y="142">Choose a quantisation level</text>
    <text class="stage-quant-desc" x="280" y="166">Four or five bits for most</text>
    <text class="stage-quant-desc" x="280" y="182">deployments.</text>
  </g>
  <line class="stage-quant-line stage-quant-conn stage-quant-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#stage-quant-tip)"/>
  <g class="stage-quant-stage stage-quant-s2">
    <rect class="stage-quant-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="stage-quant-step" x="516" y="142">03</text>
    <text class="stage-quant-name" x="542" y="142">Producing a file of a few gigabytes</text>
    <text class="stage-quant-desc" x="516" y="166">From tens of gigabytes of</text>
    <text class="stage-quant-desc" x="516" y="182">weights.</text>
    <text class="stage-quant-edge" x="516" y="242">3-4x</text>
  </g>
  <line class="stage-quant-line stage-quant-conn stage-quant-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#stage-quant-tip)"/>
  <g class="stage-quant-stage stage-quant-s3">
    <rect class="stage-quant-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="stage-quant-step" x="752" y="142">04</text>
    <text class="stage-quant-name" x="778" y="142">Then re-evaluate</text>
    <text class="stage-quant-desc" x="752" y="166">Because quantisation changes</text>
    <text class="stage-quant-desc" x="752" y="182">behaviour, sometimes materially.</text>
  </g>
  <text class="stage-quant-sub" x="30" y="304">Re-evaluating after quantisation is the step most likely to be skipped, and it is the one that catches a model that was fine until it was compressed.</text>
</svg>
