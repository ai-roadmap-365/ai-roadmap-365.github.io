<svg viewBox="0 0 1150 620" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="d111f-title d111f-desc" width="1150" height="620">
  <title id="d111f-title">Three gradient-descent runs from the same start on the same bowl, differing only in learning rate: too small crawls, well chosen arrives in one step, too large walks up the walls and leaves the frame</title>
  <desc id="d111f-desc">Three side-by-side panels, each a parabolic loss bowl starting at x equals 1. With eta equals 0.10 the point creeps inward through 0.5, 0.25 and 0.125, still far from the minimum. With eta equals 0.20, exactly 1 over a, the point lands on the minimum at x equals 0 in a single step. With eta equals 0.45 the point overshoots to negative 1.25, then 1.5625, then negative 1.953125, then 2.44140625, then negative 3.0517578125, climbing higher up the walls of the bowl each time and exiting the frame on the next step at positive 3.81. A moving token traces each path when animation is enabled; every point, value and arrow is already drawn in the resting frame.</desc>

  <style>
    .d111f-bg      { fill: #f8fafc; }
    .d111f-panel   { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .d111f-text    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a202c; }
    .d111f-mono    { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #1a202c; }
    .d111f-heading { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a202c; font-weight: 700; }
    .d111f-sub     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
    .d111f-bowl    { fill: none; stroke: #94a3b8; stroke-width: 2; }
    .d111f-min     { fill: #16a34a; }
    .d111f-dot     { fill: #1a202c; }
    .d111f-path    { fill: none; stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 5 5; }
    .d111f-exit    { fill: none; stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 4 4; }

    /* the travelling token: one keyframe set per panel, all sharing an 8s
       cycle so the three runs stay in step with each other */
    .d111f-token   { animation-duration: 8s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
    .d111f-tokenA  { fill: #1d4ed8; animation-name: d111f-runA; }
    .d111f-tokenB  { fill: #16a34a; animation-name: d111f-runB; }
    .d111f-tokenC  { fill: #dc2626; animation-name: d111f-runC; }

    @keyframes d111f-runA {
      0%   { transform: translate(0px,0px);    opacity: 1; }
      5%   { transform: translate(0px,0px);    opacity: 1; }
      22%  { transform: translate(-22px,14px); opacity: 1; }
      40%  { transform: translate(-22px,14px); opacity: 1; }
      55%  { transform: translate(-32px,17px); opacity: 1; }
      70%  { transform: translate(-32px,17px); opacity: 1; }
      85%  { transform: translate(-38px,18px); opacity: 1; }
      92%  { transform: translate(-38px,18px); opacity: 1; }
      96%  { transform: translate(-38px,18px); opacity: 0; }
      98%  { transform: translate(0px,0px);    opacity: 0; }
      100% { transform: translate(0px,0px);    opacity: 1; }
    }
    @keyframes d111f-runB {
      0%   { transform: translate(0px,0px);   opacity: 1; }
      10%  { transform: translate(0px,0px);   opacity: 1; }
      28%  { transform: translate(-43px,18px); opacity: 1; }
      88%  { transform: translate(-43px,18px); opacity: 1; }
      96%  { transform: translate(-43px,18px); opacity: 0; }
      98%  { transform: translate(0px,0px);    opacity: 0; }
      100% { transform: translate(0px,0px);    opacity: 1; }
    }
    @keyframes d111f-runC {
      0%   { transform: translate(0px,0px);     opacity: 1; }
      4%   { transform: translate(0px,0px);     opacity: 1; }
      16%  { transform: translate(-97px,-10px); opacity: 1; }
      28%  { transform: translate(-97px,-10px); opacity: 1; }
      38%  { transform: translate(24px,-26px);  opacity: 1; }
      48%  { transform: translate(24px,-26px);  opacity: 1; }
      58%  { transform: translate(-127px,-51px); opacity: 1; }
      66%  { transform: translate(-127px,-51px); opacity: 1; }
      74%  { transform: translate(62px,-89px);  opacity: 1; }
      80%  { transform: translate(62px,-89px);  opacity: 1; }
      88%  { transform: translate(-174px,-149px); opacity: 1; }
      92%  { transform: translate(-174px,-149px); opacity: 1; }
      96%  { transform: translate(-174px,-149px); opacity: 0; }
      98%  { transform: translate(0px,0px);      opacity: 0; }
      100% { transform: translate(0px,0px);      opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d111f-tokenA, .d111f-tokenB, .d111f-tokenC {
        animation: none; transform: none; opacity: 1;
      }
    }
  </style>

  <rect class="d111f-bg" x="0" y="0" width="1150" height="620"/>

  <text class="d111f-heading" x="30" y="34" font-size="20">Same start, same bowl, three learning rates</text>
  <text class="d111f-sub" x="30" y="56" font-size="14">x0 = 1, f(x) = 0.5 · 5 · x² (a = 5, so 1/a = 0.2, 2/a = 0.4). Only η changes.</text>

  <defs>
    <marker id="d111f-arrow-exit" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- ============================= PANEL A: too small ============================= -->
  <g>
    <rect class="d111f-panel" x="30" y="80" width="340" height="470"/>
    <text class="d111f-heading" x="50" y="110" font-size="15">TOO SMALL — η = 0.10</text>
    <text class="d111f-sub" x="50" y="128" font-size="12">0 &lt; η &lt; 1/a: monotone, but crawling</text>

    <!-- bowl curve, sampled -->
    <path class="d111f-bowl" d="M 60 220 Q 200 235 200 400 Q 200 235 340 220"/>
    <circle class="d111f-min" cx="200" cy="400" r="5"/>
    <text class="d111f-sub" x="208" y="404" font-size="11">minimum</text>

    <!-- dashed path through the four steps -->
    <path class="d111f-path" d="M 243 382 L 221 396 L 211 399 L 205 400"/>

    <circle class="d111f-dot" cx="243" cy="382" r="6"/>
    <circle class="d111f-dot" cx="221" cy="396" r="6"/>
    <circle class="d111f-dot" cx="211" cy="399" r="6"/>
    <circle class="d111f-dot" cx="205" cy="400" r="6"/>
    <circle class="d111f-token d111f-tokenA" cx="243" cy="382" r="8"/>

    <text class="d111f-sub" x="50" y="460" font-size="12">step 0   x = 1.000</text>
    <text class="d111f-sub" x="50" y="478" font-size="12">step 1   x = 0.500</text>
    <text class="d111f-sub" x="50" y="496" font-size="12">step 2   x = 0.250</text>
    <text class="d111f-sub" x="50" y="514" font-size="12">step 3   x = 0.125</text>
    <text class="d111f-text" x="50" y="536" font-size="12" font-weight="700">... still far from 0 after many more steps</text>
    <text class="d111f-sub" x="50" y="558" font-size="12">correct direction, right answer eventually,</text>
    <text class="d111f-sub" x="50" y="574" font-size="12">wastes steps and compute getting there</text>
  </g>

  <!-- ============================= PANEL B: well chosen ============================= -->
  <g>
    <rect class="d111f-panel" x="390" y="80" width="340" height="470"/>
    <text class="d111f-heading" x="410" y="110" font-size="15">WELL CHOSEN — η = 0.20 = 1/a</text>
    <text class="d111f-sub" x="410" y="128" font-size="12">lands exactly on the minimum in one step</text>

    <path class="d111f-bowl" d="M 420 220 Q 560 235 560 400 Q 560 235 700 220"/>
    <circle class="d111f-min" cx="560" cy="400" r="5"/>
    <text class="d111f-sub" x="568" y="404" font-size="11">minimum</text>

    <path class="d111f-path" d="M 603 382 L 560 400"/>

    <circle class="d111f-dot" cx="603" cy="382" r="6"/>
    <circle class="d111f-dot" cx="560" cy="400" r="7" fill="#16a34a"/>
    <circle class="d111f-token d111f-tokenB" cx="603" cy="382" r="8"/>

    <text class="d111f-sub" x="410" y="460" font-size="12">step 0   x = 1.000</text>
    <text class="d111f-text" x="410" y="478" font-size="12" font-weight="700">step 1   x = 0.000 — exact</text>
    <text class="d111f-sub" x="410" y="500" font-size="12">this only happens at exactly η = 1/a.</text>
    <text class="d111f-sub" x="410" y="518" font-size="12">a coincidence of this one quadratic —</text>
    <text class="d111f-sub" x="410" y="536" font-size="12">not a general property of "well chosen".</text>
    <text class="d111f-sub" x="410" y="558" font-size="12">most well-chosen rates converge smoothly</text>
    <text class="d111f-sub" x="410" y="574" font-size="12">over several steps, not in exactly one.</text>
  </g>

  <!-- ============================= PANEL C: too large ============================= -->
  <g>
    <rect class="d111f-panel" x="750" y="80" width="340" height="470"/>
    <text class="d111f-heading" x="770" y="110" font-size="15">TOO LARGE — η = 0.45</text>
    <text class="d111f-sub" x="770" y="128" font-size="12">η &gt; 2/a: overshoots, climbs, diverges</text>

    <path class="d111f-bowl" d="M 780 150 Q 920 230 920 400 Q 920 230 1060 150"/>
    <circle class="d111f-min" cx="920" cy="400" r="5"/>
    <text class="d111f-sub" x="928" y="404" font-size="11">minimum</text>

    <path class="d111f-path" d="M 963 382 L 866 372 L 987 356 L 836 331 L 1025 293 L 789 233"/>

    <circle class="d111f-dot" cx="963" cy="382" r="6"/>
    <circle class="d111f-dot" cx="866" cy="372" r="6"/>
    <circle class="d111f-dot" cx="987" cy="356" r="6"/>
    <circle class="d111f-dot" cx="836" cy="331" r="6"/>
    <circle class="d111f-dot" cx="1025" cy="293" r="6"/>
    <circle class="d111f-dot" cx="789" cy="233" r="6" fill="#dc2626"/>
    <circle class="d111f-token d111f-tokenC" cx="963" cy="382" r="8"/>

    <!-- exit arrow: the next step would land outside this panel entirely -->
    <path class="d111f-exit" d="M 789 233 L 855 130" marker-end="url(#d111f-arrow-exit)"/>
    <text class="d111f-text" x="855" y="118" font-size="12" font-weight="700" fill="#dc2626">and beyond →</text>

    <text class="d111f-sub" x="770" y="450" font-size="11">step 0  x= 1.000   step 1  x=−1.250</text>
    <text class="d111f-sub" x="770" y="466" font-size="11">step 2  x= 1.5625  step 3  x=−1.953125</text>
    <text class="d111f-sub" x="770" y="482" font-size="11">step 4  x= 2.441406 step 5 x=−3.051758</text>
    <text class="d111f-text" x="770" y="502" font-size="11" font-weight="700" fill="#dc2626">step 6  x= 3.814697 — off this panel</text>
    <text class="d111f-sub" x="770" y="526" font-size="12">|x| grows by a factor of 1.25 EVERY step —</text>
    <text class="d111f-sub" x="770" y="544" font-size="12">continue far enough and it overflows to inf,</text>
    <text class="d111f-sub" x="770" y="560" font-size="12">then the very next update becomes nan.</text>
    <text class="d111f-sub" x="770" y="578" font-size="12">nothing in f, the gradient or the code is wrong.</text>
  </g>

  <rect x="30" y="580" width="1060" height="26" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="1"/>
  <text class="d111f-mono" x="50" y="598" font-size="13" font-weight="700" fill="#1d4ed8">contraction factor per step = (1 − η·a): 0.5 (shrinks) · 0.0 (exact) · −1.25 (grows)</text>
</svg>
