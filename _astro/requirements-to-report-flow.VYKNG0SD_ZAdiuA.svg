<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 830" width="1240" height="830" role="img" aria-labelledby="d091f-title d091f-desc">
  <title id="d091f-title">From a sentence of requirements to a row in a printed report, in six stages</title>
  <desc id="d091f-desc">An animated flow diagram in six stages, readable in full as a still image. One sentence from the library brief — that some books have more than one author and the credit order matters — is carried through the whole pipeline, and the artifact it has become is shown concretely at every stage. Stage one is the requirement in English. Stage two names the entities and the relationship it implies: BOOK and AUTHOR are entities, credited-in-order is a many-to-many relationship. Stage three is the logical schema: three tables, with the junction table keyed on the pair and carrying author_position. Stage four is the physical schema: the primary key on the pair, author_position declared NOT NULL with a check, a unique constraint on book and position, and an index on the author column because a foreign key creates none. Stage five is the query that answers the question, joining books to authors through the junction and grouping with a having clause. Stage six is one row of the printed report, reading that The C Programming Language has two authors, Brian W. Kernighan and Dennis M. Ritchie. A token travels along a marching-dash wire from stage to stage, and each stage lights up as the token reaches it. With motion disabled every stage, artifact, label and arrow is still drawn.</desc>

  <style>
    .d091f-bg    { fill: #f8fafc; }
    .d091f-h1    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 600; fill: #1a202c; }
    .d091f-sub   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d091f-snum  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #1d4ed8; }
    .d091f-sname { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 600; fill: #1a202c; }
    .d091f-art   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1a202c; }
    .d091f-em    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #1d4ed8; }
    .d091f-warn  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #b45309; }
    .d091f-note  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d091f-lbl   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #1d4ed8; }
    .d091f-box   { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d091f-out   { fill: #ffffff; stroke: #047857; stroke-width: 2; }

    /* Motion 3 — each stage lights up as the token reaches it. The resting
       fill is the readable state, so the still frame loses nothing. */
    .d091f-stage { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5;
                   animation: d091f-lift 8s ease-in-out infinite; }
    .d091f-s1 { animation-delay: 0.1s; }
    .d091f-s2 { animation-delay: 0.9s; }
    .d091f-s3 { animation-delay: 1.9s; }
    .d091f-s4 { animation-delay: 4.2s; }
    .d091f-s5 { animation-delay: 5.2s; }
    .d091f-s6 { animation-delay: 6.1s; }
    @keyframes d091f-lift {
      0%, 18%, 100% { fill: #e0e7ff; }
      5%, 13%       { fill: #bfdbfe; }
    }

    /* Motion 2 — the wire flows. Reduced motion turns it into a solid arrow. */
    .d091f-wire { fill: none; stroke: #1d4ed8; stroke-width: 2.5;
                  stroke-dasharray: 10 8; animation: d091f-march 1.6s linear infinite; }
    @keyframes d091f-march { to { stroke-dashoffset: -18; } }

    /* Motion 1 — the artifact travels the pipeline, resting visible at stage 1. */
    .d091f-token { animation: d091f-travel 8s ease-in-out infinite; }
    @keyframes d091f-travel {
      0%,   5% { transform: translate(0, 0);       opacity: 1; }
      12%, 17% { transform: translate(392px, 0);   opacity: 1; }
      24%, 29% { transform: translate(784px, 0);   opacity: 1; }
      34%      { transform: translate(990px, 0);   opacity: 1; }
      40%      { transform: translate(990px, 298px);  opacity: 1; }
      46%      { transform: translate(-194px, 298px); opacity: 1; }
      49%      { transform: translate(-194px, 320px); opacity: 1; }
      53%, 58% { transform: translate(0, 320px);   opacity: 1; }
      65%, 70% { transform: translate(392px, 320px); opacity: 1; }
      77%,100% { transform: translate(784px, 320px); opacity: 1; }
    }

    /* The finished report row is emphasised once the token has arrived. */
    .d091f-result { animation: d091f-reveal 8s ease-in-out infinite; }
    @keyframes d091f-reveal {
      0%, 74%   { opacity: 0.9; }
      80%, 100% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d091f-stage  { animation: none; fill: #e0e7ff; }
      .d091f-wire   { animation: none; stroke-dasharray: none; }
      .d091f-token  { animation: none; transform: none; opacity: 1; }
      .d091f-result { animation: none; opacity: 1; }
    }
  </style>

  <defs>
    <marker id="d091f-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
  </defs>

  <rect class="d091f-bg" x="0" y="0" width="1240" height="830" />

  <text class="d091f-h1"  x="32" y="38">One sentence of requirements, carried all the way to a row in the report</text>
  <text class="d091f-sub" x="32" y="62">Every stage shows the artifact the sentence has become. Nothing new is invented on the way — each stage is a decision made about the one before it.</text>

  <!-- the wire the artifact travels along -->
  <path class="d091f-wire" d="M 216 98 L 1176 98" marker-end="url(#d091f-arrow)" />
  <path class="d091f-wire" d="M 1176 98 L 1206 98 L 1206 396 L 22 396 L 22 418 L 200 418" marker-end="url(#d091f-arrow)" />
  <path class="d091f-wire" d="M 216 418 L 1000 418" marker-end="url(#d091f-arrow)" />

  <!-- ===================== stage 1 ===================== -->
  <rect class="d091f-stage d091f-s1" x="40" y="120" width="352" height="52" rx="8" />
  <text class="d091f-snum"  x="56" y="152">1</text>
  <text class="d091f-sname" x="80" y="152">The requirement, in English</text>
  <rect class="d091f-box" x="40" y="180" width="352" height="180" rx="8" />
  <text class="d091f-art" x="58" y="208">&#8220;Some books have more than one</text>
  <text class="d091f-art" x="58" y="229">author. The order matters &#8212; the</text>
  <text class="d091f-art" x="58" y="250">cover credits them in a particular</text>
  <text class="d091f-art" x="58" y="271">order and so should we.&#8221;</text>
  <text class="d091f-note" x="58" y="306">Written by somebody who has never</text>
  <text class="d091f-note" x="58" y="327">heard the word &#8220;schema&#8221;. Two facts</text>
  <text class="d091f-note" x="58" y="348">are hiding in it, not one.</text>

  <!-- ===================== stage 2 ===================== -->
  <rect class="d091f-stage d091f-s2" x="432" y="120" width="352" height="52" rx="8" />
  <text class="d091f-snum"  x="448" y="152">2</text>
  <text class="d091f-sname" x="472" y="152">The entities it implies</text>
  <rect class="d091f-box" x="432" y="180" width="352" height="180" rx="8" />
  <text class="d091f-em"   x="450" y="208">BOOK</text>
  <text class="d091f-art"  x="560" y="208">entity</text>
  <text class="d091f-em"   x="450" y="229">AUTHOR</text>
  <text class="d091f-art"  x="560" y="229">entity</text>
  <text class="d091f-em"   x="450" y="250">credited-in</text>
  <text class="d091f-art"  x="560" y="250">relationship</text>
  <text class="d091f-warn" x="450" y="285">many books &#8596; many authors</text>
  <text class="d091f-note" x="450" y="313">The test for an entity: does it</text>
  <text class="d091f-note" x="450" y="334">exist before, and after, the thing</text>
  <text class="d091f-note" x="450" y="355">that mentions it? An author does.</text>

  <!-- ===================== stage 3 ===================== -->
  <rect class="d091f-stage d091f-s3" x="824" y="120" width="352" height="52" rx="8" />
  <text class="d091f-snum"  x="840" y="152">3</text>
  <text class="d091f-sname" x="864" y="152">The logical schema</text>
  <rect class="d091f-box" x="824" y="180" width="352" height="180" rx="8" />
  <text class="d091f-art" x="842" y="208">books(book_id, title, ...)</text>
  <text class="d091f-art" x="842" y="229">authors(author_id, name, ...)</text>
  <text class="d091f-em"  x="842" y="250">book_authors(book_id, author_id,</text>
  <text class="d091f-em"  x="842" y="271">             author_position)</text>
  <text class="d091f-warn" x="842" y="306">the key is the PAIR</text>
  <text class="d091f-note" x="842" y="334">The order is an attribute of the</text>
  <text class="d091f-note" x="842" y="355">RELATIONSHIP, not of either side.</text>

  <text class="d091f-lbl" x="620" y="386" text-anchor="middle">the same sentence, four stages later</text>

  <!-- ===================== stage 4 ===================== -->
  <rect class="d091f-stage d091f-s4" x="40" y="440" width="352" height="52" rx="8" />
  <text class="d091f-snum"  x="56" y="472">4</text>
  <text class="d091f-sname" x="80" y="472">The physical schema</text>
  <rect class="d091f-box" x="40" y="500" width="352" height="180" rx="8" />
  <text class="d091f-em"  x="58" y="528">PRIMARY KEY (book_id, author_id)</text>
  <text class="d091f-art" x="58" y="549">author_position INTEGER NOT NULL</text>
  <text class="d091f-art" x="58" y="570">  CHECK (author_position &gt;= 1)</text>
  <text class="d091f-art" x="58" y="591">UNIQUE (book_id, author_position)</text>
  <text class="d091f-warn" x="58" y="619">CREATE INDEX idx_book_authors_author</text>
  <text class="d091f-warn" x="58" y="640">  ON book_authors(author_id);</text>
  <text class="d091f-note" x="58" y="666">a foreign key creates no index</text>

  <!-- ===================== stage 5 ===================== -->
  <rect class="d091f-stage d091f-s5" x="432" y="440" width="352" height="52" rx="8" />
  <text class="d091f-snum"  x="448" y="472">5</text>
  <text class="d091f-sname" x="472" y="472">The query that asks it back</text>
  <rect class="d091f-box" x="432" y="500" width="352" height="180" rx="8" />
  <text class="d091f-art" x="450" y="528">SELECT b.title, count(*),</text>
  <text class="d091f-art" x="450" y="549">       group_concat(a.name, ', ')</text>
  <text class="d091f-art" x="450" y="570">  FROM books b</text>
  <text class="d091f-art" x="450" y="591">  JOIN book_authors ba USING (book_id)</text>
  <text class="d091f-art" x="450" y="612">  JOIN authors a USING (author_id)</text>
  <text class="d091f-art" x="450" y="633"> GROUP BY b.book_id</text>
  <text class="d091f-em"  x="450" y="654">HAVING count(*) &gt; 1</text>
  <text class="d091f-note" x="450" y="674">two JOINs, because a junction is two</text>

  <!-- ===================== stage 6 ===================== -->
  <rect class="d091f-stage d091f-s6" x="824" y="440" width="352" height="52" rx="8" />
  <text class="d091f-snum"  x="840" y="472">6</text>
  <text class="d091f-sname" x="864" y="472">One row of the report</text>
  <rect class="d091f-box" x="824" y="500" width="352" height="180" rx="8" />
  <g class="d091f-result">
    <rect class="d091f-out" x="840" y="516" width="320" height="92" rx="6" />
    <text class="d091f-art" x="856" y="544">The C Programming Language</text>
    <text class="d091f-art" x="856" y="568">    2 authors: Brian W. Kernighan,</text>
    <text class="d091f-art" x="856" y="592">               Dennis M. Ritchie</text>
  </g>
  <text class="d091f-note" x="842" y="634">The credit order in that line is the</text>
  <text class="d091f-note" x="842" y="655">column added at stage 3, because of</text>
  <text class="d091f-note" x="842" y="676">the second half of stage 1&#8217;s sentence.</text>

  <!-- the travelling artifact -->
  <g class="d091f-token">
    <circle cx="216" cy="98" r="10" fill="#1d4ed8" />
  </g>

  <text class="d091f-note" x="32" y="722">Resting state: all six stages shaded, all three wires drawn, all six artifacts written out, and the token at stage 1.</text>
  <text class="d091f-note" x="32" y="744">With reduced motion requested the animation stops and this resting state is what you see — no label, value or artifact is carried by the movement.</text>
  <text class="d091f-note" x="32" y="766">Read it backwards to check a design: every column in stage 4 should trace to a sentence in stage 1, and every question in stage 6 should be answerable</text>
  <text class="d091f-note" x="32" y="788">from stage 4 alone. A column with no sentence behind it is speculation; a question stage 4 cannot answer is a schema that is not finished.</text>
</svg>
