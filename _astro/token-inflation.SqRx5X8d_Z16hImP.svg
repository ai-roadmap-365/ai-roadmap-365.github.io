<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="+1.2% quality, +450 tokens.">
  <title>The regression nobody measured</title>
  <style>
    .token-inflation-bg   { fill: #f8fafc; }
    .token-inflation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .token-inflation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .token-inflation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .token-inflation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .token-inflation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .token-inflation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .token-inflation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .token-inflation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .token-inflation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .token-inflation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .token-inflation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .token-inflation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .token-inflation-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .token-inflation-stage { opacity: 1; }

    .token-inflation-s0 { animation-delay: 0.00s; }
    .token-inflation-e0 { animation-delay: 0.00s; }
    .token-inflation-s1 { animation-delay: 1.28s; }
    .token-inflation-e1 { animation-delay: 1.28s; }
    .token-inflation-s2 { animation-delay: 2.56s; }
    .token-inflation-e2 { animation-delay: 2.56s; }
    .token-inflation-s3 { animation-delay: 3.84s; }
    .token-inflation-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .token-inflation-conn  { animation: token-inflation-trace 6.4s ease-in-out infinite; }
      .token-inflation-stage { animation: token-inflation-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes token-inflation-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes token-inflation-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .token-inflation-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .token-inflation-stage { animation: token-inflation-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes token-inflation-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="token-inflation-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="token-inflation-bg" width="980" height="322"/>
  <text class="token-inflation-h1"  x="30" y="40">The regression nobody measured</text>
  <text class="token-inflation-sub" x="30" y="64">+1.2% quality, +450 tokens.</text>
  <g class="token-inflation-stage token-inflation-s0">
    <rect class="token-inflation-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="token-inflation-step" x="44" y="142">01</text>
    <text class="token-inflation-name" x="70" y="142">Prompt 4.2 shipped</text>
    <text class="token-inflation-desc" x="44" y="166">Helpfulness ratings up 1.2%. The</text>
    <text class="token-inflation-desc" x="44" y="182">gate passed.</text>
  </g>
  <line class="token-inflation-line token-inflation-conn token-inflation-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#token-inflation-tip)"/>
  <g class="token-inflation-stage token-inflation-s1">
    <rect class="token-inflation-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="token-inflation-step" x="280" y="142">02</text>
    <text class="token-inflation-name" x="306" y="142">Average completion grew 450 tokens</text>
    <text class="token-inflation-desc" x="280" y="166">Nothing measured it.</text>
  </g>
  <line class="token-inflation-line token-inflation-conn token-inflation-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#token-inflation-tip)"/>
  <g class="token-inflation-stage token-inflation-s2">
    <rect class="token-inflation-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="token-inflation-step" x="516" y="142">03</text>
    <text class="token-inflation-name" x="542" y="142">$38,000 a month</text>
    <text class="token-inflation-desc" x="516" y="166">Before anyone connected the bill</text>
    <text class="token-inflation-desc" x="516" y="182">to the prompt.</text>
    <text class="token-inflation-edge" x="516" y="242">discovered late</text>
  </g>
  <line class="token-inflation-line token-inflation-conn token-inflation-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#token-inflation-tip)"/>
  <g class="token-inflation-stage token-inflation-s3">
    <rect class="token-inflation-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="token-inflation-step" x="752" y="142">04</text>
    <text class="token-inflation-name" x="778" y="142">The gate now tracks tokens</text>
    <text class="token-inflation-desc" x="752" y="166">Reject +10% tokens without +5%</text>
    <text class="token-inflation-desc" x="752" y="182">accuracy.</text>
  </g>
  <text class="token-inflation-sub" x="30" y="304">Cost belongs in the regression gate for the same reason latency belongs in a performance test: it is a dimension the change can move, and a gate that does not measure it cannot object.</text>
</svg>
