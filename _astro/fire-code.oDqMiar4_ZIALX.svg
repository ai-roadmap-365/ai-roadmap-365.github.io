<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Containment, not prevention.">
  <title>Building fire regulations</title>
  <style>
    .fire-code-bg   { fill: #f8fafc; }
    .fire-code-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fire-code-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fire-code-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fire-code-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fire-code-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fire-code-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fire-code-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fire-code-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fire-code-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fire-code-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fire-code-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fire-code-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fire-code-row { opacity: 1; }
    .fire-code-r0 { animation-delay: 0.00s; }
    .fire-code-r1 { animation-delay: 0.45s; }
    .fire-code-r2 { animation-delay: 0.90s; }
    .fire-code-r3 { animation-delay: 1.35s; }
    .fire-code-r4 { animation-delay: 1.80s; }
    .fire-code-row { animation: fire-code-reveal 7.3s ease-in-out infinite; }
    @keyframes fire-code-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="fire-code-bg" width="980" height="390"/>
  <text class="fire-code-h1"  x="30" y="40">Building fire regulations</text>
  <text class="fire-code-sub" x="30" y="64">Containment, not prevention.</text>
  <rect class="fire-code-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="fire-code-name" x="46" y="122">Preventing ignition</text>
  <text class="fire-code-desc" x="46" y="142">Not what the code is for.</text>
  <text class="fire-code-desc fire-code-row fire-code-r0" x="46" y="182">You cannot forbid every ignition source</text>
  <text class="fire-code-desc fire-code-row fire-code-r1" x="46" y="216">People, wiring, cooking, weather</text>
  <text class="fire-code-desc fire-code-row fire-code-r2" x="46" y="250">A rule against fires is not a control</text>
  <text class="fire-code-desc fire-code-row fire-code-r3" x="46" y="284">Regulations assume one will start</text>
  <text class="fire-code-desc fire-code-row fire-code-r4" x="46" y="318">And plan for what happens next</text>
  <rect class="fire-code-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="fire-code-name" x="526" y="122">Containing it</text>
  <text class="fire-code-desc" x="526" y="142">What the code enforces.</text>
  <text class="fire-code-desc fire-code-row fire-code-r0" x="526" y="182">Fire doors confine flames to one room</text>
  <text class="fire-code-desc fire-code-row fire-code-r1" x="526" y="216">Alarms detect early</text>
  <text class="fire-code-desc fire-code-row fire-code-r2" x="526" y="250">Sprinklers buy time</text>
  <text class="fire-code-desc fire-code-row fire-code-r3" x="526" y="284">The building does not collapse</text>
  <text class="fire-code-desc fire-code-row fire-code-r4" x="526" y="318">Path sandboxing and HITL do the same</text>
  <text class="fire-code-sub" x="30" y="372">The framing matters because it sets expectations correctly: injection text will enter the context window, and the question a security design answers is what it can reach once it is there.</text>
</svg>
