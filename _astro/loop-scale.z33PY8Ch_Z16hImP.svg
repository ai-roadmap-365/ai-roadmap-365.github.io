<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>Loops that scale</title>
  <style>
    .loop-scale-bg   { fill: #f8fafc; }
    .loop-scale-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-scale-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-scale-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-scale-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-scale-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-scale-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .loop-scale-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .loop-scale-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .loop-scale-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .loop-scale-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .loop-scale-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .loop-scale-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .loop-scale-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .loop-scale-stage { opacity: 1; }

    .loop-scale-s0 { animation-delay: 0.00s; }
    .loop-scale-e0 { animation-delay: 0.00s; }
    .loop-scale-s1 { animation-delay: 1.28s; }
    .loop-scale-e1 { animation-delay: 1.28s; }
    .loop-scale-s2 { animation-delay: 2.56s; }
    .loop-scale-e2 { animation-delay: 2.56s; }
    .loop-scale-s3 { animation-delay: 3.84s; }
    .loop-scale-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .loop-scale-conn  { animation: loop-scale-trace 6.4s ease-in-out infinite; }
      .loop-scale-stage { animation: loop-scale-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes loop-scale-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes loop-scale-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .loop-scale-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .loop-scale-stage { animation: loop-scale-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes loop-scale-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="loop-scale-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="loop-scale-bg" width="980" height="322"/>
  <text class="loop-scale-h1"  x="30" y="40">Loops that scale</text>
  <text class="loop-scale-sub" x="30" y="64">Four properties.</text>
  <g class="loop-scale-stage loop-scale-s0">
    <rect class="loop-scale-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="loop-scale-step" x="44" y="142">01</text>
    <text class="loop-scale-name" x="70" y="142">Stream rather than materialise</text>
    <text class="loop-scale-desc" x="44" y="166">So memory does not grow with the</text>
    <text class="loop-scale-desc" x="44" y="182">input.</text>
  </g>
  <line class="loop-scale-line loop-scale-conn loop-scale-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#loop-scale-tip)"/>
  <g class="loop-scale-stage loop-scale-s1">
    <rect class="loop-scale-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="loop-scale-step" x="280" y="142">02</text>
    <text class="loop-scale-name" x="306" y="142">Keep per-iteration state bounded</text>
    <text class="loop-scale-desc" x="280" y="166">An accumulating list defeats the</text>
    <text class="loop-scale-desc" x="280" y="182">streaming.</text>
  </g>
  <line class="loop-scale-line loop-scale-conn loop-scale-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#loop-scale-tip)"/>
  <g class="loop-scale-stage loop-scale-s2">
    <rect class="loop-scale-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="loop-scale-step" x="516" y="142">03</text>
    <text class="loop-scale-name" x="542" y="142">Checkpoint periodically on long runs</text>
    <text class="loop-scale-desc" x="516" y="166">So a failure does not restart</text>
    <text class="loop-scale-desc" x="516" y="182">from zero.</text>
  </g>
  <line class="loop-scale-line loop-scale-conn loop-scale-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#loop-scale-tip)"/>
  <g class="loop-scale-stage loop-scale-s3">
    <rect class="loop-scale-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="loop-scale-step" x="752" y="142">04</text>
    <text class="loop-scale-name" x="778" y="142">And parallelise only independent iterations</text>
    <text class="loop-scale-desc" x="752" y="166">Which most transforms are.</text>
  </g>
  <text class="loop-scale-sub" x="30" y="304">The second point is the one that catches people: streaming input into a list that grows without bound reintroduces exactly the memory problem streaming solved.</text>
</svg>
