<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Hybrid is not always worth its cost.">
  <title>When you do not need embeddings at all</title>
  <style>
    .keyword-suffices-bg   { fill: #f8fafc; }
    .keyword-suffices-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .keyword-suffices-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .keyword-suffices-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .keyword-suffices-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .keyword-suffices-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .keyword-suffices-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .keyword-suffices-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .keyword-suffices-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .keyword-suffices-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .keyword-suffices-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .keyword-suffices-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .keyword-suffices-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .keyword-suffices-row { opacity: 1; }
    .keyword-suffices-r0 { animation-delay: 0.00s; }
    .keyword-suffices-r1 { animation-delay: 0.45s; }
    .keyword-suffices-r2 { animation-delay: 0.90s; }
    .keyword-suffices-r3 { animation-delay: 1.35s; }
    .keyword-suffices-r4 { animation-delay: 1.80s; }
    .keyword-suffices-row { animation: keyword-suffices-reveal 7.3s ease-in-out infinite; }
    @keyframes keyword-suffices-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="keyword-suffices-bg" width="980" height="390"/>
  <text class="keyword-suffices-h1"  x="30" y="40">When you do not need embeddings at all</text>
  <text class="keyword-suffices-sub" x="30" y="64">Hybrid is not always worth its cost.</text>
  <rect class="keyword-suffices-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="keyword-suffices-name" x="46" y="122">Keyword alone is enough</text>
  <text class="keyword-suffices-desc" x="46" y="142">Cheaper, simpler, no re-embedding.</text>
  <text class="keyword-suffices-desc keyword-suffices-row keyword-suffices-r0" x="46" y="182">Users search by exact identifier</text>
  <text class="keyword-suffices-desc keyword-suffices-row keyword-suffices-r1" x="46" y="216">A small, well-titled corpus</text>
  <text class="keyword-suffices-desc keyword-suffices-row keyword-suffices-r2" x="46" y="250">Vocabulary is controlled and shared</text>
  <text class="keyword-suffices-desc keyword-suffices-row keyword-suffices-r3" x="46" y="284">No paraphrasing in real queries</text>
  <text class="keyword-suffices-desc keyword-suffices-row keyword-suffices-r4" x="46" y="318">No embedding cost, no vector store</text>
  <rect class="keyword-suffices-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="keyword-suffices-name" x="526" y="122">Hybrid earns its cost</text>
  <text class="keyword-suffices-desc" x="526" y="142">When phrasing varies.</text>
  <text class="keyword-suffices-desc keyword-suffices-row keyword-suffices-r0" x="526" y="182">Users ask natural questions</text>
  <text class="keyword-suffices-desc keyword-suffices-row keyword-suffices-r1" x="526" y="216">The corpus uses different words than users do</text>
  <text class="keyword-suffices-desc keyword-suffices-row keyword-suffices-r2" x="526" y="250">Synonyms and paraphrase matter</text>
  <text class="keyword-suffices-desc keyword-suffices-row keyword-suffices-r3" x="526" y="284">Recall is currently the bottleneck</text>
  <text class="keyword-suffices-desc keyword-suffices-row keyword-suffices-r4" x="526" y="318">And you can measure the improvement</text>
  <text class="keyword-suffices-sub" x="30" y="372">Build the evaluation set before the vector store. If keyword-only already answers the questions in it, the embedding infrastructure is cost and complexity buying nothing measurable.</text>
</svg>
