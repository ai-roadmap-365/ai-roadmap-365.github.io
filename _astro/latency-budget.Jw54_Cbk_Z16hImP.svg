<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A budget makes a slow component visible early.">
  <title>Allocate the latency before you spend it</title>
  <style>
    .latency-budget-bg   { fill: #f8fafc; }
    .latency-budget-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-budget-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-budget-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-budget-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-budget-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-budget-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .latency-budget-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .latency-budget-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .latency-budget-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .latency-budget-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .latency-budget-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .latency-budget-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .latency-budget-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .latency-budget-stage { opacity: 1; }

    .latency-budget-s0 { animation-delay: 0.00s; }
    .latency-budget-e0 { animation-delay: 0.00s; }
    .latency-budget-s1 { animation-delay: 1.28s; }
    .latency-budget-e1 { animation-delay: 1.28s; }
    .latency-budget-s2 { animation-delay: 2.56s; }
    .latency-budget-e2 { animation-delay: 2.56s; }
    .latency-budget-s3 { animation-delay: 3.84s; }
    .latency-budget-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .latency-budget-conn  { animation: latency-budget-trace 6.4s ease-in-out infinite; }
      .latency-budget-stage { animation: latency-budget-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes latency-budget-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes latency-budget-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .latency-budget-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .latency-budget-stage { animation: latency-budget-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes latency-budget-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="latency-budget-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="latency-budget-bg" width="980" height="322"/>
  <text class="latency-budget-h1"  x="30" y="40">Allocate the latency before you spend it</text>
  <text class="latency-budget-sub" x="30" y="64">A budget makes a slow component visible early.</text>
  <g class="latency-budget-stage latency-budget-s0">
    <rect class="latency-budget-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="latency-budget-step" x="44" y="142">01</text>
    <text class="latency-budget-name" x="70" y="142">State the target</text>
    <text class="latency-budget-desc" x="44" y="166">"First token under 1.5 seconds."</text>
    <text class="latency-budget-desc" x="44" y="182">One number, agreed up front.</text>
    <text class="latency-budget-edge" x="44" y="242">1500ms</text>
  </g>
  <line class="latency-budget-line latency-budget-conn latency-budget-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#latency-budget-tip)"/>
  <g class="latency-budget-stage latency-budget-s1">
    <rect class="latency-budget-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="latency-budget-step" x="280" y="142">02</text>
    <text class="latency-budget-name" x="306" y="142">Allocate it</text>
    <text class="latency-budget-desc" x="280" y="166">Retrieval 200ms, rerank 150ms,</text>
    <text class="latency-budget-desc" x="280" y="182">generation start 900ms, overhead</text>
    <text class="latency-budget-desc" x="280" y="198">250ms.</text>
    <text class="latency-budget-edge" x="280" y="242">allocated</text>
  </g>
  <line class="latency-budget-line latency-budget-conn latency-budget-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#latency-budget-tip)"/>
  <g class="latency-budget-stage latency-budget-s2">
    <rect class="latency-budget-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="latency-budget-step" x="516" y="142">03</text>
    <text class="latency-budget-name" x="542" y="142">Now a design can be rejected</text>
    <text class="latency-budget-desc" x="516" y="166">A reranker needing 600ms does</text>
    <text class="latency-budget-desc" x="516" y="182">not fit, and you know before</text>
    <text class="latency-budget-desc" x="516" y="198">building it.</text>
  </g>
  <line class="latency-budget-line latency-budget-conn latency-budget-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#latency-budget-tip)"/>
  <g class="latency-budget-stage latency-budget-s3">
    <rect class="latency-budget-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="latency-budget-step" x="752" y="142">04</text>
    <text class="latency-budget-name" x="778" y="142">And measured against</text>
    <text class="latency-budget-desc" x="752" y="166">Each stage has a number to hold,</text>
    <text class="latency-budget-desc" x="752" y="182">and a trace shows which one</text>
    <text class="latency-budget-desc" x="752" y="198">broke it.</text>
    <text class="latency-budget-edge" x="752" y="242">Day 40</text>
  </g>
  <text class="latency-budget-sub" x="30" y="304">Without an allocation, "it feels slow" is the only available feedback and every component's owner believes their part is not the problem. With one, the conversation is arithmetic.</text>
</svg>
