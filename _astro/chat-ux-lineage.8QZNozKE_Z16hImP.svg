<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Messaging, streaming, then canvases.">
  <title>Three eras of chat interfaces</title>
  <style>
    .chat-ux-lineage-bg   { fill: #f8fafc; }
    .chat-ux-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chat-ux-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chat-ux-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chat-ux-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chat-ux-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chat-ux-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chat-ux-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .chat-ux-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .chat-ux-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .chat-ux-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .chat-ux-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .chat-ux-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .chat-ux-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .chat-ux-lineage-stage { opacity: 1; }

    .chat-ux-lineage-s0 { animation-delay: 0.00s; }
    .chat-ux-lineage-e0 { animation-delay: 0.00s; }
    .chat-ux-lineage-s1 { animation-delay: 1.50s; }
    .chat-ux-lineage-e1 { animation-delay: 1.50s; }
    .chat-ux-lineage-s2 { animation-delay: 3.00s; }
    .chat-ux-lineage-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .chat-ux-lineage-conn  { animation: chat-ux-lineage-trace 6s ease-in-out infinite; }
      .chat-ux-lineage-stage { animation: chat-ux-lineage-arrive 6s ease-in-out infinite; }
    }
    @keyframes chat-ux-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes chat-ux-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .chat-ux-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .chat-ux-lineage-stage { animation: chat-ux-lineage-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes chat-ux-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="chat-ux-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="chat-ux-lineage-bg" width="980" height="322"/>
  <text class="chat-ux-lineage-h1"  x="30" y="40">Three eras of chat interfaces</text>
  <text class="chat-ux-lineage-sub" x="30" y="64">Messaging, streaming, then canvases.</text>
  <g class="chat-ux-lineage-stage chat-ux-lineage-s0">
    <rect class="chat-ux-lineage-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="chat-ux-lineage-step" x="44" y="142">01</text>
    <text class="chat-ux-lineage-name" x="70" y="142">Messaging UX, 2010-2022</text>
    <text class="chat-ux-lineage-desc" x="44" y="166">Instant local rendering, typing indicators,</text>
    <text class="chat-ux-lineage-desc" x="44" y="182">message bubbles.</text>
  </g>
  <line class="chat-ux-lineage-line chat-ux-lineage-conn chat-ux-lineage-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#chat-ux-lineage-tip)"/>
  <g class="chat-ux-lineage-stage chat-ux-lineage-s1">
    <rect class="chat-ux-lineage-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="chat-ux-lineage-step" x="359" y="142">02</text>
    <text class="chat-ux-lineage-name" x="385" y="142">Token streaming, 2022-2023</text>
    <text class="chat-ux-lineage-desc" x="359" y="166">SSE, typing dots, and a stop button. The</text>
    <text class="chat-ux-lineage-desc" x="359" y="182">paradigm set overnight.</text>
  </g>
  <line class="chat-ux-lineage-line chat-ux-lineage-conn chat-ux-lineage-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#chat-ux-lineage-tip)"/>
  <g class="chat-ux-lineage-stage chat-ux-lineage-s2">
    <rect class="chat-ux-lineage-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="chat-ux-lineage-step" x="674" y="142">03</text>
    <text class="chat-ux-lineage-name" x="700" y="142">Generative canvases, 2024</text>
    <text class="chat-ux-lineage-desc" x="674" y="166">Streaming code blocks, artefact previews,</text>
    <text class="chat-ux-lineage-desc" x="674" y="182">inline tool status.</text>
  </g>
  <text class="chat-ux-lineage-sub" x="30" y="304">The second era inherited most of its conventions from the first: message bubbles and typing indicators already existed, and what was new was that the sender was slow and interruptible.</text>
</svg>
