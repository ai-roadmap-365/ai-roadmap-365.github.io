<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The addresses ran out in 2011. The transition is still going.">
  <title>Why IPv6 exists, and why it took decades</title>
  <style>
    .ipv4-versus-ipv6-bg   { fill: #f8fafc; }
    .ipv4-versus-ipv6-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ipv4-versus-ipv6-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ipv4-versus-ipv6-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ipv4-versus-ipv6-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ipv4-versus-ipv6-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ipv4-versus-ipv6-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ipv4-versus-ipv6-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ipv4-versus-ipv6-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ipv4-versus-ipv6-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ipv4-versus-ipv6-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ipv4-versus-ipv6-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ipv4-versus-ipv6-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ipv4-versus-ipv6-row { opacity: 1; }
    .ipv4-versus-ipv6-r0 { animation-delay: 0.00s; }
    .ipv4-versus-ipv6-r1 { animation-delay: 0.45s; }
    .ipv4-versus-ipv6-r2 { animation-delay: 0.90s; }
    .ipv4-versus-ipv6-r3 { animation-delay: 1.35s; }
    .ipv4-versus-ipv6-r4 { animation-delay: 1.80s; }
    .ipv4-versus-ipv6-row { animation: ipv4-versus-ipv6-reveal 7.3s ease-in-out infinite; }
    @keyframes ipv4-versus-ipv6-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="ipv4-versus-ipv6-bg" width="980" height="390"/>
  <text class="ipv4-versus-ipv6-h1"  x="30" y="40">Why IPv6 exists, and why it took decades</text>
  <text class="ipv4-versus-ipv6-sub" x="30" y="64">The addresses ran out in 2011. The transition is still going.</text>
  <rect class="ipv4-versus-ipv6-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="ipv4-versus-ipv6-name" x="46" y="122">IPv4</text>
  <text class="ipv4-versus-ipv6-desc" x="46" y="142">32 bits. 4.3 billion addresses.</text>
  <text class="ipv4-versus-ipv6-desc ipv4-versus-ipv6-row ipv4-versus-ipv6-r0" x="46" y="182">Written as four numbers: 93.184.216.34</text>
  <text class="ipv4-versus-ipv6-desc ipv4-versus-ipv6-row ipv4-versus-ipv6-r1" x="46" y="216">Seemed limitless in 1981</text>
  <text class="ipv4-versus-ipv6-desc ipv4-versus-ipv6-row ipv4-versus-ipv6-r2" x="46" y="250">Last large blocks allocated in 2011</text>
  <text class="ipv4-versus-ipv6-desc ipv4-versus-ipv6-row ipv4-versus-ipv6-r3" x="46" y="284">NAT relieved the pressure — too well</text>
  <text class="ipv4-versus-ipv6-desc ipv4-versus-ipv6-row ipv4-versus-ipv6-r4" x="46" y="318">Still carries most traffic</text>
  <rect class="ipv4-versus-ipv6-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="ipv4-versus-ipv6-name" x="526" y="122">IPv6</text>
  <text class="ipv4-versus-ipv6-desc" x="526" y="142">128 bits. Exhaustion is not meaningful.</text>
  <text class="ipv4-versus-ipv6-desc ipv4-versus-ipv6-row ipv4-versus-ipv6-r0" x="526" y="182">Written in hex groups: 2606:2800:220::1946</text>
  <text class="ipv4-versus-ipv6-desc ipv4-versus-ipv6-row ipv4-versus-ipv6-r1" x="526" y="216">Every device can have a public address</text>
  <text class="ipv4-versus-ipv6-desc ipv4-versus-ipv6-row ipv4-versus-ipv6-r2" x="526" y="250">No NAT needed, in principle</text>
  <text class="ipv4-versus-ipv6-desc ipv4-versus-ipv6-row ipv4-versus-ipv6-r3" x="526" y="284">AAAA records rather than A</text>
  <text class="ipv4-versus-ipv6-desc ipv4-versus-ipv6-row ipv4-versus-ipv6-r4" x="526" y="318">Adoption measured in decades, not years</text>
  <text class="ipv4-versus-ipv6-sub" x="30" y="372">NAT is the reason the transition has been so slow: it solved the shortage well enough that the urgency evaporated, which is a recurring shape in infrastructure.</text>
</svg>
