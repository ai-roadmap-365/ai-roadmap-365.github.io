<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif"
     aria-labelledby="d103a-title d103a-desc" width="1200" height="900">
  <title id="d103a-title">The same two vectors compared three ways: Euclidean distance, the dot product as a projection, and the angle with its cosine</title>
  <desc id="d103a-desc">Three panels drawing the identical pair of vectors a equals 3 comma 4 and b equals 10 comma 0. The first panel draws the straight segment between their tips and labels it 8.0623. The second draws b's shadow along a's direction and labels it 6, with the dot product 30 above it. The third draws the angle between them, 53.13 degrees, and labels its cosine 0.6. A band beneath states what each measure reads and what it ignores.</desc>

  <style>
    .d103a-bg    { fill: #f8fafc; }
    .d103a-panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
    .d103a-band  { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.5; rx: 10; }
    .d103a-note  { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; rx: 10; }
    .d103a-h1    { fill: #1a202c; font-size: 30px; font-weight: 700; }
    .d103a-h2    { fill: #1d4ed8; font-size: 21px; font-weight: 700; }
    .d103a-t     { fill: #1a202c; font-size: 16px; }
    .d103a-tb    { fill: #1a202c; font-size: 16px; font-weight: 700; }
    .d103a-sm    { fill: #475569; font-size: 15px; }
    .d103a-mono  { fill: #1a202c; font-size: 16px;
                   font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .d103a-grid  { stroke: #e2e8f0; stroke-width: 1; }
    .d103a-axis  { stroke: #94a3b8; stroke-width: 1.5; }
    .d103a-veca  { stroke: #1d4ed8; stroke-width: 4; fill: none; }
    .d103a-vecb  { stroke: #0f766e; stroke-width: 4; fill: none; }
    .d103a-gap   { stroke: #b45309; stroke-width: 4; fill: none; stroke-dasharray: 9 6; }
    .d103a-drop  { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .d103a-ray   { stroke: #1d4ed8; stroke-width: 1.5; fill: none; stroke-dasharray: 4 5; }
    .d103a-shade { stroke: #b45309; stroke-width: 7; fill: none; }
    .d103a-arc   { stroke: #b45309; stroke-width: 3; fill: none; }
    .d103a-la    { fill: #1d4ed8; font-size: 16px; font-weight: 700; }
    .d103a-lb    { fill: #0f766e; font-size: 16px; font-weight: 700; }
    .d103a-lg    { fill: #b45309; font-size: 17px; font-weight: 700; }
  </style>

  <marker id="d103a-arrow-a" viewBox="0 0 10 10" refX="8" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
  </marker>
  <marker id="d103a-arrow-b" viewBox="0 0 10 10" refX="8" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e" />
  </marker>

  <rect class="d103a-bg" x="0" y="0" width="1200" height="900" />

  <text class="d103a-h1" x="40" y="48">Two vectors, three questions</text>
  <text class="d103a-t" x="40" y="80">The same pair every time:
    a = [3, 4] with length 5, and b = [10, 0] with length 10. Nothing about them changes between the panels — only the question does.</text>

  <!-- ============================ PANEL 1 ============================ -->
  <rect class="d103a-panel" x="40" y="110" width="360" height="420" />
  <text class="d103a-h2" x="60" y="146">1 &#183; How far apart?</text>
  <text class="d103a-sm" x="60" y="170">Euclidean distance</text>

  <g>
    <line class="d103a-grid" x1="70" y1="360" x2="380" y2="360" />
    <line class="d103a-grid" x1="70" y1="400" x2="380" y2="400" />
    <line class="d103a-grid" x1="70" y1="440" x2="380" y2="440" />
    <line class="d103a-axis" x1="90" y1="480" x2="380" y2="480" />
    <line class="d103a-axis" x1="110" y1="500" x2="110" y2="340" />

    <line class="d103a-veca" x1="110" y1="480" x2="152" y2="424"
          marker-end="url(#d103a-arrow-a)" />
    <line class="d103a-vecb" x1="110" y1="480" x2="250" y2="480"
          marker-end="url(#d103a-arrow-b)" />
    <line class="d103a-gap" x1="152" y1="424" x2="250" y2="480" />

    <text class="d103a-la" x="120" y="418">a</text>
    <text class="d103a-lb" x="255" y="500">b</text>
    <text class="d103a-lg" x="196" y="440">8.0623</text>
  </g>

  <text class="d103a-mono" x="60" y="516">a - b = [-7, 4]</text>
  <text class="d103a-mono" x="60" y="540">sqrt(49 + 16) = sqrt(65)</text>

  <!-- ============================ PANEL 2 ============================ -->
  <rect class="d103a-panel" x="420" y="110" width="360" height="420" />
  <text class="d103a-h2" x="440" y="146">2 &#183; How much of b lies along a?</text>
  <text class="d103a-sm" x="440" y="170">The dot product, as a projection</text>

  <g>
    <line class="d103a-grid" x1="450" y1="360" x2="760" y2="360" />
    <line class="d103a-grid" x1="450" y1="400" x2="760" y2="400" />
    <line class="d103a-grid" x1="450" y1="440" x2="760" y2="440" />
    <line class="d103a-axis" x1="470" y1="480" x2="760" y2="480" />
    <line class="d103a-axis" x1="490" y1="500" x2="490" y2="340" />

    <line class="d103a-ray" x1="490" y1="480" x2="574" y2="368" />
    <line class="d103a-shade" x1="490" y1="480" x2="540" y2="413" />
    <line class="d103a-veca" x1="490" y1="480" x2="532" y2="424"
          marker-end="url(#d103a-arrow-a)" />
    <line class="d103a-vecb" x1="490" y1="480" x2="630" y2="480"
          marker-end="url(#d103a-arrow-b)" />
    <line class="d103a-drop" x1="630" y1="480" x2="540" y2="413" />

    <text class="d103a-la" x="500" y="418">a</text>
    <text class="d103a-lb" x="635" y="500">b</text>
    <text class="d103a-lg" x="470" y="530">shadow = 6</text>
  </g>

  <text class="d103a-mono" x="440" y="516">a . b = 3(10) + 4(0) = 30</text>
  <text class="d103a-mono" x="600" y="540">30 / |a| = 30 / 5 = 6</text>

  <!-- ============================ PANEL 3 ============================ -->
  <rect class="d103a-panel" x="800" y="110" width="360" height="420" />
  <text class="d103a-h2" x="820" y="146">3 &#183; Do they point the same way?</text>
  <text class="d103a-sm" x="820" y="170">The angle, and its cosine</text>

  <g>
    <line class="d103a-grid" x1="830" y1="360" x2="1140" y2="360" />
    <line class="d103a-grid" x1="830" y1="400" x2="1140" y2="400" />
    <line class="d103a-grid" x1="830" y1="440" x2="1140" y2="440" />
    <line class="d103a-axis" x1="850" y1="480" x2="1140" y2="480" />
    <line class="d103a-axis" x1="870" y1="500" x2="870" y2="340" />

    <line class="d103a-veca" x1="870" y1="480" x2="912" y2="424"
          marker-end="url(#d103a-arrow-a)" />
    <line class="d103a-vecb" x1="870" y1="480" x2="1010" y2="480"
          marker-end="url(#d103a-arrow-b)" />
    <path class="d103a-arc" d="M 935 480 A 65 65 0 0 0 909 428" />

    <text class="d103a-la" x="880" y="418">a</text>
    <text class="d103a-lb" x="1015" y="500">b</text>
    <text class="d103a-lg" x="938" y="452">53.13&#176;</text>
  </g>

  <text class="d103a-mono" x="820" y="516">cos(53.13&#176;) = 0.6</text>
  <text class="d103a-mono" x="820" y="540">= 30 / (5 &#215; 10)</text>

  <!-- ============================ THE TIE ============================ -->
  <rect class="d103a-band" x="40" y="556" width="1120" height="112" />
  <text class="d103a-tb" x="64" y="590">One identity ties all three panels together:</text>
  <text class="d103a-mono" x="64" y="622">a . b  =  |a| |b| cos(theta)        30  =  5 &#215; 10 &#215; 0.6</text>
  <text class="d103a-t" x="64" y="652">Panel 2 is panel 3 with the two lengths multiplied back in. Divide them out again and you have cosine similarity: 30 / (5 &#215; 10) = 0.6.</text>

  <!-- ============================ WHAT EACH IGNORES ============================ -->
  <rect class="d103a-note" x="40" y="690" width="360" height="180" />
  <text class="d103a-tb" x="60" y="722">Euclidean distance</text>
  <text class="d103a-sm" x="60" y="750">reads: both lengths and the angle</text>
  <text class="d103a-sm" x="60" y="774">ignores: nothing</text>
  <text class="d103a-t" x="60" y="806">Right when magnitude is part of</text>
  <text class="d103a-t" x="60" y="828">what you mean: positions, sizes,</text>
  <text class="d103a-t" x="60" y="850">counts you care about the size of.</text>

  <rect class="d103a-note" x="420" y="690" width="360" height="180" />
  <text class="d103a-tb" x="440" y="722">Dot product</text>
  <text class="d103a-sm" x="440" y="750">reads: both lengths and the angle</text>
  <text class="d103a-sm" x="440" y="774">ignores: nothing — and so is</text>
  <text class="d103a-sm" x="440" y="796">dominated by the longer vector</text>
  <text class="d103a-t" x="440" y="828">Its SIGN alone is free of that:</text>
  <text class="d103a-t" x="440" y="850">+ under 90&#176;, 0 at 90&#176;, &#8722; above.</text>

  <rect class="d103a-note" x="800" y="690" width="360" height="180" />
  <text class="d103a-tb" x="820" y="722">Cosine similarity</text>
  <text class="d103a-sm" x="820" y="750">reads: the angle only</text>
  <text class="d103a-sm" x="820" y="774">ignores: both lengths, by</text>
  <text class="d103a-sm" x="820" y="796">construction — it divides them out</text>
  <text class="d103a-t" x="820" y="828">Right when length is an accident</text>
  <text class="d103a-t" x="820" y="850">of the writing: text, embeddings.</text>
</svg>
