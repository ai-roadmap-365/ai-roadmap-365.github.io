<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Distributed AI Span Tree Architecture">
  <title>Distributed AI Span Tree Architecture</title>
  <defs>
    <style>
      .d314a-bg { fill: #f8fafc; }
      .d314a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d314a-root { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 6px; }
      .d314a-emb { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 6px; }
      .d314a-vec { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 6px; }
      .d314a-llm { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 6px; }
      .d314a-rail { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; rx: 6px; }
      .d314a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d314a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d314a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; }
      .d314a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d314a-bg" />
  
  <text x="40" y="40" class="d314a-title">Hierarchical AI Span Tree Architecture (OpenInference)</text>
  <text x="40" y="65" class="d314a-subtitle">Distributed AI Span Tree Architecture showing Root Trace, Child Spans for Query Embedding, Vector DB Search, Prompt Construction, LLM Inference, and Guardrail Scan</text>
  
  <!-- Root Span -->
  <rect x="40" y="100" width="820" height="45" class="d314a-root" />
  <text x="60" y="128" class="d314a-header" fill="#1d4ed8">Root Trace: RAG Assistant Request (Duration: 850ms, Cost: $0.0034)</text>
  
  <!-- Child Span 1: Query Embedding -->
  <rect x="70" y="155" width="220" height="40" class="d314a-emb" />
  <text x="85" y="180" class="d314a-header" fill="#7e22ce">1. Embed Query (35ms)</text>
  
  <!-- Child Span 2: Vector Retrieval -->
  <rect x="300" y="155" width="260" height="40" class="d314a-vec" />
  <text x="315" y="180" class="d314a-header" fill="#a16207">2. Vector Search (65ms, 4 docs)</text>
  
  <!-- Child Span 3: Input Guardrail -->
  <rect x="570" y="155" width="290" height="40" class="d314a-rail" />
  <text x="585" y="180" class="d314a-header" fill="#991b1b">3. Input Guardrail / PII (2ms)</text>
  
  <!-- Child Span 4: LLM Generation -->
  <rect x="70" y="210" width="790" height="90" class="d314a-llm" />
  <text x="85" y="235" class="d314a-header" fill="#15803d">4. LLM Generation: Claude 3.5 Sonnet (720ms, TTFT: 180ms)</text>
  <text x="85" y="260" class="d314a-text">• Input Tokens: 1,420 (Cached: 1,024) | Output Tokens: 215</text>
  <text x="85" y="280" class="d314a-text">• Model Latency: 720ms | Stream ITL: 2.5ms/token | Cost: $0.0031</text>
  
  <!-- Child Span 5: Output Guardrail -->
  <rect x="70" y="315" width="400" height="45" class="d314a-rail" />
  <text x="85" y="342" class="d314a-header" fill="#991b1b">5. Output Secret &amp; Toxicity Scan (5ms)</text>
  
  <!-- Child Span 6: Client Delivery -->
  <rect x="490" y="315" width="370" height="45" class="d314a-root" />
  <text x="505" y="342" class="d314a-header" fill="#1d4ed8">6. Stream Final Response to Client (23ms)</text>
</svg>