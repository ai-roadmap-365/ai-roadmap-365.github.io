<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Optimising for ranking</title>
  <style>
    .bpr-bg   { fill: #f8fafc; }
    .bpr-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bpr-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bpr-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bpr-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bpr-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bpr-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bpr-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bpr-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bpr-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bpr-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bpr-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bpr-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .bpr-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .bpr-stage { opacity: 1; }

    .bpr-s0 { animation-delay: 0.00s; }
    .bpr-e0 { animation-delay: 0.00s; }
    .bpr-s1 { animation-delay: 1.28s; }
    .bpr-e1 { animation-delay: 1.28s; }
    .bpr-s2 { animation-delay: 2.56s; }
    .bpr-e2 { animation-delay: 2.56s; }
    .bpr-s3 { animation-delay: 3.84s; }
    .bpr-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .bpr-conn  { animation: bpr-trace 6.4s ease-in-out infinite; }
      .bpr-stage { animation: bpr-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes bpr-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes bpr-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .bpr-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .bpr-stage { animation: bpr-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes bpr-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="bpr-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="bpr-bg" width="980" height="322"/>
  <text class="bpr-h1"  x="30" y="40">Optimising for ranking</text>
  <text class="bpr-sub" x="30" y="64">Four steps.</text>
  <g class="bpr-stage bpr-s0">
    <rect class="bpr-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="bpr-step" x="44" y="142">01</text>
    <text class="bpr-name" x="70" y="142">The goal is ordering, not predicting a rating</text>
    <text class="bpr-desc" x="44" y="166">Users see a list, not a number.</text>
  </g>
  <line class="bpr-line bpr-conn bpr-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#bpr-tip)"/>
  <g class="bpr-stage bpr-s1">
    <rect class="bpr-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="bpr-step" x="280" y="142">02</text>
    <text class="bpr-name" x="306" y="142">So sample pairs: one item interacted with, one not</text>
    <text class="bpr-desc" x="280" y="166">For each user.</text>
  </g>
  <line class="bpr-line bpr-conn bpr-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#bpr-tip)"/>
  <g class="bpr-stage bpr-s2">
    <rect class="bpr-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="bpr-step" x="516" y="142">03</text>
    <text class="bpr-name" x="542" y="142">And optimise so the first scores higher</text>
    <text class="bpr-desc" x="516" y="166">Which trains the ordering</text>
    <text class="bpr-desc" x="516" y="182">directly.</text>
  </g>
  <line class="bpr-line bpr-conn bpr-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#bpr-tip)"/>
  <g class="bpr-stage bpr-s3">
    <rect class="bpr-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="bpr-step" x="752" y="142">04</text>
    <text class="bpr-name" x="778" y="142">Rather than fitting a rating nobody sees</text>
    <text class="bpr-desc" x="752" y="166">Which improves the metric that</text>
    <text class="bpr-desc" x="752" y="182">matters.</text>
  </g>
  <text class="bpr-sub" x="30" y="304">Optimising the ordering directly rather than a rating is the same reasoning that makes ranking metrics necessary: the product is a list, so the loss should be about lists.</text>
</svg>
