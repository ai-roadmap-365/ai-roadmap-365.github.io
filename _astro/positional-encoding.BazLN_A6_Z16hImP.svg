<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Attention is permutation-equivariant.">
  <title>Why position must be added</title>
  <style>
    .positional-encoding-bg   { fill: #f8fafc; }
    .positional-encoding-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .positional-encoding-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .positional-encoding-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .positional-encoding-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .positional-encoding-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .positional-encoding-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .positional-encoding-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .positional-encoding-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .positional-encoding-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .positional-encoding-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .positional-encoding-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .positional-encoding-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .positional-encoding-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .positional-encoding-stage { opacity: 1; }

    .positional-encoding-s0 { animation-delay: 0.00s; }
    .positional-encoding-e0 { animation-delay: 0.00s; }
    .positional-encoding-s1 { animation-delay: 1.28s; }
    .positional-encoding-e1 { animation-delay: 1.28s; }
    .positional-encoding-s2 { animation-delay: 2.56s; }
    .positional-encoding-e2 { animation-delay: 2.56s; }
    .positional-encoding-s3 { animation-delay: 3.84s; }
    .positional-encoding-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .positional-encoding-conn  { animation: positional-encoding-trace 6.4s ease-in-out infinite; }
      .positional-encoding-stage { animation: positional-encoding-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes positional-encoding-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes positional-encoding-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .positional-encoding-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .positional-encoding-stage { animation: positional-encoding-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes positional-encoding-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="positional-encoding-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="positional-encoding-bg" width="980" height="322"/>
  <text class="positional-encoding-h1"  x="30" y="40">Why position must be added</text>
  <text class="positional-encoding-sub" x="30" y="64">Attention is permutation-equivariant.</text>
  <g class="positional-encoding-stage positional-encoding-s0">
    <rect class="positional-encoding-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="positional-encoding-step" x="44" y="142">01</text>
    <text class="positional-encoding-name" x="70" y="142">Attention has no notion of order</text>
    <text class="positional-encoding-desc" x="44" y="166">Shuffle the input and the output</text>
    <text class="positional-encoding-desc" x="44" y="182">shuffles identically.</text>
  </g>
  <line class="positional-encoding-line positional-encoding-conn positional-encoding-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#positional-encoding-tip)"/>
  <g class="positional-encoding-stage positional-encoding-s1">
    <rect class="positional-encoding-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="positional-encoding-step" x="280" y="142">02</text>
    <text class="positional-encoding-name" x="306" y="142">So "dog bites man" and "man bites dog" are identical</text>
    <text class="positional-encoding-desc" x="280" y="166">Without positional information,</text>
    <text class="positional-encoding-desc" x="280" y="182">entirely.</text>
  </g>
  <line class="positional-encoding-line positional-encoding-conn positional-encoding-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#positional-encoding-tip)"/>
  <g class="positional-encoding-stage positional-encoding-s2">
    <rect class="positional-encoding-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="positional-encoding-step" x="516" y="142">03</text>
    <text class="positional-encoding-name" x="542" y="142">Add a position-dependent signal</text>
    <text class="positional-encoding-desc" x="516" y="166">Sinusoids at geometrically</text>
    <text class="positional-encoding-desc" x="516" y="182">spaced frequencies.</text>
  </g>
  <line class="positional-encoding-line positional-encoding-conn positional-encoding-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#positional-encoding-tip)"/>
  <g class="positional-encoding-stage positional-encoding-s3">
    <rect class="positional-encoding-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="positional-encoding-step" x="752" y="142">04</text>
    <text class="positional-encoding-name" x="778" y="142">Whose shifts are linear transformations</text>
    <text class="positional-encoding-desc" x="752" y="166">So relative distance is</text>
    <text class="positional-encoding-desc" x="752" y="182">learnable.</text>
  </g>
  <text class="positional-encoding-sub" x="30" y="304">The relative-shift property is the reason for the sinusoidal choice specifically: a fixed offset corresponds to a rotation, which a linear layer can learn to detect.</text>
</svg>
