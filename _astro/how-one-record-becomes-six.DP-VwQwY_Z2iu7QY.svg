<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%" role="img" aria-label="How One Record Becomes Six showing a document flowing into extracted text, chunks, embeddings, a response cache and an observability trace, with a deletion reaching only the first store">
  <title>How One Record Becomes Six</title>
  <defs>
    <style>
      .d328a-bg { fill: #f8fafc; }
      .d328a-src { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; }
      .d328a-copy { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; }
      .d328a-gone { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; }
      .d328a-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d328a-sub { font-family: system-ui, sans-serif; font-size: 13px; fill: #475569; }
      .d328a-h { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #0f172a; }
      .d328a-t { font-family: system-ui, sans-serif; font-size: 10px; fill: #334155; }
      .d328a-warn { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #b91c1c; }
      .d328a-flow { stroke: #64748b; stroke-width: 2px; fill: none; }
    </style>
    <marker id="d328a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="100%" height="100%" class="d328a-bg"/>
  <text x="40" y="40" class="d328a-title">How One Record Becomes Six</text>
  <text x="40" y="64" class="d328a-sub">A retrieval system is a machine for copying data. The copies multiplied; the deletion did not.</text>

  <rect x="40" y="110" width="140" height="70" rx="8" class="d328a-src"/>
  <text x="110" y="138" class="d328a-h" text-anchor="middle">1. Document</text>
  <text x="110" y="158" class="d328a-t" text-anchor="middle">arrives with PII</text>

  <rect x="230" y="100" width="130" height="46" rx="6" class="d328a-copy"/>
  <text x="295" y="120" class="d328a-h" text-anchor="middle">2. Extracted text</text>
  <text x="295" y="137" class="d328a-t" text-anchor="middle">object store</text>

  <rect x="230" y="158" width="130" height="46" rx="6" class="d328a-copy"/>
  <text x="295" y="178" class="d328a-h" text-anchor="middle">3. Chunks</text>
  <text x="295" y="195" class="d328a-t" text-anchor="middle">document store</text>

  <rect x="410" y="100" width="130" height="46" rx="6" class="d328a-copy"/>
  <text x="475" y="120" class="d328a-h" text-anchor="middle">4. Embeddings</text>
  <text x="475" y="137" class="d328a-t" text-anchor="middle">vector index</text>

  <rect x="410" y="158" width="130" height="46" rx="6" class="d328a-copy"/>
  <text x="475" y="178" class="d328a-h" text-anchor="middle">5. Response</text>
  <text x="475" y="195" class="d328a-t" text-anchor="middle">cache</text>

  <rect x="590" y="129" width="130" height="46" rx="6" class="d328a-copy"/>
  <text x="655" y="149" class="d328a-h" text-anchor="middle">6. Prompt log</text>
  <text x="655" y="166" class="d328a-t" text-anchor="middle">trace, kept longest</text>

  <path d="M 180 138 L 224 120" class="d328a-flow" marker-end="url(#d328a-a)"/>
  <path d="M 180 152 L 224 178" class="d328a-flow" marker-end="url(#d328a-a)"/>
  <path d="M 360 178 L 404 130" class="d328a-flow" marker-end="url(#d328a-a)"/>
  <path d="M 360 185 L 404 180" class="d328a-flow" marker-end="url(#d328a-a)"/>
  <path d="M 540 160 L 584 155" class="d328a-flow" marker-end="url(#d328a-a)"/>

  <rect x="40" y="250" width="200" height="60" rx="8" class="d328a-gone"/>
  <text x="140" y="275" class="d328a-h" text-anchor="middle">DELETE FROM users</text>
  <text x="140" y="295" class="d328a-t" text-anchor="middle">reaches store 1 only</text>
  <path d="M 140 246 L 140 186" class="d328a-flow" marker-end="url(#d328a-a)"/>

  <text x="290" y="272" class="d328a-warn">Stores 2 to 6 still hold the data. Nothing reports a problem.</text>
  <text x="290" y="294" class="d328a-t">The delete succeeded. The request was not fulfilled. Those are different things, and only a</text>
  <text x="290" y="312" class="d328a-t">read-back afterwards can tell them apart.</text>

  <text x="40" y="360" class="d328a-h">The two controls that prevent this</text>
  <text x="40" y="384" class="d328a-t">REDACT AT THE BOUNDARY — replace identifiers before the fan-out, so stores 2 to 6 never carry them. Once an email</text>
  <text x="40" y="402" class="d328a-t">address is inside the embeddings, removing it means re-embedding the corpus.</text>
  <text x="40" y="426" class="d328a-t">TRACK THE FLOW — record which stores hold which subject, so an erasure runs against a list rather than someone's memory.</text>
</svg>
