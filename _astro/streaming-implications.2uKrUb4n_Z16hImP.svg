<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each one bites a different team.">
  <title>Four consequences of streaming</title>
  <style>
    .streaming-implications-bg   { fill: #f8fafc; }
    .streaming-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .streaming-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .streaming-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .streaming-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .streaming-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .streaming-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .streaming-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .streaming-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .streaming-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .streaming-implications-stage { opacity: 1; }

    .streaming-implications-s0 { animation-delay: 0.00s; }
    .streaming-implications-e0 { animation-delay: 0.00s; }
    .streaming-implications-s1 { animation-delay: 1.28s; }
    .streaming-implications-e1 { animation-delay: 1.28s; }
    .streaming-implications-s2 { animation-delay: 2.56s; }
    .streaming-implications-e2 { animation-delay: 2.56s; }
    .streaming-implications-s3 { animation-delay: 3.84s; }
    .streaming-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .streaming-implications-conn  { animation: streaming-implications-trace 6.4s ease-in-out infinite; }
      .streaming-implications-stage { animation: streaming-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes streaming-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes streaming-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .streaming-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .streaming-implications-stage { animation: streaming-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes streaming-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="streaming-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="streaming-implications-bg" width="980" height="322"/>
  <text class="streaming-implications-h1"  x="30" y="40">Four consequences of streaming</text>
  <text class="streaming-implications-sub" x="30" y="64">Each one bites a different team.</text>
  <g class="streaming-implications-stage streaming-implications-s0">
    <rect class="streaming-implications-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="streaming-implications-step" x="44" y="142">01</text>
    <text class="streaming-implications-name" x="70" y="142">Escape on every append</text>
    <text class="streaming-implications-desc" x="44" y="166">A partial tag slips past a</text>
    <text class="streaming-implications-desc" x="44" y="182">sanitiser that assumed a whole</text>
    <text class="streaming-implications-desc" x="44" y="198">document.</text>
    <text class="streaming-implications-edge" x="44" y="242">security</text>
  </g>
  <line class="streaming-implications-line streaming-implications-conn streaming-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#streaming-implications-tip)"/>
  <g class="streaming-implications-stage streaming-implications-s1">
    <rect class="streaming-implications-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="streaming-implications-step" x="280" y="142">02</text>
    <text class="streaming-implications-name" x="306" y="142">Partials are content</text>
    <text class="streaming-implications-desc" x="280" y="166">Cancelled and failed answers</text>
    <text class="streaming-implications-desc" x="280" y="182">were still generated, and are in</text>
    <text class="streaming-implications-desc" x="280" y="198">your logs.</text>
    <text class="streaming-implications-edge" x="280" y="242">privacy</text>
  </g>
  <line class="streaming-implications-line streaming-implications-conn streaming-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#streaming-implications-tip)"/>
  <g class="streaming-implications-stage streaming-implications-s2">
    <rect class="streaming-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="streaming-implications-step" x="516" y="142">03</text>
    <text class="streaming-implications-name" x="542" y="142">Concurrency is connections</text>
    <text class="streaming-implications-desc" x="516" y="166">A different capacity model from</text>
    <text class="streaming-implications-desc" x="516" y="182">request rate. Size it</text>
    <text class="streaming-implications-desc" x="516" y="198">accordingly.</text>
    <text class="streaming-implications-edge" x="516" y="242">scalability</text>
  </g>
  <line class="streaming-implications-line streaming-implications-conn streaming-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#streaming-implications-tip)"/>
  <g class="streaming-implications-stage streaming-implications-s3">
    <rect class="streaming-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="streaming-implications-step" x="752" y="142">04</text>
    <text class="streaming-implications-name" x="778" y="142">Verify cancellation upstream</text>
    <text class="streaming-implications-desc" x="752" y="166">Hiding tokens while the model</text>
    <text class="streaming-implications-desc" x="752" y="182">keeps producing them pays full</text>
    <text class="streaming-implications-desc" x="752" y="198">price.</text>
    <text class="streaming-implications-edge" x="752" y="242">money</text>
  </g>
  <text class="streaming-implications-sub" x="30" y="304">The last is worth measuring rather than assuming: an interface that stops rendering without aborting the upstream request has improved the experience and saved nothing at all.</text>
</svg>
