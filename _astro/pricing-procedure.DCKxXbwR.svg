<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Seven steps, and step six is the insight.">
  <title>How to price a workload</title>
  <style>
    .pricing-procedure-bg   { fill: #f8fafc; }
    .pricing-procedure-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pricing-procedure-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pricing-procedure-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pricing-procedure-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pricing-procedure-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pricing-procedure-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pricing-procedure-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pricing-procedure-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pricing-procedure-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pricing-procedure-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pricing-procedure-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pricing-procedure-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pricing-procedure-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pricing-procedure-stage { opacity: 1; }

    .pricing-procedure-s0 { animation-delay: 0.00s; }
    .pricing-procedure-e0 { animation-delay: 0.00s; }
    .pricing-procedure-s1 { animation-delay: 1.40s; }
    .pricing-procedure-e1 { animation-delay: 1.40s; }
    .pricing-procedure-s2 { animation-delay: 2.80s; }
    .pricing-procedure-e2 { animation-delay: 2.80s; }
    .pricing-procedure-s3 { animation-delay: 4.20s; }
    .pricing-procedure-e3 { animation-delay: 4.20s; }
    .pricing-procedure-s4 { animation-delay: 5.60s; }
    .pricing-procedure-e4 { animation-delay: 5.60s; }
    .pricing-procedure-s5 { animation-delay: 7.00s; }
    .pricing-procedure-e5 { animation-delay: 7.00s; }
    .pricing-procedure-s6 { animation-delay: 8.40s; }
    .pricing-procedure-e6 { animation-delay: 8.40s; }
    @media (prefers-reduced-motion: no-preference) {
      .pricing-procedure-conn  { animation: pricing-procedure-trace 11.200000000000001s ease-in-out infinite; }
      .pricing-procedure-stage { animation: pricing-procedure-arrive 11.200000000000001s ease-in-out infinite; }
    }
    @keyframes pricing-procedure-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pricing-procedure-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pricing-procedure-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pricing-procedure-stage { animation: pricing-procedure-settle 11.200000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pricing-procedure-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pricing-procedure-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pricing-procedure-bg" width="980" height="322"/>
  <text class="pricing-procedure-h1"  x="30" y="40">How to price a workload</text>
  <text class="pricing-procedure-sub" x="30" y="64">Seven steps, and step six is the insight.</text>
  <g class="pricing-procedure-stage pricing-procedure-s0">
    <rect class="pricing-procedure-box" x="30" y="118" width="109" height="104" rx="10"/>
    <text class="pricing-procedure-step" x="44" y="142">01</text>
    <text class="pricing-procedure-name" x="70" y="142">Describe the workload, not the machine</text>
    <text class="pricing-procedure-desc" x="44" y="166">Requests a month,</text>
    <text class="pricing-procedure-desc" x="44" y="182">compute seconds</text>
    <text class="pricing-procedure-desc" x="44" y="198">each, bytes out,</text>
  </g>
  <line class="pricing-procedure-line pricing-procedure-conn pricing-procedure-e0" x1="141" y1="170" x2="163" y2="170" marker-end="url(#pricing-procedure-tip)"/>
  <g class="pricing-procedure-stage pricing-procedure-s1">
    <rect class="pricing-procedure-box" x="165" y="118" width="109" height="104" rx="10"/>
    <text class="pricing-procedure-step" x="179" y="142">02</text>
    <text class="pricing-procedure-name" x="205" y="142">Price compute by billing model</text>
    <text class="pricing-procedure-desc" x="179" y="166">Always-on is</text>
    <text class="pricing-procedure-desc" x="179" y="182">hourly x 730 and</text>
    <text class="pricing-procedure-desc" x="179" y="198">ignores the</text>
  </g>
  <line class="pricing-procedure-line pricing-procedure-conn pricing-procedure-e1" x1="276" y1="170" x2="298" y2="170" marker-end="url(#pricing-procedure-tip)"/>
  <g class="pricing-procedure-stage pricing-procedure-s2">
    <rect class="pricing-procedure-box" x="300" y="118" width="109" height="104" rx="10"/>
    <text class="pricing-procedure-step" x="314" y="142">03</text>
    <text class="pricing-procedure-name" x="340" y="142">Price egress</text>
    <text class="pricing-procedure-desc" x="314" y="166">Deduct the free</text>
    <text class="pricing-procedure-desc" x="314" y="182">allowance,</text>
    <text class="pricing-procedure-desc" x="314" y="198">multiply the</text>
  </g>
  <line class="pricing-procedure-line pricing-procedure-conn pricing-procedure-e2" x1="411" y1="170" x2="433" y2="170" marker-end="url(#pricing-procedure-tip)"/>
  <g class="pricing-procedure-stage pricing-procedure-s3">
    <rect class="pricing-procedure-box" x="435" y="118" width="109" height="104" rx="10"/>
    <text class="pricing-procedure-step" x="449" y="142">04</text>
    <text class="pricing-procedure-name" x="475" y="142">Price storage</text>
    <text class="pricing-procedure-desc" x="449" y="166">The same way.</text>
  </g>
  <line class="pricing-procedure-line pricing-procedure-conn pricing-procedure-e3" x1="546" y1="170" x2="568" y2="170" marker-end="url(#pricing-procedure-tip)"/>
  <g class="pricing-procedure-stage pricing-procedure-s4">
    <rect class="pricing-procedure-box" x="570" y="118" width="109" height="104" rx="10"/>
    <text class="pricing-procedure-step" x="584" y="142">05</text>
    <text class="pricing-procedure-name" x="610" y="142">Headroom per dimension</text>
    <text class="pricing-procedure-desc" x="584" y="166">Allowance divided</text>
    <text class="pricing-procedure-desc" x="584" y="182">by usage. A</text>
    <text class="pricing-procedure-desc" x="584" y="198">dimension you do</text>
  </g>
  <line class="pricing-procedure-line pricing-procedure-conn pricing-procedure-e4" x1="681" y1="170" x2="703" y2="170" marker-end="url(#pricing-procedure-tip)"/>
  <g class="pricing-procedure-stage pricing-procedure-s5">
    <rect class="pricing-procedure-good" x="705" y="118" width="109" height="104" rx="10"/>
    <text class="pricing-procedure-step" x="719" y="142">06</text>
    <text class="pricing-procedure-name" x="745" y="142">Take the minimum</text>
    <text class="pricing-procedure-desc" x="719" y="166">The tier ends</text>
    <text class="pricing-procedure-desc" x="719" y="182">when the first</text>
    <text class="pricing-procedure-desc" x="719" y="198">allowance runs</text>
    <text class="pricing-procedure-edge" x="719" y="242">the insight</text>
  </g>
  <line class="pricing-procedure-line pricing-procedure-conn pricing-procedure-e5" x1="816" y1="170" x2="838" y2="170" marker-end="url(#pricing-procedure-tip)"/>
  <g class="pricing-procedure-stage pricing-procedure-s6">
    <rect class="pricing-procedure-box" x="840" y="118" width="109" height="104" rx="10"/>
    <text class="pricing-procedure-step" x="854" y="142">07</text>
    <text class="pricing-procedure-name" x="880" y="142">Bisect for the crossover</text>
    <text class="pricing-procedure-desc" x="854" y="166">None is a</text>
    <text class="pricing-procedure-desc" x="854" y="182">legitimate</text>
    <text class="pricing-procedure-desc" x="854" y="198">answer: the</text>
    <text class="pricing-procedure-edge" x="854" y="242">a number</text>
  </g>
  <text class="pricing-procedure-sub" x="30" y="304">Step six is the whole difference between reading a pricing page and understanding it: every allowance is advertised independently and they are consumed simultaneously, so the smallest headroom is the only one that matters.</text>
</svg>
