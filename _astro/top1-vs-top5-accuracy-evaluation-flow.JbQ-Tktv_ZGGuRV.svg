<svg role="img" aria-label="Top-1 versus Top-5 classification accuracy calculation flow ranking predicted class probabilities against true target labels" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Top-1 vs Top-5 Classification Accuracy Evaluation Flow</title>
  <defs>
    <linearGradient id="bg215b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card215b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg215b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">TOP-1 VS TOP-5 CLASSIFICATION ACCURACY</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Ranking Softmax Predictions to Evaluate Fine-Grained Categorization Performance</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card215b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Predicted Probability Vector Ranking -->
    <rect x="30" y="30" width="320" height="235" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="190" y="55" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Ranked Softmax Predictions</text>
    
    <rect x="45" y="70" width="290" height="30" fill="#10b981" fill-opacity="0.3" stroke="#10b981" rx="4"/>
    <text x="60" y="90" fill="#f8fafc" font-size="9" font-weight="700">Rank 1 (p=0.42): Siberian Husky</text>
    
    <rect x="45" y="105" width="290" height="30" fill="#1e293b" stroke="#64748b" rx="4"/>
    <text x="60" y="125" fill="#34d399" font-size="9" font-weight="700">Rank 2 (p=0.31): Alaskan Malamute [TRUE LABEL]</text>
    
    <rect x="45" y="140" width="290" height="30" fill="#1e293b" stroke="#64748b" rx="4"/>
    <text x="60" y="160" fill="#cbd5e1" font-size="9">Rank 3 (p=0.14): German Shepherd</text>
    
    <rect x="45" y="175" width="290" height="30" fill="#1e293b" stroke="#64748b" rx="4"/>
    <text x="60" y="195" fill="#cbd5e1" font-size="9">Rank 4 (p=0.08): Samoyed</text>
    
    <rect x="45" y="210" width="290" height="30" fill="#1e293b" stroke="#64748b" rx="4"/>
    <text x="60" y="230" fill="#cbd5e1" font-size="9">Rank 5 (p=0.03): Akita</text>

    <!-- Right: Evaluation Metrics Comparison -->
    <rect x="380" y="30" width="350" height="235" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="555" y="55" fill="#fbbf24" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Evaluation Decision Outcome</text>

    <!-- Top-1 Check -->
    <rect x="400" y="70" width="310" height="65" fill="#1e293b" stroke="#f43f5e" rx="4"/>
    <text x="415" y="93" fill="#fb7185" font-size="11" font-weight="700">Top-1 Accuracy: 0 (INCORRECT)</text>
    <text x="415" y="112" fill="#cbd5e1" font-size="8">Predicted Rank 1 (Husky) != True Label (Malamute)</text>
    <text x="415" y="125" fill="#94a3b8" font-size="8">Strict single-choice evaluation</text>

    <!-- Top-5 Check -->
    <rect x="400" y="145" width="310" height="65" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="415" y="168" fill="#34d399" font-size="11" font-weight="700">Top-5 Accuracy: 1 (CORRECT)</text>
    <text x="415" y="187" fill="#cbd5e1" font-size="8">True Label (Malamute) is inside Top-5 predictions</text>
    <text x="415" y="200" fill="#34d399" font-size="8">Essential for fine-grained 1000-class datasets</text>

    <text x="555" y="245" fill="#cbd5e1" font-size="8" text-anchor="middle">Industrial Standard: Report both Top-1 and Top-5 accuracy alongside Macro F1</text>
  </g>
</svg>
