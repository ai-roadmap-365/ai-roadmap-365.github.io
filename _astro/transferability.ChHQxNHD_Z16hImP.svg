<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="General at the bottom, specific at the top.">
  <title>Features transfer in a spectrum</title>
  <style>
    .transferability-bg   { fill: #f8fafc; }
    .transferability-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transferability-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transferability-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transferability-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transferability-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transferability-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .transferability-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .transferability-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .transferability-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .transferability-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .transferability-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .transferability-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .transferability-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .transferability-stage { opacity: 1; }

    .transferability-s0 { animation-delay: 0.00s; }
    .transferability-e0 { animation-delay: 0.00s; }
    .transferability-s1 { animation-delay: 1.28s; }
    .transferability-e1 { animation-delay: 1.28s; }
    .transferability-s2 { animation-delay: 2.56s; }
    .transferability-e2 { animation-delay: 2.56s; }
    .transferability-s3 { animation-delay: 3.84s; }
    .transferability-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .transferability-conn  { animation: transferability-trace 6.4s ease-in-out infinite; }
      .transferability-stage { animation: transferability-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes transferability-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes transferability-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .transferability-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .transferability-stage { animation: transferability-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes transferability-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="transferability-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="transferability-bg" width="980" height="322"/>
  <text class="transferability-h1"  x="30" y="40">Features transfer in a spectrum</text>
  <text class="transferability-sub" x="30" y="64">General at the bottom, specific at the top.</text>
  <g class="transferability-stage transferability-s0">
    <rect class="transferability-good" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="transferability-step" x="44" y="142">01</text>
    <text class="transferability-name" x="70" y="142">Early layers: edges and colours</text>
    <text class="transferability-desc" x="44" y="166">Useful for any image, of</text>
    <text class="transferability-desc" x="44" y="182">anything. Transfer almost</text>
    <text class="transferability-desc" x="44" y="198">universally.</text>
  </g>
  <line class="transferability-line transferability-conn transferability-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#transferability-tip)"/>
  <g class="transferability-stage transferability-s1">
    <rect class="transferability-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="transferability-step" x="280" y="142">02</text>
    <text class="transferability-name" x="306" y="142">Middle layers: textures and motifs</text>
    <text class="transferability-desc" x="280" y="166">Still broadly useful. Transfer</text>
    <text class="transferability-desc" x="280" y="182">well across natural images.</text>
  </g>
  <line class="transferability-line transferability-conn transferability-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#transferability-tip)"/>
  <g class="transferability-stage transferability-s2">
    <rect class="transferability-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="transferability-step" x="516" y="142">03</text>
    <text class="transferability-name" x="542" y="142">Late layers: object parts</text>
    <text class="transferability-desc" x="516" y="166">Transfer only if the domains are</text>
    <text class="transferability-desc" x="516" y="182">related.</text>
  </g>
  <line class="transferability-line transferability-conn transferability-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#transferability-tip)"/>
  <g class="transferability-stage transferability-s3">
    <rect class="transferability-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="transferability-step" x="752" y="142">04</text>
    <text class="transferability-name" x="778" y="142">The head: class-specific</text>
    <text class="transferability-desc" x="752" y="166">Replaced entirely for a new</text>
    <text class="transferability-desc" x="752" y="182">task.</text>
  </g>
  <text class="transferability-sub" x="30" y="304">The spectrum is what makes the fine-tuning strategy obvious: freeze what transfers, replace what does not, and unfreeze the middle only if the domains are far apart.</text>
</svg>
