<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps, looped.">
  <title>Bayesian optimisation</title>
  <style>
    .bayesian-opt-bg   { fill: #f8fafc; }
    .bayesian-opt-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bayesian-opt-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bayesian-opt-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bayesian-opt-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bayesian-opt-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bayesian-opt-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bayesian-opt-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bayesian-opt-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bayesian-opt-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bayesian-opt-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bayesian-opt-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bayesian-opt-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .bayesian-opt-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .bayesian-opt-stage { opacity: 1; }

    .bayesian-opt-s0 { animation-delay: 0.00s; }
    .bayesian-opt-e0 { animation-delay: 0.00s; }
    .bayesian-opt-s1 { animation-delay: 1.28s; }
    .bayesian-opt-e1 { animation-delay: 1.28s; }
    .bayesian-opt-s2 { animation-delay: 2.56s; }
    .bayesian-opt-e2 { animation-delay: 2.56s; }
    .bayesian-opt-s3 { animation-delay: 3.84s; }
    .bayesian-opt-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .bayesian-opt-conn  { animation: bayesian-opt-trace 6.4s ease-in-out infinite; }
      .bayesian-opt-stage { animation: bayesian-opt-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes bayesian-opt-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes bayesian-opt-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .bayesian-opt-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .bayesian-opt-stage { animation: bayesian-opt-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes bayesian-opt-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="bayesian-opt-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="bayesian-opt-bg" width="980" height="322"/>
  <text class="bayesian-opt-h1"  x="30" y="40">Bayesian optimisation</text>
  <text class="bayesian-opt-sub" x="30" y="64">Four steps, looped.</text>
  <g class="bayesian-opt-stage bayesian-opt-s0">
    <rect class="bayesian-opt-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="bayesian-opt-step" x="44" y="142">01</text>
    <text class="bayesian-opt-name" x="70" y="142">Fit a cheap model of the objective</text>
    <text class="bayesian-opt-desc" x="44" y="166">Predicting score from</text>
    <text class="bayesian-opt-desc" x="44" y="182">hyperparameters, with</text>
    <text class="bayesian-opt-desc" x="44" y="198">uncertainty.</text>
  </g>
  <line class="bayesian-opt-line bayesian-opt-conn bayesian-opt-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#bayesian-opt-tip)"/>
  <g class="bayesian-opt-stage bayesian-opt-s1">
    <rect class="bayesian-opt-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="bayesian-opt-step" x="280" y="142">02</text>
    <text class="bayesian-opt-name" x="306" y="142">Use it to choose where to look next</text>
    <text class="bayesian-opt-desc" x="280" y="166">Balancing promise against</text>
    <text class="bayesian-opt-desc" x="280" y="182">uncertainty.</text>
  </g>
  <line class="bayesian-opt-line bayesian-opt-conn bayesian-opt-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#bayesian-opt-tip)"/>
  <g class="bayesian-opt-stage bayesian-opt-s2">
    <rect class="bayesian-opt-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="bayesian-opt-step" x="516" y="142">03</text>
    <text class="bayesian-opt-name" x="542" y="142">Actually train and evaluate there</text>
    <text class="bayesian-opt-desc" x="516" y="166">Which is the expensive step.</text>
  </g>
  <line class="bayesian-opt-line bayesian-opt-conn bayesian-opt-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#bayesian-opt-tip)"/>
  <g class="bayesian-opt-stage bayesian-opt-s3">
    <rect class="bayesian-opt-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="bayesian-opt-step" x="752" y="142">04</text>
    <text class="bayesian-opt-name" x="778" y="142">Then update the surrogate and repeat</text>
    <text class="bayesian-opt-desc" x="752" y="166">Each evaluation improving the</text>
    <text class="bayesian-opt-desc" x="752" y="182">next choice.</text>
    <text class="bayesian-opt-edge" x="752" y="242">sequential</text>
  </g>
  <text class="bayesian-opt-sub" x="30" y="304">The surrogate makes each expensive evaluation inform the next, which is the difference from random search — and it is also why it parallelises less well.</text>
</svg>
