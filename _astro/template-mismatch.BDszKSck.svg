<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The silent quality killer.">
  <title>Template mismatch</title>
  <style>
    .template-mismatch-bg   { fill: #f8fafc; }
    .template-mismatch-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .template-mismatch-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .template-mismatch-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .template-mismatch-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .template-mismatch-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .template-mismatch-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .template-mismatch-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .template-mismatch-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .template-mismatch-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .template-mismatch-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .template-mismatch-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .template-mismatch-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .template-mismatch-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .template-mismatch-stage { opacity: 1; }

    .template-mismatch-s0 { animation-delay: 0.00s; }
    .template-mismatch-e0 { animation-delay: 0.00s; }
    .template-mismatch-s1 { animation-delay: 1.28s; }
    .template-mismatch-e1 { animation-delay: 1.28s; }
    .template-mismatch-s2 { animation-delay: 2.56s; }
    .template-mismatch-e2 { animation-delay: 2.56s; }
    .template-mismatch-s3 { animation-delay: 3.84s; }
    .template-mismatch-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .template-mismatch-conn  { animation: template-mismatch-trace 6.4s ease-in-out infinite; }
      .template-mismatch-stage { animation: template-mismatch-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes template-mismatch-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes template-mismatch-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .template-mismatch-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .template-mismatch-stage { animation: template-mismatch-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes template-mismatch-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="template-mismatch-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="template-mismatch-bg" width="980" height="322"/>
  <text class="template-mismatch-h1"  x="30" y="40">Template mismatch</text>
  <text class="template-mismatch-sub" x="30" y="64">The silent quality killer.</text>
  <g class="template-mismatch-stage template-mismatch-s0">
    <rect class="template-mismatch-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="template-mismatch-step" x="44" y="142">01</text>
    <text class="template-mismatch-name" x="70" y="142">Every model was trained with a specific chat format</text>
    <text class="template-mismatch-desc" x="44" y="166">Specific markers, specific</text>
    <text class="template-mismatch-desc" x="44" y="182">whitespace.</text>
  </g>
  <line class="template-mismatch-line template-mismatch-conn template-mismatch-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#template-mismatch-tip)"/>
  <g class="template-mismatch-stage template-mismatch-s1">
    <rect class="template-mismatch-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="template-mismatch-step" x="280" y="142">02</text>
    <text class="template-mismatch-name" x="306" y="142">Using a different one still produces output</text>
    <text class="template-mismatch-desc" x="280" y="166">Fluent, and noticeably worse.</text>
  </g>
  <line class="template-mismatch-line template-mismatch-conn template-mismatch-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#template-mismatch-tip)"/>
  <g class="template-mismatch-stage template-mismatch-s2">
    <rect class="template-mismatch-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="template-mismatch-step" x="516" y="142">03</text>
    <text class="template-mismatch-name" x="542" y="142">With no error anywhere</text>
    <text class="template-mismatch-desc" x="516" y="166">Which is why it goes unnoticed</text>
    <text class="template-mismatch-desc" x="516" y="182">for weeks.</text>
  </g>
  <line class="template-mismatch-line template-mismatch-conn template-mismatch-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#template-mismatch-tip)"/>
  <g class="template-mismatch-stage template-mismatch-s3">
    <rect class="template-mismatch-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="template-mismatch-step" x="752" y="142">04</text>
    <text class="template-mismatch-name" x="778" y="142">So use the template shipped with the model</text>
    <text class="template-mismatch-desc" x="752" y="166">Rather than a generic one.</text>
  </g>
  <text class="template-mismatch-sub" x="30" y="304">This explains most reports that an open model is far worse than its benchmarks: the model is fine and the format it is being addressed in is wrong.</text>
</svg>
