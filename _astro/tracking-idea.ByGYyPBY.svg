<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four things, every time.">
  <title>What a tracked run records</title>
  <style>
    .tracking-idea-bg   { fill: #f8fafc; }
    .tracking-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tracking-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tracking-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tracking-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tracking-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tracking-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tracking-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tracking-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tracking-idea-stage { opacity: 1; }

    .tracking-idea-s0 { animation-delay: 0.00s; }
    .tracking-idea-e0 { animation-delay: 0.00s; }
    .tracking-idea-s1 { animation-delay: 1.28s; }
    .tracking-idea-e1 { animation-delay: 1.28s; }
    .tracking-idea-s2 { animation-delay: 2.56s; }
    .tracking-idea-e2 { animation-delay: 2.56s; }
    .tracking-idea-s3 { animation-delay: 3.84s; }
    .tracking-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tracking-idea-conn  { animation: tracking-idea-trace 6.4s ease-in-out infinite; }
      .tracking-idea-stage { animation: tracking-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tracking-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tracking-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tracking-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tracking-idea-stage { animation: tracking-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tracking-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tracking-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tracking-idea-bg" width="980" height="322"/>
  <text class="tracking-idea-h1"  x="30" y="40">What a tracked run records</text>
  <text class="tracking-idea-sub" x="30" y="64">Four things, every time.</text>
  <g class="tracking-idea-stage tracking-idea-s0">
    <rect class="tracking-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tracking-idea-step" x="44" y="142">01</text>
    <text class="tracking-idea-name" x="70" y="142">The configuration</text>
    <text class="tracking-idea-desc" x="44" y="166">Every hyperparameter, and the</text>
    <text class="tracking-idea-desc" x="44" y="182">code commit that ran.</text>
  </g>
  <line class="tracking-idea-line tracking-idea-conn tracking-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tracking-idea-tip)"/>
  <g class="tracking-idea-stage tracking-idea-s1">
    <rect class="tracking-idea-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tracking-idea-step" x="280" y="142">02</text>
    <text class="tracking-idea-name" x="306" y="142">The metrics over time</text>
    <text class="tracking-idea-desc" x="280" y="166">Loss and evaluation, per step,</text>
    <text class="tracking-idea-desc" x="280" y="182">not just the final number.</text>
  </g>
  <line class="tracking-idea-line tracking-idea-conn tracking-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tracking-idea-tip)"/>
  <g class="tracking-idea-stage tracking-idea-s2">
    <rect class="tracking-idea-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tracking-idea-step" x="516" y="142">03</text>
    <text class="tracking-idea-name" x="542" y="142">The artefacts</text>
    <text class="tracking-idea-desc" x="516" y="166">Checkpoints, and the dataset</text>
    <text class="tracking-idea-desc" x="516" y="182">version they were trained on.</text>
  </g>
  <line class="tracking-idea-line tracking-idea-conn tracking-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tracking-idea-tip)"/>
  <g class="tracking-idea-stage tracking-idea-s3">
    <rect class="tracking-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tracking-idea-step" x="752" y="142">04</text>
    <text class="tracking-idea-name" x="778" y="142">And the environment</text>
    <text class="tracking-idea-desc" x="752" y="166">Library versions, hardware,</text>
    <text class="tracking-idea-desc" x="752" y="182">random seeds.</text>
    <text class="tracking-idea-edge" x="752" y="242">often skipped</text>
  </g>
  <text class="tracking-idea-sub" x="30" y="304">The environment is the piece most often left out and the one that most often explains a result nobody can reproduce six months later.</text>
</svg>
