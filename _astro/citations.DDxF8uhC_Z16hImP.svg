<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Citations that can be checked</title>
  <style>
    .citations-bg   { fill: #f8fafc; }
    .citations-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .citations-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .citations-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .citations-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .citations-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .citations-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .citations-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .citations-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .citations-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .citations-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .citations-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .citations-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .citations-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .citations-stage { opacity: 1; }

    .citations-s0 { animation-delay: 0.00s; }
    .citations-e0 { animation-delay: 0.00s; }
    .citations-s1 { animation-delay: 1.28s; }
    .citations-e1 { animation-delay: 1.28s; }
    .citations-s2 { animation-delay: 2.56s; }
    .citations-e2 { animation-delay: 2.56s; }
    .citations-s3 { animation-delay: 3.84s; }
    .citations-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .citations-conn  { animation: citations-trace 6.4s ease-in-out infinite; }
      .citations-stage { animation: citations-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes citations-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes citations-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .citations-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .citations-stage { animation: citations-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes citations-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="citations-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="citations-bg" width="980" height="322"/>
  <text class="citations-h1"  x="30" y="40">Citations that can be checked</text>
  <text class="citations-sub" x="30" y="64">Four steps.</text>
  <g class="citations-stage citations-s0">
    <rect class="citations-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="citations-step" x="44" y="142">01</text>
    <text class="citations-name" x="70" y="142">Label each retrieved passage in the prompt</text>
    <text class="citations-desc" x="44" y="166">With a stable identifier.</text>
  </g>
  <line class="citations-line citations-conn citations-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#citations-tip)"/>
  <g class="citations-stage citations-s1">
    <rect class="citations-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="citations-step" x="280" y="142">02</text>
    <text class="citations-name" x="306" y="142">Instruct the model to cite those labels</text>
    <text class="citations-desc" x="280" y="166">Per claim, not per answer.</text>
  </g>
  <line class="citations-line citations-conn citations-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#citations-tip)"/>
  <g class="citations-stage citations-s2">
    <rect class="citations-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="citations-step" x="516" y="142">03</text>
    <text class="citations-name" x="542" y="142">Parse the citations out of the response</text>
    <text class="citations-desc" x="516" y="166">And resolve them to sources and</text>
    <text class="citations-desc" x="516" y="182">links.</text>
  </g>
  <line class="citations-line citations-conn citations-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#citations-tip)"/>
  <g class="citations-stage citations-s3">
    <rect class="citations-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="citations-step" x="752" y="142">04</text>
    <text class="citations-name" x="778" y="142">Then verify each claim against its cited passage</text>
    <text class="citations-desc" x="752" y="166">Because a citation can be</text>
    <text class="citations-desc" x="752" y="182">attached to an unsupported</text>
    <text class="citations-desc" x="752" y="198">claim.</text>
  </g>
  <text class="citations-sub" x="30" y="304">Verifying the citation rather than trusting it is the step that closes the loop: a model can cite a passage that does not in fact support what it just said.</text>
</svg>
