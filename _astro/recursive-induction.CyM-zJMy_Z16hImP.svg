<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps, repeated.">
  <title>Growing the tree</title>
  <style>
    .recursive-induction-bg   { fill: #f8fafc; }
    .recursive-induction-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recursive-induction-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recursive-induction-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recursive-induction-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recursive-induction-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recursive-induction-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .recursive-induction-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .recursive-induction-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .recursive-induction-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .recursive-induction-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .recursive-induction-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .recursive-induction-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .recursive-induction-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .recursive-induction-stage { opacity: 1; }

    .recursive-induction-s0 { animation-delay: 0.00s; }
    .recursive-induction-e0 { animation-delay: 0.00s; }
    .recursive-induction-s1 { animation-delay: 1.28s; }
    .recursive-induction-e1 { animation-delay: 1.28s; }
    .recursive-induction-s2 { animation-delay: 2.56s; }
    .recursive-induction-e2 { animation-delay: 2.56s; }
    .recursive-induction-s3 { animation-delay: 3.84s; }
    .recursive-induction-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .recursive-induction-conn  { animation: recursive-induction-trace 6.4s ease-in-out infinite; }
      .recursive-induction-stage { animation: recursive-induction-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes recursive-induction-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes recursive-induction-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .recursive-induction-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .recursive-induction-stage { animation: recursive-induction-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes recursive-induction-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="recursive-induction-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="recursive-induction-bg" width="980" height="322"/>
  <text class="recursive-induction-h1"  x="30" y="40">Growing the tree</text>
  <text class="recursive-induction-sub" x="30" y="64">Four steps, repeated.</text>
  <g class="recursive-induction-stage recursive-induction-s0">
    <rect class="recursive-induction-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="recursive-induction-step" x="44" y="142">01</text>
    <text class="recursive-induction-name" x="70" y="142">Start with all the data at the root</text>
    <text class="recursive-induction-desc" x="44" y="166">One node, maximally impure.</text>
  </g>
  <line class="recursive-induction-line recursive-induction-conn recursive-induction-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#recursive-induction-tip)"/>
  <g class="recursive-induction-stage recursive-induction-s1">
    <rect class="recursive-induction-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="recursive-induction-step" x="280" y="142">02</text>
    <text class="recursive-induction-name" x="306" y="142">Find the split that reduces impurity most</text>
    <text class="recursive-induction-desc" x="280" y="166">Searching every feature and</text>
    <text class="recursive-induction-desc" x="280" y="182">threshold.</text>
  </g>
  <line class="recursive-induction-line recursive-induction-conn recursive-induction-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#recursive-induction-tip)"/>
  <g class="recursive-induction-stage recursive-induction-s2">
    <rect class="recursive-induction-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="recursive-induction-step" x="516" y="142">03</text>
    <text class="recursive-induction-name" x="542" y="142">Partition the data and recurse on each side</text>
    <text class="recursive-induction-desc" x="516" y="166">Independently, with no</text>
    <text class="recursive-induction-desc" x="516" y="182">communication between branches.</text>
  </g>
  <line class="recursive-induction-line recursive-induction-conn recursive-induction-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#recursive-induction-tip)"/>
  <g class="recursive-induction-stage recursive-induction-s3">
    <rect class="recursive-induction-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="recursive-induction-step" x="752" y="142">04</text>
    <text class="recursive-induction-name" x="778" y="142">Stopping when pure, too small, or too deep</text>
    <text class="recursive-induction-desc" x="752" y="166">Whichever comes first.</text>
  </g>
  <text class="recursive-induction-sub" x="30" y="304">Branches never communicating is what makes the procedure fast and what makes it greedy: a split that would help both sides cannot be discovered.</text>
</svg>
