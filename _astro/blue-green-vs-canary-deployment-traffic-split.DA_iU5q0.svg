<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Blue-Green vs Canary Deployment Traffic Split">
  <title>Blue-Green vs Canary Deployment Traffic Split</title>
  <defs>
    <style>
      .d337b-bg { fill: #f8fafc; }
      .d337b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d337b-bgd { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d337b-can { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d337b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d337b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d337b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d337b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d337b-bg" />
  
  <text x="40" y="40" class="d337a-title">Deployment Strategies: Blue-Green vs Canary</text>
  <text x="40" y="65" class="d337a-subtitle">Blue-Green vs Canary Deployment Traffic Split comparing instantaneous 100% Blue-to-Green cutover against progressive 5% to 25% to 100% Canary traffic ramp-up with automated rollback on error spikes</text>
  
  <!-- Blue-Green -->
  <rect x="40" y="110" width="390" height="270" class="d337b-bgd" />
  <text x="60" y="145" class="d337b-header" fill="#1d4ed8">Blue-Green Deployment (Instant Switch)</text>
  <text x="60" y="180" class="d337b-text">• **Blue (Active):** v1.0 Serving 100% traffic</text>
  <text x="60" y="205" class="d337b-text">• **Green (Staging):** v2.0 Warm &amp; Verified</text>
  <text x="60" y="230" class="d337b-text">• **Cutover:** Router flips 100% traffic instantly</text>
  <text x="60" y="255" class="d337b-text">• **Rollback:** Instant flip back to Blue in 500ms</text>
  <text x="60" y="280" class="d337b-text">• **Trade-off:** Requires 2x GPU hardware during flip</text>
  <text x="60" y="320" class="d337b-text" font-weight="600" fill="#1d4ed8">Best For: Major Model Version Upgrades</text>
  
  <!-- Canary -->
  <rect x="470" y="110" width="390" height="270" class="d337b-can" />
  <text x="490" y="145" class="d337b-header" fill="#15803d">Canary Deployment (Progressive Rollout)</text>
  <text x="490" y="180" class="d337b-text">• **Step 1 (Canary):** 5% user traffic routed to v2.0</text>
  <text x="490" y="205" class="d337b-text">• **SRE Evaluation:** Monitor P99 latency &amp; 5xx errors</text>
  <text x="490" y="230" class="d337b-text">• **Step 2 (Ramp):** 25% ➔ 50% ➔ 100% over 2 hours</text>
  <text x="490" y="255" class="d337b-text">• **Safety:** Auto-rollback if error rate &gt; 0.5%</text>
  <text x="490" y="280" class="d337b-text">• **Benefit:** Minimal extra GPU capacity needed</text>
  <text x="490" y="320" class="d337b-text" font-weight="600" fill="#15803d">Best For: Incremental Code &amp; Prompt Updates</text>
</svg>