<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things an analysis report is not</title>
  <style>
    .eda-not-bg   { fill: #f8fafc; }
    .eda-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eda-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eda-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eda-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eda-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eda-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eda-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eda-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eda-not-row { opacity: 1; }
    .eda-not-r0 { animation-delay: 0.00s; }
    .eda-not-r1 { animation-delay: 0.45s; }
    .eda-not-r2 { animation-delay: 0.90s; }
    .eda-not-r3 { animation-delay: 1.35s; }
    .eda-not-r4 { animation-delay: 1.80s; }
    .eda-not-row { animation: eda-not-reveal 7.3s ease-in-out infinite; }
    @keyframes eda-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="eda-not-bg" width="980" height="390"/>
  <text class="eda-not-h1"  x="30" y="40">Four things an analysis report is not</text>
  <text class="eda-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="eda-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="eda-not-name" x="46" y="122">The misconception</text>
  <text class="eda-not-desc" x="46" y="142">Commonly held.</text>
  <text class="eda-not-desc eda-not-row eda-not-r0" x="46" y="182">A notebook is a report</text>
  <text class="eda-not-desc eda-not-row eda-not-r1" x="46" y="216">More charts means more thorough</text>
  <text class="eda-not-desc eda-not-row eda-not-r2" x="46" y="250">Exploratory findings are conclusions</text>
  <text class="eda-not-desc eda-not-row eda-not-r3" x="46" y="284">The audience will read the code</text>
  <text class="eda-not-desc eda-not-row eda-not-r4" x="46" y="318">Uncertainty can be left implicit</text>
  <rect class="eda-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="eda-not-name" x="526" y="122">What is true</text>
  <text class="eda-not-desc" x="526" y="142">Actually.</text>
  <text class="eda-not-desc eda-not-row eda-not-r0" x="526" y="182">A notebook is a working document</text>
  <text class="eda-not-desc eda-not-row eda-not-r1" x="526" y="216">Selection is what makes it useful</text>
  <text class="eda-not-desc eda-not-row eda-not-r2" x="526" y="250">They are hypotheses to test</text>
  <text class="eda-not-desc eda-not-row eda-not-r3" x="526" y="284">They read the summary, if that</text>
  <text class="eda-not-desc eda-not-row eda-not-r4" x="526" y="318">Implicit uncertainty is read as none</text>
  <text class="eda-not-sub" x="30" y="372">Implicit uncertainty being read as none is the failure that turns an exploratory finding into a decision, which is why it must be stated in words.</text>
</svg>
