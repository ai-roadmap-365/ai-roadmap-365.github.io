<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Ad-hoc, then specified.">
  <title>The same task, twice</title>
  <style>
    .idempotency-case-bg   { fill: #f8fafc; }
    .idempotency-case-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .idempotency-case-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .idempotency-case-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .idempotency-case-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .idempotency-case-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .idempotency-case-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .idempotency-case-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .idempotency-case-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .idempotency-case-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .idempotency-case-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .idempotency-case-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .idempotency-case-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .idempotency-case-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .idempotency-case-stage { opacity: 1; }

    .idempotency-case-s0 { animation-delay: 0.00s; }
    .idempotency-case-e0 { animation-delay: 0.00s; }
    .idempotency-case-s1 { animation-delay: 1.28s; }
    .idempotency-case-e1 { animation-delay: 1.28s; }
    .idempotency-case-s2 { animation-delay: 2.56s; }
    .idempotency-case-e2 { animation-delay: 2.56s; }
    .idempotency-case-s3 { animation-delay: 3.84s; }
    .idempotency-case-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .idempotency-case-conn  { animation: idempotency-case-trace 6.4s ease-in-out infinite; }
      .idempotency-case-stage { animation: idempotency-case-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes idempotency-case-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes idempotency-case-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .idempotency-case-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .idempotency-case-stage { animation: idempotency-case-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes idempotency-case-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="idempotency-case-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="idempotency-case-bg" width="980" height="322"/>
  <text class="idempotency-case-h1"  x="30" y="40">The same task, twice</text>
  <text class="idempotency-case-sub" x="30" y="64">Ad-hoc, then specified.</text>
  <g class="idempotency-case-stage idempotency-case-s0">
    <rect class="idempotency-case-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="idempotency-case-step" x="44" y="142">01</text>
    <text class="idempotency-case-name" x="70" y="142">"Add idempotency keys to all payment routes"</text>
    <text class="idempotency-case-desc" x="44" y="166">A custom table in routes.py,</text>
    <text class="idempotency-case-desc" x="44" y="182">broken signatures, a race</text>
    <text class="idempotency-case-desc" x="44" y="198">condition.</text>
  </g>
  <line class="idempotency-case-line idempotency-case-conn idempotency-case-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#idempotency-case-tip)"/>
  <g class="idempotency-case-stage idempotency-case-s1">
    <rect class="idempotency-case-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="idempotency-case-step" x="280" y="142">02</text>
    <text class="idempotency-case-name" x="306" y="142">A 400-word specification</text>
    <text class="idempotency-case-desc" x="280" y="166">Redis SET NX EX for the lock;</text>
    <text class="idempotency-case-desc" x="280" y="182">cached response under a keyed</text>
    <text class="idempotency-case-desc" x="280" y="198">namespace.</text>
  </g>
  <line class="idempotency-case-line idempotency-case-conn idempotency-case-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#idempotency-case-tip)"/>
  <g class="idempotency-case-stage idempotency-case-s2">
    <rect class="idempotency-case-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="idempotency-case-step" x="516" y="142">03</text>
    <text class="idempotency-case-name" x="542" y="142">With non-goals</text>
    <text class="idempotency-case-desc" x="516" y="166">No schema changes. No public</text>
    <text class="idempotency-case-desc" x="516" y="182">signature changes.</text>
    <text class="idempotency-case-edge" x="516" y="242">bounded</text>
  </g>
  <line class="idempotency-case-line idempotency-case-conn idempotency-case-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#idempotency-case-tip)"/>
  <g class="idempotency-case-stage idempotency-case-s3">
    <rect class="idempotency-case-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="idempotency-case-step" x="752" y="142">04</text>
    <text class="idempotency-case-name" x="778" y="142">And an acceptance gate</text>
    <text class="idempotency-case-desc" x="752" y="166">20 concurrent identical keys:</text>
    <text class="idempotency-case-desc" x="752" y="182">exactly 1 charge, 19 cached</text>
    <text class="idempotency-case-desc" x="752" y="198">responses.</text>
    <text class="idempotency-case-edge" x="752" y="242">8 minutes</text>
  </g>
  <text class="idempotency-case-sub" x="30" y="304">The acceptance gate is what makes the second attempt trustworthy rather than merely tidier: it states the concurrency property in a form the agent can run, so "done" is measured rather than declared.</text>
</svg>
