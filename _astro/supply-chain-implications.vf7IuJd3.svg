<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And the scan costs nothing.">
  <title>The rare case where security is faster</title>
  <style>
    .supply-chain-implications-bg   { fill: #f8fafc; }
    .supply-chain-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .supply-chain-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .supply-chain-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .supply-chain-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .supply-chain-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .supply-chain-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .supply-chain-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .supply-chain-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .supply-chain-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .supply-chain-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .supply-chain-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .supply-chain-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .supply-chain-implications-row { opacity: 1; }
    .supply-chain-implications-r0 { animation-delay: 0.00s; }
    .supply-chain-implications-r1 { animation-delay: 0.45s; }
    .supply-chain-implications-r2 { animation-delay: 0.90s; }
    .supply-chain-implications-r3 { animation-delay: 1.35s; }
    .supply-chain-implications-r4 { animation-delay: 1.80s; }
    .supply-chain-implications-row { animation: supply-chain-implications-reveal 7.3s ease-in-out infinite; }
    @keyframes supply-chain-implications-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="supply-chain-implications-bg" width="980" height="390"/>
  <text class="supply-chain-implications-h1"  x="30" y="40">The rare case where security is faster</text>
  <text class="supply-chain-implications-sub" x="30" y="64">And the scan costs nothing.</text>
  <rect class="supply-chain-implications-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="supply-chain-implications-name" x="46" y="122">What it costs</text>
  <text class="supply-chain-implications-desc" x="46" y="142">Almost nothing.</text>
  <text class="supply-chain-implications-desc supply-chain-implications-row supply-chain-implications-r0" x="46" y="182">ModelScan: under 2 seconds on 14 GB</text>
  <text class="supply-chain-implications-desc supply-chain-implications-row supply-chain-implications-r1" x="46" y="216">A conversion step, once per model</text>
  <text class="supply-chain-implications-desc supply-chain-implications-row supply-chain-implications-r2" x="46" y="250">A signing step in CI</text>
  <text class="supply-chain-implications-desc supply-chain-implications-row supply-chain-implications-r3" x="46" y="284">An admission webhook to operate</text>
  <text class="supply-chain-implications-desc supply-chain-implications-row supply-chain-implications-r4" x="46" y="318">No per-request overhead at all</text>
  <rect class="supply-chain-implications-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="supply-chain-implications-name" x="526" y="122">What it gives</text>
  <text class="supply-chain-implications-desc" x="526" y="142">Speed, as well as safety.</text>
  <text class="supply-chain-implications-desc supply-chain-implications-row supply-chain-implications-r0" x="526" y="182">Up to 4x faster loads</text>
  <text class="supply-chain-implications-desc supply-chain-implications-row supply-chain-implications-r1" x="526" y="216">mmap, so no deserialisation pass</text>
  <text class="supply-chain-implications-desc supply-chain-implications-row supply-chain-implications-r2" x="526" y="250">Cold start 90s to under 15s</text>
  <text class="supply-chain-implications-desc supply-chain-implications-row supply-chain-implications-r3" x="526" y="284">RCE class eliminated</text>
  <text class="supply-chain-implications-desc supply-chain-implications-row supply-chain-implications-r4" x="526" y="318">And an inventory to answer a CVE with</text>
  <text class="supply-chain-implications-sub" x="30" y="372">Security controls usually cost performance, and this is the exception worth using in the argument: the safe format is also the fast one, so adopting it needs no trade to be justified.</text>
</svg>
