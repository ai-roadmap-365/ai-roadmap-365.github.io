<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One of them is "usually a good idea".">
  <title>Three things a multi-agent system is not</title>
  <style>
    .mas-not-groupchat-bg   { fill: #f8fafc; }
    .mas-not-groupchat-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mas-not-groupchat-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mas-not-groupchat-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mas-not-groupchat-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mas-not-groupchat-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mas-not-groupchat-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mas-not-groupchat-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mas-not-groupchat-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mas-not-groupchat-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mas-not-groupchat-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mas-not-groupchat-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mas-not-groupchat-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mas-not-groupchat-row { opacity: 1; }
    .mas-not-groupchat-r0 { animation-delay: 0.00s; }
    .mas-not-groupchat-r1 { animation-delay: 0.45s; }
    .mas-not-groupchat-r2 { animation-delay: 0.90s; }
    .mas-not-groupchat-r3 { animation-delay: 1.35s; }
    .mas-not-groupchat-r4 { animation-delay: 1.80s; }
    .mas-not-groupchat-row { animation: mas-not-groupchat-reveal 7.3s ease-in-out infinite; }
    @keyframes mas-not-groupchat-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="mas-not-groupchat-bg" width="980" height="390"/>
  <text class="mas-not-groupchat-h1"  x="30" y="40">Three things a multi-agent system is not</text>
  <text class="mas-not-groupchat-sub" x="30" y="64">One of them is "usually a good idea".</text>
  <rect class="mas-not-groupchat-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="mas-not-groupchat-name" x="46" y="122">What it is</text>
  <text class="mas-not-groupchat-desc" x="46" y="142">Structured and bounded.</text>
  <text class="mas-not-groupchat-desc mas-not-groupchat-row mas-not-groupchat-r0" x="46" y="182">Discrete instances passing structured messages</text>
  <text class="mas-not-groupchat-desc mas-not-groupchat-row mas-not-groupchat-r1" x="46" y="216">An explicit topology</text>
  <text class="mas-not-groupchat-desc mas-not-groupchat-row mas-not-groupchat-r2" x="46" y="250">Explicit termination conditions</text>
  <text class="mas-not-groupchat-desc mas-not-groupchat-row mas-not-groupchat-r3" x="46" y="284">Independent prompts and tool inventories</text>
  <text class="mas-not-groupchat-desc mas-not-groupchat-row mas-not-groupchat-r4" x="46" y="318">Isolated contexts per agent</text>
  <rect class="mas-not-groupchat-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="mas-not-groupchat-name" x="526" y="122">Three misconceptions</text>
  <text class="mas-not-groupchat-desc" x="526" y="142">All expensive.</text>
  <text class="mas-not-groupchat-desc mas-not-groupchat-row mas-not-groupchat-r0" x="526" y="182">An open group chat with pleasantries</text>
  <text class="mas-not-groupchat-desc mas-not-groupchat-row mas-not-groupchat-r1" x="526" y="216">A silver bullet for simple tasks</text>
  <text class="mas-not-groupchat-desc mas-not-groupchat-row mas-not-groupchat-r2" x="526" y="250">One agent is faster, cheaper and more reliable</text>
  <text class="mas-not-groupchat-desc mas-not-groupchat-row mas-not-groupchat-r3" x="526" y="284">A shared giant context window</text>
  <text class="mas-not-groupchat-desc mas-not-groupchat-row mas-not-groupchat-r4" x="526" y="318">Which defeats the entire purpose</text>
  <text class="mas-not-groupchat-sub" x="30" y="372">The middle row deserves weight: multi-agent systems multiply latency and cost, and for a straightforward query the single agent wins on every axis that matters.</text>
</svg>
