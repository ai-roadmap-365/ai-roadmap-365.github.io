<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Structural conditioning</title>
  <style>
    .controlnet-bg   { fill: #f8fafc; }
    .controlnet-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .controlnet-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .controlnet-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .controlnet-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .controlnet-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .controlnet-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .controlnet-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .controlnet-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .controlnet-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .controlnet-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .controlnet-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .controlnet-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .controlnet-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .controlnet-stage { opacity: 1; }

    .controlnet-s0 { animation-delay: 0.00s; }
    .controlnet-e0 { animation-delay: 0.00s; }
    .controlnet-s1 { animation-delay: 1.28s; }
    .controlnet-e1 { animation-delay: 1.28s; }
    .controlnet-s2 { animation-delay: 2.56s; }
    .controlnet-e2 { animation-delay: 2.56s; }
    .controlnet-s3 { animation-delay: 3.84s; }
    .controlnet-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .controlnet-conn  { animation: controlnet-trace 6.4s ease-in-out infinite; }
      .controlnet-stage { animation: controlnet-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes controlnet-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes controlnet-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .controlnet-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .controlnet-stage { animation: controlnet-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes controlnet-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="controlnet-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="controlnet-bg" width="980" height="322"/>
  <text class="controlnet-h1"  x="30" y="40">Structural conditioning</text>
  <text class="controlnet-sub" x="30" y="64">Four steps.</text>
  <g class="controlnet-stage controlnet-s0">
    <rect class="controlnet-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="controlnet-step" x="44" y="142">01</text>
    <text class="controlnet-name" x="70" y="142">A prompt cannot specify exact layout</text>
    <text class="controlnet-desc" x="44" y="166">Pose, edges, depth, composition.</text>
  </g>
  <line class="controlnet-line controlnet-conn controlnet-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#controlnet-tip)"/>
  <g class="controlnet-stage controlnet-s1">
    <rect class="controlnet-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="controlnet-step" x="280" y="142">02</text>
    <text class="controlnet-name" x="306" y="142">Extract that structure from a reference image</text>
    <text class="controlnet-desc" x="280" y="166">As edges, a depth map or a pose</text>
    <text class="controlnet-desc" x="280" y="182">skeleton.</text>
  </g>
  <line class="controlnet-line controlnet-conn controlnet-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#controlnet-tip)"/>
  <g class="controlnet-stage controlnet-s2">
    <rect class="controlnet-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="controlnet-step" x="516" y="142">03</text>
    <text class="controlnet-name" x="542" y="142">Feed it through a parallel network into the denoiser</text>
    <text class="controlnet-desc" x="516" y="166">Alongside the text condition.</text>
  </g>
  <line class="controlnet-line controlnet-conn controlnet-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#controlnet-tip)"/>
  <g class="controlnet-stage controlnet-s3">
    <rect class="controlnet-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="controlnet-step" x="752" y="142">04</text>
    <text class="controlnet-name" x="778" y="142">So the structure is preserved and the style is generated</text>
    <text class="controlnet-desc" x="752" y="166">Which makes it a design tool.</text>
    <text class="controlnet-edge" x="752" y="242">controllable</text>
  </g>
  <text class="controlnet-sub" x="30" y="304">This is what moved image generation from producing images to producing images to specification, which is the difference between a novelty and a production tool.</text>
</svg>
