<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The design matrix</title>
  <style>
    .design-matrix-bg   { fill: #f8fafc; }
    .design-matrix-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-matrix-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-matrix-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-matrix-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-matrix-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-matrix-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .design-matrix-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .design-matrix-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .design-matrix-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .design-matrix-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .design-matrix-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .design-matrix-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .design-matrix-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .design-matrix-stage { opacity: 1; }

    .design-matrix-s0 { animation-delay: 0.00s; }
    .design-matrix-e0 { animation-delay: 0.00s; }
    .design-matrix-s1 { animation-delay: 1.28s; }
    .design-matrix-e1 { animation-delay: 1.28s; }
    .design-matrix-s2 { animation-delay: 2.56s; }
    .design-matrix-e2 { animation-delay: 2.56s; }
    .design-matrix-s3 { animation-delay: 3.84s; }
    .design-matrix-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .design-matrix-conn  { animation: design-matrix-trace 6.4s ease-in-out infinite; }
      .design-matrix-stage { animation: design-matrix-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes design-matrix-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes design-matrix-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .design-matrix-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .design-matrix-stage { animation: design-matrix-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes design-matrix-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="design-matrix-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="design-matrix-bg" width="980" height="322"/>
  <text class="design-matrix-h1"  x="30" y="40">The design matrix</text>
  <text class="design-matrix-sub" x="30" y="64">Four steps.</text>
  <g class="design-matrix-stage design-matrix-s0">
    <rect class="design-matrix-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="design-matrix-step" x="44" y="142">01</text>
    <text class="design-matrix-name" x="70" y="142">The solver sees a matrix of columns</text>
    <text class="design-matrix-desc" x="44" y="166">Not a list of conceptual</text>
    <text class="design-matrix-desc" x="44" y="182">predictors.</text>
  </g>
  <line class="design-matrix-line design-matrix-conn design-matrix-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#design-matrix-tip)"/>
  <g class="design-matrix-stage design-matrix-s1">
    <rect class="design-matrix-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="design-matrix-step" x="280" y="142">02</text>
    <text class="design-matrix-name" x="306" y="142">A squared term is a column like any other</text>
    <text class="design-matrix-desc" x="280" y="166">With no special status.</text>
  </g>
  <line class="design-matrix-line design-matrix-conn design-matrix-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#design-matrix-tip)"/>
  <g class="design-matrix-stage design-matrix-s2">
    <rect class="design-matrix-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="design-matrix-step" x="516" y="142">03</text>
    <text class="design-matrix-name" x="542" y="142">So a two-predictor model with squares and an interaction has five columns</text>
    <text class="design-matrix-desc" x="516" y="166">And behaves like a five-column</text>
    <text class="design-matrix-desc" x="516" y="182">model.</text>
  </g>
  <line class="design-matrix-line design-matrix-conn design-matrix-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#design-matrix-tip)"/>
  <g class="design-matrix-stage design-matrix-s3">
    <rect class="design-matrix-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="design-matrix-step" x="752" y="142">04</text>
    <text class="design-matrix-name" x="778" y="142">Which is why complexity grows faster than it appears</text>
    <text class="design-matrix-desc" x="752" y="166">And why collinearity arrives</text>
    <text class="design-matrix-desc" x="752" y="182">sooner than expected.</text>
  </g>
  <text class="design-matrix-sub" x="30" y="304">Counting columns rather than predictors is the mental shift that makes polynomial expansion's cost visible before it becomes a problem.</text>
</svg>
