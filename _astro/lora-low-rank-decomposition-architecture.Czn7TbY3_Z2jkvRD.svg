<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="LoRA Low-Rank Decomposition Architecture">
  <title>LoRA Low-Rank Decomposition Architecture</title>
  <rect width="100%" height="100%" fill="#f8fafc" />
  
    <style>
      .d275a-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d275a-header { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .d275a-text { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .d275a-accent { fill: #1d4ed8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .d275a-arrow { stroke: #1d4ed8; stroke-width: 2; stroke-linecap: round; marker-end: url(#d275a-arrowhead); }
      .d275a-pulse { animation: d275a-glow 2.5s infinite ease-in-out; }
      @keyframes d275a-glow {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(29, 78, 216, 0.2)); }
        50% { filter: drop-shadow(0 0 6px rgba(29, 78, 216, 0.6)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .d275a-pulse { animation: none; }
      }
    </style>
    
  
    <defs>
      <marker id="d275a-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8" />
      </marker>
    </defs>
    
  
  <g transform="translate(50, 40)">
    <rect class="d275a-box" x="0" y="0" width="220" height="240" />
    <text class="d275a-header" x="20" y="35">Frozen Base Weight W0</text>
    <text class="d275a-text" x="20" y="70">Dimension: d x k</text>
    <text class="d275a-text" x="20" y="100">Parameters: 4,096 x 4,096</text>
    <text class="d275a-text" x="20" y="130">= 16,777,216 params</text>
    <text class="d275a-accent" x="20" y="180">STATUS: FROZEN (No Grad)</text>
  </g>
  <g transform="translate(320, 40)">
    <rect class="d275a-box d275a-pulse" x="0" y="0" width="180" height="100" />
    <text class="d275a-header" x="15" y="30">Adapter Matrix A</text>
    <text class="d275a-text" x="15" y="55">Dim: r x k (r=8, k=4096)</text>
    <text class="d275a-accent" x="15" y="80">Params: 32,768</text>

    <text class="d275a-header" x="80" y="125">+</text>

    <rect class="d275a-box d275a-pulse" x="0" y="140" width="180" height="100" />
    <text class="d275a-header" x="15" y="30">Adapter Matrix B</text>
    <text class="d275a-text" x="15" y="55">Dim: d x r (d=4096, r=8)</text>
    <text class="d275a-accent" x="15" y="80">Params: 32,768</text>
  </g>
  <g transform="translate(550, 100)">
    <rect class="d275a-box" x="0" y="0" width="200" height="120" />
    <text class="d275a-header" x="20" y="35">Forward Pass</text>
    <text class="d275a-text" x="20" y="65">h = W0*x + (a/r)*B*A*x</text>
    <text class="d275a-accent" x="20" y="95">Trainable: 0.39%</text>
  </g>

</svg>