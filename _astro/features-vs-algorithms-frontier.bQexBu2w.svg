<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="Features vs Algorithms Frontier Diagram">
  <title>The Machine Learning Performance Frontier</title>
  <defs>
    <style>
      .d175a-bg { fill: #f8fafc; }
      .d175a-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d175a-header { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; }
      .d175a-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
      .d175a-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
      .d175a-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 11px; font-weight: 600; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="d175a-bg" />

  <text x="40" y="45" class="d175a-header" font-size="22">The Machine Learning Performance Frontier</text>
  <text x="40" y="70" class="d175a-text" font-size="13">"Better Features Beat a Clever Algorithm; Better Data Beats All" (Halevy, Norvig, Pereira, 2009)</text>

  <!-- Left: Performance Trajectory Chart -->
  <rect x="40" y="100" width="480" height="340" class="d175a-box" />
  <text x="60" y="130" class="d175a-title" fill="#1e293b">Empirical Model Performance vs Engineering Focus</text>

  <!-- Axes -->
  <line x1="80" y1="380" x2="480" y2="380" stroke="#94a3b8" stroke-width="2" />
  <line x1="80" y1="380" x2="80" y2="160" stroke="#94a3b8" stroke-width="2" />
  <text x="220" y="415" class="d175a-text" font-weight="700">Engineering Investment Area</text>
  <text x="40" y="150" class="d175a-text" font-weight="700" transform="rotate(-90 40,150)">Accuracy (R² / AUC)</text>

  <!-- Curve A: Algorithm Tuning on Raw Data (Plateaus low) -->
  <path d="M 80 340 Q 200 320 450 300" stroke="#ef4444" stroke-width="3" fill="none" />
  <circle cx="450" cy="300" r="5" fill="#ef4444" />
  <text x="250" y="290" class="d175a-math" fill="#b91c1c">Complex Ensemble on Raw Features (Plateau!)</text>

  <!-- Curve B: Feature Engineering with Simple Linear Model (Soars!) -->
  <path d="M 80 340 Q 220 220 450 180" stroke="#22c55e" stroke-width="3" fill="none" />
  <circle cx="450" cy="180" r="6" fill="#22c55e" />
  <text x="200" y="170" class="d175a-math" fill="#15803d">Simple Ridge on Engineered Domain Features (+60% Gain!)</text>

  <!-- Right: Comparison Breakdown Card -->
  <rect x="540" y="100" width="320" height="340" class="d175a-box" fill="#f0fdf4" stroke="#22c55e" />
  <text x="560" y="130" class="d175a-title" fill="#15803d">The Production ROI Comparison</text>

  <!-- Feature-Engineered Model -->
  <rect x="560" y="150" width="280" height="110" fill="#ffffff" stroke="#86efac" rx="6" />
  <text x="575" y="175" class="d175a-title" fill="#15803d">Engineered Linear Model</text>
  <text x="575" y="195" class="d175a-text">• Test R²: <tspan font-weight="700" fill="#15803d">0.9892</tspan> (Peak Accuracy)</text>
  <text x="575" y="215" class="d175a-text">• Latency: <tspan font-weight="700">0.08 ms</tspan> (100x Faster!)</text>
  <text x="575" y="235" class="d175a-text">• Explainability: 100% Linear Weights</text>

  <!-- Raw Complex Model -->
  <rect x="560" y="280" width="280" height="110" fill="#fef2f2" stroke="#fca5a5" rx="6" />
  <text x="575" y="305" class="d175a-title" fill="#b91c1c">Raw Complex Ensemble</text>
  <text x="575" y="325" class="d175a-text">• Test R²: 0.3541 (Bottlenecked!)</text>
  <text x="575" y="345" class="d175a-text">• Latency: 12.50 ms (Slow tree traversal)</text>
  <text x="575" y="365" class="d175a-text">• Explainability: Black-box opacity</text>

  <text x="560" y="420" class="d175a-math" fill="#15803d">Conclusion: Representation is King</text>
</svg>
