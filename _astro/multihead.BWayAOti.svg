<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Several attentions, at the same cost.">
  <title>Multi-head attention</title>
  <style>
    .multihead-bg   { fill: #f8fafc; }
    .multihead-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multihead-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multihead-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multihead-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multihead-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multihead-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .multihead-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .multihead-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .multihead-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .multihead-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .multihead-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .multihead-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .multihead-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .multihead-stage { opacity: 1; }

    .multihead-s0 { animation-delay: 0.00s; }
    .multihead-e0 { animation-delay: 0.00s; }
    .multihead-s1 { animation-delay: 1.28s; }
    .multihead-e1 { animation-delay: 1.28s; }
    .multihead-s2 { animation-delay: 2.56s; }
    .multihead-e2 { animation-delay: 2.56s; }
    .multihead-s3 { animation-delay: 3.84s; }
    .multihead-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .multihead-conn  { animation: multihead-trace 6.4s ease-in-out infinite; }
      .multihead-stage { animation: multihead-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes multihead-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes multihead-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .multihead-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .multihead-stage { animation: multihead-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes multihead-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="multihead-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="multihead-bg" width="980" height="322"/>
  <text class="multihead-h1"  x="30" y="40">Multi-head attention</text>
  <text class="multihead-sub" x="30" y="64">Several attentions, at the same cost.</text>
  <g class="multihead-stage multihead-s0">
    <rect class="multihead-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="multihead-step" x="44" y="142">01</text>
    <text class="multihead-name" x="70" y="142">Project into h narrower subspaces</text>
    <text class="multihead-desc" x="44" y="166">Each head gets the model</text>
    <text class="multihead-desc" x="44" y="182">dimension divided by the head</text>
    <text class="multihead-desc" x="44" y="198">count.</text>
  </g>
  <line class="multihead-line multihead-conn multihead-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#multihead-tip)"/>
  <g class="multihead-stage multihead-s1">
    <rect class="multihead-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="multihead-step" x="280" y="142">02</text>
    <text class="multihead-name" x="306" y="142">Run attention in each, independently</text>
    <text class="multihead-desc" x="280" y="166">Different heads learn different</text>
    <text class="multihead-desc" x="280" y="182">relationships.</text>
    <text class="multihead-edge" x="280" y="242">parallel</text>
  </g>
  <line class="multihead-line multihead-conn multihead-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#multihead-tip)"/>
  <g class="multihead-stage multihead-s2">
    <rect class="multihead-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="multihead-step" x="516" y="142">03</text>
    <text class="multihead-name" x="542" y="142">Concatenate the results</text>
    <text class="multihead-desc" x="516" y="166">Back to the full model</text>
    <text class="multihead-desc" x="516" y="182">dimension.</text>
  </g>
  <line class="multihead-line multihead-conn multihead-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#multihead-tip)"/>
  <g class="multihead-stage multihead-s3">
    <rect class="multihead-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="multihead-step" x="752" y="142">04</text>
    <text class="multihead-name" x="778" y="142">And project once more</text>
    <text class="multihead-desc" x="752" y="166">Mixing what the heads found.</text>
    <text class="multihead-desc" x="752" y="182">Same shape in, same shape out.</text>
  </g>
  <text class="multihead-sub" x="30" y="304">The total cost is the same as one full-width head, which is why this is close to free: narrower heads compensate exactly for there being more of them.</text>
</svg>
