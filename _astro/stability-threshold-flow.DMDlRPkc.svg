<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="d153f-title d153f-desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
  <title id="d153f-title">Gradient descent below and above the Day 111 stability threshold</title>
  <desc id="d153f-desc">Two lanes share one learning-rate axis. In the top lane, at 80 percent of the stability threshold, a token spirals inward and settles on the closed-form target after converging in 7132 iterations. In the bottom lane, at 102 percent of the same threshold, a token spirals outward, growing with each loop, and leaves the frame as non-finite. A reduced-motion viewer sees both tokens already at their final, fully labelled position.</desc>

  <style>
    .d153f-bg { fill: #f8fafc; }
    .d153f-title-text { fill: #1a202c; font-size: 22px; font-weight: 700; }
    .d153f-t { fill: #1a202c; font-size: 14px; }
    .d153f-t-small { fill: #1a202c; font-size: 13px; }
    .d153f-mono { fill: #1a202c; font-size: 13px; font-family: "SF Mono", "Menlo", monospace; }
    .d153f-h { fill: #1a202c; font-size: 16px; font-weight: 700; }
    .d153f-lane { fill: #ffffff; stroke: #94a3b8; stroke-width: 1; rx: 10; }
    .d153f-safe-lane { fill: #dcfce7; stroke: #15803d; stroke-width: 1.5; rx: 10; }
    .d153f-warn-lane { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.5; rx: 10; }
    .d153f-target { fill: #1d4ed8; }
    .d153f-spiral-converge {
      fill: none; stroke: #15803d; stroke-width: 2; stroke-dasharray: 6 6;
      animation: d153f-march 2s linear infinite;
    }
    .d153f-spiral-diverge {
      fill: none; stroke: #b91c1c; stroke-width: 2; stroke-dasharray: 6 6;
      animation: d153f-march 2s linear infinite;
    }
    @keyframes d153f-march { to { stroke-dashoffset: -24; } }

    .d153f-token-converge {
      offset-path: path('M 860 165 C 760 130, 660 130, 620 175 C 585 215, 610 260, 660 265 C 700 269, 725 245, 715 215 C 707 191, 682 182, 665 195');
      offset-rotate: 0deg;
      animation: d153f-travel-c 6s ease-in-out infinite;
    }
    @keyframes d153f-travel-c { 0% { offset-distance: 0%; } 100% { offset-distance: 100%; } }

    .d153f-token-diverge {
      offset-path: path('M 665 495 C 682 508, 707 499, 715 475 C 725 445, 700 421, 660 425 C 610 430, 585 475, 620 515 C 660 560, 760 560, 830 500 C 890 448, 900 380, 880 330');
      offset-rotate: 0deg;
      animation: d153f-travel-d 6s ease-in-out infinite;
    }
    @keyframes d153f-travel-d { 0% { offset-distance: 0%; } 100% { offset-distance: 100%; } }

    @media (prefers-reduced-motion: reduce) {
      .d153f-spiral-converge, .d153f-spiral-diverge { animation: none; stroke-dasharray: none; }
      .d153f-token-converge { animation: none; offset-distance: 100%; }
      .d153f-token-diverge { animation: none; offset-distance: 100%; }
    }
  </style>

  <rect class="d153f-bg" x="0" y="0" width="1000" height="620" />
  <text x="500" y="34" text-anchor="middle" class="d153f-title-text">Day 111's threshold, exactly where it bites</text>
  <text x="500" y="56" text-anchor="middle" class="d153f-t-small">|1 - eta * a| &lt; 1, applied to the standardized diabetes loss (threshold eta &lt; 0.2485)</text>

  <!-- top lane: converges -->
  <rect class="d153f-safe-lane" x="40" y="80" width="920" height="240" />
  <text x="70" y="108" class="d153f-h">eta = 0.1988 (80% of threshold) -- converges</text>
  <text x="70" y="128" class="d153f-mono">reaches 1e-9 agreement with the closed form in exactly 7132 iterations</text>

  <path class="d153f-spiral-converge" d="M 860 165 C 760 130, 660 130, 620 175 C 585 215, 610 260, 660 265 C 700 269, 725 245, 715 215 C 707 191, 682 182, 665 195" />
  <circle class="d153f-target" cx="665" cy="215" r="6" />
  <text x="665" y="240" text-anchor="middle" class="d153f-t-small">closed-form target</text>
  <circle class="d153f-token-converge" r="9" fill="#15803d" />
  <text x="860" y="150" text-anchor="middle" class="d153f-t-small">start</text>

  <text x="70" y="200" class="d153f-t">Each loop of the spiral</text>
  <text x="70" y="222" class="d153f-t">is one gradient-descent</text>
  <text x="70" y="244" class="d153f-t">update. The step shrinks</text>
  <text x="70" y="266" class="d153f-t">as it nears the target.</text>
  <text x="70" y="296" class="d153f-t-small">(schematic -- not to scale)</text>

  <!-- bottom lane: diverges -->
  <rect class="d153f-warn-lane" x="40" y="340" width="920" height="240" />
  <text x="70" y="368" class="d153f-h">eta = 0.2535 (102% of threshold) -- diverges</text>
  <text x="70" y="388" class="d153f-mono">coefficients become non-finite within 20,000 iterations</text>

  <path class="d153f-spiral-diverge" d="M 665 495 C 682 508, 707 499, 715 475 C 725 445, 700 421, 660 425 C 610 430, 585 475, 620 515 C 660 560, 760 560, 830 500 C 890 448, 900 380, 880 330" />
  <circle class="d153f-target" cx="665" cy="475" r="6" />
  <text x="665" y="530" text-anchor="middle" class="d153f-t-small">same closed-form target</text>
  <circle class="d153f-token-diverge" r="9" fill="#b91c1c" />
  <text x="895" y="315" text-anchor="middle" class="d153f-t-small">leaves the frame: inf / nan</text>

  <text x="70" y="460" class="d153f-t">Each loop grows LARGER</text>
  <text x="70" y="482" class="d153f-t">instead of shrinking --</text>
  <text x="70" y="504" class="d153f-t">the same update rule, on</text>
  <text x="70" y="526" class="d153f-t">the wrong side of one number.</text>
  <text x="70" y="556" class="d153f-t-small">(schematic -- not to scale)</text>

  <text x="500" y="604" text-anchor="middle" class="d153f-t-small">The only thing that changed between the two lanes is the learning rate. The Day 111 formula predicts exactly which lane you are in.</text>
</svg>
