<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to use principal components</title>
  <style>
    .pca-when-bg   { fill: #f8fafc; }
    .pca-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pca-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pca-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pca-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pca-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pca-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pca-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pca-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pca-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pca-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pca-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pca-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pca-when-row { opacity: 1; }
    .pca-when-r0 { animation-delay: 0.00s; }
    .pca-when-r1 { animation-delay: 0.45s; }
    .pca-when-r2 { animation-delay: 0.90s; }
    .pca-when-r3 { animation-delay: 1.35s; }
    .pca-when-r4 { animation-delay: 1.80s; }
    .pca-when-row { animation: pca-when-reveal 7.3s ease-in-out infinite; }
    @keyframes pca-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="pca-when-bg" width="980" height="390"/>
  <text class="pca-when-h1"  x="30" y="40">When to use principal components</text>
  <text class="pca-when-sub" x="30" y="64">And when not to.</text>
  <rect class="pca-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="pca-when-name" x="46" y="122">Use it</text>
  <text class="pca-when-desc" x="46" y="142">Four cases.</text>
  <text class="pca-when-desc pca-when-row pca-when-r0" x="46" y="182">Many correlated numeric features</text>
  <text class="pca-when-desc pca-when-row pca-when-r1" x="46" y="216">Compression before an expensive model</text>
  <text class="pca-when-desc pca-when-row pca-when-r2" x="46" y="250">Removing collinearity for linear models</text>
  <text class="pca-when-desc pca-when-row pca-when-r3" x="46" y="284">Visualising structure in two dimensions</text>
  <text class="pca-when-desc pca-when-row pca-when-r4" x="46" y="318">Reconstruction error as an anomaly score</text>
  <rect class="pca-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="pca-when-name" x="526" y="122">Do not</text>
  <text class="pca-when-desc" x="526" y="142">Also four.</text>
  <text class="pca-when-desc pca-when-row pca-when-r0" x="526" y="182">Where features must remain interpretable</text>
  <text class="pca-when-desc pca-when-row pca-when-r1" x="526" y="216">Tree models, which handle collinearity anyway</text>
  <text class="pca-when-desc pca-when-row pca-when-r2" x="526" y="250">Categorical or sparse features</text>
  <text class="pca-when-desc pca-when-row pca-when-r3" x="526" y="284">Where the signal may be low-variance</text>
  <text class="pca-when-desc pca-when-row pca-when-r4" x="526" y="318">Before checking the unreduced baseline</text>
  <text class="pca-when-sub" x="30" y="372">Tree models being unaffected by collinearity removes one of the commonest reasons to reach for this, so it is worth checking the model family first.</text>
</svg>
