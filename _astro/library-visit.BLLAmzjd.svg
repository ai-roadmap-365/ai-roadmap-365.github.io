<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Rules whether or not enforced.">
  <title>A visitor in a reading room</title>
  <style>
    .library-visit-bg   { fill: #f8fafc; }
    .library-visit-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-visit-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-visit-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-visit-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-visit-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-visit-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .library-visit-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .library-visit-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .library-visit-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .library-visit-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .library-visit-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .library-visit-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .library-visit-row { opacity: 1; }
    .library-visit-r0 { animation-delay: 0.00s; }
    .library-visit-r1 { animation-delay: 0.45s; }
    .library-visit-r2 { animation-delay: 0.90s; }
    .library-visit-r3 { animation-delay: 1.35s; }
    .library-visit-r4 { animation-delay: 1.80s; }
    .library-visit-row { animation: library-visit-reveal 7.3s ease-in-out infinite; }
    @keyframes library-visit-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="library-visit-bg" width="980" height="390"/>
  <text class="library-visit-h1"  x="30" y="40">A visitor in a reading room</text>
  <text class="library-visit-sub" x="30" y="64">Rules whether or not enforced.</text>
  <rect class="library-visit-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="library-visit-name" x="46" y="122">Considerate</text>
  <text class="library-visit-desc" x="46" y="142">Welcome to return.</text>
  <text class="library-visit-desc library-visit-row library-visit-r0" x="46" y="182">Signs in and says who they are</text>
  <text class="library-visit-desc library-visit-row library-visit-r1" x="46" y="216">Takes one book at a time</text>
  <text class="library-visit-desc library-visit-row library-visit-r2" x="46" y="250">Respects the posted rules</text>
  <text class="library-visit-desc library-visit-row library-visit-r3" x="46" y="284">Causes no disruption</text>
  <text class="library-visit-desc library-visit-row library-visit-r4" x="46" y="318">This is a polite crawler</text>
  <rect class="library-visit-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="library-visit-name" x="526" y="122">Disruptive</text>
  <text class="library-visit-desc" x="526" y="142">Barred.</text>
  <text class="library-visit-desc library-visit-row library-visit-r0" x="526" y="182">Anonymous</text>
  <text class="library-visit-desc library-visit-row library-visit-r1" x="526" y="216">Empties the shelves at once</text>
  <text class="library-visit-desc library-visit-row library-visit-r2" x="526" y="250">Ignores the notices</text>
  <text class="library-visit-desc library-visit-row library-visit-r3" x="526" y="284">Others cannot use the room</text>
  <text class="library-visit-desc library-visit-row library-visit-r4" x="526" y="318">This is an aggressive scraper</text>
  <text class="library-visit-sub" x="30" y="372">Being barred is the practical consequence in both settings, and it is why politeness is self-interested as well as courteous.</text>
</svg>
