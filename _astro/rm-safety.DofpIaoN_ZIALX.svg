<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="It walks a tree deleting everything, without pausing.">
  <title>rm -rf is the most dangerous command a beginner runs</title>
  <style>
    .rm-safety-bg   { fill: #f8fafc; }
    .rm-safety-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rm-safety-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rm-safety-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rm-safety-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rm-safety-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rm-safety-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rm-safety-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rm-safety-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rm-safety-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rm-safety-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rm-safety-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rm-safety-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rm-safety-row { opacity: 1; }
    .rm-safety-r0 { animation-delay: 0.00s; }
    .rm-safety-r1 { animation-delay: 0.45s; }
    .rm-safety-r2 { animation-delay: 0.90s; }
    .rm-safety-r3 { animation-delay: 1.35s; }
    .rm-safety-r4 { animation-delay: 1.80s; }
    .rm-safety-row { animation: rm-safety-reveal 7.3s ease-in-out infinite; }
    @keyframes rm-safety-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="rm-safety-bg" width="980" height="390"/>
  <text class="rm-safety-h1"  x="30" y="40">rm -rf is the most dangerous command a beginner runs</text>
  <text class="rm-safety-sub" x="30" y="64">It walks a tree deleting everything, without pausing.</text>
  <rect class="rm-safety-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="rm-safety-name" x="46" y="122">How work gets destroyed</text>
  <text class="rm-safety-desc" x="46" y="142">Each of these has erased someone's month.</text>
  <text class="rm-safety-desc rm-safety-row rm-safety-r0" x="46" y="182">Typing rm -rf and reading it afterwards</text>
  <text class="rm-safety-desc rm-safety-row rm-safety-r1" x="46" y="216">A stray space: rm -rf / tmp/thing</text>
  <text class="rm-safety-desc rm-safety-row rm-safety-r2" x="46" y="250">A path from an unset variable in a script</text>
  <text class="rm-safety-desc rm-safety-row rm-safety-r3" x="46" y="284">Adding -f to silence a prompt that was warning you</text>
  <text class="rm-safety-desc rm-safety-row rm-safety-r4" x="46" y="318">Deleting to "clean up" before checking what is there</text>
  <rect class="rm-safety-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="rm-safety-name" x="526" y="122">How professionals delete</text>
  <text class="rm-safety-desc" x="526" y="142">Habits, not tools.</text>
  <text class="rm-safety-desc rm-safety-row rm-safety-r0" x="526" y="182">Run ls on the exact path first</text>
  <text class="rm-safety-desc rm-safety-row rm-safety-r1" x="526" y="216">Read the whole line before pressing Return</text>
  <text class="rm-safety-desc rm-safety-row rm-safety-r2" x="526" y="250">Quote variables, and test scripts with echo</text>
  <text class="rm-safety-desc rm-safety-row rm-safety-r3" x="526" y="284">Let the prompt ask; it costs a second</text>
  <text class="rm-safety-desc rm-safety-row rm-safety-r4" x="526" y="318">Move to a temporary directory where you can</text>
  <text class="rm-safety-sub" x="30" y="372">Respect for rm is not timidity. It is the mark of someone who has, or has watched someone, lose real work.</text>
</svg>
