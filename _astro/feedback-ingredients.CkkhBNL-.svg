<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three properties.">
  <title>What a feedback signal has</title>
  <style>
    .feedback-ingredients-bg   { fill: #f8fafc; }
    .feedback-ingredients-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feedback-ingredients-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feedback-ingredients-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feedback-ingredients-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feedback-ingredients-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feedback-ingredients-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .feedback-ingredients-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .feedback-ingredients-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .feedback-ingredients-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .feedback-ingredients-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .feedback-ingredients-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .feedback-ingredients-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .feedback-ingredients-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .feedback-ingredients-stage { opacity: 1; }

    .feedback-ingredients-s0 { animation-delay: 0.00s; }
    .feedback-ingredients-e0 { animation-delay: 0.00s; }
    .feedback-ingredients-s1 { animation-delay: 1.50s; }
    .feedback-ingredients-e1 { animation-delay: 1.50s; }
    .feedback-ingredients-s2 { animation-delay: 3.00s; }
    .feedback-ingredients-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .feedback-ingredients-conn  { animation: feedback-ingredients-trace 6s ease-in-out infinite; }
      .feedback-ingredients-stage { animation: feedback-ingredients-arrive 6s ease-in-out infinite; }
    }
    @keyframes feedback-ingredients-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes feedback-ingredients-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .feedback-ingredients-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .feedback-ingredients-stage { animation: feedback-ingredients-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes feedback-ingredients-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="feedback-ingredients-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="feedback-ingredients-bg" width="980" height="322"/>
  <text class="feedback-ingredients-h1"  x="30" y="40">What a feedback signal has</text>
  <text class="feedback-ingredients-sub" x="30" y="64">Three properties.</text>
  <g class="feedback-ingredients-stage feedback-ingredients-s0">
    <rect class="feedback-ingredients-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="feedback-ingredients-step" x="44" y="142">01</text>
    <text class="feedback-ingredients-name" x="70" y="142">Is there a signal at all</text>
    <text class="feedback-ingredients-desc" x="44" y="166">Supervised and reinforcement yes,</text>
    <text class="feedback-ingredients-desc" x="44" y="182">unsupervised no.</text>
  </g>
  <line class="feedback-ingredients-line feedback-ingredients-conn feedback-ingredients-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#feedback-ingredients-tip)"/>
  <g class="feedback-ingredients-stage feedback-ingredients-s1">
    <rect class="feedback-ingredients-good" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="feedback-ingredients-step" x="359" y="142">02</text>
    <text class="feedback-ingredients-name" x="385" y="142">Does it say what was right, or only how good</text>
    <text class="feedback-ingredients-desc" x="359" y="166">Instructive against evaluative.</text>
  </g>
  <line class="feedback-ingredients-line feedback-ingredients-conn feedback-ingredients-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#feedback-ingredients-tip)"/>
  <g class="feedback-ingredients-stage feedback-ingredients-s2">
    <rect class="feedback-ingredients-warn" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="feedback-ingredients-step" x="674" y="142">03</text>
    <text class="feedback-ingredients-name" x="700" y="142">And does it arrive now or much later</text>
    <text class="feedback-ingredients-desc" x="674" y="166">Immediate against delayed, which is the hard</text>
    <text class="feedback-ingredients-desc" x="674" y="182">case.</text>
  </g>
  <text class="feedback-ingredients-sub" x="30" y="304">These three properties generate the taxonomy rather than being described by it, which is why unusual settings can be placed by asking the same three questions.</text>
</svg>
