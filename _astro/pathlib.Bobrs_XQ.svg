<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four benefits.">
  <title>Paths as objects</title>
  <style>
    .pathlib-bg   { fill: #f8fafc; }
    .pathlib-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pathlib-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pathlib-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pathlib-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pathlib-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pathlib-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pathlib-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pathlib-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pathlib-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pathlib-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pathlib-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pathlib-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pathlib-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pathlib-stage { opacity: 1; }

    .pathlib-s0 { animation-delay: 0.00s; }
    .pathlib-e0 { animation-delay: 0.00s; }
    .pathlib-s1 { animation-delay: 1.28s; }
    .pathlib-e1 { animation-delay: 1.28s; }
    .pathlib-s2 { animation-delay: 2.56s; }
    .pathlib-e2 { animation-delay: 2.56s; }
    .pathlib-s3 { animation-delay: 3.84s; }
    .pathlib-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .pathlib-conn  { animation: pathlib-trace 6.4s ease-in-out infinite; }
      .pathlib-stage { animation: pathlib-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes pathlib-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pathlib-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pathlib-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pathlib-stage { animation: pathlib-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pathlib-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pathlib-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pathlib-bg" width="980" height="322"/>
  <text class="pathlib-h1"  x="30" y="40">Paths as objects</text>
  <text class="pathlib-sub" x="30" y="64">Four benefits.</text>
  <g class="pathlib-stage pathlib-s0">
    <rect class="pathlib-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="pathlib-step" x="44" y="142">01</text>
    <text class="pathlib-name" x="70" y="142">String paths break across operating systems</text>
    <text class="pathlib-desc" x="44" y="166">Separators differ, and joining</text>
    <text class="pathlib-desc" x="44" y="182">by hand goes wrong.</text>
  </g>
  <line class="pathlib-line pathlib-conn pathlib-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#pathlib-tip)"/>
  <g class="pathlib-stage pathlib-s1">
    <rect class="pathlib-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="pathlib-step" x="280" y="142">02</text>
    <text class="pathlib-name" x="306" y="142">A path object handles that for you</text>
    <text class="pathlib-desc" x="280" y="166">Joining with an operator rather</text>
    <text class="pathlib-desc" x="280" y="182">than string concatenation.</text>
  </g>
  <line class="pathlib-line pathlib-conn pathlib-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#pathlib-tip)"/>
  <g class="pathlib-stage pathlib-s2">
    <rect class="pathlib-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="pathlib-step" x="516" y="142">03</text>
    <text class="pathlib-name" x="542" y="142">With reading, writing and globbing as methods</text>
    <text class="pathlib-desc" x="516" y="166">Rather than scattered functions.</text>
  </g>
  <line class="pathlib-line pathlib-conn pathlib-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#pathlib-tip)"/>
  <g class="pathlib-stage pathlib-s3">
    <rect class="pathlib-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="pathlib-step" x="752" y="142">04</text>
    <text class="pathlib-name" x="778" y="142">And the same code runs on every platform</text>
    <text class="pathlib-desc" x="752" y="166">Which string manipulation cannot</text>
    <text class="pathlib-desc" x="752" y="182">promise.</text>
  </g>
  <text class="pathlib-sub" x="30" y="304">Hand-joining paths with slashes is the specific habit to break, since it works on your machine and fails on somebody else's.</text>
</svg>
