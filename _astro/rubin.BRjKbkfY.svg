<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Each needs different treatment.">
  <title>Three missingness mechanisms</title>
  <style>
    .rubin-bg   { fill: #f8fafc; }
    .rubin-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rubin-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rubin-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rubin-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rubin-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rubin-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rubin-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rubin-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rubin-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rubin-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rubin-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rubin-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rubin-row { opacity: 1; }
    .rubin-r0 { animation-delay: 0.00s; }
    .rubin-r1 { animation-delay: 0.45s; }
    .rubin-r2 { animation-delay: 0.90s; }
    .rubin-r3 { animation-delay: 1.35s; }
    .rubin-r4 { animation-delay: 1.80s; }
    .rubin-row { animation: rubin-reveal 7.3s ease-in-out infinite; }
    @keyframes rubin-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="rubin-bg" width="980" height="390"/>
  <text class="rubin-h1"  x="30" y="40">Three missingness mechanisms</text>
  <text class="rubin-sub" x="30" y="64">Each needs different treatment.</text>
  <rect class="rubin-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="rubin-name" x="46" y="122">The mechanism</text>
  <text class="rubin-desc" x="46" y="142">Why it is missing.</text>
  <text class="rubin-desc rubin-row rubin-r0" x="46" y="182">Completely at random — unrelated to anything</text>
  <text class="rubin-desc rubin-row rubin-r1" x="46" y="216">At random — explained by other observed columns</text>
  <text class="rubin-desc rubin-row rubin-r2" x="46" y="250">Not at random — related to the missing value itself</text>
  <text class="rubin-desc rubin-row rubin-r3" x="46" y="284">The third is the common case</text>
  <text class="rubin-desc rubin-row rubin-r4" x="46" y="318">And it cannot be tested from the data alone</text>
  <rect class="rubin-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="rubin-name" x="526" y="122">What it permits</text>
  <text class="rubin-desc" x="526" y="142">What you may do.</text>
  <text class="rubin-desc rubin-row rubin-r0" x="526" y="182">Dropping rows is unbiased, merely wasteful</text>
  <text class="rubin-desc rubin-row rubin-r1" x="526" y="216">Imputation from other columns is valid</text>
  <text class="rubin-desc rubin-row rubin-r2" x="526" y="250">Imputation is biased; the fact must be modelled</text>
  <text class="rubin-desc rubin-row rubin-r3" x="526" y="284">So always add a missingness indicator</text>
  <text class="rubin-desc rubin-row rubin-r4" x="526" y="318">Which is why domain knowledge is required</text>
  <text class="rubin-sub" x="30" y="372">The mechanism cannot be determined from the data, only from understanding how the data was collected — which is why this is a modelling question rather than a technical one.</text>
</svg>
