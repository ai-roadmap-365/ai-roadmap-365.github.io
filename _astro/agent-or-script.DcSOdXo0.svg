<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when a script is correct.">
  <title>When an agent earns its cost</title>
  <style>
    .agent-or-script-bg   { fill: #f8fafc; }
    .agent-or-script-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-or-script-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-or-script-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-or-script-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-or-script-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-or-script-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .agent-or-script-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .agent-or-script-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .agent-or-script-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .agent-or-script-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .agent-or-script-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .agent-or-script-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .agent-or-script-row { opacity: 1; }
    .agent-or-script-r0 { animation-delay: 0.00s; }
    .agent-or-script-r1 { animation-delay: 0.45s; }
    .agent-or-script-r2 { animation-delay: 0.90s; }
    .agent-or-script-r3 { animation-delay: 1.35s; }
    .agent-or-script-r4 { animation-delay: 1.80s; }
    .agent-or-script-row { animation: agent-or-script-reveal 7.3s ease-in-out infinite; }
    @keyframes agent-or-script-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="agent-or-script-bg" width="980" height="390"/>
  <text class="agent-or-script-h1"  x="30" y="40">When an agent earns its cost</text>
  <text class="agent-or-script-sub" x="30" y="64">And when a script is correct.</text>
  <rect class="agent-or-script-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="agent-or-script-name" x="46" y="122">Use an agent</text>
  <text class="agent-or-script-desc" x="46" y="142">The sequence is unknown.</text>
  <text class="agent-or-script-desc agent-or-script-row agent-or-script-r0" x="46" y="182">Debugging an unknown crash</text>
  <text class="agent-or-script-desc agent-or-script-row agent-or-script-r1" x="46" y="216">Open-ended research</text>
  <text class="agent-or-script-desc agent-or-script-row agent-or-script-r2" x="46" y="250">Dynamic exploration and trial-and-error</text>
  <text class="agent-or-script-desc agent-or-script-row agent-or-script-r3" x="46" y="284">Closed-loop self-verification</text>
  <text class="agent-or-script-desc agent-or-script-row agent-or-script-r4" x="46" y="318">Where the steps depend on findings</text>
  <rect class="agent-or-script-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="agent-or-script-name" x="526" y="122">Use a script</text>
  <text class="agent-or-script-desc" x="526" y="142">The sequence is known.</text>
  <text class="agent-or-script-desc agent-or-script-row agent-or-script-r0" x="526" y="182">Parsing a CSV, computing payroll</text>
  <text class="agent-or-script-desc agent-or-script-row agent-or-script-r1" x="526" y="216">Sending a standard welcome email</text>
  <text class="agent-or-script-desc agent-or-script-row agent-or-script-r2" x="526" y="250">Sub-second latency requirements</text>
  <text class="agent-or-script-desc agent-or-script-row agent-or-script-r3" x="526" y="284">Predictable fixed-cost billing</text>
  <text class="agent-or-script-desc agent-or-script-row agent-or-script-r4" x="526" y="318">A loop's depth varies per query</text>
  <text class="agent-or-script-sub" x="30" y="372">The latency row rules out more production use cases than people expect: an agent loop is multiple sequential inference calls, so a sub-second SLA excludes it before any other consideration applies.</text>
</svg>
