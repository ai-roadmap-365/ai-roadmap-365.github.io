<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Flat rate, crisis, then metered.">
  <title>Three eras of SaaS billing</title>
  <style>
    .billing-lineage-bg   { fill: #f8fafc; }
    .billing-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .billing-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .billing-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .billing-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .billing-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .billing-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .billing-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .billing-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .billing-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .billing-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .billing-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .billing-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .billing-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .billing-lineage-stage { opacity: 1; }

    .billing-lineage-s0 { animation-delay: 0.00s; }
    .billing-lineage-e0 { animation-delay: 0.00s; }
    .billing-lineage-s1 { animation-delay: 1.50s; }
    .billing-lineage-e1 { animation-delay: 1.50s; }
    .billing-lineage-s2 { animation-delay: 3.00s; }
    .billing-lineage-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .billing-lineage-conn  { animation: billing-lineage-trace 6s ease-in-out infinite; }
      .billing-lineage-stage { animation: billing-lineage-arrive 6s ease-in-out infinite; }
    }
    @keyframes billing-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes billing-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .billing-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .billing-lineage-stage { animation: billing-lineage-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes billing-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="billing-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="billing-lineage-bg" width="980" height="322"/>
  <text class="billing-lineage-h1"  x="30" y="40">Three eras of SaaS billing</text>
  <text class="billing-lineage-sub" x="30" y="64">Flat rate, crisis, then metered.</text>
  <g class="billing-lineage-stage billing-lineage-s0">
    <rect class="billing-lineage-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="billing-lineage-step" x="44" y="142">01</text>
    <text class="billing-lineage-name" x="70" y="142">Flat-rate tiers, 2010-2020</text>
    <text class="billing-lineage-desc" x="44" y="166">Marginal cost per user near zero. Pricing was</text>
    <text class="billing-lineage-desc" x="44" y="182">a packaging decision.</text>
  </g>
  <line class="billing-lineage-line billing-lineage-conn billing-lineage-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#billing-lineage-tip)"/>
  <g class="billing-lineage-stage billing-lineage-s1">
    <rect class="billing-lineage-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="billing-lineage-step" x="359" y="142">02</text>
    <text class="billing-lineage-name" x="385" y="142">The cost crisis, 2022-2023</text>
    <text class="billing-lineage-desc" x="359" y="166">Flat-rate products with per-token costs.</text>
    <text class="billing-lineage-desc" x="359" y="182">Heavy users were unprofitable.</text>
  </g>
  <line class="billing-lineage-line billing-lineage-conn billing-lineage-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#billing-lineage-tip)"/>
  <g class="billing-lineage-stage billing-lineage-s2">
    <rect class="billing-lineage-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="billing-lineage-step" x="674" y="142">03</text>
    <text class="billing-lineage-name" x="700" y="142">Hybrid metered, 2024</text>
    <text class="billing-lineage-desc" x="674" y="166">A base fee plus usage credits, with real-time</text>
    <text class="billing-lineage-desc" x="674" y="182">reservations.</text>
  </g>
  <text class="billing-lineage-sub" x="30" y="304">The middle era is the one worth understanding: the pricing model was borrowed from software with no marginal cost and applied to a product where the marginal cost is the dominant one.</text>
</svg>
