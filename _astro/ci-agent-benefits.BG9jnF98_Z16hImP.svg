<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Review, backlog and regression evidence.">
  <title>Three bottlenecks removed</title>
  <style>
    .ci-agent-benefits-bg   { fill: #f8fafc; }
    .ci-agent-benefits-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-agent-benefits-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-agent-benefits-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-agent-benefits-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-agent-benefits-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-agent-benefits-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ci-agent-benefits-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ci-agent-benefits-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ci-agent-benefits-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ci-agent-benefits-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ci-agent-benefits-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ci-agent-benefits-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .ci-agent-benefits-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .ci-agent-benefits-stage { opacity: 1; }

    .ci-agent-benefits-s0 { animation-delay: 0.00s; }
    .ci-agent-benefits-e0 { animation-delay: 0.00s; }
    .ci-agent-benefits-s1 { animation-delay: 1.50s; }
    .ci-agent-benefits-e1 { animation-delay: 1.50s; }
    .ci-agent-benefits-s2 { animation-delay: 3.00s; }
    .ci-agent-benefits-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .ci-agent-benefits-conn  { animation: ci-agent-benefits-trace 6s ease-in-out infinite; }
      .ci-agent-benefits-stage { animation: ci-agent-benefits-arrive 6s ease-in-out infinite; }
    }
    @keyframes ci-agent-benefits-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes ci-agent-benefits-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .ci-agent-benefits-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ci-agent-benefits-stage { animation: ci-agent-benefits-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes ci-agent-benefits-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ci-agent-benefits-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="ci-agent-benefits-bg" width="980" height="322"/>
  <text class="ci-agent-benefits-h1"  x="30" y="40">Three bottlenecks removed</text>
  <text class="ci-agent-benefits-sub" x="30" y="64">Review, backlog and regression evidence.</text>
  <g class="ci-agent-benefits-stage ci-agent-benefits-s0">
    <rect class="ci-agent-benefits-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="ci-agent-benefits-step" x="44" y="142">01</text>
    <text class="ci-agent-benefits-name" x="70" y="142">Routine review fatigue</text>
    <text class="ci-agent-benefits-desc" x="44" y="166">Style, annotations and unapproved imports</text>
    <text class="ci-agent-benefits-desc" x="44" y="182">caught before a human looks.</text>
  </g>
  <line class="ci-agent-benefits-line ci-agent-benefits-conn ci-agent-benefits-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#ci-agent-benefits-tip)"/>
  <g class="ci-agent-benefits-stage ci-agent-benefits-s1">
    <rect class="ci-agent-benefits-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="ci-agent-benefits-step" x="359" y="142">02</text>
    <text class="ci-agent-benefits-name" x="385" y="142">Backlog resolution</text>
    <text class="ci-agent-benefits-desc" x="359" y="166">A deprecated call updated across forty</text>
    <text class="ci-agent-benefits-desc" x="359" y="182">repositories, asynchronously.</text>
  </g>
  <line class="ci-agent-benefits-line ci-agent-benefits-conn ci-agent-benefits-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#ci-agent-benefits-tip)"/>
  <g class="ci-agent-benefits-stage ci-agent-benefits-s2">
    <rect class="ci-agent-benefits-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="ci-agent-benefits-step" x="674" y="142">03</text>
    <text class="ci-agent-benefits-name" x="700" y="142">Regression evidence included</text>
    <text class="ci-agent-benefits-desc" x="674" y="166">Because a reproduction test was required</text>
    <text class="ci-agent-benefits-desc" x="674" y="182">before the fix.</text>
  </g>
  <text class="ci-agent-benefits-sub" x="30" y="304">The third is a quality improvement rather than a speed one: a human fixing the same bug under time pressure often ships the fix without the test, and the pipeline structurally cannot.</text>
</svg>
