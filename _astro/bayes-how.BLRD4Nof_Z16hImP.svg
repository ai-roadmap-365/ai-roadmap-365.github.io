<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Working through the update</title>
  <style>
    .bayes-how-bg   { fill: #f8fafc; }
    .bayes-how-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bayes-how-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bayes-how-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bayes-how-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bayes-how-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bayes-how-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bayes-how-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bayes-how-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bayes-how-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bayes-how-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bayes-how-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bayes-how-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .bayes-how-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .bayes-how-stage { opacity: 1; }

    .bayes-how-s0 { animation-delay: 0.00s; }
    .bayes-how-e0 { animation-delay: 0.00s; }
    .bayes-how-s1 { animation-delay: 1.28s; }
    .bayes-how-e1 { animation-delay: 1.28s; }
    .bayes-how-s2 { animation-delay: 2.56s; }
    .bayes-how-e2 { animation-delay: 2.56s; }
    .bayes-how-s3 { animation-delay: 3.84s; }
    .bayes-how-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .bayes-how-conn  { animation: bayes-how-trace 6.4s ease-in-out infinite; }
      .bayes-how-stage { animation: bayes-how-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes bayes-how-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes bayes-how-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .bayes-how-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .bayes-how-stage { animation: bayes-how-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes bayes-how-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="bayes-how-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="bayes-how-bg" width="980" height="322"/>
  <text class="bayes-how-h1"  x="30" y="40">Working through the update</text>
  <text class="bayes-how-sub" x="30" y="64">Four steps.</text>
  <g class="bayes-how-stage bayes-how-s0">
    <rect class="bayes-how-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="bayes-how-step" x="44" y="142">01</text>
    <text class="bayes-how-name" x="70" y="142">Imagine a concrete population, say ten thousand</text>
    <text class="bayes-how-desc" x="44" y="166">Rather than working with</text>
    <text class="bayes-how-desc" x="44" y="182">fractions.</text>
  </g>
  <line class="bayes-how-line bayes-how-conn bayes-how-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#bayes-how-tip)"/>
  <g class="bayes-how-stage bayes-how-s1">
    <rect class="bayes-how-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="bayes-how-step" x="280" y="142">02</text>
    <text class="bayes-how-name" x="306" y="142">Count the true positives among the affected</text>
    <text class="bayes-how-desc" x="280" y="166">Base rate times sensitivity.</text>
  </g>
  <line class="bayes-how-line bayes-how-conn bayes-how-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#bayes-how-tip)"/>
  <g class="bayes-how-stage bayes-how-s2">
    <rect class="bayes-how-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="bayes-how-step" x="516" y="142">03</text>
    <text class="bayes-how-name" x="542" y="142">Count the false positives among the unaffected</text>
    <text class="bayes-how-desc" x="516" y="166">Which is usually the larger</text>
    <text class="bayes-how-desc" x="516" y="182">number.</text>
  </g>
  <line class="bayes-how-line bayes-how-conn bayes-how-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#bayes-how-tip)"/>
  <g class="bayes-how-stage bayes-how-s3">
    <rect class="bayes-how-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="bayes-how-step" x="752" y="142">04</text>
    <text class="bayes-how-name" x="778" y="142">And divide to get the chance of being affected</text>
    <text class="bayes-how-desc" x="752" y="166">Given a positive result.</text>
  </g>
  <text class="bayes-how-sub" x="30" y="304">Working in whole counts rather than percentages makes this reliably intuitive, and it is the standard way to teach the result for exactly that reason.</text>
</svg>
