<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Both mix labels, differently.">
  <title>MixUp and CutMix</title>
  <style>
    .mixup-cutmix-bg   { fill: #f8fafc; }
    .mixup-cutmix-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mixup-cutmix-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mixup-cutmix-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mixup-cutmix-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mixup-cutmix-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mixup-cutmix-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mixup-cutmix-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mixup-cutmix-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mixup-cutmix-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mixup-cutmix-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mixup-cutmix-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mixup-cutmix-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .mixup-cutmix-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .mixup-cutmix-stage { opacity: 1; }

    .mixup-cutmix-s0 { animation-delay: 0.00s; }
    .mixup-cutmix-e0 { animation-delay: 0.00s; }
    .mixup-cutmix-s1 { animation-delay: 1.28s; }
    .mixup-cutmix-e1 { animation-delay: 1.28s; }
    .mixup-cutmix-s2 { animation-delay: 2.56s; }
    .mixup-cutmix-e2 { animation-delay: 2.56s; }
    .mixup-cutmix-s3 { animation-delay: 3.84s; }
    .mixup-cutmix-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .mixup-cutmix-conn  { animation: mixup-cutmix-trace 6.4s ease-in-out infinite; }
      .mixup-cutmix-stage { animation: mixup-cutmix-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes mixup-cutmix-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes mixup-cutmix-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .mixup-cutmix-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .mixup-cutmix-stage { animation: mixup-cutmix-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes mixup-cutmix-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="mixup-cutmix-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="mixup-cutmix-bg" width="980" height="322"/>
  <text class="mixup-cutmix-h1"  x="30" y="40">MixUp and CutMix</text>
  <text class="mixup-cutmix-sub" x="30" y="64">Both mix labels, differently.</text>
  <g class="mixup-cutmix-stage mixup-cutmix-s0">
    <rect class="mixup-cutmix-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="mixup-cutmix-step" x="44" y="142">01</text>
    <text class="mixup-cutmix-name" x="70" y="142">MixUp blends pixels</text>
    <text class="mixup-cutmix-desc" x="44" y="166">A weighted average of two</text>
    <text class="mixup-cutmix-desc" x="44" y="182">images. Ghostly, and effective.</text>
  </g>
  <line class="mixup-cutmix-line mixup-cutmix-conn mixup-cutmix-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#mixup-cutmix-tip)"/>
  <g class="mixup-cutmix-stage mixup-cutmix-s1">
    <rect class="mixup-cutmix-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="mixup-cutmix-step" x="280" y="142">02</text>
    <text class="mixup-cutmix-name" x="306" y="142">CutMix pastes a patch</text>
    <text class="mixup-cutmix-desc" x="280" y="166">A rectangle from one image into</text>
    <text class="mixup-cutmix-desc" x="280" y="182">another. Crisp, and locally</text>
    <text class="mixup-cutmix-desc" x="280" y="198">realistic.</text>
  </g>
  <line class="mixup-cutmix-line mixup-cutmix-conn mixup-cutmix-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#mixup-cutmix-tip)"/>
  <g class="mixup-cutmix-stage mixup-cutmix-s2">
    <rect class="mixup-cutmix-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="mixup-cutmix-step" x="516" y="142">03</text>
    <text class="mixup-cutmix-name" x="542" y="142">Labels mix in proportion</text>
    <text class="mixup-cutmix-desc" x="516" y="166">By blend weight, or by patch</text>
    <text class="mixup-cutmix-desc" x="516" y="182">area.</text>
    <text class="mixup-cutmix-edge" x="516" y="242">proportional</text>
  </g>
  <line class="mixup-cutmix-line mixup-cutmix-conn mixup-cutmix-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#mixup-cutmix-tip)"/>
  <g class="mixup-cutmix-stage mixup-cutmix-s3">
    <rect class="mixup-cutmix-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="mixup-cutmix-step" x="752" y="142">04</text>
    <text class="mixup-cutmix-name" x="778" y="142">So the loss must accept distributions</text>
    <text class="mixup-cutmix-desc" x="752" y="166">Soft targets, not integer class</text>
    <text class="mixup-cutmix-desc" x="752" y="182">indices.</text>
  </g>
  <text class="mixup-cutmix-sub" x="30" y="304">The loss requirement is a real integration constraint: a training loop written around integer labels will silently do the wrong thing when handed a mixed target.</text>
</svg>
