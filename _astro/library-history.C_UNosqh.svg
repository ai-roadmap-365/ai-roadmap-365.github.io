<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Engineering, mostly.">
  <title>Four steps in boosting libraries</title>
  <style>
    .library-history-bg   { fill: #f8fafc; }
    .library-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .library-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .library-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .library-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .library-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .library-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .library-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .library-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .library-history-stage { opacity: 1; }

    .library-history-s0 { animation-delay: 0.00s; }
    .library-history-e0 { animation-delay: 0.00s; }
    .library-history-s1 { animation-delay: 1.28s; }
    .library-history-e1 { animation-delay: 1.28s; }
    .library-history-s2 { animation-delay: 2.56s; }
    .library-history-e2 { animation-delay: 2.56s; }
    .library-history-s3 { animation-delay: 3.84s; }
    .library-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .library-history-conn  { animation: library-history-trace 6.4s ease-in-out infinite; }
      .library-history-stage { animation: library-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes library-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes library-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .library-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .library-history-stage { animation: library-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes library-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="library-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="library-history-bg" width="980" height="322"/>
  <text class="library-history-h1"  x="30" y="40">Four steps in boosting libraries</text>
  <text class="library-history-sub" x="30" y="64">Engineering, mostly.</text>
  <g class="library-history-stage library-history-s0">
    <rect class="library-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="library-history-step" x="44" y="142">01</text>
    <text class="library-history-name" x="70" y="142">Research implementations, correct and slow</text>
    <text class="library-history-desc" x="44" y="166">Which limited how much anyone</text>
    <text class="library-history-desc" x="44" y="182">could iterate.</text>
  </g>
  <line class="library-history-line library-history-conn library-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#library-history-tip)"/>
  <g class="library-history-stage library-history-s1">
    <rect class="library-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="library-history-step" x="280" y="142">02</text>
    <text class="library-history-name" x="306" y="142">A second-order, regularised, engineered library</text>
    <text class="library-history-desc" x="280" y="166">Which won competitions and</text>
    <text class="library-history-desc" x="280" y="182">changed practice.</text>
  </g>
  <line class="library-history-line library-history-conn library-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#library-history-tip)"/>
  <g class="library-history-stage library-history-s2">
    <rect class="library-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="library-history-step" x="516" y="142">03</text>
    <text class="library-history-name" x="542" y="142">Then histogram binning and leaf-wise growth</text>
    <text class="library-history-desc" x="516" y="166">An order of magnitude faster</text>
    <text class="library-history-desc" x="516" y="182">again.</text>
  </g>
  <line class="library-history-line library-history-conn library-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#library-history-tip)"/>
  <g class="library-history-stage library-history-s3">
    <rect class="library-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="library-history-step" x="752" y="142">04</text>
    <text class="library-history-name" x="778" y="142">And native categorical handling</text>
    <text class="library-history-desc" x="752" y="166">Removing the encoding step</text>
    <text class="library-history-desc" x="752" y="182">entirely.</text>
  </g>
  <text class="library-history-sub" x="30" y="304">Each step was engineering rather than new mathematics, which is a fair reminder that implementation quality decides what practitioners actually use.</text>
</svg>
