<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three things a PR gate cannot do.">
  <title>What a nightly run adds</title>
  <style>
    .nightly-matrix-bg   { fill: #f8fafc; }
    .nightly-matrix-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nightly-matrix-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nightly-matrix-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nightly-matrix-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nightly-matrix-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nightly-matrix-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nightly-matrix-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .nightly-matrix-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .nightly-matrix-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .nightly-matrix-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .nightly-matrix-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .nightly-matrix-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .nightly-matrix-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .nightly-matrix-stage { opacity: 1; }

    .nightly-matrix-s0 { animation-delay: 0.00s; }
    .nightly-matrix-e0 { animation-delay: 0.00s; }
    .nightly-matrix-s1 { animation-delay: 1.50s; }
    .nightly-matrix-e1 { animation-delay: 1.50s; }
    .nightly-matrix-s2 { animation-delay: 3.00s; }
    .nightly-matrix-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .nightly-matrix-conn  { animation: nightly-matrix-trace 6s ease-in-out infinite; }
      .nightly-matrix-stage { animation: nightly-matrix-arrive 6s ease-in-out infinite; }
    }
    @keyframes nightly-matrix-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes nightly-matrix-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .nightly-matrix-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .nightly-matrix-stage { animation: nightly-matrix-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes nightly-matrix-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="nightly-matrix-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="nightly-matrix-bg" width="980" height="322"/>
  <text class="nightly-matrix-h1"  x="30" y="40">What a nightly run adds</text>
  <text class="nightly-matrix-sub" x="30" y="64">Three things a PR gate cannot do.</text>
  <g class="nightly-matrix-stage nightly-matrix-s0">
    <rect class="nightly-matrix-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="nightly-matrix-step" x="44" y="142">01</text>
    <text class="nightly-matrix-name" x="70" y="142">A model matrix</text>
    <text class="nightly-matrix-desc" x="44" y="166">The same prompts across every candidate</text>
    <text class="nightly-matrix-desc" x="44" y="182">model, every night.</text>
  </g>
  <line class="nightly-matrix-line nightly-matrix-conn nightly-matrix-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#nightly-matrix-tip)"/>
  <g class="nightly-matrix-stage nightly-matrix-s1">
    <rect class="nightly-matrix-good" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="nightly-matrix-step" x="359" y="142">02</text>
    <text class="nightly-matrix-name" x="385" y="142">Price-performance over time</text>
    <text class="nightly-matrix-desc" x="359" y="166">Accuracy against cost per thousand queries,</text>
    <text class="nightly-matrix-desc" x="359" y="182">plotted.</text>
  </g>
  <line class="nightly-matrix-line nightly-matrix-conn nightly-matrix-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#nightly-matrix-tip)"/>
  <g class="nightly-matrix-stage nightly-matrix-s2">
    <rect class="nightly-matrix-box" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="nightly-matrix-step" x="674" y="142">03</text>
    <text class="nightly-matrix-name" x="700" y="142">Dataset expansion</text>
    <text class="nightly-matrix-desc" x="674" y="166">Low-rated production traces queued for review</text>
    <text class="nightly-matrix-desc" x="674" y="182">and inclusion.</text>
  </g>
  <text class="nightly-matrix-sub" x="30" y="304">The second is what makes downgrading a decision rather than a leap of faith: when a cheaper model's accuracy crosses your threshold, the chart says so before anybody proposes the migration.</text>
</svg>
