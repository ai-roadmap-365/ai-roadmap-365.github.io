<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what it exposes.">
  <title>What nearest neighbours costs</title>
  <style>
    .knn-implications-bg   { fill: #f8fafc; }
    .knn-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knn-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knn-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knn-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knn-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knn-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .knn-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .knn-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .knn-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .knn-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .knn-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .knn-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .knn-implications-row { opacity: 1; }
    .knn-implications-r0 { animation-delay: 0.00s; }
    .knn-implications-r1 { animation-delay: 0.45s; }
    .knn-implications-r2 { animation-delay: 0.90s; }
    .knn-implications-r3 { animation-delay: 1.35s; }
    .knn-implications-r4 { animation-delay: 1.80s; }
    .knn-implications-row { animation: knn-implications-reveal 7.3s ease-in-out infinite; }
    @keyframes knn-implications-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="knn-implications-bg" width="980" height="390"/>
  <text class="knn-implications-h1"  x="30" y="40">What nearest neighbours costs</text>
  <text class="knn-implications-sub" x="30" y="64">And what it exposes.</text>
  <rect class="knn-implications-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="knn-implications-name" x="46" y="122">What you gain</text>
  <text class="knn-implications-desc" x="46" y="142">Simplicity.</text>
  <text class="knn-implications-desc knn-implications-row knn-implications-r0" x="46" y="182">No training at all</text>
  <text class="knn-implications-desc knn-implications-row knn-implications-r1" x="46" y="216">New data usable immediately</text>
  <text class="knn-implications-desc knn-implications-row knn-implications-r2" x="46" y="250">No assumptions about the boundary shape</text>
  <text class="knn-implications-desc knn-implications-row knn-implications-r3" x="46" y="284">Naturally handles many classes</text>
  <text class="knn-implications-desc knn-implications-row knn-implications-r4" x="46" y="318">Predictions are explainable by example</text>
  <rect class="knn-implications-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="knn-implications-name" x="526" y="122">What you take on</text>
  <text class="knn-implications-desc" x="526" y="142">Four costs.</text>
  <text class="knn-implications-desc knn-implications-row knn-implications-r0" x="526" y="182">The whole training set must be stored</text>
  <text class="knn-implications-desc knn-implications-row knn-implications-r1" x="526" y="216">Prediction scans all of it</text>
  <text class="knn-implications-desc knn-implications-row knn-implications-r2" x="526" y="250">Which is a privacy exposure, not just a size one</text>
  <text class="knn-implications-desc knn-implications-row knn-implications-r3" x="526" y="284">Scaling must be maintained forever</text>
  <text class="knn-implications-desc knn-implications-row knn-implications-r4" x="526" y="318">And it degrades in high dimensions</text>
  <text class="knn-implications-sub" x="30" y="372">The privacy point deserves emphasis: the model *is* the training data, so deploying it distributes every record it was trained on.</text>
</svg>
