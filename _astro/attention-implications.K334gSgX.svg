<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Interpretability, cost, and two structural changes.">
  <title>Four consequences of attention</title>
  <style>
    .attention-implications-bg   { fill: #f8fafc; }
    .attention-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .attention-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .attention-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .attention-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .attention-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .attention-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .attention-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .attention-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .attention-implications-stage { opacity: 1; }

    .attention-implications-s0 { animation-delay: 0.00s; }
    .attention-implications-e0 { animation-delay: 0.00s; }
    .attention-implications-s1 { animation-delay: 1.28s; }
    .attention-implications-e1 { animation-delay: 1.28s; }
    .attention-implications-s2 { animation-delay: 2.56s; }
    .attention-implications-e2 { animation-delay: 2.56s; }
    .attention-implications-s3 { animation-delay: 3.84s; }
    .attention-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .attention-implications-conn  { animation: attention-implications-trace 6.4s ease-in-out infinite; }
      .attention-implications-stage { animation: attention-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes attention-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes attention-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .attention-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .attention-implications-stage { animation: attention-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes attention-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="attention-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="attention-implications-bg" width="980" height="322"/>
  <text class="attention-implications-h1"  x="30" y="40">Four consequences of attention</text>
  <text class="attention-implications-sub" x="30" y="64">Interpretability, cost, and two structural changes.</text>
  <g class="attention-implications-stage attention-implications-s0">
    <rect class="attention-implications-good" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="attention-implications-step" x="44" y="142">01</text>
    <text class="attention-implications-name" x="70" y="142">The weights are interpretable</text>
    <text class="attention-implications-desc" x="44" y="166">An alignment map showing which</text>
    <text class="attention-implications-desc" x="44" y="182">source words informed each</text>
    <text class="attention-implications-desc" x="44" y="198">output word.</text>
  </g>
  <line class="attention-implications-line attention-implications-conn attention-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#attention-implications-tip)"/>
  <g class="attention-implications-stage attention-implications-s1">
    <rect class="attention-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="attention-implications-step" x="280" y="142">02</text>
    <text class="attention-implications-name" x="306" y="142">Cost is quadratic in length</text>
    <text class="attention-implications-desc" x="280" y="166">Every output position scores</text>
    <text class="attention-implications-desc" x="280" y="182">every input position.</text>
  </g>
  <line class="attention-implications-line attention-implications-conn attention-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#attention-implications-tip)"/>
  <g class="attention-implications-stage attention-implications-s2">
    <rect class="attention-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="attention-implications-step" x="516" y="142">03</text>
    <text class="attention-implications-name" x="542" y="142">Alignment is learned, not specified</text>
    <text class="attention-implications-desc" x="516" y="166">Word order differences between</text>
    <text class="attention-implications-desc" x="516" y="182">languages handled without rules.</text>
  </g>
  <line class="attention-implications-line attention-implications-conn attention-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#attention-implications-tip)"/>
  <g class="attention-implications-stage attention-implications-s3">
    <rect class="attention-implications-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="attention-implications-step" x="752" y="142">04</text>
    <text class="attention-implications-name" x="778" y="142">And it made recurrence optional</text>
    <text class="attention-implications-desc" x="752" y="166">Which is the change that</text>
    <text class="attention-implications-desc" x="752" y="182">mattered most.</text>
  </g>
  <text class="attention-implications-sub" x="30" y="304">Interpretability is genuinely unusual in deep learning and should be treated carefully: attention weights show what was attended to, which is related to but not identical with what the model used.</text>
</svg>
