<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Why one has a closed form</title>
  <style>
    .closed-form-bg   { fill: #f8fafc; }
    .closed-form-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .closed-form-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .closed-form-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .closed-form-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .closed-form-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .closed-form-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .closed-form-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .closed-form-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .closed-form-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .closed-form-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .closed-form-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .closed-form-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .closed-form-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .closed-form-stage { opacity: 1; }

    .closed-form-s0 { animation-delay: 0.00s; }
    .closed-form-e0 { animation-delay: 0.00s; }
    .closed-form-s1 { animation-delay: 1.28s; }
    .closed-form-e1 { animation-delay: 1.28s; }
    .closed-form-s2 { animation-delay: 2.56s; }
    .closed-form-e2 { animation-delay: 2.56s; }
    .closed-form-s3 { animation-delay: 3.84s; }
    .closed-form-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .closed-form-conn  { animation: closed-form-trace 6.4s ease-in-out infinite; }
      .closed-form-stage { animation: closed-form-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes closed-form-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes closed-form-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .closed-form-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .closed-form-stage { animation: closed-form-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes closed-form-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="closed-form-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="closed-form-bg" width="980" height="322"/>
  <text class="closed-form-h1"  x="30" y="40">Why one has a closed form</text>
  <text class="closed-form-sub" x="30" y="64">Four steps.</text>
  <g class="closed-form-stage closed-form-s0">
    <rect class="closed-form-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="closed-form-step" x="44" y="142">01</text>
    <text class="closed-form-name" x="70" y="142">Squared error is smooth everywhere</text>
    <text class="closed-form-desc" x="44" y="166">Differentiable at every point.</text>
  </g>
  <line class="closed-form-line closed-form-conn closed-form-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#closed-form-tip)"/>
  <g class="closed-form-stage closed-form-s1">
    <rect class="closed-form-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="closed-form-step" x="280" y="142">02</text>
    <text class="closed-form-name" x="306" y="142">Setting its derivative to zero gives linear equations</text>
    <text class="closed-form-desc" x="280" y="166">Which solve directly.</text>
  </g>
  <line class="closed-form-line closed-form-conn closed-form-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#closed-form-tip)"/>
  <g class="closed-form-stage closed-form-s2">
    <rect class="closed-form-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="closed-form-step" x="516" y="142">03</text>
    <text class="closed-form-name" x="542" y="142">Absolute error has a kink at zero</text>
    <text class="closed-form-desc" x="516" y="166">Where the derivative is</text>
    <text class="closed-form-desc" x="516" y="182">undefined.</text>
  </g>
  <line class="closed-form-line closed-form-conn closed-form-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#closed-form-tip)"/>
  <g class="closed-form-stage closed-form-s3">
    <rect class="closed-form-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="closed-form-step" x="752" y="142">04</text>
    <text class="closed-form-name" x="778" y="142">So it needs iterative optimisation instead</text>
    <text class="closed-form-desc" x="752" y="166">Which is why it was historically</text>
    <text class="closed-form-desc" x="752" y="182">avoided.</text>
  </g>
  <text class="closed-form-sub" x="30" y="304">The historical preference for squared error was largely computational rather than statistical, which is worth knowing when it is defended on principle.</text>
</svg>
