<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The constraints changed, and so did the design.">
  <title>Four generations, each fixing the last</title>
  <style>
    .vcs-history-bg   { fill: #f8fafc; }
    .vcs-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vcs-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vcs-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vcs-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vcs-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vcs-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vcs-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .vcs-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .vcs-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .vcs-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .vcs-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .vcs-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .vcs-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .vcs-history-stage { opacity: 1; }

    .vcs-history-s0 { animation-delay: 0.00s; }
    .vcs-history-e0 { animation-delay: 0.00s; }
    .vcs-history-s1 { animation-delay: 1.28s; }
    .vcs-history-e1 { animation-delay: 1.28s; }
    .vcs-history-s2 { animation-delay: 2.56s; }
    .vcs-history-e2 { animation-delay: 2.56s; }
    .vcs-history-s3 { animation-delay: 3.84s; }
    .vcs-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .vcs-history-conn  { animation: vcs-history-trace 6.4s ease-in-out infinite; }
      .vcs-history-stage { animation: vcs-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes vcs-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes vcs-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .vcs-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .vcs-history-stage { animation: vcs-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes vcs-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="vcs-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="vcs-history-bg" width="980" height="322"/>
  <text class="vcs-history-h1"  x="30" y="40">Four generations, each fixing the last</text>
  <text class="vcs-history-sub" x="30" y="64">The constraints changed, and so did the design.</text>
  <g class="vcs-history-stage vcs-history-s0">
    <rect class="vcs-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="vcs-history-step" x="44" y="142">01</text>
    <text class="vcs-history-name" x="70" y="142">One file at a time</text>
    <text class="vcs-history-desc" x="44" y="166">SCCS and RCS. A file was locked</text>
    <text class="vcs-history-desc" x="44" y="182">so only one person could edit</text>
    <text class="vcs-history-desc" x="44" y="198">it.</text>
    <text class="vcs-history-edge" x="44" y="242">1972-82</text>
  </g>
  <line class="vcs-history-line vcs-history-conn vcs-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#vcs-history-tip)"/>
  <g class="vcs-history-stage vcs-history-s1">
    <rect class="vcs-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="vcs-history-step" x="280" y="142">02</text>
    <text class="vcs-history-name" x="306" y="142">A whole project</text>
    <text class="vcs-history-desc" x="280" y="166">CVS allowed concurrent edits —</text>
    <text class="vcs-history-desc" x="280" y="182">which made merging a problem</text>
    <text class="vcs-history-desc" x="280" y="198">worth solving.</text>
    <text class="vcs-history-edge" x="280" y="242">1990</text>
  </g>
  <line class="vcs-history-line vcs-history-conn vcs-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#vcs-history-tip)"/>
  <g class="vcs-history-stage vcs-history-s2">
    <rect class="vcs-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="vcs-history-step" x="516" y="142">03</text>
    <text class="vcs-history-name" x="542" y="142">Centralised, done properly</text>
    <text class="vcs-history-desc" x="516" y="166">Subversion added atomic commits</text>
    <text class="vcs-history-desc" x="516" y="182">and real directory handling.</text>
    <text class="vcs-history-edge" x="516" y="242">2000</text>
  </g>
  <line class="vcs-history-line vcs-history-conn vcs-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#vcs-history-tip)"/>
  <g class="vcs-history-stage vcs-history-s3">
    <rect class="vcs-history-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="vcs-history-step" x="752" y="142">04</text>
    <text class="vcs-history-name" x="778" y="142">Distributed</text>
    <text class="vcs-history-desc" x="752" y="166">Git and Mercurial: every clone</text>
    <text class="vcs-history-desc" x="752" y="182">holds the whole history. Local,</text>
    <text class="vcs-history-desc" x="752" y="198">instant, offline.</text>
    <text class="vcs-history-edge" x="752" y="242">2005</text>
  </g>
  <text class="vcs-history-sub" x="30" y="304">Git was written in about ten days, after the Linux kernel lost access to the proprietary system it had been using. Its priorities — speed, distribution, tamper-evident history — came directly from that.</text>
</svg>
