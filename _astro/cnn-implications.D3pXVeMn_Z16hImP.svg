<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Depth, memory, transfer and defaults.">
  <title>Four consequences of these architectures</title>
  <style>
    .cnn-implications-bg   { fill: #f8fafc; }
    .cnn-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cnn-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cnn-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cnn-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cnn-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cnn-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cnn-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cnn-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cnn-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cnn-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cnn-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cnn-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cnn-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cnn-implications-stage { opacity: 1; }

    .cnn-implications-s0 { animation-delay: 0.00s; }
    .cnn-implications-e0 { animation-delay: 0.00s; }
    .cnn-implications-s1 { animation-delay: 1.28s; }
    .cnn-implications-e1 { animation-delay: 1.28s; }
    .cnn-implications-s2 { animation-delay: 2.56s; }
    .cnn-implications-e2 { animation-delay: 2.56s; }
    .cnn-implications-s3 { animation-delay: 3.84s; }
    .cnn-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cnn-implications-conn  { animation: cnn-implications-trace 6.4s ease-in-out infinite; }
      .cnn-implications-stage { animation: cnn-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cnn-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cnn-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cnn-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cnn-implications-stage { animation: cnn-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cnn-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cnn-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cnn-implications-bg" width="980" height="322"/>
  <text class="cnn-implications-h1"  x="30" y="40">Four consequences of these architectures</text>
  <text class="cnn-implications-sub" x="30" y="64">Depth, memory, transfer and defaults.</text>
  <g class="cnn-implications-stage cnn-implications-s0">
    <rect class="cnn-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cnn-implications-step" x="44" y="142">01</text>
    <text class="cnn-implications-name" x="70" y="142">Residual connections made depth routine</text>
    <text class="cnn-implications-desc" x="44" y="166">And the idea transferred to</text>
    <text class="cnn-implications-desc" x="44" y="182">transformers unchanged.</text>
  </g>
  <line class="cnn-implications-line cnn-implications-conn cnn-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cnn-implications-tip)"/>
  <g class="cnn-implications-stage cnn-implications-s1">
    <rect class="cnn-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cnn-implications-step" x="280" y="142">02</text>
    <text class="cnn-implications-name" x="306" y="142">Activation memory still bounds batch size</text>
    <text class="cnn-implications-desc" x="280" y="166">Skip connections keep more</text>
    <text class="cnn-implications-desc" x="280" y="182">tensors alive for the backward</text>
    <text class="cnn-implications-desc" x="280" y="198">pass.</text>
  </g>
  <line class="cnn-implications-line cnn-implications-conn cnn-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cnn-implications-tip)"/>
  <g class="cnn-implications-stage cnn-implications-s2">
    <rect class="cnn-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cnn-implications-step" x="516" y="142">03</text>
    <text class="cnn-implications-name" x="542" y="142">Pretrained backbones are the norm</text>
    <text class="cnn-implications-desc" x="516" y="166">Almost nobody trains a vision</text>
    <text class="cnn-implications-desc" x="516" y="182">network from scratch — Day 213.</text>
  </g>
  <line class="cnn-implications-line cnn-implications-conn cnn-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cnn-implications-tip)"/>
  <g class="cnn-implications-stage cnn-implications-s3">
    <rect class="cnn-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cnn-implications-step" x="752" y="142">04</text>
    <text class="cnn-implications-name" x="778" y="142">So architecture choice is mostly selection</text>
    <text class="cnn-implications-desc" x="752" y="166">Pick a pretrained family that</text>
    <text class="cnn-implications-desc" x="752" y="182">fits the compute budget.</text>
  </g>
  <text class="cnn-implications-sub" x="30" y="304">The transfer of residual connections to transformers is worth noting: the same identity-path argument appears in every modern architecture, whatever the domain.</text>
</svg>
