<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Finding the nearest few</title>
  <style>
    .topk-bg   { fill: #f8fafc; }
    .topk-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .topk-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .topk-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .topk-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .topk-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .topk-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .topk-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .topk-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .topk-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .topk-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .topk-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .topk-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .topk-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .topk-stage { opacity: 1; }

    .topk-s0 { animation-delay: 0.00s; }
    .topk-e0 { animation-delay: 0.00s; }
    .topk-s1 { animation-delay: 1.28s; }
    .topk-e1 { animation-delay: 1.28s; }
    .topk-s2 { animation-delay: 2.56s; }
    .topk-e2 { animation-delay: 2.56s; }
    .topk-s3 { animation-delay: 3.84s; }
    .topk-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .topk-conn  { animation: topk-trace 6.4s ease-in-out infinite; }
      .topk-stage { animation: topk-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes topk-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes topk-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .topk-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .topk-stage { animation: topk-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes topk-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="topk-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="topk-bg" width="980" height="322"/>
  <text class="topk-h1"  x="30" y="40">Finding the nearest few</text>
  <text class="topk-sub" x="30" y="64">Four steps.</text>
  <g class="topk-stage topk-s0">
    <rect class="topk-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="topk-step" x="44" y="142">01</text>
    <text class="topk-name" x="70" y="142">Compare the query against every vector</text>
    <text class="topk-desc" x="44" y="166">One matrix multiplication, not a</text>
    <text class="topk-desc" x="44" y="182">loop.</text>
  </g>
  <line class="topk-line topk-conn topk-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#topk-tip)"/>
  <g class="topk-stage topk-s1">
    <rect class="topk-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="topk-step" x="280" y="142">02</text>
    <text class="topk-name" x="306" y="142">Producing one score per document</text>
    <text class="topk-desc" x="280" y="166">Millions of them, unsorted.</text>
  </g>
  <line class="topk-line topk-conn topk-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#topk-tip)"/>
  <g class="topk-stage topk-s2">
    <rect class="topk-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="topk-step" x="516" y="142">03</text>
    <text class="topk-name" x="542" y="142">Select the best few without sorting everything</text>
    <text class="topk-desc" x="516" y="166">A bounded selection, not a full</text>
    <text class="topk-desc" x="516" y="182">ordering.</text>
  </g>
  <line class="topk-line topk-conn topk-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#topk-tip)"/>
  <g class="topk-stage topk-s3">
    <rect class="topk-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="topk-step" x="752" y="142">04</text>
    <text class="topk-name" x="778" y="142">Then sort only those</text>
    <text class="topk-desc" x="752" y="166">Which is what a partial</text>
    <text class="topk-desc" x="752" y="182">selection buys.</text>
    <text class="topk-edge" x="752" y="242">k, not n</text>
  </g>
  <text class="topk-sub" x="30" y="304">Sorting the whole score array to take the top ten is the naive version and it dominates the cost at scale, which is why the selection step exists at all.</text>
</svg>
