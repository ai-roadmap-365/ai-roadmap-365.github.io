<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The same calculation.">
  <title>Renting or buying a vehicle</title>
  <style>
    .rent-or-buy-bg   { fill: #f8fafc; }
    .rent-or-buy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rent-or-buy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rent-or-buy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rent-or-buy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rent-or-buy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rent-or-buy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rent-or-buy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rent-or-buy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rent-or-buy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rent-or-buy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rent-or-buy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rent-or-buy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rent-or-buy-row { opacity: 1; }
    .rent-or-buy-r0 { animation-delay: 0.00s; }
    .rent-or-buy-r1 { animation-delay: 0.45s; }
    .rent-or-buy-r2 { animation-delay: 0.90s; }
    .rent-or-buy-r3 { animation-delay: 1.35s; }
    .rent-or-buy-r4 { animation-delay: 1.80s; }
    .rent-or-buy-row { animation: rent-or-buy-reveal 7.3s ease-in-out infinite; }
    @keyframes rent-or-buy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="rent-or-buy-bg" width="980" height="390"/>
  <text class="rent-or-buy-h1"  x="30" y="40">Renting or buying a vehicle</text>
  <text class="rent-or-buy-sub" x="30" y="64">The same calculation.</text>
  <rect class="rent-or-buy-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="rent-or-buy-name" x="46" y="122">Renting</text>
  <text class="rent-or-buy-desc" x="46" y="142">Pay per use.</text>
  <text class="rent-or-buy-desc rent-or-buy-row rent-or-buy-r0" x="46" y="182">Nothing when you are not driving</text>
  <text class="rent-or-buy-desc rent-or-buy-row rent-or-buy-r1" x="46" y="216">Always a current model</text>
  <text class="rent-or-buy-desc rent-or-buy-row rent-or-buy-r2" x="46" y="250">Maintenance is somebody else's problem</text>
  <text class="rent-or-buy-desc rent-or-buy-row rent-or-buy-r3" x="46" y="284">Expensive if you drive daily</text>
  <text class="rent-or-buy-desc rent-or-buy-row rent-or-buy-r4" x="46" y="318">This is the hosted API</text>
  <rect class="rent-or-buy-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="rent-or-buy-name" x="526" y="122">Owning</text>
  <text class="rent-or-buy-desc" x="526" y="142">Pay up front.</text>
  <text class="rent-or-buy-desc rent-or-buy-row rent-or-buy-r0" x="526" y="182">A fixed cost regardless of use</text>
  <text class="rent-or-buy-desc rent-or-buy-row rent-or-buy-r1" x="526" y="216">The model you bought, unchanged</text>
  <text class="rent-or-buy-desc rent-or-buy-row rent-or-buy-r2" x="526" y="250">Maintenance is yours</text>
  <text class="rent-or-buy-desc rent-or-buy-row rent-or-buy-r3" x="526" y="284">Cheaper past a mileage threshold</text>
  <text class="rent-or-buy-desc rent-or-buy-row rent-or-buy-r4" x="526" y="318">This is self-hosting</text>
  <text class="rent-or-buy-sub" x="30" y="372">The analogy also carries the constraint case: some journeys cannot legally be made in a rented vehicle, and that decides the question without any arithmetic.</text>
</svg>
