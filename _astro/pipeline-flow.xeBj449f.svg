<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" role="img" aria-labelledby="d126fTitleId d126fDescId">
  <title id="d126fTitleId">A frame moving through the pipeline's steps, with the row count and step log filling in, then a second run landing on the identical hash</title>
  <desc id="d126fDescId">A token labelled 7 rows travels left to right through seven step nodes, shrinking to 6 rows at the dedupe_orders step and staying at 6 for the remaining steps, while a step-log panel below fills in one line per step as the token passes. At the end the token reaches an output-hash box. A second, fainter token then repeats the identical journey and lands on the identical hash, with a checkmark confirming the two hashes agree -- the same input always gives the same artifact.</desc>

  <style>
    .d126f-bg      { fill: #f8fafc; }
    .d126f-title   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; fill: #1a202c; }
    .d126f-sub     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d126f-label   { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; fill: #1a202c; }
    .d126f-caption { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d126f-node    { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d126f-dedupe  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.5; }
    .d126f-logline { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1; }
    .d126f-hashbox { fill: #dcfce7; stroke: #047857; stroke-width: 1.75; }
    .d126f-rail    { stroke: #cbd5e1; stroke-width: 3; fill: none; }

    /* Motion 1: the primary token travels the pipeline, left to right. */
    .d126f-token1 {
      offset-path: path('M 60 120 L 190 120 L 320 120 L 450 120 L 580 120 L 710 120 L 840 120 L 980 120');
      offset-rotate: 0deg;
      animation: d126f-travel1 8s ease-in-out infinite;
    }
    @keyframes d126f-travel1 {
      0%          { offset-distance: 0%; }
      6%, 100%    { offset-distance: 0%; }
      16%         { offset-distance: 14%; }
      26%         { offset-distance: 28%; }
      36%         { offset-distance: 42%; }
      46%         { offset-distance: 57%; }
      56%         { offset-distance: 71%; }
      66%         { offset-distance: 85%; }
      74%, 92%    { offset-distance: 100%; }
    }

    /* Motion 2: a second, fainter token repeats the SAME journey to prove
       the second run lands on the identical hash. */
    .d126f-token2 {
      offset-path: path('M 60 120 L 190 120 L 320 120 L 450 120 L 580 120 L 710 120 L 840 120 L 980 120');
      offset-rotate: 0deg;
      opacity: 0;
      animation: d126f-travel2 8s ease-in-out infinite;
    }
    @keyframes d126f-travel2 {
      0%, 74%     { offset-distance: 0%; opacity: 0; }
      76%         { opacity: 0.85; }
      84%         { offset-distance: 100%; }
      92%, 100%   { offset-distance: 100%; opacity: 0.85; }
    }

    /* Motion 3: each step node lights up as the primary token passes it. */
    .d126f-step { animation: d126f-lightup 8s ease-in-out infinite; }
    .d126f-s1 { animation-delay: 0.00s; } .d126f-s2 { animation-delay: 0.72s; }
    .d126f-s3 { animation-delay: 1.44s; } .d126f-s4 { animation-delay: 2.16s; }
    .d126f-s5 { animation-delay: 2.88s; } .d126f-s6 { animation-delay: 3.60s; }
    .d126f-s7 { animation-delay: 4.32s; }
    @keyframes d126f-lightup {
      0%, 12%, 100% { stroke-width: 1.5; }
      4%, 8%        { stroke-width: 3.5; }
    }

    /* Motion 4: the row-count label at dedupe_orders switches 7 -> 6. */
    .d126f-count7 { animation: d126f-fadeout 8s ease-in-out infinite; }
    .d126f-count6 { animation: d126f-fadein 8s ease-in-out infinite; }
    @keyframes d126f-fadeout { 0%, 40% { opacity: 1; } 46%, 100% { opacity: 0; } }
    @keyframes d126f-fadein  { 0%, 40% { opacity: 0; } 46%, 100% { opacity: 1; } }

    /* Motion 5: the step-log lines reveal one at a time, staggered with the token. */
    .d126f-logrow { opacity: 0; animation: d126f-reveal 8s ease-in-out infinite; }
    .d126f-l1 { animation-delay: 0.10s; } .d126f-l2 { animation-delay: 0.82s; }
    .d126f-l3 { animation-delay: 1.54s; } .d126f-l4 { animation-delay: 2.26s; }
    .d126f-l5 { animation-delay: 2.98s; } .d126f-l6 { animation-delay: 3.70s; }
    .d126f-l7 { animation-delay: 4.42s; }
    @keyframes d126f-reveal { 0%, 6% { opacity: 0; } 12%, 100% { opacity: 1; } }

    /* Motion 6: the two hashes pulse and a checkmark appears once both tokens finish. */
    .d126f-hash1 { animation: d126f-settle 8s ease-in-out infinite; }
    .d126f-hash2 { opacity: 0; animation: d126f-hash2in 8s ease-in-out infinite; }
    .d126f-check { opacity: 0; animation: d126f-checkin 8s ease-in-out infinite; }
    @keyframes d126f-settle { 0%, 74% { fill: #f1f5f9; stroke: #94a3b8; } 80%, 100% { fill: #dcfce7; stroke: #047857; } }
    @keyframes d126f-hash2in { 0%, 82% { opacity: 0; } 90%, 100% { opacity: 1; } }
    @keyframes d126f-checkin { 0%, 90% { opacity: 0; } 96%, 100% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .d126f-token1, .d126f-token2 { animation: none; offset-distance: 100%; }
      .d126f-token2 { opacity: 0.85; }
      .d126f-step { animation: none; stroke-width: 1.5; }
      /* reduce-ok: .d126f-count7 — half of a before/after pair. 7 is the input
         count and 6 the output; with motion off the diagram settles on the
         output, and the subtitle states both numbers in text. */
      .d126f-count7 { animation: none; opacity: 0; }
      .d126f-count6 { animation: none; opacity: 1; }
      .d126f-logrow { animation: none; opacity: 1; }
      .d126f-hash1 { animation: none; fill: #dcfce7; stroke: #047857; }
      .d126f-hash2 { animation: none; opacity: 1; }
      .d126f-check { animation: none; opacity: 1; }
    }
  </style>

  <rect class="d126f-bg" x="0" y="0" width="1100" height="640" />

  <text class="d126f-title" x="24" y="34">Same input, same artifact -- every time</text>
  <text class="d126f-sub" x="24" y="54">7 rows enter; dedupe_orders removes 1; every re-run lands on the identical output hash.</text>

  <!-- rail -->
  <path class="d126f-rail" d="M 40 120 L 1000 120" />

  <!-- seven step nodes -->
  <g class="d126f-step d126f-s1"><rect class="d126f-node" x="115" y="98" width="90" height="44" rx="6" /><text class="d126f-label" x="123" y="116">1. parse</text><text class="d126f-label" x="123" y="130">currency</text></g>
  <g class="d126f-step d126f-s2"><rect class="d126f-node" x="245" y="98" width="90" height="44" rx="6" /><text class="d126f-label" x="253" y="116">2. normalize</text><text class="d126f-label" x="253" y="130">region</text></g>
  <g class="d126f-step d126f-s3"><rect class="d126f-dedupe" x="375" y="98" width="90" height="44" rx="6" /><text class="d126f-label" x="383" y="116">3. dedupe</text><text class="d126f-label" x="383" y="130">orders</text></g>
  <g class="d126f-step d126f-s4"><rect class="d126f-node" x="505" y="98" width="90" height="44" rx="6" /><text class="d126f-label" x="513" y="116">4. impute</text><text class="d126f-label" x="513" y="130">amount</text></g>
  <g class="d126f-step d126f-s5"><rect class="d126f-node" x="635" y="98" width="90" height="44" rx="6" /><text class="d126f-label" x="643" y="116">5. clip</text><text class="d126f-label" x="643" y="130">amount</text></g>
  <g class="d126f-step d126f-s6"><rect class="d126f-node" x="765" y="98" width="90" height="44" rx="6" /><text class="d126f-label" x="773" y="116">6. add</text><text class="d126f-label" x="773" y="130">zscore</text></g>
  <g class="d126f-step d126f-s7"><rect class="d126f-node" x="895" y="98" width="90" height="44" rx="6" /><text class="d126f-label" x="903" y="116">7. sort</text><text class="d126f-label" x="903" y="130">deterministic</text></g>

  <!-- row-count crossfade, above the dedupe step -->
  <text class="d126f-label d126f-count7" x="382" y="86" font-size="14" font-weight="700" fill="#b91c1c">7 rows</text>
  <text class="d126f-label d126f-count6" x="382" y="86" font-size="14" font-weight="700" fill="#047857">6 rows</text>

  <!-- the two travelling tokens -->
  <circle class="d126f-token1" r="9" fill="#1d4ed8" />
  <circle class="d126f-token2" r="9" fill="#7e22ce" />

  <!-- step log panel -->
  <rect x="24" y="180" width="620" height="240" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text class="d126f-label" x="36" y="204" font-weight="700">step log</text>
  <g class="d126f-logrow d126f-l1"><rect class="d126f-logline" x="36" y="216" width="590" height="24" rx="4" /><text class="d126f-label" x="44" y="232">parse_currency_amount        rows_in=7  rows_out=7  delta=0</text></g>
  <g class="d126f-logrow d126f-l2"><rect class="d126f-logline" x="36" y="244" width="590" height="24" rx="4" /><text class="d126f-label" x="44" y="260">normalize_region_strings     rows_in=7  rows_out=7  delta=0</text></g>
  <g class="d126f-logrow d126f-l3"><rect class="d126f-logline" x="36" y="272" width="590" height="24" rx="4" /><text class="d126f-label" x="44" y="288">dedupe_orders                rows_in=7  rows_out=6  delta=-1</text></g>
  <g class="d126f-logrow d126f-l4"><rect class="d126f-logline" x="36" y="300" width="590" height="24" rx="4" /><text class="d126f-label" x="44" y="316">impute_missing_amount        rows_in=6  rows_out=6  delta=0</text></g>
  <g class="d126f-logrow d126f-l5"><rect class="d126f-logline" x="36" y="328" width="590" height="24" rx="4" /><text class="d126f-label" x="44" y="344">clip_amount_to_fixed_ceiling rows_in=6  rows_out=6  delta=0</text></g>
  <g class="d126f-logrow d126f-l6"><rect class="d126f-logline" x="36" y="356" width="590" height="24" rx="4" /><text class="d126f-label" x="44" y="372">add_amount_zscore            rows_in=6  rows_out=6  delta=0</text></g>
  <g class="d126f-logrow d126f-l7"><rect class="d126f-logline" x="36" y="384" width="590" height="24" rx="4" /><text class="d126f-label" x="44" y="400">sort_deterministic            rows_in=6  rows_out=6  delta=0</text></g>

  <!-- hash boxes -->
  <rect class="d126f-hashbox d126f-hash1" x="700" y="200" width="340" height="60" rx="8" />
  <text class="d126f-label" x="716" y="224" font-weight="700">run 1 output_hash</text>
  <text class="d126f-label" x="716" y="244">9be4e83f...87fe2d93f</text>

  <rect class="d126f-hashbox d126f-hash2" x="700" y="280" width="340" height="60" rx="8" />
  <text class="d126f-label" x="716" y="304" font-weight="700">run 2 output_hash</text>
  <text class="d126f-label" x="716" y="324">9be4e83f...87fe2d93f</text>

  <g class="d126f-check" transform="translate(1050,240)">
    <circle r="16" fill="#dcfce7" stroke="#047857" stroke-width="2" />
    <path d="M -7,0 L -2,6 L 8,-7" stroke="#047857" stroke-width="2.5" fill="none" />
  </g>
  <text class="d126f-label d126f-check" x="700" y="372" font-weight="700" fill="#047857">identical -- run 2 landed on run 1's exact hash</text>

  <!-- ============================ CAPTION ============================ -->
  <rect x="24" y="440" width="1050" height="180" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text class="d126f-caption" x="40" y="466">Watch the row count: 7 going in, 6 coming out of dedupe_orders, 6 for every step after it -- the step log</text>
  <text class="d126f-caption" x="40" y="490">records that change as it happens, so a step that quietly drops rows nobody meant to drop is caught at the</text>
  <text class="d126f-caption" x="40" y="514">step, not only noticed later in a mismatched final total. The second, fainter token repeats the identical</text>
  <text class="d126f-caption" x="40" y="538">journey and lands on the identical output hash -- because every step reads its thresholds from configuration,</text>
  <text class="d126f-caption" x="40" y="562">never from the data passing through it, the same input always produces the same artifact, run after run.</text>
  <text class="d126f-caption" x="40" y="594" font-style="italic">Reduced motion: this frame shows the finished state directly -- 6 rows, every log line filled in, both hashes shown, checked.</text>
</svg>
