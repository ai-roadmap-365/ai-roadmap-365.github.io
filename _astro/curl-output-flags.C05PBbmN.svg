<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Confused constantly, and each does one thing.">
  <title>Four flags that control what curl prints</title>
  <style>
    .curl-output-flags-bg   { fill: #f8fafc; }
    .curl-output-flags-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .curl-output-flags-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .curl-output-flags-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .curl-output-flags-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .curl-output-flags-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .curl-output-flags-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .curl-output-flags-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .curl-output-flags-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .curl-output-flags-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .curl-output-flags-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .curl-output-flags-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .curl-output-flags-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .curl-output-flags-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .curl-output-flags-stage { opacity: 1; }

    .curl-output-flags-s0 { animation-delay: 0.00s; }
    .curl-output-flags-e0 { animation-delay: 0.00s; }
    .curl-output-flags-s1 { animation-delay: 1.28s; }
    .curl-output-flags-e1 { animation-delay: 1.28s; }
    .curl-output-flags-s2 { animation-delay: 2.56s; }
    .curl-output-flags-e2 { animation-delay: 2.56s; }
    .curl-output-flags-s3 { animation-delay: 3.84s; }
    .curl-output-flags-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .curl-output-flags-conn  { animation: curl-output-flags-trace 6.4s ease-in-out infinite; }
      .curl-output-flags-stage { animation: curl-output-flags-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes curl-output-flags-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes curl-output-flags-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .curl-output-flags-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .curl-output-flags-stage { animation: curl-output-flags-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes curl-output-flags-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="curl-output-flags-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="curl-output-flags-bg" width="980" height="322"/>
  <text class="curl-output-flags-h1"  x="30" y="40">Four flags that control what curl prints</text>
  <text class="curl-output-flags-sub" x="30" y="64">Confused constantly, and each does one thing.</text>
  <g class="curl-output-flags-stage curl-output-flags-s0">
    <rect class="curl-output-flags-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="curl-output-flags-step" x="44" y="142">01</text>
    <text class="curl-output-flags-name" x="70" y="142">-s</text>
    <text class="curl-output-flags-desc" x="44" y="166">Silent. Hides the progress</text>
    <text class="curl-output-flags-desc" x="44" y="182">meter, so only the response</text>
    <text class="curl-output-flags-desc" x="44" y="198">prints.</text>
    <text class="curl-output-flags-edge" x="44" y="242">quiet</text>
  </g>
  <line class="curl-output-flags-line curl-output-flags-conn curl-output-flags-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#curl-output-flags-tip)"/>
  <g class="curl-output-flags-stage curl-output-flags-s1">
    <rect class="curl-output-flags-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="curl-output-flags-step" x="280" y="142">02</text>
    <text class="curl-output-flags-name" x="306" y="142">-i</text>
    <text class="curl-output-flags-desc" x="280" y="166">Include the response headers</text>
    <text class="curl-output-flags-desc" x="280" y="182">ABOVE the body.</text>
    <text class="curl-output-flags-edge" x="280" y="242">headers + body</text>
  </g>
  <line class="curl-output-flags-line curl-output-flags-conn curl-output-flags-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#curl-output-flags-tip)"/>
  <g class="curl-output-flags-stage curl-output-flags-s2">
    <rect class="curl-output-flags-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="curl-output-flags-step" x="516" y="142">03</text>
    <text class="curl-output-flags-name" x="542" y="142">-I</text>
    <text class="curl-output-flags-desc" x="516" y="166">Headers ONLY, via a HEAD</text>
    <text class="curl-output-flags-desc" x="516" y="182">request. No body is fetched at</text>
    <text class="curl-output-flags-desc" x="516" y="198">all.</text>
    <text class="curl-output-flags-edge" x="516" y="242">headers only</text>
  </g>
  <line class="curl-output-flags-line curl-output-flags-conn curl-output-flags-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#curl-output-flags-tip)"/>
  <g class="curl-output-flags-stage curl-output-flags-s3">
    <rect class="curl-output-flags-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="curl-output-flags-step" x="752" y="142">04</text>
    <text class="curl-output-flags-name" x="778" y="142">-o file</text>
    <text class="curl-output-flags-desc" x="752" y="166">Body to a file. Pair with -w to</text>
    <text class="curl-output-flags-desc" x="752" y="182">print just the timings or</text>
    <text class="curl-output-flags-desc" x="752" y="198">status.</text>
    <text class="curl-output-flags-edge" x="752" y="242">to disk</text>
  </g>
  <text class="curl-output-flags-sub" x="30" y="304">The pair worth memorising is -s -o /dev/null -w '%{http_code}': make the request, discard the body, print nothing but the status. That one line is most health checks.</text>
</svg>
