<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Different fixes.">
  <title>Two citation failures</title>
  <style>
    .precision-recall-cite-bg   { fill: #f8fafc; }
    .precision-recall-cite-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .precision-recall-cite-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .precision-recall-cite-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .precision-recall-cite-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .precision-recall-cite-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .precision-recall-cite-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .precision-recall-cite-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .precision-recall-cite-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .precision-recall-cite-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .precision-recall-cite-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .precision-recall-cite-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .precision-recall-cite-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .precision-recall-cite-row { opacity: 1; }
    .precision-recall-cite-r0 { animation-delay: 0.00s; }
    .precision-recall-cite-r1 { animation-delay: 0.45s; }
    .precision-recall-cite-r2 { animation-delay: 0.90s; }
    .precision-recall-cite-r3 { animation-delay: 1.35s; }
    .precision-recall-cite-r4 { animation-delay: 1.80s; }
    .precision-recall-cite-row { animation: precision-recall-cite-reveal 7.3s ease-in-out infinite; }
    @keyframes precision-recall-cite-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="precision-recall-cite-bg" width="980" height="390"/>
  <text class="precision-recall-cite-h1"  x="30" y="40">Two citation failures</text>
  <text class="precision-recall-cite-sub" x="30" y="64">Different fixes.</text>
  <rect class="precision-recall-cite-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="precision-recall-cite-name" x="46" y="122">Precision</text>
  <text class="precision-recall-cite-desc" x="46" y="142">Are the citations right.</text>
  <text class="precision-recall-cite-desc precision-recall-cite-row precision-recall-cite-r0" x="46" y="182">Cited sentences actually support the claim</text>
  <text class="precision-recall-cite-desc precision-recall-cite-row precision-recall-cite-r1" x="46" y="216">Low precision means fabricated attribution</text>
  <text class="precision-recall-cite-desc precision-recall-cite-row precision-recall-cite-r2" x="46" y="250">Fixed by stricter entailment checking</text>
  <text class="precision-recall-cite-desc precision-recall-cite-row precision-recall-cite-r3" x="46" y="284">The failure users notice</text>
  <text class="precision-recall-cite-desc precision-recall-cite-row precision-recall-cite-r4" x="46" y="318">Worse for trust</text>
  <rect class="precision-recall-cite-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="precision-recall-cite-name" x="526" y="122">Recall</text>
  <text class="precision-recall-cite-desc" x="526" y="142">Is everything cited.</text>
  <text class="precision-recall-cite-desc precision-recall-cite-row precision-recall-cite-r0" x="526" y="182">Every claim has a citation</text>
  <text class="precision-recall-cite-desc precision-recall-cite-row precision-recall-cite-r1" x="526" y="216">Low recall means uncited assertions</text>
  <text class="precision-recall-cite-desc precision-recall-cite-row precision-recall-cite-r2" x="526" y="250">Fixed by better retrieval or stricter prompting</text>
  <text class="precision-recall-cite-desc precision-recall-cite-row precision-recall-cite-r3" x="526" y="284">The failure users do not notice</text>
  <text class="precision-recall-cite-desc precision-recall-cite-row precision-recall-cite-r4" x="526" y="318">Worse for correctness</text>
  <text class="precision-recall-cite-sub" x="30" y="372">Reporting one number hides which of these is failing, and they need entirely different remedies — one is a checking problem and the other is a retrieval problem.</text>
</svg>
