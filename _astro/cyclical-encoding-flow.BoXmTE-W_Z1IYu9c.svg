<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="d137f-title d137f-desc">
  <title id="d137f-title">Cyclical encoding: hour 23 and hour 0 become neighbours again</title>
  <desc id="d137f-desc">Hours laid out on a straight line put 23 and 0 twenty-three units apart. Wrapped onto a circle by sine and cosine, the same pair sits 0.2611 apart, exactly as far as every other adjacent pair.</desc>
  <style>
    .d137f-bg { fill: #f8fafc; }
    .d137f-t { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a202c; }
    .d137f-h { font-size: 21px; font-weight: 700; }
    .d137f-sub { font-size: 15px; fill: #475569; }
    .d137f-lbl { font-size: 15px; }
    .d137f-lbl-b { font-size: 15px; font-weight: 700; }
    .d137f-small { font-size: 14px; fill: #334155; }
    .d137f-tick { font-size: 14px; fill: #475569; }
    .d137f-axis { stroke: #1a202c; stroke-width: 2.5; }
    .d137f-mark { stroke: #1a202c; stroke-width: 1.5; }
    .d137f-ring { fill: none; stroke: #1d4ed8; stroke-width: 2.5; }
    .d137f-dot { fill: #94a3b8; }
    .d137f-hot { fill: #b91c1c; }
    .d137f-cool { fill: #15803d; }
    .d137f-span { stroke: #b91c1c; stroke-width: 2.5; fill: none; }
    .d137f-good { stroke: #15803d; stroke-width: 2.5; fill: none; }
    .d137f-wrap { stroke: #1d4ed8; stroke-width: 3; fill: none; stroke-dasharray: 10 7; }
    .d137f-panel { fill: #ffffff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d137f-red { fill: #b91c1c; font-weight: 700; }
    .d137f-green { fill: #15803d; font-weight: 700; }
    .d137f-blue { fill: #1d4ed8; font-weight: 700; }

    .d137f-march { animation: d137f-march 5s linear infinite; }
    @keyframes d137f-march { to { stroke-dashoffset: -34; } }

    .d137f-token { animation: d137f-slide 6s ease-in-out infinite; }
    @keyframes d137f-slide {
      0%   { transform: translateX(0px); }
      45%  { transform: translateX(380px); }
      55%  { transform: translateX(380px); }
      100% { transform: translateX(0px); }
    }

    .d137f-orbit { transform-origin: 720px 300px; animation: d137f-orbit 8s linear infinite; }
    @keyframes d137f-orbit { to { transform: rotate(360deg); } }

    .d137f-pulse { animation: d137f-pulse 4s ease-in-out infinite; }
    @keyframes d137f-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

    @media (prefers-reduced-motion: reduce) {
      .d137f-march { animation: none; stroke-dasharray: none; }
      .d137f-token { animation: none; transform: translateX(0px); }
      .d137f-orbit { animation: none; transform: rotate(0deg); }
      .d137f-pulse { animation: none; opacity: 1; }
    }
  </style>

  <rect class="d137f-bg" width="980" height="620" />

  <text class="d137f-t d137f-h" x="30" y="38">Cyclical encoding: hour 23 and hour 0 become neighbours again</text>
  <text class="d137f-t d137f-sub" x="30" y="62">The clock wraps. An integer column does not, so midnight sits at the far end of the ruler from eleven at night.</text>

  <!-- LEFT: the raw integer line -->
  <text class="d137f-t d137f-lbl-b d137f-red" x="40" y="112">RAW INTEGER HOUR — the wrap is invisible</text>

  <line class="d137f-axis" x1="60" y1="250" x2="450" y2="250" />
  <g class="d137f-tick d137f-t">
    <line class="d137f-mark" x1="60" y1="244" x2="60" y2="256" /><text x="55" y="276">0</text>
    <line class="d137f-mark" x1="110" y1="244" x2="110" y2="256" /><text x="102" y="276">3</text>
    <line class="d137f-mark" x1="127" y1="244" x2="127" y2="256" /><text x="119" y="276">4</text>
    <line class="d137f-mark" x1="196" y1="244" x2="196" y2="256" /><text x="188" y="276">8</text>
    <line class="d137f-mark" x1="264" y1="244" x2="264" y2="256" /><text x="253" y="276">12</text>
    <line class="d137f-mark" x1="365" y1="244" x2="365" y2="256" /><text x="354" y="276">18</text>
    <line class="d137f-mark" x1="450" y1="244" x2="450" y2="256" /><text x="440" y="276">23</text>
  </g>

  <circle class="d137f-hot" cx="60" cy="250" r="7" />
  <circle class="d137f-hot" cx="450" cy="250" r="7" />
  <circle class="d137f-cool" cx="110" cy="250" r="6" />
  <circle class="d137f-cool" cx="127" cy="250" r="6" />

  <path class="d137f-span" d="M 60 218 L 60 200 L 450 200 L 450 218" />
  <text class="d137f-t d137f-lbl-b d137f-red" x="176" y="190">23 to 0 = 23.0</text>

  <path class="d137f-good" d="M 110 300 L 110 316 L 127 316 L 127 300" />
  <text class="d137f-t d137f-lbl-b d137f-green" x="82" y="338">3 to 4 = 1.0</text>

  <circle class="d137f-token" cx="60" cy="250" r="10" fill="#1d4ed8" opacity="0.85" />

  <text class="d137f-t d137f-small" x="40" y="376">Every adjacent pair is 1.0 apart except the one that matters:</text>
  <text class="d137f-t d137f-small" x="40" y="396">the wrap from 23 to 0, which the ruler records as the largest</text>
  <text class="d137f-t d137f-small" x="40" y="416">gap on it. Spread across the 24 adjacent pairs: 22.0.</text>

  <!-- the wrap arrow -->
  <path class="d137f-wrap d137f-march" d="M 470 300 C 520 240, 540 380, 590 320" marker-end="url(#d137f-arrow)" />
  <text class="d137f-t d137f-lbl-b d137f-blue" x="464" y="222">sin, cos</text>
  <text class="d137f-t d137f-small" x="452" y="242">angle = 2*pi*h/24</text>

  <!-- RIGHT: the circle -->
  <text class="d137f-t d137f-lbl-b d137f-green" x="600" y="112">SINE AND COSINE — the wrap is restored</text>

  <circle class="d137f-ring" cx="720" cy="300" r="110" />
  <g class="d137f-dot">
    <circle cx="720" cy="190" r="0" />
    <circle cx="748.5" cy="193.7" r="5" /><circle cx="775" cy="204.6" r="5" />
    <circle cx="797.8" cy="222.2" r="5" /><circle cx="815.4" cy="245" r="5" />
    <circle cx="826.3" cy="271.5" r="5" /><circle cx="830" cy="300" r="5" />
    <circle cx="826.3" cy="328.5" r="5" /><circle cx="815.4" cy="355" r="5" />
    <circle cx="797.8" cy="377.8" r="5" /><circle cx="775" cy="395.4" r="5" />
    <circle cx="748.5" cy="406.3" r="5" /><circle cx="720" cy="410" r="5" />
    <circle cx="691.5" cy="406.3" r="5" /><circle cx="665" cy="395.4" r="5" />
    <circle cx="642.2" cy="377.8" r="5" /><circle cx="624.6" cy="355" r="5" />
    <circle cx="613.7" cy="328.5" r="5" /><circle cx="610" cy="300" r="5" />
    <circle cx="613.7" cy="271.5" r="5" /><circle cx="624.6" cy="245" r="5" />
    <circle cx="642.2" cy="222.2" r="5" /><circle cx="665" cy="204.6" r="5" />
  </g>

  <g class="d137f-pulse">
    <circle class="d137f-hot" cx="720" cy="190" r="8" />
    <circle class="d137f-hot" cx="691.5" cy="193.7" r="8" />
  </g>
  <text class="d137f-t d137f-lbl-b" x="714" y="176">0</text>
  <text class="d137f-t d137f-lbl-b" x="656" y="180">23</text>
  <circle class="d137f-cool" cx="797.8" cy="222.2" r="7" />
  <circle class="d137f-cool" cx="815.4" cy="245" r="7" />
  <text class="d137f-t d137f-tick" x="818" y="214">3</text>
  <text class="d137f-t d137f-tick" x="836" y="242">4</text>
  <text class="d137f-t d137f-tick" x="838" y="306">6</text>
  <text class="d137f-t d137f-tick" x="714" y="432">12</text>
  <text class="d137f-t d137f-tick" x="578" y="306">18</text>

  <g class="d137f-orbit">
    <circle cx="720" cy="190" r="9" fill="#1d4ed8" opacity="0.85" />
  </g>

  <text class="d137f-t d137f-lbl-b d137f-green" x="600" y="470">23 to 0 = 0.2611</text>
  <text class="d137f-t d137f-lbl-b d137f-green" x="790" y="470">3 to 4 = 0.2611</text>
  <text class="d137f-t d137f-small" x="600" y="494">Both are 2*sin(pi/24). Spread across all 24 adjacent</text>
  <text class="d137f-t d137f-small" x="600" y="514">pairs: below 1e-12. Opposite hours stay 2.0 apart.</text>

  <rect class="d137f-panel" x="40" y="540" width="900" height="60" rx="8" />
  <text class="d137f-t d137f-small" x="60" y="564">Two columns replace one, and the distance between any two hours now means what it means on a clock. With motion disabled every hour,</text>
  <text class="d137f-t d137f-small" x="60" y="584">every distance and both labelled pairs are already drawn; the animation only shows the order — walk the ruler, wrap it, then go round.</text>

  <defs>
    <marker id="d137f-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
  </defs>
</svg>
