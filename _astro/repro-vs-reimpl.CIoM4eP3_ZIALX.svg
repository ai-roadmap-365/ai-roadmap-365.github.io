<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Different goals.">
  <title>Reproduction against reimplementation</title>
  <style>
    .repro-vs-reimpl-bg   { fill: #f8fafc; }
    .repro-vs-reimpl-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-vs-reimpl-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-vs-reimpl-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-vs-reimpl-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-vs-reimpl-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-vs-reimpl-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .repro-vs-reimpl-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .repro-vs-reimpl-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .repro-vs-reimpl-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .repro-vs-reimpl-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .repro-vs-reimpl-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .repro-vs-reimpl-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .repro-vs-reimpl-row { opacity: 1; }
    .repro-vs-reimpl-r0 { animation-delay: 0.00s; }
    .repro-vs-reimpl-r1 { animation-delay: 0.45s; }
    .repro-vs-reimpl-r2 { animation-delay: 0.90s; }
    .repro-vs-reimpl-r3 { animation-delay: 1.35s; }
    .repro-vs-reimpl-r4 { animation-delay: 1.80s; }
    .repro-vs-reimpl-row { animation: repro-vs-reimpl-reveal 7.3s ease-in-out infinite; }
    @keyframes repro-vs-reimpl-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="repro-vs-reimpl-bg" width="980" height="390"/>
  <text class="repro-vs-reimpl-h1"  x="30" y="40">Reproduction against reimplementation</text>
  <text class="repro-vs-reimpl-sub" x="30" y="64">Different goals.</text>
  <rect class="repro-vs-reimpl-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="repro-vs-reimpl-name" x="46" y="122">Reproduction</text>
  <text class="repro-vs-reimpl-desc" x="46" y="142">Do the numbers hold?</text>
  <text class="repro-vs-reimpl-desc repro-vs-reimpl-row repro-vs-reimpl-r0" x="46" y="182">Same data, same setup, same metric</text>
  <text class="repro-vs-reimpl-desc repro-vs-reimpl-row repro-vs-reimpl-r1" x="46" y="216">Success is matching within variance</text>
  <text class="repro-vs-reimpl-desc repro-vs-reimpl-row repro-vs-reimpl-r2" x="46" y="250">Every deviation documented</text>
  <text class="repro-vs-reimpl-desc repro-vs-reimpl-row repro-vs-reimpl-r3" x="46" y="284">Tests the claim as published</text>
  <text class="repro-vs-reimpl-desc repro-vs-reimpl-row repro-vs-reimpl-r4" x="46" y="318">Which is a scientific contribution</text>
  <rect class="repro-vs-reimpl-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="repro-vs-reimpl-name" x="526" y="122">Reimplementation</text>
  <text class="repro-vs-reimpl-desc" x="526" y="142">Does the method work?</text>
  <text class="repro-vs-reimpl-desc repro-vs-reimpl-row repro-vs-reimpl-r0" x="526" y="182">Your data, your setup</text>
  <text class="repro-vs-reimpl-desc repro-vs-reimpl-row repro-vs-reimpl-r1" x="526" y="216">Success is the method helping</text>
  <text class="repro-vs-reimpl-desc repro-vs-reimpl-row repro-vs-reimpl-r2" x="526" y="250">Deviations expected and deliberate</text>
  <text class="repro-vs-reimpl-desc repro-vs-reimpl-row repro-vs-reimpl-r3" x="526" y="284">Tests whether it transfers</text>
  <text class="repro-vs-reimpl-desc repro-vs-reimpl-row repro-vs-reimpl-r4" x="526" y="318">Which is an engineering question</text>
  <text class="repro-vs-reimpl-sub" x="30" y="372">Conflating the two produces the most common false conclusion in this work: a method that fails on different data has not been shown to fail as published.</text>
</svg>
