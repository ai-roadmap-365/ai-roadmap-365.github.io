<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="k-Nearest Neighbors Inference Flow">
  <title>k-Nearest Neighbors Inference Flow</title>
  <defs>
    <style>
      .d157f-bg { fill: #f8fafc; }
      .d157f-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d157f-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; }
      .d157f-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; }
      .d157f-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 14px; font-weight: 600; }
      .d157f-arrow { stroke: #2563eb; stroke-width: 2; marker-end: url(#d157f-arr); fill: none; }
      
      @keyframes d157f-expand {
        0% { r: 10; opacity: 0.8; }
        100% { r: 60; opacity: 0.2; }
      }
      .d157f-radar { animation: d157f-expand 2.5s infinite ease-out; fill: #3b82f6; }
      
      @media (prefers-reduced-motion: reduce) {
        .d157f-radar { animation: none; r: 40; opacity: 0.3; fill: #3b82f6; }
      }
    </style>
    <marker id="d157f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="d157f-bg" />

  <text x="40" y="45" class="d157f-title" font-size="22">k-Nearest Neighbors Query &amp; Plurality Voting Flow</text>
  <text x="40" y="70" class="d157f-text">Step-by-step nearest neighbor distance computation and probability estimation</text>

  <!-- Step 1: Query Input -->
  <rect x="40" y="110" width="170" height="150" class="d157f-box" />
  <text x="55" y="140" class="d157f-title" font-size="14" fill="#1e40af">1. Query Vector</text>
  <text x="55" y="170" class="d157f-math">x_test = [x₁, x₂]</text>
  <text x="55" y="200" class="d157f-text" font-size="12">Standardized features</text>
  <text x="55" y="225" class="d157f-text" font-size="12" fill="#64748b">No training weights</text>

  <path d="M 210 185 L 260 185" class="d157f-arrow" />

  <!-- Step 2: Distance Matrix -->
  <rect x="270" y="110" width="180" height="150" class="d157f-box" />
  <text x="285" y="140" class="d157f-title" font-size="14" fill="#1e40af">2. Pairwise Distances</text>
  <text x="285" y="170" class="d157f-math" font-size="12">d(x, xᵢ) = ||x - xᵢ||₂</text>
  <text x="285" y="200" class="d157f-text" font-size="12">Compute to all N</text>
  <text x="285" y="225" class="d157f-text" font-size="12" fill="#64748b">Cost: O(N · d)</text>

  <path d="M 450 185 L 500 185" class="d157f-arrow" />

  <!-- Step 3: Top-k Selection -->
  <rect x="510" y="110" width="170" height="150" class="d157f-box" />
  <text x="525" y="140" class="d157f-title" font-size="14" fill="#1e40af">3. Top-k Sort</text>
  <text x="525" y="170" class="d157f-math" font-size="12">argsort(dists)[:k]</text>
  <text x="525" y="200" class="d157f-text" font-size="12">Select k nearest</text>
  <text x="525" y="225" class="d157f-text" font-size="12" fill="#64748b">e.g. k = 5 neighbors</text>

  <path d="M 680 185 L 730 185" class="d157f-arrow" />

  <!-- Step 4: Voting & Probability -->
  <rect x="740" y="110" width="130" height="150" class="d157f-box" />
  <text x="755" y="140" class="d157f-title" font-size="14" fill="#16a34a">4. Plurality Vote</text>
  <text x="755" y="170" class="d157f-math" font-size="12">P(c) = k_c / k</text>
  <text x="755" y="200" class="d157f-text" font-size="12">Class 0: 4/5</text>
  <text x="755" y="225" class="d157f-math" font-size="13" fill="#16a34a">ŷ = Class 0</text>

  <!-- Interactive Graphic / Radar representation -->
  <rect x="40" y="290" width="830" height="150" class="d157f-box" />
  <text x="60" y="320" class="d157f-title" font-size="15">Neighborhood Ball Radius Search</text>
  
  <g transform="translate(180, 370)">
    <circle cx="0" cy="0" class="d157f-radar" />
    <circle cx="0" cy="0" r="5" fill="#1e40af" />
    <text x="10" y="5" class="d157f-text" font-weight="700">Query (x)</text>

    <!-- 5 neighbors -->
    <circle cx="-25" cy="-15" r="4" fill="#ef4444" />
    <circle cx="20" cy="-20" r="4" fill="#ef4444" />
    <circle cx="30" cy="15" r="4" fill="#ef4444" />
    <circle cx="-15" cy="25" r="4" fill="#ef4444" />
    <circle cx="50" cy="5" r="4" fill="#3b82f6" />
  </g>

  <text x="280" y="360" class="d157f-text" font-weight="700">Neighborhood Composition (k=5):</text>
  <text x="280" y="385" class="d157f-text">4 Red Neighbors (d=0.29, 0.28, 0.33, 0.29) vs 1 Blue Neighbor (d=0.50)</text>
  <text x="280" y="410" class="d157f-text" fill="#16a34a" font-weight="700">Outcome: P(Red | x) = 80.0%, P(Blue | x) = 20.0% -> Predicted: Red</text>
</svg>
