<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Zero minutes against 3.7.">
  <title>Both fixes, priced</title>
  <style>
    .two-fixes-priced-bg   { fill: #f8fafc; }
    .two-fixes-priced-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-fixes-priced-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-fixes-priced-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-fixes-priced-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-fixes-priced-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-fixes-priced-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .two-fixes-priced-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .two-fixes-priced-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .two-fixes-priced-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .two-fixes-priced-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .two-fixes-priced-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .two-fixes-priced-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .two-fixes-priced-row { opacity: 1; }
    .two-fixes-priced-r0 { animation-delay: 0.00s; }
    .two-fixes-priced-r1 { animation-delay: 0.45s; }
    .two-fixes-priced-r2 { animation-delay: 0.90s; }
    .two-fixes-priced-r3 { animation-delay: 1.35s; }
    .two-fixes-priced-r4 { animation-delay: 1.80s; }
    .two-fixes-priced-row { animation: two-fixes-priced-reveal 7.3s ease-in-out infinite; }
    @keyframes two-fixes-priced-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="two-fixes-priced-bg" width="980" height="390"/>
  <text class="two-fixes-priced-h1"  x="30" y="40">Both fixes, priced</text>
  <text class="two-fixes-priced-sub" x="30" y="64">Zero minutes against 3.7.</text>
  <rect class="two-fixes-priced-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="two-fixes-priced-name" x="46" y="122">Delete two useless jobs</text>
  <text class="two-fixes-priced-desc" x="46" y="142">Saves 0.0 wall minutes.</text>
  <text class="two-fixes-priced-desc two-fixes-priced-row two-fixes-priced-r0" x="46" y="182">licence-scan: not on the critical path</text>
  <text class="two-fixes-priced-desc two-fixes-priced-row two-fixes-priced-r1" x="46" y="216">docs-build: not on the critical path</text>
  <text class="two-fixes-priced-desc two-fixes-priced-row two-fixes-priced-r2" x="46" y="250">5.5 runner minutes saved</text>
  <text class="two-fixes-priced-desc two-fixes-priced-row two-fixes-priced-r3" x="46" y="284">Real money</text>
  <text class="two-fixes-priced-desc two-fixes-priced-row two-fixes-priced-r4" x="46" y="318">Not what anyone was complaining about</text>
  <rect class="two-fixes-priced-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="two-fixes-priced-name" x="526" y="122">Cache the install</text>
  <text class="two-fixes-priced-desc" x="526" y="142">Saves 3.7 wall minutes.</text>
  <text class="two-fixes-priced-desc two-fixes-priced-row two-fixes-priced-r0" x="526" y="182">install 4.5 -&gt; 0.8 min</text>
  <text class="two-fixes-priced-desc two-fixes-priced-row two-fixes-priced-r1" x="526" y="216">wall 12.7 -&gt; 9.0 min</text>
  <text class="two-fixes-priced-desc two-fixes-priced-row two-fixes-priced-r2" x="526" y="250">On every run</text>
  <text class="two-fixes-priced-desc two-fixes-priced-row two-fixes-priced-r3" x="526" y="284">For every engineer</text>
  <text class="two-fixes-priced-desc two-fixes-priced-row two-fixes-priced-r4" x="526" y="318">One job, one cache</text>
  <text class="two-fixes-priced-sub" x="30" y="372">Knowing which change answers which complaint is the point of computing the path: both are worth making, and only one of them will stop people saying the pipeline is slow.</text>
</svg>
