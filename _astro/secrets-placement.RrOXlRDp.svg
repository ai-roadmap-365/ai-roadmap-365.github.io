<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The environment is the right home, and still a surface to guard.">
  <title>Where a secret should and should not live</title>
  <style>
    .secrets-placement-bg   { fill: #f8fafc; }
    .secrets-placement-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .secrets-placement-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .secrets-placement-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .secrets-placement-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .secrets-placement-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .secrets-placement-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .secrets-placement-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .secrets-placement-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .secrets-placement-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .secrets-placement-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .secrets-placement-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .secrets-placement-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .secrets-placement-row { opacity: 1; }
    .secrets-placement-r0 { animation-delay: 0.00s; }
    .secrets-placement-r1 { animation-delay: 0.45s; }
    .secrets-placement-r2 { animation-delay: 0.90s; }
    .secrets-placement-r3 { animation-delay: 1.35s; }
    .secrets-placement-r4 { animation-delay: 1.80s; }
    .secrets-placement-row { animation: secrets-placement-reveal 7.3s ease-in-out infinite; }
    @keyframes secrets-placement-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="secrets-placement-bg" width="980" height="390"/>
  <text class="secrets-placement-h1"  x="30" y="40">Where a secret should and should not live</text>
  <text class="secrets-placement-sub" x="30" y="64">The environment is the right home, and still a surface to guard.</text>
  <rect class="secrets-placement-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="secrets-placement-name" x="46" y="122">How keys leak</text>
  <text class="secrets-placement-desc" x="46" y="142">Every one of these has cost someone money.</text>
  <text class="secrets-placement-desc secrets-placement-row secrets-placement-r0" x="46" y="182">Hard-coded in a source file</text>
  <text class="secrets-placement-desc secrets-placement-row secrets-placement-r1" x="46" y="216">Committed in .env — git does not forget</text>
  <text class="secrets-placement-desc secrets-placement-row secrets-placement-r2" x="46" y="250">Passed as a command-line argument, visible in ps</text>
  <text class="secrets-placement-desc secrets-placement-row secrets-placement-r3" x="46" y="284">Printed by a debug dump of the environment</text>
  <text class="secrets-placement-desc secrets-placement-row secrets-placement-r4" x="46" y="318">Pasted into a chat or an issue "just to check"</text>
  <rect class="secrets-placement-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="secrets-placement-name" x="526" y="122">How keys stay secret</text>
  <text class="secrets-placement-desc" x="526" y="142">Habits and one gitignore line.</text>
  <text class="secrets-placement-desc secrets-placement-row secrets-placement-r0" x="526" y="182">Read from an environment variable</text>
  <text class="secrets-placement-desc secrets-placement-row secrets-placement-r1" x="526" y="216">​.env listed in .gitignore before the first commit</text>
  <text class="secrets-placement-desc secrets-placement-row secrets-placement-r2" x="526" y="250">​.env.example committed with empty values</text>
  <text class="secrets-placement-desc secrets-placement-row secrets-placement-r3" x="526" y="284">Never logged, never echoed, never shared</text>
  <text class="secrets-placement-desc secrets-placement-row secrets-placement-r4" x="526" y="318">A secret manager once more than one machine needs it</text>
  <text class="secrets-placement-sub" x="30" y="372">Treat a leaked key as compromised: rotate it — generate a new one and revoke the old — rather than hoping nobody noticed.</text>
</svg>
