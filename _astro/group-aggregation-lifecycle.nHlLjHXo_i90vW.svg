<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="Group Aggregation Lifecycle Flow">
  <title>Group Aggregation Feature Lifecycle</title>
  <defs>
    <style>
      .d171f-bg { fill: #f8fafc; }
      .d171f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d171f-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; }
      .d171f-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .d171f-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 11px; font-weight: 600; }
      .d171f-arrow { stroke: #2563eb; stroke-width: 2; marker-end: url(#d171f-arr); fill: none; }
    </style>
    <marker id="d171f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="d171f-bg" />

  <text x="40" y="45" class="d171f-title" font-size="22">Leak-Free Group Aggregation Feature Engineering</text>
  <text x="40" y="70" class="d171f-text">Extracting Entity-Level Contextual Features without Cross-Validation Leakage</text>

  <!-- Step 1: Raw Transaction Data -->
  <rect x="60" y="110" width="240" height="150" class="d171f-card" />
  <text x="80" y="135" class="d171f-title" fill="#1d4ed8">1. Raw Observations</text>
  <text x="80" y="160" class="d171f-text">Transactions with User ID:</text>
  <text x="80" y="185" class="d171f-math">Row 1: User A, Amount: $500</text>
  <text x="80" y="205" class="d171f-math">Row 2: User A, Amount: $50</text>
  <text x="80" y="225" class="d171f-math">Row 3: User B, Amount: $2000</text>

  <path d="M 300 185 L 350 185" class="d171f-arrow" />

  <!-- Step 2: Split-Apply-Combine on Train Split -->
  <rect x="350" y="110" width="250" height="150" class="d171f-card" fill="#eff6ff" stroke="#3b82f6" />
  <text x="370" y="135" class="d171f-title" fill="#1e40af">2. Train Group Stats</text>
  <text x="370" y="160" class="d171f-text">Compute Aggregates strictly on Train:</text>
  <text x="370" y="185" class="d171f-math">User A: Mean = $275, Std = $318</text>
  <text x="370" y="205" class="d171f-math">User B: Mean = $2000, Std = $0</text>
  <text x="370" y="230" class="d171f-text">Global Fallback: Mean=$350, Std=$400</text>

  <path d="M 600 185 L 650 185" class="d171f-arrow" />

  <!-- Step 3: Relative Feature Transformation -->
  <rect x="650" y="110" width="210" height="150" class="d171f-card" fill="#f0fdf4" stroke="#22c55e" />
  <text x="670" y="135" class="d171f-title" fill="#15803d">3. Relative Signals</text>
  <text x="670" y="160" class="d171f-text">Ratio &amp; Z-Score Features:</text>
  <text x="670" y="185" class="d171f-math">ratio = amt / user_mean</text>
  <text x="670" y="210" class="d171f-math">diff  = amt - user_mean</text>
  <text x="670" y="235" class="d171f-math">z_user = diff / user_std</text>

  <!-- Down Arrow to Final Output -->
  <path d="M 755 260 L 755 320" class="d171f-arrow" />

  <!-- Bottom Panel: Production Model Advantage -->
  <rect x="60" y="320" width="800" height="110" class="d171f-card" />
  <text x="80" y="350" class="d171f-title" fill="#0f172a">4. Production Predictive Power</text>
  <text x="80" y="375" class="d171f-text">• A $500 charge for User A produces <tspan font-weight="700">ratio = 1.81x</tspan> (Anomalous deviation ➔ Flag Fraud!).</text>
  <text x="80" y="400" class="d171f-text">• A $500 charge for User B produces <tspan font-weight="700">ratio = 0.25x</tspan> (Normal routine purchase ➔ Approve!).</text>
</svg>
