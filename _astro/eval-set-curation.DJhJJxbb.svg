<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Twenty real queries beat two hundred invented ones.">
  <title>Building the first evaluation set</title>
  <style>
    .eval-set-curation-bg   { fill: #f8fafc; }
    .eval-set-curation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-set-curation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-set-curation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-set-curation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-set-curation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-set-curation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eval-set-curation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eval-set-curation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eval-set-curation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eval-set-curation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eval-set-curation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eval-set-curation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .eval-set-curation-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .eval-set-curation-stage { opacity: 1; }

    .eval-set-curation-s0 { animation-delay: 0.00s; }
    .eval-set-curation-e0 { animation-delay: 0.00s; }
    .eval-set-curation-s1 { animation-delay: 1.28s; }
    .eval-set-curation-e1 { animation-delay: 1.28s; }
    .eval-set-curation-s2 { animation-delay: 2.56s; }
    .eval-set-curation-e2 { animation-delay: 2.56s; }
    .eval-set-curation-s3 { animation-delay: 3.84s; }
    .eval-set-curation-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .eval-set-curation-conn  { animation: eval-set-curation-trace 6.4s ease-in-out infinite; }
      .eval-set-curation-stage { animation: eval-set-curation-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes eval-set-curation-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes eval-set-curation-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .eval-set-curation-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .eval-set-curation-stage { animation: eval-set-curation-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes eval-set-curation-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="eval-set-curation-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="eval-set-curation-bg" width="980" height="322"/>
  <text class="eval-set-curation-h1"  x="30" y="40">Building the first evaluation set</text>
  <text class="eval-set-curation-sub" x="30" y="64">Twenty real queries beat two hundred invented ones.</text>
  <g class="eval-set-curation-stage eval-set-curation-s0">
    <rect class="eval-set-curation-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="eval-set-curation-step" x="44" y="142">01</text>
    <text class="eval-set-curation-name" x="70" y="142">Take real queries</text>
    <text class="eval-set-curation-desc" x="44" y="166">From users, from your own use,</text>
    <text class="eval-set-curation-desc" x="44" y="182">from the support inbox. Not</text>
    <text class="eval-set-curation-desc" x="44" y="198">invented ones.</text>
    <text class="eval-set-curation-edge" x="44" y="242">real</text>
  </g>
  <line class="eval-set-curation-line eval-set-curation-conn eval-set-curation-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#eval-set-curation-tip)"/>
  <g class="eval-set-curation-stage eval-set-curation-s1">
    <rect class="eval-set-curation-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="eval-set-curation-step" x="280" y="142">02</text>
    <text class="eval-set-curation-name" x="306" y="142">Record the expected source</text>
    <text class="eval-set-curation-desc" x="280" y="166">Which document SHOULD answer it.</text>
    <text class="eval-set-curation-desc" x="280" y="182">That alone measures retrieval.</text>
  </g>
  <line class="eval-set-curation-line eval-set-curation-conn eval-set-curation-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#eval-set-curation-tip)"/>
  <g class="eval-set-curation-stage eval-set-curation-s2">
    <rect class="eval-set-curation-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="eval-set-curation-step" x="516" y="142">03</text>
    <text class="eval-set-curation-name" x="542" y="142">Add every bug you fix</text>
    <text class="eval-set-curation-desc" x="516" y="166">A failure that made it to</text>
    <text class="eval-set-curation-desc" x="516" y="182">production joins the set</text>
    <text class="eval-set-curation-desc" x="516" y="198">permanently.</text>
    <text class="eval-set-curation-edge" x="516" y="242">regression</text>
  </g>
  <line class="eval-set-curation-line eval-set-curation-conn eval-set-curation-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#eval-set-curation-tip)"/>
  <g class="eval-set-curation-stage eval-set-curation-s3">
    <rect class="eval-set-curation-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="eval-set-curation-step" x="752" y="142">04</text>
    <text class="eval-set-curation-name" x="778" y="142">Keep it small enough to run often</text>
    <text class="eval-set-curation-desc" x="752" y="166">Twenty that run on every pull</text>
    <text class="eval-set-curation-desc" x="752" y="182">request beat two hundred that</text>
    <text class="eval-set-curation-desc" x="752" y="198">run never.</text>
    <text class="eval-set-curation-edge" x="752" y="242">20</text>
  </g>
  <text class="eval-set-curation-sub" x="30" y="304">The third step compounds: an evaluation set that accretes every real failure becomes, over months, a precise description of how this specific system breaks.</text>
</svg>
