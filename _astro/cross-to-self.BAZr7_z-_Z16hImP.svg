<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One change of source.">
  <title>From cross-attention to self-attention</title>
  <style>
    .cross-to-self-bg   { fill: #f8fafc; }
    .cross-to-self-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cross-to-self-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cross-to-self-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cross-to-self-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cross-to-self-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cross-to-self-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cross-to-self-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cross-to-self-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cross-to-self-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cross-to-self-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cross-to-self-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cross-to-self-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cross-to-self-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cross-to-self-stage { opacity: 1; }

    .cross-to-self-s0 { animation-delay: 0.00s; }
    .cross-to-self-e0 { animation-delay: 0.00s; }
    .cross-to-self-s1 { animation-delay: 1.50s; }
    .cross-to-self-e1 { animation-delay: 1.50s; }
    .cross-to-self-s2 { animation-delay: 3.00s; }
    .cross-to-self-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .cross-to-self-conn  { animation: cross-to-self-trace 6s ease-in-out infinite; }
      .cross-to-self-stage { animation: cross-to-self-arrive 6s ease-in-out infinite; }
    }
    @keyframes cross-to-self-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cross-to-self-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cross-to-self-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cross-to-self-stage { animation: cross-to-self-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cross-to-self-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cross-to-self-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cross-to-self-bg" width="980" height="322"/>
  <text class="cross-to-self-h1"  x="30" y="40">From cross-attention to self-attention</text>
  <text class="cross-to-self-sub" x="30" y="64">One change of source.</text>
  <g class="cross-to-self-stage cross-to-self-s0">
    <rect class="cross-to-self-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="cross-to-self-step" x="44" y="142">01</text>
    <text class="cross-to-self-name" x="70" y="142">Cross-attention</text>
    <text class="cross-to-self-desc" x="44" y="166">Queries from the decoder, keys and values</text>
    <text class="cross-to-self-desc" x="44" y="182">from the encoder.</text>
  </g>
  <line class="cross-to-self-line cross-to-self-conn cross-to-self-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#cross-to-self-tip)"/>
  <g class="cross-to-self-stage cross-to-self-s1">
    <rect class="cross-to-self-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="cross-to-self-step" x="359" y="142">02</text>
    <text class="cross-to-self-name" x="385" y="142">Self-attention</text>
    <text class="cross-to-self-desc" x="359" y="166">All three from the same sequence. Every</text>
    <text class="cross-to-self-desc" x="359" y="182">position attends to every other.</text>
    <text class="cross-to-self-edge" x="359" y="242">one change</text>
  </g>
  <line class="cross-to-self-line cross-to-self-conn cross-to-self-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#cross-to-self-tip)"/>
  <g class="cross-to-self-stage cross-to-self-s2">
    <rect class="cross-to-self-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="cross-to-self-step" x="674" y="142">03</text>
    <text class="cross-to-self-name" x="700" y="142">Which removes recurrence entirely</text>
    <text class="cross-to-self-desc" x="674" y="166">Positions no longer need to be processed in</text>
    <text class="cross-to-self-desc" x="674" y="182">order.</text>
  </g>
  <text class="cross-to-self-sub" x="30" y="304">This is the single conceptual step from this lesson to the transformer, and it is remarkably small: point the same mechanism at the sequence itself and the recurrent backbone becomes unnecessary.</text>
</svg>
