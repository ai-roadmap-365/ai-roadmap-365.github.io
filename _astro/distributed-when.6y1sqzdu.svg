<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when one device is faster.">
  <title>When to distribute</title>
  <style>
    .distributed-when-bg   { fill: #f8fafc; }
    .distributed-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distributed-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distributed-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distributed-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distributed-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distributed-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .distributed-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .distributed-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .distributed-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .distributed-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .distributed-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .distributed-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .distributed-when-row { opacity: 1; }
    .distributed-when-r0 { animation-delay: 0.00s; }
    .distributed-when-r1 { animation-delay: 0.45s; }
    .distributed-when-r2 { animation-delay: 0.90s; }
    .distributed-when-r3 { animation-delay: 1.35s; }
    .distributed-when-r4 { animation-delay: 1.80s; }
    .distributed-when-row { animation: distributed-when-reveal 7.3s ease-in-out infinite; }
    @keyframes distributed-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="distributed-when-bg" width="980" height="390"/>
  <text class="distributed-when-h1"  x="30" y="40">When to distribute</text>
  <text class="distributed-when-sub" x="30" y="64">And when one device is faster.</text>
  <rect class="distributed-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="distributed-when-name" x="46" y="122">Distribute</text>
  <text class="distributed-when-desc" x="46" y="142">Three reasons.</text>
  <text class="distributed-when-desc distributed-when-row distributed-when-r0" x="46" y="182">The model does not fit on one device</text>
  <text class="distributed-when-desc distributed-when-row distributed-when-r1" x="46" y="216">A run would otherwise take weeks</text>
  <text class="distributed-when-desc distributed-when-row distributed-when-r2" x="46" y="250">Very large batch sizes are needed</text>
  <text class="distributed-when-desc distributed-when-row distributed-when-r3" x="46" y="284">Where the cluster already exists</text>
  <text class="distributed-when-desc distributed-when-row distributed-when-r4" x="46" y="318">And the code is already tested single-device</text>
  <rect class="distributed-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="distributed-when-name" x="526" y="122">Stay on one</text>
  <text class="distributed-when-desc" x="526" y="142">More often than expected.</text>
  <text class="distributed-when-desc distributed-when-row distributed-when-r0" x="526" y="182">Any fine-tune that fits</text>
  <text class="distributed-when-desc distributed-when-row distributed-when-r1" x="526" y="216">Experiments and hyperparameter sweeps</text>
  <text class="distributed-when-desc distributed-when-row distributed-when-r2" x="526" y="250">Debugging anything</text>
  <text class="distributed-when-desc distributed-when-row distributed-when-r3" x="526" y="284">Small datasets</text>
  <text class="distributed-when-desc distributed-when-row distributed-when-r4" x="526" y="318">Where communication would dominate</text>
  <text class="distributed-when-sub" x="30" y="372">Sweeps are the clearest case: many independent single-device runs use a cluster far more efficiently than one distributed run, and they are also much easier to debug.</text>
</svg>
