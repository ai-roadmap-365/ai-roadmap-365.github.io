<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The message is a safety feature, and it tells you the fix.">
  <title>Why a push gets rejected</title>
  <style>
    .push-rejection-bg   { fill: #f8fafc; }
    .push-rejection-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .push-rejection-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .push-rejection-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .push-rejection-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .push-rejection-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .push-rejection-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .push-rejection-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .push-rejection-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .push-rejection-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .push-rejection-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .push-rejection-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .push-rejection-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .push-rejection-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .push-rejection-stage { opacity: 1; }

    .push-rejection-s0 { animation-delay: 0.00s; }
    .push-rejection-e0 { animation-delay: 0.00s; }
    .push-rejection-s1 { animation-delay: 1.28s; }
    .push-rejection-e1 { animation-delay: 1.28s; }
    .push-rejection-s2 { animation-delay: 2.56s; }
    .push-rejection-e2 { animation-delay: 2.56s; }
    .push-rejection-s3 { animation-delay: 3.84s; }
    .push-rejection-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .push-rejection-conn  { animation: push-rejection-trace 6.4s ease-in-out infinite; }
      .push-rejection-stage { animation: push-rejection-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes push-rejection-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes push-rejection-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .push-rejection-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .push-rejection-stage { animation: push-rejection-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes push-rejection-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="push-rejection-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="push-rejection-bg" width="980" height="322"/>
  <text class="push-rejection-h1"  x="30" y="40">Why a push gets rejected</text>
  <text class="push-rejection-sub" x="30" y="64">The message is a safety feature, and it tells you the fix.</text>
  <g class="push-rejection-stage push-rejection-s0">
    <rect class="push-rejection-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="push-rejection-step" x="44" y="142">01</text>
    <text class="push-rejection-name" x="70" y="142">The remote has commits you do not</text>
    <text class="push-rejection-desc" x="44" y="166">Someone else pushed while you</text>
    <text class="push-rejection-desc" x="44" y="182">were working.</text>
  </g>
  <line class="push-rejection-line push-rejection-conn push-rejection-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#push-rejection-tip)"/>
  <g class="push-rejection-stage push-rejection-s1">
    <rect class="push-rejection-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="push-rejection-step" x="280" y="142">02</text>
    <text class="push-rejection-name" x="306" y="142">Git refuses</text>
    <text class="push-rejection-desc" x="280" y="166">Accepting your push would move</text>
    <text class="push-rejection-desc" x="280" y="182">the branch past their work,</text>
    <text class="push-rejection-desc" x="280" y="198">discarding it.</text>
    <text class="push-rejection-edge" x="280" y="242">rejected</text>
  </g>
  <line class="push-rejection-line push-rejection-conn push-rejection-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#push-rejection-tip)"/>
  <g class="push-rejection-stage push-rejection-s2">
    <rect class="push-rejection-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="push-rejection-step" x="516" y="142">03</text>
    <text class="push-rejection-name" x="542" y="142">Fetch, then integrate</text>
    <text class="push-rejection-desc" x="516" y="166">git fetch, then merge</text>
    <text class="push-rejection-desc" x="516" y="182">origin/main — now your branch</text>
    <text class="push-rejection-desc" x="516" y="198">contains both.</text>
    <text class="push-rejection-edge" x="516" y="242">the fix</text>
  </g>
  <line class="push-rejection-line push-rejection-conn push-rejection-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#push-rejection-tip)"/>
  <g class="push-rejection-stage push-rejection-s3">
    <rect class="push-rejection-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="push-rejection-step" x="752" y="142">04</text>
    <text class="push-rejection-name" x="778" y="142">Then push</text>
    <text class="push-rejection-desc" x="752" y="166">It fast-forwards cleanly,</text>
    <text class="push-rejection-desc" x="752" y="182">because you are now ahead of the</text>
    <text class="push-rejection-desc" x="752" y="198">remote.</text>
  </g>
  <text class="push-rejection-sub" x="30" y="304">git push --force is the option that makes the message go away by doing the thing the message was preventing. On a shared branch it deletes a colleague's commits.</text>
</svg>
