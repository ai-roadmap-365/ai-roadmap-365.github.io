<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>What a pipeline is</title>
  <style>
    .pipeline-idea-bg   { fill: #f8fafc; }
    .pipeline-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pipeline-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pipeline-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pipeline-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pipeline-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pipeline-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pipeline-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pipeline-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pipeline-idea-stage { opacity: 1; }

    .pipeline-idea-s0 { animation-delay: 0.00s; }
    .pipeline-idea-e0 { animation-delay: 0.00s; }
    .pipeline-idea-s1 { animation-delay: 1.28s; }
    .pipeline-idea-e1 { animation-delay: 1.28s; }
    .pipeline-idea-s2 { animation-delay: 2.56s; }
    .pipeline-idea-e2 { animation-delay: 2.56s; }
    .pipeline-idea-s3 { animation-delay: 3.84s; }
    .pipeline-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .pipeline-idea-conn  { animation: pipeline-idea-trace 6.4s ease-in-out infinite; }
      .pipeline-idea-stage { animation: pipeline-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes pipeline-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pipeline-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pipeline-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pipeline-idea-stage { animation: pipeline-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pipeline-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pipeline-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pipeline-idea-bg" width="980" height="322"/>
  <text class="pipeline-idea-h1"  x="30" y="40">What a pipeline is</text>
  <text class="pipeline-idea-sub" x="30" y="64">Four properties.</text>
  <g class="pipeline-idea-stage pipeline-idea-s0">
    <rect class="pipeline-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="pipeline-idea-step" x="44" y="142">01</text>
    <text class="pipeline-idea-name" x="70" y="142">A chain of transforms ending in a model</text>
    <text class="pipeline-idea-desc" x="44" y="166">Declared once, as one object.</text>
  </g>
  <line class="pipeline-idea-line pipeline-idea-conn pipeline-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#pipeline-idea-tip)"/>
  <g class="pipeline-idea-stage pipeline-idea-s1">
    <rect class="pipeline-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="pipeline-idea-step" x="280" y="142">02</text>
    <text class="pipeline-idea-name" x="306" y="142">Each transform is fitted on training data only</text>
    <text class="pipeline-idea-desc" x="280" y="166">And applied to everything else.</text>
    <text class="pipeline-idea-desc" x="280" y="182">Enforced, not remembered.</text>
  </g>
  <line class="pipeline-idea-line pipeline-idea-conn pipeline-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#pipeline-idea-tip)"/>
  <g class="pipeline-idea-stage pipeline-idea-s2">
    <rect class="pipeline-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="pipeline-idea-step" x="516" y="142">03</text>
    <text class="pipeline-idea-name" x="542" y="142">The whole chain behaves as a single model</text>
    <text class="pipeline-idea-desc" x="516" y="166">One fit call, one predict call.</text>
  </g>
  <line class="pipeline-idea-line pipeline-idea-conn pipeline-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#pipeline-idea-tip)"/>
  <g class="pipeline-idea-stage pipeline-idea-s3">
    <rect class="pipeline-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="pipeline-idea-step" x="752" y="142">04</text>
    <text class="pipeline-idea-name" x="778" y="142">And serialises as one artefact</text>
    <text class="pipeline-idea-desc" x="752" y="166">So serving cannot diverge from</text>
    <text class="pipeline-idea-desc" x="752" y="182">training.</text>
    <text class="pipeline-idea-edge" x="752" y="242">the point</text>
  </g>
  <text class="pipeline-idea-sub" x="30" y="304">Enforcement rather than convention is the whole value: a pipeline makes the leak-free order the only order that runs, which no amount of discipline reliably achieves.</text>
</svg>
