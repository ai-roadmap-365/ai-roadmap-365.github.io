<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when retrieval alone is enough.">
  <title>When to add reranking</title>
  <style>
    .rerank-when-bg   { fill: #f8fafc; }
    .rerank-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rerank-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rerank-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rerank-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rerank-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rerank-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rerank-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rerank-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rerank-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rerank-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rerank-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rerank-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rerank-when-row { opacity: 1; }
    .rerank-when-r0 { animation-delay: 0.00s; }
    .rerank-when-r1 { animation-delay: 0.45s; }
    .rerank-when-r2 { animation-delay: 0.90s; }
    .rerank-when-r3 { animation-delay: 1.35s; }
    .rerank-when-r4 { animation-delay: 1.80s; }
    .rerank-when-row { animation: rerank-when-reveal 7.3s ease-in-out infinite; }
    @keyframes rerank-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="rerank-when-bg" width="980" height="390"/>
  <text class="rerank-when-h1"  x="30" y="40">When to add reranking</text>
  <text class="rerank-when-sub" x="30" y="64">And when retrieval alone is enough.</text>
  <rect class="rerank-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="rerank-when-name" x="46" y="122">Add reranking</text>
  <text class="rerank-when-desc" x="46" y="142">Four signals.</text>
  <text class="rerank-when-desc rerank-when-row rerank-when-r0" x="46" y="182">Relevant results present but ranked low</text>
  <text class="rerank-when-desc rerank-when-row rerank-when-r1" x="46" y="216">A large or diverse corpus</text>
  <text class="rerank-when-desc rerank-when-row rerank-when-r2" x="46" y="250">Where a wrong passage is costly</text>
  <text class="rerank-when-desc rerank-when-row rerank-when-r3" x="46" y="284">Where latency budget allows a hundred milliseconds</text>
  <text class="rerank-when-desc rerank-when-row rerank-when-r4" x="46" y="318">And retrieval recall is already good</text>
  <rect class="rerank-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="rerank-when-name" x="526" y="122">Retrieval alone</text>
  <text class="rerank-when-desc" x="526" y="142">Four cases.</text>
  <text class="rerank-when-desc rerank-when-row rerank-when-r0" x="526" y="182">Small, homogeneous corpora</text>
  <text class="rerank-when-desc rerank-when-row rerank-when-r1" x="526" y="216">Very strict latency budgets</text>
  <text class="rerank-when-desc rerank-when-row rerank-when-r2" x="526" y="250">Where recall is the problem, not ranking</text>
  <text class="rerank-when-desc rerank-when-row rerank-when-r3" x="526" y="284">Very high query volumes</text>
  <text class="rerank-when-desc rerank-when-row rerank-when-r4" x="526" y="318">Where the top result is already right</text>
  <text class="rerank-when-sub" x="30" y="372">Reranking cannot fix recall, only ordering: if the right passage was never retrieved, no amount of reranking will surface it.</text>
</svg>
