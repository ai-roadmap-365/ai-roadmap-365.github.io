<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One definition, three uses.">
  <title>Schema-first design</title>
  <style>
    .validation-bg   { fill: #f8fafc; }
    .validation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .validation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .validation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .validation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .validation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .validation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .validation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .validation-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .validation-stage { opacity: 1; }

    .validation-s0 { animation-delay: 0.00s; }
    .validation-e0 { animation-delay: 0.00s; }
    .validation-s1 { animation-delay: 1.28s; }
    .validation-e1 { animation-delay: 1.28s; }
    .validation-s2 { animation-delay: 2.56s; }
    .validation-e2 { animation-delay: 2.56s; }
    .validation-s3 { animation-delay: 3.84s; }
    .validation-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .validation-conn  { animation: validation-trace 6.4s ease-in-out infinite; }
      .validation-stage { animation: validation-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes validation-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes validation-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .validation-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .validation-stage { animation: validation-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes validation-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="validation-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="validation-bg" width="980" height="322"/>
  <text class="validation-h1"  x="30" y="40">Schema-first design</text>
  <text class="validation-sub" x="30" y="64">One definition, three uses.</text>
  <g class="validation-stage validation-s0">
    <rect class="validation-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="validation-step" x="44" y="142">01</text>
    <text class="validation-name" x="70" y="142">Define the shape once, in code</text>
    <text class="validation-desc" x="44" y="166">With types, ranges and required</text>
    <text class="validation-desc" x="44" y="182">fields.</text>
  </g>
  <line class="validation-line validation-conn validation-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#validation-tip)"/>
  <g class="validation-stage validation-s1">
    <rect class="validation-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="validation-step" x="280" y="142">02</text>
    <text class="validation-name" x="306" y="142">Generate the schema for the model</text>
    <text class="validation-desc" x="280" y="166">Automatically, from that</text>
    <text class="validation-desc" x="280" y="182">definition.</text>
  </g>
  <line class="validation-line validation-conn validation-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#validation-tip)"/>
  <g class="validation-stage validation-s2">
    <rect class="validation-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="validation-step" x="516" y="142">03</text>
    <text class="validation-name" x="542" y="142">Validate the response against it</text>
    <text class="validation-desc" x="516" y="166">Deterministically, outside the</text>
    <text class="validation-desc" x="516" y="182">model.</text>
  </g>
  <line class="validation-line validation-conn validation-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#validation-tip)"/>
  <g class="validation-stage validation-s3">
    <rect class="validation-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="validation-step" x="752" y="142">04</text>
    <text class="validation-name" x="778" y="142">And get static types for free</text>
    <text class="validation-desc" x="752" y="166">So the rest of the code knows</text>
    <text class="validation-desc" x="752" y="182">the shape.</text>
    <text class="validation-edge" x="752" y="242">one source</text>
  </g>
  <text class="validation-sub" x="30" y="304">Having a single source of truth is what keeps this from drifting: a schema maintained separately from the code that consumes it diverges within a few releases.</text>
</svg>
