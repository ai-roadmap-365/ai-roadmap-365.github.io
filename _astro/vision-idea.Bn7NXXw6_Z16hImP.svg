<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>How an image becomes tokens</title>
  <style>
    .vision-idea-bg   { fill: #f8fafc; }
    .vision-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vision-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vision-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vision-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vision-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vision-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vision-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .vision-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .vision-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .vision-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .vision-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .vision-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .vision-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .vision-idea-stage { opacity: 1; }

    .vision-idea-s0 { animation-delay: 0.00s; }
    .vision-idea-e0 { animation-delay: 0.00s; }
    .vision-idea-s1 { animation-delay: 1.28s; }
    .vision-idea-e1 { animation-delay: 1.28s; }
    .vision-idea-s2 { animation-delay: 2.56s; }
    .vision-idea-e2 { animation-delay: 2.56s; }
    .vision-idea-s3 { animation-delay: 3.84s; }
    .vision-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .vision-idea-conn  { animation: vision-idea-trace 6.4s ease-in-out infinite; }
      .vision-idea-stage { animation: vision-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes vision-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes vision-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .vision-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .vision-idea-stage { animation: vision-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes vision-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="vision-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="vision-idea-bg" width="980" height="322"/>
  <text class="vision-idea-h1"  x="30" y="40">How an image becomes tokens</text>
  <text class="vision-idea-sub" x="30" y="64">Four steps.</text>
  <g class="vision-idea-stage vision-idea-s0">
    <rect class="vision-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="vision-idea-step" x="44" y="142">01</text>
    <text class="vision-idea-name" x="70" y="142">The image is resized and split into tiles</text>
    <text class="vision-idea-desc" x="44" y="166">Which is why resolution drives</text>
    <text class="vision-idea-desc" x="44" y="182">cost.</text>
  </g>
  <line class="vision-idea-line vision-idea-conn vision-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#vision-idea-tip)"/>
  <g class="vision-idea-stage vision-idea-s1">
    <rect class="vision-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="vision-idea-step" x="280" y="142">02</text>
    <text class="vision-idea-name" x="306" y="142">Each tile becomes a grid of patches</text>
    <text class="vision-idea-desc" x="280" y="166">Encoded by a vision model.</text>
  </g>
  <line class="vision-idea-line vision-idea-conn vision-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#vision-idea-tip)"/>
  <g class="vision-idea-stage vision-idea-s2">
    <rect class="vision-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="vision-idea-step" x="516" y="142">03</text>
    <text class="vision-idea-name" x="542" y="142">Projected into the same space as text tokens</text>
    <text class="vision-idea-desc" x="516" y="166">So the language model can attend</text>
    <text class="vision-idea-desc" x="516" y="182">to both.</text>
  </g>
  <line class="vision-idea-line vision-idea-conn vision-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#vision-idea-tip)"/>
  <g class="vision-idea-stage vision-idea-s3">
    <rect class="vision-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="vision-idea-step" x="752" y="142">04</text>
    <text class="vision-idea-name" x="778" y="142">And billed as tokens</text>
    <text class="vision-idea-desc" x="752" y="166">Hundreds to thousands per image.</text>
    <text class="vision-idea-edge" x="752" y="242">per tile</text>
  </g>
  <text class="vision-idea-sub" x="30" y="304">Images sharing the token budget with text is the practical consequence: a few high-resolution pages can consume more context than a long document of prose.</text>
</svg>
