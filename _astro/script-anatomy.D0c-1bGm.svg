<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" font-family="system-ui, sans-serif">
  <title>The anatomy of a shell script, from the shebang at the top through strict mode, variables, a function, a conditional, and a loop</title>
  <rect x="0" y="0" width="720" height="560" fill="#f8fafc"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The anatomy of a shell script</text>

  <!-- Code panel -->
  <rect x="40" y="60" width="420" height="470" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>

  <!-- Code lines (monospace) -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#1a202c">
    <text x="60" y="92">#!/usr/bin/env bash</text>
    <text x="60" y="120">set -euo pipefail</text>

    <text x="60" y="160">target="${1:-.}"</text>

    <text x="60" y="200">count_files() {</text>
    <text x="80" y="224">local dir="$1"</text>
    <text x="80" y="248">ls "$dir" | wc -l</text>
    <text x="60" y="272">}</text>

    <text x="60" y="312">if [ -d "$target" ]; then</text>
    <text x="80" y="336">echo "ok"</text>
    <text x="60" y="360">else</text>
    <text x="80" y="384">exit 1</text>
    <text x="60" y="408">fi</text>

    <text x="60" y="448">for f in "$target"/*; do</text>
    <text x="80" y="472">echo "$f"</text>
    <text x="60" y="496">done</text>
  </g>

  <!-- Annotation labels on the right, colour accent -->
  <g font-size="14" fill="#1a202c">
    <!-- shebang -->
    <line x1="460" y1="86" x2="530" y2="86" stroke="#1d4ed8" stroke-width="2"/>
    <text x="536" y="82" font-weight="bold" fill="#1d4ed8">Shebang</text>
    <text x="536" y="100">picks the interpreter</text>

    <!-- strict mode -->
    <line x1="460" y1="115" x2="530" y2="115" stroke="#1d4ed8" stroke-width="2"/>
    <text x="536" y="128" font-weight="bold" fill="#1d4ed8">Strict mode</text>
    <text x="536" y="146">stop on any error</text>

    <!-- variable / argument -->
    <line x1="460" y1="155" x2="530" y2="155" stroke="#1d4ed8" stroke-width="2"/>
    <text x="536" y="168" font-weight="bold" fill="#1d4ed8">Variable + argument</text>
    <text x="536" y="186">$1 with a default</text>

    <!-- function -->
    <line x1="460" y1="236" x2="530" y2="236" stroke="#1d4ed8" stroke-width="2"/>
    <text x="536" y="230" font-weight="bold" fill="#1d4ed8">Function</text>
    <text x="536" y="248">a named sub-recipe</text>

    <!-- conditional -->
    <line x1="460" y1="360" x2="530" y2="360" stroke="#1d4ed8" stroke-width="2"/>
    <text x="536" y="354" font-weight="bold" fill="#1d4ed8">Conditional</text>
    <text x="536" y="372">decide with a test</text>

    <!-- loop -->
    <line x1="460" y1="472" x2="530" y2="472" stroke="#1d4ed8" stroke-width="2"/>
    <text x="536" y="466" font-weight="bold" fill="#1d4ed8">Loop</text>
    <text x="536" y="484">repeat over a list</text>
  </g>

  <text x="360" y="550" text-anchor="middle" font-size="14" fill="#1a202c">The shell reads the file top to bottom, running each line exactly as written.</text>
</svg>
