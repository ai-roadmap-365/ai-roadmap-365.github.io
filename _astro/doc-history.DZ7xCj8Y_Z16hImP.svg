<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each removed a step for the reader.">
  <title>Four steps to the documentation assistant</title>
  <style>
    .doc-history-bg   { fill: #f8fafc; }
    .doc-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .doc-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .doc-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .doc-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .doc-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .doc-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .doc-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .doc-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .doc-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .doc-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .doc-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .doc-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .doc-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .doc-history-stage { opacity: 1; }

    .doc-history-s0 { animation-delay: 0.00s; }
    .doc-history-e0 { animation-delay: 0.00s; }
    .doc-history-s1 { animation-delay: 1.28s; }
    .doc-history-e1 { animation-delay: 1.28s; }
    .doc-history-s2 { animation-delay: 2.56s; }
    .doc-history-e2 { animation-delay: 2.56s; }
    .doc-history-s3 { animation-delay: 3.84s; }
    .doc-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .doc-history-conn  { animation: doc-history-trace 6.4s ease-in-out infinite; }
      .doc-history-stage { animation: doc-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes doc-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes doc-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .doc-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .doc-history-stage { animation: doc-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes doc-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="doc-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="doc-history-bg" width="980" height="322"/>
  <text class="doc-history-h1"  x="30" y="40">Four steps to the documentation assistant</text>
  <text class="doc-history-sub" x="30" y="64">Each removed a step for the reader.</text>
  <g class="doc-history-stage doc-history-s0">
    <rect class="doc-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="doc-history-step" x="44" y="142">01</text>
    <text class="doc-history-name" x="70" y="142">Browsing a table of contents</text>
    <text class="doc-history-desc" x="44" y="166">The reader must know where to</text>
    <text class="doc-history-desc" x="44" y="182">look.</text>
  </g>
  <line class="doc-history-line doc-history-conn doc-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#doc-history-tip)"/>
  <g class="doc-history-stage doc-history-s1">
    <rect class="doc-history-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="doc-history-step" x="280" y="142">02</text>
    <text class="doc-history-name" x="306" y="142">Keyword search</text>
    <text class="doc-history-desc" x="280" y="166">The reader must know the</text>
    <text class="doc-history-desc" x="280" y="182">vocabulary.</text>
  </g>
  <line class="doc-history-line doc-history-conn doc-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#doc-history-tip)"/>
  <g class="doc-history-stage doc-history-s2">
    <rect class="doc-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="doc-history-step" x="516" y="142">03</text>
    <text class="doc-history-name" x="542" y="142">Semantic search</text>
    <text class="doc-history-desc" x="516" y="166">The reader can ask in their own</text>
    <text class="doc-history-desc" x="516" y="182">words.</text>
  </g>
  <line class="doc-history-line doc-history-conn doc-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#doc-history-tip)"/>
  <g class="doc-history-stage doc-history-s3">
    <rect class="doc-history-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="doc-history-step" x="752" y="142">04</text>
    <text class="doc-history-name" x="778" y="142">Then grounded answers with citations</text>
    <text class="doc-history-desc" x="752" y="166">The reader gets the answer, and</text>
    <text class="doc-history-desc" x="752" y="182">can still check it.</text>
  </g>
  <text class="doc-history-sub" x="30" y="304">Each step removed a requirement from the reader rather than adding a capability, which is a useful way to judge whether the last step is worth its cost.</text>
</svg>
