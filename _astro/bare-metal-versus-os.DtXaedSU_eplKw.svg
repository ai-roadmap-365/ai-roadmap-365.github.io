<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 424" role="img"
     aria-label="The same hardware. Everything else is different.">
  <title>A machine without an OS, and one with</title>
  <style>
    .bare-metal-versus-os-bg   { fill: #f8fafc; }
    .bare-metal-versus-os-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bare-metal-versus-os-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bare-metal-versus-os-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bare-metal-versus-os-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bare-metal-versus-os-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bare-metal-versus-os-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bare-metal-versus-os-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bare-metal-versus-os-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bare-metal-versus-os-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bare-metal-versus-os-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bare-metal-versus-os-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bare-metal-versus-os-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bare-metal-versus-os-row { opacity: 1; }
    .bare-metal-versus-os-r0 { animation-delay: 0.00s; }
    .bare-metal-versus-os-r1 { animation-delay: 0.45s; }
    .bare-metal-versus-os-r2 { animation-delay: 0.90s; }
    .bare-metal-versus-os-r3 { animation-delay: 1.35s; }
    .bare-metal-versus-os-r4 { animation-delay: 1.80s; }
    .bare-metal-versus-os-r5 { animation-delay: 2.25s; }
    .bare-metal-versus-os-row { animation: bare-metal-versus-os-reveal 7.7s ease-in-out infinite; }
    @keyframes bare-metal-versus-os-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="bare-metal-versus-os-bg" width="980" height="424"/>
  <text class="bare-metal-versus-os-h1"  x="30" y="40">A machine without an OS, and one with</text>
  <text class="bare-metal-versus-os-sub" x="30" y="64">The same hardware. Everything else is different.</text>
  <rect class="bare-metal-versus-os-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="bare-metal-versus-os-name" x="46" y="122">Bare hardware</text>
  <text class="bare-metal-versus-os-desc" x="46" y="142">Nothing between your program and the machine.</text>
  <text class="bare-metal-versus-os-desc bare-metal-versus-os-row bare-metal-versus-os-r0" x="46" y="182">Load your program's bits into memory yourself</text>
  <text class="bare-metal-versus-os-desc bare-metal-versus-os-row bare-metal-versus-os-r1" x="46" y="216">Drive the disk with device-specific commands</text>
  <text class="bare-metal-versus-os-desc bare-metal-versus-os-row bare-metal-versus-os-r2" x="46" y="250">Any bug can overwrite any memory</text>
  <text class="bare-metal-versus-os-desc bare-metal-versus-os-row bare-metal-versus-os-r3" x="46" y="284">One program at a time</text>
  <text class="bare-metal-versus-os-desc bare-metal-versus-os-row bare-metal-versus-os-r4" x="46" y="318">No files — only numbered blocks</text>
  <text class="bare-metal-versus-os-desc bare-metal-versus-os-row bare-metal-versus-os-r5" x="46" y="352">No idea who you are</text>
  <rect class="bare-metal-versus-os-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="bare-metal-versus-os-name" x="526" y="122">With an operating system</text>
  <text class="bare-metal-versus-os-desc" x="526" y="142">A manager, an illusionist and a guard.</text>
  <text class="bare-metal-versus-os-desc bare-metal-versus-os-row bare-metal-versus-os-r0" x="526" y="182">The kernel loads and starts programs</text>
  <text class="bare-metal-versus-os-desc bare-metal-versus-os-row bare-metal-versus-os-r1" x="526" y="216">Drivers hide every device's dialect</text>
  <text class="bare-metal-versus-os-desc bare-metal-versus-os-row bare-metal-versus-os-r2" x="526" y="250">Each process gets a private address space</text>
  <text class="bare-metal-versus-os-desc bare-metal-versus-os-row bare-metal-versus-os-r3" x="526" y="284">Many programs, interleaved on the CPU</text>
  <text class="bare-metal-versus-os-desc bare-metal-versus-os-row bare-metal-versus-os-r4" x="526" y="318">Files, names, folders, permissions</text>
  <text class="bare-metal-versus-os-desc bare-metal-versus-os-row bare-metal-versus-os-r5" x="526" y="352">User accounts and ownership</text>
  <text class="bare-metal-versus-os-sub" x="30" y="406">The OS is the first real program the machine loads, and it never stops running while the power is on.</text>
</svg>
