<svg role="img" aria-label="RAG runtime request lifecycle diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>RAG Request Lifecycle Sequence</title>
  <defs>
    <linearGradient id="bg266b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card266b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg266b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">RUNTIME REQUEST LIFECYCLE &amp; LATENCY BREAKDOWN</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">End-to-End Async Execution Pipeline: Typical Total Latency ~220ms (TTFT)</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card266b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Timeline bars -->
    <text x="35" y="35" fill="#38bdf8" font-size="10" font-weight="700">1. Query Embedding (Async API / ONNX): 12ms</text>
    <rect x="35" y="45" width="80" height="18" fill="#38bdf8" rx="3"/>

    <text x="35" y="85" fill="#fbbf24" font-size="10" font-weight="700">2. Parallel BM25 + Qdrant HNSW Search: 8ms</text>
    <rect x="35" y="95" width="55" height="18" fill="#fbbf24" rx="3"/>

    <text x="35" y="135" fill="#a78bfa" font-size="10" font-weight="700">3. RRF Fusion &amp; Cross-Encoder Re-Ranking: 16ms</text>
    <rect x="35" y="145" width="110" height="18" fill="#a78bfa" rx="3"/>

    <text x="35" y="185" fill="#34d399" font-size="10" font-weight="700">4. Prompt Synthesis &amp; Citation Assembly: 2ms</text>
    <rect x="35" y="195" width="20" height="18" fill="#34d399" rx="3"/>

    <text x="35" y="235" fill="#fb7185" font-size="10" font-weight="700">5. LLM Time to First Token (TTFT): ~180ms</text>
    <rect x="35" y="245" width="620" height="22" fill="#fb7185" rx="3"/>
    <text x="345" y="260" fill="#ffffff" font-size="8" font-weight="700" text-anchor="middle">Streaming First Token Output</text>
  </g>
</svg>
