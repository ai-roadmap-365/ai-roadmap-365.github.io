<svg role="img" aria-label="DBSCAN density reachability showing core points with epsilon radius border points and isolated noise points" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>DBSCAN Density Reachability: Core, Border, and Noise</title>
  <defs>
    <linearGradient id="bg184b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="dbscanCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg184b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">DBSCAN: DENSITY REACHABILITY &amp; NOISE FILTERING</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Epsilon Neighborhood and MinPts Thresholding in Continuous Density Spaces</text>
  <g transform="translate(60, 90)">
    <rect width="730" height="290" fill="url(#dbscanCard)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <circle cx="220" cy="145" r="75" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="220" cy="145" r="10" fill="#3b82f6"/>
    <text x="220" y="130" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Core Point (p)</text>
    <circle cx="180" cy="120" r="6" fill="#93c5fd"/>
    <circle cx="240" cy="170" r="6" fill="#93c5fd"/>
    <circle cx="200" cy="180" r="6" fill="#93c5fd"/>
    <circle cx="260" cy="130" r="6" fill="#93c5fd"/>
    <circle cx="340" cy="145" r="75" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="280" cy="145" r="9" fill="#10b981"/>
    <text x="280" y="165" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Border Point (q)</text>
    <circle cx="620" cy="145" r="9" fill="#ef4444"/>
    <text x="620" y="170" fill="#f87171" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Noise / Outlier (N)</text>
    <text x="365" y="270" fill="#cbd5e1" font-family="system-ui" font-size="11" text-anchor="middle">MinPts = 4 | Epsilon = Radius eps</text>
  </g>
</svg>
