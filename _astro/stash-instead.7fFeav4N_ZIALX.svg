<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label=""I need a clean tree for a moment" is not an undo problem.">
  <title>Most resets could have been a stash</title>
  <style>
    .stash-instead-bg   { fill: #f8fafc; }
    .stash-instead-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stash-instead-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stash-instead-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stash-instead-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stash-instead-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stash-instead-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stash-instead-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stash-instead-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stash-instead-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stash-instead-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stash-instead-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stash-instead-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stash-instead-row { opacity: 1; }
    .stash-instead-r0 { animation-delay: 0.00s; }
    .stash-instead-r1 { animation-delay: 0.45s; }
    .stash-instead-r2 { animation-delay: 0.90s; }
    .stash-instead-r3 { animation-delay: 1.35s; }
    .stash-instead-r4 { animation-delay: 1.80s; }
    .stash-instead-row { animation: stash-instead-reveal 7.3s ease-in-out infinite; }
    @keyframes stash-instead-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="stash-instead-bg" width="980" height="390"/>
  <text class="stash-instead-h1"  x="30" y="40">Most resets could have been a stash</text>
  <text class="stash-instead-sub" x="30" y="64">"I need a clean tree for a moment" is not an undo problem.</text>
  <rect class="stash-instead-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="stash-instead-name" x="46" y="122">reset --hard</text>
  <text class="stash-instead-desc" x="46" y="142">Clears the tree by destroying it.</text>
  <text class="stash-instead-desc stash-instead-row stash-instead-r0" x="46" y="182">Uncommitted work is gone</text>
  <text class="stash-instead-desc stash-instead-row stash-instead-r1" x="46" y="216">No record anywhere</text>
  <text class="stash-instead-desc stash-instead-row stash-instead-r2" x="46" y="250">Nothing to restore later</text>
  <text class="stash-instead-desc stash-instead-row stash-instead-r3" x="46" y="284">Irreversible</text>
  <text class="stash-instead-desc stash-instead-row stash-instead-r4" x="46" y="318">Chosen under time pressure</text>
  <rect class="stash-instead-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="stash-instead-name" x="526" y="122">git stash</text>
  <text class="stash-instead-desc" x="526" y="142">Clears the tree by setting it aside.</text>
  <text class="stash-instead-desc stash-instead-row stash-instead-r0" x="526" y="182">Work is saved, not destroyed</text>
  <text class="stash-instead-desc stash-instead-row stash-instead-r1" x="526" y="216">git stash list shows what is there</text>
  <text class="stash-instead-desc stash-instead-row stash-instead-r2" x="526" y="250">git stash pop brings it back</text>
  <text class="stash-instead-desc stash-instead-row stash-instead-r3" x="526" y="284">Reversible</text>
  <text class="stash-instead-desc stash-instead-row stash-instead-r4" x="526" y="318">Costs one extra word to type</text>
  <text class="stash-instead-sub" x="30" y="372">Stash is the answer to "I need to switch branches and am not ready to commit", which is the situation people most often solve with a destructive reset instead.</text>
</svg>
