<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The error ceiling</title>
  <style>
    .error-ceiling-bg   { fill: #f8fafc; }
    .error-ceiling-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .error-ceiling-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .error-ceiling-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .error-ceiling-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .error-ceiling-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .error-ceiling-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .error-ceiling-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .error-ceiling-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .error-ceiling-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .error-ceiling-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .error-ceiling-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .error-ceiling-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .error-ceiling-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .error-ceiling-stage { opacity: 1; }

    .error-ceiling-s0 { animation-delay: 0.00s; }
    .error-ceiling-e0 { animation-delay: 0.00s; }
    .error-ceiling-s1 { animation-delay: 1.28s; }
    .error-ceiling-e1 { animation-delay: 1.28s; }
    .error-ceiling-s2 { animation-delay: 2.56s; }
    .error-ceiling-e2 { animation-delay: 2.56s; }
    .error-ceiling-s3 { animation-delay: 3.84s; }
    .error-ceiling-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .error-ceiling-conn  { animation: error-ceiling-trace 6.4s ease-in-out infinite; }
      .error-ceiling-stage { animation: error-ceiling-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes error-ceiling-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes error-ceiling-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .error-ceiling-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .error-ceiling-stage { animation: error-ceiling-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes error-ceiling-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="error-ceiling-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="error-ceiling-bg" width="980" height="322"/>
  <text class="error-ceiling-h1"  x="30" y="40">The error ceiling</text>
  <text class="error-ceiling-sub" x="30" y="64">Four steps.</text>
  <g class="error-ceiling-stage error-ceiling-s0">
    <rect class="error-ceiling-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="error-ceiling-step" x="44" y="142">01</text>
    <text class="error-ceiling-name" x="70" y="142">One error category is thirty percent of failures</text>
    <text class="error-ceiling-desc" x="44" y="166">From the counted analysis.</text>
  </g>
  <line class="error-ceiling-line error-ceiling-conn error-ceiling-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#error-ceiling-tip)"/>
  <g class="error-ceiling-stage error-ceiling-s1">
    <rect class="error-ceiling-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="error-ceiling-step" x="280" y="142">02</text>
    <text class="error-ceiling-name" x="306" y="142">Suppose it were eliminated entirely</text>
    <text class="error-ceiling-desc" x="280" y="166">Which is the optimistic case.</text>
  </g>
  <line class="error-ceiling-line error-ceiling-conn error-ceiling-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#error-ceiling-tip)"/>
  <g class="error-ceiling-stage error-ceiling-s2">
    <rect class="error-ceiling-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="error-ceiling-step" x="516" y="142">03</text>
    <text class="error-ceiling-name" x="542" y="142">Overall error falls by at most that share</text>
    <text class="error-ceiling-desc" x="516" y="166">Which is the ceiling on that</text>
    <text class="error-ceiling-desc" x="516" y="182">work.</text>
  </g>
  <line class="error-ceiling-line error-ceiling-conn error-ceiling-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#error-ceiling-tip)"/>
  <g class="error-ceiling-stage error-ceiling-s3">
    <rect class="error-ceiling-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="error-ceiling-step" x="752" y="142">04</text>
    <text class="error-ceiling-name" x="778" y="142">Compare that against the effort it would take</text>
    <text class="error-ceiling-desc" x="752" y="166">Before starting, not after.</text>
  </g>
  <text class="error-ceiling-sub" x="30" y="304">Estimating the ceiling before starting prevents the common outcome of a month spent perfecting a category worth two percent of the total error.</text>
</svg>
