<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three steps, in this order.">
  <title>What a = [1, 2, 3] actually does</title>
  <style>
    .three-steps-of-assignment-bg   { fill: #f8fafc; }
    .three-steps-of-assignment-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-steps-of-assignment-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-steps-of-assignment-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-steps-of-assignment-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-steps-of-assignment-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-steps-of-assignment-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-steps-of-assignment-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-steps-of-assignment-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-steps-of-assignment-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-steps-of-assignment-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-steps-of-assignment-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-steps-of-assignment-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .three-steps-of-assignment-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .three-steps-of-assignment-stage { opacity: 1; }

    .three-steps-of-assignment-s0 { animation-delay: 0.00s; }
    .three-steps-of-assignment-e0 { animation-delay: 0.00s; }
    .three-steps-of-assignment-s1 { animation-delay: 1.50s; }
    .three-steps-of-assignment-e1 { animation-delay: 1.50s; }
    .three-steps-of-assignment-s2 { animation-delay: 3.00s; }
    .three-steps-of-assignment-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .three-steps-of-assignment-conn  { animation: three-steps-of-assignment-trace 6s ease-in-out infinite; }
      .three-steps-of-assignment-stage { animation: three-steps-of-assignment-arrive 6s ease-in-out infinite; }
    }
    @keyframes three-steps-of-assignment-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes three-steps-of-assignment-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .three-steps-of-assignment-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .three-steps-of-assignment-stage { animation: three-steps-of-assignment-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes three-steps-of-assignment-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="three-steps-of-assignment-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="three-steps-of-assignment-bg" width="980" height="322"/>
  <text class="three-steps-of-assignment-h1"  x="30" y="40">What a = [1, 2, 3] actually does</text>
  <text class="three-steps-of-assignment-sub" x="30" y="64">Three steps, in this order.</text>
  <g class="three-steps-of-assignment-stage three-steps-of-assignment-s0">
    <rect class="three-steps-of-assignment-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="three-steps-of-assignment-step" x="44" y="142">01</text>
    <text class="three-steps-of-assignment-name" x="70" y="142">The object is created</text>
    <text class="three-steps-of-assignment-desc" x="44" y="166">A list, with its own type, value and</text>
    <text class="three-steps-of-assignment-desc" x="44" y="182">identity. It exists before the name does.</text>
  </g>
  <line class="three-steps-of-assignment-line three-steps-of-assignment-conn three-steps-of-assignment-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#three-steps-of-assignment-tip)"/>
  <g class="three-steps-of-assignment-stage three-steps-of-assignment-s1">
    <rect class="three-steps-of-assignment-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="three-steps-of-assignment-step" x="359" y="142">02</text>
    <text class="three-steps-of-assignment-name" x="385" y="142">The name is created</text>
    <text class="three-steps-of-assignment-desc" x="359" y="166">In the current namespace, if it was not</text>
    <text class="three-steps-of-assignment-desc" x="359" y="182">already there.</text>
  </g>
  <line class="three-steps-of-assignment-line three-steps-of-assignment-conn three-steps-of-assignment-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#three-steps-of-assignment-tip)"/>
  <g class="three-steps-of-assignment-stage three-steps-of-assignment-s2">
    <rect class="three-steps-of-assignment-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="three-steps-of-assignment-step" x="674" y="142">03</text>
    <text class="three-steps-of-assignment-name" x="700" y="142">The name is bound to it</text>
    <text class="three-steps-of-assignment-desc" x="674" y="166">Connected — and still two separate things.</text>
    <text class="three-steps-of-assignment-edge" x="674" y="242">bound</text>
  </g>
  <text class="three-steps-of-assignment-sub" x="30" y="304">Reading assignment in this order is what makes b = a obviously not a copy: step one is skipped entirely, because the object already exists.</text>
</svg>
