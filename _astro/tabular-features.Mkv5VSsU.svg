<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four kinds of feature.">
  <title>Where tabular gains come from</title>
  <style>
    .tabular-features-bg   { fill: #f8fafc; }
    .tabular-features-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-features-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-features-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-features-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-features-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-features-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tabular-features-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tabular-features-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tabular-features-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tabular-features-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tabular-features-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tabular-features-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tabular-features-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tabular-features-stage { opacity: 1; }

    .tabular-features-s0 { animation-delay: 0.00s; }
    .tabular-features-e0 { animation-delay: 0.00s; }
    .tabular-features-s1 { animation-delay: 1.28s; }
    .tabular-features-e1 { animation-delay: 1.28s; }
    .tabular-features-s2 { animation-delay: 2.56s; }
    .tabular-features-e2 { animation-delay: 2.56s; }
    .tabular-features-s3 { animation-delay: 3.84s; }
    .tabular-features-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tabular-features-conn  { animation: tabular-features-trace 6.4s ease-in-out infinite; }
      .tabular-features-stage { animation: tabular-features-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tabular-features-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tabular-features-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tabular-features-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tabular-features-stage { animation: tabular-features-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tabular-features-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tabular-features-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tabular-features-bg" width="980" height="322"/>
  <text class="tabular-features-h1"  x="30" y="40">Where tabular gains come from</text>
  <text class="tabular-features-sub" x="30" y="64">Four kinds of feature.</text>
  <g class="tabular-features-stage tabular-features-s0">
    <rect class="tabular-features-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tabular-features-step" x="44" y="142">01</text>
    <text class="tabular-features-name" x="70" y="142">Aggregations across related rows</text>
    <text class="tabular-features-desc" x="44" y="166">Counts, means and recency per</text>
    <text class="tabular-features-desc" x="44" y="182">entity.</text>
  </g>
  <line class="tabular-features-line tabular-features-conn tabular-features-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tabular-features-tip)"/>
  <g class="tabular-features-stage tabular-features-s1">
    <rect class="tabular-features-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tabular-features-step" x="280" y="142">02</text>
    <text class="tabular-features-name" x="306" y="142">Ratios and differences between columns</text>
    <text class="tabular-features-desc" x="280" y="166">Which trees cannot construct</text>
    <text class="tabular-features-desc" x="280" y="182">themselves.</text>
  </g>
  <line class="tabular-features-line tabular-features-conn tabular-features-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tabular-features-tip)"/>
  <g class="tabular-features-stage tabular-features-s2">
    <rect class="tabular-features-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tabular-features-step" x="516" y="142">03</text>
    <text class="tabular-features-name" x="542" y="142">Time-derived features</text>
    <text class="tabular-features-desc" x="516" y="166">Day of week, time since last</text>
    <text class="tabular-features-desc" x="516" y="182">event, seasonality.</text>
  </g>
  <line class="tabular-features-line tabular-features-conn tabular-features-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tabular-features-tip)"/>
  <g class="tabular-features-stage tabular-features-s3">
    <rect class="tabular-features-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tabular-features-step" x="752" y="142">04</text>
    <text class="tabular-features-name" x="778" y="142">And domain-specific terms</text>
    <text class="tabular-features-desc" x="752" y="166">Which come from talking to</text>
    <text class="tabular-features-desc" x="752" y="182">people, not from data.</text>
    <text class="tabular-features-edge" x="752" y="242">the best ones</text>
  </g>
  <text class="tabular-features-sub" x="30" y="304">Ratios are worth singling out: a tree can split on two columns separately but cannot represent their ratio, so supplying it directly is a real addition.</text>
</svg>
