<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Steering by subtraction.">
  <title>Negative prompting</title>
  <style>
    .negative-prompt-bg   { fill: #f8fafc; }
    .negative-prompt-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .negative-prompt-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .negative-prompt-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .negative-prompt-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .negative-prompt-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .negative-prompt-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .negative-prompt-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .negative-prompt-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .negative-prompt-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .negative-prompt-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .negative-prompt-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .negative-prompt-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .negative-prompt-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .negative-prompt-stage { opacity: 1; }

    .negative-prompt-s0 { animation-delay: 0.00s; }
    .negative-prompt-e0 { animation-delay: 0.00s; }
    .negative-prompt-s1 { animation-delay: 1.28s; }
    .negative-prompt-e1 { animation-delay: 1.28s; }
    .negative-prompt-s2 { animation-delay: 2.56s; }
    .negative-prompt-e2 { animation-delay: 2.56s; }
    .negative-prompt-s3 { animation-delay: 3.84s; }
    .negative-prompt-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .negative-prompt-conn  { animation: negative-prompt-trace 6.4s ease-in-out infinite; }
      .negative-prompt-stage { animation: negative-prompt-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes negative-prompt-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes negative-prompt-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .negative-prompt-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .negative-prompt-stage { animation: negative-prompt-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes negative-prompt-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="negative-prompt-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="negative-prompt-bg" width="980" height="322"/>
  <text class="negative-prompt-h1"  x="30" y="40">Negative prompting</text>
  <text class="negative-prompt-sub" x="30" y="64">Steering by subtraction.</text>
  <g class="negative-prompt-stage negative-prompt-s0">
    <rect class="negative-prompt-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="negative-prompt-step" x="44" y="142">01</text>
    <text class="negative-prompt-name" x="70" y="142">Guidance normally extrapolates away from an empty prompt</text>
    <text class="negative-prompt-desc" x="44" y="166">The unconditional prediction.</text>
  </g>
  <line class="negative-prompt-line negative-prompt-conn negative-prompt-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#negative-prompt-tip)"/>
  <g class="negative-prompt-stage negative-prompt-s1">
    <rect class="negative-prompt-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="negative-prompt-step" x="280" y="142">02</text>
    <text class="negative-prompt-name" x="306" y="142">Replace that with a prompt of what you do not want</text>
    <text class="negative-prompt-desc" x="280" y="166">Blur, extra limbs, watermarks.</text>
  </g>
  <line class="negative-prompt-line negative-prompt-conn negative-prompt-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#negative-prompt-tip)"/>
  <g class="negative-prompt-stage negative-prompt-s2">
    <rect class="negative-prompt-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="negative-prompt-step" x="516" y="142">03</text>
    <text class="negative-prompt-name" x="542" y="142">So the extrapolation moves away from those too</text>
    <text class="negative-prompt-desc" x="516" y="166">Not merely toward the positive</text>
    <text class="negative-prompt-desc" x="516" y="182">prompt.</text>
  </g>
  <line class="negative-prompt-line negative-prompt-conn negative-prompt-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#negative-prompt-tip)"/>
  <g class="negative-prompt-stage negative-prompt-s3">
    <rect class="negative-prompt-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="negative-prompt-step" x="752" y="142">04</text>
    <text class="negative-prompt-name" x="778" y="142">Which removes recurring artefacts reliably</text>
    <text class="negative-prompt-desc" x="752" y="166">More reliably than describing</text>
    <text class="negative-prompt-desc" x="752" y="182">their absence.</text>
  </g>
  <text class="negative-prompt-sub" x="30" y="304">Asking for an image without something in the positive prompt tends to produce it, for the same reason negative instructions fail in text prompting — the negative prompt is the mechanism that actually works.</text>
</svg>
