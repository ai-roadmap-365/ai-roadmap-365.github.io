<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And how to make it shared.">
  <title>When to build the harness</title>
  <style>
    .harness-when-bg   { fill: #f8fafc; }
    .harness-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .harness-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .harness-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .harness-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .harness-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .harness-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .harness-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .harness-when-row { opacity: 1; }
    .harness-when-r0 { animation-delay: 0.00s; }
    .harness-when-r1 { animation-delay: 0.45s; }
    .harness-when-r2 { animation-delay: 0.90s; }
    .harness-when-r3 { animation-delay: 1.35s; }
    .harness-when-r4 { animation-delay: 1.80s; }
    .harness-when-row { animation: harness-when-reveal 7.3s ease-in-out infinite; }
    @keyframes harness-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="harness-when-bg" width="980" height="390"/>
  <text class="harness-when-h1"  x="30" y="40">When to build the harness</text>
  <text class="harness-when-sub" x="30" y="64">And how to make it shared.</text>
  <rect class="harness-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="harness-when-name" x="46" y="122">Build it</text>
  <text class="harness-when-desc" x="46" y="142">Before shipping, and after.</text>
  <text class="harness-when-desc harness-when-row harness-when-r0" x="46" y="182">Before real customers see it</text>
  <text class="harness-when-desc harness-when-row harness-when-r1" x="46" y="216">Throughout ongoing maintenance</text>
  <text class="harness-when-desc harness-when-row harness-when-r2" x="46" y="250">Whenever prompts or models change</text>
  <text class="harness-when-desc harness-when-row harness-when-r3" x="46" y="284">Whenever more than one person contributes</text>
  <text class="harness-when-desc harness-when-row harness-when-r4" x="46" y="318">And run it in CI, not by hand</text>
  <rect class="harness-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="harness-when-name" x="526" y="122">Make it shared</text>
  <text class="harness-when-desc" x="526" y="142">Two adoption practices.</text>
  <text class="harness-when-desc harness-when-row harness-when-r0" x="526" y="182">Package it as an internal CLI</text>
  <text class="harness-when-desc harness-when-row harness-when-r1" x="526" y="216">One command, any repository</text>
  <text class="harness-when-desc harness-when-row harness-when-r2" x="526" y="250">Standardise JSON artefacts and markdown summaries</text>
  <text class="harness-when-desc harness-when-row harness-when-r3" x="526" y="284">Skip it for a ten-minute prototype</text>
  <text class="harness-when-desc harness-when-row harness-when-r4" x="526" y="318">But keep the failures for later</text>
  <text class="harness-when-sub" x="30" y="372">Packaging it as a shared CLI is what determines whether other teams adopt it: a harness that must be reimplemented per repository is a harness two teams have and the rest do without.</text>
</svg>
