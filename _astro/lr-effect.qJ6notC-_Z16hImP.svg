<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four regimes.">
  <title>What the learning rate controls</title>
  <style>
    .lr-effect-bg   { fill: #f8fafc; }
    .lr-effect-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lr-effect-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lr-effect-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lr-effect-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lr-effect-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lr-effect-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lr-effect-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .lr-effect-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .lr-effect-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .lr-effect-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .lr-effect-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .lr-effect-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .lr-effect-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .lr-effect-stage { opacity: 1; }

    .lr-effect-s0 { animation-delay: 0.00s; }
    .lr-effect-e0 { animation-delay: 0.00s; }
    .lr-effect-s1 { animation-delay: 1.28s; }
    .lr-effect-e1 { animation-delay: 1.28s; }
    .lr-effect-s2 { animation-delay: 2.56s; }
    .lr-effect-e2 { animation-delay: 2.56s; }
    .lr-effect-s3 { animation-delay: 3.84s; }
    .lr-effect-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .lr-effect-conn  { animation: lr-effect-trace 6.4s ease-in-out infinite; }
      .lr-effect-stage { animation: lr-effect-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes lr-effect-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes lr-effect-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .lr-effect-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .lr-effect-stage { animation: lr-effect-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes lr-effect-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="lr-effect-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="lr-effect-bg" width="980" height="322"/>
  <text class="lr-effect-h1"  x="30" y="40">What the learning rate controls</text>
  <text class="lr-effect-sub" x="30" y="64">Four regimes.</text>
  <g class="lr-effect-stage lr-effect-s0">
    <rect class="lr-effect-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="lr-effect-step" x="44" y="142">01</text>
    <text class="lr-effect-name" x="70" y="142">Too small: it converges, eventually</text>
    <text class="lr-effect-desc" x="44" y="166">Wasting time, and stalling on</text>
    <text class="lr-effect-desc" x="44" y="182">flat ground.</text>
  </g>
  <line class="lr-effect-line lr-effect-conn lr-effect-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#lr-effect-tip)"/>
  <g class="lr-effect-stage lr-effect-s1">
    <rect class="lr-effect-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="lr-effect-step" x="280" y="142">02</text>
    <text class="lr-effect-name" x="306" y="142">Well chosen: steady, quick descent</text>
    <text class="lr-effect-desc" x="280" y="166">Which is what you want.</text>
  </g>
  <line class="lr-effect-line lr-effect-conn lr-effect-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#lr-effect-tip)"/>
  <g class="lr-effect-stage lr-effect-s2">
    <rect class="lr-effect-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="lr-effect-step" x="516" y="142">03</text>
    <text class="lr-effect-name" x="542" y="142">Too large: it overshoots and oscillates</text>
    <text class="lr-effect-desc" x="516" y="166">Bouncing across the valley.</text>
  </g>
  <line class="lr-effect-line lr-effect-conn lr-effect-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#lr-effect-tip)"/>
  <g class="lr-effect-stage lr-effect-s3">
    <rect class="lr-effect-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="lr-effect-step" x="752" y="142">04</text>
    <text class="lr-effect-name" x="778" y="142">And far too large: the loss diverges</text>
    <text class="lr-effect-desc" x="752" y="166">Growing without bound.</text>
  </g>
  <text class="lr-effect-sub" x="30" y="304">The learning rate is the single most consequential hyperparameter in most training runs, and a loss that increases from the first step is almost always this.</text>
</svg>
