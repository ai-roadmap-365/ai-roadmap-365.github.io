<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What cross-validation is not</title>
  <style>
    .cv-not-bg   { fill: #f8fafc; }
    .cv-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cv-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cv-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cv-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cv-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cv-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cv-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cv-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cv-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cv-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cv-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cv-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cv-not-row { opacity: 1; }
    .cv-not-r0 { animation-delay: 0.00s; }
    .cv-not-r1 { animation-delay: 0.45s; }
    .cv-not-r2 { animation-delay: 0.90s; }
    .cv-not-r3 { animation-delay: 1.35s; }
    .cv-not-r4 { animation-delay: 1.80s; }
    .cv-not-row { animation: cv-not-reveal 7.3s ease-in-out infinite; }
    @keyframes cv-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cv-not-bg" width="980" height="390"/>
  <text class="cv-not-h1"  x="30" y="40">What cross-validation is not</text>
  <text class="cv-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="cv-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cv-not-name" x="46" y="122">The misconception</text>
  <text class="cv-not-desc" x="46" y="142">Commonly held.</text>
  <text class="cv-not-desc cv-not-row cv-not-r0" x="46" y="182">More folds are always better</text>
  <text class="cv-not-desc cv-not-row cv-not-r1" x="46" y="216">It replaces a held-out test set</text>
  <text class="cv-not-desc cv-not-row cv-not-r2" x="46" y="250">The mean is the whole result</text>
  <text class="cv-not-desc cv-not-row cv-not-r3" x="46" y="284">It works for any data</text>
  <text class="cv-not-desc cv-not-row cv-not-r4" x="46" y="318">Its score is what production will give</text>
  <rect class="cv-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cv-not-name" x="526" y="122">What is true</text>
  <text class="cv-not-desc" x="526" y="142">Actually.</text>
  <text class="cv-not-desc cv-not-row cv-not-r0" x="526" y="182">Five or ten is standard; more costs more for little</text>
  <text class="cv-not-desc cv-not-row cv-not-r1" x="526" y="216">It complements one; selection still overfits</text>
  <text class="cv-not-desc cv-not-row cv-not-r2" x="526" y="250">The spread decides whether differences are real</text>
  <text class="cv-not-desc cv-not-row cv-not-r3" x="526" y="284">The strategy must match the structure</text>
  <text class="cv-not-desc cv-not-row cv-not-r4" x="526" y="318">Only if the split reflects deployment</text>
  <text class="cv-not-sub" x="30" y="372">The last row is the one that matters most: a randomly split estimate on time-ordered data describes a deployment scenario that will never occur.</text>
</svg>
