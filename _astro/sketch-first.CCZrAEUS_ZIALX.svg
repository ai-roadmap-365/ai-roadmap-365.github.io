<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Which changes what you build.">
  <title>Deciding the shape before building</title>
  <style>
    .sketch-first-bg   { fill: #f8fafc; }
    .sketch-first-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sketch-first-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sketch-first-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sketch-first-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sketch-first-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sketch-first-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sketch-first-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sketch-first-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sketch-first-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sketch-first-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sketch-first-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sketch-first-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sketch-first-row { opacity: 1; }
    .sketch-first-r0 { animation-delay: 0.00s; }
    .sketch-first-r1 { animation-delay: 0.45s; }
    .sketch-first-r2 { animation-delay: 0.90s; }
    .sketch-first-r3 { animation-delay: 1.35s; }
    .sketch-first-r4 { animation-delay: 1.80s; }
    .sketch-first-row { animation: sketch-first-reveal 7.3s ease-in-out infinite; }
    @keyframes sketch-first-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="sketch-first-bg" width="980" height="390"/>
  <text class="sketch-first-h1"  x="30" y="40">Deciding the shape before building</text>
  <text class="sketch-first-sub" x="30" y="64">Which changes what you build.</text>
  <rect class="sketch-first-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="sketch-first-name" x="46" y="122">Decide the shape first</text>
  <text class="sketch-first-desc" x="46" y="142">From the outside.</text>
  <text class="sketch-first-desc sketch-first-row sketch-first-r0" x="46" y="182">Say how it will be used</text>
  <text class="sketch-first-desc sketch-first-row sketch-first-r1" x="46" y="216">The interface is designed for the caller</text>
  <text class="sketch-first-desc sketch-first-row sketch-first-r2" x="46" y="250">Awkwardness is noticed immediately</text>
  <text class="sketch-first-desc sketch-first-row sketch-first-r3" x="46" y="284">The build follows a decision</text>
  <text class="sketch-first-desc sketch-first-row sketch-first-r4" x="46" y="318">This is test-first</text>
  <rect class="sketch-first-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="sketch-first-name" x="526" y="122">Build, then wrap</text>
  <text class="sketch-first-desc" x="526" y="142">From the inside.</text>
  <text class="sketch-first-desc sketch-first-row sketch-first-r0" x="526" y="182">Build what seems right</text>
  <text class="sketch-first-desc sketch-first-row sketch-first-r1" x="526" y="216">The interface reflects the implementation</text>
  <text class="sketch-first-desc sketch-first-row sketch-first-r2" x="526" y="250">Awkwardness is discovered by the caller</text>
  <text class="sketch-first-desc sketch-first-row sketch-first-r3" x="526" y="284">The decision follows the build</text>
  <text class="sketch-first-desc sketch-first-row sketch-first-r4" x="526" y="318">This is test-after</text>
  <text class="sketch-first-sub" x="30" y="372">Noticing awkwardness immediately is the mechanism: writing the call before the implementation exposes a bad interface at the cheapest possible moment.</text>
</svg>
