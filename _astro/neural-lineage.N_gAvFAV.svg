<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One of them nearly ended it.">
  <title>Five dates that made the field</title>
  <style>
    .neural-lineage-bg   { fill: #f8fafc; }
    .neural-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .neural-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .neural-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .neural-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .neural-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .neural-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .neural-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .neural-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .neural-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .neural-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .neural-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .neural-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .neural-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .neural-lineage-stage { opacity: 1; }

    .neural-lineage-s0 { animation-delay: 0.00s; }
    .neural-lineage-e0 { animation-delay: 0.00s; }
    .neural-lineage-s1 { animation-delay: 1.33s; }
    .neural-lineage-e1 { animation-delay: 1.33s; }
    .neural-lineage-s2 { animation-delay: 2.67s; }
    .neural-lineage-e2 { animation-delay: 2.67s; }
    .neural-lineage-s3 { animation-delay: 4.00s; }
    .neural-lineage-e3 { animation-delay: 4.00s; }
    .neural-lineage-s4 { animation-delay: 5.33s; }
    .neural-lineage-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .neural-lineage-conn  { animation: neural-lineage-trace 8s ease-in-out infinite; }
      .neural-lineage-stage { animation: neural-lineage-arrive 8s ease-in-out infinite; }
    }
    @keyframes neural-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes neural-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .neural-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .neural-lineage-stage { animation: neural-lineage-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes neural-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="neural-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="neural-lineage-bg" width="980" height="322"/>
  <text class="neural-lineage-h1"  x="30" y="40">Five dates that made the field</text>
  <text class="neural-lineage-sub" x="30" y="64">One of them nearly ended it.</text>
  <g class="neural-lineage-stage neural-lineage-s0">
    <rect class="neural-lineage-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="neural-lineage-step" x="44" y="142">01</text>
    <text class="neural-lineage-name" x="70" y="142">1943: a threshold neuron</text>
    <text class="neural-lineage-desc" x="44" y="166">McCulloch and Pitts. The</text>
    <text class="neural-lineage-desc" x="44" y="182">first mathematical model</text>
    <text class="neural-lineage-desc" x="44" y="198">of a neuron.</text>
  </g>
  <line class="neural-lineage-line neural-lineage-conn neural-lineage-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#neural-lineage-tip)"/>
  <g class="neural-lineage-stage neural-lineage-s1">
    <rect class="neural-lineage-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="neural-lineage-step" x="233" y="142">02</text>
    <text class="neural-lineage-name" x="259" y="142">1958: the perceptron</text>
    <text class="neural-lineage-desc" x="233" y="166">Rosenblatt. A learning</text>
    <text class="neural-lineage-desc" x="233" y="182">rule, implemented in</text>
    <text class="neural-lineage-desc" x="233" y="198">hardware.</text>
  </g>
  <line class="neural-lineage-line neural-lineage-conn neural-lineage-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#neural-lineage-tip)"/>
  <g class="neural-lineage-stage neural-lineage-s2">
    <rect class="neural-lineage-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="neural-lineage-step" x="422" y="142">03</text>
    <text class="neural-lineage-name" x="448" y="142">1962: convergence proved</text>
    <text class="neural-lineage-desc" x="422" y="166">Novikoff. Finite steps,</text>
    <text class="neural-lineage-desc" x="422" y="182">on linearly separable</text>
    <text class="neural-lineage-desc" x="422" y="198">data.</text>
    <text class="neural-lineage-edge" x="422" y="242">guaranteed</text>
  </g>
  <line class="neural-lineage-line neural-lineage-conn neural-lineage-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#neural-lineage-tip)"/>
  <g class="neural-lineage-stage neural-lineage-s3">
    <rect class="neural-lineage-warn" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="neural-lineage-step" x="611" y="142">04</text>
    <text class="neural-lineage-name" x="637" y="142">1969: the XOR proof</text>
    <text class="neural-lineage-desc" x="611" y="166">Minsky and Papert. Single</text>
    <text class="neural-lineage-desc" x="611" y="182">layers cannot compute</text>
    <text class="neural-lineage-desc" x="611" y="198">parity.</text>
    <text class="neural-lineage-edge" x="611" y="242">AI winter</text>
  </g>
  <line class="neural-lineage-line neural-lineage-conn neural-lineage-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#neural-lineage-tip)"/>
  <g class="neural-lineage-stage neural-lineage-s4">
    <rect class="neural-lineage-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="neural-lineage-step" x="800" y="142">05</text>
    <text class="neural-lineage-name" x="826" y="142">1986: backpropagation</text>
    <text class="neural-lineage-desc" x="800" y="166">Multi-layer networks with</text>
    <text class="neural-lineage-desc" x="800" y="182">continuous activations</text>
    <text class="neural-lineage-desc" x="800" y="198">solve it.</text>
  </g>
  <text class="neural-lineage-sub" x="30" y="304">The 1969 result was mathematically correct and widely over-read: it proved a limitation of one layer, and was received as a limitation of the approach.</text>
</svg>
