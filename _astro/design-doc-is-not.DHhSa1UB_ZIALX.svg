<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A decision record, not a diagram collection.">
  <title>What a design document is for</title>
  <style>
    .design-doc-is-not-bg   { fill: #f8fafc; }
    .design-doc-is-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-doc-is-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-doc-is-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-doc-is-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-doc-is-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-doc-is-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .design-doc-is-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .design-doc-is-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .design-doc-is-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .design-doc-is-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .design-doc-is-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .design-doc-is-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .design-doc-is-not-row { opacity: 1; }
    .design-doc-is-not-r0 { animation-delay: 0.00s; }
    .design-doc-is-not-r1 { animation-delay: 0.45s; }
    .design-doc-is-not-r2 { animation-delay: 0.90s; }
    .design-doc-is-not-r3 { animation-delay: 1.35s; }
    .design-doc-is-not-r4 { animation-delay: 1.80s; }
    .design-doc-is-not-row { animation: design-doc-is-not-reveal 7.3s ease-in-out infinite; }
    @keyframes design-doc-is-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="design-doc-is-not-bg" width="980" height="390"/>
  <text class="design-doc-is-not-h1"  x="30" y="40">What a design document is for</text>
  <text class="design-doc-is-not-sub" x="30" y="64">A decision record, not a diagram collection.</text>
  <rect class="design-doc-is-not-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="design-doc-is-not-name" x="46" y="122">It is</text>
  <text class="design-doc-is-not-desc" x="46" y="142">Decisions, and why.</text>
  <text class="design-doc-is-not-desc design-doc-is-not-row design-doc-is-not-r0" x="46" y="182">The components and their contracts</text>
  <text class="design-doc-is-not-desc design-doc-is-not-row design-doc-is-not-r1" x="46" y="216">The latency budget, allocated</text>
  <text class="design-doc-is-not-desc design-doc-is-not-row design-doc-is-not-r2" x="46" y="250">What happens when each part fails</text>
  <text class="design-doc-is-not-desc design-doc-is-not-row design-doc-is-not-r3" x="46" y="284">The alternatives rejected, and why</text>
  <text class="design-doc-is-not-desc design-doc-is-not-row design-doc-is-not-r4" x="46" y="318">Short enough that people read it</text>
  <rect class="design-doc-is-not-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="design-doc-is-not-name" x="526" y="122">It is not</text>
  <text class="design-doc-is-not-desc" x="526" y="142">Common misreadings.</text>
  <text class="design-doc-is-not-desc design-doc-is-not-row design-doc-is-not-r0" x="526" y="182">Not a picture of every class</text>
  <text class="design-doc-is-not-desc design-doc-is-not-row design-doc-is-not-r1" x="526" y="216">Not written once and abandoned</text>
  <text class="design-doc-is-not-desc design-doc-is-not-row design-doc-is-not-r2" x="526" y="250">Not a substitute for building the slice</text>
  <text class="design-doc-is-not-desc design-doc-is-not-row design-doc-is-not-r3" x="526" y="284">Not a promise the design cannot change</text>
  <text class="design-doc-is-not-desc design-doc-is-not-row design-doc-is-not-r4" x="526" y="318">Not long — length is why they go unread</text>
  <text class="design-doc-is-not-sub" x="30" y="372">The test of a design document is whether a new person can make a correct change after reading it. Anything that does not serve that is decoration.</text>
</svg>
