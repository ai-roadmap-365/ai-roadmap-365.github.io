<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" font-family="system-ui, sans-serif">
  <title>The TLS handshake: ClientHello, ServerHello with certificate, key agreement, then encrypted session</title>
  <rect x="0" y="0" width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The TLS handshake</text>

  <!-- Actor columns -->
  <text x="150" y="70" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">Browser (client)</text>
  <text x="610" y="70" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">Server (the website)</text>
  <line x1="150" y1="80" x2="150" y2="410" stroke="#94a3b8" stroke-width="2"/>
  <line x1="610" y1="80" x2="610" y2="410" stroke="#94a3b8" stroke-width="2"/>

  <!-- Step 1: ClientHello -->
  <line x1="150" y1="110" x2="602" y2="110" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="610,110 596,103 596,117" fill="#1d4ed8"/>
  <text x="380" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">1. ClientHello</text>
  <text x="380" y="126" text-anchor="middle" font-size="14" fill="#1a202c">"Hello. Here are the cipher suites and TLS versions I support."</text>

  <!-- Step 2: ServerHello + certificate -->
  <line x1="610" y1="175" x2="158" y2="175" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="150,175 164,168 164,182" fill="#1d4ed8"/>
  <text x="380" y="167" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">2. ServerHello + certificate</text>
  <text x="380" y="191" text-anchor="middle" font-size="14" fill="#1a202c">"Let's use this cipher. Here is my certificate and public key."</text>

  <!-- Step 3: verify + key agreement -->
  <rect x="40" y="215" width="220" height="66" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="150" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">3. Verify certificate</text>
  <text x="150" y="260" text-anchor="middle" font-size="14" fill="#1a202c">Check the chain of trust,</text>
  <text x="150" y="276" text-anchor="middle" font-size="14" fill="#1a202c">then agree a shared key.</text>

  <line x1="150" y1="300" x2="602" y2="300" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="610,300 596,293 596,307" fill="#1d4ed8"/>
  <text x="380" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">4. Key exchange</text>
  <text x="385" y="316" text-anchor="middle" font-size="14" fill="#1a202c">Using public-key math, both sides end up with the same secret key.</text>

  <!-- Step 5: encrypted session -->
  <rect x="120" y="350" width="520" height="50" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="372" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">5. Encrypted session (fast symmetric encryption)</text>
  <text x="380" y="392" text-anchor="middle" font-size="14" fill="#1a202c">All later HTTP requests and responses are sealed with the shared key.</text>
</svg>
