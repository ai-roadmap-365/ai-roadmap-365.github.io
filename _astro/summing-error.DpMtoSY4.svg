<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Every addition rounds, and the roundings accumulate.">
  <title>Why a long sum drifts</title>
  <style>
    .summing-error-bg   { fill: #f8fafc; }
    .summing-error-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .summing-error-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .summing-error-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .summing-error-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .summing-error-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .summing-error-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .summing-error-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .summing-error-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .summing-error-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .summing-error-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .summing-error-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .summing-error-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .summing-error-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .summing-error-stage { opacity: 1; }

    .summing-error-s0 { animation-delay: 0.00s; }
    .summing-error-e0 { animation-delay: 0.00s; }
    .summing-error-s1 { animation-delay: 1.28s; }
    .summing-error-e1 { animation-delay: 1.28s; }
    .summing-error-s2 { animation-delay: 2.56s; }
    .summing-error-e2 { animation-delay: 2.56s; }
    .summing-error-s3 { animation-delay: 3.84s; }
    .summing-error-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .summing-error-conn  { animation: summing-error-trace 6.4s ease-in-out infinite; }
      .summing-error-stage { animation: summing-error-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes summing-error-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes summing-error-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .summing-error-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .summing-error-stage { animation: summing-error-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes summing-error-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="summing-error-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="summing-error-bg" width="980" height="322"/>
  <text class="summing-error-h1"  x="30" y="40">Why a long sum drifts</text>
  <text class="summing-error-sub" x="30" y="64">Every addition rounds, and the roundings accumulate.</text>
  <g class="summing-error-stage summing-error-s0">
    <rect class="summing-error-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="summing-error-step" x="44" y="142">01</text>
    <text class="summing-error-name" x="70" y="142">Each addition rounds</text>
    <text class="summing-error-desc" x="44" y="166">The exact result is rounded to</text>
    <text class="summing-error-desc" x="44" y="182">the nearest representable value.</text>
  </g>
  <line class="summing-error-line summing-error-conn summing-error-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#summing-error-tip)"/>
  <g class="summing-error-stage summing-error-s1">
    <rect class="summing-error-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="summing-error-step" x="280" y="142">02</text>
    <text class="summing-error-name" x="306" y="142">A million additions round a million times</text>
    <text class="summing-error-desc" x="280" y="166">Small errors, in the same</text>
    <text class="summing-error-desc" x="280" y="182">direction, adding up.</text>
    <text class="summing-error-edge" x="280" y="242">drift</text>
  </g>
  <line class="summing-error-line summing-error-conn summing-error-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#summing-error-tip)"/>
  <g class="summing-error-stage summing-error-s2">
    <rect class="summing-error-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="summing-error-step" x="516" y="142">03</text>
    <text class="summing-error-name" x="542" y="142">So order matters</text>
    <text class="summing-error-desc" x="516" y="166">(a+b)+c can differ from a+(b+c).</text>
    <text class="summing-error-desc" x="516" y="182">Float addition is not</text>
    <text class="summing-error-desc" x="516" y="198">associative.</text>
    <text class="summing-error-edge" x="516" y="242">not associative</text>
  </g>
  <line class="summing-error-line summing-error-conn summing-error-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#summing-error-tip)"/>
  <g class="summing-error-stage summing-error-s3">
    <rect class="summing-error-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="summing-error-step" x="752" y="142">04</text>
    <text class="summing-error-name" x="778" y="142">math.fsum tracks the lost bits</text>
    <text class="summing-error-desc" x="752" y="166">Compensated summation. One</text>
    <text class="summing-error-desc" x="752" y="182">import, exact result.</text>
    <text class="summing-error-edge" x="752" y="242">fsum</text>
  </g>
  <text class="summing-error-sub" x="30" y="304">sum([0.1] * 10) gives 0.9999999999999999 and math.fsum gives exactly 1.0, on the same input, in the same interpreter. The difference is entirely in how the roundings are handled.</text>
</svg>
