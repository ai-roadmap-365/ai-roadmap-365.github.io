<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are architecture, two are safety.">
  <title>Four things a custom client buys</title>
  <style>
    .client-benefits-bg   { fill: #f8fafc; }
    .client-benefits-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .client-benefits-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .client-benefits-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .client-benefits-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .client-benefits-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .client-benefits-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .client-benefits-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .client-benefits-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .client-benefits-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .client-benefits-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .client-benefits-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .client-benefits-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .client-benefits-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .client-benefits-stage { opacity: 1; }

    .client-benefits-s0 { animation-delay: 0.00s; }
    .client-benefits-e0 { animation-delay: 0.00s; }
    .client-benefits-s1 { animation-delay: 1.28s; }
    .client-benefits-e1 { animation-delay: 1.28s; }
    .client-benefits-s2 { animation-delay: 2.56s; }
    .client-benefits-e2 { animation-delay: 2.56s; }
    .client-benefits-s3 { animation-delay: 3.84s; }
    .client-benefits-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .client-benefits-conn  { animation: client-benefits-trace 6.4s ease-in-out infinite; }
      .client-benefits-stage { animation: client-benefits-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes client-benefits-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes client-benefits-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .client-benefits-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .client-benefits-stage { animation: client-benefits-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes client-benefits-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="client-benefits-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="client-benefits-bg" width="980" height="322"/>
  <text class="client-benefits-h1"  x="30" y="40">Four things a custom client buys</text>
  <text class="client-benefits-sub" x="30" y="64">Two are architecture, two are safety.</text>
  <g class="client-benefits-stage client-benefits-s0">
    <rect class="client-benefits-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="client-benefits-step" x="44" y="142">01</text>
    <text class="client-benefits-name" x="70" y="142">Decoupled infrastructure</text>
    <text class="client-benefits-desc" x="44" y="166">Patch a Postgres server without</text>
    <text class="client-benefits-desc" x="44" y="182">touching the agent's reasoning</text>
    <text class="client-benefits-desc" x="44" y="198">code.</text>
  </g>
  <line class="client-benefits-line client-benefits-conn client-benefits-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#client-benefits-tip)"/>
  <g class="client-benefits-stage client-benefits-s1">
    <rect class="client-benefits-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="client-benefits-step" x="280" y="142">02</text>
    <text class="client-benefits-name" x="306" y="142">Tools in any language</text>
    <text class="client-benefits-desc" x="280" y="166">A Python agent invoking</text>
    <text class="client-benefits-desc" x="280" y="182">TypeScript, Go or Rust servers,</text>
    <text class="client-benefits-desc" x="280" y="198">transparently.</text>
  </g>
  <line class="client-benefits-line client-benefits-conn client-benefits-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#client-benefits-tip)"/>
  <g class="client-benefits-stage client-benefits-s2">
    <rect class="client-benefits-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="client-benefits-step" x="516" y="142">03</text>
    <text class="client-benefits-name" x="542" y="142">A security firewall</text>
    <text class="client-benefits-desc" x="516" y="166">Every payload inspected, logged</text>
    <text class="client-benefits-desc" x="516" y="182">and gated before dispatch.</text>
  </g>
  <line class="client-benefits-line client-benefits-conn client-benefits-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#client-benefits-tip)"/>
  <g class="client-benefits-stage client-benefits-s3">
    <rect class="client-benefits-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="client-benefits-step" x="752" y="142">04</text>
    <text class="client-benefits-name" x="778" y="142">Capabilities added at run time</text>
    <text class="client-benefits-desc" x="752" y="166">A new server in a config file,</text>
    <text class="client-benefits-desc" x="752" y="182">no recompilation.</text>
  </g>
  <text class="client-benefits-sub" x="30" y="304">The third is the one worth building deliberately rather than acquiring incidentally: the approval gate and the audit log are much easier to add while the router is being written than afterwards.</text>
</svg>
