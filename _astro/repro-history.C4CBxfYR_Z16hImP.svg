<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Prompted by a crisis.">
  <title>Four steps toward reproducible research</title>
  <style>
    .repro-history-bg   { fill: #f8fafc; }
    .repro-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repro-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .repro-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .repro-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .repro-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .repro-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .repro-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .repro-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .repro-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .repro-history-stage { opacity: 1; }

    .repro-history-s0 { animation-delay: 0.00s; }
    .repro-history-e0 { animation-delay: 0.00s; }
    .repro-history-s1 { animation-delay: 1.28s; }
    .repro-history-e1 { animation-delay: 1.28s; }
    .repro-history-s2 { animation-delay: 2.56s; }
    .repro-history-e2 { animation-delay: 2.56s; }
    .repro-history-s3 { animation-delay: 3.84s; }
    .repro-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .repro-history-conn  { animation: repro-history-trace 6.4s ease-in-out infinite; }
      .repro-history-stage { animation: repro-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes repro-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes repro-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .repro-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .repro-history-stage { animation: repro-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes repro-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="repro-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="repro-history-bg" width="980" height="322"/>
  <text class="repro-history-h1"  x="30" y="40">Four steps toward reproducible research</text>
  <text class="repro-history-sub" x="30" y="64">Prompted by a crisis.</text>
  <g class="repro-history-stage repro-history-s0">
    <rect class="repro-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="repro-history-step" x="44" y="142">01</text>
    <text class="repro-history-name" x="70" y="142">Papers published without code</text>
    <text class="repro-history-desc" x="44" y="166">For most of the field's history.</text>
  </g>
  <line class="repro-history-line repro-history-conn repro-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#repro-history-tip)"/>
  <g class="repro-history-stage repro-history-s1">
    <rect class="repro-history-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="repro-history-step" x="280" y="142">02</text>
    <text class="repro-history-name" x="306" y="142">Then results that nobody could repeat</text>
    <text class="repro-history-desc" x="280" y="166">Including some widely built</text>
    <text class="repro-history-desc" x="280" y="182">upon.</text>
  </g>
  <line class="repro-history-line repro-history-conn repro-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#repro-history-tip)"/>
  <g class="repro-history-stage repro-history-s2">
    <rect class="repro-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="repro-history-step" x="516" y="142">03</text>
    <text class="repro-history-name" x="542" y="142">Checklists and artefact review at conferences</text>
    <text class="repro-history-desc" x="516" y="166">Which changed submission norms</text>
    <text class="repro-history-desc" x="516" y="182">quickly.</text>
  </g>
  <line class="repro-history-line repro-history-conn repro-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#repro-history-tip)"/>
  <g class="repro-history-stage repro-history-s3">
    <rect class="repro-history-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="repro-history-step" x="752" y="142">04</text>
    <text class="repro-history-name" x="778" y="142">And reproduction published as work in itself</text>
    <text class="repro-history-desc" x="752" y="166">With venues that exist for it.</text>
  </g>
  <text class="repro-history-sub" x="30" y="304">The speed of the shift is notable: artefact review went from unusual to expected within a few years, largely because a handful of failures were public and consequential.</text>
</svg>
