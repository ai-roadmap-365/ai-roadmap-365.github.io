<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From duplicated data.">
  <title>Four steps toward joins</title>
  <style>
    .join-history-bg   { fill: #f8fafc; }
    .join-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .join-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .join-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .join-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .join-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .join-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .join-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .join-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .join-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .join-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .join-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .join-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .join-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .join-history-stage { opacity: 1; }

    .join-history-s0 { animation-delay: 0.00s; }
    .join-history-e0 { animation-delay: 0.00s; }
    .join-history-s1 { animation-delay: 1.28s; }
    .join-history-e1 { animation-delay: 1.28s; }
    .join-history-s2 { animation-delay: 2.56s; }
    .join-history-e2 { animation-delay: 2.56s; }
    .join-history-s3 { animation-delay: 3.84s; }
    .join-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .join-history-conn  { animation: join-history-trace 6.4s ease-in-out infinite; }
      .join-history-stage { animation: join-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes join-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes join-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .join-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .join-history-stage { animation: join-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes join-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="join-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="join-history-bg" width="980" height="322"/>
  <text class="join-history-h1"  x="30" y="40">Four steps toward joins</text>
  <text class="join-history-sub" x="30" y="64">From duplicated data.</text>
  <g class="join-history-stage join-history-s0">
    <rect class="join-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="join-history-step" x="44" y="142">01</text>
    <text class="join-history-name" x="70" y="142">Data duplicated across records</text>
    <text class="join-history-desc" x="44" y="166">Which drifted out of step.</text>
  </g>
  <line class="join-history-line join-history-conn join-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#join-history-tip)"/>
  <g class="join-history-stage join-history-s1">
    <rect class="join-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="join-history-step" x="280" y="142">02</text>
    <text class="join-history-name" x="306" y="142">Then normalisation: store each fact once</text>
    <text class="join-history-desc" x="280" y="166">With references to it.</text>
  </g>
  <line class="join-history-line join-history-conn join-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#join-history-tip)"/>
  <g class="join-history-stage join-history-s2">
    <rect class="join-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="join-history-step" x="516" y="142">03</text>
    <text class="join-history-name" x="542" y="142">Which required an operation to recombine</text>
    <text class="join-history-desc" x="516" y="166">That is the join.</text>
  </g>
  <line class="join-history-line join-history-conn join-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#join-history-tip)"/>
  <g class="join-history-stage join-history-s3">
    <rect class="join-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="join-history-step" x="752" y="142">04</text>
    <text class="join-history-name" x="778" y="142">And optimisers learned several strategies for it</text>
    <text class="join-history-desc" x="752" y="166">Chosen per query, by data size.</text>
  </g>
  <text class="join-history-sub" x="30" y="304">Normalisation and joins are two halves of one idea: you may store each fact once precisely because you can reassemble the pieces on demand.</text>
</svg>
