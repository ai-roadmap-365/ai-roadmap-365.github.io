<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Multi-Tenant Token Cost Attribution Matrix">
  <title>Multi-Tenant Token Cost Attribution Matrix</title>
  <defs>
    <style>
      .d340b-bg { fill: #f8fafc; }
      .d340b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d340b-cst { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d340b-mrn { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d340b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d340b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d340b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d340b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d340b-bg" />
  
  <text x="40" y="40" class="d340a-title">Multi-Tenant Token Cost Attribution Breakdown</text>
  <text x="40" y="65" class="d340a-subtitle">Multi-Tenant Token Cost Attribution Matrix breaking down prompt token costs and completion token costs across distinct enterprise customer tenants with margin analytics</text>
  
  <!-- Cost Attribution Table -->
  <rect x="40" y="110" width="410" height="270" class="d340b-cst" />
  <text x="60" y="145" class="d340b-header" fill="#1d4ed8">Tenant Token Spending Ledger</text>
  <text x="60" y="180" class="d340b-text">• **Tenant A (Enterprise FinTech):**</text>
  <text x="60" y="200" class="d340b-text">  45M prompt tok ($112.50) + 10M comp ($100) = $212.50</text>
  <text x="60" y="230" class="d340b-text">• **Tenant B (HealthCare SaaS):**</text>
  <text x="60" y="250" class="d340b-text">  12M prompt tok ($30.00) + 4M comp ($40) = $70.00</text>
  <text x="60" y="280" class="d340b-text">• **Tenant C (Startup Free Tier):**</text>
  <text x="60" y="300" class="d340b-text">  500k prompt tok ($1.25) + 100k comp ($1) = $2.25</text>
  <text x="60" y="340" class="d340b-text" font-weight="600" fill="#1d4ed8">Granular Token Accounting</text>
  
  <!-- Margin Analytics -->
  <rect x="480" y="110" width="380" height="270" class="d340b-mrn" />
  <text x="500" y="145" class="d340b-header" fill="#7e22ce">Unit Economics &amp; Gross Margin</text>
  <text x="500" y="180" class="d340b-text">• **Customer Monthly Subscription:** $2,000 / mo</text>
  <text x="500" y="205" class="d340b-text">• **Attributed LLM Compute Cost:** $212.50 / mo</text>
  <text x="500" y="230" class="d340b-text">• **Gross Margin Percentage:** 89.38%</text>
  <text x="500" y="260" class="d340b-text">• **Automated Quota Alerts:**</text>
  <text x="500" y="280" class="d340b-text">  Alert customer when spend reaches 80% limit</text>
  <text x="500" y="340" class="d340b-text" font-weight="600" fill="#7e22ce">Sustainable SaaS Profitability</text>
</svg>