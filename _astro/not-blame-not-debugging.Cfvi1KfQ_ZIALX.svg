<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One cultural, one procedural.">
  <title>Two things it is never</title>
  <style>
    .not-blame-not-debugging-bg   { fill: #f8fafc; }
    .not-blame-not-debugging-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-blame-not-debugging-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-blame-not-debugging-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-blame-not-debugging-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-blame-not-debugging-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-blame-not-debugging-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-blame-not-debugging-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .not-blame-not-debugging-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .not-blame-not-debugging-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .not-blame-not-debugging-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .not-blame-not-debugging-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .not-blame-not-debugging-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-blame-not-debugging-row { opacity: 1; }
    .not-blame-not-debugging-r0 { animation-delay: 0.00s; }
    .not-blame-not-debugging-r1 { animation-delay: 0.45s; }
    .not-blame-not-debugging-r2 { animation-delay: 0.90s; }
    .not-blame-not-debugging-r3 { animation-delay: 1.35s; }
    .not-blame-not-debugging-r4 { animation-delay: 1.80s; }
    .not-blame-not-debugging-row { animation: not-blame-not-debugging-reveal 7.3s ease-in-out infinite; }
    @keyframes not-blame-not-debugging-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="not-blame-not-debugging-bg" width="980" height="390"/>
  <text class="not-blame-not-debugging-h1"  x="30" y="40">Two things it is never</text>
  <text class="not-blame-not-debugging-sub" x="30" y="64">One cultural, one procedural.</text>
  <rect class="not-blame-not-debugging-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="not-blame-not-debugging-name" x="46" y="122">What it is</text>
  <text class="not-blame-not-debugging-desc" x="46" y="142">Four practices.</text>
  <text class="not-blame-not-debugging-desc not-blame-not-debugging-row not-blame-not-debugging-r0" x="46" y="182">Mitigation before root cause</text>
  <text class="not-blame-not-debugging-desc not-blame-not-debugging-row not-blame-not-debugging-r1" x="46" y="216">Circuit breakers tripping within 500 ms</text>
  <text class="not-blame-not-debugging-desc not-blame-not-debugging-row not-blame-not-debugging-r2" x="46" y="250">A named incident commander</text>
  <text class="not-blame-not-debugging-desc not-blame-not-debugging-row not-blame-not-debugging-r3" x="46" y="284">Blameless five-whys analysis</text>
  <text class="not-blame-not-debugging-desc not-blame-not-debugging-row not-blame-not-debugging-r4" x="46" y="318">Action items with owners and dates</text>
  <rect class="not-blame-not-debugging-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="not-blame-not-debugging-name" x="526" y="122">What it is not</text>
  <text class="not-blame-not-debugging-desc" x="526" y="142">Two, both destructive.</text>
  <text class="not-blame-not-debugging-desc not-blame-not-debugging-row not-blame-not-debugging-r0" x="526" y="182">Blaming whoever deployed the revision</text>
  <text class="not-blame-not-debugging-desc not-blame-not-debugging-row not-blame-not-debugging-r1" x="526" y="216">Which buys silence, not safety</text>
  <text class="not-blame-not-debugging-desc not-blame-not-debugging-row not-blame-not-debugging-r2" x="526" y="250">Debugging in production during an outage</text>
  <text class="not-blame-not-debugging-desc not-blame-not-debugging-row not-blame-not-debugging-r3" x="526" y="284">While users receive 500s</text>
  <text class="not-blame-not-debugging-desc not-blame-not-debugging-row not-blame-not-debugging-r4" x="526" y="318">Neither shortens the incident</text>
  <text class="not-blame-not-debugging-sub" x="30" y="372">"If a human made a mistake, the root cause is that the system permitted it without a guard" is the operational form of blamelessness — it is a search rule, not a politeness convention.</text>
</svg>
