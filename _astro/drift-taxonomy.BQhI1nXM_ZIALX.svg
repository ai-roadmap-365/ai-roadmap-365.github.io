<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Different causes, different responses.">
  <title>Three kinds of drift</title>
  <style>
    .drift-taxonomy-bg   { fill: #f8fafc; }
    .drift-taxonomy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drift-taxonomy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drift-taxonomy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drift-taxonomy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drift-taxonomy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drift-taxonomy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .drift-taxonomy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .drift-taxonomy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .drift-taxonomy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .drift-taxonomy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .drift-taxonomy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .drift-taxonomy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .drift-taxonomy-row { opacity: 1; }
    .drift-taxonomy-r0 { animation-delay: 0.00s; }
    .drift-taxonomy-r1 { animation-delay: 0.45s; }
    .drift-taxonomy-r2 { animation-delay: 0.90s; }
    .drift-taxonomy-r3 { animation-delay: 1.35s; }
    .drift-taxonomy-r4 { animation-delay: 1.80s; }
    .drift-taxonomy-row { animation: drift-taxonomy-reveal 7.3s ease-in-out infinite; }
    @keyframes drift-taxonomy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="drift-taxonomy-bg" width="980" height="390"/>
  <text class="drift-taxonomy-h1"  x="30" y="40">Three kinds of drift</text>
  <text class="drift-taxonomy-sub" x="30" y="64">Different causes, different responses.</text>
  <rect class="drift-taxonomy-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="drift-taxonomy-name" x="46" y="122">The drift</text>
  <text class="drift-taxonomy-desc" x="46" y="142">What changed.</text>
  <text class="drift-taxonomy-desc drift-taxonomy-row drift-taxonomy-r0" x="46" y="182">Data drift — the input distribution moved</text>
  <text class="drift-taxonomy-desc drift-taxonomy-row drift-taxonomy-r1" x="46" y="216">Concept drift — the relationship moved</text>
  <text class="drift-taxonomy-desc drift-taxonomy-row drift-taxonomy-r2" x="46" y="250">Label drift — the outcome rate moved</text>
  <text class="drift-taxonomy-desc drift-taxonomy-row drift-taxonomy-r3" x="46" y="284">Upstream drift — a feature pipeline changed</text>
  <text class="drift-taxonomy-desc drift-taxonomy-row drift-taxonomy-r4" x="46" y="318">Sudden, gradual or recurring in each case</text>
  <rect class="drift-taxonomy-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="drift-taxonomy-name" x="526" y="122">The response</text>
  <text class="drift-taxonomy-desc" x="526" y="142">What to do.</text>
  <text class="drift-taxonomy-desc drift-taxonomy-row drift-taxonomy-r0" x="526" y="182">Often benign; investigate before acting</text>
  <text class="drift-taxonomy-desc drift-taxonomy-row drift-taxonomy-r1" x="526" y="216">Retraining is required</text>
  <text class="drift-taxonomy-desc drift-taxonomy-row drift-taxonomy-r2" x="526" y="250">Recalibrate the threshold</text>
  <text class="drift-taxonomy-desc drift-taxonomy-row drift-taxonomy-r3" x="526" y="284">Fix the pipeline, not the model</text>
  <text class="drift-taxonomy-desc drift-taxonomy-row drift-taxonomy-r4" x="526" y="318">Recurring drift needs a seasonal model, not retraining</text>
  <text class="drift-taxonomy-sub" x="30" y="372">Distinguishing an upstream pipeline change from genuine drift is the first diagnostic step, because retraining on corrupted features makes the model worse.</text>
</svg>
