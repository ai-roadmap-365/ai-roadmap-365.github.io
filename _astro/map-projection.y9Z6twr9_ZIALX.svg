<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Something is always distorted.">
  <title>A map projection</title>
  <style>
    .map-projection-bg   { fill: #f8fafc; }
    .map-projection-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-projection-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-projection-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-projection-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-projection-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .map-projection-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .map-projection-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .map-projection-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .map-projection-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .map-projection-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .map-projection-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .map-projection-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .map-projection-row { opacity: 1; }
    .map-projection-r0 { animation-delay: 0.00s; }
    .map-projection-r1 { animation-delay: 0.45s; }
    .map-projection-r2 { animation-delay: 0.90s; }
    .map-projection-r3 { animation-delay: 1.35s; }
    .map-projection-r4 { animation-delay: 1.80s; }
    .map-projection-row { animation: map-projection-reveal 7.3s ease-in-out infinite; }
    @keyframes map-projection-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="map-projection-bg" width="980" height="390"/>
  <text class="map-projection-h1"  x="30" y="40">A map projection</text>
  <text class="map-projection-sub" x="30" y="64">Something is always distorted.</text>
  <rect class="map-projection-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="map-projection-name" x="46" y="122">The globe</text>
  <text class="map-projection-desc" x="46" y="142">Everything correct.</text>
  <text class="map-projection-desc map-projection-row map-projection-r0" x="46" y="182">Distances, areas and angles all true</text>
  <text class="map-projection-desc map-projection-row map-projection-r1" x="46" y="216">Cannot be laid flat</text>
  <text class="map-projection-desc map-projection-row map-projection-r2" x="46" y="250">Hard to read at a glance</text>
  <text class="map-projection-desc map-projection-row map-projection-r3" x="46" y="284">Nothing distorted</text>
  <text class="map-projection-desc map-projection-row map-projection-r4" x="46" y="318">This is the original space</text>
  <rect class="map-projection-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="map-projection-name" x="526" y="122">The flat map</text>
  <text class="map-projection-desc" x="526" y="142">Something distorted.</text>
  <text class="map-projection-desc map-projection-row map-projection-r0" x="526" y="182">Some property must be sacrificed</text>
  <text class="map-projection-desc map-projection-row map-projection-r1" x="526" y="216">Areas or angles, never both</text>
  <text class="map-projection-desc map-projection-row map-projection-r2" x="526" y="250">Easy to read</text>
  <text class="map-projection-desc map-projection-row map-projection-r3" x="526" y="284">Greenland looks enormous</text>
  <text class="map-projection-desc map-projection-row map-projection-r4" x="526" y="318">This is a two-dimensional embedding</text>
  <text class="map-projection-sub" x="30" y="372">Cartographers have always known which property their projection sacrifices, and read these plots the same way: know what has been distorted before drawing conclusions.</text>
</svg>
