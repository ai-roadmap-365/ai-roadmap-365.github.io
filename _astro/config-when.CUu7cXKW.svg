<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Reuse decides.">
  <title>When to configure, and how much</title>
  <style>
    .config-when-bg   { fill: #f8fafc; }
    .config-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .config-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .config-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .config-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .config-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .config-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .config-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .config-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .config-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .config-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .config-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .config-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .config-when-row { opacity: 1; }
    .config-when-r0 { animation-delay: 0.00s; }
    .config-when-r1 { animation-delay: 0.45s; }
    .config-when-r2 { animation-delay: 0.90s; }
    .config-when-r3 { animation-delay: 1.35s; }
    .config-when-r4 { animation-delay: 1.80s; }
    .config-when-row { animation: config-when-reveal 7.3s ease-in-out infinite; }
    @keyframes config-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="config-when-bg" width="980" height="390"/>
  <text class="config-when-h1"  x="30" y="40">When to configure, and how much</text>
  <text class="config-when-sub" x="30" y="64">Reuse decides.</text>
  <rect class="config-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="config-when-name" x="46" y="122">Author them</text>
  <text class="config-when-desc" x="46" y="142">Shared and repeated.</text>
  <text class="config-when-desc config-when-row config-when-r0" x="46" y="182">Organisational standards across repositories</text>
  <text class="config-when-desc config-when-row config-when-r1" x="46" y="216">Multi-step workflows with verified scripts</text>
  <text class="config-when-desc config-when-row config-when-r2" x="46" y="250">Migrations, deployments, SDK generation</text>
  <text class="config-when-desc config-when-row config-when-r3" x="46" y="284">Anything you have explained twice</text>
  <text class="config-when-desc config-when-row config-when-r4" x="46" y="318">Anything an incident taught you</text>
  <rect class="config-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="config-when-name" x="526" y="122">Never put in them</text>
  <text class="config-when-desc" x="526" y="142">Two hard limits.</text>
  <text class="config-when-desc config-when-row config-when-r0" x="526" y="182">Secrets, keys or credentials</text>
  <text class="config-when-desc config-when-row config-when-r1" x="526" y="216">A 50,000-word novel in the root</text>
  <text class="config-when-desc config-when-row config-when-r2" x="526" y="250">Skills for one-off scripts</text>
  <text class="config-when-desc config-when-row config-when-r3" x="526" y="284">Untrusted third-party skills, unread</text>
  <text class="config-when-desc config-when-row config-when-r4" x="526" y="318">Their scripts run with your privileges</text>
  <text class="config-when-sub" x="30" y="372">"Anything you have explained twice" is the practical trigger for writing a rule, and it is usually the same set of things a new colleague would need in their first week.</text>
</svg>
