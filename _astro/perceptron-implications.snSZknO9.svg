<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Cheap, interpretable, and limited.">
  <title>Three properties worth knowing</title>
  <style>
    .perceptron-implications-bg   { fill: #f8fafc; }
    .perceptron-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .perceptron-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .perceptron-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .perceptron-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .perceptron-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .perceptron-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .perceptron-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .perceptron-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .perceptron-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .perceptron-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .perceptron-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .perceptron-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .perceptron-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .perceptron-implications-stage { opacity: 1; }

    .perceptron-implications-s0 { animation-delay: 0.00s; }
    .perceptron-implications-e0 { animation-delay: 0.00s; }
    .perceptron-implications-s1 { animation-delay: 1.50s; }
    .perceptron-implications-e1 { animation-delay: 1.50s; }
    .perceptron-implications-s2 { animation-delay: 3.00s; }
    .perceptron-implications-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .perceptron-implications-conn  { animation: perceptron-implications-trace 6s ease-in-out infinite; }
      .perceptron-implications-stage { animation: perceptron-implications-arrive 6s ease-in-out infinite; }
    }
    @keyframes perceptron-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes perceptron-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .perceptron-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .perceptron-implications-stage { animation: perceptron-implications-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes perceptron-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="perceptron-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="perceptron-implications-bg" width="980" height="322"/>
  <text class="perceptron-implications-h1"  x="30" y="40">Three properties worth knowing</text>
  <text class="perceptron-implications-sub" x="30" y="64">Cheap, interpretable, and limited.</text>
  <g class="perceptron-implications-stage perceptron-implications-s0">
    <rect class="perceptron-implications-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="perceptron-implications-step" x="44" y="142">01</text>
    <text class="perceptron-implications-name" x="70" y="142">Extremely cheap</text>
    <text class="perceptron-implications-desc" x="44" y="166">One dot product per prediction. Trains in</text>
    <text class="perceptron-implications-desc" x="44" y="182">milliseconds on small data.</text>
  </g>
  <line class="perceptron-implications-line perceptron-implications-conn perceptron-implications-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#perceptron-implications-tip)"/>
  <g class="perceptron-implications-stage perceptron-implications-s1">
    <rect class="perceptron-implications-good" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="perceptron-implications-step" x="359" y="142">02</text>
    <text class="perceptron-implications-name" x="385" y="142">Fully interpretable</text>
    <text class="perceptron-implications-desc" x="359" y="166">The weights are the model. Each one is a</text>
    <text class="perceptron-implications-desc" x="359" y="182">feature's contribution.</text>
  </g>
  <line class="perceptron-implications-line perceptron-implications-conn perceptron-implications-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#perceptron-implications-tip)"/>
  <g class="perceptron-implications-stage perceptron-implications-s2">
    <rect class="perceptron-implications-warn" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="perceptron-implications-step" x="674" y="142">03</text>
    <text class="perceptron-implications-name" x="700" y="142">And sharply limited</text>
    <text class="perceptron-implications-desc" x="674" y="166">One hyperplane. Any non-linear structure is</text>
    <text class="perceptron-implications-desc" x="674" y="182">out of reach.</text>
  </g>
  <text class="perceptron-implications-sub" x="30" y="304">The interpretability is genuine and rarely useful in isolation: a model you can read completely and that cannot express your problem is not a trade worth making.</text>
</svg>
