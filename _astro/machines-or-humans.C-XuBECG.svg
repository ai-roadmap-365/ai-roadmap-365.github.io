<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Attention is the scarce resource. Spend it on judgement.">
  <title>What to automate, and what to ask a person</title>
  <style>
    .machines-or-humans-bg   { fill: #f8fafc; }
    .machines-or-humans-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .machines-or-humans-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .machines-or-humans-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .machines-or-humans-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .machines-or-humans-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .machines-or-humans-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .machines-or-humans-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .machines-or-humans-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .machines-or-humans-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .machines-or-humans-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .machines-or-humans-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .machines-or-humans-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .machines-or-humans-row { opacity: 1; }
    .machines-or-humans-r0 { animation-delay: 0.00s; }
    .machines-or-humans-r1 { animation-delay: 0.45s; }
    .machines-or-humans-r2 { animation-delay: 0.90s; }
    .machines-or-humans-r3 { animation-delay: 1.35s; }
    .machines-or-humans-r4 { animation-delay: 1.80s; }
    .machines-or-humans-row { animation: machines-or-humans-reveal 7.3s ease-in-out infinite; }
    @keyframes machines-or-humans-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="machines-or-humans-bg" width="980" height="390"/>
  <text class="machines-or-humans-h1"  x="30" y="40">What to automate, and what to ask a person</text>
  <text class="machines-or-humans-sub" x="30" y="64">Attention is the scarce resource. Spend it on judgement.</text>
  <rect class="machines-or-humans-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="machines-or-humans-name" x="46" y="122">Give to a machine</text>
  <text class="machines-or-humans-desc" x="46" y="142">Fast, tireless, never rude.</text>
  <text class="machines-or-humans-desc machines-or-humans-row machines-or-humans-r0" x="46" y="182">Formatting and style</text>
  <text class="machines-or-humans-desc machines-or-humans-row machines-or-humans-r1" x="46" y="216">Lint rules and unused imports</text>
  <text class="machines-or-humans-desc machines-or-humans-row machines-or-humans-r2" x="46" y="250">Type errors</text>
  <text class="machines-or-humans-desc machines-or-humans-row machines-or-humans-r3" x="46" y="284">Whether the tests pass</text>
  <text class="machines-or-humans-desc machines-or-humans-row machines-or-humans-r4" x="46" y="318">Whether coverage dropped</text>
  <rect class="machines-or-humans-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="machines-or-humans-name" x="526" y="122">Ask a person</text>
  <text class="machines-or-humans-desc" x="526" y="142">Judgement, not rules.</text>
  <text class="machines-or-humans-desc machines-or-humans-row machines-or-humans-r0" x="526" y="182">Is this the right change to make?</text>
  <text class="machines-or-humans-desc machines-or-humans-row machines-or-humans-r1" x="526" y="216">Will anyone understand it in a year?</text>
  <text class="machines-or-humans-desc machines-or-humans-row machines-or-humans-r2" x="526" y="250">What happens at the boundaries?</text>
  <text class="machines-or-humans-desc machines-or-humans-row machines-or-humans-r3" x="526" y="284">Does it match how the rest works?</text>
  <text class="machines-or-humans-desc machines-or-humans-row machines-or-humans-r4" x="526" y="318">Is there a simpler approach?</text>
  <text class="machines-or-humans-sub" x="30" y="372">A reviewer spending attention on a missing semicolon is attention not spent on the design. Automate everything a rule can express, so review is only ever about the things that need thought.</text>
</svg>
