<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One of them is continuous work.">
  <title>Four consequences of taking this seriously</title>
  <style>
    .threat-implications-bg   { fill: #f8fafc; }
    .threat-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .threat-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .threat-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .threat-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .threat-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .threat-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .threat-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .threat-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .threat-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .threat-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .threat-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .threat-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .threat-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .threat-implications-stage { opacity: 1; }

    .threat-implications-s0 { animation-delay: 0.00s; }
    .threat-implications-e0 { animation-delay: 0.00s; }
    .threat-implications-s1 { animation-delay: 1.28s; }
    .threat-implications-e1 { animation-delay: 1.28s; }
    .threat-implications-s2 { animation-delay: 2.56s; }
    .threat-implications-e2 { animation-delay: 2.56s; }
    .threat-implications-s3 { animation-delay: 3.84s; }
    .threat-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .threat-implications-conn  { animation: threat-implications-trace 6.4s ease-in-out infinite; }
      .threat-implications-stage { animation: threat-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes threat-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes threat-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .threat-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .threat-implications-stage { animation: threat-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes threat-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="threat-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="threat-implications-bg" width="980" height="322"/>
  <text class="threat-implications-h1"  x="30" y="40">Four consequences of taking this seriously</text>
  <text class="threat-implications-sub" x="30" y="64">One of them is continuous work.</text>
  <g class="threat-implications-stage threat-implications-s0">
    <rect class="threat-implications-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="threat-implications-step" x="44" y="142">01</text>
    <text class="threat-implications-name" x="70" y="142">Tools get parameterised, least-privilege APIs</text>
    <text class="threat-implications-desc" x="44" y="166">The model supplies values; it</text>
    <text class="threat-implications-desc" x="44" y="182">never composes the statement.</text>
  </g>
  <line class="threat-implications-line threat-implications-conn threat-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#threat-implications-tip)"/>
  <g class="threat-implications-stage threat-implications-s1">
    <rect class="threat-implications-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="threat-implications-step" x="280" y="142">02</text>
    <text class="threat-implications-name" x="306" y="142">The model is a living document</text>
    <text class="threat-implications-desc" x="280" y="166">A new tool or data source means</text>
    <text class="threat-implications-desc" x="280" y="182">re-running it.</text>
    <text class="threat-implications-edge" x="280" y="242">continuous</text>
  </g>
  <line class="threat-implications-line threat-implications-conn threat-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#threat-implications-tip)"/>
  <g class="threat-implications-stage threat-implications-s2">
    <rect class="threat-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="threat-implications-step" x="516" y="142">03</text>
    <text class="threat-implications-name" x="542" y="142">Defence has a measurable price</text>
    <text class="threat-implications-desc" x="516" y="166">80 ms and double ingestion</text>
    <text class="threat-implications-desc" x="516" y="182">tokens for quarantine.</text>
    <text class="threat-implications-edge" x="516" y="242">money</text>
  </g>
  <line class="threat-implications-line threat-implications-conn threat-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#threat-implications-tip)"/>
  <g class="threat-implications-stage threat-implications-s3">
    <rect class="threat-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="threat-implications-step" x="752" y="142">04</text>
    <text class="threat-implications-name" x="778" y="142">High and critical go into the sprint</text>
    <text class="threat-implications-desc" x="752" y="166">Before general availability,</text>
    <text class="threat-implications-desc" x="752" y="182">with owners.</text>
    <text class="threat-implications-edge" x="752" y="242">tracked</text>
  </g>
  <text class="threat-implications-sub" x="30" y="304">The fourth is what stops the exercise being documentation: a threat model whose findings do not enter the same backlog as feature work is a description of risks nobody is scheduled to remove.</text>
</svg>
