<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="MCP Tool Execution and Error Propagation">
  <title>MCP Tool Execution and Error Propagation</title>
  <defs>
    <style>
      .d297f-bg { fill: #f8fafc; }
      .d297f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d297f-step { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d297f-succ { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d297f-err { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; rx: 8px; }
      .d297f-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d297f-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d297f-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d297f-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
      .d297f-flow { stroke: #64748b; stroke-width: 2px; stroke-dasharray: 4,4; fill: none; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d297f-bg" />
  
  <text x="40" y="40" class="d297f-title">MCP Tool Execution &amp; Error Propagation</text>
  <text x="40" y="65" class="d297f-subtitle">MCP Tool Execution and Error Propagation flowchart illustrating argument validation, execution sandbox, isError flag handling, and client response formatting</text>
  
  <!-- Step 1: Input -->
  <rect x="40" y="110" width="170" height="120" class="d297f-step" />
  <text x="55" y="140" class="d297f-header" fill="#1d4ed8">1. tools/call Request</text>
  <text x="55" y="165" class="d297f-text">• JSON-RPC 2.0</text>
  <text x="55" y="185" class="d297f-text">• Tool Name</text>
  <text x="55" y="205" class="d297f-text">• Arguments map</text>
  
  <!-- Step 2: Validation -->
  <rect x="250" y="110" width="180" height="120" class="d297f-card" />
  <text x="265" y="140" class="d297f-header">2. Schema Validate</text>
  <text x="265" y="165" class="d297f-text">• Type checking</text>
  <text x="265" y="185" class="d297f-text">• Required field check</text>
  <text x="265" y="205" class="d297f-text">• Pydantic coercion</text>
  
  <!-- Step 3: Branching -->
  <rect x="470" y="100" width="180" height="100" class="d297f-succ" />
  <text x="485" y="130" class="d297f-header" fill="#15803d">3a. Success Path</text>
  <text x="485" y="150" class="d297f-text">• Execute python fn</text>
  <text x="485" y="170" class="d297f-text">• isError: false</text>
  
  <rect x="470" y="220" width="180" height="100" class="d297f-err" />
  <text x="485" y="250" class="d297f-header" fill="#dc2626">3b. Error Caught</text>
  <text x="485" y="270" class="d297f-text">• Catch exception</text>
  <text x="485" y="290" class="d297f-text">• isError: true</text>
  
  <!-- Step 4: Formatted Response -->
  <rect x="690" y="110" width="170" height="210" class="d297f-step" />
  <text x="705" y="140" class="d297f-header" fill="#1d4ed8">4. Response Emission</text>
  <text x="705" y="170" class="d297f-text">• content: [{"type": "text"}]</text>
  <text x="705" y="200" class="d297f-text">• Formatted text/data</text>
  <text x="705" y="230" class="d297f-text">• Model inspects error</text>
  <text x="705" y="250" class="d297f-text">  and self-corrects!</text>
</svg>