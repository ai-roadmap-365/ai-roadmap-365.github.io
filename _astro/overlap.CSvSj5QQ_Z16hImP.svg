<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Why chunks overlap</title>
  <style>
    .overlap-bg   { fill: #f8fafc; }
    .overlap-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .overlap-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .overlap-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .overlap-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .overlap-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .overlap-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .overlap-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .overlap-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .overlap-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .overlap-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .overlap-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .overlap-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .overlap-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .overlap-stage { opacity: 1; }

    .overlap-s0 { animation-delay: 0.00s; }
    .overlap-e0 { animation-delay: 0.00s; }
    .overlap-s1 { animation-delay: 1.28s; }
    .overlap-e1 { animation-delay: 1.28s; }
    .overlap-s2 { animation-delay: 2.56s; }
    .overlap-e2 { animation-delay: 2.56s; }
    .overlap-s3 { animation-delay: 3.84s; }
    .overlap-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .overlap-conn  { animation: overlap-trace 6.4s ease-in-out infinite; }
      .overlap-stage { animation: overlap-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes overlap-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes overlap-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .overlap-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .overlap-stage { animation: overlap-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes overlap-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="overlap-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="overlap-bg" width="980" height="322"/>
  <text class="overlap-h1"  x="30" y="40">Why chunks overlap</text>
  <text class="overlap-sub" x="30" y="64">Four steps.</text>
  <g class="overlap-stage overlap-s0">
    <rect class="overlap-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="overlap-step" x="44" y="142">01</text>
    <text class="overlap-name" x="70" y="142">An answer can straddle a boundary</text>
    <text class="overlap-desc" x="44" y="166">Half in one chunk, half in the</text>
    <text class="overlap-desc" x="44" y="182">next. Neither matches.</text>
  </g>
  <line class="overlap-line overlap-conn overlap-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#overlap-tip)"/>
  <g class="overlap-stage overlap-s1">
    <rect class="overlap-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="overlap-step" x="280" y="142">02</text>
    <text class="overlap-name" x="306" y="142">So let consecutive chunks share text</text>
    <text class="overlap-desc" x="280" y="166">Typically ten to twenty percent.</text>
  </g>
  <line class="overlap-line overlap-conn overlap-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#overlap-tip)"/>
  <g class="overlap-stage overlap-s2">
    <rect class="overlap-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="overlap-step" x="516" y="142">03</text>
    <text class="overlap-name" x="542" y="142">Which means the straddling passage appears whole somewhere</text>
    <text class="overlap-desc" x="516" y="166">In at least one chunk.</text>
  </g>
  <line class="overlap-line overlap-conn overlap-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#overlap-tip)"/>
  <g class="overlap-stage overlap-s3">
    <rect class="overlap-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="overlap-step" x="752" y="142">04</text>
    <text class="overlap-name" x="778" y="142">At the cost of storage and duplicate results</text>
    <text class="overlap-desc" x="752" y="166">Which deduplication after</text>
    <text class="overlap-desc" x="752" y="182">retrieval handles.</text>
    <text class="overlap-edge" x="752" y="242">10-20%</text>
  </g>
  <text class="overlap-sub" x="30" y="304">Deduplicating results is the step that is easy to forget: without it, overlap causes the same passage to occupy several of the top slots.</text>
</svg>
