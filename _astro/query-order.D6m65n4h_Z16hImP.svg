<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The order the engine actually applies</title>
  <style>
    .query-order-bg   { fill: #f8fafc; }
    .query-order-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .query-order-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .query-order-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .query-order-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .query-order-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .query-order-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .query-order-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .query-order-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .query-order-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .query-order-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .query-order-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .query-order-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .query-order-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .query-order-stage { opacity: 1; }

    .query-order-s0 { animation-delay: 0.00s; }
    .query-order-e0 { animation-delay: 0.00s; }
    .query-order-s1 { animation-delay: 1.28s; }
    .query-order-e1 { animation-delay: 1.28s; }
    .query-order-s2 { animation-delay: 2.56s; }
    .query-order-e2 { animation-delay: 2.56s; }
    .query-order-s3 { animation-delay: 3.84s; }
    .query-order-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .query-order-conn  { animation: query-order-trace 6.4s ease-in-out infinite; }
      .query-order-stage { animation: query-order-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes query-order-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes query-order-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .query-order-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .query-order-stage { animation: query-order-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes query-order-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="query-order-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="query-order-bg" width="980" height="322"/>
  <text class="query-order-h1"  x="30" y="40">The order the engine actually applies</text>
  <text class="query-order-sub" x="30" y="64">Four steps.</text>
  <g class="query-order-stage query-order-s0">
    <rect class="query-order-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="query-order-step" x="44" y="142">01</text>
    <text class="query-order-name" x="70" y="142">First, the source rows are read</text>
    <text class="query-order-desc" x="44" y="166">Possibly using an index.</text>
  </g>
  <line class="query-order-line query-order-conn query-order-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#query-order-tip)"/>
  <g class="query-order-stage query-order-s1">
    <rect class="query-order-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="query-order-step" x="280" y="142">02</text>
    <text class="query-order-name" x="306" y="142">Then rows are filtered individually</text>
    <text class="query-order-desc" x="280" y="166">Before any grouping happens.</text>
  </g>
  <line class="query-order-line query-order-conn query-order-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#query-order-tip)"/>
  <g class="query-order-stage query-order-s2">
    <rect class="query-order-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="query-order-step" x="516" y="142">03</text>
    <text class="query-order-name" x="542" y="142">Then surviving rows are grouped and summarised</text>
    <text class="query-order-desc" x="516" y="166">Producing one row per group.</text>
  </g>
  <line class="query-order-line query-order-conn query-order-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#query-order-tip)"/>
  <g class="query-order-stage query-order-s3">
    <rect class="query-order-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="query-order-step" x="752" y="142">04</text>
    <text class="query-order-name" x="778" y="142">And only then can groups be filtered</text>
    <text class="query-order-desc" x="752" y="166">Which needs a different clause.</text>
  </g>
  <text class="query-order-sub" x="30" y="304">This is why filtering on an aggregate in the row filter fails: at that point the aggregate does not exist yet, because grouping has not happened.</text>
</svg>
