<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Write the boundary down before you start.">
  <title>Scope creep has a shape, and a defence</title>
  <style>
    .smart-boundaries-bg   { fill: #f8fafc; }
    .smart-boundaries-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .smart-boundaries-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .smart-boundaries-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .smart-boundaries-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .smart-boundaries-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .smart-boundaries-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .smart-boundaries-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .smart-boundaries-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .smart-boundaries-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .smart-boundaries-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .smart-boundaries-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .smart-boundaries-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .smart-boundaries-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .smart-boundaries-stage { opacity: 1; }

    .smart-boundaries-s0 { animation-delay: 0.00s; }
    .smart-boundaries-e0 { animation-delay: 0.00s; }
    .smart-boundaries-s1 { animation-delay: 1.28s; }
    .smart-boundaries-e1 { animation-delay: 1.28s; }
    .smart-boundaries-s2 { animation-delay: 2.56s; }
    .smart-boundaries-e2 { animation-delay: 2.56s; }
    .smart-boundaries-s3 { animation-delay: 3.84s; }
    .smart-boundaries-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .smart-boundaries-conn  { animation: smart-boundaries-trace 6.4s ease-in-out infinite; }
      .smart-boundaries-stage { animation: smart-boundaries-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes smart-boundaries-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes smart-boundaries-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .smart-boundaries-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .smart-boundaries-stage { animation: smart-boundaries-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes smart-boundaries-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="smart-boundaries-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="smart-boundaries-bg" width="980" height="322"/>
  <text class="smart-boundaries-h1"  x="30" y="40">Scope creep has a shape, and a defence</text>
  <text class="smart-boundaries-sub" x="30" y="64">Write the boundary down before you start.</text>
  <g class="smart-boundaries-stage smart-boundaries-s0">
    <rect class="smart-boundaries-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="smart-boundaries-step" x="44" y="142">01</text>
    <text class="smart-boundaries-name" x="70" y="142">Start with a clear idea</text>
    <text class="smart-boundaries-desc" x="44" y="166">One problem, one user, one</text>
    <text class="smart-boundaries-desc" x="44" y="182">outcome. Everyone agrees.</text>
  </g>
  <line class="smart-boundaries-line smart-boundaries-conn smart-boundaries-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#smart-boundaries-tip)"/>
  <g class="smart-boundaries-stage smart-boundaries-s1">
    <rect class="smart-boundaries-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="smart-boundaries-step" x="280" y="142">02</text>
    <text class="smart-boundaries-name" x="306" y="142">An adjacent idea appears</text>
    <text class="smart-boundaries-desc" x="280" y="166">"While we are here, it should</text>
    <text class="smart-boundaries-desc" x="280" y="182">also..." Each addition is</text>
    <text class="smart-boundaries-desc" x="280" y="198">individually reasonable.</text>
  </g>
  <line class="smart-boundaries-line smart-boundaries-conn smart-boundaries-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#smart-boundaries-tip)"/>
  <g class="smart-boundaries-stage smart-boundaries-s2">
    <rect class="smart-boundaries-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="smart-boundaries-step" x="516" y="142">03</text>
    <text class="smart-boundaries-name" x="542" y="142">The finish line moves</text>
    <text class="smart-boundaries-desc" x="516" y="166">Nothing is ever done, because</text>
    <text class="smart-boundaries-desc" x="516" y="182">done was never written down.</text>
    <text class="smart-boundaries-edge" x="516" y="242">never ships</text>
  </g>
  <line class="smart-boundaries-line smart-boundaries-conn smart-boundaries-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#smart-boundaries-tip)"/>
  <g class="smart-boundaries-stage smart-boundaries-s3">
    <rect class="smart-boundaries-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="smart-boundaries-step" x="752" y="142">04</text>
    <text class="smart-boundaries-name" x="778" y="142">A written boundary refuses it</text>
    <text class="smart-boundaries-desc" x="752" y="166">Specific, measurable,</text>
    <text class="smart-boundaries-desc" x="752" y="182">time-boxed. New ideas go on a</text>
    <text class="smart-boundaries-desc" x="752" y="198">list for later.</text>
    <text class="smart-boundaries-edge" x="752" y="242">shipped</text>
  </g>
  <text class="smart-boundaries-sub" x="30" y="304">The defence is not discipline in the moment, which fails when the idea is genuinely good. It is a written definition of done that a later idea has to argue against, rather than simply be added to.</text>
</svg>
