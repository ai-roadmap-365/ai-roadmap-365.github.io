<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Ingredients in, dish out.">
  <title>A named recipe</title>
  <style>
    .recipe-function-bg   { fill: #f8fafc; }
    .recipe-function-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recipe-function-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recipe-function-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recipe-function-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recipe-function-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recipe-function-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .recipe-function-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .recipe-function-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .recipe-function-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .recipe-function-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .recipe-function-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .recipe-function-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .recipe-function-row { opacity: 1; }
    .recipe-function-r0 { animation-delay: 0.00s; }
    .recipe-function-r1 { animation-delay: 0.45s; }
    .recipe-function-r2 { animation-delay: 0.90s; }
    .recipe-function-r3 { animation-delay: 1.35s; }
    .recipe-function-r4 { animation-delay: 1.80s; }
    .recipe-function-row { animation: recipe-function-reveal 7.3s ease-in-out infinite; }
    @keyframes recipe-function-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="recipe-function-bg" width="980" height="390"/>
  <text class="recipe-function-h1"  x="30" y="40">A named recipe</text>
  <text class="recipe-function-sub" x="30" y="64">Ingredients in, dish out.</text>
  <rect class="recipe-function-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="recipe-function-name" x="46" y="122">Repeated instructions</text>
  <text class="recipe-function-desc" x="46" y="142">Written out each time.</text>
  <text class="recipe-function-desc recipe-function-row recipe-function-r0" x="46" y="182">The same steps rewritten wherever needed</text>
  <text class="recipe-function-desc recipe-function-row recipe-function-r1" x="46" y="216">A correction must be made everywhere</text>
  <text class="recipe-function-desc recipe-function-row recipe-function-r2" x="46" y="250">No name to refer to it by</text>
  <text class="recipe-function-desc recipe-function-row recipe-function-r3" x="46" y="284">Variations drift apart</text>
  <text class="recipe-function-desc recipe-function-row recipe-function-r4" x="46" y="318">This is duplicated code</text>
  <rect class="recipe-function-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="recipe-function-name" x="526" y="122">A named recipe</text>
  <text class="recipe-function-desc" x="526" y="142">Written once.</text>
  <text class="recipe-function-desc recipe-function-row recipe-function-r0" x="526" y="182">Steps written once, referred to by name</text>
  <text class="recipe-function-desc recipe-function-row recipe-function-r1" x="526" y="216">A correction is made in one place</text>
  <text class="recipe-function-desc recipe-function-row recipe-function-r2" x="526" y="250">The name communicates the intent</text>
  <text class="recipe-function-desc recipe-function-row recipe-function-r3" x="526" y="284">Variations are parameters</text>
  <text class="recipe-function-desc recipe-function-row recipe-function-r4" x="526" y="318">This is a function</text>
  <text class="recipe-function-sub" x="30" y="372">The correction row is the practical argument: duplicated logic is not merely longer, it is logic that will be fixed in some places and not others.</text>
</svg>
