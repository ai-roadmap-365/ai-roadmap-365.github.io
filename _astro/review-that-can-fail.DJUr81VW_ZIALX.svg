<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A clean report from an untested review says nothing.">
  <title>Test the review itself</title>
  <style>
    .review-that-can-fail-bg   { fill: #f8fafc; }
    .review-that-can-fail-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-that-can-fail-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-that-can-fail-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-that-can-fail-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-that-can-fail-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-that-can-fail-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .review-that-can-fail-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .review-that-can-fail-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .review-that-can-fail-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .review-that-can-fail-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .review-that-can-fail-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .review-that-can-fail-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .review-that-can-fail-row { opacity: 1; }
    .review-that-can-fail-r0 { animation-delay: 0.00s; }
    .review-that-can-fail-r1 { animation-delay: 0.45s; }
    .review-that-can-fail-r2 { animation-delay: 0.90s; }
    .review-that-can-fail-r3 { animation-delay: 1.35s; }
    .review-that-can-fail-r4 { animation-delay: 1.80s; }
    .review-that-can-fail-row { animation: review-that-can-fail-reveal 7.3s ease-in-out infinite; }
    @keyframes review-that-can-fail-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="review-that-can-fail-bg" width="980" height="390"/>
  <text class="review-that-can-fail-h1"  x="30" y="40">Test the review itself</text>
  <text class="review-that-can-fail-sub" x="30" y="64">A clean report from an untested review says nothing.</text>
  <rect class="review-that-can-fail-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="review-that-can-fail-name" x="46" y="122">Proven able to fail</text>
  <text class="review-that-can-fail-desc" x="46" y="142">A clean result means something.</text>
  <text class="review-that-can-fail-desc review-that-can-fail-row review-that-can-fail-r0" x="46" y="182">Run against a deliberately weak posture</text>
  <text class="review-that-can-fail-desc review-that-can-fail-row review-that-can-fail-r1" x="46" y="216">Each check lights up in isolation</text>
  <text class="review-that-can-fail-desc review-that-can-fail-row review-that-can-fail-r2" x="46" y="250">One change, one finding</text>
  <text class="review-that-can-fail-desc review-that-can-fail-row review-that-can-fail-r3" x="46" y="284">You know what a failure looks like</text>
  <text class="review-that-can-fail-desc review-that-can-fail-row review-that-can-fail-r4" x="46" y="318">A pass is evidence</text>
  <rect class="review-that-can-fail-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="review-that-can-fail-name" x="526" y="122">Never seen to fail</text>
  <text class="review-that-can-fail-desc" x="526" y="142">Indistinguishable from checking nothing.</text>
  <text class="review-that-can-fail-desc review-that-can-fail-row review-that-can-fail-r0" x="526" y="182">Only ever run on the real system</text>
  <text class="review-that-can-fail-desc review-that-can-fail-row review-that-can-fail-r1" x="526" y="216">Always clean, for unknown reasons</text>
  <text class="review-that-can-fail-desc review-that-can-fail-row review-that-can-fail-r2" x="526" y="250">Might be thorough, might be broken</text>
  <text class="review-that-can-fail-desc review-that-can-fail-row review-that-can-fail-r3" x="526" y="284">No baseline for what a finding looks like</text>
  <text class="review-that-can-fail-desc review-that-can-fail-row review-that-can-fail-r4" x="526" y="318">A pass is an assumption</text>
  <text class="review-that-can-fail-sub" x="30" y="372">The isolation runs matter as much as the weak posture: if changing one thing lights up four checks, the review is not localising anything and its findings cannot be prioritised.</text>
</svg>
