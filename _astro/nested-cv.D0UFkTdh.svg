<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Nested cross-validation</title>
  <style>
    .nested-cv-bg   { fill: #f8fafc; }
    .nested-cv-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nested-cv-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nested-cv-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nested-cv-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nested-cv-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nested-cv-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nested-cv-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .nested-cv-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .nested-cv-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .nested-cv-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .nested-cv-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .nested-cv-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .nested-cv-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .nested-cv-stage { opacity: 1; }

    .nested-cv-s0 { animation-delay: 0.00s; }
    .nested-cv-e0 { animation-delay: 0.00s; }
    .nested-cv-s1 { animation-delay: 1.28s; }
    .nested-cv-e1 { animation-delay: 1.28s; }
    .nested-cv-s2 { animation-delay: 2.56s; }
    .nested-cv-e2 { animation-delay: 2.56s; }
    .nested-cv-s3 { animation-delay: 3.84s; }
    .nested-cv-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .nested-cv-conn  { animation: nested-cv-trace 6.4s ease-in-out infinite; }
      .nested-cv-stage { animation: nested-cv-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes nested-cv-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes nested-cv-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .nested-cv-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .nested-cv-stage { animation: nested-cv-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes nested-cv-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="nested-cv-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="nested-cv-bg" width="980" height="322"/>
  <text class="nested-cv-h1"  x="30" y="40">Nested cross-validation</text>
  <text class="nested-cv-sub" x="30" y="64">Four steps.</text>
  <g class="nested-cv-stage nested-cv-s0">
    <rect class="nested-cv-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="nested-cv-step" x="44" y="142">01</text>
    <text class="nested-cv-name" x="70" y="142">An outer loop holds out a fold</text>
    <text class="nested-cv-desc" x="44" y="166">Which the tuning never sees.</text>
  </g>
  <line class="nested-cv-line nested-cv-conn nested-cv-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#nested-cv-tip)"/>
  <g class="nested-cv-stage nested-cv-s1">
    <rect class="nested-cv-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="nested-cv-step" x="280" y="142">02</text>
    <text class="nested-cv-name" x="306" y="142">An inner loop tunes on the remaining folds</text>
    <text class="nested-cv-desc" x="280" y="166">Selecting hyperparameters there.</text>
  </g>
  <line class="nested-cv-line nested-cv-conn nested-cv-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#nested-cv-tip)"/>
  <g class="nested-cv-stage nested-cv-s2">
    <rect class="nested-cv-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="nested-cv-step" x="516" y="142">03</text>
    <text class="nested-cv-name" x="542" y="142">The tuned model is scored on the held-out outer fold</text>
    <text class="nested-cv-desc" x="516" y="166">Once, without further</text>
    <text class="nested-cv-desc" x="516" y="182">adjustment.</text>
  </g>
  <line class="nested-cv-line nested-cv-conn nested-cv-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#nested-cv-tip)"/>
  <g class="nested-cv-stage nested-cv-s3">
    <rect class="nested-cv-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="nested-cv-step" x="752" y="142">04</text>
    <text class="nested-cv-name" x="778" y="142">Averaged across outer folds</text>
    <text class="nested-cv-desc" x="752" y="166">Giving an honest estimate of the</text>
    <text class="nested-cv-desc" x="752" y="182">whole procedure.</text>
    <text class="nested-cv-edge" x="752" y="242">expensive</text>
  </g>
  <text class="nested-cv-sub" x="30" y="304">This measures the pipeline including its tuning, which is the thing that will be deployed — and it is why it is more expensive and more honest than tuning once.</text>
</svg>
