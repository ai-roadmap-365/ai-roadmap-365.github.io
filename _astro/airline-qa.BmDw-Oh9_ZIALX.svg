<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Fifty thousand messages an hour.">
  <title>Airline feedback at volume</title>
  <style>
    .airline-qa-bg   { fill: #f8fafc; }
    .airline-qa-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .airline-qa-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .airline-qa-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .airline-qa-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .airline-qa-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .airline-qa-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .airline-qa-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .airline-qa-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .airline-qa-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .airline-qa-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .airline-qa-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .airline-qa-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .airline-qa-row { opacity: 1; }
    .airline-qa-r0 { animation-delay: 0.00s; }
    .airline-qa-r1 { animation-delay: 0.45s; }
    .airline-qa-r2 { animation-delay: 0.90s; }
    .airline-qa-r3 { animation-delay: 1.35s; }
    .airline-qa-r4 { animation-delay: 1.80s; }
    .airline-qa-row { animation: airline-qa-reveal 7.3s ease-in-out infinite; }
    @keyframes airline-qa-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="airline-qa-bg" width="980" height="390"/>
  <text class="airline-qa-h1"  x="30" y="40">Airline feedback at volume</text>
  <text class="airline-qa-sub" x="30" y="64">Fifty thousand messages an hour.</text>
  <rect class="airline-qa-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="airline-qa-name" x="46" y="122">Reading everything</text>
  <text class="airline-qa-desc" x="46" y="142">Impossible at volume.</text>
  <text class="airline-qa-desc airline-qa-row airline-qa-r0" x="46" y="182">Fifty thousand messages an hour</text>
  <text class="airline-qa-desc airline-qa-row airline-qa-r1" x="46" y="216">No team can read them</text>
  <text class="airline-qa-desc airline-qa-row airline-qa-r2" x="46" y="250">So a sample is read</text>
  <text class="airline-qa-desc airline-qa-row airline-qa-r3" x="46" y="284">Systematic issues in the unread majority</text>
  <text class="airline-qa-desc airline-qa-row airline-qa-r4" x="46" y="318">And urgency is discovered late</text>
  <rect class="airline-qa-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="airline-qa-name" x="526" y="122">Automated triage</text>
  <text class="airline-qa-desc" x="526" y="142">Classify, then escalate.</text>
  <text class="airline-qa-desc airline-qa-row airline-qa-r0" x="526" y="182">Everything scored</text>
  <text class="airline-qa-desc airline-qa-row airline-qa-r1" x="526" y="216">Strongly negative routed immediately</text>
  <text class="airline-qa-desc airline-qa-row airline-qa-r2" x="526" y="250">Aspects aggregated for trends</text>
  <text class="airline-qa-desc airline-qa-row airline-qa-r3" x="526" y="284">Humans read what matters</text>
  <text class="airline-qa-desc airline-qa-row airline-qa-r4" x="526" y="318">And the sample is no longer the constraint</text>
  <text class="airline-qa-sub" x="30" y="372">The point is not that the model reads better than a person: it is that it reads everything, which changes what the human reviewers can spend their attention on.</text>
</svg>
