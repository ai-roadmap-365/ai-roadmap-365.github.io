<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One box at a time.">
  <title>Collecting an order in batches</title>
  <style>
    .delivery-batches-bg   { fill: #f8fafc; }
    .delivery-batches-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .delivery-batches-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .delivery-batches-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .delivery-batches-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .delivery-batches-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .delivery-batches-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .delivery-batches-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .delivery-batches-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .delivery-batches-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .delivery-batches-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .delivery-batches-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .delivery-batches-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .delivery-batches-row { opacity: 1; }
    .delivery-batches-r0 { animation-delay: 0.00s; }
    .delivery-batches-r1 { animation-delay: 0.45s; }
    .delivery-batches-r2 { animation-delay: 0.90s; }
    .delivery-batches-r3 { animation-delay: 1.35s; }
    .delivery-batches-r4 { animation-delay: 1.80s; }
    .delivery-batches-row { animation: delivery-batches-reveal 7.3s ease-in-out infinite; }
    @keyframes delivery-batches-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="delivery-batches-bg" width="980" height="390"/>
  <text class="delivery-batches-h1"  x="30" y="40">Collecting an order in batches</text>
  <text class="delivery-batches-sub" x="30" y="64">One box at a time.</text>
  <rect class="delivery-batches-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="delivery-batches-name" x="46" y="122">In batches</text>
  <text class="delivery-batches-desc" x="46" y="142">Track what arrived.</text>
  <text class="delivery-batches-desc delivery-batches-row delivery-batches-r0" x="46" y="182">A box at a time, numbered</text>
  <text class="delivery-batches-desc delivery-batches-row delivery-batches-r1" x="46" y="216">Keep a record of each</text>
  <text class="delivery-batches-desc delivery-batches-row delivery-batches-r2" x="46" y="250">Know when the last has come</text>
  <text class="delivery-batches-desc delivery-batches-row delivery-batches-r3" x="46" y="284">Missing boxes are detectable</text>
  <text class="delivery-batches-desc delivery-batches-row delivery-batches-r4" x="46" y="318">This is pagination</text>
  <rect class="delivery-batches-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="delivery-batches-name" x="526" y="122">All at once</text>
  <text class="delivery-batches-desc" x="526" y="142">Assume completeness.</text>
  <text class="delivery-batches-desc delivery-batches-row delivery-batches-r0" x="526" y="182">Expect one delivery</text>
  <text class="delivery-batches-desc delivery-batches-row delivery-batches-r1" x="526" y="216">No record of parts</text>
  <text class="delivery-batches-desc delivery-batches-row delivery-batches-r2" x="526" y="250">No way to know if it is all</text>
  <text class="delivery-batches-desc delivery-batches-row delivery-batches-r3" x="526" y="284">Missing items are invisible</text>
  <text class="delivery-batches-desc delivery-batches-row delivery-batches-r4" x="526" y="318">This is one unchecked request</text>
  <text class="delivery-batches-sub" x="30" y="372">Missing items being invisible is exactly what happens when pagination is ignored: you get the first page and no indication that more existed.</text>
</svg>
