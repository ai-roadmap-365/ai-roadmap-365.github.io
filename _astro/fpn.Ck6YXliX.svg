<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A small object is one feature vector.">
  <title>Why scale needs its own structure</title>
  <style>
    .fpn-bg   { fill: #f8fafc; }
    .fpn-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fpn-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fpn-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fpn-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fpn-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fpn-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fpn-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fpn-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fpn-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fpn-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fpn-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fpn-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .fpn-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .fpn-stage { opacity: 1; }

    .fpn-s0 { animation-delay: 0.00s; }
    .fpn-e0 { animation-delay: 0.00s; }
    .fpn-s1 { animation-delay: 1.28s; }
    .fpn-e1 { animation-delay: 1.28s; }
    .fpn-s2 { animation-delay: 2.56s; }
    .fpn-e2 { animation-delay: 2.56s; }
    .fpn-s3 { animation-delay: 3.84s; }
    .fpn-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .fpn-conn  { animation: fpn-trace 6.4s ease-in-out infinite; }
      .fpn-stage { animation: fpn-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes fpn-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes fpn-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .fpn-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .fpn-stage { animation: fpn-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes fpn-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="fpn-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="fpn-bg" width="980" height="322"/>
  <text class="fpn-h1"  x="30" y="40">Why scale needs its own structure</text>
  <text class="fpn-sub" x="30" y="64">A small object is one feature vector.</text>
  <g class="fpn-stage fpn-s0">
    <rect class="fpn-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="fpn-step" x="44" y="142">01</text>
    <text class="fpn-name" x="70" y="142">Deep networks downsample heavily</text>
    <text class="fpn-desc" x="44" y="166">By a factor of thirty-two or</text>
    <text class="fpn-desc" x="44" y="182">more, end to end.</text>
  </g>
  <line class="fpn-line fpn-conn fpn-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#fpn-tip)"/>
  <g class="fpn-stage fpn-s1">
    <rect class="fpn-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="fpn-step" x="280" y="142">02</text>
    <text class="fpn-name" x="306" y="142">So a small object becomes sub-pixel</text>
    <text class="fpn-desc" x="280" y="166">A sixteen-pixel object is</text>
    <text class="fpn-desc" x="280" y="182">smaller than one final feature</text>
    <text class="fpn-desc" x="280" y="198">cell.</text>
  </g>
  <line class="fpn-line fpn-conn fpn-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#fpn-tip)"/>
  <g class="fpn-stage fpn-s2">
    <rect class="fpn-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="fpn-step" x="516" y="142">03</text>
    <text class="fpn-name" x="542" y="142">Use features from several depths</text>
    <text class="fpn-desc" x="516" y="166">Fine resolution for small</text>
    <text class="fpn-desc" x="516" y="182">objects, coarse for large.</text>
  </g>
  <line class="fpn-line fpn-conn fpn-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#fpn-tip)"/>
  <g class="fpn-stage fpn-s3">
    <rect class="fpn-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="fpn-step" x="752" y="142">04</text>
    <text class="fpn-name" x="778" y="142">Fused top-down</text>
    <text class="fpn-desc" x="752" y="166">Semantic depth combined with</text>
    <text class="fpn-desc" x="752" y="182">spatial precision at every</text>
    <text class="fpn-desc" x="752" y="198">scale.</text>
  </g>
  <text class="fpn-sub" x="30" y="304">Detecting a distant traffic light and a nearby truck in the same frame is the concrete problem, and it cannot be solved at any single feature resolution.</text>
</svg>
