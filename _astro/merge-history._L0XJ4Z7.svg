<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward tidy data.">
  <title>Four steps in combining tables</title>
  <style>
    .merge-history-bg   { fill: #f8fafc; }
    .merge-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .merge-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .merge-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .merge-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .merge-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .merge-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .merge-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .merge-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .merge-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .merge-history-stage { opacity: 1; }

    .merge-history-s0 { animation-delay: 0.00s; }
    .merge-history-e0 { animation-delay: 0.00s; }
    .merge-history-s1 { animation-delay: 1.28s; }
    .merge-history-e1 { animation-delay: 1.28s; }
    .merge-history-s2 { animation-delay: 2.56s; }
    .merge-history-e2 { animation-delay: 2.56s; }
    .merge-history-s3 { animation-delay: 3.84s; }
    .merge-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .merge-history-conn  { animation: merge-history-trace 6.4s ease-in-out infinite; }
      .merge-history-stage { animation: merge-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes merge-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes merge-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .merge-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .merge-history-stage { animation: merge-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes merge-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="merge-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="merge-history-bg" width="980" height="322"/>
  <text class="merge-history-h1"  x="30" y="40">Four steps in combining tables</text>
  <text class="merge-history-sub" x="30" y="64">Toward tidy data.</text>
  <g class="merge-history-stage merge-history-s0">
    <rect class="merge-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="merge-history-step" x="44" y="142">01</text>
    <text class="merge-history-name" x="70" y="142">Collating tables by hand</text>
    <text class="merge-history-desc" x="44" y="166">Which was as bad as it sounds.</text>
  </g>
  <line class="merge-history-line merge-history-conn merge-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#merge-history-tip)"/>
  <g class="merge-history-stage merge-history-s1">
    <rect class="merge-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="merge-history-step" x="280" y="142">02</text>
    <text class="merge-history-name" x="306" y="142">Then relational joins with a formal basis</text>
    <text class="merge-history-desc" x="280" y="166">Which made it declarative.</text>
  </g>
  <line class="merge-history-line merge-history-conn merge-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#merge-history-tip)"/>
  <g class="merge-history-stage merge-history-s2">
    <rect class="merge-history-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="merge-history-step" x="516" y="142">03</text>
    <text class="merge-history-name" x="542" y="142">Then spreadsheet pivot tables for reshaping</text>
    <text class="merge-history-desc" x="516" y="166">Which made it visual, and</text>
    <text class="merge-history-desc" x="516" y="182">manual.</text>
  </g>
  <line class="merge-history-line merge-history-conn merge-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#merge-history-tip)"/>
  <g class="merge-history-stage merge-history-s3">
    <rect class="merge-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="merge-history-step" x="752" y="142">04</text>
    <text class="merge-history-name" x="778" y="142">And a formal statement of tidy data</text>
    <text class="merge-history-desc" x="752" y="166">Which gave reshaping a target.</text>
  </g>
  <text class="merge-history-sub" x="30" y="304">Giving reshaping a defined target was the useful contribution: before it, 'get the data into the right shape' had no shared meaning.</text>
</svg>
