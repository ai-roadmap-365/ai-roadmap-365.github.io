<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>How leakage enters</title>
  <style>
    .leakage-preprocessing-bg   { fill: #f8fafc; }
    .leakage-preprocessing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-preprocessing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-preprocessing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-preprocessing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-preprocessing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-preprocessing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .leakage-preprocessing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .leakage-preprocessing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .leakage-preprocessing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .leakage-preprocessing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .leakage-preprocessing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .leakage-preprocessing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .leakage-preprocessing-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .leakage-preprocessing-stage { opacity: 1; }

    .leakage-preprocessing-s0 { animation-delay: 0.00s; }
    .leakage-preprocessing-e0 { animation-delay: 0.00s; }
    .leakage-preprocessing-s1 { animation-delay: 1.28s; }
    .leakage-preprocessing-e1 { animation-delay: 1.28s; }
    .leakage-preprocessing-s2 { animation-delay: 2.56s; }
    .leakage-preprocessing-e2 { animation-delay: 2.56s; }
    .leakage-preprocessing-s3 { animation-delay: 3.84s; }
    .leakage-preprocessing-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .leakage-preprocessing-conn  { animation: leakage-preprocessing-trace 6.4s ease-in-out infinite; }
      .leakage-preprocessing-stage { animation: leakage-preprocessing-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes leakage-preprocessing-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes leakage-preprocessing-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .leakage-preprocessing-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .leakage-preprocessing-stage { animation: leakage-preprocessing-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes leakage-preprocessing-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="leakage-preprocessing-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="leakage-preprocessing-bg" width="980" height="322"/>
  <text class="leakage-preprocessing-h1"  x="30" y="40">How leakage enters</text>
  <text class="leakage-preprocessing-sub" x="30" y="64">Four steps.</text>
  <g class="leakage-preprocessing-stage leakage-preprocessing-s0">
    <rect class="leakage-preprocessing-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="leakage-preprocessing-step" x="44" y="142">01</text>
    <text class="leakage-preprocessing-name" x="70" y="142">Scaling or imputing before splitting</text>
    <text class="leakage-preprocessing-desc" x="44" y="166">Computes statistics over all the</text>
    <text class="leakage-preprocessing-desc" x="44" y="182">data.</text>
  </g>
  <line class="leakage-preprocessing-line leakage-preprocessing-conn leakage-preprocessing-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#leakage-preprocessing-tip)"/>
  <g class="leakage-preprocessing-stage leakage-preprocessing-s1">
    <rect class="leakage-preprocessing-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="leakage-preprocessing-step" x="280" y="142">02</text>
    <text class="leakage-preprocessing-name" x="306" y="142">Which include the validation and test rows</text>
    <text class="leakage-preprocessing-desc" x="280" y="166">Their means and ranges influence</text>
    <text class="leakage-preprocessing-desc" x="280" y="182">the transform.</text>
  </g>
  <line class="leakage-preprocessing-line leakage-preprocessing-conn leakage-preprocessing-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#leakage-preprocessing-tip)"/>
  <g class="leakage-preprocessing-stage leakage-preprocessing-s2">
    <rect class="leakage-preprocessing-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="leakage-preprocessing-step" x="516" y="142">03</text>
    <text class="leakage-preprocessing-name" x="542" y="142">So the model has seen them indirectly</text>
    <text class="leakage-preprocessing-desc" x="516" y="166">And scores better than it</text>
    <text class="leakage-preprocessing-desc" x="516" y="182">should.</text>
  </g>
  <line class="leakage-preprocessing-line leakage-preprocessing-conn leakage-preprocessing-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#leakage-preprocessing-tip)"/>
  <g class="leakage-preprocessing-stage leakage-preprocessing-s3">
    <rect class="leakage-preprocessing-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="leakage-preprocessing-step" x="752" y="142">04</text>
    <text class="leakage-preprocessing-name" x="778" y="142">Fit the transform on training data, apply it to the rest</text>
    <text class="leakage-preprocessing-desc" x="752" y="166">Which is what a pipeline</text>
    <text class="leakage-preprocessing-desc" x="752" y="182">enforces.</text>
  </g>
  <text class="leakage-preprocessing-sub" x="30" y="304">Using a pipeline object rather than transforming by hand is the structural fix: it makes the correct order the default rather than something to remember.</text>
</svg>
