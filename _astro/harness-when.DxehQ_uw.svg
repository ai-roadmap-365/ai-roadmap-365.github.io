<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And the one exception.">
  <title>When to use the full harness</title>
  <style>
    .harness-when-bg   { fill: #f8fafc; }
    .harness-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .harness-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .harness-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .harness-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .harness-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .harness-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .harness-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .harness-when-row { opacity: 1; }
    .harness-when-r0 { animation-delay: 0.00s; }
    .harness-when-r1 { animation-delay: 0.45s; }
    .harness-when-r2 { animation-delay: 0.90s; }
    .harness-when-r3 { animation-delay: 1.35s; }
    .harness-when-r4 { animation-delay: 1.80s; }
    .harness-when-row { animation: harness-when-reveal 7.3s ease-in-out infinite; }
    @keyframes harness-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="harness-when-bg" width="980" height="390"/>
  <text class="harness-when-h1"  x="30" y="40">When to use the full harness</text>
  <text class="harness-when-sub" x="30" y="64">And the one exception.</text>
  <rect class="harness-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="harness-when-name" x="46" y="122">Use it</text>
  <text class="harness-when-desc" x="46" y="142">Anything you will repeat.</text>
  <text class="harness-when-desc harness-when-row harness-when-r0" x="46" y="182">Every production vision project</text>
  <text class="harness-when-desc harness-when-row harness-when-r1" x="46" y="216">Exploratory experiments you will compare</text>
  <text class="harness-when-desc harness-when-row harness-when-r2" x="46" y="250">Anything with a compute budget</text>
  <text class="harness-when-desc harness-when-row harness-when-r3" x="46" y="284">Anything that will be deployed</text>
  <text class="harness-when-desc harness-when-row harness-when-r4" x="46" y="318">Which is nearly all of it</text>
  <rect class="harness-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="harness-when-name" x="526" y="122">Skip it</text>
  <text class="harness-when-desc" x="526" y="142">One minute of scratch code.</text>
  <text class="harness-when-desc harness-when-row harness-when-r0" x="526" y="182">Checking a tensor shape</text>
  <text class="harness-when-desc harness-when-row harness-when-r1" x="526" y="216">Verifying a model loads</text>
  <text class="harness-when-desc harness-when-row harness-when-r2" x="526" y="250">A single forward pass</text>
  <text class="harness-when-desc harness-when-row harness-when-r3" x="526" y="284">No training, nothing to compare</text>
  <text class="harness-when-desc harness-when-row harness-when-r4" x="526" y="318">And nothing to reproduce</text>
  <text class="harness-when-sub" x="30" y="372">The boundary is whether anything will be compared: the moment two runs need to be weighed against each other, the harness stops being overhead and becomes the thing that makes the comparison meaningful.</text>
</svg>
