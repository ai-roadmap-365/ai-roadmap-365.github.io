<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And the one field to log regardless.">
  <title>How much to instrument</title>
  <style>
    .instrument-now-or-later-bg   { fill: #f8fafc; }
    .instrument-now-or-later-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .instrument-now-or-later-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .instrument-now-or-later-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .instrument-now-or-later-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .instrument-now-or-later-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .instrument-now-or-later-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .instrument-now-or-later-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .instrument-now-or-later-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .instrument-now-or-later-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .instrument-now-or-later-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .instrument-now-or-later-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .instrument-now-or-later-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .instrument-now-or-later-row { opacity: 1; }
    .instrument-now-or-later-r0 { animation-delay: 0.00s; }
    .instrument-now-or-later-r1 { animation-delay: 0.45s; }
    .instrument-now-or-later-r2 { animation-delay: 0.90s; }
    .instrument-now-or-later-r3 { animation-delay: 1.35s; }
    .instrument-now-or-later-r4 { animation-delay: 1.80s; }
    .instrument-now-or-later-row { animation: instrument-now-or-later-reveal 7.3s ease-in-out infinite; }
    @keyframes instrument-now-or-later-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="instrument-now-or-later-bg" width="980" height="390"/>
  <text class="instrument-now-or-later-h1"  x="30" y="40">How much to instrument</text>
  <text class="instrument-now-or-later-sub" x="30" y="64">And the one field to log regardless.</text>
  <rect class="instrument-now-or-later-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="instrument-now-or-later-name" x="46" y="122">All four signals</text>
  <text class="instrument-now-or-later-desc" x="46" y="142">Any system with real users.</text>
  <text class="instrument-now-or-later-desc instrument-now-or-later-row instrument-now-or-later-r0" x="46" y="182">Users other than you</text>
  <text class="instrument-now-or-later-desc instrument-now-or-later-row instrument-now-or-later-r1" x="46" y="216">Spend triggered by external input</text>
  <text class="instrument-now-or-later-desc instrument-now-or-later-row instrument-now-or-later-r2" x="46" y="250">A silent quality failure would matter</text>
  <text class="instrument-now-or-later-desc instrument-now-or-later-row instrument-now-or-later-r3" x="46" y="284">More than one person can deploy</text>
  <text class="instrument-now-or-later-desc instrument-now-or-later-row instrument-now-or-later-r4" x="46" y="318">Essentially every real AI system</text>
  <rect class="instrument-now-or-later-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="instrument-now-or-later-name" x="526" y="122">Start smaller</text>
  <text class="instrument-now-or-later-desc" x="526" y="142">But log the records.</text>
  <text class="instrument-now-or-later-desc instrument-now-or-later-row instrument-now-or-later-r0" x="526" y="182">A demonstration with no live users</text>
  <text class="instrument-now-or-later-desc instrument-now-or-later-row instrument-now-or-later-r1" x="526" y="216">Aggregate later, from stored records</text>
  <text class="instrument-now-or-later-desc instrument-now-or-later-row instrument-now-or-later-r2" x="526" y="250">You cannot analyse traffic you never captured</text>
  <text class="instrument-now-or-later-desc instrument-now-or-later-row instrument-now-or-later-r3" x="526" y="284">Adding a field later does not backfill it</text>
  <text class="instrument-now-or-later-desc instrument-now-or-later-row instrument-now-or-later-r4" x="526" y="318">Record groundedness from day one anyway</text>
  <text class="instrument-now-or-later-sub" x="30" y="372">Quality is the one to measure regardless of scale: it costs a boolean per request, and it is the only signal that sees the failure mode unique to these systems.</text>
</svg>
