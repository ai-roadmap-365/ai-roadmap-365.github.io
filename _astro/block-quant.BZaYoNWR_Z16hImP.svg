<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which is what makes low bit depths work.">
  <title>Block-wise scaling</title>
  <style>
    .block-quant-bg   { fill: #f8fafc; }
    .block-quant-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .block-quant-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .block-quant-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .block-quant-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .block-quant-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .block-quant-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .block-quant-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .block-quant-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .block-quant-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .block-quant-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .block-quant-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .block-quant-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .block-quant-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .block-quant-stage { opacity: 1; }

    .block-quant-s0 { animation-delay: 0.00s; }
    .block-quant-e0 { animation-delay: 0.00s; }
    .block-quant-s1 { animation-delay: 1.28s; }
    .block-quant-e1 { animation-delay: 1.28s; }
    .block-quant-s2 { animation-delay: 2.56s; }
    .block-quant-e2 { animation-delay: 2.56s; }
    .block-quant-s3 { animation-delay: 3.84s; }
    .block-quant-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .block-quant-conn  { animation: block-quant-trace 6.4s ease-in-out infinite; }
      .block-quant-stage { animation: block-quant-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes block-quant-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes block-quant-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .block-quant-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .block-quant-stage { animation: block-quant-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes block-quant-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="block-quant-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="block-quant-bg" width="980" height="322"/>
  <text class="block-quant-h1"  x="30" y="40">Block-wise scaling</text>
  <text class="block-quant-sub" x="30" y="64">Which is what makes low bit depths work.</text>
  <g class="block-quant-stage block-quant-s0">
    <rect class="block-quant-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="block-quant-step" x="44" y="142">01</text>
    <text class="block-quant-name" x="70" y="142">One scale for a whole tensor is set by its largest value</text>
    <text class="block-quant-desc" x="44" y="166">A single outlier wastes the</text>
    <text class="block-quant-desc" x="44" y="182">entire range.</text>
  </g>
  <line class="block-quant-line block-quant-conn block-quant-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#block-quant-tip)"/>
  <g class="block-quant-stage block-quant-s1">
    <rect class="block-quant-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="block-quant-step" x="280" y="142">02</text>
    <text class="block-quant-name" x="306" y="142">So split the weights into small blocks</text>
    <text class="block-quant-desc" x="280" y="166">Thirty-two or sixty-four values</text>
    <text class="block-quant-desc" x="280" y="182">each.</text>
  </g>
  <line class="block-quant-line block-quant-conn block-quant-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#block-quant-tip)"/>
  <g class="block-quant-stage block-quant-s2">
    <rect class="block-quant-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="block-quant-step" x="516" y="142">03</text>
    <text class="block-quant-name" x="542" y="142">With a scale per block</text>
    <text class="block-quant-desc" x="516" y="166">So an outlier only damages its</text>
    <text class="block-quant-desc" x="516" y="182">own block.</text>
  </g>
  <line class="block-quant-line block-quant-conn block-quant-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#block-quant-tip)"/>
  <g class="block-quant-stage block-quant-s3">
    <rect class="block-quant-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="block-quant-step" x="752" y="142">04</text>
    <text class="block-quant-name" x="778" y="142">At the cost of storing those scales</text>
    <text class="block-quant-desc" x="752" y="166">A small overhead, easily worth</text>
    <text class="block-quant-desc" x="752" y="182">it.</text>
    <text class="block-quant-edge" x="752" y="242">~0.5 bits</text>
  </g>
  <text class="block-quant-sub" x="30" y="304">Without per-block scaling, four-bit quantisation is unusable rather than merely degraded, which is why this is the enabling detail rather than an optimisation.</text>
</svg>
