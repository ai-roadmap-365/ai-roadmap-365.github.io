<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Where the cut goes matters.">
  <title>Cutting a film</title>
  <style>
    .cutting-film-bg   { fill: #f8fafc; }
    .cutting-film-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cutting-film-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cutting-film-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cutting-film-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cutting-film-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cutting-film-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cutting-film-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cutting-film-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cutting-film-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cutting-film-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cutting-film-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cutting-film-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cutting-film-row { opacity: 1; }
    .cutting-film-r0 { animation-delay: 0.00s; }
    .cutting-film-r1 { animation-delay: 0.45s; }
    .cutting-film-r2 { animation-delay: 0.90s; }
    .cutting-film-r3 { animation-delay: 1.35s; }
    .cutting-film-r4 { animation-delay: 1.80s; }
    .cutting-film-row { animation: cutting-film-reveal 7.3s ease-in-out infinite; }
    @keyframes cutting-film-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cutting-film-bg" width="980" height="390"/>
  <text class="cutting-film-h1"  x="30" y="40">Cutting a film</text>
  <text class="cutting-film-sub" x="30" y="64">Where the cut goes matters.</text>
  <rect class="cutting-film-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cutting-film-name" x="46" y="122">Every thirty seconds</text>
  <text class="cutting-film-desc" x="46" y="142">Uniform, and wrong.</text>
  <text class="cutting-film-desc cutting-film-row cutting-film-r0" x="46" y="182">Cuts mid-sentence and mid-action</text>
  <text class="cutting-film-desc cutting-film-row cutting-film-r1" x="46" y="216">Clips that make no sense alone</text>
  <text class="cutting-film-desc cutting-film-row cutting-film-r2" x="46" y="250">Uniform length, no meaning</text>
  <text class="cutting-film-desc cutting-film-row cutting-film-r3" x="46" y="284">Context lost at every join</text>
  <text class="cutting-film-desc cutting-film-row cutting-film-r4" x="46" y="318">This is fixed-size chunking</text>
  <rect class="cutting-film-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cutting-film-name" x="526" y="122">At scene boundaries</text>
  <text class="cutting-film-desc" x="526" y="142">Uneven, and right.</text>
  <text class="cutting-film-desc cutting-film-row cutting-film-r0" x="526" y="182">Each clip a complete scene</text>
  <text class="cutting-film-desc cutting-film-row cutting-film-r1" x="526" y="216">Understandable on its own</text>
  <text class="cutting-film-desc cutting-film-row cutting-film-r2" x="526" y="250">Uneven lengths, which is correct</text>
  <text class="cutting-film-desc cutting-film-row cutting-film-r3" x="526" y="284">Nothing important spans a cut</text>
  <text class="cutting-film-desc cutting-film-row cutting-film-r4" x="526" y="318">This is structure-aware chunking</text>
  <text class="cutting-film-sub" x="30" y="372">Uneven length being correct rather than a defect is the point worth taking: uniformity is a convenience for the pipeline and a cost to the retrieval.</text>
</svg>
