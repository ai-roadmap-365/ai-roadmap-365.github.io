<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="All computable from records you have.">
  <title>Three numbers and one paragraph</title>
  <style>
    .three-numbers-bg   { fill: #f8fafc; }
    .three-numbers-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-numbers-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-numbers-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-numbers-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-numbers-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-numbers-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-numbers-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-numbers-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-numbers-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-numbers-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-numbers-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-numbers-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .three-numbers-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .three-numbers-stage { opacity: 1; }

    .three-numbers-s0 { animation-delay: 0.00s; }
    .three-numbers-e0 { animation-delay: 0.00s; }
    .three-numbers-s1 { animation-delay: 1.28s; }
    .three-numbers-e1 { animation-delay: 1.28s; }
    .three-numbers-s2 { animation-delay: 2.56s; }
    .three-numbers-e2 { animation-delay: 2.56s; }
    .three-numbers-s3 { animation-delay: 3.84s; }
    .three-numbers-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .three-numbers-conn  { animation: three-numbers-trace 6.4s ease-in-out infinite; }
      .three-numbers-stage { animation: three-numbers-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes three-numbers-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes three-numbers-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .three-numbers-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .three-numbers-stage { animation: three-numbers-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes three-numbers-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="three-numbers-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="three-numbers-bg" width="980" height="322"/>
  <text class="three-numbers-h1"  x="30" y="40">Three numbers and one paragraph</text>
  <text class="three-numbers-sub" x="30" y="64">All computable from records you have.</text>
  <g class="three-numbers-stage three-numbers-s0">
    <rect class="three-numbers-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="three-numbers-step" x="44" y="142">01</text>
    <text class="three-numbers-name" x="70" y="142">Calibration</text>
    <text class="three-numbers-desc" x="44" y="166">Actual over estimated, per task.</text>
    <text class="three-numbers-desc" x="44" y="182">Median, not mean.</text>
    <text class="three-numbers-edge" x="44" y="242">1.20x</text>
  </g>
  <line class="three-numbers-line three-numbers-conn three-numbers-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#three-numbers-tip)"/>
  <g class="three-numbers-stage three-numbers-s1">
    <rect class="three-numbers-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="three-numbers-step" x="280" y="142">02</text>
    <text class="three-numbers-name" x="306" y="142">Spread</text>
    <text class="three-numbers-desc" x="280" y="166">The median per area. Uniform</text>
    <text class="three-numbers-desc" x="280" y="182">error, or concentrated?</text>
    <text class="three-numbers-edge" x="280" y="242">1.15x vs 3.33x</text>
  </g>
  <line class="three-numbers-line three-numbers-conn three-numbers-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#three-numbers-tip)"/>
  <g class="three-numbers-stage three-numbers-s2">
    <rect class="three-numbers-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="three-numbers-step" x="516" y="142">03</text>
    <text class="three-numbers-name" x="542" y="142">Detection</text>
    <text class="three-numbers-desc" x="516" y="166">Where each incident was caught.</text>
    <text class="three-numbers-desc" x="516" y="182">The rank matters more than the</text>
    <text class="three-numbers-desc" x="516" y="198">count.</text>
    <text class="three-numbers-edge" x="516" y="242">escaped 40%</text>
  </g>
  <line class="three-numbers-line three-numbers-conn three-numbers-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#three-numbers-tip)"/>
  <g class="three-numbers-stage three-numbers-s3">
    <rect class="three-numbers-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="three-numbers-step" x="752" y="142">04</text>
    <text class="three-numbers-name" x="778" y="142">The paragraph</text>
    <text class="three-numbers-desc" x="752" y="166">For each escape: what gate would</text>
    <text class="three-numbers-desc" x="752" y="182">have caught it? Sometimes none.</text>
    <text class="three-numbers-edge" x="752" y="242">the backlog</text>
  </g>
  <text class="three-numbers-sub" x="30" y="304">The fourth is the only one no program computes, and it is the one that becomes work: two named controls traceable to incidents that actually happened, rather than "improve monitoring".</text>
</svg>
