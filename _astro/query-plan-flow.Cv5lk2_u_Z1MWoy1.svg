<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 730" width="1040" height="730" role="img" aria-labelledby="d089f-title d089f-desc">
  <title id="d089f-title">The same query answered twice: above, a scan walking page after page and testing every row; below, a seek descending three levels of a tree straight to the rows that match</title>
  <desc id="d089f-desc">An animated flow diagram in two halves, readable in full as a still picture. The upper half shows the query SELECT event_id, model, score FROM events WHERE run_id = 200 with no index: twelve page boxes stand for the table's 7,392 pages, each lighting up in turn from left to right while a token travels across them, and the caption records that every page is read and all 400,000 rows are tested to find 100, at a best of 8.41 milliseconds. The lower half shows the same query after CREATE INDEX ix_events_run: a three-level B-tree whose root, one interior page and one leaf page light up in sequence as a token descends past greyed-out sibling pages that are never read, ending at a result box of 100 rows, at a best of 0.027 milliseconds, three page reads instead of 7,392. A footer states that both halves return the identical 100 rows, that only the work changed, and that the milliseconds are from one machine on one day while the shape is what generalises. With motion disabled every page, label, plan line and number is still present.</desc>

  <style>
    .d089f-bg     { fill: #f8fafc; }
    .d089f-title  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 21px; font-weight: 600; fill: #1a202c; }
    .d089f-head   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 600; fill: #1a202c; }
    .d089f-label  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #1a202c; }
    .d089f-small  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d089f-mono   { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 14px; fill: #1a202c; }
    .d089f-plan   { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 15px; fill: #1d4ed8; }
    .d089f-cold   { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .d089f-group  { fill: none; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .d089f-result { fill: #dcfce7; stroke: #047857; stroke-width: 1.5; }

    /* Every page of the table, lighting in turn: the scan reads all of them. */
    .d089f-page { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5;
                  animation: d089f-read 6s ease-in-out infinite; }
    .d089f-p1  { animation-delay: 0.00s; }
    .d089f-p2  { animation-delay: 0.30s; }
    .d089f-p3  { animation-delay: 0.60s; }
    .d089f-p4  { animation-delay: 0.90s; }
    .d089f-p5  { animation-delay: 1.20s; }
    .d089f-p6  { animation-delay: 1.50s; }
    .d089f-p7  { animation-delay: 1.80s; }
    .d089f-p8  { animation-delay: 2.10s; }
    .d089f-p9  { animation-delay: 2.40s; }
    .d089f-p10 { animation-delay: 2.70s; }
    .d089f-p11 { animation-delay: 3.00s; }
    .d089f-p12 { animation-delay: 3.30s; }
    @keyframes d089f-read {
      0%, 10%, 100% { fill: #e0e7ff; }
      3%, 7%        { fill: #93c5fd; }
    }

    /* Three levels of the tree, lighting in turn: the seek reads three pages. */
    .d089f-level { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5;
                   animation: d089f-descend 6s ease-in-out infinite; }
    .d089f-L1 { animation-delay: 0.4s; }
    .d089f-L2 { animation-delay: 1.4s; }
    .d089f-L3 { animation-delay: 2.4s; }
    @keyframes d089f-descend {
      0%, 22%, 100% { fill: #e0e7ff; }
      6%, 16%       { fill: #93c5fd; }
    }

    /* Flowing connections. Reduced motion turns them into clean solid arrows. */
    .d089f-wire { fill: none; stroke: #1d4ed8; stroke-width: 2.5;
                  stroke-dasharray: 10 8; animation: d089f-march 1.6s linear infinite; }
    @keyframes d089f-march { to { stroke-dashoffset: -18; } }

    /* The token that walks the scan, resting visible at the first page. */
    .d089f-walker { fill: #1d4ed8; animation: d089f-walk 6s ease-in-out infinite; }
    @keyframes d089f-walk {
      0%   { transform: translateX(0); }
      6%   { transform: translateX(0); }
      62%  { transform: translateX(880px); }
      100% { transform: translateX(880px); }
    }

    /* The token that descends the tree, resting visible at the root. */
    .d089f-diver { fill: #1d4ed8; animation: d089f-dive 6s ease-in-out infinite; }
    @keyframes d089f-dive {
      0%   { transform: translateY(0); }
      8%   { transform: translateY(0); }
      26%  { transform: translateY(80px); }
      44%  { transform: translateY(160px); }
      70%  { transform: translateY(216px); }
      100% { transform: translateY(216px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .d089f-page   { animation: none; fill: #e0e7ff; }
      .d089f-level  { animation: none; fill: #e0e7ff; }
      .d089f-wire   { animation: none; stroke-dasharray: none; }
      .d089f-walker { animation: none; transform: none; }
      .d089f-diver  { animation: none; transform: none; }
    }
  </style>

  <rect class="d089f-bg" x="0" y="0" width="1040" height="730" />

  <defs>
    <marker id="d089f-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
    <marker id="d089f-arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
    <marker id="d089f-arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857" />
    </marker>
  </defs>

  <text class="d089f-title" x="32" y="40">One query, two plans: how much of the table has to light up</text>
  <text class="d089f-mono" x="32" y="66">SELECT event_id, model, score FROM events WHERE run_id = 200;   -- 400,000 rows, 100 match</text>

  <!-- ======================= HALF ONE: THE SCAN ======================= -->
  <rect class="d089f-group" x="26" y="86" width="988" height="222" rx="10" />
  <text class="d089f-head" x="44" y="114">1. No index on run_id</text>
  <text class="d089f-plan" x="256" y="114">SCAN events</text>
  <text class="d089f-small" x="44" y="136">Read every page. Test every row. There is no way to know where the matches are, so there is no way to stop early.</text>

  <circle class="d089f-walker" cx="84" cy="164" r="9" />

  <rect class="d089f-page d089f-p1"  x="48"  y="180" width="72" height="62" rx="5" />
  <rect class="d089f-page d089f-p2"  x="128" y="180" width="72" height="62" rx="5" />
  <rect class="d089f-page d089f-p3"  x="208" y="180" width="72" height="62" rx="5" />
  <rect class="d089f-page d089f-p4"  x="288" y="180" width="72" height="62" rx="5" />
  <rect class="d089f-page d089f-p5"  x="368" y="180" width="72" height="62" rx="5" />
  <rect class="d089f-page d089f-p6"  x="448" y="180" width="72" height="62" rx="5" />
  <rect class="d089f-page d089f-p7"  x="528" y="180" width="72" height="62" rx="5" />
  <rect class="d089f-page d089f-p8"  x="608" y="180" width="72" height="62" rx="5" />
  <rect class="d089f-page d089f-p9"  x="688" y="180" width="72" height="62" rx="5" />
  <rect class="d089f-page d089f-p10" x="768" y="180" width="72" height="62" rx="5" />
  <rect class="d089f-page d089f-p11" x="848" y="180" width="72" height="62" rx="5" />
  <rect class="d089f-page d089f-p12" x="928" y="180" width="72" height="62" rx="5" />

  <text class="d089f-small" x="84"  y="216" text-anchor="middle">page 1</text>
  <text class="d089f-small" x="324" y="216" text-anchor="middle">page 4</text>
  <text class="d089f-small" x="564" y="216" text-anchor="middle">page 7</text>
  <text class="d089f-small" x="804" y="216" text-anchor="middle">page 10</text>
  <text class="d089f-small" x="964" y="216" text-anchor="middle">page 7,392</text>

  <text class="d089f-label" x="44" y="272">7,392 pages read · 400,000 rows tested · 100 returned</text>
  <text class="d089f-label" x="620" y="272">best 8.41 ms of 7 runs</text>
  <text class="d089f-small" x="44" y="294">Twice the rows, twice the pages, twice the wait. This cost grows with the table, for ever.</text>

  <!-- ======================= HALF TWO: THE SEEK ======================= -->
  <rect class="d089f-group" x="26" y="322" width="988" height="286" rx="10" />
  <text class="d089f-head" x="44" y="350">2. After CREATE INDEX ix_events_run ON events(run_id)</text>
  <text class="d089f-plan" x="484" y="350">SEARCH events USING INDEX ix_events_run (run_id=?)</text>
  <text class="d089f-small" x="44" y="372">Descend the index instead. One page per level, and the greyed pages are never touched at all.</text>

  <circle class="d089f-diver" cx="410" cy="412" r="9" />

  <rect class="d089f-level d089f-L1" x="436" y="386" width="170" height="52" rx="6" />
  <text class="d089f-small" x="521" y="408" text-anchor="middle">root page</text>
  <text class="d089f-mono"  x="521" y="428" text-anchor="middle">run_id &lt; 2000 ?</text>

  <path class="d089f-wire" d="M 480 440 L 240 462" marker-end="url(#d089f-arrow)" />
  <path class="d089f-wire" d="M 560 440 L 800 462" marker-end="url(#d089f-arrowGrey)" />

  <rect class="d089f-level d089f-L2" x="155" y="466" width="170" height="52" rx="6" />
  <text class="d089f-small" x="240" y="488" text-anchor="middle">interior page</text>
  <text class="d089f-mono"  x="240" y="508" text-anchor="middle">run_id 128 .. 384</text>

  <rect class="d089f-cold" x="715" y="466" width="170" height="52" rx="6" />
  <text class="d089f-small" x="800" y="494" text-anchor="middle">never read</text>

  <path class="d089f-wire" d="M 240 520 L 240 546" marker-end="url(#d089f-arrow)" />

  <rect class="d089f-level d089f-L3" x="155" y="550" width="170" height="52" rx="6" />
  <text class="d089f-small" x="240" y="572" text-anchor="middle">leaf page</text>
  <text class="d089f-mono"  x="240" y="592" text-anchor="middle">run 200 -&gt; rowids</text>

  <rect class="d089f-cold" x="380" y="550" width="150" height="52" rx="6" />
  <text class="d089f-small" x="455" y="578" text-anchor="middle">never read</text>
  <rect class="d089f-cold" x="560" y="550" width="150" height="52" rx="6" />
  <text class="d089f-small" x="635" y="578" text-anchor="middle">never read</text>
  <rect class="d089f-cold" x="740" y="550" width="150" height="52" rx="6" />
  <text class="d089f-small" x="815" y="578" text-anchor="middle">never read</text>

  <path class="d089f-wire" d="M 325 576 L 372 576" marker-end="url(#d089f-arrowGrey)" />

  <rect class="d089f-result" x="620" y="386" width="368" height="132" rx="6" />
  <text class="d089f-label" x="640" y="412">3 page reads · 100 rows found · 100 returned</text>
  <text class="d089f-label" x="640" y="440">best 0.027 ms of 7 runs</text>
  <text class="d089f-small" x="640" y="466">309x faster than the scan above, on this machine.</text>
  <text class="d089f-small" x="640" y="490">Four times the rows would add nothing here: the</text>
  <text class="d089f-small" x="640" y="510">depth grows with the logarithm of the row count.</text>

  <path class="d089f-wire" d="M 606 412 L 614 412" marker-end="url(#d089f-arrowGreen)" />

  <!-- ============================ FOOTER ============================ -->
  <text class="d089f-label" x="32" y="642">Both halves return the identical 100 rows. Only the work changed — that is the whole promise, and the reason an index is always safe to add or drop.</text>
  <text class="d089f-small" x="32" y="666">Resting state: every page drawn, both tokens at their starting positions, all three plan lines and all six numbers present.</text>
  <text class="d089f-small" x="32" y="688">With reduced motion requested the animation stops and that resting state is the whole diagram — nothing is only shown while it moves.</text>
  <text class="d089f-small" x="32" y="710">The milliseconds are one machine on one day and yours will differ. What generalises is the shape: one cost grows with the table and the other does not.</text>
</svg>
