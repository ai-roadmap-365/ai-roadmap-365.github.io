<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One is about structure. The other is about hardware.">
  <title>Concurrency is not parallelism</title>
  <style>
    .concurrency-versus-parallelism-bg   { fill: #f8fafc; }
    .concurrency-versus-parallelism-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .concurrency-versus-parallelism-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .concurrency-versus-parallelism-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .concurrency-versus-parallelism-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .concurrency-versus-parallelism-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .concurrency-versus-parallelism-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .concurrency-versus-parallelism-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .concurrency-versus-parallelism-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .concurrency-versus-parallelism-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .concurrency-versus-parallelism-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .concurrency-versus-parallelism-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .concurrency-versus-parallelism-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .concurrency-versus-parallelism-row { opacity: 1; }
    .concurrency-versus-parallelism-r0 { animation-delay: 0.00s; }
    .concurrency-versus-parallelism-r1 { animation-delay: 0.45s; }
    .concurrency-versus-parallelism-r2 { animation-delay: 0.90s; }
    .concurrency-versus-parallelism-r3 { animation-delay: 1.35s; }
    .concurrency-versus-parallelism-r4 { animation-delay: 1.80s; }
    .concurrency-versus-parallelism-row { animation: concurrency-versus-parallelism-reveal 7.3s ease-in-out infinite; }
    @keyframes concurrency-versus-parallelism-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="concurrency-versus-parallelism-bg" width="980" height="390"/>
  <text class="concurrency-versus-parallelism-h1"  x="30" y="40">Concurrency is not parallelism</text>
  <text class="concurrency-versus-parallelism-sub" x="30" y="64">One is about structure. The other is about hardware.</text>
  <rect class="concurrency-versus-parallelism-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="concurrency-versus-parallelism-name" x="46" y="122">Concurrency</text>
  <text class="concurrency-versus-parallelism-desc" x="46" y="142">Dealing with many tasks in overlapping time.</text>
  <text class="concurrency-versus-parallelism-desc concurrency-versus-parallelism-row concurrency-versus-parallelism-r0" x="46" y="182">Structure, not simultaneity</text>
  <text class="concurrency-versus-parallelism-desc concurrency-versus-parallelism-row concurrency-versus-parallelism-r1" x="46" y="216">One core can be fully concurrent</text>
  <text class="concurrency-versus-parallelism-desc concurrency-versus-parallelism-row concurrency-versus-parallelism-r2" x="46" y="250">Progress on all tasks; never two at one instant</text>
  <text class="concurrency-versus-parallelism-desc concurrency-versus-parallelism-row concurrency-versus-parallelism-r3" x="46" y="284">One barista rotating among four drinks</text>
  <text class="concurrency-versus-parallelism-desc concurrency-versus-parallelism-row concurrency-versus-parallelism-r4" x="46" y="318">Python threads give you this</text>
  <rect class="concurrency-versus-parallelism-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="concurrency-versus-parallelism-name" x="526" y="122">Parallelism</text>
  <text class="concurrency-versus-parallelism-desc" x="526" y="142">Executing many tasks at the same instant.</text>
  <text class="concurrency-versus-parallelism-desc concurrency-versus-parallelism-row concurrency-versus-parallelism-r0" x="526" y="182">Requires more than one execution unit</text>
  <text class="concurrency-versus-parallelism-desc concurrency-versus-parallelism-row concurrency-versus-parallelism-r1" x="526" y="216">Multiple cores, or a GPU's thousands</text>
  <text class="concurrency-versus-parallelism-desc concurrency-versus-parallelism-row concurrency-versus-parallelism-r2" x="526" y="250">Two tasks genuinely running at once</text>
  <text class="concurrency-versus-parallelism-desc concurrency-versus-parallelism-row concurrency-versus-parallelism-r3" x="526" y="284">Four baristas, four drinks</text>
  <text class="concurrency-versus-parallelism-desc concurrency-versus-parallelism-row concurrency-versus-parallelism-r4" x="526" y="318">Python needs processes for this</text>
  <text class="concurrency-versus-parallelism-sub" x="30" y="372">All parallelism on a shared machine involves concurrency, because the scheduler is still there. Concurrency requires no parallelism at all.</text>
</svg>
