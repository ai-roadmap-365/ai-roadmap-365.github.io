<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" role="img" font-family="system-ui, sans-serif">
  <title>The flow from a source tree to a user running an installed command: edit the source tree, run python -m build to produce an sdist and a wheel, create a virtual environment, install the wheel with pip, let import resolution find the installed copy in site-packages rather than the working directory, and run the console script the installer placed on the path; a dashed development branch shows pip install -e as the editable shortcut that points imports back at the source tree instead</title>
  <rect x="0" y="0" width="960" height="780" fill="#f8fafc"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">One package, from edit to somebody else running the command</text>

  <!-- Step 1 -->
  <rect x="300" y="56" width="360" height="62" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="480" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">1. Source tree, with pyproject.toml complete</text>
  <text x="480" y="102" text-anchor="middle" font-size="14" fill="#1a202c">name · version · requires-python · dependencies · project.scripts</text>

  <line x1="480" y1="120" x2="480" y2="146" stroke="#1a202c" stroke-width="2"/>
  <polygon points="480,152 474,140 486,140" fill="#1a202c"/>

  <!-- Step 2 -->
  <rect x="300" y="154" width="360" height="66" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="480" y="178" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">2. python -m build</text>
  <text x="480" y="199" text-anchor="middle" font-size="14" fill="#1a202c">frontend reads build-system, calls the backend it names</text>
  <text x="480" y="215" text-anchor="middle" font-size="14" font-style="italic" fill="#1d4ed8">by default in a fresh, isolated environment</text>

  <line x1="410" y1="222" x2="330" y2="252" stroke="#1a202c" stroke-width="2"/>
  <polygon points="324,255 333,246 337,257" fill="#1a202c"/>
  <line x1="550" y1="222" x2="630" y2="252" stroke="#1a202c" stroke-width="2"/>
  <polygon points="636,255 623,257 627,246" fill="#1a202c"/>

  <!-- Step 3: two artifacts -->
  <rect x="130" y="258" width="270" height="88" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="265" y="282" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">3a. sdist (.tar.gz)</text>
  <text x="265" y="303" text-anchor="middle" font-size="14" fill="#1a202c">the whole project, including tests</text>
  <text x="265" y="322" text-anchor="middle" font-size="14" fill="#1a202c">installing it means building it first</text>
  <text x="265" y="340" text-anchor="middle" font-size="14" font-style="italic" fill="#1d4ed8">runs the publisher's build code</text>

  <rect x="560" y="258" width="270" height="88" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="695" y="282" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">3b. wheel (.whl)</text>
  <text x="695" y="303" text-anchor="middle" font-size="14" fill="#1a202c">already built; a zip with dist-info</text>
  <text x="695" y="322" text-anchor="middle" font-size="14" fill="#1a202c">installing it means unpacking it</text>
  <text x="695" y="340" text-anchor="middle" font-size="14" font-style="italic" fill="#1d4ed8">fast, and inert</text>

  <line x1="265" y1="348" x2="440" y2="386" stroke="#1a202c" stroke-width="2"/>
  <polygon points="446,388 433,389 438,378" fill="#1a202c"/>
  <line x1="695" y1="348" x2="520" y2="386" stroke="#1a202c" stroke-width="2"/>
  <polygon points="514,388 522,378 527,389" fill="#1a202c"/>

  <!-- Step 4 -->
  <rect x="300" y="390" width="360" height="66" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="480" y="414" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">4. pip install, into a virtual environment</text>
  <text x="480" y="435" text-anchor="middle" font-size="14" fill="#1a202c">unpack into site-packages · resolve dependencies</text>
  <text x="480" y="451" text-anchor="middle" font-size="14" fill="#1a202c">read entry_points.txt · write a launcher into bin/</text>

  <line x1="480" y1="458" x2="480" y2="484" stroke="#1a202c" stroke-width="2"/>
  <polygon points="480,490 474,478 486,478" fill="#1a202c"/>

  <!-- Step 5: import resolution -->
  <rect x="230" y="492" width="500" height="118" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="480" y="516" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">5. import wordtally — which copy wins?</text>
  <text x="480" y="538" text-anchor="middle" font-size="14" fill="#1a202c">Python searches the working directory first, then site-packages.</text>
  <text x="246" y="562" font-size="14" fill="#1a202c">src layout:</text>
  <text x="360" y="562" font-size="14" fill="#1d4ed8">no importable package in the working directory</text>
  <text x="246" y="581" font-size="14" fill="#1a202c">so the answer is:</text>
  <text x="380" y="581" font-size="14" fill="#1d4ed8">site-packages/wordtally/__init__.py</text>
  <text x="480" y="602" text-anchor="middle" font-size="14" font-style="italic" fill="#1a202c">your tests now exercise exactly what a user receives</text>

  <line x1="480" y1="612" x2="480" y2="638" stroke="#1a202c" stroke-width="2"/>
  <polygon points="480,644 474,632 486,632" fill="#1a202c"/>

  <!-- Step 6 -->
  <rect x="300" y="646" width="360" height="62" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="480" y="670" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">6. The user types: wordtally count notes.txt</text>
  <text x="480" y="692" text-anchor="middle" font-size="14" fill="#1a202c">the launcher imports wordtally.cli and exits with what main returns</text>

  <!-- Editable branch -->
  <rect x="20" y="390" width="196" height="220" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="7 5" rx="8"/>
  <text x="118" y="414" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Development</text>
  <text x="118" y="433" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">shortcut</text>
  <text x="118" y="458" text-anchor="middle" font-size="14" fill="#1d4ed8">pip install -e .</text>
  <text x="118" y="480" text-anchor="middle" font-size="14" fill="#1a202c">skips steps 2 and 3</text>
  <text x="118" y="500" text-anchor="middle" font-size="14" fill="#1a202c">writes a .pth file that</text>
  <text x="118" y="518" text-anchor="middle" font-size="14" fill="#1a202c">points back at src/</text>
  <text x="118" y="542" text-anchor="middle" font-size="14" fill="#1a202c">edits apply at once,</text>
  <text x="118" y="560" text-anchor="middle" font-size="14" fill="#1a202c">no reinstall needed</text>
  <text x="118" y="584" text-anchor="middle" font-size="14" font-style="italic" fill="#1d4ed8">imports resolve to your</text>
  <text x="118" y="601" text-anchor="middle" font-size="14" font-style="italic" fill="#1d4ed8">tree, not to a copy</text>

  <line x1="216" y1="470" x2="292" y2="440" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="298,437 286,434 290,445" fill="#1d4ed8"/>
  <line x1="150" y1="386" x2="290" y2="200" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="294,195 288,207 299,203" fill="#1d4ed8"/>

  <!-- Failure note -->
  <rect x="744" y="390" width="196" height="220" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="8"/>
  <text x="842" y="414" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Where it breaks</text>
  <text x="842" y="440" text-anchor="middle" font-size="14" fill="#1a202c">no name or version:</text>
  <text x="842" y="457" text-anchor="middle" font-size="14" fill="#1d4ed8">step 2 refuses</text>
  <text x="842" y="482" text-anchor="middle" font-size="14" fill="#1a202c">no project.scripts:</text>
  <text x="842" y="499" text-anchor="middle" font-size="14" fill="#1d4ed8">step 6 has no command</text>
  <text x="842" y="524" text-anchor="middle" font-size="14" fill="#1a202c">data not declared:</text>
  <text x="842" y="541" text-anchor="middle" font-size="14" fill="#1d4ed8">it fails only for users</text>
  <text x="842" y="566" text-anchor="middle" font-size="14" fill="#1a202c">flat layout:</text>
  <text x="842" y="583" text-anchor="middle" font-size="14" fill="#1d4ed8">step 5 picks the wrong</text>
  <text x="842" y="600" text-anchor="middle" font-size="14" fill="#1d4ed8">copy, and says nothing</text>

  <line x1="740" y1="470" x2="668" y2="440" stroke="#1a202c" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="662,437 674,434 670,445" fill="#1a202c"/>

  <text x="480" y="740" text-anchor="middle" font-size="14" fill="#1a202c">Every step above is offline and local. Publishing to an index would sit after step 3, and nothing in this lesson's lab performs it.</text>
  <text x="480" y="762" text-anchor="middle" font-size="14" fill="#1a202c">A version number, once published, is permanent: a bad release is fixed by publishing a new version, never by replacing the old one.</text>
</svg>
