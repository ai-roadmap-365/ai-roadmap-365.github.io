<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two different workloads.">
  <title>Reading against writing</title>
  <style>
    .prefill-decode-bg   { fill: #f8fafc; }
    .prefill-decode-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prefill-decode-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prefill-decode-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prefill-decode-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prefill-decode-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prefill-decode-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prefill-decode-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .prefill-decode-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .prefill-decode-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .prefill-decode-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .prefill-decode-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .prefill-decode-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prefill-decode-row { opacity: 1; }
    .prefill-decode-r0 { animation-delay: 0.00s; }
    .prefill-decode-r1 { animation-delay: 0.45s; }
    .prefill-decode-r2 { animation-delay: 0.90s; }
    .prefill-decode-r3 { animation-delay: 1.35s; }
    .prefill-decode-r4 { animation-delay: 1.80s; }
    .prefill-decode-row { animation: prefill-decode-reveal 7.3s ease-in-out infinite; }
    @keyframes prefill-decode-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="prefill-decode-bg" width="980" height="390"/>
  <text class="prefill-decode-h1"  x="30" y="40">Reading against writing</text>
  <text class="prefill-decode-sub" x="30" y="64">Two different workloads.</text>
  <rect class="prefill-decode-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="prefill-decode-name" x="46" y="122">Reading the prompt</text>
  <text class="prefill-decode-desc" x="46" y="142">Parallel.</text>
  <text class="prefill-decode-desc prefill-decode-row prefill-decode-r0" x="46" y="182">All tokens processed at once</text>
  <text class="prefill-decode-desc prefill-decode-row prefill-decode-r1" x="46" y="216">Saturates the arithmetic units</text>
  <text class="prefill-decode-desc prefill-decode-row prefill-decode-r2" x="46" y="250">Compute bound</text>
  <text class="prefill-decode-desc prefill-decode-row prefill-decode-r3" x="46" y="284">Fast, even for long prompts</text>
  <text class="prefill-decode-desc prefill-decode-row prefill-decode-r4" x="46" y="318">And cheap per token</text>
  <rect class="prefill-decode-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="prefill-decode-name" x="526" y="122">Writing the response</text>
  <text class="prefill-decode-desc" x="526" y="142">Sequential.</text>
  <text class="prefill-decode-desc prefill-decode-row prefill-decode-r0" x="526" y="182">One token at a time, strictly</text>
  <text class="prefill-decode-desc prefill-decode-row prefill-decode-r1" x="526" y="216">Reads every parameter per token</text>
  <text class="prefill-decode-desc prefill-decode-row prefill-decode-r2" x="526" y="250">Memory-bandwidth bound</text>
  <text class="prefill-decode-desc prefill-decode-row prefill-decode-r3" x="526" y="284">Slow, and unavoidably so</text>
  <text class="prefill-decode-desc prefill-decode-row prefill-decode-r4" x="526" y="318">And several times more expensive</text>
  <text class="prefill-decode-sub" x="30" y="372">This asymmetry is why output tokens are priced higher than input tokens, and why a long prompt with a short answer is far cheaper than the reverse.</text>
</svg>
