<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="With gates, and without them.">
  <title>Changing a restaurant menu</title>
  <style>
    .menu-change-analogy-bg   { fill: #f8fafc; }
    .menu-change-analogy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .menu-change-analogy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .menu-change-analogy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .menu-change-analogy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .menu-change-analogy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .menu-change-analogy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .menu-change-analogy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .menu-change-analogy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .menu-change-analogy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .menu-change-analogy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .menu-change-analogy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .menu-change-analogy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .menu-change-analogy-row { opacity: 1; }
    .menu-change-analogy-r0 { animation-delay: 0.00s; }
    .menu-change-analogy-r1 { animation-delay: 0.45s; }
    .menu-change-analogy-r2 { animation-delay: 0.90s; }
    .menu-change-analogy-r3 { animation-delay: 1.35s; }
    .menu-change-analogy-r4 { animation-delay: 1.80s; }
    .menu-change-analogy-row { animation: menu-change-analogy-reveal 7.3s ease-in-out infinite; }
    @keyframes menu-change-analogy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="menu-change-analogy-bg" width="980" height="390"/>
  <text class="menu-change-analogy-h1"  x="30" y="40">Changing a restaurant menu</text>
  <text class="menu-change-analogy-sub" x="30" y="64">With gates, and without them.</text>
  <rect class="menu-change-analogy-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="menu-change-analogy-name" x="46" y="122">All at once</text>
  <text class="menu-change-analogy-desc" x="46" y="142">And the old menus are recycled.</text>
  <text class="menu-change-analogy-desc menu-change-analogy-row menu-change-analogy-r0" x="46" y="182">Print new menus, replace every one</text>
  <text class="menu-change-analogy-desc menu-change-analogy-row menu-change-analogy-r1" x="46" y="216">Discover mid-service the supplier failed</text>
  <text class="menu-change-analogy-desc menu-change-analogy-row menu-change-analogy-r2" x="46" y="250">Nothing can be served</text>
  <text class="menu-change-analogy-desc menu-change-analogy-row menu-change-analogy-r3" x="46" y="284">No way back — the old menus are gone</text>
  <text class="menu-change-analogy-desc menu-change-analogy-row menu-change-analogy-r4" x="46" y="318">A ruined night</text>
  <rect class="menu-change-analogy-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="menu-change-analogy-name" x="526" y="122">Staged</text>
  <text class="menu-change-analogy-desc" x="526" y="142">Four cheap checks.</text>
  <text class="menu-change-analogy-desc menu-change-analogy-row menu-change-analogy-r0" x="526" y="182">Confirm suppliers first — a phone call</text>
  <text class="menu-change-analogy-desc menu-change-analogy-row menu-change-analogy-r1" x="526" y="216">Cook each dish for staff — readiness</text>
  <text class="menu-change-analogy-desc menu-change-analogy-row menu-change-analogy-r2" x="526" y="250">Trial on a few tables — canary</text>
  <text class="menu-change-analogy-desc menu-change-analogy-row menu-change-analogy-r3" x="526" y="284">Keep the old menus reachable</text>
  <text class="menu-change-analogy-desc menu-change-analogy-row menu-change-analogy-r4" x="526" y="318">A bad hour at worst</text>
  <text class="menu-change-analogy-sub" x="30" y="372">"Can the kitchen make this?" and "is the kitchen open?" are the readiness and liveness questions, and a restaurant that only asks the second serves nothing all evening.</text>
</svg>
