<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what to do regardless.">
  <title>When to curate formally</title>
  <style>
    .dataset-when-bg   { fill: #f8fafc; }
    .dataset-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataset-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataset-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataset-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataset-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataset-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dataset-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dataset-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dataset-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dataset-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dataset-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dataset-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dataset-when-row { opacity: 1; }
    .dataset-when-r0 { animation-delay: 0.00s; }
    .dataset-when-r1 { animation-delay: 0.45s; }
    .dataset-when-r2 { animation-delay: 0.90s; }
    .dataset-when-r3 { animation-delay: 1.35s; }
    .dataset-when-r4 { animation-delay: 1.80s; }
    .dataset-when-row { animation: dataset-when-reveal 7.3s ease-in-out infinite; }
    @keyframes dataset-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="dataset-when-bg" width="980" height="390"/>
  <text class="dataset-when-h1"  x="30" y="40">When to curate formally</text>
  <text class="dataset-when-sub" x="30" y="64">And what to do regardless.</text>
  <rect class="dataset-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="dataset-when-name" x="46" y="122">Curate it</text>
  <text class="dataset-when-desc" x="46" y="142">Before any decision.</text>
  <text class="dataset-when-desc dataset-when-row dataset-when-r0" x="46" y="182">Before architecture decisions</text>
  <text class="dataset-when-desc dataset-when-row dataset-when-r1" x="46" y="216">Before switching model providers</text>
  <text class="dataset-when-desc dataset-when-row dataset-when-r2" x="46" y="250">Before deploying a prompt change</text>
  <text class="dataset-when-desc dataset-when-row dataset-when-r3" x="46" y="284">Any customer-facing system</text>
  <text class="dataset-when-desc dataset-when-row dataset-when-r4" x="46" y="318">Anywhere a regression would matter</text>
  <rect class="dataset-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="dataset-when-name" x="526" y="122">Regardless</text>
  <text class="dataset-when-desc" x="526" y="142">Three cheap habits.</text>
  <text class="dataset-when-desc dataset-when-row dataset-when-r0" x="526" y="182">Scrub PII before storing anything</text>
  <text class="dataset-when-desc dataset-when-row dataset-when-r1" x="526" y="216">Version the file; never mutate a baseline</text>
  <text class="dataset-when-desc dataset-when-row dataset-when-r2" x="526" y="250">Keep every failure you encounter</text>
  <text class="dataset-when-desc dataset-when-row dataset-when-r3" x="526" y="284">Even for a prototype</text>
  <text class="dataset-when-desc dataset-when-row dataset-when-r4" x="526" y="318">It becomes the dataset later</text>
  <text class="dataset-when-sub" x="30" y="372">Versioning matters more than it appears: mutating a released baseline in place destroys the historical record, and with it the ability to say whether anything has improved.</text>
</svg>
