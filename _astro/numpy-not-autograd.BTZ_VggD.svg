<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two boundaries.">
  <title>What the NumPy engine is not</title>
  <style>
    .numpy-not-autograd-bg   { fill: #f8fafc; }
    .numpy-not-autograd-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .numpy-not-autograd-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .numpy-not-autograd-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .numpy-not-autograd-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .numpy-not-autograd-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .numpy-not-autograd-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .numpy-not-autograd-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .numpy-not-autograd-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .numpy-not-autograd-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .numpy-not-autograd-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .numpy-not-autograd-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .numpy-not-autograd-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .numpy-not-autograd-row { opacity: 1; }
    .numpy-not-autograd-r0 { animation-delay: 0.00s; }
    .numpy-not-autograd-r1 { animation-delay: 0.45s; }
    .numpy-not-autograd-r2 { animation-delay: 0.90s; }
    .numpy-not-autograd-r3 { animation-delay: 1.35s; }
    .numpy-not-autograd-r4 { animation-delay: 1.80s; }
    .numpy-not-autograd-row { animation: numpy-not-autograd-reveal 7.3s ease-in-out infinite; }
    @keyframes numpy-not-autograd-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="numpy-not-autograd-bg" width="980" height="390"/>
  <text class="numpy-not-autograd-h1"  x="30" y="40">What the NumPy engine is not</text>
  <text class="numpy-not-autograd-sub" x="30" y="64">Two boundaries.</text>
  <rect class="numpy-not-autograd-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="numpy-not-autograd-name" x="46" y="122">What it is</text>
  <text class="numpy-not-autograd-desc" x="46" y="142">A complete engine.</text>
  <text class="numpy-not-autograd-desc numpy-not-autograd-row numpy-not-autograd-r0" x="46" y="182">Trains arbitrary multi-layer architectures</text>
  <text class="numpy-not-autograd-desc numpy-not-autograd-row numpy-not-autograd-r1" x="46" y="216">Vectorised through BLAS level 3</text>
  <text class="numpy-not-autograd-desc numpy-not-autograd-row numpy-not-autograd-r2" x="46" y="250">Explicit analytical gradients</text>
  <text class="numpy-not-autograd-desc numpy-not-autograd-row numpy-not-autograd-r3" x="46" y="284">Fully inspectable at every step</text>
  <text class="numpy-not-autograd-desc numpy-not-autograd-row numpy-not-autograd-r4" x="46" y="318">Correct, and educational</text>
  <rect class="numpy-not-autograd-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="numpy-not-autograd-name" x="526" y="122">What it is not</text>
  <text class="numpy-not-autograd-desc" x="526" y="142">Two limits.</text>
  <text class="numpy-not-autograd-desc numpy-not-autograd-row numpy-not-autograd-r0" x="526" y="182">Not GPU-accelerated — host CPU only</text>
  <text class="numpy-not-autograd-desc numpy-not-autograd-row numpy-not-autograd-r1" x="526" y="216">Not an autograd framework</text>
  <text class="numpy-not-autograd-desc numpy-not-autograd-row numpy-not-autograd-r2" x="526" y="250">Gradients are hand-derived per layer</text>
  <text class="numpy-not-autograd-desc numpy-not-autograd-row numpy-not-autograd-r3" x="526" y="284">A new layer type means new equations</text>
  <text class="numpy-not-autograd-desc numpy-not-autograd-row numpy-not-autograd-r4" x="526" y="318">Which is precisely what autograd removes</text>
  <text class="numpy-not-autograd-sub" x="30" y="372">The second limit is what makes frameworks worth their weight: adding a layer type to this engine is a calculus exercise, and adding one to an autograd framework is a forward function.</text>
</svg>
