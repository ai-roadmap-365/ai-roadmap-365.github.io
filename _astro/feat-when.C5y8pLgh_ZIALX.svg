<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to engineer features</title>
  <style>
    .feat-when-bg   { fill: #f8fafc; }
    .feat-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feat-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feat-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feat-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feat-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .feat-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .feat-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .feat-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .feat-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .feat-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .feat-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .feat-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .feat-when-row { opacity: 1; }
    .feat-when-r0 { animation-delay: 0.00s; }
    .feat-when-r1 { animation-delay: 0.45s; }
    .feat-when-r2 { animation-delay: 0.90s; }
    .feat-when-r3 { animation-delay: 1.35s; }
    .feat-when-r4 { animation-delay: 1.80s; }
    .feat-when-row { animation: feat-when-reveal 7.3s ease-in-out infinite; }
    @keyframes feat-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="feat-when-bg" width="980" height="390"/>
  <text class="feat-when-h1"  x="30" y="40">When to engineer features</text>
  <text class="feat-when-sub" x="30" y="64">And when not to.</text>
  <rect class="feat-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="feat-when-name" x="46" y="122">Engineer them</text>
  <text class="feat-when-desc" x="46" y="142">Four cases.</text>
  <text class="feat-when-desc feat-when-row feat-when-r0" x="46" y="182">Tabular data</text>
  <text class="feat-when-desc feat-when-row feat-when-r1" x="46" y="216">Domain knowledge available</text>
  <text class="feat-when-desc feat-when-row feat-when-r2" x="46" y="250">Limited training data</text>
  <text class="feat-when-desc feat-when-row feat-when-r3" x="46" y="284">Where interpretability matters</text>
  <text class="feat-when-desc feat-when-row feat-when-r4" x="46" y="318">Time-based aggregations</text>
  <rect class="feat-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="feat-when-name" x="526" y="122">Less useful</text>
  <text class="feat-when-desc" x="526" y="142">Also four.</text>
  <text class="feat-when-desc feat-when-row feat-when-r0" x="526" y="182">Images and audio</text>
  <text class="feat-when-desc feat-when-row feat-when-r1" x="526" y="216">Text with a modern model</text>
  <text class="feat-when-desc feat-when-row feat-when-r2" x="526" y="250">Very large training sets</text>
  <text class="feat-when-desc feat-when-row feat-when-r3" x="526" y="284">Where the model learns interactions itself</text>
  <text class="feat-when-desc feat-when-row feat-when-r4" x="526" y="318">Adding features without evaluating them</text>
  <text class="feat-when-sub" x="30" y="372">Adding features without evaluating them is worth naming as a failure mode, since an unevaluated feature is as likely to hurt as to help.</text>
</svg>
