<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four reasons.">
  <title>Why fewer features</title>
  <style>
    .selection-idea-bg   { fill: #f8fafc; }
    .selection-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .selection-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .selection-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .selection-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .selection-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .selection-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .selection-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .selection-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .selection-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .selection-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .selection-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .selection-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .selection-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .selection-idea-stage { opacity: 1; }

    .selection-idea-s0 { animation-delay: 0.00s; }
    .selection-idea-e0 { animation-delay: 0.00s; }
    .selection-idea-s1 { animation-delay: 1.28s; }
    .selection-idea-e1 { animation-delay: 1.28s; }
    .selection-idea-s2 { animation-delay: 2.56s; }
    .selection-idea-e2 { animation-delay: 2.56s; }
    .selection-idea-s3 { animation-delay: 3.84s; }
    .selection-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .selection-idea-conn  { animation: selection-idea-trace 6.4s ease-in-out infinite; }
      .selection-idea-stage { animation: selection-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes selection-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes selection-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .selection-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .selection-idea-stage { animation: selection-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes selection-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="selection-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="selection-idea-bg" width="980" height="322"/>
  <text class="selection-idea-h1"  x="30" y="40">Why fewer features</text>
  <text class="selection-idea-sub" x="30" y="64">Four reasons.</text>
  <g class="selection-idea-stage selection-idea-s0">
    <rect class="selection-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="selection-idea-step" x="44" y="142">01</text>
    <text class="selection-idea-name" x="70" y="142">Irrelevant features add variance</text>
    <text class="selection-idea-desc" x="44" y="166">The model fits noise in them.</text>
  </g>
  <line class="selection-idea-line selection-idea-conn selection-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#selection-idea-tip)"/>
  <g class="selection-idea-stage selection-idea-s1">
    <rect class="selection-idea-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="selection-idea-step" x="280" y="142">02</text>
    <text class="selection-idea-name" x="306" y="142">And they cost compute at training and serving</text>
    <text class="selection-idea-desc" x="280" y="166">Every one, on every prediction.</text>
  </g>
  <line class="selection-idea-line selection-idea-conn selection-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#selection-idea-tip)"/>
  <g class="selection-idea-stage selection-idea-s2">
    <rect class="selection-idea-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="selection-idea-step" x="516" y="142">03</text>
    <text class="selection-idea-name" x="542" y="142">Fewer features are easier to explain</text>
    <text class="selection-idea-desc" x="516" y="166">And to defend.</text>
  </g>
  <line class="selection-idea-line selection-idea-conn selection-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#selection-idea-tip)"/>
  <g class="selection-idea-stage selection-idea-s3">
    <rect class="selection-idea-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="selection-idea-step" x="752" y="142">04</text>
    <text class="selection-idea-name" x="778" y="142">And easier to monitor for drift</text>
    <text class="selection-idea-desc" x="752" y="166">Which is an ongoing operational</text>
    <text class="selection-idea-desc" x="752" y="182">cost.</text>
  </g>
  <text class="selection-idea-sub" x="30" y="304">The monitoring cost is the one that is felt in production: every feature is a data source that can break, drift or disappear, and each one needs watching.</text>
</svg>
