<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Old, and still everywhere.">
  <title>Four steps for k-means</title>
  <style>
    .kmeans-history-bg   { fill: #f8fafc; }
    .kmeans-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kmeans-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kmeans-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kmeans-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kmeans-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kmeans-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kmeans-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .kmeans-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .kmeans-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .kmeans-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .kmeans-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .kmeans-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .kmeans-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .kmeans-history-stage { opacity: 1; }

    .kmeans-history-s0 { animation-delay: 0.00s; }
    .kmeans-history-e0 { animation-delay: 0.00s; }
    .kmeans-history-s1 { animation-delay: 1.28s; }
    .kmeans-history-e1 { animation-delay: 1.28s; }
    .kmeans-history-s2 { animation-delay: 2.56s; }
    .kmeans-history-e2 { animation-delay: 2.56s; }
    .kmeans-history-s3 { animation-delay: 3.84s; }
    .kmeans-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .kmeans-history-conn  { animation: kmeans-history-trace 6.4s ease-in-out infinite; }
      .kmeans-history-stage { animation: kmeans-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes kmeans-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes kmeans-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .kmeans-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .kmeans-history-stage { animation: kmeans-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes kmeans-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="kmeans-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="kmeans-history-bg" width="980" height="322"/>
  <text class="kmeans-history-h1"  x="30" y="40">Four steps for k-means</text>
  <text class="kmeans-history-sub" x="30" y="64">Old, and still everywhere.</text>
  <g class="kmeans-history-stage kmeans-history-s0">
    <rect class="kmeans-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="kmeans-history-step" x="44" y="142">01</text>
    <text class="kmeans-history-name" x="70" y="142">Developed for signal quantisation</text>
    <text class="kmeans-history-desc" x="44" y="166">Before clustering was a field.</text>
  </g>
  <line class="kmeans-history-line kmeans-history-conn kmeans-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#kmeans-history-tip)"/>
  <g class="kmeans-history-stage kmeans-history-s1">
    <rect class="kmeans-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="kmeans-history-step" x="280" y="142">02</text>
    <text class="kmeans-history-name" x="306" y="142">Rediscovered independently several times</text>
    <text class="kmeans-history-desc" x="280" y="166">Which is a sign the idea is</text>
    <text class="kmeans-history-desc" x="280" y="182">natural.</text>
  </g>
  <line class="kmeans-history-line kmeans-history-conn kmeans-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#kmeans-history-tip)"/>
  <g class="kmeans-history-stage kmeans-history-s2">
    <rect class="kmeans-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="kmeans-history-step" x="516" y="142">03</text>
    <text class="kmeans-history-name" x="542" y="142">Then careful seeding gave it a quality guarantee</text>
    <text class="kmeans-history-desc" x="516" y="166">Which had been missing for</text>
    <text class="kmeans-history-desc" x="516" y="182">decades.</text>
  </g>
  <line class="kmeans-history-line kmeans-history-conn kmeans-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#kmeans-history-tip)"/>
  <g class="kmeans-history-stage kmeans-history-s3">
    <rect class="kmeans-history-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="kmeans-history-step" x="752" y="142">04</text>
    <text class="kmeans-history-name" x="778" y="142">And it now underlies audio and image tokenisation</text>
    <text class="kmeans-history-desc" x="752" y="166">Which is its largest current</text>
    <text class="kmeans-history-desc" x="752" y="182">use.</text>
  </g>
  <text class="kmeans-history-sub" x="30" y="304">Its origin in signal quantisation is why it reappears in generative audio: turning a continuous signal into discrete codes is the problem it was built for.</text>
</svg>
