<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A tool call is a request, not an instruction.">
  <title>The model proposes; your code disposes</title>
  <style>
    .tool-call-validation-bg   { fill: #f8fafc; }
    .tool-call-validation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-call-validation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-call-validation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-call-validation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-call-validation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-call-validation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tool-call-validation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tool-call-validation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tool-call-validation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tool-call-validation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tool-call-validation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tool-call-validation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tool-call-validation-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tool-call-validation-stage { opacity: 1; }

    .tool-call-validation-s0 { animation-delay: 0.00s; }
    .tool-call-validation-e0 { animation-delay: 0.00s; }
    .tool-call-validation-s1 { animation-delay: 1.28s; }
    .tool-call-validation-e1 { animation-delay: 1.28s; }
    .tool-call-validation-s2 { animation-delay: 2.56s; }
    .tool-call-validation-e2 { animation-delay: 2.56s; }
    .tool-call-validation-s3 { animation-delay: 3.84s; }
    .tool-call-validation-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tool-call-validation-conn  { animation: tool-call-validation-trace 6.4s ease-in-out infinite; }
      .tool-call-validation-stage { animation: tool-call-validation-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tool-call-validation-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tool-call-validation-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tool-call-validation-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tool-call-validation-stage { animation: tool-call-validation-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tool-call-validation-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tool-call-validation-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tool-call-validation-bg" width="980" height="322"/>
  <text class="tool-call-validation-h1"  x="30" y="40">The model proposes; your code disposes</text>
  <text class="tool-call-validation-sub" x="30" y="64">A tool call is a request, not an instruction.</text>
  <g class="tool-call-validation-stage tool-call-validation-s0">
    <rect class="tool-call-validation-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tool-call-validation-step" x="44" y="142">01</text>
    <text class="tool-call-validation-name" x="70" y="142">The model proposes a call</text>
    <text class="tool-call-validation-desc" x="44" y="166">A tool name and arguments. Text,</text>
    <text class="tool-call-validation-desc" x="44" y="182">at this point, and nothing more.</text>
  </g>
  <line class="tool-call-validation-line tool-call-validation-conn tool-call-validation-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tool-call-validation-tip)"/>
  <g class="tool-call-validation-stage tool-call-validation-s1">
    <rect class="tool-call-validation-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tool-call-validation-step" x="280" y="142">02</text>
    <text class="tool-call-validation-name" x="306" y="142">Validate against the tool's schema</text>
    <text class="tool-call-validation-desc" x="280" y="166">Names, types, ranges. A</text>
    <text class="tool-call-validation-desc" x="280" y="182">malformed call is rejected, not</text>
    <text class="tool-call-validation-desc" x="280" y="198">executed.</text>
    <text class="tool-call-validation-edge" x="280" y="242">schema</text>
  </g>
  <line class="tool-call-validation-line tool-call-validation-conn tool-call-validation-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tool-call-validation-tip)"/>
  <g class="tool-call-validation-stage tool-call-validation-s2">
    <rect class="tool-call-validation-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tool-call-validation-step" x="516" y="142">03</text>
    <text class="tool-call-validation-name" x="542" y="142">Check it is permitted</text>
    <text class="tool-call-validation-desc" x="516" y="166">Least privilege — this agent,</text>
    <text class="tool-call-validation-desc" x="516" y="182">this tool, these arguments.</text>
  </g>
  <line class="tool-call-validation-line tool-call-validation-conn tool-call-validation-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tool-call-validation-tip)"/>
  <g class="tool-call-validation-stage tool-call-validation-s3">
    <rect class="tool-call-validation-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tool-call-validation-step" x="752" y="142">04</text>
    <text class="tool-call-validation-name" x="778" y="142">Execute, and treat the result as untrusted</text>
    <text class="tool-call-validation-desc" x="752" y="166">A fetched document can contain</text>
    <text class="tool-call-validation-desc" x="752" y="182">instructions. It is data.</text>
    <text class="tool-call-validation-edge" x="752" y="242">data</text>
  </g>
  <text class="tool-call-validation-sub" x="30" y="304">The fourth step is the one most often missed: content returned by a tool enters the next prompt, so a retrieved page carrying "ignore previous instructions" is an injection vector by design.</text>
</svg>
