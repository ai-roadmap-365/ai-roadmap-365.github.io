<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which is where the speed comes from.">
  <title>Overlapping compute and communication</title>
  <style>
    .ddp-overlap-bg   { fill: #f8fafc; }
    .ddp-overlap-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ddp-overlap-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ddp-overlap-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ddp-overlap-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ddp-overlap-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ddp-overlap-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ddp-overlap-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ddp-overlap-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ddp-overlap-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ddp-overlap-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ddp-overlap-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ddp-overlap-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .ddp-overlap-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .ddp-overlap-stage { opacity: 1; }

    .ddp-overlap-s0 { animation-delay: 0.00s; }
    .ddp-overlap-e0 { animation-delay: 0.00s; }
    .ddp-overlap-s1 { animation-delay: 1.28s; }
    .ddp-overlap-e1 { animation-delay: 1.28s; }
    .ddp-overlap-s2 { animation-delay: 2.56s; }
    .ddp-overlap-e2 { animation-delay: 2.56s; }
    .ddp-overlap-s3 { animation-delay: 3.84s; }
    .ddp-overlap-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .ddp-overlap-conn  { animation: ddp-overlap-trace 6.4s ease-in-out infinite; }
      .ddp-overlap-stage { animation: ddp-overlap-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes ddp-overlap-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes ddp-overlap-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .ddp-overlap-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ddp-overlap-stage { animation: ddp-overlap-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes ddp-overlap-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ddp-overlap-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="ddp-overlap-bg" width="980" height="322"/>
  <text class="ddp-overlap-h1"  x="30" y="40">Overlapping compute and communication</text>
  <text class="ddp-overlap-sub" x="30" y="64">Which is where the speed comes from.</text>
  <g class="ddp-overlap-stage ddp-overlap-s0">
    <rect class="ddp-overlap-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="ddp-overlap-step" x="44" y="142">01</text>
    <text class="ddp-overlap-name" x="70" y="142">Naively, finish the backward pass first</text>
    <text class="ddp-overlap-desc" x="44" y="166">Then send all the gradients at</text>
    <text class="ddp-overlap-desc" x="44" y="182">once.</text>
  </g>
  <line class="ddp-overlap-line ddp-overlap-conn ddp-overlap-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#ddp-overlap-tip)"/>
  <g class="ddp-overlap-stage ddp-overlap-s1">
    <rect class="ddp-overlap-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="ddp-overlap-step" x="280" y="142">02</text>
    <text class="ddp-overlap-name" x="306" y="142">Which leaves the network idle, then the devices idle</text>
    <text class="ddp-overlap-desc" x="280" y="166">Two phases, neither overlapping.</text>
  </g>
  <line class="ddp-overlap-line ddp-overlap-conn ddp-overlap-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#ddp-overlap-tip)"/>
  <g class="ddp-overlap-stage ddp-overlap-s2">
    <rect class="ddp-overlap-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="ddp-overlap-step" x="516" y="142">03</text>
    <text class="ddp-overlap-name" x="542" y="142">Group gradients into buckets</text>
    <text class="ddp-overlap-desc" x="516" y="166">A bucket is sent as soon as it</text>
    <text class="ddp-overlap-desc" x="516" y="182">is complete.</text>
  </g>
  <line class="ddp-overlap-line ddp-overlap-conn ddp-overlap-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#ddp-overlap-tip)"/>
  <g class="ddp-overlap-stage ddp-overlap-s3">
    <rect class="ddp-overlap-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="ddp-overlap-step" x="752" y="142">04</text>
    <text class="ddp-overlap-name" x="778" y="142">So later layers compute while earlier ones transmit</text>
    <text class="ddp-overlap-desc" x="752" y="166">Communication largely disappears</text>
    <text class="ddp-overlap-desc" x="752" y="182">into the backward pass.</text>
  </g>
  <text class="ddp-overlap-sub" x="30" y="304">The backward pass produces gradients for later layers first, which is exactly the ordering needed to start sending while the rest is still being computed.</text>
</svg>
