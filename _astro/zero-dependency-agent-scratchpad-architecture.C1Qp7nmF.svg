<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img">
  <title>Zero Dependency Agent Scratchpad Architecture</title>
  <defs>
    <style>
      .d291a-bg { fill: #f8fafc; }
      .d291a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d291a-prompt { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d291a-scratch { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 8px; }
      .d291a-tools { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d291a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d291a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d291a-node-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
      .d291a-node-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
      .d291a-flow { stroke: #64748b; stroke-width: 2px; stroke-dasharray: 6,4; fill: none; animation: d291a-p 3s linear infinite; }
      @keyframes d291a-p { to { stroke-dashoffset: -20; } }
      @media (prefers-reduced-motion: reduce) { .d291a-flow { animation: none; } }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d291a-bg" />
  
  <text x="40" y="40" class="d291a-title">Zero-Dependency Agent Scratchpad Architecture</text>
  <text x="40" y="65" class="d291a-subtitle">Zero Dependency Agent Scratchpad Architecture illustrating System Prompt, Dynamic Scratchpad Buffer, Tool Registry, and Execution Dispatcher</text>
  
  <!-- System Prompt & Tools Header -->
  <rect x="40" y="110" width="240" height="150" class="d291a-prompt" />
  <text x="55" y="135" class="d291a-node-title" fill="#1d4ed8">1. Base System Context</text>
  <text x="55" y="155" class="d291a-node-desc">• Role: Autonomous Researcher</text>
  <text x="55" y="170" class="d291a-node-desc">• Tool Definitions (JSON Schema)</text>
  <text x="55" y="185" class="d291a-node-desc">• ReAct Formatting Directives</text>
  <text x="55" y="200" class="d291a-node-desc">• Stopping Condition Predicates</text>
  <text x="55" y="215" class="d291a-node-desc">• Safety / Privacy Constraints</text>
  
  <!-- Dynamic Scratchpad -->
  <rect x="330" y="110" width="240" height="320" class="d291a-scratch" />
  <text x="345" y="135" class="d291a-node-title" fill="#a16207">2. Dynamic Scratchpad</text>
  <text x="345" y="160" class="d291a-node-desc" font-weight="600">Turn 1:</text>
  <text x="345" y="175" class="d291a-node-desc">Thought: Find latest stats</text>
  <text x="345" y="190" class="d291a-node-desc">Action: search(q="revenue")</text>
  <text x="345" y="205" class="d291a-node-desc">Observation: "Rev: $4.2B"</text>
  <text x="345" y="235" class="d291a-node-desc" font-weight="600">Turn 2:</text>
  <text x="345" y="250" class="d291a-node-desc">Thought: Calculate margin</text>
  <text x="345" y="265" class="d291a-node-desc">Action: calc("4.2 / 12")</text>
  <text x="345" y="280" class="d291a-node-desc">Observation: "0.35"</text>
  <text x="345" y="310" class="d291a-node-desc" font-weight="600">Turn 3 (Current):</text>
  <text x="345" y="325" class="d291a-node-desc">Thought: Goal reached</text>
  <text x="345" y="340" class="d291a-node-desc">Final Answer: 35% margin</text>
  
  <!-- Tool Sandbox -->
  <rect x="620" y="110" width="240" height="320" class="d291a-tools" />
  <text x="635" y="135" class="d291a-node-title" fill="#15803d">3. Tool Execution Registry</text>
  <text x="635" y="160" class="d291a-node-desc">• calculate(expr: str)</text>
  <text x="635" y="180" class="d291a-node-desc">• search_kb(query: str)</text>
  <text x="635" y="200" class="d291a-node-desc">• store_fact(k: str, v: str)</text>
  <text x="635" y="220" class="d291a-node-desc">• get_fact(k: str)</text>
  <text x="635" y="260" class="d291a-node-title" fill="#15803d">Security Layer</text>
  <text x="635" y="285" class="d291a-node-desc">• In-process isolated scopes</text>
  <text x="635" y="300" class="d291a-node-desc">• Zero external network leaks</text>
  <text x="635" y="315" class="d291a-node-desc">• Execution duration timer</text>
  
  <!-- Flow Lines -->
  <path d="M 280 185 L 330 185" class="d291a-flow" />
  <path d="M 570 200 L 620 200" class="d291a-flow" />
  <path d="M 620 280 L 570 280" class="d291a-flow" stroke="#22c55e" />
</svg>