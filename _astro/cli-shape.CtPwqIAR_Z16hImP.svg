<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four parts.">
  <title>The shape of a command-line tool</title>
  <style>
    .cli-shape-bg   { fill: #f8fafc; }
    .cli-shape-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-shape-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-shape-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-shape-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-shape-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-shape-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cli-shape-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cli-shape-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cli-shape-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cli-shape-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cli-shape-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cli-shape-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cli-shape-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cli-shape-stage { opacity: 1; }

    .cli-shape-s0 { animation-delay: 0.00s; }
    .cli-shape-e0 { animation-delay: 0.00s; }
    .cli-shape-s1 { animation-delay: 1.28s; }
    .cli-shape-e1 { animation-delay: 1.28s; }
    .cli-shape-s2 { animation-delay: 2.56s; }
    .cli-shape-e2 { animation-delay: 2.56s; }
    .cli-shape-s3 { animation-delay: 3.84s; }
    .cli-shape-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cli-shape-conn  { animation: cli-shape-trace 6.4s ease-in-out infinite; }
      .cli-shape-stage { animation: cli-shape-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cli-shape-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cli-shape-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cli-shape-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cli-shape-stage { animation: cli-shape-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cli-shape-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cli-shape-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cli-shape-bg" width="980" height="322"/>
  <text class="cli-shape-h1"  x="30" y="40">The shape of a command-line tool</text>
  <text class="cli-shape-sub" x="30" y="64">Four parts.</text>
  <g class="cli-shape-stage cli-shape-s0">
    <rect class="cli-shape-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cli-shape-step" x="44" y="142">01</text>
    <text class="cli-shape-name" x="70" y="142">Parse the arguments</text>
    <text class="cli-shape-desc" x="44" y="166">Validating them before anything</text>
    <text class="cli-shape-desc" x="44" y="182">else runs.</text>
  </g>
  <line class="cli-shape-line cli-shape-conn cli-shape-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cli-shape-tip)"/>
  <g class="cli-shape-stage cli-shape-s1">
    <rect class="cli-shape-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cli-shape-step" x="280" y="142">02</text>
    <text class="cli-shape-name" x="306" y="142">Dispatch to the right operation</text>
    <text class="cli-shape-desc" x="280" y="166">Which is the command the user</text>
    <text class="cli-shape-desc" x="280" y="182">asked for.</text>
  </g>
  <line class="cli-shape-line cli-shape-conn cli-shape-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cli-shape-tip)"/>
  <g class="cli-shape-stage cli-shape-s2">
    <rect class="cli-shape-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cli-shape-step" x="516" y="142">03</text>
    <text class="cli-shape-name" x="542" y="142">Do the work, reading and writing state</text>
    <text class="cli-shape-desc" x="516" y="166">Which is the only part specific</text>
    <text class="cli-shape-desc" x="516" y="182">to your tool.</text>
  </g>
  <line class="cli-shape-line cli-shape-conn cli-shape-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cli-shape-tip)"/>
  <g class="cli-shape-stage cli-shape-s3">
    <rect class="cli-shape-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cli-shape-step" x="752" y="142">04</text>
    <text class="cli-shape-name" x="778" y="142">Then report: output, and an exit code</text>
    <text class="cli-shape-desc" x="752" y="166">Which is what other programs</text>
    <text class="cli-shape-desc" x="752" y="182">read.</text>
  </g>
  <text class="cli-shape-sub" x="30" y="304">The exit code is the part beginners omit and scripts depend on: a tool that always exits successfully cannot be used in a pipeline.</text>
</svg>
