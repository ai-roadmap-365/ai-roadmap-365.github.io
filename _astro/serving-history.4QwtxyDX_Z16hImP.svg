<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward standard patterns.">
  <title>Four steps in model serving</title>
  <style>
    .serving-history-bg   { fill: #f8fafc; }
    .serving-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serving-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serving-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serving-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serving-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serving-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .serving-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .serving-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .serving-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .serving-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .serving-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .serving-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .serving-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .serving-history-stage { opacity: 1; }

    .serving-history-s0 { animation-delay: 0.00s; }
    .serving-history-e0 { animation-delay: 0.00s; }
    .serving-history-s1 { animation-delay: 1.28s; }
    .serving-history-e1 { animation-delay: 1.28s; }
    .serving-history-s2 { animation-delay: 2.56s; }
    .serving-history-e2 { animation-delay: 2.56s; }
    .serving-history-s3 { animation-delay: 3.84s; }
    .serving-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .serving-history-conn  { animation: serving-history-trace 6.4s ease-in-out infinite; }
      .serving-history-stage { animation: serving-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes serving-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes serving-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .serving-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .serving-history-stage { animation: serving-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes serving-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="serving-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="serving-history-bg" width="980" height="322"/>
  <text class="serving-history-h1"  x="30" y="40">Four steps in model serving</text>
  <text class="serving-history-sub" x="30" y="64">Toward standard patterns.</text>
  <g class="serving-history-stage serving-history-s0">
    <rect class="serving-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="serving-history-step" x="44" y="142">01</text>
    <text class="serving-history-name" x="70" y="142">Batch scoring overnight</text>
    <text class="serving-history-desc" x="44" y="166">Which was all that was possible,</text>
    <text class="serving-history-desc" x="44" y="182">and often sufficient.</text>
  </g>
  <line class="serving-history-line serving-history-conn serving-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#serving-history-tip)"/>
  <g class="serving-history-stage serving-history-s1">
    <rect class="serving-history-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="serving-history-step" x="280" y="142">02</text>
    <text class="serving-history-name" x="306" y="142">Bespoke services, written per model</text>
    <text class="serving-history-desc" x="280" y="166">Each with its own contract and</text>
    <text class="serving-history-desc" x="280" y="182">failure modes.</text>
  </g>
  <line class="serving-history-line serving-history-conn serving-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#serving-history-tip)"/>
  <g class="serving-history-stage serving-history-s2">
    <rect class="serving-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="serving-history-step" x="516" y="142">03</text>
    <text class="serving-history-name" x="542" y="142">Standard serving frameworks</text>
    <text class="serving-history-desc" x="516" y="166">With batching, versioning and</text>
    <text class="serving-history-desc" x="516" y="182">health checks built in.</text>
  </g>
  <line class="serving-history-line serving-history-conn serving-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#serving-history-tip)"/>
  <g class="serving-history-stage serving-history-s3">
    <rect class="serving-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="serving-history-step" x="752" y="142">04</text>
    <text class="serving-history-name" x="778" y="142">And managed endpoints</text>
    <text class="serving-history-desc" x="752" y="166">Where the infrastructure is</text>
    <text class="serving-history-desc" x="752" y="182">somebody else's problem.</text>
  </g>
  <text class="serving-history-sub" x="30" y="304">Batch scoring is still the right answer more often than it is used, and reaching for a real-time endpoint when a nightly job would do adds cost and failure modes for nothing.</text>
</svg>
