<svg role="img" aria-label="End to end sentiment analysis system engineering pipeline architecture from text ingestion to explainability and REST API" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>End-to-End Sentiment Analysis System Architecture</title>
  <defs>
    <linearGradient id="bg224a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card224" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg224a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">END-TO-END SENTIMENT ANALYSIS SYSTEM PIPELINE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">From Ingestion, Vocabulary Collation, and BiLSTM-Attention Modeling to Model Explainability</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card224)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Step 1: Text Ingestion & Cleaning -->
    <rect x="25" y="25" width="125" height="245" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="87" y="48" fill="#38bdf8" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">1. Ingestion</text>
    <rect x="35" y="65" width="105" height="190" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="87" y="85" fill="#f8fafc" font-size="8" font-weight="700" text-anchor="middle">Raw Reviews</text>
    <text x="87" y="110" fill="#cbd5e1" font-size="7" text-anchor="middle">• Regex Cleanup</text>
    <text x="87" y="130" fill="#cbd5e1" font-size="7" text-anchor="middle">• Emoji Decoding</text>
    <text x="87" y="150" fill="#cbd5e1" font-size="7" text-anchor="middle">• Lowercasing</text>
    <text x="87" y="170" fill="#cbd5e1" font-size="7" text-anchor="middle">• Min Freq = 3</text>
    <text x="87" y="190" fill="#cbd5e1" font-size="7" text-anchor="middle">• Vocab = 25,000</text>
    <text x="87" y="235" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">Token Indices</text>

    <!-- Step 2: DataLoader & Collate -->
    <rect x="170" y="25" width="125" height="245" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="232" y="48" fill="#fbbf24" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">2. Data Pipeline</text>
    <rect x="180" y="65" width="105" height="190" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="232" y="85" fill="#f8fafc" font-size="8" font-weight="700" text-anchor="middle">Dynamic Batch</text>
    <text x="232" y="110" fill="#cbd5e1" font-size="7" text-anchor="middle">• Dynamic Collate</text>
    <text x="232" y="130" fill="#cbd5e1" font-size="7" text-anchor="middle">• Pad to Batch Max</text>
    <text x="232" y="150" fill="#cbd5e1" font-size="7" text-anchor="middle">• Attention Masks</text>
    <text x="232" y="170" fill="#cbd5e1" font-size="7" text-anchor="middle">• Class Stratification</text>
    <text x="232" y="190" fill="#cbd5e1" font-size="7" text-anchor="middle">• Train / Val / Test</text>
    <text x="232" y="235" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">GPU Tensors</text>

    <!-- Step 3: Model Candidates -->
    <rect x="315" y="25" width="145" height="245" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" rx="6"/>
    <text x="387" y="48" fill="#c084fc" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">3. Model Hub</text>
    <rect x="325" y="65" width="125" height="55" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="387" y="85" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">EmbeddingBag</text>
    <text x="387" y="102" fill="#94a3b8" font-size="7" text-anchor="middle">Fused Mean Pooling</text>

    <rect x="325" y="130" width="125" height="55" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="387" y="150" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">TextCNN (k=3,4,5)</text>
    <text x="387" y="167" fill="#94a3b8" font-size="7" text-anchor="middle">Multi-Scale 1D Conv</text>

    <rect x="325" y="195" width="125" height="60" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="387" y="215" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">BiLSTM + Attention</text>
    <text x="387" y="235" fill="#94a3b8" font-size="7" text-anchor="middle">Contextual Pooling</text>

    <!-- Step 4: Evaluation Metrics -->
    <rect x="480" y="25" width="125" height="245" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" rx="6"/>
    <text x="542" y="48" fill="#fb7185" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">4. Evaluation</text>
    <rect x="490" y="65" width="105" height="190" fill="#1e293b" stroke="#f43f5e" rx="4"/>
    <text x="542" y="85" fill="#f8fafc" font-size="8" font-weight="700" text-anchor="middle">Comprehensive</text>
    <text x="542" y="110" fill="#cbd5e1" font-size="7" text-anchor="middle">• Macro F1-Score</text>
    <text x="542" y="130" fill="#cbd5e1" font-size="7" text-anchor="middle">• ROC-AUC Curve</text>
    <text x="542" y="150" fill="#cbd5e1" font-size="7" text-anchor="middle">• Confusion Matrix</text>
    <text x="542" y="170" fill="#cbd5e1" font-size="7" text-anchor="middle">• Calibration ECE</text>
    <text x="542" y="190" fill="#cbd5e1" font-size="7" text-anchor="middle">• Latency Profiling</text>
    <text x="542" y="235" fill="#fb7185" font-size="8" font-weight="700" text-anchor="middle">Model Card</text>

    <!-- Step 5: Explainability & Serving -->
    <rect x="625" y="25" width="115" height="245" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="682" y="48" fill="#34d399" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">5. Serving</text>
    <rect x="635" y="65" width="95" height="190" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="682" y="85" fill="#f8fafc" font-size="8" font-weight="700" text-anchor="middle">Inference &amp; XAI</text>
    <text x="682" y="110" fill="#cbd5e1" font-size="7" text-anchor="middle">• Token Attrib</text>
    <text x="682" y="130" fill="#cbd5e1" font-size="7" text-anchor="middle">• Word Saliency</text>
    <text x="682" y="150" fill="#cbd5e1" font-size="7" text-anchor="middle">• Fast API App</text>
    <text x="682" y="170" fill="#cbd5e1" font-size="7" text-anchor="middle">• Batching Queue</text>
    <text x="682" y="190" fill="#cbd5e1" font-size="7" text-anchor="middle">• ONNX Runtime</text>
    <text x="682" y="235" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Live API</text>
  </g>
</svg>
