<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="All at once produces a wall of errors nobody reads.">
  <title>Adding types to a codebase that has none</title>
  <style>
    .gradual-typing-bg   { fill: #f8fafc; }
    .gradual-typing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradual-typing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradual-typing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradual-typing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradual-typing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradual-typing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gradual-typing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gradual-typing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gradual-typing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gradual-typing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gradual-typing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gradual-typing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .gradual-typing-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .gradual-typing-stage { opacity: 1; }

    .gradual-typing-s0 { animation-delay: 0.00s; }
    .gradual-typing-e0 { animation-delay: 0.00s; }
    .gradual-typing-s1 { animation-delay: 1.28s; }
    .gradual-typing-e1 { animation-delay: 1.28s; }
    .gradual-typing-s2 { animation-delay: 2.56s; }
    .gradual-typing-e2 { animation-delay: 2.56s; }
    .gradual-typing-s3 { animation-delay: 3.84s; }
    .gradual-typing-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .gradual-typing-conn  { animation: gradual-typing-trace 6.4s ease-in-out infinite; }
      .gradual-typing-stage { animation: gradual-typing-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes gradual-typing-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes gradual-typing-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .gradual-typing-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .gradual-typing-stage { animation: gradual-typing-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes gradual-typing-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="gradual-typing-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="gradual-typing-bg" width="980" height="322"/>
  <text class="gradual-typing-h1"  x="30" y="40">Adding types to a codebase that has none</text>
  <text class="gradual-typing-sub" x="30" y="64">All at once produces a wall of errors nobody reads.</text>
  <g class="gradual-typing-stage gradual-typing-s0">
    <rect class="gradual-typing-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="gradual-typing-step" x="44" y="142">01</text>
    <text class="gradual-typing-name" x="70" y="142">Enable it in permissive mode</text>
    <text class="gradual-typing-desc" x="44" y="166">Almost nothing is reported. The</text>
    <text class="gradual-typing-desc" x="44" y="182">point is that it runs at all.</text>
    <text class="gradual-typing-edge" x="44" y="242">day one</text>
  </g>
  <line class="gradual-typing-line gradual-typing-conn gradual-typing-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#gradual-typing-tip)"/>
  <g class="gradual-typing-stage gradual-typing-s1">
    <rect class="gradual-typing-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="gradual-typing-step" x="280" y="142">02</text>
    <text class="gradual-typing-name" x="306" y="142">Pick one module and type it</text>
    <text class="gradual-typing-desc" x="280" y="166">Preferably one at a boundary,</text>
    <text class="gradual-typing-desc" x="280" y="182">where wrong values enter.</text>
  </g>
  <line class="gradual-typing-line gradual-typing-conn gradual-typing-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#gradual-typing-tip)"/>
  <g class="gradual-typing-stage gradual-typing-s2">
    <rect class="gradual-typing-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="gradual-typing-step" x="516" y="142">03</text>
    <text class="gradual-typing-name" x="542" y="142">Make that module strict</text>
    <text class="gradual-typing-desc" x="516" y="166">Per-module configuration, so the</text>
    <text class="gradual-typing-desc" x="516" y="182">rest of the codebase is</text>
    <text class="gradual-typing-desc" x="516" y="198">unaffected.</text>
    <text class="gradual-typing-edge" x="516" y="242">one at a time</text>
  </g>
  <line class="gradual-typing-line gradual-typing-conn gradual-typing-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#gradual-typing-tip)"/>
  <g class="gradual-typing-stage gradual-typing-s3">
    <rect class="gradual-typing-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="gradual-typing-step" x="752" y="142">04</text>
    <text class="gradual-typing-name" x="778" y="142">Add it to CI as a gate</text>
    <text class="gradual-typing-desc" x="752" y="166">So the typed portion cannot</text>
    <text class="gradual-typing-desc" x="752" y="182">regress while you widen it.</text>
  </g>
  <text class="gradual-typing-sub" x="30" y="304">Enabling strict checking everywhere on day one produces thousands of errors, which get suppressed in bulk — leaving you with the configuration and none of the benefit.</text>
</svg>
