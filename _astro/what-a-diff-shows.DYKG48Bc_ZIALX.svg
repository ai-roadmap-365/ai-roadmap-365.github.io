<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Lines, not intent.">
  <title>What a diff shows, and what it cannot</title>
  <style>
    .what-a-diff-shows-bg   { fill: #f8fafc; }
    .what-a-diff-shows-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-a-diff-shows-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-a-diff-shows-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-a-diff-shows-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-a-diff-shows-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-a-diff-shows-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .what-a-diff-shows-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .what-a-diff-shows-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .what-a-diff-shows-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .what-a-diff-shows-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .what-a-diff-shows-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .what-a-diff-shows-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .what-a-diff-shows-row { opacity: 1; }
    .what-a-diff-shows-r0 { animation-delay: 0.00s; }
    .what-a-diff-shows-r1 { animation-delay: 0.45s; }
    .what-a-diff-shows-r2 { animation-delay: 0.90s; }
    .what-a-diff-shows-r3 { animation-delay: 1.35s; }
    .what-a-diff-shows-r4 { animation-delay: 1.80s; }
    .what-a-diff-shows-row { animation: what-a-diff-shows-reveal 7.3s ease-in-out infinite; }
    @keyframes what-a-diff-shows-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="what-a-diff-shows-bg" width="980" height="390"/>
  <text class="what-a-diff-shows-h1"  x="30" y="40">What a diff shows, and what it cannot</text>
  <text class="what-a-diff-shows-sub" x="30" y="64">Lines, not intent.</text>
  <rect class="what-a-diff-shows-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="what-a-diff-shows-name" x="46" y="122">The diff tells you</text>
  <text class="what-a-diff-shows-desc" x="46" y="142">Mechanically, and completely.</text>
  <text class="what-a-diff-shows-desc what-a-diff-shows-row what-a-diff-shows-r0" x="46" y="182">Which lines were added</text>
  <text class="what-a-diff-shows-desc what-a-diff-shows-row what-a-diff-shows-r1" x="46" y="216">Which were removed</text>
  <text class="what-a-diff-shows-desc what-a-diff-shows-row what-a-diff-shows-r2" x="46" y="250">In which files</text>
  <text class="what-a-diff-shows-desc what-a-diff-shows-row what-a-diff-shows-r3" x="46" y="284">In which commit, by whom</text>
  <text class="what-a-diff-shows-desc what-a-diff-shows-row what-a-diff-shows-r4" x="46" y="318">Everything about WHAT changed</text>
  <rect class="what-a-diff-shows-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="what-a-diff-shows-name" x="526" y="122">Only the message tells you</text>
  <text class="what-a-diff-shows-desc" x="526" y="142">And only if someone wrote it.</text>
  <text class="what-a-diff-shows-desc what-a-diff-shows-row what-a-diff-shows-r0" x="526" y="182">Why the change was needed</text>
  <text class="what-a-diff-shows-desc what-a-diff-shows-row what-a-diff-shows-r1" x="526" y="216">What was tried and rejected</text>
  <text class="what-a-diff-shows-desc what-a-diff-shows-row what-a-diff-shows-r2" x="526" y="250">What constraint forced this approach</text>
  <text class="what-a-diff-shows-desc what-a-diff-shows-row what-a-diff-shows-r3" x="526" y="284">What will break if it is reverted</text>
  <text class="what-a-diff-shows-desc what-a-diff-shows-row what-a-diff-shows-r4" x="526" y="318">Everything about WHY</text>
  <text class="what-a-diff-shows-sub" x="30" y="372">This is the whole case for commit messages: a machine can reconstruct the left column forever, and nobody can reconstruct the right one once the person who knew has forgotten.</text>
</svg>
