<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The code already shows how.">
  <title>A docstring says what and why</title>
  <style>
    .docstring-what-not-how-bg   { fill: #f8fafc; }
    .docstring-what-not-how-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docstring-what-not-how-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docstring-what-not-how-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docstring-what-not-how-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docstring-what-not-how-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docstring-what-not-how-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .docstring-what-not-how-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .docstring-what-not-how-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .docstring-what-not-how-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .docstring-what-not-how-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .docstring-what-not-how-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .docstring-what-not-how-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .docstring-what-not-how-row { opacity: 1; }
    .docstring-what-not-how-r0 { animation-delay: 0.00s; }
    .docstring-what-not-how-r1 { animation-delay: 0.45s; }
    .docstring-what-not-how-r2 { animation-delay: 0.90s; }
    .docstring-what-not-how-r3 { animation-delay: 1.35s; }
    .docstring-what-not-how-r4 { animation-delay: 1.80s; }
    .docstring-what-not-how-row { animation: docstring-what-not-how-reveal 7.3s ease-in-out infinite; }
    @keyframes docstring-what-not-how-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="docstring-what-not-how-bg" width="980" height="390"/>
  <text class="docstring-what-not-how-h1"  x="30" y="40">A docstring says what and why</text>
  <text class="docstring-what-not-how-sub" x="30" y="64">The code already shows how.</text>
  <rect class="docstring-what-not-how-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="docstring-what-not-how-name" x="46" y="122">Restates the code</text>
  <text class="docstring-what-not-how-desc" x="46" y="142">Goes stale, helps nobody.</text>
  <text class="docstring-what-not-how-desc docstring-what-not-how-row docstring-what-not-how-r0" x="46" y="182">"Loops over rows and sums amount"</text>
  <text class="docstring-what-not-how-desc docstring-what-not-how-row docstring-what-not-how-r1" x="46" y="216">The code already said that</text>
  <text class="docstring-what-not-how-desc docstring-what-not-how-row docstring-what-not-how-r2" x="46" y="250">Drifts the moment the loop changes</text>
  <text class="docstring-what-not-how-desc docstring-what-not-how-row docstring-what-not-how-r3" x="46" y="284">Nothing forces it to be updated</text>
  <text class="docstring-what-not-how-desc docstring-what-not-how-row docstring-what-not-how-r4" x="46" y="318">A reader learns nothing new</text>
  <rect class="docstring-what-not-how-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="docstring-what-not-how-name" x="526" y="122">States what and why</text>
  <text class="docstring-what-not-how-desc" x="526" y="142">The part the code cannot say.</text>
  <text class="docstring-what-not-how-desc docstring-what-not-how-row docstring-what-not-how-r0" x="526" y="182">"Total in minor units; rows may be empty"</text>
  <text class="docstring-what-not-how-desc docstring-what-not-how-row docstring-what-not-how-r1" x="526" y="216">Names the precondition and the unit</text>
  <text class="docstring-what-not-how-desc docstring-what-not-how-row docstring-what-not-how-r2" x="526" y="250">Explains a decision that looks odd</text>
  <text class="docstring-what-not-how-desc docstring-what-not-how-row docstring-what-not-how-r3" x="526" y="284">Points at the constraint that forced it</text>
  <text class="docstring-what-not-how-desc docstring-what-not-how-row docstring-what-not-how-r4" x="526" y="318">Still true after a refactor</text>
  <text class="docstring-what-not-how-sub" x="30" y="372">The test is whether a reader could have worked it out from the body. If they could, the line is decoration; if they could not — a unit, a precondition, a reason — it is the only place that information exists.</text>
</svg>
