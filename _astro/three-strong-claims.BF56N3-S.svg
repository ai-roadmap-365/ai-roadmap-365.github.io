<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And never invent a number.">
  <title>Three strong claims beat twelve weak ones</title>
  <style>
    .three-strong-claims-bg   { fill: #f8fafc; }
    .three-strong-claims-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-strong-claims-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-strong-claims-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-strong-claims-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-strong-claims-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-strong-claims-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-strong-claims-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-strong-claims-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-strong-claims-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-strong-claims-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-strong-claims-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-strong-claims-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-strong-claims-row { opacity: 1; }
    .three-strong-claims-r0 { animation-delay: 0.00s; }
    .three-strong-claims-r1 { animation-delay: 0.45s; }
    .three-strong-claims-r2 { animation-delay: 0.90s; }
    .three-strong-claims-r3 { animation-delay: 1.35s; }
    .three-strong-claims-r4 { animation-delay: 1.80s; }
    .three-strong-claims-row { animation: three-strong-claims-reveal 7.3s ease-in-out infinite; }
    @keyframes three-strong-claims-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="three-strong-claims-bg" width="980" height="390"/>
  <text class="three-strong-claims-h1"  x="30" y="40">Three strong claims beat twelve weak ones</text>
  <text class="three-strong-claims-sub" x="30" y="64">And never invent a number.</text>
  <rect class="three-strong-claims-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="three-strong-claims-name" x="46" y="122">Do</text>
  <text class="three-strong-claims-desc" x="46" y="142">Mostly about timing.</text>
  <text class="three-strong-claims-desc three-strong-claims-row three-strong-claims-r0" x="46" y="182">Write claims while the work is fresh</text>
  <text class="three-strong-claims-desc three-strong-claims-row three-strong-claims-r1" x="46" y="216">Record the before-value now</text>
  <text class="three-strong-claims-desc three-strong-claims-row three-strong-claims-r2" x="46" y="250">Check them before anyone reads them</text>
  <text class="three-strong-claims-desc three-strong-claims-row three-strong-claims-r3" x="46" y="284">Order by strongest first</text>
  <text class="three-strong-claims-desc three-strong-claims-row three-strong-claims-r4" x="46" y="318">Three strong claims, not twelve weak</text>
  <rect class="three-strong-claims-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="three-strong-claims-name" x="526" y="122">Never</text>
  <text class="three-strong-claims-desc" x="526" y="142">One is unrecoverable.</text>
  <text class="three-strong-claims-desc three-strong-claims-row three-strong-claims-r0" x="526" y="182">Do not manufacture a measurement</text>
  <text class="three-strong-claims-desc three-strong-claims-row three-strong-claims-r1" x="526" y="216">Say what you did without a number instead</text>
  <text class="three-strong-claims-desc three-strong-claims-row three-strong-claims-r2" x="526" y="250">A fabricated metric is discoverable</text>
  <text class="three-strong-claims-desc three-strong-claims-row three-strong-claims-r3" x="526" y="284">And it is dishonest</text>
  <text class="three-strong-claims-desc three-strong-claims-row three-strong-claims-r4" x="526" y="318">One is worse than none</text>
  <text class="three-strong-claims-sub" x="30" y="372">The before-value is the item that genuinely cannot be recovered: three months later the system is faster and nobody wrote down what it used to be, so the claim is unmakeable rather than merely weak.</text>
</svg>
