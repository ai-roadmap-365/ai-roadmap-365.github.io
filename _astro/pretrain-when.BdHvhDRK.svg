<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Almost never.">
  <title>When to pretrain</title>
  <style>
    .pretrain-when-bg   { fill: #f8fafc; }
    .pretrain-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pretrain-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pretrain-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pretrain-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pretrain-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pretrain-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pretrain-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pretrain-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pretrain-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pretrain-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pretrain-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pretrain-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pretrain-when-row { opacity: 1; }
    .pretrain-when-r0 { animation-delay: 0.00s; }
    .pretrain-when-r1 { animation-delay: 0.45s; }
    .pretrain-when-r2 { animation-delay: 0.90s; }
    .pretrain-when-r3 { animation-delay: 1.35s; }
    .pretrain-when-r4 { animation-delay: 1.80s; }
    .pretrain-when-row { animation: pretrain-when-reveal 7.3s ease-in-out infinite; }
    @keyframes pretrain-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="pretrain-when-bg" width="980" height="390"/>
  <text class="pretrain-when-h1"  x="30" y="40">When to pretrain</text>
  <text class="pretrain-when-sub" x="30" y="64">Almost never.</text>
  <rect class="pretrain-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="pretrain-when-name" x="46" y="122">Pretrain</text>
  <text class="pretrain-when-desc" x="46" y="142">Four narrow cases.</text>
  <text class="pretrain-when-desc pretrain-when-row pretrain-when-r0" x="46" y="182">A language with no good existing model</text>
  <text class="pretrain-when-desc pretrain-when-row pretrain-when-r1" x="46" y="216">A domain unlike natural text entirely</text>
  <text class="pretrain-when-desc pretrain-when-row pretrain-when-r2" x="46" y="250">Research into the training process itself</text>
  <text class="pretrain-when-desc pretrain-when-row pretrain-when-r3" x="46" y="284">Where the data cannot be shared at all</text>
  <text class="pretrain-when-desc pretrain-when-row pretrain-when-r4" x="46" y="318">And the budget runs to eight figures</text>
  <rect class="pretrain-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="pretrain-when-name" x="526" y="122">Do something else</text>
  <text class="pretrain-when-desc" x="526" y="142">Almost always.</text>
  <text class="pretrain-when-desc pretrain-when-row pretrain-when-r0" x="526" y="182">Continued pretraining on a base model</text>
  <text class="pretrain-when-desc pretrain-when-row pretrain-when-r1" x="526" y="216">Fine-tuning for a specific task</text>
  <text class="pretrain-when-desc pretrain-when-row pretrain-when-r2" x="526" y="250">Retrieval for domain knowledge</text>
  <text class="pretrain-when-desc pretrain-when-row pretrain-when-r3" x="526" y="284">Prompting a hosted model</text>
  <text class="pretrain-when-desc pretrain-when-row pretrain-when-r4" x="526" y="318">All orders of magnitude cheaper</text>
  <text class="pretrain-when-sub" x="30" y="372">Continued pretraining is the option most teams should reach for and most overlook: it captures most of the domain benefit for a small fraction of the cost.</text>
</svg>
