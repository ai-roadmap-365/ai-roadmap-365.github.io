<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are subtle.">
  <title>Four consequences of the loss choice</title>
  <style>
    .loss-implications-bg   { fill: #f8fafc; }
    .loss-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .loss-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .loss-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .loss-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .loss-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .loss-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .loss-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .loss-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .loss-implications-stage { opacity: 1; }

    .loss-implications-s0 { animation-delay: 0.00s; }
    .loss-implications-e0 { animation-delay: 0.00s; }
    .loss-implications-s1 { animation-delay: 1.28s; }
    .loss-implications-e1 { animation-delay: 1.28s; }
    .loss-implications-s2 { animation-delay: 2.56s; }
    .loss-implications-e2 { animation-delay: 2.56s; }
    .loss-implications-s3 { animation-delay: 3.84s; }
    .loss-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .loss-implications-conn  { animation: loss-implications-trace 6.4s ease-in-out infinite; }
      .loss-implications-stage { animation: loss-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes loss-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes loss-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .loss-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .loss-implications-stage { animation: loss-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes loss-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="loss-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="loss-implications-bg" width="980" height="322"/>
  <text class="loss-implications-h1"  x="30" y="40">Four consequences of the loss choice</text>
  <text class="loss-implications-sub" x="30" y="64">Two are subtle.</text>
  <g class="loss-implications-stage loss-implications-s0">
    <rect class="loss-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="loss-implications-step" x="44" y="142">01</text>
    <text class="loss-implications-name" x="70" y="142">It decides how much outliers move the fit</text>
    <text class="loss-implications-desc" x="44" y="166">Which is the visible effect.</text>
  </g>
  <line class="loss-implications-line loss-implications-conn loss-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#loss-implications-tip)"/>
  <g class="loss-implications-stage loss-implications-s1">
    <rect class="loss-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="loss-implications-step" x="280" y="142">02</text>
    <text class="loss-implications-name" x="306" y="142">And trades efficiency on clean data for that robustness</text>
    <text class="loss-implications-desc" x="280" y="166">There is no free choice here.</text>
  </g>
  <line class="loss-implications-line loss-implications-conn loss-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#loss-implications-tip)"/>
  <g class="loss-implications-stage loss-implications-s2">
    <rect class="loss-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="loss-implications-step" x="516" y="142">03</text>
    <text class="loss-implications-name" x="542" y="142">While solvability differs: closed form or iteration</text>
    <text class="loss-implications-desc" x="516" y="166">Which matters at scale.</text>
  </g>
  <line class="loss-implications-line loss-implications-conn loss-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#loss-implications-tip)"/>
  <g class="loss-implications-stage loss-implications-s3">
    <rect class="loss-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="loss-implications-step" x="752" y="142">04</text>
    <text class="loss-implications-name" x="778" y="142">And the loss should reflect the real cost of an error</text>
    <text class="loss-implications-desc" x="752" y="166">Which the default rarely does.</text>
  </g>
  <text class="loss-implications-sub" x="30" y="304">The last point generalises to every model in this curriculum: the default loss encodes an assumption about error costs that nobody stated.</text>
</svg>
