<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Memorise these and paths stop being guesswork.">
  <title>Four symbols do most of the navigating</title>
  <style>
    .path-symbols-bg   { fill: #f8fafc; }
    .path-symbols-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .path-symbols-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .path-symbols-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .path-symbols-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .path-symbols-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .path-symbols-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .path-symbols-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .path-symbols-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .path-symbols-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .path-symbols-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .path-symbols-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .path-symbols-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .path-symbols-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .path-symbols-stage { opacity: 1; }

    .path-symbols-s0 { animation-delay: 0.00s; }
    .path-symbols-e0 { animation-delay: 0.00s; }
    .path-symbols-s1 { animation-delay: 1.28s; }
    .path-symbols-e1 { animation-delay: 1.28s; }
    .path-symbols-s2 { animation-delay: 2.56s; }
    .path-symbols-e2 { animation-delay: 2.56s; }
    .path-symbols-s3 { animation-delay: 3.84s; }
    .path-symbols-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .path-symbols-conn  { animation: path-symbols-trace 6.4s ease-in-out infinite; }
      .path-symbols-stage { animation: path-symbols-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes path-symbols-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes path-symbols-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .path-symbols-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .path-symbols-stage { animation: path-symbols-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes path-symbols-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="path-symbols-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="path-symbols-bg" width="980" height="322"/>
  <text class="path-symbols-h1"  x="30" y="40">Four symbols do most of the navigating</text>
  <text class="path-symbols-sub" x="30" y="64">Memorise these and paths stop being guesswork.</text>
  <g class="path-symbols-stage path-symbols-s0">
    <rect class="path-symbols-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="path-symbols-step" x="44" y="142">01</text>
    <text class="path-symbols-name" x="70" y="142">/</text>
    <text class="path-symbols-desc" x="44" y="166">Root when it starts a path; a</text>
    <text class="path-symbols-desc" x="44" y="182">separator between names anywhere</text>
    <text class="path-symbols-desc" x="44" y="198">else.</text>
    <text class="path-symbols-edge" x="44" y="242">root</text>
  </g>
  <line class="path-symbols-line path-symbols-conn path-symbols-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#path-symbols-tip)"/>
  <g class="path-symbols-stage path-symbols-s1">
    <rect class="path-symbols-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="path-symbols-step" x="280" y="142">02</text>
    <text class="path-symbols-name" x="306" y="142">.</text>
    <text class="path-symbols-desc" x="280" y="166">Here — the current working</text>
    <text class="path-symbols-desc" x="280" y="182">directory.</text>
    <text class="path-symbols-edge" x="280" y="242">here</text>
  </g>
  <line class="path-symbols-line path-symbols-conn path-symbols-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#path-symbols-tip)"/>
  <g class="path-symbols-stage path-symbols-s2">
    <rect class="path-symbols-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="path-symbols-step" x="516" y="142">03</text>
    <text class="path-symbols-name" x="542" y="142">..</text>
    <text class="path-symbols-desc" x="516" y="166">One level up — the parent</text>
    <text class="path-symbols-desc" x="516" y="182">directory.</text>
    <text class="path-symbols-edge" x="516" y="242">up</text>
  </g>
  <line class="path-symbols-line path-symbols-conn path-symbols-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#path-symbols-tip)"/>
  <g class="path-symbols-stage path-symbols-s3">
    <rect class="path-symbols-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="path-symbols-step" x="752" y="142">04</text>
    <text class="path-symbols-name" x="778" y="142">~</text>
    <text class="path-symbols-desc" x="752" y="166">Your home directory, wherever</text>
    <text class="path-symbols-desc" x="752" y="182">that actually is.</text>
    <text class="path-symbols-edge" x="752" y="242">home</text>
  </g>
  <text class="path-symbols-sub" x="30" y="304">From inside projects, .. means alice, ../.. means home, and ./data means the same as data — the ./ just says "starting from here".</text>
</svg>
