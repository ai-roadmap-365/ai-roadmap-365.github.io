<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From optics to augmentation.">
  <title>Four steps in image transformation</title>
  <style>
    .image-history-bg   { fill: #f8fafc; }
    .image-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .image-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .image-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .image-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .image-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .image-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .image-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .image-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .image-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .image-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .image-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .image-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .image-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .image-history-stage { opacity: 1; }

    .image-history-s0 { animation-delay: 0.00s; }
    .image-history-e0 { animation-delay: 0.00s; }
    .image-history-s1 { animation-delay: 1.28s; }
    .image-history-e1 { animation-delay: 1.28s; }
    .image-history-s2 { animation-delay: 2.56s; }
    .image-history-e2 { animation-delay: 2.56s; }
    .image-history-s3 { animation-delay: 3.84s; }
    .image-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .image-history-conn  { animation: image-history-trace 6.4s ease-in-out infinite; }
      .image-history-stage { animation: image-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes image-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes image-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .image-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .image-history-stage { animation: image-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes image-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="image-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="image-history-bg" width="980" height="322"/>
  <text class="image-history-h1"  x="30" y="40">Four steps in image transformation</text>
  <text class="image-history-sub" x="30" y="64">From optics to augmentation.</text>
  <g class="image-history-stage image-history-s0">
    <rect class="image-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="image-history-step" x="44" y="142">01</text>
    <text class="image-history-name" x="70" y="142">Done optically, with lenses and enlargers</text>
    <text class="image-history-desc" x="44" y="166">Before images were numbers.</text>
  </g>
  <line class="image-history-line image-history-conn image-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#image-history-tip)"/>
  <g class="image-history-stage image-history-s1">
    <rect class="image-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="image-history-step" x="280" y="142">02</text>
    <text class="image-history-name" x="306" y="142">Then digitally, which raised the resampling question</text>
    <text class="image-history-desc" x="280" y="166">Which optics never had.</text>
  </g>
  <line class="image-history-line image-history-conn image-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#image-history-tip)"/>
  <g class="image-history-stage image-history-s2">
    <rect class="image-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="image-history-step" x="516" y="142">03</text>
    <text class="image-history-name" x="542" y="142">Graphics hardware made it real-time</text>
    <text class="image-history-desc" x="516" y="166">Millions of transformed pixels</text>
    <text class="image-history-desc" x="516" y="182">per frame.</text>
  </g>
  <line class="image-history-line image-history-conn image-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#image-history-tip)"/>
  <g class="image-history-stage image-history-s3">
    <rect class="image-history-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="image-history-step" x="752" y="142">04</text>
    <text class="image-history-name" x="778" y="142">And it became data augmentation</text>
    <text class="image-history-desc" x="752" y="166">Multiplying a training set by</text>
    <text class="image-history-desc" x="752" y="182">transforming it.</text>
  </g>
  <text class="image-history-sub" x="30" y="304">Augmentation is the same operation applied for an entirely different purpose: not to display an image, but to teach a model that a rotated cat is still a cat.</text>
</svg>
