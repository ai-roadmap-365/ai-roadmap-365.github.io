<svg role="img" aria-label="Parallel and recursive tool calling architecture diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Parallel &amp; Recursive Tool Calling Architecture</title>
  <defs>
    <linearGradient id="bg256b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card256b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg256b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">PARALLEL &amp; RECURSIVE TOOL CALLING</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Batching Independent Operations and Managing Multi-Turn Agentic Dependency Loops</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card256b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Parallel Tool Calling -->
    <rect x="25" y="25" width="340" height="245" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="195" y="50" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Parallel Tool Calling (Single Turn)</text>
    
    <rect x="35" y="70" width="320" height="40" fill="#1e293b" rx="4"/>
    <text x="45" y="88" fill="#38bdf8" font-size="8" font-weight="700">User:</text>
    <text x="80" y="88" fill="#cbd5e1" font-size="8">"Compare weather in Tokyo, London, and NYC"</text>

    <rect x="35" y="120" width="320" height="65" fill="#1e293b" rx="4"/>
    <text x="45" y="138" fill="#fbbf24" font-size="8" font-weight="700">Model emits 3 tool_use blocks in parallel:</text>
    <text x="45" y="152" fill="#cbd5e1" font-size="7">• Call 1: get_weather("Tokyo")</text>
    <text x="45" y="165" fill="#cbd5e1" font-size="7">• Call 2: get_weather("London")</text>
    <text x="45" y="178" fill="#cbd5e1" font-size="7">• Call 3: get_weather("NYC")</text>

    <text x="195" y="245" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Concurrent ThreadPool Dispatch</text>

    <!-- Recursive Multi-Step Loop -->
    <rect x="395" y="25" width="340" height="245" fill="#0f172a" stroke="#34d399" stroke-width="1.5" rx="6"/>
    <text x="565" y="50" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">Recursive Multi-Step Agent Loop</text>
    
    <rect x="405" y="70" width="320" height="35" fill="#1e293b" rx="4"/>
    <text x="415" y="88" fill="#34d399" font-size="8" font-weight="700">Step 1:</text>
    <text x="455" y="88" fill="#cbd5e1" font-size="7">query_db(user_id=102) -&gt; returns order_id=981</text>

    <rect x="405" y="115" width="320" height="35" fill="#1e293b" rx="4"/>
    <text x="415" y="133" fill="#34d399" font-size="8" font-weight="700">Step 2:</text>
    <text x="455" y="133" fill="#cbd5e1" font-size="7">fetch_shipping_status(order_id=981) -&gt; "Shipped"</text>

    <rect x="405" y="160" width="320" height="35" fill="#1e293b" rx="4"/>
    <text x="415" y="178" fill="#34d399" font-size="8" font-weight="700">Step 3:</text>
    <text x="455" y="178" fill="#cbd5e1" font-size="7">Synthesize final answer: "Your order 981 shipped."</text>

    <text x="565" y="245" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Bounded Loop (max_steps=5)</text>
  </g>
</svg>
