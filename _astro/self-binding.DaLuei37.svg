<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>How the instance is passed</title>
  <style>
    .self-binding-bg   { fill: #f8fafc; }
    .self-binding-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .self-binding-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .self-binding-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .self-binding-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .self-binding-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .self-binding-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .self-binding-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .self-binding-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .self-binding-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .self-binding-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .self-binding-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .self-binding-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .self-binding-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .self-binding-stage { opacity: 1; }

    .self-binding-s0 { animation-delay: 0.00s; }
    .self-binding-e0 { animation-delay: 0.00s; }
    .self-binding-s1 { animation-delay: 1.28s; }
    .self-binding-e1 { animation-delay: 1.28s; }
    .self-binding-s2 { animation-delay: 2.56s; }
    .self-binding-e2 { animation-delay: 2.56s; }
    .self-binding-s3 { animation-delay: 3.84s; }
    .self-binding-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .self-binding-conn  { animation: self-binding-trace 6.4s ease-in-out infinite; }
      .self-binding-stage { animation: self-binding-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes self-binding-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes self-binding-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .self-binding-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .self-binding-stage { animation: self-binding-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes self-binding-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="self-binding-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="self-binding-bg" width="980" height="322"/>
  <text class="self-binding-h1"  x="30" y="40">How the instance is passed</text>
  <text class="self-binding-sub" x="30" y="64">Four steps.</text>
  <g class="self-binding-stage self-binding-s0">
    <rect class="self-binding-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="self-binding-step" x="44" y="142">01</text>
    <text class="self-binding-name" x="70" y="142">Methods are defined on the class, once</text>
    <text class="self-binding-desc" x="44" y="166">Not copied per instance.</text>
  </g>
  <line class="self-binding-line self-binding-conn self-binding-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#self-binding-tip)"/>
  <g class="self-binding-stage self-binding-s1">
    <rect class="self-binding-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="self-binding-step" x="280" y="142">02</text>
    <text class="self-binding-name" x="306" y="142">Accessing one through an instance looks it up on the class</text>
    <text class="self-binding-desc" x="280" y="166">And wraps it.</text>
  </g>
  <line class="self-binding-line self-binding-conn self-binding-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#self-binding-tip)"/>
  <g class="self-binding-stage self-binding-s2">
    <rect class="self-binding-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="self-binding-step" x="516" y="142">03</text>
    <text class="self-binding-name" x="542" y="142">The wrapper remembers which instance it came from</text>
    <text class="self-binding-desc" x="516" y="166">Which is the bound method.</text>
  </g>
  <line class="self-binding-line self-binding-conn self-binding-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#self-binding-tip)"/>
  <g class="self-binding-stage self-binding-s3">
    <rect class="self-binding-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="self-binding-step" x="752" y="142">04</text>
    <text class="self-binding-name" x="778" y="142">So calling it passes that instance as the first argument</text>
    <text class="self-binding-desc" x="752" y="166">Which is why it is written</text>
    <text class="self-binding-desc" x="752" y="182">explicitly.</text>
  </g>
  <text class="self-binding-sub" x="30" y="304">The first parameter being explicit is a consequence of this mechanism rather than a stylistic choice, and it is why calling through the class requires passing it yourself.</text>
</svg>
