<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the question.">
  <title>Which diagnostic when</title>
  <style>
    .diagnostics-when-bg   { fill: #f8fafc; }
    .diagnostics-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diagnostics-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diagnostics-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diagnostics-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diagnostics-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diagnostics-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .diagnostics-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .diagnostics-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .diagnostics-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .diagnostics-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .diagnostics-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .diagnostics-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .diagnostics-when-row { opacity: 1; }
    .diagnostics-when-r0 { animation-delay: 0.00s; }
    .diagnostics-when-r1 { animation-delay: 0.45s; }
    .diagnostics-when-r2 { animation-delay: 0.90s; }
    .diagnostics-when-r3 { animation-delay: 1.35s; }
    .diagnostics-when-r4 { animation-delay: 1.80s; }
    .diagnostics-when-row { animation: diagnostics-when-reveal 7.3s ease-in-out infinite; }
    @keyframes diagnostics-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="diagnostics-when-bg" width="980" height="390"/>
  <text class="diagnostics-when-h1"  x="30" y="40">Which diagnostic when</text>
  <text class="diagnostics-when-sub" x="30" y="64">By the question.</text>
  <rect class="diagnostics-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="diagnostics-when-name" x="46" y="122">The question</text>
  <text class="diagnostics-when-desc" x="46" y="142">What you need to know.</text>
  <text class="diagnostics-when-desc diagnostics-when-row diagnostics-when-r0" x="46" y="182">Will more data help?</text>
  <text class="diagnostics-when-desc diagnostics-when-row diagnostics-when-r1" x="46" y="216">Is the model too simple or too complex?</text>
  <text class="diagnostics-when-desc diagnostics-when-row diagnostics-when-r2" x="46" y="250">What value should this parameter take?</text>
  <text class="diagnostics-when-desc diagnostics-when-row diagnostics-when-r3" x="46" y="284">Where is the model failing?</text>
  <text class="diagnostics-when-desc diagnostics-when-row diagnostics-when-r4" x="46" y="318">Have we reached the achievable limit?</text>
  <rect class="diagnostics-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="diagnostics-when-name" x="526" y="122">The diagnostic</text>
  <text class="diagnostics-when-desc" x="526" y="142">What to run.</text>
  <text class="diagnostics-when-desc diagnostics-when-row diagnostics-when-r0" x="526" y="182">A learning curve</text>
  <text class="diagnostics-when-desc diagnostics-when-row diagnostics-when-r1" x="526" y="216">The training-validation gap</text>
  <text class="diagnostics-when-desc diagnostics-when-row diagnostics-when-r2" x="526" y="250">A validation curve</text>
  <text class="diagnostics-when-desc diagnostics-when-row diagnostics-when-r3" x="526" y="284">Error analysis on the failures</text>
  <text class="diagnostics-when-desc diagnostics-when-row diagnostics-when-r4" x="526" y="318">Compare against the noise floor estimate</text>
  <text class="diagnostics-when-sub" x="30" y="372">Each of these costs compute rather than judgment, which is why running them is nearly always cheaper than the wrong decision they prevent.</text>
</svg>
