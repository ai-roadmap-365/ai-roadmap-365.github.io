<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Cheaper, smaller, or honest refusal.">
  <title>A fallback is a design decision</title>
  <style>
    .fallback-model-bg   { fill: #f8fafc; }
    .fallback-model-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fallback-model-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fallback-model-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fallback-model-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fallback-model-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fallback-model-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fallback-model-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fallback-model-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fallback-model-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fallback-model-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fallback-model-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fallback-model-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fallback-model-row { opacity: 1; }
    .fallback-model-r0 { animation-delay: 0.00s; }
    .fallback-model-r1 { animation-delay: 0.45s; }
    .fallback-model-r2 { animation-delay: 0.90s; }
    .fallback-model-r3 { animation-delay: 1.35s; }
    .fallback-model-r4 { animation-delay: 1.80s; }
    .fallback-model-row { animation: fallback-model-reveal 7.3s ease-in-out infinite; }
    @keyframes fallback-model-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="fallback-model-bg" width="980" height="390"/>
  <text class="fallback-model-h1"  x="30" y="40">A fallback is a design decision</text>
  <text class="fallback-model-sub" x="30" y="64">Cheaper, smaller, or honest refusal.</text>
  <rect class="fallback-model-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="fallback-model-name" x="46" y="122">Fall back to a smaller model</text>
  <text class="fallback-model-desc" x="46" y="142">Degraded, and still useful.</text>
  <text class="fallback-model-desc fallback-model-row fallback-model-r0" x="46" y="182">Answer quality drops, availability holds</text>
  <text class="fallback-model-desc fallback-model-row fallback-model-r1" x="46" y="216">Usually cheaper per call</text>
  <text class="fallback-model-desc fallback-model-row fallback-model-r2" x="46" y="250">Must satisfy the SAME schema</text>
  <text class="fallback-model-desc fallback-model-row fallback-model-r3" x="46" y="284">Log which model served the answer</text>
  <text class="fallback-model-desc fallback-model-row fallback-model-r4" x="46" y="318">Evaluate the fallback too, or it is untested</text>
  <rect class="fallback-model-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="fallback-model-name" x="526" y="122">Refuse honestly</text>
  <text class="fallback-model-desc" x="526" y="142">Correct when a wrong answer costs more.</text>
  <text class="fallback-model-desc fallback-model-row fallback-model-r0" x="526" y="182">"Unavailable, try shortly"</text>
  <text class="fallback-model-desc fallback-model-row fallback-model-r1" x="526" y="216">No risk of a confidently wrong answer</text>
  <text class="fallback-model-desc fallback-model-row fallback-model-r2" x="526" y="250">Right for anything consequential</text>
  <text class="fallback-model-desc fallback-model-row fallback-model-r3" x="526" y="284">Cheapest of all</text>
  <text class="fallback-model-desc fallback-model-row fallback-model-r4" x="526" y="318">Better than a silent degradation nobody sees</text>
  <text class="fallback-model-sub" x="30" y="372">The failure to avoid is a fallback nobody evaluates: a path that only runs during an incident, and is therefore only ever exercised when things are already going badly.</text>
</svg>
