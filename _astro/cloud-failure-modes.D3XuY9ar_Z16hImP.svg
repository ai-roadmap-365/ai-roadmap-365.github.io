<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each with a specific control.">
  <title>Four ways a cloud deploy fails</title>
  <style>
    .cloud-failure-modes-bg   { fill: #f8fafc; }
    .cloud-failure-modes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cloud-failure-modes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cloud-failure-modes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cloud-failure-modes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cloud-failure-modes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cloud-failure-modes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cloud-failure-modes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cloud-failure-modes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cloud-failure-modes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cloud-failure-modes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cloud-failure-modes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cloud-failure-modes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cloud-failure-modes-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cloud-failure-modes-stage { opacity: 1; }

    .cloud-failure-modes-s0 { animation-delay: 0.00s; }
    .cloud-failure-modes-e0 { animation-delay: 0.00s; }
    .cloud-failure-modes-s1 { animation-delay: 1.28s; }
    .cloud-failure-modes-e1 { animation-delay: 1.28s; }
    .cloud-failure-modes-s2 { animation-delay: 2.56s; }
    .cloud-failure-modes-e2 { animation-delay: 2.56s; }
    .cloud-failure-modes-s3 { animation-delay: 3.84s; }
    .cloud-failure-modes-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cloud-failure-modes-conn  { animation: cloud-failure-modes-trace 6.4s ease-in-out infinite; }
      .cloud-failure-modes-stage { animation: cloud-failure-modes-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cloud-failure-modes-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cloud-failure-modes-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cloud-failure-modes-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cloud-failure-modes-stage { animation: cloud-failure-modes-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cloud-failure-modes-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cloud-failure-modes-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cloud-failure-modes-bg" width="980" height="322"/>
  <text class="cloud-failure-modes-h1"  x="30" y="40">Four ways a cloud deploy fails</text>
  <text class="cloud-failure-modes-sub" x="30" y="64">Each with a specific control.</text>
  <g class="cloud-failure-modes-stage cloud-failure-modes-s0">
    <rect class="cloud-failure-modes-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cloud-failure-modes-step" x="44" y="142">01</text>
    <text class="cloud-failure-modes-name" x="70" y="142">Configuration drift</text>
    <text class="cloud-failure-modes-desc" x="44" y="166">Staging and production differ in</text>
    <text class="cloud-failure-modes-desc" x="44" y="182">a driver version nobody</text>
    <text class="cloud-failure-modes-desc" x="44" y="198">recorded.</text>
    <text class="cloud-failure-modes-edge" x="44" y="242">Terraform</text>
  </g>
  <line class="cloud-failure-modes-line cloud-failure-modes-conn cloud-failure-modes-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cloud-failure-modes-tip)"/>
  <g class="cloud-failure-modes-stage cloud-failure-modes-s1">
    <rect class="cloud-failure-modes-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cloud-failure-modes-step" x="280" y="142">02</text>
    <text class="cloud-failure-modes-name" x="306" y="142">The probe kills a loading pod</text>
    <text class="cloud-failure-modes-desc" x="280" y="166">Weights take 90 seconds. The</text>
    <text class="cloud-failure-modes-desc" x="280" y="182">probe allows 10.</text>
    <text class="cloud-failure-modes-edge" x="280" y="242">startup probe</text>
  </g>
  <line class="cloud-failure-modes-line cloud-failure-modes-conn cloud-failure-modes-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cloud-failure-modes-tip)"/>
  <g class="cloud-failure-modes-stage cloud-failure-modes-s2">
    <rect class="cloud-failure-modes-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cloud-failure-modes-step" x="516" y="142">03</text>
    <text class="cloud-failure-modes-name" x="542" y="142">Connections dropped at cutover</text>
    <text class="cloud-failure-modes-desc" x="516" y="166">Streaming responses truncate</text>
    <text class="cloud-failure-modes-desc" x="516" y="182">mid-answer.</text>
    <text class="cloud-failure-modes-edge" x="516" y="242">blue-green</text>
  </g>
  <line class="cloud-failure-modes-line cloud-failure-modes-conn cloud-failure-modes-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cloud-failure-modes-tip)"/>
  <g class="cloud-failure-modes-stage cloud-failure-modes-s3">
    <rect class="cloud-failure-modes-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cloud-failure-modes-step" x="752" y="142">04</text>
    <text class="cloud-failure-modes-name" x="778" y="142">Spend with no floor</text>
    <text class="cloud-failure-modes-desc" x="752" y="166">No scale-to-zero on staging, no</text>
    <text class="cloud-failure-modes-desc" x="752" y="182">commitment on baseline.</text>
    <text class="cloud-failure-modes-edge" x="752" y="242">40-60%</text>
  </g>
  <text class="cloud-failure-modes-sub" x="30" y="304">The fourth is the one that is discovered monthly rather than immediately, which is why Day 334's budget alert belongs in the same commit as the infrastructure it is guarding.</text>
</svg>
