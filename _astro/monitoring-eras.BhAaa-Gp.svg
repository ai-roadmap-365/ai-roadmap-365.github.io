<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each era added what the last could not see.">
  <title>From binary checks to LLM traces</title>
  <style>
    .monitoring-eras-bg   { fill: #f8fafc; }
    .monitoring-eras-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .monitoring-eras-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .monitoring-eras-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .monitoring-eras-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .monitoring-eras-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .monitoring-eras-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .monitoring-eras-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .monitoring-eras-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .monitoring-eras-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .monitoring-eras-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .monitoring-eras-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .monitoring-eras-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .monitoring-eras-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .monitoring-eras-stage { opacity: 1; }

    .monitoring-eras-s0 { animation-delay: 0.00s; }
    .monitoring-eras-e0 { animation-delay: 0.00s; }
    .monitoring-eras-s1 { animation-delay: 1.28s; }
    .monitoring-eras-e1 { animation-delay: 1.28s; }
    .monitoring-eras-s2 { animation-delay: 2.56s; }
    .monitoring-eras-e2 { animation-delay: 2.56s; }
    .monitoring-eras-s3 { animation-delay: 3.84s; }
    .monitoring-eras-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .monitoring-eras-conn  { animation: monitoring-eras-trace 6.4s ease-in-out infinite; }
      .monitoring-eras-stage { animation: monitoring-eras-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes monitoring-eras-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes monitoring-eras-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .monitoring-eras-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .monitoring-eras-stage { animation: monitoring-eras-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes monitoring-eras-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="monitoring-eras-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="monitoring-eras-bg" width="980" height="322"/>
  <text class="monitoring-eras-h1"  x="30" y="40">From binary checks to LLM traces</text>
  <text class="monitoring-eras-sub" x="30" y="64">Each era added what the last could not see.</text>
  <g class="monitoring-eras-stage monitoring-eras-s0">
    <rect class="monitoring-eras-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="monitoring-eras-step" x="44" y="142">01</text>
    <text class="monitoring-eras-name" x="70" y="142">Binary checks, 1990s</text>
    <text class="monitoring-eras-desc" x="44" y="166">Is the port open, is the disk</text>
    <text class="monitoring-eras-desc" x="44" y="182">full. Caught outages, missed</text>
    <text class="monitoring-eras-desc" x="44" y="198">degradation.</text>
    <text class="monitoring-eras-edge" x="44" y="242">up or down</text>
  </g>
  <line class="monitoring-eras-line monitoring-eras-conn monitoring-eras-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#monitoring-eras-tip)"/>
  <g class="monitoring-eras-stage monitoring-eras-s1">
    <rect class="monitoring-eras-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="monitoring-eras-step" x="280" y="142">02</text>
    <text class="monitoring-eras-name" x="306" y="142">Time series, 2000s</text>
    <text class="monitoring-eras-desc" x="280" y="166">Graphite and Prometheus. Trends</text>
    <text class="monitoring-eras-desc" x="280" y="182">became askable questions.</text>
  </g>
  <line class="monitoring-eras-line monitoring-eras-conn monitoring-eras-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#monitoring-eras-tip)"/>
  <g class="monitoring-eras-stage monitoring-eras-s2">
    <rect class="monitoring-eras-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="monitoring-eras-step" x="516" y="142">03</text>
    <text class="monitoring-eras-name" x="542" y="142">Golden signals, 2016</text>
    <text class="monitoring-eras-desc" x="516" y="166">Latency, traffic, errors,</text>
    <text class="monitoring-eras-desc" x="516" y="182">saturation — and symptom-based</text>
    <text class="monitoring-eras-desc" x="516" y="198">alerting.</text>
  </g>
  <line class="monitoring-eras-line monitoring-eras-conn monitoring-eras-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#monitoring-eras-tip)"/>
  <g class="monitoring-eras-stage monitoring-eras-s3">
    <rect class="monitoring-eras-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="monitoring-eras-step" x="752" y="142">04</text>
    <text class="monitoring-eras-name" x="778" y="142">LLM observability, 2023</text>
    <text class="monitoring-eras-desc" x="752" y="166">Tokens, cost per trace,</text>
    <text class="monitoring-eras-desc" x="752" y="182">retrieval hit rate,</text>
    <text class="monitoring-eras-desc" x="752" y="198">groundedness.</text>
    <text class="monitoring-eras-edge" x="752" y="242">success can fail</text>
  </g>
  <text class="monitoring-eras-sub" x="30" y="304">The last era exists because of a single realisation the earlier three had no reason to reach: for an AI system, a successful request can still be a failure, and availability monitoring will never say so.</text>
</svg>
