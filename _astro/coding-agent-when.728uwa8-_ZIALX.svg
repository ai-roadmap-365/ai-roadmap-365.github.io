<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And where oversight is not optional.">
  <title>Where agents belong</title>
  <style>
    .coding-agent-when-bg   { fill: #f8fafc; }
    .coding-agent-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .coding-agent-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .coding-agent-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .coding-agent-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .coding-agent-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .coding-agent-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .coding-agent-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .coding-agent-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .coding-agent-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .coding-agent-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .coding-agent-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .coding-agent-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .coding-agent-when-row { opacity: 1; }
    .coding-agent-when-r0 { animation-delay: 0.00s; }
    .coding-agent-when-r1 { animation-delay: 0.45s; }
    .coding-agent-when-r2 { animation-delay: 0.90s; }
    .coding-agent-when-r3 { animation-delay: 1.35s; }
    .coding-agent-when-r4 { animation-delay: 1.80s; }
    .coding-agent-when-row { animation: coding-agent-when-reveal 7.3s ease-in-out infinite; }
    @keyframes coding-agent-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="coding-agent-when-bg" width="980" height="390"/>
  <text class="coding-agent-when-h1"  x="30" y="40">Where agents belong</text>
  <text class="coding-agent-when-sub" x="30" y="64">And where oversight is not optional.</text>
  <rect class="coding-agent-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="coding-agent-when-name" x="46" y="122">Use an agent</text>
  <text class="coding-agent-when-desc" x="46" y="142">Specified and verifiable.</text>
  <text class="coding-agent-when-desc coding-agent-when-row coding-agent-when-r0" x="46" y="182">Well-specified features</text>
  <text class="coding-agent-when-desc coding-agent-when-row coding-agent-when-r1" x="46" y="216">Reproducible bugs with a failing test</text>
  <text class="coding-agent-when-desc coding-agent-when-row coding-agent-when-r2" x="46" y="250">Legacy refactoring</text>
  <text class="coding-agent-when-desc coding-agent-when-row coding-agent-when-r3" x="46" y="284">Comprehensive unit tests</text>
  <text class="coding-agent-when-desc coding-agent-when-row coding-agent-when-r4" x="46" y="318">Navigating an unfamiliar codebase</text>
  <rect class="coding-agent-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="coding-agent-when-name" x="526" y="122">Not without oversight</text>
  <text class="coding-agent-when-desc" x="526" y="142">High-consequence design.</text>
  <text class="coding-agent-when-desc coding-agent-when-row coding-agent-when-r0" x="526" y="182">Cryptographic protocols</text>
  <text class="coding-agent-when-desc coding-agent-when-row coding-agent-when-r1" x="526" y="216">Kernel drivers</text>
  <text class="coding-agent-when-desc coding-agent-when-row coding-agent-when-r2" x="526" y="250">Financial settlement algorithms</text>
  <text class="coding-agent-when-desc coding-agent-when-row coding-agent-when-r3" x="526" y="284">Anything where a subtle bug is catastrophic</text>
  <text class="coding-agent-when-desc coding-agent-when-row coding-agent-when-r4" x="526" y="318">Review, tests and security scanning regardless</text>
  <text class="coding-agent-when-sub" x="30" y="372">"Reproducible bugs with a failing test" is the highest-yield category by some margin: the test is both the specification and the verification, which is exactly the loop an agent is good at closing.</text>
</svg>
