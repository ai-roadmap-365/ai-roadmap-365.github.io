<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each spent differently.">
  <title>Three parts, three jobs</title>
  <style>
    .split-idea-bg   { fill: #f8fafc; }
    .split-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .split-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .split-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .split-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .split-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .split-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .split-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .split-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .split-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .split-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .split-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .split-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .split-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .split-idea-stage { opacity: 1; }

    .split-idea-s0 { animation-delay: 0.00s; }
    .split-idea-e0 { animation-delay: 0.00s; }
    .split-idea-s1 { animation-delay: 1.50s; }
    .split-idea-e1 { animation-delay: 1.50s; }
    .split-idea-s2 { animation-delay: 3.00s; }
    .split-idea-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .split-idea-conn  { animation: split-idea-trace 6s ease-in-out infinite; }
      .split-idea-stage { animation: split-idea-arrive 6s ease-in-out infinite; }
    }
    @keyframes split-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes split-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .split-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .split-idea-stage { animation: split-idea-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes split-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="split-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="split-idea-bg" width="980" height="322"/>
  <text class="split-idea-h1"  x="30" y="40">Three parts, three jobs</text>
  <text class="split-idea-sub" x="30" y="64">Each spent differently.</text>
  <g class="split-idea-stage split-idea-s0">
    <rect class="split-idea-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="split-idea-step" x="44" y="142">01</text>
    <text class="split-idea-name" x="70" y="142">Training</text>
    <text class="split-idea-desc" x="44" y="166">Fit on it. Look at it as much as you like.</text>
  </g>
  <line class="split-idea-line split-idea-conn split-idea-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#split-idea-tip)"/>
  <g class="split-idea-stage split-idea-s1">
    <rect class="split-idea-good" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="split-idea-step" x="359" y="142">02</text>
    <text class="split-idea-name" x="385" y="142">Validation</text>
    <text class="split-idea-desc" x="359" y="166">Decide with it. Model choice, tuning,</text>
    <text class="split-idea-desc" x="359" y="182">thresholds.</text>
  </g>
  <line class="split-idea-line split-idea-conn split-idea-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#split-idea-tip)"/>
  <g class="split-idea-stage split-idea-s2">
    <rect class="split-idea-warn" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="split-idea-step" x="674" y="142">03</text>
    <text class="split-idea-name" x="700" y="142">Test</text>
    <text class="split-idea-desc" x="674" y="166">Spend it once, at the end, and report what it</text>
    <text class="split-idea-desc" x="674" y="182">says.</text>
  </g>
  <text class="split-idea-sub" x="30" y="304">The middle set exists precisely so the last one is never used for a decision, which is the whole reason two sets are not enough.</text>
</svg>
