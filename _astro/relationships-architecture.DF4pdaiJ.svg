<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" width="1040" height="720" role="img" aria-labelledby="d087a-title d087a-desc">
  <title id="d087a-title">The library schema: five tables, their keys, and the cardinality of every relationship</title>
  <desc id="d087a-desc">An entity diagram of five tables. Books and authors are joined through a book_authors junction table, making a many-to-many relationship. Members reference themselves through referred_by. Loans sits between books and members, carrying a foreign key to each, making two one-to-many relationships. Primary keys and foreign keys are marked on every table, and each relationship is labelled with its cardinality.</desc>

  <style>
    .d087a-bg      { fill: #f8fafc; }
    .d087a-title   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 19px; font-weight: 600; fill: #1a202c; }
    .d087a-sub     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d087a-tname   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 600; fill: #ffffff; }
    .d087a-col     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1a202c; }
    .d087a-key     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #1d4ed8; }
    .d087a-card    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #1d4ed8; }
    .d087a-note    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d087a-tbl     { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d087a-hdr     { fill: #1d4ed8; }
    .d087a-junc    { fill: #ffffff; stroke: #1d4ed8; stroke-width: 2.5; }
    .d087a-rel     { fill: none; stroke: #1d4ed8; stroke-width: 2; }
    .d087a-self    { fill: none; stroke: #047857; stroke-width: 2; }
    .d087a-panel   { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5; }
  </style>

  <defs>
    <marker id="d087a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
    <marker id="d087a-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857" />
    </marker>
  </defs>

  <rect class="d087a-bg" x="0" y="0" width="1040" height="720" />
  <text class="d087a-title" x="32" y="40">The library schema — five tables, and what ties them together</text>
  <text class="d087a-sub" x="32" y="64">PK marks a primary key. FK marks a foreign key: a promise that this value exists as a key in the named parent table.</text>
  <text class="d087a-sub" x="32" y="84">An arrow points from the child (the table holding the FK) to the parent it references.</text>

  <!-- books -->
  <rect class="d087a-tbl" x="40" y="120" width="230" height="132" rx="8" />
  <path class="d087a-hdr" d="M 40 128 a 8 8 0 0 1 8 -8 h 214 a 8 8 0 0 1 8 8 v 24 h -230 z" />
  <text class="d087a-tname" x="56" y="145">books</text>
  <text class="d087a-key" x="56" y="177">PK  book_id</text>
  <text class="d087a-col" x="56" y="202">title</text>
  <text class="d087a-col" x="56" y="227">published_year</text>

  <!-- book_authors junction -->
  <rect class="d087a-junc" x="405" y="120" width="230" height="132" rx="8" />
  <path class="d087a-hdr" d="M 405 128 a 8 8 0 0 1 8 -8 h 214 a 8 8 0 0 1 8 8 v 24 h -230 z" />
  <text class="d087a-tname" x="421" y="145">book_authors</text>
  <text class="d087a-key" x="421" y="177">PK FK  book_id</text>
  <text class="d087a-key" x="421" y="202">PK FK  author_id</text>
  <text class="d087a-note" x="421" y="230">the key is the PAIR</text>

  <!-- authors -->
  <rect class="d087a-tbl" x="770" y="120" width="230" height="132" rx="8" />
  <path class="d087a-hdr" d="M 770 128 a 8 8 0 0 1 8 -8 h 214 a 8 8 0 0 1 8 8 v 24 h -230 z" />
  <text class="d087a-tname" x="786" y="145">authors</text>
  <text class="d087a-key" x="786" y="177">PK  author_id</text>
  <text class="d087a-col" x="786" y="202">name</text>
  <text class="d087a-col" x="786" y="227">birth_year</text>

  <!-- many-to-many wiring -->
  <path class="d087a-rel" d="M 405 186 L 270 186" marker-end="url(#d087a-arrow)" />
  <text class="d087a-card" x="337" y="176" text-anchor="middle">many : 1</text>
  <path class="d087a-rel" d="M 635 186 L 770 186" marker-end="url(#d087a-arrow)" />
  <text class="d087a-card" x="702" y="176" text-anchor="middle">many : 1</text>
  <text class="d087a-note" x="520" y="290" text-anchor="middle">books MANY-TO-MANY authors</text>
  <text class="d087a-note" x="520" y="310" text-anchor="middle">two one-to-many relationships, back to back — that is all a junction table is</text>

  <!-- loans -->
  <rect class="d087a-tbl" x="405" y="418" width="230" height="182" rx="8" />
  <path class="d087a-hdr" d="M 405 426 a 8 8 0 0 1 8 -8 h 214 a 8 8 0 0 1 8 8 v 24 h -230 z" />
  <text class="d087a-tname" x="421" y="443">loans</text>
  <text class="d087a-key" x="421" y="475">PK  loan_id</text>
  <text class="d087a-key" x="421" y="500">FK  book_id</text>
  <text class="d087a-key" x="421" y="525">FK  member_id</text>
  <text class="d087a-col" x="421" y="550">borrowed_on</text>
  <text class="d087a-col" x="421" y="575">returned_on  (nullable)</text>

  <!-- members -->
  <rect class="d087a-tbl" x="40" y="418" width="230" height="157" rx="8" />
  <path class="d087a-hdr" d="M 40 426 a 8 8 0 0 1 8 -8 h 214 a 8 8 0 0 1 8 8 v 24 h -230 z" />
  <text class="d087a-tname" x="56" y="443">members</text>
  <text class="d087a-key" x="56" y="475">PK  member_id</text>
  <text class="d087a-col" x="56" y="500">name</text>
  <text class="d087a-col" x="56" y="525">joined_on</text>
  <text class="d087a-key" x="56" y="550">FK  referred_by</text>

  <!-- loans -> members, loans -> books -->
  <path class="d087a-rel" d="M 405 509 L 270 509" marker-end="url(#d087a-arrow)" />
  <text class="d087a-card" x="337" y="499" text-anchor="middle">many : 1</text>
  <path class="d087a-rel" d="M 520 418 L 520 340 L 155 340 L 155 252" marker-end="url(#d087a-arrow)" />
  <text class="d087a-card" x="330" y="332" text-anchor="middle">many loans : 1 book</text>

  <!-- self reference -->
  <path class="d087a-self" d="M 40 560 L 12 560 L 12 460 L 40 460" marker-end="url(#d087a-arrow-green)" />
  <text class="d087a-note" x="40" y="600">members references ITSELF: referred_by holds a member_id.</text>
  <text class="d087a-note" x="40" y="620">Nullable, because the first members were referred by nobody.</text>
  <text class="d087a-note" x="40" y="640">Joining a table to itself is a self-join, and needs two aliases.</text>

  <!-- the key placement rule -->
  <rect class="d087a-panel" x="690" y="418" width="310" height="182" rx="8" />
  <text class="d087a-col" x="710" y="446">Where does the key go?</text>
  <text class="d087a-note" x="710" y="472">One-to-many: on the MANY side.</text>
  <text class="d087a-note" x="710" y="494">One book has many loans, so book_id</text>
  <text class="d087a-note" x="710" y="514">lives in loans — not a list of loans</text>
  <text class="d087a-note" x="710" y="534">stored inside books.</text>
  <text class="d087a-note" x="710" y="562">Many-to-many: neither side can hold</text>
  <text class="d087a-note" x="710" y="582">it, so it goes in a table of its own.</text>

  <text class="d087a-sub" x="32" y="678">In SQLite a FOREIGN KEY is not enforced until PRAGMA foreign_keys = ON is issued — per connection, every time.</text>
  <text class="d087a-sub" x="32" y="700">A foreign key also does not create an index. Add one on every FK column, or each join across it scans the whole table.</text>
</svg>
