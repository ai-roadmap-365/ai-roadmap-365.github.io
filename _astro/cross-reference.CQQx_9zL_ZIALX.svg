<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Cross-referenced.">
  <title>Two card indexes</title>
  <style>
    .cross-reference-bg   { fill: #f8fafc; }
    .cross-reference-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cross-reference-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cross-reference-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cross-reference-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cross-reference-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cross-reference-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cross-reference-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cross-reference-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cross-reference-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cross-reference-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cross-reference-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cross-reference-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cross-reference-row { opacity: 1; }
    .cross-reference-r0 { animation-delay: 0.00s; }
    .cross-reference-r1 { animation-delay: 0.45s; }
    .cross-reference-r2 { animation-delay: 0.90s; }
    .cross-reference-r3 { animation-delay: 1.35s; }
    .cross-reference-r4 { animation-delay: 1.80s; }
    .cross-reference-row { animation: cross-reference-reveal 7.3s ease-in-out infinite; }
    @keyframes cross-reference-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cross-reference-bg" width="980" height="390"/>
  <text class="cross-reference-h1"  x="30" y="40">Two card indexes</text>
  <text class="cross-reference-sub" x="30" y="64">Cross-referenced.</text>
  <rect class="cross-reference-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cross-reference-name" x="46" y="122">Two indexes, cross-referenced</text>
  <text class="cross-reference-desc" x="46" y="142">Each fact once.</text>
  <text class="cross-reference-desc cross-reference-row cross-reference-r0" x="46" y="182">Member details on one card</text>
  <text class="cross-reference-desc cross-reference-row cross-reference-r1" x="46" y="216">Loans on another, referencing it</text>
  <text class="cross-reference-desc cross-reference-row cross-reference-r2" x="46" y="250">Change an address once</text>
  <text class="cross-reference-desc cross-reference-row cross-reference-r3" x="46" y="284">No card can disagree with another</text>
  <text class="cross-reference-desc cross-reference-row cross-reference-r4" x="46" y="318">This is normalised data joined on demand</text>
  <rect class="cross-reference-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cross-reference-name" x="526" y="122">One combined file</text>
  <text class="cross-reference-desc" x="526" y="142">Facts repeated.</text>
  <text class="cross-reference-desc cross-reference-row cross-reference-r0" x="526" y="182">Address copied onto every loan card</text>
  <text class="cross-reference-desc cross-reference-row cross-reference-r1" x="526" y="216">Change it in fifty places</text>
  <text class="cross-reference-desc cross-reference-row cross-reference-r2" x="526" y="250">Some get missed</text>
  <text class="cross-reference-desc cross-reference-row cross-reference-r3" x="526" y="284">Cards disagree</text>
  <text class="cross-reference-desc cross-reference-row cross-reference-r4" x="526" y="318">This is duplicated data</text>
  <text class="cross-reference-sub" x="30" y="372">Cards disagreeing is not a hypothetical: duplicated data always drifts, and the only question is how long before someone notices.</text>
</svg>
