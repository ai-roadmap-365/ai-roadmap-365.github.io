<svg role="img" aria-label="Backpropagation Through Time BPTT gradient propagation demonstrating exponential vanishing and exploding gradients across sequential steps" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Backpropagation Through Time (BPTT) and Gradient Dynamics</title>
  <defs>
    <linearGradient id="bg220b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card220b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg220b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">BACKPROPAGATION THROUGH TIME (BPTT) GRADIENT PATHOLOGY</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Repeated Matrix Multiplication by W_hh Transpose Causing Vanishing (||W|| &lt; 1) or Exploding (||W|| &gt; 1) Gradients</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card220b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Vanishing Case -->
    <rect x="25" y="25" width="340" height="245" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" rx="6"/>
    <text x="195" y="48" fill="#fb7185" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Vanishing Gradient Pathology (||W_hh|| &lt; 1)</text>
    <rect x="40" y="65" width="310" height="190" fill="#1e293b" stroke="#f43f5e" rx="4"/>
    <text x="195" y="90" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">Gradient Decay Over Time Steps</text>
    <text x="195" y="115" fill="#cbd5e1" font-size="8" text-anchor="middle">Step t: dL/dh_t = 1.0</text>
    <text x="195" y="135" fill="#cbd5e1" font-size="8" text-anchor="middle">Step t-5: dL/dh_{t-5} = 0.031</text>
    <text x="195" y="155" fill="#cbd5e1" font-size="8" text-anchor="middle">Step t-20: dL/dh_{t-20} = 0.00000095</text>
    <text x="195" y="185" fill="#fb7185" font-size="9" font-weight="700" text-anchor="middle">Result: Early inputs have ZERO learning signal</text>
    <text x="195" y="210" fill="#cbd5e1" font-size="8" text-anchor="middle">Short-term memory only (cannot connect words > 10 steps apart)</text>
    <text x="195" y="235" fill="#fb7185" font-size="8" font-weight="700" text-anchor="middle">Solution: LSTM / GRU Constant Error Carousel</text>

    <!-- Exploding Case -->
    <rect x="395" y="25" width="340" height="245" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="565" y="48" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Exploding Gradient Pathology (||W_hh|| &gt; 1)</text>
    <rect x="410" y="65" width="310" height="190" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="565" y="90" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">Gradient Exponential Blowup</text>
    <text x="565" y="115" fill="#cbd5e1" font-size="8" text-anchor="middle">Step t: dL/dh_t = 1.0</text>
    <text x="565" y="135" fill="#cbd5e1" font-size="8" text-anchor="middle">Step t-5: dL/dh_{t-5} = 32.0</text>
    <text x="565" y="155" fill="#cbd5e1" font-size="8" text-anchor="middle">Step t-20: dL/dh_{t-20} = 1,048,576.0</text>
    <text x="565" y="185" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">Result: Numerical NaN / Weight Explosion</text>
    <text x="565" y="210" fill="#cbd5e1" font-size="8" text-anchor="middle">Weights jump into unstable loss landscape regions</text>
    <text x="565" y="235" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">Solution: Gradient Norm Clipping (clip_grad_norm_)</text>
  </g>
</svg>
