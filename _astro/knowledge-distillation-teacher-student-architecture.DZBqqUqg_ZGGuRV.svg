<svg role="img" aria-label="Knowledge Distillation teacher student architecture showing soft probability logit matching with temperature tau and ground truth cross entropy" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Knowledge Distillation: Teacher-Student Logit Matching</title>
  <defs>
    <linearGradient id="bg236b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card236b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg236b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">KNOWLEDGE DISTILLATION (HINTON ET AL., 2015)</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Transferring Dark Knowledge via Temperature-Softened Softmax: Loss = alpha * KL(p_tau || q_tau) + (1-alpha) * CE(y, q)</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card236b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Input Token Sequence -->
    <rect x="25" y="115" width="100" height="60" fill="#0f172a" stroke="#cbd5e1" rx="4"/>
    <text x="75" y="140" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">Input Text</text>
    <text x="75" y="158" fill="#94a3b8" font-size="8" text-anchor="middle">"The movie was..."</text>

    <!-- Top Branch: Large Teacher Model (Frozen) -->
    <rect x="165" y="30" width="180" height="90" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="255" y="55" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Large Teacher Model</text>
    <text x="255" y="75" fill="#cbd5e1" font-size="8" text-anchor="middle">e.g. RoBERTa-Large (355M)</text>
    <text x="255" y="95" fill="#fb7185" font-size="8" font-weight="700" text-anchor="middle">[FROZEN WEIGHTS]</text>

    <!-- Softmax with Temp Tau -->
    <rect x="375" y="30" width="130" height="90" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="440" y="55" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">Softmax (T = tau)</text>
    <text x="440" y="75" fill="#cbd5e1" font-size="8" text-anchor="middle">p_i = exp(z_i / tau) / sum</text>
    <text x="440" y="95" fill="#fbbf24" font-size="8" text-anchor="middle">"Dark Knowledge" Distribution</text>

    <!-- Bottom Branch: Small Student Model (Trainable) -->
    <rect x="165" y="170" width="180" height="90" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="255" y="195" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">Small Student Model</text>
    <text x="255" y="215" fill="#cbd5e1" font-size="8" text-anchor="middle">e.g. DistilBERT (66M - 40% Smaller)</text>
    <text x="255" y="235" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">[TRAINABLE WEIGHTS]</text>

    <!-- Student Softmax with Temp Tau -->
    <rect x="375" y="170" width="130" height="90" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="440" y="195" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">Softmax (T = tau)</text>
    <text x="440" y="215" fill="#cbd5e1" font-size="8" text-anchor="middle">q_i = exp(s_i / tau) / sum</text>
    <text x="440" y="235" fill="#cbd5e1" font-size="8" text-anchor="middle">Student Soft Predictions</text>

    <!-- Loss Combination Block -->
    <rect x="545" y="65" width="185" height="165" fill="#0f172a" stroke="#a855f7" stroke-width="2" rx="6"/>
    <text x="637" y="95" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle">Distillation Loss</text>
    
    <!-- KL Divergence -->
    <rect x="555" y="115" width="165" height="45" fill="#1e293b" stroke="#fbbf24" rx="3"/>
    <text x="637" y="133" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">KL Divergence (Soft Loss)</text>
    <text x="637" y="148" fill="#cbd5e1" font-size="7" text-anchor="middle">L_soft = tau^2 * KL(p_tau || q_tau)</text>

    <!-- Hard Cross Entropy -->
    <rect x="555" y="170" width="165" height="45" fill="#1e293b" stroke="#10b981" rx="3"/>
    <text x="637" y="188" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Hard Cross-Entropy Loss</text>
    <text x="637" y="203" fill="#cbd5e1" font-size="7" text-anchor="middle">L_hard = CrossEntropy(y_true, q)</text>
  </g>
</svg>
