<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Memory, speed, streaming and limits.">
  <title>Four consequences of gated recurrence</title>
  <style>
    .lstm-implications-bg   { fill: #f8fafc; }
    .lstm-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lstm-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lstm-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lstm-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lstm-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lstm-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lstm-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .lstm-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .lstm-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .lstm-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .lstm-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .lstm-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .lstm-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .lstm-implications-stage { opacity: 1; }

    .lstm-implications-s0 { animation-delay: 0.00s; }
    .lstm-implications-e0 { animation-delay: 0.00s; }
    .lstm-implications-s1 { animation-delay: 1.28s; }
    .lstm-implications-e1 { animation-delay: 1.28s; }
    .lstm-implications-s2 { animation-delay: 2.56s; }
    .lstm-implications-e2 { animation-delay: 2.56s; }
    .lstm-implications-s3 { animation-delay: 3.84s; }
    .lstm-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .lstm-implications-conn  { animation: lstm-implications-trace 6.4s ease-in-out infinite; }
      .lstm-implications-stage { animation: lstm-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes lstm-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes lstm-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .lstm-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .lstm-implications-stage { animation: lstm-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes lstm-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="lstm-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="lstm-implications-bg" width="980" height="322"/>
  <text class="lstm-implications-h1"  x="30" y="40">Four consequences of gated recurrence</text>
  <text class="lstm-implications-sub" x="30" y="64">Memory, speed, streaming and limits.</text>
  <g class="lstm-implications-stage lstm-implications-s0">
    <rect class="lstm-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="lstm-implications-step" x="44" y="142">01</text>
    <text class="lstm-implications-name" x="70" y="142">Memory span in the hundreds</text>
    <text class="lstm-implications-desc" x="44" y="166">An order of magnitude better</text>
    <text class="lstm-implications-desc" x="44" y="182">than vanilla recurrence.</text>
  </g>
  <line class="lstm-implications-line lstm-implications-conn lstm-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#lstm-implications-tip)"/>
  <g class="lstm-implications-stage lstm-implications-s1">
    <rect class="lstm-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="lstm-implications-step" x="280" y="142">02</text>
    <text class="lstm-implications-name" x="306" y="142">Still strictly sequential</text>
    <text class="lstm-implications-desc" x="280" y="166">Which leaves parallel hardware</text>
    <text class="lstm-implications-desc" x="280" y="182">underused during training.</text>
  </g>
  <line class="lstm-implications-line lstm-implications-conn lstm-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#lstm-implications-tip)"/>
  <g class="lstm-implications-stage lstm-implications-s2">
    <rect class="lstm-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="lstm-implications-step" x="516" y="142">03</text>
    <text class="lstm-implications-name" x="542" y="142">Constant memory at inference</text>
    <text class="lstm-implications-desc" x="516" y="166">One state vector, regardless of</text>
    <text class="lstm-implications-desc" x="516" y="182">how much has been read.</text>
  </g>
  <line class="lstm-implications-line lstm-implications-conn lstm-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#lstm-implications-tip)"/>
  <g class="lstm-implications-stage lstm-implications-s3">
    <rect class="lstm-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="lstm-implications-step" x="752" y="142">04</text>
    <text class="lstm-implications-name" x="778" y="142">And a fixed state is still a bottleneck</text>
    <text class="lstm-implications-desc" x="752" y="166">Very long documents exceed what</text>
    <text class="lstm-implications-desc" x="752" y="182">a vector can compress.</text>
  </g>
  <text class="lstm-implications-sub" x="30" y="304">The compression limit is what attention finally removed: no fixed-size state can summarise an arbitrarily long input, however well it is gated.</text>
</svg>
