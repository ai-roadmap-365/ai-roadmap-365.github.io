<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The business rule baseline</title>
  <style>
    .tier-detail-bg   { fill: #f8fafc; }
    .tier-detail-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tier-detail-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tier-detail-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tier-detail-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tier-detail-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tier-detail-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tier-detail-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tier-detail-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tier-detail-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tier-detail-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tier-detail-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tier-detail-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tier-detail-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tier-detail-stage { opacity: 1; }

    .tier-detail-s0 { animation-delay: 0.00s; }
    .tier-detail-e0 { animation-delay: 0.00s; }
    .tier-detail-s1 { animation-delay: 1.28s; }
    .tier-detail-e1 { animation-delay: 1.28s; }
    .tier-detail-s2 { animation-delay: 2.56s; }
    .tier-detail-e2 { animation-delay: 2.56s; }
    .tier-detail-s3 { animation-delay: 3.84s; }
    .tier-detail-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tier-detail-conn  { animation: tier-detail-trace 6.4s ease-in-out infinite; }
      .tier-detail-stage { animation: tier-detail-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tier-detail-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tier-detail-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tier-detail-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tier-detail-stage { animation: tier-detail-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tier-detail-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tier-detail-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tier-detail-bg" width="980" height="322"/>
  <text class="tier-detail-h1"  x="30" y="40">The business rule baseline</text>
  <text class="tier-detail-sub" x="30" y="64">Four steps.</text>
  <g class="tier-detail-stage tier-detail-s0">
    <rect class="tier-detail-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tier-detail-step" x="44" y="142">01</text>
    <text class="tier-detail-name" x="70" y="142">Find the rule the organisation uses now</text>
    <text class="tier-detail-desc" x="44" y="166">Written down, or in someone's</text>
    <text class="tier-detail-desc" x="44" y="182">head.</text>
  </g>
  <line class="tier-detail-line tier-detail-conn tier-detail-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tier-detail-tip)"/>
  <g class="tier-detail-stage tier-detail-s1">
    <rect class="tier-detail-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tier-detail-step" x="280" y="142">02</text>
    <text class="tier-detail-name" x="306" y="142">Implement it exactly as stated</text>
    <text class="tier-detail-desc" x="280" y="166">Without improving it.</text>
  </g>
  <line class="tier-detail-line tier-detail-conn tier-detail-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tier-detail-tip)"/>
  <g class="tier-detail-stage tier-detail-s2">
    <rect class="tier-detail-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tier-detail-step" x="516" y="142">03</text>
    <text class="tier-detail-name" x="542" y="142">Measure it on the same held-out data</text>
    <text class="tier-detail-desc" x="516" y="166">With the same metric as the</text>
    <text class="tier-detail-desc" x="516" y="182">model.</text>
  </g>
  <line class="tier-detail-line tier-detail-conn tier-detail-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tier-detail-tip)"/>
  <g class="tier-detail-stage tier-detail-s3">
    <rect class="tier-detail-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tier-detail-step" x="752" y="142">04</text>
    <text class="tier-detail-name" x="778" y="142">That number is what the model must beat</text>
    <text class="tier-detail-desc" x="752" y="166">By enough to justify its</text>
    <text class="tier-detail-desc" x="752" y="182">maintenance.</text>
  </g>
  <text class="tier-detail-sub" x="30" y="304">Implementing the rule without improving it is what keeps the comparison honest: a tidied-up version is a different rule and not the one being replaced.</text>
</svg>
