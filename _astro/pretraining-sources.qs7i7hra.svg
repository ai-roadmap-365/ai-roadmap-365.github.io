<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Labels, self-supervision, and language.">
  <title>Three sources of pretrained features</title>
  <style>
    .pretraining-sources-bg   { fill: #f8fafc; }
    .pretraining-sources-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pretraining-sources-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pretraining-sources-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pretraining-sources-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pretraining-sources-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pretraining-sources-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pretraining-sources-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pretraining-sources-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pretraining-sources-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pretraining-sources-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pretraining-sources-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pretraining-sources-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pretraining-sources-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pretraining-sources-stage { opacity: 1; }

    .pretraining-sources-s0 { animation-delay: 0.00s; }
    .pretraining-sources-e0 { animation-delay: 0.00s; }
    .pretraining-sources-s1 { animation-delay: 1.50s; }
    .pretraining-sources-e1 { animation-delay: 1.50s; }
    .pretraining-sources-s2 { animation-delay: 3.00s; }
    .pretraining-sources-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .pretraining-sources-conn  { animation: pretraining-sources-trace 6s ease-in-out infinite; }
      .pretraining-sources-stage { animation: pretraining-sources-arrive 6s ease-in-out infinite; }
    }
    @keyframes pretraining-sources-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pretraining-sources-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pretraining-sources-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pretraining-sources-stage { animation: pretraining-sources-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pretraining-sources-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pretraining-sources-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pretraining-sources-bg" width="980" height="322"/>
  <text class="pretraining-sources-h1"  x="30" y="40">Three sources of pretrained features</text>
  <text class="pretraining-sources-sub" x="30" y="64">Labels, self-supervision, and language.</text>
  <g class="pretraining-sources-stage pretraining-sources-s0">
    <rect class="pretraining-sources-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="pretraining-sources-step" x="44" y="142">01</text>
    <text class="pretraining-sources-name" x="70" y="142">Supervised classification</text>
    <text class="pretraining-sources-desc" x="44" y="166">Labelled images at scale. Strong, and bounded</text>
    <text class="pretraining-sources-desc" x="44" y="182">by annotation cost.</text>
    <text class="pretraining-sources-edge" x="44" y="242">labels</text>
  </g>
  <line class="pretraining-sources-line pretraining-sources-conn pretraining-sources-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#pretraining-sources-tip)"/>
  <g class="pretraining-sources-stage pretraining-sources-s1">
    <rect class="pretraining-sources-good" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="pretraining-sources-step" x="359" y="142">02</text>
    <text class="pretraining-sources-name" x="385" y="142">Self-supervised</text>
    <text class="pretraining-sources-desc" x="359" y="166">Objectives from the images themselves —</text>
    <text class="pretraining-sources-desc" x="359" y="182">masking, or view agreement. No labels.</text>
  </g>
  <line class="pretraining-sources-line pretraining-sources-conn pretraining-sources-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#pretraining-sources-tip)"/>
  <g class="pretraining-sources-stage pretraining-sources-s2">
    <rect class="pretraining-sources-box" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="pretraining-sources-step" x="674" y="142">03</text>
    <text class="pretraining-sources-name" x="700" y="142">Vision-language contrastive</text>
    <text class="pretraining-sources-desc" x="674" y="166">Images paired with captions. Features aligned</text>
    <text class="pretraining-sources-desc" x="674" y="182">to a text space.</text>
    <text class="pretraining-sources-edge" x="674" y="242">zero-shot</text>
  </g>
  <text class="pretraining-sources-sub" x="30" y="304">The third produces something qualitatively different: a backbone whose features live in the same space as text embeddings, which is what makes zero-shot classification by description possible.</text>
</svg>
