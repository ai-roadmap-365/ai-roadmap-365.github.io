<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The argument is 45 years old and both sides ended up borrowing from each other.">
  <title>Two philosophies about how much one instruction should do</title>
  <style>
    .risc-versus-cisc-bg   { fill: #f8fafc; }
    .risc-versus-cisc-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .risc-versus-cisc-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .risc-versus-cisc-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .risc-versus-cisc-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .risc-versus-cisc-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .risc-versus-cisc-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .risc-versus-cisc-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .risc-versus-cisc-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .risc-versus-cisc-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .risc-versus-cisc-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .risc-versus-cisc-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .risc-versus-cisc-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .risc-versus-cisc-row { opacity: 1; }
    .risc-versus-cisc-r0 { animation-delay: 0.00s; }
    .risc-versus-cisc-r1 { animation-delay: 0.45s; }
    .risc-versus-cisc-r2 { animation-delay: 0.90s; }
    .risc-versus-cisc-r3 { animation-delay: 1.35s; }
    .risc-versus-cisc-r4 { animation-delay: 1.80s; }
    .risc-versus-cisc-row { animation: risc-versus-cisc-reveal 7.3s ease-in-out infinite; }
    @keyframes risc-versus-cisc-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="risc-versus-cisc-bg" width="980" height="390"/>
  <text class="risc-versus-cisc-h1"  x="30" y="40">Two philosophies about how much one instruction should do</text>
  <text class="risc-versus-cisc-sub" x="30" y="64">The argument is 45 years old and both sides ended up borrowing from each other.</text>
  <rect class="risc-versus-cisc-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="risc-versus-cisc-name" x="46" y="122">CISC — x86</text>
  <text class="risc-versus-cisc-desc" x="46" y="142">Few, powerful instructions</text>
  <text class="risc-versus-cisc-desc risc-versus-cisc-row risc-versus-cisc-r0" x="46" y="182">Variable length, some very complex</text>
  <text class="risc-versus-cisc-desc risc-versus-cisc-row risc-versus-cisc-r1" x="46" y="216">Elaborate decoding circuitry</text>
  <text class="risc-versus-cisc-desc risc-versus-cisc-row risc-versus-cisc-r2" x="46" y="250">Fewer instructions per program</text>
  <text class="risc-versus-cisc-desc risc-versus-cisc-row risc-versus-cisc-r3" x="46" y="284">Grew from Intel's 1978 8086</text>
  <text class="risc-versus-cisc-desc risc-versus-cisc-row risc-versus-cisc-r4" x="46" y="318">Desktops, servers, most laptops until recently</text>
  <rect class="risc-versus-cisc-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="risc-versus-cisc-name" x="526" y="122">RISC — ARM</text>
  <text class="risc-versus-cisc-desc" x="526" y="142">Many, simple instructions</text>
  <text class="risc-versus-cisc-desc risc-versus-cisc-row risc-versus-cisc-r0" x="526" y="182">Fixed size, simple to decode</text>
  <text class="risc-versus-cisc-desc risc-versus-cisc-row risc-versus-cisc-r1" x="526" y="216">Simpler circuitry, less power per instruction</text>
  <text class="risc-versus-cisc-desc risc-versus-cisc-row risc-versus-cisc-r2" x="526" y="250">More instructions, each cheaper</text>
  <text class="risc-versus-cisc-desc risc-versus-cisc-row risc-versus-cisc-r3" x="526" y="284">Phones, then laptops, then datacentres</text>
  <text class="risc-versus-cisc-desc risc-versus-cisc-row risc-versus-cisc-r4" x="526" y="318">Apple Silicon and Graviton are both RISC</text>
  <text class="risc-versus-cisc-sub" x="30" y="372">The M1 in 2020 showed a phone architecture could outperform high-end x86 laptops, and the industry moved.</text>
</svg>
