<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="When they disagree usefully.">
  <title>Combining independent opinions</title>
  <style>
    .assembling-a-case-bg   { fill: #f8fafc; }
    .assembling-a-case-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assembling-a-case-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assembling-a-case-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assembling-a-case-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assembling-a-case-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assembling-a-case-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .assembling-a-case-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .assembling-a-case-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .assembling-a-case-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .assembling-a-case-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .assembling-a-case-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .assembling-a-case-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .assembling-a-case-row { opacity: 1; }
    .assembling-a-case-r0 { animation-delay: 0.00s; }
    .assembling-a-case-r1 { animation-delay: 0.45s; }
    .assembling-a-case-r2 { animation-delay: 0.90s; }
    .assembling-a-case-r3 { animation-delay: 1.35s; }
    .assembling-a-case-r4 { animation-delay: 1.80s; }
    .assembling-a-case-row { animation: assembling-a-case-reveal 7.3s ease-in-out infinite; }
    @keyframes assembling-a-case-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="assembling-a-case-bg" width="980" height="390"/>
  <text class="assembling-a-case-h1"  x="30" y="40">Combining independent opinions</text>
  <text class="assembling-a-case-sub" x="30" y="64">When they disagree usefully.</text>
  <rect class="assembling-a-case-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="assembling-a-case-name" x="46" y="122">Similar advisers</text>
  <text class="assembling-a-case-desc" x="46" y="142">All agree.</text>
  <text class="assembling-a-case-desc assembling-a-case-row assembling-a-case-r0" x="46" y="182">Same training, same assumptions</text>
  <text class="assembling-a-case-desc assembling-a-case-row assembling-a-case-r1" x="46" y="216">They confirm each other</text>
  <text class="assembling-a-case-desc assembling-a-case-row assembling-a-case-r2" x="46" y="250">Blind spots are shared</text>
  <text class="assembling-a-case-desc assembling-a-case-row assembling-a-case-r3" x="46" y="284">Combining adds no information</text>
  <text class="assembling-a-case-desc assembling-a-case-row assembling-a-case-r4" x="46" y="318">This is a correlated ensemble</text>
  <rect class="assembling-a-case-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="assembling-a-case-name" x="526" y="122">Different advisers</text>
  <text class="assembling-a-case-desc" x="526" y="142">Disagree usefully.</text>
  <text class="assembling-a-case-desc assembling-a-case-row assembling-a-case-r0" x="526" y="182">Different backgrounds and methods</text>
  <text class="assembling-a-case-desc assembling-a-case-row assembling-a-case-r1" x="526" y="216">They disagree where it matters</text>
  <text class="assembling-a-case-desc assembling-a-case-row assembling-a-case-r2" x="526" y="250">Blind spots differ</text>
  <text class="assembling-a-case-desc assembling-a-case-row assembling-a-case-r3" x="526" y="284">Combining genuinely adds information</text>
  <text class="assembling-a-case-desc assembling-a-case-row assembling-a-case-r4" x="526" y="318">This is a stacked ensemble</text>
  <text class="assembling-a-case-sub" x="30" y="372">The value comes from where they disagree, which is why stacking a boosted model with another boosted model gains almost nothing.</text>
</svg>
