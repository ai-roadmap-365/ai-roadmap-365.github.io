<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Target encoding leaks</title>
  <style>
    .target-leakage-bg   { fill: #f8fafc; }
    .target-leakage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .target-leakage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .target-leakage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .target-leakage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .target-leakage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .target-leakage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .target-leakage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .target-leakage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .target-leakage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .target-leakage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .target-leakage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .target-leakage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .target-leakage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .target-leakage-stage { opacity: 1; }

    .target-leakage-s0 { animation-delay: 0.00s; }
    .target-leakage-e0 { animation-delay: 0.00s; }
    .target-leakage-s1 { animation-delay: 1.28s; }
    .target-leakage-e1 { animation-delay: 1.28s; }
    .target-leakage-s2 { animation-delay: 2.56s; }
    .target-leakage-e2 { animation-delay: 2.56s; }
    .target-leakage-s3 { animation-delay: 3.84s; }
    .target-leakage-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .target-leakage-conn  { animation: target-leakage-trace 6.4s ease-in-out infinite; }
      .target-leakage-stage { animation: target-leakage-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes target-leakage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes target-leakage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .target-leakage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .target-leakage-stage { animation: target-leakage-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes target-leakage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="target-leakage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="target-leakage-bg" width="980" height="322"/>
  <text class="target-leakage-h1"  x="30" y="40">Target encoding leaks</text>
  <text class="target-leakage-sub" x="30" y="64">Four steps.</text>
  <g class="target-leakage-stage target-leakage-s0">
    <rect class="target-leakage-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="target-leakage-step" x="44" y="142">01</text>
    <text class="target-leakage-name" x="70" y="142">Replace each category with its mean outcome</text>
    <text class="target-leakage-desc" x="44" y="166">Computed over the training data.</text>
  </g>
  <line class="target-leakage-line target-leakage-conn target-leakage-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#target-leakage-tip)"/>
  <g class="target-leakage-stage target-leakage-s1">
    <rect class="target-leakage-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="target-leakage-step" x="280" y="142">02</text>
    <text class="target-leakage-name" x="306" y="142">Which uses the target for every row, including its own</text>
    <text class="target-leakage-desc" x="280" y="166">So the encoded value leaks the</text>
    <text class="target-leakage-desc" x="280" y="182">answer.</text>
  </g>
  <line class="target-leakage-line target-leakage-conn target-leakage-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#target-leakage-tip)"/>
  <g class="target-leakage-stage target-leakage-s2">
    <rect class="target-leakage-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="target-leakage-step" x="516" y="142">03</text>
    <text class="target-leakage-name" x="542" y="142">Producing excellent validation scores and poor production ones</text>
    <text class="target-leakage-desc" x="516" y="166">Especially for rare categories.</text>
  </g>
  <line class="target-leakage-line target-leakage-conn target-leakage-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#target-leakage-tip)"/>
  <g class="target-leakage-stage target-leakage-s3">
    <rect class="target-leakage-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="target-leakage-step" x="752" y="142">04</text>
    <text class="target-leakage-name" x="778" y="142">Encode each fold using the other folds only</text>
    <text class="target-leakage-desc" x="752" y="166">And smooth toward the global</text>
    <text class="target-leakage-desc" x="752" y="182">mean.</text>
  </g>
  <text class="target-leakage-sub" x="30" y="304">Rare categories are where this bites hardest: a category appearing once gets encoded as its own target value, which is a direct copy of the label.</text>
</svg>
