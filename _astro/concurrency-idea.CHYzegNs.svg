<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four distinctions.">
  <title>The three models</title>
  <style>
    .concurrency-idea-bg   { fill: #f8fafc; }
    .concurrency-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .concurrency-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .concurrency-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .concurrency-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .concurrency-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .concurrency-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .concurrency-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .concurrency-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .concurrency-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .concurrency-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .concurrency-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .concurrency-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .concurrency-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .concurrency-idea-stage { opacity: 1; }

    .concurrency-idea-s0 { animation-delay: 0.00s; }
    .concurrency-idea-e0 { animation-delay: 0.00s; }
    .concurrency-idea-s1 { animation-delay: 1.28s; }
    .concurrency-idea-e1 { animation-delay: 1.28s; }
    .concurrency-idea-s2 { animation-delay: 2.56s; }
    .concurrency-idea-e2 { animation-delay: 2.56s; }
    .concurrency-idea-s3 { animation-delay: 3.84s; }
    .concurrency-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .concurrency-idea-conn  { animation: concurrency-idea-trace 6.4s ease-in-out infinite; }
      .concurrency-idea-stage { animation: concurrency-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes concurrency-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes concurrency-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .concurrency-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .concurrency-idea-stage { animation: concurrency-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes concurrency-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="concurrency-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="concurrency-idea-bg" width="980" height="322"/>
  <text class="concurrency-idea-h1"  x="30" y="40">The three models</text>
  <text class="concurrency-idea-sub" x="30" y="64">Four distinctions.</text>
  <g class="concurrency-idea-stage concurrency-idea-s0">
    <rect class="concurrency-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="concurrency-idea-step" x="44" y="142">01</text>
    <text class="concurrency-idea-name" x="70" y="142">Threads: share memory, good for waiting</text>
    <text class="concurrency-idea-desc" x="44" y="166">Limited for computation by the</text>
    <text class="concurrency-idea-desc" x="44" y="182">interpreter lock.</text>
  </g>
  <line class="concurrency-idea-line concurrency-idea-conn concurrency-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#concurrency-idea-tip)"/>
  <g class="concurrency-idea-stage concurrency-idea-s1">
    <rect class="concurrency-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="concurrency-idea-step" x="280" y="142">02</text>
    <text class="concurrency-idea-name" x="306" y="142">Processes: separate memory, good for computing</text>
    <text class="concurrency-idea-desc" x="280" y="166">At the cost of communication.</text>
  </g>
  <line class="concurrency-idea-line concurrency-idea-conn concurrency-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#concurrency-idea-tip)"/>
  <g class="concurrency-idea-stage concurrency-idea-s2">
    <rect class="concurrency-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="concurrency-idea-step" x="516" y="142">03</text>
    <text class="concurrency-idea-name" x="542" y="142">Asynchronous: one thread, many waits interleaved</text>
    <text class="concurrency-idea-desc" x="516" y="166">Efficient for very many</text>
    <text class="concurrency-idea-desc" x="516" y="182">connections.</text>
  </g>
  <line class="concurrency-idea-line concurrency-idea-conn concurrency-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#concurrency-idea-tip)"/>
  <g class="concurrency-idea-stage concurrency-idea-s3">
    <rect class="concurrency-idea-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="concurrency-idea-step" x="752" y="142">04</text>
    <text class="concurrency-idea-name" x="778" y="142">And the deciding question is simple</text>
    <text class="concurrency-idea-desc" x="752" y="166">Is the work waiting, or</text>
    <text class="concurrency-idea-desc" x="752" y="182">computing?</text>
  </g>
  <text class="concurrency-idea-sub" x="30" y="304">Waiting or computing is genuinely the whole decision, and asking it first avoids most of the wasted effort in concurrent Python.</text>
</svg>
