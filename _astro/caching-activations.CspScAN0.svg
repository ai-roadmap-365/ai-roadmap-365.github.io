<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And what that costs.">
  <title>Why the forward pass caches</title>
  <style>
    .caching-activations-bg   { fill: #f8fafc; }
    .caching-activations-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .caching-activations-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .caching-activations-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .caching-activations-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .caching-activations-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .caching-activations-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .caching-activations-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .caching-activations-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .caching-activations-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .caching-activations-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .caching-activations-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .caching-activations-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .caching-activations-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .caching-activations-stage { opacity: 1; }

    .caching-activations-s0 { animation-delay: 0.00s; }
    .caching-activations-e0 { animation-delay: 0.00s; }
    .caching-activations-s1 { animation-delay: 1.28s; }
    .caching-activations-e1 { animation-delay: 1.28s; }
    .caching-activations-s2 { animation-delay: 2.56s; }
    .caching-activations-e2 { animation-delay: 2.56s; }
    .caching-activations-s3 { animation-delay: 3.84s; }
    .caching-activations-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .caching-activations-conn  { animation: caching-activations-trace 6.4s ease-in-out infinite; }
      .caching-activations-stage { animation: caching-activations-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes caching-activations-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes caching-activations-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .caching-activations-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .caching-activations-stage { animation: caching-activations-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes caching-activations-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="caching-activations-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="caching-activations-bg" width="980" height="322"/>
  <text class="caching-activations-h1"  x="30" y="40">Why the forward pass caches</text>
  <text class="caching-activations-sub" x="30" y="64">And what that costs.</text>
  <g class="caching-activations-stage caching-activations-s0">
    <rect class="caching-activations-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="caching-activations-step" x="44" y="142">01</text>
    <text class="caching-activations-name" x="70" y="142">Store Z and A for every layer</text>
    <text class="caching-activations-desc" x="44" y="166">Pre-activations and activations,</text>
    <text class="caching-activations-desc" x="44" y="182">per layer, per sample.</text>
  </g>
  <line class="caching-activations-line caching-activations-conn caching-activations-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#caching-activations-tip)"/>
  <g class="caching-activations-stage caching-activations-s1">
    <rect class="caching-activations-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="caching-activations-step" x="280" y="142">02</text>
    <text class="caching-activations-name" x="306" y="142">Because the backward pass needs them</text>
    <text class="caching-activations-desc" x="280" y="166">The gradient at each layer</text>
    <text class="caching-activations-desc" x="280" y="182">depends on that layer's inputs.</text>
    <text class="caching-activations-edge" x="280" y="242">Day 200</text>
  </g>
  <line class="caching-activations-line caching-activations-conn caching-activations-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#caching-activations-tip)"/>
  <g class="caching-activations-stage caching-activations-s2">
    <rect class="caching-activations-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="caching-activations-step" x="516" y="142">03</text>
    <text class="caching-activations-name" x="542" y="142">Memory scales with batch size</text>
    <text class="caching-activations-desc" x="516" y="166">Which is why batch size is</text>
    <text class="caching-activations-desc" x="516" y="182">bounded by VRAM rather than by</text>
    <text class="caching-activations-desc" x="516" y="198">preference.</text>
  </g>
  <line class="caching-activations-line caching-activations-conn caching-activations-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#caching-activations-tip)"/>
  <g class="caching-activations-stage caching-activations-s3">
    <rect class="caching-activations-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="caching-activations-step" x="752" y="142">04</text>
    <text class="caching-activations-name" x="778" y="142">Inference discards them</text>
    <text class="caching-activations-desc" x="752" y="166">No backward pass, so no cache —</text>
    <text class="caching-activations-desc" x="752" y="182">which is why serving needs far</text>
    <text class="caching-activations-desc" x="752" y="198">less memory.</text>
  </g>
  <text class="caching-activations-sub" x="30" y="304">This is why a model that trains on eight samples per batch can serve hundreds concurrently: the parameters are the same, and the activation cache is not there.</text>
</svg>
