<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="r, w and x change meaning on a directory.">
  <title>The same three letters mean different things</title>
  <style>
    .file-versus-directory-bits-bg   { fill: #f8fafc; }
    .file-versus-directory-bits-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-versus-directory-bits-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-versus-directory-bits-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-versus-directory-bits-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-versus-directory-bits-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-versus-directory-bits-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .file-versus-directory-bits-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .file-versus-directory-bits-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .file-versus-directory-bits-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .file-versus-directory-bits-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .file-versus-directory-bits-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .file-versus-directory-bits-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .file-versus-directory-bits-row { opacity: 1; }
    .file-versus-directory-bits-r0 { animation-delay: 0.00s; }
    .file-versus-directory-bits-r1 { animation-delay: 0.45s; }
    .file-versus-directory-bits-r2 { animation-delay: 0.90s; }
    .file-versus-directory-bits-r3 { animation-delay: 1.35s; }
    .file-versus-directory-bits-r4 { animation-delay: 1.80s; }
    .file-versus-directory-bits-row { animation: file-versus-directory-bits-reveal 7.3s ease-in-out infinite; }
    @keyframes file-versus-directory-bits-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="file-versus-directory-bits-bg" width="980" height="390"/>
  <text class="file-versus-directory-bits-h1"  x="30" y="40">The same three letters mean different things</text>
  <text class="file-versus-directory-bits-sub" x="30" y="64">r, w and x change meaning on a directory.</text>
  <rect class="file-versus-directory-bits-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="file-versus-directory-bits-name" x="46" y="122">On a file</text>
  <text class="file-versus-directory-bits-desc" x="46" y="142">The obvious meanings.</text>
  <text class="file-versus-directory-bits-desc file-versus-directory-bits-row file-versus-directory-bits-r0" x="46" y="182">r — you may view the contents</text>
  <text class="file-versus-directory-bits-desc file-versus-directory-bits-row file-versus-directory-bits-r1" x="46" y="216">w — you may change the contents</text>
  <text class="file-versus-directory-bits-desc file-versus-directory-bits-row file-versus-directory-bits-r2" x="46" y="250">x — you may run it as a program</text>
  <text class="file-versus-directory-bits-desc file-versus-directory-bits-row file-versus-directory-bits-r3" x="46" y="284">No x means a script is just data</text>
  <text class="file-versus-directory-bits-desc file-versus-directory-bits-row file-versus-directory-bits-r4" x="46" y="318">chmod +x is what makes ./train.sh work</text>
  <rect class="file-versus-directory-bits-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="file-versus-directory-bits-name" x="526" y="122">On a directory</text>
  <text class="file-versus-directory-bits-desc" x="526" y="142">Where the confusion lives.</text>
  <text class="file-versus-directory-bits-desc file-versus-directory-bits-row file-versus-directory-bits-r0" x="526" y="182">r — you may list the names inside</text>
  <text class="file-versus-directory-bits-desc file-versus-directory-bits-row file-versus-directory-bits-r1" x="526" y="216">w — you may add or remove entries</text>
  <text class="file-versus-directory-bits-desc file-versus-directory-bits-row file-versus-directory-bits-r2" x="526" y="250">x — you may enter it and reach through it</text>
  <text class="file-versus-directory-bits-desc file-versus-directory-bits-row file-versus-directory-bits-r3" x="526" y="284">r without x lists names you cannot open</text>
  <text class="file-versus-directory-bits-desc file-versus-directory-bits-row file-versus-directory-bits-r4" x="526" y="318">w on the directory lets you delete a file you cannot write</text>
  <text class="file-versus-directory-bits-sub" x="30" y="372">That last row surprises everyone: deleting a file is a change to its directory, not to the file. Permission to delete comes from the directory.</text>
</svg>
