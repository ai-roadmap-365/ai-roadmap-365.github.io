<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two of them reach the internet.">
  <title>Five consequences of a Compose file</title>
  <style>
    .compose-implications-bg   { fill: #f8fafc; }
    .compose-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compose-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compose-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compose-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compose-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compose-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .compose-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .compose-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .compose-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .compose-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .compose-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .compose-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .compose-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .compose-implications-stage { opacity: 1; }

    .compose-implications-s0 { animation-delay: 0.00s; }
    .compose-implications-e0 { animation-delay: 0.00s; }
    .compose-implications-s1 { animation-delay: 1.33s; }
    .compose-implications-e1 { animation-delay: 1.33s; }
    .compose-implications-s2 { animation-delay: 2.67s; }
    .compose-implications-e2 { animation-delay: 2.67s; }
    .compose-implications-s3 { animation-delay: 4.00s; }
    .compose-implications-e3 { animation-delay: 4.00s; }
    .compose-implications-s4 { animation-delay: 5.33s; }
    .compose-implications-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .compose-implications-conn  { animation: compose-implications-trace 8s ease-in-out infinite; }
      .compose-implications-stage { animation: compose-implications-arrive 8s ease-in-out infinite; }
    }
    @keyframes compose-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes compose-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .compose-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .compose-implications-stage { animation: compose-implications-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes compose-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="compose-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="compose-implications-bg" width="980" height="322"/>
  <text class="compose-implications-h1"  x="30" y="40">Five consequences of a Compose file</text>
  <text class="compose-implications-sub" x="30" y="64">Two of them reach the internet.</text>
  <g class="compose-implications-stage compose-implications-s0">
    <rect class="compose-implications-warn" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="compose-implications-step" x="44" y="142">01</text>
    <text class="compose-implications-name" x="70" y="142">ports: binds on the host</text>
    <text class="compose-implications-desc" x="44" y="166">On a cloud VM with a</text>
    <text class="compose-implications-desc" x="44" y="182">permissive group,</text>
    <text class="compose-implications-desc" x="44" y="198">5432:5432 means the</text>
    <text class="compose-implications-edge" x="44" y="242">security</text>
  </g>
  <line class="compose-implications-line compose-implications-conn compose-implications-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#compose-implications-tip)"/>
  <g class="compose-implications-stage compose-implications-s1">
    <rect class="compose-implications-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="compose-implications-step" x="233" y="142">02</text>
    <text class="compose-implications-name" x="259" y="142">environment: lives in Git</text>
    <text class="compose-implications-desc" x="233" y="166">A committed</text>
    <text class="compose-implications-desc" x="233" y="182">POSTGRES_PASSWORD is the</text>
    <text class="compose-implications-desc" x="233" y="198">commonest first-review</text>
    <text class="compose-implications-edge" x="233" y="242">secrets</text>
  </g>
  <line class="compose-implications-line compose-implications-conn compose-implications-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#compose-implications-tip)"/>
  <g class="compose-implications-stage compose-implications-s2">
    <rect class="compose-implications-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="compose-implications-step" x="422" y="142">03</text>
    <text class="compose-implications-name" x="448" y="142">Retry without backoff</text>
    <text class="compose-implications-desc" x="422" y="166">Hammers the dependency</text>
    <text class="compose-implications-desc" x="422" y="182">exactly while it is</text>
    <text class="compose-implications-desc" x="422" y="198">coming up.</text>
    <text class="compose-implications-edge" x="422" y="242">availability</text>
  </g>
  <line class="compose-implications-line compose-implications-conn compose-implications-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#compose-implications-tip)"/>
  <g class="compose-implications-stage compose-implications-s3">
    <rect class="compose-implications-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="compose-implications-step" x="611" y="142">04</text>
    <text class="compose-implications-name" x="637" y="142">Nothing at run time</text>
    <text class="compose-implications-desc" x="611" y="166">They are ordinary</text>
    <text class="compose-implications-desc" x="611" y="182">containers. Compose</text>
    <text class="compose-implications-desc" x="611" y="198">affects only startup.</text>
    <text class="compose-implications-edge" x="611" y="242">performance</text>
  </g>
  <line class="compose-implications-line compose-implications-conn compose-implications-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#compose-implications-tip)"/>
  <g class="compose-implications-stage compose-implications-s4">
    <rect class="compose-implications-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="compose-implications-step" x="800" y="142">05</text>
    <text class="compose-implications-name" x="826" y="142">deploy.replicas shares one host</text>
    <text class="compose-implications-desc" x="800" y="166">Concurrency on one</text>
    <text class="compose-implications-desc" x="800" y="182">machine, with one</text>
    <text class="compose-implications-desc" x="800" y="198">machine's failure domain.</text>
    <text class="compose-implications-edge" x="800" y="242">not scale</text>
  </g>
  <text class="compose-implications-sub" x="30" y="304">`127.0.0.1:5432:5432` is the form local debugging actually wants: it binds loopback only, so the port is reachable from your terminal and not from the network the VM is attached to.</text>
</svg>
