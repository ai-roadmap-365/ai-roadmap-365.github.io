<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" font-family="system-ui, sans-serif">
  <title>The four CRUD operations mapped to their HTTP methods and typical success status codes</title>
  <rect x="0" y="0" width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">CRUD mapped to HTTP verbs</text>

  <!-- Column headers -->
  <text x="150" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">CRUD operation</text>
  <text x="410" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">HTTP verb + target</text>
  <text x="670" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">success code</text>

  <!-- Create -->
  <rect x="40" y="88" width="220" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="150" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Create</text>
  <text x="150" y="140" text-anchor="middle" font-size="13" fill="#1a202c">add a new item</text>
  <line x1="260" y1="123" x2="292" y2="123" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="300,123 286,116 286,130" fill="#1d4ed8"/>
  <rect x="300" y="88" width="220" height="70" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="410" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">POST</text>
  <text x="410" y="138" text-anchor="middle" font-size="13" fill="#1a202c">/posts (collection)</text>
  <text x="670" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">201 Created</text>

  <!-- Read -->
  <rect x="40" y="168" width="220" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="150" y="198" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Read</text>
  <text x="150" y="220" text-anchor="middle" font-size="13" fill="#1a202c">fetch (safe)</text>
  <line x1="260" y1="203" x2="292" y2="203" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="300,203 286,196 286,210" fill="#1d4ed8"/>
  <rect x="300" y="168" width="220" height="70" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="410" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">GET</text>
  <text x="410" y="218" text-anchor="middle" font-size="13" fill="#1a202c">/posts or /posts/1</text>
  <text x="670" y="208" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">200 OK</text>

  <!-- Update -->
  <rect x="40" y="248" width="220" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="150" y="278" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Update</text>
  <text x="150" y="300" text-anchor="middle" font-size="13" fill="#1a202c">replace / amend</text>
  <line x1="260" y1="283" x2="292" y2="283" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="300,283 286,276 286,290" fill="#1d4ed8"/>
  <rect x="300" y="248" width="220" height="70" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="410" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">PUT / PATCH</text>
  <text x="410" y="298" text-anchor="middle" font-size="13" fill="#1a202c">/posts/1 (item)</text>
  <text x="670" y="288" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">200 OK</text>

  <!-- Delete -->
  <rect x="40" y="328" width="220" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="150" y="358" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Delete</text>
  <text x="150" y="380" text-anchor="middle" font-size="13" fill="#1a202c">remove</text>
  <line x1="260" y1="363" x2="292" y2="363" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="300,363 286,356 286,370" fill="#1d4ed8"/>
  <rect x="300" y="328" width="220" height="70" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="410" y="356" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">DELETE</text>
  <text x="410" y="378" text-anchor="middle" font-size="13" fill="#1a202c">/posts/1 (item)</text>
  <text x="670" y="360" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">200 / 204</text>

  <!-- footer note -->
  <text x="380" y="430" text-anchor="middle" font-size="13" fill="#1d4ed8" font-weight="bold">POST targets the collection; GET, PUT, PATCH, and DELETE target one item.</text>
</svg>
