<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="In this order.">
  <title>Four checks, before any training</title>
  <style>
    .golden-protocol-bg   { fill: #f8fafc; }
    .golden-protocol-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .golden-protocol-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .golden-protocol-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .golden-protocol-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .golden-protocol-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .golden-protocol-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .golden-protocol-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .golden-protocol-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .golden-protocol-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .golden-protocol-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .golden-protocol-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .golden-protocol-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .golden-protocol-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .golden-protocol-stage { opacity: 1; }

    .golden-protocol-s0 { animation-delay: 0.00s; }
    .golden-protocol-e0 { animation-delay: 0.00s; }
    .golden-protocol-s1 { animation-delay: 1.28s; }
    .golden-protocol-e1 { animation-delay: 1.28s; }
    .golden-protocol-s2 { animation-delay: 2.56s; }
    .golden-protocol-e2 { animation-delay: 2.56s; }
    .golden-protocol-s3 { animation-delay: 3.84s; }
    .golden-protocol-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .golden-protocol-conn  { animation: golden-protocol-trace 6.4s ease-in-out infinite; }
      .golden-protocol-stage { animation: golden-protocol-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes golden-protocol-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes golden-protocol-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .golden-protocol-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .golden-protocol-stage { animation: golden-protocol-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes golden-protocol-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="golden-protocol-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="golden-protocol-bg" width="980" height="322"/>
  <text class="golden-protocol-h1"  x="30" y="40">Four checks, before any training</text>
  <text class="golden-protocol-sub" x="30" y="64">In this order.</text>
  <g class="golden-protocol-stage golden-protocol-s0">
    <rect class="golden-protocol-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="golden-protocol-step" x="44" y="142">01</text>
    <text class="golden-protocol-name" x="70" y="142">Verify the initial loss</text>
    <text class="golden-protocol-desc" x="44" y="166">For K balanced classes,</text>
    <text class="golden-protocol-desc" x="44" y="182">cross-entropy starts at the</text>
    <text class="golden-protocol-desc" x="44" y="198">natural log of K.</text>
    <text class="golden-protocol-edge" x="44" y="242">predictable</text>
  </g>
  <line class="golden-protocol-line golden-protocol-conn golden-protocol-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#golden-protocol-tip)"/>
  <g class="golden-protocol-stage golden-protocol-s1">
    <rect class="golden-protocol-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="golden-protocol-step" x="280" y="142">02</text>
    <text class="golden-protocol-name" x="306" y="142">Overfit a single batch</text>
    <text class="golden-protocol-desc" x="280" y="166">Sixteen samples to near-zero</text>
    <text class="golden-protocol-desc" x="280" y="182">loss. If it cannot, stop and</text>
    <text class="golden-protocol-desc" x="280" y="198">find the bug.</text>
  </g>
  <line class="golden-protocol-line golden-protocol-conn golden-protocol-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#golden-protocol-tip)"/>
  <g class="golden-protocol-stage golden-protocol-s2">
    <rect class="golden-protocol-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="golden-protocol-step" x="516" y="142">03</text>
    <text class="golden-protocol-name" x="542" y="142">Check gradient norms</text>
    <text class="golden-protocol-desc" x="516" y="166">Near zero means nothing flows;</text>
    <text class="golden-protocol-desc" x="516" y="182">enormous means the next step</text>
    <text class="golden-protocol-desc" x="516" y="198">explodes.</text>
  </g>
  <line class="golden-protocol-line golden-protocol-conn golden-protocol-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#golden-protocol-tip)"/>
  <g class="golden-protocol-stage golden-protocol-s3">
    <rect class="golden-protocol-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="golden-protocol-step" x="752" y="142">04</text>
    <text class="golden-protocol-name" x="778" y="142">Verify data and label alignment</text>
    <text class="golden-protocol-desc" x="752" y="166">Look at the inputs beside their</text>
    <text class="golden-protocol-desc" x="752" y="182">decoded labels. Off-by-one is</text>
    <text class="golden-protocol-desc" x="752" y="198">common.</text>
  </g>
  <text class="golden-protocol-sub" x="30" y="304">The order matters because each check is cheaper than the last: the initial loss costs one forward pass, and it rules out an entire class of label and output-layer bugs before anything trains.</text>
</svg>
