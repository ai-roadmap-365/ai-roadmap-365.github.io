<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four behaviours.">
  <title>The join types</title>
  <style>
    .join-types-bg   { fill: #f8fafc; }
    .join-types-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .join-types-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .join-types-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .join-types-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .join-types-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .join-types-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .join-types-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .join-types-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .join-types-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .join-types-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .join-types-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .join-types-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .join-types-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .join-types-stage { opacity: 1; }

    .join-types-s0 { animation-delay: 0.00s; }
    .join-types-e0 { animation-delay: 0.00s; }
    .join-types-s1 { animation-delay: 1.28s; }
    .join-types-e1 { animation-delay: 1.28s; }
    .join-types-s2 { animation-delay: 2.56s; }
    .join-types-e2 { animation-delay: 2.56s; }
    .join-types-s3 { animation-delay: 3.84s; }
    .join-types-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .join-types-conn  { animation: join-types-trace 6.4s ease-in-out infinite; }
      .join-types-stage { animation: join-types-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes join-types-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes join-types-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .join-types-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .join-types-stage { animation: join-types-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes join-types-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="join-types-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="join-types-bg" width="980" height="322"/>
  <text class="join-types-h1"  x="30" y="40">The join types</text>
  <text class="join-types-sub" x="30" y="64">Four behaviours.</text>
  <g class="join-types-stage join-types-s0">
    <rect class="join-types-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="join-types-step" x="44" y="142">01</text>
    <text class="join-types-name" x="70" y="142">Inner: only rows matching on both sides</text>
    <text class="join-types-desc" x="44" y="166">Unmatched rows disappear.</text>
  </g>
  <line class="join-types-line join-types-conn join-types-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#join-types-tip)"/>
  <g class="join-types-stage join-types-s1">
    <rect class="join-types-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="join-types-step" x="280" y="142">02</text>
    <text class="join-types-name" x="306" y="142">Left: every row from the left, matched or not</text>
    <text class="join-types-desc" x="280" y="166">With missing values where there</text>
    <text class="join-types-desc" x="280" y="182">is no match.</text>
  </g>
  <line class="join-types-line join-types-conn join-types-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#join-types-tip)"/>
  <g class="join-types-stage join-types-s2">
    <rect class="join-types-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="join-types-step" x="516" y="142">03</text>
    <text class="join-types-name" x="542" y="142">Right: the same, from the other side</text>
    <text class="join-types-desc" x="516" y="166">Rarely used; a left join</text>
    <text class="join-types-desc" x="516" y="182">reversed.</text>
  </g>
  <line class="join-types-line join-types-conn join-types-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#join-types-tip)"/>
  <g class="join-types-stage join-types-s3">
    <rect class="join-types-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="join-types-step" x="752" y="142">04</text>
    <text class="join-types-name" x="778" y="142">Full: everything from both, matched or not</text>
    <text class="join-types-desc" x="752" y="166">Which shows both kinds of gap.</text>
  </g>
  <text class="join-types-sub" x="30" y="304">A left join is the safe default when you want to keep a base table intact, because an inner join quietly drops the rows you were trying to describe.</text>
</svg>
