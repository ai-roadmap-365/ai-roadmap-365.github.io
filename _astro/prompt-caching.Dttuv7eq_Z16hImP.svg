<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Pay once for the fixed part.">
  <title>Prompt caching</title>
  <style>
    .prompt-caching-bg   { fill: #f8fafc; }
    .prompt-caching-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-caching-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-caching-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-caching-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-caching-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-caching-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prompt-caching-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .prompt-caching-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .prompt-caching-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .prompt-caching-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .prompt-caching-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .prompt-caching-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .prompt-caching-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .prompt-caching-stage { opacity: 1; }

    .prompt-caching-s0 { animation-delay: 0.00s; }
    .prompt-caching-e0 { animation-delay: 0.00s; }
    .prompt-caching-s1 { animation-delay: 1.28s; }
    .prompt-caching-e1 { animation-delay: 1.28s; }
    .prompt-caching-s2 { animation-delay: 2.56s; }
    .prompt-caching-e2 { animation-delay: 2.56s; }
    .prompt-caching-s3 { animation-delay: 3.84s; }
    .prompt-caching-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .prompt-caching-conn  { animation: prompt-caching-trace 6.4s ease-in-out infinite; }
      .prompt-caching-stage { animation: prompt-caching-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes prompt-caching-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes prompt-caching-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .prompt-caching-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .prompt-caching-stage { animation: prompt-caching-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes prompt-caching-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="prompt-caching-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="prompt-caching-bg" width="980" height="322"/>
  <text class="prompt-caching-h1"  x="30" y="40">Prompt caching</text>
  <text class="prompt-caching-sub" x="30" y="64">Pay once for the fixed part.</text>
  <g class="prompt-caching-stage prompt-caching-s0">
    <rect class="prompt-caching-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-caching-step" x="44" y="142">01</text>
    <text class="prompt-caching-name" x="70" y="142">Most prompts share a long prefix</text>
    <text class="prompt-caching-desc" x="44" y="166">System instructions, examples,</text>
    <text class="prompt-caching-desc" x="44" y="182">retrieved documents.</text>
  </g>
  <line class="prompt-caching-line prompt-caching-conn prompt-caching-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#prompt-caching-tip)"/>
  <g class="prompt-caching-stage prompt-caching-s1">
    <rect class="prompt-caching-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-caching-step" x="280" y="142">02</text>
    <text class="prompt-caching-name" x="306" y="142">Which is re-processed on every request</text>
    <text class="prompt-caching-desc" x="280" y="166">And billed every time.</text>
  </g>
  <line class="prompt-caching-line prompt-caching-conn prompt-caching-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#prompt-caching-tip)"/>
  <g class="prompt-caching-stage prompt-caching-s2">
    <rect class="prompt-caching-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-caching-step" x="516" y="142">03</text>
    <text class="prompt-caching-name" x="542" y="142">Cache the computed state for that prefix</text>
    <text class="prompt-caching-desc" x="516" y="166">Keyed on an exact match from the</text>
    <text class="prompt-caching-desc" x="516" y="182">start.</text>
  </g>
  <line class="prompt-caching-line prompt-caching-conn prompt-caching-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#prompt-caching-tip)"/>
  <g class="prompt-caching-stage prompt-caching-s3">
    <rect class="prompt-caching-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-caching-step" x="752" y="142">04</text>
    <text class="prompt-caching-name" x="778" y="142">A large discount on the cached part</text>
    <text class="prompt-caching-desc" x="752" y="166">Which makes long system prompts</text>
    <text class="prompt-caching-desc" x="752" y="182">affordable.</text>
  </g>
  <text class="prompt-caching-sub" x="30" y="304">The exact-prefix requirement shapes prompt design: anything variable must go after everything fixed, or the cache never hits and the feature does nothing.</text>
</svg>
