<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Different questions.">
  <title>Set overlap against angle</title>
  <style>
    .jaccard-cosine-bg   { fill: #f8fafc; }
    .jaccard-cosine-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .jaccard-cosine-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .jaccard-cosine-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .jaccard-cosine-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .jaccard-cosine-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .jaccard-cosine-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .jaccard-cosine-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .jaccard-cosine-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .jaccard-cosine-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .jaccard-cosine-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .jaccard-cosine-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .jaccard-cosine-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .jaccard-cosine-row { opacity: 1; }
    .jaccard-cosine-r0 { animation-delay: 0.00s; }
    .jaccard-cosine-r1 { animation-delay: 0.45s; }
    .jaccard-cosine-r2 { animation-delay: 0.90s; }
    .jaccard-cosine-r3 { animation-delay: 1.35s; }
    .jaccard-cosine-r4 { animation-delay: 1.80s; }
    .jaccard-cosine-row { animation: jaccard-cosine-reveal 7.3s ease-in-out infinite; }
    @keyframes jaccard-cosine-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="jaccard-cosine-bg" width="980" height="390"/>
  <text class="jaccard-cosine-h1"  x="30" y="40">Set overlap against angle</text>
  <text class="jaccard-cosine-sub" x="30" y="64">Different questions.</text>
  <rect class="jaccard-cosine-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="jaccard-cosine-name" x="46" y="122">Set overlap</text>
  <text class="jaccard-cosine-desc" x="46" y="142">What is shared.</text>
  <text class="jaccard-cosine-desc jaccard-cosine-row jaccard-cosine-r0" x="46" y="182">Shared elements over total distinct elements</text>
  <text class="jaccard-cosine-desc jaccard-cosine-row jaccard-cosine-r1" x="46" y="216">Ignores how many times each occurs</text>
  <text class="jaccard-cosine-desc jaccard-cosine-row jaccard-cosine-r2" x="46" y="250">Right for tags, categories, presence</text>
  <text class="jaccard-cosine-desc jaccard-cosine-row jaccard-cosine-r3" x="46" y="284">Bounded between zero and one</text>
  <text class="jaccard-cosine-desc jaccard-cosine-row jaccard-cosine-r4" x="46" y="318">Insensitive to magnitude by construction</text>
  <rect class="jaccard-cosine-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="jaccard-cosine-name" x="526" y="122">Angular similarity</text>
  <text class="jaccard-cosine-desc" x="526" y="142">How aligned.</text>
  <text class="jaccard-cosine-desc jaccard-cosine-row jaccard-cosine-r0" x="526" y="182">The angle between count vectors</text>
  <text class="jaccard-cosine-desc jaccard-cosine-row jaccard-cosine-r1" x="526" y="216">Uses the counts, not just presence</text>
  <text class="jaccard-cosine-desc jaccard-cosine-row jaccard-cosine-r2" x="526" y="250">Right for weighted or continuous features</text>
  <text class="jaccard-cosine-desc jaccard-cosine-row jaccard-cosine-r3" x="526" y="284">Bounded between minus one and one</text>
  <text class="jaccard-cosine-desc jaccard-cosine-row jaccard-cosine-r4" x="526" y="318">Insensitive to magnitude by division</text>
  <text class="jaccard-cosine-sub" x="30" y="372">They rank the same pairs differently, so a retrieval system's results change entirely with the choice — which makes it a decision rather than a default.</text>
</svg>
