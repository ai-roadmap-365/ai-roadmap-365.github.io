<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Six commands, and one of them deserves fear.">
  <title>Reshaping the tree</title>
  <style>
    .filesystem-verbs-bg   { fill: #f8fafc; }
    .filesystem-verbs-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .filesystem-verbs-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .filesystem-verbs-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .filesystem-verbs-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .filesystem-verbs-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .filesystem-verbs-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .filesystem-verbs-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .filesystem-verbs-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .filesystem-verbs-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .filesystem-verbs-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .filesystem-verbs-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .filesystem-verbs-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .filesystem-verbs-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .filesystem-verbs-stage { opacity: 1; }

    .filesystem-verbs-s0 { animation-delay: 0.00s; }
    .filesystem-verbs-e0 { animation-delay: 0.00s; }
    .filesystem-verbs-s1 { animation-delay: 1.33s; }
    .filesystem-verbs-e1 { animation-delay: 1.33s; }
    .filesystem-verbs-s2 { animation-delay: 2.67s; }
    .filesystem-verbs-e2 { animation-delay: 2.67s; }
    .filesystem-verbs-s3 { animation-delay: 4.00s; }
    .filesystem-verbs-e3 { animation-delay: 4.00s; }
    .filesystem-verbs-s4 { animation-delay: 5.33s; }
    .filesystem-verbs-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .filesystem-verbs-conn  { animation: filesystem-verbs-trace 8s ease-in-out infinite; }
      .filesystem-verbs-stage { animation: filesystem-verbs-arrive 8s ease-in-out infinite; }
    }
    @keyframes filesystem-verbs-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes filesystem-verbs-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .filesystem-verbs-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .filesystem-verbs-stage { animation: filesystem-verbs-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes filesystem-verbs-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="filesystem-verbs-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="filesystem-verbs-bg" width="980" height="322"/>
  <text class="filesystem-verbs-h1"  x="30" y="40">Reshaping the tree</text>
  <text class="filesystem-verbs-sub" x="30" y="64">Six commands, and one of them deserves fear.</text>
  <g class="filesystem-verbs-stage filesystem-verbs-s0">
    <rect class="filesystem-verbs-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="filesystem-verbs-step" x="44" y="142">01</text>
    <text class="filesystem-verbs-name" x="70" y="142">mkdir</text>
    <text class="filesystem-verbs-desc" x="44" y="166">Creates a directory. -p</text>
    <text class="filesystem-verbs-desc" x="44" y="182">makes the whole chain and</text>
    <text class="filesystem-verbs-desc" x="44" y="198">does not complain if it</text>
    <text class="filesystem-verbs-edge" x="44" y="242">mkdir -p a/b/c</text>
  </g>
  <line class="filesystem-verbs-line filesystem-verbs-conn filesystem-verbs-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#filesystem-verbs-tip)"/>
  <g class="filesystem-verbs-stage filesystem-verbs-s1">
    <rect class="filesystem-verbs-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="filesystem-verbs-step" x="233" y="142">02</text>
    <text class="filesystem-verbs-name" x="259" y="142">touch</text>
    <text class="filesystem-verbs-desc" x="233" y="166">Creates an empty file, or</text>
    <text class="filesystem-verbs-desc" x="233" y="182">updates the timestamp of</text>
    <text class="filesystem-verbs-desc" x="233" y="198">one that exists.</text>
  </g>
  <line class="filesystem-verbs-line filesystem-verbs-conn filesystem-verbs-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#filesystem-verbs-tip)"/>
  <g class="filesystem-verbs-stage filesystem-verbs-s2">
    <rect class="filesystem-verbs-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="filesystem-verbs-step" x="422" y="142">03</text>
    <text class="filesystem-verbs-name" x="448" y="142">cp</text>
    <text class="filesystem-verbs-desc" x="422" y="166">Copies. Directories need</text>
    <text class="filesystem-verbs-desc" x="422" y="182">-r to reach into</text>
    <text class="filesystem-verbs-desc" x="422" y="198">subdirectories.</text>
    <text class="filesystem-verbs-edge" x="422" y="242">cp -r</text>
  </g>
  <line class="filesystem-verbs-line filesystem-verbs-conn filesystem-verbs-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#filesystem-verbs-tip)"/>
  <g class="filesystem-verbs-stage filesystem-verbs-s3">
    <rect class="filesystem-verbs-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="filesystem-verbs-step" x="611" y="142">04</text>
    <text class="filesystem-verbs-name" x="637" y="142">mv</text>
    <text class="filesystem-verbs-desc" x="611" y="166">Moves or renames — the</text>
    <text class="filesystem-verbs-desc" x="611" y="182">same operation, because</text>
    <text class="filesystem-verbs-desc" x="611" y="198">both just change the</text>
    <text class="filesystem-verbs-edge" x="611" y="242">mv</text>
  </g>
  <line class="filesystem-verbs-line filesystem-verbs-conn filesystem-verbs-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#filesystem-verbs-tip)"/>
  <g class="filesystem-verbs-stage filesystem-verbs-s4">
    <rect class="filesystem-verbs-warn" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="filesystem-verbs-step" x="800" y="142">05</text>
    <text class="filesystem-verbs-name" x="826" y="142">rm</text>
    <text class="filesystem-verbs-desc" x="800" y="166">Unlinks immediately. No</text>
    <text class="filesystem-verbs-desc" x="800" y="182">Trash. No confirmation.</text>
    <text class="filesystem-verbs-desc" x="800" y="198">No undo.</text>
    <text class="filesystem-verbs-edge" x="800" y="242">rm -rf</text>
  </g>
  <text class="filesystem-verbs-sub" x="30" y="304">Moving and renaming are identical to the filesystem: both change the name-to-location entry and touch no data.</text>
</svg>
