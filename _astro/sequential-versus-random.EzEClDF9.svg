<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The only difference is the order the elements are touched in.">
  <title>Same data, same loop, ten times the time</title>
  <style>
    .sequential-versus-random-bg   { fill: #f8fafc; }
    .sequential-versus-random-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sequential-versus-random-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sequential-versus-random-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sequential-versus-random-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sequential-versus-random-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sequential-versus-random-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sequential-versus-random-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sequential-versus-random-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sequential-versus-random-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sequential-versus-random-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sequential-versus-random-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sequential-versus-random-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sequential-versus-random-row { opacity: 1; }
    .sequential-versus-random-r0 { animation-delay: 0.00s; }
    .sequential-versus-random-r1 { animation-delay: 0.45s; }
    .sequential-versus-random-r2 { animation-delay: 0.90s; }
    .sequential-versus-random-r3 { animation-delay: 1.35s; }
    .sequential-versus-random-r4 { animation-delay: 1.80s; }
    .sequential-versus-random-row { animation: sequential-versus-random-reveal 7.3s ease-in-out infinite; }
    @keyframes sequential-versus-random-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="sequential-versus-random-bg" width="980" height="390"/>
  <text class="sequential-versus-random-h1"  x="30" y="40">Same data, same loop, ten times the time</text>
  <text class="sequential-versus-random-sub" x="30" y="64">The only difference is the order the elements are touched in.</text>
  <rect class="sequential-versus-random-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="sequential-versus-random-name" x="46" y="122">Sequential</text>
  <text class="sequential-versus-random-desc" x="46" y="142">Nearly cache speed</text>
  <text class="sequential-versus-random-desc sequential-versus-random-row sequential-versus-random-r0" x="46" y="182">A miss loads a whole 64-byte line</text>
  <text class="sequential-versus-random-desc sequential-versus-random-row sequential-versus-random-r1" x="46" y="216">The next seven reads are already there</text>
  <text class="sequential-versus-random-desc sequential-versus-random-row sequential-versus-random-r2" x="46" y="250">The prefetcher fetches upcoming lines early</text>
  <text class="sequential-versus-random-desc sequential-versus-random-row sequential-versus-random-r3" x="46" y="284">Works on data far larger than the cache</text>
  <text class="sequential-versus-random-desc sequential-versus-random-row sequential-versus-random-r4" x="46" y="318">This is what locality means</text>
  <rect class="sequential-versus-random-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="sequential-versus-random-name" x="526" y="122">Random</text>
  <text class="sequential-versus-random-desc" x="526" y="142">A miss on nearly every read</text>
  <text class="sequential-versus-random-desc sequential-versus-random-row sequential-versus-random-r0" x="526" y="182">Each access lands on a different line</text>
  <text class="sequential-versus-random-desc sequential-versus-random-row sequential-versus-random-r1" x="526" y="216">The rest of each loaded line is wasted</text>
  <text class="sequential-versus-random-desc sequential-versus-random-row sequential-versus-random-r2" x="526" y="250">The prefetcher has no pattern to follow</text>
  <text class="sequential-versus-random-desc sequential-versus-random-row sequential-versus-random-r3" x="526" y="284">Same data, same loop, same total reads</text>
  <text class="sequential-versus-random-desc sequential-versus-random-row sequential-versus-random-r4" x="526" y="318">An order of magnitude slower</text>
  <text class="sequential-versus-random-sub" x="30" y="372">Row-major versus column-major traversal of one array is exactly this difference.</text>
</svg>
