<svg role="img" aria-label="Three-stage LLM training alignment pipeline showing pretraining, supervised fine-tuning, and preference alignment" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>Three-Stage LLM Training &amp; Alignment Pipeline</title>
  <defs>
    <linearGradient id="bg240a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card240" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg240a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">THE THREE PILLARS OF LLM CREATION</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">From Web Completion (Pretraining) to Instruction Following (SFT) to Value Alignment (RLHF / DPO)</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card240)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Stage 1: Pretraining -->
    <rect x="25" y="25" width="220" height="255" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="135" y="50" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">1. Pretraining (Base)</text>
    <text x="40" y="80" fill="#cbd5e1" font-size="8">• Scale: 15 Trillion Tokens</text>
    <text x="40" y="100" fill="#cbd5e1" font-size="8">• Objective: Causal Next-Token</text>
    <text x="40" y="120" fill="#cbd5e1" font-size="8">• Cost: $50M - $100M Compute</text>
    <text x="40" y="140" fill="#cbd5e1" font-size="8">• Hardware: 16,000 GPUs</text>
    <text x="40" y="165" fill="#fbbf24" font-size="8" font-weight="700">What it learns:</text>
    <text x="40" y="185" fill="#94a3b8" font-size="8">Grammar, world facts, coding syntax, math logic, raw reasoning</text>
    <text x="40" y="220" fill="#f43f5e" font-size="8" font-weight="700">Output: Raw Base Model</text>

    <!-- Stage 2: SFT -->
    <rect x="270" y="25" width="220" height="255" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="380" y="50" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">2. Supervised Fine-Tuning</text>
    <text x="285" y="80" fill="#cbd5e1" font-size="8">• Scale: 100k - 1M Dialogues</text>
    <text x="285" y="100" fill="#cbd5e1" font-size="8">• Objective: Masked Token Loss</text>
    <text x="285" y="120" fill="#cbd5e1" font-size="8">• Cost: $1k - $50k Compute</text>
    <text x="285" y="140" fill="#cbd5e1" font-size="8">• Hardware: 8 - 64 GPUs</text>
    <text x="285" y="165" fill="#38bdf8" font-size="8" font-weight="700">What it learns:</text>
    <text x="285" y="185" fill="#94a3b8" font-size="8">User persona, Q&amp;A format, Markdown formatting, tool use calls</text>
    <text x="285" y="220" fill="#fbbf24" font-size="8" font-weight="700">Output: SFT Instruct Model</text>

    <!-- Stage 3: RLHF / DPO -->
    <rect x="515" y="25" width="220" height="255" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="625" y="50" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">3. Preference Alignment</text>
    <text x="530" y="80" fill="#cbd5e1" font-size="8">• Scale: 50k - 200k Pair Comparisons</text>
    <text x="530" y="100" fill="#cbd5e1" font-size="8">• Objective: PPO Reward / DPO Loss</text>
    <text x="530" y="120" fill="#cbd5e1" font-size="8">• Cost: $10k - $100k Compute</text>
    <text x="530" y="140" fill="#cbd5e1" font-size="8">• Hardware: 64 - 256 GPUs</text>
    <text x="530" y="165" fill="#34d399" font-size="8" font-weight="700">What it learns:</text>
    <text x="530" y="185" fill="#94a3b8" font-size="8">Helpfulness, conciseness, safety refusals, truthfulness, tone</text>
    <text x="530" y="220" fill="#34d399" font-size="8" font-weight="700">Output: Production Assistant</text>
  </g>
</svg>
