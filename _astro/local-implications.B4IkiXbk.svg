<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are limits.">
  <title>Four consequences of local inference</title>
  <style>
    .local-implications-bg   { fill: #f8fafc; }
    .local-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .local-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .local-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .local-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .local-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .local-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .local-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .local-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .local-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .local-implications-stage { opacity: 1; }

    .local-implications-s0 { animation-delay: 0.00s; }
    .local-implications-e0 { animation-delay: 0.00s; }
    .local-implications-s1 { animation-delay: 1.28s; }
    .local-implications-e1 { animation-delay: 1.28s; }
    .local-implications-s2 { animation-delay: 2.56s; }
    .local-implications-e2 { animation-delay: 2.56s; }
    .local-implications-s3 { animation-delay: 3.84s; }
    .local-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .local-implications-conn  { animation: local-implications-trace 6.4s ease-in-out infinite; }
      .local-implications-stage { animation: local-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes local-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes local-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .local-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .local-implications-stage { animation: local-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes local-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="local-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="local-implications-bg" width="980" height="322"/>
  <text class="local-implications-h1"  x="30" y="40">Four consequences of local inference</text>
  <text class="local-implications-sub" x="30" y="64">Two are limits.</text>
  <g class="local-implications-stage local-implications-s0">
    <rect class="local-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="local-implications-step" x="44" y="142">01</text>
    <text class="local-implications-name" x="70" y="142">Nothing leaves the machine</text>
    <text class="local-implications-desc" x="44" y="166">Which settles most privacy</text>
    <text class="local-implications-desc" x="44" y="182">questions outright.</text>
  </g>
  <line class="local-implications-line local-implications-conn local-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#local-implications-tip)"/>
  <g class="local-implications-stage local-implications-s1">
    <rect class="local-implications-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="local-implications-step" x="280" y="142">02</text>
    <text class="local-implications-name" x="306" y="142">And the marginal cost is zero</text>
    <text class="local-implications-desc" x="280" y="166">Which changes what is worth</text>
    <text class="local-implications-desc" x="280" y="182">experimenting with.</text>
  </g>
  <line class="local-implications-line local-implications-conn local-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#local-implications-tip)"/>
  <g class="local-implications-stage local-implications-s2">
    <rect class="local-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="local-implications-step" x="516" y="142">03</text>
    <text class="local-implications-name" x="542" y="142">But local models trail the frontier</text>
    <text class="local-implications-desc" x="516" y="166">By months, on hard tasks.</text>
  </g>
  <line class="local-implications-line local-implications-conn local-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#local-implications-tip)"/>
  <g class="local-implications-stage local-implications-s3">
    <rect class="local-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="local-implications-step" x="752" y="142">04</text>
    <text class="local-implications-name" x="778" y="142">And throughput is bounded by your hardware</text>
    <text class="local-implications-desc" x="752" y="166">Which makes it unsuitable for</text>
    <text class="local-implications-desc" x="752" y="182">serving many users.</text>
  </g>
  <text class="local-implications-sub" x="30" y="304">Zero marginal cost is underrated as a capability rather than a saving: it makes exhaustive experiments practical that per-token pricing would rule out.</text>
</svg>
