<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Stripping builtins is the whole trick.">
  <title>Evaluating an expression safely</title>
  <style>
    .safe-eval-bg   { fill: #f8fafc; }
    .safe-eval-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safe-eval-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safe-eval-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safe-eval-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safe-eval-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safe-eval-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .safe-eval-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .safe-eval-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .safe-eval-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .safe-eval-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .safe-eval-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .safe-eval-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .safe-eval-row { opacity: 1; }
    .safe-eval-r0 { animation-delay: 0.00s; }
    .safe-eval-r1 { animation-delay: 0.45s; }
    .safe-eval-r2 { animation-delay: 0.90s; }
    .safe-eval-r3 { animation-delay: 1.35s; }
    .safe-eval-r4 { animation-delay: 1.80s; }
    .safe-eval-row { animation: safe-eval-reveal 7.3s ease-in-out infinite; }
    @keyframes safe-eval-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="safe-eval-bg" width="980" height="390"/>
  <text class="safe-eval-h1"  x="30" y="40">Evaluating an expression safely</text>
  <text class="safe-eval-sub" x="30" y="64">Stripping builtins is the whole trick.</text>
  <rect class="safe-eval-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="safe-eval-name" x="46" y="122">Default namespace</text>
  <text class="safe-eval-desc" x="46" y="142">Arbitrary execution.</text>
  <text class="safe-eval-desc safe-eval-row safe-eval-r0" x="46" y="182">eval(expr) with builtins present</text>
  <text class="safe-eval-desc safe-eval-row safe-eval-r1" x="46" y="216">__import__('os').system(...) is reachable</text>
  <text class="safe-eval-desc safe-eval-row safe-eval-r2" x="46" y="250">The expression came from a model</text>
  <text class="safe-eval-desc safe-eval-row safe-eval-r3" x="46" y="284">And the model reads untrusted text</text>
  <text class="safe-eval-desc safe-eval-row safe-eval-r4" x="46" y="318">One injected string is a shell command</text>
  <rect class="safe-eval-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="safe-eval-name" x="526" y="122">Builtins stripped</text>
  <text class="safe-eval-desc" x="526" y="142">Arithmetic only.</text>
  <text class="safe-eval-desc safe-eval-row safe-eval-r0" x="526" y="182">eval(expr, {"__builtins__": None}, {})</text>
  <text class="safe-eval-desc safe-eval-row safe-eval-r1" x="526" y="216">No imports, no open, no exec</text>
  <text class="safe-eval-desc safe-eval-row safe-eval-r2" x="526" y="250">Arithmetic still evaluates</text>
  <text class="safe-eval-desc safe-eval-row safe-eval-r3" x="526" y="284">Cheap, and it is not a full sandbox</text>
  <text class="safe-eval-desc safe-eval-row safe-eval-r4" x="526" y="318">Pair it with a timeout</text>
  <text class="safe-eval-sub" x="30" y="372">It is worth being clear that this is a hardening measure rather than a sandbox: for anything beyond arithmetic the right boundary is a container or a WASM runtime, as Day 289 argued.</text>
</svg>
