<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Memory, transfer, precision and graphs.">
  <title>Four practical consequences</title>
  <style>
    .tensor-implications-bg   { fill: #f8fafc; }
    .tensor-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tensor-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tensor-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tensor-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tensor-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tensor-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tensor-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tensor-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tensor-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tensor-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tensor-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tensor-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tensor-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tensor-implications-stage { opacity: 1; }

    .tensor-implications-s0 { animation-delay: 0.00s; }
    .tensor-implications-e0 { animation-delay: 0.00s; }
    .tensor-implications-s1 { animation-delay: 1.28s; }
    .tensor-implications-e1 { animation-delay: 1.28s; }
    .tensor-implications-s2 { animation-delay: 2.56s; }
    .tensor-implications-e2 { animation-delay: 2.56s; }
    .tensor-implications-s3 { animation-delay: 3.84s; }
    .tensor-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tensor-implications-conn  { animation: tensor-implications-trace 6.4s ease-in-out infinite; }
      .tensor-implications-stage { animation: tensor-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tensor-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tensor-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tensor-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tensor-implications-stage { animation: tensor-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tensor-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tensor-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tensor-implications-bg" width="980" height="322"/>
  <text class="tensor-implications-h1"  x="30" y="40">Four practical consequences</text>
  <text class="tensor-implications-sub" x="30" y="64">Memory, transfer, precision and graphs.</text>
  <g class="tensor-implications-stage tensor-implications-s0">
    <rect class="tensor-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tensor-implications-step" x="44" y="142">01</text>
    <text class="tensor-implications-name" x="70" y="142">Views share storage</text>
    <text class="tensor-implications-desc" x="44" y="166">Mutating a view mutates the</text>
    <text class="tensor-implications-desc" x="44" y="182">original, which is occasionally</text>
    <text class="tensor-implications-desc" x="44" y="198">surprising.</text>
  </g>
  <line class="tensor-implications-line tensor-implications-conn tensor-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tensor-implications-tip)"/>
  <g class="tensor-implications-stage tensor-implications-s1">
    <rect class="tensor-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tensor-implications-step" x="280" y="142">02</text>
    <text class="tensor-implications-name" x="306" y="142">Host-to-device transfer is a real cost</text>
    <text class="tensor-implications-desc" x="280" y="166">Often the bottleneck rather than</text>
    <text class="tensor-implications-desc" x="280" y="182">the computation.</text>
  </g>
  <line class="tensor-implications-line tensor-implications-conn tensor-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tensor-implications-tip)"/>
  <g class="tensor-implications-stage tensor-implications-s2">
    <rect class="tensor-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tensor-implications-step" x="516" y="142">03</text>
    <text class="tensor-implications-name" x="542" y="142">Precision is a lever</text>
    <text class="tensor-implications-desc" x="516" y="166">Half precision for speed and</text>
    <text class="tensor-implications-desc" x="516" y="182">memory; watch for gradient</text>
    <text class="tensor-implications-desc" x="516" y="198">underflow.</text>
  </g>
  <line class="tensor-implications-line tensor-implications-conn tensor-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tensor-implications-tip)"/>
  <g class="tensor-implications-stage tensor-implications-s3">
    <rect class="tensor-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tensor-implications-step" x="752" y="142">04</text>
    <text class="tensor-implications-name" x="778" y="142">The graph is retained until backward</text>
    <text class="tensor-implications-desc" x="752" y="166">Which is why inference should</text>
    <text class="tensor-implications-desc" x="752" y="182">disable gradient tracking.</text>
  </g>
  <text class="tensor-implications-sub" x="30" y="304">Forgetting to disable gradient tracking during inference is a common and expensive mistake: memory grows with every forward pass, and nothing ever frees it because no backward call arrives.</text>
</svg>
