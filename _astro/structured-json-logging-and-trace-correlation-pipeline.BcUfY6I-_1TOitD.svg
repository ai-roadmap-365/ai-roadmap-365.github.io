<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Structured JSON Logging and Trace Correlation Pipeline">
  <title>Structured JSON Logging and Trace Correlation Pipeline</title>
  <defs>
    <style>
      .d340a-bg { fill: #f8fafc; }
      .d340a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d340a-log { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d340a-pii { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; rx: 8px; }
      .d340a-clk { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d340a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d340a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d340a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d340a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d340a-bg" />
  
  <text x="40" y="40" class="d340a-title">Structured AI Logging &amp; PII Sanitization Architecture</text>
  <text x="40" y="65" class="d340a-subtitle">Structured JSON Logging and Trace Correlation Pipeline showing In-Memory PII Sanitizer, Trace ID Header Injection, Vector Log Shipper, and ClickHouse Analytical Token Cost Dashboard</text>
  
  <!-- Step 1: Structured Log Emitter -->
  <rect x="40" y="110" width="240" height="270" class="d340a-log" />
  <text x="55" y="145" class="d340a-header" fill="#1d4ed8">1. Structured JSON Emitter</text>
  <text x="55" y="180" class="d340a-text">• `trace_id`: "4bf92f3577..."</text>
  <text x="55" y="205" class="d340a-text">• `tenant_id`: "org_acme_99"</text>
  <text x="55" y="230" class="d340a-text">• `prompt_tokens`: 1,420</text>
  <text x="55" y="255" class="d340a-text">• `completion_tokens`: 350</text>
  <text x="55" y="295" class="d340a-text" font-weight="600" fill="#1d4ed8">Standardized Schema</text>
  <text x="55" y="320" class="d340a-text">OpenInference aligned format</text>
  
  <!-- Step 2: In-Memory PII Redaction -->
  <rect x="315" y="110" width="240" height="270" class="d340a-pii" />
  <text x="330" y="145" class="d340a-header" fill="#b91c1c">2. In-Memory PII Sanitizer</text>
  <text x="330" y="180" class="d340a-text">• SSN Regex ➔ `[REDACTED_SSN]`</text>
  <text x="330" y="205" class="d340a-text">• Email Regex ➔ `[REDACTED_EMAIL]`</text>
  <text x="330" y="230" class="d340a-text">• API Key Scrubbing</text>
  <text x="330" y="255" class="d340a-text">• Zero Disk PII Leakage</text>
  <text x="330" y="295" class="d340a-text" font-weight="600" fill="#b91c1c">GDPR / HIPAA Compliant</text>
  <text x="330" y="320" class="d340a-text">Sanitized before network transit</text>
  
  <!-- Step 3: ClickHouse Analytics -->
  <rect x="590" y="110" width="270" height="270" class="d340a-clk" />
  <text x="605" y="145" class="d340a-header" fill="#15803d">3. ClickHouse OLAP Analytics</text>
  <text x="605" y="180" class="d340a-text">• Ingests 50k events/sec</text>
  <text x="605" y="205" class="d340a-text">• Real-time Cost Breakdown</text>
  <text x="605" y="230" class="d340a-text">• Sub-second Multi-Tenant SQL:</text>
  <text x="605" y="250" class="d340a-text">  `SELECT tenant_id, SUM(cost)`</text>
  <text x="605" y="295" class="d340a-text" font-weight="600" fill="#15803d">Accurate Unit Economics</text>
  <text x="605" y="320" class="d340a-text">Financial billing transparency</text>
</svg>