<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Duration decides more than complexity.">
  <title>Which orchestrator fits</title>
  <style>
    .framework-fit-bg   { fill: #f8fafc; }
    .framework-fit-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .framework-fit-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .framework-fit-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .framework-fit-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .framework-fit-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .framework-fit-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .framework-fit-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .framework-fit-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .framework-fit-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .framework-fit-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .framework-fit-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .framework-fit-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .framework-fit-row { opacity: 1; }
    .framework-fit-r0 { animation-delay: 0.00s; }
    .framework-fit-r1 { animation-delay: 0.45s; }
    .framework-fit-r2 { animation-delay: 0.90s; }
    .framework-fit-r3 { animation-delay: 1.35s; }
    .framework-fit-r4 { animation-delay: 1.80s; }
    .framework-fit-row { animation: framework-fit-reveal 7.3s ease-in-out infinite; }
    @keyframes framework-fit-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="framework-fit-bg" width="980" height="390"/>
  <text class="framework-fit-h1"  x="30" y="40">Which orchestrator fits</text>
  <text class="framework-fit-sub" x="30" y="64">Duration decides more than complexity.</text>
  <rect class="framework-fit-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="framework-fit-name" x="46" y="122">Agent-native graphs</text>
  <text class="framework-fit-desc" x="46" y="142">Hours, not weeks.</text>
  <text class="framework-fit-desc framework-fit-row framework-fit-r0" x="46" y="182">LangGraph: cyclic graphs, SQLite or Postgres checkpoints</text>
  <text class="framework-fit-desc framework-fit-row framework-fit-r1" x="46" y="216">CrewAI: role-based, fast to prototype</text>
  <text class="framework-fit-desc framework-fit-row framework-fit-r2" x="46" y="250">A custom engine for low latency</text>
  <text class="framework-fit-desc framework-fit-row framework-fit-r3" x="46" y="284">Model-aware primitives</text>
  <text class="framework-fit-desc framework-fit-row framework-fit-r4" x="46" y="318">Right for a request-scoped agent</text>
  <rect class="framework-fit-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="framework-fit-name" x="526" y="122">Durable workflow engines</text>
  <text class="framework-fit-desc" x="526" y="142">Days, and guarantees.</text>
  <text class="framework-fit-desc framework-fit-row framework-fit-r0" x="526" y="182">Temporal with model calls as activities</text>
  <text class="framework-fit-desc framework-fit-row framework-fit-r1" x="526" y="216">Full durable event sourcing</text>
  <text class="framework-fit-desc framework-fit-row framework-fit-r2" x="526" y="250">Survives deploys and outages</text>
  <text class="framework-fit-desc framework-fit-row framework-fit-r3" x="526" y="284">Heavier to operate</text>
  <text class="framework-fit-desc framework-fit-row framework-fit-r4" x="526" y="318">Right for multi-day business processes</text>
  <text class="framework-fit-sub" x="30" y="372">Duration is the cleaner discriminator than complexity: a complicated agent that finishes in ninety seconds does not need event sourcing, and a simple process that spans three days does.</text>
</svg>
