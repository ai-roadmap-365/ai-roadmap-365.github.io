<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Missing, stale, recalled — and the scanner.">
  <title>Shelves and a stock system</title>
  <style>
    .stock-take-bg   { fill: #f8fafc; }
    .stock-take-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stock-take-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stock-take-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stock-take-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stock-take-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stock-take-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stock-take-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stock-take-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stock-take-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stock-take-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stock-take-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stock-take-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stock-take-row { opacity: 1; }
    .stock-take-r0 { animation-delay: 0.00s; }
    .stock-take-r1 { animation-delay: 0.45s; }
    .stock-take-r2 { animation-delay: 0.90s; }
    .stock-take-r3 { animation-delay: 1.35s; }
    .stock-take-r4 { animation-delay: 1.80s; }
    .stock-take-row { animation: stock-take-reveal 7.3s ease-in-out infinite; }
    @keyframes stock-take-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="stock-take-bg" width="980" height="390"/>
  <text class="stock-take-h1"  x="30" y="40">Shelves and a stock system</text>
  <text class="stock-take-sub" x="30" y="64">Missing, stale, recalled — and the scanner.</text>
  <rect class="stock-take-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="stock-take-name" x="46" y="122">The shelves</text>
  <text class="stock-take-desc" x="46" y="142">Three discrepancies.</text>
  <text class="stock-take-desc stock-take-row stock-take-r0" x="46" y="182">Listed but not on the shelf — missing</text>
  <text class="stock-take-desc stock-take-row stock-take-r1" x="46" y="216">Last season's version at last season's price — stale</text>
  <text class="stock-take-desc stock-take-row stock-take-r2" x="46" y="250">A recalled product still on display — orphaned</text>
  <text class="stock-take-desc stock-take-row stock-take-r3" x="46" y="284">Nobody is looking for the recalled one</text>
  <text class="stock-take-desc stock-take-row stock-take-r4" x="46" y="318">Because it is on no list any more</text>
  <rect class="stock-take-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="stock-take-name" x="526" y="122">The failed stock-take</text>
  <text class="stock-take-desc" x="526" y="142">And the supervisor.</text>
  <text class="stock-take-desc stock-take-row stock-take-r0" x="526" y="182">The scanner fails to connect</text>
  <text class="stock-take-desc stock-take-row stock-take-r1" x="526" y="216">Reports zero items in the system</text>
  <text class="stock-take-desc stock-take-row stock-take-r2" x="526" y="250">A diligent employee clears every shelf</text>
  <text class="stock-take-desc stock-take-row stock-take-r3" x="526" y="284">Which is why real stock-takes have a supervisor</text>
  <text class="stock-take-desc stock-take-row stock-take-r4" x="526" y="318">Who refuses implausible instructions</text>
  <text class="stock-take-sub" x="30" y="372">The supervisor is the delete guard, and the analogy is exact: the employee followed the process correctly and the process had no step for "this instruction cannot be right".</text>
</svg>
