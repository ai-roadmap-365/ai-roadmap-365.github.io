<svg role="img" aria-label="Vectorized multi layer forward propagation computational graph showing input layer hidden activations linear transformations and output loss" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Vectorized Multi-Layer Forward Propagation Architecture</title>
  <defs>
    <linearGradient id="bg199a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card199" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg199a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">VECTORIZED MULTI-LAYER FORWARD PROPAGATION</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Layer-by-Layer Linear Transformations, Non-Linear Activations, and Caching Mechanics</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card199)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Layer 0 (Input) -->
    <rect x="25" y="35" width="130" height="225" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="90" y="60" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Input A^[0] = X</text>
    <text x="90" y="80" fill="#94a3b8" font-size="9" text-anchor="middle">Shape: (n^[0], m)</text>
    <circle cx="90" cy="115" r="14" fill="#1e293b" stroke="#38bdf8"/>
    <circle cx="90" cy="155" r="14" fill="#1e293b" stroke="#38bdf8"/>
    <circle cx="90" cy="195" r="14" fill="#1e293b" stroke="#38bdf8"/>
    <circle cx="90" cy="235" r="14" fill="#1e293b" stroke="#38bdf8"/>

    <!-- Arrow to Layer 1 -->
    <line x1="155" y1="147" x2="215" y2="147" stroke="#94a3b8" stroke-width="2"/>
    <text x="185" y="137" fill="#fbbf24" font-size="9" text-anchor="middle">W^[1], b^[1]</text>

    <!-- Layer 1 (Hidden 1) -->
    <rect x="215" y="35" width="150" height="225" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="290" y="60" fill="#34d399" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Hidden Layer 1</text>
    <text x="290" y="80" fill="#94a3b8" font-size="9" text-anchor="middle">Z^[1] = W^[1]A^[0] + b^[1]</text>
    <text x="290" y="98" fill="#34d399" font-size="9" text-anchor="middle">A^[1] = g^[1](Z^[1])</text>
    <rect x="235" y="115" width="110" height="125" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="290" y="175" fill="#cbd5e1" font-size="9" text-anchor="middle">Cache (A^[0], Z^[1], W^[1])</text>

    <!-- Arrow to Layer 2 -->
    <line x1="365" y1="147" x2="425" y2="147" stroke="#94a3b8" stroke-width="2"/>
    <text x="395" y="137" fill="#fbbf24" font-size="9" text-anchor="middle">W^[2], b^[2]</text>

    <!-- Layer 2 (Hidden 2) -->
    <rect x="425" y="35" width="150" height="225" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" rx="6"/>
    <text x="500" y="60" fill="#c084fc" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Hidden Layer 2</text>
    <text x="500" y="80" fill="#94a3b8" font-size="9" text-anchor="middle">Z^[2] = W^[2]A^[1] + b^[2]</text>
    <text x="500" y="98" fill="#c084fc" font-size="9" text-anchor="middle">A^[2] = g^[2](Z^[2])</text>
    <rect x="445" y="115" width="110" height="125" fill="#1e293b" stroke="#c084fc" rx="4"/>
    <text x="500" y="175" fill="#cbd5e1" font-size="9" text-anchor="middle">Cache (A^[1], Z^[2], W^[2])</text>

    <!-- Arrow to Output -->
    <line x1="575" y1="147" x2="625" y2="147" stroke="#94a3b8" stroke-width="2"/>

    <!-- Layer L (Output) -->
    <rect x="625" y="35" width="115" height="225" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" rx="6"/>
    <text x="682" y="60" fill="#fb7185" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Output A^[L]</text>
    <text x="682" y="80" fill="#94a3b8" font-size="9" text-anchor="middle">y_hat = sigma/softmax</text>
    <circle cx="682" cy="147" r="22" fill="#1e293b" stroke="#f43f5e"/>
    <text x="682" y="152" fill="#fb7185" font-size="11" font-weight="700" text-anchor="middle">Loss L</text>
    <text x="682" y="210" fill="#cbd5e1" font-size="8" text-anchor="middle">BCE / CCE</text>
  </g>
</svg>
