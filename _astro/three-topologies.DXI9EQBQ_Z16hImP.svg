<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each answers a different question.">
  <title>Three topologies</title>
  <style>
    .three-topologies-bg   { fill: #f8fafc; }
    .three-topologies-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-topologies-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-topologies-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-topologies-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-topologies-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-topologies-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-topologies-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-topologies-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-topologies-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-topologies-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-topologies-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-topologies-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .three-topologies-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .three-topologies-stage { opacity: 1; }

    .three-topologies-s0 { animation-delay: 0.00s; }
    .three-topologies-e0 { animation-delay: 0.00s; }
    .three-topologies-s1 { animation-delay: 1.50s; }
    .three-topologies-e1 { animation-delay: 1.50s; }
    .three-topologies-s2 { animation-delay: 3.00s; }
    .three-topologies-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .three-topologies-conn  { animation: three-topologies-trace 6s ease-in-out infinite; }
      .three-topologies-stage { animation: three-topologies-arrive 6s ease-in-out infinite; }
    }
    @keyframes three-topologies-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes three-topologies-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .three-topologies-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .three-topologies-stage { animation: three-topologies-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes three-topologies-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="three-topologies-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="three-topologies-bg" width="980" height="322"/>
  <text class="three-topologies-h1"  x="30" y="40">Three topologies</text>
  <text class="three-topologies-sub" x="30" y="64">Each answers a different question.</text>
  <g class="three-topologies-stage three-topologies-s0">
    <rect class="three-topologies-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="three-topologies-step" x="44" y="142">01</text>
    <text class="three-topologies-name" x="70" y="142">Supervisor</text>
    <text class="three-topologies-desc" x="44" y="166">One agent decomposes and dispatches;</text>
    <text class="three-topologies-desc" x="44" y="182">specialists execute and report.</text>
    <text class="three-topologies-edge" x="44" y="242">delegation</text>
  </g>
  <line class="three-topologies-line three-topologies-conn three-topologies-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#three-topologies-tip)"/>
  <g class="three-topologies-stage three-topologies-s1">
    <rect class="three-topologies-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="three-topologies-step" x="359" y="142">02</text>
    <text class="three-topologies-name" x="385" y="142">Pipeline</text>
    <text class="three-topologies-desc" x="359" y="166">A fixed sequence of specialists, each with a</text>
    <text class="three-topologies-desc" x="359" y="182">typed handoff.</text>
    <text class="three-topologies-edge" x="359" y="242">contracts</text>
  </g>
  <line class="three-topologies-line three-topologies-conn three-topologies-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#three-topologies-tip)"/>
  <g class="three-topologies-stage three-topologies-s2">
    <rect class="three-topologies-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="three-topologies-step" x="674" y="142">03</text>
    <text class="three-topologies-name" x="700" y="142">Debate</text>
    <text class="three-topologies-desc" x="674" y="166">Independent instances argue, and accuracy</text>
    <text class="three-topologies-desc" x="674" y="182">rises measurably.</text>
    <text class="three-topologies-edge" x="674" y="242">robustness</text>
  </g>
  <text class="three-topologies-sub" x="30" y="304">The three are not interchangeable: a supervisor is right when the decomposition is unknown, a pipeline when it is known, and debate when the risk is a confident wrong answer rather than an incomplete one.</text>
</svg>
