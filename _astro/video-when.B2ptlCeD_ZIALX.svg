<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to generate video</title>
  <style>
    .video-when-bg   { fill: #f8fafc; }
    .video-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .video-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .video-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .video-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .video-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .video-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .video-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .video-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .video-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .video-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .video-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .video-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .video-when-row { opacity: 1; }
    .video-when-r0 { animation-delay: 0.00s; }
    .video-when-r1 { animation-delay: 0.45s; }
    .video-when-r2 { animation-delay: 0.90s; }
    .video-when-r3 { animation-delay: 1.35s; }
    .video-when-r4 { animation-delay: 1.80s; }
    .video-when-row { animation: video-when-reveal 7.3s ease-in-out infinite; }
    @keyframes video-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="video-when-bg" width="980" height="390"/>
  <text class="video-when-h1"  x="30" y="40">When to generate video</text>
  <text class="video-when-sub" x="30" y="64">And when not to.</text>
  <rect class="video-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="video-when-name" x="46" y="122">Generate</text>
  <text class="video-when-desc" x="46" y="142">Four cases.</text>
  <text class="video-when-desc video-when-row video-when-r0" x="46" y="182">Concept work and previsualisation</text>
  <text class="video-when-desc video-when-row video-when-r1" x="46" y="216">Short-form illustration and b-roll</text>
  <text class="video-when-desc video-when-row video-when-r2" x="46" y="250">Background and placeholder music</text>
  <text class="video-when-desc video-when-row video-when-r3" x="46" y="284">Prototyping before a real shoot</text>
  <text class="video-when-desc video-when-row video-when-r4" x="46" y="318">Where the output is labelled</text>
  <rect class="video-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="video-when-name" x="526" y="122">Do not</text>
  <text class="video-when-desc" x="526" y="142">Also four.</text>
  <text class="video-when-desc video-when-row video-when-r0" x="526" y="182">Anything presented as real footage</text>
  <text class="video-when-desc video-when-row video-when-r1" x="526" y="216">Real people saying things they did not</text>
  <text class="video-when-desc video-when-row video-when-r2" x="526" y="250">News, evidence or documentation</text>
  <text class="video-when-desc video-when-row video-when-r3" x="526" y="284">Long-form work, where cost dominates</text>
  <text class="video-when-desc video-when-row video-when-r4" x="526" y="318">Where provenance cannot be attached</text>
  <text class="video-when-sub" x="30" y="372">The distinction is presentation rather than technology: the same clip is fine as a labelled illustration and harmful as an unlabelled recording.</text>
</svg>
