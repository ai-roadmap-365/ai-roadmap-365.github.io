<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%" role="img" aria-label="Where the Free Tier Actually Ends showing four allowances with egress binding at 1.25x while requests would last 100x">
  <title>Where the Free Tier Actually Ends</title>
  <defs>
    <style>
      .d334a-bg { fill: #f8fafc; }
      .d334a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; }
      .d334a-bind { fill: #fee2e2; stroke: #ef4444; stroke-width: 2px; }
      .d334a-ok { fill: #dcfce7; stroke: #22c55e; stroke-width: 2px; }
      .d334a-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d334a-h { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .d334a-t { font-family: system-ui, sans-serif; font-size: 13px; fill: #334155; }
      .d334a-s { font-family: system-ui, sans-serif; font-size: 12px; fill: #64748b; }
      .d334a-ax { stroke: #94a3b8; stroke-width: 1.5px; }
      .d334a-dash { stroke: #ef4444; stroke-width: 2px; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect class="d334a-bg" width="900" height="420" />
  <text class="d334a-title" x="30" y="36">Where the Free Tier Actually Ends</text>
  <text class="d334a-s" x="30" y="58">Headroom per allowance, as a multiple of current traffic. Log-ish scale.</text>

  <line class="d334a-ax" x1="220" y1="232" x2="860" y2="232" />
  <text class="d334a-s" x="216" y="252">1x</text>
  <text class="d334a-s" x="380" y="252">10x</text>
  <text class="d334a-s" x="560" y="252">50x</text>
  <text class="d334a-s" x="820" y="252">100x</text>

  <text class="d334a-t" x="30" y="96">egress-gb</text>
  <rect class="d334a-bind" x="220" y="78" width="10" height="24" rx="3" />
  <text class="d334a-s" x="242" y="96" fill="#7f1d1d">1.25x — the tier ends HERE</text>

  <text class="d334a-t" x="30" y="130">storage-gb</text>
  <rect class="d334a-ok" x="220" y="112" width="26" height="24" rx="3" />
  <text class="d334a-s" x="258" y="130">2.50x</text>

  <text class="d334a-t" x="30" y="164">compute-seconds</text>
  <rect class="d334a-ok" x="220" y="146" width="240" height="24" rx="3" />
  <text class="d334a-s" x="472" y="164">22.50x</text>

  <text class="d334a-t" x="30" y="198">requests</text>
  <rect class="d334a-ok" x="220" y="180" width="620" height="24" rx="3" />
  <text class="d334a-s" x="560" y="198" fill="#15803d">100x — the number in the headline</text>

  <line class="d334a-dash" x1="230" y1="70" x2="230" y2="240" />

  <rect class="d334a-card" x="30" y="278" width="410" height="60" rx="8" />
  <text class="d334a-h" x="48" y="304">Advertised</text>
  <text class="d334a-t" x="48" y="326">2,000,000 free requests — 100x this traffic</text>

  <rect class="d334a-bind" x="460" y="278" width="410" height="60" rx="8" />
  <text class="d334a-h" x="478" y="304">Binding</text>
  <text class="d334a-t" x="478" y="326">1 GB free egress — 1.25x this traffic</text>

  <rect class="d334a-card" x="30" y="352" width="840" height="50" rx="6" />
  <text class="d334a-t" x="48" y="382">A factor of eighty between the constraint that is advertised and the one that decides your bill.</text>
</svg>
