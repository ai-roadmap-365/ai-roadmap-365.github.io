<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which does for tools what the common API did for providers.">
  <title>A standard protocol for tools</title>
  <style>
    .mcp-bg   { fill: #f8fafc; }
    .mcp-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mcp-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mcp-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mcp-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mcp-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mcp-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mcp-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .mcp-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .mcp-stage { opacity: 1; }

    .mcp-s0 { animation-delay: 0.00s; }
    .mcp-e0 { animation-delay: 0.00s; }
    .mcp-s1 { animation-delay: 1.28s; }
    .mcp-e1 { animation-delay: 1.28s; }
    .mcp-s2 { animation-delay: 2.56s; }
    .mcp-e2 { animation-delay: 2.56s; }
    .mcp-s3 { animation-delay: 3.84s; }
    .mcp-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .mcp-conn  { animation: mcp-trace 6.4s ease-in-out infinite; }
      .mcp-stage { animation: mcp-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes mcp-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes mcp-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .mcp-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .mcp-stage { animation: mcp-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes mcp-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="mcp-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="mcp-bg" width="980" height="322"/>
  <text class="mcp-h1"  x="30" y="40">A standard protocol for tools</text>
  <text class="mcp-sub" x="30" y="64">Which does for tools what the common API did for providers.</text>
  <g class="mcp-stage mcp-s0">
    <rect class="mcp-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="mcp-step" x="44" y="142">01</text>
    <text class="mcp-name" x="70" y="142">Every application defines its own tools</text>
    <text class="mcp-desc" x="44" y="166">Against every system it touches.</text>
  </g>
  <line class="mcp-line mcp-conn mcp-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#mcp-tip)"/>
  <g class="mcp-stage mcp-s1">
    <rect class="mcp-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="mcp-step" x="280" y="142">02</text>
    <text class="mcp-name" x="306" y="142">So the same integration is written repeatedly</text>
    <text class="mcp-desc" x="280" y="166">Once per application,</text>
    <text class="mcp-desc" x="280" y="182">incompatibly.</text>
  </g>
  <line class="mcp-line mcp-conn mcp-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#mcp-tip)"/>
  <g class="mcp-stage mcp-s2">
    <rect class="mcp-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="mcp-step" x="516" y="142">03</text>
    <text class="mcp-name" x="542" y="142">A shared protocol defines how tools are described and called</text>
    <text class="mcp-desc" x="516" y="166">Independently of any one model</text>
    <text class="mcp-desc" x="516" y="182">or application.</text>
  </g>
  <line class="mcp-line mcp-conn mcp-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#mcp-tip)"/>
  <g class="mcp-stage mcp-s3">
    <rect class="mcp-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="mcp-step" x="752" y="142">04</text>
    <text class="mcp-name" x="778" y="142">So one server serves every client</text>
    <text class="mcp-desc" x="752" y="166">Written once, reused everywhere.</text>
  </g>
  <text class="mcp-sub" x="30" y="304">The pattern is the same one that produced language servers in editors, and it tends to arrive at the same point: once integrations outnumber applications, a protocol wins.</text>
</svg>
