<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One of them is a confusion worth avoiding.">
  <title>Five consequences of measuring</title>
  <style>
    .retro-implications-bg   { fill: #f8fafc; }
    .retro-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retro-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retro-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retro-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retro-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retro-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .retro-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .retro-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .retro-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .retro-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .retro-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .retro-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .retro-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .retro-implications-stage { opacity: 1; }

    .retro-implications-s0 { animation-delay: 0.00s; }
    .retro-implications-e0 { animation-delay: 0.00s; }
    .retro-implications-s1 { animation-delay: 1.33s; }
    .retro-implications-e1 { animation-delay: 1.33s; }
    .retro-implications-s2 { animation-delay: 2.67s; }
    .retro-implications-e2 { animation-delay: 2.67s; }
    .retro-implications-s3 { animation-delay: 4.00s; }
    .retro-implications-e3 { animation-delay: 4.00s; }
    .retro-implications-s4 { animation-delay: 5.33s; }
    .retro-implications-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .retro-implications-conn  { animation: retro-implications-trace 8s ease-in-out infinite; }
      .retro-implications-stage { animation: retro-implications-arrive 8s ease-in-out infinite; }
    }
    @keyframes retro-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes retro-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .retro-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .retro-implications-stage { animation: retro-implications-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes retro-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="retro-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="retro-implications-bg" width="980" height="322"/>
  <text class="retro-implications-h1"  x="30" y="40">Five consequences of measuring</text>
  <text class="retro-implications-sub" x="30" y="64">One of them is a confusion worth avoiding.</text>
  <g class="retro-implications-stage retro-implications-s0">
    <rect class="retro-implications-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="retro-implications-step" x="44" y="142">01</text>
    <text class="retro-implications-name" x="70" y="142">An escape is a missing control</text>
    <text class="retro-implications-desc" x="44" y="166">The retrospective is</text>
    <text class="retro-implications-desc" x="44" y="182">where a memory becomes a</text>
    <text class="retro-implications-desc" x="44" y="198">work item.</text>
    <text class="retro-implications-edge" x="44" y="242">security</text>
  </g>
  <line class="retro-implications-line retro-implications-conn retro-implications-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#retro-implications-tip)"/>
  <g class="retro-implications-stage retro-implications-s1">
    <rect class="retro-implications-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="retro-implications-step" x="233" y="142">02</text>
    <text class="retro-implications-name" x="259" y="142">Do not quote user data</text>
    <text class="retro-implications-desc" x="233" y="166">Describe what happened</text>
    <text class="retro-implications-desc" x="233" y="182">without reproducing the</text>
    <text class="retro-implications-desc" x="233" y="198">content.</text>
    <text class="retro-implications-edge" x="233" y="242">privacy</text>
  </g>
  <line class="retro-implications-line retro-implications-conn retro-implications-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#retro-implications-tip)"/>
  <g class="retro-implications-stage retro-implications-s2">
    <rect class="retro-implications-warn" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="retro-implications-step" x="422" y="142">03</text>
    <text class="retro-implications-name" x="448" y="142">Schedule error is not system speed</text>
    <text class="retro-implications-desc" x="422" y="166">A project that ran late</text>
    <text class="retro-implications-desc" x="422" y="182">may have shipped</text>
    <text class="retro-implications-desc" x="422" y="198">something fast.</text>
    <text class="retro-implications-edge" x="422" y="242">don't conflate</text>
  </g>
  <line class="retro-implications-line retro-implications-conn retro-implications-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#retro-implications-tip)"/>
  <g class="retro-implications-stage retro-implications-s3">
    <rect class="retro-implications-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="retro-implications-step" x="611" y="142">04</text>
    <text class="retro-implications-name" x="637" y="142">The records are tiny</text>
    <text class="retro-implications-desc" x="611" y="166">An estimate per task</text>
    <text class="retro-implications-desc" x="611" y="182">costs seconds, and cannot</text>
    <text class="retro-implications-desc" x="611" y="198">be reconstructed later.</text>
    <text class="retro-implications-edge" x="611" y="242">practice</text>
  </g>
  <line class="retro-implications-line retro-implications-conn retro-implications-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#retro-implications-tip)"/>
  <g class="retro-implications-stage retro-implications-s4">
    <rect class="retro-implications-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="retro-implications-step" x="800" y="142">05</text>
    <text class="retro-implications-name" x="826" y="142">Attach the money to the finding</text>
    <text class="retro-implications-desc" x="800" y="166">The spend spike was real</text>
    <text class="retro-implications-desc" x="800" y="182">money. That turns a</text>
    <text class="retro-implications-desc" x="800" y="198">suggestion into an</text>
    <text class="retro-implications-edge" x="800" y="242">cost</text>
  </g>
  <text class="retro-implications-sub" x="30" y="304">The last is the practical trick for getting a control funded: "we should add a cap" competes with everything else, and "the absence of a cap cost this much last month" does not.</text>
</svg>
