<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Matching against understanding.">
  <title>A card catalogue, or a librarian</title>
  <style>
    .library-search-bg   { fill: #f8fafc; }
    .library-search-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-search-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-search-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-search-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-search-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-search-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .library-search-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .library-search-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .library-search-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .library-search-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .library-search-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .library-search-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .library-search-row { opacity: 1; }
    .library-search-r0 { animation-delay: 0.00s; }
    .library-search-r1 { animation-delay: 0.45s; }
    .library-search-r2 { animation-delay: 0.90s; }
    .library-search-r3 { animation-delay: 1.35s; }
    .library-search-r4 { animation-delay: 1.80s; }
    .library-search-row { animation: library-search-reveal 7.3s ease-in-out infinite; }
    @keyframes library-search-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="library-search-bg" width="980" height="390"/>
  <text class="library-search-h1"  x="30" y="40">A card catalogue, or a librarian</text>
  <text class="library-search-sub" x="30" y="64">Matching against understanding.</text>
  <rect class="library-search-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="library-search-name" x="46" y="122">The card catalogue</text>
  <text class="library-search-desc" x="46" y="142">Matches what you wrote.</text>
  <text class="library-search-desc library-search-row library-search-r0" x="46" y="182">Finds the exact title you asked for</text>
  <text class="library-search-desc library-search-row library-search-r1" x="46" y="216">Nothing if you misremember it</text>
  <text class="library-search-desc library-search-row library-search-r2" x="46" y="250">No sense of what you meant</text>
  <text class="library-search-desc library-search-row library-search-r3" x="46" y="284">Fast and completely predictable</text>
  <text class="library-search-desc library-search-row library-search-r4" x="46" y="318">This is keyword search</text>
  <rect class="library-search-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="library-search-name" x="526" y="122">The librarian</text>
  <text class="library-search-desc" x="526" y="142">Understands what you meant.</text>
  <text class="library-search-desc library-search-row library-search-r0" x="526" y="182">Finds books on the topic</text>
  <text class="library-search-desc library-search-row library-search-r1" x="526" y="216">Works from a vague description</text>
  <text class="library-search-desc library-search-row library-search-r2" x="526" y="250">Suggests things you did not name</text>
  <text class="library-search-desc library-search-row library-search-r3" x="526" y="284">Occasionally brings the wrong thing</text>
  <text class="library-search-desc library-search-row library-search-r4" x="526" y="318">This is semantic search</text>
  <text class="library-search-sub" x="30" y="372">The failure modes differ in a way that matters: the catalogue returns nothing when it fails, and the librarian confidently returns something related but wrong.</text>
</svg>
