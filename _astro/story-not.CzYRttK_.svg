<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things chart honesty is not</title>
  <style>
    .story-not-bg   { fill: #f8fafc; }
    .story-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .story-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .story-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .story-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .story-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .story-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .story-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .story-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .story-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .story-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .story-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .story-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .story-not-row { opacity: 1; }
    .story-not-r0 { animation-delay: 0.00s; }
    .story-not-r1 { animation-delay: 0.45s; }
    .story-not-r2 { animation-delay: 0.90s; }
    .story-not-r3 { animation-delay: 1.35s; }
    .story-not-r4 { animation-delay: 1.80s; }
    .story-not-row { animation: story-not-reveal 7.3s ease-in-out infinite; }
    @keyframes story-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="story-not-bg" width="980" height="390"/>
  <text class="story-not-h1"  x="30" y="40">Four things chart honesty is not</text>
  <text class="story-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="story-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="story-not-name" x="46" y="122">The misconception</text>
  <text class="story-not-desc" x="46" y="142">Commonly held.</text>
  <text class="story-not-desc story-not-row story-not-r0" x="46" y="182">Accurate numbers make an honest chart</text>
  <text class="story-not-desc story-not-row story-not-r1" x="46" y="216">A neutral chart has no message</text>
  <text class="story-not-desc story-not-row story-not-r2" x="46" y="250">Distortion requires intent</text>
  <text class="story-not-desc story-not-row story-not-r3" x="46" y="284">Showing everything is most honest</text>
  <text class="story-not-desc story-not-row story-not-r4" x="46" y="318">Caveats weaken the argument</text>
  <rect class="story-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="story-not-name" x="526" y="122">What is true</text>
  <text class="story-not-desc" x="526" y="142">Actually.</text>
  <text class="story-not-desc story-not-row story-not-r0" x="526" y="182">Framing can mislead with correct numbers</text>
  <text class="story-not-desc story-not-row story-not-r1" x="526" y="216">Every choice frames a comparison</text>
  <text class="story-not-desc story-not-row story-not-r2" x="526" y="250">Most distortion is unintentional</text>
  <text class="story-not-desc story-not-row story-not-r3" x="526" y="284">Overwhelming detail obscures too</text>
  <text class="story-not-desc story-not-row story-not-r4" x="526" y="318">Their absence weakens it more</text>
  <text class="story-not-sub" x="30" y="372">Most distortion being unintentional is the useful correction, because it means the defence is a checklist rather than good intentions.</text>
</svg>
