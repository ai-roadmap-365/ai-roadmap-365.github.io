<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to run a segmentation</title>
  <style>
    .segmentation-when-bg   { fill: #f8fafc; }
    .segmentation-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .segmentation-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .segmentation-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .segmentation-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .segmentation-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .segmentation-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .segmentation-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .segmentation-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .segmentation-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .segmentation-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .segmentation-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .segmentation-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .segmentation-when-row { opacity: 1; }
    .segmentation-when-r0 { animation-delay: 0.00s; }
    .segmentation-when-r1 { animation-delay: 0.45s; }
    .segmentation-when-r2 { animation-delay: 0.90s; }
    .segmentation-when-r3 { animation-delay: 1.35s; }
    .segmentation-when-r4 { animation-delay: 1.80s; }
    .segmentation-when-row { animation: segmentation-when-reveal 7.3s ease-in-out infinite; }
    @keyframes segmentation-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="segmentation-when-bg" width="980" height="390"/>
  <text class="segmentation-when-h1"  x="30" y="40">When to run a segmentation</text>
  <text class="segmentation-when-sub" x="30" y="64">And when not to.</text>
  <rect class="segmentation-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="segmentation-when-name" x="46" y="122">Segment</text>
  <text class="segmentation-when-desc" x="46" y="142">Four signals.</text>
  <text class="segmentation-when-desc segmentation-when-row segmentation-when-r0" x="46" y="182">Differentiated treatment is actually possible</text>
  <text class="segmentation-when-desc segmentation-when-row segmentation-when-r1" x="46" y="216">Enough customers to fill several segments</text>
  <text class="segmentation-when-desc segmentation-when-row segmentation-when-r2" x="46" y="250">Behavioural data over a meaningful period</text>
  <text class="segmentation-when-desc segmentation-when-row segmentation-when-r3" x="46" y="284">A team that will act on the result</text>
  <text class="segmentation-when-desc segmentation-when-row segmentation-when-r4" x="46" y="318">And a plan to refresh it</text>
  <rect class="segmentation-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="segmentation-when-name" x="526" y="122">Do not</text>
  <text class="segmentation-when-desc" x="526" y="142">Also four.</text>
  <text class="segmentation-when-desc segmentation-when-row segmentation-when-r0" x="526" y="182">Everyone gets the same treatment anyway</text>
  <text class="segmentation-when-desc segmentation-when-row segmentation-when-r1" x="526" y="216">Too few customers to divide usefully</text>
  <text class="segmentation-when-desc segmentation-when-row segmentation-when-r2" x="526" y="250">Only demographic data, no behaviour</text>
  <text class="segmentation-when-desc segmentation-when-row segmentation-when-r3" x="526" y="284">Nobody owns the follow-through</text>
  <text class="segmentation-when-desc segmentation-when-row segmentation-when-r4" x="526" y="318">Where a simple rule would do</text>
  <text class="segmentation-when-sub" x="30" y="372">A simple value-based rule frequently outperforms a segmentation study in practice, because it is understood, acted upon and maintained.</text>
</svg>
