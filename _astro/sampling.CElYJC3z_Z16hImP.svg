<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Sampling is how tracing stays affordable.">
  <title>You cannot keep everything</title>
  <style>
    .sampling-bg   { fill: #f8fafc; }
    .sampling-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sampling-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sampling-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sampling-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sampling-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sampling-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sampling-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sampling-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sampling-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sampling-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sampling-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sampling-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .sampling-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .sampling-stage { opacity: 1; }

    .sampling-s0 { animation-delay: 0.00s; }
    .sampling-e0 { animation-delay: 0.00s; }
    .sampling-s1 { animation-delay: 1.28s; }
    .sampling-e1 { animation-delay: 1.28s; }
    .sampling-s2 { animation-delay: 2.56s; }
    .sampling-e2 { animation-delay: 2.56s; }
    .sampling-s3 { animation-delay: 3.84s; }
    .sampling-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .sampling-conn  { animation: sampling-trace 6.4s ease-in-out infinite; }
      .sampling-stage { animation: sampling-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes sampling-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes sampling-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .sampling-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .sampling-stage { animation: sampling-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes sampling-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="sampling-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="sampling-bg" width="980" height="322"/>
  <text class="sampling-h1"  x="30" y="40">You cannot keep everything</text>
  <text class="sampling-sub" x="30" y="64">Sampling is how tracing stays affordable.</text>
  <g class="sampling-stage sampling-s0">
    <rect class="sampling-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="sampling-step" x="44" y="142">01</text>
    <text class="sampling-name" x="70" y="142">Every request traced is too much</text>
    <text class="sampling-desc" x="44" y="166">At real traffic, the storage</text>
    <text class="sampling-desc" x="44" y="182">cost exceeds the system's.</text>
  </g>
  <line class="sampling-line sampling-conn sampling-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#sampling-tip)"/>
  <g class="sampling-stage sampling-s1">
    <rect class="sampling-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="sampling-step" x="280" y="142">02</text>
    <text class="sampling-name" x="306" y="142">Head-based: decide at the start</text>
    <text class="sampling-desc" x="280" y="166">Keep 1% at random. Cheap, and it</text>
    <text class="sampling-desc" x="280" y="182">discards most slow requests too.</text>
    <text class="sampling-edge" x="280" y="242">1%</text>
  </g>
  <line class="sampling-line sampling-conn sampling-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#sampling-tip)"/>
  <g class="sampling-stage sampling-s2">
    <rect class="sampling-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="sampling-step" x="516" y="142">03</text>
    <text class="sampling-name" x="542" y="142">Tail-based: decide at the end</text>
    <text class="sampling-desc" x="516" y="166">Keep it if it was slow or</text>
    <text class="sampling-desc" x="516" y="182">failed. More expensive to run,</text>
    <text class="sampling-desc" x="516" y="198">far better signal.</text>
    <text class="sampling-edge" x="516" y="242">by outcome</text>
  </g>
  <line class="sampling-line sampling-conn sampling-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#sampling-tip)"/>
  <g class="sampling-stage sampling-s3">
    <rect class="sampling-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="sampling-step" x="752" y="142">04</text>
    <text class="sampling-name" x="778" y="142">Always keep errors</text>
    <text class="sampling-desc" x="752" y="166">Whatever else you sample. The</text>
    <text class="sampling-desc" x="752" y="182">rare ones are the ones you need.</text>
  </g>
  <text class="sampling-sub" x="30" y="304">The trap in head-based sampling is that it is uniform: the one request in a thousand that took four seconds is exactly as likely to be discarded as the ordinary ones, which is the opposite of what you want.</text>
</svg>
