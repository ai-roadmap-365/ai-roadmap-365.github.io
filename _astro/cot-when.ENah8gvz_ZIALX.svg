<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when to skip it.">
  <title>When to prompt for reasoning</title>
  <style>
    .cot-when-bg   { fill: #f8fafc; }
    .cot-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cot-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cot-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cot-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cot-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cot-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cot-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cot-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cot-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cot-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cot-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cot-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cot-when-row { opacity: 1; }
    .cot-when-r0 { animation-delay: 0.00s; }
    .cot-when-r1 { animation-delay: 0.45s; }
    .cot-when-r2 { animation-delay: 0.90s; }
    .cot-when-r3 { animation-delay: 1.35s; }
    .cot-when-r4 { animation-delay: 1.80s; }
    .cot-when-row { animation: cot-when-reveal 7.3s ease-in-out infinite; }
    @keyframes cot-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cot-when-bg" width="980" height="390"/>
  <text class="cot-when-h1"  x="30" y="40">When to prompt for reasoning</text>
  <text class="cot-when-sub" x="30" y="64">And when to skip it.</text>
  <rect class="cot-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cot-when-name" x="46" y="122">Ask for reasoning</text>
  <text class="cot-when-desc" x="46" y="142">Multi-step problems.</text>
  <text class="cot-when-desc cot-when-row cot-when-r0" x="46" y="182">Arithmetic and logic</text>
  <text class="cot-when-desc cot-when-row cot-when-r1" x="46" y="216">Multi-hop questions</text>
  <text class="cot-when-desc cot-when-row cot-when-r2" x="46" y="250">Planning and decomposition</text>
  <text class="cot-when-desc cot-when-row cot-when-r3" x="46" y="284">Ambiguous judgment calls</text>
  <text class="cot-when-desc cot-when-row cot-when-r4" x="46" y="318">Where a wrong answer is expensive</text>
  <rect class="cot-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cot-when-name" x="526" y="122">Do not</text>
  <text class="cot-when-desc" x="526" y="142">Single-step tasks.</text>
  <text class="cot-when-desc cot-when-row cot-when-r0" x="526" y="182">Classification and extraction</text>
  <text class="cot-when-desc cot-when-row cot-when-r1" x="526" y="216">Formatting and rewriting</text>
  <text class="cot-when-desc cot-when-row cot-when-r2" x="526" y="250">Simple lookups</text>
  <text class="cot-when-desc cot-when-row cot-when-r3" x="526" y="284">High-volume, latency-sensitive calls</text>
  <text class="cot-when-desc cot-when-row cot-when-r4" x="526" y="318">Where it adds cost and nothing else</text>
  <text class="cot-when-sub" x="30" y="372">Applying reasoning prompts to classification is a common and expensive mistake: it multiplies the output tokens on a task where the answer was already a single step.</text>
</svg>
