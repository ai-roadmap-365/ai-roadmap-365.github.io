<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d150a-title d150a-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="d150a-title">Ten predictors, one design matrix, and what a coefficient means</title>
  <desc id="d150a-desc">A design matrix of ten raw-unit predictors from the diabetes dataset, with the two most correlated columns bracketed together, each column's variance inflation factor printed beneath it, and a panel explaining that a coefficient measures the effect of one column holding every other column fixed.</desc>
  <style>
    .d150a-bg { fill: #f8fafc; }
    .d150a-text { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .d150a-mono { fill: #1a202c; font-family: "SFMono-Regular", Consolas, monospace; }
    .d150a-box { fill: #ffffff; stroke: #1a202c; stroke-width: 1.5; }
    .d150a-col { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d150a-col-hot { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; }
    .d150a-accent { fill: #1d4ed8; }
    .d150a-accent-line { stroke: #1d4ed8; stroke-width: 2; fill: none; }
    .d150a-hot-line { stroke: #b91c1c; stroke-width: 2; fill: none; }
    .d150a-small { font-size: 14px; }
    .d150a-label { font-size: 15px; font-weight: 600; }
    .d150a-title-text { font-size: 22px; font-weight: 700; }
    .d150a-sub { font-size: 14px; fill: #475569; }
  </style>

  <rect class="d150a-bg" x="0" y="0" width="1000" height="640" />

  <text class="d150a-text d150a-title-text" x="500" y="38" text-anchor="middle">One target, ten raw predictors, one design matrix</text>
  <text class="d150a-text d150a-sub" x="500" y="60" text-anchor="middle">sklearn.datasets.load_diabetes(scaled=False) — 442 rows, real clinical units</text>

  <!-- Ten column headers -->
  <g>
    <!-- x positions for 10 columns, 82px apart starting at x=42 -->
    <!-- age -->
    <rect class="d150a-col" x="42" y="100" width="70" height="46" rx="4" />
    <text class="d150a-text d150a-small" x="77" y="128" text-anchor="middle">age</text>
    <!-- sex -->
    <rect class="d150a-col" x="122" y="100" width="70" height="46" rx="4" />
    <text class="d150a-text d150a-small" x="157" y="128" text-anchor="middle">sex</text>
    <!-- bmi -->
    <rect class="d150a-col" x="202" y="100" width="70" height="46" rx="4" />
    <text class="d150a-text d150a-small" x="237" y="128" text-anchor="middle">bmi</text>
    <!-- bp -->
    <rect class="d150a-col" x="282" y="100" width="70" height="46" rx="4" />
    <text class="d150a-text d150a-small" x="317" y="128" text-anchor="middle">bp</text>
    <!-- s1 (hot) -->
    <rect class="d150a-col-hot" x="362" y="100" width="70" height="46" rx="4" />
    <text class="d150a-text d150a-small" x="397" y="128" text-anchor="middle">s1</text>
    <!-- s2 (hot) -->
    <rect class="d150a-col-hot" x="442" y="100" width="70" height="46" rx="4" />
    <text class="d150a-text d150a-small" x="477" y="128" text-anchor="middle">s2</text>
    <!-- s3 -->
    <rect class="d150a-col" x="522" y="100" width="70" height="46" rx="4" />
    <text class="d150a-text d150a-small" x="557" y="128" text-anchor="middle">s3</text>
    <!-- s4 -->
    <rect class="d150a-col" x="602" y="100" width="70" height="46" rx="4" />
    <text class="d150a-text d150a-small" x="637" y="128" text-anchor="middle">s4</text>
    <!-- s5 -->
    <rect class="d150a-col" x="682" y="100" width="70" height="46" rx="4" />
    <text class="d150a-text d150a-small" x="717" y="128" text-anchor="middle">s5</text>
    <!-- s6 -->
    <rect class="d150a-col" x="762" y="100" width="70" height="46" rx="4" />
    <text class="d150a-text d150a-small" x="797" y="128" text-anchor="middle">s6</text>
  </g>

  <!-- Bracket over s1/s2 with correlation label -->
  <path class="d150a-hot-line" d="M 362 92 L 362 78 L 512 78 L 512 92" />
  <text class="d150a-text d150a-small" x="437" y="70" text-anchor="middle" font-weight="700" fill="#b91c1c">correlation 0.8967 — the most entangled pair</text>

  <!-- VIF row -->
  <text class="d150a-text d150a-label" x="42" y="178">Variance inflation factor (VIF), one per column</text>
  <g class="d150a-mono d150a-small">
    <text x="77" y="200" text-anchor="middle">1.2173</text>
    <text x="157" y="200" text-anchor="middle">1.2781</text>
    <text x="237" y="200" text-anchor="middle">1.5094</text>
    <text x="317" y="200" text-anchor="middle">1.4594</text>
    <text x="397" y="200" text-anchor="middle" fill="#b91c1c" font-weight="700">59.2025</text>
    <text x="477" y="200" text-anchor="middle" fill="#b91c1c" font-weight="700">39.1934</text>
    <text x="557" y="200" text-anchor="middle" fill="#b91c1c" font-weight="700">15.4022</text>
    <text x="637" y="200" text-anchor="middle">8.891</text>
    <text x="717" y="200" text-anchor="middle">10.076</text>
    <text x="797" y="200" text-anchor="middle">1.4846</text>
  </g>
  <text class="d150a-text d150a-sub" x="500" y="222" text-anchor="middle">VIF = 1 / (1 − R2), regressing each column on the other nine. Above 5 is the usual rule-of-thumb cutoff.</text>

  <!-- Rows of data below, suggesting the matrix continues -->
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="42" y1="252" x2="832" y2="252" />
    <line x1="42" y1="278" x2="832" y2="278" />
    <line x1="42" y1="304" x2="832" y2="304" />
  </g>
  <text class="d150a-text d150a-sub" x="42" y="330">… 442 rows total …</text>

  <!-- Divider -->
  <line x1="42" y1="360" x2="958" y2="360" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- What a coefficient means panel -->
  <rect class="d150a-box" x="42" y="384" width="450" height="230" rx="8" />
  <text class="d150a-text d150a-label" x="62" y="414">What a coefficient means</text>
  <text class="d150a-text d150a-small" x="62" y="442">y = b0 + b1·age + b2·sex + … + b10·s6</text>
  <text class="d150a-text d150a-small" x="62" y="470">b(k) is the change in y for one unit of</text>
  <text class="d150a-text d150a-small" x="62" y="492">column k, "holding every other column</text>
  <text class="d150a-text d150a-small" x="62" y="514">fixed" — fitted jointly with the rest.</text>
  <text class="d150a-text d150a-small" x="62" y="546" fill="#b91c1c" font-weight="600">When two columns move together in the</text>
  <text class="d150a-text d150a-small" x="62" y="568" fill="#b91c1c" font-weight="600">data, "holding fixed" is only approximate —</text>
  <text class="d150a-text d150a-small" x="62" y="590" fill="#b91c1c" font-weight="600">that gap is what destabilises b1..b10.</text>

  <!-- Duplicate-column result panel -->
  <rect class="d150a-box" x="512" y="384" width="446" height="230" rx="8" />
  <text class="d150a-text d150a-label" x="532" y="414">The centrepiece: duplicate s1 exactly</text>
  <text class="d150a-mono d150a-small" x="532" y="444">original s1 coefficient:  −1.0900</text>
  <text class="d150a-mono d150a-small" x="532" y="470">duplicate model:  −0.5450  +  −0.5450</text>
  <text class="d150a-mono d150a-small" x="532" y="496" font-weight="700">sum = −1.0900 (matches, to 8 places)</text>
  <text class="d150a-mono d150a-small" x="532" y="522">max prediction change: 3.98 × 10⁻¹²</text>
  <text class="d150a-mono d150a-small" x="532" y="548">R2 unchanged: 0.5177 → 0.5177</text>
  <text class="d150a-text d150a-small" x="532" y="582" fill="#1d4ed8" font-weight="600">Neither half means anything alone —</text>
  <text class="d150a-text d150a-small" x="532" y="604" fill="#1d4ed8" font-weight="600">only the sum, and the model, are real.</text>
</svg>
