<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward a standard.">
  <title>Four steps in model documentation</title>
  <style>
    .report-history-bg   { fill: #f8fafc; }
    .report-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .report-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .report-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .report-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .report-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .report-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .report-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .report-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .report-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .report-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .report-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .report-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .report-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .report-history-stage { opacity: 1; }

    .report-history-s0 { animation-delay: 0.00s; }
    .report-history-e0 { animation-delay: 0.00s; }
    .report-history-s1 { animation-delay: 1.28s; }
    .report-history-e1 { animation-delay: 1.28s; }
    .report-history-s2 { animation-delay: 2.56s; }
    .report-history-e2 { animation-delay: 2.56s; }
    .report-history-s3 { animation-delay: 3.84s; }
    .report-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .report-history-conn  { animation: report-history-trace 6.4s ease-in-out infinite; }
      .report-history-stage { animation: report-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes report-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes report-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .report-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .report-history-stage { animation: report-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes report-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="report-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="report-history-bg" width="980" height="322"/>
  <text class="report-history-h1"  x="30" y="40">Four steps in model documentation</text>
  <text class="report-history-sub" x="30" y="64">Toward a standard.</text>
  <g class="report-history-stage report-history-s0">
    <rect class="report-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="report-history-step" x="44" y="142">01</text>
    <text class="report-history-name" x="70" y="142">No documentation beyond the code</text>
    <text class="report-history-desc" x="44" y="166">Which made independent review</text>
    <text class="report-history-desc" x="44" y="182">impossible.</text>
  </g>
  <line class="report-history-line report-history-conn report-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#report-history-tip)"/>
  <g class="report-history-stage report-history-s1">
    <rect class="report-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="report-history-step" x="280" y="142">02</text>
    <text class="report-history-name" x="306" y="142">Ad hoc write-ups, differing per team</text>
    <text class="report-history-desc" x="280" y="166">Better, and not comparable.</text>
  </g>
  <line class="report-history-line report-history-conn report-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#report-history-tip)"/>
  <g class="report-history-stage report-history-s2">
    <rect class="report-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="report-history-step" x="516" y="142">03</text>
    <text class="report-history-name" x="542" y="142">A proposed standard structure</text>
    <text class="report-history-desc" x="516" y="166">Which the field largely adopted.</text>
  </g>
  <line class="report-history-line report-history-conn report-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#report-history-tip)"/>
  <g class="report-history-stage report-history-s3">
    <rect class="report-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="report-history-step" x="752" y="142">04</text>
    <text class="report-history-name" x="778" y="142">And now required in regulated deployments</text>
    <text class="report-history-desc" x="752" y="166">With defined content.</text>
  </g>
  <text class="report-history-sub" x="30" y="304">Adoption of the standard structure happened largely voluntarily before regulation required it, which is unusual and made the later requirement easier to meet.</text>
</svg>
