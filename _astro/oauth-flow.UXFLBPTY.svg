<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" font-family="system-ui, sans-serif">
  <title>The OAuth 2.0 authorization-code flow: the app redirects the user to the authorization server, the user consents, a code is exchanged for an access token, and the app calls the API with that token</title>
  <rect x="0" y="0" width="760" height="520" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The OAuth 2.0 authorization-code flow</text>

  <!-- Four participants across the top -->
  <rect x="30" y="60" width="150" height="54" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="105" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">You</text>
  <text x="105" y="103" text-anchor="middle" font-size="13" fill="#1a202c">resource owner</text>

  <rect x="205" y="60" width="150" height="54" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="280" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">The app</text>
  <text x="280" y="103" text-anchor="middle" font-size="13" fill="#1a202c">client</text>

  <rect x="405" y="60" width="150" height="54" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="480" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Auth server</text>
  <text x="480" y="99" text-anchor="middle" font-size="13" fill="#1a202c">login and consent</text>

  <rect x="580" y="60" width="150" height="54" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="655" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">The API</text>
  <text x="655" y="99" text-anchor="middle" font-size="13" fill="#1a202c">resource server</text>

  <!-- Step boxes -->
  <rect x="60" y="150" width="640" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="80" y="170" font-size="14" font-weight="bold" fill="#1a202c">1. Redirect to log in</text>
  <text x="80" y="188" font-size="13" fill="#1a202c">The app sends you to the auth server's page — you already have an account there.</text>

  <rect x="60" y="210" width="640" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="80" y="230" font-size="14" font-weight="bold" fill="#1a202c">2. Log in and consent</text>
  <text x="80" y="248" font-size="13" fill="#1a202c">You approve the requested scopes. Your password goes to the provider, never to the app.</text>

  <rect x="60" y="270" width="640" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="80" y="290" font-size="14" font-weight="bold" fill="#1a202c">3. Authorization code</text>
  <text x="80" y="308" font-size="13" fill="#1a202c">The auth server redirects back to the app with a one-time code — not yet a usable credential.</text>

  <rect x="60" y="330" width="640" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="80" y="350" font-size="14" font-weight="bold" fill="#1a202c">4. Exchange code for access token</text>
  <text x="80" y="368" font-size="13" fill="#1a202c">App-to-server, out of your browser: the code plus the app's secret is traded for an access token.</text>

  <rect x="60" y="390" width="640" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="80" y="410" font-size="14" font-weight="bold" fill="#1a202c">5. Call the API</text>
  <text x="80" y="428" font-size="13" fill="#1a202c">The app sends Authorization: Bearer &lt;access token&gt; and receives only what you scoped.</text>

  <!-- Downward arrows between steps -->
  <line x1="380" y1="196" x2="380" y2="208" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="380,210 374,200 386,200" fill="#1d4ed8"/>
  <line x1="380" y1="256" x2="380" y2="268" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="380,270 374,260 386,260" fill="#1d4ed8"/>
  <line x1="380" y1="316" x2="380" y2="328" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="380,330 374,320 386,320" fill="#1d4ed8"/>
  <line x1="380" y1="376" x2="380" y2="388" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="380,390 374,380 386,380" fill="#1d4ed8"/>

  <text x="380" y="470" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">Scoped and revocable: access tokens expire; a refresh token quietly renews them.</text>
  <text x="380" y="494" text-anchor="middle" font-size="13" fill="#1a202c">Delegation without disclosure — the app acts on your behalf, never seeing your password.</text>
</svg>
