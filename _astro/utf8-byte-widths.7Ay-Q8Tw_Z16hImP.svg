<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="UTF-8 spends one byte on ASCII and up to four on everything else.">
  <title>Why 'café' is four characters and five bytes</title>
  <style>
    .utf8-byte-widths-bg   { fill: #f8fafc; }
    .utf8-byte-widths-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .utf8-byte-widths-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .utf8-byte-widths-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .utf8-byte-widths-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .utf8-byte-widths-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .utf8-byte-widths-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .utf8-byte-widths-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .utf8-byte-widths-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .utf8-byte-widths-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .utf8-byte-widths-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .utf8-byte-widths-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .utf8-byte-widths-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .utf8-byte-widths-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .utf8-byte-widths-stage { opacity: 1; }

    .utf8-byte-widths-s0 { animation-delay: 0.00s; }
    .utf8-byte-widths-e0 { animation-delay: 0.00s; }
    .utf8-byte-widths-s1 { animation-delay: 1.28s; }
    .utf8-byte-widths-e1 { animation-delay: 1.28s; }
    .utf8-byte-widths-s2 { animation-delay: 2.56s; }
    .utf8-byte-widths-e2 { animation-delay: 2.56s; }
    .utf8-byte-widths-s3 { animation-delay: 3.84s; }
    .utf8-byte-widths-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .utf8-byte-widths-conn  { animation: utf8-byte-widths-trace 6.4s ease-in-out infinite; }
      .utf8-byte-widths-stage { animation: utf8-byte-widths-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes utf8-byte-widths-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes utf8-byte-widths-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .utf8-byte-widths-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .utf8-byte-widths-stage { animation: utf8-byte-widths-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes utf8-byte-widths-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="utf8-byte-widths-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="utf8-byte-widths-bg" width="980" height="322"/>
  <text class="utf8-byte-widths-h1"  x="30" y="40">Why 'café' is four characters and five bytes</text>
  <text class="utf8-byte-widths-sub" x="30" y="64">UTF-8 spends one byte on ASCII and up to four on everything else.</text>
  <g class="utf8-byte-widths-stage utf8-byte-widths-s0">
    <rect class="utf8-byte-widths-good" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="utf8-byte-widths-step" x="44" y="142">01</text>
    <text class="utf8-byte-widths-name" x="70" y="142">1 byte</text>
    <text class="utf8-byte-widths-desc" x="44" y="166">A-Z, digits, punctuation.</text>
    <text class="utf8-byte-widths-desc" x="44" y="182">Identical to ASCII.</text>
    <text class="utf8-byte-widths-edge" x="44" y="242">U+0000-007F</text>
  </g>
  <line class="utf8-byte-widths-line utf8-byte-widths-conn utf8-byte-widths-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#utf8-byte-widths-tip)"/>
  <g class="utf8-byte-widths-stage utf8-byte-widths-s1">
    <rect class="utf8-byte-widths-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="utf8-byte-widths-step" x="280" y="142">02</text>
    <text class="utf8-byte-widths-name" x="306" y="142">2 bytes</text>
    <text class="utf8-byte-widths-desc" x="280" y="166">Accented Latin, Greek, Cyrillic,</text>
    <text class="utf8-byte-widths-desc" x="280" y="182">Hebrew, Arabic.</text>
    <text class="utf8-byte-widths-edge" x="280" y="242">U+0080-07FF</text>
  </g>
  <line class="utf8-byte-widths-line utf8-byte-widths-conn utf8-byte-widths-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#utf8-byte-widths-tip)"/>
  <g class="utf8-byte-widths-stage utf8-byte-widths-s2">
    <rect class="utf8-byte-widths-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="utf8-byte-widths-step" x="516" y="142">03</text>
    <text class="utf8-byte-widths-name" x="542" y="142">3 bytes</text>
    <text class="utf8-byte-widths-desc" x="516" y="166">Most CJK characters, and most</text>
    <text class="utf8-byte-widths-desc" x="516" y="182">other scripts.</text>
    <text class="utf8-byte-widths-edge" x="516" y="242">U+0800-FFFF</text>
  </g>
  <line class="utf8-byte-widths-line utf8-byte-widths-conn utf8-byte-widths-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#utf8-byte-widths-tip)"/>
  <g class="utf8-byte-widths-stage utf8-byte-widths-s3">
    <rect class="utf8-byte-widths-hi" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="utf8-byte-widths-step" x="752" y="142">04</text>
    <text class="utf8-byte-widths-name" x="778" y="142">4 bytes</text>
    <text class="utf8-byte-widths-desc" x="752" y="166">Emoji, rare scripts, historic</text>
    <text class="utf8-byte-widths-desc" x="752" y="182">alphabets.</text>
    <text class="utf8-byte-widths-edge" x="752" y="242">U+10000+</text>
  </g>
  <text class="utf8-byte-widths-sub" x="30" y="304">Backward compatibility is why UTF-8 won: every existing ASCII file was already valid UTF-8.</text>
</svg>
