<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four things, and none of them is a copy of your files.">
  <title>What is actually inside .git</title>
  <style>
    .inside-dot-git-bg   { fill: #f8fafc; }
    .inside-dot-git-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inside-dot-git-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inside-dot-git-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inside-dot-git-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inside-dot-git-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .inside-dot-git-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .inside-dot-git-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .inside-dot-git-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .inside-dot-git-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .inside-dot-git-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .inside-dot-git-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .inside-dot-git-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .inside-dot-git-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .inside-dot-git-stage { opacity: 1; }

    .inside-dot-git-s0 { animation-delay: 0.00s; }
    .inside-dot-git-e0 { animation-delay: 0.00s; }
    .inside-dot-git-s1 { animation-delay: 1.28s; }
    .inside-dot-git-e1 { animation-delay: 1.28s; }
    .inside-dot-git-s2 { animation-delay: 2.56s; }
    .inside-dot-git-e2 { animation-delay: 2.56s; }
    .inside-dot-git-s3 { animation-delay: 3.84s; }
    .inside-dot-git-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .inside-dot-git-conn  { animation: inside-dot-git-trace 6.4s ease-in-out infinite; }
      .inside-dot-git-stage { animation: inside-dot-git-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes inside-dot-git-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes inside-dot-git-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .inside-dot-git-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .inside-dot-git-stage { animation: inside-dot-git-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes inside-dot-git-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="inside-dot-git-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="inside-dot-git-bg" width="980" height="322"/>
  <text class="inside-dot-git-h1"  x="30" y="40">What is actually inside .git</text>
  <text class="inside-dot-git-sub" x="30" y="64">Four things, and none of them is a copy of your files.</text>
  <g class="inside-dot-git-stage inside-dot-git-s0">
    <rect class="inside-dot-git-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="inside-dot-git-step" x="44" y="142">01</text>
    <text class="inside-dot-git-name" x="70" y="142">objects/</text>
    <text class="inside-dot-git-desc" x="44" y="166">Every commit, tree and file</text>
    <text class="inside-dot-git-desc" x="44" y="182">version, addressed by hash. The</text>
    <text class="inside-dot-git-desc" x="44" y="198">history itself.</text>
    <text class="inside-dot-git-edge" x="44" y="242">the data</text>
  </g>
  <line class="inside-dot-git-line inside-dot-git-conn inside-dot-git-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#inside-dot-git-tip)"/>
  <g class="inside-dot-git-stage inside-dot-git-s1">
    <rect class="inside-dot-git-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="inside-dot-git-step" x="280" y="142">02</text>
    <text class="inside-dot-git-name" x="306" y="142">refs/</text>
    <text class="inside-dot-git-desc" x="280" y="166">Branches and tags: one small</text>
    <text class="inside-dot-git-desc" x="280" y="182">file each, containing a hash.</text>
    <text class="inside-dot-git-desc" x="280" y="198">That is all a branch is.</text>
    <text class="inside-dot-git-edge" x="280" y="242">pointers</text>
  </g>
  <line class="inside-dot-git-line inside-dot-git-conn inside-dot-git-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#inside-dot-git-tip)"/>
  <g class="inside-dot-git-stage inside-dot-git-s2">
    <rect class="inside-dot-git-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="inside-dot-git-step" x="516" y="142">03</text>
    <text class="inside-dot-git-name" x="542" y="142">HEAD</text>
    <text class="inside-dot-git-desc" x="516" y="166">One line naming which branch you</text>
    <text class="inside-dot-git-desc" x="516" y="182">are on.</text>
    <text class="inside-dot-git-edge" x="516" y="242">one line</text>
  </g>
  <line class="inside-dot-git-line inside-dot-git-conn inside-dot-git-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#inside-dot-git-tip)"/>
  <g class="inside-dot-git-stage inside-dot-git-s3">
    <rect class="inside-dot-git-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="inside-dot-git-step" x="752" y="142">04</text>
    <text class="inside-dot-git-name" x="778" y="142">index</text>
    <text class="inside-dot-git-desc" x="752" y="166">The staging area, as a file. Not</text>
    <text class="inside-dot-git-desc" x="752" y="182">a folder of copies.</text>
    <text class="inside-dot-git-edge" x="752" y="242">staged</text>
  </g>
  <text class="inside-dot-git-sub" x="30" y="304">Delete this directory and you have an ordinary folder of files with no history. Everything version control knows lives here, which is why it travels with a clone and a hook does not.</text>
</svg>
