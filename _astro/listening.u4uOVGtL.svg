<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One of them uses context.">
  <title>Hearing, or listening</title>
  <style>
    .listening-bg   { fill: #f8fafc; }
    .listening-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .listening-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .listening-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .listening-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .listening-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .listening-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .listening-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .listening-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .listening-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .listening-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .listening-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .listening-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .listening-row { opacity: 1; }
    .listening-r0 { animation-delay: 0.00s; }
    .listening-r1 { animation-delay: 0.45s; }
    .listening-r2 { animation-delay: 0.90s; }
    .listening-r3 { animation-delay: 1.35s; }
    .listening-r4 { animation-delay: 1.80s; }
    .listening-row { animation: listening-reveal 7.3s ease-in-out infinite; }
    @keyframes listening-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="listening-bg" width="980" height="390"/>
  <text class="listening-h1"  x="30" y="40">Hearing, or listening</text>
  <text class="listening-sub" x="30" y="64">One of them uses context.</text>
  <rect class="listening-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="listening-name" x="46" y="122">Matching sounds</text>
  <text class="listening-desc" x="46" y="142">Acoustics only.</text>
  <text class="listening-desc listening-row listening-r0" x="46" y="182">Each sound matched to a symbol</text>
  <text class="listening-desc listening-row listening-r1" x="46" y="216">No use of what came before</text>
  <text class="listening-desc listening-row listening-r2" x="46" y="250">Confuses similar-sounding words</text>
  <text class="listening-desc listening-row listening-r3" x="46" y="284">Fails badly in noise</text>
  <text class="listening-desc listening-row listening-r4" x="46" y="318">This was the old pipeline</text>
  <rect class="listening-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="listening-name" x="526" y="122">Listening</text>
  <text class="listening-desc" x="526" y="142">Acoustics and meaning.</text>
  <text class="listening-desc listening-row listening-r0" x="526" y="182">Sounds interpreted in context</text>
  <text class="listening-desc listening-row listening-r1" x="526" y="216">Later words resolve earlier ambiguity</text>
  <text class="listening-desc listening-row listening-r2" x="526" y="250">Distinguishes homophones by sense</text>
  <text class="listening-desc listening-row listening-r3" x="526" y="284">Tolerates noise and accents</text>
  <text class="listening-desc listening-row listening-r4" x="526" y="318">This is a sequence model</text>
  <text class="listening-sub" x="30" y="372">People do the second and not the first, which is why transcription that ignores context fails on exactly the cases a human listener finds easy.</text>
</svg>
