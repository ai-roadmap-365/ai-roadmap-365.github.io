<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when an encoder is twenty times cheaper.">
  <title>When to use a decoder</title>
  <style>
    .decoder-when-bg   { fill: #f8fafc; }
    .decoder-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decoder-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decoder-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decoder-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decoder-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .decoder-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .decoder-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .decoder-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .decoder-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .decoder-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .decoder-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .decoder-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .decoder-when-row { opacity: 1; }
    .decoder-when-r0 { animation-delay: 0.00s; }
    .decoder-when-r1 { animation-delay: 0.45s; }
    .decoder-when-r2 { animation-delay: 0.90s; }
    .decoder-when-r3 { animation-delay: 1.35s; }
    .decoder-when-r4 { animation-delay: 1.80s; }
    .decoder-when-row { animation: decoder-when-reveal 7.3s ease-in-out infinite; }
    @keyframes decoder-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="decoder-when-bg" width="980" height="390"/>
  <text class="decoder-when-h1"  x="30" y="40">When to use a decoder</text>
  <text class="decoder-when-sub" x="30" y="64">And when an encoder is twenty times cheaper.</text>
  <rect class="decoder-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="decoder-when-name" x="46" y="122">Use a decoder</text>
  <text class="decoder-when-desc" x="46" y="142">Novel text out.</text>
  <text class="decoder-when-desc decoder-when-row decoder-when-r0" x="46" y="182">Conversation and chat</text>
  <text class="decoder-when-desc decoder-when-row decoder-when-r1" x="46" y="216">Code assistance</text>
  <text class="decoder-when-desc decoder-when-row decoder-when-r2" x="46" y="250">Long-form drafting</text>
  <text class="decoder-when-desc decoder-when-row decoder-when-r3" x="46" y="284">Multi-step reasoning</text>
  <text class="decoder-when-desc decoder-when-row decoder-when-r4" x="46" y="318">Tool use and agents</text>
  <rect class="decoder-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="decoder-when-name" x="526" y="122">Use an encoder</text>
  <text class="decoder-when-desc" x="526" y="142">A label out.</text>
  <text class="decoder-when-desc decoder-when-row decoder-when-r0" x="526" y="182">Sub-five-millisecond classification</text>
  <text class="decoder-when-desc decoder-when-row decoder-when-r1" x="526" y="216">Spam and content filtering</text>
  <text class="decoder-when-desc decoder-when-row decoder-when-r2" x="526" y="250">Retrieval and reranking</text>
  <text class="decoder-when-desc decoder-when-row decoder-when-r3" x="526" y="284">Twenty times faster and cheaper</text>
  <text class="decoder-when-desc decoder-when-row decoder-when-r4" x="526" y="318">And often more accurate</text>
  <text class="decoder-when-sub" x="30" y="372">Reaching for a generative model to produce a label is one of the most common inefficiencies in current practice: it costs orders of magnitude more for a task a small encoder does better.</text>
</svg>
