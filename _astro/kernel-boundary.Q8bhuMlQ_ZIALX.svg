<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Your code cannot touch hardware. It can only ask.">
  <title>The line every program has to ask across</title>
  <style>
    .kernel-boundary-bg   { fill: #f8fafc; }
    .kernel-boundary-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kernel-boundary-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kernel-boundary-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kernel-boundary-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kernel-boundary-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kernel-boundary-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kernel-boundary-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .kernel-boundary-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .kernel-boundary-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .kernel-boundary-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .kernel-boundary-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .kernel-boundary-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kernel-boundary-row { opacity: 1; }
    .kernel-boundary-r0 { animation-delay: 0.00s; }
    .kernel-boundary-r1 { animation-delay: 0.45s; }
    .kernel-boundary-r2 { animation-delay: 0.90s; }
    .kernel-boundary-r3 { animation-delay: 1.35s; }
    .kernel-boundary-r4 { animation-delay: 1.80s; }
    .kernel-boundary-row { animation: kernel-boundary-reveal 7.3s ease-in-out infinite; }
    @keyframes kernel-boundary-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="kernel-boundary-bg" width="980" height="390"/>
  <text class="kernel-boundary-h1"  x="30" y="40">The line every program has to ask across</text>
  <text class="kernel-boundary-sub" x="30" y="64">Your code cannot touch hardware. It can only ask.</text>
  <rect class="kernel-boundary-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="kernel-boundary-name" x="46" y="122">User space — unprivileged</text>
  <text class="kernel-boundary-desc" x="46" y="142">Where your program runs</text>
  <text class="kernel-boundary-desc kernel-boundary-row kernel-boundary-r0" x="46" y="182">Arithmetic on its own memory</text>
  <text class="kernel-boundary-desc kernel-boundary-row kernel-boundary-r1" x="46" y="216">Calling its own functions</text>
  <text class="kernel-boundary-desc kernel-boundary-row kernel-boundary-r2" x="46" y="250">Asking the kernel for anything else</text>
  <text class="kernel-boundary-desc kernel-boundary-row kernel-boundary-r3" x="46" y="284">Cannot touch a disk, a device or another process</text>
  <text class="kernel-boundary-desc kernel-boundary-row kernel-boundary-r4" x="46" y="318">A wrong pointer harms only itself</text>
  <rect class="kernel-boundary-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="kernel-boundary-name" x="526" y="122">Kernel space — privileged</text>
  <text class="kernel-boundary-desc" x="526" y="142">Where the request is granted or refused</text>
  <text class="kernel-boundary-desc kernel-boundary-row kernel-boundary-r0" x="526" y="182">Reads and writes actual devices</text>
  <text class="kernel-boundary-desc kernel-boundary-row kernel-boundary-r1" x="526" y="216">Owns every process's memory map</text>
  <text class="kernel-boundary-desc kernel-boundary-row kernel-boundary-r2" x="526" y="250">Enforces file ownership and permissions</text>
  <text class="kernel-boundary-desc kernel-boundary-row kernel-boundary-r3" x="526" y="284">Decides which process runs next</text>
  <text class="kernel-boundary-desc kernel-boundary-row kernel-boundary-r4" x="526" y="318">A wrong pointer here takes the machine down</text>
  <text class="kernel-boundary-sub" x="30" y="372">open, read, write and fork are all system calls: a request across this line, checked before it is granted.</text>
</svg>
