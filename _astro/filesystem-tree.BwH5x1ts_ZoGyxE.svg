<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" font-family="system-ui, sans-serif">
  <title>A filesystem tree rooted at slash, with a home directory, showing an absolute path and a relative path to the same file</title>
  <rect x="0" y="0" width="720" height="520" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The filesystem tree</text>

  <!-- Root -->
  <rect x="330" y="56" width="60" height="34" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="360" y="79" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">/</text>
  <text x="398" y="78" font-size="14" fill="#1a202c">the root: the single top of the tree</text>

  <!-- Level 1 -->
  <rect x="120" y="130" width="70" height="34" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="155" y="153" text-anchor="middle" font-size="15" fill="#1a202c">bin</text>
  <rect x="240" y="130" width="70" height="34" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="275" y="153" text-anchor="middle" font-size="15" fill="#1a202c">etc</text>
  <rect x="360" y="130" width="90" height="34" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="405" y="153" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">home</text>
  <rect x="500" y="130" width="70" height="34" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="535" y="153" text-anchor="middle" font-size="15" fill="#1a202c">usr</text>

  <!-- Lines root to level 1 -->
  <line x1="360" y1="90" x2="155" y2="130" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="360" y1="90" x2="275" y2="130" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="360" y1="90" x2="405" y2="130" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="360" y1="90" x2="535" y2="130" stroke="#1d4ed8" stroke-width="2"/>

  <!-- Level 2: users -->
  <rect x="330" y="204" width="90" height="34" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="375" y="227" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">alice</text>
  <rect x="460" y="204" width="80" height="34" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="500" y="227" text-anchor="middle" font-size="15" fill="#1a202c">bob</text>
  <line x1="405" y1="164" x2="375" y2="204" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="405" y1="164" x2="500" y2="204" stroke="#1d4ed8" stroke-width="2"/>
  <text x="150" y="225" font-size="14" fill="#1a202c">home of user "alice" is</text>
  <text x="150" y="243" font-size="14" font-weight="bold" fill="#1d4ed8">~  =  /home/alice</text>

  <!-- Level 3: inside alice -->
  <rect x="300" y="278" width="100" height="34" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="350" y="301" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">projects</text>
  <rect x="430" y="278" width="110" height="34" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="485" y="301" text-anchor="middle" font-size="14" fill="#1a202c">.bashrc</text>
  <line x1="375" y1="238" x2="350" y2="278" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="375" y1="238" x2="485" y2="278" stroke="#1d4ed8" stroke-width="2"/>
  <text x="556" y="299" font-size="13" fill="#1a202c">(hidden: name starts with .)</text>

  <!-- Level 4: data -->
  <rect x="300" y="352" width="100" height="34" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="350" y="375" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">data</text>
  <line x1="350" y1="312" x2="350" y2="352" stroke="#1d4ed8" stroke-width="2"/>

  <!-- Level 5: file -->
  <rect x="290" y="426" width="120" height="34" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="350" y="449" text-anchor="middle" font-size="14" fill="#1a202c">notes.txt</text>
  <line x1="350" y1="386" x2="350" y2="426" stroke="#1d4ed8" stroke-width="2"/>

  <!-- Path annotations -->
  <text x="40" y="410" font-size="14" font-weight="bold" fill="#1d4ed8">Absolute path</text>
  <text x="40" y="430" font-size="13" fill="#1a202c">/home/alice/projects/</text>
  <text x="40" y="448" font-size="13" fill="#1a202c">data/notes.txt</text>

  <text x="470" y="410" font-size="14" font-weight="bold" fill="#1d4ed8">Relative path</text>
  <text x="470" y="430" font-size="13" fill="#1a202c">from projects/ it is</text>
  <text x="470" y="448" font-size="13" fill="#1a202c">data/notes.txt</text>

  <text x="360" y="492" text-anchor="middle" font-size="14" fill="#1a202c">An absolute path starts at / ; a relative path starts from where you are now.</text>
</svg>
