<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" width="1180" height="720" role="img" aria-labelledby="d086a-title d086a-desc">
  <title id="d086a-title">The anatomy of a SELECT statement: the order you write the clauses against the order the engine runs them</title>
  <desc id="d086a-desc">Two columns. On the left, the eight clauses of a SELECT in the order they are typed, each labelled with what it contributes. On the right, the same eight clauses renumbered into the order the engine evaluates them, each labelled with what it is allowed to refer to. Lines connect each clause on the left to its position on the right, showing that SELECT is typed first and evaluated fifth, and that WHERE is typed after SELECT but evaluated before it.</desc>

  <style>
    .d086a-bg      { fill: #f8fafc; }
    .d086a-title   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 22px; font-weight: 600; fill: #1a202c; }
    .d086a-head    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 18px; font-weight: 600; fill: #1a202c; }
    .d086a-label   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 600; fill: #1a202c; }
    .d086a-small   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d086a-note    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1a202c; }
    .d086a-num     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #ffffff; }
    .d086a-box     { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d086a-boxrun  { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d086a-panel   { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .d086a-disc    { fill: #1d4ed8; }
    .d086a-disc2   { fill: #64748b; }
    .d086a-link    { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .d086a-linkhot { stroke: #b91c1c; stroke-width: 2.5; fill: none; }
    .d086a-warn    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #b91c1c; }
  </style>

  <rect class="d086a-bg" x="0" y="0" width="1180" height="720" />

  <text class="d086a-title" x="36" y="46">One SELECT, two orders</text>
  <text class="d086a-small" x="36" y="72">The order you type the clauses in is fixed by the grammar. The order the engine runs them in is different, and every confusion in this lesson comes from that gap.</text>

  <text class="d086a-head" x="36" y="118">The order you WRITE it</text>
  <text class="d086a-head" x="660" y="118">The order it is EVALUATED</text>
  <text class="d086a-small" x="660" y="140">each clause may only refer to what earlier stages have already produced</text>

  <!-- ============ LEFT COLUMN: written order ============ -->
  <rect class="d086a-box" x="36" y="152" width="440" height="60" rx="8" />
  <circle class="d086a-disc2" cx="66" cy="182" r="14" />
  <text class="d086a-num" x="66" y="187" text-anchor="middle">1</text>
  <text class="d086a-label" x="92" y="178">SELECT</text>
  <text class="d086a-small" x="92" y="199">which columns and computed values come out</text>

  <rect class="d086a-box" x="36" y="222" width="440" height="60" rx="8" />
  <circle class="d086a-disc2" cx="66" cy="252" r="14" />
  <text class="d086a-num" x="66" y="257" text-anchor="middle">2</text>
  <text class="d086a-label" x="92" y="248">DISTINCT</text>
  <text class="d086a-small" x="92" y="269">drop duplicate output rows, not duplicate values</text>

  <rect class="d086a-box" x="36" y="292" width="440" height="60" rx="8" />
  <circle class="d086a-disc2" cx="66" cy="322" r="14" />
  <text class="d086a-num" x="66" y="327" text-anchor="middle">3</text>
  <text class="d086a-label" x="92" y="318">FROM</text>
  <text class="d086a-small" x="92" y="339">where the rows come from</text>

  <rect class="d086a-box" x="36" y="362" width="440" height="60" rx="8" />
  <circle class="d086a-disc2" cx="66" cy="392" r="14" />
  <text class="d086a-num" x="66" y="397" text-anchor="middle">4</text>
  <text class="d086a-label" x="92" y="388">WHERE</text>
  <text class="d086a-small" x="92" y="409">keep a ROW only when the predicate is TRUE</text>

  <rect class="d086a-box" x="36" y="432" width="440" height="60" rx="8" />
  <circle class="d086a-disc2" cx="66" cy="462" r="14" />
  <text class="d086a-num" x="66" y="467" text-anchor="middle">5</text>
  <text class="d086a-label" x="92" y="458">GROUP BY</text>
  <text class="d086a-small" x="92" y="479">collapse the surviving rows into buckets</text>

  <rect class="d086a-box" x="36" y="502" width="440" height="60" rx="8" />
  <circle class="d086a-disc2" cx="66" cy="532" r="14" />
  <text class="d086a-num" x="66" y="537" text-anchor="middle">6</text>
  <text class="d086a-label" x="92" y="528">HAVING</text>
  <text class="d086a-small" x="92" y="549">keep a BUCKET only when the predicate is TRUE</text>

  <rect class="d086a-box" x="36" y="572" width="440" height="60" rx="8" />
  <circle class="d086a-disc2" cx="66" cy="602" r="14" />
  <text class="d086a-num" x="66" y="607" text-anchor="middle">7</text>
  <text class="d086a-label" x="92" y="598">ORDER BY</text>
  <text class="d086a-small" x="92" y="619">put the finished rows into an order</text>

  <rect class="d086a-box" x="36" y="642" width="440" height="60" rx="8" />
  <circle class="d086a-disc2" cx="66" cy="672" r="14" />
  <text class="d086a-num" x="66" y="677" text-anchor="middle">8</text>
  <text class="d086a-label" x="92" y="668">LIMIT / OFFSET</text>
  <text class="d086a-small" x="92" y="689">skip some, then take at most this many</text>

  <!-- ============ CONNECTORS ============ -->
  <path class="d086a-link" d="M 476 322 C 560 322, 570 182, 660 182" />
  <path class="d086a-linkhot" d="M 476 392 C 560 392, 570 252, 660 252" />
  <path class="d086a-link" d="M 476 462 C 560 462, 570 322, 660 322" />
  <path class="d086a-link" d="M 476 532 C 560 532, 570 392, 660 392" />
  <path class="d086a-linkhot" d="M 476 182 C 560 182, 570 462, 660 462" />
  <path class="d086a-link" d="M 476 252 C 560 252, 570 532, 660 532" />
  <path class="d086a-link" d="M 476 602 C 600 602, 600 602, 660 602" />
  <path class="d086a-link" d="M 476 672 C 600 672, 600 672, 660 672" />

  <!-- ============ RIGHT COLUMN: evaluation order ============ -->
  <rect class="d086a-boxrun" x="660" y="152" width="484" height="60" rx="8" />
  <circle class="d086a-disc" cx="690" cy="182" r="14" />
  <text class="d086a-num" x="690" y="187" text-anchor="middle">1</text>
  <text class="d086a-label" x="716" y="178">FROM</text>
  <text class="d086a-small" x="716" y="199">produces the raw rows. Nothing exists before this</text>

  <rect class="d086a-boxrun" x="660" y="222" width="484" height="60" rx="8" />
  <circle class="d086a-disc" cx="690" cy="252" r="14" />
  <text class="d086a-num" x="690" y="257" text-anchor="middle">2</text>
  <text class="d086a-label" x="716" y="248">WHERE</text>
  <text class="d086a-small" x="716" y="269">sees stored columns only. No aggregates. No SELECT aliases</text>

  <rect class="d086a-boxrun" x="660" y="292" width="484" height="60" rx="8" />
  <circle class="d086a-disc" cx="690" cy="322" r="14" />
  <text class="d086a-num" x="690" y="327" text-anchor="middle">3</text>
  <text class="d086a-label" x="716" y="318">GROUP BY</text>
  <text class="d086a-small" x="716" y="339">buckets appear here. Individual rows stop existing</text>

  <rect class="d086a-boxrun" x="660" y="362" width="484" height="60" rx="8" />
  <circle class="d086a-disc" cx="690" cy="392" r="14" />
  <text class="d086a-num" x="690" y="397" text-anchor="middle">4</text>
  <text class="d086a-label" x="716" y="388">HAVING</text>
  <text class="d086a-small" x="716" y="409">the first stage that CAN see an aggregate, because now there is one</text>

  <rect class="d086a-boxrun" x="660" y="432" width="484" height="60" rx="8" />
  <circle class="d086a-disc" cx="690" cy="462" r="14" />
  <text class="d086a-num" x="690" y="467" text-anchor="middle">5</text>
  <text class="d086a-label" x="716" y="458">SELECT</text>
  <text class="d086a-small" x="716" y="479">the projection. This is where an alias is first created</text>

  <rect class="d086a-boxrun" x="660" y="502" width="484" height="60" rx="8" />
  <circle class="d086a-disc" cx="690" cy="532" r="14" />
  <text class="d086a-num" x="690" y="537" text-anchor="middle">6</text>
  <text class="d086a-label" x="716" y="528">DISTINCT</text>
  <text class="d086a-small" x="716" y="549">de-duplicates the PROJECTED rows, so it depends on stage 5</text>

  <rect class="d086a-boxrun" x="660" y="572" width="484" height="60" rx="8" />
  <circle class="d086a-disc" cx="690" cy="602" r="14" />
  <text class="d086a-num" x="690" y="607" text-anchor="middle">7</text>
  <text class="d086a-label" x="716" y="598">ORDER BY</text>
  <text class="d086a-small" x="716" y="619">runs after SELECT, so it CAN use an alias. Standard SQL, every engine</text>

  <rect class="d086a-boxrun" x="660" y="642" width="484" height="60" rx="8" />
  <circle class="d086a-disc" cx="690" cy="672" r="14" />
  <text class="d086a-num" x="690" y="677" text-anchor="middle">8</text>
  <text class="d086a-label" x="716" y="668">LIMIT / OFFSET</text>
  <text class="d086a-small" x="716" y="689">last. Meaningless without ORDER BY, because there is no defined order</text>

  <text class="d086a-warn" x="492" y="150">the two red lines are the whole lesson</text>
  <text class="d086a-warn" x="492" y="712">SELECT is typed 1st and run 5th; WHERE is typed 4th and run 2nd</text>
</svg>
