<svg role="img" aria-label="Neural scaling laws comparison showing Kaplan empirical power laws versus Chinchilla compute optimal tokens per parameter balance" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Neural Scaling Laws: Kaplan vs. Chinchilla</title>
  <defs>
    <linearGradient id="bg229b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card229b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg229b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">NEURAL SCALING LAWS: COMPUTE-OPTIMAL FRONTIER</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Kaplan et al. (2020) vs. Hoffmann et al. (2022) Chinchilla Frontier</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card229b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Left: Kaplan et al. (2020) -->
    <rect x="25" y="25" width="340" height="245" fill="#0f172a" stroke="#fb7185" stroke-width="1.5" rx="6"/>
    <text x="195" y="48" fill="#fb7185" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">1. Kaplan et al. (2020) Paradigm</text>
    <rect x="35" y="65" width="320" height="190" fill="#1e293b" stroke="#fb7185" rx="4"/>
    <text x="195" y="88" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">Loss Scales as Power Laws: L(N) = (N_c / N)^alpha</text>
    <text x="195" y="112" fill="#cbd5e1" font-size="8" text-anchor="middle">• Conclusion: Scale Parameters (N) 3x faster than Data (D)</text>
    <text x="195" y="132" fill="#cbd5e1" font-size="8" text-anchor="middle">• Resulted in: GPT-3 (175B params trained on only 300B tokens)</text>
    <text x="195" y="152" fill="#cbd5e1" font-size="8" text-anchor="middle">• Models were massive, expensive to serve, and undertrained!</text>
    <text x="195" y="235" fill="#fb7185" font-size="8" font-weight="700" text-anchor="middle">Parameter Heavy, Data Starved</text>

    <!-- Right: Chinchilla (Hoffmann et al., 2022) -->
    <rect x="395" y="25" width="340" height="245" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="565" y="48" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">2. Chinchilla Scaling Law (2022)</text>
    <rect x="405" y="65" width="320" height="190" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="565" y="88" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">Compute-Optimal: Scale N and D in Equal Proportion!</text>
    <text x="565" y="112" fill="#cbd5e1" font-size="8" text-anchor="middle">• Rule of Thumb: 20 Training Tokens per Parameter</text>
    <text x="565" y="132" fill="#cbd5e1" font-size="8" text-anchor="middle">• Chinchilla-70B (1.4T tokens) beat 280B Gopher</text>
    <text x="565" y="152" fill="#cbd5e1" font-size="8" text-anchor="middle">• LLaMA / Mistral Paradigm: 8B-70B trained on 15T tokens</text>
    <text x="565" y="235" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Compute-Optimal Foundation</text>
  </g>
</svg>
