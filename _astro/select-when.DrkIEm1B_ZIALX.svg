<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Database or application.">
  <title>Where to do the work</title>
  <style>
    .select-when-bg   { fill: #f8fafc; }
    .select-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .select-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .select-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .select-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .select-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .select-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .select-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .select-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .select-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .select-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .select-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .select-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .select-when-row { opacity: 1; }
    .select-when-r0 { animation-delay: 0.00s; }
    .select-when-r1 { animation-delay: 0.45s; }
    .select-when-r2 { animation-delay: 0.90s; }
    .select-when-r3 { animation-delay: 1.35s; }
    .select-when-r4 { animation-delay: 1.80s; }
    .select-when-row { animation: select-when-reveal 7.3s ease-in-out infinite; }
    @keyframes select-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="select-when-bg" width="980" height="390"/>
  <text class="select-when-h1"  x="30" y="40">Where to do the work</text>
  <text class="select-when-sub" x="30" y="64">Database or application.</text>
  <rect class="select-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="select-when-name" x="46" y="122">In the database</text>
  <text class="select-when-desc" x="46" y="142">Four cases.</text>
  <text class="select-when-desc select-when-row select-when-r0" x="46" y="182">Filtering large tables</text>
  <text class="select-when-desc select-when-row select-when-r1" x="46" y="216">Aggregation and grouping</text>
  <text class="select-when-desc select-when-row select-when-r2" x="46" y="250">Joining related tables</text>
  <text class="select-when-desc select-when-row select-when-r3" x="46" y="284">Sorting and limiting</text>
  <text class="select-when-desc select-when-row select-when-r4" x="46" y="318">Anything reducing rows transferred</text>
  <rect class="select-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="select-when-name" x="526" y="122">In the application</text>
  <text class="select-when-desc" x="526" y="142">Also four.</text>
  <text class="select-when-desc select-when-row select-when-r0" x="526" y="182">Complex business logic</text>
  <text class="select-when-desc select-when-row select-when-r1" x="526" y="216">Formatting for display</text>
  <text class="select-when-desc select-when-row select-when-r2" x="526" y="250">Calls to external services</text>
  <text class="select-when-desc select-when-row select-when-r3" x="526" y="284">Anything needing a real language</text>
  <text class="select-when-desc select-when-row select-when-r4" x="526" y="318">Where the result set is already small</text>
  <text class="select-when-sub" x="30" y="372">Reducing rows transferred is the guiding principle: moving a million rows to filter nine of them in the application wastes the entire query engine.</text>
</svg>
