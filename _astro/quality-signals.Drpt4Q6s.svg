<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="None conclusive alone.">
  <title>Four cheap signals</title>
  <style>
    .quality-signals-bg   { fill: #f8fafc; }
    .quality-signals-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quality-signals-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quality-signals-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quality-signals-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quality-signals-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quality-signals-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .quality-signals-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .quality-signals-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .quality-signals-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .quality-signals-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .quality-signals-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .quality-signals-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .quality-signals-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .quality-signals-stage { opacity: 1; }

    .quality-signals-s0 { animation-delay: 0.00s; }
    .quality-signals-e0 { animation-delay: 0.00s; }
    .quality-signals-s1 { animation-delay: 1.28s; }
    .quality-signals-e1 { animation-delay: 1.28s; }
    .quality-signals-s2 { animation-delay: 2.56s; }
    .quality-signals-e2 { animation-delay: 2.56s; }
    .quality-signals-s3 { animation-delay: 3.84s; }
    .quality-signals-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .quality-signals-conn  { animation: quality-signals-trace 6.4s ease-in-out infinite; }
      .quality-signals-stage { animation: quality-signals-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes quality-signals-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes quality-signals-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .quality-signals-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .quality-signals-stage { animation: quality-signals-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes quality-signals-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="quality-signals-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="quality-signals-bg" width="980" height="322"/>
  <text class="quality-signals-h1"  x="30" y="40">Four cheap signals</text>
  <text class="quality-signals-sub" x="30" y="64">None conclusive alone.</text>
  <g class="quality-signals-stage quality-signals-s0">
    <rect class="quality-signals-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="quality-signals-step" x="44" y="142">01</text>
    <text class="quality-signals-name" x="70" y="142">Text yield</text>
    <text class="quality-signals-desc" x="44" y="166">Characters per page. Forty pages</text>
    <text class="quality-signals-desc" x="44" y="182">yielding 200 characters is a</text>
    <text class="quality-signals-desc" x="44" y="198">scan.</text>
    <text class="quality-signals-edge" x="44" y="242">scans</text>
  </g>
  <line class="quality-signals-line quality-signals-conn quality-signals-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#quality-signals-tip)"/>
  <g class="quality-signals-stage quality-signals-s1">
    <rect class="quality-signals-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="quality-signals-step" x="280" y="142">02</text>
    <text class="quality-signals-name" x="306" y="142">Alphabetic ratio</text>
    <text class="quality-signals-desc" x="280" y="166">Mojibake and OCR noise score</text>
    <text class="quality-signals-desc" x="280" y="182">low.</text>
    <text class="quality-signals-edge" x="280" y="242">encoding</text>
  </g>
  <line class="quality-signals-line quality-signals-conn quality-signals-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#quality-signals-tip)"/>
  <g class="quality-signals-stage quality-signals-s2">
    <rect class="quality-signals-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="quality-signals-step" x="516" y="142">03</text>
    <text class="quality-signals-name" x="542" y="142">Mean word length</text>
    <text class="quality-signals-desc" x="516" y="166">Prose sits at four to six. Very</text>
    <text class="quality-signals-desc" x="516" y="182">long means lost whitespace; very</text>
    <text class="quality-signals-desc" x="516" y="198">short means noise.</text>
  </g>
  <line class="quality-signals-line quality-signals-conn quality-signals-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#quality-signals-tip)"/>
  <g class="quality-signals-stage quality-signals-s3">
    <rect class="quality-signals-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="quality-signals-step" x="752" y="142">04</text>
    <text class="quality-signals-name" x="778" y="142">Whitespace ratio</text>
    <text class="quality-signals-desc" x="752" y="166">No spaces at all means word</text>
    <text class="quality-signals-desc" x="752" y="182">boundaries were never recovered.</text>
  </g>
  <text class="quality-signals-sub" x="30" y="304">Together they separate fine from catastrophic reliably, which is the correct ambition: they will not detect subtle damage, and catastrophic failure is what silently removes documents from an index.</text>
</svg>
