<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="MCP Defense in Depth Sandboxing and HITL Gate">
  <title>MCP Defense in Depth Sandboxing and HITL Gate</title>
  <defs>
    <style>
      .d300f-bg { fill: #f8fafc; }
      .d300f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d300f-layer { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d300f-hitl { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 8px; }
      .d300f-safe { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d300f-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d300f-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d300f-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d300f-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
      .d300f-flow { stroke: #3b82f6; stroke-width: 2px; marker-end: url(#d300f-m); fill: none; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d300f-bg" />
  
  <text x="40" y="40" class="d300a-title">Defense-in-Depth Architecture for MCP</text>
  <text x="40" y="65" class="d300a-subtitle">MCP Defense in Depth Sandboxing and HITL Gate flowchart showing Input Sanitization, Path Canonicalization, Human Approval Boundary, and Execution Sandbox</text>
  
  <!-- Layer 1: Sanitization -->
  <rect x="40" y="110" width="180" height="260" class="d300f-layer" />
  <text x="55" y="140" class="d300f-header" fill="#1d4ed8">1. Input Validation</text>
  <text x="55" y="170" class="d300f-text">• Strict JSON Schema</text>
  <text x="55" y="190" class="d300f-text">• Pydantic type coercion</text>
  <text x="55" y="210" class="d300f-text">• Regex allowlists</text>
  <text x="55" y="230" class="d300f-text">• Path canonicalization:</text>
  <text x="55" y="250" class="d300f-text">  `os.path.realpath`</text>
  <text x="55" y="270" class="d300f-text">  rejection of `../`</text>
  
  <!-- Layer 2: Permission Classification -->
  <rect x="250" y="110" width="180" height="260" class="d300f-card" />
  <text x="265" y="140" class="d300f-header">2. Tool Risk Classifier</text>
  <text x="265" y="170" class="d300f-text">• READ-ONLY (Safe):</text>
  <text x="265" y="190" class="d300f-text">  Auto-approved</text>
  <text x="265" y="220" class="d300f-text">• DESTRUCTIVE (High):</text>
  <text x="265" y="240" class="d300f-text">  SQL mutations</text>
  <text x="265" y="260" class="d300f-text">  File deletions</text>
  <text x="265" y="280" class="d300f-text">  Network sends</text>
  
  <!-- Layer 3: HITL Gate -->
  <rect x="460" y="110" width="190" height="260" class="d300f-hitl" />
  <text x="475" y="140" class="d300f-header" fill="#a16207">3. Human Approval Gate</text>
  <text x="475" y="170" class="d300f-text">• Intercepts high-risk</text>
  <text x="475" y="190" class="d300f-text">• Displays exact args</text>
  <text x="475" y="210" class="d300f-text">• Prompts user confirmation:</text>
  <text x="475" y="230" class="d300f-text">  [Approve] / [Reject]</text>
  <text x="475" y="260" class="d300f-text" font-weight="600">Rejection Feedback:</text>
  <text x="475" y="280" class="d300f-text">Returns `UserDeniedError`</text>
  
  <!-- Layer 4: Execution Sandbox -->
  <rect x="680" y="110" width="180" height="260" class="d300f-safe" />
  <text x="695" y="140" class="d300f-header" fill="#15803d">4. Sandboxed Exec</text>
  <text x="695" y="170" class="d300f-text">• Restricted cwd</text>
  <text x="695" y="190" class="d300f-text">• Parameterized SQL</text>
  <text x="695" y="210" class="d300f-text">• Hard execution timeout</text>
  <text x="695" y="230" class="d300f-text">• Audit logging to</text>
  <text x="695" y="250" class="d300f-text">  secure WAL log</text>
</svg>