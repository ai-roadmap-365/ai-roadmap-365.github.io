<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward speed.">
  <title>Four steps in code checking</title>
  <style>
    .lint-history-bg   { fill: #f8fafc; }
    .lint-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lint-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lint-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lint-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lint-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lint-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lint-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .lint-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .lint-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .lint-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .lint-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .lint-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .lint-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .lint-history-stage { opacity: 1; }

    .lint-history-s0 { animation-delay: 0.00s; }
    .lint-history-e0 { animation-delay: 0.00s; }
    .lint-history-s1 { animation-delay: 1.28s; }
    .lint-history-e1 { animation-delay: 1.28s; }
    .lint-history-s2 { animation-delay: 2.56s; }
    .lint-history-e2 { animation-delay: 2.56s; }
    .lint-history-s3 { animation-delay: 3.84s; }
    .lint-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .lint-history-conn  { animation: lint-history-trace 6.4s ease-in-out infinite; }
      .lint-history-stage { animation: lint-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes lint-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes lint-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .lint-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .lint-history-stage { animation: lint-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes lint-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="lint-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="lint-history-bg" width="980" height="322"/>
  <text class="lint-history-h1"  x="30" y="40">Four steps in code checking</text>
  <text class="lint-history-sub" x="30" y="64">Toward speed.</text>
  <g class="lint-history-stage lint-history-s0">
    <rect class="lint-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="lint-history-step" x="44" y="142">01</text>
    <text class="lint-history-name" x="70" y="142">Written style guides</text>
    <text class="lint-history-desc" x="44" y="166">Which relied on people</text>
    <text class="lint-history-desc" x="44" y="182">remembering them.</text>
  </g>
  <line class="lint-history-line lint-history-conn lint-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#lint-history-tip)"/>
  <g class="lint-history-stage lint-history-s1">
    <rect class="lint-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="lint-history-step" x="280" y="142">02</text>
    <text class="lint-history-name" x="306" y="142">Then linters that checked mechanically</text>
    <text class="lint-history-desc" x="280" y="166">Turning the guide into a gate.</text>
  </g>
  <line class="lint-history-line lint-history-conn lint-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#lint-history-tip)"/>
  <g class="lint-history-stage lint-history-s2">
    <rect class="lint-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="lint-history-step" x="516" y="142">03</text>
    <text class="lint-history-name" x="542" y="142">Then opinionated formatters with no options</text>
    <text class="lint-history-desc" x="516" y="166">Which ended the debates</text>
    <text class="lint-history-desc" x="516" y="182">entirely.</text>
  </g>
  <line class="lint-history-line lint-history-conn lint-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#lint-history-tip)"/>
  <g class="lint-history-stage lint-history-s3">
    <rect class="lint-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="lint-history-step" x="752" y="142">04</text>
    <text class="lint-history-name" x="778" y="142">And fast unified tools</text>
    <text class="lint-history-desc" x="752" y="166">Quick enough to run on every</text>
    <text class="lint-history-desc" x="752" y="182">keystroke.</text>
  </g>
  <text class="lint-history-sub" x="30" y="304">Speed changed adoption more than capability did: a check that takes a second is run constantly, and one that takes a minute is run at the end, if ever.</text>
</svg>
