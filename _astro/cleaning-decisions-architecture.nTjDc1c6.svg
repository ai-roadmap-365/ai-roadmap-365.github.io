<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" role="img" aria-labelledby="d125aTitleId d125aDescId">
  <title id="d125aTitleId">Cleaning is a sequence of forks, each with a cost written on it</title>
  <desc id="d125aDescId">A messy DataFrame passes through four sequential decision forks -- drop or fill, coerce or reject, normalise or keep, remove or keep the outlier -- each branch labelled with its real cost, before emerging as a cleaned DataFrame. A caption states this is a map of costs, not a set of correct answers.</desc>

  <style>
    .d125a-bg      { fill: #f8fafc; }
    .d125a-title   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 21px; font-weight: 700; fill: #1a202c; }
    .d125a-sub     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d125a-stage   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; font-weight: 700; fill: #1d4ed8; letter-spacing: 0.5px; }
    .d125a-label   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; fill: #1a202c; }
    .d125a-cost    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12.5px; fill: #334155; }
    .d125a-mono    { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; fill: #1a202c; }
    .d125a-caption { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d125a-df      { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
    .d125a-dfcell  { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
    .d125a-dfbad   { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1; }
    .d125a-good    { fill: #dcfce7; stroke: #047857; stroke-width: 1.75; }
    .d125a-branchA { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d125a-branchB { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.5; }
    .d125a-node    { fill: #1a202c; }
    .d125a-wire    { stroke: #64748b; stroke-width: 1.75; fill: none; }
    .d125a-arrow   { stroke: #1d4ed8; stroke-width: 2; fill: none; marker-end: url(#d125a-arrowhead); }
    .d125a-band    { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1; }
  </style>

  <defs>
    <marker id="d125a-arrowhead" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#1d4ed8" />
    </marker>
  </defs>

  <rect class="d125a-bg" x="0" y="0" width="1240" height="700" />

  <text class="d125a-title" x="28" y="34">Cleaning is a sequence of forks</text>
  <text class="d125a-sub" x="28" y="54">Every branch has a real cost -- this is a map of costs, not a flowchart of correct answers</text>

  <!-- ============================ MESSY DATAFRAME (left) ============================ -->
  <g>
    <text class="d125a-stage" x="20" y="90">MESSY INPUT</text>
    <rect class="d125a-df" x="16" y="100" width="150" height="140" rx="4" />
    <rect class="d125a-dfcell" x="16" y="100" width="150" height="22" />
    <text class="d125a-mono" x="24" y="115" font-weight="700">customers</text>
    <rect class="d125a-dfbad" x="16" y="122" width="150" height="18" />
    <text class="d125a-mono" x="24" y="135">income: NaN</text>
    <rect class="d125a-dfcell" x="16" y="140" width="150" height="18" />
    <text class="d125a-mono" x="24" y="153">country: " usa "</text>
    <rect class="d125a-dfbad" x="16" y="158" width="150" height="18" />
    <text class="d125a-mono" x="24" y="171">qty: "N/A"</text>
    <rect class="d125a-dfcell" x="16" y="176" width="150" height="18" />
    <text class="d125a-mono" x="24" y="189">amount: 500000</text>
    <rect class="d125a-dfcell" x="16" y="194" width="150" height="18" />
    <text class="d125a-mono" x="24" y="207">amount: 42</text>
    <rect class="d125a-dfcell" x="16" y="212" width="150" height="18" />
    <text class="d125a-mono" x="24" y="225">... 8 more rows</text>
    <text class="d125a-cost" x="16" y="256">gaps, garbage strings,</text>
    <text class="d125a-cost" x="16" y="270">spelling variants, an extreme value</text>
  </g>

  <!-- connecting wire from input to stage 1 -->
  <path class="d125a-arrow" d="M 172 170 L 210 170" />

  <!-- ============================ FOUR FORK STAGES ============================ -->
  <!-- Stage template: node at (cx,170), two branches above/below with labels -->

  <!-- Stage 1: drop or fill -->
  <g>
    <text class="d125a-stage" x="200" y="90">FORK 1</text>
    <text class="d125a-label" x="200" y="108">drop or fill?</text>
    <circle class="d125a-node" cx="222" cy="170" r="5" />
    <path class="d125a-wire" d="M 222 170 L 222 128 L 300 128" />
    <path class="d125a-wire" d="M 222 170 L 222 214 L 300 214" />
    <rect class="d125a-branchA" x="300" y="104" width="180" height="48" rx="4" />
    <text class="d125a-label" x="310" y="122">drop</text>
    <text class="d125a-cost" x="310" y="138">honest if few rows; disastrous</text>
    <text class="d125a-cost" x="310" y="150">if missingness is informative</text>
    <rect class="d125a-branchB" x="300" y="190" width="180" height="48" rx="4" />
    <text class="d125a-label" x="310" y="208">fill</text>
    <text class="d125a-cost" x="310" y="224">invents a value; changes</text>
    <text class="d125a-cost" x="310" y="236">downstream statistics</text>
  </g>

  <path class="d125a-arrow" d="M 480 170 L 520 170" />

  <!-- Stage 2: coerce or reject -->
  <g>
    <text class="d125a-stage" x="470" y="90">FORK 2</text>
    <text class="d125a-label" x="470" y="108">coerce or reject?</text>
    <circle class="d125a-node" cx="502" cy="170" r="5" />
    <path class="d125a-wire" d="M 502 170 L 502 128 L 580 128" />
    <path class="d125a-wire" d="M 502 170 L 502 214 L 580 214" />
    <rect class="d125a-branchA" x="580" y="104" width="190" height="48" rx="4" />
    <text class="d125a-label" x="590" y="122">coerce</text>
    <text class="d125a-cost" x="590" y="138">silently manufactures missing</text>
    <text class="d125a-cost" x="590" y="150">values from unparseable strings</text>
    <rect class="d125a-branchB" x="580" y="190" width="190" height="48" rx="4" />
    <text class="d125a-label" x="590" y="208">reject</text>
    <text class="d125a-cost" x="590" y="224">loses the whole column;</text>
    <text class="d125a-cost" x="590" y="236">nothing to analyse at all</text>
  </g>

  <path class="d125a-arrow" d="M 770 170 L 810 170" />

  <!-- Stage 3: normalise or keep -->
  <g>
    <text class="d125a-stage" x="760" y="90">FORK 3</text>
    <text class="d125a-label" x="760" y="108">normalise or keep?</text>
    <circle class="d125a-node" cx="792" cy="170" r="5" />
    <path class="d125a-wire" d="M 792 170 L 792 128 L 870 128" />
    <path class="d125a-wire" d="M 792 170 L 792 214 L 870 214" />
    <rect class="d125a-branchA" x="870" y="104" width="190" height="48" rx="4" />
    <text class="d125a-label" x="880" y="122">normalise</text>
    <text class="d125a-cost" x="880" y="138">merges categories that may</text>
    <text class="d125a-cost" x="880" y="150">not truly be identical</text>
    <rect class="d125a-branchB" x="870" y="190" width="190" height="48" rx="4" />
    <text class="d125a-label" x="880" y="208">keep raw</text>
    <text class="d125a-cost" x="880" y="224">leaves a groupby</text>
    <text class="d125a-cost" x="880" y="236">silently split</text>
  </g>

  <!-- ============================ STAGE 4 (below, to keep width sane) ============================ -->
  <path class="d125a-wire" d="M 1060 170 L 1090 170 L 1090 340" />
  <path class="d125a-arrow" d="M 1090 340 L 1090 360" />

  <g>
    <text class="d125a-stage" x="900" y="400">FORK 4</text>
    <text class="d125a-label" x="900" y="418">remove or keep the outlier?</text>
    <circle class="d125a-node" cx="1090" cy="460" r="5" />
    <path class="d125a-wire" d="M 1090 460 L 1024 460 L 1024 434" />
    <path class="d125a-wire" d="M 1090 460 L 1024 460 L 1024 500" />
    <rect class="d125a-branchA" x="844" y="410" width="180" height="48" rx="4" />
    <text class="d125a-label" x="854" y="428">remove</text>
    <text class="d125a-cost" x="854" y="444">teaches a model a world</text>
    <text class="d125a-cost" x="854" y="456">without extremes</text>
    <rect class="d125a-branchB" x="844" y="476" width="180" height="48" rx="4" />
    <text class="d125a-label" x="854" y="494">keep</text>
    <text class="d125a-cost" x="854" y="510">lets one point dominate</text>
    <text class="d125a-cost" x="854" y="522">a mean or a fitted line</text>
  </g>

  <!-- ============================ CLEANED DATAFRAME (bottom right) ============================ -->
  <path class="d125a-arrow" d="M 1090 460 L 1140 460 L 1140 500" />

  <g>
    <text class="d125a-stage" x="1050" y="530">CLEANED OUTPUT</text>
    <rect class="d125a-good" x="1050" y="540" width="150" height="120" rx="4" />
    <rect class="d125a-dfcell" x="1050" y="540" width="150" height="22" />
    <text class="d125a-mono" x="1058" y="555" font-weight="700">customers</text>
    <text class="d125a-mono" x="1058" y="576">income: 52000</text>
    <text class="d125a-mono" x="1058" y="594">country: "USA"</text>
    <text class="d125a-mono" x="1058" y="612">qty: NaN (flagged)</text>
    <text class="d125a-mono" x="1058" y="630">amount: 500000</text>
    <text class="d125a-mono" x="1058" y="648">10 rows, contract-checked</text>
  </g>

  <!-- ============================ CAPTION BAND ============================ -->
  <rect class="d125a-band" x="16" y="600" width="800" height="86" rx="6" />
  <text class="d125a-caption" x="32" y="624" font-weight="700">Every fork has a real cost on BOTH branches -- neither is free.</text>
  <text class="d125a-caption" x="32" y="644">Judge each decision by what it changes, never by whether it silences a warning.</text>
  <text class="d125a-caption" x="32" y="664">This diagram is a map of costs, not a set of correct answers -- the right branch depends</text>
  <text class="d125a-caption" x="32" y="680">on the question being asked, exactly as Day 125's lesson argues throughout.</text>
</svg>
