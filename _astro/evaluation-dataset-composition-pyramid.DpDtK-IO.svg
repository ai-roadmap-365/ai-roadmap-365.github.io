<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Evaluation Dataset Composition Pyramid">
  <title>Evaluation Dataset Composition Pyramid</title>
  <defs>
    <style>
      .d310a-bg { fill: #f8fafc; }
      .d310a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d310a-p1 { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; }
      .d310a-p2 { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; }
      .d310a-p3 { fill: #fefce8; stroke: #eab308; stroke-width: 2px; }
      .d310a-p4 { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; }
      .d310a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d310a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d310a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d310a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d310a-bg" />
  
  <text x="40" y="40" class="d310a-title">Production Eval Dataset Stratification</text>
  <text x="40" y="65" class="d310a-subtitle">Evaluation Dataset Composition Pyramid showing Happy Path Invariants (50%), Hard Negative Edge Cases (25%), Boundary &amp; Schema Conditions (15%), and Adversarial Red-Teaming (10%)</text>
  
  <!-- Tier 4 (Top): Adversarial & Red Teaming (10%) -->
  <polygon points="450,100 350,160 550,160" class="d310a-p4" />
  <text x="450" y="140" class="d310a-header" fill="#991b1b" text-anchor="middle">10% Adversarial / Red-Teaming</text>
  
  <!-- Tier 3: Schema & Boundary Conditions (15%) -->
  <polygon points="350,165 275,235 625,235 550,165" class="d310a-p3" />
  <text x="450" y="205" class="d310a-header" fill="#854d0e" text-anchor="middle">15% Schema Boundaries &amp; Nulls</text>
  
  <!-- Tier 2: Hard Negatives & Misleading Context (25%) -->
  <polygon points="275,240 190,320 710,320 625,240" class="d310a-p2" />
  <text x="450" y="285" class="d310a-header" fill="#6b21a8" text-anchor="middle">25% Hard Negatives &amp; Distractors (Abstention)</text>
  
  <!-- Tier 1 (Base): Happy Path Core Invariants (50%) -->
  <polygon points="190,325 100,410 800,410 710,325" class="d310a-p1" />
  <text x="450" y="370" class="d310a-header" fill="#1e40af" text-anchor="middle">50% Core Domain Invariants &amp; Typical User Traffic</text>
</svg>