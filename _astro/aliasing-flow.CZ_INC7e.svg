<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-labelledby="d131fTitleId d131fDescId">
  <title id="d131fTitleId">Aliasing: a fast underlying cycle sampled too slowly assembles into a slow wave that does not exist in the source signal</title>
  <desc id="d131fDescId">A fast cosine cycle runs across the top panel. A comb of eight vertical sampling marks, spaced every fifth day, picks out one point at a time; a highlighted band sweeps left to right across the panel to show the comb sliding along the signal, and each sampling mark and its dot light up in turn as the sweep passes it. The eight sampled values, connected in the bottom panel in the order they were taken, assemble into a slow, smooth wave -- a pattern that is not present anywhere in the fast signal above it and exists only because of the interval between samples. A caption states the true period is 4 days, the sampling interval is 5 days, and the observed period is 20 days. With motion disabled, every sampling mark and dot is already lit at full opacity, the sweeping band rests at its start position, and the full slow wave is drawn as a still, complete curve.</desc>

  <style>
    .d131f-bg     { fill: #f8fafc; }
    .d131f-title  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 19px; font-weight: 600; fill: #1a202c; }
    .d131f-panel  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; fill: #1a202c; }
    .d131f-label  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1a202c; }
    .d131f-small  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d131f-axis   { stroke: #94a3b8; stroke-width: 1.5; }
    .d131f-fast   { fill: none; stroke: #94a3b8; stroke-width: 2.5; }
    .d131f-slow   { fill: none; stroke: #b91c1c; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .d131f-box    { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.25; }

    /* Motion 3 -- each sampling tick and its dot lights up in sequence as the comb passes it. */
    .d131f-tick { stroke: #1d4ed8; stroke-width: 2; stroke-dasharray: 4 3; animation: d131f-lift 5.6s ease-in-out infinite; }
    .d131f-dot  { fill: #1d4ed8; animation: d131f-lift-fill 5.6s ease-in-out infinite; }
    .d131f-t0 { animation-delay: 0.0s; } .d131f-t1 { animation-delay: 0.7s; }
    .d131f-t2 { animation-delay: 1.4s; } .d131f-t3 { animation-delay: 2.1s; }
    .d131f-t4 { animation-delay: 2.8s; } .d131f-t5 { animation-delay: 3.5s; }
    .d131f-t6 { animation-delay: 4.2s; } .d131f-t7 { animation-delay: 4.9s; }
    @keyframes d131f-lift {
      0%, 12%, 100% { stroke: #1d4ed8; opacity: 0.85; }
      3%, 8%        { stroke: #b91c1c; opacity: 1; }
    }
    @keyframes d131f-lift-fill {
      0%, 12%, 100% { fill: #1d4ed8; }
      3%, 8%        { fill: #b91c1c; }
    }

    /* Matching reveal on the slow-wave dot below, same timing as the tick above it. */
    .d131f-slowdot { fill: #b91c1c; animation: d131f-reveal 5.6s ease-in-out infinite; }
    @keyframes d131f-reveal {
      0%, 10%, 100% { opacity: 0.85; }
      3%, 8%        { opacity: 1; }
    }

    /* Motion 1 -- a translucent band sweeps across the panel, "the comb sliding". */
    .d131f-sweep { fill: #1d4ed8; opacity: 0.14; animation: d131f-slide 5.6s ease-in-out infinite; }
    @keyframes d131f-slide {
      0%   { transform: translateX(0); }
      100% { transform: translateX(840px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .d131f-tick, .d131f-dot, .d131f-slowdot { animation: none; opacity: 1; }
      .d131f-tick { stroke: #1d4ed8; }
      .d131f-dot, .d131f-slowdot { fill: #1d4ed8; }
      .d131f-sweep { animation: none; transform: translateX(0); }
    }
  </style>

  <rect class="d131f-bg" x="0" y="0" width="960" height="700" />
  <text class="d131f-title" x="32" y="36">Aliasing -- sampling too slowly manufactures a pattern that is not there</text>

  <!-- ===================== Top panel: the fast true signal ===================== -->
  <text class="d131f-panel" x="32" y="66">True signal -- a 4-day cycle</text>
  <line class="d131f-axis" x1="40" y1="300" x2="920" y2="300" />

  <clipPath id="d131f-sweepClip"><rect x="40" y="82" width="880" height="218" /></clipPath>
  <g clip-path="url(#d131f-sweepClip)">
    <rect class="d131f-sweep" x="40" y="82" width="40" height="218" />
  </g>

  <path class="d131f-fast" d="M 40.0,100.0 L 62.6,190.0 L 85.1,280.0 L 107.7,190.0 L 130.3,100.0 L 152.8,190.0 L 175.4,280.0 L 197.9,190.0 L 220.5,100.0 L 243.1,190.0 L 265.6,280.0 L 288.2,190.0 L 310.8,100.0 L 333.3,190.0 L 355.9,280.0 L 378.5,190.0 L 401.0,100.0 L 423.6,190.0 L 446.2,280.0 L 468.7,190.0 L 491.3,100.0 L 513.8,190.0 L 536.4,280.0 L 559.0,190.0 L 581.5,100.0 L 604.1,190.0 L 626.7,280.0 L 649.2,190.0 L 671.8,100.0 L 694.4,190.0 L 716.9,280.0 L 739.5,190.0 L 762.1,100.0 L 784.6,190.0 L 807.2,280.0 L 829.7,190.0 L 852.3,100.0 L 874.9,190.0 L 897.4,280.0 L 920.0,190.0" />

  <!-- Eight sampling marks, every 5th day, lighting up in sequence as the comb sweeps -->
  <line class="d131f-tick d131f-t0" x1="40.0" y1="82" x2="40.0" y2="300" />
  <line class="d131f-tick d131f-t1" x1="152.8" y1="82" x2="152.8" y2="300" />
  <line class="d131f-tick d131f-t2" x1="265.6" y1="82" x2="265.6" y2="300" />
  <line class="d131f-tick d131f-t3" x1="378.5" y1="82" x2="378.5" y2="300" />
  <line class="d131f-tick d131f-t4" x1="491.3" y1="82" x2="491.3" y2="300" />
  <line class="d131f-tick d131f-t5" x1="604.1" y1="82" x2="604.1" y2="300" />
  <line class="d131f-tick d131f-t6" x1="716.9" y1="82" x2="716.9" y2="300" />
  <line class="d131f-tick d131f-t7" x1="829.7" y1="82" x2="829.7" y2="300" />

  <circle class="d131f-dot d131f-t0" cx="40.0" cy="100.0" r="6" />
  <circle class="d131f-dot d131f-t1" cx="152.8" cy="190.0" r="6" />
  <circle class="d131f-dot d131f-t2" cx="265.6" cy="280.0" r="6" />
  <circle class="d131f-dot d131f-t3" cx="378.5" cy="190.0" r="6" />
  <circle class="d131f-dot d131f-t4" cx="491.3" cy="100.0" r="6" />
  <circle class="d131f-dot d131f-t5" cx="604.1" cy="190.0" r="6" />
  <circle class="d131f-dot d131f-t6" cx="716.9" cy="280.0" r="6" />
  <circle class="d131f-dot d131f-t7" cx="829.7" cy="190.0" r="6" />

  <text class="d131f-small" x="40" y="316">sampling comb: one reading every 5 days, sweeping left to right</text>

  <!-- Fact box, clear of both curves -->
  <rect class="d131f-box" x="620" y="332" width="300" height="78" rx="6" />
  <text class="d131f-label" x="632" y="354">True period: 4 days</text>
  <text class="d131f-label" x="632" y="374">Sampling interval: 5 days</text>
  <text class="d131f-label" x="632" y="394">Observed period: 20 days</text>

  <text class="d131f-small" x="40" y="356">Nothing in the true signal repeats every 20 days.</text>
  <text class="d131f-small" x="40" y="376">Only the SAMPLES land back at the same phase every 4 of them.</text>

  <!-- ===================== Bottom panel: the manufactured slow wave ===================== -->
  <text class="d131f-panel" x="32" y="440">What the samples assemble into -- a false slow wave</text>
  <line class="d131f-axis" x1="40" y1="650" x2="920" y2="650" />

  <path class="d131f-slow" d="M 40.0,650.0 L 165.7,560.0 L 291.4,470.0 L 417.1,560.0 L 542.9,650.0 L 668.6,560.0 L 794.3,470.0 L 920.0,560.0" />

  <circle class="d131f-slowdot d131f-t0" cx="40.0" cy="650.0" r="6" />
  <circle class="d131f-slowdot d131f-t1" cx="165.7" cy="560.0" r="6" />
  <circle class="d131f-slowdot d131f-t2" cx="291.4" cy="470.0" r="6" />
  <circle class="d131f-slowdot d131f-t3" cx="417.1" cy="560.0" r="6" />
  <circle class="d131f-slowdot d131f-t4" cx="542.9" cy="650.0" r="6" />
  <circle class="d131f-slowdot d131f-t5" cx="668.6" cy="560.0" r="6" />
  <circle class="d131f-slowdot d131f-t6" cx="794.3" cy="470.0" r="6" />
  <circle class="d131f-slowdot d131f-t7" cx="920.0" cy="560.0" r="6" />

  <text class="d131f-small" x="40" y="676">This curve is exactly what a weekly-style reading of the faster true cycle above would show on a dashboard.</text>
</svg>
