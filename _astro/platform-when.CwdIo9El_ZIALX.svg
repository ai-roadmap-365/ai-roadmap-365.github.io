<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what to keep at any size.">
  <title>When the whole stack is warranted</title>
  <style>
    .platform-when-bg   { fill: #f8fafc; }
    .platform-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .platform-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .platform-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .platform-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .platform-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .platform-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .platform-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .platform-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .platform-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .platform-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .platform-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .platform-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .platform-when-row { opacity: 1; }
    .platform-when-r0 { animation-delay: 0.00s; }
    .platform-when-r1 { animation-delay: 0.45s; }
    .platform-when-r2 { animation-delay: 0.90s; }
    .platform-when-r3 { animation-delay: 1.35s; }
    .platform-when-r4 { animation-delay: 1.80s; }
    .platform-when-row { animation: platform-when-reveal 7.3s ease-in-out infinite; }
    @keyframes platform-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="platform-when-bg" width="980" height="390"/>
  <text class="platform-when-h1"  x="30" y="40">When the whole stack is warranted</text>
  <text class="platform-when-sub" x="30" y="64">And what to keep at any size.</text>
  <rect class="platform-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="platform-when-name" x="46" y="122">The full stack</text>
  <text class="platform-when-desc" x="46" y="142">Enterprise and revenue-critical.</text>
  <text class="platform-when-desc platform-when-row platform-when-r0" x="46" y="182">Customer-facing AI products</text>
  <text class="platform-when-desc platform-when-row platform-when-r1" x="46" y="216">Revenue-critical APIs</text>
  <text class="platform-when-desc platform-when-row platform-when-r2" x="46" y="250">Multi-tenant agent platforms</text>
  <text class="platform-when-desc platform-when-row platform-when-r3" x="46" y="284">High-concurrency LLM deployments</text>
  <text class="platform-when-desc platform-when-row platform-when-r4" x="46" y="318">Anything with a contractual SLO</text>
  <rect class="platform-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="platform-when-name" x="526" y="122">Regardless of size</text>
  <text class="platform-when-desc" x="526" y="142">Four cheap things.</text>
  <text class="platform-when-desc platform-when-row platform-when-r0" x="526" y="182">A trace ID at ingress</text>
  <text class="platform-when-desc platform-when-row platform-when-r1" x="526" y="216">PII scrubbing before any write</text>
  <text class="platform-when-desc platform-when-row platform-when-r2" x="526" y="250">A tested rollback</text>
  <text class="platform-when-desc platform-when-row platform-when-r3" x="526" y="284">A budget alert</text>
  <text class="platform-when-desc platform-when-row platform-when-r4" x="526" y="318">No ClickHouse for a prototype</text>
  <text class="platform-when-sub" x="30" y="372">The right-hand column costs almost nothing and covers the failures that are unrecoverable rather than merely expensive, which is the right thing to keep when everything else is scaled down.</text>
</svg>
