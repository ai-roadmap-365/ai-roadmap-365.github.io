<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Almost never in the model.">
  <title>AI failures are foundations failures</title>
  <style>
    .where-ai-fails-bg   { fill: #f8fafc; }
    .where-ai-fails-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .where-ai-fails-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .where-ai-fails-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .where-ai-fails-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .where-ai-fails-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .where-ai-fails-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .where-ai-fails-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .where-ai-fails-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .where-ai-fails-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .where-ai-fails-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .where-ai-fails-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .where-ai-fails-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .where-ai-fails-row { opacity: 1; }
    .where-ai-fails-r0 { animation-delay: 0.00s; }
    .where-ai-fails-r1 { animation-delay: 0.45s; }
    .where-ai-fails-r2 { animation-delay: 0.90s; }
    .where-ai-fails-r3 { animation-delay: 1.35s; }
    .where-ai-fails-r4 { animation-delay: 1.80s; }
    .where-ai-fails-row { animation: where-ai-fails-reveal 7.3s ease-in-out infinite; }
    @keyframes where-ai-fails-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="where-ai-fails-bg" width="980" height="390"/>
  <text class="where-ai-fails-h1"  x="30" y="40">AI failures are foundations failures</text>
  <text class="where-ai-fails-sub" x="30" y="64">Almost never in the model.</text>
  <rect class="where-ai-fails-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="where-ai-fails-name" x="46" y="122">Where people look</text>
  <text class="where-ai-fails-desc" x="46" y="142">The interesting part.</text>
  <text class="where-ai-fails-desc where-ai-fails-row where-ai-fails-r0" x="46" y="182">The architecture</text>
  <text class="where-ai-fails-desc where-ai-fails-row where-ai-fails-r1" x="46" y="216">The hyperparameters</text>
  <text class="where-ai-fails-desc where-ai-fails-row where-ai-fails-r2" x="46" y="250">The loss function</text>
  <text class="where-ai-fails-desc where-ai-fails-row where-ai-fails-r3" x="46" y="284">The prompt</text>
  <text class="where-ai-fails-desc where-ai-fails-row where-ai-fails-r4" x="46" y="318">All of which are usually fine</text>
  <rect class="where-ai-fails-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="where-ai-fails-name" x="526" y="122">Where the cause is</text>
  <text class="where-ai-fails-desc" x="526" y="142">The part this course covered.</text>
  <text class="where-ai-fails-desc where-ai-fails-row where-ai-fails-r0" x="526" y="182">A memory limit — Day 7</text>
  <text class="where-ai-fails-desc where-ai-fails-row where-ai-fails-r1" x="526" y="216">A dependency version — Day 13</text>
  <text class="where-ai-fails-desc where-ai-fails-row where-ai-fails-r2" x="526" y="250">A preprocessing mismatch — Day 5</text>
  <text class="where-ai-fails-desc where-ai-fails-row where-ai-fails-r3" x="526" y="284">A path, a permission, a credential — Days 9, 25</text>
  <text class="where-ai-fails-desc where-ai-fails-row where-ai-fails-r4" x="526" y="318">An uncommitted config — Day 29</text>
  <text class="where-ai-fails-sub" x="30" y="372">This is why the foundation comes first. The modelling is genuinely the interesting part, and it is almost never the part that is broken when nothing works.</text>
</svg>
