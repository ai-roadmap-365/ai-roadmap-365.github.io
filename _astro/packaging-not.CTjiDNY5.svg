<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things packaging is not</title>
  <style>
    .packaging-not-bg   { fill: #f8fafc; }
    .packaging-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packaging-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packaging-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packaging-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packaging-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packaging-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .packaging-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .packaging-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .packaging-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .packaging-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .packaging-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .packaging-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .packaging-not-row { opacity: 1; }
    .packaging-not-r0 { animation-delay: 0.00s; }
    .packaging-not-r1 { animation-delay: 0.45s; }
    .packaging-not-r2 { animation-delay: 0.90s; }
    .packaging-not-r3 { animation-delay: 1.35s; }
    .packaging-not-r4 { animation-delay: 1.80s; }
    .packaging-not-row { animation: packaging-not-reveal 7.3s ease-in-out infinite; }
    @keyframes packaging-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="packaging-not-bg" width="980" height="390"/>
  <text class="packaging-not-h1"  x="30" y="40">Four things packaging is not</text>
  <text class="packaging-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="packaging-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="packaging-not-name" x="46" y="122">The misconception</text>
  <text class="packaging-not-desc" x="46" y="142">Commonly held.</text>
  <text class="packaging-not-desc packaging-not-row packaging-not-r0" x="46" y="182">It works locally, so the package works</text>
  <text class="packaging-not-desc packaging-not-row packaging-not-r1" x="46" y="216">Pinning exact versions is safest</text>
  <text class="packaging-not-desc packaging-not-row packaging-not-r2" x="46" y="250">A published version can be replaced</text>
  <text class="packaging-not-desc packaging-not-row packaging-not-r3" x="46" y="284">Packaging is only for public libraries</text>
  <text class="packaging-not-desc packaging-not-row packaging-not-r4" x="46" y="318">The package name is just a label</text>
  <rect class="packaging-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="packaging-not-name" x="526" y="122">What is true</text>
  <text class="packaging-not-desc" x="526" y="142">Actually.</text>
  <text class="packaging-not-desc packaging-not-row packaging-not-r0" x="526" y="182">Local paths hide missing files</text>
  <text class="packaging-not-desc packaging-not-row packaging-not-r1" x="526" y="216">For a library, pins cause conflicts</text>
  <text class="packaging-not-desc packaging-not-row packaging-not-r2" x="526" y="250">It cannot; publish a new one</text>
  <text class="packaging-not-desc packaging-not-row packaging-not-r3" x="526" y="284">Internal reuse benefits equally</text>
  <text class="packaging-not-desc packaging-not-row packaging-not-r4" x="526" y="318">It is a namespace others may typosquat</text>
  <text class="packaging-not-sub" x="30" y="372">The pinning row differs by audience: an application should pin, and a library that pins forces its constraints onto every project that installs it.</text>
</svg>
