<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The baselines to beat</title>
  <style>
    .arima-bg   { fill: #f8fafc; }
    .arima-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .arima-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .arima-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .arima-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .arima-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .arima-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .arima-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .arima-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .arima-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .arima-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .arima-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .arima-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .arima-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .arima-stage { opacity: 1; }

    .arima-s0 { animation-delay: 0.00s; }
    .arima-e0 { animation-delay: 0.00s; }
    .arima-s1 { animation-delay: 1.28s; }
    .arima-e1 { animation-delay: 1.28s; }
    .arima-s2 { animation-delay: 2.56s; }
    .arima-e2 { animation-delay: 2.56s; }
    .arima-s3 { animation-delay: 3.84s; }
    .arima-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .arima-conn  { animation: arima-trace 6.4s ease-in-out infinite; }
      .arima-stage { animation: arima-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes arima-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes arima-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .arima-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .arima-stage { animation: arima-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes arima-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="arima-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="arima-bg" width="980" height="322"/>
  <text class="arima-h1"  x="30" y="40">The baselines to beat</text>
  <text class="arima-sub" x="30" y="64">Four steps.</text>
  <g class="arima-stage arima-s0">
    <rect class="arima-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="arima-step" x="44" y="142">01</text>
    <text class="arima-name" x="70" y="142">Naive: tomorrow equals today</text>
    <text class="arima-desc" x="44" y="166">Which is startlingly hard to</text>
    <text class="arima-desc" x="44" y="182">beat on some series.</text>
  </g>
  <line class="arima-line arima-conn arima-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#arima-tip)"/>
  <g class="arima-stage arima-s1">
    <rect class="arima-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="arima-step" x="280" y="142">02</text>
    <text class="arima-name" x="306" y="142">Seasonal naive: this hour equals the same hour last week</text>
    <text class="arima-desc" x="280" y="166">The right floor for seasonal</text>
    <text class="arima-desc" x="280" y="182">data.</text>
  </g>
  <line class="arima-line arima-conn arima-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#arima-tip)"/>
  <g class="arima-stage arima-s2">
    <rect class="arima-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="arima-step" x="516" y="142">03</text>
    <text class="arima-name" x="542" y="142">Exponential smoothing: a weighted average of the past</text>
    <text class="arima-desc" x="516" y="166">With trend and seasonal terms.</text>
  </g>
  <line class="arima-line arima-conn arima-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#arima-tip)"/>
  <g class="arima-stage arima-s3">
    <rect class="arima-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="arima-step" x="752" y="142">04</text>
    <text class="arima-name" x="778" y="142">And the autoregressive family, on a differenced series</text>
    <text class="arima-desc" x="752" y="166">Which combines lags and error</text>
    <text class="arima-desc" x="752" y="182">terms.</text>
  </g>
  <text class="arima-sub" x="30" y="304">The seasonal naive baseline is the one that embarrasses complex models most often, and it takes one line to compute.</text>
</svg>
