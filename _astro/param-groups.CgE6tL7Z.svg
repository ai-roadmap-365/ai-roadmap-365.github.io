<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three groups, three treatments.">
  <title>Not every parameter wants decay</title>
  <style>
    .param-groups-bg   { fill: #f8fafc; }
    .param-groups-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .param-groups-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .param-groups-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .param-groups-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .param-groups-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .param-groups-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .param-groups-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .param-groups-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .param-groups-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .param-groups-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .param-groups-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .param-groups-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .param-groups-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .param-groups-stage { opacity: 1; }

    .param-groups-s0 { animation-delay: 0.00s; }
    .param-groups-e0 { animation-delay: 0.00s; }
    .param-groups-s1 { animation-delay: 1.50s; }
    .param-groups-e1 { animation-delay: 1.50s; }
    .param-groups-s2 { animation-delay: 3.00s; }
    .param-groups-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .param-groups-conn  { animation: param-groups-trace 6s ease-in-out infinite; }
      .param-groups-stage { animation: param-groups-arrive 6s ease-in-out infinite; }
    }
    @keyframes param-groups-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes param-groups-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .param-groups-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .param-groups-stage { animation: param-groups-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes param-groups-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="param-groups-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="param-groups-bg" width="980" height="322"/>
  <text class="param-groups-h1"  x="30" y="40">Not every parameter wants decay</text>
  <text class="param-groups-sub" x="30" y="64">Three groups, three treatments.</text>
  <g class="param-groups-stage param-groups-s0">
    <rect class="param-groups-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="param-groups-step" x="44" y="142">01</text>
    <text class="param-groups-name" x="70" y="142">Weight matrices: decay them</text>
    <text class="param-groups-desc" x="44" y="166">Large, numerous, and where overfitting</text>
    <text class="param-groups-desc" x="44" y="182">capacity lives.</text>
  </g>
  <line class="param-groups-line param-groups-conn param-groups-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#param-groups-tip)"/>
  <g class="param-groups-stage param-groups-s1">
    <rect class="param-groups-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="param-groups-step" x="359" y="142">02</text>
    <text class="param-groups-name" x="385" y="142">Biases: do not</text>
    <text class="param-groups-desc" x="359" y="166">One per unit. Decaying them shifts the</text>
    <text class="param-groups-desc" x="359" y="182">function for no regularisation benefit.</text>
  </g>
  <line class="param-groups-line param-groups-conn param-groups-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#param-groups-tip)"/>
  <g class="param-groups-stage param-groups-s2">
    <rect class="param-groups-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="param-groups-step" x="674" y="142">03</text>
    <text class="param-groups-name" x="700" y="142">Normalisation scales: do not</text>
    <text class="param-groups-desc" x="674" y="166">Decaying a learned scale toward zero fights</text>
    <text class="param-groups-desc" x="674" y="182">the layer's purpose.</text>
  </g>
  <text class="param-groups-sub" x="30" y="304">Passing every parameter through one global decay setting is the default in most tutorial code and measurably degrades transformer training, which is why production configurations separate the groups.</text>
</svg>
