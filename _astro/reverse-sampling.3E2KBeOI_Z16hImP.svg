<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps, repeated.">
  <title>The sampling loop</title>
  <style>
    .reverse-sampling-bg   { fill: #f8fafc; }
    .reverse-sampling-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reverse-sampling-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reverse-sampling-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reverse-sampling-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reverse-sampling-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reverse-sampling-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .reverse-sampling-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .reverse-sampling-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .reverse-sampling-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .reverse-sampling-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .reverse-sampling-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .reverse-sampling-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .reverse-sampling-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .reverse-sampling-stage { opacity: 1; }

    .reverse-sampling-s0 { animation-delay: 0.00s; }
    .reverse-sampling-e0 { animation-delay: 0.00s; }
    .reverse-sampling-s1 { animation-delay: 1.28s; }
    .reverse-sampling-e1 { animation-delay: 1.28s; }
    .reverse-sampling-s2 { animation-delay: 2.56s; }
    .reverse-sampling-e2 { animation-delay: 2.56s; }
    .reverse-sampling-s3 { animation-delay: 3.84s; }
    .reverse-sampling-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .reverse-sampling-conn  { animation: reverse-sampling-trace 6.4s ease-in-out infinite; }
      .reverse-sampling-stage { animation: reverse-sampling-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes reverse-sampling-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes reverse-sampling-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .reverse-sampling-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .reverse-sampling-stage { animation: reverse-sampling-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes reverse-sampling-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="reverse-sampling-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="reverse-sampling-bg" width="980" height="322"/>
  <text class="reverse-sampling-h1"  x="30" y="40">The sampling loop</text>
  <text class="reverse-sampling-sub" x="30" y="64">Four steps, repeated.</text>
  <g class="reverse-sampling-stage reverse-sampling-s0">
    <rect class="reverse-sampling-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="reverse-sampling-step" x="44" y="142">01</text>
    <text class="reverse-sampling-name" x="70" y="142">Predict the noise in the current image</text>
    <text class="reverse-sampling-desc" x="44" y="166">Given the step number and the</text>
    <text class="reverse-sampling-desc" x="44" y="182">condition.</text>
  </g>
  <line class="reverse-sampling-line reverse-sampling-conn reverse-sampling-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#reverse-sampling-tip)"/>
  <g class="reverse-sampling-stage reverse-sampling-s1">
    <rect class="reverse-sampling-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="reverse-sampling-step" x="280" y="142">02</text>
    <text class="reverse-sampling-name" x="306" y="142">Subtract it to estimate the clean image</text>
    <text class="reverse-sampling-desc" x="280" y="166">Which at early steps is very</text>
    <text class="reverse-sampling-desc" x="280" y="182">rough.</text>
  </g>
  <line class="reverse-sampling-line reverse-sampling-conn reverse-sampling-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#reverse-sampling-tip)"/>
  <g class="reverse-sampling-stage reverse-sampling-s2">
    <rect class="reverse-sampling-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="reverse-sampling-step" x="516" y="142">03</text>
    <text class="reverse-sampling-name" x="542" y="142">Step partway back toward it</text>
    <text class="reverse-sampling-desc" x="516" y="166">Not all the way. The schedule</text>
    <text class="reverse-sampling-desc" x="516" y="182">sets how far.</text>
  </g>
  <line class="reverse-sampling-line reverse-sampling-conn reverse-sampling-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#reverse-sampling-tip)"/>
  <g class="reverse-sampling-stage reverse-sampling-s3">
    <rect class="reverse-sampling-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="reverse-sampling-step" x="752" y="142">04</text>
    <text class="reverse-sampling-name" x="778" y="142">And add a little fresh noise</text>
    <text class="reverse-sampling-desc" x="752" y="166">Which keeps the samples diverse.</text>
  </g>
  <text class="reverse-sampling-sub" x="30" y="304">Adding noise back deliberately is the counter-intuitive step: removing it all at once collapses the diversity that made the method worth using.</text>
</svg>
