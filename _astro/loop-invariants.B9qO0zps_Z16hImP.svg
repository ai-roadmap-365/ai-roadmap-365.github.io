<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="An unbounded loop is a bill.">
  <title>Three non-negotiable invariants</title>
  <style>
    .loop-invariants-bg   { fill: #f8fafc; }
    .loop-invariants-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-invariants-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-invariants-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-invariants-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-invariants-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-invariants-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .loop-invariants-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .loop-invariants-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .loop-invariants-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .loop-invariants-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .loop-invariants-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .loop-invariants-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .loop-invariants-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .loop-invariants-stage { opacity: 1; }

    .loop-invariants-s0 { animation-delay: 0.00s; }
    .loop-invariants-e0 { animation-delay: 0.00s; }
    .loop-invariants-s1 { animation-delay: 1.50s; }
    .loop-invariants-e1 { animation-delay: 1.50s; }
    .loop-invariants-s2 { animation-delay: 3.00s; }
    .loop-invariants-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .loop-invariants-conn  { animation: loop-invariants-trace 6s ease-in-out infinite; }
      .loop-invariants-stage { animation: loop-invariants-arrive 6s ease-in-out infinite; }
    }
    @keyframes loop-invariants-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes loop-invariants-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .loop-invariants-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .loop-invariants-stage { animation: loop-invariants-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes loop-invariants-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="loop-invariants-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="loop-invariants-bg" width="980" height="322"/>
  <text class="loop-invariants-h1"  x="30" y="40">Three non-negotiable invariants</text>
  <text class="loop-invariants-sub" x="30" y="64">An unbounded loop is a bill.</text>
  <g class="loop-invariants-stage loop-invariants-s0">
    <rect class="loop-invariants-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="loop-invariants-step" x="44" y="142">01</text>
    <text class="loop-invariants-name" x="70" y="142">A hard step bound</text>
    <text class="loop-invariants-desc" x="44" y="166">Fifteen or fewer iterations. Not a guideline</text>
    <text class="loop-invariants-desc" x="44" y="182">— a counter.</text>
    <text class="loop-invariants-edge" x="44" y="242">K &lt;= 15</text>
  </g>
  <line class="loop-invariants-line loop-invariants-conn loop-invariants-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#loop-invariants-tip)"/>
  <g class="loop-invariants-stage loop-invariants-s1">
    <rect class="loop-invariants-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="loop-invariants-step" x="359" y="142">02</text>
    <text class="loop-invariants-name" x="385" y="142">A cumulative token cap</text>
    <text class="loop-invariants-desc" x="359" y="166">Input plus output, across the whole</text>
    <text class="loop-invariants-desc" x="359" y="182">trajectory.</text>
    <text class="loop-invariants-edge" x="359" y="242">budget</text>
  </g>
  <line class="loop-invariants-line loop-invariants-conn loop-invariants-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#loop-invariants-tip)"/>
  <g class="loop-invariants-stage loop-invariants-s2">
    <rect class="loop-invariants-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="loop-invariants-step" x="674" y="142">03</text>
    <text class="loop-invariants-name" x="700" y="142">Cycle detection</text>
    <text class="loop-invariants-desc" x="674" y="166">The same call with the same arguments twice:</text>
    <text class="loop-invariants-desc" x="674" y="182">intercept and inject a reflection.</text>
  </g>
  <text class="loop-invariants-sub" x="30" y="304">The third invariant catches the failure the first two only bound: an agent stuck in a two-step cycle will consume its entire budget productively-looking, and only argument-identity comparison notices.</text>
</svg>
