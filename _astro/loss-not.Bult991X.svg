<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things the loss is not</title>
  <style>
    .loss-not-bg   { fill: #f8fafc; }
    .loss-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .loss-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .loss-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .loss-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .loss-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .loss-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .loss-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .loss-not-row { opacity: 1; }
    .loss-not-r0 { animation-delay: 0.00s; }
    .loss-not-r1 { animation-delay: 0.45s; }
    .loss-not-r2 { animation-delay: 0.90s; }
    .loss-not-r3 { animation-delay: 1.35s; }
    .loss-not-r4 { animation-delay: 1.80s; }
    .loss-not-row { animation: loss-not-reveal 7.3s ease-in-out infinite; }
    @keyframes loss-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="loss-not-bg" width="980" height="390"/>
  <text class="loss-not-h1"  x="30" y="40">Four things the loss is not</text>
  <text class="loss-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="loss-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="loss-not-name" x="46" y="122">The misconception</text>
  <text class="loss-not-desc" x="46" y="142">Commonly held.</text>
  <text class="loss-not-desc loss-not-row loss-not-r0" x="46" y="182">Squared error is the default because it is best</text>
  <text class="loss-not-desc loss-not-row loss-not-r1" x="46" y="216">The loss and the evaluation metric should match</text>
  <text class="loss-not-desc loss-not-row loss-not-r2" x="46" y="250">Robust losses are always safer</text>
  <text class="loss-not-desc loss-not-row loss-not-r3" x="46" y="284">The loss is a technical detail</text>
  <text class="loss-not-desc loss-not-row loss-not-r4" x="46" y="318">Least squares is optimal, full stop</text>
  <rect class="loss-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="loss-not-name" x="526" y="122">What is true</text>
  <text class="loss-not-desc" x="526" y="142">Actually.</text>
  <text class="loss-not-desc loss-not-row loss-not-r0" x="526" y="182">It is the default because it solves analytically</text>
  <text class="loss-not-desc loss-not-row loss-not-r1" x="526" y="216">They serve different purposes and often differ</text>
  <text class="loss-not-desc loss-not-row loss-not-r2" x="526" y="250">They lose efficiency on well-behaved data</text>
  <text class="loss-not-desc loss-not-row loss-not-r3" x="526" y="284">It encodes what errors you care about</text>
  <text class="loss-not-desc loss-not-row loss-not-r4" x="526" y="318">Only under three stated conditions</text>
  <text class="loss-not-sub" x="30" y="372">The third row is the honest counterweight: robustness is not free, and on clean Gaussian data the robust loss is measurably less efficient.</text>
</svg>
