<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four components, one of them a queue.">
  <title>Running this at scale</title>
  <style>
    .ci-agent-scale-bg   { fill: #f8fafc; }
    .ci-agent-scale-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-agent-scale-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-agent-scale-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-agent-scale-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-agent-scale-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-agent-scale-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ci-agent-scale-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ci-agent-scale-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ci-agent-scale-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ci-agent-scale-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ci-agent-scale-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ci-agent-scale-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ci-agent-scale-row { opacity: 1; }
    .ci-agent-scale-r0 { animation-delay: 0.00s; }
    .ci-agent-scale-r1 { animation-delay: 0.45s; }
    .ci-agent-scale-r2 { animation-delay: 0.90s; }
    .ci-agent-scale-r3 { animation-delay: 1.35s; }
    .ci-agent-scale-r4 { animation-delay: 1.80s; }
    .ci-agent-scale-row { animation: ci-agent-scale-reveal 7.3s ease-in-out infinite; }
    @keyframes ci-agent-scale-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="ci-agent-scale-bg" width="980" height="390"/>
  <text class="ci-agent-scale-h1"  x="30" y="40">Running this at scale</text>
  <text class="ci-agent-scale-sub" x="30" y="64">Four components, one of them a queue.</text>
  <rect class="ci-agent-scale-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="ci-agent-scale-name" x="46" y="122">One runner</text>
  <text class="ci-agent-scale-desc" x="46" y="142">Fine to start.</text>
  <text class="ci-agent-scale-desc ci-agent-scale-row ci-agent-scale-r0" x="46" y="182">A workflow triggered per event</text>
  <text class="ci-agent-scale-desc ci-agent-scale-row ci-agent-scale-r1" x="46" y="216">Runs inline in CI</text>
  <text class="ci-agent-scale-desc ci-agent-scale-row ci-agent-scale-r2" x="46" y="250">No queue, no priority</text>
  <text class="ci-agent-scale-desc ci-agent-scale-row ci-agent-scale-r3" x="46" y="284">Fifty simultaneous labels exceed rate limits</text>
  <text class="ci-agent-scale-desc ci-agent-scale-row ci-agent-scale-r4" x="46" y="318">Adequate below a few events a day</text>
  <rect class="ci-agent-scale-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="ci-agent-scale-name" x="526" y="122">Distributed</text>
  <text class="ci-agent-scale-desc" x="526" y="142">Queued and observable.</text>
  <text class="ci-agent-scale-desc ci-agent-scale-row ci-agent-scale-r0" x="526" y="182">A webhook gateway receiving events</text>
  <text class="ci-agent-scale-desc ci-agent-scale-row ci-agent-scale-r1" x="526" y="216">A queue with priority weighting</text>
  <text class="ci-agent-scale-desc ci-agent-scale-row ci-agent-scale-r2" x="526" y="250">Ephemeral workers on a cluster</text>
  <text class="ci-agent-scale-desc ci-agent-scale-row ci-agent-scale-r3" x="526" y="284">Throttled to a few concurrent runs</text>
  <text class="ci-agent-scale-desc ci-agent-scale-row ci-agent-scale-r4" x="526" y="318">Telemetry: resolution rate, cost, acceptance</text>
  <text class="ci-agent-scale-sub" x="30" y="372">Tracking human acceptance ratio is the metric that matters most in that telemetry store: it is the only number that says whether the pipeline is producing work people actually merge.</text>
</svg>
