<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="d095a-title d095a-desc" width="1180" height="820">
  <title id="d095a-title">One instant in five representations, and what each one can answer</title>
  <desc id="d095a-desc">A single instant, epoch second 1792891800, drawn in five representations — epoch seconds, UTC ISO 8601 text, an aware datetime in Europe/London, an aware datetime in America/New_York, and a naive datetime whose offset is a question mark — with a table of what each can and cannot answer, and a warning that the London rendering collides with a second, different instant.</desc>

  <style>
    .d095a-bg { fill: #f8fafc; }
    .d095a-t { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a202c; }
    .d095a-h1 { font-size: 25px; font-weight: 700; }
    .d095a-h2 { font-size: 18px; font-weight: 700; }
    .d095a-lbl { font-size: 15px; font-weight: 700; }
    .d095a-b { font-size: 15px; }
    .d095a-s { font-size: 14px; }
    .d095a-mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 16px; fill: #1a202c; }
    .d095a-mono-s { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 14px; fill: #1a202c; }
    .d095a-card { fill: #ffffff; stroke: #1d4ed8; stroke-width: 2; }
    .d095a-card-bad { fill: #fff7ed; stroke: #b45309; stroke-width: 2; }
    .d095a-core { fill: #1d4ed8; }
    .d095a-core-t { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
    .d095a-wire { stroke: #1d4ed8; stroke-width: 2; fill: none; }
    .d095a-wire-bad { stroke: #b45309; stroke-width: 2; stroke-dasharray: 7 5; fill: none; }
    .d095a-yes { fill: #047857; font-weight: 700; }
    .d095a-no { fill: #b45309; font-weight: 700; }
    .d095a-note { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; }
    .d095a-warn { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2; }
    .d095a-rule { stroke: #cbd5e1; stroke-width: 1; }
  </style>

  <rect class="d095a-bg" x="0" y="0" width="1180" height="820" />

  <text class="d095a-t d095a-h1" x="30" y="42">One instant. Five ways to write it down. Only four of them are true.</text>
  <text class="d095a-t d095a-b" x="30" y="68">The instant: the moment the clocks in London had already gone back on 25 October 2026. Every card below names the same moment — except the last, which names nothing.</text>

  <!-- the instant at the centre -->
  <rect class="d095a-core" x="410" y="96" width="360" height="72" rx="10" />
  <text class="d095a-core-t d095a-h2" x="590" y="124" text-anchor="middle">THE INSTANT</text>
  <text class="d095a-core-t" x="590" y="150" text-anchor="middle" font-size="15">one moment in the history of the universe</text>

  <!-- wires from the core down to the five cards -->
  <path class="d095a-wire" d="M 590 168 L 590 196" />
  <path class="d095a-wire" d="M 140 196 L 1040 196" />
  <path class="d095a-wire" d="M 140 196 L 140 226" />
  <path class="d095a-wire" d="M 365 196 L 365 226" />
  <path class="d095a-wire" d="M 590 196 L 590 226" />
  <path class="d095a-wire" d="M 815 196 L 815 226" />
  <path class="d095a-wire-bad" d="M 1040 196 L 1040 226" />

  <!-- CARD 1 — epoch -->
  <rect class="d095a-card" x="30" y="226" width="220" height="176" rx="8" />
  <text class="d095a-t d095a-lbl" x="140" y="252" text-anchor="middle">epoch seconds</text>
  <line class="d095a-rule" x1="46" y1="262" x2="234" y2="262" />
  <text class="d095a-mono" x="140" y="292" text-anchor="middle">1792891800</text>
  <text class="d095a-t d095a-s" x="140" y="318" text-anchor="middle">seconds since</text>
  <text class="d095a-t d095a-s" x="140" y="336" text-anchor="middle">1970-01-01T00:00:00Z</text>
  <text class="d095a-t d095a-s" x="140" y="362" text-anchor="middle">no zone, no offset,</text>
  <text class="d095a-t d095a-s" x="140" y="380" text-anchor="middle">no wall clock anywhere</text>

  <!-- CARD 2 — UTC ISO -->
  <rect class="d095a-card" x="262" y="226" width="220" height="176" rx="8" />
  <text class="d095a-t d095a-lbl" x="372" y="252" text-anchor="middle">UTC ISO 8601 text</text>
  <line class="d095a-rule" x1="278" y1="262" x2="466" y2="262" />
  <text class="d095a-mono-s" x="372" y="292" text-anchor="middle">2026-10-25T01:30:00Z</text>
  <text class="d095a-t d095a-s" x="372" y="318" text-anchor="middle">fixed width,</text>
  <text class="d095a-t d095a-s" x="372" y="336" text-anchor="middle">most significant first</text>
  <text class="d095a-t d095a-s" x="372" y="362" text-anchor="middle">so text order equals</text>
  <text class="d095a-t d095a-s" x="372" y="380" text-anchor="middle">chronological order</text>

  <!-- CARD 3 — aware London -->
  <rect class="d095a-card" x="494" y="226" width="220" height="176" rx="8" />
  <text class="d095a-t d095a-lbl" x="604" y="252" text-anchor="middle">aware — Europe/London</text>
  <line class="d095a-rule" x1="510" y1="262" x2="698" y2="262" />
  <text class="d095a-mono-s" x="604" y="292" text-anchor="middle">2026-10-25T01:30:00</text>
  <text class="d095a-mono-s" x="604" y="312" text-anchor="middle">+00:00  (GMT, fold=1)</text>
  <text class="d095a-t d095a-s" x="604" y="340" text-anchor="middle">a wall clock plus the</text>
  <text class="d095a-t d095a-s" x="604" y="358" text-anchor="middle">offset that was in force,</text>
  <text class="d095a-t d095a-s" x="604" y="380" text-anchor="middle">so the instant survives</text>

  <!-- CARD 4 — aware New York -->
  <rect class="d095a-card" x="726" y="226" width="220" height="176" rx="8" />
  <text class="d095a-t d095a-lbl" x="836" y="252" text-anchor="middle">aware — America/New_York</text>
  <line class="d095a-rule" x1="742" y1="262" x2="930" y2="262" />
  <text class="d095a-mono-s" x="836" y="292" text-anchor="middle">2026-10-24T21:30:00</text>
  <text class="d095a-mono-s" x="836" y="312" text-anchor="middle">-04:00  (EDT)</text>
  <text class="d095a-t d095a-s" x="836" y="340" text-anchor="middle">a different date and a</text>
  <text class="d095a-t d095a-s" x="836" y="358" text-anchor="middle">different day of the week</text>
  <text class="d095a-t d095a-s" x="836" y="380" text-anchor="middle">for the same instant</text>

  <!-- CARD 5 — naive -->
  <rect class="d095a-card-bad" x="958" y="226" width="192" height="176" rx="8" />
  <text class="d095a-t d095a-lbl" x="1054" y="252" text-anchor="middle">naive datetime</text>
  <line class="d095a-rule" x1="974" y1="262" x2="1134" y2="262" />
  <text class="d095a-mono-s" x="1054" y="292" text-anchor="middle">2026-10-25 01:30:00</text>
  <text class="d095a-mono" x="1054" y="318" text-anchor="middle" fill="#b45309">offset:  ?</text>
  <text class="d095a-t d095a-s" x="1054" y="346" text-anchor="middle">a wall clock and</text>
  <text class="d095a-t d095a-s" x="1054" y="364" text-anchor="middle">nothing else. It names</text>
  <text class="d095a-t d095a-s" x="1054" y="382" text-anchor="middle">no instant at all.</text>

  <!-- the answer table -->
  <text class="d095a-t d095a-h2" x="30" y="446">What each one can answer</text>
  <line class="d095a-rule" x1="30" y1="458" x2="1150" y2="458" />

  <text class="d095a-t d095a-lbl" x="36" y="484">question</text>
  <text class="d095a-t d095a-lbl" x="470" y="484" text-anchor="middle">epoch</text>
  <text class="d095a-t d095a-lbl" x="610" y="484" text-anchor="middle">UTC text</text>
  <text class="d095a-t d095a-lbl" x="760" y="484" text-anchor="middle">aware</text>
  <text class="d095a-t d095a-lbl" x="920" y="484" text-anchor="middle">naive</text>
  <line class="d095a-rule" x1="30" y1="494" x2="1150" y2="494" />

  <text class="d095a-t d095a-b" x="36" y="520">Which of these two rows happened first?</text>
  <text class="d095a-t d095a-b d095a-yes" x="470" y="520" text-anchor="middle">yes</text>
  <text class="d095a-t d095a-b d095a-yes" x="610" y="520" text-anchor="middle">yes</text>
  <text class="d095a-t d095a-b d095a-yes" x="760" y="520" text-anchor="middle">yes</text>
  <text class="d095a-t d095a-b d095a-no" x="920" y="520" text-anchor="middle">no</text>
  <text class="d095a-t d095a-s" x="962" y="520">two naive readings from two offices cannot be ordered</text>

  <text class="d095a-t d095a-b" x="36" y="548">Sort correctly as plain text, with no parsing?</text>
  <text class="d095a-t d095a-b d095a-no" x="470" y="548" text-anchor="middle">no</text>
  <text class="d095a-t d095a-b d095a-yes" x="610" y="548" text-anchor="middle">yes</text>
  <text class="d095a-t d095a-b d095a-no" x="760" y="548" text-anchor="middle">no</text>
  <text class="d095a-t d095a-b d095a-no" x="920" y="548" text-anchor="middle">no</text>
  <text class="d095a-t d095a-s" x="962" y="548">an epoch of different digit lengths sorts wrongly too</text>

  <text class="d095a-t d095a-b" x="36" y="576">Readable by a person scanning a log?</text>
  <text class="d095a-t d095a-b d095a-no" x="470" y="576" text-anchor="middle">no</text>
  <text class="d095a-t d095a-b d095a-yes" x="610" y="576" text-anchor="middle">yes</text>
  <text class="d095a-t d095a-b d095a-yes" x="760" y="576" text-anchor="middle">yes</text>
  <text class="d095a-t d095a-b d095a-yes" x="920" y="576" text-anchor="middle">yes</text>
  <text class="d095a-t d095a-s" x="962" y="576">and the naive one is readable and wrong, which is worse</text>

  <text class="d095a-t d095a-b" x="36" y="604">What time did the user's clock show?</text>
  <text class="d095a-t d095a-b d095a-no" x="470" y="604" text-anchor="middle">no</text>
  <text class="d095a-t d095a-b d095a-no" x="610" y="604" text-anchor="middle">no</text>
  <text class="d095a-t d095a-b d095a-yes" x="760" y="604" text-anchor="middle">yes</text>
  <text class="d095a-t d095a-b" x="920" y="604" text-anchor="middle">partly</text>
  <text class="d095a-t d095a-s" x="962" y="604">store the zone name if you need this later</text>

  <text class="d095a-t d095a-b" x="36" y="632">Survive a government moving the clocks?</text>
  <text class="d095a-t d095a-b d095a-yes" x="470" y="632" text-anchor="middle">yes</text>
  <text class="d095a-t d095a-b d095a-yes" x="610" y="632" text-anchor="middle">yes</text>
  <text class="d095a-t d095a-b d095a-yes" x="760" y="632" text-anchor="middle">yes</text>
  <text class="d095a-t d095a-b d095a-no" x="920" y="632" text-anchor="middle">no</text>
  <text class="d095a-t d095a-s" x="962" y="632">its meaning changes and nothing in it records that</text>
  <line class="d095a-rule" x1="30" y1="648" x2="1150" y2="648" />

  <!-- the collision warning -->
  <rect class="d095a-warn" x="30" y="668" width="560" height="126" rx="8" />
  <text class="d095a-t d095a-lbl" x="48" y="694" fill="#b91c1c">The collision, on this exact night</text>
  <text class="d095a-mono-s" x="48" y="720">1792888200 -&gt; London reads 2026-10-25 01:30 (+01:00)</text>
  <text class="d095a-mono-s" x="48" y="742">1792891800 -&gt; London reads 2026-10-25 01:30 (+00:00)</text>
  <text class="d095a-t d095a-s" x="48" y="768">Two instants 3600 seconds apart. One wall-clock string. Drop the offset</text>
  <text class="d095a-t d095a-s" x="48" y="786">and they are the same row — the information is gone at the moment of writing.</text>

  <!-- the rule -->
  <rect class="d095a-note" x="612" y="668" width="538" height="126" rx="8" />
  <text class="d095a-t d095a-lbl" x="630" y="694">The rule the whole day reduces to</text>
  <text class="d095a-t d095a-b" x="630" y="720">Store the instant. Store the zone name too, if and only if you will</text>
  <text class="d095a-t d095a-b" x="630" y="742">later need the wall clock somebody actually saw. Render local time</text>
  <text class="d095a-t d095a-b" x="630" y="764">at the edge, on the way out to a human being, and nowhere else.</text>
  <text class="d095a-t d095a-s" x="630" y="786">A naive datetime is not a time. It is a rumour with good formatting.</text>
</svg>
