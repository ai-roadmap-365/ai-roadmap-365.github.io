<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="For the dangerous parts only.">
  <title>A stand-in</title>
  <style>
    .stunt-double-bg   { fill: #f8fafc; }
    .stunt-double-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stunt-double-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stunt-double-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stunt-double-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stunt-double-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stunt-double-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stunt-double-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stunt-double-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stunt-double-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stunt-double-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stunt-double-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stunt-double-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stunt-double-row { opacity: 1; }
    .stunt-double-r0 { animation-delay: 0.00s; }
    .stunt-double-r1 { animation-delay: 0.45s; }
    .stunt-double-r2 { animation-delay: 0.90s; }
    .stunt-double-r3 { animation-delay: 1.35s; }
    .stunt-double-r4 { animation-delay: 1.80s; }
    .stunt-double-row { animation: stunt-double-reveal 7.3s ease-in-out infinite; }
    @keyframes stunt-double-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="stunt-double-bg" width="980" height="390"/>
  <text class="stunt-double-h1"  x="30" y="40">A stand-in</text>
  <text class="stunt-double-sub" x="30" y="64">For the dangerous parts only.</text>
  <rect class="stunt-double-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="stunt-double-name" x="46" y="122">For the hazardous part</text>
  <text class="stunt-double-desc" x="46" y="142">Sensible.</text>
  <text class="stunt-double-desc stunt-double-row stunt-double-r0" x="46" y="182">Used for the dangerous stunt only</text>
  <text class="stunt-double-desc stunt-double-row stunt-double-r1" x="46" y="216">The real performer does the rest</text>
  <text class="stunt-double-desc stunt-double-row stunt-double-r2" x="46" y="250">The audience sees the real thing</text>
  <text class="stunt-double-desc stunt-double-row stunt-double-r3" x="46" y="284">The substitution is invisible</text>
  <text class="stunt-double-desc stunt-double-row stunt-double-r4" x="46" y="318">This is mocking the boundary</text>
  <rect class="stunt-double-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="stunt-double-name" x="526" y="122">For everything</text>
  <text class="stunt-double-desc" x="526" y="142">Pointless.</text>
  <text class="stunt-double-desc stunt-double-row stunt-double-r0" x="526" y="182">A stand-in for every scene</text>
  <text class="stunt-double-desc stunt-double-row stunt-double-r1" x="526" y="216">The real performer never appears</text>
  <text class="stunt-double-desc stunt-double-row stunt-double-r2" x="526" y="250">The audience sees nobody real</text>
  <text class="stunt-double-desc stunt-double-row stunt-double-r3" x="526" y="284">Nothing is actually verified</text>
  <text class="stunt-double-desc stunt-double-row stunt-double-r4" x="526" y="318">This is over-mocking</text>
  <text class="stunt-double-sub" x="30" y="372">If the real thing never appears, the performance proves nothing about it — which is exactly the state of a test suite that mocks its own logic.</text>
</svg>
