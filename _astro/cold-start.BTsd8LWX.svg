<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four reasons.">
  <title>Why prompting comes first</title>
  <style>
    .cold-start-bg   { fill: #f8fafc; }
    .cold-start-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cold-start-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cold-start-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cold-start-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cold-start-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cold-start-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cold-start-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cold-start-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cold-start-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cold-start-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cold-start-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cold-start-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cold-start-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cold-start-stage { opacity: 1; }

    .cold-start-s0 { animation-delay: 0.00s; }
    .cold-start-e0 { animation-delay: 0.00s; }
    .cold-start-s1 { animation-delay: 1.28s; }
    .cold-start-e1 { animation-delay: 1.28s; }
    .cold-start-s2 { animation-delay: 2.56s; }
    .cold-start-e2 { animation-delay: 2.56s; }
    .cold-start-s3 { animation-delay: 3.84s; }
    .cold-start-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cold-start-conn  { animation: cold-start-trace 6.4s ease-in-out infinite; }
      .cold-start-stage { animation: cold-start-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cold-start-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cold-start-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cold-start-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cold-start-stage { animation: cold-start-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cold-start-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cold-start-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cold-start-bg" width="980" height="322"/>
  <text class="cold-start-h1"  x="30" y="40">Why prompting comes first</text>
  <text class="cold-start-sub" x="30" y="64">Four reasons.</text>
  <g class="cold-start-stage cold-start-s0">
    <rect class="cold-start-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cold-start-step" x="44" y="142">01</text>
    <text class="cold-start-name" x="70" y="142">It takes hours, not weeks</text>
    <text class="cold-start-desc" x="44" y="166">So the question is answered</text>
    <text class="cold-start-desc" x="44" y="182">quickly either way.</text>
  </g>
  <line class="cold-start-line cold-start-conn cold-start-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cold-start-tip)"/>
  <g class="cold-start-stage cold-start-s1">
    <rect class="cold-start-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cold-start-step" x="280" y="142">02</text>
    <text class="cold-start-name" x="306" y="142">It reveals what the model already can do</text>
    <text class="cold-start-desc" x="280" y="166">Which bounds what the other</text>
    <text class="cold-start-desc" x="280" y="182">approaches need to add.</text>
  </g>
  <line class="cold-start-line cold-start-conn cold-start-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cold-start-tip)"/>
  <g class="cold-start-stage cold-start-s2">
    <rect class="cold-start-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cold-start-step" x="516" y="142">03</text>
    <text class="cold-start-name" x="542" y="142">It is frequently sufficient</text>
    <text class="cold-start-desc" x="516" y="166">More often than teams expect.</text>
  </g>
  <line class="cold-start-line cold-start-conn cold-start-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cold-start-tip)"/>
  <g class="cold-start-stage cold-start-s3">
    <rect class="cold-start-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cold-start-step" x="752" y="142">04</text>
    <text class="cold-start-name" x="778" y="142">And it produces the examples the next step needs</text>
    <text class="cold-start-desc" x="752" y="166">Failures become the evaluation</text>
    <text class="cold-start-desc" x="752" y="182">set.</text>
  </g>
  <text class="cold-start-sub" x="30" y="304">The evaluation data is the underrated output: a week of prompting produces exactly the labelled failures that would justify and guide a fine-tune.</text>
</svg>
