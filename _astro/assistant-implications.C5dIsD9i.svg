<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="All of them orderings.">
  <title>Three consequences of the assembly</title>
  <style>
    .assistant-implications-bg   { fill: #f8fafc; }
    .assistant-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assistant-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assistant-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assistant-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assistant-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .assistant-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .assistant-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .assistant-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .assistant-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .assistant-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .assistant-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .assistant-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .assistant-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .assistant-implications-stage { opacity: 1; }

    .assistant-implications-s0 { animation-delay: 0.00s; }
    .assistant-implications-e0 { animation-delay: 0.00s; }
    .assistant-implications-s1 { animation-delay: 1.50s; }
    .assistant-implications-e1 { animation-delay: 1.50s; }
    .assistant-implications-s2 { animation-delay: 3.00s; }
    .assistant-implications-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .assistant-implications-conn  { animation: assistant-implications-trace 6s ease-in-out infinite; }
      .assistant-implications-stage { animation: assistant-implications-arrive 6s ease-in-out infinite; }
    }
    @keyframes assistant-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes assistant-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .assistant-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .assistant-implications-stage { animation: assistant-implications-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes assistant-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="assistant-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="assistant-implications-bg" width="980" height="322"/>
  <text class="assistant-implications-h1"  x="30" y="40">Three consequences of the assembly</text>
  <text class="assistant-implications-sub" x="30" y="64">All of them orderings.</text>
  <g class="assistant-implications-stage assistant-implications-s0">
    <rect class="assistant-implications-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="assistant-implications-step" x="44" y="142">01</text>
    <text class="assistant-implications-name" x="70" y="142">One ledger makes the cap meaningful</text>
    <text class="assistant-implications-desc" x="44" y="166">A stage with separate accounting is an</text>
    <text class="assistant-implications-desc" x="44" y="182">uncapped path.</text>
    <text class="assistant-implications-edge" x="44" y="242">security</text>
  </g>
  <line class="assistant-implications-line assistant-implications-conn assistant-implications-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#assistant-implications-tip)"/>
  <g class="assistant-implications-stage assistant-implications-s1">
    <rect class="assistant-implications-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="assistant-implications-step" x="359" y="142">02</text>
    <text class="assistant-implications-name" x="385" y="142">Boundary redaction makes every derived store clean</text>
    <text class="assistant-implications-desc" x="359" y="166">By construction, rather than by cleanup.</text>
  </g>
  <line class="assistant-implications-line assistant-implications-conn assistant-implications-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#assistant-implications-tip)"/>
  <g class="assistant-implications-stage assistant-implications-s2">
    <rect class="assistant-implications-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="assistant-implications-step" x="674" y="142">03</text>
    <text class="assistant-implications-name" x="700" y="142">Verified erasure turns a claim into evidence</text>
    <text class="assistant-implications-desc" x="674" y="166">"We ran the deletion" against "the data is</text>
    <text class="assistant-implications-desc" x="674" y="182">gone".</text>
  </g>
  <text class="assistant-implications-sub" x="30" y="304">All three are ordering decisions rather than features, which is why they are cheap during assembly and expensive afterwards — and why an integration day is the right place to make them.</text>
</svg>
