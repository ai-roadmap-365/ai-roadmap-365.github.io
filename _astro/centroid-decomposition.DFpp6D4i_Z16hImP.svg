<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Describing a segment</title>
  <style>
    .centroid-decomposition-bg   { fill: #f8fafc; }
    .centroid-decomposition-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .centroid-decomposition-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .centroid-decomposition-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .centroid-decomposition-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .centroid-decomposition-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .centroid-decomposition-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .centroid-decomposition-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .centroid-decomposition-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .centroid-decomposition-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .centroid-decomposition-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .centroid-decomposition-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .centroid-decomposition-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .centroid-decomposition-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .centroid-decomposition-stage { opacity: 1; }

    .centroid-decomposition-s0 { animation-delay: 0.00s; }
    .centroid-decomposition-e0 { animation-delay: 0.00s; }
    .centroid-decomposition-s1 { animation-delay: 1.28s; }
    .centroid-decomposition-e1 { animation-delay: 1.28s; }
    .centroid-decomposition-s2 { animation-delay: 2.56s; }
    .centroid-decomposition-e2 { animation-delay: 2.56s; }
    .centroid-decomposition-s3 { animation-delay: 3.84s; }
    .centroid-decomposition-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .centroid-decomposition-conn  { animation: centroid-decomposition-trace 6.4s ease-in-out infinite; }
      .centroid-decomposition-stage { animation: centroid-decomposition-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes centroid-decomposition-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes centroid-decomposition-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .centroid-decomposition-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .centroid-decomposition-stage { animation: centroid-decomposition-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes centroid-decomposition-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="centroid-decomposition-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="centroid-decomposition-bg" width="980" height="322"/>
  <text class="centroid-decomposition-h1"  x="30" y="40">Describing a segment</text>
  <text class="centroid-decomposition-sub" x="30" y="64">Four steps.</text>
  <g class="centroid-decomposition-stage centroid-decomposition-s0">
    <rect class="centroid-decomposition-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="centroid-decomposition-step" x="44" y="142">01</text>
    <text class="centroid-decomposition-name" x="70" y="142">Take each cluster's centroid</text>
    <text class="centroid-decomposition-desc" x="44" y="166">Its average across every</text>
    <text class="centroid-decomposition-desc" x="44" y="182">feature.</text>
  </g>
  <line class="centroid-decomposition-line centroid-decomposition-conn centroid-decomposition-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#centroid-decomposition-tip)"/>
  <g class="centroid-decomposition-stage centroid-decomposition-s1">
    <rect class="centroid-decomposition-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="centroid-decomposition-step" x="280" y="142">02</text>
    <text class="centroid-decomposition-name" x="306" y="142">Compare against the overall average</text>
    <text class="centroid-decomposition-desc" x="280" y="166">In standard deviations, so</text>
    <text class="centroid-decomposition-desc" x="280" y="182">features are comparable.</text>
  </g>
  <line class="centroid-decomposition-line centroid-decomposition-conn centroid-decomposition-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#centroid-decomposition-tip)"/>
  <g class="centroid-decomposition-stage centroid-decomposition-s2">
    <rect class="centroid-decomposition-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="centroid-decomposition-step" x="516" y="142">03</text>
    <text class="centroid-decomposition-name" x="542" y="142">Which gives a profile: high here, low there</text>
    <text class="centroid-decomposition-desc" x="516" y="166">Readable at a glance.</text>
  </g>
  <line class="centroid-decomposition-line centroid-decomposition-conn centroid-decomposition-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#centroid-decomposition-tip)"/>
  <g class="centroid-decomposition-stage centroid-decomposition-s3">
    <rect class="centroid-decomposition-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="centroid-decomposition-step" x="752" y="142">04</text>
    <text class="centroid-decomposition-name" x="778" y="142">Then name the segment from that profile</text>
    <text class="centroid-decomposition-desc" x="752" y="166">Which is what makes it usable by</text>
    <text class="centroid-decomposition-desc" x="752" y="182">the business.</text>
    <text class="centroid-decomposition-edge" x="752" y="242">the deliverable</text>
  </g>
  <text class="centroid-decomposition-sub" x="30" y="304">Naming the segments is not decoration: an unnamed cluster index is never used, and a named profile enters the vocabulary of the organisation.</text>
</svg>
