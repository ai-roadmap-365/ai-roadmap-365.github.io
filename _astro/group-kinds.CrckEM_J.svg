<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four points.">
  <title>Three things you can apply</title>
  <style>
    .group-kinds-bg   { fill: #f8fafc; }
    .group-kinds-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-kinds-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-kinds-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-kinds-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-kinds-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .group-kinds-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .group-kinds-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .group-kinds-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .group-kinds-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .group-kinds-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .group-kinds-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .group-kinds-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .group-kinds-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .group-kinds-stage { opacity: 1; }

    .group-kinds-s0 { animation-delay: 0.00s; }
    .group-kinds-e0 { animation-delay: 0.00s; }
    .group-kinds-s1 { animation-delay: 1.28s; }
    .group-kinds-e1 { animation-delay: 1.28s; }
    .group-kinds-s2 { animation-delay: 2.56s; }
    .group-kinds-e2 { animation-delay: 2.56s; }
    .group-kinds-s3 { animation-delay: 3.84s; }
    .group-kinds-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .group-kinds-conn  { animation: group-kinds-trace 6.4s ease-in-out infinite; }
      .group-kinds-stage { animation: group-kinds-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes group-kinds-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes group-kinds-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .group-kinds-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .group-kinds-stage { animation: group-kinds-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes group-kinds-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="group-kinds-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="group-kinds-bg" width="980" height="322"/>
  <text class="group-kinds-h1"  x="30" y="40">Three things you can apply</text>
  <text class="group-kinds-sub" x="30" y="64">Four points.</text>
  <g class="group-kinds-stage group-kinds-s0">
    <rect class="group-kinds-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="group-kinds-step" x="44" y="142">01</text>
    <text class="group-kinds-name" x="70" y="142">Aggregate: many rows become one per group</text>
    <text class="group-kinds-desc" x="44" y="166">Counts, sums, means.</text>
  </g>
  <line class="group-kinds-line group-kinds-conn group-kinds-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#group-kinds-tip)"/>
  <g class="group-kinds-stage group-kinds-s1">
    <rect class="group-kinds-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="group-kinds-step" x="280" y="142">02</text>
    <text class="group-kinds-name" x="306" y="142">Transform: one result per original row</text>
    <text class="group-kinds-desc" x="280" y="166">Group-relative values, such as a</text>
    <text class="group-kinds-desc" x="280" y="182">share.</text>
  </g>
  <line class="group-kinds-line group-kinds-conn group-kinds-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#group-kinds-tip)"/>
  <g class="group-kinds-stage group-kinds-s2">
    <rect class="group-kinds-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="group-kinds-step" x="516" y="142">03</text>
    <text class="group-kinds-name" x="542" y="142">Filter: keep or drop whole groups</text>
    <text class="group-kinds-desc" x="516" y="166">By a property of the group.</text>
  </g>
  <line class="group-kinds-line group-kinds-conn group-kinds-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#group-kinds-tip)"/>
  <g class="group-kinds-stage group-kinds-s3">
    <rect class="group-kinds-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="group-kinds-step" x="752" y="142">04</text>
    <text class="group-kinds-name" x="778" y="142">Which differ in the shape they return</text>
    <text class="group-kinds-desc" x="752" y="166">And confusing them causes most</text>
    <text class="group-kinds-desc" x="752" y="182">errors.</text>
  </g>
  <text class="group-kinds-sub" x="30" y="304">Transformation is the underused one: computing each row's value relative to its group's mean is a single operation, and looping to do it is both slower and longer.</text>
</svg>
