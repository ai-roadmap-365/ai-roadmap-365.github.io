<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four parts.">
  <title>What an exploratory study delivers</title>
  <style>
    .study-idea-bg   { fill: #f8fafc; }
    .study-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .study-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .study-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .study-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .study-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .study-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .study-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .study-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .study-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .study-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .study-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .study-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .study-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .study-idea-stage { opacity: 1; }

    .study-idea-s0 { animation-delay: 0.00s; }
    .study-idea-e0 { animation-delay: 0.00s; }
    .study-idea-s1 { animation-delay: 1.28s; }
    .study-idea-e1 { animation-delay: 1.28s; }
    .study-idea-s2 { animation-delay: 2.56s; }
    .study-idea-e2 { animation-delay: 2.56s; }
    .study-idea-s3 { animation-delay: 3.84s; }
    .study-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .study-idea-conn  { animation: study-idea-trace 6.4s ease-in-out infinite; }
      .study-idea-stage { animation: study-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes study-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes study-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .study-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .study-idea-stage { animation: study-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes study-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="study-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="study-idea-bg" width="980" height="322"/>
  <text class="study-idea-h1"  x="30" y="40">What an exploratory study delivers</text>
  <text class="study-idea-sub" x="30" y="64">Four parts.</text>
  <g class="study-idea-stage study-idea-s0">
    <rect class="study-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="study-idea-step" x="44" y="142">01</text>
    <text class="study-idea-name" x="70" y="142">A clearly stated question, fixed before analysis</text>
    <text class="study-idea-desc" x="44" y="166">Which everything is judged</text>
    <text class="study-idea-desc" x="44" y="182">against.</text>
  </g>
  <line class="study-idea-line study-idea-conn study-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#study-idea-tip)"/>
  <g class="study-idea-stage study-idea-s1">
    <rect class="study-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="study-idea-step" x="280" y="142">02</text>
    <text class="study-idea-name" x="306" y="142">A cleaned dataset, regenerable from raw</text>
    <text class="study-idea-desc" x="280" y="166">With every decision recorded.</text>
  </g>
  <line class="study-idea-line study-idea-conn study-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#study-idea-tip)"/>
  <g class="study-idea-stage study-idea-s2">
    <rect class="study-idea-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="study-idea-step" x="516" y="142">03</text>
    <text class="study-idea-name" x="542" y="142">Findings, each with its evidence and its caveats</text>
    <text class="study-idea-desc" x="516" y="166">Hypotheses, not conclusions.</text>
  </g>
  <line class="study-idea-line study-idea-conn study-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#study-idea-tip)"/>
  <g class="study-idea-stage study-idea-s3">
    <rect class="study-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="study-idea-step" x="752" y="142">04</text>
    <text class="study-idea-name" x="778" y="142">And an artefact anyone can rerun</text>
    <text class="study-idea-desc" x="752" y="166">Which is what makes it credible.</text>
  </g>
  <text class="study-idea-sub" x="30" y="304">This project exercises everything in the section at once: sourcing, cleaning, exploring, visualising and reporting, on data you chose yourself.</text>
</svg>
