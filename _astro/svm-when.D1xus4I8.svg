<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to use a support vector machine</title>
  <style>
    .svm-when-bg   { fill: #f8fafc; }
    .svm-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .svm-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .svm-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .svm-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .svm-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .svm-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .svm-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .svm-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .svm-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .svm-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .svm-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .svm-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .svm-when-row { opacity: 1; }
    .svm-when-r0 { animation-delay: 0.00s; }
    .svm-when-r1 { animation-delay: 0.45s; }
    .svm-when-r2 { animation-delay: 0.90s; }
    .svm-when-r3 { animation-delay: 1.35s; }
    .svm-when-r4 { animation-delay: 1.80s; }
    .svm-when-row { animation: svm-when-reveal 7.3s ease-in-out infinite; }
    @keyframes svm-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="svm-when-bg" width="980" height="390"/>
  <text class="svm-when-h1"  x="30" y="40">When to use a support vector machine</text>
  <text class="svm-when-sub" x="30" y="64">And when not to.</text>
  <rect class="svm-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="svm-when-name" x="46" y="122">Use one</text>
  <text class="svm-when-desc" x="46" y="142">Four cases.</text>
  <text class="svm-when-desc svm-when-row svm-when-r0" x="46" y="182">Small datasets, thousands of rows</text>
  <text class="svm-when-desc svm-when-row svm-when-r1" x="46" y="216">More features than examples</text>
  <text class="svm-when-desc svm-when-row svm-when-r2" x="46" y="250">Text classification with linear kernels</text>
  <text class="svm-when-desc svm-when-row svm-when-r3" x="46" y="284">Where a clear margin exists</text>
  <text class="svm-when-desc svm-when-row svm-when-r4" x="46" y="318">Where theory-backed generalisation matters</text>
  <rect class="svm-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="svm-when-name" x="526" y="122">Use something else</text>
  <text class="svm-when-desc" x="526" y="142">Also four.</text>
  <text class="svm-when-desc svm-when-row svm-when-r0" x="526" y="182">Large datasets — boosting or linear models</text>
  <text class="svm-when-desc svm-when-row svm-when-r1" x="526" y="216">Where probabilities are needed directly</text>
  <text class="svm-when-desc svm-when-row svm-when-r2" x="526" y="250">Where interpretability is required</text>
  <text class="svm-when-desc svm-when-row svm-when-r3" x="526" y="284">Images, audio and sequences</text>
  <text class="svm-when-desc svm-when-row svm-when-r4" x="526" y="318">Where training time is constrained</text>
  <text class="svm-when-sub" x="30" y="372">The linear-kernel case on text remains genuinely competitive and cheap, which is worth remembering because it avoids the training cost that rules out the kernelised version.</text>
</svg>
