<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four methods.">
  <title>What a dataclass generates</title>
  <style>
    .dataclass-idea-bg   { fill: #f8fafc; }
    .dataclass-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataclass-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataclass-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataclass-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataclass-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataclass-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dataclass-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dataclass-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dataclass-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dataclass-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dataclass-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dataclass-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .dataclass-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .dataclass-idea-stage { opacity: 1; }

    .dataclass-idea-s0 { animation-delay: 0.00s; }
    .dataclass-idea-e0 { animation-delay: 0.00s; }
    .dataclass-idea-s1 { animation-delay: 1.28s; }
    .dataclass-idea-e1 { animation-delay: 1.28s; }
    .dataclass-idea-s2 { animation-delay: 2.56s; }
    .dataclass-idea-e2 { animation-delay: 2.56s; }
    .dataclass-idea-s3 { animation-delay: 3.84s; }
    .dataclass-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .dataclass-idea-conn  { animation: dataclass-idea-trace 6.4s ease-in-out infinite; }
      .dataclass-idea-stage { animation: dataclass-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes dataclass-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes dataclass-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .dataclass-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .dataclass-idea-stage { animation: dataclass-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes dataclass-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="dataclass-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="dataclass-idea-bg" width="980" height="322"/>
  <text class="dataclass-idea-h1"  x="30" y="40">What a dataclass generates</text>
  <text class="dataclass-idea-sub" x="30" y="64">Four methods.</text>
  <g class="dataclass-idea-stage dataclass-idea-s0">
    <rect class="dataclass-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="dataclass-idea-step" x="44" y="142">01</text>
    <text class="dataclass-idea-name" x="70" y="142">An initialiser taking every field</text>
    <text class="dataclass-idea-desc" x="44" y="166">In declaration order.</text>
  </g>
  <line class="dataclass-idea-line dataclass-idea-conn dataclass-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#dataclass-idea-tip)"/>
  <g class="dataclass-idea-stage dataclass-idea-s1">
    <rect class="dataclass-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="dataclass-idea-step" x="280" y="142">02</text>
    <text class="dataclass-idea-name" x="306" y="142">A readable developer representation</text>
    <text class="dataclass-idea-desc" x="280" y="166">Showing the field values.</text>
  </g>
  <line class="dataclass-idea-line dataclass-idea-conn dataclass-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#dataclass-idea-tip)"/>
  <g class="dataclass-idea-stage dataclass-idea-s2">
    <rect class="dataclass-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="dataclass-idea-step" x="516" y="142">03</text>
    <text class="dataclass-idea-name" x="542" y="142">Equality comparing field by field</text>
    <text class="dataclass-idea-desc" x="516" y="166">Rather than by identity.</text>
  </g>
  <line class="dataclass-idea-line dataclass-idea-conn dataclass-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#dataclass-idea-tip)"/>
  <g class="dataclass-idea-stage dataclass-idea-s3">
    <rect class="dataclass-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="dataclass-idea-step" x="752" y="142">04</text>
    <text class="dataclass-idea-name" x="778" y="142">And ordering, if you ask for it</text>
    <text class="dataclass-idea-desc" x="752" y="166">Comparing fields in order.</text>
    <text class="dataclass-idea-edge" x="752" y="242">one decorator</text>
  </g>
  <text class="dataclass-idea-sub" x="30" y="304">Field-by-field equality rather than identity is the change most often wanted and most tedious to write by hand, which is most of why the decorator exists.</text>
</svg>
