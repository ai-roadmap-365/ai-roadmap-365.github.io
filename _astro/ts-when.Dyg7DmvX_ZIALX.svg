<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By data shape.">
  <title>Which forecasting approach when</title>
  <style>
    .ts-when-bg   { fill: #f8fafc; }
    .ts-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ts-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ts-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ts-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ts-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ts-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ts-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ts-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ts-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ts-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ts-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ts-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ts-when-row { opacity: 1; }
    .ts-when-r0 { animation-delay: 0.00s; }
    .ts-when-r1 { animation-delay: 0.45s; }
    .ts-when-r2 { animation-delay: 0.90s; }
    .ts-when-r3 { animation-delay: 1.35s; }
    .ts-when-r4 { animation-delay: 1.80s; }
    .ts-when-row { animation: ts-when-reveal 7.3s ease-in-out infinite; }
    @keyframes ts-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="ts-when-bg" width="980" height="390"/>
  <text class="ts-when-h1"  x="30" y="40">Which forecasting approach when</text>
  <text class="ts-when-sub" x="30" y="64">By data shape.</text>
  <rect class="ts-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="ts-when-name" x="46" y="122">The situation</text>
  <text class="ts-when-desc" x="46" y="142">What you have.</text>
  <text class="ts-when-desc ts-when-row ts-when-r0" x="46" y="182">One short, regular series</text>
  <text class="ts-when-desc ts-when-row ts-when-r1" x="46" y="216">Many related series</text>
  <text class="ts-when-desc ts-when-row ts-when-r2" x="46" y="250">Strong external drivers available</text>
  <text class="ts-when-desc ts-when-row ts-when-r3" x="46" y="284">Very long history, stable process</text>
  <text class="ts-when-desc ts-when-row ts-when-r4" x="46" y="318">Irregular or event-driven data</text>
  <rect class="ts-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="ts-when-name" x="526" y="122">The approach</text>
  <text class="ts-when-desc" x="526" y="142">What to use.</text>
  <text class="ts-when-desc ts-when-row ts-when-r0" x="526" y="182">Exponential smoothing or autoregressive</text>
  <text class="ts-when-desc ts-when-row ts-when-r1" x="526" y="216">A global tabular model on lag features</text>
  <text class="ts-when-desc ts-when-row ts-when-r2" x="526" y="250">Tabular, where covariates are easy to add</text>
  <text class="ts-when-desc ts-when-row ts-when-r3" x="526" y="284">Classical methods, which are hard to beat</text>
  <text class="ts-when-desc ts-when-row ts-when-r4" x="526" y="318">Reframe as a count or hazard problem</text>
  <text class="ts-when-sub" x="30" y="372">Always running the seasonal naive baseline first is the discipline that prevents shipping a complex model that a one-line rule already beats.</text>
</svg>
