<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="During boarding, or at midnight.">
  <title>Rewiring an airport's signage</title>
  <style>
    .airport-signage-bg   { fill: #f8fafc; }
    .airport-signage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .airport-signage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .airport-signage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .airport-signage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .airport-signage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .airport-signage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .airport-signage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .airport-signage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .airport-signage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .airport-signage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .airport-signage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .airport-signage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .airport-signage-row { opacity: 1; }
    .airport-signage-r0 { animation-delay: 0.00s; }
    .airport-signage-r1 { animation-delay: 0.45s; }
    .airport-signage-r2 { animation-delay: 0.90s; }
    .airport-signage-r3 { animation-delay: 1.35s; }
    .airport-signage-r4 { animation-delay: 1.80s; }
    .airport-signage-row { animation: airport-signage-reveal 7.3s ease-in-out infinite; }
    @keyframes airport-signage-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="airport-signage-bg" width="980" height="390"/>
  <text class="airport-signage-h1"  x="30" y="40">Rewiring an airport's signage</text>
  <text class="airport-signage-sub" x="30" y="64">During boarding, or at midnight.</text>
  <rect class="airport-signage-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="airport-signage-name" x="46" y="122">Cutting wires at peak</text>
  <text class="airport-signage-desc" x="46" y="142">An outage with an audience.</text>
  <text class="airport-signage-desc airport-signage-row airport-signage-r0" x="46" y="182">An electrician in Terminal 1 during boarding</text>
  <text class="airport-signage-desc airport-signage-row airport-signage-r1" x="46" y="216">Screens go dark mid-departure</text>
  <text class="airport-signage-desc airport-signage-row airport-signage-r2" x="46" y="250">No way back except rewiring again</text>
  <text class="airport-signage-desc airport-signage-row airport-signage-r3" x="46" y="284">Every passenger is affected</text>
  <text class="airport-signage-desc airport-signage-row airport-signage-r4" x="46" y="318">This is rebuilding on the production host</text>
  <rect class="airport-signage-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="airport-signage-name" x="526" y="122">Installed in parallel</text>
  <text class="airport-signage-desc" x="526" y="142">A relay flip.</text>
  <text class="airport-signage-desc airport-signage-row airport-signage-r0" x="526" y="182">The new system built while the old runs</text>
  <text class="airport-signage-desc airport-signage-row airport-signage-r1" x="526" y="216">Tested with nobody depending on it</text>
  <text class="airport-signage-desc airport-signage-row airport-signage-r2" x="526" y="250">One relay, at midnight</text>
  <text class="airport-signage-desc airport-signage-row airport-signage-r3" x="526" y="284">Flip back if it is wrong</text>
  <text class="airport-signage-desc airport-signage-row airport-signage-r4" x="526" y="318">Or trial Gate 1A first — the canary</text>
  <text class="airport-signage-sub" x="30" y="372">The parallel install costs the price of running two systems for a while, which is exactly the overlap cost of a blue-green deployment, and is the thing being bought when you buy the ability to change your mind.</text>
</svg>
