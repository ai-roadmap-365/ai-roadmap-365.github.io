<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The vendor ships two images for a reason.">
  <title>cuda-devel or cuda-runtime</title>
  <style>
    .cuda-devel-or-runtime-bg   { fill: #f8fafc; }
    .cuda-devel-or-runtime-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cuda-devel-or-runtime-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cuda-devel-or-runtime-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cuda-devel-or-runtime-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cuda-devel-or-runtime-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cuda-devel-or-runtime-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cuda-devel-or-runtime-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cuda-devel-or-runtime-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cuda-devel-or-runtime-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cuda-devel-or-runtime-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cuda-devel-or-runtime-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cuda-devel-or-runtime-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cuda-devel-or-runtime-row { opacity: 1; }
    .cuda-devel-or-runtime-r0 { animation-delay: 0.00s; }
    .cuda-devel-or-runtime-r1 { animation-delay: 0.45s; }
    .cuda-devel-or-runtime-r2 { animation-delay: 0.90s; }
    .cuda-devel-or-runtime-r3 { animation-delay: 1.35s; }
    .cuda-devel-or-runtime-r4 { animation-delay: 1.80s; }
    .cuda-devel-or-runtime-row { animation: cuda-devel-or-runtime-reveal 7.3s ease-in-out infinite; }
    @keyframes cuda-devel-or-runtime-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cuda-devel-or-runtime-bg" width="980" height="390"/>
  <text class="cuda-devel-or-runtime-h1"  x="30" y="40">cuda-devel or cuda-runtime</text>
  <text class="cuda-devel-or-runtime-sub" x="30" y="64">The vendor ships two images for a reason.</text>
  <rect class="cuda-devel-or-runtime-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cuda-devel-or-runtime-name" x="46" y="122">cuda-devel</text>
  <text class="cuda-devel-or-runtime-desc" x="46" y="142">About 4.1 GB.</text>
  <text class="cuda-devel-or-runtime-desc cuda-devel-or-runtime-row cuda-devel-or-runtime-r0" x="46" y="182">The compiler toolkit</text>
  <text class="cuda-devel-or-runtime-desc cuda-devel-or-runtime-row cuda-devel-or-runtime-r1" x="46" y="216">Headers and build tools</text>
  <text class="cuda-devel-or-runtime-desc cuda-devel-or-runtime-row cuda-devel-or-runtime-r2" x="46" y="250">Needed to compile an extension</text>
  <text class="cuda-devel-or-runtime-desc cuda-devel-or-runtime-row cuda-devel-or-runtime-r3" x="46" y="284">Belongs in the builder stage</text>
  <text class="cuda-devel-or-runtime-desc cuda-devel-or-runtime-row cuda-devel-or-runtime-r4" x="46" y="318">Shipped to production by accident, often</text>
  <rect class="cuda-devel-or-runtime-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cuda-devel-or-runtime-name" x="526" y="122">cuda-runtime</text>
  <text class="cuda-devel-or-runtime-desc" x="526" y="142">About 1.6 GB.</text>
  <text class="cuda-devel-or-runtime-desc cuda-devel-or-runtime-row cuda-devel-or-runtime-r0" x="526" y="182">The libraries a compiled program links against</text>
  <text class="cuda-devel-or-runtime-desc cuda-devel-or-runtime-row cuda-devel-or-runtime-r1" x="526" y="216">No compiler</text>
  <text class="cuda-devel-or-runtime-desc cuda-devel-or-runtime-row cuda-devel-or-runtime-r2" x="526" y="250">What the running process actually calls</text>
  <text class="cuda-devel-or-runtime-desc cuda-devel-or-runtime-row cuda-devel-or-runtime-r3" x="526" y="284">Belongs in the final stage</text>
  <text class="cuda-devel-or-runtime-desc cuda-devel-or-runtime-row cuda-devel-or-runtime-r4" x="526" y="318">2.5 GB smaller, on every node</text>
  <text class="cuda-devel-or-runtime-sub" x="30" y="372">That NVIDIA publishes these as two separate images is the clearest available signal about which one production wants, and confusing them is the most expensive single mistake in a GPU Dockerfile.</text>
</svg>
