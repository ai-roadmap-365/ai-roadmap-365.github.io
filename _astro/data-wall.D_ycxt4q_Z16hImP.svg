<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which is where the constraint moved.">
  <title>Running out of data</title>
  <style>
    .data-wall-bg   { fill: #f8fafc; }
    .data-wall-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .data-wall-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .data-wall-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .data-wall-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .data-wall-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .data-wall-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .data-wall-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .data-wall-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .data-wall-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .data-wall-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .data-wall-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .data-wall-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .data-wall-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .data-wall-stage { opacity: 1; }

    .data-wall-s0 { animation-delay: 0.00s; }
    .data-wall-e0 { animation-delay: 0.00s; }
    .data-wall-s1 { animation-delay: 1.28s; }
    .data-wall-e1 { animation-delay: 1.28s; }
    .data-wall-s2 { animation-delay: 2.56s; }
    .data-wall-e2 { animation-delay: 2.56s; }
    .data-wall-s3 { animation-delay: 3.84s; }
    .data-wall-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .data-wall-conn  { animation: data-wall-trace 6.4s ease-in-out infinite; }
      .data-wall-stage { animation: data-wall-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes data-wall-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes data-wall-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .data-wall-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .data-wall-stage { animation: data-wall-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes data-wall-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="data-wall-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="data-wall-bg" width="980" height="322"/>
  <text class="data-wall-h1"  x="30" y="40">Running out of data</text>
  <text class="data-wall-sub" x="30" y="64">Which is where the constraint moved.</text>
  <g class="data-wall-stage data-wall-s0">
    <rect class="data-wall-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="data-wall-step" x="44" y="142">01</text>
    <text class="data-wall-name" x="70" y="142">The optimum wants twenty tokens per parameter</text>
    <text class="data-wall-desc" x="44" y="166">Which for the largest models is</text>
    <text class="data-wall-desc" x="44" y="182">most of the usable web.</text>
  </g>
  <line class="data-wall-line data-wall-conn data-wall-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#data-wall-tip)"/>
  <g class="data-wall-stage data-wall-s1">
    <rect class="data-wall-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="data-wall-step" x="280" y="142">02</text>
    <text class="data-wall-name" x="306" y="142">High-quality text is finite</text>
    <text class="data-wall-desc" x="280" y="166">And already largely consumed.</text>
  </g>
  <line class="data-wall-line data-wall-conn data-wall-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#data-wall-tip)"/>
  <g class="data-wall-stage data-wall-s2">
    <rect class="data-wall-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="data-wall-step" x="516" y="142">03</text>
    <text class="data-wall-name" x="542" y="142">Repeating data helps, up to a point</text>
    <text class="data-wall-desc" x="516" y="166">Roughly four passes behave</text>
    <text class="data-wall-desc" x="516" y="182">almost like fresh data.</text>
  </g>
  <line class="data-wall-line data-wall-conn data-wall-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#data-wall-tip)"/>
  <g class="data-wall-stage data-wall-s3">
    <rect class="data-wall-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="data-wall-step" x="752" y="142">04</text>
    <text class="data-wall-name" x="778" y="142">After which returns collapse</text>
    <text class="data-wall-desc" x="752" y="166">So quality and filtering matter</text>
    <text class="data-wall-desc" x="752" y="182">more than volume.</text>
  </g>
  <text class="data-wall-sub" x="30" y="304">That a few repeats are nearly as good as fresh data is a useful and non-obvious result, and it is why data curation displaced data acquisition as the harder problem.</text>
</svg>
