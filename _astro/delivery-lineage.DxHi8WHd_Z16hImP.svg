<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Agile, DevOps and agents.">
  <title>Three traditions combined</title>
  <style>
    .delivery-lineage-bg   { fill: #f8fafc; }
    .delivery-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .delivery-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .delivery-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .delivery-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .delivery-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .delivery-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .delivery-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .delivery-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .delivery-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .delivery-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .delivery-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .delivery-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .delivery-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .delivery-lineage-stage { opacity: 1; }

    .delivery-lineage-s0 { animation-delay: 0.00s; }
    .delivery-lineage-e0 { animation-delay: 0.00s; }
    .delivery-lineage-s1 { animation-delay: 1.50s; }
    .delivery-lineage-e1 { animation-delay: 1.50s; }
    .delivery-lineage-s2 { animation-delay: 3.00s; }
    .delivery-lineage-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .delivery-lineage-conn  { animation: delivery-lineage-trace 6s ease-in-out infinite; }
      .delivery-lineage-stage { animation: delivery-lineage-arrive 6s ease-in-out infinite; }
    }
    @keyframes delivery-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes delivery-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .delivery-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .delivery-lineage-stage { animation: delivery-lineage-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes delivery-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="delivery-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="delivery-lineage-bg" width="980" height="322"/>
  <text class="delivery-lineage-h1"  x="30" y="40">Three traditions combined</text>
  <text class="delivery-lineage-sub" x="30" y="64">Agile, DevOps and agents.</text>
  <g class="delivery-lineage-stage delivery-lineage-s0">
    <rect class="delivery-lineage-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="delivery-lineage-step" x="44" y="142">01</text>
    <text class="delivery-lineage-name" x="70" y="142">Specification by example</text>
    <text class="delivery-lineage-desc" x="44" y="166">Small verifiable stories with concrete</text>
    <text class="delivery-lineage-desc" x="44" y="182">acceptance criteria.</text>
  </g>
  <line class="delivery-lineage-line delivery-lineage-conn delivery-lineage-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#delivery-lineage-tip)"/>
  <g class="delivery-lineage-stage delivery-lineage-s1">
    <rect class="delivery-lineage-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="delivery-lineage-step" x="359" y="142">02</text>
    <text class="delivery-lineage-name" x="385" y="142">DevOps and IaC, 2010s</text>
    <text class="delivery-lineage-desc" x="359" y="166">Deterministic verification gates as the thing</text>
    <text class="delivery-lineage-desc" x="359" y="182">that makes shipping safe.</text>
  </g>
  <line class="delivery-lineage-line delivery-lineage-conn delivery-lineage-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#delivery-lineage-tip)"/>
  <g class="delivery-lineage-stage delivery-lineage-s2">
    <rect class="delivery-lineage-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="delivery-lineage-step" x="674" y="142">03</text>
    <text class="delivery-lineage-name" x="700" y="142">Agentic delivery, 2024</text>
    <text class="delivery-lineage-desc" x="674" y="166">Chat, tool execution and CI unified into one</text>
    <text class="delivery-lineage-desc" x="674" y="182">repeatable playbook.</text>
  </g>
  <text class="delivery-lineage-sub" x="30" y="304">Neither of the first two was designed for agents, and both transfer intact: an acceptance criterion is a prompt a model can satisfy, and a verification gate does not care who wrote the code.</text>
</svg>
