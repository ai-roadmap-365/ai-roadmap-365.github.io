<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five stages, like any release.">
  <title>The prompt lifecycle</title>
  <style>
    .prompt-lifecycle-bg   { fill: #f8fafc; }
    .prompt-lifecycle-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-lifecycle-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-lifecycle-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-lifecycle-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-lifecycle-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-lifecycle-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prompt-lifecycle-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .prompt-lifecycle-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .prompt-lifecycle-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .prompt-lifecycle-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .prompt-lifecycle-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .prompt-lifecycle-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .prompt-lifecycle-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .prompt-lifecycle-stage { opacity: 1; }

    .prompt-lifecycle-s0 { animation-delay: 0.00s; }
    .prompt-lifecycle-e0 { animation-delay: 0.00s; }
    .prompt-lifecycle-s1 { animation-delay: 1.33s; }
    .prompt-lifecycle-e1 { animation-delay: 1.33s; }
    .prompt-lifecycle-s2 { animation-delay: 2.67s; }
    .prompt-lifecycle-e2 { animation-delay: 2.67s; }
    .prompt-lifecycle-s3 { animation-delay: 4.00s; }
    .prompt-lifecycle-e3 { animation-delay: 4.00s; }
    .prompt-lifecycle-s4 { animation-delay: 5.33s; }
    .prompt-lifecycle-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .prompt-lifecycle-conn  { animation: prompt-lifecycle-trace 8s ease-in-out infinite; }
      .prompt-lifecycle-stage { animation: prompt-lifecycle-arrive 8s ease-in-out infinite; }
    }
    @keyframes prompt-lifecycle-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes prompt-lifecycle-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .prompt-lifecycle-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .prompt-lifecycle-stage { animation: prompt-lifecycle-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes prompt-lifecycle-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="prompt-lifecycle-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="prompt-lifecycle-bg" width="980" height="322"/>
  <text class="prompt-lifecycle-h1"  x="30" y="40">The prompt lifecycle</text>
  <text class="prompt-lifecycle-sub" x="30" y="64">Five stages, like any release.</text>
  <g class="prompt-lifecycle-stage prompt-lifecycle-s0">
    <rect class="prompt-lifecycle-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="prompt-lifecycle-step" x="44" y="142">01</text>
    <text class="prompt-lifecycle-name" x="70" y="142">Author the change</text>
    <text class="prompt-lifecycle-desc" x="44" y="166">In version control, with</text>
    <text class="prompt-lifecycle-desc" x="44" y="182">a stated intent.</text>
  </g>
  <line class="prompt-lifecycle-line prompt-lifecycle-conn prompt-lifecycle-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#prompt-lifecycle-tip)"/>
  <g class="prompt-lifecycle-stage prompt-lifecycle-s1">
    <rect class="prompt-lifecycle-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="prompt-lifecycle-step" x="233" y="142">02</text>
    <text class="prompt-lifecycle-name" x="259" y="142">Review it</text>
    <text class="prompt-lifecycle-desc" x="233" y="166">By someone other than the</text>
    <text class="prompt-lifecycle-desc" x="233" y="182">author.</text>
  </g>
  <line class="prompt-lifecycle-line prompt-lifecycle-conn prompt-lifecycle-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#prompt-lifecycle-tip)"/>
  <g class="prompt-lifecycle-stage prompt-lifecycle-s2">
    <rect class="prompt-lifecycle-good" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="prompt-lifecycle-step" x="422" y="142">03</text>
    <text class="prompt-lifecycle-name" x="448" y="142">Evaluate against the test set</text>
    <text class="prompt-lifecycle-desc" x="422" y="166">Comparing to the version</text>
    <text class="prompt-lifecycle-desc" x="422" y="182">currently deployed.</text>
  </g>
  <line class="prompt-lifecycle-line prompt-lifecycle-conn prompt-lifecycle-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#prompt-lifecycle-tip)"/>
  <g class="prompt-lifecycle-stage prompt-lifecycle-s3">
    <rect class="prompt-lifecycle-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="prompt-lifecycle-step" x="611" y="142">04</text>
    <text class="prompt-lifecycle-name" x="637" y="142">Release to a fraction of traffic</text>
    <text class="prompt-lifecycle-desc" x="611" y="166">Watching quality and cost</text>
    <text class="prompt-lifecycle-desc" x="611" y="182">together.</text>
  </g>
  <line class="prompt-lifecycle-line prompt-lifecycle-conn prompt-lifecycle-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#prompt-lifecycle-tip)"/>
  <g class="prompt-lifecycle-stage prompt-lifecycle-s4">
    <rect class="prompt-lifecycle-warn" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="prompt-lifecycle-step" x="800" y="142">05</text>
    <text class="prompt-lifecycle-name" x="826" y="142">Then monitor, and roll back on regression</text>
    <text class="prompt-lifecycle-desc" x="800" y="166">By version, automatically</text>
    <text class="prompt-lifecycle-desc" x="800" y="182">where possible.</text>
  </g>
  <text class="prompt-lifecycle-sub" x="30" y="304">Nothing here is specific to prompts, which is the point: the failure is treating a behavioural change as a text edit because it happens to look like prose.</text>
</svg>
