<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Design ones.">
  <title>Four consequences of metered cost</title>
  <style>
    .cost-implications-bg   { fill: #f8fafc; }
    .cost-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cost-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cost-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cost-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cost-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cost-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cost-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cost-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cost-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cost-implications-stage { opacity: 1; }

    .cost-implications-s0 { animation-delay: 0.00s; }
    .cost-implications-e0 { animation-delay: 0.00s; }
    .cost-implications-s1 { animation-delay: 1.28s; }
    .cost-implications-e1 { animation-delay: 1.28s; }
    .cost-implications-s2 { animation-delay: 2.56s; }
    .cost-implications-e2 { animation-delay: 2.56s; }
    .cost-implications-s3 { animation-delay: 3.84s; }
    .cost-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cost-implications-conn  { animation: cost-implications-trace 6.4s ease-in-out infinite; }
      .cost-implications-stage { animation: cost-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cost-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cost-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cost-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cost-implications-stage { animation: cost-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cost-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cost-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cost-implications-bg" width="980" height="322"/>
  <text class="cost-implications-h1"  x="30" y="40">Four consequences of metered cost</text>
  <text class="cost-implications-sub" x="30" y="64">Design ones.</text>
  <g class="cost-implications-stage cost-implications-s0">
    <rect class="cost-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cost-implications-step" x="44" y="142">01</text>
    <text class="cost-implications-name" x="70" y="142">Some features are not viable at any quality</text>
    <text class="cost-implications-desc" x="44" y="166">Because cost per use exceeds</text>
    <text class="cost-implications-desc" x="44" y="182">value per use.</text>
  </g>
  <line class="cost-implications-line cost-implications-conn cost-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cost-implications-tip)"/>
  <g class="cost-implications-stage cost-implications-s1">
    <rect class="cost-implications-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cost-implications-step" x="280" y="142">02</text>
    <text class="cost-implications-name" x="306" y="142">Spending needs monitoring like errors do</text>
    <text class="cost-implications-desc" x="280" y="166">With alerts and thresholds.</text>
  </g>
  <line class="cost-implications-line cost-implications-conn cost-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cost-implications-tip)"/>
  <g class="cost-implications-stage cost-implications-s2">
    <rect class="cost-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cost-implications-step" x="516" y="142">03</text>
    <text class="cost-implications-name" x="542" y="142">And an open endpoint is a financial attack surface</text>
    <text class="cost-implications-desc" x="516" y="166">Rate limit before</text>
    <text class="cost-implications-desc" x="516" y="182">authenticating, not after.</text>
  </g>
  <line class="cost-implications-line cost-implications-conn cost-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cost-implications-tip)"/>
  <g class="cost-implications-stage cost-implications-s3">
    <rect class="cost-implications-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cost-implications-step" x="752" y="142">04</text>
    <text class="cost-implications-name" x="778" y="142">Which pushes work toward cheaper components</text>
    <text class="cost-implications-desc" x="752" y="166">Caching, retrieval, smaller</text>
    <text class="cost-implications-desc" x="752" y="182">models, classical code.</text>
  </g>
  <text class="cost-implications-sub" x="30" y="304">Rate limiting before authentication is the detail that gets missed: an unauthenticated endpoint that calls a model is a way to spend someone else's money.</text>
</svg>
