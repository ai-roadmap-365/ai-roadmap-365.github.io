<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Stirred or not.">
  <title>Tasting a pot of soup</title>
  <style>
    .soup-taste-bg   { fill: #f8fafc; }
    .soup-taste-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .soup-taste-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .soup-taste-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .soup-taste-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .soup-taste-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .soup-taste-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .soup-taste-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .soup-taste-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .soup-taste-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .soup-taste-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .soup-taste-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .soup-taste-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .soup-taste-row { opacity: 1; }
    .soup-taste-r0 { animation-delay: 0.00s; }
    .soup-taste-r1 { animation-delay: 0.45s; }
    .soup-taste-r2 { animation-delay: 0.90s; }
    .soup-taste-r3 { animation-delay: 1.35s; }
    .soup-taste-r4 { animation-delay: 1.80s; }
    .soup-taste-row { animation: soup-taste-reveal 7.3s ease-in-out infinite; }
    @keyframes soup-taste-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="soup-taste-bg" width="980" height="390"/>
  <text class="soup-taste-h1"  x="30" y="40">Tasting a pot of soup</text>
  <text class="soup-taste-sub" x="30" y="64">Stirred or not.</text>
  <rect class="soup-taste-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="soup-taste-name" x="46" y="122">Stirred first</text>
  <text class="soup-taste-desc" x="46" y="142">Representative.</text>
  <text class="soup-taste-desc soup-taste-row soup-taste-r0" x="46" y="182">One spoonful tells you about the pot</text>
  <text class="soup-taste-desc soup-taste-row soup-taste-r1" x="46" y="216">Size of the pot barely matters</text>
  <text class="soup-taste-desc soup-taste-row soup-taste-r2" x="46" y="250">A small taste suffices</text>
  <text class="soup-taste-desc soup-taste-row soup-taste-r3" x="46" y="284">Judgement is sound</text>
  <text class="soup-taste-desc soup-taste-row soup-taste-r4" x="46" y="318">This is random sampling</text>
  <rect class="soup-taste-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="soup-taste-name" x="526" y="122">From the top</text>
  <text class="soup-taste-desc" x="526" y="142">Unrepresentative.</text>
  <text class="soup-taste-desc soup-taste-row soup-taste-r0" x="526" y="182">You taste what floats</text>
  <text class="soup-taste-desc soup-taste-row soup-taste-r1" x="526" y="216">A bigger spoon does not help</text>
  <text class="soup-taste-desc soup-taste-row soup-taste-r2" x="526" y="250">More tasting confirms the error</text>
  <text class="soup-taste-desc soup-taste-row soup-taste-r3" x="526" y="284">Judgement is confidently wrong</text>
  <text class="soup-taste-desc soup-taste-row soup-taste-r4" x="526" y="318">This is a biased sample</text>
  <text class="soup-taste-sub" x="30" y="372">A bigger spoon not helping is the whole lesson about sample size and bias, expressed in a way that is hard to forget.</text>
</svg>
