<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which turns a silent failure loud.">
  <title>Measuring extraction yield</title>
  <style>
    .yield-bg   { fill: #f8fafc; }
    .yield-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .yield-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .yield-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .yield-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .yield-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .yield-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .yield-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .yield-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .yield-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .yield-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .yield-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .yield-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .yield-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .yield-stage { opacity: 1; }

    .yield-s0 { animation-delay: 0.00s; }
    .yield-e0 { animation-delay: 0.00s; }
    .yield-s1 { animation-delay: 1.28s; }
    .yield-e1 { animation-delay: 1.28s; }
    .yield-s2 { animation-delay: 2.56s; }
    .yield-e2 { animation-delay: 2.56s; }
    .yield-s3 { animation-delay: 3.84s; }
    .yield-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .yield-conn  { animation: yield-trace 6.4s ease-in-out infinite; }
      .yield-stage { animation: yield-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes yield-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes yield-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .yield-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .yield-stage { animation: yield-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes yield-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="yield-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="yield-bg" width="980" height="322"/>
  <text class="yield-h1"  x="30" y="40">Measuring extraction yield</text>
  <text class="yield-sub" x="30" y="64">Which turns a silent failure loud.</text>
  <g class="yield-stage yield-s0">
    <rect class="yield-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="yield-step" x="44" y="142">01</text>
    <text class="yield-name" x="70" y="142">A page of prose yields a predictable amount of text</text>
    <text class="yield-desc" x="44" y="166">Hundreds of words, typically.</text>
  </g>
  <line class="yield-line yield-conn yield-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#yield-tip)"/>
  <g class="yield-stage yield-s1">
    <rect class="yield-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="yield-step" x="280" y="142">02</text>
    <text class="yield-name" x="306" y="142">Measure what was actually extracted</text>
    <text class="yield-desc" x="280" y="166">Words per page, and the fraction</text>
    <text class="yield-desc" x="280" y="182">that are real words.</text>
  </g>
  <line class="yield-line yield-conn yield-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#yield-tip)"/>
  <g class="yield-stage yield-s2">
    <rect class="yield-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="yield-step" x="516" y="142">03</text>
    <text class="yield-name" x="542" y="142">A near-empty result means the page was an image</text>
    <text class="yield-desc" x="516" y="166">Or the parser failed silently.</text>
  </g>
  <line class="yield-line yield-conn yield-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#yield-tip)"/>
  <g class="yield-stage yield-s3">
    <rect class="yield-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="yield-step" x="752" y="142">04</text>
    <text class="yield-name" x="778" y="142">So route it to recognition, or to review</text>
    <text class="yield-desc" x="752" y="166">Rather than indexing an empty</text>
    <text class="yield-desc" x="752" y="182">chunk.</text>
  </g>
  <text class="yield-sub" x="30" y="304">This one check catches most ingestion failures, and it costs a division: without it, a scanned appendix is indexed as nothing and never noticed.</text>
</svg>
