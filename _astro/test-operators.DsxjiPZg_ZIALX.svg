<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A classic beginner error, and it fails quietly.">
  <title>Strings and numbers do not compare the same way</title>
  <style>
    .test-operators-bg   { fill: #f8fafc; }
    .test-operators-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-operators-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-operators-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-operators-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-operators-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-operators-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .test-operators-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .test-operators-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .test-operators-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .test-operators-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .test-operators-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .test-operators-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .test-operators-row { opacity: 1; }
    .test-operators-r0 { animation-delay: 0.00s; }
    .test-operators-r1 { animation-delay: 0.45s; }
    .test-operators-r2 { animation-delay: 0.90s; }
    .test-operators-r3 { animation-delay: 1.35s; }
    .test-operators-r4 { animation-delay: 1.80s; }
    .test-operators-row { animation: test-operators-reveal 7.3s ease-in-out infinite; }
    @keyframes test-operators-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="test-operators-bg" width="980" height="390"/>
  <text class="test-operators-h1"  x="30" y="40">Strings and numbers do not compare the same way</text>
  <text class="test-operators-sub" x="30" y="64">A classic beginner error, and it fails quietly.</text>
  <rect class="test-operators-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="test-operators-name" x="46" y="122">Strings</text>
  <text class="test-operators-desc" x="46" y="142">Symbols.</text>
  <text class="test-operators-desc test-operators-row test-operators-r0" x="46" y="182">[ "$a" = "$b" ] — equal</text>
  <text class="test-operators-desc test-operators-row test-operators-r1" x="46" y="216">[ "$a" != "$b" ] — not equal</text>
  <text class="test-operators-desc test-operators-row test-operators-r2" x="46" y="250">[ -z "$s" ] — empty</text>
  <text class="test-operators-desc test-operators-row test-operators-r3" x="46" y="284">[ -n "$s" ] — non-empty</text>
  <text class="test-operators-desc test-operators-row test-operators-r4" x="46" y="318">Using -eq here is an error</text>
  <rect class="test-operators-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="test-operators-name" x="526" y="122">Numbers</text>
  <text class="test-operators-desc" x="526" y="142">Words.</text>
  <text class="test-operators-desc test-operators-row test-operators-r0" x="526" y="182">[ "$n" -eq 0 ] — equal</text>
  <text class="test-operators-desc test-operators-row test-operators-r1" x="526" y="216">[ "$n" -ne 0 ] — not equal</text>
  <text class="test-operators-desc test-operators-row test-operators-r2" x="526" y="250">[ "$n" -gt 10 ] — greater than</text>
  <text class="test-operators-desc test-operators-row test-operators-r3" x="526" y="284">[ "$n" -lt 10 ] — less than</text>
  <text class="test-operators-desc test-operators-row test-operators-r4" x="526" y="318">Using = here compares text, not value</text>
  <text class="test-operators-sub" x="30" y="372">And the file tests you will reach for constantly: -e exists, -f is a regular file, -d is a directory.</text>
</svg>
