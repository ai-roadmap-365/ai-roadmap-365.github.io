<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which is rare enough to be worth noting.">
  <title>Where size and security agree</title>
  <style>
    .ai-image-implications-bg   { fill: #f8fafc; }
    .ai-image-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ai-image-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ai-image-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ai-image-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ai-image-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ai-image-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ai-image-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ai-image-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ai-image-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ai-image-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ai-image-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ai-image-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .ai-image-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .ai-image-implications-stage { opacity: 1; }

    .ai-image-implications-s0 { animation-delay: 0.00s; }
    .ai-image-implications-e0 { animation-delay: 0.00s; }
    .ai-image-implications-s1 { animation-delay: 1.33s; }
    .ai-image-implications-e1 { animation-delay: 1.33s; }
    .ai-image-implications-s2 { animation-delay: 2.67s; }
    .ai-image-implications-e2 { animation-delay: 2.67s; }
    .ai-image-implications-s3 { animation-delay: 4.00s; }
    .ai-image-implications-e3 { animation-delay: 4.00s; }
    .ai-image-implications-s4 { animation-delay: 5.33s; }
    .ai-image-implications-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .ai-image-implications-conn  { animation: ai-image-implications-trace 8s ease-in-out infinite; }
      .ai-image-implications-stage { animation: ai-image-implications-arrive 8s ease-in-out infinite; }
    }
    @keyframes ai-image-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes ai-image-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .ai-image-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ai-image-implications-stage { animation: ai-image-implications-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes ai-image-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ai-image-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="ai-image-implications-bg" width="980" height="322"/>
  <text class="ai-image-implications-h1"  x="30" y="40">Where size and security agree</text>
  <text class="ai-image-implications-sub" x="30" y="64">Which is rare enough to be worth noting.</text>
  <g class="ai-image-implications-stage ai-image-implications-s0">
    <rect class="ai-image-implications-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="ai-image-implications-step" x="44" y="142">01</text>
    <text class="ai-image-implications-name" x="70" y="142">Build tooling is a compiler for an attacker</text>
    <text class="ai-image-implications-desc" x="44" y="166">And a slim base has fewer</text>
    <text class="ai-image-implications-desc" x="44" y="182">packages that can have</text>
    <text class="ai-image-implications-desc" x="44" y="198">CVEs.</text>
    <text class="ai-image-implications-edge" x="44" y="242">security</text>
  </g>
  <line class="ai-image-implications-line ai-image-implications-conn ai-image-implications-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#ai-image-implications-tip)"/>
  <g class="ai-image-implications-stage ai-image-implications-s1">
    <rect class="ai-image-implications-warn" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="ai-image-implications-step" x="233" y="142">02</text>
    <text class="ai-image-implications-name" x="259" y="142">A mount is an input</text>
    <text class="ai-image-implications-desc" x="233" y="166">Whatever can write to it</text>
    <text class="ai-image-implications-desc" x="233" y="182">can replace your model.</text>
    <text class="ai-image-implications-desc" x="233" y="198">Verify a checksum.</text>
    <text class="ai-image-implications-edge" x="233" y="242">supply chain</text>
  </g>
  <line class="ai-image-implications-line ai-image-implications-conn ai-image-implications-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#ai-image-implications-tip)"/>
  <g class="ai-image-implications-stage ai-image-implications-s2">
    <rect class="ai-image-implications-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="ai-image-implications-step" x="422" y="142">03</text>
    <text class="ai-image-implications-name" x="448" y="142">Weights in a public image is publication</text>
    <text class="ai-image-implications-desc" x="422" y="166">Keeping them out means an</text>
    <text class="ai-image-implications-desc" x="422" y="182">image leak is not a model</text>
    <text class="ai-image-implications-desc" x="422" y="198">leak.</text>
    <text class="ai-image-implications-edge" x="422" y="242">licensing</text>
  </g>
  <line class="ai-image-implications-line ai-image-implications-conn ai-image-implications-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#ai-image-implications-tip)"/>
  <g class="ai-image-implications-stage ai-image-implications-s3">
    <rect class="ai-image-implications-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="ai-image-implications-step" x="611" y="142">04</text>
    <text class="ai-image-implications-name" x="637" y="142">Size does not affect inference at all</text>
    <text class="ai-image-implications-desc" x="611" y="166">It affects how long a</text>
    <text class="ai-image-implications-desc" x="611" y="182">node waits before it can</text>
    <text class="ai-image-implications-desc" x="611" y="198">serve.</text>
    <text class="ai-image-implications-edge" x="611" y="242">performance</text>
  </g>
  <line class="ai-image-implications-line ai-image-implications-conn ai-image-implications-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#ai-image-implications-tip)"/>
  <g class="ai-image-implications-stage ai-image-implications-s4">
    <rect class="ai-image-implications-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="ai-image-implications-step" x="800" y="142">05</text>
    <text class="ai-image-implications-name" x="826" y="142">Egress is billed per gigabyte</text>
    <text class="ai-image-implications-desc" x="800" y="166">420 GB per rollout, on</text>
    <text class="ai-image-implications-desc" x="800" y="182">most providers.</text>
    <text class="ai-image-implications-edge" x="800" y="242">money</text>
  </g>
  <text class="ai-image-implications-sub" x="30" y="304">Most vulnerabilities reported against an application image are in components it never calls, which is why a slim base reduces the CVE count far faster than it reduces the megabytes.</text>
</svg>
