<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One of them is tested.">
  <title>A recipe, or a tasted dish</title>
  <style>
    .restaurant-bg   { fill: #f8fafc; }
    .restaurant-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .restaurant-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .restaurant-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .restaurant-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .restaurant-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .restaurant-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .restaurant-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .restaurant-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .restaurant-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .restaurant-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .restaurant-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .restaurant-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .restaurant-row { opacity: 1; }
    .restaurant-r0 { animation-delay: 0.00s; }
    .restaurant-r1 { animation-delay: 0.45s; }
    .restaurant-r2 { animation-delay: 0.90s; }
    .restaurant-r3 { animation-delay: 1.35s; }
    .restaurant-r4 { animation-delay: 1.80s; }
    .restaurant-row { animation: restaurant-reveal 7.3s ease-in-out infinite; }
    @keyframes restaurant-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="restaurant-bg" width="980" height="390"/>
  <text class="restaurant-h1"  x="30" y="40">A recipe, or a tasted dish</text>
  <text class="restaurant-sub" x="30" y="64">One of them is tested.</text>
  <rect class="restaurant-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="restaurant-name" x="46" y="122">Written and never tasted</text>
  <text class="restaurant-desc" x="46" y="142">Assumed correct.</text>
  <text class="restaurant-desc restaurant-row restaurant-r0" x="46" y="182">The recipe looks right on paper</text>
  <text class="restaurant-desc restaurant-row restaurant-r1" x="46" y="216">Ingredients change without notice</text>
  <text class="restaurant-desc restaurant-row restaurant-r2" x="46" y="250">Nobody checks before serving</text>
  <text class="restaurant-desc restaurant-row restaurant-r3" x="46" y="284">Complaints are the first signal</text>
  <text class="restaurant-desc restaurant-row restaurant-r4" x="46" y="318">This is an untested prompt</text>
  <rect class="restaurant-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="restaurant-name" x="526" y="122">Tasted every service</text>
  <text class="restaurant-desc" x="526" y="142">Verified correct.</text>
  <text class="restaurant-desc restaurant-row restaurant-r0" x="526" y="182">Checked against a known standard</text>
  <text class="restaurant-desc restaurant-row restaurant-r1" x="526" y="216">Ingredient changes caught immediately</text>
  <text class="restaurant-desc restaurant-row restaurant-r2" x="526" y="250">Checked before it leaves the kitchen</text>
  <text class="restaurant-desc restaurant-row restaurant-r3" x="526" y="284">Problems found before the customer</text>
  <text class="restaurant-desc restaurant-row restaurant-r4" x="526" y="318">This is a tested prompt library</text>
  <text class="restaurant-sub" x="30" y="372">Ingredients changing without notice is the closest part of the analogy: a model update changes the ingredient underneath an unchanged recipe.</text>
</svg>
