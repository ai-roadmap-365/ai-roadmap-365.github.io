<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What metric choice is not</title>
  <style>
    .metric-not-bg   { fill: #f8fafc; }
    .metric-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .metric-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .metric-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .metric-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .metric-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .metric-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .metric-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .metric-not-row { opacity: 1; }
    .metric-not-r0 { animation-delay: 0.00s; }
    .metric-not-r1 { animation-delay: 0.45s; }
    .metric-not-r2 { animation-delay: 0.90s; }
    .metric-not-r3 { animation-delay: 1.35s; }
    .metric-not-r4 { animation-delay: 1.80s; }
    .metric-not-row { animation: metric-not-reveal 7.3s ease-in-out infinite; }
    @keyframes metric-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="metric-not-bg" width="980" height="390"/>
  <text class="metric-not-h1"  x="30" y="40">What metric choice is not</text>
  <text class="metric-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="metric-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="metric-not-name" x="46" y="122">The misconception</text>
  <text class="metric-not-desc" x="46" y="142">Commonly held.</text>
  <text class="metric-not-desc metric-not-row metric-not-r0" x="46" y="182">The library default is a reasonable choice</text>
  <text class="metric-not-desc metric-not-row metric-not-r1" x="46" y="216">One metric can serve every stakeholder</text>
  <text class="metric-not-desc metric-not-row metric-not-r2" x="46" y="250">Metrics are comparable across datasets</text>
  <text class="metric-not-desc metric-not-row metric-not-r3" x="46" y="284">A higher score is always better</text>
  <text class="metric-not-desc metric-not-row metric-not-r4" x="46" y="318">The training loss and the metric should match</text>
  <rect class="metric-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="metric-not-name" x="526" y="122">What is true</text>
  <text class="metric-not-desc" x="526" y="142">Actually.</text>
  <text class="metric-not-desc metric-not-row metric-not-r0" x="526" y="182">It reflects a convention, not your problem</text>
  <text class="metric-not-desc metric-not-row metric-not-r1" x="526" y="216">Different stakeholders need different views</text>
  <text class="metric-not-desc metric-not-row metric-not-r2" x="526" y="250">Only within the same class balance</text>
  <text class="metric-not-desc metric-not-row metric-not-r3" x="526" y="284">Better on this metric, at this threshold</text>
  <text class="metric-not-desc metric-not-row metric-not-r4" x="526" y="318">They serve different purposes and rarely match</text>
  <text class="metric-not-sub" x="30" y="372">Different stakeholders needing different views is worth accommodating explicitly: an operations team and a finance team are asking genuinely different questions.</text>
</svg>
