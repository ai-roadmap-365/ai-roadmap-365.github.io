<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The margin idea</title>
  <style>
    .svm-idea-bg   { fill: #f8fafc; }
    .svm-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .svm-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .svm-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .svm-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .svm-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .svm-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .svm-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .svm-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .svm-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .svm-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .svm-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .svm-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .svm-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .svm-idea-stage { opacity: 1; }

    .svm-idea-s0 { animation-delay: 0.00s; }
    .svm-idea-e0 { animation-delay: 0.00s; }
    .svm-idea-s1 { animation-delay: 1.28s; }
    .svm-idea-e1 { animation-delay: 1.28s; }
    .svm-idea-s2 { animation-delay: 2.56s; }
    .svm-idea-e2 { animation-delay: 2.56s; }
    .svm-idea-s3 { animation-delay: 3.84s; }
    .svm-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .svm-idea-conn  { animation: svm-idea-trace 6.4s ease-in-out infinite; }
      .svm-idea-stage { animation: svm-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes svm-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes svm-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .svm-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .svm-idea-stage { animation: svm-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes svm-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="svm-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="svm-idea-bg" width="980" height="322"/>
  <text class="svm-idea-h1"  x="30" y="40">The margin idea</text>
  <text class="svm-idea-sub" x="30" y="64">Four steps.</text>
  <g class="svm-idea-stage svm-idea-s0">
    <rect class="svm-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="svm-idea-step" x="44" y="142">01</text>
    <text class="svm-idea-name" x="70" y="142">Many boundaries separate the data perfectly</text>
    <text class="svm-idea-desc" x="44" y="166">All correct on the training set.</text>
  </g>
  <line class="svm-idea-line svm-idea-conn svm-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#svm-idea-tip)"/>
  <g class="svm-idea-stage svm-idea-s1">
    <rect class="svm-idea-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="svm-idea-step" x="280" y="142">02</text>
    <text class="svm-idea-name" x="306" y="142">But some pass very close to points</text>
    <text class="svm-idea-desc" x="280" y="166">And would misclassify a slight</text>
    <text class="svm-idea-desc" x="280" y="182">variation.</text>
  </g>
  <line class="svm-idea-line svm-idea-conn svm-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#svm-idea-tip)"/>
  <g class="svm-idea-stage svm-idea-s2">
    <rect class="svm-idea-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="svm-idea-step" x="516" y="142">03</text>
    <text class="svm-idea-name" x="542" y="142">So choose the one with the widest empty corridor</text>
    <text class="svm-idea-desc" x="516" y="166">Which is unique, and most</text>
    <text class="svm-idea-desc" x="516" y="182">robust.</text>
  </g>
  <line class="svm-idea-line svm-idea-conn svm-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#svm-idea-tip)"/>
  <g class="svm-idea-stage svm-idea-s3">
    <rect class="svm-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="svm-idea-step" x="752" y="142">04</text>
    <text class="svm-idea-name" x="778" y="142">Determined entirely by the closest points</text>
    <text class="svm-idea-desc" x="752" y="166">The support vectors. The rest</text>
    <text class="svm-idea-desc" x="752" y="182">are irrelevant.</text>
    <text class="svm-idea-edge" x="752" y="242">a few points</text>
  </g>
  <text class="svm-idea-sub" x="30" y="304">The boundary depending only on the nearest few points is both the method's elegance and its fragility: those few points carry the entire decision.</text>
</svg>
