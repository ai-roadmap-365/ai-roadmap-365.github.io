<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five stages, one command.">
  <title>The harness, end to end</title>
  <style>
    .harness-pipeline-bg   { fill: #f8fafc; }
    .harness-pipeline-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-pipeline-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-pipeline-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-pipeline-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-pipeline-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-pipeline-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .harness-pipeline-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .harness-pipeline-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .harness-pipeline-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .harness-pipeline-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .harness-pipeline-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .harness-pipeline-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .harness-pipeline-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .harness-pipeline-stage { opacity: 1; }

    .harness-pipeline-s0 { animation-delay: 0.00s; }
    .harness-pipeline-e0 { animation-delay: 0.00s; }
    .harness-pipeline-s1 { animation-delay: 1.33s; }
    .harness-pipeline-e1 { animation-delay: 1.33s; }
    .harness-pipeline-s2 { animation-delay: 2.67s; }
    .harness-pipeline-e2 { animation-delay: 2.67s; }
    .harness-pipeline-s3 { animation-delay: 4.00s; }
    .harness-pipeline-e3 { animation-delay: 4.00s; }
    .harness-pipeline-s4 { animation-delay: 5.33s; }
    .harness-pipeline-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .harness-pipeline-conn  { animation: harness-pipeline-trace 8s ease-in-out infinite; }
      .harness-pipeline-stage { animation: harness-pipeline-arrive 8s ease-in-out infinite; }
    }
    @keyframes harness-pipeline-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes harness-pipeline-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .harness-pipeline-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .harness-pipeline-stage { animation: harness-pipeline-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes harness-pipeline-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="harness-pipeline-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="harness-pipeline-bg" width="980" height="322"/>
  <text class="harness-pipeline-h1"  x="30" y="40">The harness, end to end</text>
  <text class="harness-pipeline-sub" x="30" y="64">Five stages, one command.</text>
  <g class="harness-pipeline-stage harness-pipeline-s0">
    <rect class="harness-pipeline-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="harness-pipeline-step" x="44" y="142">01</text>
    <text class="harness-pipeline-name" x="70" y="142">Load the versioned dataset</text>
    <text class="harness-pipeline-desc" x="44" y="166">Stratified JSONL,</text>
    <text class="harness-pipeline-desc" x="44" y="182">streamed.</text>
  </g>
  <line class="harness-pipeline-line harness-pipeline-conn harness-pipeline-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#harness-pipeline-tip)"/>
  <g class="harness-pipeline-stage harness-pipeline-s1">
    <rect class="harness-pipeline-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="harness-pipeline-step" x="233" y="142">02</text>
    <text class="harness-pipeline-name" x="259" y="142">Execute concurrently</text>
    <text class="harness-pipeline-desc" x="233" y="166">A semaphore pool with</text>
    <text class="harness-pipeline-desc" x="233" y="182">rate limiting. Minutes,</text>
    <text class="harness-pipeline-desc" x="233" y="198">not hours.</text>
    <text class="harness-pipeline-edge" x="233" y="242">async</text>
  </g>
  <line class="harness-pipeline-line harness-pipeline-conn harness-pipeline-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#harness-pipeline-tip)"/>
  <g class="harness-pipeline-stage harness-pipeline-s2">
    <rect class="harness-pipeline-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="harness-pipeline-step" x="422" y="142">03</text>
    <text class="harness-pipeline-name" x="448" y="142">Score across metrics</text>
    <text class="harness-pipeline-desc" x="422" y="166">Exact match, schema F1,</text>
    <text class="harness-pipeline-desc" x="422" y="182">and a calibrated judge.</text>
  </g>
  <line class="harness-pipeline-line harness-pipeline-conn harness-pipeline-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#harness-pipeline-tip)"/>
  <g class="harness-pipeline-stage harness-pipeline-s3">
    <rect class="harness-pipeline-warn" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="harness-pipeline-step" x="611" y="142">04</text>
    <text class="harness-pipeline-name" x="637" y="142">Gate against the baseline</text>
    <text class="harness-pipeline-desc" x="611" y="166">Tolerance on the</text>
    <text class="harness-pipeline-desc" x="611" y="182">composite; 100% on</text>
    <text class="harness-pipeline-desc" x="611" y="198">invariants.</text>
  </g>
  <line class="harness-pipeline-line harness-pipeline-conn harness-pipeline-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#harness-pipeline-tip)"/>
  <g class="harness-pipeline-stage harness-pipeline-s4">
    <rect class="harness-pipeline-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="harness-pipeline-step" x="800" y="142">05</text>
    <text class="harness-pipeline-name" x="826" y="142">Report</text>
    <text class="harness-pipeline-desc" x="800" y="166">A markdown diff, posted</text>
    <text class="harness-pipeline-desc" x="800" y="182">into the pull request.</text>
  </g>
  <text class="harness-pipeline-sub" x="30" y="304">One command is the design goal that matters: a harness that requires several steps and a notebook gets run before releases, and one that is a single CLI call gets run on every change.</text>
</svg>
