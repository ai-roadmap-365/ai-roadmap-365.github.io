<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four reasons, handled differently.">
  <title>Why generation stopped</title>
  <style>
    .stop-reasons-bg   { fill: #f8fafc; }
    .stop-reasons-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stop-reasons-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stop-reasons-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stop-reasons-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stop-reasons-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stop-reasons-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stop-reasons-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stop-reasons-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stop-reasons-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stop-reasons-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stop-reasons-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stop-reasons-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .stop-reasons-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .stop-reasons-stage { opacity: 1; }

    .stop-reasons-s0 { animation-delay: 0.00s; }
    .stop-reasons-e0 { animation-delay: 0.00s; }
    .stop-reasons-s1 { animation-delay: 1.28s; }
    .stop-reasons-e1 { animation-delay: 1.28s; }
    .stop-reasons-s2 { animation-delay: 2.56s; }
    .stop-reasons-e2 { animation-delay: 2.56s; }
    .stop-reasons-s3 { animation-delay: 3.84s; }
    .stop-reasons-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .stop-reasons-conn  { animation: stop-reasons-trace 6.4s ease-in-out infinite; }
      .stop-reasons-stage { animation: stop-reasons-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes stop-reasons-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes stop-reasons-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .stop-reasons-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .stop-reasons-stage { animation: stop-reasons-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes stop-reasons-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="stop-reasons-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="stop-reasons-bg" width="980" height="322"/>
  <text class="stop-reasons-h1"  x="30" y="40">Why generation stopped</text>
  <text class="stop-reasons-sub" x="30" y="64">Four reasons, handled differently.</text>
  <g class="stop-reasons-stage stop-reasons-s0">
    <rect class="stop-reasons-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="stop-reasons-step" x="44" y="142">01</text>
    <text class="stop-reasons-name" x="70" y="142">The model finished</text>
    <text class="stop-reasons-desc" x="44" y="166">The normal case. The response is</text>
    <text class="stop-reasons-desc" x="44" y="182">complete.</text>
  </g>
  <line class="stop-reasons-line stop-reasons-conn stop-reasons-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#stop-reasons-tip)"/>
  <g class="stop-reasons-stage stop-reasons-s1">
    <rect class="stop-reasons-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="stop-reasons-step" x="280" y="142">02</text>
    <text class="stop-reasons-name" x="306" y="142">It hit the output limit</text>
    <text class="stop-reasons-desc" x="280" y="166">The response is truncated. Do</text>
    <text class="stop-reasons-desc" x="280" y="182">not parse it as complete.</text>
  </g>
  <line class="stop-reasons-line stop-reasons-conn stop-reasons-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#stop-reasons-tip)"/>
  <g class="stop-reasons-stage stop-reasons-s2">
    <rect class="stop-reasons-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="stop-reasons-step" x="516" y="142">03</text>
    <text class="stop-reasons-name" x="542" y="142">It matched a stop sequence</text>
    <text class="stop-reasons-desc" x="516" y="166">Which you supplied. Also</text>
    <text class="stop-reasons-desc" x="516" y="182">complete, by your definition.</text>
  </g>
  <line class="stop-reasons-line stop-reasons-conn stop-reasons-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#stop-reasons-tip)"/>
  <g class="stop-reasons-stage stop-reasons-s3">
    <rect class="stop-reasons-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="stop-reasons-step" x="752" y="142">04</text>
    <text class="stop-reasons-name" x="778" y="142">Or it is requesting a tool</text>
    <text class="stop-reasons-desc" x="752" y="166">Which is a turn in a loop, not</text>
    <text class="stop-reasons-desc" x="752" y="182">an answer.</text>
  </g>
  <text class="stop-reasons-sub" x="30" y="304">Ignoring the stop reason and parsing a truncated response as though it were complete is one of the most common integration bugs, and it fails silently.</text>
</svg>
