<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Where a double belongs</title>
  <style>
    .mock-boundary-bg   { fill: #f8fafc; }
    .mock-boundary-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mock-boundary-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mock-boundary-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mock-boundary-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mock-boundary-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mock-boundary-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mock-boundary-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mock-boundary-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mock-boundary-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mock-boundary-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mock-boundary-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mock-boundary-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .mock-boundary-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .mock-boundary-stage { opacity: 1; }

    .mock-boundary-s0 { animation-delay: 0.00s; }
    .mock-boundary-e0 { animation-delay: 0.00s; }
    .mock-boundary-s1 { animation-delay: 1.28s; }
    .mock-boundary-e1 { animation-delay: 1.28s; }
    .mock-boundary-s2 { animation-delay: 2.56s; }
    .mock-boundary-e2 { animation-delay: 2.56s; }
    .mock-boundary-s3 { animation-delay: 3.84s; }
    .mock-boundary-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .mock-boundary-conn  { animation: mock-boundary-trace 6.4s ease-in-out infinite; }
      .mock-boundary-stage { animation: mock-boundary-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes mock-boundary-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes mock-boundary-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .mock-boundary-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .mock-boundary-stage { animation: mock-boundary-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes mock-boundary-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="mock-boundary-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="mock-boundary-bg" width="980" height="322"/>
  <text class="mock-boundary-h1"  x="30" y="40">Where a double belongs</text>
  <text class="mock-boundary-sub" x="30" y="64">Four steps.</text>
  <g class="mock-boundary-stage mock-boundary-s0">
    <rect class="mock-boundary-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="mock-boundary-step" x="44" y="142">01</text>
    <text class="mock-boundary-name" x="70" y="142">Replace things outside your control</text>
    <text class="mock-boundary-desc" x="44" y="166">Networks, clocks, filesystems,</text>
    <text class="mock-boundary-desc" x="44" y="182">paid APIs.</text>
  </g>
  <line class="mock-boundary-line mock-boundary-conn mock-boundary-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#mock-boundary-tip)"/>
  <g class="mock-boundary-stage mock-boundary-s1">
    <rect class="mock-boundary-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="mock-boundary-step" x="280" y="142">02</text>
    <text class="mock-boundary-name" x="306" y="142">Because they are slow, costly or non-deterministic</text>
    <text class="mock-boundary-desc" x="280" y="166">Which makes tests unreliable.</text>
  </g>
  <line class="mock-boundary-line mock-boundary-conn mock-boundary-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#mock-boundary-tip)"/>
  <g class="mock-boundary-stage mock-boundary-s2">
    <rect class="mock-boundary-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="mock-boundary-step" x="516" y="142">03</text>
    <text class="mock-boundary-name" x="542" y="142">Never replace the logic under test</text>
    <text class="mock-boundary-desc" x="516" y="166">Or you are testing the double.</text>
  </g>
  <line class="mock-boundary-line mock-boundary-conn mock-boundary-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#mock-boundary-tip)"/>
  <g class="mock-boundary-stage mock-boundary-s3">
    <rect class="mock-boundary-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="mock-boundary-step" x="752" y="142">04</text>
    <text class="mock-boundary-name" x="778" y="142">So doubles live at the edges, not the interior</text>
    <text class="mock-boundary-desc" x="752" y="166">Which follows from the</text>
    <text class="mock-boundary-desc" x="752" y="182">functional-core pattern.</text>
  </g>
  <text class="mock-boundary-sub" x="30" y="304">A test that mocks the thing it is supposed to be checking passes regardless of whether the code works, which is the failure mode this rule prevents.</text>
</svg>
