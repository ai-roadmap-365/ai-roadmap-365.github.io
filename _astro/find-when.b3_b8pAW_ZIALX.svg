<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the need.">
  <title>Which source when</title>
  <style>
    .find-when-bg   { fill: #f8fafc; }
    .find-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .find-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .find-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .find-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .find-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .find-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .find-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .find-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .find-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .find-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .find-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .find-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .find-when-row { opacity: 1; }
    .find-when-r0 { animation-delay: 0.00s; }
    .find-when-r1 { animation-delay: 0.45s; }
    .find-when-r2 { animation-delay: 0.90s; }
    .find-when-r3 { animation-delay: 1.35s; }
    .find-when-r4 { animation-delay: 1.80s; }
    .find-when-row { animation: find-when-reveal 7.3s ease-in-out infinite; }
    @keyframes find-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="find-when-bg" width="980" height="390"/>
  <text class="find-when-h1"  x="30" y="40">Which source when</text>
  <text class="find-when-sub" x="30" y="64">By the need.</text>
  <rect class="find-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="find-when-name" x="46" y="122">The requirement</text>
  <text class="find-when-desc" x="46" y="142">What you need.</text>
  <text class="find-when-desc find-when-row find-when-r0" x="46" y="182">A well-documented reference dataset</text>
  <text class="find-when-desc find-when-row find-when-r1" x="46" y="216">Live, current values</text>
  <text class="find-when-desc find-when-row find-when-r2" x="46" y="250">Data specific to your organisation</text>
  <text class="find-when-desc find-when-row find-when-r3" x="46" y="284">Something nobody publishes</text>
  <text class="find-when-desc find-when-row find-when-r4" x="46" y="318">Training data for a model</text>
  <rect class="find-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="find-when-name" x="526" y="122">The source</text>
  <text class="find-when-desc" x="526" y="142">Where to look.</text>
  <text class="find-when-desc find-when-row find-when-r0" x="526" y="182">An official statistical publication</text>
  <text class="find-when-desc find-when-row find-when-r1" x="526" y="216">A provider's interface</text>
  <text class="find-when-desc find-when-row find-when-r2" x="526" y="250">Internal systems, with governance</text>
  <text class="find-when-desc find-when-row find-when-r3" x="526" y="284">Collect it yourself, or scrape carefully</text>
  <text class="find-when-desc find-when-row find-when-r4" x="526" y="318">Licensed corpora with clear provenance</text>
  <text class="find-when-sub" x="30" y="372">Collecting it yourself is underrated for narrow questions, since a small purpose-built dataset often beats a large one collected for something else.</text>
</svg>
