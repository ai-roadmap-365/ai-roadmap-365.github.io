<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Setting the leaf values</title>
  <style>
    .newton-leaf-bg   { fill: #f8fafc; }
    .newton-leaf-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .newton-leaf-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .newton-leaf-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .newton-leaf-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .newton-leaf-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .newton-leaf-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .newton-leaf-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .newton-leaf-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .newton-leaf-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .newton-leaf-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .newton-leaf-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .newton-leaf-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .newton-leaf-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .newton-leaf-stage { opacity: 1; }

    .newton-leaf-s0 { animation-delay: 0.00s; }
    .newton-leaf-e0 { animation-delay: 0.00s; }
    .newton-leaf-s1 { animation-delay: 1.28s; }
    .newton-leaf-e1 { animation-delay: 1.28s; }
    .newton-leaf-s2 { animation-delay: 2.56s; }
    .newton-leaf-e2 { animation-delay: 2.56s; }
    .newton-leaf-s3 { animation-delay: 3.84s; }
    .newton-leaf-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .newton-leaf-conn  { animation: newton-leaf-trace 6.4s ease-in-out infinite; }
      .newton-leaf-stage { animation: newton-leaf-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes newton-leaf-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes newton-leaf-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .newton-leaf-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .newton-leaf-stage { animation: newton-leaf-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes newton-leaf-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="newton-leaf-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="newton-leaf-bg" width="980" height="322"/>
  <text class="newton-leaf-h1"  x="30" y="40">Setting the leaf values</text>
  <text class="newton-leaf-sub" x="30" y="64">Four steps.</text>
  <g class="newton-leaf-stage newton-leaf-s0">
    <rect class="newton-leaf-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="newton-leaf-step" x="44" y="142">01</text>
    <text class="newton-leaf-name" x="70" y="142">The tree structure is chosen by the gradients</text>
    <text class="newton-leaf-desc" x="44" y="166">Which decides who goes where.</text>
  </g>
  <line class="newton-leaf-line newton-leaf-conn newton-leaf-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#newton-leaf-tip)"/>
  <g class="newton-leaf-stage newton-leaf-s1">
    <rect class="newton-leaf-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="newton-leaf-step" x="280" y="142">02</text>
    <text class="newton-leaf-name" x="306" y="142">A first-order fit sets each leaf to the mean residual</text>
    <text class="newton-leaf-desc" x="280" y="166">Which is adequate for squared</text>
    <text class="newton-leaf-desc" x="280" y="182">error only.</text>
  </g>
  <line class="newton-leaf-line newton-leaf-conn newton-leaf-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#newton-leaf-tip)"/>
  <g class="newton-leaf-stage newton-leaf-s2">
    <rect class="newton-leaf-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="newton-leaf-step" x="516" y="142">03</text>
    <text class="newton-leaf-name" x="542" y="142">Using the curvature as well gives a better value</text>
    <text class="newton-leaf-desc" x="516" y="166">Dividing gradient by second</text>
    <text class="newton-leaf-desc" x="516" y="182">derivative.</text>
  </g>
  <line class="newton-leaf-line newton-leaf-conn newton-leaf-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#newton-leaf-tip)"/>
  <g class="newton-leaf-stage newton-leaf-s3">
    <rect class="newton-leaf-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="newton-leaf-step" x="752" y="142">04</text>
    <text class="newton-leaf-name" x="778" y="142">Which converges in fewer trees</text>
    <text class="newton-leaf-desc" x="752" y="166">For the same accuracy.</text>
    <text class="newton-leaf-edge" x="752" y="242">fewer rounds</text>
  </g>
  <text class="newton-leaf-sub" x="30" y="304">Using curvature is the mathematical difference between classical boosting and the modern libraries, and it shows up directly as fewer trees needed.</text>
</svg>
