<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Three ways to prepare someone.">
  <title>Instructions, a reference shelf, or training</title>
  <style>
    .tools-workshop-bg   { fill: #f8fafc; }
    .tools-workshop-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tools-workshop-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tools-workshop-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tools-workshop-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tools-workshop-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tools-workshop-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tools-workshop-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tools-workshop-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tools-workshop-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tools-workshop-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tools-workshop-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tools-workshop-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tools-workshop-row { opacity: 1; }
    .tools-workshop-r0 { animation-delay: 0.00s; }
    .tools-workshop-r1 { animation-delay: 0.45s; }
    .tools-workshop-r2 { animation-delay: 0.90s; }
    .tools-workshop-r3 { animation-delay: 1.35s; }
    .tools-workshop-r4 { animation-delay: 1.80s; }
    .tools-workshop-row { animation: tools-workshop-reveal 7.3s ease-in-out infinite; }
    @keyframes tools-workshop-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tools-workshop-bg" width="980" height="390"/>
  <text class="tools-workshop-h1"  x="30" y="40">Instructions, a reference shelf, or training</text>
  <text class="tools-workshop-sub" x="30" y="64">Three ways to prepare someone.</text>
  <rect class="tools-workshop-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tools-workshop-name" x="46" y="122">Instructions and references</text>
  <text class="tools-workshop-desc" x="46" y="142">Supplied each time.</text>
  <text class="tools-workshop-desc tools-workshop-row tools-workshop-r0" x="46" y="182">Handed over with every task</text>
  <text class="tools-workshop-desc tools-workshop-row tools-workshop-r1" x="46" y="216">Updated by rewriting them</text>
  <text class="tools-workshop-desc tools-workshop-row tools-workshop-r2" x="46" y="250">Nothing learned permanently</text>
  <text class="tools-workshop-desc tools-workshop-row tools-workshop-r3" x="46" y="284">Immediate, and repeated</text>
  <text class="tools-workshop-desc tools-workshop-row tools-workshop-r4" x="46" y="318">This is prompting and retrieval</text>
  <rect class="tools-workshop-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tools-workshop-name" x="526" y="122">Training</text>
  <text class="tools-workshop-desc" x="526" y="142">Changes the person.</text>
  <text class="tools-workshop-desc tools-workshop-row tools-workshop-r0" x="526" y="182">Done once, in advance</text>
  <text class="tools-workshop-desc tools-workshop-row tools-workshop-r1" x="526" y="216">Updated by retraining</text>
  <text class="tools-workshop-desc tools-workshop-row tools-workshop-r2" x="526" y="250">Becomes habit and instinct</text>
  <text class="tools-workshop-desc tools-workshop-row tools-workshop-r3" x="526" y="284">Slow to start, then free</text>
  <text class="tools-workshop-desc tools-workshop-row tools-workshop-r4" x="526" y="318">This is fine-tuning</text>
  <text class="tools-workshop-sub" x="30" y="372">Nobody trains an employee to memorise a price list that changes weekly, and the same reasoning rules out fine-tuning for volatile facts.</text>
</svg>
