<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The kernel trick</title>
  <style>
    .kernel-trick-bg   { fill: #f8fafc; }
    .kernel-trick-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kernel-trick-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kernel-trick-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kernel-trick-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kernel-trick-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kernel-trick-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kernel-trick-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .kernel-trick-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .kernel-trick-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .kernel-trick-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .kernel-trick-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .kernel-trick-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .kernel-trick-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .kernel-trick-stage { opacity: 1; }

    .kernel-trick-s0 { animation-delay: 0.00s; }
    .kernel-trick-e0 { animation-delay: 0.00s; }
    .kernel-trick-s1 { animation-delay: 1.28s; }
    .kernel-trick-e1 { animation-delay: 1.28s; }
    .kernel-trick-s2 { animation-delay: 2.56s; }
    .kernel-trick-e2 { animation-delay: 2.56s; }
    .kernel-trick-s3 { animation-delay: 3.84s; }
    .kernel-trick-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .kernel-trick-conn  { animation: kernel-trick-trace 6.4s ease-in-out infinite; }
      .kernel-trick-stage { animation: kernel-trick-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes kernel-trick-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes kernel-trick-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .kernel-trick-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .kernel-trick-stage { animation: kernel-trick-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes kernel-trick-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="kernel-trick-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="kernel-trick-bg" width="980" height="322"/>
  <text class="kernel-trick-h1"  x="30" y="40">The kernel trick</text>
  <text class="kernel-trick-sub" x="30" y="64">Four steps.</text>
  <g class="kernel-trick-stage kernel-trick-s0">
    <rect class="kernel-trick-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="kernel-trick-step" x="44" y="142">01</text>
    <text class="kernel-trick-name" x="70" y="142">Non-linear boundaries need a high-dimensional mapping</text>
    <text class="kernel-trick-desc" x="44" y="166">Which can be enormous or</text>
    <text class="kernel-trick-desc" x="44" y="182">infinite.</text>
  </g>
  <line class="kernel-trick-line kernel-trick-conn kernel-trick-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#kernel-trick-tip)"/>
  <g class="kernel-trick-stage kernel-trick-s1">
    <rect class="kernel-trick-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="kernel-trick-step" x="280" y="142">02</text>
    <text class="kernel-trick-name" x="306" y="142">Computing it explicitly is impossible</text>
    <text class="kernel-trick-desc" x="280" y="166">For anything beyond a few</text>
    <text class="kernel-trick-desc" x="280" y="182">dimensions.</text>
  </g>
  <line class="kernel-trick-line kernel-trick-conn kernel-trick-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#kernel-trick-tip)"/>
  <g class="kernel-trick-stage kernel-trick-s2">
    <rect class="kernel-trick-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="kernel-trick-step" x="516" y="142">03</text>
    <text class="kernel-trick-name" x="542" y="142">But only dot products in that space are needed</text>
    <text class="kernel-trick-desc" x="516" y="166">And a kernel computes those</text>
    <text class="kernel-trick-desc" x="516" y="182">directly.</text>
  </g>
  <line class="kernel-trick-line kernel-trick-conn kernel-trick-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#kernel-trick-tip)"/>
  <g class="kernel-trick-stage kernel-trick-s3">
    <rect class="kernel-trick-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="kernel-trick-step" x="752" y="142">04</text>
    <text class="kernel-trick-name" x="778" y="142">Provided the kernel satisfies a positivity condition</text>
    <text class="kernel-trick-desc" x="752" y="166">Which guarantees a valid space</text>
    <text class="kernel-trick-desc" x="752" y="182">exists.</text>
  </g>
  <text class="kernel-trick-sub" x="30" y="304">Working in an infinite-dimensional space at finite cost is a genuinely surprising result, and the condition on the kernel is what makes it rigorous rather than a trick.</text>
</svg>
