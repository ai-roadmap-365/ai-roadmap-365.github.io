<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>How diffusion works</title>
  <style>
    .diffusion-idea-bg   { fill: #f8fafc; }
    .diffusion-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diffusion-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diffusion-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diffusion-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diffusion-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diffusion-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .diffusion-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .diffusion-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .diffusion-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .diffusion-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .diffusion-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .diffusion-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .diffusion-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .diffusion-idea-stage { opacity: 1; }

    .diffusion-idea-s0 { animation-delay: 0.00s; }
    .diffusion-idea-e0 { animation-delay: 0.00s; }
    .diffusion-idea-s1 { animation-delay: 1.28s; }
    .diffusion-idea-e1 { animation-delay: 1.28s; }
    .diffusion-idea-s2 { animation-delay: 2.56s; }
    .diffusion-idea-e2 { animation-delay: 2.56s; }
    .diffusion-idea-s3 { animation-delay: 3.84s; }
    .diffusion-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .diffusion-idea-conn  { animation: diffusion-idea-trace 6.4s ease-in-out infinite; }
      .diffusion-idea-stage { animation: diffusion-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes diffusion-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes diffusion-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .diffusion-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .diffusion-idea-stage { animation: diffusion-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes diffusion-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="diffusion-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="diffusion-idea-bg" width="980" height="322"/>
  <text class="diffusion-idea-h1"  x="30" y="40">How diffusion works</text>
  <text class="diffusion-idea-sub" x="30" y="64">Four steps.</text>
  <g class="diffusion-idea-stage diffusion-idea-s0">
    <rect class="diffusion-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="diffusion-idea-step" x="44" y="142">01</text>
    <text class="diffusion-idea-name" x="70" y="142">Take an image and add noise, repeatedly</text>
    <text class="diffusion-idea-desc" x="44" y="166">Until nothing of it remains.</text>
  </g>
  <line class="diffusion-idea-line diffusion-idea-conn diffusion-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#diffusion-idea-tip)"/>
  <g class="diffusion-idea-stage diffusion-idea-s1">
    <rect class="diffusion-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="diffusion-idea-step" x="280" y="142">02</text>
    <text class="diffusion-idea-name" x="306" y="142">Train a model to predict the noise that was added</text>
    <text class="diffusion-idea-desc" x="280" y="166">At any step. That is the whole</text>
    <text class="diffusion-idea-desc" x="280" y="182">objective.</text>
  </g>
  <line class="diffusion-idea-line diffusion-idea-conn diffusion-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#diffusion-idea-tip)"/>
  <g class="diffusion-idea-stage diffusion-idea-s2">
    <rect class="diffusion-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="diffusion-idea-step" x="516" y="142">03</text>
    <text class="diffusion-idea-name" x="542" y="142">Then start from pure noise and remove it, step by step</text>
    <text class="diffusion-idea-desc" x="516" y="166">Producing an image that was</text>
    <text class="diffusion-idea-desc" x="516" y="182">never there.</text>
  </g>
  <line class="diffusion-idea-line diffusion-idea-conn diffusion-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#diffusion-idea-tip)"/>
  <g class="diffusion-idea-stage diffusion-idea-s3">
    <rect class="diffusion-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="diffusion-idea-step" x="752" y="142">04</text>
    <text class="diffusion-idea-name" x="778" y="142">Steered by a text condition throughout</text>
    <text class="diffusion-idea-desc" x="752" y="166">Which decides what emerges.</text>
    <text class="diffusion-idea-edge" x="752" y="242">20-50 steps</text>
  </g>
  <text class="diffusion-idea-sub" x="30" y="304">Training on destruction and generating by reversing it is the inversion worth holding onto: the model never learns to draw, only to recognise and remove noise.</text>
</svg>
