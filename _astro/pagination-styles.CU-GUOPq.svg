<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" font-family="system-ui, sans-serif">
  <title>Offset pagination versus cursor pagination: offset asks for a page number and can skip or repeat rows when data shifts, while a cursor points at the last row seen and stays stable</title>
  <rect x="0" y="0" width="760" height="500" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Two ways to walk a large result set</text>

  <!-- Offset column -->
  <rect x="30" y="56" width="340" height="410" fill="#eef2ff" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="200" y="84" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d4ed8">Offset / limit (page number)</text>

  <rect x="55" y="100" width="290" height="40" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="200" y="125" text-anchor="middle" font-size="13" fill="#1a202c">GET /posts?_page=1&amp;_limit=5</text>
  <rect x="80" y="146" width="240" height="30" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" rx="4"/>
  <text x="200" y="166" text-anchor="middle" font-size="12" fill="#1a202c">rows 1-5</text>

  <rect x="55" y="188" width="290" height="40" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="200" y="213" text-anchor="middle" font-size="13" fill="#1a202c">GET /posts?_page=2&amp;_limit=5</text>
  <rect x="80" y="234" width="240" height="30" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" rx="4"/>
  <text x="200" y="254" text-anchor="middle" font-size="12" fill="#1a202c">rows 6-10 (skip first 5)</text>

  <text x="200" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">"Skip N, then give me L rows."</text>
  <rect x="55" y="306" width="290" height="146" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5" rx="6"/>
  <text x="70" y="328" font-size="12" font-weight="bold" fill="#b91c1c">Simple, lets you jump to any page.</text>
  <text x="70" y="352" font-size="12" fill="#1a202c">But if a new row is inserted at the top</text>
  <text x="70" y="370" font-size="12" fill="#1a202c">between requests, everything shifts down:</text>
  <text x="70" y="392" font-size="12" fill="#b91c1c">page 2 repeats a row you already saw,</text>
  <text x="70" y="410" font-size="12" fill="#b91c1c">or skips one entirely.</text>
  <text x="70" y="434" font-size="12" fill="#1a202c">Deep pages get slow: the database still</text>
  <text x="70" y="450" font-size="12" fill="#1a202c">counts past every skipped row.</text>

  <!-- Cursor column -->
  <rect x="390" y="56" width="340" height="410" fill="#ecfdf5" stroke="#15803d" stroke-width="2" rx="10"/>
  <text x="560" y="84" text-anchor="middle" font-size="17" font-weight="bold" fill="#15803d">Cursor-based (keyset)</text>

  <rect x="415" y="100" width="290" height="40" fill="#dcfce7" stroke="#15803d" stroke-width="2" rx="6"/>
  <text x="560" y="125" text-anchor="middle" font-size="13" fill="#1a202c">GET /posts?limit=5</text>
  <rect x="440" y="146" width="240" height="30" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" rx="4"/>
  <text x="560" y="166" text-anchor="middle" font-size="12" fill="#1a202c">rows + next_cursor="id_105"</text>

  <rect x="415" y="188" width="290" height="40" fill="#dcfce7" stroke="#15803d" stroke-width="2" rx="6"/>
  <text x="560" y="213" text-anchor="middle" font-size="13" fill="#1a202c">GET /posts?limit=5&amp;after=id_105</text>
  <rect x="440" y="234" width="240" height="30" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" rx="4"/>
  <text x="560" y="254" text-anchor="middle" font-size="12" fill="#1a202c">rows after id_105</text>

  <text x="560" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">"Give me L rows after this marker."</text>
  <rect x="415" y="306" width="290" height="146" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5" rx="6"/>
  <text x="430" y="328" font-size="12" font-weight="bold" fill="#15803d">The cursor names the last row seen,</text>
  <text x="430" y="346" font-size="12" fill="#1a202c">so new inserts at the top do not shift</text>
  <text x="430" y="364" font-size="12" fill="#1a202c">your position: no repeats, no skips.</text>
  <text x="430" y="388" font-size="12" fill="#1a202c">Stays fast even on deep pages —</text>
  <text x="430" y="406" font-size="12" fill="#1a202c">it seeks straight to the marker.</text>
  <text x="430" y="430" font-size="12" fill="#b45309">Trade-off: you can only go next/prev,</text>
  <text x="430" y="448" font-size="12" fill="#b45309">not jump to an arbitrary page number.</text>
</svg>
