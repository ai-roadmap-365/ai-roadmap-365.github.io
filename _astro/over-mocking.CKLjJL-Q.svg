<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things mocking is not</title>
  <style>
    .over-mocking-bg   { fill: #f8fafc; }
    .over-mocking-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .over-mocking-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .over-mocking-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .over-mocking-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .over-mocking-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .over-mocking-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .over-mocking-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .over-mocking-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .over-mocking-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .over-mocking-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .over-mocking-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .over-mocking-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .over-mocking-row { opacity: 1; }
    .over-mocking-r0 { animation-delay: 0.00s; }
    .over-mocking-r1 { animation-delay: 0.45s; }
    .over-mocking-r2 { animation-delay: 0.90s; }
    .over-mocking-r3 { animation-delay: 1.35s; }
    .over-mocking-r4 { animation-delay: 1.80s; }
    .over-mocking-row { animation: over-mocking-reveal 7.3s ease-in-out infinite; }
    @keyframes over-mocking-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="over-mocking-bg" width="980" height="390"/>
  <text class="over-mocking-h1"  x="30" y="40">Four things mocking is not</text>
  <text class="over-mocking-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="over-mocking-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="over-mocking-name" x="46" y="122">The misconception</text>
  <text class="over-mocking-desc" x="46" y="142">Commonly held.</text>
  <text class="over-mocking-desc over-mocking-row over-mocking-r0" x="46" y="182">More mocking means better isolation</text>
  <text class="over-mocking-desc over-mocking-row over-mocking-r1" x="46" y="216">A mock verifies the integration</text>
  <text class="over-mocking-desc over-mocking-row over-mocking-r2" x="46" y="250">Patching the source module works</text>
  <text class="over-mocking-desc over-mocking-row over-mocking-r3" x="46" y="284">Mocks are free</text>
  <text class="over-mocking-desc over-mocking-row over-mocking-r4" x="46" y="318">Every dependency should be mocked</text>
  <rect class="over-mocking-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="over-mocking-name" x="526" y="122">What is true</text>
  <text class="over-mocking-desc" x="526" y="142">Actually.</text>
  <text class="over-mocking-desc over-mocking-row over-mocking-r0" x="526" y="182">Over-mocking tests the mocks</text>
  <text class="over-mocking-desc over-mocking-row over-mocking-r1" x="526" y="216">It verifies your assumptions about it</text>
  <text class="over-mocking-desc over-mocking-row over-mocking-r2" x="526" y="250">Patch where the name is used</text>
  <text class="over-mocking-desc over-mocking-row over-mocking-r3" x="526" y="284">They couple tests to call structure</text>
  <text class="over-mocking-desc over-mocking-row over-mocking-r4" x="526" y="318">Only the ones outside your control</text>
  <text class="over-mocking-sub" x="30" y="372">A mock verifying your assumptions rather than reality is the deepest limitation: if the real service changes, every mock-based test still passes.</text>
</svg>
