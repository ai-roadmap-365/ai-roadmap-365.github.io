<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Stationarity</title>
  <style>
    .stationarity-bg   { fill: #f8fafc; }
    .stationarity-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stationarity-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stationarity-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stationarity-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stationarity-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stationarity-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stationarity-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stationarity-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stationarity-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stationarity-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stationarity-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stationarity-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .stationarity-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .stationarity-stage { opacity: 1; }

    .stationarity-s0 { animation-delay: 0.00s; }
    .stationarity-e0 { animation-delay: 0.00s; }
    .stationarity-s1 { animation-delay: 1.28s; }
    .stationarity-e1 { animation-delay: 1.28s; }
    .stationarity-s2 { animation-delay: 2.56s; }
    .stationarity-e2 { animation-delay: 2.56s; }
    .stationarity-s3 { animation-delay: 3.84s; }
    .stationarity-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .stationarity-conn  { animation: stationarity-trace 6.4s ease-in-out infinite; }
      .stationarity-stage { animation: stationarity-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes stationarity-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes stationarity-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .stationarity-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .stationarity-stage { animation: stationarity-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes stationarity-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="stationarity-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="stationarity-bg" width="980" height="322"/>
  <text class="stationarity-h1"  x="30" y="40">Stationarity</text>
  <text class="stationarity-sub" x="30" y="64">Four steps.</text>
  <g class="stationarity-stage stationarity-s0">
    <rect class="stationarity-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="stationarity-step" x="44" y="142">01</text>
    <text class="stationarity-name" x="70" y="142">A stationary series has constant mean and variance</text>
    <text class="stationarity-desc" x="44" y="166">Its statistical properties do</text>
    <text class="stationarity-desc" x="44" y="182">not depend on when you look.</text>
  </g>
  <line class="stationarity-line stationarity-conn stationarity-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#stationarity-tip)"/>
  <g class="stationarity-stage stationarity-s1">
    <rect class="stationarity-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="stationarity-step" x="280" y="142">02</text>
    <text class="stationarity-name" x="306" y="142">Classical methods assume it</text>
    <text class="stationarity-desc" x="280" y="166">And produce nonsense without it.</text>
  </g>
  <line class="stationarity-line stationarity-conn stationarity-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#stationarity-tip)"/>
  <g class="stationarity-stage stationarity-s2">
    <rect class="stationarity-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="stationarity-step" x="516" y="142">03</text>
    <text class="stationarity-name" x="542" y="142">Differencing removes a trend</text>
    <text class="stationarity-desc" x="516" y="166">Model the change rather than the</text>
    <text class="stationarity-desc" x="516" y="182">level.</text>
  </g>
  <line class="stationarity-line stationarity-conn stationarity-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#stationarity-tip)"/>
  <g class="stationarity-stage stationarity-s3">
    <rect class="stationarity-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="stationarity-step" x="752" y="142">04</text>
    <text class="stationarity-name" x="778" y="142">But differencing too much adds noise</text>
    <text class="stationarity-desc" x="752" y="166">And destroys the signal you</text>
    <text class="stationarity-desc" x="752" y="182">wanted.</text>
  </g>
  <text class="stationarity-sub" x="30" y="304">Over-differencing is easy to do and hard to notice, which is why the test statistics exist rather than differencing until the plot looks flat.</text>
</svg>
