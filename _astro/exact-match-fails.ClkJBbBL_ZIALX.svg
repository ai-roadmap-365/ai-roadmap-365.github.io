<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Correct answers scoring zero.">
  <title>Where exact match breaks</title>
  <style>
    .exact-match-fails-bg   { fill: #f8fafc; }
    .exact-match-fails-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exact-match-fails-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exact-match-fails-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exact-match-fails-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exact-match-fails-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exact-match-fails-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exact-match-fails-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .exact-match-fails-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .exact-match-fails-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .exact-match-fails-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .exact-match-fails-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .exact-match-fails-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exact-match-fails-row { opacity: 1; }
    .exact-match-fails-r0 { animation-delay: 0.00s; }
    .exact-match-fails-r1 { animation-delay: 0.45s; }
    .exact-match-fails-r2 { animation-delay: 0.90s; }
    .exact-match-fails-r3 { animation-delay: 1.35s; }
    .exact-match-fails-r4 { animation-delay: 1.80s; }
    .exact-match-fails-row { animation: exact-match-fails-reveal 7.3s ease-in-out infinite; }
    @keyframes exact-match-fails-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="exact-match-fails-bg" width="980" height="390"/>
  <text class="exact-match-fails-h1"  x="30" y="40">Where exact match breaks</text>
  <text class="exact-match-fails-sub" x="30" y="64">Correct answers scoring zero.</text>
  <rect class="exact-match-fails-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="exact-match-fails-name" x="46" y="122">Exact match</text>
  <text class="exact-match-fails-desc" x="46" y="142">0.0, and wrong.</text>
  <text class="exact-match-fails-desc exact-match-fails-row exact-match-fails-r0" x="46" y="182">Reference: "The invoice was paid on Monday"</text>
  <text class="exact-match-fails-desc exact-match-fails-row exact-match-fails-r1" x="46" y="216">Candidate: "The client settled the bill on Monday"</text>
  <text class="exact-match-fails-desc exact-match-fails-row exact-match-fails-r2" x="46" y="250">Zero overlap on the key tokens</text>
  <text class="exact-match-fails-desc exact-match-fails-row exact-match-fails-r3" x="46" y="284">Score: 0.0</text>
  <text class="exact-match-fails-desc exact-match-fails-row exact-match-fails-r4" x="46" y="318">The answer was entirely correct</text>
  <rect class="exact-match-fails-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="exact-match-fails-name" x="526" y="122">A judge</text>
  <text class="exact-match-fails-desc" x="526" y="142">Reads for meaning.</text>
  <text class="exact-match-fails-desc exact-match-fails-row exact-match-fails-r0" x="526" y="182">Same facts, different words</text>
  <text class="exact-match-fails-desc exact-match-fails-row exact-match-fails-r1" x="526" y="216">Scored against a rubric</text>
  <text class="exact-match-fails-desc exact-match-fails-row exact-match-fails-r2" x="526" y="250">With a written rationale</text>
  <text class="exact-match-fails-desc exact-match-fails-row exact-match-fails-r3" x="526" y="284">Score: 5/5</text>
  <text class="exact-match-fails-desc exact-match-fails-row exact-match-fails-r4" x="526" y="318">And an explanation of why</text>
  <text class="exact-match-fails-sub" x="30" y="372">Deterministic metrics remain right for identifiers, amounts and schemas; the failure here is applying them to the parts of a response where the wording was always free.</text>
</svg>
