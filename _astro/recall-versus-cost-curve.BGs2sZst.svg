<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Recall versus Cost Curve showing measured recall at 10 against comparisons for nprobe 1 to 8, with the knee where additional probing stops buying recall">
  <title>Recall versus Cost Curve</title>
  <defs>
    <style>
      .d326b-bg { fill: #f8fafc; }
      .d326b-axis { stroke: #94a3b8; stroke-width: 2px; }
      .d326b-grid { stroke: #e2e8f0; stroke-width: 1px; }
      .d326b-line { stroke: #3b82f6; stroke-width: 3px; fill: none; }
      .d326b-pt { fill: #1d4ed8; }
      .d326b-knee { fill: none; stroke: #f59e0b; stroke-width: 3px; }
      .d326b-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d326b-sub { font-family: system-ui, sans-serif; font-size: 13px; fill: #475569; }
      .d326b-t { font-family: system-ui, sans-serif; font-size: 11px; fill: #334155; }
      .d326b-lbl { font-family: system-ui, sans-serif; font-size: 11px; fill: #475569; }
      .d326b-warn { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #b91c1c; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d326b-bg"/>
  <text x="40" y="40" class="d326b-title">Recall versus Cost Curve</text>
  <text x="40" y="64" class="d326b-sub">Measured: 2,000 vectors, 32 dimensions, 8 lists, 20 queries, k=10. Every point is reproducible from a seeded generator.</text>

  <line x1="110" y1="100" x2="110" y2="310" class="d326b-axis"/>
  <line x1="110" y1="310" x2="800" y2="310" class="d326b-axis"/>
  <line x1="110" y1="140" x2="800" y2="140" class="d326b-grid"/>
  <line x1="110" y1="200" x2="800" y2="200" class="d326b-grid"/>
  <line x1="110" y1="260" x2="800" y2="260" class="d326b-grid"/>

  <text x="98" y="106" class="d326b-lbl" text-anchor="end">1.00</text>
  <text x="98" y="144" class="d326b-lbl" text-anchor="end">0.95</text>
  <text x="98" y="204" class="d326b-lbl" text-anchor="end">0.88</text>
  <text x="98" y="264" class="d326b-lbl" text-anchor="end">0.81</text>
  <text x="60" y="200" class="d326b-lbl" text-anchor="middle">recall@10</text>
  <text x="455" y="338" class="d326b-lbl" text-anchor="middle">comparisons (exact search = 40,000)</text>

  <polyline points="216,262 320,204 396,180 470,132 525,132 596,132 720,124 800,102" class="d326b-line"/>
  <circle cx="216" cy="262" r="5" class="d326b-pt"/>
  <circle cx="320" cy="204" r="5" class="d326b-pt"/>
  <circle cx="396" cy="180" r="5" class="d326b-pt"/>
  <circle cx="470" cy="132" r="5" class="d326b-pt"/>
  <circle cx="525" cy="132" r="5" class="d326b-pt"/>
  <circle cx="596" cy="132" r="5" class="d326b-pt"/>
  <circle cx="720" cy="124" r="5" class="d326b-pt"/>
  <circle cx="800" cy="102" r="5" class="d326b-pt"/>

  <text x="216" y="282" class="d326b-t" text-anchor="middle">nprobe=1</text>
  <text x="216" y="296" class="d326b-t" text-anchor="middle">6,192</text>
  <text x="470" y="118" class="d326b-t" text-anchor="middle">nprobe=4</text>
  <text x="800" y="88" class="d326b-t" text-anchor="middle">nprobe=8</text>

  <circle cx="440" cy="156" r="34" class="d326b-knee"/>
  <text x="440" y="216" class="d326b-t" text-anchor="middle">the knee</text>

  <text x="40" y="378" class="d326b-t">Reading the curve: the first probe buys 81% recall for 15% of the work. Reaching 97% costs three times more than that.</text>
  <text x="40" y="398" class="d326b-t">The last three points buy almost nothing — the curve has already flattened, which is exactly where a sensible default sits.</text>
  <text x="40" y="422" class="d326b-warn">nprobe=8 costs 40,160 comparisons against exact search's 40,000. Tuned for perfect recall, the index is worse than none.</text>
</svg>
