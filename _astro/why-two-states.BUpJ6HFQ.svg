<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Binary is not elegant. It is reliable, which matters more.">
  <title>Why two states and not ten</title>
  <style>
    .why-two-states-bg   { fill: #f8fafc; }
    .why-two-states-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-two-states-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-two-states-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-two-states-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-two-states-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-two-states-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .why-two-states-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .why-two-states-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .why-two-states-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .why-two-states-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .why-two-states-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .why-two-states-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .why-two-states-row { opacity: 1; }
    .why-two-states-r0 { animation-delay: 0.00s; }
    .why-two-states-r1 { animation-delay: 0.45s; }
    .why-two-states-r2 { animation-delay: 0.90s; }
    .why-two-states-r3 { animation-delay: 1.35s; }
    .why-two-states-r4 { animation-delay: 1.80s; }
    .why-two-states-row { animation: why-two-states-reveal 7.3s ease-in-out infinite; }
    @keyframes why-two-states-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="why-two-states-bg" width="980" height="390"/>
  <text class="why-two-states-h1"  x="30" y="40">Why two states and not ten</text>
  <text class="why-two-states-sub" x="30" y="64">Binary is not elegant. It is reliable, which matters more.</text>
  <rect class="why-two-states-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="why-two-states-name" x="46" y="122">Two states</text>
  <text class="why-two-states-desc" x="46" y="142">On or off</text>
  <text class="why-two-states-desc why-two-states-row why-two-states-r0" x="46" y="182">A wide voltage margin between them</text>
  <text class="why-two-states-desc why-two-states-row why-two-states-r1" x="46" y="216">Noise has to be enormous to flip a bit</text>
  <text class="why-two-states-desc why-two-states-row why-two-states-r2" x="46" y="250">One extra wire doubles the range</text>
  <text class="why-two-states-desc why-two-states-row why-two-states-r3" x="46" y="284">Cheap to build, cheap to check</text>
  <text class="why-two-states-desc why-two-states-row why-two-states-r4" x="46" y="318">Each added bit doubles what you can say</text>
  <rect class="why-two-states-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="why-two-states-name" x="526" y="122">Ten states</text>
  <text class="why-two-states-desc" x="526" y="142">One per digit</text>
  <text class="why-two-states-desc why-two-states-row why-two-states-r0" x="526" y="182">Ten narrow voltage bands</text>
  <text class="why-two-states-desc why-two-states-row why-two-states-r1" x="526" y="216">Small noise crosses a boundary</text>
  <text class="why-two-states-desc why-two-states-row why-two-states-r2" x="526" y="250">Every read needs precise measurement</text>
  <text class="why-two-states-desc why-two-states-row why-two-states-r3" x="526" y="284">Expensive and fragile at scale</text>
  <text class="why-two-states-desc why-two-states-row why-two-states-r4" x="526" y="318">Tried, and abandoned, in early machines</text>
  <text class="why-two-states-sub" x="30" y="372">Binary won on reliability, not on mathematics. The maths works in any base.</text>
</svg>
